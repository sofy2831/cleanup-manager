<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-light:#F3ECFF;
      --violet-mid:#DCCBFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text-dark:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    *{ box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body{
      margin:0;
      background:linear-gradient(180deg,#F8F4FF 0%,#EDE6FF 80%);
      color:var(--text-dark);
    }
    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }
    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      text-decoration:none;
      font-weight:800;
      font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
      cursor:pointer;
    }
    .pill-link.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
    }

    .logo-title{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      margin-top:10px;
      margin-bottom:6px;
      text-align:center;
    }
    .logo-icon{
      width:38px;height:38px;border-radius:50%;
      background:#fff;
      border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main);
      font-size:20px;font-weight:900;
      position:relative;
      flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-4px;
      font-size:12px;
      color:var(--violet-main);
    }
    h1{margin:0;font-size:24px;font-weight:900;color:#111;}
    .subtitle{
      font-size:15px;
      color:#444;
      margin-top:4px;
      text-align:center;
    }
    .badge{
      margin-top:10px;
      padding:4px 10px;
      border-radius:999px;
      background:#fff;
      font-size:12px;
      color:#555;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center;
      font-weight:800;
    }

    .layout{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    @media(min-width:860px){
      .layout{ flex-direction:row; align-items:flex-start; }
    }

    .card{
      width:100%;
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius:18px;
      box-shadow: var(--shadow);
      padding:16px 14px 18px;
      backdrop-filter: blur(10px);
    }
    .left{ flex:1.1; }
    .right{ flex:1; }

    .card-title{
      font-size:16px;
      font-weight:900;
      margin-bottom:8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .small{
      font-size:12px;
      color:var(--muted);
      line-height:1.35;
      font-weight:700;
    }

    .kv{
      margin-top:10px;
      display:grid;
      grid-template-columns: 1fr;
      gap:8px;
      font-size:13px;
      color:#333;
    }
    .kv b{ font-weight:900; }

    .linesBox{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .line{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px;
    }
    .line .t{ font-weight:900; font-size:13px; color:#222; }
    .line .s{ margin-top:2px; font-size:12px; font-weight:800; color:#666; }
    .divider{
      height:1px;
      width:100%;
      background: rgba(122,92,255,0.18);
      margin:10px 0;
    }

    label{
      display:block;
      font-size:12px;
      font-weight:900;
      color:#333;
      margin:10px 0 4px;
      text-align:left;
    }
    input, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      font-size:14px;
      outline:none;
      background:#fff;
    }
    input:focus, textarea:focus{
      border-color:var(--violet-main);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }
    .row > div{
      flex:1;
      min-width:220px;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    .btn{
      flex:1;
      border:none;
      border-radius:999px;
      padding:10px 12px;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
    }
    .btn.danger{
      border-color:#ffd2d2;
      background:#FFE3EC;
      color:var(--bad);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .alert{
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#333;
      display:none;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .totalBox{
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      font-weight:900;
    }

    .bottom-nav{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      justify-content: space-around;
      gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1;
      text-align:center;
      font-size:11px;
      font-weight:900;
      text-decoration:none;
      color:#666;
      padding:10px 8px;
      border-radius:999px;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,#7A5CFF,#6238FF);
      color:#fff;
    }

    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        max-width: 980px;
        margin: 12px auto 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow: 0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" href="devis-liste.html">← Retour liste devis</a>
      <button class="pill-link" type="button" id="logoutBtn">Déconnexion</button>
    </div>

    <div class="logo-title">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>

    <div class="subtitle">Devis</div>
    <div class="badge" id="statusBadge">—</div>

    <div class="layout">
      <div class="card left">
        <div class="card-title">
          <span>Récapitulatif</span>
          <span class="small" id="eventIdLine">—</span>
        </div>

        <div class="alert" id="alertBox"></div>

        <div class="kv" id="recapKv"></div>

        <div class="divider"></div>
        <div class="card-title" style="font-size:14px; margin-bottom:6px;">
          <span>Lignes</span>
          <span class="small">auto (event.lines)</span>
        </div>
        <div class="linesBox" id="linesBox"></div>

        <div class="totalBox">
          <span>Total</span>
          <span id="totalLabel">—</span>
        </div>

        <div class="actions">
          <button class="btn" type="button" id="backBtn">Retour</button>
          <button class="btn danger" type="button" id="openEventBtn" disabled>Debug</button>
        </div>
      </div>

      <div class="card right">
        <div class="card-title">
          <span>Contenu du devis</span>
          <span class="small">V1</span>
        </div>

        <form id="quoteForm">
          <div class="row">
            <div>
              <label for="amount">Montant (€) (optionnel)</label>
              <input id="amount" type="number" step="0.01" min="0" placeholder="Auto = total des lignes">
              <div class="small" style="margin-top:6px;">
                Laisse vide pour utiliser le total calculé depuis les lignes.
              </div>
            </div>
            <div>
              <label for="currency">Devise</label>
              <input id="currency" type="text" value="EUR" readonly>
            </div>
          </div>

          <label for="notes">Notes (optionnel)</label>
          <textarea id="notes" rows="4" placeholder="Ex : inclus produits, durée estimée, etc."></textarea>

          <label for="terms">Conditions (optionnel)</label>
          <textarea id="terms" rows="4" placeholder="Ex : payable à réception, validité 7 jours, etc."></textarea>

          <div class="actions">
            <button class="btn primary" type="submit" id="saveBtn">Enregistrer</button>
            <button class="btn" type="button" id="markSentBtn" disabled>Marquer “devis envoyé”</button>
            <button class="btn" type="button" id="markAcceptedBtn" disabled>Marquer “accepté”</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="logements.html">Logements</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc, updateDoc, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // UI
    const logoutBtn = document.getElementById("logoutBtn");
    const alertBox = document.getElementById("alertBox");
    const recapKv = document.getElementById("recapKv");
    const statusBadge = document.getElementById("statusBadge");
    const eventIdLine = document.getElementById("eventIdLine");

    const backBtn = document.getElementById("backBtn");
    const openEventBtn = document.getElementById("openEventBtn");

    const linesBox = document.getElementById("linesBox");
    const totalLabel = document.getElementById("totalLabel");

    const form = document.getElementById("quoteForm");
    const amountEl = document.getElementById("amount");
    const notesEl = document.getElementById("notes");
    const termsEl = document.getElementById("terms");
    const saveBtn = document.getElementById("saveBtn");
    const markSentBtn = document.getElementById("markSentBtn");
    const markAcceptedBtn = document.getElementById("markAcceptedBtn");

    function pad6(n){ return String(n).padStart(6, "0"); }
    function currentYear(){ return new Date().getFullYear(); }

    async function nextChronoNumber({ conciergerieUid, type }) {
      const year = currentYear();
      const counterId = `${conciergerieUid}_${year}`;
      const counterRef = doc(db, "counters", counterId);

      const prefix = (type === "QUOTE") ? "D" : (type === "INVOICE") ? "F" : "A";
      const field  = (type === "QUOTE") ? "quoteSeq" : (type === "INVOICE") ? "invoiceSeq" : "creditSeq";

      const seq = await runTransaction(db, async (tx) => {
        const snap = await tx.get(counterRef);
        const data = snap.exists() ? (snap.data() || {}) : {};
        const next = Number(data[field] || 0) + 1;

        if(!snap.exists()){
          tx.set(counterRef, { quoteSeq: 0, invoiceSeq: 0, creditSeq: 0, updatedAt: serverTimestamp() });
        }
        tx.update(counterRef, { [field]: next, updatedAt: serverTimestamp() });

        return next;
      });

      return `${prefix}-${year}-${pad6(seq)}`;
    }

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    const eventId = getParam("eventId");
    eventIdLine.textContent = eventId ? ("eventId: " + eventId) : "eventId manquant";

    let currentUser = null;
    let eventRef = null;
    let eventData = null;

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      location.href = "index.html";
    });

    backBtn.addEventListener("click", ()=>{
      location.href = "devis-liste.html";
    });

    openEventBtn.addEventListener("click", ()=>{
      if(!eventId) return;
      showAlert("ℹ️ Debug : eventId = " + eventId, true);
    });

    function escapeHtml(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }

    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }

    function opStatusLabel(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return "—";
      return x.replaceAll("_"," ");
    }

    function quoteStatusLabel(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return "—";
      if(x === "DRAFT") return "BROUILLON";
      if(x === "SENT") return "DEVIS ENVOYÉ";
      if(x === "ACCEPTED") return "ACCEPTÉ";
      if(x === "REFUSED") return "REFUSÉ";
      return x;
    }

    function renderLines(){
      const d = eventData || {};
      const lines = Array.isArray(d.lines) ? d.lines : [];
      linesBox.innerHTML = "";
      if(!lines.length){
        linesBox.innerHTML = `<div class="small">Aucune ligne.</div>`;
        return;
      }
      for(const l of lines){
        const qty = Number(l.qty||0);
        const up = Number(l.unitPrice||0);
        const unit = l.unit || "unité";
        const lineTotal = qty * up;
        const t = l.label || "Ligne";
        const s = `${qty} ${unit} • ${fmtMoney(up)} / ${unit} • total ${fmtMoney(lineTotal)}`;
        const div = document.createElement("div");
        div.className = "line";
        div.innerHTML = `
          <div class="t">${escapeHtml(t)}</div>
          <div class="s">${escapeHtml(s)}</div>
          ${l.note ? `<div class="s" style="margin-top:6px; white-space:pre-wrap;">${escapeHtml(l.note)}</div>` : ""}
        `;
        linesBox.appendChild(div);
      }
    }

    function renderRecap(){
      const d = eventData || {};

      const computedTotal = computeTotalFromLines(d.lines);
      const total = (d.total != null) ? Number(d.total) : computedTotal;
      totalLabel.textContent = fmtMoney(total);

      const rows = [];
      rows.push(`<div><b>Logement</b> : ${escapeHtml((d.homeName||"") + (d.homeCity ? (" — " + d.homeCity) : "")) || "—"}</div>`);
      rows.push(`<div><b>Date</b> : ${escapeHtml(d.dateKey || d.date || "—")} • <b>Heure</b> : ${escapeHtml(d.time || "—")}</div>`);
      rows.push(`<div><b>Propriétaire</b> : ${escapeHtml((d.ownerName||"—") + " • " + (d.ownerEmail||"—"))}</div>`);
      if(d.assignedToName || d.assignedToEmail){
        rows.push(`<div><b>Agent</b> : ${escapeHtml(d.assignedToName||"—")} • ${escapeHtml(d.assignedToEmail||"—")}</div>`);
      }
      if(d.summary) rows.push(`<div><b>Réservation</b> : ${escapeHtml(d.summary)}</div>`);
      if(d.meta) rows.push(`<div><b>Note</b> : ${escapeHtml(d.meta)}</div>`);
      if(d.quoteNumber) rows.push(`<div><b>N° devis</b> : ${escapeHtml(d.quoteNumber)}</div>`);
      recapKv.innerHTML = rows.join("");

      const op = opStatusLabel(d.status);
      const qs = quoteStatusLabel(d.quoteStatus);
      statusBadge.textContent = `Op: ${op} • Devis: ${qs}`;

      if(amountEl.value === ""){
        if(d.quoteAmount != null && d.quoteAmount !== ""){
          amountEl.value = d.quoteAmount;
        }else{
          amountEl.value = "";
        }
      }
      if(d.quoteNotes && notesEl.value === "") notesEl.value = d.quoteNotes;
      if(d.quoteTerms && termsEl.value === "") termsEl.value = d.quoteTerms;

      openEventBtn.disabled = !eventRef;
      saveBtn.disabled = !eventRef;

      const qStatus = String(d.quoteStatus || "").toUpperCase();
      markSentBtn.disabled = !(eventRef && (qStatus === "DRAFT"));
      markAcceptedBtn.disabled = !(eventRef && (qStatus === "SENT"));

      renderLines();
    }

    async function loadEvent(){
      if(!eventId) throw new Error("eventId manquant dans l’URL. Exemple : devis.html?eventId=XXXX");
      eventRef = doc(db, "events", eventId);
      const snap = await getDoc(eventRef);
      if(!snap.exists()) throw new Error("Event introuvable.");
      eventData = { id: snap.id, ...snap.data() };

      if(eventData.conciergerieUid && currentUser?.uid && eventData.conciergerieUid !== currentUser.uid){
        throw new Error("Accès refusé (event d’une autre conciergerie).");
      }
      renderRecap();
    }

    function lockUI(locked){
      saveBtn.disabled = !!locked || !eventRef;
      const qs = String(eventData?.quoteStatus || "").toUpperCase();
      markSentBtn.disabled = !!locked || !eventRef || qs !== "DRAFT";
      markAcceptedBtn.disabled = !!locked || !eventRef || qs !== "SENT";
      saveBtn.style.opacity = locked ? "0.75" : "1";
    }

    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      hideAlert();
      if(!eventRef) return showAlert("Event non chargé.");

      const amountRaw = (amountEl.value || "").trim();
      const quoteAmount = amountRaw === "" ? null : Number(amountRaw);
      if(quoteAmount != null && (!Number.isFinite(quoteAmount) || quoteAmount < 0)){
        return showAlert("Montant invalide.");
      }

      const quoteNotes = (notesEl.value || "").trim();
      const quoteTerms = (termsEl.value || "").trim();

      lockUI(true);
      try{
        const patch = {
          quoteAmount,
          quoteNotes,
          quoteTerms,
          quoteUpdatedAt: serverTimestamp(),
          commercialStatus: "DEVIS",
          quoteStatus: "DRAFT",
          commercialUpdatedAt: serverTimestamp()
        };

        const qs = String(eventData?.quoteStatus || "").toUpperCase();
        if(qs === "SENT" || qs === "ACCEPTED" || qs === "REFUSED"){
          patch.quoteStatus = qs;
        }

        await updateDoc(eventRef, patch);

        const snap = await getDoc(eventRef);
        eventData = { id: snap.id, ...snap.data() };

        showAlert("✅ Devis enregistré.", true);
        renderRecap();
      }catch(err){
        console.error(err);
        showAlert("Erreur sauvegarde : " + (err?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    });

    markSentBtn.addEventListener("click", async ()=>{
      hideAlert();
      if(!eventRef) return showAlert("Event non chargé.");

      const qs = String(eventData?.quoteStatus || "").toUpperCase();
      if(qs !== "DRAFT"){
        return showAlert("⛔ Action impossible : le devis n'est pas en brouillon.");
      }

      lockUI(true);
      try{
        let quoteNumber = (eventData?.quoteNumber || "").trim();
        if(!quoteNumber){
          quoteNumber = await nextChronoNumber({ conciergerieUid: currentUser.uid, type: "QUOTE" });
        }

        await updateDoc(eventRef, {
          quoteNumber,
          commercialStatus: "DEVIS_ENVOYE",
          quoteStatus: "SENT",
          quoteSentAt: serverTimestamp(),
          commercialUpdatedAt: serverTimestamp()
        });

        const snap = await getDoc(eventRef);
        eventData = { id: snap.id, ...snap.data() };

        showAlert("✅ Devis envoyé (numéro attribué).", true);
        renderRecap();
      }catch(err){
        console.error(err);
        showAlert("Erreur statut devis : " + (err?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    });

    markAcceptedBtn.addEventListener("click", async ()=>{
      hideAlert();
      if(!eventRef) return showAlert("Event non chargé.");

      const qs = String(eventData?.quoteStatus || "").toUpperCase();
      if(qs !== "SENT"){
        return showAlert("⛔ Action impossible : le devis doit être “envoyé”.");
      }

      const ok = confirm("Marquer ce devis comme ACCEPTÉ ?");
      if(!ok) return;

      lockUI(true);
      try{
        await updateDoc(eventRef, {
          commercialStatus: "DEVIS_ACCEPTE",
          quoteStatus: "ACCEPTED",
          quoteAcceptedAt: serverTimestamp(),
          commercialUpdatedAt: serverTimestamp()
        });

        const snap = await getDoc(eventRef);
        eventData = { id: snap.id, ...snap.data() };

        showAlert("✅ Devis marqué comme accepté.", true);
        renderRecap();
      }catch(err){
        console.error(err);
        showAlert("Erreur statut : " + (err?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = user;

      try{
        await loadEvent();
      }catch(e){
        showAlert("⛔ " + (e.message || "Erreur chargement devis"), false);
      }
    });
  </script>
</body>
</html>
