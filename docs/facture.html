<!-- docs/facture.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Facture</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text-dark:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text-dark); }
    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }
    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill-link{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main); color:var(--violet-main);
      text-decoration:none; font-weight:900; font-size:13px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; cursor:pointer;
    }

    .logo-title{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:10px; margin-bottom:6px; text-align:center;
    }
    .logo-icon{
      width:40px;height:40px;border-radius:50%;
      background:#fff; border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0; overflow:hidden;
    }
    .logo-icon img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:24px; font-weight:900; color:#111; }
    .subtitle{ font-size:15px; color:#444; margin-top:4px; text-align:center; }

    .badge{
      margin-top:10px;
      padding:4px 10px;
      border-radius:999px;
      background:#fff;
      font-size:12px;
      color:#555;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center;
      font-weight:900;
      white-space:pre-wrap;
    }

    .layout{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    @media(min-width:860px){ .layout{ flex-direction:row; align-items:flex-start; } }

    .card{
      width:100%;
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius:18px;
      box-shadow: var(--shadow);
      padding:16px 14px 18px;
      backdrop-filter: blur(10px);
    }
    .left{ flex:1.15; }
    .right{ flex:0.95; }

    .card-title{
      font-size:16px;
      font-weight:1000;
      margin-bottom:8px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
    }
    .small{ font-size:12px; color:var(--muted); line-height:1.35; font-weight:800; }

    .alert{
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#333;
      display:none;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .kv{
      margin-top:10px;
      display:grid;
      grid-template-columns: 1fr;
      gap:8px;
      font-size:13px;
      color:#333;
      font-weight:800;
    }
    .kv b{ font-weight:1000; }

    .divider{ height:1px; width:100%; background: rgba(122,92,255,0.18); margin:12px 0; }

    .tableWrap{
      overflow:auto;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.04);
      background:#fff;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    table{ width:100%; border-collapse:collapse; min-width:720px; }
    th, td{
      padding:10px 10px;
      border-bottom:1px solid rgba(0,0,0,0.05);
      text-align:left;
      font-size:12.5px;
    }
    th{
      font-size:12px;
      color:#444;
      font-weight:1000;
      background:rgba(248,244,255,.7);
      position:sticky;
      top:0;
    }
    td.num, th.num{ text-align:right; white-space:nowrap; }

    .totals{
      margin-top:10px;
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px;
      display:flex;
      flex-direction:column;
      gap:6px;
      font-weight:1000;
    }
    .totals .r{ display:flex; justify-content:space-between; gap:10px; }
    .mutedLine{ font-size:12px; color:#666; font-weight:900; }

    label{ display:block; font-size:12px; font-weight:1000; color:#333; margin:10px 0 4px; }
    textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      font-size:14px;
      outline:none;
      background:#fff;
      font-weight:800;
      color:#111;
    }
    textarea:focus{
      border-color:var(--violet-main);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .btn{
      flex:1;
      border:none;
      border-radius:999px;
      padding:10px 12px;
      font-size:13px;
      font-weight:1000;
      cursor:pointer;
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:11px; font-weight:1000; text-decoration:none;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static; max-width: 980px; margin: 12px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" href="factures-liste.html">← Retour factures</a>
      <button class="pill-link" type="button" id="logoutBtn">Déconnexion</button>
    </div>

    <div class="logo-title">
      <div class="logo-icon">
        <img id="logoImg" alt="Logo">
        <span id="logoFallback">✓</span>
      </div>
      <h1>CleanUp Manager</h1>
    </div>

    <div class="subtitle">Facture</div>
    <div class="badge" id="statusBadge">—</div>

    <div class="layout">
      <div class="card left">
        <div class="card-title">
          <span>Récapitulatif</span>
          <span class="small" id="eventIdLine">—</span>
        </div>

        <div class="alert" id="alertBox"></div>
        <div class="kv" id="recapKv"></div>

        <div class="divider"></div>

        <div class="card-title" style="font-size:14px; margin-bottom:6px;">
          <span>Lignes</span>
          <span class="small">auto (event.lines)</span>
        </div>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Désignation</th>
                <th class="num">Qté</th>
                <th>Unité</th>
                <th class="num">PU HT</th>
                <th class="num" id="thTVA" style="display:none;">TVA</th>
                <th class="num">Total</th>
              </tr>
            </thead>
            <tbody id="linesTbody"></tbody>
          </table>
        </div>

        <div class="totals" id="totalsBox"></div>
      </div>

      <div class="card right">
        <div class="card-title">
          <span>Gestion facture</span>
          <span class="small" id="invoiceNumberLine">—</span>
        </div>

        <label for="invoiceNotes">Notes internes</label>
        <textarea id="invoiceNotes" rows="4" placeholder="Ex : payé par virement, relance le 20…"></textarea>

        <div class="actions">
          <button class="btn primary" type="button" id="createInvoiceBtn" disabled>Créer / brouillon</button>
          <button class="btn" type="button" id="previewBtn" disabled>Preview / Imprimer</button>
          <button class="btn" type="button" id="markSentBtn" disabled>Marquer “envoyée”</button>
          <button class="btn" type="button" id="markPaidBtn" disabled>Marquer “payée”</button>
        </div>

        <div class="mutedLine" style="margin-top:8px;">
          Numéro facture : attribué automatiquement à la création (séquentiel par année).
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="logements.html">Logements</a>
  </nav>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { doc, getDoc, updateDoc, serverTimestamp, runTransaction } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const logoutBtn = document.getElementById("logoutBtn");
  const alertBox = document.getElementById("alertBox");
  const recapKv = document.getElementById("recapKv");
  const statusBadge = document.getElementById("statusBadge");
  const eventIdLine = document.getElementById("eventIdLine");

  const logoImg = document.getElementById("logoImg");
  const logoFallback = document.getElementById("logoFallback");

  const thTVA = document.getElementById("thTVA");
  const linesTbody = document.getElementById("linesTbody");
  const totalsBox = document.getElementById("totalsBox");

  const invoiceNotesEl = document.getElementById("invoiceNotes");
  const invoiceNumberLine = document.getElementById("invoiceNumberLine");

  const createInvoiceBtn = document.getElementById("createInvoiceBtn");
  const previewBtn = document.getElementById("previewBtn");
  const markSentBtn = document.getElementById("markSentBtn");
  const markPaidBtn = document.getElementById("markPaidBtn");

  let currentUser = null;
  let eventRef = null;
  let eventData = null;
  let profileData = null;
  let homeData = null;
  let ownerData = null;

  function showAlert(msg, ok=false){
    alertBox.style.display = "block";
    alertBox.classList.toggle("ok", !!ok);
    alertBox.textContent = msg;
  }
  function hideAlert(){
    alertBox.style.display = "none";
    alertBox.classList.remove("ok");
    alertBox.textContent = "";
  }
  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function fmtMoney(v){
    const n = Number(v);
    if(!Number.isFinite(n)) return "—";
    return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }
  function getParam(name){
    const p = new URLSearchParams(location.search);
    return (p.get(name) || "").trim();
  }

  const eventId = getParam("eventId");
  eventIdLine.textContent = eventId ? ("eventId: " + eventId) : "eventId manquant";

  logoutBtn.addEventListener("click", async ()=>{
    await signOut(auth);
    localStorage.removeItem("cm_auth");
    location.href = "index.html";
  });

  function computeTotals(lines, tvaEnabled, tvaRate){
    let ht = 0;
    for(const l of (Array.isArray(lines) ? lines : [])){
      const qty = Number(l?.qty)||0;
      const up  = Number(l?.unitPrice)||0;
      ht += qty * up;
    }
    const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
    const ttc = ht + tva;
    return { ht, tva, ttc };
  }

  function invoiceStatusLabel(s){
    const x = String(s||"").toUpperCase().trim();
    if(!x) return "—";
    if(x === "DRAFT") return "BROUILLON";
    if(x === "SENT") return "ENVOYÉE";
    if(x === "PAID") return "PAYÉE";
    return x;
  }

  function pad4(n){ return String(n).padStart(4,"0"); }
  function getYearForSequence(d){
    const s = String(d?.dateKey || d?.date || "").trim();
    const y = (s.length >= 4) ? s.slice(0,4) : "";
    return (/^[0-9]{4}$/.test(y)) ? y : String(new Date().getFullYear());
  }

  function canMarkSent(d){
    const inv = String(d?.invoiceStatus || "").toUpperCase();
    return inv === "DRAFT";
  }
  function canMarkPaid(d){
    const inv = String(d?.invoiceStatus || "").toUpperCase();
    return inv === "SENT";
  }

  async function loadProfile(uid){
    const snap = await getDoc(doc(db,"users", uid));
    profileData = snap.exists() ? (snap.data() || {}) : {};
  }
  async function loadHomeIfAny(homeId){
    homeData = null;
    if(!homeId) return;
    const snap = await getDoc(doc(db,"homes", homeId));
    if(snap.exists()) homeData = snap.data() || {};
  }
  async function loadOwner(ownerId){
    ownerData = null;
    if(!ownerId) return;
    const snap = await getDoc(doc(db,"owners", ownerId));
    if(snap.exists()) ownerData = snap.data() || {};
  }

  function applyLogoFromProfile(p){
    const url = (p?.logoUrl || "").trim();
    if(url){
      logoImg.src = url;
      logoImg.style.display = "block";
      logoFallback.style.display = "none";
    }else{
      logoImg.style.display = "none";
      logoFallback.style.display = "block";
    }
  }

  function renderLinesAndTotals(){
    const d = eventData || {};
    const p = profileData || {};

    const tvaEnabled = !!p.tvaEnabled;
    const tvaRate = Number.isFinite(Number(p.tvaRate)) ? Number(p.tvaRate) : 0;

    thTVA.style.display = tvaEnabled ? "" : "none";
    linesTbody.innerHTML = "";

    const lines = Array.isArray(d.lines) ? d.lines : [];
    for(const l of lines){
      const label = l?.label || "Ligne";
      const qty = Number(l?.qty)||0;
      const unit = l?.unit || "unité";
      const up = Number(l?.unitPrice)||0;

      const lineHT = qty * up;
      const lineTVA = tvaEnabled ? (lineHT * tvaRate) : 0;
      const lineTotal = lineHT + lineTVA;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${esc(label)}</td>
        <td class="num">${esc(qty)}</td>
        <td>${esc(unit)}</td>
        <td class="num">${esc(fmtMoney(up))}</td>
        <td class="num" style="${tvaEnabled ? "" : "display:none;"}">${tvaEnabled ? esc(fmtMoney(lineTVA)) : ""}</td>
        <td class="num">${esc(fmtMoney(lineTotal))}</td>
      `;
      linesTbody.appendChild(tr);
    }

    const totals = computeTotals(lines, tvaEnabled, tvaRate);

    const html = [];
    if(tvaEnabled){
      html.push(`<div class="r"><span>Total HT</span><span>${esc(fmtMoney(totals.ht))}</span></div>`);
      html.push(`<div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>${esc(fmtMoney(totals.tva))}</span></div>`);
      html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
    }else{
      html.push(`<div class="r"><span>Total</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
      const ex = (p?.tvaExemptionText || "").trim();
      if(ex) html.push(`<div class="mutedLine">${esc(ex)}</div>`);
    }
    totalsBox.innerHTML = html.join("");
  }

  function renderRecap(){
    const d = eventData || {};
    const p = profileData || {};
    const owner = ownerData || {};

    applyLogoFromProfile(p);

    const ownerLabel = owner.displayName || d.ownerName || "—";
    const ownerEmail = owner.email || d.ownerEmail || "—";
    const ownerPhone = owner.phone || d.ownerPhone || "";

    const addrParts = [
      owner.address || "",
      [owner.zip || "", owner.city || ""].filter(Boolean).join(" ")
    ].filter(Boolean).join(" • ");

    const rows = [];
    rows.push(`<div><b>Logement</b> : ${esc((d.homeName||"—") + (d.homeCity ? (" — " + d.homeCity) : ""))}</div>`);
    if(d.homeAddress) rows.push(`<div><b>Adresse logement</b> : ${esc(d.homeAddress)}</div>`);
    rows.push(`<div><b>Date mission</b> : ${esc(d.dateKey || d.date || "—")} • <b>Heure</b> : ${esc(d.time || "—")}</div>`);
    rows.push(`<div><b>Propriétaire</b> : ${esc(ownerLabel)} • ${esc(ownerEmail)}${ownerPhone ? " • " + esc(ownerPhone) : ""}</div>`);
    if(addrParts) rows.push(`<div><b>Adresse propriétaire</b> : ${esc(addrParts)}</div>`);
    recapKv.innerHTML = rows.join("");

    invoiceNumberLine.textContent = d.invoiceNumber ? `N° ${d.invoiceNumber}` : "N° —";
    statusBadge.textContent = `Facture: ${invoiceStatusLabel(d.invoiceStatus)}${d.invoiceNumber ? " • " + d.invoiceNumber : ""}`;

    if(invoiceNotesEl.value === "" && d.invoiceNotes) invoiceNotesEl.value = d.invoiceNotes;

    createInvoiceBtn.disabled = !eventRef;
    previewBtn.disabled = !(eventRef && !!d.invoiceNumber);
    markSentBtn.disabled = !(eventRef && canMarkSent(d));
    markPaidBtn.disabled = !(eventRef && canMarkPaid(d));

    renderLinesAndTotals();
  }

  async function loadEvent(){
    if(!eventId) throw new Error("eventId manquant dans l’URL. Exemple : facture.html?eventId=XXXX");
    eventRef = doc(db, "events", eventId);
    const snap = await getDoc(eventRef);
    if(!snap.exists()) throw new Error("Event introuvable.");
    eventData = { id: snap.id, ...(snap.data()||{}) };

    if(eventData.conciergerieUid && currentUser?.uid && eventData.conciergerieUid !== currentUser.uid){
      throw new Error("Accès refusé (event d’une autre conciergerie).");
    }

    await loadProfile(currentUser.uid);
    await loadHomeIfAny(eventData.homeId);

    const ownerId = (eventData.ownerId || homeData?.ownerId || "").toString().trim();
    await loadOwner(ownerId);

    renderRecap();
  }

  async function createInvoiceWithSequentialNumber(){
    const uid = currentUser.uid;

    await runTransaction(db, async (tx)=>{
      const evSnap = await tx.get(eventRef);
      if(!evSnap.exists()) throw new Error("Event introuvable (transaction).");
      const d = evSnap.data() || {};

      if(d.conciergerieUid && d.conciergerieUid !== uid){
        throw new Error("Accès refusé (event d’une autre conciergerie).");
      }

      const invStatus = String(d.invoiceStatus || "").toUpperCase().trim();
      if(invStatus === "PAID") throw new Error("Déjà payée.");

      const year = d.invoiceYear ? String(d.invoiceYear) : getYearForSequence(d);
      let invoiceNumber = d.invoiceNumber;

      const patch = {
        invoiceNotes: (invoiceNotesEl.value || "").trim(),
        invoiceStatus: "DRAFT",
        invoiceCreatedAt: serverTimestamp(),
        commercialStatus: "FACTURE",
        commercialUpdatedAt: serverTimestamp()
      };

      if(!invoiceNumber){
        const counterId = `${uid}_${year}`;
        const counterRef = doc(db, "counters", counterId);
        const cSnap = await tx.get(counterRef);

        const cur = cSnap.exists() ? Number(cSnap.data()?.invoiceSeq || 0) : 0;
        const next = cur + 1;

        tx.set(counterRef, { invoiceSeq: next }, { merge:true });

        invoiceNumber = `F-${year}-${pad4(next)}`;
        patch.invoiceNumber = invoiceNumber;
        patch.invoiceSeq = next;
        patch.invoiceYear = year;
      }

      tx.update(eventRef, patch);
    });

    const snap = await getDoc(eventRef);
    eventData = { id: snap.id, ...(snap.data()||{}) };
  }

  function buildPreviewHtml(){
    const d = eventData || {};
    const p = profileData || {};
    const owner = ownerData || {};

    const ownerLabel = owner.displayName || d.ownerName || "—";
    const ownerEmail = owner.email || d.ownerEmail || "—";
    const ownerPhone = owner.phone || d.ownerPhone || "";
    const ownerAddr1 = owner.address || "";
    const ownerAddr2 = [owner.zip || "", owner.city || ""].filter(Boolean).join(" ");

    const cName = (p.companyName || p.displayName || "Conciergerie");
    const cAddr1 = (p.address || "");
    const cAddr2 = [p.zip || "", p.city || ""].filter(Boolean).join(" ");
    const cEmail = (p.email || currentUser?.email || "");
    const cPhone = (p.phone || "");
    const cSiret = (p.siret || "");
    const cVat = (p.vatNumber || "");

    const tvaEnabled = !!p.tvaEnabled;
    const tvaRate = Number.isFinite(Number(p.tvaRate)) ? Number(p.tvaRate) : 0;

    const lines = Array.isArray(d.lines) ? d.lines : [];
    const totals = computeTotals(lines, tvaEnabled, tvaRate);

    const rowsLines = lines.map(l=>{
      const label = l?.label || "Ligne";
      const qty = Number(l?.qty)||0;
      const unit = l?.unit || "unité";
      const up = Number(l?.unitPrice)||0;
      const lineHT = qty*up;
      const lineTVA = tvaEnabled ? (lineHT*tvaRate) : 0;
      const lineTotal = lineHT + lineTVA;

      return `
        <tr>
          <td>${esc(label)}</td>
          <td class="num">${esc(qty)}</td>
          <td>${esc(unit)}</td>
          <td class="num">${esc(fmtMoney(up))}</td>
          ${tvaEnabled ? `<td class="num">${esc(fmtMoney(lineTVA))}</td>` : ``}
          <td class="num">${esc(fmtMoney(lineTotal))}</td>
        </tr>
      `;
    }).join("");

    return `
      <div class="head">
        <div class="h-left">
          <div class="logoBox">
            ${ (p.logoUrl||"").trim() ? `<img src="${esc(p.logoUrl)}" alt="Logo">` : `<div class="logoFallback">✓</div>` }
          </div>
          <div>
            <div class="docTitle">FACTURE</div>
            <div class="docNum">${esc(d.invoiceNumber || "—")}</div>
            <div class="docMeta">Réf interne: ${esc(d.id || eventId)}</div>
          </div>
        </div>
        <div class="h-right">
          <div class="metaLine"><b>Date</b> : ${esc(d.invoiceDate || d.dateKey || d.date || "—")}</div>
          <div class="metaLine"><b>Statut</b> : ${esc(invoiceStatusLabel(d.invoiceStatus))}</div>
        </div>
      </div>

      <div class="boxes">
        <div class="box">
          <div class="boxTitle">Émetteur (Conciergerie)</div>
          <div><b>${esc(cName)}</b></div>
          ${cAddr1 ? `<div>${esc(cAddr1)}</div>` : ``}
          ${cAddr2 ? `<div>${esc(cAddr2)}</div>` : ``}
          ${cEmail ? `<div>${esc(cEmail)}</div>` : ``}
          ${cPhone ? `<div>${esc(cPhone)}</div>` : ``}
          ${cSiret ? `<div>SIRET: ${esc(cSiret)}</div>` : ``}
          ${cVat ? `<div>TVA: ${esc(cVat)}</div>` : ``}
        </div>

        <div class="box">
          <div class="boxTitle">Client (Propriétaire)</div>
          <div><b>${esc(ownerLabel)}</b></div>
          ${ownerAddr1 ? `<div>${esc(ownerAddr1)}</div>` : ``}
          ${ownerAddr2 ? `<div>${esc(ownerAddr2)}</div>` : ``}
          ${ownerEmail ? `<div>${esc(ownerEmail)}</div>` : ``}
          ${ownerPhone ? `<div>${esc(ownerPhone)}</div>` : ``}
          ${owner.siret ? `<div>SIRET: ${esc(owner.siret)}</div>` : ``}
          ${owner.vatNumber ? `<div>TVA: ${esc(owner.vatNumber)}</div>` : ``}
        </div>
      </div>

      <div class="box" style="margin-top:12px;">
        <div class="boxTitle">Prestation</div>
        <div><b>Logement</b> : ${esc(d.homeName || "—")}${d.homeCity ? " — " + esc(d.homeCity) : ""}</div>
        ${d.homeAddress ? `<div><b>Adresse</b> : ${esc(d.homeAddress)}</div>` : ``}
        <div><b>Date mission</b> : ${esc(d.dateKey || d.date || "—")}${d.time ? " • " + esc(d.time) : ""}</div>
      </div>

      <table class="tbl">
        <thead>
          <tr>
            <th>Désignation</th>
            <th class="num">Qté</th>
            <th>Unité</th>
            <th class="num">PU HT</th>
            ${tvaEnabled ? `<th class="num">TVA</th>` : ``}
            <th class="num">Total</th>
          </tr>
        </thead>
        <tbody>
          ${rowsLines || `<tr><td colspan="${tvaEnabled?6:5}">Aucune ligne</td></tr>`}
        </tbody>
      </table>

      <div class="tot">
        ${
          tvaEnabled
            ? `
              <div class="r"><span>Total HT</span><span>${esc(fmtMoney(totals.ht))}</span></div>
              <div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>${esc(fmtMoney(totals.tva))}</span></div>
              <div class="r big"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>
            `
            : `
              <div class="r big"><span>Total</span><span>${esc(fmtMoney(totals.ttc))}</span></div>
              ${(p?.tvaExemptionText || "").trim() ? `<div class="smallNote">${esc(p.tvaExemptionText)}</div>` : ``}
            `
        }
      </div>

      ${(invoiceNotesEl.value || "").trim()
        ? `<div class="box" style="margin-top:12px;"><div class="boxTitle">Note interne</div><div style="white-space:pre-wrap;">${esc(invoiceNotesEl.value)}</div></div>`
        : ``}
    `;
  }

  function openPrintWindow(htmlInside){
    const w = window.open("", "_blank");
    if(!w) return alert("Pop-up bloquée. Autorise les pop-ups pour ce site.");

    const styles = `
      <style>
        *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
        body{margin:0;background:#f3f3f3;padding:18px}
        .paper{max-width:860px;margin:0 auto;background:#fff;padding:18px;border-radius:14px;box-shadow:0 14px 36px rgba(0,0,0,.12)}
        .head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
        .h-left{display:flex;gap:12px;align-items:flex-start}
        .logoBox{width:56px;height:56px;border-radius:12px;border:1px solid rgba(0,0,0,.12);overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center}
        .logoBox img{width:100%;height:100%;object-fit:cover}
        .logoFallback{font-weight:900;color:#7A5CFF;font-size:20px}
        .docTitle{font-weight:900;font-size:14px;letter-spacing:.3px}
        .docNum{font-weight:900;font-size:18px;margin-top:2px}
        .docMeta{font-size:12px;color:#555;font-weight:700;margin-top:2px}
        .h-right{min-width:240px}
        .metaLine{font-size:12px;color:#333;font-weight:700;margin-top:4px}
        .boxes{display:grid;grid-template-columns:1fr;gap:10px;margin-top:12px}
        @media(min-width:760px){.boxes{grid-template-columns:1fr 1fr}}
        .box{border:1px solid rgba(0,0,0,.10);border-radius:12px;padding:10px 12px;background:#fff}
        .boxTitle{font-weight:900;font-size:12px;color:#333;margin-bottom:6px}
        .tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:12.5px}
        .tbl th,.tbl td{padding:8px 8px;border-bottom:1px solid rgba(0,0,0,.10);text-align:left}
        .tbl th{background:#f6f3ff;font-weight:900}
        .num{text-align:right;white-space:nowrap}
        .tot{margin-top:12px;border:1px solid rgba(0,0,0,.10);border-radius:12px;padding:10px 12px}
        .r{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-weight:800}
        .big{font-weight:900;font-size:14px}
        .smallNote{margin-top:8px;font-size:12px;color:#555;font-weight:700}
        .printbar{max-width:860px;margin:0 auto 10px;display:flex;justify-content:flex-end;gap:8px}
        .pbtn{border:none;border-radius:999px;padding:10px 12px;font-weight:900;cursor:pointer;background:#7A5CFF;color:#fff}
        .pbtn2{border:2px solid #7A5CFF;border-radius:999px;padding:10px 12px;font-weight:900;cursor:pointer;background:#fff;color:#7A5CFF}
        @media print{
          body{background:#fff;padding:0}
          .printbar{display:none}
          .paper{box-shadow:none;border-radius:0;max-width:none;margin:0;padding:0}
        }
      </style>
    `;

    w.document.open();
    w.document.write(`
      <!doctype html>
      <html lang="fr">
        <head>
          <meta charset="utf-8" />
          <meta name="viewport" content="width=device-width,initial-scale=1" />
          <title>Facture</title>
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
          ${styles}
        </head>
        <body>
          <div class="printbar">
            <button class="pbtn" onclick="window.print()">Imprimer / PDF</button>
            <button class="pbtn2" onclick="window.close()">Fermer</button>
          </div>
          <div class="paper">
            ${htmlInside}
          </div>
        </body>
      </html>
    `);
    w.document.close();
  }

  function lockUI(locked){
    createInvoiceBtn.disabled = !!locked || !eventRef;
    previewBtn.disabled = !!locked || !eventRef || !eventData?.invoiceNumber;
    markSentBtn.disabled = !!locked || !eventRef || !canMarkSent(eventData);
    markPaidBtn.disabled = !!locked || !eventRef || !canMarkPaid(eventData);
  }

  createInvoiceBtn.addEventListener("click", async ()=>{
    hideAlert();
    if(!eventRef) return showAlert("Event non chargé.");
    lockUI(true);
    try{
      await createInvoiceWithSequentialNumber();
      showAlert("✅ Facture créée / brouillon.", true);
      renderRecap();
    }catch(err){
      console.error(err);
      showAlert("Erreur création facture : " + (err?.message || "inconnue"));
    }finally{
      lockUI(false);
    }
  });

  previewBtn.addEventListener("click", ()=>{
    if(!eventData?.invoiceNumber) return showAlert("Crée la facture (numéro) avant d’imprimer.");
    openPrintWindow(buildPreviewHtml());
  });

  markSentBtn.addEventListener("click", async ()=>{
    hideAlert();
    if(!eventRef) return showAlert("Event non chargé.");
    if(!eventData?.invoiceNumber) return showAlert("Numéro facture manquant. Crée d’abord la facture.");
    if(!canMarkSent(eventData)) return showAlert("⛔ La facture doit être en brouillon.");
    lockUI(true);
    try{
      await updateDoc(eventRef, {
        invoiceStatus: "SENT",
        invoiceSentAt: serverTimestamp(),
        commercialStatus: "FACTURE",
        commercialUpdatedAt: serverTimestamp(),
        invoiceNotes: (invoiceNotesEl.value || "").trim()
      });
      const snap = await getDoc(eventRef);
      eventData = { id: snap.id, ...(snap.data()||{}) };
      showAlert("✅ Facture envoyée.", true);
      renderRecap();
    }catch(err){
      console.error(err);
      showAlert("Erreur statut facture : " + (err?.message || "inconnue"));
    }finally{
      lockUI(false);
    }
  });

  markPaidBtn.addEventListener("click", async ()=>{
    hideAlert();
    if(!eventRef) return showAlert("Event non chargé.");
    if(!canMarkPaid(eventData)) return showAlert("⛔ La facture doit être “envoyée” avant payée.");
    if(!confirm("Marquer cette facture comme PAYÉE ?")) return;
    lockUI(true);
    try{
      await updateDoc(eventRef, {
        invoiceStatus: "PAID",
        invoicePaidAt: serverTimestamp(),
        commercialStatus: "PAYE",
        commercialUpdatedAt: serverTimestamp(),
        invoiceNotes: (invoiceNotesEl.value || "").trim()
      });
      const snap = await getDoc(eventRef);
      eventData = { id: snap.id, ...(snap.data()||{}) };
      showAlert("✅ Facture payée.", true);
      renderRecap();
    }catch(err){
      console.error(err);
      showAlert("Erreur statut facture : " + (err?.message || "inconnue"));
    }finally{
      lockUI(false);
    }
  });

  onAuthStateChanged(auth, async (user)=>{
    if(!user){ location.href = "login.html?role=conciergerie"; return; }
    currentUser = user;
    try{
      await loadEvent();
    }catch(e){
      showAlert("⛔ " + (e.message || "Erreur chargement facture"), false);
    }
  });
</script>
</body>
</html>
