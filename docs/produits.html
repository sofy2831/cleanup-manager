<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Boutique</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --ok:#1b8f4d; --bad:#b3261e; --warn:#b06b00;
    }

    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }

    .topbar{
      width:100%;
      max-width:1100px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet);
      color:var(--violet);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
      box-shadow:0 10px 22px rgba(0,0,0,.10);
    }

    .logo-title{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:10px;
      margin-bottom:6px;
      text-align:center;
    }

    .logo-icon{
      width:44px;
      height:44px;
      border-radius:50%;
      background:#fff;
      border:2px solid var(--violet);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--violet);
      font-size:20px;
      font-weight:900;
      position:relative;
      flex-shrink:0;
    }

    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px;
      right:-5px;
      font-size:12px;
      color:var(--violet);
    }

    h1{
      margin:0;
      font-size:24px;
      font-weight:900;
      letter-spacing:-0.2px;
    }

    .subtitle{
      margin-top:2px;
      font-size:14px;
      color:#444;
      text-align:center;
    }

    .hint{
      width:100%;
      max-width:1100px;
      margin-top:12px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }

    .wrap{
      width:100%;
      max-width:1100px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      min-width:0;
    }

    .layout{
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
      align-items:start;
      min-width:0;
    }

    @media(min-width:980px){
      .layout{
        grid-template-columns: 1.75fr 1fr;
      }
    }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .products-col{ order:2; }
    .cart-col{ order:1; }

    @media(min-width:980px){
      .products-col{ order:1; }
      .cart-col{ order:2; }
    }

    .toolbar{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:10px;
      align-items:center;
      min-width:0;
    }

    @media(max-width:760px){
      .toolbar{
        grid-template-columns: 1fr;
      }
    }

    .select, .input{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.28);
      background:#fff;
      font-weight:900;
      color:#222;
      outline:none;
    }

    .grid{
      margin-top:12px;
      display:grid;
      grid-template-columns: repeat(1, minmax(0,1fr));
      gap:10px;
    }

    @media(min-width:640px){
      .grid{
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }

    @media(min-width:980px){
      .grid{
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }

    .p{
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:16px;
      padding:12px 12px;
      box-shadow:0 3px 10px rgba(0,0,0,.05);
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:0;
    }

    .pmedia{
      width:100%;
      height:140px;
      border-radius:14px;
      overflow:hidden;
      background:#fff;
      border:1px solid rgba(122,92,255,0.14);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.7);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
    }

    .pmedia img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .pmedia.placeholder{
      display:flex;
      align-items:center;
      justify-content:center;
      color:#7A5CFF;
      font-size:28px;
      font-weight:900;
    }

    .phead{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      min-width:0;
    }

    .ptitle{
      font-weight:1000;
      font-size:14px;
      color:#111;
      min-width:0;
    }

    .ptitle .sub{
      display:block;
      font-weight:900;
      font-size:12px;
      color:#666;
      margin-top:2px;
    }

    .price{
      font-weight:1000;
      font-size:14px;
      color:#111;
      white-space:nowrap;
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:5px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      border:1px solid rgba(122,92,255,0.22);
      background:#fff;
      color:#333;
      white-space:nowrap;
    }

    .chip.kit{ color:var(--violet); }
    .chip.unit{ color:#555; border-color:rgba(0,0,0,0.10); }
    .chip.pack{ color:var(--ok); border-color: rgba(27,143,77,0.25); }

    .plist{
      margin:0;
      padding-left:16px;
      font-size:12px;
      color:#444;
    }

    .plist li{ margin:2px 0; }

    .pactions{
      display:flex;
      gap:8px;
      align-items:center;
      justify-content:space-between;
      margin-top:2px;
      flex-wrap:wrap;
    }

    .qty{
      display:flex;
      align-items:center;
      gap:6px;
      background: rgba(122,92,255,0.08);
      border:1px solid rgba(122,92,255,0.18);
      border-radius:999px;
      padding:6px 8px;
    }

    .qty button{
      width:26px;
      height:26px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      font-weight:1000;
      background:#fff;
      box-shadow:0 2px 6px rgba(0,0,0,.08);
    }

    .qty input{
      width:46px;
      border:none;
      background:transparent;
      text-align:center;
      font-weight:1000;
      outline:none;
    }

    .btn{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      text-decoration:none;
      font-weight:1000;
      font-size:12px;
      background:#fff;
      color:var(--violet);
      border:1px solid rgba(122,92,255,0.30);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
      user-select:none;
    }

    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }

    .btn.danger{
      color:var(--bad);
      border-color: rgba(179,38,30,0.25);
    }

    .btn[aria-disabled="true"]{
      opacity:.45;
      pointer-events:none;
    }

    .cartTitle{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
    }

    .cartTitle b{
      font-size:14px;
      font-weight:1000;
    }

    .cartMeta{
      font-size:12px;
      font-weight:900;
      color:#666;
    }

    .cartList{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .cartRow{
      background:#fff;
      border:1px solid rgba(122,92,255,0.16);
      border-radius:14px;
      padding:10px 10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      min-width:0;
    }

    .cartRow .left{ min-width:0; }

    .cartRow .name{
      font-weight:1000;
      font-size:12px;
      color:#111;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
      max-width:360px;
    }

    .cartRow .sub{
      margin-top:2px;
      font-weight:900;
      font-size:11px;
      color:#666;
    }

    .cartRow .right{
      text-align:right;
      flex-shrink:0;
    }

    .cartRow .line{
      font-weight:1000;
      font-size:12px;
      color:#111;
    }

    .cartRow .rm{
      margin-top:6px;
      display:inline-flex;
    }

    .cartTotals{
      margin-top:12px;
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap:10px;
    }

    .tbox{
      background:#fff;
      border:1px solid rgba(122,92,255,0.16);
      border-radius:14px;
      padding:10px 10px;
      box-shadow:0 3px 10px rgba(0,0,0,.05);
    }

    .tbox .t{
      font-size:11px;
      color:#666;
      font-weight:900;
    }

    .tbox .v{
      margin-top:2px;
      font-size:14px;
      color:#111;
      font-weight:1000;
    }

    .cartActions{
      margin-top:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .smallNote{
      margin-top:8px;
      font-size:11px;
      color:#666;
      font-weight:850;
      line-height:1.35;
    }

    .bottom-nav{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      gap: 6px;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }

    .bottom-nav a{
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 900;
      color: #666;
      padding: 10px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }

    @media(max-width:640px){
      .cartTotals{
        grid-template-columns: 1fr;
      }
    }

    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        width: 100%;
        max-width: 1100px;
        margin: 14px 0 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px;
        gap: 10px;
      }

      .bottom-nav a{
        font-size: 13px;
        padding: 12px 12px;
      }

      .page{
        padding-bottom: 32px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="conciergerie.html">← Tableau de bord</a>
    </div>

    <div class="logo-title">
      <div class="logo-icon">🛒</div>
      <h1>Boutique</h1>
    </div>
    <div class="subtitle">Kits (essentiel • cuisine • bain • séjour) + produits à l’unité</div>

    <div class="hint" style="display:none;"></div>

    <div class="wrap">
      <div class="layout">
        <div class="card products-col">
          <div class="toolbar">
            <select class="select" id="filter">
              <option value="ALL">Tout</option>
              <option value="KITS">Kits</option>
              <option value="UNITS">Produits à l’unité</option>
              <option value="ESS">Kit essentiel</option>
              <option value="CUIS">Kit cuisine</option>
              <option value="BAIN">Kit bain</option>
              <option value="SEJ">Kit séjour</option>
            </select>

            <input class="input" id="search" type="search" placeholder="Rechercher (ex: papier, café, kit…)" autocomplete="off" />

            <select class="select" id="sort">
              <option value="RECO">Tri : recommandé</option>
              <option value="PRICE_ASC">Prix : croissant</option>
              <option value="PRICE_DESC">Prix : décroissant</option>
              <option value="NAME">Nom : A→Z</option>
            </select>
          </div>

          <div class="grid" id="grid"></div>
        </div>

        <div class="card cart-col">
          <div class="cartTitle">
            <b>Panier</b>
            <span class="cartMeta" id="cartMeta">0 article</span>
          </div>

          <div class="cartList" id="cartList"></div>

          <div class="cartTotals" id="cartTotals" style="display:none;">
            <div class="tbox">
              <div class="t">Sous-total</div>
              <div class="v" id="subTotal">—</div>
            </div>
            <div class="tbox">
              <div class="t">Livraison</div>
              <div class="v" id="shippingTotal">—</div>
            </div>
            <div class="tbox">
              <div class="t">Total</div>
              <div class="v" id="grandTotal">—</div>
            </div>
          </div>

          <div class="cartActions">
            <button class="btn danger" id="clearBtn" type="button" aria-disabled="true">Vider</button>
            <button class="btn" id="saveBtn" type="button" aria-disabled="true">Enregistrer</button>
            <button class="btn primary" id="payBtn" type="button" aria-disabled="true">Payer (Stripe)</button>
          </div>

          <div class="smallNote" id="stripeNote">
            Livraison : 4,90 € • Offerte dès 100,00 € TTC<br>
            TVA non applicable – art. 293 B CGI
          </div>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Production</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const TAX_MODE = "EXEMPT";
    const VAT_RATE = 0.20;
    const SHIPPING_FEE = 4.90;
    const FREE_SHIPPING_FROM = 100;

    const logoutBtn = document.getElementById("logoutBtn");
    if (logoutBtn) {
      logoutBtn.addEventListener("click", async ()=>{
        try{ await signOut(auth); }catch(_){}
        try{ localStorage.removeItem("cm_auth"); }catch(_){}
        location.href = "index.html";
      });
    }

    onAuthStateChanged(auth, (user)=>{
      // if(!user) location.href="login.html?role=conciergerie";
    });

    const UNIT_PRICES = {
      "Tampon à récurer": 0.20,
      "Torchon": 1.28,
      "30ml de liquide vaisselle": 0.56,
      "Sac poubelle 50L": 0.24,
      "Capsule pour lave-linge": 0.43,
      "Pastille pour lave-vaisselle": 0.19,
      "Nettoyant multi usage sol + surface 30ml": 0.60,
      "Capsule Café": 0.39,
      "Sachet de Thé": 0.20,
      "Sucre monodose": 0.07,
      "Lait monodose": 0.20,
      "Nesquick": 0.60,
      "Huile olive 20ml": 0.78,
      "Vinaigre xérès 20ml": 0.39,
      "Sel + poivre": 0.10,
      "Essuie tout": 1.16,
      "Papier toilette": 0.56,
      "Gel douche": 0.27,
      "Shampoing": 0.27,
      "Savon mains": 0.15,
      "Après-shampoing": 0.29
    };

    const PRODUCT_IMAGES = {
      kit_ess: "images/kit-essentiel.jpg",
      kit_cuis: "images/kit-cuisine.jpg",
      kit_bain: "images/kit-bain.jpg",
      kit_sej: "images/kit-sejour.jpg",

      u_1: "images/eponge.jpg",
      u_2: "images/torchon-vaisselle.jpg",
      u_3: "images/liquide-vaisselle-30-ml.jpg",
      u_4: "images/sac-poubelle-50-l.jpg",
      u_5: "images/tablettes-lave-linge.jpg",
      u_6: "images/pastille-lave-vaisselle.jpg",
      u_7: "images/nettoyant-multi-usage-sol-surface-30-ml.jpg",
      u_8: "images/capsule-cafe.jpg",
      u_9: "images/the.jpg",
      u_10: "images/sucre.jpg",
      u_11: "images/lait.jpg",
      u_12: "images/nesquik.jpg",
      u_13: "images/huile-d-olive-20-ml.jpg",
      u_14: "images/vinaigre-de-xeres-20-ml.jpg",
      u_15: "images/poivre.jpg",
      u_16: "images/essuie-tout.jpg",
      u_17: "images/papier-toilette.jpg",
      u_18: "images/gel-pour-le-corps.jpg",
      u_19: "images/shampooing.jpg",
      u_20: "images/savon-main.jpg",
      u_21: "images/apres-shampooing.jpg"
    };

    const KIT_PRICES = {
      ESS: 4.90,
      CUIS: 5.90,
      BAIN: 4.20,
      SEJ: 13.90
    };

    const kits = [
      {
        id:"kit_ess",
        kind:"KIT",
        cat:"ESS",
        name:"Kit essentiel",
        subtitle:"Base ménage",
        unit:"kit",
        price: KIT_PRICES.ESS,
        items:[
          "1 Tampon à récurer",
          "1 Torchon",
          "1 liquide vaisselle 30ml",
          "1 Sac poubelle 50L",
          "1 Capsule pour lave-linge",
          "1 Pastille pour lave-vaisselle",
          "1 Nettoyant multi usage sol + surface 30ml"
        ]
      },
      {
        id:"kit_cuis",
        kind:"KIT",
        cat:"CUIS",
        name:"Kit cuisine",
        subtitle:"Accueil cuisine",
        unit:"kit",
        price: KIT_PRICES.CUIS,
        items:[
          "2 Capsule Café",
          "1 Sachet de Thé",
          "2 Sucre monodose",
          "2 Lait monodose",
          "1 Nesquick",
          "1 Huile olive 20ml",
          "1 Vinaigre xérès 20ml",
          "2 Sel + 1 poivre",
          "1 Essuie tout"
        ]
      },
      {
        id:"kit_bain",
        kind:"KIT",
        cat:"BAIN",
        name:"Kit bain",
        subtitle:"Hygiène",
        unit:"kit",
        price: KIT_PRICES.BAIN,
        items:[
          "1 Papier toilette",
          "2 Gel douche",
          "2 Shampoing",
          "2 Savon mains",
          "1 Après-shampoing"
        ]
      },
      {
        id:"kit_sej",
        kind:"KIT",
        cat:"SEJ",
        name:"Kit séjour (2 pers)",
        subtitle:"Essentiel + cuisine + bain",
        unit:"kit",
        price: KIT_PRICES.SEJ,
        items:[
          "1 Kit essentiel",
          "1 Kit cuisine",
          "1 Kit bain"
        ]
      }
    ];

    const units = Object.entries(UNIT_PRICES).map(([name, price], idx)=>({
      id:`u_${idx+1}`,
      kind:"UNIT",
      cat:"UNITS",
      name,
      subtitle:"Produit à l’unité",
      price,
      unit:"unité",
      items:[]
    }));

    const catalog = [...kits, ...units];

    const grid = document.getElementById("grid");
    const filter = document.getElementById("filter");
    const search = document.getElementById("search");
    const sort = document.getElementById("sort");

    const cartMeta = document.getElementById("cartMeta");
    const cartList = document.getElementById("cartList");
    const cartTotals = document.getElementById("cartTotals");
    const subTotal = document.getElementById("subTotal");
    const shippingTotal = document.getElementById("shippingTotal");
    const grandTotal = document.getElementById("grandTotal");
    const clearBtn = document.getElementById("clearBtn");
    const saveBtn = document.getElementById("saveBtn");
    const payBtn = document.getElementById("payBtn");

    function round2(n){
      return Math.round((Number(n) || 0) * 100) / 100;
    }

    function fmtMoney(n){
      const v = Number(n);
      if(!Number.isFinite(v)) return "—";
      return v.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
    }

    function esc(s){
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function getProductImage(product){
      return PRODUCT_IMAGES[product.id] || "";
    }

    const CART_KEY = "cm_shop_cart_v5";
    let cart = {};

    function loadCart(){
      try{
        const raw = localStorage.getItem(CART_KEY);
        if(!raw) return;
        const obj = JSON.parse(raw);
        if(obj && typeof obj === "object") cart = obj;
      }catch(_){}
    }

    function saveCart(){
      try{
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
      }catch(_){}
    }

    function cartCount(){
      return Object.values(cart).reduce((sum, it)=> sum + (Number(it.qty) || 0), 0);
    }

    function cartSubTotal(){
      return round2(
        Object.values(cart).reduce((sum, it)=> sum + (Number(it.qty) || 0) * (Number(it.price) || 0), 0)
      );
    }

    function getShippingAmount(subtotal){
      return subtotal >= FREE_SHIPPING_FROM ? 0 : SHIPPING_FEE;
    }

    function getCartTotals(){
      const st = cartSubTotal();
      const shipping = getShippingAmount(st);
      const total = round2(st + shipping);

      return {
        subTotal: st,
        shipping,
        total
      };
    }

    function setCartButtons(){
      const has = cartCount() > 0;
      clearBtn.setAttribute("aria-disabled", has ? "false" : "true");
      saveBtn.setAttribute("aria-disabled", has ? "false" : "true");
      payBtn.setAttribute("aria-disabled", has ? "false" : "true");
      cartTotals.style.display = has ? "grid" : "none";
    }

    function addToCart(prod, qty){
      const q = Math.max(1, Math.min(999, Number(qty) || 1));
      const cur = cart[prod.id];

      if(cur){
        cur.qty = Math.max(1, Math.min(999, (Number(cur.qty) || 0) + q));
      }else{
        cart[prod.id] = {
          id: prod.id,
          name: prod.name,
          unit: prod.unit,
          price: Number(prod.price) || 0,
          qty: q,
          kind: prod.kind,
          cat: prod.cat
        };
      }

      saveCart();
      renderCart();
    }

    function setQty(id, qty){
      const q = Math.floor(Number(qty) || 0);
      if(!cart[id]) return;

      if(q <= 0){
        delete cart[id];
      }else{
        cart[id].qty = Math.max(1, Math.min(999, q));
      }

      saveCart();
      renderCart();
    }

    function clearCart(){
      cart = {};
      saveCart();
      renderCart();
    }

    function matchesFilter(p){
      const f = filter.value;
      if(f === "ALL") return true;
      if(f === "KITS") return p.kind === "KIT";
      if(f === "UNITS") return p.kind === "UNIT";
      if(f === "ESS") return p.kind === "KIT" && p.cat === "ESS";
      if(f === "CUIS") return p.kind === "KIT" && p.cat === "CUIS";
      if(f === "BAIN") return p.kind === "KIT" && p.cat === "BAIN";
      if(f === "SEJ") return p.kind === "KIT" && p.cat === "SEJ";
      return true;
    }

    function matchesSearch(p){
      const q = (search.value || "").trim().toLowerCase();
      if(!q) return true;

      const hay = [
        p.name,
        p.subtitle,
        p.kind,
        p.cat,
        ...(p.items || [])
      ].filter(Boolean).join(" ").toLowerCase();

      return hay.includes(q);
    }

    function sortProducts(arr){
      const s = sort.value;
      const cp = [...arr];

      if(s === "PRICE_ASC"){
        cp.sort((a,b)=>(a.price || 0) - (b.price || 0));
      }else if(s === "PRICE_DESC"){
        cp.sort((a,b)=>(b.price || 0) - (a.price || 0));
      }else if(s === "NAME"){
        cp.sort((a,b)=> String(a.name || "").localeCompare(String(b.name || ""), "fr"));
      }else{
        const rank = (p)=>{
          if(p.kind === "KIT"){
            if(p.cat === "ESS") return 1;
            if(p.cat === "CUIS") return 2;
            if(p.cat === "BAIN") return 3;
            if(p.cat === "SEJ") return 4;
            return 5;
          }
          return 10;
        };

        cp.sort((a,b)=>{
          const ra = rank(a);
          const rb = rank(b);
          if(ra !== rb) return ra - rb;
          if(a.kind !== b.kind) return a.kind === "KIT" ? -1 : 1;
          return String(a.name || "").localeCompare(String(b.name || ""), "fr");
        });
      }

      return cp;
    }

    function renderProducts(){
      const filtered = sortProducts(catalog.filter(p => matchesFilter(p) && matchesSearch(p)));
      grid.innerHTML = "";

      for(const p of filtered){
        const el = document.createElement("div");
        el.className = "p";

        const chips = [];
        chips.push(`<span class="chip ${p.kind==="KIT" ? "kit" : "unit"}">${p.kind==="KIT" ? "Kit" : "Unitaire"}</span>`);
        if(p.kind==="KIT" && p.cat==="SEJ") chips.push(`<span class="chip pack">Pack</span>`);
        if(p.kind==="KIT" && p.cat!=="SEJ") chips.push(`<span class="chip">${esc(p.cat)}</span>`);
        if(p.kind==="UNIT") chips.push(`<span class="chip unit">${esc(p.unit || "unité")}</span>`);

        const itemList = (p.items && p.items.length)
          ? `<ul class="plist">${p.items.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`
          : `<div style="font-size:12px;color:#666;font-weight:850;">Produit à l’unité.</div>`;

        const imgSrc = getProductImage(p);
        const mediaHtml = imgSrc
          ? `<div class="pmedia">
               <img src="${esc(imgSrc)}" alt="${esc(p.name)}" loading="lazy" onerror="this.parentElement.classList.add('placeholder'); this.parentElement.innerHTML='🛒';">
             </div>`
          : `<div class="pmedia placeholder">🛒</div>`;

        el.innerHTML = `
          ${mediaHtml}

          <div class="phead">
            <div class="ptitle">
              ${esc(p.name)}
              <span class="sub">${esc(p.subtitle || "")}</span>
            </div>
            <div class="price">${fmtMoney(p.price)}</div>
          </div>

          <div class="chips">${chips.join("")}</div>

          ${itemList}

          <div class="pactions">
            <div class="qty" aria-label="Quantité">
              <button type="button" data-q="-">−</button>
              <input type="text" value="1" inputmode="numeric" pattern="[0-9]*" />
              <button type="button" data-q="+">+</button>
            </div>

            <button class="btn primary" type="button">Ajouter au panier</button>
          </div>
        `;

        const input = el.querySelector(".qty input");
        const minus = el.querySelector('button[data-q="-"]');
        const plus = el.querySelector('button[data-q="+"]');
        const addBtn = el.querySelector(".btn.primary");

        function getInputQty(){
          const n = Math.floor(Number(String(input.value || "").replace(/[^\d]/g,"")));
          return Number.isFinite(n) && n > 0 ? n : 1;
        }

        minus.addEventListener("click", ()=>{
          input.value = String(Math.max(1, getInputQty() - 1));
        });

        plus.addEventListener("click", ()=>{
          input.value = String(Math.min(999, getInputQty() + 1));
        });

        input.addEventListener("blur", ()=>{
          input.value = String(getInputQty());
        });

        addBtn.addEventListener("click", ()=>{
          addToCart(p, getInputQty());
        });

        grid.appendChild(el);
      }
    }

    function renderCart(){
      const items = Object.values(cart);
      const count = cartCount();
      cartMeta.textContent = count + " article" + (count > 1 ? "s" : "");

      cartList.innerHTML = "";

      if(!items.length){
        cartList.innerHTML = `
          <div style="margin-top:10px; font-size:12px; color:#666; font-weight:850;">
            Panier vide. Ajoute un kit ou des produits unitaires.
          </div>
        `;
        setCartButtons();
        return;
      }

      for(const it of items){
        const row = document.createElement("div");
        row.className = "cartRow";
        row.innerHTML = `
          <div class="left">
            <div class="name" title="${esc(it.name)}">${esc(it.name)}</div>
            <div class="sub">${esc(it.kind==="KIT" ? "Kit" : "Unitaire")} • ${esc(it.unit || "")}</div>

            <div style="margin-top:8px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
              <div class="qty">
                <button type="button" data-q="-">−</button>
                <input type="text" value="${esc(it.qty)}" inputmode="numeric" pattern="[0-9]*" />
                <button type="button" data-q="+">+</button>
              </div>
              <button class="btn danger rm" type="button">Supprimer</button>
            </div>
          </div>

          <div class="right">
            <div class="line">${fmtMoney(it.price)} / ${esc(it.unit || "")}</div>
            <div class="line" style="margin-top:6px;">${fmtMoney((Number(it.qty) || 0) * (Number(it.price) || 0))}</div>
          </div>
        `;

        const input = row.querySelector(".qty input");
        const minus = row.querySelector('button[data-q="-"]');
        const plus = row.querySelector('button[data-q="+"]');
        const rm = row.querySelector(".btn.danger.rm");

        function getQty(){
          const n = Math.floor(Number(String(input.value || "").replace(/[^\d]/g,"")));
          return Number.isFinite(n) ? n : (Number(it.qty) || 1);
        }

        minus.addEventListener("click", ()=> setQty(it.id, Math.max(1, (Number(it.qty) || 1) - 1)));
        plus.addEventListener("click", ()=> setQty(it.id, Math.min(999, (Number(it.qty) || 1) + 1)));
        input.addEventListener("blur", ()=> setQty(it.id, Math.max(1, getQty())));
        rm.addEventListener("click", ()=> setQty(it.id, 0));

        cartList.appendChild(row);
      }

      const totals = getCartTotals();
      subTotal.textContent = fmtMoney(totals.subTotal);
      shippingTotal.textContent = totals.shipping === 0 ? "Offerte" : fmtMoney(totals.shipping);
      grandTotal.textContent = fmtMoney(totals.total);

      const note = document.getElementById("stripeNote");
      note.innerHTML = totals.shipping === 0
        ? "Livraison offerte<br>TVA non applicable – art. 293 B CGI"
        : `Livraison : ${fmtMoney(totals.shipping)} • offerte dès ${fmtMoney(FREE_SHIPPING_FROM)} TTC<br>TVA non applicable – art. 293 B CGI`;

      setCartButtons();
    }

    filter.addEventListener("change", renderProducts);
    search.addEventListener("input", renderProducts);
    sort.addEventListener("change", renderProducts);

    clearBtn.addEventListener("click", ()=>{
      if(clearBtn.getAttribute("aria-disabled")==="true") return;
      if(!confirm("Vider le panier ?")) return;
      clearCart();
    });

    saveBtn.addEventListener("click", ()=>{
      if(saveBtn.getAttribute("aria-disabled")==="true") return;
      alert("Panier enregistré localement. Étape suivante : brouillon commande en Firestore.");
    });

    payBtn.addEventListener("click", async ()=>{
      if (payBtn.getAttribute("aria-disabled") === "true") return;

      try {
        payBtn.disabled = true;
        payBtn.textContent = "Redirection...";

        const items = Object.values(cart).map(item => ({
          id: item.id,
          quantity: item.qty
        }));

        if (!items.length) {
          throw new Error("Panier vide");
        }

        const successUrl = `${window.location.origin}/produits.html?payment=success&session_id={CHECKOUT_SESSION_ID}`;
const cancelUrl = `${window.location.origin}/produits.html?payment=cancel`;

        const response = await fetch("/api/create-shop-checkout-session", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            items,
            successUrl,
            cancelUrl
          })
        });

        const data = await response.json();

        if (!response.ok || !data?.url) {
          throw new Error(data?.error || "Impossible de créer la session Stripe");
        }

        window.location.href = data.url;
      } catch (err) {
        console.error("Stripe checkout error:", err);
        alert(err?.message || "Impossible de lancer le paiement Stripe.");
      } finally {
        payBtn.disabled = false;
        payBtn.textContent = "Payer (Stripe)";
      }
    });

    loadCart();
const urlParams = new URLSearchParams(window.location.search);
const paymentSuccess = urlParams.get("payment");

if (paymentSuccess === "success") {
  localStorage.removeItem(CART_KEY);
  cart = {};
  history.replaceState({}, document.title, window.location.pathname);
}
    
    renderProducts();
    renderCart();
  </script>
</body>
</html>
