<!-- docs/agent-login.html (FINAL — Email link (passwordless) login for AGENT + redirect back to agent-chat.html?threadId=... ) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Connexion Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; }
    .topbar{
      width:100%; max-width:980px; display:flex; justify-content:space-between; align-items:center;
      gap:10px; position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }
    .wrap{ width:100%; max-width:980px; margin-top:6px; display:flex; flex-direction:column; gap:10px; }
    h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:-0.2px; }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; white-space:pre-wrap; }
    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:12px;
    }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }

    input{
      width:100%; padding:12px; border-radius:12px; border:1px solid #D3C7FF; background:#fff;
      font-size:14px; outline:none; font-weight:800;
    }
    input:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; margin-top:10px; }

    .btn{
      border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:900; cursor:pointer;
      color:#fff; background:linear-gradient(90deg,var(--violet),var(--violet2));
      box-shadow:0 10px 22px rgba(0,0,0,0.10); white-space:nowrap;
      text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    }
    .btn.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .kvs{ display:flex; flex-direction:column; gap:6px; margin-top:8px; }
    .kv{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .kv .k{ font-weight:900; font-size:12px; color:#333; }
    .kv .v{ font-weight:800; font-size:12px; color:#444; text-align:right; white-space:pre-wrap; }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <span class="pill">Agent</span>
      <div></div>
    </div>

    <div class="wrap">
      <div>
        <h1>Connexion agent</h1>
        <div class="sub" id="subLine">Envoi d’un lien de connexion (sans mot de passe).</div>
        <div class="alert" id="alertBox"></div>
      </div>

      <section class="card">
        <div class="mini">Email</div>
        <input id="email" type="email" placeholder="ex. agent@email.com" autocomplete="email" />

        <div class="row">
          <button class="btn" id="sendBtn" type="button">Envoyer le lien</button>
          <button class="btn ghost" id="openBtn" type="button">Ouvrir le chat</button>
        </div>

        <div class="kvs">
          <div class="kv"><div class="k">Thread</div><div class="v" id="threadLine">—</div></div>
          <div class="kv"><div class="k">État</div><div class="v" id="stateLine">—</div></div>
        </div>

        <div class="mini" style="margin-top:10px;">
          Important : ouvre le mail sur <b>le même appareil</b> (et le même navigateur) pour finaliser la connexion.
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase-init.js";
    import {
      isSignInWithEmailLink,
      sendSignInLinkToEmail,
      signInWithEmailLink
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const alertBox = document.getElementById("alertBox");
    const subLine  = document.getElementById("subLine");
    const emailEl  = document.getElementById("email");
    const sendBtn  = document.getElementById("sendBtn");
    const openBtn  = document.getElementById("openBtn");
    const threadLine = document.getElementById("threadLine");
    const stateLine  = document.getElementById("stateLine");

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
    function normalizeEmail(s){ return (s||"").trim().toLowerCase(); }

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    const threadId = qs("threadId");
    threadLine.textContent = threadId || "—";

    // Base URL GitHub Pages: /cleanup-manager/
    // On construit proprement l'URL de retour sur CETTE page (agent-login.html)
    const baseDir = location.origin + location.pathname.replace(/\/[^\/]*$/, "/"); // .../cleanup-manager/
    const thisPage = baseDir + "agent-login.html";

    // Après login, on redirige vers agent-chat.html avec threadId
    function gotoChat(){
      if(!threadId){
        showAlert("threadId manquant (URL).");
        return;
      }
      location.href = baseDir + "agent-chat.html?threadId=" + encodeURIComponent(threadId);
    }

    openBtn.addEventListener("click", ()=> gotoChat());

    async function sendLink(){
      hideAlert();
      const email = normalizeEmail(emailEl.value);
      if(!email) return showAlert("Email requis.");
      if(!/^\S+@\S+\.\S+$/.test(email)) return showAlert("Email invalide.");

      // stocke email pour finaliser après clic dans le mail
      localStorage.setItem("agentEmailForSignIn", email);
      if(threadId) localStorage.setItem("agentThreadAfterSignIn", threadId);

      const actionCodeSettings = {
        url: thisPage + "?threadId=" + encodeURIComponent(threadId || ""),
        handleCodeInApp: true
      };

      sendBtn.disabled = true;
      stateLine.textContent = "Envoi…";

      try{
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        stateLine.textContent = "Lien envoyé";
        showAlert("✅ Lien envoyé. Ouvre ton mail et clique sur le bouton de connexion.", true);
      }catch(err){
        console.error(err);
        stateLine.textContent = "Erreur";
        showAlert("Erreur envoi : " + (err?.code || err?.message || "inconnue"));
      }finally{
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener("click", ()=> sendLink());

    async function completeIfEmailLink(){
      hideAlert();

      const href = window.location.href;
      if(!isSignInWithEmailLink(auth, href)){
        stateLine.textContent = "Prêt";
        return;
      }

      stateLine.textContent = "Validation…";

      let email = localStorage.getItem("agentEmailForSignIn") || "";
      email = normalizeEmail(email);

      if(!email){
        // fallback: demande à l'agent (minimal)
        email = normalizeEmail(prompt("Confirme ton email pour finaliser la connexion :") || "");
      }
      if(!email) {
        stateLine.textContent = "Email manquant";
        return showAlert("Email requis pour finaliser.");
      }

      try{
        await signInWithEmailLink(auth, email, href);

        // cleanup
        localStorage.removeItem("agentEmailForSignIn");

        stateLine.textContent = "Connecté";
        showAlert("✅ Connecté. Redirection vers le chat…", true);

        // threadId: URL > localStorage fallback
        const t = threadId || localStorage.getItem("agentThreadAfterSignIn") || "";
        if(t) localStorage.removeItem("agentThreadAfterSignIn");

        // redirige
        location.href = baseDir + "agent-chat.html?threadId=" + encodeURIComponent(t);
      }catch(err){
        console.error(err);
        stateLine.textContent = "Erreur";
        showAlert("Erreur connexion : " + (err?.code || err?.message || "inconnue"));
      }
    }

    completeIfEmailLink();
  </script>
</body>
</html>
