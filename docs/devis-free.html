<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Devis libre</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-light:#F3ECFF;
      --violet-mid:#DCCBFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text-dark:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text-dark); }

    .page{
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:16px 16px 32px; padding-bottom:96px;
    }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill-link{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main); color:var(--violet-main);
      text-decoration:none; font-weight:900; font-size:13px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; cursor:pointer;
    }

    .logo-title{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:10px; margin-bottom:6px; text-align:center;
    }
    .logo-icon{
      width:40px;height:40px;border-radius:50%;
      background:#fff; border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0; overflow:hidden;
    }
    .logo-icon img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:24px; font-weight:900; color:#111; }
    .subtitle{ font-size:15px; color:#444; margin-top:4px; text-align:center; }

    .badge{
      margin-top:10px; padding:4px 10px; border-radius:999px; background:#fff;
      font-size:12px; color:#555; box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center; font-weight:900; white-space:pre-wrap;
    }

    .docBanner{
      width:100%; max-width:1100px;
      margin-top:10px;
      display:flex; justify-content:center;
    }
    .docBannerInner{
      background:#fff;
      border:1px solid var(--border);
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      border-radius:999px;
      padding:8px 14px;
      font-weight:1000;
      font-size:13px;
      color:#222;
      display:flex; gap:10px; align-items:center;
      white-space:nowrap;
    }

    .layout{
      width:100%;
      max-width:1100px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    @media(min-width:980px){
      .layout{
        display:grid;
        grid-template-columns: 520px 1fr;
        align-items:start;
      }
    }

    .card{
      width:100%; background: rgba(255,255,255,0.86);
      border: 1px solid var(--border); border-radius:18px;
      box-shadow: var(--shadow); padding:14px 14px 16px; backdrop-filter: blur(10px);
    }

    .card-title{
      font-size:16px; font-weight:1000; margin-bottom:8px;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
    }
    .small{ font-size:12px; color:var(--muted); line-height:1.35; font-weight:800; }

    .alert{
      margin-top:10px; padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .kv{
      margin-top:6px; display:grid; grid-template-columns: 1fr; gap:6px;
      font-size:13px; color:#333; font-weight:850;
    }
    .kv b{ font-weight:1000; }
    .kv .line{ line-height:1.35; }

    .divider{ height:1px; width:100%; background: rgba(122,92,255,0.18); margin:12px 0; }

    .tableWrap{
      overflow:auto; border-radius:14px; border:1px solid rgba(0,0,0,0.04);
      background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    table{ width:100%; border-collapse:collapse; min-width:0; }
    th, td{
      padding:10px 10px; border-bottom:1px solid rgba(0,0,0,0.05);
      text-align:left; font-size:12.5px;
      vertical-align:top;
    }
    th{
      font-size:12px; color:#444; font-weight:1000;
      background:rgba(248,244,255,.7); position:sticky; top:0;
    }
    td.num, th.num{ text-align:right; white-space:nowrap; }
    td.designation{ white-space:normal; word-break:break-word; }

    .linesCards{ display:none; }
    @media(max-width:720px){
      .tableWrap{ display:none; }
      .linesCards{ display:flex; flex-direction:column; gap:10px; }
      .lineCard{
        background:#fff; border:1px solid rgba(122,92,255,0.18);
        border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.06);
        padding:10px 12px;
      }
      .lineCard .t{ font-weight:1000; }
      .lineCard .g{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; font-size:12.5px; color:#222; font-weight:850; }
      .lineCard .g div{ background:rgba(248,244,255,.6); border-radius:10px; padding:8px 10px; }
      .lineCard .g b{ font-weight:1000; }
    }

    .totals{
      margin-top:10px; background:#fff; border-radius:14px;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px; display:flex; flex-direction:column; gap:6px; font-weight:1000;
    }
    .totals .r{ display:flex; justify-content:space-between; gap:10px; }
    .mutedLine{ font-size:12px; color:#666; font-weight:900; }

    label{
      display:block; font-size:12px; font-weight:1000; color:#333;
      margin:10px 0 4px; text-align:left;
    }
    input, textarea, select{
      width:100%; padding:10px 12px; border-radius:12px;
      border:1px solid #D3C7FF; font-size:14px; outline:none;
      background:#fff; font-weight:800; color:#111;
    }
    input:focus, textarea:focus, select:focus{
      border-color:var(--violet-main);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }

    .actions{
      display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;
    }
    .btn{
      flex:1; border:none; border-radius:999px; padding:10px 12px;
      font-size:13px; font-weight:1000; cursor:pointer;
      background:#fff; color:var(--violet-main);
      border:2px solid var(--violet-main); box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff; box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .radioRow{ display:flex; gap:10px; flex-direction:column; margin-top:10px; }
    .radio{
      display:flex; gap:10px; align-items:center;
      padding:10px 12px; border:1px solid rgba(122,92,255,0.25);
      border-radius:14px; background:#fff; cursor:pointer;
    }
    .radio input{ margin:0; width:auto; }
    .readonly{ background:rgba(248,244,255,.6); }

    .headCard{
      max-width:1100px; width:100%;
      display:grid; grid-template-columns:1fr; gap:12px;
      align-items:stretch;
      margin-top:14px;
    }
    @media(min-width:860px){
      .headCard{ grid-template-columns: 1fr 1fr; }
    }
    .headBox{
      background:#fff; border:1px solid rgba(122,92,255,0.18);
      border-radius:18px; box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:12px 12px 10px;
      display:flex; flex-direction:column; height:100%;
    }
    .headRow{
      display:flex; gap:10px; align-items:flex-start;
    }
    .bizLogo{
      width:44px;height:44px;border-radius:12px; overflow:hidden;
      border:2px solid rgba(122,92,255,0.35); background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:1000; color:var(--violet-main);
      flex-shrink:0;
    }
    .bizLogo img{ width:100%; height:100%; object-fit:cover; display:none; }
    .headTitle{ font-weight:1000; font-size:12px; color:#555; letter-spacing:.2px; }
    .headMain{ font-weight:1000; font-size:14px; color:#111; margin-top:2px; }
    .headLines{ margin-top:6px; font-size:12.5px; color:#222; font-weight:850; line-height:1.35; }
    .headLines .mut{ color:#666; font-weight:900; }

    /* bottom nav conservée mais tu peux la virer plus tard */
    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:11px; font-weight:1000; text-decoration:none;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 980px){
      .bottom-nav{
        position: static; max-width: 1100px; margin: 12px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" href="devis-liste.html">← Retour devis</a>
      <button class="pill-link" type="button" id="logoutBtn">Déconnexion</button>
    </div>

    <div class="logo-title">
      <div class="logo-icon" id="logoIcon">
        <img id="logoImg" alt="Logo">
        <span id="logoFallback">✓</span>
      </div>
      <h1>CleanUp Manager</h1>
    </div>

    <div class="subtitle">Devis</div>
    <div class="badge" id="statusBadge">—</div>

    <div class="docBanner">
      <div class="docBannerInner" id="docBannerInner">DEVIS N° — • v—</div>
    </div>

    <!-- ENTÊTE PRO : Société / Client -->
    <div class="headCard">
      <div class="headBox">
        <div class="headRow">
          <div class="bizLogo">
            <img id="bizLogoImg" alt="Logo société">
            <span id="bizLogoFallback">✓</span>
          </div>
          <div style="flex:1;">
            <div class="headTitle">Société</div>
            <div class="headMain" id="bizName">—</div>
            <div class="headLines" id="bizLines">—</div>
          </div>
        </div>
      </div>

      <div class="headBox">
        <div class="headTitle">Client</div>

        <!-- ✅ Devis libre : champs éditables -->
        <label for="clientNameInput">Nom *</label>
        <input id="clientNameInput" type="text" placeholder="Nom du client">

        <label for="clientEmailInput">Email *</label>
        <input id="clientEmailInput" type="email" placeholder="email@client.fr">

        <label for="clientAddress1Input">Adresse</label>
        <input id="clientAddress1Input" type="text" placeholder="Adresse">

        <label for="clientAddress2Input">Complément</label>
        <input id="clientAddress2Input" type="text" placeholder="Bâtiment, étage, etc.">

        <div style="display:flex; gap:10px; margin-top:10px;">
          <div style="flex:0.8;">
            <label for="clientZipInput" style="margin-top:0;">Code postal</label>
            <input id="clientZipInput" type="text" placeholder="CP">
          </div>
          <div style="flex:1.2;">
            <label for="clientCityInput" style="margin-top:0;">Ville</label>
            <input id="clientCityInput" type="text" placeholder="Ville">
          </div>
        </div>
      </div>
    </div>

    <div class="layout">
      <!-- GAUCHE -->
      <div class="card">
        <div class="card-title">
          <span>Récapitulatif</span>
          <span class="small" id="versionLine">v—</span>
        </div>

        <div class="alert" id="alertBox"></div>
        <div class="kv" id="recapKv"></div>

        <div class="divider"></div>

        <div class="card-title" style="font-size:14px; margin-bottom:6px;">
          <span>Lignes</span>
          <span class="small">auto</span>
        </div>

        <div class="linesCards" id="linesCards"></div>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Désignation</th>
                <th class="num">Qté</th>
                <th>Unité</th>
                <th class="num">PU HT</th>
                <th class="num" id="thTVA" style="display:none;">TVA</th>
                <th class="num">Total TTC</th>
              </tr>
            </thead>
            <tbody id="linesTbody"></tbody>
          </table>
        </div>

        <div class="totals" id="totalsBox"></div>
      </div>

      <!-- DROITE -->
      <div class="card">
        <div class="card-title">
          <span>Devis</span>
          <span class="small">Paramètres</span>
        </div>

        <label for="amount">Total TTC (€)</label>
        <input id="amount" type="number" step="0.01" min="0" placeholder="Auto = total des lignes" readonly>

        <div class="divider"></div>

        <div class="card-title" style="font-size:14px; margin-bottom:6px;">
          <span>Références</span>
          <span class="small">devis libre</span>
        </div>

        <div class="kv" id="refsKv"></div>

        <div class="divider"></div>

        <div class="card-title" style="font-size:14px; margin-bottom:6px;">
          <span>Paiement</span>
          <span class="small">hors CB</span>
        </div>

        <label for="paymentTerm">Délai de règlement</label>
        <select id="paymentTerm">
          <option value="RECEPTION">À réception</option>
          <option value="8J">8 jours</option>
          <option value="15J">15 jours</option>
          <option value="30J">30 jours</option>
          <option value="45J">45 jours</option>
        </select>

        <div class="radioRow" id="payModes">
          <label class="radio" for="payModeVIR">
            <input id="payModeVIR" name="payMode" type="radio" value="VIREMENT" />
            <b>Virement</b>
          </label>

          <label class="radio" for="payModeESP">
            <input id="payModeESP" name="payMode" type="radio" value="ESPECES" />
            <b>Espèces</b>
          </label>

          <label class="radio" for="payModeCHQ">
            <input id="payModeCHQ" name="payMode" type="radio" value="CHEQUE" />
            <b>Chèque</b>
          </label>
        </div>

        <label for="offerValidityDays">Validité de l’offre (jours)</label>
        <input id="offerValidityDays" type="number" min="0" step="1" value="30">

        <div class="divider"></div>

        <div class="card-title" style="font-size:14px; margin-bottom:6px;">
          <span>Conditions clés</span>
          <span class="small">5 lignes max</span>
        </div>

        <div class="kv" id="keyConditionsKv"></div>

        <div class="divider"></div>

        <div class="card-title" style="font-size:14px; margin-bottom:6px;">
          <span>Pénalités</span>
          <span class="small">B2C / B2B</span>
        </div>

        <div class="radioRow">
          <label class="radio" for="penB2B">
            <input id="penB2B" name="penaltyMode" type="radio" value="B2B" />
            <b>Client professionnel (B2B)</b>
          </label>

          <label class="radio" for="penB2C">
            <input id="penB2C" name="penaltyMode" type="radio" value="B2C" />
            <b>Client particulier (B2C)</b>
          </label>
        </div>

        <label for="penaltyText">Texte appliqué</label>
        <textarea id="penaltyText" class="readonly" readonly rows="4"></textarea>

        <label for="privateNote">Note privée</label>
        <textarea id="privateNote" rows="3" placeholder="Interne (non affichée au client)"></textarea>

        <div class="actions">
          <button class="btn primary" type="button" id="saveBtn">Enregistrer</button>
          <button class="btn" type="button" id="previewBtn">Aperçu</button>
          <button class="btn" type="button" id="markSentBtn" disabled>Marquer “devis envoyé”</button>
          <button class="btn" type="button" id="markAcceptedBtn" disabled>Marquer “accepté”</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="logements.html">Logements</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc, updateDoc, serverTimestamp, runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ===== UI =====
    const logoutBtn = document.getElementById("logoutBtn");
    const alertBox = document.getElementById("alertBox");
    const recapKv = document.getElementById("recapKv");
    const refsKv = document.getElementById("refsKv");
    const keyConditionsKv = document.getElementById("keyConditionsKv");
    const statusBadge = document.getElementById("statusBadge");
    const versionLine = document.getElementById("versionLine");
    const docBannerInner = document.getElementById("docBannerInner");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");
    const bizLogoImg = document.getElementById("bizLogoImg");
    const bizLogoFallback = document.getElementById("bizLogoFallback");

    const bizNameEl = document.getElementById("bizName");
    const bizLinesEl = document.getElementById("bizLines");

    const clientNameInput = document.getElementById("clientNameInput");
    const clientEmailInput = document.getElementById("clientEmailInput");
    const clientAddress1Input = document.getElementById("clientAddress1Input");
    const clientAddress2Input = document.getElementById("clientAddress2Input");
    const clientZipInput = document.getElementById("clientZipInput");
    const clientCityInput = document.getElementById("clientCityInput");

    const thTVA = document.getElementById("thTVA");
    const linesTbody = document.getElementById("linesTbody");
    const linesCards = document.getElementById("linesCards");
    const totalsBox = document.getElementById("totalsBox");

    const amountEl = document.getElementById("amount");
    const privateNoteEl = document.getElementById("privateNote");

    const paymentTermEl = document.getElementById("paymentTerm");
    const offerValidityDaysEl = document.getElementById("offerValidityDays");

    const payModeVIR = document.getElementById("payModeVIR");
    const payModeESP = document.getElementById("payModeESP");
    const payModeCHQ = document.getElementById("payModeCHQ");

    const penB2BEl = document.getElementById("penB2B");
    const penB2CEl = document.getElementById("penB2C");
    const penaltyTextEl = document.getElementById("penaltyText");

    const saveBtn = document.getElementById("saveBtn");
    const previewBtn = document.getElementById("previewBtn");
    const markSentBtn = document.getElementById("markSentBtn");
    const markAcceptedBtn = document.getElementById("markAcceptedBtn");

    // ===== State =====
    let currentUser = null;

    let profileData = null;   // users/{uid}
    let quoteRef = null;      // salesDocuments/{docId}
    let quoteData = null;     // doc data
    let docId = "";

    // ===== Helpers =====
    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

    function todayIso(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return `${dd}/${mm}/${yyyy}`;
    }
    function addDaysLabel(ddmmyyyy, days){
      const [dd,mm,yy] = String(ddmmyyyy).split("/").map(x=>parseInt(x,10));
      const d = new Date(yy, (mm||1)-1, dd||1);
      d.setDate(d.getDate() + (Number(days)||0));
      const out = String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
      return out;
    }

    function quoteStatusLabel(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return "—";
      if(x === "DRAFT") return "BROUILLON";
      if(x === "SENT") return "DEVIS ENVOYÉ";
      if(x === "ACCEPTED") return "ACCEPTÉ";
      if(x === "REFUSED") return "REFUSÉ";
      return x;
    }
    function canMarkSent(d){
      const qs = String(d?.quoteStatus || d?.status || "").toUpperCase();
      return qs === "DRAFT";
    }
    function canMarkAccepted(d){
      const qs = String(d?.quoteStatus || d?.status || "").toUpperCase();
      return qs === "SENT";
    }

    function getSelectedPayMode(){
      const el = document.querySelector('input[name="payMode"]:checked');
      return el ? el.value : "";
    }
    function setPayMode(mode){
      const m = String(mode||"").toUpperCase();
      payModeVIR.checked = (m === "VIREMENT");
      payModeESP.checked = (m === "ESPECES");
      payModeCHQ.checked = (m === "CHEQUE");
    }
    function payModeLabel(m){
      if(m === "VIREMENT") return "Virement";
      if(m === "ESPECES") return "Espèces";
      if(m === "CHEQUE") return "Chèque";
      return "—";
    }
    function dueLabel(term){
      if(term === "RECEPTION") return "À réception";
      if(term === "8J") return "8 jours";
      if(term === "15J") return "15 jours";
      if(term === "30J") return "30 jours";
      if(term === "45J") return "45 jours";
      return term || "—";
    }
    function termToDays(term){
      if(term === "RECEPTION") return 0;
      if(term === "8J") return 8;
      if(term === "15J") return 15;
      if(term === "30J") return 30;
      if(term === "45J") return 45;
      return 0;
    }

    function computeTotals(lines, tvaEnabled, tvaRate){
      let ht = 0;
      for(const l of (Array.isArray(lines) ? lines : [])){
        const qty = Number(l?.qty)||0;
        const up  = Number(l?.unitPrice)||0;
        ht += qty * up;
      }
      const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    function getPenaltyTemplate(mode){
      if(mode === "B2B"){
        return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur + indemnité forfaitaire de recouvrement de 40 € (client professionnel).";
      }
      if(mode === "B2C"){
        return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur (client particulier).";
      }
      return "";
    }
    function getSelectedPenaltyMode(){
      if(penB2BEl.checked) return "B2B";
      if(penB2CEl.checked) return "B2C";
      return "";
    }
    function syncPenaltyText(){
      const mode = getSelectedPenaltyMode();
      penaltyTextEl.value = getPenaltyTemplate(mode);
    }
    penB2BEl.addEventListener("change", syncPenaltyText);
    penB2CEl.addEventListener("change", syncPenaltyText);

      const legal = [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • ");
      if(legal) lines.push(`<span class="mut">${esc(legal)}</span>`);
      const contact = [mail ? mail : "", phone ? phone : ""].filter(Boolean).join(" • ");
      if(contact) lines.push(`<span class="mut">${esc(contact)}</span>`);

    async function ensureQuoteNumber(uid, year){
      const counterId = `${uid}_${year}`;
      const counterRef = doc(db, "counters", counterId);

      const next = await runTransaction(db, async (tx)=>{
        const snap = await tx.get(counterRef);
        if(!snap.exists()){
          tx.set(counterRef, { quoteSeq: 0, invoiceSeq: 0, creditSeq: 0 });
        }
        const c = snap.exists() ? (snap.data() || {}) : { quoteSeq: 0 };
        const n = (Number(c.quoteSeq)||0) + 1;
        tx.set(counterRef, { ...c, quoteSeq: n }, { merge:true });
        return n;
      });

      const padded = String(next).padStart(4,"0");
      return `D${year}-${padded}`;
    }

      markAcceptedBtn.disabled = !!locked || !docId || !canMarkAccepted(d);
      saveBtn.style.opacity = locked ? "0.75" : "1";
    }

    function renderLinesAndTotals(){
      const d = quoteData || {};
      const bp = (profileData?.businessProfile || {});

      const tvaEnabled = !!bp.vat?.enabled;
      const tvaRate = Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0;

      thTVA.style.display = tvaEnabled ? "" : "none";
      linesTbody.innerHTML = "";
      linesCards.innerHTML = "";

      const lines = Array.isArray(d.lines) ? d.lines : [];

      for(const l of lines){
        const label = l?.label || "Ligne";
        const qty = Number(l?.qty)||0;
        const unit = l?.unit || "unité";
        const up = Number(l?.unitPrice)||0;

        const lineHT = qty * up;
        const lineTVA = tvaEnabled ? (lineHT * tvaRate) : 0;
        const lineTotal = lineHT + lineTVA;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="designation">${esc(label)}</td>
          <td class="num">${esc(qty)}</td>
          <td>${esc(unit)}</td>
          <td class="num">${esc(fmtMoney(up))}</td>
          <td class="num" style="${tvaEnabled ? "" : "display:none;"}">${tvaEnabled ? esc(fmtMoney(lineTVA)) : ""}</td>
          <td class="num">${esc(fmtMoney(lineTotal))}</td>
        `;
        linesTbody.appendChild(tr);

        const card = document.createElement("div");
        card.className = "lineCard";
        card.innerHTML = `
          <div class="t">${esc(label)}</div>
          <div class="g">
            <div><b>Qté</b> : ${esc(qty)}</div>
            <div><b>Unité</b> : ${esc(unit)}</div>
            <div><b>PU HT</b> : ${esc(fmtMoney(up))}</div>
            <div><b>Total TTC</b> : ${esc(fmtMoney(lineTotal))}</div>
          </div>
        `;
        linesCards.appendChild(card);
      }

      const totals = computeTotals(lines, tvaEnabled, tvaRate);
      amountEl.value = Number.isFinite(totals.ttc) ? totals.ttc.toFixed(2) : "";

      const html = [];
      if(tvaEnabled){
        html.push(`<div class="r"><span>Total HT</span><span>${esc(fmtMoney(totals.ht))}</span></div>`);
        html.push(`<div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>${esc(fmtMoney(totals.tva))}</span></div>`);
        html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
      }else{
        html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
        const ex = String(bp?.tvaExemptionText || "").trim();
        if(ex) html.push(`<div class="mutedLine">${esc(ex)}</div>`);
      }
      totalsBox.innerHTML = html.join("");
    }

    function renderRefsAndConditions(){
      const d = quoteData || {};
      const offerDays = Math.max(0, parseInt(offerValidityDaysEl.value || "30", 10) || 30);
      const payDays = termToDays(paymentTermEl.value);

      const offerUntil = addDaysLabel(todayIso(), offerDays);
      const dueUntil = addDaysLabel(todayIso(), payDays);

      const obj = (d.quoteObject || d.object || "").toString().trim();

      const refLines = [];
      refLines.push(`<div class="line"><b>Type</b> : Devis libre (sans logement)</div>`);
      refLines.push(`<div class="line"><b>Objet</b> : ${esc(obj || "Prestation de conciergerie")}</div>`);
      refLines.push(`<div class="line"><b>ID doc</b> : ${esc(docId || "—")}</div>`);
      refsKv.innerHTML = refLines.join("");

      const bp = (profileData?.businessProfile || {});
      const cancelPct = Number.isFinite(Number(bp?.conditions?.cancellationPercent))
        ? Number(bp.conditions.cancellationPercent)
        : 30;

      const c = [];
      c.push(`<div class="line"><b>Validité de l’offre</b> : jusqu’au ${esc(offerUntil)}</div>`);
      c.push(`<div class="line"><b>Échéance de paiement</b> : ${esc(dueUntil)} (${esc(dueLabel(paymentTermEl.value))})</div>`);
      c.push(`<div class="line"><b>Annulation</b> : ${esc(cancelPct)}% du montant peuvent être retenus selon conditions</div>`);
      c.push(`<div class="line"><b>Statut</b> : ${esc(quoteStatusLabel(d.quoteStatus || d.status))}</div>`);
      keyConditionsKv.innerHTML = c.join("");
    }

    function renderRecap(){
      const d = quoteData || {};
      const c = readClientInputs();

      const rows = [];
      rows.push(`<div class="line"><b>Devis</b> : libre (sans logement)</div>`);
      rows.push(`<div class="line"><b>Client</b> : ${esc(c.clientName || "—")}${c.clientEmail ? " • " + esc(c.clientEmail) : ""}</div>`);
      const addr = [c.clientAddress1, c.clientAddress2, [c.clientZip, c.clientCity].filter(Boolean).join(" ")].filter(Boolean);
      if(addr.length) rows.push(`<div class="line"><b>Adresse client</b> : ${esc(addr.join(" • "))}</div>`);
      recapKv.innerHTML = rows.join("");

      const qs = quoteStatusLabel(d.quoteStatus || d.status);
      statusBadge.textContent = `Devis: ${qs}`;

      const v = Number(d.quoteVersion || 1);
      versionLine.textContent = `v${v}`;
      docBannerInner.textContent = `DEVIS N° ${d.quoteNumber || "—"} • v${v}`;

      if(privateNoteEl.value === "" && d.quotePrivateNote) privateNoteEl.value = d.quotePrivateNote;

      if(d.quotePaymentTerm && paymentTermEl.value !== d.quotePaymentTerm) paymentTermEl.value = d.quotePaymentTerm;

      if(d.quotePaymentMode){
        setPayMode(d.quotePaymentMode);
      }else{
        setPayMode("VIREMENT");
      }

      if(Number.isFinite(Number(d.quoteOfferValidityDays))){
        offerValidityDaysEl.value = String(Math.max(0, parseInt(d.quoteOfferValidityDays, 10) || 30));
      }

      const penMode = String(d.quotePenaltyMode || "").toUpperCase();
      if(penMode === "B2B") penB2BEl.checked = true;
      if(penMode === "B2C") penB2CEl.checked = true;
      if(d.quotePenaltyText) penaltyTextEl.value = d.quotePenaltyText;
      else {
        if(!penB2BEl.checked && !penB2CEl.checked) penB2CEl.checked = true;
        syncPenaltyText();
      }

      renderBusinessHeader();
      renderLinesAndTotals();
      renderRefsAndConditions();

      previewBtn.disabled = !docId;
      markSentBtn.disabled = !(docId && canMarkSent(d));
      markAcceptedBtn.disabled = !(docId && canMarkAccepted(d));
    }

              ? `
                <div class="r"><span>Total HT</span><span>${esc(fmtMoney(totals.ht))}</span></div>
                <div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>${esc(fmtMoney(totals.tva))}</span></div>
                <div class="r big"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>
              `
              : `
                <div class="r big"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>
                ${String(bp?.tvaExemptionText||"").trim() ? `<div class="smallNote">${esc(bp.tvaExemptionText)}</div>` : `<div class="smallNote">TVA non applicable, art. 293B du CGI.</div>`}
              `
          }
        </div>

        <div class="boxes" style="margin-top:12px;">
          <div class="box">
            <div class="boxTitle">Paiement</div>
            <div class="pLine"><b>Délai</b> : ${esc(dueLabel(paymentTermEl.value))}</div>
            <div class="pLine"><b>Mode</b> : ${esc(payModeLabel(payMode))}</div>
            ${(cIban || cBic) ? `
              <div style="margin-top:10px; border-top:1px solid rgba(0,0,0,.10); padding-top:8px;">
                ${cIban ? `<div class="pLine">IBAN : ${esc(cIban)}</div>` : ``}
                ${cBic ? `<div class="pLine">BIC : ${esc(cBic)}</div>` : ``}
              </div>
            ` : ``}
          </div>

          <div class="box">
            <div class="boxTitle">Conditions clés</div>
            <div class="pLine">• Validité de l’offre : jusqu’au ${esc(offerUntil)}</div>
            <div class="pLine">• Échéance : ${esc(dueUntil)} (${esc(dueLabel(paymentTermEl.value))})</div>
            <div class="pLine">• Annulation : ${esc(cancelPct)}% selon conditions</div>
            <div class="pLine">• Statut : ${esc(quoteStatusLabel(d.quoteStatus || d.status))}</div>
          </div>
        </div>

        <div class="boxes" style="margin-top:10px;">
          <div class="box">
            <div class="boxTitle">Pénalités</div>
            <div class="pLine"><b>Client</b> : ${esc(getSelectedPenaltyMode()==="B2B" ? "Professionnel" : "Particulier")}</div>
            <div class="pLine" style="margin-top:6px; white-space:pre-wrap;">${esc(penaltyTextEl.value || "—")}</div>
          </div>

          <div class="box">
            <div class="boxTitle">Acceptation</div>
            <div class="pLine">☐ J’accepte les conditions générales (CGV) accessibles dans l’app.</div>
            <div class="pLine" style="margin-top:8px;"><b>Bon pour accord</b> (client)</div>
            <div class="smallNote">Signature + date</div>
            <div style="height:42px;border-bottom:1px dashed rgba(0,0,0,.35);margin-top:6px;"></div>
            <div class="pLine" style="margin-top:8px;">Nom : ${esc(c.clientName || "—")}</div>
          </div>
        </div>

        <div class="signRow">
          <div class="signBox">
            <div class="boxTitle">Signature conciergerie</div>
            <div class="signLine"></div>
            <div class="signName">${esc(cSignName)}</div>
          </div>
        </div>

        <div class="footer">
          <div>${esc(footerLine)}</div>
          <div>${esc(tvaFooter)}</div>
        </div>
      `;
    }

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      location.href = "index.html";
    });

    previewBtn.addEventListener("click", ()=>{
      if(!docId) return alert("Enregistre d’abord le devis (docId manquant).");
      renderRefsAndConditions();
      const html = buildPreviewHtmlString();
      openPrintWindow(html);
    });

    paymentTermEl.addEventListener("change", ()=> renderRefsAndConditions());
    offerValidityDaysEl.addEventListener("input", ()=> renderRefsAndConditions());

    async function loadQuoteById(){
      if(!docId) return;
      quoteRef = doc(db, "salesDocuments", docId);
      const snap = await getDoc(quoteRef);
      if(!snap.exists()) throw new Error("Devis libre introuvable.");
      quoteData = { id: snap.id, ...(snap.data()||{}) };

      if(quoteData.conciergerieUid && currentUser?.uid && quoteData.conciergerieUid !== currentUser.uid){
        throw new Error("Accès refusé (doc d’une autre conciergerie).");
      }

      renderClientInputsFromDoc(quoteData);
      renderRecap();
    }

    async function createNewDocIfNeeded(){
      if(docId) return;
      const year = new Date().getFullYear();
      const quoteNumber = await ensureQuoteNumber(currentUser.uid, year);

      const newRef = doc(db, "salesDocuments", crypto.randomUUID());
      docId = newRef.id;
      quoteRef = newRef;

      const client = readClientInputs();
      if(!client.clientName || !client.clientEmail){
        throw new Error("Client : nom + email obligatoires (devis libre).");
      }

      const patch = {
        conciergerieUid: currentUser.uid,
        docType: "QUOTE_FREE",
        quoteNumber,
        quoteVersion: 1,
        quoteStatus: "DRAFT",
        commercialStatus: "DEVIS",

        clientName: client.clientName,
        clientEmail: client.clientEmail,
        clientAddress1: client.clientAddress1,
        clientAddress2: client.clientAddress2,
        clientZip: client.clientZip,
        clientCity: client.clientCity,

        lines: [],
        quotePaymentTerm: paymentTermEl.value,
        quotePaymentMode: (getSelectedPayMode() || "VIREMENT"),
        quoteOfferValidityDays: Math.max(0, parseInt(offerValidityDaysEl.value || "30", 10) || 30),

        quotePenaltyMode: getSelectedPenaltyMode() || "B2C",
        quotePenaltyText: (penaltyTextEl.value || getPenaltyTemplate(getSelectedPenaltyMode() || "B2C")).trim(),

        quotePrivateNote: (privateNoteEl.value || "").trim(),

        createdAt: serverTimestamp(),
        quoteUpdatedAt: serverTimestamp(),
        commercialUpdatedAt: serverTimestamp()
      };

      await setDoc(newRef, patch, { merge:false });

      // refresh
      const snap = await getDoc(newRef);
      quoteData = { id: snap.id, ...(snap.data()||{}) };

      // inject docId into URL for stability
      const url = new URL(location.href);
      url.searchParams.set("docId", docId);
      history.replaceState({}, "", url.toString());
    }

    saveBtn.addEventListener("click", async ()=>{
      hideAlert();
      lockUI(true);
      try{
        await createNewDocIfNeeded();

        const client = readClientInputs();
        if(!client.clientName || !client.clientEmail){
          throw new Error("Client : nom + email obligatoires (devis libre).");
        }

        const qs = String(quoteData?.quoteStatus || "DRAFT").toUpperCase();
        const keep = (qs === "SENT" || qs === "ACCEPTED" || qs === "REFUSED") ? qs : "DRAFT";

        const patch = {
          clientName: client.clientName,
          clientEmail: client.clientEmail,
          clientAddress1: client.clientAddress1,
          clientAddress2: client.clientAddress2,
          clientZip: client.clientZip,
          clientCity: client.clientCity,

          quoteStatus: keep,
          commercialStatus: "DEVIS",

          quoteOfferValidityDays: Math.max(0, parseInt(offerValidityDaysEl.value || "30", 10) || 30),
          quotePaymentTerm: paymentTermEl.value,
          quotePaymentMode: (getSelectedPayMode() || "VIREMENT"),

          quotePenaltyMode: getSelectedPenaltyMode(),
          quotePenaltyText: (penaltyTextEl.value || "").trim(),

          quotePrivateNote: (privateNoteEl.value || "").trim(),
          quoteUpdatedAt: serverTimestamp(),
          commercialUpdatedAt: serverTimestamp()
        };

        await updateDoc(quoteRef, patch);

        const snap = await getDoc(quoteRef);
        quoteData = { id: snap.id, ...(snap.data()||{}) };

        showAlert("✅ Devis libre enregistré.", true);
        renderRecap();
      }catch(err){
        console.error(err);
        showAlert("Erreur sauvegarde : " + (err?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    });

    markSentBtn.addEventListener("click", async ()=>{
      hideAlert();
      if(!docId || !quoteRef) return showAlert("Enregistre d’abord le devis.");
      const qs = String(quoteData?.quoteStatus || "").toUpperCase();
      if(qs !== "DRAFT") return showAlert("⛔ Action impossible : le devis n'est pas en brouillon.");

      lockUI(true);
      try{
        await updateDoc(quoteRef, {
          commercialStatus: "DEVIS_ENVOYE",
          quoteStatus: "SENT",
          quotePaymentTerm: paymentTermEl.value,
          quotePaymentMode: (getSelectedPayMode() || "VIREMENT"),
          quoteOfferValidityDays: Math.max(0, parseInt(offerValidityDaysEl.value || "30", 10) || 30),
          quoteSentAt: serverTimestamp(),
          commercialUpdatedAt: serverTimestamp()
        });

        const snap = await getDoc(quoteRef);
        quoteData = { id: snap.id, ...(snap.data()||{}) };

        showAlert("✅ Statut : devis envoyé.", true);
        renderRecap();
      }catch(err){
        console.error(err);
        showAlert("Erreur statut : " + (err?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    });

    markAcceptedBtn.addEventListener("click", async ()=>{
      hideAlert();
      if(!docId || !quoteRef) return showAlert("Enregistre d’abord le devis.");
      const qs = String(quoteData?.quoteStatus || "").toUpperCase();
      if(qs !== "SENT") return showAlert("⛔ Action impossible : le devis doit être “envoyé”.");
      if(!confirm("Marquer ce devis comme ACCEPTÉ ?")) return;

      lockUI(true);
      try{
        await updateDoc(quoteRef, {
          commercialStatus: "DEVIS_ACCEPTE",
          quoteStatus: "ACCEPTED",
          quoteAcceptedAt: serverTimestamp(),
          commercialUpdatedAt: serverTimestamp()
        });

        const snap = await getDoc(quoteRef);
        quoteData = { id: snap.id, ...(snap.data()||{}) };

        showAlert("✅ Devis accepté.", true);
        renderRecap();
      }catch(err){
        console.error(err);
        showAlert("Erreur statut : " + (err?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }
      currentUser = user;
      docId = getParam("docId");

      try{
        await loadProfile(currentUser.uid);

        // defaults UI
        penB2CEl.checked = true;
        syncPenaltyText();
        setPayMode("VIREMENT");
        renderBusinessHeader();

        if(docId){
          await loadQuoteById();
        }else{
          // nouveau devis libre (pas encore créé)
          quoteData = { quoteVersion: 1, quoteStatus: "DRAFT", lines: [] };
          renderRecap();
          previewBtn.disabled = true;
          markSentBtn.disabled = true;
          markAcceptedBtn.disabled = true;
        }
      }catch(e){
        showAlert("⛔ " + (e.message || "Erreur chargement devis"), false);
      }
    });
  </script>
</body>
</html>
