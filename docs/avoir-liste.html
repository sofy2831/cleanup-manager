<!-- docs/avoir-liste.html (FINAL — CREDIT list, même présentation que devis/factures + bloc TOTAUX au-dessus, pas de texte technique) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Avoirs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e;
      --ok:#1b8f4d;
      --warn:#b06b00;
      --card: rgba(255,255,255,.86);
    }

    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:12px 12px 24px;
      padding-bottom:88px;
    }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:8px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }

    .pill-link{
      display:inline-flex; align-items:center; gap:8px;
      padding:7px 11px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:12.5px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; cursor:pointer;
    }

    .logo-title{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:6px; margin-bottom:2px; text-align:center;
    }
    .logo-icon{
      width:64px; height:64px; border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex; align-items:center; justify-content:center;
      color:var(--violet); font-size:18px; font-weight:900;
      position:relative; flex-shrink:0; overflow:hidden;
    }
    .logo-icon img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:20px; font-weight:900; color:#111; line-height:1.1; }
    .subtitle{
      font-size:13px; color:#444; margin-top:2px;
      text-align:center; font-weight:800;
    }
    .badge{
      margin-top:8px; padding:3px 9px; border-radius:999px; background:#fff;
      font-size:11.5px; color:#555; box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center; font-weight:900; white-space:pre-wrap;
    }

    .wrap{ width:100%; max-width:1100px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }

    .searchRow{
      width:100%;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      border-radius:18px;
      padding:10px;
    }
    .searchRow .field{ flex:1; min-width:220px; }
    label{ display:block; font-size:11.8px; font-weight:1000; color:#333; margin:0 0 4px; }
    input{
      width:100%; padding:9px 11px; border-radius:12px; border:1px solid #D3C7FF;
      font-size:13px; outline:none; background:#fff; font-weight:800; color:#111;
    }
    input:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .btn{
      border:none; border-radius:999px;
      padding:8px 10px;
      font-size:12px; font-weight:1000;
      cursor:pointer;
      background:#fff; color:var(--violet);
      border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
      user-select:none;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; pointer-events:none; }

    .totalsCard{
      width:100%;
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:12px;
      display:none;
    }
    .totalsGrid{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:10px;
    }
    @media(max-width:720px){
      .totalsGrid{ grid-template-columns: 1fr; }
    }
    .tBox{
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:10px 12px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      background:#fff;
    }
    .tBox .t{ font-size:11px; color:#666; font-weight:900; }
    .tBox .v{ margin-top:2px; font-size:14px; color:#111; font-weight:1000; }
    .totalsNote{
      margin-top:8px; font-size:12px; color:#666; font-weight:850;
    }

    .alert{
      margin-top:8px; padding:9px 11px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
      font-weight:800;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .card{
      width:100%;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:12px;
      backdrop-filter: blur(10px);
      display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
    }
    .left{ min-width:0; flex:1; }
    .row1{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .num{ font-weight:1000; font-size:13.5px; color:#111; }
    .statusPill{
      padding:3px 8px; border-radius:999px; background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      font-size:11px; font-weight:1000; color:#555;
    }
    .statusPill.ok{ border-color: rgba(27,143,77,0.30); color: var(--ok); }
    .statusPill.bad{ border-color: rgba(179,38,30,0.25); color: var(--bad); }
    .statusPill.warn{ border-color: rgba(176,107,0,0.25); color: var(--warn); }

    .meta{
      margin-top:6px;
      font-size:12px; color:#222; font-weight:850; line-height:1.25;
      display:flex; flex-direction:column; gap:3px;
      word-break:break-word;
    }
    .mut{ color:var(--muted); font-weight:900; }

    .right{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; flex-shrink:0; }

    .empty{
      background:#fff; border:1px solid rgba(0,0,0,0.06);
      border-radius:18px; box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:14px; font-weight:900; color:#555; text-align:center;
    }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:10.8px; font-weight:1000; text-decoration:none;
      color:#666; padding:9px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 980px){
      .bottom-nav{
        position: static; max-width: 1100px; margin: 10px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 24px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" href="compta.html">← Comptabilité</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon" id="logoIcon">
        <img id="logoImg" alt="Logo">
        <span id="logoFallback">✓</span>
      </div>
      <h1 id="pageTitle">Conciergerie</h1>
    </div>

    <div class="subtitle">Avoirs</div>
    <div class="badge" id="companyBadge">—</div>

    <div class="wrap">
      <div class="searchRow">
        <div class="field">
          <label for="searchInput">Recherche</label>
          <input id="searchInput" type="text" placeholder="N° avoir, client, logement, facture…" />
        </div>
        <button class="btn" id="clearBtn" type="button">Effacer</button>
        <button class="btn primary" id="refreshBtn" type="button">Rafraîchir</button>
      </div>

      <div class="totalsCard" id="totalsCard">
        <div style="font-weight:1000; margin-bottom:10px;">Totaux (avoirs affichés)</div>
        <div class="totalsGrid" id="totalsGrid"></div>
        <div class="totalsNote" id="totalsNote"></div>
      </div>

      <div class="alert" id="alertBox"></div>
      <div id="list"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opération</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, collection, query, where, orderBy, limit, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const listEl = document.getElementById("list");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");
    const pageTitleEl = document.getElementById("pageTitle");
    const companyBadge = document.getElementById("companyBadge");

    const totalsCard = document.getElementById("totalsCard");
    const totalsGrid = document.getElementById("totalsGrid");
    const totalsNote = document.getElementById("totalsNote");

    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    let currentUser = null;
    let allItems = [];
    let vatEnabled = false;
    let vatRate = 0;

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function normalize(s){ return String(s||"").trim().toLowerCase(); }

    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }
    function ddmmyyyyFromTs(ts){
      try{
        const d = ts?.toDate ? ts.toDate() : (ts?.seconds ? new Date(ts.seconds*1000) : null);
        if(!d) return "—";
        return d.toLocaleDateString("fr-FR");
      }catch(_){ return "—"; }
    }

    function computeHT(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((sum,l)=> sum + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }

    function computeTotals(d){
      const htS  = Number(d?.totalHT);
      const tvaS = Number(d?.totalTVA);
      const ttcS = Number(d?.totalTTC);

      if(Number.isFinite(htS) && Number.isFinite(ttcS)){
        return { ht: htS, tva: Number.isFinite(tvaS) ? tvaS : Math.max(0, ttcS-htS), ttc: ttcS };
      }

      const ht = computeHT(d?.lines);
      const tva = vatEnabled ? (ht * (Number(vatRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    function creditStatusRaw(d){
      return String(d?.creditStatus || d?.avoirStatus || d?.status || "").toUpperCase().trim();
    }
    function statusLabel(d){
      const st = creditStatusRaw(d);
      if(st === "ISSUED") return { txt:"ÉMIS", cls:"ok" };
      if(st === "SENT") return { txt:"ENVOYÉ", cls:"" };
      if(st === "CANCELLED" || st === "VOID") return { txt:"ANNULÉ", cls:"bad" };
      if(st === "DRAFT") return { txt:"BROUILLON", cls:"" };
      return { txt: st || "—", cls:"" };
    }

    function getCreditNumber(d){
      return String(d?.creditNumber || d?.avoirNumber || d?.creditNoteNumber || d?.docNumber || "").trim();
    }
    function getLinkedInvoiceInfo(d){
      const fromDocId = String(d?.fromDocId || d?.invoiceDocId || d?.fromInvoiceDocId || "").trim();
      const fromInv = String(d?.fromInvoiceNumber || d?.invoiceNumberRef || d?.invoiceNumber || "").trim();
      return { fromDocId, fromInv };
    }

    function renderItem(id, d){
      const num = getCreditNumber(d) || "—";
      const client = String(d?.clientName || "—").trim();
      const email = String(d?.clientEmail || "").trim();
      const home = String(d?.homeName || d?.homeAddress || "—").trim();
      const created = ddmmyyyyFromTs(d?.createdAt || d?.creditCreatedAt || d?.updatedAt || d?.creditIssuedAt || d?.creditIssuedDate);

      const totals = computeTotals(d);
      const st = statusLabel(d);
      const link = getLinkedInvoiceInfo(d);

      const invoiceLabel = link.fromInv
        ? link.fromInv
        : (link.fromDocId ? `#${link.fromDocId.slice(0,6)}` : "—");

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="left">
          <div class="row1">
            <span class="num">AVOIR N° ${esc(num)}</span>
            <span class="statusPill ${esc(st.cls)}">${esc(st.txt)}</span>
          </div>
          <div class="meta">
            <div><span class="mut">Client :</span> ${esc(client)}${email ? ` <span class="mut">•</span> ${esc(email)}` : ""}</div>
            <div><span class="mut">Logement :</span> ${esc(home)}</div>
            <div><span class="mut">Facture liée :</span> ${esc(invoiceLabel)} <span class="mut">•</span> <span class="mut">Date :</span> ${esc(created)} <span class="mut">•</span> <span class="mut">Total :</span> ${esc(fmtMoney(totals.ttc))}</div>
          </div>
        </div>
        <div class="right">
          <button class="btn primary" data-open="${esc(id)}" type="button">Ouvrir</button>
          ${link.fromDocId ? `<button class="btn" data-inv="${esc(link.fromDocId)}" type="button">Voir facture</button>` : ``}
        </div>
      `;

      card.querySelector('[data-open]')?.addEventListener("click", (e)=>{
        const docId = e.currentTarget.getAttribute("data-open");
        if(docId) location.href = `avoir.html?docId=${encodeURIComponent(docId)}`;
      });

      card.querySelector('[data-inv]')?.addEventListener("click", (e)=>{
        const invId = e.currentTarget.getAttribute("data-inv");
        if(invId) location.href = `facture.html?docId=${encodeURIComponent(invId)}`;
      });

      return card;
    }

    function renderTotals(filtered){
      if(!filtered.length){
        totalsCard.style.display = "none";
        totalsGrid.innerHTML = "";
        totalsNote.textContent = "";
        return;
      }
      let sumHT=0, sumTVA=0, sumTTC=0;
      for(const it of filtered){
        const t = computeTotals(it.data || {});
        sumHT += (Number(t.ht)||0);
        sumTVA += (Number(t.tva)||0);
        sumTTC += (Number(t.ttc)||0);
      }
      totalsCard.style.display = "block";
      totalsGrid.innerHTML = `
        <div class="tBox"><div class="t">Total HT</div><div class="v">${fmtMoney(sumHT)}</div></div>
        <div class="tBox"><div class="t">TVA</div><div class="v">${fmtMoney(sumTVA)}</div></div>
        <div class="tBox"><div class="t">Total TTC</div><div class="v">${fmtMoney(sumTTC)}</div></div>
      `;
      totalsNote.textContent = vatEnabled
        ? `TVA activée (${Math.round((Number(vatRate)||0)*100)}%). Totaux calculés sur les avoirs affichés.`
        : `TVA non applicable. Totaux calculés sur les avoirs affichés.`;
    }

    function renderList(filtered){
      listEl.innerHTML = "";
      renderTotals(filtered);

      if(!filtered.length){
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Aucun avoir trouvé.";
        listEl.appendChild(empty);
        return;
      }
      for(const it of filtered){
        listEl.appendChild(renderItem(it.id, it.data));
      }
    }

    function applySearch(){
      const q = normalize(searchInput.value);
      if(!q){
        renderList(allItems);
        return;
      }
      const filtered = allItems.filter(it=>{
        const d = it.data || {};
        const num = getCreditNumber(d);
        const home = String(d?.homeName || d?.homeAddress || "").trim();
        const link = getLinkedInvoiceInfo(d);

        const hay = [
          num,
          d?.clientName, d?.clientEmail,
          home,
          link?.fromInv, link?.fromDocId
        ].map(x=>normalize(x)).join(" | ");

        return hay.includes(q);
      });
      renderList(filtered);
    }

    async function loadProfile(uid){
      const uSnap = await getDoc(doc(db, "users", uid));
      const profile = uSnap.exists() ? (uSnap.data() || {}) : {};
      const bp = profile.businessProfile || {};

      const cName = String(bp.companyName || "Conciergerie").trim();
      const logoUrl = String(bp.logoUrl || "").trim();

      const vat = bp.vat || {};
      vatEnabled = !!vat.enabled;
      vatRate = Number.isFinite(Number(vat.rate)) ? Number(vat.rate) : 0;

      pageTitleEl.textContent = cName || "Conciergerie";
      document.title = `${cName || "Conciergerie"} — Avoirs`;
      companyBadge.textContent = cName || "Conciergerie";

      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }
    }

    async function loadCredits(uid){
      hideAlert();
      listEl.innerHTML = "";

      const qy = query(
        collection(db, "salesDocuments"),
        where("conciergerieUid", "==", uid),
        where("type", "==", "CREDIT"),
        where("listable", "==", true),
        orderBy("createdAt", "desc"),
        limit(300)
      );

      const snap = await getDocs(qy);

      allItems = [];
      snap.forEach(d=>{
        allItems.push({ id: d.id, data: (d.data() || {}) });
      });

      renderList(allItems);

      if(snap.empty){
        showAlert("Aucun avoir pour le moment.", true);
      }
    }

    clearBtn.addEventListener("click", ()=>{
      searchInput.value = "";
      applySearch();
    });

    refreshBtn.addEventListener("click", async ()=>{
      if(!currentUser) return;
      try{
        await loadCredits(currentUser.uid);
        showAlert("✅ Liste rafraîchie.", true);
        setTimeout(()=>hideAlert(), 1200);
      }catch(e){
        console.error(e);
        showAlert("⛔ " + (e?.message || "Erreur rafraîchissement"), false);
      }
    });

    searchInput.addEventListener("input", applySearch);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }
      currentUser = user;

      try{
        await loadProfile(user.uid);
        await loadCredits(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ " + (e?.message || "Erreur chargement avoirs"), false);
      }
    });
  </script>
</body>
</html>
