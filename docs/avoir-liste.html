<!-- docs/avoir-liste.html (FINAL — liste des avoirs type:"CREDIT", calquée sur factures-liste) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Avoirs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px;
      cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .logo-title{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; margin-bottom:6px; text-align:center; }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:22px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }
    .helloLine{ margin-top:10px; font-size:13px; color:#333; font-weight:900; text-align:center; }
    .companyLine{ margin-top:4px; font-size:13px; color:var(--muted); font-weight:900; text-align:center; }

    .wrap{ width:100%; max-width:980px; margin-top:14px; display:flex; flex-direction:column; gap:12px; min-width:0; }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .toolbar{
      display:grid;
      grid-template-columns: 220px 1fr;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:720px){ .toolbar{ grid-template-columns: 1fr; } }

    .select{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.35);
      background:#fff;
      font-weight:900;
      color:#222;
      outline:none;
    }
    .searchbar{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      min-width:0;
    }
    .s-ico{ font-size:14px; opacity:.75; }
    .input{
      flex:1;
      border:none;
      outline:none;
      font-size:13px;
      font-weight:900;
      color:#111;
      background:transparent;
      min-width:0;
    }

    .btn{
      display:inline-flex; justify-content:center; align-items:center; gap:8px;
      padding:10px 12px; border-radius:999px;
      border:none; cursor:pointer; text-decoration:none;
      font-weight:900; font-size:12px;
      background:#fff; color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
      user-select:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff; border-color:transparent;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }
    .btn[aria-disabled="true"]{ opacity:.45; pointer-events:none; }

    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:#333;
      white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    .line6{
      display:grid;
      grid-template-columns: 110px 160px 1.2fr 1.2fr 1.1fr 130px;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:900px){
      .line6{ grid-template-columns: 110px 160px 1fr 1fr; grid-auto-rows:auto; }
    }
    @media(max-width:560px){
      .line6{ grid-template-columns: 1fr 1fr; }
    }
    .cell{ min-width:0; }
    .cell .t{ font-size:11px; color:#666; font-weight:900; }
    .cell .v{ font-size:13px; color:#111; font-weight:900; }
    .cell .v.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .tag{
      display:inline-flex; align-items:center; justify-content:center;
      padding:4px 8px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:var(--violet);
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:flex-start;
      min-width:0;
      margin-top:10px;
    }
    .k{ min-width:220px; display:flex; flex-direction:column; gap:3px; min-width:0; }
    .k .t{ font-size:12px; color:#666; font-weight:900; }
    .k .v{ font-size:13px; color:#111; font-weight:900; }

    .actionsBar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      width:100%;
    }
    @media(max-width:560px){
      .actionsBar{ justify-content:stretch; }
      .actionsBar .btn{ flex:1 1 48%; }
      .actionsBar .btn.primary{ flex:1 1 100%; }
    }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; gap: 6px; justify-content: space-around; align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none;
      font-size: 11px; font-weight: 900; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        width: 100%;
        max-width: 980px;
        margin: 14px 0 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px;
        gap: 10px;
      }
      .bottom-nav a{ font-size: 13px; padding: 12px 12px; }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="compta.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon">A</div>
      <h1>Avoirs</h1>
    </div>

    <div class="subtitle">Suivi des avoirs</div>
    <div class="helloLine" id="helloLine">Bonjour,</div>
    <div class="companyLine" id="companyLine">—</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="card">
        <div class="toolbar">
          <select class="select" id="filterStatus">
            <option value="ALL">Tous</option>
            <option value="ISSUED">Émis</option>
            <option value="MISSING">Sans statut</option>
          </select>

          <div class="searchbar" title="Recherche">
            <span class="s-ico">🔎</span>
            <input class="input" id="searchInput" type="search" placeholder="Rechercher (n° avoir, facture, client, logement…)" autocomplete="off" />
          </div>
        </div>

        <div style="margin-top:10px; font-size:12px; color:#666; font-weight:850;">
          Un avoir est créé depuis une facture (bouton “Avoir” dans la liste des factures).
        </div>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, orderBy, limit, getDocs, doc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const helloLine = document.getElementById("helloLine");
    const companyLine = document.getElementById("companyLine");
    const alertBox = document.getElementById("alertBox");

    const filterStatus = document.getElementById("filterStatus");
    const searchInput = document.getElementById("searchInput");
    const listBox = document.getElementById("listBox");

    let all = [];

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }
    function fmtDateFR(x){
      if(!x) return "—";
      try{
        if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
        const s = String(x).trim();
        if(!s) return "—";
        if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
        const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if(m) return `${m[3]}/${m[2]}/${m[1]}`;
        const d = new Date(s);
        if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
        return "—";
      }catch{ return "—"; }
    }

    function getStatusRaw(x){
      return String(x?.creditStatus||"").toUpperCase().trim();
    }
    function getStatusDisplay(x){
      const raw = getStatusRaw(x);
      return raw || "MISSING";
    }
    function badgeForStatus(display){
      const s = String(display||"").toUpperCase().trim();
      if(s === "ISSUED") return `<span class="badge ok">Émis</span>`;
      return `<span class="badge bad">Sans statut</span>`;
    }

    function matchesFilter(item){
      const f = filterStatus.value;
      const disp = getStatusDisplay(item);
      const raw = getStatusRaw(item);
      if(f === "ALL") return true;
      if(f === "MISSING") return !raw;
      return disp === f;
    }

    function matchesSearch(item){
      const q = (searchInput.value||"").trim().toLowerCase();
      if(!q) return true;

      const hay = [
        item.creditNumber, item.fromInvoiceNumber, item.quoteNumber,
        item.clientName, item.clientEmail,
        item.homeName, item.homeCity, item.homeAddress, item.homeZip,
        item.creditReason
      ].filter(Boolean).join(" ").toLowerCase();

      return hay.includes(q);
    }

    function getFiltered(){
      return all.filter(e => matchesFilter(e) && matchesSearch(e));
    }

    function getCreatedAt(x){
      if(x?.createdAt?.toDate?.()) return x.createdAt.toDate().toLocaleDateString("fr-FR");
      if(x?.createdAt) return fmtDateFR(x.createdAt);
      if(x?.createdAtMs) return fmtDateFR(new Date(Number(x.createdAtMs)));
      if(x?.snapAtMs) return fmtDateFR(new Date(Number(x.snapAtMs)));
      return "—";
    }

    function render(){
      const filtered = getFiltered();
      listBox.innerHTML = "";

      if(!filtered.length){
        listBox.innerHTML = `
          <div class="card">
            <b>Aucun avoir</b>
            <div style="margin-top:6px; font-size:12px; color:#666; font-weight:800;">
              Ajuste le filtre ou la recherche.
            </div>
          </div>`;
        return;
      }

      for(const x of filtered){
        const created = getCreatedAt(x);
        const creditNum = String(x.creditNumber || "—").trim();
        const invRef = String(x.fromInvoiceNumber || "—").trim();

        const client = String(x.clientName || x.ownerName || "—").trim();
        const home = String(x.homeName || "—").trim();

        const period = (x.arrivalDateKey || x.departureDateKey)
          ? `${fmtDateFR(x.arrivalDateKey)} → ${fmtDateFR(x.departureDateKey)}`
          : "—";

        const stDisp = getStatusDisplay(x);

        const ttc = Number(x.totalTTC);
        const total = Number.isFinite(ttc) ? ttc : 0;

        const openHref = `avoir.html?docId=${encodeURIComponent(x.id)}`;
        const previewHref = `avoir-apercu.html?docId=${encodeURIComponent(x.id)}`;
        const factureHref = x.fromDocId ? `facture.html?docId=${encodeURIComponent(x.fromDocId)}` : "#";

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="line6">
            <div class="cell">
              <div class="t">Créé</div>
              <div class="v">${esc(created)}</div>
            </div>

            <div class="cell">
              <div class="t">N°</div>
              <div class="v">
                <span class="tag">AV</span>
                <span style="margin-left:6px;">${esc(creditNum)}</span>
              </div>
              <div class="t" style="margin-top:4px;">Facture : ${esc(invRef)}</div>
            </div>

            <div class="cell">
              <div class="t">Client</div>
              <div class="v ellipsis" title="${esc(client)}">${esc(client)}</div>
            </div>

            <div class="cell">
              <div class="t">Logement</div>
              <div class="v ellipsis" title="${esc(home)}">${esc(home)}</div>
            </div>

            <div class="cell">
              <div class="t">Période</div>
              <div class="v ellipsis" title="${esc(period)}">${esc(period)}</div>
            </div>

            <div class="cell" style="text-align:right;">
              <div class="t">Total TTC</div>
              <div class="v">${fmtMoney(total)}</div>
            </div>
          </div>

          <div class="row">
            <div class="k">
              <div class="t">Statut</div>
              <div class="v">${badgeForStatus(stDisp)}</div>
              <div class="t" style="margin-top:4px;">Motif : ${esc(String(x.creditReason || "—"))}</div>
            </div>

            <div class="k" style="align-items:flex-end; min-width:280px;">
              <div class="actionsBar">
                <a class="btn primary" href="${openHref}">Ouvrir</a>
                <a class="btn" href="${previewHref}">Aperçu</a>
                <a class="btn" href="${factureHref}" ${x.fromDocId ? "" : `aria-disabled="true"`}>Facture</a>
              </div>
            </div>
          </div>
        `;
        listBox.appendChild(div);
      }
    }

    async function loadCompanyName(uid){
      try{
        const snap = await getDoc(doc(db, "users", uid));
        const data = snap.exists() ? (snap.data()||{}) : {};
        const name = String(data?.businessProfile?.companyName || "").trim();
        return name || "Conciergerie";
      }catch{
        return "Conciergerie";
      }
    }

    async function loadCredits(uid){
      const qC = query(
        collection(db, "salesDocuments"),
        where("conciergerieUid", "==", uid),
        where("type", "==", "CREDIT"),
        where("listable", "==", true),
        orderBy("createdAt", "desc"),
        limit(400)
      );
      const snap = await getDocs(qC);
      all = snap.docs.map(d => ({ id: d.id, ...(d.data()||{}) }));
      render();
    }

    filterStatus.addEventListener("change", render);
    searchInput.addEventListener("input", render);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }

      helloLine.textContent = "Bonjour,";
      companyLine.textContent = await loadCompanyName(user.uid);

      hideAlert();
      try{
        await loadCredits(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur chargement avoirs : " + (e?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
