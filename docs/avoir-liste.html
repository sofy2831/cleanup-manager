<!-- docs/avoir-liste.html (FINAL — salesDocuments only, liste des AVOIRS, style calqué facture-liste) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Avoirs</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-light:#F3ECFF;
      --violet-mid:#DCCBFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --bad:#b3261e;
      --ok:#1b8f4d;
    }
    *{ box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:16px 16px 32px; padding-bottom:96px;
    }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill-link{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main); color:var(--violet-main);
      text-decoration:none; font-weight:900; font-size:13px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; cursor:pointer;
    }

    .logo-title{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:10px; margin-bottom:6px; text-align:center;
    }
    .logo-icon{
      width:40px;height:40px;border-radius:50%;
      background:#fff; border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0; overflow:hidden;
    }
    .logo-icon img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:24px; font-weight:900; color:#111; }
    .subtitle{ font-size:15px; color:#444; margin-top:4px; text-align:center; }

    .badge{
      margin-top:10px; padding:4px 10px; border-radius:999px; background:#fff;
      font-size:12px; color:#555; box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center; font-weight:900; white-space:pre-wrap;
    }

    .wrap{
      width:100%;
      max-width:1100px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .card{
      width:100%;
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius:18px;
      box-shadow: var(--shadow);
      padding:14px 14px 16px;
      backdrop-filter: blur(10px);
    }

    .card-title{
      font-size:16px; font-weight:1000; margin-bottom:10px;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
    }
    .small{ font-size:12px; color:var(--muted); line-height:1.35; font-weight:800; }

    .alert{
      margin-top:10px; padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .filters{
      display:flex; gap:10px; flex-wrap:wrap;
      margin-top:6px;
      align-items:center;
    }
    .input{
      flex:1;
      min-width:220px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      background:#fff;
      font-size:14px;
      font-weight:800;
      color:#111;
      outline:none;
    }
    .input:focus{
      border-color:var(--violet-main);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }
    .select{
      min-width:180px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      background:#fff;
      font-size:14px;
      font-weight:900;
      color:#111;
      outline:none;
    }
    .select:focus{
      border-color:var(--violet-main);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }
    .btn{
      border:none; border-radius:999px; padding:10px 12px;
      font-size:13px; font-weight:1000; cursor:pointer;
      background:#fff; color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff; box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .tableWrap{
      overflow:auto;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.04);
      background:#fff;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      margin-top:10px;
    }
    table{ width:100%; border-collapse:collapse; min-width:860px; }
    th, td{
      padding:10px 10px; border-bottom:1px solid rgba(0,0,0,0.05);
      text-align:left; font-size:12.5px; vertical-align:top;
    }
    th{
      font-size:12px; color:#444; font-weight:1000;
      background:rgba(248,244,255,.7);
      position:sticky; top:0;
      z-index:1;
    }
    td.num, th.num{ text-align:right; white-space:nowrap; }
    .chip{
      display:inline-flex; align-items:center; padding:4px 10px; border-radius:999px;
      font-weight:1000; font-size:11px; background:rgba(248,244,255,.9);
      border:1px solid rgba(122,92,255,0.22); color:#333;
      white-space:nowrap;
    }

    .actionsCell{
      display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;
    }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:11px; font-weight:1000; text-decoration:none;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width:980px){
      .bottom-nav{
        position: static; max-width: 1100px; margin: 12px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" href="compta.html">← Comptabilité</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon" id="logoIcon">
        <img id="logoImg" alt="Logo">
        <span id="logoFallback">✓</span>
      </div>
      <h1 id="appTitle">—</h1>
    </div>

    <div class="subtitle">Avoirs</div>
    <div class="badge" id="subBadge">—</div>

    <div class="wrap">
      <div class="card">
        <div class="card-title">
          <span>Liste des avoirs</span>
          <span class="small">salesDocuments • type CREDIT</span>
        </div>

        <div class="alert" id="alertBox"></div>

        <div class="filters">
          <input id="searchInput" class="input" type="search"
            placeholder="Rechercher : numéro, client, logement, facture…" />
          <select id="statusSel" class="select">
            <option value="ALL">Tous statuts</option>
            <option value="DRAFT">Brouillon</option>
            <option value="ISSUED">Émis</option>
            <option value="SENT">Envoyé</option>
          </select>
          <button id="reloadBtn" class="btn" type="button">Rafraîchir</button>
        </div>

        <div class="tableWrap">
          <table aria-label="Liste des avoirs">
            <thead>
              <tr>
                <th>Numéro</th>
                <th>Client</th>
                <th>Logement</th>
                <th>Facture liée</th>
                <th>Statut</th>
                <th class="num">Total</th>
                <th>Date</th>
                <th class="num">Actions</th>
              </tr>
            </thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opération</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, orderBy, limit, getDocs, doc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const appTitle = document.getElementById("appTitle");
    const subBadge = document.getElementById("subBadge");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");

    const alertBox = document.getElementById("alertBox");
    const tbody = document.getElementById("tbody");

    const searchInput = document.getElementById("searchInput");
    const statusSel = document.getElementById("statusSel");
    const reloadBtn = document.getElementById("reloadBtn");

    let currentUser = null;
    let profileData = null;
    let allRows = [];

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function tsToLabel(v){
      // accepte Timestamp Firestore, ms, ISO ou dd/mm/yyyy
      try{
        if(!v) return "—";
        if(typeof v === "string"){
          const s = v.trim();
          if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
          const d = new Date(s);
          if(!isNaN(d.getTime())){
            return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
          }
          return s || "—";
        }
        if(typeof v === "number"){
          const d = new Date(v);
          if(isNaN(d.getTime())) return "—";
          return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
        }
        if(v && typeof v.toDate === "function"){
          const d = v.toDate();
          return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
        }
        return "—";
      }catch(_){
        return "—";
      }
    }

    function creditStatusLabel(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return "—";
      if(x === "DRAFT") return "BROUILLON";
      if(x === "ISSUED") return "ÉMIS";
      if(x === "SENT") return "ENVOYÉ";
      return x;
    }

    function getCreditNumber(d){
      return String(
        d?.creditNumber ||
        d?.avoirNumber ||
        d?.creditNoteNumber ||
        d?.docNumber ||
        ""
      ).trim();
    }

    function getCreditStatus(d){
      return String(
        d?.creditStatus ||
        d?.avoirStatus ||
        d?.status ||
        ""
      ).toUpperCase().trim();
    }

    function getLinkedInvoiceInfo(d){
      const fromDocId = String(d?.fromDocId || d?.invoiceDocId || d?.fromInvoiceDocId || "").trim();
      const fromInv = String(d?.fromInvoiceNumber || d?.invoiceNumberRef || d?.invoiceNumber || "").trim(); // attention : peut entrer en collision si tu stockes invoiceNumber dans l'avoir (rare)
      return { fromDocId, fromInv };
    }

    function rowSearchText(d){
      const num = getCreditNumber(d);
      const client = String(d?.clientName || "").trim();
      const home = String(d?.homeName || d?.homeAddress || "").trim();
      const link = getLinkedInvoiceInfo(d);
      const inv = [link.fromInv, link.fromDocId].filter(Boolean).join(" ");
      return (num + " " + client + " " + home + " " + inv).toLowerCase();
    }

    function applyLogoFromProfile(profile){
      const bp = (profile?.businessProfile || {});
      const url = String(bp.logoUrl || "").trim();
      if(url){
        logoImg.src = url;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }
      const cName = String(bp.companyName || "Conciergerie").trim();
      appTitle.textContent = cName || "Conciergerie";
    }

    async function loadProfile(uid){
      const ref = doc(db, "users", uid);
      const snap = await getDoc(ref);
      profileData = snap.exists() ? (snap.data() || {}) : {};
      applyLogoFromProfile(profileData);
    }

    function renderTable(rows){
      tbody.innerHTML = "";
      if(!rows.length){
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="8" class="muted">Aucun avoir</td>`;
        tbody.appendChild(tr);
        return;
      }

      for(const r of rows){
        const d = r.data || {};
        const creditNum = getCreditNumber(d) || "—";
        const client = String(d.clientName || "—").trim();
        const home = String(d.homeName || "").trim() || String(d.homeAddress || "").trim() || "—";

        const st = getCreditStatus(d);
        const stLabel = creditStatusLabel(st);

        const total = (Number(d.totalTTC) || Number(d.total) || 0);
        const created = tsToLabel(d.createdAt || d.creditCreatedAt || d.updatedAt || d.creditIssuedAt || d.creditIssuedDate);

        const link = getLinkedInvoiceInfo(d);

        const invCell = link.fromInv
          ? esc(link.fromInv)
          : (link.fromDocId ? `#${esc(link.fromDocId.slice(0,6))}` : "—");

        const openUrl = `avoir.html?docId=${encodeURIComponent(r.id)}`;

        const viewInvoiceBtn = link.fromDocId
          ? `<button class="btn" type="button" data-inv="${esc(link.fromDocId)}">Voir facture</button>`
          : "";

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><span class="chip">${esc(creditNum)}</span></td>
          <td>${esc(client)}</td>
          <td>${esc(home)}</td>
          <td>${invCell}</td>
          <td><span class="chip">${esc(stLabel)}</span></td>
          <td class="num">${esc(fmtMoney(total))}</td>
          <td>${esc(created)}</td>
          <td class="num">
            <div class="actionsCell">
              <button class="btn primary" type="button" data-open="${esc(openUrl)}">Ouvrir</button>
              ${viewInvoiceBtn}
            </div>
          </td>
        `;

        tr.querySelector('[data-open]')?.addEventListener("click", (e)=>{
          const url = e.currentTarget.getAttribute("data-open");
          if(url) location.href = url;
        });

        tr.querySelector('[data-inv]')?.addEventListener("click", (e)=>{
          const invId = e.currentTarget.getAttribute("data-inv");
          if(invId) location.href = `facture.html?docId=${encodeURIComponent(invId)}`;
        });

        tbody.appendChild(tr);
      }
    }

    function applyFilters(){
      const q = String(searchInput.value || "").trim().toLowerCase();
      const st = String(statusSel.value || "ALL").toUpperCase();

      const filtered = allRows.filter(r=>{
        const d = r.data || {};
        if(st !== "ALL"){
          const s = getCreditStatus(d) || "DRAFT";
          if(String(s).toUpperCase() !== st) return false;
        }
        if(q){
          return rowSearchText(d).includes(q);
        }
        return true;
      });

      renderTable(filtered);
      subBadge.textContent = `${filtered.length} avoir(s)`;
    }

    async function loadCredits(){
      hideAlert();
      tbody.innerHTML = `<tr><td colspan="8">Chargement…</td></tr>`;

      try{
        const qCredits = query(
          collection(db, "salesDocuments"),
          where("conciergerieUid", "==", String(currentUser.uid)),
          where("type", "==", "CREDIT"),
          where("listable", "==", true),
          orderBy("createdAt", "desc"),
          limit(200)
        );

        const snap = await getDocs(qCredits);

        allRows = snap.docs.map(s=>({ id: s.id, data: s.data() || {} }));
        applyFilters();

        if(snap.empty){
          showAlert("Aucun avoir pour le moment.", true);
        }
      }catch(err){
        console.error(err);
        showAlert("Erreur chargement avoirs : " + (err?.message || "inconnue"));
      }
    }

    // UI listeners
    searchInput.addEventListener("input", ()=> applyFilters());
    statusSel.addEventListener("change", ()=> applyFilters());
    reloadBtn.addEventListener("click", ()=> loadCredits());

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = user;

      try{
        await loadProfile(user.uid);
        await loadCredits();
      }catch(e){
        console.error(e);
        showAlert("Erreur init : " + (e?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
