<!-- docs/owner-facturation.html (FINAL ROBUST — history from salesDocuments ownerUid, pending optional from requests) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Facturation propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-light:#F3ECFF;
      --violet-mid:#DCCBFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;

      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --ok:#1b8f4d; --bad:#b3261e;

      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 28px;
      padding-bottom:120px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky; top:0; z-index:30;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter: blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main);
      color:var(--violet-main); text-decoration:none;
      font-weight:900; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer; white-space:nowrap;
    }

    .logo{
      width:100%;
      max-width:980px;
      display:flex; justify-content:center; align-items:center; gap:8px;
      margin-top:8px; margin-bottom:4px; text-align:center;
    }
    .logo-icon{
      width:38px;height:38px;border-radius:50%;
      background:#fff;border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main);font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:22px; font-weight:1000; }
    .subtitle{ margin:6px 0 0; color:#444; font-weight:800; text-align:center; }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 12px 16px;
      backdrop-filter: blur(10px);
    }
    .cardTitle{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      font-size:14px; font-weight:1000;
    }
    .tiny{ font-size:12px; color:var(--muted); font-weight:900; line-height:1.35; }

    .alert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .item{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px 12px;
      border-left:5px solid rgba(122,92,255,.55);
    }
    .meta{
      display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;
      font-size:11px; font-weight:1000; color:#666; margin-bottom:6px;
    }
    .msg{ margin:0; font-size:13px; font-weight:800; color:#333; white-space:pre-wrap; line-height:1.35; }

    .row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
      align-items:center;
      justify-content:space-between;
    }

    .btn{
      border:none; border-radius:999px;
      padding:10px 12px;
      font-size:13px; font-weight:1000;
      cursor:pointer;
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .btn.danger{
      border-color: var(--bad);
      color: var(--bad);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .status{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:3px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      background:rgba(122,92,255,0.10);
      color:#4b2cff;
    }
    .status.ok{ background:rgba(27,143,77,0.12); color:var(--ok); }
    .status.bad{ background:rgba(179,38,30,0.10); color:var(--bad); }

    .bottom-nav{
      position:fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px;
      white-space:nowrap;
      position:relative;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="owner-dashboard.html">← Dashboard</a>
      <span></span>
    </div>

    <div class="logo">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>
    <div class="subtitle">Facturation</div>

    <div class="wrap">
      <section class="card">
        <div class="cardTitle">
          <span>À valider</span>
          <span class="tiny" id="pendingCount">—</span>
        </div>
        <div class="tiny" style="margin-top:8px;">
          (Optionnel) Si la conciergerie utilise “requests billing”, tu pourras accepter/refuser ici.
        </div>
        <div class="alert" id="alertPending"></div>
        <div id="pendingList" class="list"></div>
      </section>

      <section class="card">
        <div class="cardTitle">
          <span>Historique</span>
          <span class="tiny" id="historyCount">—</span>
        </div>
        <div class="tiny" style="margin-top:8px;">
          Devis / factures disponibles (lecture seule). Ouvre l’aperçu puis “Imprimer” → “Enregistrer en PDF”.
        </div>
        <div class="alert" id="alertHistory"></div>
        <div id="historyList" class="list"></div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="owner-dashboard.html">Dashboard</a>
    <a href="owner-planning.html">Planning</a>
    <a href="owner-homes.html">Logements</a>
    <a href="owner-messages.html">Messages</a>
  </nav>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    doc, getDoc,
    collection, query, where, orderBy, onSnapshot,
    updateDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const pendingList   = document.getElementById("pendingList");
  const historyList   = document.getElementById("historyList");
  const pendingCount  = document.getElementById("pendingCount");
  const historyCount  = document.getElementById("historyCount");
  const alertPending  = document.getElementById("alertPending");
  const alertHistory  = document.getElementById("alertHistory");

  function showAlert(el, msg, ok=false){
    if(!el) return;
    el.style.display = "block";
    el.classList.toggle("ok", !!ok);
    el.textContent = msg;
  }
  function hideAlert(el){
    if(!el) return;
    el.style.display = "none";
    el.classList.remove("ok");
    el.textContent = "";
  }

  function resetUnreadBilling(){
    localStorage.setItem("cm_owner_unread_billing", "0");
  }

  function esc(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function fmt(ts){
    try{
      const d = ts?.toDate ? ts.toDate() : new Date(ts || Date.now());
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yyyy = d.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }catch{ return "—"; }
  }
  function money(v){
    const n = Number(v);
    if(!Number.isFinite(n)) return "—";
    return new Intl.NumberFormat("fr-FR", { style:"currency", currency:"EUR" }).format(n);
  }
  function statusPill(s){
    const v = String(s || "").toUpperCase().trim();
    if(v === "ISSUED") return `<span class="status ok">émise</span>`;
    if(v === "PAID") return `<span class="status ok">payée</span>`;
    if(v === "CANCELLED") return `<span class="status bad">annulée</span>`;
    if(v === "DRAFT") return `<span class="status">brouillon</span>`;
    return v ? `<span class="status">${esc(v.toLowerCase())}</span>` : `<span class="status">—</span>`;
  }
  function docTypeLabel(t){
    const v = String(t||"").toUpperCase().trim();
    if(v === "QUOTE") return "Devis";
    if(v === "INVOICE") return "Facture";
    return "Document";
  }
  function getParam(name){
    return (new URLSearchParams(location.search).get(name) || "").trim();
  }
  function buildProfileUrl(){
    const token = getParam("token");
    return token
      ? `profil-proprietaire.html?self=1&token=${encodeURIComponent(token)}`
      : `profil-proprietaire.html?self=1`;
  }

  let unsubSales = null;
  let unsubRequests = null;

  async function guardOwnerProfile(user){
    const us = await getDoc(doc(db, "users", user.uid));
    const ud = us.exists() ? (us.data() || {}) : {};
    const od = String(ud.ownerDocId || "").trim();
    if(!od){
      location.replace(buildProfileUrl());
      return { ok:false };
    }
    const os = await getDoc(doc(db, "owners", od));
    if(!os.exists()){
      location.replace(buildProfileUrl());
      return { ok:false };
    }
    return { ok:true, ownerDocId: od };
  }

  // --------- OPTIONAL requests (accept/refuse) ----------
  async function setDecision(requestId, status, note=""){
    const ref = doc(db, "requests", requestId);
    await updateDoc(ref, {
      status,
      decisionNote: note || "",
      decisionAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
  }
  function buildOpenHrefFromRequest(r){
    const salesDocId = String(r.salesDocId || r.docId || "").trim();
    const dtype = String(r.docType || "").toLowerCase();
    if(!salesDocId) return "";
    if(dtype === "invoice") return `facture-apercu.html?docId=${encodeURIComponent(salesDocId)}&owner=1`;
    if(dtype === "quote") return `devis-apercu.html?docId=${encodeURIComponent(salesDocId)}&owner=1`;
    return `facture-apercu.html?docId=${encodeURIComponent(salesDocId)}&owner=1`;
  }
  function renderPendingRequestRow(r){
    const type = "Devis";
    const number = r.number ? `#${esc(r.number)}` : "—";
    const home = esc(r.homeName || r.home || "—");
    const total = money(r.totalTTC);
    const when = fmt(r.createdAt);
    const note = String(r.note || "").trim();
    const openHref = buildOpenHrefFromRequest(r);

    const el = document.createElement("div");
    el.className = "item";

    const bodyLines = [
      `Logement : ${home}`,
      `Montant TTC : ${esc(total)}`
    ];
    if(note) bodyLines.push(`Message : ${esc(note)}`);

    el.innerHTML = `
      <div class="meta">
        <span><b>${esc(type)}</b> • ${number}</span>
        <span>${esc(when)} <span class="status">à valider</span></span>
      </div>
      <p class="msg">${bodyLines.join("\n")}</p>
      <div class="row">
        <span></span>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
          ${openHref ? `<a class="btn" href="${esc(openHref)}">Ouvrir</a>` : ``}
          <button class="btn primary" data-act="accept">Accepter</button>
          <button class="btn danger" data-act="refuse">Refuser</button>
        </div>
      </div>
    `;

    const acceptBtn = el.querySelector('[data-act="accept"]');
    const refuseBtn = el.querySelector('[data-act="refuse"]');

    acceptBtn?.addEventListener("click", async ()=>{
      if(!confirm("Confirmer l’acceptation de ce devis ?")) return;
      acceptBtn.disabled = true; refuseBtn.disabled = true;
      try{
        await setDecision(r.id, "accepted", "");
      }catch(err){
        console.error(err);
        showAlert(alertPending, "Erreur acceptation : " + (err?.message || "inconnue"));
      }finally{
        acceptBtn.disabled = false; refuseBtn.disabled = false;
      }
    });

    refuseBtn?.addEventListener("click", async ()=>{
      const note = prompt("Motif du refus (optionnel) :", "") ?? "";
      if(!confirm("Confirmer le refus ?")) return;
      acceptBtn.disabled = true; refuseBtn.disabled = true;
      try{
        await setDecision(r.id, "refused", note.trim());
      }catch(err){
        console.error(err);
        showAlert(alertPending, "Erreur refus : " + (err?.message || "inconnue"));
      }finally{
        acceptBtn.disabled = false; refuseBtn.disabled = false;
      }
    });

    return el;
  }

  function listenOptionalRequests(uid){
    if(unsubRequests) unsubRequests();
    pendingList.innerHTML = "";
    pendingCount.textContent = "0";
    hideAlert(alertPending);

    // ⚠️ OPTIONAL: si rules/index pas prêts, on n'empêche pas la page de fonctionner
    const qb = query(
      collection(db, "requests"),
      where("ownerUid", "==", uid),
      where("type", "==", "billing"),
      where("status", "==", "pending_owner")
    );

    unsubRequests = onSnapshot(qb, (snap)=>{
      const items = snap.docs.map(d => ({ id:d.id, ...(d.data()||{}) }))
        .filter(x => String(x.docType||"").toLowerCase() === "quote");

      pendingCount.textContent = String(items.length);
      pendingList.innerHTML = "";

      if(!items.length){
        pendingList.innerHTML = `
          <div class="item">
            <div class="meta"><span>Aucun devis à valider</span><span>—</span></div>
            <p class="msg">Si la conciergerie utilise “requests billing”, les devis à valider apparaîtront ici.</p>
          </div>
        `;
      }else{
        for(const r of items){
          pendingList.appendChild(renderPendingRequestRow(r));
        }
      }
    }, (err)=>{
      console.warn("requests listener:", err?.message || err);
      pendingCount.textContent = "—";
      pendingList.innerHTML = `
        <div class="item">
          <div class="meta"><span>À valider indisponible</span><span>—</span></div>
          <p class="msg">La partie “validation” n’est pas activée (rules/index/collection). Aucun blocage : l’historique reste disponible.</p>
        </div>
      `;
    });
  }

  // --------- HISTORY from salesDocuments (source of truth) ----------
  function buildOpenHrefFromSales(d){
    const id = String(d.id || "").trim();
    if(!id) return "";
    const type = String(d.type || "").toUpperCase().trim();
    if(type === "QUOTE") return `devis-apercu.html?docId=${encodeURIComponent(id)}&owner=1`;
    return `facture-apercu.html?docId=${encodeURIComponent(id)}&owner=1`;
  }

  function renderSalesRow(d){
    const type = docTypeLabel(d.type);
    const number =
      String(d.invoiceNumber || d.quoteNumber || "").trim()
        ? ("#" + esc(String(d.invoiceNumber || d.quoteNumber).trim()))
        : "—";

    const home = esc(d.homeName || d.home || "—");
    const total = money(d.totalTTC);
    const when = fmt(d.createdAt || d.updatedAt);
    const openHref = buildOpenHrefFromSales(d);

    const status =
      String(d.type || "").toUpperCase().trim() === "INVOICE"
        ? statusPill(d.invoiceStatus || d.commercialStatus || "")
        : `<span class="status">${esc(String(d.quoteStatus || d.commercialStatus || "—").toLowerCase())}</span>`;

    const el = document.createElement("div");
    el.className = "item";

    el.innerHTML = `
      <div class="meta">
        <span><b>${esc(type)}</b> • ${number}</span>
        <span>${esc(when)} ${status}</span>
      </div>
      <p class="msg">${[
        `Logement : ${home}`,
        `Montant TTC : ${esc(total)}`
      ].join("\n")}</p>
      <div class="row">
        <span></span>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
          ${openHref ? `<a class="btn" href="${esc(openHref)}">Ouvrir</a>` : `<span class="tiny">—</span>`}
        </div>
      </div>
    `;
    return el;
  }

  function listenSalesHistory(uid){
    if(unsubSales) unsubSales();
    hideAlert(alertHistory);
    historyList.innerHTML = "";
    historyCount.textContent = "—";

    const qs = query(
      collection(db, "salesDocuments"),
      where("ownerUid", "==", uid),
      where("ownerVisible", "==", true),
      orderBy("createdAt", "desc")
    );

    unsubSales = onSnapshot(qs, (snap)=>{
      const items = snap.docs.map(d => ({ id:d.id, ...(d.data()||{}) }));

      historyCount.textContent = String(items.length);
      historyList.innerHTML = "";

      if(!items.length){
        historyList.innerHTML = `
          <div class="item">
            <div class="meta"><span>Aucun document</span><span>—</span></div>
            <p class="msg">Aucun devis/facture pour le moment.</p>
          </div>
        `;
      }else{
        for(const d of items){
          historyList.appendChild(renderSalesRow(d));
        }
      }

      // page ouverte => reset
      resetUnreadBilling();

    }, (err)=>{
      console.error(err);
      const msg = String(err?.message || "");
      if(msg.toLowerCase().includes("index")){
        showAlert(
          alertHistory,
          "⛔ Index Firestore manquant.\n" +
          "Crée l’index composite: salesDocuments (ownerUid ASC, createdAt DESC).\n" +
          "Puis recharge.",
          false
        );
      }else if(msg.toLowerCase().includes("permission")){
        showAlert(
          alertHistory,
          "⛔ Permission refusée sur salesDocuments.\n" +
          "Rule attendue: read autorisé si ownerUid == auth.uid.",
          false
        );
      }else{
        showAlert(alertHistory, "Erreur chargement historique : " + msg, false);
      }
    });
  }

  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      const tok = getParam("token");
      location.href = "login.html?role=proprietaire" + (tok ? ("&token=" + encodeURIComponent(tok)) : "");
      return;
    }

    const g = await guardOwnerProfile(user);
    if(!g.ok) return;

    resetUnreadBilling();

    // ✅ history = salesDocuments (obligatoire)
    listenSalesHistory(user.uid);

    // ✅ pending = requests (optionnel, ne doit jamais bloquer)
    listenOptionalRequests(user.uid);
  });

  window.addEventListener("focus", ()=> resetUnreadBilling());
</script>

</body>
</html>
