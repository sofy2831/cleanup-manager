<!-- docs/owner-facturation.html (ZIP MVP — historique + téléchargement groupé HTML imprimables) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Facturation propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-light:#F3ECFF;
      --violet-mid:#DCCBFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;

      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --ok:#1b8f4d; --bad:#b3261e;

      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 28px;
      padding-bottom:120px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky; top:0; z-index:30;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter: blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main);
      color:var(--violet-main); text-decoration:none;
      font-weight:900; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer; white-space:nowrap;
    }

    .logo{
      width:100%;
      max-width:980px;
      display:flex; justify-content:center; align-items:center; gap:8px;
      margin-top:8px; margin-bottom:4px; text-align:center;
    }
    .logo-icon{
      width:38px;height:38px;border-radius:50%;
      background:#fff;border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main);font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:22px; font-weight:1000; }
    .subtitle{ margin:6px 0 0; color:#444; font-weight:800; text-align:center; }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 12px 16px;
      backdrop-filter: blur(10px);
    }
    .cardTitle{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      font-size:14px; font-weight:1000;
      flex-wrap:wrap;
    }
    .cardTitleActions{
      display:flex;
      align-items:center;
      justify-content:flex-end;
      gap:8px;
      flex-wrap:wrap;
    }
    .tiny{ font-size:12px; color:var(--muted); font-weight:900; line-height:1.35; }

    .alert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .item{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px 12px;
      border-left:5px solid rgba(122,92,255,.55);
    }
    .item.statement{
      border-left-color: rgba(27,143,77,.55);
    }
    .meta{
      display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap;
      font-size:11px; font-weight:1000; color:#666; margin-bottom:6px;
    }
    .msg{ margin:0; font-size:13px; font-weight:800; color:#333; white-space:pre-wrap; line-height:1.35; }

    .row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
      align-items:center;
      justify-content:space-between;
    }

    .btn{
      border:none; border-radius:999px;
      padding:10px 12px;
      font-size:13px; font-weight:1000;
      cursor:pointer;
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .status{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:3px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      background:rgba(122,92,255,0.10);
      color:#4b2cff;
    }
    .status.ok{ background:rgba(27,143,77,0.12); color:var(--ok); }
    .status.bad{ background:rgba(179,38,30,0.10); color:var(--bad); }
    .status.statement{ background:rgba(27,143,77,0.12); color:var(--ok); }

    .bottom-nav{
      position:fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px;
      white-space:nowrap;
      position:relative;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js" defer></script>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="dashboardLink" href="owner-dashboard.html">← Dashboard</a>
      <span></span>
    </div>

    <div class="logo">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>
    <div class="subtitle">Facturation</div>

    <div class="wrap">
      <section class="card">
        <div class="cardTitle">
          <span>Historique</span>

          <div class="cardTitleActions">
            <span class="tiny" id="historyCount">—</span>
            <button class="btn primary" type="button" id="downloadZipBtn">Télécharger ZIP</button>
          </div>
        </div>

        <div class="alert" id="alertHistory"></div>
        <div id="historyList" class="list"></div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav">
    <a id="navDashboard" href="owner-dashboard.html">Dashboard</a>
    <a id="navPlanning" href="owner-planning.html">Planning</a>
    <a id="navHomes" href="owner-homes.html">Logements</a>
    <a id="navMessages" href="owner-messages.html">Messages</a>
  </nav>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    doc, getDoc,
    collection, query, where, orderBy, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const historyList   = document.getElementById("historyList");
  const historyCount  = document.getElementById("historyCount");
  const alertHistory  = document.getElementById("alertHistory");
  const downloadZipBtn = document.getElementById("downloadZipBtn");

  const dashboardLink = document.getElementById("dashboardLink");
  const navDashboard  = document.getElementById("navDashboard");
  const navPlanning   = document.getElementById("navPlanning");
  const navHomes      = document.getElementById("navHomes");
  const navMessages   = document.getElementById("navMessages");

  function showAlert(el, msg, ok=false){
    if(!el) return;
    el.style.display = "block";
    el.classList.toggle("ok", !!ok);
    el.textContent = msg;
  }
  function hideAlert(el){
    if(!el) return;
    el.style.display = "none";
    el.classList.remove("ok");
    el.textContent = "";
  }

  function resetUnreadBilling(){
    localStorage.setItem("cm_owner_unread_billing", "0");
  }

  function esc(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmt(ts){
    try{
      const d = ts?.toDate ? ts.toDate() : (ts?.seconds ? new Date(ts.seconds*1000) : new Date(ts || Date.now()));
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yyyy = d.getFullYear();
      return `${dd}/${mm}/${yyyy}`;
    }catch{
      return "—";
    }
  }

  function money(v){
    const n = Number(v);
    if(!Number.isFinite(n)) return "—";
    return new Intl.NumberFormat("fr-FR", { style:"currency", currency:"EUR" }).format(n);
  }

  function getParam(name){
    return (new URLSearchParams(location.search).get(name) || "").trim();
  }

  function getToken(){
    return getParam("token");
  }

  function withToken(url){
    const token = getToken();
    if(!token) return url;
    const sep = url.includes("?") ? "&" : "?";
    return `${url}${sep}token=${encodeURIComponent(token)}`;
  }

  function statusPillForDoc(d){
    const type = String(d.type || "").toUpperCase().trim();

    if(type === "INVOICE"){
      const v = String(d.invoiceStatus || d.commercialStatus || "").toUpperCase().trim();
      if(v === "ISSUED") return `<span class="status ok">émise</span>`;
      if(v === "SENT") return `<span class="status">envoyée</span>`;
      if(v === "PAID") return `<span class="status ok">payée</span>`;
      if(v === "CANCELLED") return `<span class="status bad">annulée</span>`;
      if(v === "DRAFT") return `<span class="status">brouillon</span>`;
      return `<span class="status">${esc(v || "—").toLowerCase()}</span>`;
    }

    if(type === "QUOTE"){
      const v = String(d.quoteStatus || d.commercialStatus || "").toUpperCase().trim();
      if(v === "SIGNED" || v === "ACCEPTED") return `<span class="status ok">accepté</span>`;
      if(v === "SENT") return `<span class="status">envoyé</span>`;
      if(v === "DRAFT") return `<span class="status">brouillon</span>`;
      if(v === "CANCELLED" || v === "REFUSED") return `<span class="status bad">refusé</span>`;
      return `<span class="status">${esc(v || "—").toLowerCase()}</span>`;
    }

    if(type === "CREDIT" || type === "CREDIT_NOTE"){
      const v = String(d.creditStatus || d.avoirStatus || d.commercialStatus || "").toUpperCase().trim();
      if(v === "ISSUED") return `<span class="status ok">émis</span>`;
      if(v === "SENT") return `<span class="status">envoyé</span>`;
      if(v === "CANCELLED") return `<span class="status bad">annulé</span>`;
      if(v === "DRAFT") return `<span class="status">brouillon</span>`;
      return `<span class="status">${esc(v || "—").toLowerCase()}</span>`;
    }

    return `<span class="status">—</span>`;
  }

  function docTypeLabel(t){
    const v = String(t||"").toUpperCase().trim();
    if(v === "QUOTE") return "Devis";
    if(v === "INVOICE") return "Facture";
    if(v === "CREDIT" || v === "CREDIT_NOTE") return "Avoir";
    return "Document";
  }

  function buildProfileUrl(){
    return withToken("profil-proprietaire.html?self=1");
  }

  function buildOwnerUrl(base){
    return withToken(base);
  }

  let unsubSales = null;
  let unsubStatements = null;
  let currentSalesItems = [];
  let currentStatementItems = [];

  async function guardOwnerProfile(user){
    const us = await getDoc(doc(db, "users", user.uid));
    const ud = us.exists() ? (us.data() || {}) : {};
    const od = String(ud.ownerDocId || "").trim();
    if(!od){
      location.replace(buildProfileUrl());
      return { ok:false };
    }
    const os = await getDoc(doc(db, "owners", od));
    if(!os.exists()){
      location.replace(buildProfileUrl());
      return { ok:false };
    }
    return { ok:true, ownerDocId: od };
  }

  function buildOpenHrefFromSales(d){
    const id = String(d.id || "").trim();
    if(!id) return "";

    const type = String(d.type || "").toUpperCase().trim();

    if(type === "QUOTE"){
      return buildOwnerUrl(`devis-apercu.html?docId=${encodeURIComponent(id)}&owner=1`);
    }
    if(type === "CREDIT" || type === "CREDIT_NOTE"){
      return buildOwnerUrl(`avoir-apercu.html?docId=${encodeURIComponent(id)}&owner=1`);
    }
    return buildOwnerUrl(`facture-apercu.html?docId=${encodeURIComponent(id)}&owner=1`);
  }

  function buildOpenHrefFromStatement(d){
    const id = String(d.id || "").trim();
    if(!id) return "";
    return buildOwnerUrl(`releve-apercu.html?statementId=${encodeURIComponent(id)}&owner=1`);
  }

  function renderSalesRow(d){
    const type = docTypeLabel(d.type);
    const number =
      String(d.invoiceNumber || d.quoteNumber || d.creditNumber || d.avoirNumber || d.creditNoteNumber || "").trim()
        ? ("#" + esc(String(d.invoiceNumber || d.quoteNumber || d.creditNumber || d.avoirNumber || d.creditNoteNumber).trim()))
        : "—";

    const home = esc(d.homeName || d.home || "—");
    const total = money(d.totalTTC);
    const when = fmt(d.createdAt || d.updatedAt || d.creditIssuedAt || d.invoiceIssuedAt || d.quoteIssuedAt);
    const openHref = buildOpenHrefFromSales(d);
    const status = statusPillForDoc(d);

    const el = document.createElement("div");
    el.className = "item";
    el.innerHTML = `
      <div class="meta">
        <span><b>${esc(type)}</b> • ${number}</span>
        <span>${esc(when)} ${status}</span>
      </div>
      <p class="msg">${[
        `Logement : ${home}`,
        `Montant TTC : ${esc(total)}`
      ].join("\n")}</p>
      <div class="row">
        <span></span>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
          ${openHref ? `<a class="btn" href="${esc(openHref)}">Ouvrir</a>` : `<span class="tiny">—</span>`}
        </div>
      </div>
    `;
    return el;
  }

  function renderStatementRow(d){
    const period = String(d.periodKey || "").trim() || "—";
    const when = fmt(d.publishedAt || d.updatedAt || d.createdAt);
    const totalNet = money(d?.totals?.netTTC || 0);
    const paid = money(d?.paymentSummary?.paidTTC || 0);
    const due = money(d?.paymentSummary?.dueTTC || 0);
    const openHref = buildOpenHrefFromStatement(d);

    const el = document.createElement("div");
    el.className = "item statement";
    el.innerHTML = `
      <div class="meta">
        <span><b>Relevé</b> • ${esc(period)}</span>
        <span>${esc(when)} <span class="status statement">publié</span></span>
      </div>
      <p class="msg">${[
        `Période : ${esc(d.periodStartKey || "—")} → ${esc(d.periodEndKey || "—")}`,
        `Net TTC : ${esc(totalNet)}`,
        `Réglé : ${esc(paid)}`,
        `Reste dû : ${esc(due)}`
      ].join("\n")}</p>
      <div class="row">
        <span></span>
        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
          ${openHref ? `<a class="btn" href="${esc(openHref)}">Ouvrir</a>` : `<span class="tiny">—</span>`}
        </div>
      </div>
    `;
    return el;
  }

  function toSortDate(x){
    try{
      if(x?.toDate) return x.toDate();
      if(x?.seconds) return new Date(x.seconds * 1000);
      return new Date(x || 0);
    }catch{
      return new Date(0);
    }
  }

  function renderHistoryMerged(){
    const merged = [
      ...currentSalesItems.map(d => ({
        _kind: "sales",
        _sortDate: d.createdAt || d.updatedAt || d.creditIssuedAt || d.invoiceIssuedAt || d.quoteIssuedAt || null,
        ...d
      })),
      ...currentStatementItems.map(d => ({
        _kind: "statement",
        _sortDate: d.publishedAt || d.updatedAt || d.createdAt || null,
        ...d
      }))
    ];

    merged.sort((a,b)=> toSortDate(b._sortDate) - toSortDate(a._sortDate));

    historyCount.textContent = `${merged.length} document${merged.length > 1 ? "s" : ""}`;
    historyList.innerHTML = "";

    if(!merged.length){
      historyList.innerHTML = `
        <div class="item">
          <div class="meta"><span>Aucun document</span><span>—</span></div>
          <p class="msg">Aucun devis, facture, avoir ou relevé publié pour le moment.</p>
        </div>
      `;
      return;
    }

    for(const d of merged){
      if(d._kind === "statement"){
        historyList.appendChild(renderStatementRow(d));
      }else{
        historyList.appendChild(renderSalesRow(d));
      }
    }

    resetUnreadBilling();
  }

  function listenSalesHistory(uid){
    if(unsubSales) unsubSales();
    if(unsubStatements) unsubStatements();

    hideAlert(alertHistory);
    historyList.innerHTML = "";
    historyCount.textContent = "—";
    currentSalesItems = [];
    currentStatementItems = [];

    const qsSales = query(
      collection(db, "salesDocuments"),
      where("ownerUid", "==", uid),
      where("ownerVisible", "==", true),
      orderBy("createdAt", "desc")
    );

    unsubSales = onSnapshot(qsSales, (snap)=>{
      currentSalesItems = snap.docs.map(d => ({ id:d.id, ...(d.data()||{}) }));
      renderHistoryMerged();
    }, (err)=>{
      console.error(err);
      const msg = String(err?.message || "");
      const low = msg.toLowerCase();

      if(low.includes("index")){
        showAlert(
          alertHistory,
          "⛔ Index Firestore manquant.\nCrée l’index composite : salesDocuments (ownerUid ASC, ownerVisible ASC, createdAt DESC).\nPuis recharge.",
          false
        );
      }else if(low.includes("permission")){
        showAlert(
          alertHistory,
          "⛔ Permission refusée sur salesDocuments.\nRule attendue : lecture owner autorisée si ownerUid == auth.uid ET ownerVisible == true.",
          false
        );
      }else{
        showAlert(alertHistory, "Erreur chargement historique documents : " + msg, false);
      }
    });

    const qsStatements = query(
      collection(db, "ownerStatements"),
      where("ownerUid", "==", uid),
      where("ownerVisible", "==", true),
      orderBy("publishedAt", "desc")
    );

    unsubStatements = onSnapshot(qsStatements, (snap)=>{
      currentStatementItems = snap.docs.map(d => ({ id:d.id, ...(d.data()||{}) }));
      renderHistoryMerged();
    }, (err)=>{
      console.error(err);
      const msg = String(err?.message || "");
      const low = msg.toLowerCase();

      if(low.includes("index")){
        showAlert(
          alertHistory,
          "⛔ Index Firestore manquant.\nCrée l’index composite : ownerStatements (ownerUid ASC, ownerVisible ASC, publishedAt DESC).\nPuis recharge.",
          false
        );
      }else if(low.includes("permission")){
        showAlert(
          alertHistory,
          "⛔ Permission refusée sur ownerStatements.\nRule attendue : lecture owner autorisée si ownerUid == auth.uid ET ownerVisible == true.",
          false
        );
      }else{
        showAlert(alertHistory, "Erreur chargement historique relevés : " + msg, false);
      }
    });
  }

  function wireOwnerLinks(){
    dashboardLink.href = buildOwnerUrl("owner-dashboard.html");
    navDashboard.href  = buildOwnerUrl("owner-dashboard.html");
    navPlanning.href   = buildOwnerUrl("owner-planning.html");
    navHomes.href      = buildOwnerUrl("owner-homes.html");
    navMessages.href   = buildOwnerUrl("owner-messages.html");
  }

  function safeFileName(s){
    return String(s || "document")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "")
      .replace(/[^a-zA-Z0-9._-]+/g, "-")
      .replace(/-+/g, "-")
      .replace(/^-|-$/g, "")
      .slice(0, 90) || "document";
  }

  function htmlPage(title, bodyHtml){
    return `<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>${esc(title)}</title>
  <style>
    *{box-sizing:border-box;font-family:Arial,sans-serif;}
    body{margin:24px;color:#111;}
    h1{font-size:22px;margin:0 0 12px;}
    h2{font-size:16px;margin:18px 0 8px;}
    .box{border:1px solid #ddd;border-radius:12px;padding:12px;margin:10px 0;}
    .muted{color:#666;font-size:12px;}
    table{width:100%;border-collapse:collapse;margin-top:12px;}
    th,td{border-bottom:1px solid #ddd;padding:8px;text-align:left;font-size:12px;}
    th{background:#f5f5f5;}
    .right{text-align:right;}
    @media print{body{margin:10mm;}}
  </style>
</head>
<body>
${bodyHtml}
</body>
</html>`;
  }

  function salesDocHtml(d){
    const type = docTypeLabel(d.type);
    const number = String(d.invoiceNumber || d.quoteNumber || d.creditNumber || d.avoirNumber || d.creditNoteNumber || d.id || "").trim();
    const date = fmt(d.createdAt || d.updatedAt || d.creditIssuedAt || d.invoiceIssuedAt || d.quoteIssuedAt);
    const statusText = statusPillForDoc(d).replace(/<[^>]+>/g, "");
    const lines = Array.isArray(d.lines) ? d.lines : [];

    const body = `
      <h1>${esc(type)} ${esc(number || "")}</h1>
      <div class="muted">Document exporté depuis CleanUp Manager.</div>

      <div class="box">
        <div><b>Date :</b> ${esc(date)}</div>
        <div><b>Statut :</b> ${esc(statusText)}</div>
        <div><b>Client :</b> ${esc(d.clientName || d.ownerName || "—")}</div>
        <div><b>Logement :</b> ${esc(d.homeName || d.home || "—")}</div>
      </div>

      ${lines.length ? `
        <h2>Lignes</h2>
        <table>
          <thead>
            <tr>
              <th>Désignation</th>
              <th class="right">Qté</th>
              <th class="right">PU</th>
              <th class="right">Total</th>
            </tr>
          </thead>
          <tbody>
            ${lines.map(l => `
              <tr>
                <td>${esc(l.label || l.description || l.name || "—")}</td>
                <td class="right">${esc(l.qty ?? l.quantity ?? "—")}</td>
                <td class="right">${esc(money(l.unitPrice || 0))}</td>
                <td class="right">${esc(money((Number(l.qty || l.quantity || 0) * Number(l.unitPrice || 0)) || l.total || 0))}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      ` : ""}

      <h2>Totaux</h2>
      <div class="box">
        <div><b>HT :</b> ${esc(money(d.totalHT || 0))}</div>
        <div><b>TVA :</b> ${esc(money(d.totalTVA || 0))}</div>
        <div><b>TTC :</b> ${esc(money(d.totalTTC || 0))}</div>
      </div>
    `;

    return htmlPage(`${type} ${number}`, body);
  }

  function statementHtml(d){
    const period = String(d.periodKey || "").trim() || "—";
    const items = Array.isArray(d.items) ? d.items : [];
    const body = `
      <h1>Relevé de factures ${esc(period)}</h1>
      <div class="muted">Relevé exporté depuis CleanUp Manager.</div>

      <div class="box">
        <div><b>Propriétaire :</b> ${esc(d.ownerName || "—")}</div>
        <div><b>Période :</b> ${esc(d.periodStartKey || "—")} → ${esc(d.periodEndKey || "—")}</div>
        <div><b>Net TTC :</b> ${esc(money(d?.totals?.netTTC || 0))}</div>
        <div><b>Réglé :</b> ${esc(money(d?.paymentSummary?.paidTTC || 0))}</div>
        <div><b>Reste dû :</b> ${esc(money(d?.paymentSummary?.dueTTC || 0))}</div>
      </div>

      <h2>Détail</h2>
      <table>
        <thead>
          <tr>
            <th>Type</th>
            <th>N°</th>
            <th>Date</th>
            <th>Client</th>
            <th>Logement</th>
            <th class="right">TTC</th>
            <th class="right">Payé</th>
            <th class="right">À payer</th>
          </tr>
        </thead>
        <tbody>
          ${items.map(i => {
            const isCredit = String(i.kind || "").toUpperCase() === "CREDIT";
            const total = Number(i.totalTTC || 0);
            const paid = isCredit ? 0 : Number(i.paidAmount || 0);
            const due = isCredit ? 0 : Math.max(0, total - paid);
            return `
              <tr>
                <td>${isCredit ? "Avoir" : "Facture"}</td>
                <td>${esc(i.number || "—")}</td>
                <td>${esc(i.dateKey || "—")}</td>
                <td>${esc(i.clientName || "—")}</td>
                <td>${esc(i.homeName || "—")}</td>
                <td class="right">${isCredit ? "−" : ""}${esc(money(total))}</td>
                <td class="right">${isCredit ? "—" : esc(money(paid))}</td>
                <td class="right">${isCredit ? "—" : esc(money(due))}</td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    `;

    return htmlPage(`Relevé ${period}`, body);
  }

  function buildIndexHtml(salesDocs, statements){
    const rowsSales = salesDocs.map(d => {
      const type = docTypeLabel(d.type);
      const number = String(d.invoiceNumber || d.quoteNumber || d.creditNumber || d.avoirNumber || d.creditNoteNumber || d.id || "").trim();
      return `<li>${esc(type)} — ${esc(number || "sans numéro")} — ${esc(money(d.totalTTC || 0))}</li>`;
    }).join("");

    const rowsStatements = statements.map(d => {
      return `<li>Relevé — ${esc(d.periodKey || "—")} — ${esc(money(d?.totals?.netTTC || 0))}</li>`;
    }).join("");

    return htmlPage("Index documents CleanUp Manager", `
      <h1>Archive documents CleanUp Manager</h1>
      <div class="muted">Cette archive contient des fichiers HTML imprimables. Pour produire un PDF, ouvrir le fichier puis imprimer en PDF.</div>

      <h2>Documents commerciaux</h2>
      <ul>${rowsSales || "<li>Aucun</li>"}</ul>

      <h2>Relevés mensuels</h2>
      <ul>${rowsStatements || "<li>Aucun</li>"}</ul>
    `);
  }

  function addFileToZip(zip, folder, filename, html){
    zip.folder(folder).file(filename, html);
  }

  async function downloadDocumentsZip(){
    hideAlert(alertHistory);

    const JSZipCtor = window.JSZip;
    if(!JSZipCtor){
      showAlert(alertHistory, "⛔ Librairie ZIP indisponible. Vérifie la connexion ou le chargement JSZip.", false);
      return;
    }

    const salesDocs = Array.isArray(currentSalesItems) ? currentSalesItems : [];
    const statements = Array.isArray(currentStatementItems) ? currentStatementItems : [];

    if(!salesDocs.length && !statements.length){
      showAlert(alertHistory, "Aucun document à télécharger.", false);
      return;
    }

    downloadZipBtn.disabled = true;
    downloadZipBtn.textContent = "Préparation…";

    try{
      const zip = new JSZipCtor();

      zip.file("index.html", buildIndexHtml(salesDocs, statements));

      for(const d of salesDocs){
        const type = String(d.type || "").toUpperCase().trim();
        const label = docTypeLabel(type);
        const number = String(d.invoiceNumber || d.quoteNumber || d.creditNumber || d.avoirNumber || d.creditNoteNumber || d.id || "").trim();
        const filename = `${safeFileName(label)}-${safeFileName(number || d.id)}.html`;

        if(type === "QUOTE"){
          addFileToZip(zip, "Devis", filename, salesDocHtml(d));
        }else if(type === "CREDIT" || type === "CREDIT_NOTE"){
          addFileToZip(zip, "Avoirs", filename, salesDocHtml(d));
        }else if(type === "INVOICE"){
          addFileToZip(zip, "Factures", filename, salesDocHtml(d));
        }else{
          addFileToZip(zip, "Autres", filename, salesDocHtml(d));
        }
      }

      for(const d of statements){
        const period = String(d.periodKey || d.id || "releve").trim();
        const filename = `Releve-${safeFileName(period)}.html`;
        addFileToZip(zip, "Releves", filename, statementHtml(d));
      }

      const blob = await zip.generateAsync({ type:"blob" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      const dateKey = new Date().toISOString().slice(0,10);
      a.href = url;
      a.download = `cleanup-documents-${dateKey}.zip`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 1000);

      showAlert(alertHistory, "✅ Archive ZIP générée. Les fichiers sont au format HTML imprimable.", true);
      setTimeout(()=> hideAlert(alertHistory), 2500);
    }catch(e){
      console.error(e);
      showAlert(alertHistory, "⛔ Erreur génération ZIP : " + (e?.message || "inconnue"), false);
    }finally{
      downloadZipBtn.disabled = false;
      downloadZipBtn.textContent = "Télécharger ZIP";
    }
  }

  downloadZipBtn.addEventListener("click", downloadDocumentsZip);

  onAuthStateChanged(auth, async (user)=>{
    wireOwnerLinks();

    if(!user){
      location.href = buildOwnerUrl("login.html?role=proprietaire");
      return;
    }

    const g = await guardOwnerProfile(user);
    if(!g.ok) return;

    resetUnreadBilling();
    listenSalesHistory(user.uid);
  });

  window.addEventListener("focus", ()=> resetUnreadBilling());
</script>

</body>
</html>
