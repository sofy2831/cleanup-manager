<!-- docs/facture-apercu.html (CORRIGÉ COMPLET — logo via businessSnapshot OU fallback users.businessProfile + total row 14px gras + coordonnées bancaires via businessSnapshot.bank OU users.businessProfile.bank) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu facture</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
      font-weight:400;
    }

    .wrap{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px;
      padding-bottom:28px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet);
      color:var(--violet);
      text-decoration:none;
      font-weight:800;
      font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer;
      white-space:nowrap;
    }

    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent;
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .paper{
      width:100%;
      max-width:980px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      border-radius:16px;
      padding:16px;
      margin-top:10px;
      position:relative;
    }

    .header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }

    .brandLeft{
      display:flex;
      gap:12px;
      align-items:center;
      min-width:0;
    }

    .logo{
      width:50px;
      height:50px;
      border-radius:14px;
      border:2px solid rgba(122,92,255,0.35);
      overflow:hidden;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      color:var(--violet);
      flex-shrink:0;
    }
    .logo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }

    .brand{ min-width:0; }
    .brand .name{
      font-size:18px;
      font-weight:800;
      line-height:1.15;
    }

    .metaRight{
      text-align:right;
      font-size:12px;
      color:#333;
      line-height:1.35;
      white-space:nowrap;
    }

    .docTitle{
      margin-top:10px;
      text-align:center;
      font-weight:800;
      font-size:14px;
      letter-spacing:.2px;
    }

    .grid2{
      margin-top:12px;
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    @media(min-width:820px){
      .grid2{ grid-template-columns:1fr 1fr; }
    }

    .box{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }

    .box h3{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    .line{
      font-size:12.5px;
      font-weight:500;
      color:#111;
      line-height:1.35;
      word-break:break-word;
    }

    .mut{
      color:var(--muted);
      font-weight:500;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      overflow:hidden;
      border-radius:12px;
      table-layout:fixed;
    }

    thead th{
      text-align:left;
      font-size:11.5px;
      color:#444;
      font-weight:700;
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.07);
      background:rgba(248,244,255,.6);
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    tbody td{
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      font-size:12.5px;
      font-weight:500;
      vertical-align:top;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    tbody tr:last-child td{ border-bottom:none; }

    .right{
      text-align:right;
      white-space:nowrap;
    }

    .col-presta{ width:34%; }
    .col-qty{ width:12%; }
    .col-pu{ width:13%; }
    .col-tht{ width:13%; }
    .col-tva{ width:14%; }
    .col-ttc{ width:14%; }

    .summary{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .totalBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }

    .totalRow{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }

    .totalRow .lbl{
      font-size:14px;
      font-weight:700;
      color:#111;
      line-height:1.2;
    }

    .totalRow .amt{
      font-size:14px;
      font-weight:700;
      color:#111;
      line-height:1.2;
    }

    .totalRow.ttc .lbl{
      font-size:14px;
      font-weight:700;
    }

    .totalRow.ttc .amt{
      font-size:14px;
      font-weight:800;
    }

    .totalSub{
      margin-top:6px;
      font-size:11.5px;
      color:var(--muted);
      font-weight:500;
      line-height:1.4;
    }

    .payBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }

    .payBox h3{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    .sectionTitle{
      margin-top:12px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    .footer{
      margin-top:12px;
      padding-top:10px;
      border-top:1px dashed rgba(122,92,255,0.35);
      text-align:center;
      font-size:11px;
      color:#444;
      font-weight:500;
      line-height:1.35;
    }

    .alert{
      width:100%;
      max-width:980px;
      margin-top:12px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-left:5px solid #b3261e;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px;
      font-size:12px;
      font-weight:600;
      color:#333;
      display:none;
      white-space:pre-wrap;
    }

    @media(max-width:640px){
      thead th{
        font-size:10.5px;
        padding:7px 6px;
      }
      tbody td{
        font-size:11.5px;
        padding:7px 6px;
      }

      .col-presta{ width:32%; }
      .col-qty{ width:12%; }
      .col-pu{ width:13%; }
      .col-tht{ width:14%; }
      .col-tva{ width:15%; }
      .col-ttc{ width:14%; }

      .totalRow .lbl,
      .totalRow .amt,
      .totalRow.ttc .lbl,
      .totalRow.ttc .amt{
        font-size:14px;
      }
    }

    @media print{
      .topbar, button{ display:none !important; }
      body{ background:#fff !important; }
      @page{ margin:8mm; }

      .paper{
        box-shadow:none !important;
        border:none !important;
        border-radius:0 !important;
        max-width:none !important;
        padding:0 !important;
        position:relative;
      }

      .docTitle{ margin-top:6px !important; }
      .grid2{ grid-template-columns:1fr 1fr !important; gap:6px !important; }
      .summary{ gap:6px !important; }
      .box, .totalBox, .payBox{ padding:6px 8px !important; }
      table{ margin-top:8px !important; }
      table thead th, table tbody td{ padding:6px 7px !important; }
      .sectionTitle{ margin-top:8px !important; }

      .footer{
        position:fixed;
        left:0;
        right:0;
        bottom:6mm;
        border-top:1px dashed rgba(0,0,0,0.25);
        padding-top:4px;
        font-size:10px !important;
        line-height:1.2 !important;
        text-align:center;
        background:#fff;
        z-index:9999;
      }

      .paper{
        padding-bottom:22mm !important;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <button class="pill" id="backBtn">← Retour</button>
      <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
        <button class="pill primary" type="button" id="printBtn">Imprimer / PDF</button>
      </div>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="paper" id="paper">
      <div class="header">
        <div class="brandLeft">
          <div class="logo">
            <img id="logoImg" alt="Logo">
            <span id="logoFallback">✓</span>
          </div>
          <div class="brand">
            <div class="name" id="companyName">Conciergerie</div>
          </div>
        </div>

        <div class="metaRight">
          <div>Émise le <span id="issuedAtLabel">—</span></div>
          <div><b>Échéance <span id="dueAtLabel">—</span></b></div>
        </div>
      </div>

      <div class="docTitle" id="docTitle">FACTURE N° —</div>

      <div class="grid2">
        <div class="box">
          <h3>Société</h3>
          <div class="line" id="businessBlock">—</div>
        </div>

        <div class="box">
          <h3>Client</h3>
          <div class="line" id="clientBlock">—</div>
        </div>
      </div>

      <div class="sectionTitle">Logement & période</div>
      <div class="box">
        <div class="line" id="homeBlock">—</div>
      </div>

      <table aria-label="Lignes facture">
        <thead>
          <tr>
            <th class="col-presta">Prestation</th>
            <th class="col-qty right">Qté</th>
            <th class="col-pu right">PU HT</th>
            <th class="col-tht right">Total HT</th>
            <th class="col-tva right">TVA</th>
            <th class="col-ttc right">Total TTC</th>
          </tr>
        </thead>
        <tbody id="linesTbody"></tbody>
      </table>

      <div class="summary">
        <div class="totalBox">
          <div class="totalRow">
            <span class="lbl">Total HT</span>
            <span class="amt" id="totalHtLabel">0,00 €</span>
          </div>
          <div class="totalRow">
            <span class="lbl">Total TVA</span>
            <span class="amt" id="totalTvaLabel">0,00 €</span>
          </div>
          <div class="totalRow ttc">
            <span class="lbl">Total TTC</span>
            <span class="amt" id="totalTtcLabel">0,00 €</span>
          </div>
          <div class="totalSub" id="totalSubLabel">—</div>
        </div>

        <div class="payBox">
          <h3>Paiement</h3>
          <div class="line" id="paymentBlock">—</div>
        </div>
      </div>

      <div class="sectionTitle">Conditions</div>
      <div class="box">
        <div class="line" id="conditionsBlock">—</div>
      </div>

      <div class="sectionTitle" id="bankTitle">Coordonnées bancaires</div>
      <div class="box" id="bankBox">
        <div class="line" id="bankBlock">—</div>
      </div>

      <div class="sectionTitle">Pénalités</div>
      <div class="box">
        <div class="line" id="penaltiesBlock">—</div>
      </div>

      <div class="footer" id="footerBlock">—</div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, collection, query, where, getDocs, limit
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const paper = document.getElementById("paper");
    const backBtn = document.getElementById("backBtn");
    const printBtn = document.getElementById("printBtn");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");
    const companyName = document.getElementById("companyName");

    const issuedAtLabel = document.getElementById("issuedAtLabel");
    const dueAtLabel = document.getElementById("dueAtLabel");
    const docTitle = document.getElementById("docTitle");

    const businessBlock = document.getElementById("businessBlock");
    const clientBlock = document.getElementById("clientBlock");
    const homeBlock = document.getElementById("homeBlock");
    const linesTbody = document.getElementById("linesTbody");

    const totalHtLabel = document.getElementById("totalHtLabel");
    const totalTvaLabel = document.getElementById("totalTvaLabel");
    const totalTtcLabel = document.getElementById("totalTtcLabel");
    const totalSubLabel = document.getElementById("totalSubLabel");

    const paymentBlock = document.getElementById("paymentBlock");
    const conditionsBlock = document.getElementById("conditionsBlock");
    const bankTitle = document.getElementById("bankTitle");
    const bankBox = document.getElementById("bankBox");
    const bankBlock = document.getElementById("bankBlock");
    const penaltiesBlock = document.getElementById("penaltiesBlock");
    const footerBlock = document.getElementById("footerBlock");

    let currentDoc = null;
    let currentDocId = "";
    let currentInvoiceNumber = "";
    let isOwnerView = false;
    let isDraftView = false;

    function showAlert(msg){
      alertBox.style.display = "block";
      alertBox.textContent = msg || "Erreur";
    }

    function esc(s){
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " €";
    }

    function normalizeEmail(s){
      return String(s || "").trim().toLowerCase();
    }

    function ddmmyyyy(date){
      if(!(date instanceof Date) || Number.isNaN(date.getTime())) return "—";
      const dd = String(date.getDate()).padStart(2,"0");
      const mm = String(date.getMonth()+1).padStart(2,"0");
      const yy = date.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }

    function parseDDMMYYYY(s){
      const x = String(s || "").trim();
      if(!/^\d{2}\/\d{2}\/\d{4}$/.test(x)) return null;
      const [dd, mm, yy] = x.split("/").map(v => parseInt(v,10));
      const d = new Date(yy, (mm || 1) - 1, dd || 1);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function addDays(date, days){
      const d = new Date(date.getTime());
      d.setDate(d.getDate() + (Number(days) || 0));
      return d;
    }

    function termLabel(term){
      const t = String(term || "").toUpperCase();
      if(t === "RECEPTION") return "À réception";
      if(t === "8J") return "8 jours";
      if(t === "15J") return "15 jours";
      if(t === "30J") return "30 jours";
      if(t === "45J") return "45 jours";
      return term || "—";
    }

    function termToDays(term){
      const t = String(term || "").toUpperCase();
      if(t === "RECEPTION") return 0;
      if(t === "8J") return 8;
      if(t === "15J") return 15;
      if(t === "30J") return 30;
      if(t === "45J") return 45;
      return 0;
    }

    function modeLabel(mode){
      const m = String(mode || "").toUpperCase();
      if(m === "VIREMENT") return "Virement";
      if(m === "ESPECES") return "Espèces";
      if(m === "CHEQUE") return "Chèque";
      if(m === "CB") return "Carte bancaire";
      return mode || "—";
    }

    function getPenaltyTemplate(mode){
      const m = String(mode || "").toUpperCase();
      if(m === "B2B"){
        return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur + indemnité forfaitaire de recouvrement de 40 €.";
      }
      return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur.";
    }

    function getStayPeriod(d){
      const pick = (v)=> String(v || "").trim();
      const a = pick(d?.arrivalDateKey || d?.arrivalDate || d?.checkinDate || d?.arrival || d?.dateArrivee);
      const b = pick(d?.departureDateKey || d?.departureDate || d?.checkoutDate || d?.departure || d?.dateDepart);
      if(a && b) return `Du ${a} au ${b}`;
      if(a && !b) return `À partir du ${a}`;
      if(!a && b) return `Jusqu’au ${b}`;
      return "—";
    }

    function extractAddr(obj){
      const o = obj || {};
      const a = (o.address && typeof o.address === "object") ? o.address : null;
      const ba = (o.billingAddress && typeof o.billingAddress === "object") ? o.billingAddress : null;

      const street =
        String(o.address1 || o.street || o.addr1 || o.line1 || "").trim() ||
        (typeof o.address === "string" ? String(o.address).trim() : "") ||
        String(a?.street || a?.line1 || a?.address1 || a?.addr1 || "").trim() ||
        String(ba?.street || ba?.line1 || ba?.address1 || "").trim();

      const address2 =
        String(o.address2 || o.addr2 || o.line2 || "").trim() ||
        String(a?.address2 || a?.line2 || a?.addr2 || "").trim() ||
        String(ba?.address2 || ba?.line2 || "").trim();

      const zip =
        String(o.zip || o.postalCode || o.cp || "").trim() ||
        String(a?.zip || a?.postalCode || a?.cp || "").trim() ||
        String(ba?.zip || ba?.postalCode || "").trim();

      const city =
        String(o.city || o.town || o.locality || "").trim() ||
        String(a?.city || a?.town || a?.locality || "").trim() ||
        String(ba?.city || ba?.town || "").trim();

      const country =
        String(o.country || "").trim() ||
        String(a?.country || "").trim() ||
        String(ba?.country || "").trim() ||
        "FR";

      return { street, address2, zip, city, country };
    }

    function getVatContext(d){
      const bs = d?.businessSnapshot || {};
      const vat = bs?.vat || {};
      return {
        enabled:
          d?.vatSnapshot?.enabled === true ||
          vat.enabled === true ||
          Number(d?.totalTVA || 0) > 0,
        serviceRate: Number.isFinite(Number(d?.vatSnapshot?.serviceRate))
          ? Number(d.vatSnapshot.serviceRate)
          : (Number.isFinite(Number(vat?.serviceRate)) ? Number(vat.serviceRate) : 0.20),
        productRate: Number.isFinite(Number(d?.vatSnapshot?.productRate))
          ? Number(d.vatSnapshot.productRate)
          : (Number.isFinite(Number(vat?.productRate)) ? Number(vat.productRate) : 0.10)
      };
    }

    function getLineTotalHT(l){
      if(Number.isFinite(Number(l?.totalHT))) return Number(l.totalHT);
      const qty = Number(l?.qty || 0);
      const pu = Number(l?.unitPrice || 0);
      return qty * pu;
    }

    function getLineTotalTVA(l){
      if(Number.isFinite(Number(l?.totalTVA))) return Number(l.totalTVA);
      return 0;
    }

    function getLineTotalTTC(l){
      if(Number.isFinite(Number(l?.totalTTC))) return Number(l.totalTTC);
      return getLineTotalHT(l) + getLineTotalTVA(l);
    }

    function getStoredTotals(d){
      const lines = Array.isArray(d?.lines) ? d.lines : [];

      const hasStored =
        Number.isFinite(Number(d?.totalHT)) &&
        Number.isFinite(Number(d?.totalTVA)) &&
        Number.isFinite(Number(d?.totalTTC));

      if(hasStored){
        return {
          totalHT: Number(d.totalHT),
          totalTVA: Number(d.totalTVA),
          totalTTC: Number(d.totalTTC)
        };
      }

      let totalHT = 0;
      let totalTVA = 0;
      let totalTTC = 0;

      for(const l of lines){
        totalHT += getLineTotalHT(l);
        totalTVA += getLineTotalTVA(l);
        totalTTC += getLineTotalTTC(l);
      }

      return { totalHT, totalTVA, totalTTC };
    }

    function getBusinessSnapshot(d){
      return d?.businessSnapshot || {};
    }

    function getBusinessExemptionText(d, fallbackProfile){
      return String(
        d?.businessSnapshot?.tvaExemptionText ||
        fallbackProfile?.businessProfile?.tvaExemptionText ||
        d?.tvaExemptionText ||
        "TVA non applicable – art. 293 B du CGI"
      ).trim();
    }

    function getBankSource(d, fallbackProfile){
      const snapBank = d?.businessSnapshot?.bank || {};
      const profileBank = fallbackProfile?.businessProfile?.bank || {};

      return {
        bankName: String(snapBank.bankName || snapBank.name || profileBank.bankName || profileBank.name || "").trim(),
        holder: String(snapBank.holder || profileBank.holder || "").trim(),
        iban: String(snapBank.iban || profileBank.iban || "").trim(),
        bic: String(snapBank.bic || profileBank.bic || "").trim()
      };
    }

    function clientSnapshot(d){
      return {
        fullname: String(d?.clientDisplayName || d?.clientName || d?.ownerName || "").trim(),
        email: normalizeEmail(d?.clientEmail || d?.ownerEmail || ""),
        phone: String(d?.clientPhone || d?.ownerPhone || "").trim(),
        address1: String(d?.clientAddress1 || d?.ownerAddress1 || d?.clientAddress || "").trim(),
        address2: String(d?.clientAddress2 || d?.ownerAddress2 || "").trim(),
        zip: String(d?.clientZip || d?.ownerZip || "").trim(),
        city: String(d?.clientCity || d?.ownerCity || "").trim(),
        country: String(d?.clientCountry || d?.ownerCountry || "FR").trim()
      };
    }

    async function lookupOwnerByEmailInOwners(conciergerieUid, emailLower){
      if(!emailLower) return null;

      const qO = query(
        collection(db, "owners"),
        where("conciergerieUid", "==", String(conciergerieUid)),
        where("emailLower", "==", emailLower),
        where("isActive", "==", true),
        limit(1)
      );

      const snap = await getDocs(qO);
      if(snap.empty) return null;

      const doc0 = snap.docs[0];
      const o = doc0.data() || {};
      const addr = extractAddr(o);

      return {
        docId: doc0.id,
        email: normalizeEmail(o.email || emailLower),
        fullname: String(o.fullname || o.displayName || o.name || "").trim(),
        address1: addr.street,
        address2: addr.address2,
        zip: addr.zip,
        city: addr.city,
        country: addr.country,
        phone: String(o.phone || o.tel || o.mobile || "").trim()
      };
    }

    async function loadOwnerFromDoc(conciergerieUid, d){
      const ownerDocId =
        String(d?.ownerDocId || "").trim() ||
        String(d?.clientOwnerDocId || "").trim();

      if(ownerDocId){
        try{
          const snap = await getDoc(doc(db, "owners", ownerDocId));
          if(snap.exists()){
            const o = snap.data() || {};
            if(String(o.conciergerieUid || "") === String(conciergerieUid)){
              const addr = extractAddr(o);
              return {
                docId: snap.id,
                email: normalizeEmail(o.email || ""),
                fullname: String(o.fullname || o.displayName || o.name || "").trim(),
                address1: addr.street,
                address2: addr.address2,
                zip: addr.zip,
                city: addr.city,
                country: addr.country,
                phone: String(o.phone || o.tel || o.mobile || "").trim()
              };
            }
          }
        }catch(e){}
      }

      const emailLower = normalizeEmail(d?.clientEmail || d?.ownerEmail || "");
      if(emailLower){
        try{
          return await lookupOwnerByEmailInOwners(conciergerieUid, emailLower);
        }catch(e){
          return null;
        }
      }

      return null;
    }

    async function loadHomeClientFallback(d){
      const hid = String(d?.homeId || d?.homeDocId || "").trim();
      if(!hid) return null;

      try{
        const hSnap = await getDoc(doc(db, "homes", hid));
        if(!hSnap.exists()) return null;

        const h = hSnap.data() || {};
        const name = String(h.ownerName || h.ownerFullname || h.ownerDisplayName || h.owner || "").trim();
        const email = normalizeEmail(h.ownerEmail || h.ownerAccountEmail || h.email || "");
        const phone = String(h.ownerPhone || h.ownerTel || h.phone || "").trim();
        const addr = extractAddr(h.owner || h);

        if(!(name || email || phone || addr.street || addr.zip || addr.city)) return null;

        return {
          name,
          email,
          phone,
          address1: addr.street,
          address2: addr.address2,
          zip: addr.zip,
          city: addr.city,
          country: addr.country
        };
      }catch(e){
        return null;
      }
    }

    function computeInvoiceDates(d){
      const issuedStr = String(d?.invoiceIssuedDate || "").trim();
      const issuedDate = parseDDMMYYYY(issuedStr) || new Date();
      const issuedLabel = issuedStr || ddmmyyyy(issuedDate);

      const term = String(d?.invoicePaymentTerm || "RECEPTION").toUpperCase();
      const dueDate = addDays(issuedDate, termToDays(term));

      return {
        issuedLabel,
        dueLabel: ddmmyyyy(dueDate)
      };
    }

    function renderHeader(d, fallbackProfile){
      const bs = getBusinessSnapshot(d);
      const src = Object.keys(bs || {}).length ? bs : (fallbackProfile?.businessProfile || {});

      const company = String(src.companyName || "Conciergerie").trim();
      const logoUrl = String(src.logoUrl || "").trim();

      companyName.textContent = company || "Conciergerie";

      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "inline";
      }

      const dates = computeInvoiceDates(d);
      issuedAtLabel.textContent = dates.issuedLabel || "—";
      dueAtLabel.textContent = dates.dueLabel || "—";

      const num = String(d?.invoiceNumber || "").trim();
      currentInvoiceNumber = num || "";
      docTitle.textContent = num ? `FACTURE N° ${num}` : "FACTURE N° —";
    }

    function renderBusinessBlock(d, fallbackProfile){
      const bs = getBusinessSnapshot(d);
      const src = Object.keys(bs || {}).length ? bs : (fallbackProfile?.businessProfile || {});

      const rows = [];

      const company = String(src.companyName || "Conciergerie").trim();
      const street = String(src.address?.street || "").trim();
      const zip = String(src.address?.zip || "").trim();
      const city = String(src.address?.city || "").trim();

      const siret = String(src.registration?.siret || "").trim();
      const ape = String(src.registration?.ape || "").trim();

      const email =
        String(src.billingEmail || src.email || fallbackProfile?.email || "").trim();

      const phone =
        String(src.phone || src.contact?.phone || "").trim();

      if(company) rows.push(`<div>${esc(company)}</div>`);
      if(street) rows.push(`<div>${esc(street)}</div>`);
      if(zip || city) rows.push(`<div>${esc([zip, city].filter(Boolean).join(" "))}</div>`);

      const legalBits = [];
      if(siret) legalBits.push(`SIRET ${esc(siret)}`);
      if(ape) legalBits.push(`APE ${esc(ape)}`);
      if(email) legalBits.push(esc(email));
      if(phone) legalBits.push(esc(phone));

      if(legalBits.length){
        rows.push(`<div class="mut">${legalBits.join(" • ")}</div>`);
      }

      businessBlock.innerHTML = rows.join("") || "—";
    }

    function renderClientBlock(ownerFromOwners, homeFallback, d){
      const o = ownerFromOwners || null;
      const h = homeFallback || null;
      const s = clientSnapshot(d);

      const name = String(o?.fullname || h?.name || s.fullname || "—").trim();
      const a1 = String(o?.address1 || h?.address1 || s.address1 || "").trim();
      const a2 = String(o?.address2 || h?.address2 || s.address2 || "").trim();
      const zip = String(o?.zip || h?.zip || s.zip || "").trim();
      const city = String(o?.city || h?.city || s.city || "").trim();

      const email = String(o?.email || h?.email || s.email || "").trim();
      const phone = String(o?.phone || h?.phone || s.phone || "").trim();

      const rows = [];
      if(name) rows.push(`<div>${esc(name)}</div>`);
      if(a1) rows.push(`<div>${esc(a1)}</div>`);
      if(a2) rows.push(`<div>${esc(a2)}</div>`);

      const lastLine = [zip, city].filter(Boolean).join(" ");
      if(lastLine) rows.push(`<div>${esc(lastLine)}</div>`);

      const contactBits = [];
      if(email) contactBits.push(esc(email));
      if(phone) contactBits.push(esc(phone));
      if(contactBits.length){
        rows.push(`<div class="mut">${contactBits.join(" • ")}</div>`);
      }

      clientBlock.innerHTML = rows.join("") || "—";
    }

    function renderHomeBlock(d){
      const addr = [
        String(d?.homeAddress || "").trim(),
        [String(d?.homeZip || d?.zip || d?.postalCode || "").trim(), String(d?.homeCity || "").trim()]
          .filter(Boolean)
          .join(" ")
      ].filter(Boolean).join(" • ");

      const lines = [];
      lines.push(`<div><b>Adresse</b> : ${esc(addr || "—")}</div>`);
      lines.push(`<div><b>Période</b> : ${esc(getStayPeriod(d))}</div>`);

      homeBlock.innerHTML = lines.join("");
    }

    function renderLines(d){
      const lines = Array.isArray(d?.lines) ? d.lines : [];
      const vat = getVatContext(d);

      if(!lines.length){
        linesTbody.innerHTML = `
          <tr>
            <td colspan="6" class="mut">Aucune ligne</td>
          </tr>
        `;
        return;
      }

      linesTbody.innerHTML = lines.map(l => {
        const label = String(l?.label || "Prestation").trim();
        const qty = Number(l?.qty || 0);
        const unit = String(l?.unit || "unité").trim();
        const unitPrice = Number(l?.unitPrice || 0);
        const totalHT = getLineTotalHT(l);
        const totalTVA = getLineTotalTVA(l);
        const totalTTC = getLineTotalTTC(l);
        const vatRate = Math.round((Number(l?.vatRate || 0)) * 100);

        let tvaLabel = "0% • 0,00 €";
        if(vat.enabled){
          tvaLabel = `${vatRate}% • ${money(totalTVA)}`;
        }

        return `
          <tr>
            <td class="col-presta">${esc(label)}</td>
            <td class="col-qty right">${esc(String(qty))} ${esc(unit)}</td>
            <td class="col-pu right">${money(unitPrice)}</td>
            <td class="col-tht right">${money(totalHT)}</td>
            <td class="col-tva right">${esc(tvaLabel)}</td>
            <td class="col-ttc right">${money(totalTTC)}</td>
          </tr>
        `;
      }).join("");
    }

    function renderTotals(d, fallbackProfile){
      const totals = getStoredTotals(d);
      const vat = getVatContext(d);
      const lines = Array.isArray(d?.lines) ? d.lines : [];

      totalHtLabel.textContent = money(totals.totalHT);
      totalTvaLabel.textContent = money(totals.totalTVA);
      totalTtcLabel.textContent = money(totals.totalTTC);

      if(vat.enabled || Number(totals.totalTVA) > 0){
        const serviceTVA = lines
          .filter(l => String(l?.lineType || "").toUpperCase() === "SERVICE")
          .reduce((sum, l) => sum + getLineTotalTVA(l), 0);

        const productTVA = lines
          .filter(l => String(l?.lineType || "").toUpperCase() === "PRODUCT")
          .reduce((sum, l) => sum + getLineTotalTVA(l), 0);

        totalSubLabel.textContent =
          `TVA totale ${money(totals.totalTVA)} • services ${money(serviceTVA)} • produits ${money(productTVA)}`;
      }else{
        totalSubLabel.textContent = getBusinessExemptionText(d, fallbackProfile);
      }
    }

    function renderPayment(d){
      const rows = [];
      rows.push(`<div><b>Mode</b> : ${esc(modeLabel(String(d?.invoicePaymentMode || "VIREMENT")))}</div>`);
      rows.push(`<div><b>Délai</b> : ${esc(termLabel(String(d?.invoicePaymentTerm || "RECEPTION")))}</div>`);
      paymentBlock.innerHTML = rows.join("") || "—";
    }

    function renderConditions(d, fallbackProfile){
      const rows = [];

      const quoteRef = String(d?.quoteNumber || "").trim();
      if(quoteRef){
        rows.push(`<div><b>Référence devis</b> : ${esc(quoteRef)}</div>`);
      }

      const showCancel =
        typeof d?.invoiceShowCancellation === "boolean"
          ? d.invoiceShowCancellation
          : true;

      const cancelPct = Number.isFinite(Number(d?.businessSnapshot?.conditions?.cancellationPercent))
        ? Number(d.businessSnapshot.conditions.cancellationPercent)
        : 30;

      if(showCancel){
        rows.push(`<div><b>Annulation</b> : ${esc(String(cancelPct))}% du montant en cas d’annulation moins de 48 h avant l’intervention.</div>`);
      }

      const vat = getVatContext(d);
      if(vat.enabled || Number(d?.totalTVA || 0) > 0){
        rows.push(`<div><b>TVA</b> : services ${Math.round(vat.serviceRate * 100)}% • produits ${Math.round(vat.productRate * 100)}%</div>`);
      }else{
        rows.push(`<div>${esc(getBusinessExemptionText(d, fallbackProfile))}</div>`);
      }

      conditionsBlock.innerHTML = rows.join("") || "—";
    }

    function renderBank(d, fallbackProfile){
      const bank = getBankSource(d, fallbackProfile);

      const rows = [];
      if(bank.holder) rows.push(`<div>Titulaire : ${esc(bank.holder)}</div>`);
      if(bank.bankName) rows.push(`<div>Banque : ${esc(bank.bankName)}</div>`);
      if(bank.iban) rows.push(`<div>IBAN : ${esc(bank.iban)}</div>`);
      if(bank.bic) rows.push(`<div>BIC : ${esc(bank.bic)}</div>`);

      if(!rows.length){
        bankTitle.style.display = "none";
        bankBox.style.display = "none";
        bankBlock.innerHTML = "";
        return;
      }

      bankTitle.style.display = "";
      bankBox.style.display = "";
      bankBlock.innerHTML = rows.join("");
    }

    function renderPenalties(d){
      const txt = String(d?.invoicePenaltyText || "").trim()
        || getPenaltyTemplate(String(d?.invoicePenaltyMode || "B2C"));
      penaltiesBlock.textContent = txt;
    }

    function renderFooter(d, fallbackProfile){
      const bs = getBusinessSnapshot(d);
      const src = Object.keys(bs || {}).length ? bs : (fallbackProfile?.businessProfile || {});

      const parts = [];
      const company = String(src.companyName || "Conciergerie").trim();
      const street = String(src.address?.street || "").trim();
      const zip = String(src.address?.zip || "").trim();
      const city = String(src.address?.city || "").trim();
      const siret = String(src.registration?.siret || "").trim();
      const ape = String(src.registration?.ape || "").trim();
      const email = String(src.billingEmail || src.email || fallbackProfile?.email || "").trim();
      const phone = String(src.phone || src.contact?.phone || "").trim();

      if(company) parts.push(company);
      if(street) parts.push(street);
      if(zip || city) parts.push([zip, city].filter(Boolean).join(" "));
      if(siret || ape) parts.push([siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "));
      if(email || phone) parts.push([email, phone].filter(Boolean).join(" • "));

      footerBlock.textContent = parts.join(" • ") || "Facture éditée par CleanUp Manager";
    }

    function renderAll(d, fallbackProfile, ownerFromOwners, homeFallback){
      renderHeader(d, fallbackProfile);
      renderBusinessBlock(d, fallbackProfile);
      renderClientBlock(ownerFromOwners, homeFallback, d);
      renderHomeBlock(d);
      renderLines(d);
      renderTotals(d, fallbackProfile);
      renderPayment(d);
      renderConditions(d, fallbackProfile);
      renderBank(d, fallbackProfile);
      renderPenalties(d);
      renderFooter(d, fallbackProfile);
    }

    function loadDraftFromSession(expectedId){
      try{
        const raw = sessionStorage.getItem("invoiceDraftPreview");
        if(!raw) return null;
        const draft = JSON.parse(raw);
        if(!draft || typeof draft !== "object") return null;
        if(expectedId && String(draft.id || "") !== String(expectedId)) return null;
        return draft;
      }catch(e){
        return null;
      }
    }

    function loginRedirectUrl(){
      const token = getParam("token");
      const base = isOwnerView
        ? "login.html?role=proprietaire"
        : "login.html?role=conciergerie";
      return token ? `${base}&token=${encodeURIComponent(token)}` : base;
    }

    backBtn.addEventListener("click", () => {
      if(isOwnerView){
        window.location.href = "owner-facturation.html";
        return;
      }

      if(history.length > 1){
        history.back();
      }else{
        window.location.href = "factures-liste.html";
      }
    });

    printBtn.addEventListener("click", () => {
      const originalTitle = document.title;
      const numberRaw =
        String(currentInvoiceNumber || "").trim() ||
        String(currentDocId || "").trim() ||
        "Facture";

      const safeNumber = numberRaw.replace(/[^\w\-]/g, "_");
      document.title = "CleanUp_Facture_" + safeNumber;

      window.print();

      setTimeout(() => {
        document.title = originalTitle;
      }, 1000);
    });

    onAuthStateChanged(auth, async (user) => {
      currentDocId = getParam("docId") || getParam("eventId");
      isOwnerView = getParam("owner") === "1";
      isDraftView = getParam("draft") === "1";
      const eventId = getParam("eventId");
      const docId = getParam("docId");

      if(!currentDocId){
        showAlert("Document manquant.");
        paper.style.display = "none";
        return;
      }

      if(isOwnerView && eventId){
        showAlert("Mode propriétaire : eventId non supporté. Ouvre la facture via docId.");
        paper.style.display = "none";
        backBtn.style.display = "none";
        return;
      }

      if(!isOwnerView && !user){
        location.href = loginRedirectUrl();
        return;
      }

      try{
        let snap = null;

        if(docId){
          snap = await getDoc(doc(db, "salesDocuments", docId));
          if(!snap.exists()) throw new Error("Facture introuvable.");
        }else{
          snap = await getDoc(doc(db, "events", eventId));
          if(!snap.exists()) throw new Error("Facture introuvable.");
        }

        currentDoc = { id: snap.id, ...(snap.data() || {}) };

        if(isOwnerView){
          backBtn.style.display = "none";

          const ouid = String(currentDoc?.ownerUid || "").trim();
          if(!ouid){
            showAlert("Accès refusé : ownerUid manquant sur ce document.");
            paper.style.display = "none";
            return;
          }

          if(!user){
            location.href = loginRedirectUrl();
            return;
          }

          if(ouid !== String(user.uid)){
            showAlert("Accès refusé.");
            paper.style.display = "none";
            return;
          }

          if(currentDoc?.ownerVisible !== true){
            showAlert("Cette facture n’est pas accessible au propriétaire.");
            paper.style.display = "none";
            return;
          }
        }else{
          if(currentDoc?.conciergerieUid && String(currentDoc.conciergerieUid) !== String(user.uid)){
            showAlert("Accès refusé.");
            paper.style.display = "none";
            return;
          }
        }

        if(isDraftView && isOwnerView){
          showAlert("Accès refusé sur un brouillon.");
          paper.style.display = "none";
          return;
        }

        if(isDraftView && !isOwnerView){
          const expectedId = docId || eventId;
          const draft = loadDraftFromSession(expectedId);
          if(draft){
            currentDoc = { ...currentDoc, ...draft, id: currentDoc.id };
          }
        }

        const conciergerieUid = String(currentDoc?.conciergerieUid || "").trim();
        if(!conciergerieUid){
          showAlert("conciergerieUid manquant sur le document.");
          paper.style.display = "none";
          return;
        }

        let fallbackProfile = {};
        if(!isOwnerView){
          const userSnap = await getDoc(doc(db, "users", conciergerieUid));
          fallbackProfile = userSnap.exists() ? (userSnap.data() || {}) : {};
        }

        let ownerFromOwners = null;
        let homeFallback = null;
        if(!isOwnerView){
          ownerFromOwners = await loadOwnerFromDoc(conciergerieUid, currentDoc);
          homeFallback = await loadHomeClientFallback(currentDoc);
        }

        renderAll(currentDoc, fallbackProfile, ownerFromOwners, homeFallback);
      }catch(e){
        console.error(e);
        showAlert(e?.message || "Erreur chargement de la facture.");
        paper.style.display = "none";
      }
    });
  </script>
</body>
</html>
