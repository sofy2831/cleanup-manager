<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu facture</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
      font-weight:400;
    }

    .wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px; padding-bottom:28px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:800; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer;
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .paper{
      width:100%; max-width:980px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      border-radius:16px;
      padding:16px;
      margin-top:10px;
      position:relative;
    }

    .header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .brandLeft{
      display:flex; gap:12px; align-items:center; min-width:0;
    }
    .logo{
      width:50px; height:50px; border-radius:14px;
      border:2px solid rgba(122,92,255,0.35);
      overflow:hidden; background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; color:var(--violet);
      flex-shrink:0;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:none; }

    .brand{ min-width:0; }
    .brand .name{ font-size:18px; font-weight:800; line-height:1.15; }
    .brand .sub{ display:none; }

    .metaRight{
      text-align:right;
      font-size:12px;
      color:#333;
      line-height:1.35;
      white-space:nowrap;
    }
    .metaRight b{ font-weight:700; }

    .docTitle{
      margin-top:10px;
      text-align:center;
      font-weight:800;
      font-size:14px;
      letter-spacing:.2px;
    }
    .docMeta{ display:none; }

    .grid2{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    @media(min-width:820px){
      .grid2{ grid-template-columns: 1fr 1fr; }
    }

    .box{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }
    .box h3{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }
    .line{
      font-size:12.5px;
      font-weight:500;
      color:#111;
      line-height:1.35;
      word-break:break-word;
    }
    .mut{ color:var(--muted); font-weight:500; }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      overflow:hidden;
      border-radius:12px;
    }
    thead th{
      text-align:left;
      font-size:11.5px;
      color:#444;
      font-weight:700;
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.07);
      background:rgba(248,244,255,.6);
    }
    tbody td{
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      font-size:12.5px;
      font-weight:500;
      vertical-align:top;
    }
    tbody tr:last-child td{ border-bottom:none; }
    .right{ text-align:right; white-space:nowrap; }

    .summary{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .totalBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }
    .totalRow{
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      font-weight:700;
    }
    .totalRow .big{ font-size:17px; font-weight:800; }
    .totalSub{ margin-top:6px; font-size:11.5px; color:var(--muted); font-weight:500; }

    .payBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }
    .payBox h3{ margin:0 0 6px; font-size:12px; font-weight:800; color:#333; }

    .sectionTitle{
      margin-top:12px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    .footer{
      margin-top:12px;
      padding-top:10px;
      border-top:1px dashed rgba(122,92,255,0.35);
      text-align:center;
      font-size:11px;
      color:#444;
      font-weight:500;
      line-height:1.35;
    }

    .alert{
      width:100%; max-width:980px;
      margin-top:12px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-left:5px solid #b3261e;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px;
      font-size:12px;
      font-weight:600;
      color:#333;
      display:none;
      white-space:pre-wrap;
    }

    @media print{
      .topbar, button{ display:none !important; }
      body{ background:#fff !important; }
      @page{ margin: 8mm; }

      .paper{
        box-shadow:none !important;
        border:none !important;
        border-radius:0 !important;
        max-width:none !important;
        padding: 0 !important;
        position: relative;
      }

      .docTitle{ margin-top:6px !important; }
      .grid2{ grid-template-columns: 1fr 1fr !important; gap:6px !important; }
      .summary{ gap:6px !important; }
      .box, .totalBox, .payBox{ padding:6px 8px !important; }
      table{ margin-top:8px !important; }
      table thead th, table tbody td{ padding:6px 7px !important; }
      .sectionTitle{ margin-top:8px !important; }

      .footer{
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        border-top: 1px dashed rgba(0,0,0,0.25);
        padding-top: 4px;
        margin-top: 0 !important;
        font-size: 10px !important;
        line-height: 1.2 !important;
        text-align: center;
        background:#fff;
      }
      .paper{ padding-bottom: 12mm !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">

    <div class="paper" id="paper">

          <div class="line" id="socLine1">—</div>

          <div class="line" id="socLine3"></div>

          <h3>Client</h3>
          <div class="line" id="cliLine1">—</div>

      <div class="box">
        <div class="line" id="homeLine1">—</div>

      <table aria-label="Lignes facture">

          <tr>

  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc,
      collection, query, where, getDocs, limit
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const printBtn = document.getElementById("printBtn");
    const backLink = document.getElementById("backLink");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");
    const companyNameEl = document.getElementById("companyName");

    const docTitleEl = document.getElementById("docTitle");
    const docMetaEl  = document.getElementById("docMeta");
    const metaRightEl = document.getElementById("metaRight");

    const soc1 = document.getElementById("socLine1");
    const soc2 = document.getElementById("socLine2");
    const soc3 = document.getElementById("socLine3");
    const soc4 = document.getElementById("socLine4");

    const cli1 = document.getElementById("cliLine1");
    const cli2 = document.getElementById("cliLine2");
    const cli3 = document.getElementById("cliLine3");
    const cli4 = document.getElementById("cliLine4");

    const homeLine1 = document.getElementById("homeLine1");
    const homeLine2 = document.getElementById("homeLine2");

    const linesBody = document.getElementById("linesBody");

    const totalHtEl  = document.getElementById("totalHt");
const totalTvaEl = document.getElementById("totalTva");
const totalTtcEl = document.getElementById("totalTtc");
    const tvaLineEl  = document.getElementById("tvaLine");

    const payModeEl = document.getElementById("payMode");
    const payTermEl = document.getElementById("payTerm");

    const cond1 = document.getElementById("cond1");
    const cond2 = document.getElementById("cond2");
    const cond3 = document.getElementById("cond3");

    const bankTitle = document.getElementById("bankTitle");
    const bankBox   = document.getElementById("bankBox");
    const bank1 = document.getElementById("bankLine1");
    const bank2 = document.getElementById("bankLine2");
    const bank3 = document.getElementById("bankLine3");

    const penaltyTextEl = document.getElementById("penaltyText");
    const penTitle = document.getElementById("penTitle");
    const penBox = document.getElementById("penBox");

    const footerEl = document.getElementById("footer");

    // state
    let docData = null;
    let isDraftPreview = false;

    // ✅ PRINT STATE (évite d/docId hors scope)
    let currentDocId = "";
    let currentInvoiceNumber = "";

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function showError(msg){
      alertBox.style.display = "block";
      alertBox.textContent = "⛔ " + msg;
    }
    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function isOwnerMode(){
      return getParam("owner") === "1";
    }
    function ddmmyyyy(d){
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yy = d.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }
    function addDays(baseDate, days){
      const d = new Date(baseDate.getTime());
      d.setDate(d.getDate() + (Number(days)||0));
      return d;
    }
    function termLabel(term){
      const t = String(term||"").toUpperCase();
      if(t === "RECEPTION") return "À réception";
      if(t === "8J") return "8 jours";
      if(t === "15J") return "15 jours";
      if(t === "30J") return "30 jours";
      if(t === "45J") return "45 jours";
      return term || "—";
    }
    function termToDays(term){
      const t = String(term||"").toUpperCase();
      if(t === "RECEPTION") return 0;
      if(t === "8J") return 8;
      if(t === "15J") return 15;
      if(t === "30J") return 30;
      if(t === "45J") return 45;
      return 0;
    }
    function modeLabel(mode){
      const m = String(mode||"").toUpperCase();
      if(m === "VIREMENT") return "Virement";
      if(m === "ESPECES") return "Espèces";
      if(m === "CHEQUE") return "Chèque";
      return mode || "—";
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

    function computeTotals(linesArr, vatEnabled, vatRate){
      let ht = 0;
      for(const l of (Array.isArray(linesArr) ? linesArr : [])){
        ht += (Number(l?.qty)||0) * (Number(l?.unitPrice)||0);
      }
      const tva = vatEnabled ? (ht * (Number(vatRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

function getVatContext(d){
  const bs = d?.businessSnapshot || {};
  const vat = bs?.vat || {};

  return {
    vatEnabled: !!vat.enabled,
    vatRate: Number.isFinite(Number(vat.rate)) ? Number(vat.rate) : 0,
    serviceRate: Number.isFinite(Number(d?.vatSnapshot?.serviceRate)) ? Number(d.vatSnapshot.serviceRate) : 0.20,
    productRate: Number.isFinite(Number(d?.vatSnapshot?.productRate)) ? Number(d.vatSnapshot.productRate) : 0.10
  };
}

function getStoredLinePUHT(l){
  if(Number.isFinite(Number(l?.unitPrice))) return Number(l.unitPrice);
  return 0;
}

function getStoredLineTTC(l){
  if(Number.isFinite(Number(l?.totalTTC))) return Number(l.totalTTC);

  const qty = Number(l?.qty) || 0;
  const pu = Number(l?.unitPrice) || 0;

  if(Number.isFinite(Number(l?.totalHT)) && Number.isFinite(Number(l?.totalTVA))){
    return Number(l.totalHT) + Number(l.totalTVA);
  }

  return qty * pu;
}

function getStoredTotals(d){
  const lines = Array.isArray(d?.lines) ? d.lines : [];

  const hasStoredTotals =
    Number.isFinite(Number(d?.totalHT)) &&
    Number.isFinite(Number(d?.totalTVA)) &&
    Number.isFinite(Number(d?.totalTTC));

  if(hasStoredTotals){
    return {
      ht: Number(d.totalHT),
      tva: Number(d.totalTVA),
      ttc: Number(d.totalTTC)
    };
  }

  let ht = 0;
  let tva = 0;
  let ttc = 0;

  for(const l of lines){
    if(Number.isFinite(Number(l?.totalHT))) ht += Number(l.totalHT);
    else ht += (Number(l?.qty) || 0) * (Number(l?.unitPrice) || 0);

    if(Number.isFinite(Number(l?.totalTVA))) tva += Number(l.totalTVA);

    if(Number.isFinite(Number(l?.totalTTC))) ttc += Number(l.totalTTC);
    else{
      const lineHT = Number.isFinite(Number(l?.totalHT))
        ? Number(l.totalHT)
        : ((Number(l?.qty) || 0) * (Number(l?.unitPrice) || 0));
      const lineTVA = Number.isFinite(Number(l?.totalTVA)) ? Number(l.totalTVA) : 0;
      ttc += lineHT + lineTVA;
    }
  }

  return { ht, tva, ttc };
}
    
    function getPenaltyTemplate(mode){
      const m = String(mode||"").toUpperCase();
      if(m === "B2B"){
        return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur + indemnité forfaitaire de recouvrement de 40 €.";
      }
      return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur.";
    }

    function getStayPeriod(d){
      const pick = (v)=> (String(v||"").trim() || "");
      const a = pick(d?.arrivalDateKey || d?.arrivalDate || d?.checkinDate || d?.arrival || d?.dateArrivee);
      const b = pick(d?.departureDateKey || d?.departureDate || d?.checkoutDate || d?.departure || d?.dateDepart);
      if(a && b) return `Du ${a} au ${b}`;
      if(a && !b) return `À partir du ${a}`;
      if(!a && b) return `Jusqu’au ${b}`;
      return "—";
    }

    function parseDDMMYYYY(s){
      const x = String(s||"").trim();
      if(!/^\d{2}\/\d{2}\/\d{4}$/.test(x)) return null;
      const [dd,mm,yy] = x.split("/").map(n=>parseInt(n,10));
      const d = new Date(yy, (mm||1)-1, dd||1);
      return isNaN(d.getTime()) ? null : d;
    }

    function extractAddr(obj){
      const o = obj || {};
      const a = (o.address && typeof o.address === "object") ? o.address : null;
      const ba = (o.billingAddress && typeof o.billingAddress === "object") ? o.billingAddress : null;

      const street =
        String(o.address1 || o.street || o.addr1 || o.line1 || "").trim() ||
        (typeof o.address === "string" ? String(o.address).trim() : "") ||
        String(a?.street || a?.line1 || a?.address1 || a?.addr1 || "").trim() ||
        String(ba?.street || ba?.line1 || ba?.address1 || "").trim();

      const address2 =
        String(o.address2 || o.addr2 || o.line2 || "").trim() ||
        String(a?.address2 || a?.line2 || a?.addr2 || "").trim() ||
        String(ba?.address2 || ba?.line2 || "").trim();

      const zip =
        String(o.zip || o.postalCode || o.cp || "").trim() ||
        String(a?.zip || a?.postalCode || a?.cp || "").trim() ||
        String(ba?.zip || ba?.postalCode || "").trim();

      const city =
        String(o.city || o.town || o.locality || "").trim() ||
        String(a?.city || a?.town || a?.locality || "").trim() ||
        String(ba?.city || ba?.town || "").trim();

      const country =
        String(o.country || "").trim() ||
        String(a?.country || "").trim() ||
        String(ba?.country || "").trim() ||
        "FR";

      return { street, address2, zip, city, country };
    }

    // ✅ conciergerie mode : /users read
    function applyBusinessProfile(profile){
      const bp = (profile?.businessProfile || {});
      const companyName = String(bp.companyName || "Conciergerie").trim();
      const logoUrl = String(bp.logoUrl || "").trim();

      const street = String(bp.address?.street || "").trim();
      const zip = String(bp.address?.zip || "").trim();
      const city = String(bp.address?.city || "").trim();

      const siret = String(bp.registration?.siret || "").trim();
      const ape   = String(bp.registration?.ape || "").trim();

      const email = String(bp.billingEmail || profile?.email || "").trim();
      const phone = String(bp.phone || "").trim();

      companyNameEl.textContent = companyName || "Conciergerie";

      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }

      soc1.textContent = companyName || "Conciergerie";
      soc2.textContent = street || "";
      soc3.textContent = [zip, city].filter(Boolean).join(" ") || "";
      soc4.textContent = [
        [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "),
        [email, phone].filter(Boolean).join(" • ")
      ].filter(Boolean).join(" • ");

      const footerParts = [];
      footerParts.push(companyName || "Conciergerie");
      if(street) footerParts.push(street);
      if(zip || city) footerParts.push([zip, city].filter(Boolean).join(" "));
      if(siret || ape) footerParts.push([siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "));
      if(email || phone) footerParts.push([email, phone].filter(Boolean).join(" • "));
      footerEl.innerHTML = footerParts.map(x=>esc(x)).join(" • ");

      return bp;
    }

    // ✅ owner mode : on utilise businessSnapshot (pas de /users read)
    function applyBusinessSnapshot(bsnap){
      const bp = (bsnap || {});
      const companyName = String(bp.companyName || "Conciergerie").trim();
      const logoUrl = String(bp.logoUrl || "").trim();

      const street = String(bp.address?.street || "").trim();
      const zip = String(bp.address?.zip || "").trim();
      const city = String(bp.address?.city || "").trim();

      const siret = String(bp.registration?.siret || "").trim();
      const ape   = String(bp.registration?.ape || "").trim();

      const email = String(bp.billingEmail || bp.email || "").trim();
      const phone = String(bp.phone || "").trim();

      companyNameEl.textContent = companyName || "Conciergerie";

      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }

      soc1.textContent = companyName || "Conciergerie";
      soc2.textContent = street || "";
      soc3.textContent = [zip, city].filter(Boolean).join(" ") || "";
      soc4.textContent = [
        [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "),
        [email, phone].filter(Boolean).join(" • ")
      ].filter(Boolean).join(" • ");

      const footerParts = [];
      footerParts.push(companyName || "Conciergerie");
      if(street) footerParts.push(street);
      if(zip || city) footerParts.push([zip, city].filter(Boolean).join(" "));
      if(siret || ape) footerParts.push([siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "));
      if(email || phone) footerParts.push([email, phone].filter(Boolean).join(" • "));
      footerEl.innerHTML = footerParts.map(x=>esc(x)).join(" • ");

      return bp;
    }

    function computeInvoiceDates(d){
      const issuedStr = String(d?.invoiceIssuedDate || "").trim();
      const issuedDate = parseDDMMYYYY(issuedStr) || new Date();
      const issuedLabel = issuedStr || ddmmyyyy(issuedDate);

      const term = String(d?.invoicePaymentTerm || "RECEPTION").toUpperCase();
      const due = addDays(issuedDate, termToDays(term));
      return { issuedLabel, term, due };
    }

    function renderDocHeader(d){
      const invNum = String(d?.invoiceNumber || "").trim();
      docTitleEl.textContent = invNum ? `FACTURE N° ${invNum}` : `FACTURE N° — (BROUILLON)`;

      const { issuedLabel, due } = computeInvoiceDates(d);
      metaRightEl.innerHTML = `
        <div><b>Émise le</b> ${esc(issuedLabel)}</div>
        <div><b>Échéance</b> ${esc(ddmmyyyy(due))}</div>
      `;
      docMetaEl.textContent = `Émise le ${issuedLabel} • Échéance ${ddmmyyyy(due)}`;

      currentInvoiceNumber = invNum || "";
    }

    function renderHomeAndPeriod(d){
      const homeAddr = String(d?.homeAddress || "").trim();
      const homeZip  = String(d?.homeZip || d?.zip || d?.postalCode || "").trim();
      const homeCity = String(d?.homeCity || "").trim();
      const full = [homeAddr, [homeZip, homeCity].filter(Boolean).join(" ")].filter(Boolean).join(" • ");

      homeLine1.textContent = full ? `Adresse : ${full}` : "Adresse : —";
      homeLine2.textContent = `Période : ${getStayPeriod(d)}`;
    }

    async function lookupOwnerByEmailInOwners(conciergerieUid, emailLower){
      if(!emailLower) return null;

      const qO = query(
        collection(db,"owners"),
        where("conciergerieUid", "==", String(conciergerieUid)),
        where("emailLower", "==", emailLower),
        where("isActive", "==", true),
        limit(1)
      );

      const snap = await getDocs(qO);
      if(snap.empty) return null;

      const doc0 = snap.docs[0];
      const o = doc0.data() || {};
      const addr = extractAddr(o);

      return {
        docId: doc0.id,
        email: normalizeEmail(o.email || emailLower),
        fullname: (o.fullname || o.displayName || o.name || "").trim(),
        address1: addr.street,
        address2: addr.address2,
        zip: addr.zip,
        city: addr.city,
        country: addr.country,
        phone: String(o.phone || o.tel || o.mobile || "").trim(),
      };
    }

    async function loadOwnerFromDoc(conciergerieUid, d){
      const ownerDocId =
        String(d?.ownerDocId || "").trim() ||
        String(d?.clientOwnerDocId || "").trim();

      if(ownerDocId){
        try{
          const snap = await getDoc(doc(db,"owners", ownerDocId));
          if(snap.exists()){
            const o = snap.data() || {};
            if(String(o.conciergerieUid||"") === String(conciergerieUid)){
              const addr = extractAddr(o);
              return {
                docId: snap.id,
                email: normalizeEmail(o.email || ""),
                fullname: (o.fullname || o.displayName || o.name || "").trim(),
                address1: addr.street,
                address2: addr.address2,
                zip: addr.zip,
                city: addr.city,
                country: addr.country,
                phone: String(o.phone || o.tel || o.mobile || "").trim(),
              };
            }
          }
        }catch(e){}
      }

      const emailLower = normalizeEmail(d?.clientEmail || d?.ownerEmail || "");
      if(emailLower){
        try{ return await lookupOwnerByEmailInOwners(conciergerieUid, emailLower); }
        catch(e){ return null; }
      }
      return null;
    }

    async function loadHomeClientFallback(d){
      const hid = String(d?.homeId || d?.homeDocId || "").trim();
      if(!hid) return null;

      try{
        const hSnap = await getDoc(doc(db,"homes", hid));
        if(!hSnap.exists()) return null;
        const h = hSnap.data() || {};

        const name = String(h.ownerName || h.ownerFullname || h.ownerDisplayName || h.owner || "").trim();
        const email = normalizeEmail(h.ownerEmail || h.ownerAccountEmail || h.email || "");
        const phone = String(h.ownerPhone || h.ownerTel || h.phone || "").trim();
        const addr = extractAddr(h.owner || h);

        if(!(name || email || phone || addr.street || addr.zip || addr.city)) return null;

        return {
          name, email, phone,
          address1: addr.street,
          address2: addr.address2,
          zip: addr.zip,
          city: addr.city,
          country: addr.country
        };
      }catch(e){
        return null;
      }
    }

    function clientSnapshot(d){
      return {
        fullname: String(d?.clientName || d?.ownerName || "").trim(),
        email: normalizeEmail(d?.clientEmail || d?.ownerEmail || ""),
        phone: String(d?.clientPhone || d?.ownerPhone || "").trim(),
        address1: String(d?.clientAddress1 || d?.ownerAddress1 || d?.clientAddress || "").trim(),
        address2: String(d?.clientAddress2 || d?.ownerAddress2 || "").trim(),
        zip: String(d?.clientZip || d?.ownerZip || "").trim(),
        city: String(d?.clientCity || d?.ownerCity || "").trim(),
        country: String(d?.clientCountry || d?.ownerCountry || "FR").trim()
      };
    }

    function renderClientHeader(ownerFromOwners, homeFallback, d){
      const o = ownerFromOwners || null;
      const h = homeFallback || null;
      const s = clientSnapshot(d);

      const name = (o?.fullname || h?.name || s.fullname || "—").trim();
      const a1 = (o?.address1 || h?.address1 || s.address1 || "").trim();
      const a2 = (o?.address2 || h?.address2 || s.address2 || "").trim();
      const zip = (o?.zip || h?.zip || s.zip || "").trim();
      const city = (o?.city || h?.city || s.city || "").trim();

      const email = (o?.email || h?.email || s.email || "").trim();
      const phone = (o?.phone || h?.phone || s.phone || "").trim();

      cli1.textContent = name || "—";

      cli2.textContent = a1 || "";
      cli2.style.display = a1 ? "" : "none";

      const line3 = [a2, [zip, city].filter(Boolean).join(" ")].filter(Boolean).join(" • ");
      cli3.textContent = line3 || "";
      cli3.style.display = line3 ? "" : "none";

      const contact = [email, phone].filter(Boolean).join(" • ");
      cli4.textContent = contact || "";
      cli4.style.display = contact ? "" : "none";
    }

function renderLines(d){
  const arr = Array.isArray(d?.lines) ? d.lines : [];
  linesBody.innerHTML = "";

  if(!arr.length){
    const tr = document.createElement("tr");
    tr.innerHTML = `<td colspan="4" class="mut">Aucune ligne</td>`;
    linesBody.appendChild(tr);
  }else{
    for(const l of arr){
      const qty = Number(l?.qty)||0;
      const up = getStoredLinePUHT(l);
      const total = getStoredLineTTC(l);
      const label = String(l?.label || "Prestation").trim();

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${esc(label)}</td>
        <td class="right">${esc(qty)}</td>
        <td class="right">${esc(money(up))}</td>
        <td class="right">${esc(money(total))}</td>
      `;
      linesBody.appendChild(tr);
    }
  }

  const totals = getStoredTotals(d);
  const vatCtx = getVatContext(d);
  const vatEnabled = !!vatCtx.vatEnabled || Number(totals.tva || 0) > 0;

  totalHtEl.textContent = money(totals.ht);
  totalTvaEl.textContent = money(totals.tva);
  totalTtcEl.textContent = money(totals.ttc);

  if(vatEnabled){
    const serviceTVA = arr
      .filter(l => String(l?.lineType || "").toUpperCase() === "SERVICE")
      .reduce((s, l) => s + (Number.isFinite(Number(l?.totalTVA)) ? Number(l.totalTVA) : 0), 0);

    const productTVA = arr
      .filter(l => String(l?.lineType || "").toUpperCase() === "PRODUCT")
      .reduce((s, l) => s + (Number.isFinite(Number(l?.totalTVA)) ? Number(l.totalTVA) : 0), 0);

    if(serviceTVA || productTVA){
      tvaLineEl.textContent =
        `TVA totale ${money(totals.tva)} • services ${money(serviceTVA)} • produits ${money(productTVA)}`;
    }else{
      tvaLineEl.textContent = `HT ${money(totals.ht)} • TVA ${money(totals.tva)}`;
    }
  }else{
    const ex =
      String(d?.businessSnapshot?.tvaExemptionText || "").trim() ||
      String(d?.tvaExemptionText || "").trim() ||
      "TVA non applicable (art. 293B CGI)";
    tvaLineEl.textContent = ex;
  }
}

    function renderPaymentAndConditions(d, businessProfile){
      const mode = String(d?.invoicePaymentMode || "VIREMENT").toUpperCase();
      const term = String(d?.invoicePaymentTerm || "RECEPTION").toUpperCase();

      payModeEl.textContent = `Mode : ${modeLabel(mode)}`;
      payTermEl.textContent = `Délai : ${termLabel(term)}`;

      const quoteRef = String(d?.quoteNumber || "").trim();
      cond1.innerHTML = `<b>Référence devis</b> : ${esc(quoteRef || "—")}`;

      const showCancel = (typeof d?.invoiceShowCancellation === "boolean") ? d.invoiceShowCancellation : true;
      const cancelPct = Number.isFinite(Number(businessProfile?.conditions?.cancellationPercent))
        ? Number(businessProfile.conditions.cancellationPercent)
        : 30;

      if(showCancel){
        cond2.style.display = "";
        cond2.innerHTML = `<b>Annulation</b> : ${esc(String(cancelPct))} % du montant en cas d’annulation moins de 48 h avant l’intervention.`;
      }else{
        cond2.style.display = "none";
        cond2.textContent = "";
      }

      cond3.innerHTML = `&nbsp;`;
    }

    function renderBank(businessProfile){
      const bank = (businessProfile?.bank || {});
      const bankName = String(bank.name || "").trim();
      const iban = String(bank.iban || "").trim();
      const bic  = String(bank.bic  || "").trim();

      const hasAny = !!(bankName || iban || bic);
      if(!hasAny){
        bankTitle.style.display = "none";
        bankBox.style.display = "none";
        return;
      }

      bankTitle.style.display = "";
      bankBox.style.display = "";

      bank1.textContent = bankName ? `Banque : ${bankName}` : "—";
      bank2.textContent = iban ? `IBAN : ${iban}` : "";
      bank2.style.display = iban ? "" : "none";
      bank3.textContent = bic ? `BIC : ${bic}` : "";
      bank3.style.display = bic ? "" : "none";
    }

    function renderPenalty(d){
      const storedText = String(d?.invoicePenaltyText || "").trim();
      if(storedText){
        penaltyTextEl.textContent = storedText;
      }else{
        const mode = String(d?.invoicePenaltyMode || "B2C").toUpperCase();
        penaltyTextEl.textContent = getPenaltyTemplate(mode);
      }
      penTitle.style.display = "";
      penBox.style.display = "";
    }

    // ✅ PRINT FIX (plus de d/docId hors scope)
    printBtn.addEventListener("click", ()=>{
      const originalTitle = document.title;

      const numberRaw =
        String(currentInvoiceNumber || "").trim()
        || String(currentDocId || "").trim()
        || "Facture";

      const safeNumber = numberRaw.replace(/[^\w\-]/g, "_");
      document.title = "CleanUp_Facture_" + safeNumber;

      window.print();

      setTimeout(()=>{ document.title = originalTitle; }, 1000);
    });

    function loadDraftFromSession(expectedId){
      try{
        const raw = sessionStorage.getItem("invoiceDraftPreview");
        if(!raw) return null;
        const draft = JSON.parse(raw);
        if(!draft || typeof draft !== "object") return null;
        if(expectedId && String(draft.id || "") !== String(expectedId)) return null;
        return draft;
      }catch(e){
        return null;
      }
    }

    function loginRedirectUrl(){
      const token = getParam("token");
      const base = isOwnerMode() ? "login.html?role=proprietaire" : "login.html?role=conciergerie";
      return token ? (base + "&token=" + encodeURIComponent(token)) : base;
    }

    onAuthStateChanged(auth, async (user)=>{
      backLink.href = isOwnerMode() ? "owner-facturation.html" : "factures-liste.html";

      if(!user){
        location.href = loginRedirectUrl();
        return;
      }

      const docId = getParam("docId");
      const eventId = getParam("eventId");
      currentDocId = docId || eventId || "";
      isDraftPreview = (getParam("draft") === "1");

      // owner mode: on force docId (salesDocuments)
      if(isOwnerMode() && eventId){
        showError("Mode propriétaire : eventId non supporté. (Ouvre via docId depuis l’historique.)");
        backLink.href = "owner-facturation.html";
        return;
      }

      if(!docId && !eventId){
        showError("docId ou eventId manquant.");
        return;
      }

      if(!isOwnerMode()){
        backLink.href = docId
          ? `facture.html?docId=${encodeURIComponent(docId)}`
          : `facture.html?eventId=${encodeURIComponent(eventId)}`;
      }

      try{
        // 1) doc source
        let snap = null;
        if(docId){
          snap = await getDoc(doc(db, "salesDocuments", docId));
          if(!snap.exists()) return showError("Facture introuvable (salesDocuments).");
        }else{
          snap = await getDoc(doc(db, "events", eventId));
          if(!snap.exists()) return showError("Facture introuvable (event).");
        }
        docData = { id: snap.id, ...(snap.data()||{}) };

        currentInvoiceNumber = String(docData?.invoiceNumber || "").trim();

        // 2) sécurité owner
        if(isOwnerMode()){
          const ouid = String(docData.ownerUid || "").trim();
          if(!ouid){
            showError("Accès refusé : ownerUid manquant sur ce document.");
            backLink.href = "owner-facturation.html";
            return;
          }
          if(ouid !== String(user.uid)){
            showError("Accès refusé (document d’un autre propriétaire).");
            backLink.href = "owner-facturation.html";
            return;
          }
          // ✅ règle publiée : ownerVisible=true attendu
          if(docData.ownerVisible !== true){
            showError("Accès refusé : document non publié (ownerVisible=false).");
            backLink.href = "owner-facturation.html";
            return;
          }
        }else{
          if(String(docData.conciergerieUid||"") && String(docData.conciergerieUid) !== String(user.uid)){
            return showError("Accès refusé (document d’une autre conciergerie).");
          }
        }

        // 3) draft merge (conciergerie only)
        if(isDraftPreview && !isOwnerMode()){
          const expectedId = docId ? docId : eventId;
          const draft = loadDraftFromSession(expectedId);
          if(draft){
            docData = { ...docData, ...draft, id: docData.id };
            currentInvoiceNumber = String(docData?.invoiceNumber || "").trim();
          }
        }

        // 4) profile société
        const conciergerieUid = String(docData.conciergerieUid || "").trim();
        if(!conciergerieUid){
          showError("conciergerieUid manquant sur le document.");
          return;
        }

        let bp = {};
        if(isOwnerMode()){
          const bsnap = docData.businessSnapshot || null;
          if(!bsnap){
            showError("businessSnapshot manquant sur la facture (impossible d’afficher la société).");
            bp = {};
          }else{
            bp = applyBusinessSnapshot(bsnap) || {};
          }
        }else{
          const userSnap = await getDoc(doc(db,"users", conciergerieUid));
          const profile = userSnap.exists() ? (userSnap.data()||{}) : {};
          bp = applyBusinessProfile(profile) || {};
        }

        // 5) client
        // ⚠️ owner mode n’a pas forcément accès à owners/homes selon tes rules.
        // On tente, mais on ne casse pas si permission denied.
        let ownerFromOwners = null;
        let homeFallback = null;
        if(!isOwnerMode()){
          ownerFromOwners = await loadOwnerFromDoc(conciergerieUid, docData);
          homeFallback = await loadHomeClientFallback(docData);
        }else{
          // owner: on se contente du snapshot client présent dans la facture
          ownerFromOwners = null;
          homeFallback = null;
        }
        renderClientHeader(ownerFromOwners, homeFallback, docData);

        // 6) render
        renderDocHeader(docData);
        renderHomeAndPeriod(docData);
        renderLines(docData, bp || {});
        renderPaymentAndConditions(docData, bp || {});
        renderBank(bp || {});
        renderPenalty(docData);

      }catch(e){
        console.error(e);
        showError(e?.message || "Erreur chargement aperçu.");
      }
    });
  </script>
</body>
</html>
