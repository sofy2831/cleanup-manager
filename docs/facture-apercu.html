<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu facture</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --violet-soft:#E9E2FF;
      --violet-soft-2:#F6F2FF;

      --bg:#F3EFFC;
      --card:#FFFFFF;
      --text:#171717;
      --muted:#66615a;
      --line:rgba(122,92,255,0.16);
      --line-soft:rgba(23,23,23,0.08);
      --shadow:0 16px 40px rgba(0,0,0,0.06);
      --max:1120px;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }

    body{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,#F8F4FF 0%, #EEE7FF 100%);
      color:var(--text);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(248,244,255,0.92);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }

    .topbar-inner{
      width:min(var(--max),calc(100% - 32px));
      margin:0 auto;
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:12px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:16px;
      font-weight:700;
      letter-spacing:.02em;
      text-decoration:none;
      color:inherit;
      min-width:0;
    }

    .brand-logo{
      width:62px;
      height:62px;
      border-radius:18px;
      border:2px solid rgba(122,92,255,0.25);
      overflow:hidden;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      color:var(--violet);
      font-weight:900;
      font-size:1.3rem;
      box-shadow:0 6px 16px rgba(0,0,0,0.04);
    }

    .brand-logo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }

    .brand-name{
      font-size:1.65rem;
      font-weight:800;
      letter-spacing:.03em;
      color:var(--text);
      line-height:1;
      white-space:nowrap;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      min-height:44px;
      padding:0 16px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--violet);
      text-decoration:none;
      font:inherit;
      font-weight:800;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }

    .btn-dark{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .wrap{
      width:min(var(--max),calc(100% - 32px));
      margin:28px auto 56px;
    }

    .alert{
      display:none;
      margin-bottom:14px;
      padding:12px 14px;
      border-radius:16px;
      background:#fff;
      border:1px solid rgba(179,38,30,0.15);
      border-left:5px solid #b3261e;
      box-shadow:var(--shadow);
      font-size:12px;
      font-weight:700;
      color:#333;
      white-space:pre-wrap;
    }

    .sheet{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:30px;
      min-height:calc(100vh - 170px);
      display:flex;
      flex-direction:column;
    }

    .top-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      align-items:stretch;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      padding:18px;
      min-height:170px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }

    .panel h2{
      margin:0 0 10px;
      font-size:1rem;
      letter-spacing:-.02em;
    }

    .logo-wrap{
      flex:1;
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      padding-top:6px;
    }

    .logo-box{
      width:132px;
      height:132px;
      border:1px solid var(--line);
      border-radius:18px;
      background:var(--violet-soft-2);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:var(--violet);
      font-weight:900;
      font-size:2.1rem;
    }

    .logo-box img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }

    .invoice-head{
      display:grid;
      gap:8px;
      align-content:start;
    }

    .invoice-title{
      font-size:1.6rem;
      font-weight:900;
      letter-spacing:-.05em;
      margin:0;
    }

    .invoice-number{
      font-size:1.2rem;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .meta{
      display:grid;
      gap:6px;
      font-size:.97rem;
      line-height:1.5;
    }

    .section{
      margin-top:22px;
    }

    .section-title{
      margin:0 0 10px;
      font-size:1rem;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .single-box{
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      padding:18px;
    }

    .table-wrap{
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      background:#fff;
    }

    table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
    }

    th, td{
      padding:14px 16px;
      border-bottom:1px solid rgba(23,23,23,0.08);
      text-align:left;
      vertical-align:top;
      font-size:.95rem;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    thead th{
      background:var(--violet-soft-2);
      font-size:.9rem;
      font-weight:800;
      color:#2d2568;
    }

    tbody tr:last-child td{
      border-bottom:none;
    }

    .num{
      text-align:right;
      white-space:nowrap;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:1fr 360px;
      gap:18px;
      margin-top:18px;
      align-items:start;
    }

    .totals{
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      background:#fff;
    }

    .totals-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      padding:14px 16px;
      border-bottom:1px solid rgba(23,23,23,0.08);
    }

    .totals-row:last-child{ border-bottom:none; }

    .grand-total{
      background:var(--violet-soft);
      font-weight:900;
    }

    .refs-box,
    .payment-box,
    .conditions-box,
    .bank-box,
    .penalties-box{
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      padding:18px;
    }

    .refs-box h2,
    .payment-box h2,
    .conditions-box h2,
    .bank-box h2,
    .penalties-box h2{
      margin:0 0 10px;
      font-size:1rem;
      letter-spacing:-.02em;
    }

    .footer-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      margin-top:20px;
    }

    .bank-content{
      white-space:pre-line;
      line-height:1.55;
    }

    .footer{
      margin-top:auto;
      padding-top:16px;
      border-top:1px solid var(--line);
      text-align:center;
      color:#4f4942;
      font-size:.92rem;
      line-height:1.6;
    }

    @media (max-width: 900px){
      .top-grid,
      .summary-grid,
      .footer-grid{
        grid-template-columns:1fr;
      }

      .sheet{
        padding:22px;
        min-height:auto;
      }

      .panel{
        min-height:auto;
      }
    }

    @media (max-width: 720px){
      .topbar-inner{
        min-height:auto;
        padding:14px 0;
        flex-direction:column;
        align-items:stretch;
      }

      .brand,
      .actions{
        justify-content:center;
      }

      .brand{
        flex-direction:column;
        text-align:center;
      }

      .brand-name{
        white-space:normal;
        text-align:center;
      }

      .actions{
        width:100%;
      }

      .btn{
        flex:1 1 auto;
      }
    }

    @media print{
      @page{
        size:A4;
        margin:8mm;
      }

      html, body{
        height:auto;
      }

      body{
        background:#fff !important;
        font-size:11px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .topbar,
      .alert{
        display:none !important;
      }

      .wrap{
        width:100%;
        margin:0;
      }

      .sheet{
        box-shadow:none !important;
        border:none !important;
        border-radius:0 !important;
        padding:0 !important;
        min-height:auto !important;
        display:block !important;
      }

      .top-grid{
        grid-template-columns:1fr 1fr !important;
        gap:8px !important;
      }

      .summary-grid{
        grid-template-columns:1fr 300px !important;
        gap:8px !important;
        margin-top:10px !important;
      }

      .footer-grid{
        grid-template-columns:1fr 1fr !important;
        gap:8px !important;
        margin-top:10px !important;
      }

      .section{
        margin-top:12px !important;
      }

      .panel,
      .refs-box,
      .payment-box,
      .conditions-box,
      .bank-box,
      .penalties-box,
      .single-box{
        padding:8px 10px !important;
        border-radius:12px !important;
        background:#fff !important;
        page-break-inside:avoid;
        break-inside:avoid;
      }

      .panel{
        min-height:128px !important;
      }

      .logo-box{
        width:88px !important;
        height:88px !important;
        border-radius:12px !important;
      }

      .invoice-title{
        font-size:17px !important;
        margin:0 0 4px !important;
      }

      .invoice-number{
        font-size:12px !important;
      }

      .meta,
      .bank-content{
        font-size:11px !important;
        line-height:1.35 !important;
        gap:4px !important;
      }

      .table-wrap,
      .totals{
        background:#fff !important;
        page-break-inside:avoid;
        break-inside:avoid;
      }

      table{
        margin-top:0 !important;
      }

      thead th{
        font-size:10px !important;
        padding:6px 8px !important;
        background:var(--violet-soft-2) !important;
      }

      tbody td{
        font-size:10px !important;
        padding:6px 8px !important;
        line-height:1.25 !important;
      }

      .totals-row{
        padding:9px 10px !important;
        font-size:11px !important;
      }

      .grand-total{
        background:var(--violet-soft) !important;
      }

      .footer{
        margin-top:8px !important;
        padding-top:6px !important;
        font-size:9px !important;
        line-height:1.2 !important;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="factures-liste.html" aria-label="Retour factures">
        <div class="brand-logo" id="brandLogoWrap">
          <img id="brandLogoImg" alt="Logo conciergerie" />
          <span id="brandLogoFallback">✓</span>
        </div>
        <span class="brand-name" id="brandNameTop">CleanUp Manager</span>
      </a>

      <div class="actions">
        <button class="btn" id="backBtn" type="button">Retour</button>
        <button class="btn btn-dark" id="printBtn" type="button">Imprimer / PDF</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="alert" id="alertBox"></div>

    <article class="sheet" id="paper">
      <section class="top-grid">
        <div class="panel">
          <div class="logo-wrap">
            <div class="logo-box" id="logoBox">
              <img id="logoImg" alt="Logo conciergerie" />
              <span id="logoFallback">✓</span>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="invoice-head">
            <h1 class="invoice-title">Facture</h1>
            <div class="invoice-number" id="invoiceNumber">—</div>
            <div>Date d’émission : <span id="issuedAtLabel">—</span></div>
            <div>Échéance : <span id="dueAtLabel">—</span></div>
          </div>
        </div>

        <div class="panel">
          <h2>Société</h2>
          <div id="businessBlock" class="meta"></div>
        </div>

        <div class="panel">
          <h2>Client</h2>
          <div id="clientBlock" class="meta"></div>
        </div>
      </section>

      <section class="section">
        <h2 class="section-title">Logement & période</h2>
        <div class="single-box">
          <div id="homeBlock" class="meta"></div>
        </div>
      </section>

      <section class="section">
        <div class="table-wrap">
          <table aria-label="Lignes facture">
            <thead>
              <tr>
                <th style="width:40%;">Prestation</th>
                <th class="num" style="width:10%;">Qté</th>
                <th class="num" style="width:14%;">PU HT</th>
                <th class="num" style="width:14%;">Total HT</th>
                <th class="num" style="width:10%;">TVA</th>
                <th class="num" style="width:12%;">Total TTC</th>
              </tr>
            </thead>
            <tbody id="linesTbody">
              <tr>
                <td colspan="6">Aucune ligne.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="summary-grid">
          <div>
            <div class="refs-box">
              <h2>Références</h2>
              <div id="refsBlock" class="meta"></div>
            </div>
          </div>

          <div>
            <div class="totals">
              <div class="totals-row">
                <span>Total HT</span>
                <strong id="totalHtLabel">—</strong>
              </div>
              <div class="totals-row">
                <span>TVA</span>
                <strong id="totalTvaLabel">—</strong>
              </div>
              <div class="totals-row grand-total">
                <span>Total TTC</span>
                <strong id="totalTtcLabel">—</strong>
              </div>
            </div>
            <div id="totalSubLabel" class="meta" style="margin-top:8px;"></div>
          </div>
        </div>
      </section>

      <section class="footer-grid">
        <div class="payment-box">
          <h2>Paiement</h2>
          <div id="paymentBlock" class="meta"></div>
        </div>

        <div class="conditions-box">
          <h2>Conditions</h2>
          <div id="conditionsBlock" class="meta"></div>
        </div>

        <div class="bank-box" id="bankBox">
          <h2 id="bankTitle">Coordonnées bancaires</h2>
          <div id="bankBlock" class="bank-content">—</div>
        </div>

        <div class="penalties-box">
          <h2>Pénalités</h2>
          <div id="penaltiesBlock" class="meta"></div>
        </div>
      </section>

      <footer class="footer" id="footerBlock">—</footer>
    </article>
  </main>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, collection, query, where, getDocs, limit
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const paper = document.getElementById("paper");
    const backBtn = document.getElementById("backBtn");
    const printBtn = document.getElementById("printBtn");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");
    const companyName = document.getElementById("companyName");

    const brandNameTop = document.getElementById("brandNameTop");
    const brandLogoImg = document.getElementById("brandLogoImg");
    const brandLogoFallback = document.getElementById("brandLogoFallback");

    const issuedAtLabel = document.getElementById("issuedAtLabel");
    const dueAtLabel = document.getElementById("dueAtLabel");
    const invoiceNumber = document.getElementById("invoiceNumber");

    const businessBlock = document.getElementById("businessBlock");
    const clientBlock = document.getElementById("clientBlock");
    const homeBlock = document.getElementById("homeBlock");
    const linesTbody = document.getElementById("linesTbody");

    const totalHtLabel = document.getElementById("totalHtLabel");
    const totalTvaLabel = document.getElementById("totalTvaLabel");
    const totalTtcLabel = document.getElementById("totalTtcLabel");
    const totalSubLabel = document.getElementById("totalSubLabel");

    const refsBlock = document.getElementById("refsBlock");
    const paymentBlock = document.getElementById("paymentBlock");
    const conditionsBlock = document.getElementById("conditionsBlock");
    const bankTitle = document.getElementById("bankTitle");
    const bankBox = document.getElementById("bankBox");
    const bankBlock = document.getElementById("bankBlock");
    const penaltiesBlock = document.getElementById("penaltiesBlock");
    const footerBlock = document.getElementById("footerBlock");

    let currentDoc = null;
    let currentDocId = "";
    let currentInvoiceNumber = "";
    let isOwnerView = false;
    let isDraftView = false;

    function showAlert(msg){
      alertBox.style.display = "block";
      alertBox.textContent = msg || "Erreur";
    }

    function esc(s){
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " €";
    }

    function normalizeEmail(s){
      return String(s || "").trim().toLowerCase();
    }

    function ddmmyyyy(date){
      if(!(date instanceof Date) || Number.isNaN(date.getTime())) return "—";
      const dd = String(date.getDate()).padStart(2,"0");
      const mm = String(date.getMonth()+1).padStart(2,"0");
      const yy = date.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }

    function parseDDMMYYYY(s){
      const x = String(s || "").trim();
      if(!/^\d{2}\/\d{2}\/\d{4}$/.test(x)) return null;
      const [dd, mm, yy] = x.split("/").map(v => parseInt(v,10));
      const d = new Date(yy, (mm || 1) - 1, dd || 1);
      return Number.isNaN(d.getTime()) ? null : d;
    }

    function addDays(date, days){
      const d = new Date(date.getTime());
      d.setDate(d.getDate() + (Number(days) || 0));
      return d;
    }

    function termLabel(term){
      const t = String(term || "").toUpperCase();
      if(t === "RECEPTION") return "À réception";
      if(t === "8J") return "8 jours";
      if(t === "15J") return "15 jours";
      if(t === "30J") return "30 jours";
      if(t === "45J") return "45 jours";
      return term || "—";
    }

    function termToDays(term){
      const t = String(term || "").toUpperCase();
      if(t === "RECEPTION") return 0;
      if(t === "8J") return 8;
      if(t === "15J") return 15;
      if(t === "30J") return 30;
      if(t === "45J") return 45;
      return 0;
    }

    function modeLabel(mode){
      const m = String(mode || "").toUpperCase();
      if(m === "VIREMENT") return "Virement";
      if(m === "ESPECES") return "Espèces";
      if(m === "CHEQUE") return "Chèque";
      if(m === "CB") return "Carte bancaire";
      return mode || "—";
    }

    function getPenaltyTemplate(mode){
      const m = String(mode || "").toUpperCase();
      if(m === "B2B"){
        return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur + indemnité forfaitaire de recouvrement de 40 €.";
      }
      return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur.";
    }

    function getStayPeriod(d){
      const pick = (v)=> String(v || "").trim();
      const a = pick(d?.arrivalDateKey || d?.arrivalDate || d?.checkinDate || d?.arrival || d?.dateArrivee);
      const b = pick(d?.departureDateKey || d?.departureDate || d?.checkoutDate || d?.departure || d?.dateDepart);
      if(a && b) return `Du ${a} au ${b}`;
      if(a && !b) return `À partir du ${a}`;
      if(!a && b) return `Jusqu’au ${b}`;
      return "—";
    }

    function extractAddr(obj){
      const o = obj || {};
      const a = (o.address && typeof o.address === "object") ? o.address : null;
      const ba = (o.billingAddress && typeof o.billingAddress === "object") ? o.billingAddress : null;

      const street =
        String(o.address1 || o.street || o.addr1 || o.line1 || "").trim() ||
        (typeof o.address === "string" ? String(o.address).trim() : "") ||
        String(a?.street || a?.line1 || a?.address1 || a?.addr1 || "").trim() ||
        String(ba?.street || ba?.line1 || ba?.address1 || "").trim();

      const address2 =
        String(o.address2 || o.addr2 || o.line2 || "").trim() ||
        String(a?.address2 || a?.line2 || a?.addr2 || "").trim() ||
        String(ba?.address2 || ba?.line2 || "").trim();

      const zip =
        String(o.zip || o.postalCode || o.cp || "").trim() ||
        String(a?.zip || a?.postalCode || a?.cp || "").trim() ||
        String(ba?.zip || ba?.postalCode || "").trim();

      const city =
        String(o.city || o.town || o.locality || "").trim() ||
        String(a?.city || a?.town || a?.locality || "").trim() ||
        String(ba?.city || ba?.town || "").trim();

      const country =
        String(o.country || "").trim() ||
        String(a?.country || "").trim() ||
        String(ba?.country || "").trim() ||
        "FR";

      return { street, address2, zip, city, country };
    }

    function getNormalizedBusinessSource(d, fallbackProfile){
      const bs = (d?.businessSnapshot && typeof d.businessSnapshot === "object") ? d.businessSnapshot : {};
      const fp = fallbackProfile?.businessProfile || {};

      const bank = bs.bank || fp.bank || {};
      const conditions = bs.conditions || fp.conditions || {};
      const vatSnap = d?.vatSnapshot || bs.vat || fp.vat || {};

      return {
        companyName: String(bs.companyName || fp.companyName || d?.businessName || d?.companyName || "Conciergerie").trim(),
        logoUrl: String(bs.logoUrl || fp.logoUrl || d?.businessLogoUrl || "").trim(),
        street: String(bs.address?.street || fp.address?.street || d?.businessAddressStreet || d?.businessAddress1 || "").trim(),
        zip: String(bs.address?.zip || fp.address?.zip || d?.businessAddressZip || "").trim(),
        city: String(bs.address?.city || fp.address?.city || d?.businessAddressCity || "").trim(),
        siret: String(bs.registration?.siret || fp.registration?.siret || d?.businessSiret || "").trim(),
        ape: String(bs.registration?.ape || fp.registration?.ape || d?.businessApe || "").trim(),
        email: String(bs.billingEmail || bs.email || fp.billingEmail || fallbackProfile?.email || d?.businessEmail || "").trim(),
        phone: String(bs.phone || bs.contact?.phone || fp.phone || d?.businessPhone || "").trim(),
        tvaExemptionText: String(bs.tvaExemptionText || fp.tvaExemptionText || d?.tvaExemptionText || "").trim(),
        bank: {
          bankName: String(bank.bankName || bank.name || "").trim(),
          holder: String(bank.holder || "").trim(),
          iban: String(bank.iban || "").trim(),
          bic: String(bank.bic || "").trim()
        },
        conditions: {
          cancellationPercent: Number.isFinite(Number(conditions?.cancellationPercent))
            ? Number(conditions.cancellationPercent)
            : 30
        },
        vat: {
          enabled: !!vatSnap?.enabled,
          serviceRate: Number.isFinite(Number(vatSnap?.serviceRate)) ? Number(vatSnap.serviceRate) : 0.20,
          productRate: Number.isFinite(Number(vatSnap?.productRate)) ? Number(vatSnap.productRate) : 0.10
        }
      };
    }

    function getNormalizedClientSource(d){
      const cs = (d?.clientSnapshot && typeof d.clientSnapshot === "object") ? d.clientSnapshot : null;

      return {
        ownerDocId: String(cs?.ownerDocId || d?.clientOwnerDocId || d?.ownerDocId || "").trim(),
        ownerUid: String(cs?.ownerUid || d?.ownerUid || "").trim(),
        fullname: String(cs?.name || d?.clientDisplayName || d?.clientName || d?.ownerName || "").trim(),
        email: normalizeEmail(cs?.email || d?.clientEmail || d?.ownerEmail || ""),
        phone: String(cs?.phone || d?.clientPhone || d?.ownerPhone || "").trim(),
        address1: String(cs?.address1 || d?.clientAddress1 || d?.ownerAddress1 || d?.clientAddress || "").trim(),
        address2: String(cs?.address2 || d?.clientAddress2 || d?.ownerAddress2 || "").trim(),
        zip: String(cs?.zip || d?.clientZip || d?.ownerZip || "").trim(),
        city: String(cs?.city || d?.clientCity || d?.ownerCity || "").trim(),
        country: String(cs?.country || d?.clientCountry || d?.ownerCountry || "FR").trim() || "FR"
      };
    }

    function getVatContext(d, fallbackProfile){
      const biz = getNormalizedBusinessSource(d, fallbackProfile);
      const hasStoredTva = Number.isFinite(Number(d?.totalTVA)) && Number(d.totalTVA) > 0;
      return {
        enabled: !!(d?.vatSnapshot?.enabled ?? biz.vat.enabled ?? false) || hasStoredTva,
        serviceRate: Number.isFinite(Number(d?.vatSnapshot?.serviceRate))
          ? Number(d.vatSnapshot.serviceRate)
          : Number(biz.vat.serviceRate || 0.20),
        productRate: Number.isFinite(Number(d?.vatSnapshot?.productRate))
          ? Number(d.vatSnapshot.productRate)
          : Number(biz.vat.productRate || 0.10)
      };
    }

    function getLineTotalHT(l){
      if(Number.isFinite(Number(l?.totalHT))) return Number(l.totalHT);
      const qty = Number(l?.qty || 0);
      const pu = Number(l?.unitPrice || 0);
      return qty * pu;
    }

    function getLineTotalTVA(l){
      if(Number.isFinite(Number(l?.totalTVA))) return Number(l.totalTVA);
      return 0;
    }

    function getLineTotalTTC(l){
      if(Number.isFinite(Number(l?.totalTTC))) return Number(l.totalTTC);
      return getLineTotalHT(l) + getLineTotalTVA(l);
    }

    function getStoredTotals(d){
      const totals = (d?.totals && typeof d.totals === "object") ? d.totals : null;

      if(totals){
        const ht = Number(totals.ht || d?.totalHT || 0);
        const tva = Number(totals.tva || d?.totalTVA || 0);
        const ttc = Number(totals.ttc || d?.totalTTC || 0);
        return { totalHT: ht, totalTVA: tva, totalTTC: ttc };
      }

      const hasStored =
        Number.isFinite(Number(d?.totalHT)) &&
        Number.isFinite(Number(d?.totalTVA)) &&
        Number.isFinite(Number(d?.totalTTC));

      if(hasStored){
        return {
          totalHT: Number(d.totalHT),
          totalTVA: Number(d.totalTVA),
          totalTTC: Number(d.totalTTC)
        };
      }

      const lines = Array.isArray(d?.lines) ? d.lines : [];
      let totalHT = 0;
      let totalTVA = 0;
      let totalTTC = 0;

      for(const l of lines){
        totalHT += getLineTotalHT(l);
        totalTVA += getLineTotalTVA(l);
        totalTTC += getLineTotalTTC(l);
      }

      return { totalHT, totalTVA, totalTTC };
    }

    function getBusinessExemptionText(d, fallbackProfile){
      const biz = getNormalizedBusinessSource(d, fallbackProfile);
      return biz.tvaExemptionText || "TVA non applicable – art. 293 B du CGI";
    }

    async function lookupOwnerByEmailInOwners(conciergerieUid, emailLower){
      if(!emailLower) return null;

      const qO = query(
        collection(db, "owners"),
        where("conciergerieUid", "==", String(conciergerieUid)),
        where("emailLower", "==", emailLower),
        limit(1)
      );

      const snap = await getDocs(qO);
      if(snap.empty) return null;

      const doc0 = snap.docs[0];
      const o = doc0.data() || {};
      const addr = extractAddr(o);

      return {
        docId: doc0.id,
        ownerUid: String(o.ownerUid || o.userUid || "").trim(),
        email: normalizeEmail(o.email || emailLower),
        fullname: String(o.fullname || o.displayName || o.name || "").trim(),
        address1: addr.street,
        address2: addr.address2,
        zip: addr.zip,
        city: addr.city,
        country: addr.country,
        phone: String(o.phone || o.tel || o.mobile || "").trim()
      };
    }

    async function loadOwnerFromDoc(conciergerieUid, d){
      const cs = getNormalizedClientSource(d);
      const ownerDocId = cs.ownerDocId;

      if(ownerDocId){
        try{
          const snap = await getDoc(doc(db, "owners", ownerDocId));
          if(snap.exists()){
            const o = snap.data() || {};
            if(String(o.conciergerieUid || "") === String(conciergerieUid)){
              const addr = extractAddr(o);
              return {
                docId: snap.id,
                ownerUid: String(o.ownerUid || o.userUid || "").trim(),
                email: normalizeEmail(o.email || ""),
                fullname: String(o.fullname || o.displayName || o.name || "").trim(),
                address1: addr.street,
                address2: addr.address2,
                zip: addr.zip,
                city: addr.city,
                country: addr.country,
                phone: String(o.phone || o.tel || o.mobile || "").trim()
              };
            }
          }
        }catch(e){}
      }

      if(cs.email){
        try{
          return await lookupOwnerByEmailInOwners(conciergerieUid, cs.email);
        }catch(e){
          return null;
        }
      }

      return null;
    }

    async function loadHomeClientFallback(d){
      const hid = String(d?.homeId || d?.homeDocId || "").trim();
      if(!hid) return null;

      try{
        const hSnap = await getDoc(doc(db, "homes", hid));
        if(!hSnap.exists()) return null;

        const h = hSnap.data() || {};
        const name = String(h.ownerName || h.ownerFullname || h.ownerDisplayName || h.owner || "").trim();
        const email = normalizeEmail(h.ownerEmail || h.ownerAccountEmail || h.email || "");
        const phone = String(h.ownerPhone || h.ownerTel || h.phone || "").trim();
        const addr = extractAddr(h.owner || h);

        if(!(name || email || phone || addr.street || addr.zip || addr.city)) return null;

        return {
          name,
          email,
          phone,
          address1: addr.street,
          address2: addr.address2,
          zip: addr.zip,
          city: addr.city,
          country: addr.country
        };
      }catch(e){
        return null;
      }
    }

    function computeInvoiceDates(d){
      const issuedStr = String(d?.invoiceIssuedDate || "").trim();
      const issuedDate = parseDDMMYYYY(issuedStr) || new Date();
      const issuedLabel = issuedStr || ddmmyyyy(issuedDate);

      const term = String(d?.invoicePaymentTerm || "RECEPTION").toUpperCase();
      const dueDate = addDays(issuedDate, termToDays(term));

      return {
        issuedLabel,
        dueLabel: ddmmyyyy(dueDate)
      };
    }

    function renderLines(d, fallbackProfile){
      const lines = Array.isArray(d?.lines) ? d.lines : [];
      const vat = getVatContext(d, fallbackProfile);

      if(!lines.length){
        linesTbody.innerHTML = `
          <tr>
            <td colspan="6" class="mut">Aucune ligne</td>
          </tr>
        `;
        return;
      }

      linesTbody.innerHTML = lines.map(l => {
        const label = String(l?.label || "Prestation").trim();
        const qty = Number(l?.qty || 0);
        const unit = String(l?.unit || "unité").trim();
        const unitPrice = Number(l?.unitPrice || 0);
        const totalHT = getLineTotalHT(l);
        const totalTVA = getLineTotalTVA(l);
        const totalTTC = getLineTotalTTC(l);
        const vatRate = Math.round((Number(l?.vatRate || 0)) * 100);

        let qtyLabel = `${qty}`;
        if(unit) qtyLabel += ` ${unit}`;

        let tvaLabel = "0% • 0,00 €";
        if(vat.enabled || Number(totalTVA) > 0){
          tvaLabel = `${vatRate}% • ${money(totalTVA)}`;
        }

        return `
          <tr>
            <td>${esc(label)}</td>
            <td class="num">${esc(qtyLabel)}</td>
            <td class="num">${money(unitPrice)}</td>
            <td class="num">${money(totalHT)}</td>
            <td class="num">${esc(tvaLabel)}</td>
            <td class="num">${money(totalTTC)}</td>
          </tr>
        `;
      }).join("");
    }

    function renderTotals(d, fallbackProfile){
      const totals = getStoredTotals(d);
      const vat = getVatContext(d, fallbackProfile);
      const lines = Array.isArray(d?.lines) ? d.lines : [];

      totalHtLabel.textContent = money(totals.totalHT);
      totalTvaLabel.textContent = money(totals.totalTVA);
      totalTtcLabel.textContent = money(totals.totalTTC);

      if(vat.enabled || Number(totals.totalTVA) > 0){
        const serviceTVA = lines
          .filter(l => String(l?.lineType || "").toUpperCase() === "SERVICE")
          .reduce((sum, l) => sum + getLineTotalTVA(l), 0);

        const productTVA = lines
          .filter(l => String(l?.lineType || "").toUpperCase() === "PRODUCT")
          .reduce((sum, l) => sum + getLineTotalTVA(l), 0);

        totalSubLabel.textContent =
          `TVA totale ${money(totals.totalTVA)} • services ${money(serviceTVA)} • produits ${money(productTVA)}`;
      }else{
        totalSubLabel.textContent = getBusinessExemptionText(d, fallbackProfile);
      }
    }

    function loadDraftFromSession(){
      try{
        const raw = sessionStorage.getItem("invoiceDraftPreview");
        if(!raw) return null;
        const draft = JSON.parse(raw);
        if(!draft || typeof draft !== "object") return null;
        return draft;
      }catch(e){
        return null;
      }
    }

      const token = getParam("token");
      const base = isOwnerView
        ? "login.html?role=proprietaire"
        : "login.html?role=conciergerie";
      return token ? `${base}&token=${encodeURIComponent(token)}` : base;
    }

    onAuthStateChanged(auth, async (user) => {
      currentDocId = getParam("docId") || getParam("eventId");
      isOwnerView = getParam("owner") === "1";
      isDraftView = getParam("draft") === "1";
      const eventId = getParam("eventId");
      const docId = getParam("docId");

      if(isOwnerView && eventId){
        showAlert("Mode propriétaire : eventId non supporté. Ouvre la facture via docId.");
        paper.style.display = "none";
        backBtn.style.display = "none";
        return;
      }

      if(isDraftView && isOwnerView){
        showAlert("Accès refusé sur un brouillon.");
        paper.style.display = "none";
        return;
      }

      if(!isOwnerView && !user){
        location.href = loginRedirectUrl();
        return;
      }

      try{
        let fallbackProfile = {};
        let ownerFromOwners = null;
        let homeFallback = null;

        if(isDraftView && !isOwnerView){
          const draft = loadDraftFromSession();
          if(!draft){
            showAlert("Brouillon introuvable dans la session.");
            paper.style.display = "none";
            return;
          }

          currentDoc = { ...(draft || {}) };
          currentDocId = String(currentDoc.id || currentDoc.redoFromInvoiceId || "").trim();

          const conciergerieUid = String(currentDoc?.conciergerieUid || user?.uid || "").trim();
          if(!conciergerieUid){
            showAlert("conciergerieUid manquant sur le brouillon.");
            paper.style.display = "none";
            return;
          }

          const userSnap = await getDoc(doc(db, "users", conciergerieUid));
          fallbackProfile = userSnap.exists() ? (userSnap.data() || {}) : {};

          ownerFromOwners = await loadOwnerFromDoc(conciergerieUid, currentDoc);
          homeFallback = await loadHomeClientFallback(currentDoc);

          renderAll(currentDoc, fallbackProfile, ownerFromOwners, homeFallback);
          return;
        }

        if(!currentDocId){
          showAlert("Document manquant.");
          paper.style.display = "none";
          return;
        }

        let snap = null;

        if(docId){
          snap = await getDoc(doc(db, "salesDocuments", docId));
          if(!snap.exists()) throw new Error("Facture introuvable.");
        }else{
          snap = await getDoc(doc(db, "events", eventId));
          if(!snap.exists()) throw new Error("Facture introuvable.");
        }

        currentDoc = { id: snap.id, ...(snap.data() || {}) };

        if(isOwnerView){
          backBtn.style.display = "none";

          const ownerUid = String(
            currentDoc?.clientSnapshot?.ownerUid ||
            currentDoc?.ownerUid ||
            ""
          ).trim();

          if(!ownerUid){
            showAlert("Accès refusé : ownerUid manquant sur ce document.");
            paper.style.display = "none";
            return;
          }

          if(!user){
            location.href = loginRedirectUrl();
            return;
          }

          if(ownerUid !== String(user.uid)){
            showAlert("Accès refusé.");
            paper.style.display = "none";
            return;
          }

          if(currentDoc?.ownerVisible !== true){
            showAlert("Cette facture n’est pas accessible au propriétaire.");
            paper.style.display = "none";
            return;
          }

          renderAll(currentDoc, {}, null, null);
          return;
        }

        if(currentDoc?.conciergerieUid && String(currentDoc.conciergerieUid) !== String(user.uid)){
          showAlert("Accès refusé.");
          paper.style.display = "none";
          return;
        }

        const conciergerieUid = String(currentDoc?.conciergerieUid || "").trim();
        if(!conciergerieUid){
          showAlert("conciergerieUid manquant sur le document.");
          paper.style.display = "none";
          return;
        }

        const userSnap = await getDoc(doc(db, "users", conciergerieUid));
        fallbackProfile = userSnap.exists() ? (userSnap.data() || {}) : {};

        ownerFromOwners = await loadOwnerFromDoc(conciergerieUid, currentDoc);
        homeFallback = await loadHomeClientFallback(currentDoc);

        renderAll(currentDoc, fallbackProfile, ownerFromOwners, homeFallback);
      }catch(e){
        console.error(e);
        showAlert(e?.message || "Erreur chargement de la facture.");
        paper.style.display = "none";
      }
    });
  </script>
</body>
</html>
