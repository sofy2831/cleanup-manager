<!-- docs/facture-apercu.html (CLONE devis-apercu.html -> lit events + owners, bloc Client = adresse de facturation, pénalités = event.quotePenaltyText ou template, TVA selon businessProfile, imprime/PDF) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu facture</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
      font-weight:400;
    }

    .wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px; padding-bottom:28px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:800; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer;
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .paper{
      width:100%; max-width:980px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      border-radius:16px;
      padding:16px;
      margin-top:10px;
      position:relative;
    }

    .header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .brandLeft{
      display:flex; gap:12px; align-items:center; min-width:0;
    }
    .logo{
      width:50px; height:50px; border-radius:14px;
      border:2px solid rgba(122,92,255,0.35);
      overflow:hidden; background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; color:var(--violet);
      flex-shrink:0;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:none; }

    .brand{ min-width:0; }
    .brand .name{ font-size:18px; font-weight:800; line-height:1.15; }
    .brand .sub{ display:none; }

    .metaRight{
      text-align:right;
      font-size:12px;
      color:#333;
      line-height:1.35;
      white-space:nowrap;
    }
    .metaRight b{ font-weight:700; }

    .docTitle{
      margin-top:10px;
      text-align:center;
      font-weight:800;
      font-size:14px;
      letter-spacing:.2px;
    }
    .docMeta{ display:none; }

    .grid2{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    @media(min-width:820px){
      .grid2{ grid-template-columns: 1fr 1fr; }
    }

    .box{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }
    .box h3{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }
    .line{
      font-size:12.5px;
      font-weight:500;
      color:#111;
      line-height:1.35;
      word-break:break-word;
    }
    .mut{ color:var(--muted); font-weight:500; }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      overflow:hidden;
      border-radius:12px;
    }
    thead th{
      text-align:left;
      font-size:11.5px;
      color:#444;
      font-weight:700;
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.07);
      background:rgba(248,244,255,.6);
    }
    tbody td{
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      font-size:12.5px;
      font-weight:500;
      vertical-align:top;
    }
    tbody tr:last-child td{ border-bottom:none; }
    .right{ text-align:right; white-space:nowrap; }

    .summary{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .totalBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }
    .totalRow{
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      font-weight:700;
    }
    .totalRow .big{ font-size:17px; font-weight:800; }
    .totalSub{ margin-top:6px; font-size:11.5px; color:var(--muted); font-weight:500; }

    .payBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }
    .payBox h3{ margin:0 0 6px; font-size:12px; font-weight:800; color:#333; }

    .sectionTitle{
      margin-top:12px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    .footer{
      margin-top:12px;
      padding-top:10px;
      border-top:1px dashed rgba(122,92,255,0.35);
      text-align:center;
      font-size:11px;
      color:#444;
      font-weight:500;
      line-height:1.35;
    }

    .alert{
      width:100%; max-width:980px;
      margin-top:12px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-left:5px solid #b3261e;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px;
      font-size:12px;
      font-weight:600;
      color:#333;
      display:none;
      white-space:pre-wrap;
    }

    @media print{
      .topbar, button{ display:none !important; }
      body{ background:#fff !important; }
      @page{ margin: 8mm; }

      .paper{
        box-shadow:none !important;
        border:none !important;
        border-radius:0 !important;
        max-width:none !important;
        padding: 0 !important;
        position: relative;
      }

      .docTitle{ margin-top:6px !important; }
      .grid2{ gap:6px !important; }
      .summary{ gap:6px !important; }
      .box, .totalBox, .payBox{ padding:6px 8px !important; }
      table{ margin-top:8px !important; }
      table thead th, table tbody td{ padding:6px 7px !important; }
      .sectionTitle{ margin-top:8px !important; }

      .footer{
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        border-top: 1px dashed rgba(0,0,0,0.25);
        padding-top: 4px;
        margin-top: 0 !important;
        font-size: 10px !important;
        line-height: 1.2 !important;
        text-align: center;
        background:#fff;
      }
      .paper{ padding-bottom: 12mm !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <a class="pill" id="backLink" href="factures-liste.html">← Retour</a>
      <button class="pill primary" id="printBtn" type="button">Imprimer / PDF</button>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="paper" id="paper">
      <div class="header">
        <div class="brandLeft">
          <div class="logo">
            <img id="logoImg" alt="Logo société">
            <span id="logoFallback">✓</span>
          </div>
          <div class="brand">
            <div class="name" id="companyName">Conciergerie</div>
            <div class="sub" id="companySub">—</div>
          </div>
        </div>

        <div class="metaRight" id="metaRight">
          <div><b>Émise le</b> —</div>
          <div><b>Échéance</b> —</div>
        </div>
      </div>

      <div class="docTitle" id="docTitle">FACTURE N° —</div>
      <div class="docMeta" id="docMeta">—</div>

      <div class="grid2">
        <div class="box">
          <h3>Société</h3>
          <div class="line" id="socLine1">—</div>
          <div class="line" id="socLine2"></div>
          <div class="line" id="socLine3"></div>
          <div class="line mut" id="socLine4"></div>
        </div>

        <div class="box">
          <h3>Client</h3>
          <div class="line" id="cliLine1">—</div>
          <div class="line" id="cliLine2"></div>
          <div class="line" id="cliLine3"></div>
        </div>
      </div>

      <div class="sectionTitle">Logement & période</div>
      <div class="box">
        <div class="line" id="homeLine1">—</div>
        <div class="line" id="homeLine2">—</div>
      </div>

      <table aria-label="Lignes facture">
        <thead>
          <tr>
            <th>Prestation</th>
            <th class="right">Qté</th>
            <th class="right">PU</th>
            <th class="right">Total</th>
          </tr>
        </thead>
        <tbody id="linesBody"></tbody>
      </table>

      <div class="summary">
        <div class="totalBox">
          <div class="totalRow">
            <div>Total</div>
            <div class="big" id="totalTtc">0,00 €</div>
          </div>
          <div class="totalSub" id="tvaLine">TVA non applicable (art. 293B CGI)</div>
        </div>

        <div class="payBox">
          <h3>Paiement</h3>
          <div class="line" id="payMode">Mode : —</div>
          <div class="line" id="payTerm">Délai : —</div>
          
        </div>
      </div>

      <div class="sectionTitle">Conditions</div>
      <div class="box">
        <div class="line" id="cond1">—</div>
        <div class="line" id="cond2">—</div>
        <div class="line" id="cond3">—</div>
      </div>

      <div class="sectionTitle">Pénalités</div>
      <div class="box">
        <div class="line" id="penaltyText">—</div>
      </div>

      <div class="footer" id="footer">—</div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, collection, query, where, getDocs, limit
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const printBtn = document.getElementById("printBtn");
    const backLink = document.getElementById("backLink");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");

    const companyNameEl = document.getElementById("companyName");
    const companySubEl  = document.getElementById("companySub");

    const docTitleEl = document.getElementById("docTitle");
    const docMetaEl  = document.getElementById("docMeta"); // (masqué)
    const metaRightEl = document.getElementById("metaRight");

    const soc1 = document.getElementById("socLine1");
    const soc2 = document.getElementById("socLine2");
    const soc3 = document.getElementById("socLine3");
    const soc4 = document.getElementById("socLine4");

    const cli1 = document.getElementById("cliLine1");
    const cli2 = document.getElementById("cliLine2");
    const cli3 = document.getElementById("cliLine3");

    const homeLine1 = document.getElementById("homeLine1");
    const homeLine2 = document.getElementById("homeLine2");

    const linesBody = document.getElementById("linesBody");

    const totalTtcEl = document.getElementById("totalTtc");
    const tvaLineEl  = document.getElementById("tvaLine");

    const payModeEl = document.getElementById("payMode");
    const payTermEl = document.getElementById("payTerm");
    const payDueEl  = document.getElementById("payDue");

    const cond1 = document.getElementById("cond1");
    const cond2 = document.getElementById("cond2");
    const cond3 = document.getElementById("cond3");

    const penaltyTextEl = document.getElementById("penaltyText");
    const footerEl = document.getElementById("footer");

    function showError(msg){
      alertBox.style.display = "block";
      alertBox.textContent = "⛔ " + msg;
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function ddmmyyyy(d){
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yy = d.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }
    function addDays(baseDate, days){
      const d = new Date(baseDate.getTime());
      d.setDate(d.getDate() + (Number(days)||0));
      return d;
    }
    function termLabel(term){
      const t = String(term||"").toUpperCase();
      if(t === "RECEPTION") return "À réception";
      if(t === "8J") return "8 jours";
      if(t === "15J") return "15 jours";
      if(t === "30J") return "30 jours";
      if(t === "45J") return "45 jours";
      return term || "—";
    }
    function termToDays(term){
      const t = String(term||"").toUpperCase();
      if(t === "RECEPTION") return 0;
      if(t === "8J") return 8;
      if(t === "15J") return 15;
      if(t === "30J") return 30;
      if(t === "45J") return 45;
      return 0;
    }
    function modeLabel(mode){
      const m = String(mode||"").toUpperCase();
      if(m === "VIREMENT") return "Virement";
      if(m === "ESPECES") return "Espèces";
      if(m === "CHEQUE") return "Chèque";
      return mode || "—";
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

    function computeTotals(linesArr, vatEnabled, vatRate){
      let ht = 0;
      for(const l of (Array.isArray(linesArr) ? linesArr : [])){
        ht += (Number(l?.qty)||0) * (Number(l?.unitPrice)||0);
      }
      const tva = vatEnabled ? (ht * (Number(vatRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    function getPenaltyTemplate(mode){
      const m = String(mode||"").toUpperCase();
      if(m === "B2B"){
        return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur + indemnité forfaitaire de recouvrement de 40 €.";
      }
      return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur.";
    }

    function getStayPeriod(d){
      const pick = (v)=> (String(v||"").trim() || "");
      const a = pick(d?.arrivalDateKey || d?.arrivalDate || d?.checkinDate || d?.arrival || d?.dateArrivee);
      const b = pick(d?.departureDateKey || d?.departureDate || d?.checkoutDate || d?.departure || d?.dateDepart);
      if(a && b) return `Du ${a} au ${b}`;
      if(a && !b) return `À partir du ${a}`;
      if(!a && b) return `Jusqu’au ${b}`;
      return "—";
    }

    function applyBusinessProfile(profile){
      const bp = (profile?.businessProfile || {});
      const companyName = String(bp.companyName || "Conciergerie").trim();

      const logoUrl = String(bp.logoUrl || "").trim();

      const street = String(bp.address?.street || "").trim();
      const zip = String(bp.address?.zip || "").trim();
      const city = String(bp.address?.city || "").trim();

      const siret = String(bp.registration?.siret || "").trim();
      const ape   = String(bp.registration?.ape || "").trim();

      const email = String(bp.billingEmail || profile?.email || "").trim();
      const phone = String(bp.phone || "").trim();

      companyNameEl.textContent = companyName || "Conciergerie";
      companySubEl.textContent = "";

      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }

      soc1.textContent = companyName || "Conciergerie";
      soc2.textContent = street || "";
      soc3.textContent = [zip, city].filter(Boolean).join(" ") || "";
      soc4.textContent = [
        [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "),
        [email, phone].filter(Boolean).join(" • ")
      ].filter(Boolean).join(" • ");

      const footerParts = [];
      footerParts.push(companyName || "Conciergerie");
      if(street) footerParts.push(street);
      if(zip || city) footerParts.push([zip, city].filter(Boolean).join(" "));
      if(siret || ape) footerParts.push([siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "));
      if(email || phone) footerParts.push([email, phone].filter(Boolean).join(" • "));
      footerEl.innerHTML = footerParts.map(x=>esc(x)).join(" • ");

      return bp;
    }

    function renderDocHeader(eventData){
      docTitleEl.textContent = `FACTURE N° ${eventData?.invoiceNumber || "—"}`;

      const issued = String(eventData?.invoiceIssuedDate || "").trim();
      const created = issued ? null : new Date();

      // date d'émission (affichage)
      const issuedLabel = issued || ddmmyyyy(new Date());

      const term = String(eventData?.invoicePaymentTerm || eventData?.quotePaymentTerm || "RECEPTION").toUpperCase();
      const dueDays = termToDays(term);

      // échéance calculée (si invoiceIssuedDate existe -> on calcule en JS sur Date)
      let baseDate = new Date();
      if(issued && /^[0-9]{2}\/[0-9]{2}\/[0-9]{4}$/.test(issued)){
        const [dd,mm,yy] = issued.split("/").map(x=>parseInt(x,10));
        baseDate = new Date(yy, (mm||1)-1, dd||1);
      }
      const due = addDays(baseDate, dueDays);

      metaRightEl.innerHTML = `
        <div><b>Émise le</b> ${esc(issuedLabel)}</div>
        <div><b>Échéance</b> ${esc(ddmmyyyy(due))}</div>
      `;
      docMetaEl.textContent = `Émise le ${issuedLabel} • Échéance ${ddmmyyyy(due)}`;
    }

    function renderHomeAndPeriod(d){
      const homeAddr = String(d?.homeAddress || "").trim();
      const homeZip  = String(d?.homeZip || d?.zip || d?.postalCode || "").trim();
      const homeCity = String(d?.homeCity || "").trim();
      const full = [homeAddr, [homeZip, homeCity].filter(Boolean).join(" ")].filter(Boolean).join(" • ");

      homeLine1.textContent = full ? `Adresse : ${full}` : "Adresse : —";
      homeLine2.textContent = `Période : ${getStayPeriod(d)}`;
    }

    // ===== OWNER (facturation) : owners OU snapshot event =====
    async function lookupOwnerByEmailInOwners(conciergerieUid, emailLower){
      if(!emailLower) return null;

      const qO = query(
        collection(db,"owners"),
        where("conciergerieUid", "==", String(conciergerieUid)),
        where("email", "==", emailLower),
        limit(5)
      );
      const snap = await getDocs(qO);
      if(snap.empty) return null;

      const doc0 = snap.docs[0];
      const o = doc0.data() || {};
      return {
        docId: doc0.id,
        email: normalizeEmail(o.email || emailLower),
        fullname: (o.fullname || o.displayName || "").trim(),
        address1: (o.address1 || o.address || "").toString().trim(),
        address2: (o.address2 || "").toString().trim(),
        zip: (o.zip || "").toString().trim(),
        city: (o.city || "").toString().trim(),
        phone: (o.phone || "").toString().trim(),
      };
    }

    async function loadOwnerForEvent(conciergerieUid, d){
      const ownerDocId =
        String(d?.ownerUid || "").trim() ||
        String(d?.ownerDocId || "").trim();

      if(ownerDocId){
        try{
          const snap = await getDoc(doc(db,"owners", ownerDocId));
          if(snap.exists()){
            const o = snap.data() || {};
            if(String(o.conciergerieUid||"") === String(conciergerieUid)){
              return {
                docId: snap.id,
                email: normalizeEmail(o.email || ""),
                fullname: (o.fullname || o.displayName || "").trim(),
                address1: (o.address1 || o.address || "").toString().trim(),
                address2: (o.address2 || "").toString().trim(),
                zip: (o.zip || "").toString().trim(),
                city: (o.city || "").toString().trim(),
                phone: (o.phone || "").toString().trim(),
              };
            }
          }
        }catch(e){ /* ignore */ }
      }

      const ownerEmail = normalizeEmail(d?.ownerEmail || "");
      if(ownerEmail){
        try{ return await lookupOwnerByEmailInOwners(conciergerieUid, ownerEmail); }
        catch(e){ return null; }
      }
      return null;
    }

    function ownerSnapshotFromEvent(d){
      return {
        fullname: String(d?.ownerName || "").trim(),
        address1: String(d?.ownerAddress1 || "").trim(),
        address2: String(d?.ownerAddress2 || "").trim(),
        zip: String(d?.ownerZip || "").trim(),
        city: String(d?.ownerCity || "").trim(),
      };
    }

    function renderClientHeader(ownerFromOwners, d){
      const o = ownerFromOwners || null;
      const s = ownerSnapshotFromEvent(d);

      const name = (o?.fullname || s.fullname || "—").trim();
      const a1 = (o?.address1 || s.address1 || "").trim();
      const a2 = (o?.address2 || s.address2 || "").trim();
      const zip = (o?.zip || s.zip || "").trim();
      const city = (o?.city || s.city || "").trim();

      cli1.textContent = name || "—";
      cli2.textContent = a1 || "";
      cli2.style.display = a1 ? "" : "none";
      cli3.textContent = [a2, [zip, city].filter(Boolean).join(" ")].filter(Boolean).join(" • ") || "";
    }

    function renderLines(eventData, businessProfile){
      const arr = Array.isArray(eventData?.lines) ? eventData.lines : [];
      linesBody.innerHTML = "";

      const vatEnabled = !!businessProfile?.vat?.enabled;
      const vatRate = Number.isFinite(Number(businessProfile?.vat?.rate)) ? Number(businessProfile.vat.rate) : 0;

      if(!arr.length){
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="4" class="mut">Aucune ligne</td>`;
        linesBody.appendChild(tr);
      }else{
        for(const l of arr){
          const qty = Number(l?.qty)||0;
          const up = Number(l?.unitPrice)||0;
          const ht = qty * up;
          const tva = vatEnabled ? (ht * vatRate) : 0;
          const ttc = ht + tva;

          const label = String(l?.label || "Prestation").trim();

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${esc(label)}</td>
            <td class="right">${esc(String(qty))}</td>
            <td class="right">${esc(money(up))}</td>
            <td class="right">${esc(money(ttc))}</td>
          `;
          linesBody.appendChild(tr);
        }
      }

      const totals = computeTotals(arr, vatEnabled, vatRate);
      totalTtcEl.textContent = money(totals.ttc);

      if(vatEnabled){
        tvaLineEl.textContent = `HT ${money(totals.ht)} • TVA ${Math.round(vatRate*100)}% ${money(totals.tva)}`;
      }else{
        const ex = String(businessProfile?.tvaExemptionText || "").trim();
        tvaLineEl.textContent = ex || "TVA non applicable (art. 293B CGI)";
      }
    }

    function renderPaymentAndConditions(eventData, businessProfile){
      const mode = String(eventData?.invoicePaymentMode || eventData?.quotePaymentMode || "VIREMENT").toUpperCase();
      const term = String(eventData?.invoicePaymentTerm || eventData?.quotePaymentTerm || "RECEPTION").toUpperCase();

      payModeEl.textContent = `Mode : ${modeLabel(mode)}`;
      payTermEl.textContent = `Délai : ${termLabel(term)}`;

      // échéance = émission + term
      const issued = String(eventData?.invoiceIssuedDate || "").trim();
      let baseDate = new Date();
      if(issued && /^[0-9]{2}\/[0-9]{2}\/[0-9]{4}$/.test(issued)){
        const [dd,mm,yy] = issued.split("/").map(x=>parseInt(x,10));
        baseDate = new Date(yy, (mm||1)-1, dd||1);
      }
      const due = addDays(baseDate, termToDays(term));
      payDueEl.textContent = `Échéance : ${ddmmyyyy(due)}`;

      // conditions (on reste simple et propre)
      const cancelPct = Number.isFinite(Number(businessProfile?.conditions?.cancellationPercent))
        ? Number(businessProfile.conditions.cancellationPercent)
        : 30;

      cond1.innerHTML = `<b>Référence devis</b> : ${esc(eventData?.quoteNumber || "—")}`;
      cond2.innerHTML = `<b>Échéance de paiement</b> : ${esc(termLabel(term))}`;
      cond3.innerHTML = `<b>Annulation</b> : ${esc(String(cancelPct))} % du montant en cas d’annulation moins de 48 h avant l’intervention.`;
    }

    function renderPenalty(eventData){
      const candidates = [
        eventData?.invoicePenaltyText,     // si tu veux plus tard
        eventData?.quotePenaltyText,
        eventData?.penaltyText,
        eventData?.commercialPenaltyText
      ].map(v => String(v || "").trim()).filter(Boolean);

      if(candidates.length){
        penaltyTextEl.textContent = candidates[0];
        return;
      }

      const mode = String(
        eventData?.quotePenaltyMode ||
        eventData?.penaltyMode ||
        "B2C"
      ).trim().toUpperCase();

      penaltyTextEl.textContent = getPenaltyTemplate(mode);
    }

    printBtn.addEventListener("click", ()=> window.print());

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }

      const eventId = getParam("eventId");
      if(!eventId){
        showError("eventId manquant.");
        return;
      }

      backLink.href = `factures-liste.html`;

      try{
        const eventRef = doc(db, "events", eventId);
        const es = await getDoc(eventRef);
        if(!es.exists()){
          showError("Facture introuvable (event).");
          return;
        }
        const eventData = { id: es.id, ...(es.data()||{}) };

        if(eventData.conciergerieUid && eventData.conciergerieUid !== user.uid){
          showError("Accès refusé (event d’une autre conciergerie).");
          return;
        }

        // sécurité UX : pas de preview propre si pas de numéro facture
        if(!String(eventData.invoiceNumber || "").trim()){
          showError("Numéro de facture manquant. Crée / enregistre la facture avant l’aperçu.");
          return;
        }

        // Business profile
        const userSnap = await getDoc(doc(db,"users", user.uid));
        const profile = userSnap.exists() ? (userSnap.data()||{}) : {};
        const bp = applyBusinessProfile(profile);

        // Owner (facturation)
        const ownerFromOwners = await loadOwnerForEvent(user.uid, eventData);
        renderClientHeader(ownerFromOwners, eventData);

        // Header / logement / lignes / conditions / pénalités
        renderDocHeader(eventData);
        renderHomeAndPeriod(eventData);
        renderLines(eventData, bp || {});
        renderPaymentAndConditions(eventData, bp || {});
        renderPenalty(eventData);

      }catch(e){
        console.error(e);
        showError(e?.message || "Erreur chargement aperçu.");
      }
    });
  </script>
</body>
</html>
