<!-- docs/preuves-admin.html (FINAL — ZIP global sur missions/MENAGE.proofZip + conciergerie view + fallback agent from event) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Preuves (Admin)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Police plus sobre: Inter 400/500/600 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#6b6b6b; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.16);
      --shadow: 0 12px 28px rgba(0,0,0,0.07);
      --card: rgba(255,255,255,0.92);
    }

    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:flex-start; gap:10px; align-items:center;
      position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:1px solid rgba(122,92,255,0.35);
      color:var(--violet); text-decoration:none;
      font-weight:600; font-size:13px; cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      white-space:nowrap;
    }

    .wrap{ width:100%; max-width:980px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:14px; }

    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:12px; background:#fff;
      border-left:4px solid var(--bad); box-shadow:0 2px 8px rgba(0,0,0,.05);
      font-size:12px; font-weight:600; color:#333; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    h1{ margin:0; font-size:16px; font-weight:600; letter-spacing:-0.1px; }
    .sub{ margin-top:6px; color:#444; font-size:12px; font-weight:500; white-space:pre-wrap; }
    .label{ font-size:11px; font-weight:600; color:var(--muted); letter-spacing:.2px; text-transform:uppercase; }

    .context-box{
      background:#fff;
      border:1px solid rgba(122,92,255,0.14);
      border-radius:14px;
      padding:12px;
      display:grid;
      gap:8px;
    }
    .ctx-row{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .ctx-row .k{ font-weight:600; color:#333; }
    .ctx-row .v{ font-weight:500; color:#222; text-align:right; }

    .zipCard{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.06);
      box-shadow:0 2px 10px rgba(0,0,0,.05);
      padding:14px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .zipTop{
      display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:flex-start;
    }
    .zipName{ font-weight:600; font-size:14px; color:#111; }
    .zipMeta{ font-weight:500; font-size:12px; color:#555; line-height:1.45; }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .btn{
      border:none; border-radius:999px; padding:9px 12px; font-size:12px; font-weight:600; cursor:pointer;
      color:#fff; background:linear-gradient(90deg,var(--violet),var(--violet2));
      box-shadow:0 8px 18px rgba(0,0,0,0.09); white-space:nowrap;
      text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    }
    .btn.ghost{
      background:#fff; color:var(--violet); border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 2px 8px rgba(0,0,0,.05);
    }
    .btn.red{
      background:#fff; color:var(--bad); border:1px solid rgba(179,38,30,0.30);
      box-shadow:0 2px 8px rgba(0,0,0,.05);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .empty{
      background:#fff; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.05);
      padding:12px; color:#666; font-weight:600; font-size:12px;
      border:1px solid rgba(0,0,0,0.06);
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="planning.html">← Planning</a>
    </div>

    <div class="wrap">
      <div>
        <h1>Preuves — Admin (ZIP global)</h1>
        <div class="sub" id="subLine">Chargement…</div>
        <div class="alert" id="alertBox"></div>
      </div>

      <section class="card">
        <div class="label">Prestation</div>
        <div style="margin-top:10px;" class="context-box" id="ctx">—</div>
      </section>

      <section class="card">
        <div class="label">ZIP preuves</div>
        <div style="margin-top:10px;" id="zipWrap">
          <div class="empty">—</div>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const ctx = document.getElementById("ctx");
    const zipWrap = document.getElementById("zipWrap");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }

    function fmtDateTimeFromMs(ms){
      const t = Number(ms);
      if(!Number.isFinite(t)) return "—";
      const d = new Date(t);
      const p2 = (n)=> String(n).padStart(2,"0");
      return `${p2(d.getDate())}/${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
    }

    function renderContext(eventDoc){
      const title = `${eventDoc.homeName || "Logement"}${eventDoc.homeCity ? " — " + eventDoc.homeCity : ""}${eventDoc.homeType ? " ("+eventDoc.homeType+")" : ""}`;
      const arrival = (eventDoc.arrivalDateKey || eventDoc.dateKey || "—")
        + (eventDoc.arrivalTime ? " • " + eventDoc.arrivalTime : (eventDoc.time ? " • " + eventDoc.time : ""));
      const departure = (eventDoc.departureDateKey || "—") + (eventDoc.departureTime ? " • " + eventDoc.departureTime : "");
      const addr = [eventDoc.homeAddress, eventDoc.homeZip].filter(Boolean).join(" ").trim() || "—";
      const owner = [eventDoc.ownerName, eventDoc.ownerPhone].filter(Boolean).join(" • ") || "—";

      ctx.innerHTML = `
        <div class="ctx-row"><div class="k">Logement</div><div class="v">${esc(title)}</div></div>
        <div class="ctx-row"><div class="k">Arrivée</div><div class="v">${esc(arrival)}</div></div>
        <div class="ctx-row"><div class="k">Départ</div><div class="v">${esc(departure)}</div></div>
        <div class="ctx-row"><div class="k">Adresse</div><div class="v">${esc(addr)}</div></div>
        <div class="ctx-row"><div class="k">Propriétaire</div><div class="v">${esc(owner)}</div></div>
      `;
    }

    // ✅ fallback agent: proofZip -> event.assignedTo -> event.agentName
    function agentLineFrom(proofZip, eventDoc){
      const a =
        [proofZip?.agentName, proofZip?.agentEmail].filter(Boolean).join(" • ")
        || [eventDoc?.assignedToName, eventDoc?.assignedToEmail].filter(Boolean).join(" • ")
        || [eventDoc?.agentName, eventDoc?.agentEmail].filter(Boolean).join(" • ");

      return a || "—";
    }

    function renderZipCard(proofZip, eventDoc){
      zipWrap.innerHTML = "";

      if(!proofZip || !proofZip.url){
        zipWrap.innerHTML = `<div class="empty">Aucun ZIP envoyé.</div>`;
        return;
      }

      const name = proofZip.name || "preuves.zip";
      const whenTxt = proofZip.createdAtMs ? fmtDateTimeFromMs(proofZip.createdAtMs) : "—";
      const sizeTxt = proofZip.sizeBytes ? `${Math.round(Number(proofZip.sizeBytes)/1024)} Ko` : "—";
      const agentLine = agentLineFrom(proofZip, eventDoc);

      const div = document.createElement("div");
      div.className = "zipCard";
      div.innerHTML = `
        <div class="zipTop">
          <div>
            <div class="zipName">📦 ${esc(name)}</div>
            <div class="zipMeta">
              Envoyé : ${esc(whenTxt)} • Taille : ${esc(sizeTxt)}<br>
              Agent : ${esc(agentLine)}
            </div>
          </div>
          <div class="actions">
            <a class="btn ghost" href="${esc(proofZip.url)}" target="_blank" rel="noopener">Ouvrir</a>
            <button class="btn" id="dlBtn" type="button">Télécharger</button>
            <button class="btn red" id="delBtn" type="button">Supprimer</button>
          </div>
        </div>
      `;
      zipWrap.appendChild(div);

      div.querySelector("#dlBtn")?.addEventListener("click", ()=>{
        window.open(proofZip.url, "_blank", "noopener");
      });

      div.querySelector("#delBtn")?.addEventListener("click", async ()=>{
        hideAlert();
        const ok = confirm("Supprimer le ZIP ? (référence Firestore)");
        if(!ok) return;

        const delBtn = div.querySelector("#delBtn");
        delBtn.disabled = true;
        delBtn.textContent = "Suppression…";

        try{
          await updateDoc(doc(db,"events",prestationId,"missions",MISSION),{
            proofZip: null,
            updatedAt: serverTimestamp()
          });
          showAlert("✅ ZIP supprimé.", true);
          await load();
        }catch(err){
          console.error(err);
          showAlert("Erreur suppression : " + (err?.code || err?.message || "inconnue"));
        }finally{
          delBtn.disabled = false;
          delBtn.textContent = "Supprimer";
        }
      });
    }

    const prestationId = qs("prestationId");
    const MISSION = "MENAGE";

    let currentUser = null;

    async function load(){
      hideAlert();
      subLine.textContent = "Chargement…";
      ctx.innerHTML = "—";
      zipWrap.innerHTML = `<div class="empty">—</div>`;

      if(!prestationId){
        subLine.textContent = "";
        showAlert("prestationId manquant (URL).");
        return;
      }
      if(!currentUser){
        subLine.textContent = "";
        showAlert("Utilisateur non authentifié.");
        return;
      }

      const eRef = doc(db, "events", prestationId);
      const eSnap = await getDoc(eRef);
      if(!eSnap.exists()){
        subLine.textContent = "";
        showAlert("Prestation introuvable.");
        return;
      }
      const eventDoc = eSnap.data() || {};

      if(String(eventDoc.conciergerieUid || "") !== String(currentUser.uid || "")){
        subLine.textContent = "";
        showAlert("Accès refusé (prestation hors conciergerie).");
        return;
      }

      renderContext(eventDoc);

      const mRef = doc(db, "events", prestationId, "missions", MISSION);
      const mSnap = await getDoc(mRef);
      if(!mSnap.exists()){
        subLine.textContent = "";
        zipWrap.innerHTML = `<div class="empty">Aucun ZIP.</div>`;
        return;
      }
      const missionDoc = mSnap.data() || {};
      renderZipCard(missionDoc.proofZip || null, eventDoc);

      subLine.textContent = "";
    }

    onAuthStateChanged(auth, async (u)=>{
      if(!u){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = u;
      load().catch(err=>{
        console.error(err);
        showAlert("Erreur chargement : " + (err?.code || err?.message || "inconnue"));
      });
    });
  </script>
</body>
</html>
