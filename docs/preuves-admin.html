<!-- docs/preuves-admin.html (FINAL — Admin proof validation writes into events) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Preuves (Admin)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#6b6b6b; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.16);
      --shadow: 0 12px 28px rgba(0,0,0,0.07);
      --card: rgba(255,255,255,0.92);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; }
    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:flex-start; gap:10px; align-items:center;
      position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:1px solid rgba(122,92,255,0.35);
      color:var(--violet); text-decoration:none;
      font-weight:700; font-size:13px; cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      white-space:nowrap;
    }
    .wrap{ width:100%; max-width:980px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:14px; }
    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:12px; background:#fff;
      border-left:4px solid var(--bad); box-shadow:0 2px 8px rgba(0,0,0,.05);
      font-size:12px; font-weight:700; color:#333; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }
    h1{ margin:0; font-size:16px; font-weight:700; letter-spacing:-0.1px; }
    .sub{ margin-top:6px; color:#444; font-size:12px; font-weight:600; white-space:pre-wrap; }
    .label{ font-size:11px; font-weight:800; color:var(--muted); letter-spacing:.2px; text-transform:uppercase; }

    .context-box{
      background:#fff;
      border:1px solid rgba(122,92,255,0.14);
      border-radius:14px;
      padding:12px;
      display:grid;
      gap:8px;
    }
    .ctx-row{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .ctx-row .k{ font-weight:800; color:#333; }
    .ctx-row .v{ font-weight:600; color:#222; text-align:right; }

    .missionCard{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.06);
      box-shadow:0 2px 10px rgba(0,0,0,.05);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .mTop{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start; }
    .mTitle{ font-weight:800; font-size:14px; color:#111; }
    .mMeta{ font-weight:600; font-size:12px; color:#555; line-height:1.45; }
    .grid{
      display:grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap:8px;
    }
    @media (max-width: 720px){
      .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); }
    }
    .ph{
      background:#fafafa;
      border:1px solid rgba(0,0,0,0.08);
      border-radius:12px;
      overflow:hidden;
      aspect-ratio: 1 / 1;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
    }
    .ph img{ width:100%; height:100%; object-fit:cover; display:block; }
    .empty{
      background:#fff; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.05);
      padding:12px; color:#666; font-weight:700; font-size:12px;
      border:1px solid rgba(0,0,0,0.06);
    }

    /* ✅ Admin validate box */
    .adminBox{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    textarea{
      width:100%;
      border-radius:12px;
      border:1px solid rgba(122,92,255,0.25);
      padding:10px 10px;
      font-size:13px;
      outline:none;
      background:#fff;
      min-height:92px;
      resize:vertical;
      font-weight:600;
      color:#111;
    }
    textarea:focus{
      border-color:var(--violet);
      box-shadow:0 0 0 3px rgba(122,92,255,.12);
    }
    .rowBtns{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
    }
    .btn{
      border:none;
      border-radius:999px;
      padding:10px 12px;
      font-weight:800;
      cursor:pointer;
      background:#fff;
      color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      font-size:13px;
      white-space:nowrap;
    }
    .btn.ok{
      background:linear-gradient(90deg, rgba(27,143,77,.92), rgba(27,143,77,1));
      border-color:transparent;
      color:#fff;
    }
    .btn.ko{
      background:linear-gradient(90deg, rgba(179,38,30,.92), rgba(179,38,30,1));
      border-color:transparent;
      color:#fff;
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    /* viewer simple */
    .viewerBg{
      position:fixed; inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:14px;
      z-index:99;
    }
    .viewer{
      width:min(980px, 96vw);
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 18px 40px rgba(0,0,0,.25);
    }
    .viewerTop{
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      border-bottom:1px solid rgba(0,0,0,0.08);
      background:linear-gradient(90deg, rgba(122,92,255,.10), rgba(98,56,255,.06));
    }
    .viewerTop b{ font-size:13px; }
    .viewerTop button{
      border:none; border-radius:999px; padding:8px 10px;
      font-weight:800; cursor:pointer;
      background:#fff; color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
    }
    .viewerImgWrap{
      background:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
    }
    .viewerImgWrap img{
      max-width:100%;
      max-height:78vh;
      object-fit:contain;
      display:block;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="planning.html">← Planning</a>
    </div>

    <div class="wrap">
      <div>
        <h1>Preuves — Admin (Photos)</h1>
        <div class="sub" id="subLine">Chargement…</div>
        <div class="alert" id="alertBox"></div>
      </div>

      <section class="card">
        <div class="label">Prestation</div>
        <div style="margin-top:10px;" class="context-box" id="ctx">—</div>
      </section>

      <!-- ✅ NEW: admin validation -->
      <section class="card">
        <div class="label">Validation admin</div>
        <div class="adminBox" style="margin-top:10px;">
          <div class="sub" id="adminStatusLine">—</div>

          <textarea id="adminNote" placeholder="Note admin (optionnel) : défauts, manquants, OK…"></textarea>

          <div class="rowBtns">
            <button class="btn ko" id="btnKo" type="button">Refuser (KO)</button>
            <button class="btn ok" id="btnOk" type="button">Valider (OK)</button>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="label">Photos par mission</div>
        <div style="margin-top:10px;" id="missionsWrap">
          <div class="empty">—</div>
        </div>
      </section>
    </div>
  </div>

  <!-- viewer -->
  <div class="viewerBg" id="viewerBg" aria-hidden="true">
    <div class="viewer" role="dialog" aria-modal="true">
      <div class="viewerTop">
        <b id="viewerTitle">Photo</b>
        <div style="display:flex; gap:8px; align-items:center;">
          <a id="viewerOpen" class="pill" style="padding:6px 10px; font-size:12px;" href="#" target="_blank" rel="noopener">Ouvrir</a>
          <button id="viewerClose" type="button">Fermer</button>
        </div>
      </div>
      <div class="viewerImgWrap">
        <img id="viewerImg" alt="photo" />
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, collection, getDocs, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const ctx = document.getElementById("ctx");
    const missionsWrap = document.getElementById("missionsWrap");

    const adminStatusLine = document.getElementById("adminStatusLine");
    const adminNoteEl = document.getElementById("adminNote");
    const btnOk = document.getElementById("btnOk");
    const btnKo = document.getElementById("btnKo");

    const viewerBg = document.getElementById("viewerBg");
    const viewerClose = document.getElementById("viewerClose");
    const viewerImg = document.getElementById("viewerImg");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerOpen = document.getElementById("viewerOpen");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }

    function renderContext(eventDoc){
      const title = `${eventDoc.homeName || "Logement"}${eventDoc.homeCity ? " — " + eventDoc.homeCity : ""}${eventDoc.homeType ? " ("+eventDoc.homeType+")" : ""}`;
      const arrival = (eventDoc.arrivalDateKey || eventDoc.dateKey || "—")
        + (eventDoc.arrivalTime ? " • " + eventDoc.arrivalTime : (eventDoc.time ? " • " + eventDoc.time : ""));
      const departure = (eventDoc.departureDateKey || "—") + (eventDoc.departureTime ? " • " + eventDoc.departureTime : "");
      const addr = [eventDoc.homeAddress, eventDoc.homeZip].filter(Boolean).join(" ").trim() || "—";
      const owner = [eventDoc.ownerName, eventDoc.ownerPhone].filter(Boolean).join(" • ") || "—";

      ctx.innerHTML = `
        <div class="ctx-row"><div class="k">Logement</div><div class="v">${esc(title)}</div></div>
        <div class="ctx-row"><div class="k">Arrivée</div><div class="v">${esc(arrival)}</div></div>
        <div class="ctx-row"><div class="k">Départ</div><div class="v">${esc(departure)}</div></div>
        <div class="ctx-row"><div class="k">Adresse</div><div class="v">${esc(addr)}</div></div>
        <div class="ctx-row"><div class="k">Propriétaire</div><div class="v">${esc(owner)}</div></div>
      `;
    }

    function openViewer(url, titleText){
      viewerTitle.textContent = titleText || "Photo";
      viewerImg.src = url;
      viewerOpen.href = url;
      viewerBg.style.display = "flex";
      viewerBg.setAttribute("aria-hidden","false");
    }
    function closeViewer(){
      viewerBg.style.display = "none";
      viewerBg.setAttribute("aria-hidden","true");
      viewerImg.src = "";
      viewerOpen.href = "#";
    }
    viewerClose.addEventListener("click", closeViewer);
    viewerBg.addEventListener("click", (e)=>{ if(e.target === viewerBg) closeViewer(); });

    function renderMissions(missions){
      missionsWrap.innerHTML = "";

      if(!missions.length){
        missionsWrap.innerHTML = `<div class="empty">Aucune mission trouvée.</div>`;
        return;
      }

      for(const m of missions){
        const photos = Array.isArray(m.proofPhotos) ? m.proofPhotos : [];
        const count = Number.isFinite(Number(m.proofPhotosCount)) ? Number(m.proofPhotosCount) : photos.length;
        const locked = !!m.locked;
        const status = String(m.status || "").toUpperCase() || "—";

        const card = document.createElement("div");
        card.className = "missionCard";
        card.innerHTML = `
          <div class="mTop">
            <div>
              <div class="mTitle">Mission : ${esc(m.id)}</div>
              <div class="mMeta">Status : ${esc(status)}${locked ? " • verrouillée" : ""}<br>Photos : ${esc(count)}</div>
            </div>
          </div>
          <div class="grid" data-grid="${esc(m.id)}"></div>
        `;
        missionsWrap.appendChild(card);

        const grid = card.querySelector(`[data-grid="${m.id}"]`);
        if(!photos.length){
          grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">Aucune photo.</div>`;
          continue;
        }

        // thumbs (max 20)
        grid.innerHTML = photos.slice(0,20).map((p, idx)=>{
          const url = p?.url || "";
          if(!url) return "";
          return `<div class="ph" data-url="${esc(url)}" data-title="${esc(m.id)} #${idx+1}"><img src="${esc(url)}" alt="photo"></div>`;
        }).join("");

        grid.querySelectorAll(".ph[data-url]").forEach(el=>{
          el.addEventListener("click", ()=>{
            const url = el.getAttribute("data-url");
            const t = el.getAttribute("data-title") || "Photo";
            openViewer(url, t);
          });
        });
      }
    }

    function flattenProofUrls(missions){
      const urls = [];
      for(const m of missions){
        const photos = Array.isArray(m.proofPhotos) ? m.proofPhotos : [];
        for(const p of photos){
          const u = (p?.url || "").toString().trim();
          if(u) urls.push(u);
        }
      }
      // de-dup
      return Array.from(new Set(urls));
    }

    const prestationId = qs("prestationId");
    let currentUser = null;

    let cachedEventDoc = null;
    let cachedMissions = [];

    function lockAdminButtons(lock){
      btnOk.disabled = !!lock;
      btnKo.disabled = !!lock;
      adminNoteEl.disabled = !!lock;
    }

    function renderAdminStatusLine(eventDoc){
      const s = String(eventDoc?.adminProofStatus || "NONE").toUpperCase();
      const note = String(eventDoc?.adminProofNote || "").trim();
      adminStatusLine.textContent =
        `Statut actuel : ${s}` + (eventDoc?.adminProofAt?.seconds ? " • daté" : "") + (note ? " • note existante" : "");
      if(!adminNoteEl.value.trim() && note) adminNoteEl.value = note;
    }

    async function setAdminProof(status){
      hideAlert();

      if(!cachedEventDoc) return showAlert("Prestation non chargée.");
      if(!currentUser?.uid) return showAlert("Non connecté.");

      const s = String(status || "").toUpperCase();
      if(s !== "OK" && s !== "KO") return showAlert("Statut invalide.");

      // Règle simple : si aucune photo, on empêche OK
      const allUrls = flattenProofUrls(cachedMissions);
      if(s === "OK" && allUrls.length === 0){
        return showAlert("⛔ Impossible de valider OK : aucune photo trouvée sur les missions.");
      }

      if(!confirm(`Confirmer preuve admin = ${s} ?`)) return;

      lockAdminButtons(true);

      try{
        const eRef = doc(db, "events", prestationId);
        const note = (adminNoteEl.value || "").trim();

        const payload = {
          adminProofStatus: s,
          adminProofAt: serverTimestamp(),
          adminProofByUid: currentUser.uid,
          adminProofNote: note,
          adminProofUrls: allUrls,
          updatedAt: serverTimestamp()
        };

        // ✅ si OK => on valide aussi l’event (facturation/stats)
        if(s === "OK"){
          payload.validatedAt = serverTimestamp();
          payload.validatedBy = currentUser.uid;
          payload.agentStatsCounted = false;
        }

        await updateDoc(eRef, payload);

        // refresh local state
        const fresh = await getDoc(eRef);
        cachedEventDoc = fresh.exists() ? (fresh.data() || {}) : cachedEventDoc;

        renderAdminStatusLine(cachedEventDoc);
        showAlert(`✅ Preuve admin enregistrée : ${s}.`, true);
      }catch(err){
        console.error(err);
        showAlert("Erreur sauvegarde preuve admin : " + (err?.message || "inconnue"));
      }finally{
        lockAdminButtons(false);
      }
    }

    async function load(){
      hideAlert();
      subLine.textContent = "Chargement…";
      ctx.innerHTML = "—";
      missionsWrap.innerHTML = `<div class="empty">—</div>`;
      adminStatusLine.textContent = "—";
      cachedEventDoc = null;
      cachedMissions = [];

      if(!prestationId){
        subLine.textContent = "";
        showAlert("prestationId manquant (URL).");
        return;
      }
      if(!currentUser){
        subLine.textContent = "";
        showAlert("Utilisateur non authentifié.");
        return;
      }

      const eRef = doc(db, "events", prestationId);
      const eSnap = await getDoc(eRef);
      if(!eSnap.exists()){
        subLine.textContent = "";
        showAlert("Prestation introuvable.");
        return;
      }
      const eventDoc = eSnap.data() || {};

      if(String(eventDoc.conciergerieUid || "") !== String(currentUser.uid || "")){
        subLine.textContent = "";
        showAlert("Accès refusé (prestation hors conciergerie).");
        return;
      }

      cachedEventDoc = eventDoc;

      renderContext(eventDoc);
      renderAdminStatusLine(eventDoc);

      const ms = await getDocs(collection(db,"events",prestationId,"missions"));
      const missions = [];
      ms.forEach(s=> missions.push({ id: s.id, ...(s.data()||{}) }));
      missions.sort((a,b)=> String(a.id).localeCompare(String(b.id)));

      cachedMissions = missions;

      renderMissions(missions);

      // petit résumé
      const urls = flattenProofUrls(missions);
      subLine.textContent = `Missions : ${missions.length} • Photos total : ${urls.length}`;

      // UX: si déjà OK/KO, tu peux laisser revalider (utile), mais tu vois le statut
    }

    btnOk.addEventListener("click", ()=> setAdminProof("OK"));
    btnKo.addEventListener("click", ()=> setAdminProof("KO"));

    onAuthStateChanged(auth, async (u)=>{
      if(!u){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = u;
      load().catch(err=>{
        console.error(err);
        showAlert("Erreur chargement : " + (err?.code || err?.message || "inconnue"));
      });
    });
  </script>
</body>
</html>
