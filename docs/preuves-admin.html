<!-- docs/preuves-admin.html (READ ONLY — consultation des preuves photos ; validation uniquement dans planning.html) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Preuves (Photos)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#6b6b6b; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.16);
      --shadow: 0 12px 28px rgba(0,0,0,0.07);
      --card: rgba(255,255,255,0.92);
    }

    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 14px 26px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      display:flex;
      justify-content:flex-start;
      gap:10px;
      align-items:center;
      position:sticky;
      top:0;
      z-index:10;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.35);
      color:var(--violet);
      text-decoration:none;
      font-weight:800;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      white-space:nowrap;
    }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:14px;
    }

    .alert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      border-radius:12px;
      background:#fff;
      border-left:4px solid var(--bad);
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      font-size:12px;
      font-weight:800;
      color:#333;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    h1{
      margin:0;
      font-size:16px;
      font-weight:800;
      letter-spacing:-0.1px;
    }

    .sub{
      margin-top:6px;
      color:#444;
      font-size:12px;
      font-weight:700;
      white-space:pre-wrap;
    }

    .label{
      font-size:11px;
      font-weight:900;
      color:var(--muted);
      letter-spacing:.2px;
      text-transform:uppercase;
    }

    .context-box{
      background:#fff;
      border:1px solid rgba(122,92,255,0.14);
      border-radius:14px;
      padding:12px;
      display:grid;
      gap:8px;
    }

    .ctx-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .ctx-row .k{
      font-weight:900;
      color:#333;
    }

    .ctx-row .v{
      font-weight:700;
      color:#222;
      text-align:right;
    }

    .statusLine{
      margin-top:10px;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
      background:rgba(122,92,255,0.12);
      color:#5b45c8;
      border:1px solid rgba(122,92,255,0.14);
    }
    .badge.ok{
      background:rgba(27,143,77,0.14);
      color:var(--ok);
      border-color:rgba(27,143,77,0.18);
    }
    .badge.bad{
      background:rgba(179,38,30,0.14);
      color:var(--bad);
      border-color:rgba(179,38,30,0.18);
    }
    .badge.orange{
      background:rgba(255,140,0,0.16);
      color:#9a4f00;
      border-color:rgba(255,140,0,0.18);
    }
    .badge.gray{
      background:rgba(0,0,0,0.06);
      color:#333;
      border-color:rgba(0,0,0,0.08);
    }

    .missionCard{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.06);
      box-shadow:0 2px 10px rgba(0,0,0,.05);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .mTop{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      align-items:flex-start;
    }

    .mTitle{
      font-weight:900;
      font-size:14px;
      color:#111;
    }

    .mMeta{
      font-weight:700;
      font-size:12px;
      color:#555;
      line-height:1.45;
      white-space:pre-wrap;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(5, minmax(0,1fr));
      gap:8px;
    }

    @media (max-width: 720px){
      .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); }
    }

    .ph{
      background:#fafafa;
      border:1px solid rgba(0,0,0,0.08);
      border-radius:12px;
      overflow:hidden;
      aspect-ratio: 1 / 1;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      position:relative;
    }

    .ph img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }

    .phTag{
      position:absolute;
      left:6px;
      bottom:6px;
      background:rgba(0,0,0,.58);
      color:#fff;
      font-weight:900;
      font-size:10px;
      padding:4px 6px;
      border-radius:999px;
    }

    .empty{
      background:#fff;
      border-radius:14px;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      padding:12px;
      color:#666;
      font-weight:800;
      font-size:12px;
      border:1px solid rgba(0,0,0,0.06);
    }

    .summaryBox{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:10px;
    }

    .viewerBg{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.55);
      display:none;
      align-items:center;
      justify-content:center;
      padding:14px;
      z-index:99;
    }

    .viewer{
      width:min(980px, 96vw);
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 18px 40px rgba(0,0,0,.25);
    }

    .viewerTop{
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      border-bottom:1px solid rgba(0,0,0,0.08);
      background:linear-gradient(90deg, rgba(122,92,255,.10), rgba(98,56,255,.06));
    }

    .viewerTop b{ font-size:13px; }

    .viewerTop button{
      border:none;
      border-radius:999px;
      padding:8px 10px;
      font-weight:800;
      cursor:pointer;
      background:#fff;
      color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
    }

    .viewerImgWrap{
      background:#111;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
    }

    .viewerImgWrap img{
      max-width:100%;
      max-height:78vh;
      object-fit:contain;
      display:block;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="planning.html">← Planning</a>
    </div>

    <div class="wrap">
      <div>
        <h1>Preuves — Consultation photos</h1>
        <div class="sub" id="subLine">Chargement…</div>
        <div class="alert" id="alertBox"></div>
      </div>

      <section class="card">
        <div class="label">Prestation</div>
        <div style="margin-top:10px;" class="context-box" id="ctx">—</div>

        <div class="statusLine" id="statusLine"></div>

        <div class="summaryBox" id="summaryBox"></div>
      </section>

      <section class="card">
        <div class="label">Photos trouvées</div>
        <div style="margin-top:10px;" id="missionsWrap">
          <div class="empty">—</div>
        </div>
      </section>
    </div>
  </div>

  <div class="viewerBg" id="viewerBg" aria-hidden="true">
    <div class="viewer" role="dialog" aria-modal="true">
      <div class="viewerTop">
        <b id="viewerTitle">Photo</b>
        <div style="display:flex; gap:8px; align-items:center;">
          <a id="viewerOpen" class="pill" style="padding:6px 10px; font-size:12px;" href="#" target="_blank" rel="noopener">Ouvrir</a>
          <button id="viewerClose" type="button">Fermer</button>
        </div>
      </div>
      <div class="viewerImgWrap">
        <img id="viewerImg" alt="photo" />
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, collection, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const ctx = document.getElementById("ctx");
    const statusLine = document.getElementById("statusLine");
    const summaryBox = document.getElementById("summaryBox");
    const missionsWrap = document.getElementById("missionsWrap");
    const backBtn = document.getElementById("backBtn");

    const viewerBg = document.getElementById("viewerBg");
    const viewerClose = document.getElementById("viewerClose");
    const viewerImg = document.getElementById("viewerImg");
    const viewerTitle = document.getElementById("viewerTitle");
    const viewerOpen = document.getElementById("viewerOpen");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }

    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function qs(name){
      return new URLSearchParams(location.search).get(name) || "";
    }

    function safeStr(v){
      return (v ?? "").toString().trim();
    }

    function isDateKey(s){
      return /^\d{4}-\d{2}-\d{2}$/.test(String(s || "").trim());
    }

    function opNorm(s){
      const x = String(s || "").toUpperCase().trim();
      if(x === "TERMINEE" || x === "TERMINÉE") return "A_VALIDER";
      if(x === "A_VALIDER" || x === "À VALIDER") return "A_VALIDER";
      if(x === "REALISEE" || x === "RÉALISÉE" || x === "DONE") return "REALISEE";
      if(x === "ANNULEE" || x === "ANNULÉE" || x === "CANCELLED") return "ANNULEE";
      return "EN_COURS";
    }

    function opLabel(s){
      const x = opNorm(s);
      if(x === "A_VALIDER") return "À VALIDER";
      if(x === "REALISEE") return "RÉALISÉE";
      if(x === "ANNULEE") return "ANNULÉE";
      return "EN COURS";
    }

    function opBadgeClass(s){
      const x = opNorm(s);
      if(x === "A_VALIDER") return "orange";
      if(x === "REALISEE") return "ok";
      if(x === "ANNULEE") return "bad";
      return "gray";
    }

    function missionNiceName(id){
      const x = String(id || "").toUpperCase().trim();
      if(x === "PHOTOS") return "Photos";
      if(x === "CHECKIN") return "Check-in";
      if(x === "CHECKOUT") return "Check-out";
      if(x === "MENAGE") return "Ménage";
      if(x === "LINGE") return "Linge";
      if(x === "MAINTENANCE") return "Maintenance";
      if(x === "KITS") return "Kits & consommables";
      return id || "Mission";
    }

    function applyBackLink(){
      const ret = safeStr(qs("return")).toLowerCase();
      const date = safeStr(qs("date"));

      if(ret === "planning"){
        const p = new URLSearchParams();
        if(isDateKey(date)) p.set("date", date);
        backBtn.href = `planning.html${p.toString() ? "?" + p.toString() : ""}`;
        backBtn.textContent = "← Planning";
        return;
      }

      backBtn.href = "planning.html";
      backBtn.textContent = "← Planning";
    }

    function renderContext(eventDoc){
      const title = `${eventDoc.homeName || "Logement"}${eventDoc.homeCity ? " — " + eventDoc.homeCity : ""}${eventDoc.homeType ? " ("+eventDoc.homeType+")" : ""}`;
      const arrival = (eventDoc.arrivalDateKey || eventDoc.dateKey || "—")
        + (eventDoc.arrivalTime ? " • " + eventDoc.arrivalTime : (eventDoc.time ? " • " + eventDoc.time : ""));
      const departure = (eventDoc.departureDateKey || "—")
        + (eventDoc.departureTime ? " • " + eventDoc.departureTime : "");
      const interstay = safeStr(eventDoc.interstayDateKey) || "—";
      const addr = [eventDoc.homeAddress, eventDoc.homeZip, eventDoc.homeCity].filter(Boolean).join(" ").trim() || "—";
      const owner = [eventDoc.ownerName, eventDoc.ownerPhone].filter(Boolean).join(" • ") || "—";
      const agent = [eventDoc.assignedToName, eventDoc.assignedToEmail].filter(Boolean).join(" • ") || "—";

      ctx.innerHTML = `
        <div class="ctx-row"><div class="k">Logement</div><div class="v">${esc(title)}</div></div>
        <div class="ctx-row"><div class="k">Arrivée</div><div class="v">${esc(arrival)}</div></div>
        <div class="ctx-row"><div class="k">Inter-séjour</div><div class="v">${esc(interstay)}</div></div>
        <div class="ctx-row"><div class="k">Départ</div><div class="v">${esc(departure)}</div></div>
        <div class="ctx-row"><div class="k">Adresse</div><div class="v">${esc(addr)}</div></div>
        <div class="ctx-row"><div class="k">Propriétaire</div><div class="v">${esc(owner)}</div></div>
        <div class="ctx-row"><div class="k">Agent</div><div class="v">${esc(agent)}</div></div>
      `;
    }

    function renderStatus(eventDoc){
      const st = opNorm(eventDoc?.opStatus || eventDoc?.status || "EN_COURS");
      statusLine.innerHTML = `
        <span class="badge ${esc(opBadgeClass(st))}">Statut : ${esc(opLabel(st))}</span>
      `;
    }

    function openViewer(url, titleText){
      viewerTitle.textContent = titleText || "Photo";
      viewerImg.src = url;
      viewerOpen.href = url;
      viewerBg.style.display = "flex";
      viewerBg.setAttribute("aria-hidden","false");
    }

    function closeViewer(){
      viewerBg.style.display = "none";
      viewerBg.setAttribute("aria-hidden","true");
      viewerImg.src = "";
      viewerOpen.href = "#";
    }

    viewerClose.addEventListener("click", closeViewer);
    viewerBg.addEventListener("click", (e)=>{ if(e.target === viewerBg) closeViewer(); });

    function uniqPhotos(arr){
      const seen = new Set();
      const out = [];
      for(const p of (Array.isArray(arr) ? arr : [])){
        const url = safeStr(p?.url);
        const path = safeStr(p?.path);
        const key = path || url;
        if(!key || seen.has(key)) continue;
        seen.add(key);
        out.push(p);
      }
      return out;
    }

    function flattenProofUrls(missions){
      const urls = [];
      for(const m of missions){
        const photos = Array.isArray(m.proofPhotos) ? m.proofPhotos : [];
        for(const p of photos){
          const u = safeStr(p?.url);
          if(u) urls.push(u);
        }
      }
      return Array.from(new Set(urls));
    }

    function renderSummary(missions){
      const totalPhotos = flattenProofUrls(missions).length;
      const totalMissions = missions.length;
      const missionsWithPhotos = missions.filter(m => Array.isArray(m.proofPhotos) && m.proofPhotos.length).length;

      summaryBox.innerHTML = `
        <span class="badge gray">Missions lues : ${esc(String(totalMissions))}</span>
        <span class="badge gray">Missions avec photos : ${esc(String(missionsWithPhotos))}</span>
        <span class="badge gray">Photos total : ${esc(String(totalPhotos))}</span>
      `;
    }

    function sortMissionsForDisplay(list){
      const order = ["PHOTOS","CHECKIN","MENAGE","CHECKOUT","LINGE","MAINTENANCE","KITS"];
      return [...list].sort((a,b)=>{
        const ia = order.indexOf(String(a.id || "").toUpperCase());
        const ib = order.indexOf(String(b.id || "").toUpperCase());
        const va = ia === -1 ? 999 : ia;
        const vb = ib === -1 ? 999 : ib;
        if(va !== vb) return va - vb;
        return String(a.id || "").localeCompare(String(b.id || ""));
      });
    }

    function renderMissions(missions){
      missionsWrap.innerHTML = "";

      if(!missions.length){
        missionsWrap.innerHTML = `<div class="empty">Aucune photo trouvée sur cette prestation.</div>`;
        return;
      }

      for(const m of missions){
        const photos = uniqPhotos(Array.isArray(m.proofPhotos) ? m.proofPhotos : []);
        const count = Number.isFinite(Number(m.proofPhotosCount)) ? Number(m.proofPhotosCount) : photos.length;
        const locked = !!m.locked;
        const status = String(m.status || "").toUpperCase() || "—";
        const schedDate = safeStr(m.scheduledDateKey);
        const schedTime = safeStr(m.scheduledTime);

        const card = document.createElement("div");
        card.className = "missionCard";
        card.innerHTML = `
          <div class="mTop">
            <div>
              <div class="mTitle">${esc(missionNiceName(m.id))}</div>
              <div class="mMeta">
Status : ${esc(status)}${locked ? " • verrouillée" : ""}
${schedDate ? "Date : " + esc(schedDate) + (schedTime ? " • " + esc(schedTime) : "") : ""}
Photos : ${esc(String(count))}
              </div>
            </div>
          </div>
          <div class="grid" data-grid="${esc(m.id)}"></div>
        `;
        missionsWrap.appendChild(card);

        const grid = card.querySelector(`[data-grid="${m.id}"]`);
        if(!photos.length){
          grid.innerHTML = `<div class="empty" style="grid-column:1/-1;">Aucune photo.</div>`;
          continue;
        }

        grid.innerHTML = photos.slice(0, 60).map((p, idx)=>{
          const url = safeStr(p?.url);
          if(!url) return "";
          return `
            <div class="ph" data-url="${esc(url)}" data-title="${esc(missionNiceName(m.id))} #${idx+1}">
              <img src="${esc(url)}" alt="photo">
              <span class="phTag">${esc(String(idx+1))}</span>
            </div>
          `;
        }).join("");

        grid.querySelectorAll(".ph[data-url]").forEach(el=>{
          el.addEventListener("click", ()=>{
            const url = el.getAttribute("data-url");
            const t = el.getAttribute("data-title") || "Photo";
            openViewer(url, t);
          });
        });
      }
    }

    const prestationId = safeStr(qs("prestationId") || qs("eventId"));
    let currentUser = null;

    async function load(){
      hideAlert();
      subLine.textContent = "Chargement…";
      ctx.innerHTML = "—";
      statusLine.innerHTML = "";
      summaryBox.innerHTML = "";
      missionsWrap.innerHTML = `<div class="empty">—</div>`;

      if(!prestationId){
        subLine.textContent = "";
        showAlert("ID manquant (URL). Attendu : ?prestationId=... ou ?eventId=...");
        return;
      }
      if(!currentUser){
        subLine.textContent = "";
        showAlert("Utilisateur non authentifié.");
        return;
      }

      const eRef = doc(db, "events", prestationId);
      const eSnap = await getDoc(eRef);
      if(!eSnap.exists()){
        subLine.textContent = "";
        showAlert("Prestation introuvable.");
        return;
      }

      const eventDoc = eSnap.data() || {};

      if(String(eventDoc.conciergerieUid || "") !== String(currentUser.uid || "")){
        subLine.textContent = "";
        showAlert("Accès refusé (prestation hors conciergerie).");
        return;
      }

      renderContext(eventDoc);
      renderStatus(eventDoc);

      const ms = await getDocs(collection(db, "events", prestationId, "missions"));
      const allMissions = [];
      ms.forEach(s => allMissions.push({ id: s.id, ...(s.data() || {}) }));

      // On ne garde que les missions qui ont des photos
      const missionsWithPhotos = allMissions.filter(m => {
        const photos = Array.isArray(m.proofPhotos) ? m.proofPhotos : [];
        const count = Number(m.proofPhotosCount ?? photos.length ?? 0) || 0;
        return count > 0 || photos.length > 0;
      });

      const finalMissions = sortMissionsForDisplay(missionsWithPhotos);

      renderSummary(finalMissions);
      renderMissions(finalMissions);

      const totalPhotos = flattenProofUrls(finalMissions).length;
      subLine.textContent = `Missions avec photos : ${finalMissions.length} • Photos total : ${totalPhotos}`;
    }

    onAuthStateChanged(auth, async (u)=>{
      if(!u){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = u;
      applyBackLink();

      load().catch(err=>{
        console.error(err);
        showAlert("Erreur chargement : " + (err?.code || err?.message || "inconnue"));
      });
    });
  </script>
</body>
</html>
