<!-- docs/preuves-admin.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Preuves (Admin)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
    }

    .wrap{ width:100%; max-width:980px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:12px; }

    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    h1{ margin:0; font-size:18px; font-weight:900; }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; white-space:pre-wrap; }

    .context-box{
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:16px;
      padding:10px;
      display:grid;
      gap:6px;
    }
    .ctx-row{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }
    .ctx-row .k{ font-weight:900; }
    .ctx-row .v{ font-weight:800; color:#333; text-align:right; }

    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .select{
      padding:10px 12px; border-radius:12px; border:1px solid #D3C7FF; background:#fff;
      font-size:13px; font-weight:800; outline:none; min-width:200px;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap:8px;
      margin-top:10px;
    }
    @media(max-width:920px){ .grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media(max-width:720px){ .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }

    .ph{
      position:relative;
      border-radius:14px;
      overflow:hidden;
      border:1px solid rgba(0,0,0,0.06);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      background:#fafafa;
      cursor:pointer;
    }
    .ph img{ width:100%; height:160px; object-fit:cover; display:block; }
    .cap{
      position:absolute; left:8px; bottom:8px;
      background:rgba(255,255,255,0.92);
      padding:4px 8px; border-radius:999px;
      font-size:11px; font-weight:900; color:#444;
      box-shadow:0 2px 8px rgba(0,0,0,.10);
      max-width:90%;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }
    .empty{
      background:#fff; border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:12px; color:#666; font-weight:900; font-size:12px;
    }

    .backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.55);
      display:none; align-items:center; justify-content:center;
      padding:16px; z-index:500;
    }
    .modal{
      width:100%; max-width:920px; background:#fff; border-radius:18px;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 20px 60px rgba(0,0,0,.25);
      overflow:hidden;
    }
    .mhead{
      padding:10px 12px; display:flex; justify-content:space-between; align-items:center; gap:10px;
      border-bottom:1px solid rgba(122,92,255,0.12);
      background:rgba(255,255,255,0.95);
    }
    .mhead .ttl{ font-weight:900; font-size:13px; }
    .mhead .btn{
      border:none; border-radius:999px; padding:8px 10px; font-weight:900; cursor:pointer;
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
      text-decoration:none;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .mbody{ padding:10px; background:#fff; }
    .mbody img{ width:100%; max-height:74vh; object-fit:contain; display:block; background:#fafafa; border-radius:12px; }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="planning.html">← Planning</a>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="pill" id="refreshBtn" type="button">Rafraîchir</button>
        <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
      </div>
    </div>

    <div class="wrap">
      <div>
        <h1>Preuves — Admin</h1>
        <div class="sub" id="subLine">Chargement…</div>
        <div class="alert" id="alertBox"></div>
      </div>

      <section class="card">
        <div class="mini">Prestation</div>
        <div style="margin-top:8px;" class="context-box" id="ctx">—</div>
      </section>

      <section class="card">
        <div class="row">
          <div>
            <div class="mini">Filtre mission</div>
            <select class="select" id="filterSel">
              <option value="ALL">Toutes</option>
            </select>
          </div>
          <div style="text-align:right;">
            <div class="mini">Total photos</div>
            <div style="font-weight:900;" id="countLine">—</div>
          </div>
        </div>

        <div id="gridWrap" style="margin-top:10px;">
          <div class="empty">—</div>
        </div>
      </section>

      <div class="mini">
        Lecture = <b>events/{prestationId}/missions/{TYPE}.photos</b>
      </div>
    </div>
  </div>

  <div class="backdrop" id="lightbox" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="mhead">
        <div class="ttl" id="lbTitle">Photo</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <a class="btn" id="openOriginal" href="#" target="_blank" rel="noopener">Ouvrir</a>
          <button class="btn" id="lbClose" type="button">Fermer</button>
        </div>
      </div>
      <div class="mbody">
        <img id="lbImg" alt="photo">
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const ctx = document.getElementById("ctx");
    const filterSel = document.getElementById("filterSel");
    const gridWrap = document.getElementById("gridWrap");
    const countLine = document.getElementById("countLine");

    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const lightbox = document.getElementById("lightbox");
    const lbImg = document.getElementById("lbImg");
    const lbTitle = document.getElementById("lbTitle");
    const lbClose = document.getElementById("lbClose");
    const openOriginal = document.getElementById("openOriginal");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }

    function missionLabel(t){
      const x = String(t||"").toUpperCase();
      if(x==="CHECKIN") return "Check-in";
      if(x==="MENAGE") return "Ménage";
      if(x==="CHECKOUT") return "Check-out";
      if(x==="LINGE") return "Linge";
      if(x==="MAINTENANCE") return "Maintenance";
      if(x==="KITS") return "Kits & conso";
      return x || "Mission";
    }

    function openLightbox(url, title){
      lbImg.src = url;
      lbTitle.textContent = title || "Photo";
      openOriginal.href = url;
      lightbox.style.display = "flex";
      lightbox.setAttribute("aria-hidden", "false");
    }
    function closeLightbox(){
      lightbox.style.display = "none";
      lightbox.setAttribute("aria-hidden", "true");
      lbImg.src = "";
      openOriginal.href = "#";
    }
    lightbox.addEventListener("click",(e)=>{ if(e.target===lightbox) closeLightbox(); });
    lbClose.addEventListener("click", closeLightbox);

    const prestationId = qs("prestationId");
    let currentUser = null;
    let eventDoc = null;

    let photosByMission = new Map(); // type -> [{url,path,...}]
    let allPhotos = []; // { missionType, url, idx }

    function normalizePhotoList(arr){
      const out = [];
      (Array.isArray(arr) ? arr : []).forEach(x=>{
        if(!x) return;
        if(typeof x === "string") out.push({ url:x, path:"", createdAtMs:0 });
        else if(typeof x === "object" && x.url) out.push({
          url:String(x.url),
          path:String(x.path||""),
          createdAtMs:Number(x.createdAtMs||0),
          token:String(x.token||""),
          agentEmail:String(x.agentEmail||"")
        });
      });
      return out;
    }

    function renderContext(){
      if(!eventDoc){
        ctx.innerHTML = `<div class="empty">Prestation introuvable.</div>`;
        return;
      }

      const title = `${eventDoc.homeName || "Logement"}${eventDoc.homeCity ? " — " + eventDoc.homeCity : ""}${eventDoc.homeType ? " ("+eventDoc.homeType+")" : ""}`;
      const arrival = (eventDoc.arrivalDateKey || eventDoc.dateKey || "—") + (eventDoc.arrivalTime ? " • " + eventDoc.arrivalTime : (eventDoc.time ? " • " + eventDoc.time : ""));
      const departure = (eventDoc.departureDateKey || "—") + (eventDoc.departureTime ? " • " + eventDoc.departureTime : "");
      const addr = [eventDoc.homeAddress, eventDoc.homeZip].filter(Boolean).join(" ").trim() || "—";
      const owner = [eventDoc.ownerName, eventDoc.ownerPhone].filter(Boolean).join(" • ") || "—";

      ctx.innerHTML = `
        <div class="ctx-row"><div class="k">Logement :</div><div class="v">${esc(title)}</div></div>
        <div class="ctx-row"><div class="k">Arrivée :</div><div class="v">${esc(arrival)}</div></div>
        <div class="ctx-row"><div class="k">Départ :</div><div class="v">${esc(departure)}</div></div>
        <div class="ctx-row"><div class="k">Adresse :</div><div class="v">${esc(addr)}</div></div>
        <div class="ctx-row"><div class="k">Propriétaire :</div><div class="v">${esc(owner)}</div></div>
      `;
    }

    function renderFilterOptions(){
      const cur = filterSel.value || "ALL";
      const types = Array.from(photosByMission.keys()).sort();
      filterSel.innerHTML = `<option value="ALL">Toutes</option>` + types.map(t=>{
        return `<option value="${esc(t)}">${esc(missionLabel(t))}</option>`;
      }).join("");
      filterSel.value = types.includes(cur) ? cur : "ALL";
    }

    function renderGrid(){
      const filter = filterSel.value || "ALL";
      const list = (filter === "ALL") ? allPhotos : allPhotos.filter(p => p.missionType === filter);

      countLine.textContent = String(list.length);

      if(!list.length){
        gridWrap.innerHTML = `<div class="empty">Aucune photo.</div>`;
        return;
      }

      const grid = document.createElement("div");
      grid.className = "grid";
      list.forEach((p, i)=>{
        const div = document.createElement("div");
        div.className = "ph";
        div.innerHTML = `
          <img src="${esc(p.url)}" alt="photo">
          <div class="cap">${esc(missionLabel(p.missionType))} • ${p.idx+1}</div>
        `;
        div.addEventListener("click", ()=>{
          openLightbox(p.url, `${missionLabel(p.missionType)} • photo ${p.idx+1}`);
        });
        grid.appendChild(div);
      });

      gridWrap.innerHTML = "";
      gridWrap.appendChild(grid);
    }

    async function load(){
      hideAlert();
      subLine.textContent = "Chargement…";
      ctx.innerHTML = "—";
      gridWrap.innerHTML = `<div class="empty">—</div>`;
      countLine.textContent = "—";

      if(!prestationId){
        subLine.textContent = "";
        showAlert("prestationId manquant (URL).");
        return;
      }
      if(!currentUser){
        subLine.textContent = "";
        showAlert("Utilisateur non authentifié.");
        return;
      }

      const eSnap = await getDoc(doc(db, "events", prestationId));
      if(!eSnap.exists()){
        subLine.textContent = "";
        showAlert("Prestation introuvable.");
        return;
      }
      eventDoc = eSnap.data() || {};

      if(String(eventDoc.conciergerieUid || "") !== String(currentUser.uid || "")){
        subLine.textContent = "";
        showAlert("Accès refusé (prestation hors conciergerie).");
        return;
      }

      renderContext();

      const TYPES = ["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"];
      photosByMission = new Map();
      allPhotos = [];

      for(const t of TYPES){
        try{
          const mSnap = await getDoc(doc(db, "events", prestationId, "missions", t));
          if(!mSnap.exists()) continue;
          const m = mSnap.data() || {};
          const photos = normalizePhotoList(m.photos);
          if(photos.length){
            photosByMission.set(t, photos);
            photos.forEach((p, idx)=> allPhotos.push({ missionType: t, url: p.url, idx }));
          }
        }catch(err){
          console.warn("Mission read failed:", t, err?.code || err?.message || err);
        }
      }

      renderFilterOptions();
      renderGrid();

      subLine.textContent = `Prestation #${prestationId.slice(0,6)} • ${allPhotos.length} photo(s)`;
      if(!allPhotos.length) showAlert("Aucune photo trouvée.", true);
    }

    filterSel.addEventListener("change", renderGrid);

    refreshBtn.addEventListener("click", ()=>{
      load().catch(err=>{
        console.error(err);
        showAlert("Erreur reload : " + (err?.code || err?.message || "inconnue"));
      });
    });

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      location.href = "index.html";
    });

    onAuthStateChanged(auth, async (u)=>{
      if(!u){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = u;
      load().catch(err=>{
        console.error(err);
        showAlert("Erreur chargement : " + (err?.code || err?.message || "inconnue"));
      });
    });
  </script>
</body>
</html>
