<!-- docs/preuves-admin.html (FINAL — ZIP global sur missions/MENAGE.proofZip + conciergerie view) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Preuves (Admin)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .wrap{ width:100%; max-width:980px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:12px; }

    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:900; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    h1{ margin:0; font-size:18px; font-weight:900; }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; white-space:pre-wrap; }

    .context-box{
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:16px;
      padding:10px;
      display:grid;
      gap:6px;
    }
    .ctx-row{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .ctx-row .k{ font-weight:900; }
    .ctx-row .v{ font-weight:800; color:#333; text-align:right; }

    .zipCard{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.06);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .zipTop{
      display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start;
    }
    .zipName{ font-weight:900; font-size:14px; color:#222; }
    .zipMeta{ font-weight:900; font-size:12px; color:#666; line-height:1.35; }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .btn{
      border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:900; cursor:pointer;
      color:#fff; background:linear-gradient(90deg,var(--violet),var(--violet2));
      box-shadow:0 10px 22px rgba(0,0,0,0.10); white-space:nowrap;
      text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    }
    .btn.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn.red{
      background:#fff; color:var(--bad); border:2px solid #ffb7cc;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .empty{
      background:#fff; border-radius:16px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:12px; color:#666; font-weight:900; font-size:12px;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="planning.html">← Planning</a>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="pill" id="refreshBtn" type="button">Rafraîchir</button>
        <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
      </div>
    </div>

    <div class="wrap">
      <div>
        <h1>Preuves — Admin (ZIP global)</h1>
        <div class="sub" id="subLine">Chargement…</div>
        <div class="alert" id="alertBox"></div>
      </div>

      <section class="card">
        <div class="mini">Prestation</div>
        <div style="margin-top:8px;" class="context-box" id="ctx">—</div>
      </section>

      <section class="card">
        <div class="mini">ZIP preuves (mission MENAGE)</div>
        <div style="margin-top:10px;" id="zipWrap">
          <div class="empty">—</div>
        </div>
        <div class="mini" style="margin-top:10px;">
          Source = <b>events/{prestationId}/missions/MENAGE.proofZip</b>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { auth, db /*, storage*/ } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    // Si tu veux supprimer le fichier storage côté client (optionnel):
    // import { ref as sRef, deleteObject } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const ctx = document.getElementById("ctx");
    const zipWrap = document.getElementById("zipWrap");

    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }

    function fmtDateTimeFromMs(ms){
      const t = Number(ms);
      if(!Number.isFinite(t)) return "—";
      const d = new Date(t);
      const p2 = (n)=> String(n).padStart(2,"0");
      return `${p2(d.getDate())}/${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
    }

    function renderContext(eventDoc){
      const title = `${eventDoc.homeName || "Logement"}${eventDoc.homeCity ? " — " + eventDoc.homeCity : ""}${eventDoc.homeType ? " ("+eventDoc.homeType+")" : ""}`;
      const arrival = (eventDoc.arrivalDateKey || eventDoc.dateKey || "—") + (eventDoc.arrivalTime ? " • " + eventDoc.arrivalTime : (eventDoc.time ? " • " + eventDoc.time : ""));
      const departure = (eventDoc.departureDateKey || "—") + (eventDoc.departureTime ? " • " + eventDoc.departureTime : "");
      const addr = [eventDoc.homeAddress, eventDoc.homeZip].filter(Boolean).join(" ").trim() || "—";
      const owner = [eventDoc.ownerName, eventDoc.ownerPhone].filter(Boolean).join(" • ") || "—";

      ctx.innerHTML = `
        <div class="ctx-row"><div class="k">Logement :</div><div class="v">${esc(title)}</div></div>
        <div class="ctx-row"><div class="k">Arrivée :</div><div class="v">${esc(arrival)}</div></div>
        <div class="ctx-row"><div class="k">Départ :</div><div class="v">${esc(departure)}</div></div>
        <div class="ctx-row"><div class="k">Adresse :</div><div class="v">${esc(addr)}</div></div>
        <div class="ctx-row"><div class="k">Propriétaire :</div><div class="v">${esc(owner)}</div></div>
        <div class="ctx-row"><div class="k">Statut :</div><div class="v">${esc((eventDoc.opStatus || eventDoc.status || "—").toString())}</div></div>
      `;
    }

    function renderZipCard(proofZip){
      zipWrap.innerHTML = "";

      if(!proofZip || !proofZip.url){
        zipWrap.innerHTML = `<div class="empty">Aucun ZIP envoyé.</div>`;
        return;
      }

      const name = proofZip.name || "preuves.zip";
      const whenTxt = proofZip.createdAtMs ? fmtDateTimeFromMs(proofZip.createdAtMs) : "—";
      const sizeTxt = proofZip.sizeBytes ? `${Math.round(Number(proofZip.sizeBytes)/1024)} Ko` : "—";
      const agentLine = [proofZip.agentName, proofZip.agentEmail].filter(Boolean).join(" • ") || "—";

      const div = document.createElement("div");
      div.className = "zipCard";
      div.innerHTML = `
        <div class="zipTop">
          <div>
            <div class="zipName">📦 ${esc(name)}</div>
            <div class="zipMeta">
              Envoyé : ${esc(whenTxt)} • Taille : ${esc(sizeTxt)}<br>
              Agent : ${esc(agentLine)}
            </div>
          </div>
          <div class="actions">
            <a class="btn ghost" id="openBtn" href="${esc(proofZip.url)}" target="_blank" rel="noopener">Ouvrir</a>
            <button class="btn" id="dlBtn" type="button">Télécharger</button>
            <button class="btn red" id="delBtn" type="button">Supprimer</button>
          </div>
        </div>
        <div class="mini">
          Note : supprimer ici enlève la référence Firestore. (Le fichier Storage peut être supprimé aussi si tu actives l’option.)
        </div>
      `;
      zipWrap.appendChild(div);

      div.querySelector("#dlBtn")?.addEventListener("click", ()=>{
        // download simple
        window.open(proofZip.url, "_blank", "noopener");
      });
    }

    const prestationId = qs("prestationId");
    const MISSION = "MENAGE";

    let currentUser = null;
    let eventDoc = null;
    let missionDoc = null;

    async function load(){
      hideAlert();
      subLine.textContent = "Chargement…";
      ctx.innerHTML = "—";
      zipWrap.innerHTML = `<div class="empty">—</div>`;

      if(!prestationId){
        subLine.textContent = "";
        showAlert("prestationId manquant (URL).");
        return;
      }
      if(!currentUser){
        subLine.textContent = "";
        showAlert("Utilisateur non authentifié.");
        return;
      }

      const eRef = doc(db, "events", prestationId);
      const eSnap = await getDoc(eRef);
      if(!eSnap.exists()){
        subLine.textContent = "";
        showAlert("Prestation introuvable.");
        return;
      }
      eventDoc = eSnap.data() || {};

      if(String(eventDoc.conciergerieUid || "") !== String(currentUser.uid || "")){
        subLine.textContent = "";
        showAlert("Accès refusé (prestation hors conciergerie).");
        return;
      }

      renderContext(eventDoc);

      const mRef = doc(db, "events", prestationId, "missions", MISSION);
      const mSnap = await getDoc(mRef);
      if(!mSnap.exists()){
        subLine.textContent = "";
        showAlert(`Mission ${MISSION} introuvable. (Pas de doc missions/${MISSION})`);
        zipWrap.innerHTML = `<div class="empty">Aucun ZIP.</div>`;
        return;
      }
      missionDoc = mSnap.data() || {};

      renderZipCard(missionDoc.proofZip || null);

      // bind delete
      const delBtn = document.getElementById("delBtn");
      if(delBtn){
        delBtn.addEventListener("click", async ()=>{
          hideAlert();
          const ok = confirm("Supprimer le ZIP ? (référence Firestore).");
          if(!ok) return;

          delBtn.disabled = true;
          delBtn.textContent = "Suppression…";

          try{
            // OPTION A: soft delete (recommandé)
            await updateDoc(mRef, { proofZip: null, updatedAt: serverTimestamp() });

            // OPTION B (si tu veux aussi supprimer le fichier storage) :
            // const p = (missionDoc?.proofZip?.path || "").trim();
            // if(p){
            //   await deleteObject(sRef(storage, p));
            // }

            showAlert("✅ ZIP supprimé (Firestore).", true);
            await load();
          }catch(err){
            console.error(err);
            showAlert("Erreur suppression : " + (err?.code || err?.message || "inconnue"));
          }finally{
            delBtn.disabled = false;
            delBtn.textContent = "Supprimer";
          }
        });
      }

      subLine.textContent = `Prestation #${prestationId.slice(0,6)} • Mission ${MISSION}`;
    }

    refreshBtn.addEventListener("click", ()=> load().catch(err=>{
      console.error(err);
      showAlert("Erreur reload : " + (err?.code || err?.message || "inconnue"));
    }));

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      location.href = "index.html";
    });

    onAuthStateChanged(auth, async (u)=>{
      if(!u){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = u;
      load().catch(err=>{
        console.error(err);
        showAlert("Erreur chargement : " + (err?.code || err?.message || "inconnue"));
      });
    });
  </script>
</body>
</html>
