<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Devis (logement)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-light:#F3ECFF;
      --violet-mid:#DCCBFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill-link{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main); color:var(--violet-main);
      text-decoration:none; font-weight:1000; font-size:13px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; cursor:pointer;
    }

    .logo-title{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; margin-bottom:6px; text-align:center; }
    .logo-icon{
      width:40px;height:40px;border-radius:50%;
      background:#fff; border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0; overflow:hidden;
    }
    .logo-icon img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:24px; font-weight:900; color:#111; }
    .subtitle{ font-size:15px; color:#444; margin-top:4px; text-align:center; }
    .badge{
      margin-top:10px; padding:4px 10px; border-radius:999px; background:#fff;
      font-size:12px; color:#555; box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center; font-weight:1000; white-space:pre-wrap;
    }
    .alert{
      width:100%; max-width:1100px; margin-top:12px;
      padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .docBanner{ width:100%; max-width:1100px; margin-top:10px; display:flex; justify-content:center; }
    .docBannerInner{
      background:#fff; border:1px solid var(--border);
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      border-radius:999px;
      padding:8px 14px;
      font-weight:1000; font-size:13px; color:#222;
      display:flex; gap:10px; align-items:center; white-space:nowrap;
    }

    .headCard{
      max-width:1100px; width:100%;
      display:grid; grid-template-columns:1fr; gap:12px; align-items:stretch;
      margin-top:14px;
    }
    @media(min-width:860px){ .headCard{ grid-template-columns: 1fr 1fr; } }
    .headBox{
      background:#fff; border:1px solid rgba(122,92,255,0.18);
      border-radius:18px; box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:12px 12px 10px; display:flex; flex-direction:column; height:100%;
    }
    .headRow{ display:flex; gap:10px; align-items:flex-start; }
    .bizLogo{
      width:44px;height:44px;border-radius:12px; overflow:hidden;
      border:2px solid rgba(122,92,255,0.35); background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:1000; color:var(--violet-main); flex-shrink:0;
    }
    .bizLogo img{ width:100%; height:100%; object-fit:cover; display:none; }
    .headTitle{ font-weight:1000; font-size:12px; color:#555; letter-spacing:.2px; }
    .headMain{ font-weight:1000; font-size:14px; color:#111; margin-top:2px; }
    .headLines{ margin-top:6px; font-size:12.5px; color:#222; font-weight:850; line-height:1.35; }
    .headLines .mut{ color:#666; font-weight:900; }

    .layout{ width:100%; max-width:1100px; margin-top:14px; display:flex; flex-direction:column; gap:14px; }
    .card{
      width:100%;
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius:18px;
      box-shadow: var(--shadow);
      padding:14px 14px 16px;
      backdrop-filter: blur(10px);
    }
    .card-title{
      font-size:16px; font-weight:1000; margin-bottom:8px;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
    }
    .small{ font-size:12px; color:var(--muted); line-height:1.35; font-weight:800; }

    .tableWrap{
      overflow:auto; border-radius:14px; border:1px solid rgba(0,0,0,0.04);
      background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    table{ width:100%; border-collapse:collapse; min-width:760px; }
    th, td{
      padding:10px 10px; border-bottom:1px solid rgba(0,0,0,0.05);
      text-align:left; font-size:12.5px; vertical-align:top;
    }
    th{ font-size:12px; color:#444; font-weight:1000; background:rgba(248,244,255,.7); position:sticky; top:0; }
    td.num, th.num{ text-align:right; white-space:nowrap; }
    td.designation{ white-space:normal; word-break:break-word; }

    .pill-mini{
      display:inline-flex; align-items:center; justify-content:center;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff; font-weight:1000; font-size:12px; color:#333;
      white-space:nowrap;
    }

    input, select, textarea{
      width:100%; padding:10px 12px; border-radius:12px;
      border:1px solid rgba(122,92,255,0.35);
      font-size:14px; outline:none; background:#fff;
    }
    input:focus, select:focus, textarea:focus{
      border-color:var(--violet-main);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }
    label{ display:block; font-size:12px; font-weight:1000; color:#333; margin:10px 0 4px; }

    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .row > div{ flex:1; min-width:220px; }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .btn{
      flex:1; display:inline-flex; align-items:center; justify-content:center;
      border:none; border-radius:999px; padding:10px 12px;
      font-size:13px; font-weight:1000; cursor:pointer;
      background:#fff; color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; line-height:1; text-decoration:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff; box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .totals{
      margin-top:10px; background:#fff; border-radius:14px;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px; display:flex; flex-direction:column; gap:6px; font-weight:1000;
    }
    .totals .r{ display:flex; justify-content:space-between; gap:10px; }
    .mutedLine{ font-size:12px; color:#666; font-weight:900; }

    .lineActions{
      display:flex; gap:8px; justify-content:flex-end;
    }
    .iconBtn{
      border:none; cursor:pointer;
      padding:8px 10px; border-radius:999px;
      background:#fff; border:1px solid rgba(122,92,255,0.35);
      font-weight:1000; color:var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:11px; font-weight:1000; text-decoration:none;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 980px){
      .bottom-nav{
        position: static; max-width: 1100px; margin: 12px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" href="devis-liste.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon" id="logoIcon">
        <img id="logoImg" alt="Logo">
        <span id="logoFallback">✓</span>
      </div>
      <h1 id="appTitle">—</h1>
    </div>

    <div class="subtitle">Devis (logement)</div>
    <div class="badge" id="statusBadge">—</div>

    <div class="docBanner">
      <div class="docBannerInner" id="docBannerInner">DEVIS N° —</div>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="headCard">
      <div class="headBox">
        <div class="headRow">
          <div class="bizLogo">
            <img id="bizLogoImg" alt="Logo société">
            <span id="bizLogoFallback">✓</span>
          </div>
          <div style="flex:1;">
            <div class="headTitle">Société</div>
            <div class="headMain" id="bizName">—</div>
            <div class="headLines" id="bizLines">—</div>
          </div>
        </div>
      </div>

      <div class="headBox">
        <div class="headTitle">Client</div>
        <div class="headMain" id="clientName">—</div>
        <div class="headLines" id="clientLines">—</div>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <div class="card-title">
          <span>Informations</span>
          <span class="small" id="contextLine">—</span>
        </div>

        <div class="row">
          <div>
            <label for="quoteDate">Date du devis</label>
            <input id="quoteDate" placeholder="JJ/MM/AAAA">
          </div>
          <div>
            <label for="validUntil">Valable jusqu’au</label>
            <input id="validUntil" placeholder="JJ/MM/AAAA">
          </div>
        </div>

        <div class="row">
          <div>
            <label for="paymentTerms">Modalités de paiement (optionnel)</label>
            <input id="paymentTerms" placeholder="Ex : 30% à la réservation, solde à l’arrivée…">
          </div>
          <div>
            <label for="internalNote">Note interne (non imprimée)</label>
            <input id="internalNote" placeholder="Ex : négocié, à relancer…">
          </div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Lignes</span>
          <span class="pill-mini">Qté • unité • PU</span>
        </div>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Désignation</th>
                <th class="num">Qté</th>
                <th>Unité</th>
                <th class="num">PU HT</th>
                <th class="num" id="thTVA" style="display:none;">TVA</th>
                <th class="num">Total TTC</th>
                <th class="num">Action</th>
              </tr>
            </thead>
            <tbody id="linesTbody"></tbody>
          </table>
        </div>

        <div class="row" style="margin-top:10px;">
          <div>
            <label for="lineLabel">Désignation</label>
            <input id="lineLabel" placeholder="Ex : Nettoyage, blanchisserie, check-in…">
          </div>
          <div>
            <label for="lineQty">Qté</label>
            <input id="lineQty" type="number" min="0" step="1" value="1">
          </div>
          <div>
            <label for="lineUnit">Unité</label>
            <input id="lineUnit" value="unité">
          </div>
          <div>
            <label for="lineUP">PU HT (€)</label>
            <input id="lineUP" type="number" min="0" step="0.01" placeholder="Ex : 60.00">
          </div>
        </div>

        <div class="actions">
          <button class="btn" type="button" id="addLineBtn">Ajouter une ligne</button>
        </div>

        <div class="totals" id="totalsBox"></div>

        <div class="actions">
          <button class="btn" type="button" id="previewBtn" disabled>Aperçu</button>
          <button class="btn primary" type="button" id="saveBtn" disabled>Enregistrer</button>
        </div>

        <div class="small" style="margin-top:8px;">
          L’aperçu ouvre <b>devis-apercu.html?docId=...</b> (impression/PDF).
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="compta.html">Compta</a>
    <a href="messagerie.html">Messages</a>
  </nav>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    doc, getDoc, setDoc, updateDoc, collection, addDoc,
    serverTimestamp, increment
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const alertBox = document.getElementById("alertBox");
  const statusBadge = document.getElementById("statusBadge");
  const docBannerInner = document.getElementById("docBannerInner");
  const contextLine = document.getElementById("contextLine");

  const appTitle = document.getElementById("appTitle");
  const logoImg = document.getElementById("logoImg");
  const logoFallback = document.getElementById("logoFallback");
  const bizLogoImg = document.getElementById("bizLogoImg");
  const bizLogoFallback = document.getElementById("bizLogoFallback");

  const bizNameEl = document.getElementById("bizName");
  const bizLinesEl = document.getElementById("bizLines");
  const clientNameEl = document.getElementById("clientName");
  const clientLinesEl = document.getElementById("clientLines");

  const quoteDateEl = document.getElementById("quoteDate");
  const validUntilEl = document.getElementById("validUntil");
  const paymentTermsEl = document.getElementById("paymentTerms");
  const internalNoteEl = document.getElementById("internalNote");

  const thTVA = document.getElementById("thTVA");
  const linesTbody = document.getElementById("linesTbody");
  const totalsBox = document.getElementById("totalsBox");

  const lineLabelEl = document.getElementById("lineLabel");
  const lineQtyEl = document.getElementById("lineQty");
  const lineUnitEl = document.getElementById("lineUnit");
  const lineUPEl = document.getElementById("lineUP");

  const addLineBtn = document.getElementById("addLineBtn");
  const previewBtn = document.getElementById("previewBtn");
  const saveBtn = document.getElementById("saveBtn");

  let currentUser = null;

  const params = new URLSearchParams(location.search);
  const eventId = (params.get("eventId") || "").trim();
  let docId = (params.get("docId") || "").trim(); // si on ré-ouvre un devis existant

  let profileData = null;
  let eventData = null;

  let quoteLines = [];
  let computed = { ht:0, tva:0, ttc:0 };
  let tvaEnabled = false;
  let tvaRate = 0;

  function showAlert(msg, ok=false){
    alertBox.style.display = "block";
    alertBox.classList.toggle("ok", !!ok);
    alertBox.textContent = msg;
  }
  function hideAlert(){
    alertBox.style.display = "none";
    alertBox.classList.remove("ok");
    alertBox.textContent = "";
  }

  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmtMoney(v){
    const n = Number(v);
    if(!Number.isFinite(n)) return "—";
    return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
  }

  function fmtDateFR(x){
    if(!x) return "";
    try{
      if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
      const s = String(x).trim();
      if(!s) return "";
      if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m) return `${m[3]}/${m[2]}/${m[1]}`;
      const d = new Date(s);
      if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
      return "";
    }catch{ return ""; }
  }

  function todayFR(){
    const d = new Date();
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yyyy = d.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }

  function plusDaysFR(days){
    const d = new Date();
    d.setDate(d.getDate() + days);
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yyyy = d.getFullYear();
    return `${dd}/${mm}/${yyyy}`;
  }

  function quoteStatusLabel(s){
    const x = String(s||"").toUpperCase().trim();
    if(!x) return "—";
    if(x === "DRAFT") return "BROUILLON";
    if(x === "SENT") return "ENVOYÉ";
    if(x === "ACCEPTED") return "ACCEPTÉ";
    if(x === "REFUSED") return "REFUSÉ";
    if(x === "INVOICED") return "FACTURÉ";
    return x;
  }

  async function loadProfile(uid){
    const snap = await getDoc(doc(db, "users", uid));
    profileData = snap.exists() ? (snap.data() || {}) : {};
  }

  function applyLogoFromProfile(profile){
    const bp = (profile?.businessProfile || {});
    const url = String(bp.logoUrl || "").trim();
    if(url){
      logoImg.src = url; logoImg.style.display = "block"; logoFallback.style.display = "none";
      bizLogoImg.src = url; bizLogoImg.style.display = "block"; bizLogoFallback.style.display = "none";
    }else{
      logoImg.style.display = "none"; logoFallback.style.display = "block";
      bizLogoImg.style.display = "none"; bizLogoFallback.style.display = "block";
    }
  }

  function renderBusinessHeader(){
    const bp = (profileData?.businessProfile || {});
    const cName = String(bp.companyName || "Conciergerie").trim();

    const street = String(bp.address?.street || "").trim();
    const zip = String(bp.address?.zip || "").trim();
    const city = String(bp.address?.city || "").trim();

    const siret = String(bp.registration?.siret || "").trim();
    const ape = String(bp.registration?.ape || "").trim();

    const mail = String(bp.billingEmail || profileData?.email || "").trim();
    const phone = String(bp.phone || "").trim();

    appTitle.textContent = cName || "Conciergerie";
    bizNameEl.textContent = cName || "—";

    const lines = [];
    if(street) lines.push(esc(street));
    if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));

    const legal = [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • ");
    if(legal) lines.push(`<span class="mut">${esc(legal)}</span>`);

    const contact = [mail ? mail : "", phone ? phone : ""].filter(Boolean).join(" • ");
    if(contact) lines.push(`<span class="mut">${esc(contact)}</span>`);

    bizLinesEl.innerHTML = lines.length ? lines.join("<br>") : "—";
    applyLogoFromProfile(profileData);

    tvaEnabled = !!bp.vat?.enabled;
    tvaRate = Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0;
    thTVA.style.display = tvaEnabled ? "" : "none";
  }

  async function loadEvent(){
    if(!eventId) throw new Error("eventId manquant. Exemple : devis-event.html?eventId=XXXX");
    const snap = await getDoc(doc(db,"events", eventId));
    if(!snap.exists()) throw new Error("Event introuvable.");
    eventData = { id: snap.id, ...(snap.data()||{}) };

    if(eventData.conciergerieUid && currentUser?.uid && eventData.conciergerieUid !== currentUser.uid){
      throw new Error("Accès refusé (event d’une autre conciergerie).");
    }
  }

  function renderClientHeaderFromEvent(){
    const d = eventData || {};
    const name = String(d.ownerName || d.clientName || "—").trim();
    const a1 = String(d.ownerAddress1 || d.clientAddress1 || "").trim();
    const a2 = String(d.ownerAddress2 || d.clientAddress2 || "").trim();
    const zip = String(d.ownerZip || d.clientZip || "").trim();
    const city = String(d.ownerCity || d.clientCity || "").trim();

    clientNameEl.textContent = name || "—";
    const lines = [];
    if(a1) lines.push(esc(a1));
    if(a2) lines.push(esc(a2));
    if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));
    clientLinesEl.innerHTML = lines.length ? lines.join("<br>") : `<span class="mut">Adresse manquante</span>`;
  }

  function computeTotals(lines){
    let ht = 0;
    for(const l of (Array.isArray(lines) ? lines : [])){
      const qty = Number(l?.qty)||0;
      const up  = Number(l?.unitPrice)||0;
      ht += qty * up;
    }
    const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
    const ttc = ht + tva;
    return { ht, tva, ttc };
  }

  function renderLines(){
    linesTbody.innerHTML = "";

    for(const [idx,l] of quoteLines.entries()){
      const label = l?.label || "Ligne";
      const qty = Number(l?.qty)||0;
      const unit = l?.unit || "unité";
      const up = Number(l?.unitPrice)||0;

      const lineHT = qty * up;
      const lineTVA = tvaEnabled ? (lineHT * tvaRate) : 0;
      const lineTotal = lineHT + lineTVA;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="designation">${esc(label)}</td>
        <td class="num">${esc(qty)}</td>
        <td>${esc(unit)}</td>
        <td class="num">${esc(fmtMoney(up))}</td>
        <td class="num" style="${tvaEnabled ? "" : "display:none;"}">${tvaEnabled ? esc(fmtMoney(lineTVA)) : ""}</td>
        <td class="num">${esc(fmtMoney(lineTotal))}</td>
        <td class="num">
          <div class="lineActions">
            <button class="iconBtn" type="button" data-del="${idx}">Supprimer</button>
          </div>
        </td>
      `;
      linesTbody.appendChild(tr);
    }

    computed = computeTotals(quoteLines);

    const html = [];
    if(tvaEnabled){
      html.push(`<div class="r"><span>Total HT</span><span>${esc(fmtMoney(computed.ht))}</span></div>`);
      html.push(`<div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>${esc(fmtMoney(computed.tva))}</span></div>`);
      html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(computed.ttc))}</span></div>`);
    }else{
      html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(computed.ttc))}</span></div>`);
      const ex = String(profileData?.businessProfile?.tvaExemptionText || "").trim();
      if(ex) html.push(`<div class="mutedLine">${esc(ex)}</div>`);
    }
    totalsBox.innerHTML = html.join("");

    // actions
    const okLines = quoteLines.length > 0;
    previewBtn.disabled = !docId;
    saveBtn.disabled = !okLines;
  }

  linesTbody.addEventListener("click", (e)=>{
    const btn = e.target?.closest?.("button[data-del]");
    if(!btn) return;
    const idx = Number(btn.getAttribute("data-del"));
    if(!Number.isFinite(idx)) return;
    quoteLines.splice(idx,1);
    renderLines();
  });

  addLineBtn.addEventListener("click", ()=>{
    hideAlert();
    const label = String(lineLabelEl.value || "").trim();
    const qty = Number(lineQtyEl.value);
    const unit = String(lineUnitEl.value || "unité").trim() || "unité";
    const up = Number(lineUPEl.value);

    if(!label) return showAlert("Désignation obligatoire.");
    if(!Number.isFinite(qty) || qty <= 0) return showAlert("Quantité invalide.");
    if(!Number.isFinite(up) || up < 0) return showAlert("Prix unitaire invalide.");

    quoteLines.push({
      label,
      qty,
      unit,
      unitPrice: up,
      note: ""
    });

    lineLabelEl.value = "";
    lineQtyEl.value = "1";
    lineUnitEl.value = unit;
    lineUPEl.value = "";
    renderLines();
  });

  previewBtn.addEventListener("click", ()=>{
    if(!docId) return;
    location.href = `devis-apercu.html?docId=${encodeURIComponent(docId)}`;
  });

  function buildSnapshots(){
    const e = eventData || {};
    const bp = profileData?.businessProfile || {};

    const companyName = String(bp.companyName || "Conciergerie").trim();
    const company = {
      companyName,
      street: String(bp.address?.street || "").trim(),
      zip: String(bp.address?.zip || "").trim(),
      city: String(bp.address?.city || "").trim(),
      siret: String(bp.registration?.siret || "").trim(),
      ape: String(bp.registration?.ape || "").trim(),
      email: String(bp.billingEmail || profileData?.email || "").trim(),
      phone: String(bp.phone || "").trim(),
      logoUrl: String(bp.logoUrl || "").trim(),
      vatEnabled: !!bp.vat?.enabled,
      vatRate: Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0,
      tvaExemptionText: String(bp.tvaExemptionText || "").trim()
    };

    const client = {
      name: String(e.ownerName || e.clientName || "").trim(),
      email: String(e.ownerEmail || e.clientEmail || "").trim(),
      address1: String(e.ownerAddress1 || e.clientAddress1 || "").trim(),
      address2: String(e.ownerAddress2 || e.clientAddress2 || "").trim(),
      zip: String(e.ownerZip || e.clientZip || "").trim(),
      city: String(e.ownerCity || e.clientCity || "").trim(),
      phone: String(e.ownerPhone || e.clientPhone || "").trim()
    };

    const home = {
      homeId: String(e.homeId || "").trim(),
      homeName: String(e.homeName || "").trim(),
      homeAddress: String(e.homeAddress || "").trim(),
      homeZip: String(e.homeZip || "").trim(),
      homeCity: String(e.homeCity || "").trim(),
      arrivalDateKey: String(e.arrivalDateKey || "").trim(),
      departureDateKey: String(e.departureDateKey || "").trim()
    };

    return { company, client, home };
  }

  async function nextQuoteNumber(){
    const seqRef = doc(db, "users", currentUser.uid, "counters", "quotes");
    const snap = await getDoc(seqRef);
    let n = 1;

    if(!snap.exists()){
      await setDoc(seqRef, { next: 2, updatedAt: serverTimestamp() });
      n = 1;
    }else{
      const data = snap.data() || {};
      const next = Number(data.next);
      n = Number.isFinite(next) && next >= 1 ? next : 1;
      await updateDoc(seqRef, { next: increment(1), updatedAt: serverTimestamp() });
    }

    const yyyy = new Date().getFullYear();
    const padded = String(n).padStart(4,"0");
    return `DV-${yyyy}-${padded}`;
  }

  async function saveQuote(){
    hideAlert();

    if(!quoteLines.length) return showAlert("Ajoute au moins une ligne.");

    const quoteDate = String(quoteDateEl.value || "").trim() || todayFR();
    const validUntil = String(validUntilEl.value || "").trim() || plusDaysFR(30);
    const paymentTerms = String(paymentTermsEl.value || "").trim();
    const internalNote = String(internalNoteEl.value || "").trim();

    const { company, client, home } = buildSnapshots();

    const payload = {
      // meta
      type: "QUOTE",
      conciergerieUid: currentUser.uid,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp(),
      listable: true,

      // lien opérationnel
      eventId: eventId,

      // numéros / statuts
      quoteNumber: "",
      quoteStatus: "DRAFT",
      quoteDate: quoteDate,
      validUntil: validUntil,

      // snapshots
      companySnapshot: company,
      clientSnapshot: client,
      homeSnapshot: home,

      // lignes + totaux
      lines: quoteLines,
      totals: {
        ht: computed.ht,
        tva: computed.tva,
        ttc: computed.ttc
      },

      // champs simples (search / affichage)
      clientName: client.name || "",
      clientEmail: client.email || "",
      homeName: home.homeName || "",
      homeCity: home.homeCity || "",

      // notes
      paymentTerms: paymentTerms || "",
      internalNote: internalNote || ""
    };

    // create si pas docId
    if(!docId){
      const quoteNumber = await nextQuoteNumber();
      payload.quoteNumber = quoteNumber;

      const ref = await addDoc(collection(db,"salesDocuments"), payload);
      docId = ref.id;

      // patch createdAt correct en "now"
      await updateDoc(doc(db,"salesDocuments", docId), { quoteNumber, createdAt: serverTimestamp(), updatedAt: serverTimestamp() });

      showAlert("✅ Devis créé.", true);
    }else{
      // update
      const ref = doc(db,"salesDocuments", docId);
      const snap = await getDoc(ref);
      if(!snap.exists()) throw new Error("Devis introuvable.");
      const d = snap.data() || {};
      if(String(d.conciergerieUid||"") !== String(currentUser.uid)) throw new Error("Accès refusé (autre conciergerie).");

      await updateDoc(ref, {
        updatedAt: serverTimestamp(),
        quoteDate, validUntil,
        paymentTerms: paymentTerms || "",
        internalNote: internalNote || "",
        lines: quoteLines,
        totals: { ht: computed.ht, tva: computed.tva, ttc: computed.ttc },
        clientName: client.name || "",
        clientEmail: client.email || "",
        homeName: home.homeName || "",
        homeCity: home.homeCity || "",
        companySnapshot: company,
        clientSnapshot: client,
        homeSnapshot: home
      });

      showAlert("✅ Devis enregistré.", true);
    }

    previewBtn.disabled = !docId;
    await refreshBannerFromDoc();
  }

  async function refreshBannerFromDoc(){
    if(!docId) return;
    const ref = doc(db,"salesDocuments", docId);
    const snap = await getDoc(ref);
    if(!snap.exists()) return;

    const d = snap.data() || {};
    const qNo = String(d.quoteNumber || "—").trim();
    const qSt = String(d.quoteStatus || "DRAFT").trim();
    const qDt = fmtDateFR(d.quoteDate) || "";

    statusBadge.textContent = quoteStatusLabel(qSt);
    docBannerInner.textContent = `DEVIS N° ${qNo}${qDt ? (" • " + qDt) : ""}`;
  }

  saveBtn.addEventListener("click", async ()=>{
    saveBtn.disabled = true;
    try{
      await saveQuote();
    }catch(e){
      console.error(e);
      showAlert("⛔ " + (e?.message || "Erreur sauvegarde devis"));
    }finally{
      saveBtn.disabled = false;
    }
  });

  async function loadExistingQuote(){
    if(!docId) return;

    const ref = doc(db,"salesDocuments", docId);
    const snap = await getDoc(ref);
    if(!snap.exists()) throw new Error("Devis introuvable.");
    const d = snap.data() || {};
    if(String(d.conciergerieUid||"") !== String(currentUser.uid)) throw new Error("Accès refusé (autre conciergerie).");
    if(String(d.type||"").toUpperCase().trim() !== "QUOTE") throw new Error("Ce document n’est pas un devis.");

    quoteLines = Array.isArray(d.lines) ? d.lines : [];
    quoteDateEl.value = fmtDateFR(d.quoteDate) || "";
    validUntilEl.value = fmtDateFR(d.validUntil) || "";
    paymentTermsEl.value = String(d.paymentTerms || "").trim();
    internalNoteEl.value = String(d.internalNote || "").trim();

    await refreshBannerFromDoc();
  }

  function renderContext(){
    const e = eventData || {};
    const home = String(e.homeName || "").trim();
    const city = String(e.homeCity || "").trim();
    const per = (e.arrivalDateKey || e.departureDateKey)
      ? `${fmtDateFR(e.arrivalDateKey)} → ${fmtDateFR(e.departureDateKey)}`
      : (String(e.dateKey || e.date || "").trim() || "—");
    contextLine.textContent = [home, city].filter(Boolean).join(" — ") + (per ? (" • " + per) : "");
  }

  onAuthStateChanged(auth, async (user)=>{
    if(!user){ location.href = "login.html?role=conciergerie"; return; }
    currentUser = user;
    hideAlert();

    try{
      await loadProfile(currentUser.uid);
      renderBusinessHeader();

      await loadEvent();
      renderClientHeaderFromEvent();
      renderContext();

      if(!quoteDateEl.value) quoteDateEl.value = todayFR();
      if(!validUntilEl.value) validUntilEl.value = plusDaysFR(30);

      if(docId){
        await loadExistingQuote();
      }else{
        // docId absent : création → banner minimal
        statusBadge.textContent = quoteStatusLabel("DRAFT");
        docBannerInner.textContent = "DEVIS N° —";
      }

      renderLines();
      saveBtn.disabled = false;
    }catch(e){
      console.error(e);
      showAlert("⛔ " + (e?.message || "Erreur chargement devis"));
      saveBtn.disabled = true;
      previewBtn.disabled = true;
    }
  });
</script>
</body>
</html>
