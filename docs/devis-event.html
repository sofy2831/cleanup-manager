  <style>
    :root{
      --violet-light:#F3ECFF;

    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text-dark); }

    .badge{

    .layout{

    .card{

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, updateDoc, serverTimestamp, runTransaction,
      collection, query, where, getDocs, limit
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // UI
    const alertBox = document.getElementById("alertBox");
    const recapKv = document.getElementById("recapKv");
    const keyConditionsKv = document.getElementById("keyConditionsKv");

    const totalsBox = document.getElementById("totalsBox");

    const payModeVIR = document.getElementById("payModeVIR");
    const payModeESP = document.getElementById("payModeESP");
    const payModeCHQ = document.getElementById("payModeCHQ");

    const penB2BEl = document.getElementById("penB2B");

    // State
    let currentUser = null;
    let eventRef = null;
    let eventData = null;

    let profileData = null; // users/{conciergerieUid}
    let ownerUser = null;   // owners/{docId}

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function fmtDateFR(x){
      if(!x) return "—";
      try{
        if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
        if(x instanceof Date) return isNaN(x.getTime()) ? "—" : x.toLocaleDateString("fr-FR");
        const s = String(x).trim();
        if(!s) return "—";
        if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
        const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if(m) return `${m[3]}/${m[2]}/${m[1]}`;
        const d = new Date(s);
        if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
        return "—";
      }catch{ return "—"; }
    }

    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

    const eventId = getParam("eventId");

    function quoteStatusLabel(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return "—";
      if(x === "DRAFT") return "BROUILLON";
      if(x === "SENT") return "DEVIS ENVOYÉ";
      if(x === "ACCEPTED") return "ACCEPTÉ";
      if(x === "REFUSED") return "REFUSÉ";
      return x;
    }

    function computeTotals(lines, tvaEnabled, tvaRate){
      let ht = 0;
      for(const l of (Array.isArray(lines) ? lines : [])){
        const qty = Number(l?.qty)||0;
        const up  = Number(l?.unitPrice)||0;
        ht += qty * up;
      }
      const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    // Numéro DE (devis event)
    async function ensureQuoteNumber(uid, year){
      const counterId = `${uid}_${year}`;
      const counterRef = doc(db, "counters", counterId);

      const next = await runTransaction(db, async (tx)=>{
        const snap = await tx.get(counterRef);
        if(!snap.exists()){
          tx.set(counterRef, { quoteSeq: 0, invoiceSeq: 0, creditSeq: 0 });
        }
        const c = snap.exists() ? (snap.data() || {}) : { quoteSeq: 0 };
        const n = (Number(c.quoteSeq)||0) + 1;
        tx.set(counterRef, { ...c, quoteSeq: n }, { merge:true });
        return n;
      });

      return `DE${year}-${String(next).padStart(4,"0")}`;
    }

    function applyLogoFromProfile(profile){
      const bp = (profile?.businessProfile || {});
      const url = String(bp.logoUrl || "").trim();

      if(url){
        logoImg.src = url; logoImg.style.display = "block"; logoFallback.style.display = "none";
        bizLogoImg.src = url; bizLogoImg.style.display = "block"; bizLogoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none"; logoFallback.style.display = "block";
        bizLogoImg.style.display = "none"; bizLogoFallback.style.display = "block";
      }
    }

    function renderBusinessHeader(){
  const bp = (profileData?.businessProfile || {});
  const addr = (profileData?.address || bp.address || {});
  const contact = (profileData?.contact || {});

  const cName = String(bp.companyName || profileData?.fullname || "Conciergerie").trim();

  const street = String(addr.street || "").trim();
  const zip = String(addr.zip || "").trim();
  const city = String(addr.city || "").trim();

  const siret = String(bp.registration?.siret || profileData?.siret || "").trim();
  const ape = String(bp.registration?.ape || "").trim();

  const mail = String(contact.email || profileData?.email || "").trim();
  const phone = String(contact.phone || profileData?.phone || "").trim();

  appTitle.textContent = cName || "Conciergerie";
  bizNameEl.textContent = cName || "—";

  const lines = [];
  if(street) lines.push(esc(street));
  if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));

  const legal = [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • ");
  if(legal) lines.push(`<span class="mut">${esc(legal)}</span>`);

  const ctc = [mail ? mail : "", phone ? phone : ""].filter(Boolean).join(" • ");
  if(ctc) lines.push(`<span class="mut">${esc(ctc)}</span>`);

  bizLinesEl.innerHTML = lines.length ? lines.join("<br>") : "—";
  applyLogoFromProfile(profileData);
}


   function getOwnerSnapshot(){
  const d = eventData || {};

  // snapshot event
  const snapName  = (d.ownerName || "").trim();
  const snapEmail = (d.ownerEmail || "").trim();
  const snapPhone = (d.ownerPhone || "").trim();
  const snapA1 = (d.ownerAddress1 || "").trim();
  const snapA2 = (d.ownerAddress2 || "").trim();
  const snapZip = (d.ownerZip || "").trim();
  const snapCity = (d.ownerCity || "").trim();
  const snapCountry = (d.ownerCountry || "FR").trim();

  // owners/{docId}
  const o = ownerUser || {};
  const oName  = (o.fullname || "").trim();
  const oEmail = (o.email || "").trim();
  const oPhone = (o.phone || "").trim();
  const oA1 = (o.address1 || "").trim();
  const oA2 = (o.address2 || "").trim();
  const oZip = (o.zip || "").trim();
  const oCity = (o.city || "").trim();
  const oCountry = (o.country || "FR").trim();

  return {
    name: oName || snapName || "—",
    email: oEmail || snapEmail || "",
    phone: oPhone || snapPhone || "",
    address1: oA1 || snapA1 || "",
    address2: oA2 || snapA2 || "",
    zip: oZip || snapZip || "",
    city: oCity || snapCity || "",
    country: oCountry || snapCountry || "FR"
  };
}


    function renderClientHeader(){
      const c = getOwnerSnapshot();
      clientNameEl.textContent = (c.name || "—").trim();

      const lines = [];
      if(c.address1) lines.push(esc(c.address1));
      if(c.address2) lines.push(esc(c.address2));
      if(c.zip || c.city) lines.push(esc([c.zip, c.city].filter(Boolean).join(" ")));

      clientLinesEl.innerHTML = lines.length ? lines.join("<br>") : `<span class="mut">Adresse manquante</span>`;
    }

    function getSelectedPayMode(){
      const el = document.querySelector('input[name="payMode"]:checked');
      return el ? el.value : "";
    }
    function setPayMode(mode){
      const m = String(mode||"").toUpperCase();
      payModeVIR.checked = (m === "VIREMENT");
      payModeESP.checked = (m === "ESPECES");
      payModeCHQ.checked = (m === "CHEQUE");
    }

    function dueLabel(term){
      if(term === "RECEPTION") return "À réception";
      if(term === "8J") return "8 jours";
      if(term === "15J") return "15 jours";
      if(term === "30J") return "30 jours";
      if(term === "45J") return "45 jours";
      return term || "—";
    }
    function termToDays(term){
      if(term === "RECEPTION") return 0;
      if(term === "8J") return 8;
      if(term === "15J") return 15;
      if(term === "30J") return 30;
      if(term === "45J") return 45;
      return 0;
    }

    function getPenaltyTemplate(mode){
      if(mode === "B2B"){
        return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur + indemnité forfaitaire de recouvrement de 40 € .";
      }
      if(mode === "B2C"){
        return "Pénalités de retard : 3 fois le taux d’intérêt légal en vigueur.";
      }
      return "";
    }
    function getSelectedPenaltyMode(){
      if(penB2BEl.checked) return "B2B";
      if(penB2CEl.checked) return "B2C";
      return "";
    }
    function syncPenaltyText(){
      const mode = getSelectedPenaltyMode() || "B2C";
      penaltyTextEl.value = getPenaltyTemplate(mode);
    }
    penB2BEl.addEventListener("change", syncPenaltyText);
    penB2CEl.addEventListener("change", syncPenaltyText);

    function todayIso(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return `${dd}/${mm}/${yyyy}`;
    }
    function addDaysLabel(ddmmyyyy, days){
      const [dd,mm,yy] = String(ddmmyyyy).split("/").map(x=>parseInt(x,10));
      const d = new Date(yy, (mm||1)-1, dd||1);
      d.setDate(d.getDate() + (Number(days)||0));
      return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
    }

    function getStayPeriodFromEvent(ev){
      const a0 = ev?.arrivalDateKey;
      const b0 = ev?.departureDateKey;
      const fa0 = fmtDateFR(a0);
      const fb0 = fmtDateFR(b0);

      if(fa0 !== "—" && fb0 !== "—") return `${fa0} → ${fb0}`;
      if(fa0 !== "—" && fb0 === "—") return `${fa0} → —`;
      if(fa0 === "—" && fb0 !== "—") return `— → ${fb0}`;
      return "—";
    }

    async function loadProfile(uid){
      const ref = doc(db, "users", uid);
      const snap = await getDoc(ref);
      profileData = snap.exists() ? (snap.data() || {}) : {};
    }

    // FIX: conciergerieUid passé en param (plus de variable fantôme)
    async function lookupOwnerByEmailInOwners(conciergerieUid, emailLower){
      if(!emailLower) return null;

      const qO = query(
        collection(db,"owners"),
        where("conciergerieUid", "==", String(conciergerieUid)),
        where("emailLower", "==", emailLower),
        where("isActive", "==", true),
        limit(1)
      );

      const snap = await getDocs(qO);
      if(snap.empty) return null;

      const doc0 = snap.docs[0];
      const o = doc0.data() || {};
      return {
        docId: doc0.id,
        email: normalizeEmail(o.email || emailLower),
        fullname: (o.fullname || o.displayName || "").trim(),
        address1: (o.address1 || o.address || "").toString().trim(),
        address2: (o.address2 || "").toString().trim(),
        zip: (o.zip || "").toString().trim(),
        city: (o.city || "").toString().trim(),
        phone: (o.phone || "").toString().trim(),
      };
    }

   async function loadOwner(){
  ownerUser = null;

  const d = eventData || {};
  const ownerEmail = normalizeEmail(d.ownerEmail || "");

  // IMPORTANT: owners/{docId} = ownerDocId (pas ownerUid)
  const ownerDocId = String(d.ownerDocId || "").trim();

  // 1) Try by docId
  if(ownerDocId){
    try{
      const snap = await getDoc(doc(db,"owners", ownerDocId));
      if(snap.exists()){
        const o = snap.data() || {};
        if(String(o.conciergerieUid||"") === String(currentUser.uid)){
          ownerUser = {
            docId: snap.id,
            email: normalizeEmail(o.email || ownerEmail),
            fullname: (o.fullname || o.displayName || "").trim(),
            address1: (o.address1 || o.address || "").toString().trim(),
            address2: (o.address2 || "").toString().trim(),
            zip: (o.zip || "").toString().trim(),
            city: (o.city || "").toString().trim(),
            country: (o.country || "FR").toString().trim(),
            phone: (o.phone || "").toString().trim(),
          };
          return;
        }
      }
    }catch(e){
      console.warn("load owner by ownerDocId failed:", e?.message || e);
    }
  }

  // 2) Fallback by emailLower
  if(ownerEmail){
    try{
      ownerUser = await lookupOwnerByEmailInOwners(currentUser.uid, ownerEmail);
    }catch(e){
      console.warn("lookup owner by email failed:", e?.message || e);
      ownerUser = null;
    }
  }
}


    function renderLinesAndTotals(){
      const d = eventData || {};
      const bp = (profileData?.businessProfile || {});

      const tvaEnabled = !!bp.vat?.enabled;
      const tvaRate = Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0;

      thTVA.style.display = tvaEnabled ? "" : "none";
      linesTbody.innerHTML = "";
      linesCards.innerHTML = "";

      const lines = Array.isArray(d.lines) ? d.lines : [];

      for(const l of lines){
        const label = l?.label || "Ligne";
        const qty = Number(l?.qty)||0;
        const unit = l?.unit || "unité";
        const up = Number(l?.unitPrice)||0;

        const lineHT = qty * up;
        const lineTVA = tvaEnabled ? (lineHT * tvaRate) : 0;
        const lineTotal = lineHT + lineTVA;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="designation">${esc(label)}</td>
          <td class="num">${esc(qty)}</td>
          <td>${esc(unit)}</td>
          <td class="num">${esc(fmtMoney(up))}</td>
          <td class="num" style="${tvaEnabled ? "" : "display:none;"}">${tvaEnabled ? esc(fmtMoney(lineTVA)) : ""}</td>
          <td class="num">${esc(fmtMoney(lineTotal))}</td>
        `;
        linesTbody.appendChild(tr);

        const card = document.createElement("div");
        card.className = "lineCard";
        card.innerHTML = `
          <div class="t">${esc(label)}</div>
          <div class="g">
            <div><b>Qté</b> : ${esc(qty)}</div>
            <div><b>Unité</b> : ${esc(unit)}</div>
            <div><b>PU HT</b> : ${esc(fmtMoney(up))}</div>
            <div><b>Total TTC</b> : ${esc(fmtMoney(lineTotal))}</div>
          </div>
        `;
        linesCards.appendChild(card);
      }

      const totals = computeTotals(lines, tvaEnabled, tvaRate);

      const html = [];
      if(tvaEnabled){
        html.push(`<div class="r"><span>Total HT</span><span>${esc(fmtMoney(totals.ht))}</span></div>`);
        html.push(`<div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>${esc(fmtMoney(totals.tva))}</span></div>`);
        html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
      }else{
        html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
        const ex = String(bp?.tvaExemptionText || "").trim();
        if(ex) html.push(`<div class="mutedLine">${esc(ex)}</div>`);
      }
      totalsBox.innerHTML = html.join("");
    }

    function renderConditions(){
      const bp = (profileData?.businessProfile || {});
      const cancelPct = Number.isFinite(Number(bp?.conditions?.cancellationPercent))
        ? Number(bp.conditions.cancellationPercent)
        : 30;

      const offerDays = Math.max(0, parseInt(offerValidityDaysEl.value || "30", 10) || 30);
      const payDays = termToDays(paymentTermEl.value);

      const offerUntil = addDaysLabel(todayIso(), offerDays);
      const dueUntil = addDaysLabel(todayIso(), payDays);

      const c = [];
      c.push(`<div class="line"><b>Validité</b> : jusqu’au ${esc(offerUntil)}</div>`);
      c.push(`<div class="line"><b>Paiement</b> : ${esc(dueUntil)} (${esc(dueLabel(paymentTermEl.value))})</div>`);
      c.push(`<div class="line"><b>Annulation</b> : ${esc(cancelPct)} % du montant en cas d’annulation moins de 48 h avant l’intervention</div>`);
      keyConditionsKv.innerHTML = c.join("");
    }

    function renderRecap(){
      const d = eventData || {};
      statusBadge.textContent = quoteStatusLabel(d.quoteStatus);
      docBannerInner.textContent = `DEVIS N° ${d.quoteNumber || "—"}`;

      if(privateNoteEl.value === "" && d.quotePrivateNote) privateNoteEl.value = d.quotePrivateNote;
      if(d.quotePaymentTerm && paymentTermEl.value !== d.quotePaymentTerm) paymentTermEl.value = d.quotePaymentTerm;

      if(d.quotePaymentMode) setPayMode(d.quotePaymentMode);
      else setPayMode("VIREMENT");

      if(Number.isFinite(Number(d.quoteOfferValidityDays))){
        offerValidityDaysEl.value = String(Math.max(0, parseInt(d.quoteOfferValidityDays, 10) || 30));
      }

      const penMode = String(d.quotePenaltyMode || "").toUpperCase();
      if(penMode === "B2B") penB2BEl.checked = true;
      else penB2CEl.checked = true;

      if(d.quotePenaltyText) penaltyTextEl.value = d.quotePenaltyText;
      else syncPenaltyText();

      // Récap (propre) : Logement + adresse + période
      const homeName = String(d.homeName || "").trim();
      const homeAddr = String(d.homeAddress || "").trim();
      const homeZip  = String(d.homeZip || "").trim();
      const homeCity = String(d.homeCity || "").trim();
      const period = getStayPeriodFromEvent(d);

      const recap = [];
      recap.push(`<div class="line"><b>Logement</b> : ${esc(homeName || "—")}</div>`);
      recap.push(`<div class="line"><b>Adresse</b> : ${esc(homeAddr || "—")}</div>`);
      recap.push(`<div class="line"><b>CP / Ville</b> : ${esc([homeZip, homeCity].filter(Boolean).join(" ") || "—")}</div>`);
      recap.push(`<div class="line"><b>Période</b> : ${esc(period || "—")}</div>`);
      recapKv.innerHTML = recap.join("");

      renderBusinessHeader();
      renderClientHeader();
      renderLinesAndTotals();
      renderConditions();

      saveBtn.disabled = !eventRef;
      previewBtn.disabled = !eventRef;
    }

    async function loadEvent(){
      if(!eventId) throw new Error("eventId manquant dans l’URL. Exemple : devis-event.html?eventId=XXXX");
      eventRef = doc(db, "events", eventId);

      const snap = await getDoc(eventRef);
      if(!snap.exists()) throw new Error("Event introuvable.");
      eventData = { id: snap.id, ...(snap.data()||{}) };

      if(eventData.conciergerieUid && currentUser?.uid && eventData.conciergerieUid !== currentUser.uid){
        throw new Error("Accès refusé (event d’une autre conciergerie).");
      }

      await loadProfile(currentUser.uid);
      await loadOwner();
      renderRecap();
    }

    function lockUI(locked){
      saveBtn.disabled = !!locked || !eventRef;
      previewBtn.disabled = !!locked || !eventRef;
      saveBtn.style.opacity = locked ? "0.75" : "1";
    }

    paymentTermEl.addEventListener("change", renderConditions);
    offerValidityDaysEl.addEventListener("input", renderConditions);

    previewBtn.addEventListener("click", ()=>{
      if(!eventRef) return;
      location.href = `devis-apercu.html?eventId=${encodeURIComponent(eventId)}`;
    });

    saveBtn.addEventListener("click", async ()=>{
      hideAlert();
      if(!eventRef) return showAlert("Event non chargé.");

      lockUI(true);
      try{
        const year = new Date().getFullYear();
        let quoteNumber = eventData?.quoteNumber || null;
        if(!quoteNumber){
          quoteNumber = await ensureQuoteNumber(currentUser.uid, year);
        }

        const payMode = getSelectedPayMode() || "VIREMENT";

        const currentStatus = String(eventData?.quoteStatus || "").toUpperCase().trim();
        const keepStatus = (currentStatus === "SENT" || currentStatus === "ACCEPTED" || currentStatus === "REFUSED")
          ? currentStatus
          : "DRAFT";

        const patch = {
          quoteNumber,
          quoteStatus: keepStatus,
          commercialStatus: "DEVIS",

          quoteOfferValidityDays: Math.max(0, parseInt(offerValidityDaysEl.value || "30", 10) || 30),
          quotePaymentTerm: paymentTermEl.value,
          quotePaymentMode: payMode,
          quotePaymentModes: {
            virement: payMode === "VIREMENT",
            especes: payMode === "ESPECES",
            cheque: payMode === "CHEQUE"
          },

          quotePenaltyMode: getSelectedPenaltyMode() || "B2C",
          quotePenaltyText: (penaltyTextEl.value || "").trim(),
          quotePrivateNote: (privateNoteEl.value || "").trim(),

          quoteUpdatedAt: serverTimestamp(),
          commercialUpdatedAt: serverTimestamp()
        };

        await updateDoc(eventRef, patch);

        const snap2 = await getDoc(eventRef);
        eventData = { id: snap2.id, ...(snap2.data()||{}) };

        showAlert("✅ Devis enregistré.", true);
        await loadOwner();
        renderRecap();
      }catch(err){
        console.error(err);
        showAlert("Erreur sauvegarde : " + (err?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }
      currentUser = user;

      try{
        if(!penB2BEl.checked && !penB2CEl.checked) penB2CEl.checked = true;
        syncPenaltyText();
        setPayMode("VIREMENT");

        await loadEvent();
      }catch(e){
        showAlert("⛔ " + (e.message || "Erreur chargement devis"), false);
      }
    });
  </script>
