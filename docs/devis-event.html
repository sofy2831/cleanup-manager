<!-- docs/devis-event.html (FINAL — DE = devis lié à un event, source = salesDocuments type:"QUOTE") -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Devis logement (DE)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-light:#F3ECFF;
      --violet-mid:#DCCBFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text-dark:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text-dark); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill-link{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main); color:var(--violet-main);
      text-decoration:none; font-weight:1000; font-size:13px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; cursor:pointer;
    }
    .pill-link.ghost{ border-color: rgba(122,92,255,0.28); color:#333; }

    .logo-title{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; margin-bottom:6px; text-align:center; }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff; border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main); font-size:22px;font-weight:1000;
      position:relative; flex-shrink:0; overflow:hidden;
    }
    .logo-icon img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:24px; font-weight:1000; color:#111; }
    .subtitle{ font-size:15px; color:#444; margin-top:4px; text-align:center; }
    .badge{
      margin-top:10px; padding:4px 10px; border-radius:999px; background:#fff;
      font-size:12px; color:#555; box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center; font-weight:1000; white-space:pre-wrap;
    }

    .docBanner{ width:100%; max-width:1100px; margin-top:10px; display:flex; justify-content:center; }
    .docBannerInner{
      background:#fff; border:1px solid var(--border); box-shadow:0 10px 22px rgba(0,0,0,.08);
      border-radius:999px; padding:8px 14px; font-weight:1000; font-size:13px; color:#222;
      display:flex; gap:10px; align-items:center; white-space:nowrap;
    }

    .alert{
      width:100%; max-width:1100px; margin-top:12px;
      padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .headCard{ max-width:1100px; width:100%; display:grid; grid-template-columns:1fr; gap:12px; margin-top:14px; }
    @media(min-width:860px){ .headCard{ grid-template-columns: 1fr 1fr; } }
    .headBox{
      background:#fff; border:1px solid rgba(122,92,255,0.18);
      border-radius:18px; box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:12px 12px 10px; display:flex; flex-direction:column; height:100%;
    }
    .headRow{ display:flex; gap:10px; align-items:flex-start; }
    .bizLogo{
      width:44px;height:44px;border-radius:12px; overflow:hidden;
      border:2px solid rgba(122,92,255,0.35); background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:1000; color:var(--violet-main);
      flex-shrink:0;
    }
    .bizLogo img{ width:100%; height:100%; object-fit:cover; display:none; }
    .headTitle{ font-weight:1000; font-size:12px; color:#555; letter-spacing:.2px; }
    .headMain{ font-weight:1000; font-size:14px; color:#111; margin-top:2px; }
    .headLines{ margin-top:6px; font-size:12.5px; color:#222; font-weight:900; line-height:1.35; }
    .headLines .mut{ color:#666; font-weight:1000; }

    .layout{ width:100%; max-width:1100px; margin-top:14px; display:flex; flex-direction:column; gap:14px; }
    .card{
      width:100%; background: rgba(255,255,255,0.86);
      border: 1px solid var(--border); border-radius:18px;
      box-shadow: var(--shadow); padding:14px 14px 16px; backdrop-filter: blur(10px);
    }
    .card-title{
      font-size:16px; font-weight:1000; margin-bottom:8px;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
    }
    .small{ font-size:12px; color:var(--muted); line-height:1.35; font-weight:900; }

    .grid2{ display:grid; grid-template-columns:1fr; gap:12px; }
    @media(min-width:860px){ .grid2{ grid-template-columns: 1fr 1fr; } }

    label{ display:block; font-size:12px; font-weight:1000; color:#333; margin:10px 0 4px; }
    input, textarea, select{
      width:100%; padding:10px 12px; border-radius:12px; border:1px solid #D3C7FF;
      font-size:14px; outline:none; background:#fff;
    }
    input:focus, textarea:focus, select:focus{ border-color:var(--violet-main); box-shadow:0 0 0 2px rgba(122,92,255,.15); }
    textarea{ resize:vertical; min-height:80px; }

    .tableWrap{ overflow:auto; border-radius:14px; border:1px solid rgba(0,0,0,0.04); background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.06); }
    table{ width:100%; border-collapse:collapse; min-width:720px; }
    th, td{ padding:10px 10px; border-bottom:1px solid rgba(0,0,0,0.05); text-align:left; font-size:12.5px; vertical-align:top; }
    th{ font-size:12px; color:#444; font-weight:1000; background:rgba(248,244,255,.7); position:sticky; top:0; }
    td.num, th.num{ text-align:right; white-space:nowrap; }
    td.designation{ white-space:normal; word-break:break-word; }

    .miniBtn{
      display:inline-flex; align-items:center; justify-content:center;
      border:none; border-radius:999px; padding:8px 10px; font-size:12px; font-weight:1000;
      cursor:pointer; background:#fff; color:var(--violet-main); border:1px solid rgba(122,92,255,0.35);
    }
    .miniBtn.danger{ color:var(--bad); border-color: rgba(179,38,30,0.25); }
    .miniBtn:disabled{ opacity:.6; cursor:not-allowed; }

    .totals{
      margin-top:10px; background:#fff; border-radius:14px; border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px; display:flex; flex-direction:column; gap:6px; font-weight:1000;
    }
    .totals .r{ display:flex; justify-content:space-between; gap:10px; }
    .mutedLine{ font-size:12px; color:#666; font-weight:1000; }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .btn{
      flex:1;
      display:inline-flex; align-items:center; justify-content:center;
      border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:1000;
      cursor:pointer; background:#fff; color:var(--violet-main); border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap; line-height:1; text-decoration:none;
    }
    .btn.primary{ background:linear-gradient(90deg,var(--violet-main),var(--violet-dark)); border-color:transparent; color:#fff; box-shadow:0 10px 22px rgba(0,0,0,.12); }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:11px; font-weight:1000; text-decoration:none;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 980px){
      .bottom-nav{ position: static; max-width: 1100px; margin: 12px auto 0; border-top: none; border: 1px solid rgba(122,92,255,0.18); border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" href="devis-liste.html">← Retour</a>
      <a class="pill-link ghost" id="openPreviewTop" href="#" style="display:none;">Aperçu</a>
    </div>

    <div class="logo-title">
      <div class="logo-icon" id="logoIcon">
        <img id="logoImg" alt="Logo">
        <span id="logoFallback">✓</span>
      </div>
      <h1 id="appTitle">—</h1>
    </div>

    <div class="subtitle">Devis logement (DE)</div>
    <div class="badge" id="statusBadge">—</div>

    <div class="docBanner">
      <div class="docBannerInner" id="docBannerInner">DEVIS N° —</div>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="headCard">
      <div class="headBox">
        <div class="headRow">
          <div class="bizLogo">
            <img id="bizLogoImg" alt="Logo société">
            <span id="bizLogoFallback">✓</span>
          </div>
          <div style="flex:1;">
            <div class="headTitle">Société</div>
            <div class="headMain" id="bizName">—</div>
            <div class="headLines" id="bizLines">—</div>
          </div>
        </div>
      </div>

      <div class="headBox">
        <div class="headTitle">Client</div>
        <div class="headMain" id="clientName">—</div>
        <div class="headLines" id="clientLines">—</div>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <div class="card-title">
          <span>Contexte logement</span>
          <span class="small" id="contextSmall">—</span>
        </div>

        <div class="grid2">
          <div>
            <label>Logement</label>
            <input id="homeLine" disabled />
          </div>
          <div>
            <label>Période</label>
            <input id="periodLine" disabled />
          </div>
        </div>

        <label>Note client (optionnel)</label>
        <textarea id="clientNote" placeholder="Ex : options, conditions, détails d’accès…"></textarea>

        <div class="actions">
          <button class="btn" type="button" id="saveBtn">Enregistrer</button>
          <a class="btn primary" id="previewBtn" href="#" style="display:none;">Aperçu / PDF</a>
        </div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Lignes</span>
          <span class="small">éditables</span>
        </div>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Désignation</th>
                <th class="num">Qté</th>
                <th>Unité</th>
                <th class="num">PU HT</th>
                <th class="num" id="thTVA" style="display:none;">TVA</th>
                <th class="num">Total TTC</th>
                <th style="width:110px;"></th>
              </tr>
            </thead>
            <tbody id="linesTbody"></tbody>
          </table>
        </div>

        <div class="actions" style="margin-top:10px;">
          <button class="btn" type="button" id="addLineBtn">+ Ajouter une ligne</button>
        </div>

        <div class="totals" id="totalsBox"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="compta.html">Compta</a>
    <a href="messagerie.html">Messages</a>
  </nav>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    doc, getDoc, setDoc, updateDoc,
    collection, query, where, orderBy, limit, getDocs,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const alertBox = document.getElementById("alertBox");
  const statusBadge = document.getElementById("statusBadge");
  const docBannerInner = document.getElementById("docBannerInner");

  const appTitle = document.getElementById("appTitle");
  const logoImg = document.getElementById("logoImg");
  const logoFallback = document.getElementById("logoFallback");
  const bizLogoImg = document.getElementById("bizLogoImg");
  const bizLogoFallback = document.getElementById("bizLogoFallback");

  const bizNameEl = document.getElementById("bizName");
  const bizLinesEl = document.getElementById("bizLines");
  const clientNameEl = document.getElementById("clientName");
  const clientLinesEl = document.getElementById("clientLines");

  const contextSmall = document.getElementById("contextSmall");
  const homeLine = document.getElementById("homeLine");
  const periodLine = document.getElementById("periodLine");
  const clientNote = document.getElementById("clientNote");

  const thTVA = document.getElementById("thTVA");
  const linesTbody = document.getElementById("linesTbody");
  const totalsBox = document.getElementById("totalsBox");

  const addLineBtn = document.getElementById("addLineBtn");
  const saveBtn = document.getElementById("saveBtn");
  const previewBtn = document.getElementById("previewBtn");
  const openPreviewTop = document.getElementById("openPreviewTop");

  const params = new URLSearchParams(location.search);
  const eventId = (params.get("eventId") || "").trim();
  let docId = (params.get("docId") || "").trim(); // salesDocuments docId optionnel

  let currentUser = null;

  let profileData = null;
  let eventData = null;
  let quoteDoc = null; // salesDocuments QUOTE
  let draftLines = [];

  function showAlert(msg, ok=false){
    alertBox.style.display = "block";
    alertBox.classList.toggle("ok", !!ok);
    alertBox.textContent = msg;
  }
  function hideAlert(){
    alertBox.style.display = "none";
    alertBox.classList.remove("ok");
    alertBox.textContent = "";
  }
  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmtMoney(v){
    const n = Number(v);
    if(!Number.isFinite(n)) return "—";
    return n.toLocaleString("fr-FR",{ minimumFractionDigits:2, maximumFractionDigits:2 }) + " €";
  }
  function fmtDateFR(x){
    if(!x) return "—";
    try{
      if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
      const s = String(x).trim();
      if(!s) return "—";
      if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m) return `${m[3]}/${m[2]}/${m[1]}`;
      const d = new Date(s);
      if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
      return "—";
    }catch{ return "—"; }
  }

  function quoteStatusLabel(s){
    const x = String(s||"").toUpperCase().trim();
    if(!x) return "BROUILLON";
    if(x === "DRAFT") return "BROUILLON";
    if(x === "SENT") return "ENVOYÉ";
    if(x === "ACCEPTED") return "ACCEPTÉ";
    if(x === "REFUSED") return "REFUSÉ";
    if(x === "INVOICED") return "FACTURÉ";
    return x;
  }

  async function loadProfile(uid){
    const snap = await getDoc(doc(db,"users",uid));
    profileData = snap.exists() ? (snap.data() || {}) : {};
  }

  function applyLogoFromProfile(profile){
    const bp = (profile?.businessProfile || {});
    const url = String(bp.logoUrl || "").trim();
    if(url){
      logoImg.src = url; logoImg.style.display = "block"; logoFallback.style.display = "none";
      bizLogoImg.src = url; bizLogoImg.style.display = "block"; bizLogoFallback.style.display = "none";
    }else{
      logoImg.style.display = "none"; logoFallback.style.display = "block";
      bizLogoImg.style.display = "none"; bizLogoFallback.style.display = "block";
    }
  }

  function renderBusinessHeader(){
    const bp = (profileData?.businessProfile || {});
    const cName = String(bp.companyName || "Conciergerie").trim() || "Conciergerie";

    const street = String(bp.address?.street || "").trim();
    const zip = String(bp.address?.zip || "").trim();
    const city = String(bp.address?.city || "").trim();

    const siret = String(bp.registration?.siret || "").trim();
    const ape = String(bp.registration?.ape || "").trim();

    const mail = String(bp.billingEmail || profileData?.email || "").trim();
    const phone = String(bp.phone || "").trim();

    appTitle.textContent = cName;
    bizNameEl.textContent = cName;

    const lines = [];
    if(street) lines.push(esc(street));
    if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));

    const legal = [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • ");
    if(legal) lines.push(`<span class="mut">${esc(legal)}</span>`);

    const contact = [mail ? mail : "", phone ? phone : ""].filter(Boolean).join(" • ");
    if(contact) lines.push(`<span class="mut">${esc(contact)}</span>`);

    bizLinesEl.innerHTML = lines.length ? lines.join("<br>") : "—";
    applyLogoFromProfile(profileData);
  }

  function renderClientHeaderFromEvent(){
    const e = eventData || {};
    const name = String(e.ownerName || "—").trim() || "—";
    clientNameEl.textContent = name;

    const lines = [];
    // priorité au snapshot si présent
    const a1 = String(e.ownerAddress1 || "").trim();
    const a2 = String(e.ownerAddress2 || "").trim();
    const zip = String(e.ownerZip || "").trim();
    const city = String(e.ownerCity || "").trim();

    if(a1) lines.push(esc(a1));
    if(a2) lines.push(esc(a2));
    if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));

    const email = String(e.ownerEmail || "").trim();
    const phone = String(e.ownerPhone || "").trim();
    const contact = [email, phone].filter(Boolean).join(" • ");
    if(contact) lines.push(`<span class="mut">${esc(contact)}</span>`);

    clientLinesEl.innerHTML = lines.length ? lines.join("<br>") : `<span class="mut">Adresse manquante</span>`;
  }

  function computeTotals(lines, tvaEnabled, tvaRate){
    let ht = 0;
    for(const l of (Array.isArray(lines) ? lines : [])){
      const qty = Number(l?.qty)||0;
      const up  = Number(l?.unitPrice)||0;
      ht += qty * up;
    }
    const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
    const ttc = ht + tva;
    return { ht, tva, ttc };
  }

  function renderLines(){
    const bp = (profileData?.businessProfile || {});
    const tvaEnabled = !!bp.vat?.enabled;
    const tvaRate = Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0;

    thTVA.style.display = tvaEnabled ? "" : "none";
    linesTbody.innerHTML = "";

    for(let i=0;i<draftLines.length;i++){
      const l = draftLines[i] || {};
      const label = String(l.label || "").trim();
      const qty = Number(l.qty||0);
      const unit = String(l.unit || "unité").trim() || "unité";
      const up = Number(l.unitPrice||0);

      const lineHT = qty * up;
      const lineTVA = tvaEnabled ? (lineHT * tvaRate) : 0;
      const lineTTC = lineHT + lineTVA;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="designation">
          <input data-i="${i}" data-k="label" value="${esc(label)}" placeholder="Désignation…" />
          <div style="margin-top:6px;">
            <textarea data-i="${i}" data-k="note" rows="2" placeholder="Note (optionnel)">${esc(l.note||"")}</textarea>
          </div>
        </td>
        <td class="num"><input data-i="${i}" data-k="qty" type="number" step="0.01" value="${esc(qty)}" /></td>
        <td><input data-i="${i}" data-k="unit" value="${esc(unit)}" /></td>
        <td class="num"><input data-i="${i}" data-k="unitPrice" type="number" step="0.01" value="${esc(up)}" /></td>
        <td class="num" style="${tvaEnabled ? "" : "display:none;"}">${tvaEnabled ? esc(fmtMoney(lineTVA)) : ""}</td>
        <td class="num">${esc(fmtMoney(lineTTC))}</td>
        <td style="text-align:right;">
          <button class="miniBtn danger" type="button" data-del="${i}">Supprimer</button>
        </td>
      `;
      linesTbody.appendChild(tr);
    }

    const totals = computeTotals(draftLines, tvaEnabled, tvaRate);
    const html = [];
    if(tvaEnabled){
      html.push(`<div class="r"><span>Total HT</span><span>${esc(fmtMoney(totals.ht))}</span></div>`);
      html.push(`<div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>${esc(fmtMoney(totals.tva))}</span></div>`);
      html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
    }else{
      html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
      const ex = String(bp?.tvaExemptionText || "").trim();
      if(ex) html.push(`<div class="mutedLine">${esc(ex)}</div>`);
    }
    totalsBox.innerHTML = html.join("");
  }

  function bindLineInputs(){
    linesTbody.addEventListener("input", (e)=>{
      const el = e.target;
      const i = Number(el?.dataset?.i);
      const k = String(el?.dataset?.k||"");
      if(!Number.isFinite(i) || i<0 || i>=draftLines.length) return;
      if(!k) return;

      if(k === "qty" || k === "unitPrice"){
        const v = Number(el.value);
        draftLines[i][k] = Number.isFinite(v) ? v : 0;
      }else{
        draftLines[i][k] = el.value;
      }
      renderLines();
    });

    linesTbody.addEventListener("click", (e)=>{
      const btn = e.target?.closest?.("button[data-del]");
      if(!btn) return;
      const i = Number(btn.dataset.del);
      if(!Number.isFinite(i)) return;
      draftLines.splice(i,1);
      renderLines();
    });
  }

  function genQuoteNumber(){
    // DE-YYYYMMDD-HHMM (simple et unique sans compteur)
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,"0");
    const da = String(d.getDate()).padStart(2,"0");
    const hh = String(d.getHours()).padStart(2,"0");
    const mm = String(d.getMinutes()).padStart(2,"0");
    return `DE-${y}${m}${da}-${hh}${mm}`;
  }

  function lockUI(locked){
    saveBtn.disabled = !!locked;
    addLineBtn.disabled = !!locked;
    saveBtn.style.opacity = locked ? "0.75" : "1";
  }

  async function loadEventStrict(){
    if(!eventId) throw new Error("eventId manquant. Exemple : devis-event.html?eventId=XXXX");
    const snap = await getDoc(doc(db,"events",eventId));
    if(!snap.exists()) throw new Error("Event introuvable.");
    const d = snap.data() || {};
    if(d.conciergerieUid && currentUser?.uid && d.conciergerieUid !== currentUser.uid){
      throw new Error("Accès refusé (event d’une autre conciergerie).");
    }
    eventData = { id:snap.id, ...d };
  }

  async function findQuoteDocIdByEventId(){
    const qQ = query(
      collection(db,"salesDocuments"),
      where("conciergerieUid","==",currentUser.uid),
      where("type","==","QUOTE"),
      where("eventId","==",eventId),
      orderBy("createdAt","desc"),
      limit(1)
    );
    const snap = await getDocs(qQ);
    if(snap.empty) return "";
    return snap.docs[0].id;
  }

  async function loadQuoteDoc(){
    if(!docId){
      docId = await findQuoteDocIdByEventId();
    }
    if(!docId){
      quoteDoc = null;
      return;
    }
    const snap = await getDoc(doc(db,"salesDocuments",docId));
    if(!snap.exists()){
      quoteDoc = null;
      return;
    }
    const d = snap.data() || {};
    if(d.conciergerieUid && currentUser?.uid && d.conciergerieUid !== currentUser.uid){
      throw new Error("Accès refusé (devis d’une autre conciergerie).");
    }
    quoteDoc = { id:snap.id, ...d };
  }

  function renderContext(){
    const e = eventData || {};
    const hn = String(e.homeName || "—").trim() || "—";
    const city = String(e.homeCity || "").trim();
    const a = e.arrivalDateKey || e.arrivalDate || "";
    const b = e.departureDateKey || e.departureDate || "";
    const period = (a || b) ? `${fmtDateFR(a)} → ${fmtDateFR(b)}` : "—";

    homeLine.value = city ? `${hn} — ${city}` : hn;
    periodLine.value = period;

    const idShort = (eventId || "").slice(0,8);
    contextSmall.textContent = `eventId: ${idShort}${eventId.length>8?"…":""}`;
  }

  function setPreviewLinks(){
    if(!docId){
      previewBtn.style.display = "none";
      openPreviewTop.style.display = "none";
      return;
    }
    const href = `devis-apercu.html?docId=${encodeURIComponent(docId)}`;
    previewBtn.href = href;
    openPreviewTop.href = href;
    previewBtn.style.display = "inline-flex";
    openPreviewTop.style.display = "inline-flex";
  }

  function renderTopBanner(){
    const qNo = String(quoteDoc?.quoteNumber || "").trim() || "—";
    const qSt = String(quoteDoc?.quoteStatus || "DRAFT").trim() || "DRAFT";
    const created = quoteDoc?.createdAt ? fmtDateFR(quoteDoc.createdAt) : "—";
    statusBadge.textContent = quoteStatusLabel(qSt);
    docBannerInner.textContent = `DEVIS N° ${qNo} • ${created}`;
  }

  function hydrateFromQuoteOrEvent(){
    // lignes : priorité devis; sinon event.lines
    const qLines = Array.isArray(quoteDoc?.lines) ? quoteDoc.lines : null;
    const eLines = Array.isArray(eventData?.lines) ? eventData.lines : [];
    draftLines = (qLines && qLines.length) ? structuredClone(qLines) : structuredClone(eLines);

    if(!draftLines.length){
      draftLines = [{ label:"Prestation", qty:1, unit:"unité", unitPrice:0, note:"" }];
    }

    // note client : priorité devis
    clientNote.value = String(quoteDoc?.clientNote || "").trim();

    renderLines();
  }

  async function ensureQuoteDocExistsIfMissing(){
    if(quoteDoc) return;

    // création docId stable si absent : DE_eventId
    if(!docId) docId = `DE_${eventId}`;

    const ref = doc(db,"salesDocuments",docId);
    const exists = await getDoc(ref);
    if(exists.exists()){
      const d = exists.data() || {};
      quoteDoc = { id:exists.id, ...d };
      return;
    }

    const now = serverTimestamp();
    const qNo = genQuoteNumber();

    const e = eventData || {};
    const payload = {
      conciergerieUid: currentUser.uid,
      type: "QUOTE",
      listable: true,

      // DE
      eventId: eventId,

      // numéro / statut
      quoteNumber: qNo,
      quoteStatus: "DRAFT",

      // client snapshot minimal
      clientName: e.ownerName || "—",
      clientEmail: e.ownerEmail || "",

      // logement + période snapshot
      homeName: e.homeName || "",
      homeCity: e.homeCity || "",
      homeSnapshot: {
        homeName: e.homeName || "",
        homeCity: e.homeCity || "",
        arrivalDateKey: e.arrivalDateKey || e.arrivalDate || "",
        departureDateKey: e.departureDateKey || e.departureDate || ""
      },

      // lignes : depuis event
      lines: Array.isArray(e.lines) ? structuredClone(e.lines) : [],
      clientNote: "",

      createdAt: now,
      updatedAt: now
    };

    await setDoc(ref, payload, { merge:true });
    const snap = await getDoc(ref);
    quoteDoc = { id:snap.id, ...(snap.data()||{}) };
  }

  async function saveQuote(){
    hideAlert();
    lockUI(true);
    try{
      await ensureQuoteDocExistsIfMissing();
      const ref = doc(db,"salesDocuments",quoteDoc.id);

      // sanitize lignes
      const cleaned = (Array.isArray(draftLines) ? draftLines : []).map(l=>({
        label: String(l.label||"").trim() || "Ligne",
        qty: Number.isFinite(Number(l.qty)) ? Number(l.qty) : 0,
        unit: String(l.unit||"unité").trim() || "unité",
        unitPrice: Number.isFinite(Number(l.unitPrice)) ? Number(l.unitPrice) : 0,
        note: String(l.note||"").trim()
      }));

      const e = eventData || {};
      await updateDoc(ref, {
        clientNote: String(clientNote.value||"").trim(),
        lines: cleaned,

        // on resynchronise quelques snapshots DE (utile si logement/période changent)
        clientName: e.ownerName || "—",
        clientEmail: e.ownerEmail || "",
        homeName: e.homeName || "",
        homeCity: e.homeCity || "",
        homeSnapshot: {
          homeName: e.homeName || "",
          homeCity: e.homeCity || "",
          arrivalDateKey: e.arrivalDateKey || e.arrivalDate || "",
          departureDateKey: e.departureDateKey || e.departureDate || ""
        },

        updatedAt: serverTimestamp()
      });

      const snap = await getDoc(ref);
      quoteDoc = { id:snap.id, ...(snap.data()||{}) };

      renderTopBanner();
      setPreviewLinks();
      showAlert("✅ Devis enregistré.", true);
    }catch(err){
      console.error(err);
      showAlert("⛔ " + (err?.message || "Erreur sauvegarde devis"));
    }finally{
      lockUI(false);
    }
  }

  addLineBtn.addEventListener("click", ()=>{
    draftLines.push({ label:"Prestation", qty:1, unit:"unité", unitPrice:0, note:"" });
    renderLines();
  });

  saveBtn.addEventListener("click", saveQuote);

  bindLineInputs();

  onAuthStateChanged(auth, async (user)=>{
    if(!user){ location.href = "login.html?role=conciergerie"; return; }
    currentUser = user;

    hideAlert();
    try{
      await loadProfile(user.uid);
      renderBusinessHeader();

      await loadEventStrict();
      renderContext();
      renderClientHeaderFromEvent();

      await loadQuoteDoc();
      await ensureQuoteDocExistsIfMissing();

      renderTopBanner();
      setPreviewLinks();
      hydrateFromQuoteOrEvent();
    }catch(e){
      console.error(e);
      showAlert("⛔ " + (e?.message || "Erreur chargement devis logement"));
    }
  });
</script>

</body>
</html>
