<!-- docs/devisfree-apercu.html (CLIENT/PROSPECT VIEW: Firestore salesDocuments only + businessSnapshot) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --cardbg: rgba(255,255,255,0.88);
      --bad:#b3261e;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }
    .page{ max-width:980px; margin:0 auto; padding:18px 14px 22px; }

    .top{
      display:flex; justify-content:space-between; gap:10px; align-items:center; flex-wrap:wrap;
      margin-bottom:12px;
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none; font-weight:1000; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .print{
      border:none; cursor:pointer;
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff; font-weight:1000;
      padding:10px 14px; border-radius:999px;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
      font-size:13px;
    }

    /* ✅ Devis centré au-dessus */
    .hero{
      background:var(--cardbg);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px 12px;
      backdrop-filter:blur(10px);
    }
    .heroTop{
      display:flex; flex-direction:column; align-items:center; text-align:center;
      gap:6px;
    }
    .heroLogo{
      width:54px; height:54px; border-radius:16px; overflow:hidden;
      border:2px solid rgba(122,92,255,0.35); background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:1000; color:var(--violet);
      flex-shrink:0;
    }
    .heroLogo img{ width:100%; height:100%; object-fit:cover; display:none; }

    .docTitle{
      font-weight:1100; font-size:14px; color:#222;
      padding:8px 14px; border-radius:999px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      display:inline-flex; align-items:center; gap:10px;
      white-space:nowrap;
    }
    .subline{
      margin-top:2px; color:#444; font-weight:850; font-size:12.5px;
    }

    /* ✅ Société + Client côte à côte */
    .grid2{
      margin-top:12px;
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }
    @media(min-width:860px){
      .grid2{ grid-template-columns: 1fr 1fr; }
    }

    .card{
      background:var(--cardbg);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter:blur(10px);
    }
    .ct{ font-weight:1100; font-size:14px; margin-bottom:8px; }
    .kv{ font-size:12.8px; font-weight:850; line-height:1.55; color:#222; }
    .kv b{ font-weight:1100; }
    .mut{ color:var(--muted); font-weight:900; font-size:12px; line-height:1.35; }

    /* Lignes */
    .lines{ display:flex; flex-direction:column; gap:8px; }
    .li{
      background:#fff; border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px;
      display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
    }
    .li .t{ font-weight:1100; font-size:13px; }
    .li .s{ margin-top:2px; color:var(--muted); font-weight:850; font-size:12px; line-height:1.35; }

    .totals{
      margin-top:10px;
      background:#fff; border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      border:1px solid var(--border);
      padding:10px 12px;
      display:flex; flex-direction:column; gap:6px;
      font-weight:1100;
    }
    .r{ display:flex; justify-content:space-between; gap:10px; align-items:center; }

    .sep{ height:1px; background:rgba(122,92,255,0.18); margin:10px 0; }

    .alert{
      margin-top:12px; padding:10px 12px;
      background:#fff; border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:950; color:#333;
      white-space:pre-wrap;
      display:none;
    }

    /* ✅ Footer identité société */
    .footerBiz{
      margin-top:12px;
      background:rgba(255,255,255,0.92);
      border:1px solid var(--border);
      border-radius:999px;
      box-shadow:0 6px 18px rgba(0,0,0,.08);
      padding:10px 14px;
      text-align:center;
      font-size:12px;
      font-weight:900;
      color:#333;
    }
    .footerBiz .dim{ color:#666; font-weight:850; }
    .footerBiz .dot{ opacity:.55; padding:0 6px; }

    @media print{
      .top{ display:none !important; }
      body{ background:#fff !important; }
      .page{ padding:0 !important; }
      .hero, .card, .footerBiz{ box-shadow:none !important; backdrop-filter:none !important; }
      .footerBiz{ border-radius:12px !important; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="top">
      <a class="pill" href="devis-liste.html">← Retour</a>
      <button class="print" type="button" id="printBtn">Imprimer / PDF</button>
    </div>

    <div class="hero">
      <div class="heroTop">
        <div class="heroLogo" aria-label="Logo société">
          <img id="logoImg" alt="Logo société">
          <span id="logoFallback">✓</span>
        </div>

        <div class="docTitle" id="docTitle">DEVIS N° —</div>
        <div class="subline" id="docSub">Émis le — • Valable jusqu’au —</div>
      </div>
    </div>

    <div class="grid2">
      <div class="card">
        <div class="ct">Société</div>
        <div class="kv" id="bizBox">—</div>
      </div>

      <div class="card">
        <div class="ct">Client</div>
        <div class="kv" id="clientBox">—</div>
      </div>
    </div>

    <div class="card" style="margin-top:12px;">
      <div class="ct">Prestation</div>
      <div class="lines" id="linesBox"></div>

      <div class="totals" id="totalsBox"></div>

      <!-- ✅ Paiement sous le total -->
      <div class="sep"></div>
      <div class="ct">Paiement</div>
      <div class="kv" id="payBox">—</div>
    </div>

    <div class="card" style="margin-top:12px;">
      <div class="ct">Conditions</div>
      <div class="kv" id="conditionsBox">—</div>

      <div class="sep"></div>
      <div class="ct">Pénalités</div>
      <div class="kv" id="penBox">—</div>
    </div>

    <!-- ✅ Footer identité société -->
    <div class="footerBiz" id="footerBiz" style="display:none;"></div>

    <div class="alert" id="alert"></div>
  </div>

  <script type="module">
    import { db } from "./firebase-init.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const $ = (id)=>document.getElementById(id);

    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", { minimumFractionDigits:2, maximumFractionDigits:2 }) + " €";
    }
    function payModeLabel(m){
      m = String(m||"").toUpperCase();
      if(m==="VIREMENT") return "Virement";
      if(m==="ESPECES") return "Espèces";
      if(m==="CHEQUE") return "Chèque";
      return "—";
    }
    function dueLabel(term){
      term = String(term||"").toUpperCase();
      if(term === "RECEPTION") return "À réception";
      if(term === "8J") return "8 jours";
      if(term === "15J") return "15 jours";
      if(term === "30J") return "30 jours";
      if(term === "45J") return "45 jours";
      return term || "—";
    }
    function fmtDateFR(d){
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yy = d.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }
    function addDays(date, days){
      const d = new Date(date.getTime());
      d.setDate(d.getDate() + (Number(days)||0));
      return fmtDateFR(d);
    }
    function showError(msg){
      const a = $("alert");
      a.style.display = "block";
      a.textContent = msg;
    }

    $("printBtn").addEventListener("click", ()=> window.print());

    function pickCreatedDate(d){
      // support createdAt Firestore timestamp + fallback
      if(d?.createdAt?.toDate) return d.createdAt.toDate();
      if(d?.quoteCreatedAt?.toDate) return d.quoteCreatedAt.toDate();
      return new Date();
    }

    function renderLogoFromBusinessSnapshot(bs){
      const url = String(bs?.logoUrl || "").trim();
      const img = $("logoImg");
      const fb = $("logoFallback");
      if(url){
        img.src = url;
        img.style.display = "block";
        fb.style.display = "none";
      }else{
        img.style.display = "none";
        fb.style.display = "block";
      }
    }

    function renderBiz(bs){
      const name = String(bs?.companyName || "Conciergerie").trim() || "Conciergerie";
      const street = String(bs?.address?.street || "").trim();
      const zip = String(bs?.address?.zip || "").trim();
      const city = String(bs?.address?.city || "").trim();
      const siret = String(bs?.registration?.siret || "").trim();
      const ape = String(bs?.registration?.ape || "").trim();
      const email = String(bs?.contact?.email || "").trim();
      const phone = String(bs?.contact?.phone || "").trim();

      const lines = [];
      lines.push(`<div><b>${esc(name)}</b></div>`);
      if(street) lines.push(`<div>${esc(street)}</div>`);
      if(zip || city) lines.push(`<div>${esc([zip, city].filter(Boolean).join(" "))}</div>`);
      const legal = [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • ");
      if(legal) lines.push(`<div class="mut">${esc(legal)}</div>`);
      const contact = [email, phone].filter(Boolean).join(" • ");
      if(contact) lines.push(`<div class="mut">${esc(contact)}</div>`);

      $("bizBox").innerHTML = lines.join("");

      // footer identité
      const footerParts = [];
      footerParts.push(`<span><b>${esc(name)}</b></span>`);
      const addr = [street, [zip, city].filter(Boolean).join(" ")].filter(Boolean).join(", ");
      if(addr) footerParts.push(`<span class="dot">•</span><span class="dim">${esc(addr)}</span>`);
      if(siret) footerParts.push(`<span class="dot">•</span><span class="dim">SIRET ${esc(siret)}</span>`);
      if(ape) footerParts.push(`<span class="dot">•</span><span class="dim">APE ${esc(ape)}</span>`);
      if(email) footerParts.push(`<span class="dot">•</span><span class="dim">${esc(email)}</span>`);
      if(phone) footerParts.push(`<span class="dot">•</span><span class="dim">${esc(phone)}</span>`);

      if(footerParts.length){
        $("footerBiz").style.display = "block";
        $("footerBiz").innerHTML = footerParts.join("");
      }
    }

    function renderClient(d){
      const cs = d.clientSnapshot || {};
      const cn = String(cs.name || d.clientName || "—").trim();
      const ce = String(cs.email || d.clientEmail || "").trim();
      const a1 = String(cs.address1 || d.clientAddress1 || "").trim();
      const a2 = String(cs.address2 || d.clientAddress2 || "").trim();
      const cz = String(cs.zip || d.clientZip || "").trim();
      const cc = String(cs.city || d.clientCity || "").trim();

      const lines = [];
      lines.push(`<div><b>${esc(cn)}</b></div>`);
      if(ce) lines.push(`<div>${esc(ce)}</div>`);
      if(a1) lines.push(`<div>${esc(a1)}</div>`);
      if(a2) lines.push(`<div>${esc(a2)}</div>`);
      if(cz || cc) lines.push(`<div>${esc([cz, cc].filter(Boolean).join(" "))}</div>`);
      $("clientBox").innerHTML = lines.join("");
    }

    function renderLinesAndTotals(d, bs){
      const lines = Array.isArray(d.lines) ? d.lines : [];
      const linesBox = $("linesBox");
      linesBox.innerHTML = "";

      if(!lines.length){
        linesBox.innerHTML = `<div class="mut">Aucune ligne.</div>`;
      }else{
        for(const l of lines){
          const label = String(l.label || "Ligne").trim();
          const qty = Number(l.qty)||0;
          const unit = String(l.unit || "unité").trim();
          const up = Number(l.unitPrice)||0;
          const total = qty * up;

          const div = document.createElement("div");
          div.className = "li";
          div.innerHTML = `
            <div style="min-width:0;">
              <div class="t">${esc(label)}</div>
              <div class="s"><b>${esc(String(qty))}</b> ${esc(unit)} • ${esc(money(up))} / ${esc(unit)}</div>
              ${l.note ? `<div class="s">${esc(String(l.note))}</div>` : ``}
            </div>
            <div style="font-weight:1100; white-space:nowrap;">${esc(money(total))}</div>
          `;
          linesBox.appendChild(div);
        }
      }

      // Totaux (priorité d.totals sinon recalcul)
      const t = d.totals || {};
      let ttc = Number.isFinite(Number(t.ttc)) ? Number(t.ttc) : 0;
      let ht  = Number.isFinite(Number(t.ht))  ? Number(t.ht)  : 0;
      let tva = Number.isFinite(Number(t.tva)) ? Number(t.tva) : 0;

      const vatEnabled = !!(t.vatEnabled ?? bs?.vat?.enabled);
      const vatRate = Number.isFinite(Number(t.vatRate)) ? Number(t.vatRate)
                    : Number.isFinite(Number(bs?.vat?.rate)) ? Number(bs.vat.rate) : 0;

      if(!(ttc > 0) && lines.length){
        // recalcul simple
        ht = lines.reduce((s,l)=> s + (Number(l.qty)||0)*(Number(l.unitPrice)||0), 0);
        tva = vatEnabled ? (ht * vatRate) : 0;
        ttc = ht + tva;
      }

      const ex = String(bs?.tvaExemptionText || "").trim();
      const vatLine = vatEnabled
        ? `HT ${money(ht)} • TVA ${Math.round(vatRate*100)}% ${money(tva)}`
        : (ex || "TVA non applicable (art. 293B CGI)");

      $("totalsBox").innerHTML = `
        <div class="r"><div>Total</div><div>${esc(money(ttc))}</div></div>
        <div class="r">
          <div class="mut">${esc(vatLine)}</div>
          <div class="mut">${lines.length} ligne${lines.length>1?"s":""}</div>
        </div>
      `;
    }

    function renderPayment(d){
      const pm = String(d.paymentMode ?? d.quotePaymentMode ?? "VIREMENT");
      const term = String(d.paymentTerm ?? d.quotePaymentTerm ?? "RECEPTION");
      $("payBox").innerHTML = `
        <div><b>Mode</b> : ${esc(payModeLabel(pm))}</div>
        <div><b>Délai</b> : ${esc(dueLabel(term))}</div>
      `;
    }

    function renderConditions(d){
      const created = pickCreatedDate(d);
      const validityDays = Number(d.offerValidityDays ?? d.quoteOfferValidityDays ?? 30) || 30;
      const validUntil = addDays(created, validityDays);

      const term = String(d.paymentTerm ?? d.quotePaymentTerm ?? "RECEPTION");
      const cancelPct = Number.isFinite(Number(d?.businessSnapshot?.conditions?.cancellationPercent))
        ? Number(d.businessSnapshot.conditions.cancellationPercent)
        : 30;

      $("conditionsBox").innerHTML = `
        <div><b>Validité de l’offre</b> : ${esc(validUntil)}</div>
        <div><b>Échéance de paiement</b> : ${esc(dueLabel(term))}</div>
        <div><b>Annulation</b> : ${esc(String(cancelPct))}% du montant peuvent être retenus selon conditions</div>
      `;

      // subline sous le titre devis
      $("docSub").textContent = `Émis le ${fmtDateFR(created)} • Valable jusqu’au ${validUntil}`;
    }

    function renderPenalty(d){
      const mode = String(d.penaltyMode ?? d.quotePenaltyMode ?? "B2C").toUpperCase();
      const txt = String(d.penaltyText ?? d.quotePenaltyText ?? "").trim();
      const head = (mode === "B2B") ? "Client professionnel (B2B)" : "Client particulier (B2C)";
      $("penBox").innerHTML = `
        <div><b>${esc(head)}</b></div>
        ${txt ? `<div>${esc(txt)}</div>` : `<div class="mut">—</div>`}
      `;
    }

    async function main(){
      const docId = getParam("docId");
      if(!docId){
        showError("⛔ docId manquant dans l’URL.");
        return;
      }

      const ref = doc(db, "salesDocuments", docId);

      let snap;
      try{
        snap = await getDoc(ref);
      }catch(e){
        showError("⛔ Missing or insufficient permissions.\n\nSoit tes rules n’autorisent pas le preview public, soit le preview a expiré.\n\nDétail : " + (e?.message || ""));
        return;
      }

      if(!snap.exists()){
        showError("⛔ Devis introuvable.");
        return;
      }

      const d = snap.data() || {};

      // ✅ numéro devis
      const number = String(d.quoteNumber || d.number || "—").trim() || "—";
      $("docTitle").textContent = `DEVIS N° ${number}`;

      // ✅ businessSnapshot obligatoire pour afficher la société en aperçu public
      const bs = d.businessSnapshot || null;
      if(!bs){
        // On affiche quand même, mais on te dit clairement pourquoi c’est vide
        $("bizBox").innerHTML = `<div class="mut">⛔ businessSnapshot absent dans ce devis. Le preview doit l’écrire depuis devis-free.html.</div>`;
        renderLogoFromBusinessSnapshot({});
      }else{
        renderLogoFromBusinessSnapshot(bs);
        renderBiz(bs);
      }

      renderClient(d);
      renderLinesAndTotals(d, bs || {});
      renderPayment(d);
      renderConditions(d);
      renderPenalty(d);
    }

    main();
  </script>
</body>
</html>
