<!-- docs/devisfree-apercu.html (FINAL: lit salesDocuments + businessSnapshot, mise en page demandée + signatures dans les cadres + paiement sous total + print A4 OK) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
      font-weight:400;
    }

    .wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px; padding-bottom:28px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:800; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer;
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .paper{
      width:100%; max-width:980px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      border-radius:16px;
      padding:16px;
      margin-top:10px;
      position:relative;
    }

    /* HEADER: logo+nom à gauche, émis/valable à droite */
    .header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .brandLeft{
      display:flex; gap:12px; align-items:center; min-width:0;
    }
    .logo{
      width:50px; height:50px; border-radius:14px;
      border:2px solid rgba(122,92,255,0.35);
      overflow:hidden; background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; color:var(--violet);
      flex-shrink:0;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:none; }

    .brand{ min-width:0; }
    .brand .name{ font-size:18px; font-weight:800; line-height:1.15; }
    /* Adresse sous le logo/nom -> masquée */
    .brand .sub{ display:none; }

    .metaRight{
      text-align:right;
      font-size:12px;
      color:#333;
      line-height:1.35;
      white-space:nowrap;
    }
    .metaRight b{ font-weight:700; }

    .docTitle{
      margin-top:10px;
      text-align:center;
      font-weight:800;
      font-size:14px;
      letter-spacing:.2px;
    }
    .docMeta{ display:none; }

    .grid2{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    @media(min-width:820px){
      .grid2{ grid-template-columns: 1fr 1fr; }
    }

    .box{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }
    .box h3{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }
    .line{
      font-size:12.5px;
      font-weight:500;
      color:#111;
      line-height:1.35;
      word-break:break-word;
    }
    .mut{ color:var(--muted); font-weight:500; }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      overflow:hidden;
      border-radius:12px;
    }
    thead th{
      text-align:left;
      font-size:11.5px;
      color:#444;
      font-weight:700;
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.07);
      background:rgba(248,244,255,.6);
    }
    tbody td{
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      font-size:12.5px;
      font-weight:500;
      vertical-align:top;
    }
    tbody tr:last-child td{ border-bottom:none; }
    .right{ text-align:right; white-space:nowrap; }

    /* ✅ Total puis Paiement EN DESSOUS (1 colonne, partout) */
    .summary{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .totalBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }
    .totalRow{
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      font-weight:700;
    }
    .totalRow .big{ font-size:17px; font-weight:800; }
    .totalSub{ margin-top:6px; font-size:11.5px; color:var(--muted); font-weight:500; }

    .payBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }
    .payBox h3{ margin:0 0 6px; font-size:12px; font-weight:800; color:#333; }

    .sectionTitle{
      margin-top:12px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    /* Signatures */
    .sigGrid{
      margin-top:10px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    @media(min-width:820px){
      .sigGrid{ grid-template-columns: 1fr 1fr; }
    }

    .sigBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
    }
    .sigTitle{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }
    .sigPad{
      height:70px;
      border:1px dashed rgba(0,0,0,0.25);
      border-radius:10px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px;
      text-align:center;
    }
    .sigText{
      font-style:italic;
      font-size:14px;
      color:#555;
      font-weight:500;
      user-select:none;
      word-break:break-word;
    }
    .sigText.dim{ color:#9aa0a6; }
    .sigText.ok{ color:#2f6f3e; font-weight:600; }
    .sigText.no{ color:#b3261e; font-weight:600; }

    .sigChoice{
      margin-top:8px;
      display:flex;
      gap:14px;
      align-items:center;
      flex-wrap:wrap;
      font-size:12.5px;
    }
    .sigChoice label{ display:inline-flex; gap:6px; align-items:center; cursor:pointer; }

    .footer{
      margin-top:12px;
      padding-top:10px;
      border-top:1px dashed rgba(122,92,255,0.35);
      text-align:center;
      font-size:11px;
      color:#444;
      font-weight:500;
      line-height:1.35;
    }

    .alert{
      width:100%; max-width:980px;
      margin-top:12px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-left:5px solid #b3261e;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px;
      font-size:12px;
      font-weight:600;
      color:#333;
      display:none;
      white-space:pre-wrap;
    }

    /* ✅ Print A4: garde 2 colonnes seulement pour Société/Client + Signatures, mais Total/Paiement reste empilé */
    @media print{
      .topbar, .bottom-nav, .actions, button{ display:none !important; }
      body{ background:#fff !important; }
      @page{ margin: 8mm; }

      .paper{
        box-shadow:none !important;
        border:none !important;
        border-radius:0 !important;
        max-width:none !important;
        padding: 0 !important;
        position: relative;
      }

      .docTitle{ margin-top:6px !important; }
      .grid2, .sigGrid{ gap:6px !important; }
      .summary{ gap:6px !important; } /* reste en colonne */
      .box, .totalBox, .payBox, .sigBox{ padding:6px 8px !important; }
      table{ margin-top:8px !important; }
      table thead th, table tbody td{ padding:6px 7px !important; }
      .sectionTitle{ margin-top:8px !important; }

      .sigPad{ height:48px !important; }
      .sigChoice{ margin-top:4px !important; font-size:12px !important; }

      .grid2{ grid-template-columns: 1fr 1fr !important; }
      .sigGrid{ grid-template-columns: 1fr 1fr !important; }

      /* ✅ Footer en bas de page + réserve espace */
      .footer{
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        border-top: 1px dashed rgba(0,0,0,0.25);
        padding-top: 4px;
        margin-top: 0 !important;
        font-size: 10px !important;
        line-height: 1.2 !important;
        text-align: center;
        background:#fff;
      }
      .paper{ padding-bottom: 12mm !important; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <a class="pill" href="devis-free.html">← Retour</a>
      <button class="pill primary" id="printBtn" type="button">Imprimer / PDF</button>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="paper" id="paper">
      <div class="header">
        <div class="brandLeft">
          <div class="logo">
            <img id="logoImg" alt="Logo société">
            <span id="logoFallback">✓</span>
          </div>
          <div class="brand">
            <div class="name" id="companyName">Conciergerie</div>
            <div class="sub" id="companySub">—</div>
          </div>
        </div>

        <div class="metaRight" id="metaRight">
          <div><b>Émis le</b> —</div>
          <div><b>Valable jusqu’au</b> —</div>
        </div>
      </div>

      <div class="docTitle" id="docTitle">DEVIS N° —</div>
      <div class="docMeta" id="docMeta">—</div>

      <div class="grid2">
        <div class="box">
          <h3>Société</h3>
          <div class="line" id="socLine1">—</div>
          <div class="line" id="socLine2"></div>
          <div class="line" id="socLine3"></div>
          <div class="line mut" id="socLine4"></div>
        </div>

        <div class="box">
          <h3>Client</h3>
          <div class="line" id="cliLine1">—</div>
          <div class="line" id="cliLine2"></div>
          <div class="line" id="cliLine3"></div>
        </div>
      </div>

      <table aria-label="Lignes devis">
        <thead>
          <tr>
            <th>Prestation</th>
            <th class="right">Qté</th>
            <th class="right">PU</th>
            <th class="right">Total</th>
          </tr>
        </thead>
        <tbody id="linesBody"></tbody>
      </table>

      <!-- ✅ Total puis Paiement dessous -->
      <div class="summary">
        <div class="totalBox">
          <div class="totalRow">
            <div>Total</div>
            <div class="big" id="totalTtc">0,00 €</div>
          </div>
          <div class="totalSub" id="tvaLine">TVA non applicable (art. 293B CGI)</div>
        </div>

        <div class="payBox">
          <h3>Paiement</h3>
          <div class="line" id="payMode">Mode : —</div>
          <div class="line" id="payTerm">Délai : —</div>
        </div>
      </div>

      <div class="sectionTitle">Conditions</div>
      <div class="box">
        <div class="line" id="cond1">—</div>
        <div class="line" id="cond2">—</div>
        <div class="line" id="cond3">—</div>
      </div>

      <div class="sectionTitle">Pénalités</div>
      <div class="box">
        <div class="line" id="penaltyText">—</div>
      </div>

      <div class="sigGrid">
        <div class="sigBox">
          <div class="sigTitle">Signature conciergerie</div>
          <div class="sigPad" aria-label="Zone signature conciergerie">
            <span class="sigText" id="sigCompanyText">—</span>
          </div>
        </div>

        <div class="sigBox">
          <div class="sigTitle">Signature client</div>
          <div class="sigPad" aria-label="Zone signature client">
            <span class="sigText dim" id="sigClientText">—</span>
          </div>

          <div class="sigChoice" role="group" aria-label="Acceptation du devis">
            <label><input type="radio" name="acceptChoice" value="ACCEPTE"> Accepté</label>
            <label><input type="radio" name="acceptChoice" value="REFUSE"> Refusé</label>
          </div>
        </div>
      </div>

      <div class="footer" id="footer">—</div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const printBtn = document.getElementById("printBtn");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");

    const companyNameEl = document.getElementById("companyName");
    const companySubEl  = document.getElementById("companySub");

    const docTitleEl = document.getElementById("docTitle");
    const docMetaEl  = document.getElementById("docMeta"); // (masqué)
    const metaRightEl = document.getElementById("metaRight");

    const soc1 = document.getElementById("socLine1");
    const soc2 = document.getElementById("socLine2");
    const soc3 = document.getElementById("socLine3");
    const soc4 = document.getElementById("socLine4");

    const cli1 = document.getElementById("cliLine1");
    const cli2 = document.getElementById("cliLine2");
    const cli3 = document.getElementById("cliLine3");

    const sigCompanyTextEl = document.getElementById("sigCompanyText");
    const sigClientTextEl = document.getElementById("sigClientText");

    const linesBody = document.getElementById("linesBody");

    const totalTtcEl = document.getElementById("totalTtc");
    const tvaLineEl  = document.getElementById("tvaLine");

    const payModeEl = document.getElementById("payMode");
    const payTermEl = document.getElementById("payTerm");

    const cond1 = document.getElementById("cond1");
    const cond2 = document.getElementById("cond2");
    const cond3 = document.getElementById("cond3");

    const penaltyTextEl = document.getElementById("penaltyText");
    const footerEl = document.getElementById("footer");

    function showError(msg){
      alertBox.style.display = "block";
      alertBox.textContent = "⛔ " + msg;
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function ddmmyyyy(d){
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yy = d.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }
    function addDays(baseDate, days){
      const d = new Date(baseDate.getTime());
      d.setDate(d.getDate() + (Number(days)||0));
      return d;
    }
    function termLabel(term){
      if(term === "RECEPTION") return "À réception";
      if(term === "8J") return "8 jours";
      if(term === "15J") return "15 jours";
      if(term === "30J") return "30 jours";
      if(term === "45J") return "45 jours";
      return term || "—";
    }
    function modeLabel(mode){
      const m = String(mode||"").toUpperCase();
      if(m === "VIREMENT") return "Virement";
      if(m === "ESPECES") return "Espèces";
      if(m === "CHEQUE") return "Chèque";
      return mode || "—";
    }

    function computeTotals(linesArr, vatEnabled, vatRate){
      let ht = 0;
      for(const l of (Array.isArray(linesArr) ? linesArr : [])){
        ht += (Number(l?.qty)||0) * (Number(l?.unitPrice)||0);
      }
      const tva = vatEnabled ? (ht * (Number(vatRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    function applyBusinessSnapshot(bs){
      const companyName = String(bs?.companyName || "Conciergerie").trim();

      // ✅ signature figée depuis snapshot (si tu l'as mis dans businessSnapshot.signatureName)
      const sigName = String(bs?.signatureName || companyName || "Conciergerie").trim();
      sigCompanyTextEl.textContent = sigName || "Conciergerie";

      const logoUrl = String(bs?.logoUrl || "").trim();

      const street = String(bs?.address?.street || "").trim();
      const zip = String(bs?.address?.zip || "").trim();
      const city = String(bs?.address?.city || "").trim();

      const siret = String(bs?.registration?.siret || "").trim();
      const ape   = String(bs?.registration?.ape || "").trim();

      const email = String(bs?.contact?.email || "").trim();
      const phone = String(bs?.contact?.phone || "").trim();

      companyNameEl.textContent = companyName || "Conciergerie";
      companySubEl.textContent = "";

      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }

      soc1.textContent = companyName || "Conciergerie";
      soc2.textContent = street || "";
      soc3.textContent = [zip, city].filter(Boolean).join(" ") || "";
      soc4.textContent = [
        [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "),
        [email, phone].filter(Boolean).join(" • ")
      ].filter(Boolean).join(" • ");

      const footerParts = [];
      footerParts.push(companyName || "Conciergerie");
      if(street) footerParts.push(street);
      if(zip || city) footerParts.push([zip, city].filter(Boolean).join(" "));
      if(siret || ape) footerParts.push([siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "));
      if(email || phone) footerParts.push([email, phone].filter(Boolean).join(" • "));
      footerEl.innerHTML = footerParts.map(x=>esc(x)).join(" • ");
    }

    function refreshClientSigState(){
      const choice = document.querySelector('input[name="acceptChoice"]:checked')?.value || "";
      sigClientTextEl.classList.remove("dim","ok","no");
      if(choice === "ACCEPTE") sigClientTextEl.classList.add("ok");
      else if(choice === "REFUSE") sigClientTextEl.classList.add("no");
      else sigClientTextEl.classList.add("dim");
    }
    document.querySelectorAll('input[name="acceptChoice"]').forEach(r=>{
      r.addEventListener("change", refreshClientSigState);
    });

    function renderClient(d){
      const name = String(d?.clientName || "").trim();
      const zip = String(d?.clientZip || "").trim();
      const city = String(d?.clientCity || "").trim();

      cli1.textContent = name || "—";
      cli2.textContent = "";
      cli2.style.display = "none";
      cli3.textContent = [zip, city].filter(Boolean).join(" ") || "";

      sigClientTextEl.textContent = name || "—";
      refreshClientSigState();
    }

    function renderLines(d, bs){
      const arr = Array.isArray(d?.lines) ? d.lines : [];
      linesBody.innerHTML = "";

      const vatEnabled = !!bs?.vat?.enabled;
      const vatRate = Number.isFinite(Number(bs?.vat?.rate)) ? Number(bs.vat.rate) : 0;

      if(!arr.length){
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="4" class="mut">Aucune ligne</td>`;
        linesBody.appendChild(tr);
      }else{
        for(const l of arr){
          const qty = Number(l?.qty)||0;
          const unit = String(l?.unit || "unité").trim();
          const up = Number(l?.unitPrice)||0;
          const ht = qty * up;
          const tva = vatEnabled ? (ht * vatRate) : 0;
          const ttc = ht + tva;

          const label = String(l?.label || "Prestation").trim();

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${esc(label)}</td>
            <td class="right">${esc(String(qty))} ${esc(unit)}</td>
            <td class="right">${esc(money(up))}</td>
            <td class="right">${esc(money(ttc))}</td>
          `;
          linesBody.appendChild(tr);
        }
      }

      const totals = computeTotals(arr, vatEnabled, vatRate);
      totalTtcEl.textContent = money(totals.ttc);

      if(vatEnabled){
        tvaLineEl.textContent = `HT ${money(totals.ht)} • TVA ${Math.round(vatRate*100)}% ${money(totals.tva)}`;
      }else{
        const ex = String(bs?.tvaExemptionText || "").trim();
        tvaLineEl.textContent = ex || "TVA non applicable (art. 293B CGI)";
      }
    }

    function renderDocHeader(d){
      docTitleEl.textContent = `DEVIS N° ${d?.quoteNumber || d?.number || "—"}`;

      const created = d?.createdAt?.toDate ? d.createdAt.toDate() : new Date();
      const offerDays = Number.isFinite(Number(d?.quoteOfferValidityDays)) ? Number(d.quoteOfferValidityDays) : 30;
      const until = addDays(created, offerDays);

      metaRightEl.innerHTML = `
        <div><b>Émis le</b> ${esc(ddmmyyyy(created))}</div>
        <div><b>Valable jusqu’au</b> ${esc(ddmmyyyy(until))}</div>
      `;
      docMetaEl.textContent = `Émis le ${ddmmyyyy(created)} • Valable jusqu’au ${ddmmyyyy(until)}`;
    }

    function renderPaymentAndConditions(d, bs){
      const mode = String(d?.quotePaymentMode || d?.paymentMode || "VIREMENT").toUpperCase();
      const term = String(d?.quotePaymentTerm || d?.paymentTerm || "RECEPTION").toUpperCase();

      payModeEl.textContent = `Mode : ${modeLabel(mode)}`;
      payTermEl.textContent = `Délai : ${termLabel(term)}`;

      const created = d?.createdAt?.toDate ? d.createdAt.toDate() : new Date();
      const offerDays = Number.isFinite(Number(d?.quoteOfferValidityDays)) ? Number(d.quoteOfferValidityDays) : 30;
      const offerUntil = addDays(created, offerDays);

      const cancelPct = Number.isFinite(Number(bs?.conditions?.cancellationPercent))
        ? Number(bs.conditions.cancellationPercent)
        : 30;

      cond1.innerHTML = `<b>Validité de l’offre</b> : ${esc(ddmmyyyy(offerUntil))}`;
      cond2.innerHTML = `<b>Échéance de paiement</b> : ${esc(termLabel(term))}`;
      cond3.innerHTML = `<b>Annulation</b> : ${esc(String(cancelPct))}% du montant peuvent être retenus selon conditions`;
    }

    function renderPenalty(d){
      const txt = String(d?.quotePenaltyText || d?.penaltyText || "").trim();
      penaltyTextEl.textContent = txt || "—";
    }

    printBtn.addEventListener("click", ()=> window.print());

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }

      const docId = getParam("docId");
      if(!docId){
        showError("docId manquant.");
        return;
      }

      try{
        const ref = doc(db, "salesDocuments", docId);
        const snap = await getDoc(ref);
        if(!snap.exists()){
          showError("Devis introuvable.");
          return;
        }

        const d = snap.data() || {};

        if(d.conciergerieUid && d.conciergerieUid !== user.uid){
          showError("Accès refusé (doc d’une autre conciergerie).");
          return;
        }

        const bs = d.businessSnapshot || null;
        applyBusinessSnapshot(bs || { companyName: "Conciergerie" });

        renderDocHeader(d);
        renderClient(d);
        renderLines(d, bs || {});
        renderPaymentAndConditions(d, bs || {});
        renderPenalty(d);

      }catch(e){
        console.error(e);
        showError(e?.message || "Erreur chargement aperçu.");
      }
    });
  </script>
</body>
</html>
