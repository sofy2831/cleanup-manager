<!-- docs/devisfree-apercu.html (FIRESTORE + RULES COMPAT: auth obligatoire, get salesDocuments/{docId}, affichage "client") -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --text:#111;
      --muted:#666;
      --line:#e9e3ff;
      --bg:#f7f4ff;
      --bad:#b3261e;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:var(--bg); color:var(--text); }
    .wrap{ max-width:900px; margin:0 auto; padding:16px; }

    .top{
      display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; align-items:center;
      position:sticky; top:0; background:rgba(247,244,255,.9); backdrop-filter:blur(6px);
      padding:12px 0; z-index:10;
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:10px 12px; border-radius:999px; border:2px solid var(--violet);
      color:var(--violet); background:#fff; font-weight:900; font-size:13px; text-decoration:none; cursor:pointer;
    }
    .btn.primary{
      border-color:transparent;
      color:#fff;
      background:linear-gradient(90deg,var(--violet),var(--violet2));
    }

    .paper{
      background:#fff; border:1px solid var(--line); border-radius:16px;
      box-shadow:0 10px 30px rgba(0,0,0,.06);
      padding:18px;
    }

    .hdr{ display:flex; justify-content:space-between; gap:14px; align-items:flex-start; flex-wrap:wrap; }
    .brand{
      display:flex; gap:10px; align-items:flex-start;
    }
    .logo{
      width:54px; height:54px; border-radius:14px; overflow:hidden;
      border:2px solid rgba(122,92,255,0.25); background:#fff;
      display:flex; align-items:center; justify-content:center; font-weight:1000; color:var(--violet);
      flex-shrink:0;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:none; }
    .title h1{ margin:0; font-size:18px; font-weight:1000; }
    .title .meta{ margin-top:4px; color:var(--muted); font-weight:800; font-size:12px; line-height:1.35; }

    .doc{
      text-align:right;
    }
    .doc .num{ font-weight:1000; font-size:14px; }
    .doc .sub{ margin-top:4px; color:var(--muted); font-weight:800; font-size:12px; line-height:1.35; }

    .grid{
      margin-top:14px;
      display:grid; grid-template-columns:1fr; gap:12px;
    }
    @media(min-width:860px){ .grid{ grid-template-columns:1fr 1fr; } }

    .box{
      border:1px solid var(--line); border-radius:14px; padding:12px; background:#fff;
    }
    .box h3{ margin:0 0 6px; font-size:12px; color:#444; font-weight:1000; letter-spacing:.2px; }
    .box .line{ font-size:13px; font-weight:850; line-height:1.4; }
    .mut{ color:var(--muted); font-weight:850; }

    table{ width:100%; border-collapse:collapse; margin-top:14px; }
    th, td{ border-bottom:1px solid #f0ecff; padding:10px 6px; vertical-align:top; }
    th{ text-align:left; font-size:12px; color:#555; font-weight:1000; }
    td{ font-size:13px; font-weight:850; }
    .right{ text-align:right; white-space:nowrap; }
    .note{ margin-top:4px; font-size:12px; color:#666; font-weight:800; white-space:pre-wrap; }

    .totals{
      margin-top:14px;
      display:flex; justify-content:flex-end;
    }
    .tot{
      min-width:280px;
      border:1px solid var(--line); border-radius:14px; padding:12px;
      background:#fff;
    }
    .row{ display:flex; justify-content:space-between; gap:10px; font-weight:1000; }
    .row + .row{ margin-top:8px; }
    .small{ margin-top:8px; color:var(--muted); font-size:12px; font-weight:900; line-height:1.35; }

    .footer{
      margin-top:14px;
      border-top:1px dashed #e9e3ff;
      padding-top:12px;
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }
    .footer h4{ margin:0 0 6px; font-size:12px; color:#444; font-weight:1000; }
    .footer .txt{ font-size:12.5px; font-weight:850; line-height:1.45; color:#222; }

    .alert{
      margin-top:12px;
      padding:10px 12px;
      border-left:5px solid var(--bad);
      border-radius:12px;
      background:#fff;
      font-size:12px;
      font-weight:900;
      color:#222;
      display:none;
      white-space:pre-wrap;
    }

    @media print{
      .top{ display:none !important; }
      body{ background:#fff; }
      .wrap{ padding:0; }
      .paper{ box-shadow:none; border:none; border-radius:0; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <a class="btn" id="backBtn" href="devis-free.html">← Retour</a>
      <button class="btn primary" id="printBtn" type="button">Imprimer / PDF</button>
    </div>

    <div class="paper">
      <div class="hdr">
        <div class="brand">
          <div class="logo" id="logoBox">
            <img id="logoImg" alt="Logo">
            <span id="logoFallback">✓</span>
          </div>
          <div class="title">
            <h1 id="bizName">—</h1>
            <div class="meta" id="bizLines">—</div>
          </div>
        </div>

        <div class="doc">
          <div class="num" id="docNumber">DEVIS N° —</div>
          <div class="sub" id="docDates">—</div>
        </div>
      </div>

      <div class="grid">
        <div class="box">
          <h3>Client</h3>
          <div class="line" id="clientName">—</div>
          <div class="line mut" id="clientEmail">—</div>
          <div class="line" id="clientAddr">—</div>
        </div>

        <div class="box">
          <h3>Paiement</h3>
          <div class="line" id="payMode">—</div>
          <div class="line" id="payTerm">—</div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th style="width:48%;">Prestation</th>
            <th style="width:14%;" class="right">Qté</th>
            <th style="width:14%;" class="right">PU</th>
            <th style="width:24%;" class="right">Total</th>
          </tr>
        </thead>
        <tbody id="linesTbody"></tbody>
      </table>

      <div class="totals">
        <div class="tot">
          <div class="row">
            <div>Total</div>
            <div id="totalTtc">0,00 €</div>
          </div>
          <div class="small" id="vatLine">TVA non applicable (art. 293B CGI)</div>
        </div>
      </div>

      <div class="footer">
        <div>
          <h4>Conditions</h4>
          <div class="txt" id="condText">—</div>
        </div>
        <div>
          <h4>Pénalités</h4>
          <div class="txt" id="penText">—</div>
        </div>
      </div>

      <div class="alert" id="alertBox"></div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // UI
    const alertBox = document.getElementById("alertBox");
    const printBtn = document.getElementById("printBtn");
    const backBtn = document.getElementById("backBtn");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");

    const bizNameEl = document.getElementById("bizName");
    const bizLinesEl = document.getElementById("bizLines");

    const docNumberEl = document.getElementById("docNumber");
    const docDatesEl = document.getElementById("docDates");

    const clientNameEl = document.getElementById("clientName");
    const clientEmailEl = document.getElementById("clientEmail");
    const clientAddrEl = document.getElementById("clientAddr");

    const payModeEl = document.getElementById("payMode");
    const payTermEl = document.getElementById("payTerm");

    const linesTbody = document.getElementById("linesTbody");
    const totalTtcEl = document.getElementById("totalTtc");
    const vatLineEl = document.getElementById("vatLine");

    const condTextEl = document.getElementById("condText");
    const penTextEl = document.getElementById("penText");

    function showAlert(msg){
      alertBox.style.display = "block";
      alertBox.textContent = msg;
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    function termLabel(term){
      if(term === "RECEPTION") return "À réception";
      if(term === "8J") return "8 jours";
      if(term === "15J") return "15 jours";
      if(term === "30J") return "30 jours";
      if(term === "45J") return "45 jours";
      return term || "—";
    }
    function payLabel(m){
      if(m === "VIREMENT") return "Virement";
      if(m === "ESPECES") return "Espèces";
      if(m === "CHEQUE") return "Chèque";
      return "—";
    }

    function ddmmyyyy(d){
      if(!d) return "";
      const dt = d instanceof Date ? d : new Date(d);
      if(!Number.isFinite(dt.getTime())) return "";
      return String(dt.getDate()).padStart(2,"0") + "/" + String(dt.getMonth()+1).padStart(2,"0") + "/" + dt.getFullYear();
    }

    function computeTotals(lines, vatEnabled, vatRate){
      let ht = 0;
      for(const l of (Array.isArray(lines)?lines:[])){
        ht += (Number(l?.qty)||0) * (Number(l?.unitPrice)||0);
      }
      const tva = vatEnabled ? (ht * (Number(vatRate)||0)) : 0;
      return { ht, tva, ttc: ht + tva };
    }

    printBtn.addEventListener("click", ()=> window.print());

    onAuthStateChanged(auth, async (user)=>{
      // ✅ rules: get autorisé seulement si connecté (conciergerie/owner)
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }

      const docId = getParam("docId");
      if(!docId){
        showAlert("DocId manquant.");
        return;
      }

      try{
        const ref = doc(db, "salesDocuments", docId);
        const snap = await getDoc(ref);
        if(!snap.exists()){
          showAlert("Devis introuvable.");
          return;
        }
        const d = snap.data() || {};

        // Back "Retour" vers l’éditeur
        backBtn.href = "devis-free.html?docId=" + encodeURIComponent(docId);

        // En-tête société depuis le doc users/{uid}
        // (optionnel : si tu veux 100% fiable, on garde une lecture users/{conciergerieUid}
        // Or ton rule users/{uid} allow get only self. Donc ici: on n'a accès qu'à SON propre doc (user.uid).
        // => On affiche ce qu'on peut depuis salesDocuments + fallback.
        // Pour afficher la société complète en aperçu, le mieux = recopier les infos société dans le devis au moment save.
        // Ici on fait simple : nom = "Conciergerie" + logo absent.
        bizNameEl.textContent = "Conciergerie";
        bizLinesEl.textContent = "—";
        logoImg.style.display = "none";
        logoFallback.style.display = "block";

        // Doc meta
        docNumberEl.textContent = `DEVIS N° ${d.quoteNumber || d.number || "—"}`;

        const createdAt = d.createdAt?.toDate ? d.createdAt.toDate() : null;
        const upd = d.quoteUpdatedAt?.toDate ? d.quoteUpdatedAt.toDate()
                 : d.updatedAt?.toDate ? d.updatedAt.toDate()
                 : null;

        const offerDays = Number.isFinite(Number(d.quoteOfferValidityDays)) ? Number(d.quoteOfferValidityDays)
                        : Number.isFinite(Number(d.offerValidityDays)) ? Number(d.offerValidityDays)
                        : 30;

        const createdTxt = createdAt ? ddmmyyyy(createdAt) : "—";
        const validUntil = (createdAt ? new Date(createdAt.getTime()) : new Date());
        validUntil.setDate(validUntil.getDate() + (offerDays || 0));

        docDatesEl.textContent = `Émis le ${createdTxt} • Valable jusqu’au ${ddmmyyyy(validUntil)}`;

        // Client
        clientNameEl.textContent = d.clientName || "—";
        clientEmailEl.textContent = d.clientEmail || "—";
        const addr = [
          d.clientAddress1 || "",
          d.clientAddress2 || "",
          [d.clientZip || "", d.clientCity || ""].filter(Boolean).join(" ")
        ].filter(Boolean).join("\n");
        clientAddrEl.textContent = addr || "—";

        // Paiement
        payModeEl.textContent = `Mode : ${payLabel(d.quotePaymentMode || d.paymentMode)}`;
        payTermEl.textContent = `Délai : ${termLabel(d.quotePaymentTerm || d.paymentTerm)}`;

        // Lignes
        const lines = Array.isArray(d.lines) ? d.lines : [];
        linesTbody.innerHTML = "";

        if(!lines.length){
          const tr = document.createElement("tr");
          tr.innerHTML = `<td colspan="4" class="mut" style="padding:12px 6px;">Aucune ligne.</td>`;
          linesTbody.appendChild(tr);
        }else{
          for(const l of lines){
            const qty = Number(l.qty)||0;
            const up = Number(l.unitPrice)||0;
            const total = qty * up;
            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td>
                <div style="font-weight:1000;">${esc(l.label || "Prestation")}</div>
                ${l.note ? `<div class="note">${esc(l.note)}</div>` : ``}
              </td>
              <td class="right">${esc(String(qty))} ${esc(l.unit || "")}</td>
              <td class="right">${esc(money(up))}</td>
              <td class="right" style="font-weight:1000;">${esc(money(total))}</td>
            `;
            linesTbody.appendChild(tr);
          }
        }

        // Totaux
        // TVA : pour rester rules-compat + simple, on lit ce qui est dans le doc (si tu l’écris),
        // sinon on affiche "TVA non applicable" (comme tu es souvent en 293B).
        // Si tu veux un calcul TVA basé sur businessProfile, il faut copier businessProfile.vat dans le devis à l’enregistrement.
        const vatEnabled = !!(d.totals?.vatEnabled ?? d.vatEnabled ?? false);
        const vatRate = Number.isFinite(Number(d.totals?.vatRate)) ? Number(d.totals.vatRate)
                      : Number.isFinite(Number(d.vatRate)) ? Number(d.vatRate)
                      : 0;

        const totalsFromDoc = d.totals && typeof d.totals === "object" ? d.totals : null;
        let totals;
        if(totalsFromDoc && Number.isFinite(Number(totalsFromDoc.ttc))){
          totals = {
            ht: Number(totalsFromDoc.ht)||0,
            tva: Number(totalsFromDoc.tva)||0,
            ttc: Number(totalsFromDoc.ttc)||0
          };
        }else{
          totals = computeTotals(lines, vatEnabled, vatRate);
        }

        totalTtcEl.textContent = money(totals.ttc);

        if(vatEnabled){
          vatLineEl.textContent = `HT ${money(totals.ht)} • TVA ${Math.round(vatRate*100)}% ${money(totals.tva)}`;
        }else{
          vatLineEl.textContent = d.tvaExemptionText || "TVA non applicable (art. 293B CGI)";
        }

        // Conditions + pénalités
        const paymentTerm = d.quotePaymentTerm || d.paymentTerm || "RECEPTION";
        const offerUntilTxt = ddmmyyyy(validUntil);

        // Si tu veux mieux: écris cancelPct dans le doc.
        const cancelPct = 30;
        condTextEl.innerHTML = `
          <div>Validité de l’offre : <b>${esc(offerUntilTxt || "—")}</b></div>
          <div>Échéance de paiement : <b>${esc(termLabel(paymentTerm))}</b></div>
          <div>Annulation : <b>${esc(String(cancelPct))}%</b> du montant peuvent être retenus selon conditions</div>
        `;
        penTextEl.textContent = d.quotePenaltyText || d.penaltyText || "—";

      }catch(e){
        console.error(e);
        showAlert("⛔ " + (e?.message || "Erreur de lecture Firestore (permissions/rules)."));
      }
    });
  </script>
</body>
</html>
