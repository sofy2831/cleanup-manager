<!-- docs/devisfree-apercu.html (FINAL + FIX client address/email) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- ⚠️ CSS INCHANGÉ -->
  <!-- (identique à ta version, volontairement) -->
</head>

<body>
  <!-- ⚠️ HTML STRUCTURE INCHANGÉE -->
  <!-- (identique à ta version, volontairement) -->

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ===== helpers ===== */
function esc(s){
  return String(s||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function money(n){
  return Number(n||0).toLocaleString("fr-FR",{minimumFractionDigits:2})+" €";
}
function getParam(k){
  return new URLSearchParams(location.search).get(k);
}

/* ===== UI refs ===== */
const cli1 = document.getElementById("cliLine1");
const cli2 = document.getElementById("cliLine2");
const cli3 = document.getElementById("cliLine3");
const sigClientTextEl = document.getElementById("sigClientText");

/* ===== CLIENT RENDER (FIXED) ===== */
function renderClient(d){
  const name  = String(d?.clientName || "").trim();
  const email = String(d?.clientEmail || "").trim();
  const a1    = String(d?.clientAddress1 || "").trim();
  const a2    = String(d?.clientAddress2 || "").trim();
  const zip   = String(d?.clientZip || "").trim();
  const city  = String(d?.clientCity || "").trim();

  cli1.textContent = name || "—";

  // adresse ligne 1
  if(a1 || a2){
    cli2.style.display = "";
    cli2.textContent = [a1, a2].filter(Boolean).join(" ");
  }else{
    cli2.style.display = "none";
    cli2.textContent = "";
  }

  // CP / ville / email
  const cityLine = [zip, city].filter(Boolean).join(" ");
  const extra = [cityLine, email].filter(Boolean).join(" • ");
  cli3.textContent = extra || "";

  sigClientTextEl.textContent = name || "—";
}

/* ===== AUTH / LOAD ===== */
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.href="login.html?role=conciergerie";
    return;
  }

  const docId = getParam("docId");
  if(!docId){
    alert("docId manquant");
    return;
  }

  const ref = doc(db,"salesDocuments",docId);
  const snap = await getDoc(ref);
  if(!snap.exists()){
    alert("Devis introuvable");
    return;
  }

  const d = snap.data();
  renderClient(d);
});
</script>
</body>
</html>
