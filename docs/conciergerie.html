<!-- docs/conciergerie.html (FINAL — stats + abonnement compact + portail Stripe + résiliation + réactivation Stripe + support + onboarding) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Tableau de bord conciergerie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing:border-box; }

    :root{
      --violet-light:#F3ECFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --bad:#b3261e;
      --ok:#1b8f4d;
      --warn:#b06b00;
    }

    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg,#F8F4FF 0%,#EDE6FF 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      white-space:nowrap;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }

    .pill.support{
      border-color:#d7ccff;
      color:#5a42d9;
      background:#fff;
    }

    .logo-title{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:10px;
      margin-bottom:6px;
      text-align:center;
    }

    .logo-icon{
      width:44px;
      height:44px;
      border-radius:50%;
      background:#fff;
      border:2px solid var(--violet-main);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--violet-main);
      font-size:22px;
      font-weight:900;
      position:relative;
      flex-shrink:0;
    }

    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px;
      right:-5px;
      font-size:12px;
      color:var(--violet-main);
    }

    h1{
      margin:0;
      font-size:26px;
      font-weight:900;
      letter-spacing:-0.2px;
    }

    .subtitle{
      margin-top:2px;
      font-size:14px;
      color:#444;
      text-align:center;
    }

    .companyLine{
      margin-top:10px;
      padding:4px 10px;
      border-radius:999px;
      background:#fff;
      font-size:12px;
      color:#555;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center;
      max-width:980px;
      font-weight:900;
    }

    .stats{
      width:100%;
      max-width:980px;
      margin-top:12px;
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap:10px;
    }

    @media(min-width:820px){
      .stats{ grid-template-columns: repeat(6, minmax(0, 1fr)); }
    }

    .stat{
      background:rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:0 14px 36px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      padding:12px 12px;
      display:flex;
      flex-direction:column;
      gap:6px;
      min-height:72px;
    }

    .stat .label{
      font-size:12px;
      color:#666;
      font-weight:800;
      line-height:1.15;
    }

    .stat .value{
      display:flex;
      align-items:baseline;
      gap:8px;
      font-size:22px;
      font-weight:1000;
      letter-spacing:-0.2px;
      flex-wrap:wrap;
    }

    .mini-badge{
      font-size:11px;
      font-weight:900;
      color:var(--violet-main);
      background:#fff;
      border:1px solid var(--border);
      padding:4px 8px;
      border-radius:999px;
      white-space:nowrap;
    }

    .mini-badge.bad{
      color:var(--bad);
      border-color:rgba(179,38,30,0.25);
    }

    .mini-badge.warn{
      color:var(--warn);
      border-color:rgba(176,107,0,0.25);
    }

    .mini-badge.ok{
      color:var(--ok);
      border-color:rgba(27,143,77,0.25);
    }

    .dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:var(--ok);
      display:inline-block;
      margin-right:6px;
      transform:translateY(-1px);
    }

    .stat.clickable{ cursor:pointer; }
    .stat.clickable:hover{ border-color:rgba(122,92,255,0.35); }

    .hint-line{
      width:100%;
      max-width:980px;
      margin-top:10px;
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      background:rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      flex-wrap:wrap;
    }

    .hint-line strong{
      color:#222;
      font-size:12px;
    }

    .hint-line .hint-badge{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:900;
      background:#fff;
      border:1px solid var(--border);
      color:var(--violet-main);
      white-space:nowrap;
    }

    .hint-line .hint-badge.warn{
      color:var(--warn);
      border-color:rgba(176,107,0,0.25);
    }

    .hint-line .hint-badge.bad{
      color:var(--bad);
      border-color:rgba(179,38,30,0.25);
    }

    .alert{
      width:100%;
      max-width:980px;
      display:none;
      margin-top:12px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }

    .alert.ok{ border-left-color: var(--ok); }

    .grid{
      width:100%;
      max-width:980px;
      margin-top:16px;
      display:grid;
      grid-template-columns:1fr;
      gap:12px;
    }

    @media(min-width:820px){
      .grid{ grid-template-columns: repeat(3, 1fr); }
    }

    .card{
      background:rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:0 14px 36px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      padding:16px 14px 14px;
      text-align:left;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .card h2{
      margin:0;
      font-size:16px;
      font-weight:900;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .card p{
      margin:0;
      font-size:12px;
      color:#666;
      line-height:1.35;
    }

    .cta{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      padding:12px 14px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
      white-space:nowrap;
    }

    .cta-disabled{
      background:#E9E6F5 !important;
      color:#7A7391 !important;
      box-shadow:none !important;
      cursor:not-allowed !important;
      border:1px solid rgba(0,0,0,0.06);
    }

    .cta-disabled:disabled{
      opacity:1;
    }

    .legal-list{
      list-style:none;
      padding:0;
      margin:0;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .legal-item{
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 10px;
      border:1px dashed rgba(122,92,255,0.25);
      border-radius:14px;
      background:rgba(255,255,255,0.70);
    }

    .check{
      width:22px;
      height:22px;
      border-radius:50%;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:rgba(27,143,77,0.10);
      border:1px solid rgba(27,143,77,0.30);
      color:var(--ok);
      font-weight:1000;
      flex-shrink:0;
    }

    .legal-item .txt{
      display:flex;
      flex-direction:column;
      gap:2px;
      min-width:0;
    }

    .legal-item .txt strong{
      font-size:12px;
      font-weight:1000;
      color:#222;
      line-height:1.2;
    }

    .legal-item .txt span{
      font-size:11px;
      color:#666;
      line-height:1.3;
    }

    .legal-item .right{
      margin-left:auto;
      flex-shrink:0;
    }

    .btn-secondary{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid var(--border);
      cursor:pointer;
      text-decoration:none;
      font-weight:900;
      font-size:12px;
      background:#fff;
      color:var(--violet-main);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
    }

    .btn-secondary:disabled{
      opacity:0.6;
      pointer-events:none;
      cursor:default;
    }

    .btn-secondary.danger{
      color:var(--bad);
      border-color:rgba(179,38,30,0.22);
    }

    .btn-secondary.danger.solid{
      background:var(--bad);
      color:#fff;
      border-color:var(--bad);
    }

    .btn-secondary.ok{
      color:var(--ok);
      border-color:rgba(27,143,77,0.25);
    }

    .sub-mini{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:8px;
    }

    .sub-mini-row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      padding:8px 10px;
      border:1px dashed rgba(122,92,255,0.22);
      border-radius:12px;
      background:rgba(255,255,255,0.70);
      flex-wrap:wrap;
    }

    .sub-mini-row span{
      font-size:12px;
      color:#666;
      font-weight:900;
    }

    .sub-mini-row strong{
      font-size:12px;
      color:#222;
      font-weight:1000;
    }

    .sub-status{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:5px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      border:1px solid var(--border);
      background:#fff;
      color:#444;
    }

    .sub-status.active{
      color:var(--ok);
      border-color:rgba(27,143,77,0.25);
    }

    .sub-status.pending-cancel{
      color:var(--warn);
      border-color:rgba(176,107,0,0.25);
    }

    .sub-status.suspended,
    .sub-status.cancelled{
      color:var(--bad);
      border-color:rgba(179,38,30,0.25);
    }

    .sub-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:8px;
    }

    .cancel-box{
      margin-top:10px;
      padding:12px;
      border:1px solid rgba(179,38,30,0.18);
      border-radius:16px;
      background:rgba(255,255,255,0.88);
      display:none;
    }

    .cancel-title{
      font-size:13px;
      font-weight:1000;
      color:#222;
      margin:0 0 6px 0;
    }

    .cancel-text{
      font-size:12px;
      color:#555;
      line-height:1.4;
      margin:0 0 8px 0;
    }

    .cancel-label{
      display:block;
      margin-top:10px;
      margin-bottom:6px;
      font-size:12px;
      font-weight:900;
      color:#333;
    }

    .cancel-input{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid rgba(122,92,255,0.18);
      background:#fff;
      font:inherit;
      color:#111;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:50;
      display:flex;
      gap:6px;
      justify-content:space-around;
      align-items:center;
      padding:10px 10px calc(10px + env(safe-area-inset-bottom));
      background:rgba(255,255,255,0.92);
      border-top:1px solid rgba(122,92,255,0.18);
      backdrop-filter:blur(10px);
    }

    .bottom-nav a{
      flex:1;
      text-align:center;
      text-decoration:none;
