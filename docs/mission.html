<!-- docs/mission.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Missions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    :root{
      --violet-main:#7A5CFF; --violet-dark:#6238FF;
      --text:#111; --muted:#666;
      --border: rgba(122,92,255,0.18);
      --bad:#b3261e; --ok:#1b8f4d;
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF; --bg2:#EDE6FF;
    }
    body{ margin:0; background: linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:34px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main);
      color:var(--violet-main); text-decoration:none;
      font-weight:900; font-size:13px;
      cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .logo{ display:flex; align-items:center; gap:10px; margin-top:8px; margin-bottom:2px; }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff; border:2px solid var(--violet-main);
      display:flex; align-items:center; justify-content:center;
      color:var(--violet-main); font-size:18px; font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-5px;
      font-size:12px;
      color:var(--violet-main);
    }

    h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:12px; color:#444; font-weight:800; text-align:left; width:100%; max-width:980px; }

    .alert{
      width:100%; max-width:980px;
      display:none; margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
      font-weight:800;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .wrap{ width:100%; max-width:980px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }

    .card{
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 12px 12px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .card-title{ font-size:14px; font-weight:900; color:#111; }
    .meta{
      display:flex; flex-wrap:wrap; gap:8px;
      font-size:12px; font-weight:900; color:#444;
      align-items:center;
    }
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      padding:4px 10px; border-radius:999px;
      background: rgba(122,92,255,0.12);
      color:#5b45c8;
      white-space:nowrap;
      font-size:11px;
      font-weight:900;
    }
    .chip.ok{ background: rgba(27,143,77,0.16); color: var(--ok); }
    .chip.bad{ background: rgba(179,38,30,0.14); color: var(--bad); }

    .grid{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    @media(min-width:900px){
      .grid{ grid-template-columns: 1fr 1fr; }
    }

    .mission{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      position:relative;
    }
    .mission.done{
      border: 1px solid rgba(27,143,77,0.25);
      box-shadow: 0 3px 10px rgba(27,143,77,0.12);
    }
    .mission.locked{
      opacity:.92;
    }
    .m-head{
      display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    }
    .m-title{
      font-size:14px; font-weight:900; color:#111;
    }
    .m-sub{
      margin-top:2px;
      font-size:12px; font-weight:800; color:#666;
      white-space:pre-wrap;
    }
    .m-actions{
      display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; align-items:center;
    }
    .btn{
      border:none;
      border-radius:999px;
      padding:9px 12px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
      white-space:nowrap;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn.primary{
      background: linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color: transparent;
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .checklist{
      display:flex;
      flex-direction:column;
      gap:8px;
      margin-top:2px;
    }
    .row{
      display:flex;
      align-items:flex-start;
      gap:10px;
      padding:8px 10px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,0.04);
      background: rgba(122,92,255,0.05);
    }
    .row input{ margin-top:2px; }
    .row .txt{
      font-size:12px;
      font-weight:900;
      color:#222;
      line-height:1.25;
    }
    .row .hint{
      font-size:11px;
      font-weight:800;
      color:#666;
      margin-top:3px;
      line-height:1.2;
    }
    .note{
      width:100%;
      border-radius:12px;
      border:1px solid #D3C7FF;
      padding:10px 10px;
      font-size:13px;
      outline:none;
      background:#fff;
    }
    .note:focus{
      border-color:var(--violet-main);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }

    .footer-help{
      width:100%; max-width:980px;
      margin-top:6px;
      font-size:11px;
      font-weight:900;
      color:#666;
      text-align:left;
      opacity:.95;
    }
    .footer-help a{ color:var(--violet-main); text-decoration:none; font-weight:900; }
    .footer-help a:hover{ text-decoration:underline; }

    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      z-index:120;
      display:none;
      max-width: 92vw;
      padding:10px 12px;
      background:#111;
      color:#fff;
      border-radius:999px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.22);
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }
    .toast.ok{ background: #0f5c33; }
    .toast.bad{ background: #7a1410; }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="agent.html">← Mes missions</a>
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>

    <div class="logo">
      <div class="logo-icon">🧹</div>
      <h1>Missions</h1>
    </div>
    <div class="subtitle" id="subTitle">—</div>

    <div class="alert" id="alertBox"></div>

    <div class="wrap">
      <section class="card" id="jobCard" style="display:none;">
        <div class="card-title" id="jobTitle">Prestation</div>
        <div class="meta" id="jobMeta"></div>
      </section>

      <section class="card">
        <div class="card-title">Checklist</div>
        <div class="grid" id="missionsGrid"></div>
      </section>

      <div class="footer-help">
        Si tu n’as rien à faire ici : soit tu n’es pas assigné(e), soit la conciergerie n’a pas encore envoyé les missions.
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      doc,
      getDoc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const subTitle = document.getElementById("subTitle");
    const jobCard = document.getElementById("jobCard");
    const jobTitle = document.getElementById("jobTitle");
    const jobMeta = document.getElementById("jobMeta");
    const missionsGrid = document.getElementById("missionsGrid");
    const logoutBtn = document.getElementById("logoutBtn");
    const toast = document.getElementById("toast");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    let toastTimer = null;
    function showToast(msg, kind="ok"){
      toast.textContent = msg;
      toast.classList.remove("ok","bad");
      toast.classList.add(kind === "bad" ? "bad" : "ok");
      toast.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{ toast.style.display="none"; }, 1700);
    }

    function esc(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function typeLabel(t){
      const x = (t||"").toUpperCase();
      if(x === "CHECKIN") return "Check-in";
      if(x === "MENAGE") return "Ménage";
      if(x === "CHECKOUT") return "Check-out";
      return x || "Mission";
    }

    function chip(text, cls=""){
      return `<span class="chip ${cls}">${esc(text)}</span>`;
    }

    // ===== URL params =====
    const url = new URL(location.href);
    const token = (url.searchParams.get("token") || "").trim();
    const prestationId = (url.searchParams.get("prestationId") || "").trim();
    const conciergerieLabel = (url.searchParams.get("c") || "").trim();

    if(!prestationId){
      showAlert("Lien incomplet : prestationId manquant.");
    }

    // ===== auth guard =====
    let currentUser = null;

    async function requireRoleAgent(uid){
      // Optionnel : si tu as users/{uid} avec role, tu peux forcer agent ici.
      // Pour l'instant : on accepte tout user connecté (agent ponctuel).
      return true;
    }

    async function loadEventAndMissions(){
      hideAlert();
      missionsGrid.innerHTML = "";
      jobMeta.innerHTML = "";
      jobCard.style.display = "none";

      if(!prestationId){
        return;
      }

      // 1) Read event
      const eRef = doc(db, "events", prestationId);
      const eSnap = await getDoc(eRef);
      if(!eSnap.exists()){
        showAlert("Prestation introuvable. Demande à la conciergerie de renvoyer le lien.");
        return;
      }
      const ev = eSnap.data() || {};

      // 2) Vérif token (si fourni) : on contrôle le token doc + expiration
      //    Et on vérifie que token.prestationId match.
      if(token){
        const tRef = doc(db, "dayTokens", token);
        const tSnap = await getDoc(tRef);
        if(!tSnap.exists()){
          showAlert("Token invalide. Demande un nouveau lien.");
          return;
        }
        const td = tSnap.data() || {};
        if(td.active !== true){
          showAlert("Lien expiré (token inactif). Demande un nouveau lien.");
          return;
        }
        if(String(td.prestationId || "") !== prestationId){
          showAlert("Lien incohérent (token ≠ prestation). Demande un nouveau lien.");
          return;
        }
        // expiresAtIso : string ISO
        if(td.expiresAtIso){
          const exp = Date.parse(td.expiresAtIso);
          if(!Number.isFinite(exp) || Date.now() > exp){
            showAlert("Lien expiré. Demande un nouveau lien.");
            return;
          }
        }
      }

      // 3) Affichage header
      const homeLine = `${ev.homeName || "Logement"}${ev.homeCity ? " — " + ev.homeCity : ""}`;
      const dtLine = `${(ev.dateKey || ev.date || "—")}${ev.time ? " à " + ev.time : ""}`;
      const agLine = `${ev.assignedToName || "—"}${ev.assignedToEmail ? " • " + ev.assignedToEmail : ""}`;
      const status = (ev.status || "EN_COURS").toUpperCase();

      subTitle.textContent = conciergerieLabel
        ? `${conciergerieLabel} • ${homeLine}`
        : homeLine;

      jobTitle.textContent = "Prestation";
      jobMeta.innerHTML = [
        chip(dtLine),
        chip("Agent: " + agLine),
        chip("Statut: " + status, status === "BON_A_FACTURER" ? "ok" : "")
      ].join("");

      jobCard.style.display = "block";

      // 4) Read 3 missions (by path, no collectionGroup)
      const ids = ["CHECKIN","MENAGE","CHECKOUT"];
      const missions = [];

      for(const mid of ids){
        const mRef = doc(db, "events", prestationId, "missions", mid);
        const mSnap = await getDoc(mRef);
        if(!mSnap.exists()) continue; // certaines prestations n’ont pas les 3
        const m = mSnap.data() || {};
        missions.push({ id: mid, ref: mRef, data: m });
      }

      if(!missions.length){
        missionsGrid.innerHTML = `
          <div style="padding:12px;border-radius:14px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.06);color:#666;font-weight:900;font-size:12px;">
            Aucune mission pour cette prestation (pour l’instant).
          </div>`;
        return;
      }

      // 5) Render missions cards
      missionsGrid.innerHTML = "";
      for(const ms of missions){
        missionsGrid.appendChild(renderMissionCard(ms));
      }
    }

    function checklistToArray(checklist){
      // accepte map {k:{label,done}} ou array [{label,done}]
      if(Array.isArray(checklist)) return checklist;
      if(checklist && typeof checklist === "object"){
        // tri stable : ordre alphabétique des clés si aucune info
        const keys = Object.keys(checklist);
        return keys.map(k => {
          const v = checklist[k] || {};
          if(typeof v === "string") return { key:k, label:v, done:false };
          return { key:k, label: v.label || k, hint: v.hint || "", done: !!v.done };
        });
      }
      return [];
    }

    function renderMissionCard(ms){
      const { id, ref, data } = ms;
      const type = (data.type || id || "").toUpperCase();
      const title = typeLabel(type);

      const status = (data.status || "ASSIGNEE").toUpperCase();
      const locked = data.locked === true;
      const done = status === "A_VALIDER" || status === "VALIDEE";

      const list = checklistToArray(data.checklist || {});
      const hasList = list.length > 0;

      const wrap = document.createElement("div");
      wrap.className = "mission" + (done ? " done" : "") + (locked ? " locked" : "");

      const statusChip =
        status === "VALIDEE" ? chip("VALIDÉE", "ok")
        : status === "A_VALIDER" ? chip("À VALIDER", "ok")
        : status === "ASSIGNEE" ? chip("ASSIGNÉE")
        : chip(status);

      wrap.innerHTML = `
        <div class="m-head">
          <div>
            <div class="m-title">${esc(title)} ${statusChip}</div>
            <div class="m-sub">${esc(data.homeAddress || "")}${data.homeAddress ? "\n" : ""}${esc(data.time ? ("Heure : " + data.time) : "")}</div>
          </div>
          <div class="m-actions">
            <button class="btn" type="button" data-save="${esc(id)}">Enregistrer</button>
            <button class="btn primary" type="button" data-finish="${esc(id)}">Terminer</button>
          </div>
        </div>

        ${hasList ? `<div class="checklist" data-list="${esc(id)}"></div>` : `
          <div style="padding:10px;border-radius:12px;background:rgba(122,92,255,0.05);border:1px solid rgba(0,0,0,0.04);font-size:12px;font-weight:900;color:#666;">
            Pas de checklist définie pour cette mission.
          </div>
        `}

        <textarea class="note" rows="2" placeholder="Commentaire (optionnel)" data-note="${esc(id)}">${esc(data.agentComment || "")}</textarea>

        <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; margin-top:-2px;">
          <span class="chip">${esc("Token: " + (data.dayToken || "—"))}</span>
          ${locked ? `<span class="chip ok">Verrouillée</span>` : `<span class="chip">Éditable</span>`}
        </div>
      `;

      // render checklist rows
      const listBox = wrap.querySelector(`[data-list="${CSS.escape(id)}"]`);
      if(listBox && hasList){
        listBox.innerHTML = list.map((it, idx) => {
          const key = it.key ?? String(idx);
          const label = it.label ?? "";
          const hint = it.hint ?? "";
          const checked = !!it.done;
          return `
            <label class="row">
              <input type="checkbox" data-item="${esc(id)}||${esc(String(key))}" ${checked ? "checked" : ""} ${locked ? "disabled" : ""}/>
              <div>
                <div class="txt">${esc(label)}</div>
                ${hint ? `<div class="hint">${esc(hint)}</div>` : ``}
              </div>
            </label>
          `;
        }).join("");
      }

      // buttons behaviour
      const btnSave = wrap.querySelector(`button[data-save="${CSS.escape(id)}"]`);
      const btnFinish = wrap.querySelector(`button[data-finish="${CSS.escape(id)}"]`);

      if(locked){
        btnSave.disabled = true;
        btnFinish.disabled = true;
      }else{
        btnSave.addEventListener("click", async ()=>{
          try{
            btnSave.disabled = true;
            await saveMission(ref, id);
            showToast("✅ Enregistré");
          }catch(err){
            console.error(err);
            showToast("⛔ Erreur", "bad");
            showAlert("Erreur enregistrement : " + (err?.message || "inconnue"));
          }finally{
            btnSave.disabled = false;
          }
        });

        btnFinish.addEventListener("click", async ()=>{
          try{
            btnFinish.disabled = true;
            await finishMission(ref, id);
            showToast("✅ Terminé (à valider)");
            await loadEventAndMissions(); // refresh UI
          }catch(err){
            console.error(err);
            showToast("⛔ Erreur", "bad");
            showAlert("Erreur terminaison : " + (err?.message || "inconnue"));
          }finally{
            btnFinish.disabled = false;
          }
        });
      }

      return wrap;
    }

    function readUIForMission(missionId){
      // récupère checklist + note depuis le DOM
      const checks = Array.from(document.querySelectorAll(`input[type="checkbox"][data-item^="${missionId}||"]`));
      const noteEl = document.querySelector(`textarea[data-note="${CSS.escape(missionId)}"]`);
      const agentComment = (noteEl?.value || "").trim();

      // checklist en map {key:{label,done}} est plus stable
      const checklist = {};
      for(const cb of checks){
        const raw = cb.getAttribute("data-item") || "";
        const parts = raw.split("||");
        const key = parts[1] || "";
        // le label est juste après dans .txt
        const row = cb.closest(".row");
        const txt = row?.querySelector(".txt")?.textContent || key;
        const hint = row?.querySelector(".hint")?.textContent || "";
        checklist[key] = { label: txt, hint: hint, done: cb.checked };
      }

      return { checklist, agentComment };
    }

    async function saveMission(mRef, missionId){
      const { checklist, agentComment } = readUIForMission(missionId);

      await updateDoc(mRef, {
        checklist,
        agentComment,
        updatedAt: serverTimestamp()
      });
    }

    async function finishMission(mRef, missionId){
      const { checklist, agentComment } = readUIForMission(missionId);

      await updateDoc(mRef, {
        checklist,
        agentComment,
        agentDone: true,
        agentDoneAt: serverTimestamp(),
        status: "A_VALIDER",
        updatedAt: serverTimestamp()
      });
    }

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      location.href = "index.html";
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        // agent connecté obligatoire => login
        const back = encodeURIComponent(location.pathname + location.search);
        location.href = "login.html?role=agent&redirect=" + back;
        return;
      }
      currentUser = user;

      try{
        await requireRoleAgent(user.uid);
        await loadEventAndMissions();
      }catch(err){
        console.error(err);
        showAlert("Erreur chargement missions : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
