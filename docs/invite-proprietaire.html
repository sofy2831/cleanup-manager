<!-- docs/invite-proprietaire.html (STABLE — anti page "Chargement..." + token guard + finalize safe) -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanUp Manager – Invitation propriétaire</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root{ --v1:#7A5CFF; --v2:#6238FF; --bad:#b3261e; --ok:#1b8f4d; }
  *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
  body{ margin:0; background:linear-gradient(180deg,#F8F4FF,#EDE6FF); color:#111; }
  .page{ max-width:760px; margin:auto; padding:16px; }
  .top{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:10px; }
  .pill{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:10px 12px; border-radius:999px;
    background:#fff; border:2px solid var(--v1); color:var(--v1);
    text-decoration:none; font-weight:900; font-size:13px;
  }
  .pill.primary{ background:linear-gradient(90deg,var(--v1),var(--v2)); border-color:transparent; color:#fff; }
  h1{ margin:8px 0 0; font-size:26px; font-weight:900; }
  .sub{ margin:6px 0 0; font-weight:800; color:#444; }
  .badge{ margin-top:10px; display:inline-block; padding:6px 10px; border-radius:999px; background:#fff; font-weight:900; font-size:12px; }
  .card{ margin-top:12px; background:#fff; border-radius:18px; padding:16px; box-shadow:0 8px 22px rgba(0,0,0,.10); }
  label{ display:block; font-size:12px; font-weight:900; margin:10px 0 6px; color:#333; }
  input{
    width:100%; padding:11px 12px; border-radius:14px; border:1px solid rgba(0,0,0,.15);
    font-weight:800; font-size:14px; outline:none;
  }
  input:focus{ border-color:var(--v1); box-shadow:0 0 0 2px rgba(122,92,255,.15); }
  .row{ display:flex; gap:10px; flex-wrap:wrap; }
  .row > div{ flex:1; min-width:220px; }
  .btn{
    margin-top:14px; width:100%; padding:12px 14px; border-radius:999px; border:none;
    font-weight:900; cursor:pointer; color:#fff;
    background:linear-gradient(90deg,var(--v1),var(--v2));
  }
  .btn:disabled{ opacity:.6; cursor:not-allowed; }
  .alert{
    margin-top:12px; padding:10px 12px; border-radius:14px; background:#fff;
    border-left:5px solid var(--bad); display:none; white-space:pre-wrap; font-weight:900; font-size:12px; color:#444;
  }
  .alert.ok{ border-left-color:var(--ok); }
  .hidden{ display:none !important; }
</style>
</head>

<body>
<div class="page">

  <div class="top">
    <a class="pill" id="backLink" href="index.html">← Accueil</a>
    <a class="pill primary" id="alreadyLink" href="login.html?role=proprietaire">J’ai déjà un accès</a>
  </div>

  <h1>CleanUp Manager</h1>
  <div class="sub">Accès propriétaire</div>
  <div class="badge" id="badge">Chargement…</div>

  <div class="card hidden" id="ownerCard">
    <div id="alertOwner" class="alert"></div>

    <form id="inviteForm" autocomplete="off">
      <label>Email</label>
      <input id="email" type="email" required>

      <div class="row">
        <div>
          <label>Nom / Prénom</label>
          <input id="fullname" required>
        </div>
        <div>
          <label>Téléphone (optionnel)</label>
          <input id="phone">
        </div>
      </div>

      <div class="row">
        <div>
          <label>Mot de passe</label>
          <input id="password" type="password" required>
        </div>
        <div>
          <label>Confirmer</label>
          <input id="password2" type="password" required>
        </div>
      </div>

      <button class="btn" id="createBtn" type="submit">Créer mon accès</button>
    </form>
  </div>

</div>

<script type="module">
  // ✅ IMPORTANT: si ton fichier firebase-init.js est dans /docs/, laisse "./firebase-init.js"
  // Sinon mets "../firebase-init.js" selon TON arborescence GitHub Pages.
  import { auth, db } from "./firebase-init.js";

  import {
    onAuthStateChanged,
    createUserWithEmailAndPassword,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

  import {
    doc, getDoc, setDoc, updateDoc, serverTimestamp,
    collection, query, where, getDocs, writeBatch
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const badge = document.getElementById("badge");
  const ownerCard = document.getElementById("ownerCard");
  const alertOwner = document.getElementById("alertOwner");
  const alreadyLink = document.getElementById("alreadyLink");

  const form = document.getElementById("inviteForm");
  const createBtn = document.getElementById("createBtn");

  const emailEl = document.getElementById("email");
  const fullnameEl = document.getElementById("fullname");
  const phoneEl = document.getElementById("phone");
  const passwordEl = document.getElementById("password");
  const password2El = document.getElementById("password2");

  function showAlert(msg, ok=false){
    alertOwner.style.display = "block";
    alertOwner.classList.toggle("ok", !!ok);
    alertOwner.textContent = msg;
  }

  function getParam(n){
    return (new URLSearchParams(location.search).get(n) || "").trim();
  }
  function normalizeEmail(e){ return (e||"").trim().toLowerCase(); }
  function isStrongPassword(pw){
    return typeof pw === "string" && pw.length >= 8 && /[A-Za-z]/.test(pw) && /\d/.test(pw);
  }

  const token = getParam("token");

  // ✅ lien "j'ai déjà un accès" conserve le token
  alreadyLink.href = token
    ? ("login.html?role=proprietaire&token=" + encodeURIComponent(token))
    : "login.html?role=proprietaire";

  // ----- guard token -----
  if(!token){
    badge.textContent = "Lien invalide";
    ownerCard.classList.remove("hidden");
    showAlert("⛔ Lien d’invitation incomplet : token manquant.\nDemande à la conciergerie de régénérer le lien.");
    // on ne fait rien d'autre
    throw new Error("Missing token in invite-proprietaire.html");
  }

  let invite = null;
  let authedUser = null;
  let finalizeRunning = false;

  function profileRedirect(){
    location.replace("profil-proprietaire.html?self=1&token=" + encodeURIComponent(token));
  }

  async function autoLinkHomes(conciergerieUid, emailLower, tokenValue, ownerDocId, ownerUid){
    // ✅ on filtre conciergerieUid pour éviter de matcher d'autres conciergeries par hasard
    const qh = query(
      collection(db,"homes"),
      where("conciergerieUid","==", String(conciergerieUid)),
      where("pendingInviteToken","==", String(tokenValue)),
      where("pendingOwnerEmail","==", String(emailLower))
    );

    const snap = await getDocs(qh);
    if(snap.empty) return 0;

    const batch = writeBatch(db);
    snap.docs.forEach(d=>{
      batch.update(d.ref, {
        ownerUid: String(ownerUid),       // = auth.uid (règle homes finalize link)
        ownerDocId: String(ownerDocId),   // = owners docId
        ownerLinkStatus: "LINKED",
        pendingInviteToken: "",
        pendingOwnerEmail: "",
        updatedAt: serverTimestamp()
      });
    });

    await batch.commit();
    return snap.size;
  }

  async function finalize(user){
    if(finalizeRunning) return;
    if(!invite) return;

    finalizeRunning = true;
    try{
      const invEmail = normalizeEmail(invite.email || "");
      const userEmail = normalizeEmail(user.email || "");

      if(invEmail && userEmail !== invEmail){
        badge.textContent = "Invitation valide";
        showAlert("⛔ Tu es connecté avec un autre email.\nDéconnecte-toi puis reconnecte-toi avec : " + invEmail);
        finalizeRunning = false;
        return;
      }

      const ownerDocId = String(invite.ownerDocId || "").trim();
      const conciergerieUid = String(invite.conciergerieUid || "").trim();

      if(!ownerDocId || !conciergerieUid){
        badge.textContent = "Invitation invalide";
        showAlert("⛔ Invitation invalide (ownerDocId/conciergerieUid manquant).");
        finalizeRunning = false;
        return;
      }

      badge.textContent = "Finalisation…";

      // users/{uid}
      await setDoc(doc(db,"users", user.uid), {
        uid: user.uid,
        role: "proprietaire",
        email: userEmail,
        conciergerieUid,
        ownerDocId,
        inviteToken: token,
        updatedAt: serverTimestamp()
      }, { merge:true });

      // owners/{ownerDocId} : update safe (pile les clés autorisées par tes rules)
      await updateDoc(doc(db,"owners", ownerDocId), {
        uid: user.uid,
        status: "ACTIVE",
        acceptedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });

      // invites/{token} : owner finalise accepted
      await updateDoc(doc(db,"invites", token), {
        status: "accepted",
        usedOwnerUid: user.uid,
        usedAt: serverTimestamp()
      });

      const linked = await autoLinkHomes(conciergerieUid, userEmail, token, ownerDocId, user.uid);

      showAlert("✅ Compte lié. Logements liés : " + linked + "\nRedirection vers le profil…", true);
      setTimeout(profileRedirect, 600);

    }catch(err){
      console.error(err);
      badge.textContent = "Erreur";
      showAlert("Erreur finalisation : " + (err?.message || "inconnue"));
    }finally{
      finalizeRunning = false;
    }
  }

  async function loadInvite(){
    try{
      badge.textContent = "Vérification de l’invitation…";

      const snap = await getDoc(doc(db,"invites", token));
      if(!snap.exists()){
        badge.textContent = "Invitation introuvable";
        ownerCard.classList.remove("hidden");
        showAlert("⛔ Invitation introuvable.\nDemande à la conciergerie un nouveau lien.");
        return;
      }

      invite = snap.data() || {};

      const invEmail = normalizeEmail(invite.email || "");
      if(!invEmail){
        badge.textContent = "Invitation invalide";
        ownerCard.classList.remove("hidden");
        showAlert("⛔ Invitation invalide (email manquant).");
        return;
      }

      if(!invite.ownerDocId){
        badge.textContent = "Invitation invalide";
        ownerCard.classList.remove("hidden");
        showAlert("⛔ Invitation invalide (ownerDocId manquant). Régénère le lien.");
        return;
      }

      emailEl.value = invEmail;
      emailEl.readOnly = true;

      if(invite.name && !fullnameEl.value) fullnameEl.value = String(invite.name || "").trim();

      badge.textContent = "Invitation valide";
      ownerCard.classList.remove("hidden");

      if(authedUser){
        await finalize(authedUser);
      }

    }catch(err){
      console.error(err);
      badge.textContent = "Erreur";
      ownerCard.classList.remove("hidden");
      showAlert("Erreur chargement invitation : " + (err?.message || "inconnue"));
    }
  }

  form.addEventListener("submit", async (e)=>{
    e.preventDefault();
    if(!invite) return showAlert("⛔ Invitation non chargée. Recharge la page.");

    const email = normalizeEmail(emailEl.value);
    const fullname = (fullnameEl.value || "").trim();
    const phone = (phoneEl.value || "").trim();
    const pw = passwordEl.value || "";
    const pw2 = password2El.value || "";

    if(!fullname) return showAlert("Nom requis.");
    if(!isStrongPassword(pw)) return showAlert("Mot de passe faible : 8+ caractères, 1 lettre + 1 chiffre.");
    if(pw !== pw2) return showAlert("Les mots de passe ne correspondent pas.");

    createBtn.disabled = true;

    try{
      const cred = await createUserWithEmailAndPassword(auth, email, pw);

      // optionnel : compléter fullname/phone dans users et owners via profil ensuite (plus safe)
      // ici on finalise le lien immédiatement
      await finalize(cred.user);

    }catch(err){
      console.error(err);

      if(String(err?.code||"").includes("auth/email-already-in-use")){
        showAlert("⛔ Cet email a déjà un compte.\nClique “J’ai déjà un accès”, connecte-toi, puis réouvre ce lien.");
      }else{
        showAlert("Erreur création : " + (err?.message || "inconnue"));
      }
    }finally{
      createBtn.disabled = false;
    }
  });

  onAuthStateChanged(auth, async (user)=>{
    authedUser = user || null;
    if(user && invite){
      await finalize(user);
    }
  });

  await loadInvite();
</script>
</body>
</html>
