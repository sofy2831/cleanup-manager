<!-- docs/invite-proprietaire.html (FINAL STABLE — permissions fix + redirect profil obligatoire) -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanUp Manager – Invitation propriétaire</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{
margin:0;
font-family:Inter,system-ui;
background:linear-gradient(180deg,#F8F4FF,#EDE6FF);
}

.page{
max-width:700px;
margin:auto;
padding:16px;
}

.card{
background:#fff;
border-radius:18px;
padding:16px;
box-shadow:0 6px 20px rgba(0,0,0,.1);
margin-top:12px;
}

input{
width:100%;
padding:10px;
border-radius:12px;
border:1px solid #ccc;
margin-top:4px;
}

button{
margin-top:12px;
padding:12px;
border-radius:999px;
border:none;
font-weight:800;
background:linear-gradient(90deg,#7A5CFF,#6238FF);
color:#fff;
width:100%;
cursor:pointer;
}

.alert{
margin-top:10px;
padding:10px;
border-left:5px solid red;
background:#fff;
display:none;
}

.alert.ok{
border-left-color:green;
}

.hidden{display:none;}
</style>
</head>

<body>

<div class="page">

<h2>CleanUp Manager</h2>

<div id="badge">Chargement…</div>

<div class="card hidden" id="ownerCard">

<div id="alertOwner" class="alert"></div>

<form id="inviteForm">

<label>Email</label>
<input id="email" required>

<label>Nom</label>
<input id="fullname" required>

<label>Téléphone</label>
<input id="phone">

<label>Mot de passe</label>
<input id="password" type="password" required>

<label>Confirmer mot de passe</label>
<input id="password2" type="password" required>

<button id="createBtn">Créer mon accès</button>

</form>

</div>

</div>

<script type="module">

import { auth, db } from "./firebase-init.js";

import {
onAuthStateChanged,
createUserWithEmailAndPassword,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

import {
doc,
getDoc,
setDoc,
updateDoc,
serverTimestamp,
collection,
query,
where,
getDocs,
writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";


function showAlert(msg, ok=false){
const el=document.getElementById("alertOwner");
el.style.display="block";
el.textContent=msg;
el.classList.toggle("ok",ok);
}

function getParam(n){
return new URLSearchParams(location.search).get(n)||"";
}

function normalizeEmail(e){
return e.trim().toLowerCase();
}

const token=getParam("token");

const emailEl=document.getElementById("email");
const fullnameEl=document.getElementById("fullname");
const phoneEl=document.getElementById("phone");
const passwordEl=document.getElementById("password");
const password2El=document.getElementById("password2");
const form=document.getElementById("inviteForm");

let invite=null;
let ownerUser=null;


function profileRedirect(){

location.href="profil-proprietaire.html?self=1&token="+token;

}



async function autoLinkHomes(conciergerieUid,email,token,ownerDocId,ownerUid){

const q=query(
collection(db,"homes"),
where("pendingInviteToken","==",token),
where("pendingOwnerEmail","==",email)
);

const snap=await getDocs(q);

const batch=writeBatch(db);

snap.forEach(d=>{

batch.update(d.ref,{
ownerUid:ownerUid,
ownerDocId:ownerDocId,
ownerLinkStatus:"LINKED",
pendingInviteToken:"",
pendingOwnerEmail:"",
updatedAt:serverTimestamp()
});

});

await batch.commit();

return snap.size;

}



async function finalize(user){

if(!invite)return;

const ownerDocId=invite.ownerDocId;
const email=user.email;
const conciergerieUid=invite.conciergerieUid;

await setDoc(doc(db,"users",user.uid),{

uid:user.uid,
role:"proprietaire",
email:email,
conciergerieUid,
ownerDocId,
inviteToken:token,
updatedAt:serverTimestamp()

},{merge:true});

await updateDoc(doc(db,"owners",ownerDocId),{

uid:user.uid,
status:"ACTIVE",
acceptedAt:serverTimestamp(),
updatedAt:serverTimestamp()

});

await updateDoc(doc(db,"invites",token),{

status:"accepted",
usedOwnerUid:user.uid,
usedAt:serverTimestamp()

});

await autoLinkHomes(conciergerieUid,email,token,ownerDocId,user.uid);

showAlert("Compte lié. Redirection profil…",true);

setTimeout(profileRedirect,800);

}



async function loadInvite(){

const snap=await getDoc(doc(db,"invites",token));

if(!snap.exists()){

showAlert("Invitation invalide");
return;

}

invite=snap.data();

emailEl.value=invite.email;
emailEl.readOnly=true;

document.getElementById("ownerCard").classList.remove("hidden");

}



form.addEventListener("submit",async e=>{

e.preventDefault();

const email=normalizeEmail(emailEl.value);

const password=passwordEl.value;

if(password!==password2El.value){

showAlert("Mot de passe différent");
return;

}

try{

const cred=await createUserWithEmailAndPassword(auth,email,password);

await finalize(cred.user);

}catch(e){

if(e.code==="auth/email-already-in-use"){

showAlert("Compte existant. Connecte-toi puis réouvre ce lien.");

}else{

showAlert(e.message);

}

}

});



onAuthStateChanged(auth,async user=>{

ownerUser=user;

if(user && invite){

await finalize(user);

}

});



loadInvite();

</script>

</body>
</html>
