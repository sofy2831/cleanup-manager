<!-- docs/messagerie.html (INBOX — conciergerie : liste des propriétaires / threads — SANS création manuelle) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Messagerie</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 96px; }
    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none; font-weight:900; font-size:13px;
      cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .logo-title{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; margin-bottom:6px; text-align:center; }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:22px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; font-weight:850; }
    .companyLine{ margin-top:6px; font-size:13px; color:var(--muted); font-weight:950; text-align:center; }

    .wrap{ width:100%; max-width:980px; margin-top:14px; display:flex; flex-direction:column; gap:12px; min-width:0; }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
      font-weight:900;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .toolbar{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      align-items:center;
      min-width:0;
    }

    .searchbar{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      min-width:0;
    }
    .s-ico{ font-size:14px; opacity:.75; }
    .input{
      flex:1;
      border:none;
      outline:none;
      font-size:13px;
      font-weight:900;
      color:#111;
      background:transparent;
      min-width:0;
    }

    .threadList{ display:flex; flex-direction:column; gap:10px; }
    .thread{
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:16px;
      padding:12px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      gap:10px;
      min-width:0;
    }
    .thread:hover{ border-color: rgba(122,92,255,0.32); }
    .tLeft{ min-width:0; display:flex; flex-direction:column; gap:4px; }
    .tTitle{ font-size:13px; font-weight:1000; color:#111; }
    .tSub{ font-size:12px; font-weight:900; color:#666; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 560px; }
    .tMeta{ font-size:11px; font-weight:900; color:#777; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .pillUnread{
      display:inline-flex; align-items:center; justify-content:center;
      min-width:22px; height:22px; padding:0 7px;
      border-radius:999px;
      background:rgba(122,92,255,0.12);
      border:1px solid rgba(122,92,255,0.25);
      color:var(--violet);
      font-weight:1000; font-size:12px;
    }
    .muted{ color:#777; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; gap: 6px; justify-content: space-around; align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none;
      font-size: 11px; font-weight: 900; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        width: 100%;
        max-width: 980px;
        margin: 14px 0 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px;
        gap: 10px;
      }
      .bottom-nav a{ font-size: 13px; padding: 12px 12px; }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="conciergerie.html">← Tableau de bord</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon">✓</div>
      <h1>Messagerie</h1>
    </div>
    <div class="subtitle">Conversations propriétaires ↔ conciergerie</div>
    <div class="companyLine" id="companyLine">—</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="card">
        <div class="toolbar">
          <div class="searchbar">
            <span class="s-ico">🔎</span>
            <input class="input" id="searchInput" type="search" placeholder="Rechercher un propriétaire…" autocomplete="off" />
          </div>
        </div>
        <div style="margin-top:10px; font-size:12px; color:#666; font-weight:850;">
          Les conversations apparaissent automatiquement après acceptation de l’invitation.
        </div>
      </div>

      <div class="card">
        <div class="threadList" id="threadList"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a class="active" href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, doc, getDoc,
      query, where, orderBy, onSnapshot
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const companyLine = document.getElementById("companyLine");
    const alertBox = document.getElementById("alertBox");
    const searchInput = document.getElementById("searchInput");
    const threadList = document.getElementById("threadList");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtTs(ts){
      try{
        const d = ts?.toDate ? ts.toDate() : null;
        if(!d) return "—";
        return d.toLocaleString("fr-FR", { day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit" });
      }catch{ return "—"; }
    }
    function trunc(s,n){
      const x = String(s ?? "");
      return x.length > n ? x.slice(0,n-1) + "…" : x;
    }

    let allThreads = [];
    let unsub = null;

    async function loadCompanyName(uid){
      try{
        const snap = await getDoc(doc(db,"users",uid));
        const name = snap.exists() ? String(snap.data()?.businessProfile?.companyName || "").trim() : "";
        companyLine.textContent = name || "Conciergerie";
      }catch{
        companyLine.textContent = "Conciergerie";
      }
    }

    function render(){
      const q = String(searchInput.value || "").trim().toLowerCase();
      threadList.innerHTML = "";

      const sorted = allThreads.slice().sort((a,b)=>{
        const ta = a.lastAt?.seconds ?? 0;
        const tb = b.lastAt?.seconds ?? 0;
        return tb - ta;
      });

      const filtered = !q ? sorted : sorted.filter(t=>{
        const hay = [
          t.ownerName, t.ownerEmailLower, t.lastText,
          t.ownerDocId
        ].filter(Boolean).join(" ").toLowerCase();
        return hay.includes(q);
      });

      if(!filtered.length){
        threadList.innerHTML = `<div class="muted" style="font-weight:900;">Aucune conversation.</div>`;
        return;
      }

      for(const t of filtered){
        const unread = Number(t.unreadForConciergerie || 0);
        const ownerName = String(t.ownerName || "Propriétaire").trim();
        const last = String(t.lastText || "").trim();
        const meta = [
          (Number(t.homeCount || 0) ? `${Number(t.homeCount)} logement(s)` : ""),
          (t.lastAt ? fmtTs(t.lastAt) : "")
        ].filter(Boolean).join(" • ");

        const row = document.createElement("div");
        row.className = "thread";
        row.onclick = ()=> {
          location.href = `messagerie.conv.html?threadId=${encodeURIComponent(t.id)}`;
        };

        row.innerHTML = `
          <div class="tLeft">
            <div class="tTitle">${esc(ownerName)}</div>
            <div class="tSub" title="${esc(last)}">${esc(trunc(last || "—", 80))}</div>
            <div class="tMeta">${esc(meta || "—")}</div>
          </div>
          <div style="display:flex; align-items:flex-start; gap:8px;">
            ${unread ? `<div class="pillUnread">${unread}</div>` : ``}
          </div>
        `;
        threadList.appendChild(row);
      }
    }

    searchInput.addEventListener("input", render);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }

      await loadCompanyName(user.uid);

      if(unsub) unsub();
      allThreads = [];
      hideAlert();
      render();

      const qThreads = query(
        collection(db,"threads"),
        where("conciergerieUid","==", user.uid),
        orderBy("lastAt","desc")
      );

      unsub = onSnapshot(qThreads, (snap)=>{
        allThreads = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));
        render();
      }, (err)=>{
        showAlert("Erreur lecture threads : " + (err?.message || "inconnue"));
      });
    });
  </script>
</body>
</html>
