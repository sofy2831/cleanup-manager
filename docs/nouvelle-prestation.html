<!-- docs/nouvelle-prestation.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Nouvelle prestation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --violet-light:#F3ECFF;
      --text:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    *,*::before,*::after{ box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body{
      margin:0;
      background: linear-gradient(180deg,#F8F4FF 0%,#EDE6FF 80%);
      color:var(--text);
    }
    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }
    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      text-decoration:none;
      font-weight:800;
      font-size:13px;
      white-space:nowrap;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }

    .logo-title{
      display:flex; justify-content:center; align-items:center;
      gap:10px; margin-top:10px; margin-bottom:6px; text-align:center;
    }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff;border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color: var(--violet-main);
      font-size:22px;font-weight:900;
      position:relative;flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:26px; font-weight:900; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }
    .emailLine{ margin-top:4px; font-size:13px; color:var(--muted); font-weight:800; text-align:center; }

    .alert{
      width:100%;
      max-width:980px;
      display:none;
      margin-top:12px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .layout{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    @media(min-width:860px){
      .layout{ flex-direction:row; align-items:flex-start; }
    }

    .card{
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 14px;
    }
    .left{ flex:1.05; }
    .right{ flex:1; }

    .card-title{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      font-weight:800; font-size:15px;
      margin-bottom:10px;
    }
    .tiny{ font-size:12px; color:var(--muted); font-weight:800; line-height:1.35; }

    .kv{
      margin-top:10px;
      display:grid;
      grid-template-columns: 1fr;
      gap:8px;
      font-size:13px;
      color:#333;
    }
    .kv b{ font-weight:800; }

    .tag{
      display:inline-flex;
      align-items:center;
      gap:6px;
      font-size:11px;
      padding:2px 8px;
      border-radius:999px;
      background:var(--violet-light);
      color:#5b45c8;
      font-weight:800;
      white-space:nowrap;
    }

    form{ display:flex; flex-direction:column; gap:10px; }
    label{ font-size:12px; font-weight:800; color:#333; text-align:left; }
    input, select, textarea{
      width:100%;
      padding:10px 10px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      outline:none;
      font-size:13px;
      background:#fff;
    }
    input:focus, select:focus, textarea:focus{
      border-color:var(--violet-main);
      box-shadow:0 0 0 3px rgba(122,92,255,.12);
    }
    textarea{ resize:vertical; }
    .inline{ display:flex; gap:10px; flex-wrap:wrap; }
    .inline > div{ flex:1; min-width:160px; }

    .hintline{
      margin-top:6px;
      font-size:11px;
      font-weight:600;
      color:#777;
    }
    .hintline .sugg{
      color:#777;
      background: rgba(0,0,0,0.03);
      padding:2px 8px;
      border-radius:999px;
      display:inline-flex;
      gap:6px;
      align-items:center;
      font-weight:600;
    }

    .btn{
      width:100%;
      border:none;
      border-radius:999px;
      padding:12px 14px;
      font-size:13px;
      font-weight:800;
      cursor:pointer;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }
    .btn.ghost{
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .lines{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .line-item{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }
    .li-main{ min-width:0; }
    .li-title{ font-weight:900; font-size:13px; color:#222; }
    .li-sub{ margin-top:2px; font-size:12px; color:#666; font-weight:800; }
    .li-sub b{ font-weight:900; color:#333; }
    .li-note{ margin-top:6px; font-size:12px; color:#666; font-weight:800; white-space:pre-wrap; }

    .li-actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; flex-shrink:0; }
    .mini-btn{
      border:none;
      border-radius:999px;
      padding:8px 10px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      background:var(--violet-light);
      color:#5b45c8;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .mini-btn.red{ background:#ffe3ec; color:var(--bad); }
    .mini-btn.ghost{ background:#fff; border:2px solid var(--violet-main); color:var(--violet-main); }

    .totals{
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      font-weight:900;
    }
    .totals .mut{ font-weight:800; color:#666; }

    .bottom-nav{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      gap: 6px;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 800;
      color: #666;
      padding: 10px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }

    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        max-width: 980px;
        margin: 12px auto 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow: 0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
    @media (max-width: 520px){
      .page{ padding-left:12px; padding-right:12px; }
      html, body{ overflow-x:hidden; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="planning.html">← Retour planning</a>
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>

    <div class="logo-title">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>
    <div class="subtitle">Créer une prestation</div>
    <div class="emailLine" id="emailLine">—</div>

    <div class="alert" id="alertBox"></div>

    <div class="layout">
      <div class="card left">
        <div class="card-title">
          <span>Contexte</span>
          <span class="tag" id="contextTag">—</span>
        </div>
        <div class="kv" id="contextKv"></div>
      </div>

      <div class="card right">
        <div class="card-title">
          <span>Nouvelle prestation</span>
          <span class="tiny" id="homeLabel">—</span>
        </div>

        <form id="jobForm" autocomplete="off" novalidate>
          <div class="inline">
            <div>
              <label for="dateKeyInput">Date (prestation)</label>
              <input id="dateKeyInput" type="date" required />
            </div>
            <div>
              <label for="arrivalTimeInput">Arrivée (heure)</label>
              <input id="arrivalTimeInput" type="time" />
            </div>
          </div>

          <div class="inline" style="margin-top:10px;">
            <div>
              <label for="departureDateKeyInput">Départ (date)</label>
              <input id="departureDateKeyInput" type="date" />
            </div>

            <div>
              <label for="departureTimeInput">Départ (heure)</label>
              <input id="departureTimeInput" type="time" />
            </div>
          </div>

          <!-- champ time conservé pour compat code/payload, mais invisible -->
          <input id="time" type="time" style="display:none" aria-hidden="true" tabindex="-1"/>

          <div class="inline">
            <div>
              <label for="ownerName">Nom propriétaire</label>
              <input id="ownerName" type="text" placeholder="Ex. Mme Dupont" />
            </div>
            <div>
              <label for="ownerPhone">Téléphone propriétaire</label>
              <input id="ownerPhone" type="tel" placeholder="Ex. 06 12 34 56 78" />
            </div>
          </div>

          <div class="inline">
            <div>
              <label for="jobNote">Note globale (optionnel)</label>
              <input id="jobNote" type="text" placeholder="Ex. urgence, voyageurs exigeants…" />
            </div>
          </div>

          <div style="height:8px"></div>

          <div class="card-title" style="margin:0;">
            <span>Lignes</span>
          </div>

          <div>
            <label for="productSelect">Prestation</label>
            <select id="productSelect">
              <option value="">— Choisir —</option>
            </select>
          </div>

          <div id="otherNameWrap" style="display:none;">
            <label for="otherName">Nom du produit (si “Autre”)</label>
            <input id="otherName" type="text" placeholder="Ex. Déplacement / accueil spécial…" />
          </div>

          <div class="inline">
            <div>
              <label for="qty">Quantité</label>
              <input id="qty" type="number" min="0" step="0.25" value="1" required />
            </div>
            <div>
              <label for="unit">Unité</label>
              <select id="unit" required>
                <option value="unité">unité</option>
                <option value="heure">heure</option>
                <option value="passage">passage</option>
                <option value="kit">kit</option>
                <option value="supplément">supplément</option>
                <option value="mois">mois</option>
                <option value="autre">autre</option>
              </select>
            </div>
          </div>

          <div class="inline">
            <div>
              <label for="unitPrice">Prix unitaire (ton prix)</label>
              <input id="unitPrice" type="number" min="0" step="0.01" placeholder="Ex. 60" />
              <div class="hintline" id="suggestLine" style="display:none;">
                <span class="sugg">💡 conseillé : <span id="suggestText">—</span></span>
              </div>
            </div>
            <div>
              <label for="lineNote">Note ligne (optionnel)</label>
              <input id="lineNote" type="text" placeholder="Ex. inter-séjour, non conforme…" />
            </div>
          </div>

          <div class="inline">
            <div style="flex:1.2;">
              <label for="category">Catégorie</label>
              <select id="category">
                <option value="Essentiel">Essentiel</option>
                <option value="Ménage">Ménage</option>
                <option value="Linge">Linge</option>
                <option value="Check-in/out">Check-in/out</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Messages voyageurs">Messages voyageurs</option>
                <option value="Kits & consommables">Kits & consommables</option>
                <option value="Autre">Autre</option>
              </select>
            </div>
            <div style="flex:.8; display:flex; align-items:flex-end;">
              <button class="btn ghost" type="button" id="addLineBtn">+ Ajouter la ligne</button>
            </div>
          </div>

          <div class="lines" id="linesList"></div>

          <div class="totals">
            <div>
              <div class="mut">Total prestation</div>
              <div id="totalLabel">0,00 €</div>
            </div>
            <div class="mut" id="linesCount">0 ligne</div>
          </div>

          <button class="btn primary" type="submit" id="saveBtn">Enregistrer</button>
        </form>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="logements.html">Logements</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, addDoc, updateDoc, writeBatch,
      collection, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ========= UI =========
    const emailLine = document.getElementById("emailLine");
    const logoutBtn = document.getElementById("logoutBtn");
    const alertBox = document.getElementById("alertBox");

    const contextTag = document.getElementById("contextTag");
    const contextKv = document.getElementById("contextKv");
    const homeLabel = document.getElementById("homeLabel");

    const formEl = document.getElementById("jobForm");
    const dateKeyInput = document.getElementById("dateKeyInput");
    const timeEl = document.getElementById("time"); // caché (compat payload)

    const arrivalTimeInput = document.getElementById("arrivalTimeInput");
    const departureDateKeyInput = document.getElementById("departureDateKeyInput");
    const departureTimeInput = document.getElementById("departureTimeInput");

    const ownerNameEl = document.getElementById("ownerName");
    const ownerPhoneEl = document.getElementById("ownerPhone");
    const jobNoteEl = document.getElementById("jobNote");

    const productSelect = document.getElementById("productSelect");
    const otherNameWrap = document.getElementById("otherNameWrap");
    const otherNameEl = document.getElementById("otherName");
    const qtyEl = document.getElementById("qty");
    const unitEl = document.getElementById("unit");
    const unitPriceEl = document.getElementById("unitPrice");
    const lineNoteEl = document.getElementById("lineNote");
    const categoryEl = document.getElementById("category");
    const addLineBtn = document.getElementById("addLineBtn");

    const suggestLine = document.getElementById("suggestLine");
    const suggestText = document.getElementById("suggestText");

    const linesList = document.getElementById("linesList");
    const totalLabel = document.getElementById("totalLabel");
    const linesCount = document.getElementById("linesCount");

    const saveBtn = document.getElementById("saveBtn");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      location.href = "index.html";
    });

    // ========= Guard =========
    const FREE_EMAILS = new Set(["mathilde.debout31@gmail.com","s.dumas974@gmail.com"]);
    async function guardConciergerie(user){
      const email = (user.email || "").toLowerCase();
      if(FREE_EMAILS.has(email)) return true;
      try{
        const snap = await getDoc(doc(db,"users",user.uid));
        if(!snap.exists()) return false;
        const d = snap.data() || {};
        return (d.role === "conciergerie" || d.role === "admin") && d.subscriptionStatus === "active";
      }catch(e){ return false; }
    }

    // ========= Params =========
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    const homeId          = getParam("homeId");
    const from            = getParam("from") || "manual";
    const icalEventId     = getParam("icalEventId");
    const summary         = getParam("summary");
    const timeParam       = getParam("time");
    const dateKeyParam    = getParam("dateKey");
    const ownerNameParam  = getParam("ownerName");
    const noteParam       = getParam("note");
    const homeTypeParam   = getParam("homeType");

    // ========= Produits (suggestions) =========
    const PRODUCT_TEMPLATES = [
      { key:"MENAGE_STANDARD", label:"Ménage standard (inter-séjour)", category:"Ménage", suggested:"Ex. 45€ (studio/1ch) • 60€ (2ch) • 75€ (3ch) • 90€ (4ch)", unit:"unité" },
      { key:"MENAGE_INTERMEDIAIRE", label:"Ménage intermédiaire (long séjour)", category:"Ménage", suggested:"Ex. +15€ supplément Long séjour", unit:"supplément" },
      { key:"BACK_TO_BACK", label:"Back-to-back (ménage en urgence)", category:"Ménage", suggested:"Ex. +20€ supplément Urgence", unit:"supplément" },
      { key:"REMISE_EN_ETAT", label:"Remise en état (logement non conforme)", category:"Ménage", suggested:"Ex. +25€ supplément Non conforme", unit:"supplément" },

      { key:"RECHANGE_LINGE", label:"Rechange linge (rotation complète)", category:"Linge", suggested:"Ex. 15€ par passage Rotation", unit:"passage" },
      { key:"LAVAGE_SECHAGE", label:"Collecte + lavage + séchage", category:"Linge", suggested:"Ex. 25€ par rotation", unit:"unité" },
      { key:"BLANCHISSERIE", label:"Dépose / reprise blanchisserie", category:"Linge", suggested:"Ex. 20€ par rotation", unit:"unité" },

      { key:"CHECKIN_AUTONOME", label:"Check-in autonome (boîte à clés)", category:"Check-in/out", suggested:"Ex. 0€ inclus", unit:"passage" },
      { key:"CHECKIN_PHYSIQUE", label:"Check-in physique", category:"Check-in/out", suggested:"Ex. 20€ par passage", unit:"passage" },
      { key:"CHECKOUT", label:"Check-out", category:"Check-in/out", suggested:"Ex. 15€ par passage", unit:"passage" },
      { key:"GESTION_CLES", label:"Gestion clés / badges", category:"Check-in/out", suggested:"Ex. 10€ par intervention", unit:"unité" },
      { key:"RECUP_CLES", label:"Récupération clés après sortie", category:"Check-in/out", suggested:"Ex. 10€ par passage", unit:"passage" },

      { key:"PETITE_MAINTENANCE", label:"Petite maintenance (ampoule, joint…)", category:"Maintenance", suggested:"Ex. 15€ par intervention", unit:"unité" },
      { key:"URGENCE", label:"Intervention d’urgence (fuite, serrure)", category:"Maintenance", suggested:"Ex. 40€ par intervention", unit:"unité" },
      { key:"COORD_ARTISANS", label:"Coordination artisans", category:"Maintenance", suggested:"Ex. 30€ par coordination (hors coût artisan)", unit:"unité" },

      { key:"MESSAGES", label:"Réponses messages voyageurs", category:"Messages voyageurs", suggested:"Ex. 19€/logement/mois (20 mess) + 1,20€/mess supp", unit:"mois" },

      { key:"KIT_ESSENTIEL", label:"Kit essentiel", category:"Kits & consommables", suggested:"Ex. 5€ par kit", unit:"kit" },
      { key:"KIT_CUISINE", label:"Kit cuisine", category:"Kits & consommables", suggested:"Ex. 7€ par kit", unit:"kit" },
      { key:"KIT_BAIN", label:"Kit bain", category:"Kits & consommables", suggested:"Ex. 4€ par kit", unit:"kit" },
      { key:"KIT_SEJOUR_2", label:"Kit séjour (Pack 2 pers)", category:"Kits & consommables", suggested:"Ex. 14€ par kit", unit:"kit" },
      { key:"KIT_SEJOUR_4", label:"Kit séjour (Pack 4 pers)", category:"Kits & consommables", suggested:"Ex. 28€ par kit", unit:"kit" },
      { key:"KIT_SEJOUR_6", label:"Kit séjour (Pack 6 pers)", category:"Kits & consommables", suggested:"Ex. 42€ par kit", unit:"kit" },
      { key:"KIT_SEJOUR_8", label:"Kit séjour (Pack 8 pers)", category:"Kits & consommables", suggested:"Ex. 56€ par kit", unit:"kit" },
      { key:"REASSORT", label:"Réassort produit unitaire (papier, café…)", category:"Kits & consommables", suggested:"Ex. 1,20€ par unité", unit:"unité" },

      { key:"__OTHER__", label:"Autre (texte libre)", category:"Autre", suggested:"", unit:"unité" }
    ];

    // ========= Data =========
    let currentUser = null;
    let currentHome = null;

    let lines = [];
    let editingIndex = -1;

    let createdEventId = null;
    let createdEventRef = null;

    // info séjour (source = icalEvents si from=ical)
    let stay = {
      arrivalDateKey: "",
      departureDateKey: "",
      arrivalTime: "",
      departureTime: "",
      timezone: "Europe/Paris"
    };

    function escapeHtml(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }

    function pad2(n){ return String(n).padStart(2,"0"); }
    function todayKey(){
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
    }

    function cleanPhone(s){
      return (s||"").toString().trim().replace(/\s+/g," ");
    }

    // ✅ INTÉGRATION LOGEMENT
    async function loadHome(){
      if(!homeId) throw new Error("homeId manquant (URL). Exemple : nouvelle-prestation.html?homeId=XXXX");
      const snap = await getDoc(doc(db, "homes", homeId));
      if(!snap.exists()) throw new Error("Logement introuvable (homeId).");

      const d = snap.data() || {};
      const address = (d.address || d.homeAddress || d.adresse || d.locationAddress || "").toString().trim();
      const zip = (d.zip || d.homeZip || d.postalCode || "").toString().trim();

      currentHome = {
        id: snap.id,
        ...d,
        homeType: (d.homeType || d.type || d.kind || homeTypeParam || "").toString().trim(),
        homeAddress: address,
        homeZip: zip,
        city: (d.city || d.homeCity || "").toString().trim(),
        name: (d.name || d.homeName || "").toString().trim(),
        ownerPhone: cleanPhone(d.ownerPhone || d.phone || d.ownerTel || "")
      };
      currentHome.ownerDocId = (d.ownerDocId || "").toString().trim(); // owners/{docId}
      currentHome.ownerUid   = (d.ownerUid || "").toString().trim();   // Firebase uid du owner (si stocké proprement)
      currentHome.ownerEmail = (d.ownerEmail || d.ownerAccountEmail || "").toString().trim();

      currentHome.ownerAddress1 = (d.ownerAddress1 || "").toString().trim();
      currentHome.ownerAddress2 = (d.ownerAddress2 || "").toString().trim();
      currentHome.ownerZip      = (d.ownerZip || d.zip || "").toString().trim();
      currentHome.ownerCity     = (d.ownerCity || d.city || "").toString().trim();
      currentHome.ownerCountry  = (d.ownerCountry || d.country || "FR").toString().trim();


      
      // backfill champs formulaire si vides
      if(!ownerNameEl.value.trim() && (currentHome.ownerName || "").trim()) ownerNameEl.value = currentHome.ownerName;
      if(!ownerPhoneEl.value.trim() && (currentHome.ownerPhone || "").trim()) ownerPhoneEl.value = currentHome.ownerPhone;
    }

    // ✅ LECTURE ICAL EVENT (source de vérité)
    async function loadIcalEventIfAny(){
      if(!(from === "ical" && icalEventId)) return null;

      const snap = await getDoc(doc(db, "icalEvents", icalEventId));
      if(!snap.exists()) return null;

      const d = snap.data() || {};

      // sécurité logique (pas des rules)
      if(d.conciergerieUid && currentUser?.uid && d.conciergerieUid !== currentUser.uid) return null;

      return { id: snap.id, ...d };
    }

    function buildProductSelect(){
      const byCat = new Map();
      for(const p of PRODUCT_TEMPLATES){
        const cat = p.category || "Autre";
        if(!byCat.has(cat)) byCat.set(cat, []);
        byCat.get(cat).push(p);
      }
      const catOrder = ["Ménage","Linge","Check-in/out","Maintenance","Messages voyageurs","Kits & consommables","Essentiel","Autre"];
      const cats = Array.from(byCat.keys()).sort((a,b)=>{
        const ia = catOrder.indexOf(a); const ib = catOrder.indexOf(b);
        if(ia === -1 && ib === -1) return a.localeCompare(b);
        if(ia === -1) return 1;
        if(ib === -1) return -1;
        return ia - ib;
      });
      productSelect.innerHTML = `<option value="">— Choisir —</option>` + cats.map(cat=>{
        const opts = (byCat.get(cat) || []).map(p=>{
          return `<option value="${escapeHtml(p.key)}">${escapeHtml(p.label)}</option>`;
        }).join("");
        return `<optgroup label="${escapeHtml(cat)}">${opts}</optgroup>`;
      }).join("");
    }

    function getTemplateByKey(key){
      return PRODUCT_TEMPLATES.find(p=>p.key === key) || null;
    }

    function refreshSuggest(){
      const key = productSelect.value;
      const t = getTemplateByKey(key);
      if(!t){
        suggestLine.style.display = "none";
        otherNameWrap.style.display = "none";
        otherNameEl.value = "";
        return;
      }
      if(key === "__OTHER__"){
        otherNameWrap.style.display = "block";
      }else{
        otherNameWrap.style.display = "none";
        otherNameEl.value = "";
      }
      if(t.category && t.category !== "Autre") categoryEl.value = t.category;
      if(t.unit) unitEl.value = t.unit;
      if(t.suggested){
        suggestText.textContent = t.suggested;
        suggestLine.style.display = "block";
      }else{
        suggestLine.style.display = "none";
      }
    }

    function computeTotal(){
      return lines.reduce((sum, l)=> sum + (Number(l.qty)||0) * (Number(l.unitPrice)||0), 0);
    }

    function renderLines(){
      linesList.innerHTML = "";
      if(!lines.length){
        const empty = document.createElement("div");
        empty.style.background = "#fff";
        empty.style.borderRadius = "14px";
        empty.style.boxShadow = "0 3px 10px rgba(0,0,0,.06)";
        empty.style.padding = "12px";
        empty.style.color = "#666";
        empty.style.fontWeight = "900";
        empty.style.fontSize = "12px";
        empty.textContent = "Aucune ligne. Ajoute au moins une prestation.";
        linesList.appendChild(empty);
      }else{
        lines.forEach((l, idx)=>{
          const total = (Number(l.qty)||0) * (Number(l.unitPrice)||0);
          const div = document.createElement("div");
          div.className = "line-item";
          div.innerHTML = `
            <div class="li-main">
              <div class="li-title">${escapeHtml(l.label || "Ligne")}</div>
              <div class="li-sub">
                <b>${escapeHtml(String(l.qty))}</b> ${escapeHtml(l.unit || "unité")}
                • ${escapeHtml(money(l.unitPrice))} / ${escapeHtml(l.unit || "unité")}
                • total <b>${escapeHtml(money(total))}</b>
              </div>
              ${l.category ? `<div class="li-sub">Catégorie : <b>${escapeHtml(l.category)}</b></div>` : ``}
              ${l.note ? `<div class="li-note">${escapeHtml(l.note)}</div>` : ``}
            </div>
            <div class="li-actions">
              <button class="mini-btn ghost" type="button" data-edit="${idx}">Modifier</button>
              <button class="mini-btn red" type="button" data-del="${idx}">Supprimer</button>
            </div>
          `;
          linesList.appendChild(div);
        });

        linesList.querySelectorAll("button[data-del]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const i = Number(btn.getAttribute("data-del"));
            lines.splice(i, 1);
            if(editingIndex === i) editingIndex = -1;
            renderLines();
            refreshTotals();
          });
        });

        linesList.querySelectorAll("button[data-edit]").forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const i = Number(btn.getAttribute("data-edit"));
            const l = lines[i];
            if(!l) return;
            editingIndex = i;
            const found = PRODUCT_TEMPLATES.find(p=>p.label === l.label);
            productSelect.value = found ? found.key : "__OTHER__";
            refreshSuggest();
            if(productSelect.value === "__OTHER__") otherNameEl.value = l.label || "";
            qtyEl.value = String(l.qty ?? 1);
            unitEl.value = l.unit || "unité";
            unitPriceEl.value = String(l.unitPrice ?? "");
            lineNoteEl.value = l.note || "";
            categoryEl.value = l.category || "Autre";
            addLineBtn.textContent = "Mettre à jour la ligne";
            showAlert("Mode édition : modifie puis clique “Mettre à jour la ligne”.", true);
          });
        });
      }
      linesCount.textContent = lines.length + (lines.length > 1 ? " lignes" : " ligne");
    }

    function refreshTotals(){
      totalLabel.textContent = money(computeTotal());
    }

    function resetLineBuilder(){
      productSelect.value = "";
      otherNameWrap.style.display = "none";
      otherNameEl.value = "";
      qtyEl.value = "1";
      unitEl.value = "unité";
      unitPriceEl.value = "";
      lineNoteEl.value = "";
      categoryEl.value = "Essentiel";
      suggestLine.style.display = "none";
      editingIndex = -1;
      addLineBtn.textContent = "+ Ajouter la ligne";
    }

    function validateLineInputs(){
      const key = (productSelect.value || "").trim();
      if(!key) return { ok:false, msg:"Choisis une prestation." };
      let label = "";
      if(key === "__OTHER__"){
        label = (otherNameEl.value || "").trim();
        if(!label) return { ok:false, msg:"Renseigne le nom du produit (Autre)." };
      }else{
        const t = getTemplateByKey(key);
        label = t?.label || "";
        if(!label) return { ok:false, msg:"Prestation invalide." };
      }
      const qty = Number(qtyEl.value);
      if(!(qty > 0)) return { ok:false, msg:"Quantité invalide." };
      const unit = (unitEl.value || "").trim() || "unité";
      const unitPrice = Number(unitPriceEl.value);
      if(!(unitPrice >= 0)) return { ok:false, msg:"Prix unitaire invalide." };
      const category = (categoryEl.value || "").trim();
      const note = (lineNoteEl.value || "").trim();
      const tpl = getTemplateByKey(key);
      const suggested = tpl?.suggested || "";
      return {
        ok:true,
        line: { label, qty, unit, unitPrice, category: category || "", note, suggestedPrice: suggested }
      };
    }

    function renderContext(){
      contextTag.textContent = (from === "ical") ? "Réservation" : "Création manuelle";

      const ht = (currentHome?.homeType || "").trim();
      const homeText = currentHome
        ? (currentHome.name
           + (currentHome.city ? " — " + currentHome.city : "")
           + (ht ? ` (${ht})` : ""))
        : "—";

      const ownerName = (ownerNameEl.value || currentHome?.ownerName || "—").trim() || "—";
      const ownerPhone = cleanPhone(ownerPhoneEl.value || currentHome?.ownerPhone || "") || "—";

      const addr = (currentHome?.homeAddress || "").trim();
      const zip = (currentHome?.homeZip || "").trim();

      const rows = [];
      rows.push(`<div><b>Logement</b> : ${escapeHtml(homeText)}</div>`);
      if(addr || zip){
        const adr = [addr, zip, (currentHome?.city || "").trim()].filter(Boolean).join(", ");
        rows.push(`<div><b>Adresse</b> : ${escapeHtml(adr || "—")}</div>`);
      }
      if(ht) rows.push(`<div><b>Type</b> : ${escapeHtml(ht)}</div>`);
      rows.push(`<div><b>Propriétaire</b> : ${escapeHtml(ownerName)} • ${escapeHtml(ownerPhone)}</div>`);

      rows.push(`<div><b>Arrivée</b> : ${escapeHtml(stay.arrivalDateKey || "—")} • ${escapeHtml(arrivalTimeInput.value || "—")}</div>`);
      rows.push(`<div><b>Départ</b> : ${escapeHtml(departureDateKeyInput.value || "—")} • ${escapeHtml(departureTimeInput.value || "—")}</div>`);

      if(summary) rows.push(`<div><b>Réservation</b> : ${escapeHtml(summary)}</div>`);
      if(noteParam) rows.push(`<div><b>Note</b> : ${escapeHtml(noteParam)}</div>`);

      contextKv.innerHTML = rows.join("");
      homeLabel.textContent = homeText + (addr ? " • " + addr : "");
    }

    function lockUI(locked){
      saveBtn.disabled = !!locked;
      addLineBtn.disabled = !!locked;
    }

    async function createDefaultMissions(eventId, payloadForMissions){
      const ids = ["CHECKIN","MENAGE","CHECKOUT"];
      const batch = writeBatch(db);
      const now = serverTimestamp();

      for(const mid of ids){
        const mRef = doc(db, "events", eventId, "missions", mid);
        batch.set(mRef, {
          conciergerieUid: payloadForMissions.conciergerieUid,
          eventId: eventId,
          missionId: mid,
          type: mid,
          status: "A_FAIRE",
          locked: false,

          homeId: payloadForMissions.homeId,
          homeName: payloadForMissions.homeName,
          homeCity: payloadForMissions.homeCity,
          homeAddress: payloadForMissions.homeAddress || "",

          dateKey: payloadForMissions.dateKey,
          time: payloadForMissions.time || "",

          createdAt: now,
          updatedAt: now
        }, { merge: true });
      }

      const eRef = doc(db, "events", eventId);
      batch.update(eRef, {
        missionTypes: ids,
        missionsInitialized: true,
        updatedAt: now
      });

      await batch.commit();
    }

    // ========= Events =========
    productSelect.addEventListener("change", refreshSuggest);

    [dateKeyInput, timeEl, arrivalTimeInput, departureDateKeyInput, departureTimeInput, ownerNameEl, ownerPhoneEl].forEach(el=>{
      el.addEventListener("input", renderContext);
      el.addEventListener("change", renderContext);
    });

    addLineBtn.addEventListener("click", ()=>{
      hideAlert();
      const v = validateLineInputs();
      if(!v.ok) return showAlert(v.msg);
      if(editingIndex >= 0){
        lines[editingIndex] = v.line;
        showAlert("✅ Ligne mise à jour.", true);
      }else{
        lines.push(v.line);
        showAlert("✅ Ligne ajoutée.", true);
      }
      renderLines();
      refreshTotals();
      resetLineBuilder();
    });

    formEl.addEventListener("submit", async (e)=>{
      e.preventDefault();
      hideAlert();

      if(!currentUser) return showAlert("Pas connecté Firebase.");
      if(!currentHome) return showAlert("Logement non chargé.");
      if(!dateKeyInput.value) return showAlert("Date obligatoire.");
      if(!lines.length) return showAlert("Ajoute au moins une ligne.");

      const ownerName  = (ownerNameEl.value || currentHome.ownerName || "").trim();
      const ownerPhone = cleanPhone(ownerPhoneEl.value || currentHome.ownerPhone || "");

      const basePayload = {
        conciergerieUid: currentUser.uid,

        homeId:   currentHome.id,
        homeName: currentHome.name || "",
        homeCity: currentHome.city || "",
        homeType: (currentHome.homeType || ""),
        homeAddress: (currentHome.homeAddress || "").trim(),
        homeZip: (currentHome.homeZip || "").trim(),

        dateKey: dateKeyInput.value,
        date:    dateKeyInput.value,
        time:    (timeEl.value || "").trim(),

        arrivalDateKey: stay.arrivalDateKey || "",
        departureDateKey: stay.departureDateKey || "",
        arrivalTime: (arrivalTimeInput.value || "").trim(),
        departureTime: (departureTimeInput.value || "").trim(),
        timezone: stay.timezone || "Europe/Paris",

                // ✅ Owner: on distingue docId (owners) et uid (Firebase Auth)
        ownerDocId: String(currentHome.ownerDocId || "").trim() || null,
        ownerUid:   String(currentHome.ownerUid || "").trim() || null, // uid Firebase si tu l'as
        ownerName:  ownerName || "",
        ownerPhone: ownerPhone || "",
        ownerEmail: String(currentHome.ownerEmail || currentHome.ownerAccountEmail || "").trim() || "",


        meta: (jobNoteEl.value || "").trim(),

                // ✅ DEVIs : visible dans devis-liste dès la création
        commercialStatus: "DEVIS",
        commercialUpdatedAt: serverTimestamp(),

        quoteStatus: "DRAFT",
        quoteNumber: "",              // sera généré dans devis-event au clic Enregistrer
        quoteUpdatedAt: serverTimestamp(),

        lines: lines.map(l=>({
          label: l.label || "",
          qty: Number(l.qty)||0,
          unit: l.unit || "unité",
          unitPrice: Number(l.unitPrice)||0,
          category: l.category || "",
          note: l.note || "",
          suggestedPrice: l.suggestedPrice || ""
        })),
        total: computeTotal(),

        status: "EN_COURS",
        opStatus: "EN_COURS",

        source: (from === "ical") ? "ical" : "manual",
        icalEventId: icalEventId || null,
        summary: summary || "",
        stayNote: (noteParam || ""),

        updatedAt: serverTimestamp()
      };

      lockUI(true);
      try{
        if(!createdEventId){
          basePayload.createdAt = serverTimestamp();
          basePayload.missionTypes = ["CHECKIN","MENAGE","CHECKOUT"];
          basePayload.missionsInitialized = false;

          const ref = await addDoc(collection(db,"events"), basePayload);
          createdEventId = ref.id;
          createdEventRef = doc(db,"events",createdEventId);

          await createDefaultMissions(createdEventId, basePayload);

          showAlert("✅ Prestation enregistrée (EN_COURS) + missions créées.", true);
          location.href = `prestations.html?open=${encodeURIComponent(createdEventId)}`;
          return;
        }else{
          await updateDoc(createdEventRef, basePayload);
          showAlert("✅ Prestation mise à jour (EN_COURS).", true);
        }
      }catch(err){
        console.error(err);
        showAlert("Erreur enregistrement : " + (err?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    });

    // ========= Boot =========
    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      const ok = await guardConciergerie(user);
      if(!ok){
        location.href = "abonnement.html?plan=starter";
        return;
      }

      currentUser = user;
      emailLine.textContent = user.email || user.uid;

      // valeurs par défaut
      const baseDate = dateKeyParam || todayKey();
      dateKeyInput.value = baseDate;

      // ⚡ source = icalEvents si possible
      const ical = await loadIcalEventIfAny();

      // 1) cohérence homeId (si on vient d'une résa)
      if (ical && ical.homeId && homeId && ical.homeId !== homeId) {
        const p = new URLSearchParams(location.search);
        p.set("homeId", ical.homeId);
        location.replace(`nouvelle-prestation.html?${p.toString()}`);
        return;
      }

      try{
        await loadHome();
      }catch(e){
        showAlert("⛔ " + (e.message || "Erreur logement"));
        return;
      }

      // backfill owner depuis params si fournis
      if(ownerNameParam && !ownerNameEl.value.trim()) ownerNameEl.value = ownerNameParam.trim();
      if(noteParam) jobNoteEl.value = noteParam;

      // 2) seulement ensuite : appliquer les infos séjour
      if (ical) {
        stay.arrivalDateKey = (ical.arrivalDateKey || ical.dateKey || baseDate || "").trim();
        stay.departureDateKey = (ical.departureDateKey || "").trim();
        stay.arrivalTime = (ical.arrivalTime || "").trim();
        stay.departureTime = (ical.departureTime || "").trim();
        stay.timezone = (ical.timezone || "Europe/Paris");

        arrivalTimeInput.value = stay.arrivalTime;
        departureDateKeyInput.value = stay.departureDateKey;
        departureTimeInput.value = stay.departureTime;

        dateKeyInput.value = stay.arrivalDateKey || baseDate;
        timeEl.value = stay.arrivalTime || timeParam || "";

        if(ical.ownerName && !ownerNameEl.value) ownerNameEl.value = ical.ownerName;
        if(ical.meta && !jobNoteEl.value) jobNoteEl.value = ical.meta;
      } else {
        stay.arrivalDateKey = baseDate;
        stay.departureDateKey = "";
        stay.arrivalTime = "";
        stay.departureTime = "";
        stay.timezone = "Europe/Paris";

        arrivalTimeInput.value = "";
        departureDateKeyInput.value = "";
        departureTimeInput.value = "";
        timeEl.value = timeParam || "";
      }

      // champs séjour en lecture seule
      arrivalTimeInput.readOnly = true;
      departureDateKeyInput.readOnly = true;
      departureTimeInput.readOnly = true;

      buildProductSelect();
      refreshSuggest();

      renderContext();
      renderLines();
      refreshTotals();
    });
  </script>

</body>
</html>
