<!-- docs/admin-support.html — CleanUp Manager admin support + nouveautés -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Support – CleanUp Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box}
    :root{--violet-main:#7A5CFF;--violet-dark:#6238FF;--text:#111;--muted:#666;--border:rgba(122,92,255,.18);--bad:#b3261e;--ok:#1b8f4d;--warn:#b06b00;--shadow:0 14px 36px rgba(0,0,0,.08)}
    body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#F8F4FF 0%,#EDE6FF 80%);color:var(--text)}
    .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:16px 16px 36px}
    .topbar{width:100%;max-width:1180px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;background:rgba(248,244,255,.85);backdrop-filter:blur(6px)}
    .pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 12px;border-radius:999px;background:#fff;border:2px solid var(--violet-main);color:var(--violet-main);text-decoration:none;font-weight:900;font-size:13px;white-space:nowrap;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.06)}
    .logo-title{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:10px;margin-bottom:6px;text-align:center}
    .logo-icon{width:44px;height:44px;border-radius:50%;background:#fff;border:2px solid var(--violet-main);display:flex;align-items:center;justify-content:center;color:var(--violet-main);font-size:22px;font-weight:900;position:relative;flex-shrink:0}
    .logo-icon::after{content:"✦";position:absolute;top:-6px;right:-5px;font-size:12px;color:var(--violet-main)}
    h1{margin:0;font-size:26px;font-weight:900;letter-spacing:-.2px}.subtitle{margin-top:2px;font-size:14px;color:#444;text-align:center}
    .alert{width:100%;max-width:1180px;display:none;margin-top:12px;padding:10px 12px;background:#fff;border-radius:14px;border-left:5px solid var(--bad);box-shadow:0 3px 10px rgba(0,0,0,.06);font-size:12px;color:#444;white-space:pre-wrap;font-weight:800}.alert.ok{border-left-color:var(--ok)}
    .stats{width:100%;max-width:1180px;margin-top:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}@media(min-width:820px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}}
    .stat{background:rgba(255,255,255,.86);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);backdrop-filter:blur(10px);padding:12px;min-height:72px;display:flex;flex-direction:column;gap:6px}.stat .label{font-size:12px;color:#666;font-weight:800;line-height:1.15}.stat .value{font-size:24px;font-weight:1000;letter-spacing:-.2px}
    .panel{width:100%;max-width:1180px;margin-top:14px;background:rgba(255,255,255,.86);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);backdrop-filter:blur(10px);padding:14px}.panelHead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}.panelTitle{display:flex;flex-direction:column;gap:2px;min-width:0}.panelTitle strong{font-size:16px;font-weight:1000}.panelTitle span{font-size:12px;color:#666;font-weight:800}
    .filters{display:grid;grid-template-columns:1fr;gap:8px;width:100%}@media(min-width:820px){.filters{grid-template-columns:1.2fr 180px 180px 180px}}
    input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid rgba(122,92,255,.18);background:#fff;font:inherit;color:#111;outline:none}textarea{min-height:100px;resize:vertical}label{display:block;margin:10px 0 5px;font-size:12px;color:#333;font-weight:900}
    .list{display:flex;flex-direction:column;gap:10px;margin-top:12px}.item{background:#fff;border:1px solid rgba(122,92,255,.12);border-radius:16px;box-shadow:0 3px 10px rgba(0,0,0,.06);padding:12px;display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:920px){.item{grid-template-columns:minmax(0,1fr) 220px}}
    .iTop{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.badge{display:inline-flex;align-items:center;justify-content:center;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:1000;border:1px solid var(--border);background:#fff;color:#444;white-space:nowrap}.badge.new{color:var(--bad);border-color:rgba(179,38,30,.25);background:rgba(179,38,30,.06)}.badge.reviewed{color:var(--warn);border-color:rgba(176,107,0,.25);background:rgba(176,107,0,.06)}.badge.planned{color:var(--violet-main);border-color:rgba(122,92,255,.25);background:rgba(122,92,255,.06)}.badge.done{color:var(--ok);border-color:rgba(27,143,77,.25);background:rgba(27,143,77,.06)}.badge.rejected{color:#666;border-color:rgba(0,0,0,.12);background:rgba(0,0,0,.04)}.badge.hiddenBadge{color:#666;background:rgba(0,0,0,.04)}
    .title{font-size:14px;font-weight:1000;color:#222;margin:0 0 4px}.meta{font-size:12px;color:#666;font-weight:800;line-height:1.35;margin:0 0 6px}.msg{font-size:12px;color:#333;line-height:1.4;font-weight:700;white-space:pre-wrap;margin:0}.side{display:flex;flex-direction:column;gap:8px;justify-content:flex-start}
    .btn{display:inline-flex;justify-content:center;align-items:center;gap:8px;padding:10px 12px;border-radius:999px;border:1px solid var(--border);cursor:pointer;text-decoration:none;font-weight:900;font-size:12px;background:#fff;color:var(--violet-main);box-shadow:0 8px 18px rgba(0,0,0,.06);white-space:nowrap}.btn.primary{background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));color:#fff;border-color:transparent}.btn.danger{color:var(--bad);border-color:rgba(179,38,30,.22)}.btn:disabled{opacity:.55;cursor:not-allowed}.empty{padding:18px;border-radius:16px;background:#fff;border:1px dashed rgba(122,92,255,.25);font-size:13px;font-weight:900;color:#666}
    .modalBack{position:fixed;inset:0;z-index:999;display:none;background:rgba(0,0,0,.28);backdrop-filter:blur(4px);align-items:center;justify-content:center;padding:16px}.modal{width:100%;max-width:720px;max-height:88vh;overflow:auto;background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:0 24px 70px rgba(0,0,0,.22);padding:16px}.modalHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid rgba(122,92,255,.16);padding-bottom:12px;margin-bottom:12px}.modalTitle{font-size:18px;font-weight:1000}.modalSubtitle{font-size:12px;color:#666;margin-top:4px;font-weight:700}.xBtn{border:none;cursor:pointer;width:38px;height:38px;border-radius:999px;background:#fff;border:2px solid var(--violet-main);color:var(--violet-main);font-weight:1000}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.notice{margin-top:12px;padding:10px 12px;border-radius:14px;border-left:5px solid var(--violet-main);background:rgba(122,92,255,.06);font-size:12px;color:#444;font-weight:700;line-height:1.4}.okText{color:var(--ok)}.errText{color:var(--bad)}
  </style>
</head>
<body>
<div class="page">
  <div class="topbar">
    <a class="pill" href="conciergerie.html">← Tableau de bord</a>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
      <button class="pill" id="refreshBtn" type="button">Rafraîchir</button>
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>
  </div>

  <div class="logo-title"><div class="logo-icon">✓</div><h1>Admin Support</h1></div>
  <div class="subtitle">Demandes utilisateurs • bugs • suggestions • nouveautés</div>
  <div class="alert" id="alertBox"></div>

  <section class="stats" aria-label="Indicateurs support">
    <div class="stat"><div class="label">Nouvelles</div><div class="value" id="statNew">—</div></div>
    <div class="stat"><div class="label">À l’étude</div><div class="value" id="statReviewed">—</div></div>
    <div class="stat"><div class="label">Prévues</div><div class="value" id="statPlanned">—</div></div>
    <div class="stat"><div class="label">Terminées</div><div class="value" id="statDone">—</div></div>
    <div class="stat"><div class="label">Total chargé</div><div class="value" id="statTotal">—</div></div>
  </section>

  <section class="panel">
    <div class="panelHead">
      <div class="panelTitle"><strong>Demandes support</strong><span>Lecture Firestore : supportRequests</span></div>
      <button class="btn primary" id="openReleaseBtn" type="button">+ Nouvelle nouveauté</button>
    </div>

    <div class="filters">
      <input id="searchInput" type="search" placeholder="Recherche : titre, message, société, email..." />
      <select id="typeFilter"><option value="">Tous les types</option><option value="bug">Bug</option><option value="feature">Fonctionnalité</option></select>
      <select id="statusFilter"><option value="">Tous les statuts</option><option value="new">Nouveau</option><option value="reviewed">À l’étude</option><option value="planned">Prévu</option><option value="done">Terminé</option><option value="rejected">Non retenu</option></select>
      <select id="limitFilter"><option value="50">50 dernières</option><option value="100">100 dernières</option><option value="200">200 dernières</option></select>
    </div>

    <div class="list" id="supportList"></div>
  </section>

  <section class="panel">
    <div class="panelHead">
      <div class="panelTitle"><strong>Nouveautés</strong><span>Lecture Firestore : releaseNotes</span></div>
      <button class="btn primary" id="openReleaseBtn2" type="button">+ Nouvelle nouveauté</button>
    </div>
    <div class="list" id="releaseList"></div>
  </section>
</div>

<div class="modalBack" id="modalBack" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modalHead">
      <div><div class="modalTitle" id="modalTitle">—</div><div class="modalSubtitle" id="modalSubtitle">—</div></div>
      <button class="xBtn" id="closeModalBtn" type="button">✕</button>
    </div>
    <div id="modalContent"></div>
  </div>
</div>

<script type="module">
  import { auth, db, authReady } from "./firebase-init.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { doc, getDoc, updateDoc, deleteDoc, collection, query, orderBy, limit, getDocs, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const alertBox=document.getElementById("alertBox"),logoutBtn=document.getElementById("logoutBtn"),refreshBtn=document.getElementById("refreshBtn"),openReleaseBtn=document.getElementById("openReleaseBtn"),openReleaseBtn2=document.getElementById("openReleaseBtn2");
  const statNew=document.getElementById("statNew"),statReviewed=document.getElementById("statReviewed"),statPlanned=document.getElementById("statPlanned"),statDone=document.getElementById("statDone"),statTotal=document.getElementById("statTotal");
  const searchInput=document.getElementById("searchInput"),typeFilter=document.getElementById("typeFilter"),statusFilter=document.getElementById("statusFilter"),limitFilter=document.getElementById("limitFilter"),supportList=document.getElementById("supportList"),releaseList=document.getElementById("releaseList");
  const modalBack=document.getElementById("modalBack"),closeModalBtn=document.getElementById("closeModalBtn"),modalTitle=document.getElementById("modalTitle"),modalSubtitle=document.getElementById("modalSubtitle"),modalContent=document.getElementById("modalContent");
  let currentUser=null,allRows=[],allReleases=[];

  function safe(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
  function showAlert(msg,ok=false){alertBox.style.display="block";alertBox.classList.toggle("ok",!!ok);alertBox.textContent=msg}
  function hideAlert(){alertBox.style.display="none";alertBox.classList.remove("ok");alertBox.textContent=""}
  function norm(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
  function formatDateFR(value){try{if(!value)return"—";let d=null;if(value?.toDate)d=value.toDate();else if(typeof value==="number")d=new Date(value);else d=new Date(String(value));if(!d||isNaN(d.getTime()))return"—";return new Intl.DateTimeFormat("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}).format(d)}catch{return"—"}}
  function statusLabel(s){s=String(s||"new");return s==="new"?"Nouveau":s==="reviewed"?"À l’étude":s==="planned"?"Prévu":s==="done"?"Terminé":s==="rejected"?"Non retenu":s}
  function typeLabel(t){t=String(t||"");return t==="feature"?"Fonctionnalité":t==="bug"?"Bug":(t||"Demande")}
  function badgeClass(s){s=String(s||"new");return["new","reviewed","planned","done","rejected"].includes(s)?s:""}
  function openModal(title,subtitle,html){modalTitle.textContent=title;modalSubtitle.textContent=subtitle;modalContent.innerHTML=html;modalBack.style.display="flex"}
  function closeModal(){modalBack.style.display="none";modalContent.innerHTML=""}
  closeModalBtn.addEventListener("click",closeModal);modalBack.addEventListener("click",e=>{if(e.target===modalBack)closeModal()});
  window.addEventListener("keydown",e=>{if(e.key==="Escape"&&modalBack.style.display==="flex")closeModal()});

  async function assertAdmin(){
    if(!currentUser)throw new Error("Non connecté.");
    const snap=await getDoc(doc(db,"users",currentUser.uid));
    const data=snap.exists()?(snap.data()||{}):{};
    const role=String(data.role||"").toLowerCase();
    if(!["admin","staff"].includes(role))throw new Error("Accès refusé : rôle admin ou staff requis dans users/{uid}.role.");
  }

  function renderStats(){
    const counts={new:0,reviewed:0,planned:0,done:0};
    for(const row of allRows){const st=String(row.status||"new");if(st in counts)counts[st]++}
    statNew.textContent=String(counts.new);statReviewed.textContent=String(counts.reviewed);statPlanned.textContent=String(counts.planned);statDone.textContent=String(counts.done);statTotal.textContent=String(allRows.length)
  }

  function filteredRows(){
    const q=norm(searchInput.value),type=String(typeFilter.value||""),status=String(statusFilter.value||"");
    return allRows.filter(x=>{
      if(type&&String(x.type||"")!==type)return false;
      if(status&&String(x.status||"new")!==status)return false;
      if(!q)return true;
      return norm([x.title,x.message,x.category,x.userEmail,x.companyName,x.page,x.type,x.status].join(" ")).includes(q);
    });
  }

  function renderList(){
    const rows=filteredRows();
    if(!rows.length){supportList.innerHTML='<div class="empty">Aucune demande avec ce filtre.</div>';return}
    supportList.innerHTML=rows.map(x=>`
      <article class="item">
        <div>
          <div class="iTop"><span class="badge ${badgeClass(x.status)}">${safe(statusLabel(x.status))}</span><span class="badge">${safe(typeLabel(x.type))}</span><span class="badge">${safe(x.category||"—")}</span></div>
          <h2 class="title">${safe(x.title||"Sans titre")}</h2>
          <p class="meta">${safe(x.companyName||"Conciergerie")} • ${safe(x.userEmail||"—")}<br>Créée le ${safe(formatDateFR(x.createdAt))}${x.updatedAt?" • MAJ "+safe(formatDateFR(x.updatedAt)):""}</p>
          <p class="msg">${safe(x.message||"")}</p>${x.adminNote?`<p class="meta"><b>Note admin :</b> ${safe(x.adminNote)}</p>`:""}
        </div>
        <div class="side">
          <select data-status="${safe(x.id)}">
            <option value="new" ${x.status==="new"?"selected":""}>Nouveau</option>
            <option value="reviewed" ${x.status==="reviewed"?"selected":""}>À l’étude</option>
            <option value="planned" ${x.status==="planned"?"selected":""}>Prévu</option>
            <option value="done" ${x.status==="done"?"selected":""}>Terminé</option>
            <option value="rejected" ${x.status==="rejected"?"selected":""}>Non retenu</option>
          </select>
          <button class="btn" type="button" data-detail="${safe(x.id)}">Détail / note</button>
          <button class="btn danger" type="button" data-delete="${safe(x.id)}">Supprimer</button>
        </div>
      </article>`).join("");
    document.querySelectorAll("[data-status]").forEach(sel=>sel.addEventListener("change",async()=>updateStatus(sel.dataset.status,sel.value)));
    document.querySelectorAll("[data-detail]").forEach(btn=>btn.addEventListener("click",()=>openRequestDetail(btn.dataset.detail)));
    document.querySelectorAll("[data-delete]").forEach(btn=>btn.addEventListener("click",async()=>deleteRequest(btn.dataset.delete)));
  }

  async function loadSupportRequests(){
    hideAlert();supportList.innerHTML='<div class="empty">Chargement des demandes...</div>';
    try{
      await assertAdmin();
      const max=Number(limitFilter.value||"50");
      const snap=await getDocs(query(collection(db,"supportRequests"),orderBy("createdAt","desc"),limit(max)));
      allRows=snap.docs.map(d=>({id:d.id,...(d.data()||{})}));
      renderStats();renderList();
    }catch(e){console.error(e);supportList.innerHTML='<div class="empty">Impossible de charger les demandes.</div>';showAlert(e?.message||"Erreur Firestore.",false)}
  }

  async function updateStatus(id,status){
    hideAlert();
    try{
      await updateDoc(doc(db,"supportRequests",id),{status,updatedAt:serverTimestamp(),adminUpdatedBy:String(currentUser?.email||"")});
      const row=allRows.find(x=>x.id===id);if(row)row.status=status;
      renderStats();renderList();showAlert("Statut mis à jour.",true);
    }catch(e){console.error(e);showAlert("Erreur mise à jour : "+(e?.message||"inconnue"),false)}
  }

  function openRequestDetail(id){
    const x=allRows.find(r=>r.id===id);if(!x)return;
    openModal(x.title||"Demande",`${typeLabel(x.type)} • ${statusLabel(x.status)} • ${x.userEmail||"—"}`,`
      <div class="notice"><b>Société :</b> ${safe(x.companyName||"—")}<br><b>Catégorie :</b> ${safe(x.category||"—")}<br><b>Page :</b> ${safe(x.page||"—")}<br><b>Créée :</b> ${safe(formatDateFR(x.createdAt))}</div>
      <label for="detailStatus">Statut</label>
      <select id="detailStatus">
        <option value="new" ${x.status==="new"?"selected":""}>Nouveau</option><option value="reviewed" ${x.status==="reviewed"?"selected":""}>À l’étude</option><option value="planned" ${x.status==="planned"?"selected":""}>Prévu</option><option value="done" ${x.status==="done"?"selected":""}>Terminé</option><option value="rejected" ${x.status==="rejected"?"selected":""}>Non retenu</option>
      </select>
      <label for="adminNote">Note admin</label><textarea id="adminNote" placeholder="Décision, correction faite, priorité...">${safe(x.adminNote||"")}</textarea>
      <div class="notice"><b>Message utilisateur :</b><br>${safe(x.message||"")}</div>
      <div class="actions"><button class="btn primary" type="button" id="saveDetailBtn">Enregistrer</button><button class="btn" type="button" id="copyEmailBtn">Copier email</button></div>
      <div id="detailMsg" class="notice" style="display:none"></div>`);
    document.getElementById("saveDetailBtn")?.addEventListener("click",async()=>{
      const status=String(document.getElementById("detailStatus")?.value||"new"),adminNote=String(document.getElementById("adminNote")?.value||"").trim(),detailMsg=document.getElementById("detailMsg");
      try{await updateDoc(doc(db,"supportRequests",id),{status,adminNote,updatedAt:serverTimestamp(),adminUpdatedBy:String(currentUser?.email||"")});x.status=status;x.adminNote=adminNote;detailMsg.style.display="block";detailMsg.innerHTML='<b class="okText">Demande mise à jour.</b>';renderStats();renderList()}catch(e){detailMsg.style.display="block";detailMsg.innerHTML=`<b class="errText">${safe(e?.message||"Erreur")}</b>`}
    });
    document.getElementById("copyEmailBtn")?.addEventListener("click",async()=>{try{await navigator.clipboard.writeText(String(x.userEmail||""));showAlert("Email copié.",true)}catch{showAlert("Copie impossible.",false)}});
  }

  async function deleteRequest(id){
    if(!confirm("Supprimer cette demande support ?"))return;
    hideAlert();
    try{await deleteDoc(doc(db,"supportRequests",id));allRows=allRows.filter(x=>x.id!==id);renderStats();renderList();showAlert("Demande supprimée.",true)}catch(e){console.error(e);showAlert("Erreur suppression : "+(e?.message||"inconnue"),false)}
  }

  async function loadReleaseNotes(){
    releaseList.innerHTML='<div class="empty">Chargement des nouveautés...</div>';
    try{
      await assertAdmin();
      const snap=await getDocs(query(collection(db,"releaseNotes"),orderBy("publishedAt","desc"),limit(50)));
      allReleases=snap.docs.map(d=>({id:d.id,...(d.data()||{})}));
      renderReleaseList();
    }catch(e){console.error(e);releaseList.innerHTML='<div class="empty">Impossible de charger les nouveautés.</div>';showAlert(e?.message||"Erreur releaseNotes.",false)}
  }

  function renderReleaseList(){
    if(!allReleases.length){releaseList.innerHTML='<div class="empty">Aucune nouveauté enregistrée.</div>';return}
    releaseList.innerHTML=allReleases.map(x=>`
      <article class="item">
        <div>
          <div class="iTop"><span class="badge ${x.visible===true?'done':'hiddenBadge'}">${x.visible===true?'Visible':'Brouillon'}</span><span class="badge">${safe(x.version||'Sans version')}</span></div>
          <h2 class="title">${safe(x.title||'Nouveauté')}</h2>
          <p class="meta">Publiée le ${safe(formatDateFR(x.publishedAt))}${x.updatedAt?' • MAJ '+safe(formatDateFR(x.updatedAt)):''}</p>
          <p class="msg">${safe(x.message||'')}</p>
        </div>
        <div class="side">
          <select data-release-visible="${safe(x.id)}">
            <option value="true" ${x.visible===true?'selected':''}>Visible</option>
            <option value="false" ${x.visible!==true?'selected':''}>Brouillon</option>
          </select>
          <button class="btn" type="button" data-release-edit="${safe(x.id)}">Modifier</button>
          <button class="btn danger" type="button" data-release-delete="${safe(x.id)}">Supprimer</button>
        </div>
      </article>`).join('');
    document.querySelectorAll('[data-release-visible]').forEach(sel=>sel.addEventListener('change',async()=>updateReleaseVisible(sel.dataset.releaseVisible,sel.value==='true')));
    document.querySelectorAll('[data-release-edit]').forEach(btn=>btn.addEventListener('click',()=>openReleaseModal(btn.dataset.releaseEdit)));
    document.querySelectorAll('[data-release-delete]').forEach(btn=>btn.addEventListener('click',async()=>deleteRelease(btn.dataset.releaseDelete)));
  }

  async function updateReleaseVisible(id,visible){
    try{
      await updateDoc(doc(db,'releaseNotes',id),{visible,updatedAt:serverTimestamp(),updatedBy:String(currentUser?.email||'')});
      const row=allReleases.find(x=>x.id===id);if(row)row.visible=visible;
      renderReleaseList();showAlert('Visibilité nouveauté mise à jour.',true);
    }catch(e){console.error(e);showAlert('Erreur visibilité : '+(e?.message||'inconnue'),false)}
  }

  function openReleaseModal(id=''){
    const x=id ? allReleases.find(r=>r.id===id) : null;
    openModal(id?'Modifier la nouveauté':'Nouvelle nouveauté','Écriture Firestore : releaseNotes',`
      <label for="releaseTitle">Titre</label><input id="releaseTitle" value="${safe(x?.title||'')}" placeholder="Ex : Planning propriétaire amélioré">
      <label for="releaseVersion">Version / lot</label><input id="releaseVersion" value="${safe(x?.version||'')}" placeholder="Ex : Juin 2026">
      <label for="releaseMessage">Message</label><textarea id="releaseMessage" placeholder="Décris l'amélioration en une phrase claire.">${safe(x?.message||'')}</textarea>
      <label for="releaseVisible">Visibilité</label><select id="releaseVisible"><option value="true" ${x?.visible!==false?'selected':''}>Visible utilisateurs</option><option value="false" ${x?.visible===false?'selected':''}>Brouillon admin</option></select>
      <div class="actions"><button class="btn primary" type="button" id="saveReleaseBtn">${id?'Enregistrer':'Publier'}</button></div><div id="releaseMsg" class="notice" style="display:none"></div>`);
    document.getElementById('saveReleaseBtn')?.addEventListener('click',async()=>saveRelease(id));
  }

  async function saveRelease(id=''){
    const title=String(document.getElementById('releaseTitle')?.value||'').trim(),version=String(document.getElementById('releaseVersion')?.value||'').trim(),message=String(document.getElementById('releaseMessage')?.value||'').trim(),visible=String(document.getElementById('releaseVisible')?.value||'true')==='true',releaseMsg=document.getElementById('releaseMsg'),btn=document.getElementById('saveReleaseBtn');
    if(!title||!message){releaseMsg.style.display='block';releaseMsg.innerHTML='<b class="errText">Titre et message obligatoires.</b>';return}
    btn.disabled=true;
    try{
      if(id){
        await updateDoc(doc(db,'releaseNotes',id),{title,version,message,visible,updatedAt:serverTimestamp(),updatedBy:String(currentUser?.email||'')});
        const row=allReleases.find(x=>x.id===id);if(row)Object.assign(row,{title,version,message,visible});
      }else{
        const ref=await addDoc(collection(db,'releaseNotes'),{title,version,message,visible,publishedAt:serverTimestamp(),createdAt:serverTimestamp(),updatedAt:serverTimestamp(),createdBy:String(currentUser?.email||'')});
        allReleases.unshift({id:ref.id,title,version,message,visible,publishedAt:new Date(),createdAt:new Date(),updatedAt:new Date(),createdBy:String(currentUser?.email||'')});
      }
      releaseMsg.style.display='block';releaseMsg.innerHTML='<b class="okText">Nouveauté enregistrée.</b>';btn.textContent='Enregistré';renderReleaseList();
    }catch(e){releaseMsg.style.display='block';releaseMsg.innerHTML=`<b class="errText">${safe(e?.message||'Erreur Firestore')}</b>`;btn.disabled=false}
  }

  async function deleteRelease(id){
    if(!confirm('Supprimer cette nouveauté ?'))return;
    try{await deleteDoc(doc(db,'releaseNotes',id));allReleases=allReleases.filter(x=>x.id!==id);renderReleaseList();showAlert('Nouveauté supprimée.',true)}catch(e){console.error(e);showAlert('Erreur suppression nouveauté : '+(e?.message||'inconnue'),false)}
  }

  async function reloadAll(){await loadSupportRequests();await loadReleaseNotes()}
  [searchInput,typeFilter,statusFilter].forEach(el=>{el.addEventListener('input',renderList);el.addEventListener('change',renderList)});
  limitFilter.addEventListener('change',loadSupportRequests);refreshBtn.addEventListener('click',reloadAll);openReleaseBtn.addEventListener('click',()=>openReleaseModal());openReleaseBtn2.addEventListener('click',()=>openReleaseModal());
  logoutBtn.addEventListener('click',async()=>{try{await signOut(auth)}catch(_){}try{localStorage.removeItem('cm_auth')}catch(_){}location.replace('login.html?role=conciergerie')});
  await authReady;
  onAuthStateChanged(auth,async user=>{if(!user){location.replace('login.html?role=conciergerie');return}currentUser=user;await reloadAll()});
</script>
</body>
</html>
