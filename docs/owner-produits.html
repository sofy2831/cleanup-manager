<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Produits & kits</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border:rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);
      --ok:#1b8f4d;
    }

    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }

    .topbar{
      width:100%;
      max-width:1100px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet);
      color:var(--violet);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .logo-title{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:10px;
      margin-bottom:6px;
      text-align:center;
    }

    .logo-icon{
      width:44px;
      height:44px;
      border-radius:50%;
      background:#fff;
      border:2px solid var(--violet);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--violet);
      font-size:20px;
      font-weight:900;
      position:relative;
      flex-shrink:0;
    }

    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px;
      right:-5px;
      font-size:12px;
      color:var(--violet);
    }

    h1{
      margin:0;
      font-size:24px;
      font-weight:900;
      letter-spacing:-0.2px;
    }

    .subtitle{
      margin-top:2px;
      font-size:14px;
      color:#444;
      text-align:center;
    }

    .hint{
      width:100%;
      max-width:1100px;
      margin-top:12px;
      padding:12px 14px;
      background:#fff;
      border-radius:16px;
      border-left:5px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      line-height:1.45;
    }

    .hint strong{
      color:#222;
    }

    .wrap{
      width:100%;
      max-width:1100px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      min-width:0;
    }

    .card{
      background:rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter:blur(10px);
      min-width:0;
    }

    .toolbar{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      align-items:center;
      min-width:0;
    }

    @media(max-width:760px){
      .toolbar{
        grid-template-columns:1fr;
      }
    }

    .select, .input{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.28);
      background:#fff;
      font-weight:900;
      color:#222;
      outline:none;
    }

    .grid{
      margin-top:12px;
      display:grid;
      grid-template-columns:repeat(1,minmax(0,1fr));
      gap:12px;
    }

    @media(min-width:640px){
      .grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }

    .p{
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:16px;
      padding:12px;
      box-shadow:0 3px 10px rgba(0,0,0,.05);
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }

    .pmedia{
      width:100%;
      height:180px;
      border-radius:14px;
      overflow:hidden;
      background:#fff;
      border:1px solid rgba(122,92,255,0.14);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px;
    }

    .pmedia img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .pmedia.placeholder{
      color:#7A5CFF;
      font-size:28px;
      font-weight:900;
    }

    .phead{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      min-width:0;
    }

    .ptitle{
      font-weight:1000;
      font-size:16px;
      color:#111;
      min-width:0;
    }

    .ptitle .sub{
      display:block;
      font-weight:900;
      font-size:12px;
      color:#666;
      margin-top:3px;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      border:1px solid rgba(122,92,255,0.22);
      background:#fff;
      color:var(--violet);
      white-space:nowrap;
    }

    .chips{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }

    .chip{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:5px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      border:1px solid rgba(122,92,255,0.22);
      background:#fff;
      color:#333;
      white-space:nowrap;
    }

    .chip.pack{
      color:var(--ok);
      border-color:rgba(27,143,77,0.25);
    }

    .section-title{
      font-size:12px;
      font-weight:1000;
      color:#222;
      margin:2px 0 0;
    }

    .plist{
      margin:0;
      padding-left:18px;
      font-size:13px;
      color:#444;
      line-height:1.45;
    }

    .plist li{ margin:3px 0; }

    .foot-note{
      margin-top:2px;
      font-size:12px;
      color:#666;
      font-weight:850;
      line-height:1.4;
      padding-top:8px;
      border-top:1px dashed rgba(122,92,255,0.18);
    }

    .empty{
      margin-top:8px;
      font-size:13px;
      color:#666;
      font-weight:850;
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      z-index:50;
      display:flex;
      gap:6px;
      justify-content:space-around;
      align-items:center;
      padding:10px 10px calc(10px + env(safe-area-inset-bottom));
      background:rgba(255,255,255,0.92);
      border-top:1px solid rgba(122,92,255,0.18);
      backdrop-filter:blur(10px);
    }

    .bottom-nav a{
      flex:1;
      text-align:center;
      text-decoration:none;
      font-size:11px;
      font-weight:900;
      color:#666;
      padding:10px 8px;
      border-radius:999px;
      white-space:nowrap;
    }

    @media(min-width:860px){
      .bottom-nav{
        position:static;
        width:100%;
        max-width:1100px;
        margin:14px 0 0;
        border-top:none;
        border:1px solid rgba(122,92,255,0.18);
        border-radius:999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding:12px;
        gap:10px;
      }

      .bottom-nav a{
        font-size:13px;
        padding:12px;
      }

      .page{
        padding-bottom:32px;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <button class="pill" type="button" onclick="history.back()">← Retour</button>
    </div>

    <div class="logo-title">
      <div class="logo-icon">🧺</div>
      <h1>Produits & kits</h1>
    </div>
    <div class="subtitle">Vue propriétaire — composition des kits proposés par votre conciergerie</div>

    <div class="hint">
      <strong>Information :</strong> cette page présente les kits et leur contenu.<br>
      Les commandes se font directement auprès de votre conciergerie via la messagerie.
    </div>

    <div class="wrap">
      <div class="card">
        <div class="toolbar">
          <select class="select" id="filter">
            <option value="ALL">Tous les kits</option>
            <option value="ESS">Kit essentiel</option>
            <option value="CUIS">Kit cuisine</option>
            <option value="BAIN">Kit bain</option>
            <option value="SEJ">Kit séjour</option>
          </select>

          <input class="input" id="search" type="search" placeholder="Rechercher un produit (ex : café, papier, gel...)" autocomplete="off" />
        </div>

        <div class="grid" id="grid"></div>
      </div>
    </div>

    <nav class="bottom-nav" aria-label="Navigation">
      <a href="#">Accueil</a>
      <a href="#">Logements</a>
      <a href="#">Messages</a>
      <a href="#" aria-current="page">Produits</a>
    </nav>
  </div>

  <script>
    const PRODUCT_IMAGES = {
      kit_ess: "images/kit-essentiel.jpg",
      kit_cuis: "images/kit-cuisine.jpg",
      kit_bain: "images/kit-bain.jpg",
      kit_sej: "images/kit-sejour.jpg"
    };

    const kits = [
      {
        id:"kit_ess",
        cat:"ESS",
        name:"Kit essentiel",
        subtitle:"Base ménage",
        badge:"Essentiel",
        items:[
          "1 Tampon à récurer",
          "1 Torchon",
          "1 Liquide vaisselle 30ml",
          "1 Sac poubelle 50L",
          "1 Capsule pour lave-linge",
          "1 Pastille pour lave-vaisselle",
          "1 Nettoyant multi usage sol + surface 30ml"
        ],
        note:"Kit utile pour les besoins ménage et entretien de base."
      },
      {
        id:"kit_cuis",
        cat:"CUIS",
        name:"Kit cuisine",
        subtitle:"Accueil cuisine",
        badge:"Cuisine",
        items:[
          "2 Capsules café",
          "1 Sachet de thé",
          "2 Sucres monodose",
          "2 Laits monodose",
          "1 Nesquick",
          "1 Huile olive 20ml",
          "1 Vinaigre xérès 20ml",
          "2 Sel + 1 poivre",
          "1 Essuie tout"
        ],
        note:"Kit pensé pour un accueil cuisine simple et pratique."
      },
      {
        id:"kit_bain",
        cat:"BAIN",
        name:"Kit bain",
        subtitle:"Hygiène",
        badge:"Bain",
        items:[
          "1 Papier toilette",
          "2 Gels douche",
          "2 Shampoings",
          "2 Savons mains",
          "1 Après-shampoing"
        ],
        note:"Kit hygiène pour compléter l’accueil salle de bain."
      },
      {
        id:"kit_sej",
        cat:"SEJ",
        name:"Kit séjour (2 pers)",
        subtitle:"Essentiel + cuisine + bain",
        badge:"Pack",
        items:[
          "1 Kit essentiel",
          "1 Kit cuisine",
          "1 Kit bain"
        ],
        note:"Pack complet regroupant les trois kits principaux."
      }
    ];

    const grid = document.getElementById("grid");
    const filter = document.getElementById("filter");
    const search = document.getElementById("search");

    function esc(s){
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function getProductImage(product){
      return PRODUCT_IMAGES[product.id] || "";
    }

    function matchesFilter(p){
      const f = filter.value;
      if(f === "ALL") return true;
      return p.cat === f;
    }

    function matchesSearch(p){
      const q = String(search.value || "").trim().toLowerCase();
      if(!q) return true;

      const hay = [
        p.name,
        p.subtitle,
        p.badge,
        ...(p.items || []),
        p.note
      ].filter(Boolean).join(" ").toLowerCase();

      return hay.includes(q);
    }

    function sortProducts(arr){
      const rank = (p)=>{
        if(p.cat === "ESS") return 1;
        if(p.cat === "CUIS") return 2;
        if(p.cat === "BAIN") return 3;
        if(p.cat === "SEJ") return 4;
        return 10;
      };

      return [...arr].sort((a,b)=>{
        const ra = rank(a);
        const rb = rank(b);
        if(ra !== rb) return ra - rb;
        return String(a.name || "").localeCompare(String(b.name || ""), "fr");
      });
    }

    function renderProducts(){
      const filtered = sortProducts(kits.filter(p => matchesFilter(p) && matchesSearch(p)));
      grid.innerHTML = "";

      if(!filtered.length){
        grid.innerHTML = `<div class="empty">Aucun kit ne correspond à la recherche.</div>`;
        return;
      }

      for(const p of filtered){
        const el = document.createElement("div");
        el.className = "p";

        const imgSrc = getProductImage(p);
        const mediaHtml = imgSrc
          ? `<div class="pmedia">
               <img src="${esc(imgSrc)}" alt="${esc(p.name)}" loading="lazy" onerror="this.parentElement.classList.add('placeholder'); this.parentElement.innerHTML='🧺';">
             </div>`
          : `<div class="pmedia placeholder">🧺</div>`;

        const badgeClass = p.cat === "SEJ" ? "chip pack" : "chip";

        el.innerHTML = `
          ${mediaHtml}

          <div class="phead">
            <div class="ptitle">
              ${esc(p.name)}
              <span class="sub">${esc(p.subtitle || "")}</span>
            </div>
            <span class="badge">${esc(p.badge || "Kit")}</span>
          </div>

          <div class="chips">
            <span class="chip kit">Kit</span>
            <span class="${badgeClass}">${esc(p.cat)}</span>
          </div>

          <div class="section-title">Contenu du kit</div>
          <ul class="plist">
            ${(p.items || []).map(x => `<li>${esc(x)}</li>`).join("")}
          </ul>

          <div class="foot-note">${esc(p.note || "")}</div>
        `;

        grid.appendChild(el);
      }
    }

    filter.addEventListener("change", renderProducts);
    search.addEventListener("input", renderProducts);

    renderProducts();
  </script>
</body>
</html>
