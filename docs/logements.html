  <style>

    .page{
      min-height:100vh;

      padding:10px 0;

    .card{

    .card-title{

      justify-content:space-between;

    .toolbar{

      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;

    input[type="search"]:focus{

    .btn{

      font-weight:900;
      cursor:pointer;
      background:#fff;
      color:var(--violet-main);

  import { auth, db, app } from "./firebase-init.js";

const arrivalTimeInput = document.getElementById("arrivalTimeInput");
const departureTimeInput = document.getElementById("departureTimeInput");

  function showAlert(msg, ok=false){
    alertBox.style.display = "block";
    alertBox.classList.toggle("ok", !!ok);
    alertBox.textContent = msg;
  }
  function hideAlert(){
    alertBox.style.display = "none";
    alertBox.classList.remove("ok");
    alertBox.textContent = "";
  }

  function showBookingAlert(msg, ok=false){
    bookingAlert.style.display = "block";
    bookingAlert.classList.toggle("ok", !!ok);
    bookingAlert.textContent = msg;
  }
  function hideBookingAlert(){
    bookingAlert.style.display = "none";
    bookingAlert.classList.remove("ok");
    bookingAlert.textContent = "";
  }

  function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }
  function norm(s){ return (s||"").toString().toLowerCase().trim(); }

  function escapeHtml(str){
    return String(str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function cleanPhone(s){ return (s||"").toString().trim().replace(/\s+/g," "); }
  function cleanZip(s){
    const z = (s||"").toString().trim().replace(/\D/g,"");
    return z.slice(0,5);
  }
  function validateZip(zip){ return /^\d{5}$/.test(zip); }
  function isEmailValid(s){ return /^\S+@\S+\.\S+$/.test(String(s||"").trim()); }

  function pad2(n){ return String(n).padStart(2,"0"); }
  function toDateKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  function parseDateKey(s){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||""));
    if(!m) return null;
    const y = Number(m[1]), mo = Number(m[2])-1, da = Number(m[3]);
    const d = new Date(y, mo, da);
    return Number.isFinite(d.getTime()) ? d : null;
  }
  function addDays(dateKey, days){
    const d = parseDateKey(dateKey);
    if(!d) return dateKey;
    d.setDate(d.getDate() + (Number(days)||0));
    return toDateKey(d);
  }
  function buildDateKeys(startKey, endKey){
    const d1 = parseDateKey(startKey);
    const d2 = parseDateKey(endKey);
    if(!d1 || !d2) return [];
    const a = (d1 <= d2) ? startKey : endKey;
    const b = (d1 <= d2) ? endKey : startKey;

    const out = [];
    let cur = a;
    out.push(cur);
    while(cur !== b){
      cur = addDays(cur, 1);
      out.push(cur);
      if(out.length > 60) break;
    }
    return out;
  }

  // ===== Abonnement guard =====
  const FREE_EMAILS = new Set([
    "mathilde.debout31@gmail.com",
    "s.dumas974@gmail.com"
  ]);

  async function guardConciergerie(user){
    const email = (user.email || "").toLowerCase();
    if(FREE_EMAILS.has(email)) return true;

    try{
      const snap = await getDoc(doc(db, "users", user.uid));
      if(!snap.exists()) return false;
      const data = snap.data() || {};
      return (data.role === "conciergerie" || data.role === "admin") && (data.subscriptionStatus === "active");
    }catch(e){
      return false;
    }
  }

  // ===== Data =====
  let currentUid = null;
  let allHomes = [];
  let showArchived = false;
  let editingHomeId = null;

  function isArchived(h){ return h?.status === "archived"; }

  async function loadHomes(){
    hideAlert();

    const user = auth.currentUser;
    if(!user?.uid){
      showAlert("Firebase non connecté (auth.currentUser null). Recharge / reconnecte-toi.");
      return;
    }
    currentUid = user.uid;

    try{
      const q = query(
        collection(db, "homes"),
        where("conciergerieUid", "==", currentUid)
      );

      const snap = await getDocs(q);
      allHomes = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      allHomes.sort((a,b)=>{
        const ta = a.createdAt?.seconds ? a.createdAt.seconds : 0;
        const tb = b.createdAt?.seconds ? b.createdAt.seconds : 0;
        return tb - ta;
      });

      render();
    }catch(err){
      console.error("Erreur lecture homes:", err);
      showAlert("Erreur lecture homes : " + (err?.message || "inconnue"));
    }
  }

  // ===== Home modal =====
  function openHomeModalCreate(){
    editingHomeId = null;
    modalTitle.textContent = "Ajouter un logement";
    modalBackdrop.style.display = "flex";
    modalBackdrop.setAttribute("aria-hidden","false");
    setTimeout(()=>homeName.focus(), 0);
  }

  function openHomeModalEdit(home){
    editingHomeId = home.id;
    modalTitle.textContent = "Modifier le logement";
    modalBackdrop.style.display = "flex";
    modalBackdrop.setAttribute("aria-hidden","false");

    homeName.value = home.name || "";
    homeCity.value = home.homeCity || home.city || "";
    homeAddress.value = (home.homeAddress || home.address || "").trim();
    homeZip.value = (home.homeZip || home.zip || "").toString();

    ownerEmailEl.value = home.ownerEmail || "";
    ownerPhoneEl.value = home.ownerPhone || "";

    const ofn = home.ownerFirstName || "";
    const oln = home.ownerLastName || "";
    if(ofn || oln){
      ownerFirstNameEl.value = ofn;
      ownerLastNameEl.value = oln;
    }else{
      const raw = (home.homeOwner || home.ownerName || "").trim();
      if(raw){
        const parts = raw.split(" ");
        ownerFirstNameEl.value = parts.slice(0,1).join(" ");
        ownerLastNameEl.value = parts.slice(1).join(" ");
      }else{
        ownerFirstNameEl.value = "";
        ownerLastNameEl.value = "";
      }
    }

    homeType.value = (home.homeType || home.type || "Studio");
    homeTeam.value = home.team || "";

    setTimeout(()=>homeName.focus(), 0);
  }

  function closeHomeModal(){
    modalBackdrop.style.display = "none";
    modalBackdrop.setAttribute("aria-hidden","true");
    homeForm.reset();
    homeType.value = "Studio";
    homeTeam.value = "";
    editingHomeId = null;
  }

  // ===== Booking modal =====
  function fillBookingHomeSelect(selectedId){
    bookingHomeSelect.innerHTML = "";
    for(const h of allHomes){
      if(isArchived(h)) continue;
      const opt = document.createElement("option");
      opt.value = h.id;
      opt.textContent = `${h.name || "Logement"}${(h.homeCity || h.city) ? " — " + (h.homeCity || h.city) : ""}`;
      bookingHomeSelect.appendChild(opt);
    }
    if(selectedId) bookingHomeSelect.value = selectedId;
    renderBookingHomeInfo(bookingHomeSelect.value);
  }

  function renderBookingHomeInfo(homeId){
    const h = allHomes.find(x=>x.id===homeId);
    if(!h){
      bookingHomeInfo.style.display = "none";
      bookingHomeInfo.innerHTML = "";
      return;
    }
    const addr = (h.homeAddress || h.address || "").trim();
    const ownerLabel = (h.ownerName || h.homeOwner || "").trim() || "—";
    const ownerEmail = (h.ownerEmail || "").trim();
    bookingHomeInfo.style.display = "block";
    bookingHomeInfo.innerHTML = `
      <div><b>Adresse :</b> ${escapeHtml(addr || "—")}</div>
      <div><b>Propriétaire :</b> ${escapeHtml(ownerLabel)}${ownerEmail ? ` • ${escapeHtml(ownerEmail)}` : ""}</div>
    `;
  }

  function openBookingModal(homeId){
    hideBookingAlert();

    const todayKey = toDateKey(new Date());
    arrivalDateInput.value = todayKey;
    departureDateInput.value = todayKey;
    arrivalTimeInput.value = "16:00";
departureTimeInput.value = "10:00";
    agentNameInput.value = "";
    agentEmailInput.value = "";
    metaInput.value = "";

    fillBookingHomeSelect(homeId);

    bookingBackdrop.style.display = "flex";
    bookingBackdrop.setAttribute("aria-hidden","false");
    setTimeout(()=> bookingHomeSelect.focus(), 0);
  }

  function closeBookingModal(){
    bookingBackdrop.style.display = "none";
    bookingBackdrop.setAttribute("aria-hidden","true");
    bookingForm.reset();
    hideBookingAlert();
  }

  bookingHomeSelect.addEventListener("change", ()=> renderBookingHomeInfo(bookingHomeSelect.value));
  cancelBookingBtn.addEventListener("click", closeBookingModal);
  bookingBackdrop.addEventListener("click", (e)=>{ if(e.target === bookingBackdrop) closeBookingModal(); });

  // ===== Render list =====
  function render(){
    const q = norm(searchInputEl.value);
    let homes = allHomes.slice();
    homes = homes.filter(h => showArchived ? true : !isArchived(h));

    const filtered = !q ? homes : homes.filter(h=>{
      const hay = [
        h.name,
        h.homeCity, h.city,
        h.homeZip, h.zip,
        h.homeAddress, h.address,
        h.homeOwner, h.ownerName, h.ownerFirstName, h.ownerLastName,
        h.ownerEmail,
        h.ownerPhone,
        h.type, h.homeType,
        h.team
      ].map(norm).join(" ");
      return hay.includes(q);
    });

    countLabelEl.textContent = filtered.length + " / " + homes.length;
    homesListEl.innerHTML = "";

    if(!filtered.length){
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = homes.length
        ? "Aucun résultat."
        : "Aucun logement. Clique sur “+ Ajouter”.";
      homesListEl.appendChild(e);
      return;
    }

    filtered.forEach(h=>{
      const item = document.createElement("div");
      item.className = "item";

      const ownerLabel =
        (h.homeOwner || h.ownerName || "").trim()
        || h.ownerEmail
        || "—";

      const statusChip = isArchived(h) ? `<span class="chip">Archivé</span>` : "";
      const addr = (h.homeAddress || h.address || "").trim();
      const zip = (h.homeZip || h.zip || "").toString().trim();
      const city = (h.homeCity || h.city || "").toString().trim();

      const bookingBtn = isArchived(h)
        ? `<span class="mini-btn disabled">Réservation</span>`
        : `<button class="mini-btn primary" type="button" data-book="${h.id}">+ Réservation</button>`;

      item.innerHTML = `
        <div class="item-top">
          <div style="min-width:0;">
            <div class="item-title">${escapeHtml(h.name || "Logement")}</div>
            <div class="item-meta">
              ${escapeHtml(city || "—")}${zip ? ` (${escapeHtml(zip)})` : ""}
              ${addr ? ` • <b>${escapeHtml(addr)}</b>` : ""}
              <br/>Propriétaire : <b>${escapeHtml(ownerLabel)}</b>
              ${h.ownerEmail ? ` • ${escapeHtml(h.ownerEmail)}` : ""}
              ${h.ownerPhone ? `<br/>📞 ${escapeHtml(h.ownerPhone)}` : ""}
            </div>
            <div class="chips">
              <span class="chip">${escapeHtml(h.homeType || h.type || "Type")}</span>
              <span class="chip">${escapeHtml(h.team || "—")}</span>
              ${addr ? `<span class="chip">Adresse OK</span>` : `<span class="chip">Adresse manquante</span>`}
              ${zip ? `<span class="chip">CP OK</span>` : `<span class="chip">CP manquant</span>`}
              ${(h.ownerPhone ? `<span class="chip">Tel OK</span>` : `<span class="chip">Tel manquant</span>`)}
              ${statusChip}
            </div>
          </div>

          <div class="item-actions">
            ${bookingBtn}
            <button class="mini-btn" type="button" data-edit="${h.id}">✏️ Modifier</button>
            <button class="mini-btn red" type="button" data-delete="${h.id}">Supprimer</button>
            ${
              isArchived(h)
                ? `<button class="mini-btn" type="button" data-unarchive="${h.id}">Restaurer</button>`
                : `<button class="mini-btn" type="button" data-archive="${h.id}">Archiver</button>`
            }
          </div>
        </div>
      `;

      homesListEl.appendChild(item);

      item.querySelectorAll(".item-actions a, .item-actions button").forEach(el=>{
        el.addEventListener("click", (e)=> e.stopPropagation());
      });
    });

    // Booking
    homesListEl.querySelectorAll("button[data-book]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const homeId = btn.getAttribute("data-book");
        openBookingModal(homeId);
      });
    });

    // Edit
    homesListEl.querySelectorAll("button[data-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-edit");
        const h = allHomes.find(x=>x.id===id);
        if(h) openHomeModalEdit(h);
      });
    });

    // Archive
    homesListEl.querySelectorAll("button[data-archive]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        hideAlert();
        const id = btn.getAttribute("data-archive");
        if(!confirm("Archiver ce logement ?")) return;

        try{
          await updateDoc(doc(db,"homes",id), {
            status: "archived",
            archivedAt: serverTimestamp()
          });
          const h = allHomes.find(x=>x.id===id);
          if(h) h.status = "archived";
          render();
        }catch(err){
          console.error(err);
          showAlert("Erreur archive : " + (err?.message || "inconnue"));
        }
      });
    });

    // Unarchive
    homesListEl.querySelectorAll("button[data-unarchive]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        hideAlert();
        const id = btn.getAttribute("data-unarchive");
        try{
          await updateDoc(doc(db,"homes",id), {
            status: "active",
            unarchivedAt: serverTimestamp()
          });
          const h = allHomes.find(x=>x.id===id);
          if(h) h.status = "active";
          render();
        }catch(err){
          console.error(err);
          showAlert("Erreur restauration : " + (err?.message || "inconnue"));
        }
      });
    });

    // Delete (blocked if any events/icalEvents)
    homesListEl.querySelectorAll("button[data-delete]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        hideAlert();
        const id = btn.getAttribute("data-delete");

        try{
          const qEv = query(
            collection(db,"events"),
            where("conciergerieUid","==", currentUid),
            where("homeId","==", id),
            limit(1)
          );
          const sEv = await getDocs(qEv);
          if(!sEv.empty){
            showAlert("⛔ Suppression bloquée : prestations existent. Utilise “Archiver”.");
            return;
          }

          const qIc = query(
            collection(db,"icalEvents"),
            where("conciergerieUid","==", currentUid),
            where("homeId","==", id),
            limit(1)
          );
          const sIc = await getDocs(qIc);
          if(!sIc.empty){
            showAlert("⛔ Suppression bloquée : réservations iCal existent. Utilise “Archiver”.");
            return;
          }
        }catch(err){
          console.error(err);
          showAlert("Erreur vérification : " + (err?.message || "inconnue"));
          return;
        }

        if(!confirm("Supprimer définitivement ?")) return;

        try{
          await deleteDoc(doc(db,"homes", id));
          allHomes = allHomes.filter(x=>x.id !== id);
          render();
          showAlert("✅ Logement supprimé.", true);
        }catch(err){
          console.error(err);
          showAlert("Erreur suppression : " + (err?.message || "inconnue"));
        }
      });
    });
  }

  // ===== Create / Update home =====
  homeForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    hideAlert();

    const user = auth.currentUser;
    if(!user?.uid){
      showAlert("Non connecté. Recharge la page.");
      return;
    }

    const name = homeName.value.trim();
    const city = homeCity.value.trim();
    const addr = homeAddress.value.trim();

    const zip = cleanZip(homeZip.value);
    const ownerEmail = normalizeEmail(ownerEmailEl.value);
    const ownerPhone = cleanPhone(ownerPhoneEl.value);

    const ownerFirstName = ownerFirstNameEl.value.trim();
    const ownerLastName = ownerLastNameEl.value.trim();
    const homeOwnerFull = `${ownerFirstName} ${ownerLastName}`.trim();

    const type = homeType.value;
    const team = (homeTeam.value || "").trim();

    if(!name || !city || !addr || !zip || !ownerEmail || !ownerFirstName || !ownerLastName || !ownerPhone){
      showAlert("Champs obligatoires manquants.");
      return;
    }
    if(!validateZip(zip)){
      showAlert("Code postal invalide (5 chiffres).");
      return;
    }
    if(!/^\S+@\S+\.\S+$/.test(ownerEmail)){
      showAlert("Email propriétaire invalide.");
      return;
    }

    saveBtn.disabled = true;

    try{
      if(editingHomeId){
        await updateDoc(doc(db,"homes", editingHomeId), {
          name,
          homeAddress: addr,
          homeCity: city,
          homeZip: zip,
          homeOwner: homeOwnerFull,
          ownerFirstName,
          ownerLastName,
          ownerPhone,
          ownerEmail,
          city,
          zip,
          ownerName: homeOwnerFull,
          type,
          team,
          updatedAt: serverTimestamp()
        });
        closeHomeModal();
        await loadHomes();
        showAlert("✅ Logement modifié.", true);
      }else{
        const payload = {
          conciergerieUid: user.uid,
          name,
          homeAddress: addr,
          homeCity: city,
          homeZip: zip,
          homeOwner: homeOwnerFull,
          ownerFirstName,
          ownerLastName,
          ownerPhone,
          ownerEmail,
          city,
          zip,
          ownerName: homeOwnerFull,
          type,
          team,
          status: "active",
          createdAt: serverTimestamp()
        };

        console.log("AUTH UID (homes)", user.uid);
        console.log("HOME PAYLOAD", payload);

        await addDoc(collection(db,"homes"), payload);

        closeHomeModal();
        await loadHomes();
        showAlert("✅ Logement créé.", true);
      }
    }catch(err){
      console.error(err);
      showAlert("Erreur enregistrement : " + (err?.message || "inconnue"));
    }finally{
      saveBtn.disabled = false;
    }
  });

  // ===== Create booking (icalEvents) =====
  bookingForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    hideBookingAlert();

    const user = auth.currentUser;
    if(!user?.uid){
      showBookingAlert("Non connecté. Recharge la page.");
      return;
    }

    const homeId = (bookingHomeSelect.value || "").trim();
    const aDate = (arrivalDateInput.value || "").trim();
    const dDate = (departureDateInput.value || "").trim();

    if(!homeId) return showBookingAlert("Choisis un logement.");
    if(!aDate || !dDate) return showBookingAlert("Dates arrivée + départ obligatoires.");

    const h = allHomes.find(x=>x.id === homeId);
    if(!h) return showBookingAlert("Logement introuvable. Recharge la page.");

    const agentName = (agentNameInput.value || "").trim();
    const agentEmail = normalizeEmail(agentEmailInput.value || "");
    if(agentEmail && !isEmailValid(agentEmail)) return showBookingAlert("Email agent invalide.");

    const meta = (metaInput.value || "").trim();

    const dateKeys = buildDateKeys(aDate, dDate);
    if(!dateKeys.length) return showBookingAlert("Erreur dates (YYYY-MM-DD).");

    saveBookingBtn.disabled = true;
    saveBookingBtn.style.opacity = "0.75";

    try{
      const payload = {
        conciergerieUid: user.uid,
        homeId: String(h.id),
        dateKey: String(aDate),
        dateKeys: dateKeys.map(String),
        source: "manual",
        homeName: h?.name || "Logement",
        homeCity: (h?.homeCity || h?.city || ""),
        homeAddress: (h?.homeAddress || h?.address || ""),
        ownerName: (h?.ownerName || h?.homeOwner || ""),
        ownerEmail: String(h?.ownerEmail || ""),
        agentName: String(agentName || ""),
        agentEmail: String(agentEmail || ""),
        meta: String(meta || ""),
        arrivalDateKey: String(aDate),
        departureDateKey: String(dDate),
        createdAt: serverTimestamp()
      };

      console.log("APP projectId", app?.options?.projectId);
      console.log("AUTH UID (icalEvents)", user.uid);
      console.log("ICAL PAYLOAD", payload);

      await addDoc(collection(db,"icalEvents"), payload);

      showBookingAlert("✅ Réservation enregistrée.", true);

      const params = new URLSearchParams();
      params.set("date", aDate);
      params.set("homeId", homeId);
      setTimeout(()=>{ location.href = `planning.html?${params.toString()}`; }, 350);

    }catch(err){
      console.error(err);
      showBookingAlert("Erreur création réservation : " + (err?.message || "inconnue"));
    }finally{
      saveBookingBtn.disabled = false;
      saveBookingBtn.style.opacity = "1";
    }
  });

  // ===== Events =====
  addBtn.addEventListener("click", openHomeModalCreate);
  cancelBtn.addEventListener("click", closeHomeModal);
  modalBackdrop.addEventListener("click", (e)=>{ if(e.target === modalBackdrop) closeHomeModal(); });
  searchInputEl.addEventListener("input", render);

  toggleArchivedBtn.addEventListener("click", ()=>{
    showArchived = !showArchived;
    toggleArchivedBtn.textContent = showArchived ? "Masquer archivés" : "Afficher archivés";
    render();
  });

  logoutBtn.addEventListener("click", async ()=>{
    await signOut(auth);
    localStorage.removeItem("cm_auth");
    location.href = "index.html";
  });

  // ===== Init =====
  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      location.href = "login.html?role=conciergerie";
      return;
    }

    const ok = await guardConciergerie(user);
    if(!ok){
      showAlert("⛔ Abonnement inactif.");
      setTimeout(()=> location.href = "abonnement.html?plan=starter", 700);
      return;
    }

    badgeLine.textContent = "Gestion des logements • " + (user.email || user.uid);
    await loadHomes();
  });
</script>


</body>
</html>
