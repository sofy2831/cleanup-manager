  function norm(s){ return (s||"").toString().toLowerCase().trim(); }

  function escapeHtml(str){
    return String(str ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function cleanPhone(s){ return (s||"").toString().trim().replace(/\s+/g," "); }
  function cleanZip(s){
    const z = (s||"").toString().trim().replace(/\D/g,"");
    return z.slice(0,5);
  }
  function validateZip(zip){ return /^\d{5}$/.test(zip); }

  function pad2(n){ return String(n).padStart(2,"0"); }
  function toDateKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
  function parseDateKey(s){
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||""));
    if(!m) return null;
    const y = Number(m[1]), mo = Number(m[2])-1, da = Number(m[3]);
    const d = new Date(y, mo, da);
    return Number.isFinite(d.getTime()) ? d : null;
  }
  function addDays(dateKey, days){
    const d = parseDateKey(dateKey);
    if(!d) return dateKey;
    d.setDate(d.getDate() + (Number(days)||0));
    return toDateKey(d);
  }
  function buildDateKeys(startKey, endKey){
    const d1 = parseDateKey(startKey);
    const d2 = parseDateKey(endKey);
    if(!d1 || !d2) return [];

    const a = (d1 <= d2) ? startKey : endKey;
    const b = (d1 <= d2) ? endKey : startKey;

    const out = [];
    let cur = a;
    out.push(cur);
    while(cur !== b){
      cur = addDays(cur, 1);
      out.push(cur);
      if(out.length > 120) break;
    }
    return out;
  }

  function getParam(name){

  async function guardConciergerie(user){
    const email = (user.email || "").toLowerCase();
    if(FREE_EMAILS.has(email)) return true;

    try{
      const snap = await getDoc(doc(db, "users", user.uid));
      if(!snap.exists()) return false;
      const data = snap.data() || {};
      return (data.role === "conciergerie" || data.role === "admin") && (data.subscriptionStatus === "active");
    }catch(e){
      return false;
    }
  }

  // ===== Data =====
  let currentUid = null;
  let allHomes = [];
  let showArchived = false;
  let editingHomeId = null;

  // ===== Owner link state =====
  let linkedOwnerUid = "";
  let linkedOwnerEmail = "";
  let linkedOwnerName = "";

  function normEmail(s){ return String(s || "").trim().toLowerCase(); }

  function showOwnerLookup(msg, ok=true){
    ownerLookupInfo.style.display = "block";
    ownerLookupInfo.style.borderLeft = ok ? "5px solid var(--ok)" : "5px solid var(--bad)";
    ownerLookupInfo.innerHTML = msg;
  }
  function hideOwnerLookup(){
    ownerLookupInfo.style.display = "none";
    ownerLookupInfo.innerHTML = "";
    ownerLookupInfo.style.borderLeft = "";
  }

  function setLinkedOwner(uid, email, fullname){
    linkedOwnerUid = uid || "";
    linkedOwnerEmail = normEmail(email || "");
    linkedOwnerName = String(fullname || "").trim();

    if(linkedOwnerUid){
      unlinkOwnerBtn.style.display = "inline-flex";
      showOwnerLookup(
        `✅ Compte trouvé<br><b>Email :</b> ${escapeHtml(linkedOwnerEmail)}<br><b>UID :</b> ${escapeHtml(linkedOwnerUid)}${linkedOwnerName ? `<br><b>Nom :</b> ${escapeHtml(linkedOwnerName)}` : ""}`,
        true
      );
    }else{
      unlinkOwnerBtn.style.display = "none";
      hideOwnerLookup();
    }
  }

  function clearLinkedOwner(){
    linkedOwnerUid = "";
    linkedOwnerEmail = "";
    linkedOwnerName = "";
    ownerAccountEmailEl.value = "";
    unlinkOwnerBtn.style.display = "none";
    hideOwnerLookup();
  }

  async function lookupOwnerAccount(){
    hideAlert();
    hideOwnerLookup();

    const emailLower = normEmail(ownerAccountEmailEl.value);
    if(!emailLower){
      showOwnerLookup("⛔ Mets un email.", false);
      return;
    }
    if(!currentUid){
      showOwnerLookup("⛔ currentUid introuvable. Recharge la page.", false);
      return;
    }

    lookupOwnerBtn.disabled = true;
    lookupOwnerBtn.style.opacity = "0.75";

    try{
      const q1 = query(
        collection(db, "users"),
        where("conciergerieUid", "==", currentUid),
        where("role", "==", "proprietaire"),
        where("email", "==", emailLower),
        limit(1)
      );
      const s1 = await getDocs(q1);

      if(s1.empty){
        setLinkedOwner("", "", "");
        showOwnerLookup("⛔ Aucun propriétaire trouvé avec cet email (users).", false);
        return;
      }

      const d = s1.docs[0];
      const u = d.data() || {};
      setLinkedOwner(d.id, u.email || emailLower, u.fullname || u.displayName || "");
      showAlert("✅ Compte propriétaire trouvé (prêt à associer).", true);

    }catch(err){
      console.error(err);
      setLinkedOwner("", "", "");
      showOwnerLookup("⛔ " + (err?.message || "Erreur recherche."), false);
    }finally{
      lookupOwnerBtn.disabled = false;
      lookupOwnerBtn.style.opacity = "1";
    }
  }

  lookupOwnerBtn.addEventListener("click", lookupOwnerAccount);

  unlinkOwnerBtn.addEventListener("click", ()=>{
    if(!confirm("Dissocier ce logement du compte propriétaire ?")) return;
    clearLinkedOwner();
    showOwnerLookup("✅ Dissociation prête. Clique “Enregistrer” pour appliquer.", true);
  });

  function isArchived(h){ return h?.status === "archived"; }

  async function loadHomes(){
    hideAlert();

    const user = auth.currentUser;
    if(!user?.uid){
      showAlert("Firebase non connecté (auth.currentUser null). Recharge / reconnecte-toi.");
      return;
    }
    currentUid = user.uid;

    try{
      const qh = query(
        collection(db, "homes"),
        where("conciergerieUid", "==", currentUid)
      );

      const snap = await getDocs(qh);
      allHomes = snap.docs.map(d => ({ id: d.id, ...d.data() }));

      allHomes.sort((a,b)=>{
        const ta = a.createdAt?.seconds ? a.createdAt.seconds : 0;
        const tb = b.createdAt?.seconds ? b.createdAt.seconds : 0;
        return tb - ta;
      });

      render();
    }catch(err){
      console.error("Erreur lecture homes:", err);
      showAlert("Erreur lecture homes : " + (err?.message || "inconnue"));
    }
  }

  // ===== Home modal =====
  function openHomeModalCreate(){
    editingHomeId = null;
    modalTitle.textContent = "Ajouter un logement";
    modalBackdrop.style.display = "flex";
    modalBackdrop.setAttribute("aria-hidden","false");

    // reset owner link
    clearLinkedOwner();
    setTimeout(()=>homeName.focus(), 0);
  }

  function openHomeModalEdit(home){
    editingHomeId = home.id;
    modalTitle.textContent = "Modifier le logement";
    modalBackdrop.style.display = "flex";
    modalBackdrop.setAttribute("aria-hidden","false");

    homeName.value = home.name || "";
    homeAddress.value = (home.homeAddress || home.address || "").trim();
    homeZip.value = (home.homeZip || home.zip || "").toString();
    homeCity.value = home.homeCity || home.city || "";
    ownerNameEl.value = (home.ownerName || home.homeOwner || "").trim();
    ownerPhoneEl.value = home.ownerPhone || "";
    homeType.value = (home.homeType || home.type || "Studio");

    // load owner link from home (avec compat)
    const ouid = String(home.ownerUid || "").trim();
    const oemail = String(home.ownerAccountEmail || home.ownerEmail || "").trim();
    const oname = String(home.ownerAccountName || home.ownerFullname || "").trim();
    ownerAccountEmailEl.value = oemail || "";
    setLinkedOwner(ouid, oemail, oname);

    setTimeout(()=>homeName.focus(), 0);
  }

  function closeHomeModal(){
    modalBackdrop.style.display = "none";
    modalBackdrop.setAttribute("aria-hidden","true");
    homeForm.reset();
    homeType.value = "Studio";
    editingHomeId = null;
    clearLinkedOwner();
  }

  // ===== Booking modal =====
  function fillBookingHomeSelect(selectedId){
    bookingHomeSelect.innerHTML = "";
    for(const h of allHomes){
      if(isArchived(h)) continue;
      const opt = document.createElement("option");
      opt.value = h.id;
      opt.textContent = `${h.name || "Logement"}${(h.homeCity || h.city) ? " — " + (h.homeCity || h.city) : ""}`;
      bookingHomeSelect.appendChild(opt);
    }
    if(selectedId) bookingHomeSelect.value = selectedId;
    renderBookingHomeInfo(bookingHomeSelect.value);
  }

  function renderBookingHomeInfo(homeId){
    const h = allHomes.find(x=>x.id===homeId);
    if(!h){
      bookingHomeInfo.style.display = "none";
      bookingHomeInfo.innerHTML = "";
      return;
    }
    const name = (h.name || "—").trim();
    const addr = (h.homeAddress || h.address || "—").trim();
    const zip  = (h.homeZip || h.zip || "—").toString().trim();
    const city = (h.homeCity || h.city || "—").toString().trim();
    const ownerName = (h.ownerName || h.homeOwner || "—").toString().trim();
    const ownerPhone = (h.ownerPhone || "—").toString().trim();
    const ownerUid = (h.ownerUid || "").toString().trim();
    const ownerEmail = (h.ownerAccountEmail || h.ownerEmail || "").toString().trim();

    bookingHomeInfo.style.display = "block";
    bookingHomeInfo.innerHTML = `
      <div><b>Nom du logement :</b> ${escapeHtml(name)}</div>
      <div><b>Adresse :</b> ${escapeHtml(addr)}</div>
      <div><b>CP :</b> ${escapeHtml(zip)} • <b>Ville :</b> ${escapeHtml(city)}</div>
      <div><b>Nom du propriétaire :</b> ${escapeHtml(ownerName)}</div>
      <div><b>Téléphone propriétaire :</b> ${escapeHtml(ownerPhone)}</div>
      <div><b>Compte lié :</b> ${ownerUid ? "✅ " + escapeHtml(ownerEmail || ownerUid) : "⛔ non"}</div>
    `;
  }

  let editingBookingId = null; // null => create
  let editingBookingSource = "manual";

  function setBookingMode(mode){
    const readonly = (mode === "view");
    [
      bookingHomeSelect,
      arrivalDateInput,
      departureDateInput,
      arrivalTimeInput,
      departureTimeInput,
      metaInput
    ].forEach(el => el.disabled = readonly);

    saveBookingBtn.style.display = readonly ? "none" : "inline-flex";

    const showEditActions = !!editingBookingId && !readonly;
    deleteBookingBtn.style.display = showEditActions ? "inline-flex" : "none";
    archiveBookingBtn.style.display = showEditActions ? "inline-flex" : "none";

    bookingModalTitle.textContent =
      readonly ? "Détail réservation" : (editingBookingId ? "Modifier une réservation" : "Créer une réservation");

    bookingModalHint.innerHTML =
      readonly
        ? `Lecture seule • iCal: <b>icalEvents/${escapeHtml(editingBookingId || "")}</b>`
        : `Réservation <b>manuelle</b> → écrit dans <b>icalEvents</b> avec <b>homeId</b> + <b>dateKeys</b>.`;
  }

  function openBookingModal(homeId=null){
    hideBookingAlert();

    bookingBackdrop.style.display = "flex";
    bookingBackdrop.setAttribute("aria-hidden","false");

    if(!editingBookingId){
      const todayKey = toDateKey(new Date());
      arrivalDateInput.value = todayKey;
      departureDateInput.value = todayKey;
      arrivalTimeInput.value = "16:00";
      departureTimeInput.value = "10:00";
      metaInput.value = "";
      fillBookingHomeSelect(homeId);
    }

    setTimeout(()=> bookingHomeSelect.focus(), 0);
  }

  function closeBookingModal(){
    bookingBackdrop.style.display = "none";
    bookingBackdrop.setAttribute("aria-hidden","true");
    bookingForm.reset();
    hideBookingAlert();
    editingBookingId = null;
    editingBookingSource = "manual";
    deleteBookingBtn.style.display = "none";
    archiveBookingBtn.style.display = "none";
    saveBookingBtn.style.display = "inline-flex";
    setBookingMode("edit");
  }

  bookingHomeSelect.addEventListener("change", ()=> renderBookingHomeInfo(bookingHomeSelect.value));
  cancelBookingBtn.addEventListener("click", closeBookingModal);
  bookingBackdrop.addEventListener("click", (e)=>{ if(e.target === bookingBackdrop) closeBookingModal(); });

  async function loadBookingIntoModal(bookingId, mode="view"){
    hideBookingAlert();

    const user = auth.currentUser;
    if(!user?.uid) {
      showBookingAlert("Non connecté.");
      return;
    }

    const snap = await getDoc(doc(db, "icalEvents", bookingId));
    if(!snap.exists()){
      showBookingAlert("Réservation introuvable.");
      return;
    }

    const b = snap.data() || {};

    if((b.conciergerieUid || "") !== user.uid){
      showBookingAlert("Accès refusé (réservation autre conciergerie).");
      mode = "view";
    }

    editingBookingId = bookingId;
    editingBookingSource = (b.source || "import").toString();

    fillBookingHomeSelect(b.homeId || "");
    arrivalDateInput.value = b.arrivalDateKey || b.dateKey || "";
    departureDateInput.value = b.departureDateKey || (Array.isArray(b.dateKeys) ? (b.dateKeys[b.dateKeys.length-1] || "") : "");
    arrivalTimeInput.value = b.arrivalTime || "16:00";
    departureTimeInput.value = b.departureTime || "10:00";
    metaInput.value = b.meta || b.summary || "";

    if(editingBookingSource !== "manual"){
      mode = "view";
      showBookingAlert("Réservation iCal importée : lecture seule.", true);
    }

    setBookingMode(mode);
    renderBookingHomeInfo(bookingHomeSelect.value);
  }

  // ===== Render list =====
  function render(){
    const q = norm(searchInputEl.value);
    let homes = allHomes.slice();
    homes = homes.filter(h => showArchived ? true : !isArchived(h));

    const filtered = !q ? homes : homes.filter(h=>{
      const hay = [
        h.name,
        h.homeCity, h.city,
        h.homeZip, h.zip,
        h.homeAddress, h.address,
        h.ownerName, h.homeOwner,
        h.ownerPhone,
        h.type, h.homeType,
        h.ownerAccountEmail, h.ownerEmail,
        h.ownerUid
      ].map(norm).join(" ");
      return hay.includes(q);
    });

    countLabelEl.textContent = filtered.length + " / " + homes.length;
    homesListEl.innerHTML = "";

    if(!filtered.length){
      const e = document.createElement("div");
      e.className = "empty";
      e.textContent = homes.length
        ? "Aucun résultat."
        : "Aucun logement. Clique sur “+ Ajouter”.";
      homesListEl.appendChild(e);
      return;
    }

    filtered.forEach(h=>{
      const item = document.createElement("div");
      item.className = "item";

      const statusChip = isArchived(h) ? `<span class="chip">Archivé</span>` : "";
      const addr = (h.homeAddress || h.address || "").trim();
      const zip = (h.homeZip || h.zip || "").toString().trim();
      const city = (h.homeCity || h.city || "").toString().trim();
      const ownerLabel = (h.ownerName || h.homeOwner || "").trim() || "—";
      const ownerPhone = (h.ownerPhone || "").trim();

      const ownerUid = (h.ownerUid || "").toString().trim();
      const ownerEmail = (h.ownerAccountEmail || h.ownerEmail || "").toString().trim();

      const accountChip = ownerUid
        ? `<span class="chip">Compte lié ✅</span>`
        : `<span class="chip">Compte non lié ⛔</span>`;

      const bookingBtn = isArchived(h)
        ? `<span class="mini-btn disabled">Réservation</span>`
        : `<button class="mini-btn primary" type="button" data-book="${h.id}">+ Réservation</button>`;

      item.innerHTML = `
        <div class="item-top">
          <div style="min-width:0;">
            <div class="item-title">${escapeHtml(h.name || "Logement")}</div>
            <div class="item-meta">
              ${escapeHtml(city || "—")}${zip ? ` (${escapeHtml(zip)})` : ""}
              ${addr ? ` • <b>${escapeHtml(addr)}</b>` : ""}
              <br/>Propriétaire : <b>${escapeHtml(ownerLabel)}</b>
              ${ownerPhone ? `<br/>📞 ${escapeHtml(ownerPhone)}` : ""}
              ${ownerUid ? `<br/>Compte : <b>${escapeHtml(ownerEmail || ownerUid)}</b>` : ``}
            </div>
            <div class="chips">
              <span class="chip">${escapeHtml(h.homeType || h.type || "Type")}</span>
              ${addr ? `<span class="chip">Adresse OK</span>` : `<span class="chip">Adresse manquante</span>`}
              ${zip ? `<span class="chip">CP OK</span>` : `<span class="chip">CP manquant</span>`}
              ${(ownerPhone ? `<span class="chip">Tel OK</span>` : `<span class="chip">Tel manquant</span>`)}
              ${accountChip}
              ${statusChip}
            </div>
          </div>

          <div class="item-actions">
            ${bookingBtn}
            <button class="mini-btn" type="button" data-edit="${h.id}">✏️ Modifier</button>
            <button class="mini-btn red" type="button" data-delete="${h.id}">Supprimer</button>
            ${
              isArchived(h)
                ? `<button class="mini-btn" type="button" data-unarchive="${h.id}">Restaurer</button>`
                : `<button class="mini-btn" type="button" data-archive="${h.id}">Archiver</button>`
            }
          </div>
        </div>
      `;

      homesListEl.appendChild(item);
      item.querySelectorAll(".item-actions button, .item-actions a").forEach(el=>{
        el.addEventListener("click", (e)=> e.stopPropagation());
      });
    });

    homesListEl.querySelectorAll("button[data-book]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const homeId = btn.getAttribute("data-book");
        editingBookingId = null;
        editingBookingSource = "manual";
        openBookingModal(homeId);
        setBookingMode("edit");
      });
    });

    homesListEl.querySelectorAll("button[data-edit]").forEach(btn=>{
      btn.addEventListener("click", ()=>{
        const id = btn.getAttribute("data-edit");
        const h = allHomes.find(x=>x.id===id);
        if(h) openHomeModalEdit(h);
      });
    });

    homesListEl.querySelectorAll("button[data-archive]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        hideAlert();
        const id = btn.getAttribute("data-archive");
        if(!confirm("Archiver ce logement ?")) return;

        try{
          await updateDoc(doc(db,"homes",id), {
            status: "archived",
            archivedAt: serverTimestamp()
          });
          const h = allHomes.find(x=>x.id===id);
          if(h) h.status = "archived";
          render();
        }catch(err){
          console.error(err);
          showAlert("Erreur archive : " + (err?.message || "inconnue"));
        }
      });
    });

    homesListEl.querySelectorAll("button[data-unarchive]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        hideAlert();
        const id = btn.getAttribute("data-unarchive");
        try{
          await updateDoc(doc(db,"homes",id), {
            status: "active",
            unarchivedAt: serverTimestamp()
          });
          const h = allHomes.find(x=>x.id===id);
          if(h) h.status = "active";
          render();
        }catch(err){
          console.error(err);
          showAlert("Erreur restauration : " + (err?.message || "inconnue"));
        }
      });
    });

    // Delete (blocked if any events/icalEvents)
    homesListEl.querySelectorAll("button[data-delete]").forEach(btn=>{
      btn.addEventListener("click", async ()=>{
        hideAlert();
        const id = btn.getAttribute("data-delete");

        try{
          const qEv = query(
            collection(db,"events"),
            where("conciergerieUid","==", currentUid),
            where("homeId","==", id),
            limit(1)
          );
          const sEv = await getDocs(qEv);
          if(!sEv.empty){
            showAlert("⛔ Suppression bloquée : prestations existent. Utilise “Archiver”.");
            return;
          }

          const qIc = query(
            collection(db,"icalEvents"),
            where("conciergerieUid","==", currentUid),
            where("homeId","==", id),
            limit(1)
          );
          const sIc = await getDocs(qIc);
          if(!sIc.empty){
            showAlert("⛔ Suppression bloquée : réservations existent. Utilise “Archiver”.");
            return;
          }
        }catch(err){
          console.error(err);
          showAlert("Erreur vérification : " + (err?.message || "inconnue"));
          return;
        }

        if(!confirm("Supprimer définitivement ?")) return;

        try{
          await deleteDoc(doc(db,"homes", id));
          allHomes = allHomes.filter(x=>x.id !== id);
          render();
          showAlert("✅ Logement supprimé.", true);
        }catch(err){
          console.error(err);
          showAlert("Erreur suppression : " + (err?.message || "inconnue"));
        }
      });
    });
  }

  // ===== Home modal open/close =====
  addBtn.addEventListener("click", openHomeModalCreate);
  cancelBtn.addEventListener("click", closeHomeModal);
  modalBackdrop.addEventListener("click", (e)=>{ if(e.target === modalBackdrop) closeHomeModal(); });

  // ===== Create / Update home =====
  homeForm.addEventListener("submit", async (e)=>{
    e.preventDefault();
    hideAlert();

    const user = auth.currentUser;
    if(!user?.uid){
      showAlert("Non connecté. Recharge la page.");
      return;
    }

    const name = homeName.value.trim();
    const addr = homeAddress.value.trim();
    const zip  = cleanZip(homeZip.value);
    const city = homeCity.value.trim();
    const ownerName = ownerNameEl.value.trim();
    const ownerPhone = cleanPhone(ownerPhoneEl.value);
    const type = homeType.value;

    if(!name || !addr || !zip || !city || !ownerName || !ownerPhone || !type){
      showAlert("Champs obligatoires manquants.");
      return;
    }
    if(!validateZip(zip)){
      showAlert("Code postal invalide (5 chiffres).");
      return;
    }

    saveBtn.disabled = true;

    try{
      const payload = {
        name,
        homeAddress: addr,
        homeCity: city,
        homeZip: zip,
        ownerName,
        ownerPhone,
        homeType: type,

        // compat / recherche
        address: addr,
        city,
        zip,
        homeOwner: ownerName,
        type,

        // lien compte propriétaire (optionnel)
        ownerUid: linkedOwnerUid || "",
        ownerAccountEmail: linkedOwnerEmail || "",
        ownerAccountName: linkedOwnerName || "",

        // compat clients.html (évite EMAIL MANQUANT si ton écran lit ownerEmail)
        ownerEmail: linkedOwnerEmail || "",
        ownerFullname: linkedOwnerName || "",

        updatedAt: serverTimestamp()
      };

      if(editingHomeId){
        await updateDoc(doc(db,"homes", editingHomeId), payload);
        closeHomeModal();
        await loadHomes();
        showAlert("✅ Logement modifié.", true);
      }else{
        await addDoc(collection(db,"homes"), {
          conciergerieUid: user.uid,
          status: "active",
          createdAt: serverTimestamp(),
          ...payload
        });

        closeHomeModal();
        await loadHomes();
        showAlert("✅ Logement créé.", true);
      }
    }catch(err){
      console.error(err);
      showAlert("Erreur enregistrement : " + (err?.message || "inconnue"));
    }finally{
      saveBtn.disabled = false;
    }
  });

  // ===== Create / Update booking (icalEvents) =====
  bookingForm.addEventListener("submit", async (e) => {
    e.preventDefault();
    hideBookingAlert();

    const user = auth.currentUser;
    if (!user?.uid) {
      showBookingAlert("Non connecté. Recharge la page.");
      return;
    }

    if(editingBookingId && editingBookingSource !== "manual"){
      showBookingAlert("Réservation iCal importée : modification interdite.", false);
      return;
    }

    const homeId = (bookingHomeSelect.value || "").trim();
    const aDate  = (arrivalDateInput.value || "").trim();
    const dDate  = (departureDateInput.value || "").trim();
    const aTime  = (arrivalTimeInput.value || "").trim();
    const dTime  = (departureTimeInput.value || "").trim();
    const meta   = (metaInput.value || "").trim();

    if (!homeId) return showBookingAlert("Choisis un logement.");
    if (!aDate || !dDate) return showBookingAlert("Dates arrivée + départ obligatoires.");
    if (!aTime || !dTime) return showBookingAlert("Heures arrivée + départ obligatoires.");

    const h = allHomes.find(x => x.id === homeId);
    if (!h) return showBookingAlert("Logement introuvable. Recharge la page.");

    const dateKeys = buildDateKeys(aDate, dDate);
    if (!dateKeys.length) return showBookingAlert("Erreur dates (YYYY-MM-DD).");

    saveBookingBtn.disabled = true;
    saveBookingBtn.style.opacity = "0.75";

    try {
      const payloadBase = {
        conciergerieUid: user.uid,
        homeId: String(h.id),

        homeName: String(h?.name || "Logement"),
        homeCity: String(h?.homeCity || h?.city || ""),
        homeAddress: String(h?.homeAddress || h?.address || ""),
        homeZip: String(h?.homeZip || h?.zip || ""),
        ownerName: String(h?.ownerName || h?.homeOwner || ""),
        ownerPhone: String(h?.ownerPhone || ""),

        ownerUid: String(h?.ownerUid || ""),
        ownerAccountEmail: String(h?.ownerAccountEmail || ""),
        ownerAccountName: String(h?.ownerAccountName || ""),

        ownerEmail: String(h?.ownerEmail || h?.ownerAccountEmail || ""),
        ownerFullname: String(h?.ownerFullname || h?.ownerAccountName || ""),

        arrivalDateKey: String(aDate),
        departureDateKey: String(dDate),
        arrivalTime: String(aTime),
        departureTime: String(dTime),

        dateKey: String(aDate),
        dateKeys: dateKeys.map(String),

        meta: String(meta || ""),
        timezone: "Europe/Paris",
        archived: false
      };

      let bookingId = editingBookingId;

      if(editingBookingId){
        await updateDoc(doc(db, "icalEvents", editingBookingId), {
          ...payloadBase,
          source: "manual",
          updatedAt: serverTimestamp()
        });
        showBookingAlert("✅ Réservation modifiée.", true);
      }else{
        const ref = await addDoc(collection(db, "icalEvents"), {
          ...payloadBase,
          source: "manual",
          createdAt: serverTimestamp()
        });
        bookingId = ref.id;
        showBookingAlert("✅ Réservation enregistrée.", true);
      }

      const params = new URLSearchParams();
      params.set("date", aDate);
      params.set("bookingId", bookingId);
      setTimeout(() => { location.href = `planning.html?${params.toString()}`; }, 250);

    } catch (err) {
      console.error(err);
      showBookingAlert("Erreur réservation : " + (err?.message || "inconnue"));
    } finally {
      saveBookingBtn.disabled = false;
      saveBookingBtn.style.opacity = "1";
    }
  });

  // ===== Delete / Archive booking (uniquement manual) =====
  deleteBookingBtn.addEventListener("click", async ()=>{
    hideBookingAlert();
    const user = auth.currentUser;
    if(!user?.uid) return showBookingAlert("Non connecté.");
    if(!editingBookingId) return;
    if(editingBookingSource !== "manual") return showBookingAlert("Suppression interdite (import iCal).");

    if(!confirm("Supprimer définitivement cette réservation ?")) return;
    try{
      await deleteDoc(doc(db,"icalEvents", editingBookingId));
      showBookingAlert("✅ Réservation supprimée.", true);
      setTimeout(()=> location.href = "planning.html", 250);
    }catch(err){
      console.error(err);
      showBookingAlert("Erreur suppression : " + (err?.message || "inconnue"));
    }
  });

  archiveBookingBtn.addEventListener("click", async ()=>{
    hideBookingAlert();
    const user = auth.currentUser;
    if(!user?.uid) return showBookingAlert("Non connecté.");
    if(!editingBookingId) return;
    if(editingBookingSource !== "manual") return showBookingAlert("Archivage interdit (import iCal).");

    if(!confirm("Archiver cette réservation ?")) return;
    try{
      await updateDoc(doc(db,"icalEvents", editingBookingId), {
        archived: true,
        archivedAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      });
      showBookingAlert("✅ Réservation archivée.", true);
      setTimeout(()=> location.href = "planning.html", 250);
    }catch(err){
      console.error(err);
      showBookingAlert("Erreur archivage : " + (err?.message || "inconnue"));
    }
  });

  // ===== Events =====
  searchInputEl.addEventListener("input", render);

  toggleArchivedBtn.addEventListener("click", ()=>{
    showArchived = !showArchived;
    toggleArchivedBtn.textContent = showArchived ? "Masquer archivés" : "Afficher archivés";
    render();
  });

  logoutBtn.addEventListener("click", async ()=>{
    await signOut(auth);
    localStorage.removeItem("cm_auth");
    location.href = "index.html";
  });

  // ===== Init =====
  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      location.href = "login.html?role=conciergerie";
      return;
    }

    const ok = await guardConciergerie(user);
    if(!ok){
      showAlert("⛔ Abonnement inactif.");
      setTimeout(()=> location.href = "abonnement.html?plan=starter", 700);
      return;
    }

    badgeLine.textContent = "Gestion des logements • " + (user.email || user.uid);
    await loadHomes();

    // ouverture modale réservation depuis URL:
    // logements.html?bookingId=XXX&mode=view|edit
    const bookingId = getParam("bookingId");
    const mode = (getParam("mode") || "view").toLowerCase();

    if(bookingId){
      editingBookingId = bookingId;
      openBookingModal();
      await loadBookingIntoModal(bookingId, (mode === "edit" ? "edit" : "view"));
    }
  });
</script>

</body>
</html>
