<!-- docs/equipe.html (FINAL — KPI par agent (mois) + liste prestations/logements ; no logout ; logique finishAll via opStatus/proofToken) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Équipe</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d; --warn:#b06b00;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
    }

    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:1080px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:20; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }

    .wrap{ width:100%; max-width:1080px; display:flex; flex-direction:column; gap:10px; margin-top:6px; }

    .logo{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:8px; margin-bottom:4px; text-align:center;
    }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:13px; color:#444; text-align:center; font-weight:800; }
    .emailLine{ margin-top:4px; font-size:12px; color:var(--muted); font-weight:900; text-align:center; }

    .alert{
      display:none; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:900; color:#444; white-space:pre-wrap;
      max-width:1080px; width:100%;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
      min-width:0;
    }

    .cardTitle{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      font-size:14px; font-weight:900; color:#111;
      margin-bottom:8px;
      flex-wrap:wrap;
    }
    .tiny{ font-size:12px; color:var(--muted); font-weight:900; }

    .toolbar{
      display:grid;
      grid-template-columns: 220px 1fr auto;
      gap:10px;
      align-items:center;
      margin-top:10px;
    }
    @media(max-width:980px){ .toolbar{ grid-template-columns: 1fr; } }

    .select, .input{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.35);
      background:#fff;
      font-weight:900;
      color:#222;
      outline:none;
    }
    .input{
      border-color: rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,0.06);
    }

    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:3px 9px; border-radius:999px;
      font-size:11px; font-weight:900; white-space:nowrap;
      background:rgba(122,92,255,0.12); color:#5b45c8;
    }
    .badge.ok{ background:rgba(27,143,77,0.14); color:var(--ok); }

    .list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }

    .agentCard{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:12px;
      min-width:0;
    }

    .aHead{
      display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
      flex-wrap:wrap;
    }
    .aName{
      font-size:13px; font-weight:1000; color:#222;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:780px;
    }
    .aMail{
      margin-top:3px;
      font-size:12px; font-weight:900; color:#666;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:780px;
    }

    .lines{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .line{
      display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
      padding:8px 10px;
      border-radius:12px;
      background:rgba(0,0,0,0.02);
      font-size:12px;
      font-weight:900;
      color:#333;
      min-width:0;
    }
    .line .mut{ color:#666; font-weight:900; white-space:nowrap; }
    .line .txt{ min-width:0; flex:1; }
    .ellipsis{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; gap: 6px; justify-content: space-around; align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none;
      font-size: 11px; font-weight:900; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff; box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        max-width: 1080px;
        margin: 12px auto 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="planning.html">← Planning</a>
      <span></span>
    </div>

    <div class="wrap">
      <div class="logo">
        <div class="logo-icon">✓</div>
        <h1>CleanUp Manager</h1>
      </div>

      <div class="subtitle">Équipe — prestations terminées</div>
      <div class="emailLine" id="emailLine">—</div>

      <div class="alert" id="alertBox"></div>

      <section class="card">
        <div class="cardTitle">
          <span>Résumé par agent</span>
          <span class="tiny" id="countLine">—</span>
        </div>

        <div class="toolbar">
          <select class="select" id="filterPeriod">
            <option value="THIS_MONTH" selected>Ce mois</option>
            <option value="LAST_MONTH">Mois dernier</option>
            <option value="THIS_YEAR">Cette année</option>
            <option value="ALL">Toute période</option>
          </select>

          <input class="input" id="searchInput" type="search" placeholder="Recherche : agent, mail, logement, type..." />

          <button class="pill primary" id="refreshBtn" type="button">Rafraîchir</button>
        </div>

        <div class="list" id="list"></div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
    <a href="catalogue.html">Catalogue</a>
    <a class="active" href="equipe.html">Équipe</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc,
      collection, query, where, orderBy, limit, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const emailLine = document.getElementById("emailLine");
    const refreshBtn = document.getElementById("refreshBtn");
    const alertBox = document.getElementById("alertBox");

    const filterPeriod = document.getElementById("filterPeriod");
    const searchInput = document.getElementById("searchInput");

    const countLine = document.getElementById("countLine");
    const list = document.getElementById("list");

    const MAX_EVENTS = 2500;

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function norm(s){
      return String(s||"").toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }
    function toMs(v){
      try{
        if(!v) return 0;
        if(v?.toDate?.()) return v.toDate().getTime();
        if(typeof v === "number") return v;
        const s = String(v).trim();
        if(!s) return 0;
        const d = new Date(s);
        return isNaN(d.getTime()) ? 0 : d.getTime();
      }catch{ return 0; }
    }
    function pad2(n){ return String(n).padStart(2,"0"); }
    function fmtDate(ms){
      if(!ms) return "—";
      const d = new Date(ms);
      return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`;
    }
    function fmtTimeFromEvent(e){
      const t = String(e?.time || e?.arrivalTime || "").trim();
      if(t) return t;
      const ms = toMs(e?.updatedAt || e?.createdAt);
      if(!ms) return "";
      const d = new Date(ms);
      return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function monthBounds(which){
      const now = new Date();
      if(which === "ALL") return { fromMs: 0, toMs: Number.MAX_SAFE_INTEGER };

      if(which === "THIS_YEAR"){
        const from = new Date(now.getFullYear(), 0, 1, 0,0,0,0).getTime();
        const to = new Date(now.getFullYear()+1, 0, 1, 0,0,0,0).getTime() - 1;
        return { fromMs: from, toMs: to };
      }

      if(which === "LAST_MONTH"){
        const from = new Date(now.getFullYear(), now.getMonth()-1, 1, 0,0,0,0).getTime();
        const to = new Date(now.getFullYear(), now.getMonth(), 1, 0,0,0,0).getTime() - 1;
        return { fromMs: from, toMs: to };
      }

      const from = new Date(now.getFullYear(), now.getMonth(), 1, 0,0,0,0).getTime();
      const to = new Date(now.getFullYear(), now.getMonth()+1, 1, 0,0,0,0).getTime() - 1;
      return { fromMs: from, toMs: to };
    }

    function typeLabel(e){
      const t = String(e?.type || e?.missionId || "").toUpperCase().trim();
      if(t === "MENAGE") return "Ménage";
      if(t === "CHECKIN") return "Check-in";
      if(t === "CHECKOUT") return "Check-out";
      if(t === "LINGE") return "Linge";
      if(t === "MAINTENANCE") return "Maintenance";
      if(t === "KITS") return "Kits";
      return t || "—";
    }

    // ✅ “Fait par agent” = finishAll de agent.html => opStatus/status + proofToken
    function isDoneEvent(e){
  const st = String(e?.status || "").toUpperCase().trim();
  const op = String(e?.opStatus || "").toUpperCase().trim();

  const DONE_STATUSES = new Set([
    "REALISEE",
    "A_VALIDER",
    "VALIDEE"
  ]);

  const okStatus = DONE_STATUSES.has(st) || DONE_STATUSES.has(op);

  const hasAgent = !!(e?.agentDoneByEmail || e?.assignedToEmail);

  return okStatus && hasAgent;
}

    function pickDoneMs(e){
      // pas de agentDoneAt dans events => on prend updatedAt sinon createdAt
      let ms = toMs(e?.updatedAt) || toMs(e?.createdAt);
      if(ms) return ms;

      // fallback dateKey+time si dispo
      const dk = String(e?.dateKey || "").trim();
      const tt = String(e?.time || "").trim();
      if(dk && /^\d{4}-\d{2}-\d{2}$/.test(dk)){
        const iso = tt && /^\d{2}:\d{2}$/.test(tt) ? `${dk}T${tt}:00` : `${dk}T00:00:00`;
        const d = new Date(iso);
        if(!isNaN(d.getTime())) return d.getTime();
      }
      return 0;
    }

    // Guard conciergerie
    const FREE_EMAILS = new Set(["mathilde.debout31@gmail.com","s.dumas974@gmail.com"]);
    async function guardConciergerie(user){
      const email = (user.email || "").toLowerCase();
      if(FREE_EMAILS.has(email)) return true;
      try{
        const snap = await getDoc(doc(db,"users",user.uid));
        if(!snap.exists()) return false;
        const d = snap.data() || {};
        return (d.role === "conciergerie" || d.role === "admin") && d.subscriptionStatus === "active";
      }catch(e){ return false; }
    }

    // state
    let currentUser = null;
    let rawRows = [];

    function groupByAgent(rows){
      const m = new Map(); // key -> {name,email,items:[]}
      for(const r of rows){
        const key = r.agentEmail || r.agentName;
        if(!m.has(key)){
          m.set(key, { agentName:r.agentName, agentEmail:r.agentEmail, items:[] });
        }
        m.get(key).items.push(r);
      }
      for(const g of m.values()){
        g.items.sort((a,b)=>(b.doneMs||0)-(a.doneMs||0));
      }
      return Array.from(m.values()).sort((a,b)=>{
        const ca = a.items.length, cb = b.items.length;
        if(cb !== ca) return cb - ca;
        const an = (a.agentName||"").localeCompare(b.agentName||"");
        if(an !== 0) return an;
        return (a.agentEmail||"").localeCompare(b.agentEmail||"");
      });
    }

    function matchesSearch(r){
      const q = norm(searchInput.value || "");
      if(!q) return true;
      const hay = norm([r.agentName,r.agentEmail,r.homeName,r.homeCity,r.type].filter(Boolean).join(" "));
      return hay.includes(q);
    }

    function render(){
      const { fromMs, toMs } = monthBounds(filterPeriod.value);

      const scoped = rawRows.filter(r=>{
        if(!r.doneMs) return false;
        if(!(r.doneMs >= fromMs && r.doneMs <= toMs)) return false;
        if(!matchesSearch(r)) return false;
        return true;
      });

      countLine.textContent = `${scoped.length} prestation(s)`;

      list.innerHTML = "";
      if(!scoped.length){
        list.innerHTML = `
          <div class="agentCard">
            <div style="font-weight:1000;">Aucun résultat</div>
            <div class="tiny" style="margin-top:4px;">Change la période ou la recherche.</div>
          </div>`;
        return;
      }

      const groups = groupByAgent(scoped);

      for(const g of groups){
        const div = document.createElement("div");
        div.className = "agentCard";

        div.innerHTML = `
          <div class="aHead">
            <div style="min-width:0;">
              <div class="aName">${esc(g.agentName || "Agent")}</div>
              <div class="aMail">${esc(g.agentEmail || "—")}</div>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
              <span class="badge ok">${esc(String(g.items.length))} prestation(s)</span>
            </div>
          </div>

          <div class="lines">
            ${g.items.slice(0, 60).map(r=>`
              <div class="line">
                <span class="mut">${esc(r.date)}${r.time ? " " + esc(r.time) : ""}</span>
                <div class="txt">
                  <div class="ellipsis">${esc(r.type)} — ${esc(r.homeName)}${r.homeCity ? " • " + esc(r.homeCity) : ""}</div>
                </div>
              </div>
            `).join("")}
            ${g.items.length > 60 ? `<div class="tiny">+ ${esc(String(g.items.length - 60))} autre(s) non affichée(s)</div>` : ``}
          </div>
        `;

        list.appendChild(div);
      }
    }

    async function loadEvents(){
      hideAlert();
      list.innerHTML = "";
      countLine.textContent = "Chargement…";

      const uid = currentUser.uid;

      const qE = query(
        collection(db,"events"),
        where("conciergerieUid","==", uid),
        orderBy("createdAt","desc"),
        limit(MAX_EVENTS)
      );

      showAlert("Chargement…", true);

      const snap = await getDocs(qE);
      const events = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));

      const out = [];
      for(const e of events){
        if(!isDoneEvent(e)) continue;

        const agentEmail = normalizeEmail(e?.agentDoneByEmail || e?.assignedToEmail || "");
        const agentName  = String(e?.agentDoneByName || e?.assignedToName || "").trim();

        if(!agentEmail && !agentName) continue;

        const doneMs = pickDoneMs(e);
        out.push({
          doneMs,
          date: fmtDate(doneMs),
          time: fmtTimeFromEvent(e),
          agentEmail: agentEmail || "—",
          agentName: agentName || "Agent",
          homeName: String(e?.homeName || "Logement").trim() || "Logement",
          homeCity: String(e?.homeCity || e?.city || "").trim(),
          type: typeLabel(e),
        });
      }

      rawRows = out;

      hideAlert();
      render();

      if(!rawRows.length){
        showAlert("Aucune prestation terminée trouvée.", true);
        setTimeout(hideAlert, 1800);
      }
    }

    filterPeriod.addEventListener("change", render);
    searchInput.addEventListener("input", render);
    refreshBtn.addEventListener("click", ()=> loadEvents().catch(err=>{
      console.error(err);
      showAlert("Erreur chargement : " + (err?.message || "inconnue"));
    }));

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      const ok = await guardConciergerie(user);
      if(!ok){
        location.href = "abonnement.html?plan=starter";
        return;
      }
      currentUser = user;
      emailLine.textContent = user.email || user.uid;

      try{
        await loadEvents();
      }catch(err){
        console.error(err);
        showAlert("Erreur chargement équipe : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
