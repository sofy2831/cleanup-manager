<!-- docs/reglements.html (FINAL — suivi paiements factures) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Règlements</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet);
      color:var(--violet);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .logo-title{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:10px;
      margin-bottom:6px;
      text-align:center;
    }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff;
      border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet);
      font-size:22px;font-weight:900;
      position:relative;
      flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-5px;
      font-size:12px;
      color:var(--violet);
    }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }
    .emailLine{ margin-top:4px; font-size:13px; color:var(--muted); font-weight:800; text-align:center; }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      min-width:0;
    }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .toolbar{
      display:grid;
      grid-template-columns: 220px 1fr auto;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:720px){
      .toolbar{ grid-template-columns: 1fr; }
    }

    .select{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.35);
      background:#fff;
      font-weight:900;
      color:#222;
      outline:none;
    }

    .searchbar{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      min-width:0;
    }
    .s-ico{ font-size:14px; opacity:.75; }
    .input{
      flex:1;
      border:none;
      outline:none;
      font-size:13px;
      font-weight:900;
      color:#111;
      background:transparent;
      min-width:0;
    }

    .btn{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      text-decoration:none;
      font-weight:900;
      font-size:12px;
      background:#fff;
      color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
      user-select:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:#333;
      white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    .tag{
      display:inline-flex; align-items:center; justify-content:center;
      padding:4px 8px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:var(--violet);
    }

    /* Ligne "liste" proche de devis-liste */
    .line6{
      display:grid;
      grid-template-columns: 110px 160px 1.2fr 1.2fr 1.1fr 130px;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:900px){
      .line6{
        grid-template-columns: 110px 160px 1fr 1fr;
        grid-auto-rows:auto;
      }
    }
    @media(max-width:560px){
      .line6{ grid-template-columns: 1fr 1fr; }
    }
    .cell{ min-width:0; }
    .cell .t{ font-size:11px; color:#666; font-weight:900; }
    .cell .v{ font-size:13px; color:#111; font-weight:900; }
    .v.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:flex-start;
      min-width:0;
      margin-top:10px;
    }
    .k{
      min-width:220px;
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:0;
    }
    .k .t{ font-size:12px; color:#666; font-weight:900; }
    .k .v{ font-size:13px; color:#111; font-weight:900; }

    /* mini modal */
    .modalBack{
      position:fixed; inset:0; background:rgba(0,0,0,.35);
      display:none; align-items:center; justify-content:center; padding:16px; z-index:100;
    }
    .modal{
      width:100%; max-width:520px;
      background:#fff; border-radius:18px; border:1px solid var(--border);
      box-shadow:0 18px 50px rgba(0,0,0,.20);
      padding:14px 14px 12px;
    }
    .modalTitle{ font-weight:1000; font-size:14px; }
    label{ display:block; margin-top:10px; font-size:12px; font-weight:1000; color:#333; }
    input, select, textarea{
      width:100%; padding:10px 12px; border-radius:12px;
      border:1px solid rgba(122,92,255,0.35);
      font-weight:900; outline:none;
    }
    textarea{ resize:vertical; }
    .modalActions{ display:flex; gap:8px; margin-top:12px; }
    .modalActions .btn{ flex:1; }

    .bottom-nav{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 50;
      display: flex;
      gap: 6px;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 900;
      color: #666;
      padding: 10px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        width: 100%;
        max-width: 980px;
        margin: 14px 0 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px;
        gap: 10px;
      }
      .bottom-nav a{
        font-size: 13px;
        padding: 12px 12px;
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="compta.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon">€</div>
      <h1>Règlements</h1>
    </div>

    <div class="subtitle">Marquer les factures payées • trace paiement • export</div>
    <div class="emailLine" id="companyLine">—</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="card">
        <div class="toolbar">
          <select class="select" id="filterPay">
            <option value="ALL">Tous</option>
            <option value="UNPAID">À encaisser</option>
            <option value="PAID">Payées</option>
          </select>

          <div class="searchbar" title="Recherche">
            <span class="s-ico">🔎</span>
            <input class="input" id="searchInput" type="search" placeholder="N° facture, client, logement…" autocomplete="off" />
          </div>

          <button class="btn primary" id="exportBtn" type="button">Exporter CSV</button>
        </div>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <!-- Modal paiement -->
  <div class="modalBack" id="modalBack" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modalTitle" id="modalTitle">Paiement</div>

      <label for="payDate">Date paiement</label>
      <input id="payDate" type="date" />

      <label for="payMethod">Mode</label>
      <select id="payMethod">
        <option value="VIREMENT">Virement</option>
        <option value="CB">CB</option>
        <option value="CHEQUE">Chèque</option>
        <option value="ESPECES">Espèces</option>
        <option value="AUTRE">Autre</option>
      </select>

      <label for="payNote">Note (optionnel)</label>
      <textarea id="payNote" rows="3" placeholder="Référence, détail, partiel…"></textarea>

      <div class="modalActions">
        <button class="btn" id="cancelBtn" type="button">Annuler</button>
        <button class="btn primary" id="confirmBtn" type="button">Marquer payée</button>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, updateDoc, serverTimestamp,
      collection, query, where, orderBy, limit, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const companyLine = document.getElementById("companyLine");
    const alertBox = document.getElementById("alertBox");
    const filterPay = document.getElementById("filterPay");
    const searchInput = document.getElementById("searchInput");
    const exportBtn = document.getElementById("exportBtn");
    const listBox = document.getElementById("listBox");

    // modal
    const modalBack = document.getElementById("modalBack");
    const modalTitle = document.getElementById("modalTitle");
    const payDate = document.getElementById("payDate");
    const payMethod = document.getElementById("payMethod");
    const payNote = document.getElementById("payNote");
    const cancelBtn = document.getElementById("cancelBtn");
    const confirmBtn = document.getElementById("confirmBtn");

    let currentUser = null;
    let all = [];
    let targetEventId = null;

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }

    function fmtDateFR(x){
      if(!x) return "—";
      try{
        if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
        const s = String(x).trim();
        if(!s) return "—";
        if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
        const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if(m) return `${m[3]}/${m[2]}/${m[1]}`;
        const d = new Date(s);
        if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
        return "—";
      }catch{ return "—"; }
    }

    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }

    function getInvoiceTotal(ev){
      if(ev?.invoiceTotal != null && ev.invoiceTotal !== "") return Number(ev.invoiceTotal);
      if(ev?.total != null && ev.total !== "") return Number(ev.total);
      if(ev?.invoiceAmount != null && ev.invoiceAmount !== "") return Number(ev.invoiceAmount);
      return computeTotalFromLines(ev?.lines);
    }

    function isPaid(ev){
      const inv = String(ev?.invoiceStatus||"").toUpperCase().trim();
      const pay = String(ev?.paymentStatus||"").toUpperCase().trim();
      const cs  = String(ev?.commercialStatus||"").toUpperCase().trim();
      return inv === "PAID" || pay === "PAID" || cs === "PAYE";
    }

    function badgePaid(ev){
      return isPaid(ev)
        ? `<span class="badge ok">Payée</span>`
        : `<span class="badge bad">À encaisser</span>`;
    }

    function matchesFilter(ev){
      const f = filterPay.value;
      if(f === "ALL") return true;
      if(f === "PAID") return isPaid(ev);
      if(f === "UNPAID") return !isPaid(ev);
      return true;
    }

    function matchesSearch(ev){
      const q = (searchInput.value||"").trim().toLowerCase();
      if(!q) return true;
      const hay = [
        ev.invoiceNumber, ev.ownerName, ev.ownerEmail, ev.homeName, ev.homeCity
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    }

    function getFiltered(){
      return all.filter(ev => matchesFilter(ev) && matchesSearch(ev));
    }

    function todayISO(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return `${yyyy}-${mm}-${dd}`;
    }

    function openModalFor(eventId, invoiceNumber){
      targetEventId = eventId;
      modalTitle.textContent = `Marquer payée — ${invoiceNumber || "Facture"}`;
      payDate.value = todayISO();
      payMethod.value = "VIREMENT";
      payNote.value = "";
      modalBack.style.display = "flex";
      modalBack.setAttribute("aria-hidden","false");
    }

    function closeModal(){
      modalBack.style.display = "none";
      modalBack.setAttribute("aria-hidden","true");
      targetEventId = null;
    }

    cancelBtn.addEventListener("click", closeModal);
    modalBack.addEventListener("click", (e)=>{ if(e.target === modalBack) closeModal(); });

    async function markPaid(eventId, payload){
      await updateDoc(doc(db,"events",eventId),{
        invoiceStatus: "PAID",
        paymentStatus: "PAID",
        paidAt: serverTimestamp(),
        paymentDate: payload.paymentDate || null,
        paymentMethod: payload.paymentMethod || null,
        paymentNote: payload.paymentNote || "",
        commercialStatus: "PAYE",
        commercialUpdatedAt: serverTimestamp()
      });
    }

    async function markUnpaid(eventId){
      await updateDoc(doc(db,"events",eventId),{
        invoiceStatus: "SENT",
        paymentStatus: "UNPAID",
        paymentDate: null,
        paymentMethod: null,
        paymentNote: "",
        commercialStatus: "FACTURE_ENVOYEE",
        commercialUpdatedAt: serverTimestamp()
      });
    }

    confirmBtn.addEventListener("click", async ()=>{
      if(!targetEventId) return;
      confirmBtn.disabled = true;
      hideAlert();
      try{
        await markPaid(targetEventId,{
          paymentDate: payDate.value || "",
          paymentMethod: payMethod.value || "",
          paymentNote: payNote.value || ""
        });

        const idx = all.findIndex(x=>x.id===targetEventId);
        if(idx>=0){
          all[idx].invoiceStatus = "PAID";
          all[idx].paymentStatus = "PAID";
          all[idx].paymentDate = payDate.value;
          all[idx].paymentMethod = payMethod.value;
          all[idx].paymentNote = payNote.value;
        }

        closeModal();
        showAlert("✅ Facture marquée payée.", true);
        render();
      }catch(e){
        console.error(e);
        showAlert("⛔ Impossible de marquer payée : " + (e?.message || "inconnu"));
      }finally{
        confirmBtn.disabled = false;
      }
    });

    function toCsvValue(v){
      const s = String(v ?? "");
      return `"${s.replaceAll('"','""')}"`;
    }

    function exportCsv(){
      const rows = getFiltered();
      const header = [
        "eventId","numero_facture","statut","date_paiement","mode","montant","client","email","logement","ville","note"
      ];
      const lines = [header.join(";")];

      for(const r of rows){
        const total = getInvoiceTotal(r);
        const st = isPaid(r) ? "PAID" : "UNPAID";

        const line = [
          r.id,
          (r.invoiceNumber || ""),
          st,
          (r.paymentDate || ""),
          (r.paymentMethod || ""),
          (Number.isFinite(total) ? total.toFixed(2) : ""),
          (r.ownerName || ""),
          (r.ownerEmail || ""),
          (r.homeName || ""),
          (r.homeCity || ""),
          (r.paymentNote || "")
        ].map(toCsvValue).join(";");

        lines.push(line);
      }

      const blob = new Blob([lines.join("\n")], { type:"text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `reglements_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    exportBtn.addEventListener("click", exportCsv);

    function render(){
      const filtered = getFiltered();
      listBox.innerHTML = "";

      if(!filtered.length){
        listBox.innerHTML = `
          <div class="card">
            <b>Aucun résultat</b>
            <div style="margin-top:6px; font-size:12px; color:#666; font-weight:800;">Ajuste le filtre ou la recherche.</div>
          </div>`;
        return;
      }

      for(const ev of filtered){
        const invNo = String(ev.invoiceNumber || "").trim() || "FA—";
        const created = fmtDateFR(ev.invoiceCreatedAt || ev.createdAt || ev.dateKey || ev.date);
        const client = (ev.ownerName || "—");
        const home = (ev.homeName || "—");
        const period = ev.arrivalDateKey || ev.departureDateKey
          ? `${fmtDateFR(ev.arrivalDateKey)} → ${fmtDateFR(ev.departureDateKey)}`
          : (ev.dateKey ? String(ev.dateKey) : "—");

        const total = getInvoiceTotal(ev);

        const paid = isPaid(ev);
        const payInfo = paid
          ? `${esc(ev.paymentDate || "—")} • ${esc(ev.paymentMethod || "—")}`
          : "—";

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="line6">
            <div class="cell">
              <div class="t">Créée</div>
              <div class="v">${esc(created)}</div>
            </div>

            <div class="cell">
              <div class="t">Facture</div>
              <div class="v"><span class="tag">FA</span> <span style="margin-left:6px;">${esc(invNo)}</span></div>
            </div>

            <div class="cell">
              <div class="t">Client</div>
              <div class="v ellipsis" title="${esc(client)}">${esc(client)}</div>
            </div>

            <div class="cell">
              <div class="t">Logement</div>
              <div class="v ellipsis" title="${esc(home)}">${esc(home)}</div>
            </div>

            <div class="cell">
              <div class="t">Période</div>
              <div class="v ellipsis" title="${esc(period)}">${esc(period)}</div>
            </div>

            <div class="cell" style="text-align:right;">
              <div class="t">Montant</div>
              <div class="v">${fmtMoney(total)}</div>
            </div>
          </div>

          <div class="row">
            <div class="k">
              <div class="t">Statut</div>
              <div class="v">${badgePaid(ev)}</div>
            </div>

            <div class="k">
              <div class="t">Paiement</div>
              <div class="v">${esc(payInfo)}</div>
            </div>

            <div class="k" style="align-items:flex-end; min-width:320px;">
              <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
                <a class="btn" href="facture.html?eventId=${encodeURIComponent(ev.id)}">Ouvrir</a>
                ${paid
                  ? `<button class="btn" type="button" data-unpay="${esc(ev.id)}">Marquer non payée</button>`
                  : `<button class="btn primary" type="button" data-pay="${esc(ev.id)}" data-inv="${esc(invNo)}">Marquer payée</button>`
                }
              </div>
            </div>
          </div>

          ${paid && (ev.paymentNote || "").trim()
            ? `<div style="margin-top:10px; font-size:12px; color:#444; font-weight:800;">
                 <span style="color:#666; font-weight:900;">Note :</span> ${esc(ev.paymentNote)}
               </div>`
            : ``
          }
        `;
        listBox.appendChild(div);
      }

      // bind buttons
      for(const b of listBox.querySelectorAll("button[data-pay]")){
        b.addEventListener("click", ()=>{
          const id = b.getAttribute("data-pay");
          const inv = b.getAttribute("data-inv");
          openModalFor(id, inv);
        });
      }

      for(const b of listBox.querySelectorAll("button[data-unpay]")){
        b.addEventListener("click", async ()=>{
          const id = b.getAttribute("data-unpay");
          if(!id) return;
          b.disabled = true;
          hideAlert();
          try{
            await markUnpaid(id);
            const idx = all.findIndex(x=>x.id===id);
            if(idx>=0){
              all[idx].invoiceStatus = "SENT";
              all[idx].paymentStatus = "UNPAID";
              all[idx].paymentDate = null;
              all[idx].paymentMethod = null;
              all[idx].paymentNote = "";
            }
            showAlert("✅ Facture repassée en non payée.", true);
            render();
          }catch(e){
            console.error(e);
            showAlert("⛔ Impossible : " + (e?.message || "inconnu"));
            b.disabled = false;
          }
        });
      }
    }

    async function loadCompanyName(user){
      try{
        const snap = await getDoc(doc(db,"users",user.uid));
        const company = snap.exists() ? (snap.data()?.businessProfile?.companyName || "") : "";
        companyLine.textContent = (company || "").trim() || "Conciergerie";
      }catch{
        companyLine.textContent = "Conciergerie";
      }
    }

    async function loadInvoices(uid){
      // On récupère large, et on filtre "factures" côté client (robuste sans indices exotiques)
      const qEvents = query(
        collection(db,"events"),
        where("conciergerieUid","==",uid),
        orderBy("createdAt","desc"),
        limit(500)
      );
      const snap = await getDocs(qEvents);
      const rows = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));

      all = rows.filter(r=>{
        const inv = String(r.invoiceStatus||"").toUpperCase().trim();
        const cs  = String(r.commercialStatus||"").toUpperCase().trim();
        const hasInvNo = String(r.invoiceNumber||"").trim().length > 0;

        // si invoiceStatus est présent -> ok
        if(inv === "DRAFT" || inv === "SENT" || inv === "PAID") return true;

        // compat V1 / statuts commerciaux
        if(cs === "FACTURE" || cs === "FACTURE_ENVOYEE" || cs === "PAYE") return true;

        // fallback: numéro facture = facture
        if(hasInvNo) return true;

        return false;
      });

      render();
    }

    filterPay.addEventListener("change", render);
    searchInput.addEventListener("input", render);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = user;
      await loadCompanyName(user);

      hideAlert();
      try{
        await loadInvoices(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur chargement règlements : " + (e?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
