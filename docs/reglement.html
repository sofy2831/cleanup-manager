<!-- docs/reglement.html (FINAL v2 — "mode de règlement" + date de règlement + "montant réglé" + référence optionnelle) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Règlement</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet);
      color:var(--violet);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .logo-title{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:10px;
      margin-bottom:6px;
      text-align:center;
    }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff;
      border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet);
      font-size:22px;font-weight:900;
      position:relative;
      flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-5px;
      font-size:12px;
      color:var(--violet);
    }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      min-width:0;
    }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .kvs{
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:10px;
    }
    @media(max-width:720px){
      .kvs{ grid-template-columns: 1fr; }
    }
    .kv{
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:10px 12px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      min-width:0;
    }
    .kv .t{ font-size:11px; color:#666; font-weight:900; }
    .kv .v{ margin-top:3px; font-size:13px; color:#111; font-weight:1000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    label{
      display:block;
      margin-top:10px;
      margin-bottom:6px;
      font-size:12px;
      color:#333;
      font-weight:1000;
    }
    input, select, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.35);
      background:#fff;
      outline:none;
      font-weight:900;
      font-size:13px;
      color:#111;
    }
    textarea{ resize:vertical; }

    .row{
      display:flex;
      gap:10px;
      align-items:flex-end;
      flex-wrap:wrap;
    }
    .row > div{ flex:1; min-width:180px; }

    .btns{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:12px;
    }
    .btn{
      flex:1;
      min-width:160px;
      display:inline-flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      text-decoration:none;
      font-weight:1000;
      font-size:12px;
      background:#fff;
      color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
      user-select:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }
    .btn:disabled{ opacity:.45; cursor:not-allowed; pointer-events:none; }

    .badge{
      display:inline-flex; align-items:center; justify-content:center;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:#333;
      white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    .bottom-nav{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      gap: 6px;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 900;
      color: #666;
      padding: 10px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        width: 100%;
        max-width: 980px;
        margin: 14px 0 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px;
        gap: 10px;
      }
      .bottom-nav a{ font-size: 13px; padding: 12px 12px; }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="factures-liste.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon">€</div>
      <h1>Règlement</h1>
    </div>

    <div class="subtitle" id="subtitle">Paiement facture</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="card">
        <div class="kvs">
          <div class="kv">
            <div class="t">Facture</div>
            <div class="v" id="invLine">—</div>
          </div>
          <div class="kv">
            <div class="t">Client</div>
            <div class="v" id="clientLine">—</div>
          </div>
          <div class="kv">
            <div class="t">Total TTC</div>
            <div class="v" id="totalLine">—</div>
          </div>
          <div class="kv">
            <div class="t">Déjà réglé</div>
            <div class="v" id="paidLine">—</div>
          </div>
          <div class="kv">
            <div class="t">Reste à régler</div>
            <div class="v" id="dueLine">—</div>
          </div>
          <div class="kv">
            <div class="t">Statut</div>
            <div class="v" id="statusLine">—</div>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="row">
          <div>
            <label for="amountInput">Montant réglé</label>
            <input id="amountInput" type="number" inputmode="decimal" step="0.01" min="0" placeholder="Ex : 50" />
          </div>
          <div>
            <label for="paidDateInput">Date de règlement</label>
            <input id="paidDateInput" type="date" />
          </div>
        </div>

        <div class="row">
          <div>
            <label for="modeSelect">Mode de règlement</label>
            <select id="modeSelect">
              <option value="TRANSFER">Virement</option>
              <option value="CARD">Carte</option>
              <option value="CASH">Espèces</option>
              <option value="CHEQUE">Chèque</option>
            </select>
          </div>
          <div>
            <label for="refInput">Référence (optionnel)</label>
            <input id="refInput" type="text" placeholder="Ex : TRX-123 / N° chèque / Réf virement" />
          </div>
        </div>

        <label for="noteInput">Note (optionnel)</label>
        <textarea id="noteInput" rows="2" placeholder="Ex : acompte"></textarea>

        <div class="btns">
          <button class="btn primary" id="saveBtn" type="button">Enregistrer le règlement</button>
          <a class="btn" id="historyBtn" href="#">Historique</a>
        </div>

        <div style="margin-top:10px; font-size:12px; color:#666; font-weight:850;">
          Paiement partiel autorisé. Le bouton sera grisé côté liste quand la facture sera soldée (PAID).
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="compta.html">Compta</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, collection, getDocs, addDoc,
      serverTimestamp, runTransaction, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const invLine = document.getElementById("invLine");
    const clientLine = document.getElementById("clientLine");
    const totalLine = document.getElementById("totalLine");
    const paidLine = document.getElementById("paidLine");
    const dueLine = document.getElementById("dueLine");
    const statusLine = document.getElementById("statusLine");

    const amountInput = document.getElementById("amountInput");
    const paidDateInput = document.getElementById("paidDateInput");
    const modeSelect = document.getElementById("modeSelect");
    const refInput = document.getElementById("refInput");
    const noteInput = document.getElementById("noteInput");

    const saveBtn = document.getElementById("saveBtn");
    const historyBtn = document.getElementById("historyBtn");

    let currentUser = null;
    let invoiceRef = null;
    let invoiceData = null;

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function isoTodayForDateInput(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return `${yyyy}-${mm}-${dd}`; // input[type=date] veut yyyy-mm-dd
    }

    function computeHT(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }

    async function loadVatConfig(uid){
      try{
        const uSnap = await getDoc(doc(db,"users",uid));
        const u = uSnap.exists() ? (uSnap.data()||{}) : {};
        const vat = u?.businessProfile?.vat || {};
        return {
          enabled: !!vat.enabled,
          rate: Number.isFinite(Number(vat.rate)) ? Number(vat.rate) : 0
        };
      }catch{
        return { enabled:false, rate:0 };
      }
    }

    function computeInvoiceTotalTTC(inv, vatCfg){
      const candidates = [inv?.totalTTC, inv?.invoiceTTC, inv?.invoiceTotal, inv?.total];
      for(const c of candidates){
        const n = Number(c);
        if(Number.isFinite(n) && n >= 0) return n;
      }
      const ht = computeHT(inv?.lines);
      const tva = vatCfg.enabled ? (ht * vatCfg.rate) : 0;
      return ht + tva;
    }

    async function sumPayments(invoiceId){
      const pRef = collection(db, "salesDocuments", invoiceId, "payments");
      const snap = await getDocs(pRef);
      let sum = 0;
      snap.forEach(d=>{
        const a = Number(d.data()?.amount);
        if(Number.isFinite(a)) sum += a;
      });
      return sum;
    }

    function statusFrom(paid, total){
      const p = Number(paid)||0;
      const t = Number(total)||0;
      if(t <= 0) return "UNPAID";
      if(p <= 0) return "UNPAID";
      if(p + 1e-9 < t) return "PARTIAL";
      return "PAID";
    }

    function badgeHtml(st){
      const s = String(st||"").toUpperCase();
      if(s === "PAID") return `<span class="badge ok">Payée</span>`;
      if(s === "PARTIAL") return `<span class="badge">Partielle</span>`;
      return `<span class="badge bad">Non payée</span>`;
    }

    function lockUI(locked){
      saveBtn.disabled = !!locked;
      saveBtn.style.opacity = locked ? "0.75" : "1";
    }

    function dateInputToTimestamp(yyyy_mm_dd){
      const s = String(yyyy_mm_dd||"").trim();
      if(!/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
      const [y,m,d] = s.split("-").map(n=>parseInt(n,10));
      const dt = new Date(y, (m||1)-1, d||1, 12, 0, 0); // midi = évite décalage DST
      return Timestamp.fromDate(dt);
    }

    async function render(){
      if(!invoiceData) return;

      // init date à aujourd’hui
      if(!paidDateInput.value) paidDateInput.value = isoTodayForDateInput();

      const vatCfg = await loadVatConfig(currentUser.uid);
      const totalTTC = computeInvoiceTotalTTC(invoiceData, vatCfg);
      const paidSum = await sumPayments(invoiceData.id);

      const due = Math.max(0, (Number(totalTTC)||0) - (Number(paidSum)||0));
      const payStatus = statusFrom(paidSum, totalTTC);

      const invNum = String(invoiceData.invoiceNumber || "").trim() || "—";
      const client = String(invoiceData.clientName || invoiceData.ownerName || "—").trim();

      invLine.textContent = `N° ${invNum}`;
      clientLine.textContent = client;
      totalLine.textContent = fmtMoney(totalTTC);
      paidLine.textContent = fmtMoney(paidSum);
      dueLine.textContent = fmtMoney(due);
      statusLine.innerHTML = badgeHtml(payStatus);

      if(!amountInput.value){
        amountInput.value = due > 0 ? String(Math.round(due*100)/100) : "0";
      }

      historyBtn.href = `reglement-liste.html?docId=${encodeURIComponent(invoiceData.id)}`;

      const paidFully = (payStatus === "PAID");
      amountInput.disabled = paidFully;
      paidDateInput.disabled = paidFully;
      modeSelect.disabled = paidFully;
      refInput.disabled = paidFully;
      noteInput.disabled = paidFully;
      saveBtn.disabled = paidFully;

      if(paidFully){
        showAlert("✅ Facture déjà soldée. Règlement désactivé.", true);
      }else{
        hideAlert();
      }
    }

    async function loadInvoice(invoiceId){
      invoiceRef = doc(db, "salesDocuments", invoiceId);
      const snap = await getDoc(invoiceRef);
      if(!snap.exists()) throw new Error("Facture introuvable (salesDocuments).");
      const inv = snap.data() || {};
      if(String(inv.conciergerieUid||"") !== String(currentUser.uid)){
        throw new Error("Accès refusé (facture d’une autre conciergerie).");
      }
      invoiceData = { id: snap.id, ...inv };
    }

    saveBtn.addEventListener("click", async ()=>{
      hideAlert();
      if(!invoiceData) return;

      const raw = Number(amountInput.value);
      if(!Number.isFinite(raw) || raw <= 0){
        showAlert("⛔ Montant réglé invalide.");
        return;
      }

      const paidAtTs = dateInputToTimestamp(paidDateInput.value);
      if(!paidAtTs){
        showAlert("⛔ Date de règlement invalide.");
        return;
      }

      lockUI(true);
      try{
        const vatCfg = await loadVatConfig(currentUser.uid);
        const totalTTC = computeInvoiceTotalTTC(invoiceData, vatCfg);
        const alreadyPaid = await sumPayments(invoiceData.id);
        const due = Math.max(0, totalTTC - alreadyPaid);

        const amount = Math.min(raw, due);
        if(amount <= 0){
          showAlert("⛔ Rien à régler (facture soldée).");
          lockUI(false);
          return;
        }

        const mode = String(modeSelect.value || "TRANSFER").toUpperCase();
        const reference = String(refInput.value || "").trim();
        const note = String(noteInput.value || "").trim();

        // 1) sous-collection payments
        const payCol = collection(db, "salesDocuments", invoiceData.id, "payments");
        await addDoc(payCol, {
          amount,
          mode,
          reference,
          note,
          paidAt: paidAtTs,
          createdAt: serverTimestamp()
        });

        // 2) agrégats facture (transaction)
        await runTransaction(db, async (tx)=>{
          const s = await tx.get(invoiceRef);
          if(!s.exists()) throw new Error("Facture introuvable (transaction).");
          const inv = s.data() || {};

          const currentPaid = Number(inv.paidAmount);
          const paidAmount = (Number.isFinite(currentPaid) ? currentPaid : 0) + amount;

          const totalNow = computeInvoiceTotalTTC(inv, vatCfg);
          const pStatus = statusFrom(paidAmount, totalNow);

          const patch = {
            paidAmount,
            paidAt: serverTimestamp(),         // dernier paiement (timestamp serveur)
            lastPaymentAt: serverTimestamp(),  // alias propre
            paymentStatus: pStatus,
            invoiceUpdatedAt: serverTimestamp()
          };

          if(pStatus === "PAID"){
            patch.invoiceStatus = "PAID";
            patch.invoicePaidAt = serverTimestamp();
          }

          tx.update(invoiceRef, patch);
        });

        showAlert("✅ Règlement enregistré.", true);

        setTimeout(()=>{
          location.href = `reglement-liste.html?docId=${encodeURIComponent(invoiceData.id)}`;
        }, 450);

      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur : " + (e?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = user;

      const invoiceId = getParam("docId");
      if(!invoiceId){
        showAlert("⛔ docId manquant. Ex : reglement.html?docId=XXXX");
        return;
      }

      try{
        await loadInvoice(invoiceId);
        await render();
      }catch(e){
        console.error(e);
        showAlert("⛔ " + (e?.message || "Erreur chargement règlement"));
      }
    });
  </script>
</body>
</html>
