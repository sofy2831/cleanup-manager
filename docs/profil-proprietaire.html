<!-- docs/profil-proprietaire.html (FINAL — propriétaire stable, token safe, no conciergerie bleed) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Profil propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:#F8F4FF; }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px; }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:14px;
    }
    .pill{
      padding:8px 12px;
      border-radius:999px;
      border:2px solid #7A5CFF;
      background:#fff;
      color:#7A5CFF;
      font-weight:800;
      cursor:pointer;
      text-decoration:none;
    }

    .card{
      width:100%;
      max-width:980px;
      background:#fff;
      border-radius:16px;
      padding:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.08);
    }

    label{ font-size:12px; font-weight:800; }
    input, textarea{
      width:100%;
      margin-top:4px;
      margin-bottom:12px;
      padding:10px;
      border-radius:10px;
      border:1px solid #ddd;
      font-weight:600;
    }

    textarea{ min-height:90px; }

    .btn{
      padding:10px 14px;
      border:none;
      border-radius:999px;
      background:#7A5CFF;
      color:#fff;
      font-weight:800;
      cursor:pointer;
    }

    .alert{
      display:none;
      margin-bottom:10px;
      padding:10px;
      border-radius:10px;
      background:#ffeaea;
      font-size:13px;
      font-weight:700;
    }
  </style>
</head>

<body>
<div class="page">

  <div class="topbar">
    <a id="backBtn" class="pill">← Retour</a>
    <button id="logoutBtn" class="pill">Déconnexion</button>
  </div>

  <div class="card">
    <h2>Profil propriétaire</h2>
    <div id="alertBox" class="alert"></div>

    <label>Nom / Société *</label>
    <input id="fullname">

    <label>Email</label>
    <input id="email" readonly>

    <label>Téléphone</label>
    <input id="phone">

    <label>Adresse</label>
    <input id="address1">

    <label>Ville</label>
    <input id="city">

    <label>Code postal</label>
    <input id="zip">

    <label>Pays</label>
    <input id="country">

    <label>SIRET</label>
    <input id="siret">

    <label>TVA</label>
    <input id="vat">

    <label>Notes</label>
    <textarea id="notes"></textarea>

    <button id="saveBtn" class="btn">Enregistrer</button>
  </div>

</div>

<script type="module">
import { auth, db, authReady } from "./firebase-init.js";
import { signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { requireRole } from "./auth-guard.js";
import { doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const qs = new URLSearchParams(location.search);
const token = (qs.get("token") || "").trim();

function withToken(url){
  if(!token) return url;
  const u = new URL(url, location.href);
  u.searchParams.set("token", token);
  return u.pathname + "?" + u.searchParams.toString();
}

const alertBox = document.getElementById("alertBox");
const backBtn = document.getElementById("backBtn");
const logoutBtn = document.getElementById("logoutBtn");

const fullname = document.getElementById("fullname");
const email = document.getElementById("email");
const phone = document.getElementById("phone");
const address1 = document.getElementById("address1");
const city = document.getElementById("city");
const zip = document.getElementById("zip");
const country = document.getElementById("country");
const siret = document.getElementById("siret");
const vat = document.getElementById("vat");
const notes = document.getElementById("notes");

function showError(msg){
  alertBox.style.display="block";
  alertBox.textContent=msg;
}

await authReady;

const user = await requireRole(["proprietaire"], withToken("login.html?role=proprietaire"));
if(!user) return;

backBtn.href = withToken("owner-dashboard.html");

email.value = user.email || "";

const userSnap = await getDoc(doc(db,"users", user.uid));
if(!userSnap.exists()){
  showError("Profil non trouvé.");
  return;
}

const u = userSnap.data();
const ownerDocId = u.ownerDocId;
const conciergerieUid = u.conciergerieUid;

if(!ownerDocId || !conciergerieUid){
  showError("Compte non rattaché à une conciergerie.");
  return;
}

const ownerSnap = await getDoc(doc(db,"owners", ownerDocId));
if(ownerSnap.exists()){
  const o = ownerSnap.data();
  fullname.value = o.fullname || "";
  phone.value = o.phone || "";
  address1.value = o.address1 || "";
  city.value = o.city || "";
  zip.value = o.zip || "";
  country.value = o.country || "";
  siret.value = o.siret || "";
  vat.value = o.vat || "";
  notes.value = o.notes || "";
}

document.getElementById("saveBtn").onclick = async ()=>{
  if(!fullname.value.trim()){
    showError("Nom obligatoire.");
    return;
  }

  await updateDoc(doc(db,"owners", ownerDocId),{
    fullname: fullname.value.trim(),
    phone: phone.value.trim(),
    address1: address1.value.trim(),
    city: city.value.trim(),
    zip: zip.value.trim(),
    country: country.value.trim(),
    siret: siret.value.trim(),
    vat: vat.value.trim(),
    notes: notes.value.trim(),
    updatedAt: serverTimestamp()
  });

  alertBox.style.display="none";
  location.replace(withToken("owner-dashboard.html"));
};

logoutBtn.onclick = async ()=>{
  await signOut(auth);
  location.replace(withToken("login.html?role=proprietaire"));
};
</script>

</body>
</html>
