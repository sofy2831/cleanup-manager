<!-- docs/profil-proprietaire.html (FIXED — clients > users > owners, back/logout ok, token passthrough) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Profil propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
    }

    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:1120px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:20; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .wrap{ width:100%; max-width:1120px; display:flex; flex-direction:column; gap:10px; margin-top:6px; }

    .logo{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:8px; margin-bottom:2px; text-align:center;
    }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦"; position:absolute; top:-6px; right:-5px;
      font-size:12px; color:var(--violet);
    }
    h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:13px; color:#444; text-align:center; font-weight:800; }
    .emailLine{ margin-top:4px; font-size:12px; color:var(--muted); font-weight:900; text-align:center; word-break:break-all; }

    .alert{
      display:none; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:900; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
    }

    .rowTop{
      display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
      flex-wrap:wrap;
    }
    .title{
      display:flex; flex-direction:column; gap:4px;
    }
    .title h2{ margin:0; font-size:16px; font-weight:900; }
    .tiny{ font-size:12px; color:var(--muted); font-weight:900; }

    .btn{
      border:none; border-radius:999px;
      padding:10px 12px; font-size:12px; font-weight:900;
      cursor:pointer; white-space:nowrap;
      background:linear-gradient(90deg,var(--violet),var(--violet2)); color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
    }
    .btn.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .form{
      margin-top:10px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    @media(min-width: 980px){
      .form{ grid-template-columns: 1fr 1fr; }
      .span2{ grid-column: 1 / -1; }
    }

    label{ display:block; font-size:12px; font-weight:900; color:#333; margin-bottom:6px; }
    input, textarea{
      width:100%;
      border:1px solid rgba(0,0,0,0.10);
      border-radius:14px;
      padding:11px 12px;
      font-size:13px;
      font-weight:800;
      outline:none;
      background:#fff;
    }
    textarea{ min-height:110px; resize:vertical; }

    .footerActions{
      margin-top:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="#">← Retour</a>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
      </div>
    </div>

    <div class="wrap">
      <div class="logo">
        <div class="logo-icon">👤</div>
        <h1>Profil propriétaire</h1>
      </div>
      <div class="subtitle">Coordonnées utilisées par la conciergerie pour vos factures.</div>
      <div class="emailLine" id="emailLine">—</div>

      <div class="alert" id="alertBox"></div>

      <section class="card">
        <div class="rowTop">
          <div class="title">
            <h2>Mon profil</h2>
            <div class="tiny" id="ownerIdLine">—</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn ghost" id="copyBtn" type="button" disabled>Copier Owner ID</button>
          </div>
        </div>

        <div class="form">
          <div>
            <label for="displayName">Nom / Société *</label>
            <input id="displayName" placeholder="Ex: Dupont Jean / SCI Bleu Azur" />
          </div>

          <div>
            <label for="email">Email</label>
            <input id="email" placeholder="ex: proprietaire@email.com" readonly />
          </div>

          <div>
            <label for="phone">Téléphone</label>
            <input id="phone" placeholder="06..." />
          </div>

          <div>
            <label for="country">Pays</label>
            <input id="country" placeholder="FR" />
          </div>

          <div class="span2">
            <label for="address1">Adresse (ligne 1)</label>
            <input id="address1" placeholder="N° et rue" />
          </div>

          <div class="span2">
            <label for="address2">Adresse (ligne 2)</label>
            <input id="address2" placeholder="Bâtiment, étage, etc." />
          </div>

          <div>
            <label for="zip">Code postal</label>
            <input id="zip" placeholder="31000" />
          </div>

          <div>
            <label for="city">Ville</label>
            <input id="city" placeholder="Toulouse" />
          </div>

          <div>
            <label for="siret">SIRET (optionnel)</label>
            <input id="siret" placeholder="14 chiffres" />
          </div>

          <div>
            <label for="vat">TVA (optionnel)</label>
            <input id="vat" placeholder="FR..." />
          </div>

          <div class="span2">
            <label for="notes">Notes</label>
            <textarea id="notes" placeholder="Infos utiles (ex: conditions de facturation, etc.)"></textarea>
          </div>
        </div>

        <div class="footerActions">
          <button class="btn" id="saveBtn" type="button">Enregistrer</button>
        </div>
      </section>
    </div>
  </div>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  // UI
  const emailLine = document.getElementById("emailLine");
  const alertBox = document.getElementById("alertBox");
  const logoutBtn = document.getElementById("logoutBtn");
  const backBtn = document.getElementById("backBtn");
  const ownerIdLine = document.getElementById("ownerIdLine");
  const copyBtn = document.getElementById("copyBtn");
  const saveBtn = document.getElementById("saveBtn");

  // Inputs
  const displayName = document.getElementById("displayName");
  const email = document.getElementById("email");
  const phone = document.getElementById("phone");
  const address1 = document.getElementById("address1");
  const address2 = document.getElementById("address2");
  const zip = document.getElementById("zip");
  const city = document.getElementById("city");
  const country = document.getElementById("country");
  const siret = document.getElementById("siret");
  const vat = document.getElementById("vat");
  const notes = document.getElementById("notes");

  // State
  let currentUser = null;
  let ownerDocId = "";
  let conciergerieUid = "";
  let token = "";

  function showAlert(msg, ok=false){
    alertBox.style.display = "block";
    alertBox.classList.toggle("ok", !!ok);
    alertBox.textContent = msg;
  }
  function hideAlert(){
    alertBox.style.display = "none";
    alertBox.classList.remove("ok");
    alertBox.textContent = "";
  }

  function safeStr(v){ return (v === undefined || v === null) ? "" : String(v); }
  function normEmail(s){ return String(s||"").trim().toLowerCase(); }
  function getParam(name){ return (new URLSearchParams(location.search).get(name) || "").trim(); }

  function withToken(url){
    if(!token) return url;
    const u = new URL(url, location.href);
    u.searchParams.set("token", token);
    return u.pathname + "?" + u.searchParams.toString();
  }

  function applyData(data){
    displayName.value = safeStr(data.fullname || data.displayName || "");
    phone.value = safeStr(data.phone || "");
    address1.value = safeStr(data.address1 || "");
    address2.value = safeStr(data.address2 || "");
    zip.value = safeStr(data.zip || "");
    city.value = safeStr(data.city || "");
    country.value = safeStr(data.country || "FR");
    siret.value = safeStr(data.siret || "");
    vat.value = safeStr(data.vat || "");
    notes.value = safeStr(data.notes || "");
  }

  function serialize(){
    return {
      fullname: (displayName.value || "").trim(),
      phone: (phone.value || "").trim(),
      address1: (address1.value || "").trim(),
      address2: (address2.value || "").trim(),
      zip: (zip.value || "").trim(),
      city: (city.value || "").trim(),
      country: ((country.value || "FR").trim() || "FR"),
      siret: (siret.value || "").trim(),
      vat: (vat.value || "").trim(),
      notes: (notes.value || "").trim(),
    };
  }

  async function loadSelfData(){
    hideAlert();

    // back toujours -> dashboard (+ token)
    backBtn.href = withToken("owner-dashboard.html");

    // 1) users/{uid} — source de vérité liaison
    let u = {};
    try{
      const us = await getDoc(doc(db,"users", currentUser.uid));
      u = us.exists()? (us.data()||{}) : {};
    }catch(e){
      showAlert("⛔ Impossible de lire users/ (rules). " + (e?.code || e?.message || ""), false);
      return;
    }

    const role = String(u.role || "").toLowerCase().trim();
    if(role && role !== "proprietaire"){
      location.replace(withToken("login.html?role=proprietaire"));
      return;
    }

    ownerDocId = String(u.ownerDocId || "").trim();
    conciergerieUid = String(u.conciergerieUid || "").trim();

    email.value = currentUser.email || safeStr(u.email || "");
    emailLine.textContent = currentUser.email || currentUser.uid;

    if(!ownerDocId || !conciergerieUid){
      ownerIdLine.textContent = "—";
      copyBtn.disabled = true;
      applyData(u);
      showAlert("⚠️ Liaison incomplète (ownerDocId/conciergerieUid). Reconnecte-toi via l’invitation.", false);
      return;
    }

    ownerIdLine.textContent = "Owner ID : " + ownerDocId;
    copyBtn.disabled = false;

    // 2) clients/c_owner_{ownerDocId} — CANON FACTURATION (priority)
    let c = null;
    try{
      const clientId = "c_owner_" + ownerDocId;
      const cs = await getDoc(doc(db,"clients", clientId));
      c = cs.exists()? (cs.data()||null) : null;
    }catch(_){}

    // 3) owners/{ownerDocId} — best effort (souvent incomplet)
    let o = null;
    try{
      const os = await getDoc(doc(db,"owners", ownerDocId));
      o = os.exists()? (os.data()||null) : null;
    }catch(_){}

    // ✅ priorité affichage : clients > users > owners
    if(c) applyData(c);
    else if(Object.keys(u||{}).length) applyData(u);
    else if(o) applyData(o);
  }

  async function saveSelfData(){
    hideAlert();
    const p = serialize();
    if(!p.fullname){
      showAlert("⛔ Nom / Société obligatoire.");
      return;
    }
    if(!ownerDocId || !conciergerieUid){
      showAlert("⛔ Liaison incomplète. Réouvre l’invitation.");
      return;
    }

    const uid = currentUser.uid;
    const emailLower = normEmail(currentUser.email || email.value || "");

    // 1) users/{uid}
    await setDoc(doc(db,"users", uid), {
      uid,
      role: "proprietaire",
      email: currentUser.email || email.value || "",
      emailLower,
      ownerDocId,
      conciergerieUid,

      fullname: p.fullname,
      phone: p.phone,
      address1: p.address1,
      address2: p.address2,
      zip: p.zip,
      city: p.city,
      country: p.country,
      siret: p.siret,
      vat: p.vat,
      notes: p.notes,

      updatedAt: serverTimestamp()
    }, { merge:true });

    // 2) clients/c_owner_{ownerDocId} — canon facturation
    const clientId = "c_owner_" + ownerDocId;
    await setDoc(doc(db,"clients", clientId), {
      clientId,
      type: "OWNER",
      conciergerieUid,
      ownerDocId,
      ownerUid: uid,
      uid,

      email: (currentUser.email || email.value || "").trim(),
      emailLower,
      fullname: p.fullname,
      phone: p.phone,
      address1: p.address1,
      address2: p.address2,
      zip: p.zip,
      city: p.city,
      country: p.country,
      siret: p.siret,
      vat: p.vat,
      notes: p.notes,

      status: "ACTIVE",
      isActive: true,
      updatedAt: serverTimestamp()
    }, { merge:true });

    // 3) owners/{ownerDocId} — best effort
    try{
      await updateDoc(doc(db,"owners", ownerDocId), {
        ownerUid: uid,
        uid,
        email: (currentUser.email || email.value || "").trim(),
        emailLower,

        fullname: p.fullname,
        phone: p.phone,
        address1: p.address1,
        address2: p.address2,
        zip: p.zip,
        city: p.city,
        country: p.country,
        siret: p.siret,
        vat: p.vat,
        notes: p.notes,

        status: "ACTIVE",
        isActive: true,
        updatedAt: serverTimestamp()
      });
    }catch(e){
      console.warn("owners update denied (ignored):", e?.code, e?.message || e);
    }

    showAlert("✅ Profil enregistré.", true);
    setTimeout(()=> location.replace(withToken("owner-dashboard.html")), 250);
  }

  copyBtn.addEventListener("click", async ()=>{
    if(!ownerDocId) return;
    try{
      await navigator.clipboard.writeText(ownerDocId);
      showAlert("✅ Owner ID copié.", true);
    }catch{
      showAlert("Copie impossible. Copie manuelle : " + ownerDocId, false);
    }
  });

  saveBtn.addEventListener("click", async ()=>{
    try{
      await saveSelfData();
    }catch(e){
      console.error(e);
      showAlert("⛔ Erreur enregistrement : " + (e?.code || e?.message || "inconnue"));
    }
  });

  logoutBtn.addEventListener("click", async ()=>{
    try{ await signOut(auth); }catch(_){}
    try{ localStorage.removeItem("cm_auth"); }catch(_){}
    location.replace(withToken("login.html?role=proprietaire"));
  });

  // BOOT
  token = getParam("token");

  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      location.replace(withToken("login.html?role=proprietaire"));
      return;
    }
    currentUser = user;

    email.value = user.email || "";
    email.readOnly = true;
    if(!country.value) country.value = "FR";

    await loadSelfData();
  });
</script>

</body>
</html>
