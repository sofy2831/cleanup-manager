<!-- docs/profil-proprietaire.html (CORRIGÉ + STABLE — guard via auth-guard.js + identities role + self/conciergerie modes + pas de boucles) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Profil propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
    }

    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:1120px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:20; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .wrap{ width:100%; max-width:1120px; display:flex; flex-direction:column; gap:10px; margin-top:6px; }

    .logo{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:8px; margin-bottom:2px; text-align:center;
    }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦"; position:absolute; top:-6px; right:-5px;
      font-size:12px; color:var(--violet);
    }
    h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:13px; color:#444; text-align:center; font-weight:800; }
    .emailLine{ margin-top:4px; font-size:12px; color:var(--muted); font-weight:900; text-align:center; }

    .alert{
      display:none; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:900; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
    }

    .rowTop{
      display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
      flex-wrap:wrap;
    }
    .title{
      display:flex; flex-direction:column; gap:4px;
    }
    .title h2{ margin:0; font-size:16px; font-weight:900; }
    .tiny{ font-size:12px; color:var(--muted); font-weight:900; }

    .btn{
      border:none; border-radius:999px;
      padding:10px 12px; font-size:12px; font-weight:900;
      cursor:pointer; white-space:nowrap;
      background:linear-gradient(90deg,var(--violet),var(--violet2)); color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
    }
    .btn.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn.red{
      background:#ffe3ec; color:var(--bad);
      border:2px solid rgba(179,38,30,0.35);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.55; cursor:not-allowed; }

    .form{
      margin-top:10px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    @media(min-width: 980px){
      .form{ grid-template-columns: 1fr 1fr; }
      .span2{ grid-column: 1 / -1; }
    }

    label{ display:block; font-size:12px; font-weight:900; color:#333; margin-bottom:6px; }
    input, textarea{
      width:100%;
      border:1px solid rgba(0,0,0,0.10);
      border-radius:14px;
      padding:11px 12px;
      font-size:13px;
      font-weight:800;
      outline:none;
      background:#fff;
    }
    textarea{ min-height:110px; resize:vertical; }

    .footerActions{
      margin-top:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; gap: 6px; justify-content: space-around; align-items: center;
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none;
      font-size: 11px; font-weight:900; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff; box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        max-width: 1120px;
        margin: 12px auto 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="clients.html">← Retour</a>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
      </div>
    </div>

    <div class="wrap">
      <div class="logo">
        <div class="logo-icon">👤</div>
        <h1>Profil propriétaire</h1>
      </div>
      <div class="subtitle">Coordonnées utilisées uniquement par la conciergerie pour établir vos factures.</div>
      <div class="emailLine" id="emailLine">—</div>

      <div class="alert" id="alertBox"></div>

      <section class="card">
        <div class="rowTop">
          <div class="title">
            <h2 id="cardTitle">Mon profil</h2>
            <div class="tiny" id="ownerIdLine">—</div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn ghost" id="newBtn" type="button">Nouveau</button>
            <button class="btn red" id="deleteBtn" type="button" disabled>Supprimer</button>
          </div>
        </div>

        <div class="form">
          <div>
            <label for="displayName">Nom / Société *</label>
            <input id="displayName" placeholder="Ex: Dupont Jean / SCI Bleu Azur" />
          </div>

          <div>
            <label for="email">Email</label>
            <input id="email" placeholder="ex: proprietaire@email.com" />
          </div>

          <div>
            <label for="phone">Téléphone</label>
            <input id="phone" placeholder="06..." />
          </div>

          <div>
            <label for="country">Pays</label>
            <input id="country" placeholder="FR" />
          </div>

          <div class="span2">
            <label for="address1">Adresse (ligne 1)</label>
            <input id="address1" placeholder="N° et rue" />
          </div>

          <div class="span2">
            <label for="address2">Adresse (ligne 2)</label>
            <input id="address2" placeholder="Bâtiment, étage, etc." />
          </div>

          <div>
            <label for="zip">Code postal</label>
            <input id="zip" placeholder="31000" />
          </div>

          <div>
            <label for="city">Ville</label>
            <input id="city" placeholder="Toulouse" />
          </div>

          <div>
            <label for="siret">SIRET (optionnel)</label>
            <input id="siret" placeholder="14 chiffres" />
          </div>

          <div>
            <label for="vat">TVA (optionnel)</label>
            <input id="vat" placeholder="FR..." />
          </div>

          <div class="span2">
            <label for="notes">Notes</label>
            <textarea id="notes" placeholder="Infos utiles (ex: conditions de facturation, préférences, etc.)"></textarea>
          </div>
        </div>

        <div class="footerActions">
          <button class="btn ghost" id="copyBtn" type="button" disabled>Copier ID</button>
          <button class="btn" id="saveBtn" type="button">Enregistrer</button>
        </div>
      </section>
    </div>
  </div>

  <!-- nav conciergerie : cachée en mode self -->
  <nav class="bottom-nav" aria-label="Navigation" id="conciergerieNav">
    <a href="planning.html">Planning</a>
    <a class="active" href="clients.html">Clients</a>
    <a href="logements.html">Logements</a>
    <a href="equipe.html">Équipe</a>
    <a href="catalogue.html">Catalogue</a>
  </nav>

<script type="module">
  import { auth, db, authReady } from "./firebase-init.js";
  import { signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { requireRole } from "./auth-guard.js";
  import {
    collection, doc, getDoc, setDoc, updateDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  // UI
  const emailLine = document.getElementById("emailLine");
  const alertBox = document.getElementById("alertBox");
  const logoutBtn = document.getElementById("logoutBtn");

  const backBtn = document.getElementById("backBtn");
  const conciergerieNav = document.getElementById("conciergerieNav");

  const cardTitle = document.getElementById("cardTitle");
  const ownerIdLine = document.getElementById("ownerIdLine");

  const newBtn = document.getElementById("newBtn");
  const deleteBtn = document.getElementById("deleteBtn");
  const copyBtn = document.getElementById("copyBtn");
  const saveBtn = document.getElementById("saveBtn");

  // Inputs
  const displayName = document.getElementById("displayName");
  const email = document.getElementById("email");
  const phone = document.getElementById("phone");
  const address1 = document.getElementById("address1");
  const address2 = document.getElementById("address2");
  const zip = document.getElementById("zip");
  const city = document.getElementById("city");
  const country = document.getElementById("country");
  const siret = document.getElementById("siret");
  const vat = document.getElementById("vat");
  const notes = document.getElementById("notes");

  // State
  let currentUser = null;

  // conciergerie mode
  let ownerId = ""; // owners/{ownerId}

  // self mode (proprio)
  let selfOwnerDocId = "";       // users/{uid}.ownerDocId
  let selfConciergerieUid = "";  // users/{uid}.conciergerieUid

  function safeStr(v){ return (v === undefined || v === null) ? "" : String(v); }

  function showAlert(msg, ok=false){
    alertBox.style.display = "block";
    alertBox.classList.toggle("ok", !!ok);
    alertBox.textContent = msg;
  }
  function hideAlert(){
    alertBox.style.display = "none";
    alertBox.classList.remove("ok");
    alertBox.textContent = "";
  }

  function getParam(name){
    return (new URLSearchParams(location.search).get(name) || "").trim();
  }

  function isSelfMode(){
    return getParam("self") === "1" || !!getParam("token");
  }

  function clearForm(){
    displayName.value = "";
    email.value = "";
    phone.value = "";
    address1.value = "";
    address2.value = "";
    zip.value = "";
    city.value = "";
    country.value = "FR";
    siret.value = "";
    vat.value = "";
    notes.value = "";
  }

  function normalizeEmail(s){ return (s||"").trim().toLowerCase(); }

  function serializeForm(){
    const fullname = (displayName.value || "").trim();
    const emailStr = (email.value || "").trim();
    const phoneStr = (phone.value || "").trim();

    return {
      fullname,
      email: emailStr,
      emailLower: normalizeEmail(emailStr),
      phone: phoneStr,

      address1: (address1.value || "").trim(),
      address2: (address2.value || "").trim(),
      zip: (zip.value || "").trim(),
      city: (city.value || "").trim(),
      country: (country.value || "FR").trim(),

      siret: (siret.value || "").trim(),
      vat: (vat.value || "").trim(),
      notes: (notes.value || "").trim(),
    };
  }

  function applyData(data){
    displayName.value = safeStr(data.displayName || data.fullname || "");
    email.value = safeStr(data.email || email.value || "");
    phone.value = safeStr(data.phone || "");
    address1.value = safeStr(data.address1 || "");
    address2.value = safeStr(data.address2 || "");
    zip.value      = safeStr(data.zip || "");
    city.value     = safeStr(data.city || "");
    country.value  = safeStr(data.country || "FR");
    siret.value = safeStr(data.siret || "");
    vat.value   = safeStr(data.vat || "");
    notes.value = safeStr(data.notes || "");
  }

  function buildOwnerDashUrl(){
    const t = getParam("token");
    return t ? `owner-dashboard.html?token=${encodeURIComponent(t)}` : "owner-dashboard.html";
  }

  function setupSelfUi(){
    cardTitle.textContent = "Mon profil";
    ownerIdLine.textContent = "—";

    backBtn.href = buildOwnerDashUrl();

    newBtn.style.display = "none";
    deleteBtn.style.display = "none";
    copyBtn.style.display = "none";

    if(conciergerieNav) conciergerieNav.style.display = "none";

    email.readOnly = true;
    email.value = currentUser?.email || "";
  }

  async function loadOwner(){
    hideAlert();

    // ===== MODE SELF (proprio) =====
    if(isSelfMode()){
      setupSelfUi();

      let u = null;
      try{
        const snapU = await getDoc(doc(db, "users", currentUser.uid));
        u = snapU.exists() ? (snapU.data() || {}) : null;
      }catch(_){}

      if(u){
        selfOwnerDocId = safeStr(u.ownerDocId).trim();
        selfConciergerieUid = safeStr(u.conciergerieUid).trim();
        applyData(u);
      }else{
        clearForm();
        email.value = currentUser?.email || "";
        email.readOnly = true;
      }

      if(selfOwnerDocId){
        try{
          const osnap = await getDoc(doc(db,"owners", selfOwnerDocId));
          if(osnap.exists()){
            applyData(osnap.data() || {});
            ownerIdLine.textContent = "Owner ID : " + selfOwnerDocId;
          }else{
            showAlert("⚠️ owners/" + selfOwnerDocId + " introuvable. Demande à la conciergerie de régénérer l’invitation.");
          }
        }catch(err){
          console.warn(err);
          showAlert("⚠️ Accès owners refusé. Ce n’est pas bloquant : enregistre quand même.", false);
          ownerIdLine.textContent = selfOwnerDocId ? ("Owner ID : " + selfOwnerDocId) : "—";
        }
      }else{
        showAlert("⚠️ ownerDocId manquant. Reconnecte-toi via le lien d’invitation.", false);
      }
      return;
    }

    // ===== MODE CONCIERGERIE =====
    ownerId = getParam("ownerId");
    const returnTo = getParam("returnTo");
    backBtn.href = returnTo ? `${returnTo}.html` : "clients.html";

    deleteBtn.style.display = "none";

    if(!ownerId){
      cardTitle.textContent = "Nouveau propriétaire";
      ownerIdLine.textContent = "—";
      copyBtn.disabled = true;
      clearForm();
      return;
    }

    cardTitle.textContent = "Propriétaire";
    ownerIdLine.textContent = `ID : ${ownerId}`;
    copyBtn.disabled = false;

    try{
      const ref = doc(db, "owners", ownerId);
      const snap = await getDoc(ref);
      if(!snap.exists()){
        showAlert("Propriétaire introuvable (owners/" + ownerId + ").");
        clearForm();
        return;
      }
      const data = snap.data() || {};
      if(String(data.conciergerieUid||"") !== String(currentUser.uid||"")){
        showAlert("Accès refusé : ce propriétaire n’appartient pas à ce compte.");
        clearForm();
        copyBtn.disabled = true;
        return;
      }
      applyData(data);
    }catch(err){
      console.error(err);
      showAlert("Erreur chargement propriétaire : " + (err?.message || "inconnue"));
    }
  }

  async function saveOwner(){
    hideAlert();

    const p = serializeForm();
    if(!p.fullname){
      showAlert("Nom / Société obligatoire.");
      return;
    }

    const token = getParam("token");

    try{
      // ===== MODE SELF (proprio) =====
      if(isSelfMode()){
        const uid = currentUser.uid;

        if(!selfOwnerDocId || !selfConciergerieUid){
          showAlert("⛔ Liaison incomplète (ownerDocId/conciergerieUid manquant). Réouvre le lien d’invitation.", false);
          return;
        }

        await setDoc(doc(db, "users", uid), {
          uid,
          // ⚠️ on garde role en compat si tes rules/écrans le lisent encore,
          // mais le vrai contrôle = identities.role
          role: "proprietaire",
          email: currentUser.email || p.email || "",
          emailLower: normalizeEmail(currentUser.email || p.email || ""),
          fullname: p.fullname,
          phone: p.phone || "",

          conciergerieUid: selfConciergerieUid,
          ownerDocId: selfOwnerDocId,

          address1: p.address1 || "",
          address2: p.address2 || "",
          zip: p.zip || "",
          city: p.city || "",
          country: p.country || "FR",

          siret: p.siret || "",
          vat: p.vat || "",
          notes: p.notes || "",

          updatedAt: serverTimestamp()
        }, { merge:true });

        const clientId = "c_owner_" + selfOwnerDocId;
        await setDoc(doc(db, "clients", clientId), {
          clientId,
          conciergerieUid: selfConciergerieUid,
          type: "OWNER",

          ownerDocId: selfOwnerDocId,
          ownerUid: uid,
          uid,

          fullname: p.fullname,
          email: (currentUser.email || p.email || "").trim(),
          emailLower: normalizeEmail(currentUser.email || p.email || ""),
          phone: p.phone || "",

          address1: p.address1 || "",
          address2: p.address2 || "",
          zip: p.zip || "",
          city: p.city || "",
          country: p.country || "FR",

          siret: p.siret || "",
          vat: p.vat || "",
          notes: p.notes || "",

          status: "ACTIVE",
          isActive: true,
          updatedAt: serverTimestamp()
        }, { merge:true });

        try{
          await updateDoc(doc(db, "owners", selfOwnerDocId), {
            ownerUid: uid,
            uid,

            fullname: p.fullname,
            email: (currentUser.email || p.email || "").trim(),
            emailLower: normalizeEmail(currentUser.email || p.email || ""),
            phone: p.phone || "",

            address1: p.address1 || "",
            address2: p.address2 || "",
            zip: p.zip || "",
            city: p.city || "",
            country: p.country || "FR",

            siret: p.siret || "",
            vat: p.vat || "",
            notes: p.notes || "",

            status: "ACTIVE",
            isActive: true,
            updatedAt: serverTimestamp()
          });
        }catch(e){
          console.warn("owners update denied (ignored):", e?.code, e?.message || e);
        }

        showAlert("✅ Profil enregistré.", true);

        const dashUrl = token
          ? `owner-dashboard.html?token=${encodeURIComponent(token)}`
          : `owner-dashboard.html`;

        setTimeout(()=> location.replace(dashUrl), 300);
        return;
      }

      // ===== MODE CONCIERGERIE =====
      const conciergeriePayload = {
        fullname: p.fullname,
        email: p.email || "",
        emailLower: normalizeEmail(p.email || ""),
        phone: p.phone || "",

        address1: p.address1 || "",
        address2: p.address2 || "",
        zip: p.zip || "",
        city: p.city || "",
        country: p.country || "FR",

        siret: p.siret || "",
        vat: p.vat || "",
        notes: p.notes || "",

        updatedAt: serverTimestamp(),
        conciergerieUid: currentUser.uid
      };

      if(!ownerId){
        const ref = doc(collection(db, "owners"));
        ownerId = ref.id;

        await setDoc(ref, {
          ownerDocId: ownerId,
          ownerUid: "",
          uid: "",
          status: "INVITED",
          isActive: true,
          ...conciergeriePayload,
          createdAt: serverTimestamp()
        });

        showAlert("✅ Propriétaire créé.", true);
        location.href = `profil-proprietaire.html?ownerId=${encodeURIComponent(ownerId)}`;
        return;
      }

      await updateDoc(doc(db, "owners", ownerId), conciergeriePayload);
      showAlert("✅ Enregistré.", true);

    }catch(err){
      console.error(err);
      showAlert("Erreur enregistrement : " + String(err?.message || "inconnue"));
    }
  }

  // Buttons
  newBtn.addEventListener("click", ()=> location.href = "profil-proprietaire.html");

  copyBtn.addEventListener("click", async ()=>{
    if(!ownerId) return;
    try{
      await navigator.clipboard.writeText(ownerId);
      showAlert("✅ ID copié.", true);
    }catch{
      showAlert("Impossible de copier. Copie manuelle : " + ownerId);
    }
  });

  saveBtn.addEventListener("click", saveOwner);

  logoutBtn.addEventListener("click", async ()=>{
    await signOut(auth);
    try{ localStorage.removeItem("cm_auth"); }catch(_){}
    const role = isSelfMode() ? "proprietaire" : "conciergerie";
    location.replace("login.html?role=" + role);
  });

  // =========================
  // BOOT (stable)
  // =========================
  await authReady;

  const self = isSelfMode();

  // ✅ rôle via identities :
  // - self => propriétaire
  // - conciergerie => conciergerie/admin/staff
  const user = self
    ? await requireRole(["proprietaire"], "login.html?role=proprietaire")
    : await requireRole(["conciergerie","admin","staff"], "login.html?role=conciergerie");

  if(!user) return;

  currentUser = user;
  emailLine.textContent = user.email || user.uid;

  if(!country.value) country.value = "FR";
  if(self){
    email.value = user.email || "";
    email.readOnly = true;
  }

  await loadOwner();
</script>

</body>
</html>
