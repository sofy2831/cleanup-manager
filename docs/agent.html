<!-- docs/agent.html (FINAL — bouton unique Enregistrer + lock + redirect missionfini.html) -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanUp Manager — Agent</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
:root{
--violet:#7A5CFF;
--violet2:#6238FF;
--bg1:#F8F4FF;
--bg2:#EDE6FF;
--text:#111;
--muted:#666;
--bad:#b3261e;
--ok:#1b8f4d;
--border: rgba(122,92,255,0.18);
--shadow: 0 14px 36px rgba(0,0,0,0.08);
--card: rgba(255,255,255,0.92);
}
body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); }
.page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px; }

.topbar{
width:100%; max-width:980px;
display:flex; justify-content:space-between; align-items:center;
margin-bottom:10px;
}

.pill{
padding:8px 12px;
border-radius:999px;
background:#fff;
border:2px solid var(--violet);
color:var(--violet);
font-weight:900;
font-size:13px;
text-decoration:none;
}

.card{
width:100%;
max-width:980px;
background:var(--card);
border-radius:18px;
padding:14px;
box-shadow:var(--shadow);
margin-bottom:10px;
}

.alert{
display:none;
margin-top:8px;
padding:10px;
border-radius:12px;
background:#fff;
border-left:5px solid var(--bad);
font-weight:800;
font-size:12px;
}
.alert.ok{ border-left-color:var(--ok); }

.mcard{
background:#fff;
border-radius:16px;
padding:12px;
margin-top:10px;
border:1px solid rgba(0,0,0,.05);
}

.chk{
display:flex;
gap:10px;
margin-bottom:6px;
}

.btn{
padding:10px 14px;
border:none;
border-radius:999px;
background:linear-gradient(90deg,var(--violet),var(--violet2));
color:#fff;
font-weight:900;
cursor:pointer;
}

.btn:disabled{
opacity:.5;
cursor:not-allowed;
}

.done{
border-left:5px solid var(--ok);
}
</style>
</head>

<body>
<div class="page">

<div class="topbar">
<span class="pill" id="whoAmI">Agent</span>
<a class="pill" id="photosBtn">Photos</a>
</div>

<div class="card">
<h2 id="homeLine">Chargement…</h2>
<div id="arrLine"></div>
<div id="depLine"></div>
<div id="addrLine"></div>
<div id="agentLine"></div>
</div>

<div class="card">
<div>Commentaire global</div>
<textarea id="globalComment" style="width:100%;margin-top:6px;"></textarea>
</div>

<div class="card">
<div id="missionsWrap"></div>
</div>

<div class="alert" id="alertBox"></div>

</div>

<script type="module">

import { db } from "./firebase-init.js";
import {
doc,
getDoc,
updateDoc,
Timestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const missionsWrap=document.getElementById("missionsWrap");
const alertBox=document.getElementById("alertBox");

const globalCommentEl=document.getElementById("globalComment");

function showAlert(msg,ok=false){
alertBox.style.display="block";
alertBox.classList.toggle("ok",ok);
alertBox.textContent=msg;
}

function qs(n){
return new URLSearchParams(location.search).get(n)||"";
}

const token=qs("token");
const prestationId=qs("prestationId");

function esc(s){
return String(s||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");
}

async function load(){

missionsWrap.innerHTML="";

const tSnap=await getDoc(doc(db,"dayTokens",token));
if(!tSnap.exists()){
showAlert("Token invalide");
return;
}

const tokenDoc=tSnap.data();

document.getElementById("homeLine").textContent=tokenDoc?.presta?.homeName||"";
document.getElementById("arrLine").textContent="Arrivée : "+(tokenDoc?.presta?.arrivalDateKey||"");
document.getElementById("depLine").textContent="Départ : "+(tokenDoc?.presta?.departureDateKey||"");
document.getElementById("addrLine").textContent=tokenDoc?.presta?.homeAddress||"";
document.getElementById("agentLine").textContent="Agent : "+(tokenDoc?.agentName||"");

const TYPES=tokenDoc.missionTypes||["MENAGE"];

for(const type of TYPES){

const ref=doc(db,"events",prestationId,"missions",type);
const snap=await getDoc(ref);

if(!snap.exists()) continue;

const d=snap.data();

const locked=!!d.locked;

const checklist=d.checklist||{
a:{label:"Mission réalisée",done:false}
};

const items=Object.entries(checklist);

const wrap=document.createElement("div");
wrap.className="mcard"+(locked?" done":"");

wrap.innerHTML=`

<h3>${esc(type)}</h3>

${items.map(([k,v],i)=>`
<div class="chk">
<input type="checkbox" data-k="${k}" ${v.done?"checked":""} ${locked?"disabled":""}>
<label>${esc(v.label)}</label>
</div>
`).join("")}

<button class="btn" data-finish="${type}" ${locked?"disabled":""}>
Enregistrer
</button>

`;

missionsWrap.appendChild(wrap);

wrap.querySelector("[data-finish]").onclick=async()=>{

const checks=wrap.querySelectorAll("input[data-k]");

const newChecklist={};

checks.forEach(ch=>{
newChecklist[ch.dataset.k]={
label:ch.nextElementSibling.textContent,
done:ch.checked
};
});

const comment=globalCommentEl.value||"";

await updateDoc(doc(db,"events",prestationId,"missions",type),{

checklist:newChecklist,
agentComment:comment,
status:"A_VALIDER",
agentDone:true,
locked:true,
agentDoneAt:Timestamp.now(),
updatedAt:Timestamp.now()

});

await updateDoc(doc(db,"events",prestationId),{

opStatus:"A_VALIDER",
proofToken:token,
updatedAt:Timestamp.now()

});

location.href=`missionfini.html?token=${token}&prestationId=${prestationId}`;

};

}

}

load();

</script>

</body>
</html>
