<!-- docs/agent.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:36px; }
    .topbar{
      width:100%; max-width:980px; display:flex; justify-content:space-between; align-items:center;
      gap:10px; position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .wrap{ width:100%; max-width:980px; margin-top:6px; display:flex; flex-direction:column; gap:10px; }
    h1{ margin:0; font-size:20px; font-weight:900; letter-spacing:-0.2px; }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; }
    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:12px;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:12px; }

    .chips{ display:flex; gap:8px; flex-wrap:wrap; }
    .chip{
      display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:999px;
      background:rgba(122,92,255,0.12); color:#5b45c8; font-size:11px; font-weight:900;
    }
    .chip.ok{ background:rgba(27,143,77,0.16); color:var(--ok); }
    .chip.bad{ background:rgba(179,38,30,0.14); color:var(--bad); }

    .missions{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .mcard{
      background:#fff; border-radius:16px; border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06); padding:12px;
      display:flex; flex-direction:column; gap:10px;
    }
    .mhead{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .mtitle{ font-size:14px; font-weight:900; color:#222; }
    .msub{ font-size:12px; font-weight:800; color:#666; white-space:pre-wrap; }

    .checklist{
      display:flex; flex-direction:column; gap:8px;
      border-top:1px dashed rgba(122,92,255,0.25); padding-top:10px;
    }
    .chk{
      display:flex; gap:10px; align-items:flex-start;
      background:rgba(122,92,255,0.06); border:1px solid rgba(122,92,255,0.12);
      border-radius:14px; padding:10px;
    }
    .chk input{ margin-top:3px; width:18px; height:18px; }
    .chk label{ font-size:12px; font-weight:900; color:#222; cursor:pointer; }
    .chk .hint{ font-size:11px; font-weight:800; color:#666; margin-top:3px; }

    textarea{
      width:100%; padding:10px; border-radius:12px; border:1px solid #D3C7FF; background:#fff;
      font-size:13px; outline:none; resize:vertical;
    }
    textarea:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .btn{
      border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:900; cursor:pointer;
      color:#fff; background:linear-gradient(90deg,var(--violet),var(--violet2));
      box-shadow:0 10px 22px rgba(0,0,0,0.10); white-space:nowrap;
    }
    .btn.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn.danger{
      background:#ffe3ec; color:var(--bad); border:2px solid #ffc2d6;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .done{
      border-left:5px solid rgba(27,143,77,0.55);
      background:linear-gradient(180deg,#ffffff 0%, rgba(27,143,77,0.06) 100%);
    }
    .locked{
      border-left:5px solid rgba(122,92,255,0.55);
      background:linear-gradient(180deg,#ffffff 0%, rgba(122,92,255,0.06) 100%);
    }

    /* Photos */
    .photos{
      border-top:1px dashed rgba(122,92,255,0.25);
      padding-top:10px;
      display:flex; flex-direction:column; gap:8px;
    }
    .photos-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:8px;
    }
    @media(max-width:520px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .p{
      position:relative;
      border-radius:14px;
      overflow:hidden;
      border:1px solid rgba(0,0,0,0.06);
      box-shadow:0 2px 8px rgba(0,0,0,.06);
      background:#fff;
      aspect-ratio: 4 / 3;
    }
    .p img{ width:100%; height:100%; object-fit:cover; display:block; }
    .p .del{
      position:absolute; top:8px; right:8px;
      border:none; border-radius:999px;
      padding:7px 9px; font-weight:900; font-size:12px;
      cursor:pointer;
      background:rgba(255,255,255,0.92);
      border:2px solid rgba(255,0,80,0.25);
      color:var(--bad);
      box-shadow:0 2px 8px rgba(0,0,0,.10);
    }
    .p .tag{
      position:absolute; left:8px; bottom:8px;
      background:rgba(255,255,255,0.92);
      border:1px solid rgba(0,0,0,0.08);
      border-radius:999px;
      padding:4px 8px;
      font-weight:900; font-size:11px; color:#333;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <span class="pill" id="whoAmI">Agent</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="pill" id="refreshBtn" type="button">Rafraîchir</button>
      </div>
    </div>

    <div class="wrap">
      <div>
        <h1>Mes missions</h1>
        <div class="sub" id="subLine">Chargement…</div>
        <div class="alert" id="alertBox"></div>
      </div>

      <section class="card">
        <div class="row">
          <div style="min-width:260px;">
            <div class="mini">Logement</div>
            <div style="margin-top:6px;font-weight:900;font-size:14px;" id="homeLine">—</div>
            <div class="mini" id="metaLine" style="margin-top:4px;">—</div>
          </div>

          <div class="chips">
            <span class="chip" id="chipToken">token: —</span>
            <span class="chip" id="chipExpiry">expire: —</span>
            <span class="chip" id="chipStatus">—</span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="mini">Missions</div>
        <div class="missions" id="missionsWrap"></div>
      </section>

      <div class="mini">
        Mode token-only : l’agent ouvre le lien et peut cocher + envoyer jusqu’à expiration (24h).<br>
        “Terminer” verrouille la mission.
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase-init.js";
    import {
      doc, getDoc, updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    import {
      getStorage, ref as sRef, uploadBytes, getDownloadURL, deleteObject
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

    const storage = getStorage();

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const homeLine = document.getElementById("homeLine");
    const metaLine = document.getElementById("metaLine");
    const missionsWrap = document.getElementById("missionsWrap");

    const chipToken = document.getElementById("chipToken");
    const chipExpiry = document.getElementById("chipExpiry");
    const chipStatus = document.getElementById("chipStatus");

    const refreshBtn = document.getElementById("refreshBtn");
    const whoAmI = document.getElementById("whoAmI");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }

    function toMsFromToken(t){
      // priorité: expiresAtMs (number)
      if(typeof t?.expiresAtMs === "number") return t.expiresAtMs;

      // sinon: expiresAt (Firestore Timestamp)
      if(t?.expiresAt && typeof t.expiresAt.toMillis === "function"){
        return t.expiresAt.toMillis();
      }

      // fallback debug: expiresAtIso
      const iso = t?.expiresAtIso;
      const p = Date.parse(iso || "");
      if(Number.isFinite(p)) return p;

      return NaN;
    }

    function tokenValid(t){
      if(!t?.active) return false;
      const exp = toMsFromToken(t);
      if(!Number.isFinite(exp)) return false;
      return Date.now() < exp;
    }

    function prettyExpiryFromMs(ms){
      if(!Number.isFinite(ms)) return "—";
      const d = new Date(ms);
      const pad2 = (n)=> String(n).padStart(2,"0");
      return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function esc(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function missionTitle(type){
      const t = (type||"").toUpperCase();
      if(t==="CHECKIN") return "Check-in";
      if(t==="MENAGE") return "Ménage";
      if(t==="CHECKOUT") return "Check-out";
      return t || "Mission";
    }

    function chipFor(st){
      const s = (st||"").toUpperCase();
      if(s==="VALIDEE") return `<span class="chip ok">VALIDÉE</span>`;
      if(s==="A_VALIDER") return `<span class="chip">À VALIDER</span>`;
      if(s==="ASSIGNEE") return `<span class="chip">ASSIGNÉE</span>`;
      if(s==="EN_COURS") return `<span class="chip">EN COURS</span>`;
      return `<span class="chip">${esc(s || "—")}</span>`;
    }

    function checklistToArray(cl){
      // map { key:{label,done} } ou { key:true }
      if(!cl || typeof cl !== "object") return [];
      const out = [];
      for(const [k,v] of Object.entries(cl)){
        if(typeof v === "boolean"){
          out.push({ key:k, label:k, done:v });
        }else{
          out.push({ key:k, label:(v?.label || k), done: !!v?.done });
        }
      }
      return out;
    }

    function arrayToChecklistObject(items){
      const obj = {};
      for(const it of items){
        obj[it.key] = { label: it.label, done: !!it.done };
      }
      return obj;
    }

    const token = qs("token");
    const prestationId = qs("prestationId");

    let tokenDoc = null;
    let eventDoc = null;
    let missionTypes = [];

    async function uploadOnePhoto({ file, missionType }){
      // path = missionPhotos/{prestationId}/{missionType}/{token}/{ts}_{rand}.jpg
      const ts = Date.now();
      const rnd = Math.random().toString(16).slice(2);
      const safeName = (file.name || "photo").replace(/[^\w.\-]+/g,"_").slice(0,50);
      const path = `missionPhotos/${prestationId}/${missionType}/${token}/${ts}_${rnd}_${safeName}`;

      const r = sRef(storage, path);
      await uploadBytes(r, file, { contentType: file.type || "image/jpeg" });
      const url = await getDownloadURL(r);
      return { url, path, createdAtMs: ts };
    }

    async function deleteOnePhoto(photo){
      if(photo?.path){
        try{
          await deleteObject(sRef(storage, photo.path));
        }catch(e){
          // si suppression échoue, on continue quand même (tu ne veux pas de bug bloquant)
          console.warn("deleteObject failed", e);
        }
      }
    }

    async function load(){
      hideAlert();
      missionsWrap.innerHTML = "";
      subLine.textContent = "Chargement…";

      if(!token || !prestationId){
        showAlert("⛔ Paramètres manquants (token / prestationId).");
        return;
      }

      // 1) dayToken
      const tSnap = await getDoc(doc(db, "dayTokens", token));
      if(!tSnap.exists()){
        showAlert("⛔ Token invalide.");
        return;
      }
      tokenDoc = tSnap.data() || {};

      chipToken.textContent = "token: " + token;

      const expMs = toMsFromToken(tokenDoc);
      chipExpiry.textContent = "expire: " + prettyExpiryFromMs(expMs);

      if(String(tokenDoc.prestationId) !== String(prestationId)){
        showAlert("⛔ Token ≠ prestation.");
        chipStatus.innerHTML = `<span class="chip bad">REFUSÉ</span>`;
        return;
      }

      if(!tokenValid(tokenDoc)){
        chipStatus.innerHTML = `<span class="chip bad">EXPIRÉ</span>`;
        showAlert("⛔ Token expiré. Demande un nouveau lien.");
        return;
      }

      chipStatus.innerHTML = `<span class="chip ok">OK</span>`;
      whoAmI.textContent = `Accès via lien`;

      // missionTypes = venant du token (IMPORTANT : évite de lire des missions inexistantes)
      missionTypes = Array.isArray(tokenDoc.missionTypes) && tokenDoc.missionTypes.length
        ? tokenDoc.missionTypes.map(x=>String(x||"").toUpperCase()).filter(Boolean)
        : ["MENAGE"]; // fallback minimal

      // 2) event (lecture facultative mais utile pour afficher logement)
      const eSnap = await getDoc(doc(db, "events", prestationId));
      if(eSnap.exists()){
        eventDoc = eSnap.data() || {};
        homeLine.textContent = `${eventDoc.homeName || "Logement"}${eventDoc.homeCity ? " — " + eventDoc.homeCity : ""}`;
        metaLine.textContent =
          `${eventDoc.dateKey || eventDoc.date || "—"}${eventDoc.time ? " à " + eventDoc.time : ""}` +
          `${eventDoc.homeAddress ? " • " + eventDoc.homeAddress : ""}` +
          `\nAgent : ${(tokenDoc.agentName || "—")}${tokenDoc.agentEmail ? " • " + tokenDoc.agentEmail : ""}`;
      }else{
        homeLine.textContent = "Logement —";
        metaLine.textContent = `Prestation #${prestationId}`;
      }

      // 3) missions (uniquement celles listées)
      const missions = [];
      for(const t of missionTypes){
        const mRef = doc(db, "events", prestationId, "missions", t);
        const mSnap = await getDoc(mRef);
        if(mSnap.exists()){
          missions.push({ id:t, ref:mRef, data:mSnap.data() || {} });
        }else{
          missions.push({ id:t, ref:mRef, data:null });
        }
      }

      subLine.textContent = `Prestation #${prestationId} — ${missions.length} mission(s)`;

      missionsWrap.innerHTML = "";
      for(const m of missions){
        if(!m.data){
          const missing = document.createElement("div");
          missing.className = "mcard";
          missing.innerHTML = `
            <div class="mhead">
              <div>
                <div class="mtitle">${missionTitle(m.id)}</div>
                <div class="msub">Mission absente côté Firestore. (Elle doit être créée par intervention.html)</div>
              </div>
              <div><span class="chip bad">ABSENTE</span></div>
            </div>
          `;
          missionsWrap.appendChild(missing);
          continue;
        }

        const d = m.data || {};
        const locked = !!d.locked;
        const done = !!d.agentDone;
        const status = (d.status || "").toUpperCase() || "—";

        // checklist
        const items = checklistToArray(d.checklist);
        const checklistHtml = items.length
          ? items.map((it, idx)=>{
              const id = `chk_${m.id}_${idx}`;
              return `
                <div class="chk">
                  <input type="checkbox" id="${esc(id)}" data-k="${esc(it.key)}" ${it.done ? "checked" : ""} ${locked ? "disabled" : ""} />
                  <div>
                    <label for="${esc(id)}">${esc(it.label)}</label>
                    <div class="hint">${it.done ? "fait" : "à faire"}</div>
                  </div>
                </div>
              `;
            }).join("")
          : `
            <div class="mini">
              Checklist vide. (Normal si la conciergerie n’a pas configuré.)<br>
              Tu peux quand même mettre un commentaire + Terminer.
            </div>
          `;

        // photos
        const photos = Array.isArray(d.photos) ? d.photos : [];
        const remaining = Math.max(0, 3 - photos.length);

        const photosGrid = photos.length
          ? `
            <div class="grid">
              ${photos.map((p, idx)=>`
                <div class="p">
                  <img src="${esc(p.url || "")}" alt="photo">
                  <span class="tag">${idx+1}/3</span>
                  ${locked ? "" : `<button class="del" type="button" data-del="${idx}">✕</button>`}
                </div>
              `).join("")}
            </div>
          `
          : `<div class="mini">Aucune photo.</div>`;

        const wrap = document.createElement("div");
        wrap.className = "mcard" + (done ? " done" : "") + (locked ? " locked" : "");
        wrap.innerHTML = `
          <div class="mhead">
            <div>
              <div class="mtitle">${missionTitle(d.type || m.id)} ${locked ? "• verrouillée" : ""}</div>
              <div class="msub">Status : ${esc(status)} ${done ? "\n✔ Terminée" : ""}</div>
            </div>
            <div>${chipFor(status)}</div>
          </div>

          <div class="checklist" data-m="${esc(m.id)}">
            ${checklistHtml}
          </div>

          <div class="photos" data-pwrap="${esc(m.id)}">
            <div class="photos-top">
              <div>
                <div class="mini" style="margin-bottom:2px;">Photos (max 3)</div>
                <div class="mini">${locked ? "Mission verrouillée." : (remaining ? `${remaining} slot(s) dispo.` : "Limite atteinte.")}</div>
              </div>
              <div>
                <input
                  type="file"
                  accept="image/*"
                  capture="environment"
                  data-file="${esc(m.id)}"
                  ${locked || remaining === 0 ? "disabled" : ""}
                  multiple
                  style="max-width:240px;"
                />
              </div>
            </div>
            <div data-grid="${esc(m.id)}">${photosGrid}</div>
          </div>

          <div>
            <div class="mini" style="margin-bottom:6px;">Commentaire (optionnel)</div>
            <textarea rows="2" placeholder="Ex. problème, remarque..." data-comment="${esc(m.id)}" ${locked ? "disabled" : ""}>${esc(d.agentComment || "")}</textarea>
          </div>

          <div class="actions">
            <button class="btn ghost" type="button" data-save="${esc(m.id)}" ${locked ? "disabled" : ""}>Enregistrer</button>
            <button class="btn" type="button" data-done="${esc(m.id)}" ${locked ? "disabled" : ""}>Terminer</button>
          </div>
        `;

        missionsWrap.appendChild(wrap);

        async function saveMission(markDone=false){
          hideAlert();
          const type = m.id;

          const box = wrap.querySelector(`.checklist[data-m="${type}"]`);
          const checks = Array.from(box.querySelectorAll('input[type="checkbox"][data-k]'));
          const newItems = checks.map(ch => {
            const key = ch.getAttribute("data-k");
            const labelEl = box.querySelector(`label[for="${ch.id}"]`);
            const label = labelEl ? labelEl.textContent.trim() : key;
            return { key, label, done: !!ch.checked };
          });

          const commentEl = wrap.querySelector(`textarea[data-comment="${type}"]`);
          const comment = (commentEl?.value || "").trim();

          const payload = {
            checklist: arrayToChecklistObject(newItems.length ? newItems : checklistToArray(d.checklist)),
            agentComment: comment,
            updatedAt: serverTimestamp()
          };

          if(markDone){
            payload.agentDone = true;
            payload.agentDoneAt = serverTimestamp();
            payload.status = "A_VALIDER";
            payload.locked = true; // ✅ stop
          }

          try{
            await updateDoc(doc(db, "events", prestationId, "missions", type), payload);
            showAlert(markDone ? "✅ Mission terminée (verrouillée)." : "✅ Enregistré.", true);
            await load();
          }catch(err){
            console.error(err);
            showAlert("Erreur enregistrement : " + (err?.message || "inconnue"));
          }
        }

        // upload photos handler
        const fileInput = wrap.querySelector(`input[data-file="${m.id}"]`);
        if(fileInput){
          fileInput.addEventListener("change", async ()=>{
            hideAlert();
            const files = Array.from(fileInput.files || []);
            fileInput.value = "";

            if(!files.length) return;

            // re-read current mission to be safe
            const freshSnap = await getDoc(doc(db, "events", prestationId, "missions", m.id));
            const fresh = freshSnap.exists() ? (freshSnap.data() || {}) : {};
            const curPhotos = Array.isArray(fresh.photos) ? fresh.photos : [];
            const curLocked = !!fresh.locked;

            if(curLocked){
              showAlert("Mission verrouillée : photos interdites.", false);
              return;
            }

            const slots = Math.max(0, 3 - curPhotos.length);
            if(slots === 0){
              showAlert("Limite photos atteinte (3/3).", false);
              return;
            }

            const toUpload = files.slice(0, slots);

            try{
              showAlert("Upload photo…", true);

              const uploaded = [];
              for(const f of toUpload){
                // petite barrière anti-fichier énorme
                if(f.size > 8 * 1024 * 1024){
                  showAlert("Photo trop lourde (>8Mo).", false);
                  continue;
                }
                const ph = await uploadOnePhoto({ file:f, missionType: m.id });
                uploaded.push(ph);
              }

              if(!uploaded.length){
                showAlert("Aucune photo envoyée.", false);
                return;
              }

              const merged = curPhotos.concat(uploaded).slice(0, 3);

              await updateDoc(doc(db, "events", prestationId, "missions", m.id), {
                photos: merged,
                updatedAt: serverTimestamp()
              });

              showAlert("✅ Photo(s) envoyée(s).", true);
              await load();
            }catch(err){
              console.error(err);
              showAlert("Erreur upload photo : " + (err?.message || "inconnue"));
            }
          });
        }

        // delete photo handler
        wrap.querySelectorAll('button[data-del]').forEach(btn=>{
          btn.addEventListener("click", async ()=>{
            hideAlert();
            const idx = Number(btn.getAttribute("data-del"));
            if(!Number.isFinite(idx)) return;

            try{
              const freshSnap = await getDoc(doc(db, "events", prestationId, "missions", m.id));
              const fresh = freshSnap.exists() ? (freshSnap.data() || {}) : {};
              const curPhotos = Array.isArray(fresh.photos) ? fresh.photos : [];
              const curLocked = !!fresh.locked;

              if(curLocked){
                showAlert("Mission verrouillée : suppression interdite.", false);
                return;
              }

              const target = curPhotos[idx];
              if(!target) return;

              // delete in storage (best effort), then remove in firestore
              await deleteOnePhoto(target);
              const next = curPhotos.filter((_,i)=> i !== idx);

              await updateDoc(doc(db, "events", prestationId, "missions", m.id), {
                photos: next,
                updatedAt: serverTimestamp()
              });

              showAlert("✅ Photo supprimée.", true);
              await load();
            }catch(err){
              console.error(err);
              showAlert("Erreur suppression : " + (err?.message || "inconnue"));
            }
          });
        });

        wrap.querySelector(`button[data-save="${m.id}"]`)?.addEventListener("click", ()=> saveMission(false));
        wrap.querySelector(`button[data-done="${m.id}"]`)?.addEventListener("click", ()=> saveMission(true));
      }
    }

    refreshBtn.addEventListener("click", ()=> load().catch(err=>{
      console.error(err);
      showAlert("Erreur reload : " + (err?.message || "inconnue"));
    }));

    // boot
    (async ()=>{
      try{
        await load();
      }catch(err){
        console.error(err);
        showAlert("Erreur chargement agent : " + (err?.message || "inconnue"));
      }
    })();
  </script>
</body>
</html>
