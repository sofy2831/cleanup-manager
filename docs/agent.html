<!-- docs/agent.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    :root{
      --violet-main:#7A5CFF; --violet-dark:#6238FF;
      --text:#111; --muted:#666;
      --border: rgba(122,92,255,0.18);
      --bad:#b3261e; --ok:#1b8f4d;
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF; --bg2:#EDE6FF;
    }
    body{ margin:0; background: linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:34px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main);
      color:var(--violet-main); text-decoration:none;
      font-weight:900; font-size:13px;
      cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .logo{ display:flex; align-items:center; gap:10px; margin-top:8px; margin-bottom:2px; width:100%; max-width:980px; }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff; border:2px solid var(--violet-main);
      display:flex; align-items:center; justify-content:center;
      color:var(--violet-main); font-size:18px; font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-5px;
      font-size:12px;
      color:var(--violet-main);
    }
    h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:12px; color:#444; font-weight:800; width:100%; max-width:980px; }

    .alert{
      width:100%; max-width:980px;
      display:none; margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
      font-weight:800;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .wrap{ width:100%; max-width:980px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }

    .card{
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 12px 12px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .card-title{ font-size:14px; font-weight:900; color:#111; display:flex; justify-content:space-between; gap:10px; align-items:flex-end; }
    .small{ font-size:12px; font-weight:900; color:#666; }

    .list{ display:flex; flex-direction:column; gap:10px; }
    .item{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }
    .left{ min-width:0; }
    .title{
      font-size:13px; font-weight:900; color:#222;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      max-width: 620px;
    }
    .sub{
      margin-top:3px;
      font-size:12px; font-weight:800; color:#666;
      white-space:pre-wrap;
      max-width: 620px;
    }
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      padding:3px 9px; border-radius:999px;
      background: rgba(122,92,255,0.12);
      color:#5b45c8;
      white-space:nowrap;
      font-size:11px;
      font-weight:900;
    }
    .chip.ok{ background: rgba(27,143,77,0.16); color: var(--ok); }
    .chip.bad{ background: rgba(179,38,30,0.14); color: var(--bad); }

    .actions{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex-shrink:0; }
    .btn{
      border:none;
      border-radius:999px;
      padding:9px 12px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
      white-space:nowrap;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn.primary{
      background: linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color: transparent;
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }

    .hint{
      font-size:11px; font-weight:900; color:#666; line-height:1.25;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="index.html">← Accueil</a>
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>

    <div class="logo">
      <div class="logo-icon">🧹</div>
      <div>
        <h1>Espace agent</h1>
        <div class="subtitle" id="helloLine">—</div>
      </div>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="wrap">
      <section class="card">
        <div class="card-title">
          <span>Missions assignées</span>
          <span class="small" id="countLine">—</span>
        </div>
        <div class="list" id="list"></div>
        <div class="hint">
          Si tu ne vois rien : soit tu n’es pas assigné(e), soit la conciergerie n’a pas encore envoyé les prestations.
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc, collection, query, where, orderBy, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const logoutBtn = document.getElementById("logoutBtn");
    const helloLine = document.getElementById("helloLine");
    const countLine = document.getElementById("countLine");
    const list = document.getElementById("list");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

    function statusChip(status){
      const x = (status||"").toUpperCase();
      if(x === "BON_A_FACTURER") return `<span class="chip ok">BON À FACTURER</span>`;
      if(x === "A_VALIDER") return `<span class="chip ok">À VALIDER</span>`;
      if(x === "EN_COURS") return `<span class="chip">EN COURS</span>`;
      if(x === "ASSIGNEE") return `<span class="chip">ASSIGNÉE</span>`;
      if(x === "VALIDEE") return `<span class="chip ok">VALIDÉE</span>`;
      return `<span class="chip">${esc(x || "—")}</span>`;
    }

    let currentUser = null;
    let currentEmail = "";

    async function guardAgent(user){
      // 1) lire users/{uid}
      const uSnap = await getDoc(doc(db, "users", user.uid));
      if(!uSnap.exists()){
        throw new Error("Profil introuvable (users/{uid}).");
      }
      const u = uSnap.data() || {};
      const role = String(u.role || "").toLowerCase();
      if(role !== "agent"){
        throw new Error("Accès refusé : rôle ≠ agent.");
      }
      return u;
    }

    async function loadAssignedEvents(){
      hideAlert();
      list.innerHTML = "";
      countLine.textContent = "Chargement…";

      // Version actuelle (ta base) : filtrer par assignedToEmail
      // (mieux plus tard : assignedAgentUid == user.uid)
      const q = query(
        collection(db, "events"),
        where("assignedToEmail", "==", currentEmail),
        orderBy("dateKey", "desc"),
        limit(40)
      );

      const snap = await getDocs(q);

      const rows = snap.docs.map(d => ({ id: d.id, ...(d.data()||{}) }));

      countLine.textContent = rows.length ? `${rows.length} prestation(s)` : "0";

      if(!rows.length){
        list.innerHTML = `
          <div style="padding:12px;border-radius:14px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.06);color:#666;font-weight:900;font-size:12px;">
            Aucune prestation assignée.
          </div>`;
        return;
      }

      for(const ev of rows){
        const home = `${ev.homeName || "Logement"}${ev.homeCity ? " — " + ev.homeCity : ""}`;
        const dt = `${(ev.dateKey || ev.date || "—")}${ev.time ? " à " + ev.time : ""}${ev.homeAddress ? " • " + ev.homeAddress : ""}`;
        const conc = ev.conciergerieName ? `Conciergerie : ${ev.conciergerieName}` : "";
        const st = ev.status || "EN_COURS";

        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `
          <div class="left">
            <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
              ${statusChip(st)}
              ${ev.conciergerieName ? `<span class="chip">${esc(ev.conciergerieName)}</span>` : ``}
            </div>
            <div class="title" title="${esc(home)}">${esc(home)}</div>
            <div class="sub">${esc(dt)}${conc ? "\n" + esc(conc) : ""}</div>
          </div>
          <div class="actions">
            <button class="btn primary" type="button" data-open="${esc(ev.id)}">Ouvrir</button>
          </div>
        `;
        list.appendChild(item);

        item.querySelector(`button[data-open="${CSS.escape(ev.id)}"]`).addEventListener("click", ()=>{
          const params = new URLSearchParams();
          params.set("prestationId", ev.id);

          // token optionnel : si tu le gardes, intervention.html peut aussi le passer.
          // ici on ne l’a pas forcément, donc on n’en met pas.

          // petit bonus : passer le nom conciergerie en query param pour affichage
          if(ev.conciergerieName) params.set("c", ev.conciergerieName);

          location.href = "mission.html?" + params.toString();
        });
      }
    }

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      location.href = "index.html";
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        const back = encodeURIComponent(location.pathname + location.search);
        location.href = "login.html?role=agent&redirect=" + back;
        return;
      }
      currentUser = user;

      try{
        const profile = await guardAgent(user);
        currentEmail = normalizeEmail(profile.email || user.email || "");
        if(!currentEmail){
          throw new Error("Email agent manquant (users/{uid}.email).");
        }
        helloLine.textContent = `${profile.company?.tradeName ? profile.company.tradeName + " • " : ""}${currentEmail}`;
        await loadAssignedEvents();
      }catch(err){
        console.error(err);
        showAlert(err?.message || "Erreur");
        countLine.textContent = "—";
      }
    });
  </script>
</body>
</html>
