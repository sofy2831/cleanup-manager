<!-- docs/agent.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:36px; }
    .topbar{
      width:100%; max-width:980px; display:flex; justify-content:space-between; align-items:center;
      gap:10px; position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .wrap{ width:100%; max-width:980px; margin-top:6px; display:flex; flex-direction:column; gap:10px; }
    h1{ margin:0; font-size:20px; font-weight:900; letter-spacing:-0.2px; }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; }
    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:12px;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }

    .chips{ display:flex; gap:8px; flex-wrap:wrap; }
    .chip{
      display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:999px;
      background:rgba(122,92,255,0.12); color:#5b45c8; font-size:11px; font-weight:900;
    }
    .chip.ok{ background:rgba(27,143,77,0.16); color:var(--ok); }
    .chip.bad{ background:rgba(179,38,30,0.14); color:var(--bad); }

    .missions{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .mcard{
      background:#fff; border-radius:16px; border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06); padding:12px;
      display:flex; flex-direction:column; gap:10px;
    }
    .mhead{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .mtitle{ font-size:14px; font-weight:900; color:#222; }
    .msub{ font-size:12px; font-weight:800; color:#666; white-space:pre-wrap; }

    .checklist{
      display:flex; flex-direction:column; gap:8px;
      border-top:1px dashed rgba(122,92,255,0.25); padding-top:10px;
    }
    .chk{
      display:flex; gap:10px; align-items:flex-start;
      background:rgba(122,92,255,0.06); border:1px solid rgba(122,92,255,0.12);
      border-radius:14px; padding:10px;
    }
    .chk input{ margin-top:3px; width:18px; height:18px; }
    .chk label{ font-size:12px; font-weight:900; color:#222; cursor:pointer; }
    .chk .hint{ font-size:11px; font-weight:800; color:#666; margin-top:3px; }

    textarea{
      width:100%; padding:10px; border-radius:12px; border:1px solid #D3C7FF; background:#fff;
      font-size:13px; outline:none; resize:vertical;
    }
    textarea:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .btn{
      border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:900; cursor:pointer;
      color:#fff; background:linear-gradient(90deg,var(--violet),var(--violet2));
      box-shadow:0 10px 22px rgba(0,0,0,0.10); white-space:nowrap;
    }
    .btn.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .done{
      border-left:5px solid rgba(27,143,77,0.55);
      background:linear-gradient(180deg,#ffffff 0%, rgba(27,143,77,0.06) 100%);
    }
    .locked{
      border-left:5px solid rgba(122,92,255,0.55);
      background:linear-gradient(180deg,#ffffff 0%, rgba(122,92,255,0.06) 100%);
    }

    /* Photos */
    .photos{
      border-top:1px dashed rgba(122,92,255,0.25);
      padding-top:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .ph-row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .ph-grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap:8px;
    }
    @media(max-width:920px){ .ph-grid{ grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media(max-width:720px){ .ph-grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .ph{
      position:relative;
      border-radius:14px;
      overflow:hidden;
      border:1px solid rgba(0,0,0,0.06);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      background:#fafafa;
    }
    .ph img{ width:100%; height:140px; object-fit:cover; display:block; }
    .ph .del{
      position:absolute; top:8px; right:8px;
      border:none; cursor:pointer;
      border-radius:999px; padding:6px 8px;
      font-weight:900; font-size:12px;
      background:rgba(255,255,255,0.92);
      color:var(--bad);
      box-shadow:0 2px 8px rgba(0,0,0,.10);
    }
    .ph .cap{
      position:absolute; left:8px; bottom:8px;
      background:rgba(255,255,255,0.92);
      padding:4px 8px; border-radius:999px;
      font-size:11px; font-weight:900; color:#444;
      box-shadow:0 2px 8px rgba(0,0,0,.10);
      max-width:90%;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    }

    /* Preview (avant upload) */
    .previews{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap:8px;
      margin-top:6px;
    }
    @media(max-width:920px){ .previews{ grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media(max-width:720px){ .previews{ grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    .pv{
      border:1px dashed rgba(122,92,255,0.35);
      border-radius:14px;
      overflow:hidden;
      background:rgba(122,92,255,0.04);
      position:relative;
    }
    .pv img{ width:100%; height:120px; object-fit:cover; display:block; }
    .pv .cap{
      position:absolute; left:8px; bottom:8px;
      background:rgba(255,255,255,0.92);
      padding:4px 8px; border-radius:999px;
      font-size:11px; font-weight:900; color:#444;
      box-shadow:0 2px 8px rgba(0,0,0,.10);
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <span class="pill" id="whoAmI">Agent (token)</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="pill" id="refreshBtn" type="button">Rafraîchir</button>
      </div>
    </div>

    <div class="wrap">
      <div>
        <h1>Mes missions</h1>
        <div class="sub" id="subLine">Chargement…</div>
        <div class="alert" id="alertBox"></div>
      </div>

      <section class="card">
        <div class="row">
          <div style="min-width:260px;">
            <div class="mini">Logement</div>
            <div style="margin-top:6px;font-weight:900;font-size:14px;" id="homeLine">—</div>
            <div class="mini" id="metaLine" style="margin-top:4px;">—</div>
          </div>

          <div class="chips">
            <span class="chip" id="chipToken">token: —</span>
            <span class="chip" id="chipExpiry">expire: —</span>
            <span class="chip" id="chipStatus">—</span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="mini">Missions</div>
        <div class="missions" id="missionsWrap"></div>
      </section>

      <div class="mini">
        Token-only (24h). Si le lien fuite, quelqu’un peut cocher à ta place. C’est moche mais c’est la vie.
      </div>
    </div>
  </div>

  <script type="module">
    import { storage, db } from "./firebase-init.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

    const MAX_PHOTOS = 20;
    const JPEG_QUALITY = 0.75;
    const MAX_DIM = 1600;

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const homeLine = document.getElementById("homeLine");
    const metaLine = document.getElementById("metaLine");
    const missionsWrap = document.getElementById("missionsWrap");

    const chipToken = document.getElementById("chipToken");
    const chipExpiry = document.getElementById("chipExpiry");
    const chipStatus = document.getElementById("chipStatus");

    const refreshBtn = document.getElementById("refreshBtn");
    const whoAmI = document.getElementById("whoAmI");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }

    function esc(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function missionTitle(type){
      const t = (type||"").toUpperCase();
      if(t==="CHECKIN") return "Check-in";
      if(t==="MENAGE") return "Ménage";
      if(t==="CHECKOUT") return "Check-out";
      if(t==="LINGE") return "Linge";
      if(t==="MAINTENANCE") return "Maintenance";
      if(t==="KITS") return "Kits & consommables";
      return t || "Mission";
    }

    function chipFor(st){
      const s = (st||"").toUpperCase();
      if(s==="VALIDEE") return `<span class="chip ok">VALIDÉE</span>`;
      if(s==="A_VALIDER") return `<span class="chip">À VALIDER</span>`;
      if(s==="ASSIGNEE") return `<span class="chip">ASSIGNÉE</span>`;
      if(s==="EN_COURS") return `<span class="chip">EN COURS</span>`;
      if(s==="TERMINEE") return `<span class="chip">TERMINÉE</span>`;
      return `<span class="chip">${esc(s || "—")}</span>`;
    }

    function prettyExpiryFromMs(ms){
      const t = Number(ms);
      if(!Number.isFinite(t)) return "—";
      const d = new Date(t);
      const pad2 = (n)=> String(n).padStart(2,"0");
      return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function tokenValid(tokenDoc){
      if(!tokenDoc?.active) return false;

      const expMs = Number(tokenDoc?.expiresAtMs);
      if(Number.isFinite(expMs)) return Date.now() < expMs;

      const ts = tokenDoc?.expiresAt;
      const ms = ts?.toMillis ? ts.toMillis() : NaN;
      if(Number.isFinite(ms)) return Date.now() < ms;

      const iso = tokenDoc?.expiresAtIso;
      const p = Date.parse(iso || "");
      if(Number.isFinite(p)) return Date.now() < p;

      return false;
    }

    function checklistToArray(cl){
      if(!cl) return [];
      if(Array.isArray(cl)){
        return cl.map((x,i)=>{
          if(typeof x === "string") return { key:String(i), label:x, done:false };
          return { key: x.key || String(i), label: x.label || ("Item "+(i+1)), done: !!x.done };
        });
      }
      if(typeof cl === "object"){
        const out = [];
        for(const [k,v] of Object.entries(cl)){
          if(typeof v === "boolean"){
            out.push({ key:k, label:k, done:v });
          }else{
            out.push({ key:k, label:(v?.label || k), done: !!v?.done });
          }
        }
        return out;
      }
      return [];
    }

    function arrayToChecklistObject(items){
      const obj = {};
      for(const it of items){
        obj[it.key] = { label: it.label, done: !!it.done };
      }
      return obj;
    }

    const token = qs("token");
    const prestationId = qs("prestationId");

    let tokenDoc = null;
    let eventDoc = null;

    function safeFileName(name){
      return (name || "photo.jpg").replace(/[^\w.\-]+/g, "_");
    }

    // ===== Compression JPEG =====
    async function fileToImageBitmap(file){
      try{
        if("createImageBitmap" in window){
          return await createImageBitmap(file);
        }
      }catch(e){}

      const url = URL.createObjectURL(file);
      try{
        const img = new Image();
        img.decoding = "async";
        img.src = url;
        await new Promise((res, rej)=>{
          img.onload = ()=>res();
          img.onerror = (e)=>rej(e);
        });

        const c = document.createElement("canvas");
        c.width = img.naturalWidth || img.width;
        c.height = img.naturalHeight || img.height;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0);

        const dataUrl = c.toDataURL("image/jpeg", 0.92);
        const blob = await (await fetch(dataUrl)).blob();
        return await createImageBitmap(blob);
      }finally{
        URL.revokeObjectURL(url);
      }
    }

    function computeResize(w,h,maxDim){
      const maxSide = Math.max(w,h);
      if(maxSide <= maxDim) return { w, h };
      const ratio = maxDim / maxSide;
      return { w: Math.round(w*ratio), h: Math.round(h*ratio) };
    }

    async function compressToJpegBlob(file){
      const bmp = await fileToImageBitmap(file);
      const { w, h } = computeResize(bmp.width, bmp.height, MAX_DIM);

      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;

      const ctx = canvas.getContext("2d", { alpha:false });
      ctx.drawImage(bmp, 0, 0, w, h);

      const blob = await new Promise((resolve, reject)=>{
        canvas.toBlob((b)=>{
          if(!b) return reject(new Error("Compression canvas.toBlob() a échoué."));
          resolve(b);
        }, "image/jpeg", JPEG_QUALITY);
      });

      return blob;
    }

    async function uploadMissionPhoto(missionType, originalFile){
      const safeName =
        Date.now() + "_" +
        Math.random().toString(16).slice(2) + "_" +
        safeFileName(originalFile.name || "photo.jpg").replace(/\.(heic|heif)$/i, ".jpg");

      const finalName = (/\.(jpg|jpeg)$/i.test(safeName)) ? safeName : (safeName + ".jpg");

      // doit matcher tes rules STORAGE "ancien format"
      const path = `missionPhotos/${prestationId}/${missionType}/${token}/${finalName}`;
      const ref = sRef(storage, path);

      const jpegBlob = await compressToJpegBlob(originalFile);

      await uploadBytes(ref, jpegBlob, { contentType: "image/jpeg" });

      // si tes rules read sont OK, ça marche. Sinon => permission-denied ici.
      const url = await getDownloadURL(ref);
      return url;
    }

    function buildPreviews(files){
      const urls = [];
      for(const f of files){
        try{ urls.push(URL.createObjectURL(f)); }catch{}
      }
      return urls;
    }

    function mergeUniqueMax(arr, add, max){
      const out = Array.isArray(arr) ? arr.filter(Boolean) : [];
      if(add && !out.includes(add)) out.push(add);
      return out.slice(0, max);
    }

    function computePreview(arr){
      const a = Array.isArray(arr) ? arr.filter(Boolean) : [];
      return a.slice(0, 3);
    }

    async function load(){
      hideAlert();
      missionsWrap.innerHTML = "";
      subLine.textContent = "Chargement…";

      if(!token || !prestationId){
        showAlert("⛔ Paramètres manquants (token / prestationId).");
        return;
      }

      whoAmI.textContent = "Agent (token)";
      chipToken.textContent = "token: " + token;

      // token doc
      const tSnap = await getDoc(doc(db, "dayTokens", token));
      if(!tSnap.exists()){
        showAlert("⛔ Token invalide.");
        chipStatus.innerHTML = `<span class="chip bad">INVALIDE</span>`;
        return;
      }
      tokenDoc = tSnap.data() || {};

      // sécurité : token scope
      if(String(tokenDoc.prestationId) !== String(prestationId)){
        showAlert("⛔ Token ≠ prestation.");
        chipStatus.innerHTML = `<span class="chip bad">SCOPE</span>`;
        return;
      }

      chipExpiry.textContent = "expire: " + (
        Number.isFinite(Number(tokenDoc.expiresAtMs))
          ? prettyExpiryFromMs(tokenDoc.expiresAtMs)
          : (tokenDoc.expiresAt?.toDate ? prettyExpiryFromMs(tokenDoc.expiresAt.toDate().getTime()) : "—")
      );

      if(!tokenValid(tokenDoc)){
        chipStatus.innerHTML = `<span class="chip bad">EXPIRÉ</span>`;
        showAlert("⛔ Token expiré. Demande un nouveau lien.");
        return;
      }
      chipStatus.innerHTML = `<span class="chip ok">OK</span>`;

      // event doc : conciergerie-only => best effort
      try{
        const eSnap = await getDoc(doc(db, "events", prestationId));
        if(eSnap.exists()) eventDoc = eSnap.data() || {};
      }catch(e){
        eventDoc = null;
      }

      const homeName = eventDoc?.homeName || "Logement";
      const homeCity = eventDoc?.homeCity ? " — " + eventDoc.homeCity : "";
      homeLine.textContent = homeName + homeCity;

      metaLine.textContent =
        (eventDoc?.dateKey || eventDoc?.date || "—") +
        (eventDoc?.time ? " à " + eventDoc.time : "") +
        (eventDoc?.homeAddress ? " • " + eventDoc.homeAddress : "") +
        `\nAgent : ${(tokenDoc.agentName || "—")}${tokenDoc.agentEmail ? " • " + tokenDoc.agentEmail : ""}`;

      // mission types depuis token
      const TYPES = Array.isArray(tokenDoc.missionTypes) && tokenDoc.missionTypes.length
        ? tokenDoc.missionTypes.map(x => String(x||"").toUpperCase()).filter(Boolean)
        : ["MENAGE"];

      // lire missions existantes
      const missions = [];
      for(const t of TYPES){
        const mSnap = await getDoc(doc(db, "events", prestationId, "missions", t));
        if(mSnap.exists()) missions.push({ id:t, data: mSnap.data() || {} });
      }

      subLine.textContent = "";

      if(!missions.length){
        missionsWrap.innerHTML = `
          <div class="mcard">
            <div class="mtitle">Aucune mission</div>
            <div class="msub">Soit elles n’existent pas, soit les rules bloquent la lecture.
Vérifie que intervention.html les crée bien + dayToken bien écrit.</div>
          </div>`;
        return;
      }

      missionsWrap.innerHTML = "";
      for(const m of missions){
        const d = m.data || {};
        const locked = !!d.locked;
        const done = !!d.agentDone;
        const status = (d.status || "").toUpperCase() || "—";

        const items = checklistToArray(d.checklist);
        const photos = Array.isArray(d.photos) ? d.photos.filter(Boolean) : [];

        const checklistHtml = items.length
          ? items.map((it, idx)=>{
              const id = `chk_${m.id}_${idx}`;
              return `
                <div class="chk">
                  <input type="checkbox" id="${esc(id)}" data-k="${esc(it.key)}" ${it.done ? "checked" : ""} ${locked ? "disabled" : ""} />
                  <div>
                    <label for="${esc(id)}">${esc(it.label)}</label>
                    <div class="hint">${it.done ? "fait" : "à faire"}</div>
                  </div>
                </div>
              `;
            }).join("")
          : `<div class="mini">Checklist vide.</div>`;

        const photosHtml = photos.length
          ? `
            <div class="ph-grid">
              ${photos.map((url, idx)=>`
                <div class="ph">
                  <img src="${esc(url)}" alt="photo ${idx+1}">
                  ${locked ? "" : `<button class="del" type="button" data-phdel="${m.id}" data-i="${idx}">✕</button>`}
                  <div class="cap">photo ${idx+1}</div>
                </div>
              `).join("")}
            </div>
          `
          : `<div class="mini">Aucune photo.</div>`;

        const wrap = document.createElement("div");
        wrap.className = "mcard" + (done ? " done" : "") + (locked ? " locked" : "");
        wrap.innerHTML = `
          <div class="mhead">
            <div>
              <div class="mtitle">${missionTitle(d.type || m.id)} ${locked ? "• verrouillée" : ""}</div>
              <div class="msub">Status : ${esc(status)} ${done ? "\n✔ Terminée" : ""}</div>
            </div>
            <div>${chipFor(status)}</div>
          </div>

          <div class="checklist" data-m="${esc(m.id)}">
            ${checklistHtml}
          </div>

          <div>
            <div class="mini" style="margin-bottom:6px;">Commentaire (optionnel)</div>
            <textarea rows="2" placeholder="Ex. problème, remarque..." data-comment="${esc(m.id)}" ${locked ? "disabled" : ""}>${esc(d.agentComment || "")}</textarea>
          </div>

          <div class="photos" data-ph="${esc(m.id)}">
            <div class="ph-row">
              <div class="mini">Photos (max ${MAX_PHOTOS}) — compression automatique</div>
              <div class="mini">${photos.length}/${MAX_PHOTOS}</div>
            </div>

            ${photosHtml}

            <div class="ph-row">
              <input type="file" accept="image/*" data-phinput="${esc(m.id)}" ${locked || photos.length>=MAX_PHOTOS ? "disabled" : ""} />
              <button class="btn ghost" type="button" data-phupload="${esc(m.id)}" ${locked || photos.length>=MAX_PHOTOS ? "disabled" : ""}>Uploader</button>
            </div>

            <div class="mini" data-phhint="${esc(m.id)}"></div>
            <div class="previews" data-pv="${esc(m.id)}" style="display:none;"></div>
          </div>

          <div class="actions">
            <button class="btn ghost" type="button" data-save="${esc(m.id)}" ${locked ? "disabled" : ""}>Enregistrer</button>
            <button class="btn" type="button" data-done="${esc(m.id)}" ${locked ? "disabled" : ""}>Terminer</button>
          </div>
        `;
        missionsWrap.appendChild(wrap);

        function setHint(text){
          const hint = wrap.querySelector(`[data-phhint="${m.id}"]`);
          if(hint) hint.textContent = text || "";
        }

        function showPreviews(files){
          const pv = wrap.querySelector(`[data-pv="${m.id}"]`);
          if(!pv) return;
          pv.innerHTML = "";
          if(!files || !files.length){
            pv.style.display = "none";
            return;
          }
          const urls = buildPreviews(files);
          pv.style.display = "grid";
          urls.slice(0,4).forEach((u, idx)=>{
            const div = document.createElement("div");
            div.className = "pv";
            div.innerHTML = `<img src="${u}"><div class="cap">preview ${idx+1}</div>`;
            pv.appendChild(div);
          });
        }

        async function saveMission(markDone=false){
          hideAlert();
          const type = m.id;

          const box = wrap.querySelector(`.checklist[data-m="${type}"]`);
          const checks = Array.from(box.querySelectorAll('input[type="checkbox"][data-k]'));
          const newItems = checks.map(ch => {
            const key = ch.getAttribute("data-k");
            const labelEl = box.querySelector(`label[for="${ch.id}"]`);
            const label = labelEl ? labelEl.textContent.trim() : key;
            return { key, label, done: !!ch.checked };
          });

          const commentEl = wrap.querySelector(`textarea[data-comment="${type}"]`);
          const comment = (commentEl?.value || "").trim();

          // IMPORTANT: token-only => on évite updatedAt / serverTimestamp
          const payload = {
            checklist: arrayToChecklistObject(newItems),
            agentComment: comment,
            status: markDone ? "A_VALIDER" : (d.status || "EN_COURS"),
            agentDone: markDone ? true : (!!d.agentDone),
            locked: markDone ? true : (!!d.locked),
          };

          try{
            await updateDoc(doc(db, "events", prestationId, "missions", type), payload);

            if(markDone){
              // event opStatus : seulement si tes rules events token-only sont OK + event.dayToken existe
              try{
                await updateDoc(doc(db, "events", prestationId), { opStatus: "A_VALIDER" });
              }catch(e){
                console.warn("event opStatus blocked:", e?.message || e);
              }
            }

            showAlert(markDone ? "✅ Mission terminée (À VALIDER) + verrouillée." : "✅ Enregistré.", true);
            await load();
          }catch(err){
            console.error(err);
            showAlert("Erreur enregistrement : " + (err?.code || err?.message || "inconnue"));
          }
        }

        async function addPhoto(){
          hideAlert();
          const type = m.id;

          const input = wrap.querySelector(`input[data-phinput="${type}"]`);
          const file = input?.files?.[0];
          if(!file) return showAlert("Choisis une image.");

          const fresh = await getDoc(doc(db, "events", prestationId, "missions", type));
          const cur = fresh.exists() ? (fresh.data()||{}) : {};
          const curPhotos = Array.isArray(cur.photos) ? cur.photos.filter(Boolean) : [];
          if(curPhotos.length >= MAX_PHOTOS) return showAlert(`Max ${MAX_PHOTOS} photos.`);

          try{
            setHint("Compression + upload… (ne ferme pas la page)");

            // 1) upload storage + getDownloadURL
            const url = await uploadMissionPhoto(type, file);

            // 2) write firestore mission.photos (sans updatedAt)
            const nextPhotos = mergeUniqueMax(curPhotos, url, MAX_PHOTOS);
            await updateDoc(doc(db, "events", prestationId, "missions", type), { photos: nextPhotos });

            showAlert("✅ Photo ajoutée.", true);
            await load();
          }catch(err){
            console.error(err);
            showAlert("Erreur upload photo : " + (err?.code || err?.message || "inconnue"));
          }finally{
            if(input) input.value = "";
            showPreviews([]);
            setHint("");
          }
        }

        async function deletePhoto(index){
          hideAlert();
          const type = m.id;

          try{
            const fresh = await getDoc(doc(db, "events", prestationId, "missions", type));
            const cur = fresh.exists() ? (fresh.data()||{}) : {};
            const curPhotos = Array.isArray(cur.photos) ? cur.photos.filter(Boolean) : [];
            curPhotos.splice(index, 1);

            // mission.photos only
            await updateDoc(doc(db, "events", prestationId, "missions", type), {
              photos: curPhotos.slice(0, MAX_PHOTOS),
            });

            showAlert("✅ Photo supprimée.", true);
            await load();
          }catch(err){
            console.error(err);
            showAlert("Erreur suppression photo : " + (err?.code || err?.message || "inconnue"));
          }
        }

        wrap.querySelector(`button[data-save="${m.id}"]`)?.addEventListener("click", ()=> saveMission(false));
        wrap.querySelector(`button[data-done="${m.id}"]`)?.addEventListener("click", ()=> saveMission(true));
        wrap.querySelector(`button[data-phupload="${m.id}"]`)?.addEventListener("click", ()=> addPhoto());

        const fileInput = wrap.querySelector(`input[data-phinput="${m.id}"]`);
        fileInput?.addEventListener("change", ()=>{
          const files = fileInput.files ? Array.from(fileInput.files) : [];
          showPreviews(files.slice(0,1));
        });

        wrap.querySelectorAll(`button[data-phdel="${m.id}"]`).forEach(btn=>{
          btn.addEventListener("click", ()=>{
            const i = Number(btn.getAttribute("data-i"));
            if(Number.isFinite(i)) deletePhoto(i);
          });
        });
      }
    }

    refreshBtn.addEventListener("click", ()=> load().catch(err=>{
      console.error(err);
      showAlert("Erreur reload : " + (err?.code || err?.message || "inconnue"));
    }));

    load().catch(err=>{
      console.error(err);
      showAlert("Erreur chargement agent : " + (err?.code || err?.message || "inconnue"));
    });
  </script>
</body>
</html>
