<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>CleanUp Manager — Agent</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script type="module">
    import { db } from "./firebase-init.js";
    import {
      doc, getDoc, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const qs = n => new URLSearchParams(location.search).get(n);
    const token = qs("token");
    const prestationId = qs("prestationId");

    const missionsWrap = document.getElementById("missions");

    async function load() {
      missionsWrap.innerHTML = "";

      const tokenSnap = await getDoc(doc(db, "dayTokens", token));
      if (!tokenSnap.exists()) {
        missionsWrap.innerHTML = "⛔ Token invalide";
        return;
      }

      const tokenData = tokenSnap.data();
      const types = tokenData.missionTypes || [];

      for (const type of types) {
        const ref = doc(db, "events", prestationId, "missions", type);
        const snap = await getDoc(ref);
        if (!snap.exists()) continue;

        const m = snap.data();
        const div = document.createElement("div");
        div.style.border = "1px solid #ccc";
        div.style.padding = "10px";
        div.style.marginBottom = "10px";

        const checklist = m.checklist || {};
        let checklistHtml = "";

        Object.entries(checklist).forEach(([k,v])=>{
          checklistHtml += `
            <label>
              <input type="checkbox" data-k="${k}" ${v.done ? "checked" : ""} ${m.locked ? "disabled":""}/>
              ${v.label}
            </label><br/>
          `;
        });

        div.innerHTML = `
          <h3>${type}</h3>
          ${checklistHtml || "<i>Checklist vide</i>"}
          <br/>
          <textarea data-comment rows="2" placeholder="Commentaire">${m.agentComment || ""}</textarea><br/>
          <button data-save>Enregistrer</button>
          <button data-done ${m.locked ? "disabled":""}>Terminer</button>
        `;

        div.querySelector("[data-save]").onclick = async ()=>{
          const inputs = div.querySelectorAll("input[data-k]");
          const newChecklist = {};
          inputs.forEach(i=>{
            const key = i.dataset.k;
            newChecklist[key] = {
              label: checklist[key].label,
              done: i.checked
            };
          });

          await updateDoc(ref,{
            checklist: newChecklist,
            agentComment: div.querySelector("textarea").value,
            updatedAt: new Date()
          });
          alert("Enregistré");
        };

        div.querySelector("[data-done]").onclick = async ()=>{
          await updateDoc(ref,{
            agentDone: true,
            locked: true,
            status: "A_VALIDER",
            updatedAt: new Date()
          });
          alert("Mission terminée");
          load();
        };

        missionsWrap.appendChild(div);
      }
    }

    load();
  </script>
</head>
<body>
  <h1>Mes missions</h1>
  <div id="missions">Chargement…</div>
</body>
</html>
