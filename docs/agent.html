<!-- docs/agent.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; }
    .topbar{ width:100%; max-width:980px; display:flex; justify-content:space-between; gap:10px; position:sticky; top:0; z-index:10; padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px); }
    .pill{ display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px; background:#fff; border:2px solid var(--violet); color:var(--violet); text-decoration:none; font-weight:900; font-size:13px; cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06); }
    .wrap{ width:100%; max-width:980px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }

    .card{ background:rgba(255,255,255,0.86); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:12px; }
    h1{ margin:0; font-size:20px; font-weight:900; letter-spacing:-0.2px; }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; }
    .alert{ display:none; margin-top:10px; padding:10px 12px; border-radius:14px; background:#fff; border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06); font-size:12px; font-weight:800; color:#444; white-space:pre-wrap; }
    .alert.ok{ border-left-color:var(--ok); }

    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:12px; }

    .chips{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      padding:4px 9px; border-radius:999px;
      background:rgba(122,92,255,0.12); color:#5b45c8;
      font-size:11px; font-weight:900;
    }
    .chip.ok{ background:rgba(27,143,77,0.16); color:var(--ok); }
    .chip.bad{ background:rgba(179,38,30,0.14); color:var(--bad); }

    .grid{ display:grid; grid-template-columns:1fr; gap:10px; margin-top:10px; }
    @media(min-width:820px){ .grid{ grid-template-columns: 1fr 1fr; } }

    .mcard{
      background:#fff; border-radius:16px; border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06); padding:10px;
      display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
    }
    .m-left{ min-width:0; }
    .m-title{ font-size:13px; font-weight:900; color:#222; }
    .m-sub{ margin-top:4px; font-size:12px; font-weight:800; color:#666; white-space:pre-wrap; }
    .m-actions{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex-shrink:0; }

    .btn{
      border:none; border-radius:999px; padding:9px 12px;
      font-size:13px; font-weight:900; cursor:pointer;
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff; box-shadow:0 10px 22px rgba(0,0,0,0.10); white-space:nowrap;
    }
    .btn.ghost{
      background:#fff; color:var(--violet);
      border:2px solid var(--violet); box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <span class="pill">Agent</span>
      <button class="pill" id="resetBtn" type="button">Réinitialiser</button>
    </div>

    <div class="wrap">
      <section class="card">
        <div class="row">
          <div>
            <h1>Mes missions</h1>
            <div class="sub" id="subLine">Chargement…</div>
          </div>
          <div class="chips">
            <span class="chip" id="chipToken">token: —</span>
            <span class="chip" id="chipExpiry">expire: —</span>
            <span class="chip" id="chipStatus">—</span>
          </div>
        </div>

        <div class="alert" id="alertBox"></div>

        <div class="mini" style="margin-top:10px;">
          Session : <span class="mono" id="whoAmI">—</span>
        </div>

        <div style="margin-top:10px;">
          <div class="mini">Prestation</div>
          <div style="margin-top:6px;font-weight:900;font-size:14px;" id="homeLine">—</div>
          <div class="mini" id="metaLine" style="margin-top:4px;white-space:pre-wrap;">—</div>
        </div>
      </section>

      <section class="card">
        <div class="row">
          <div style="font-weight:900;">Missions</div>
          <button class="btn ghost" id="refreshBtn" type="button">Rafraîchir</button>
        </div>
        <div class="mini" style="margin-top:6px;">Clique sur une mission pour ouvrir la checklist.</div>
        <div class="grid" id="missionsGrid"></div>
      </section>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const homeLine = document.getElementById("homeLine");
    const metaLine = document.getElementById("metaLine");
    const missionsGrid = document.getElementById("missionsGrid");

    const chipToken = document.getElementById("chipToken");
    const chipExpiry = document.getElementById("chipExpiry");
    const chipStatus = document.getElementById("chipStatus");

    const resetBtn = document.getElementById("resetBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const whoAmI = document.getElementById("whoAmI");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }

    function parseIso(iso){ const t = Date.parse(iso || ""); return Number.isFinite(t) ? t : NaN; }
    function tokenValid(t){
      if(t?.expiresAt?.seconds){
        return Date.now() < (Number(t.expiresAt.seconds) * 1000);
      }
      const exp = parseIso(t?.expiresAtIso);
      return Number.isFinite(exp) ? (Date.now() < exp) : true;
    }
    function prettyExpiry(t){
      let ms = NaN;
      if(t?.expiresAt?.seconds) ms = Number(t.expiresAt.seconds) * 1000;
      else ms = parseIso(t?.expiresAtIso);
      if(!Number.isFinite(ms)) return "—";
      const d = new Date(ms);
      const pad2 = (n)=> String(n).padStart(2,"0");
      return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function missionTitle(type){
      const t = (type||"").toUpperCase();
      if(t==="CHECKIN") return "Check-in";
      if(t==="CHECKOUT") return "Check-out";
      if(t==="MENAGE") return "Ménage";
      if(t==="LINGE") return "Linge";
      if(t==="KITS") return "Kits";
      if(t==="MAINTENANCE") return "Maintenance";
      return t || "Mission";
    }
    function chipFor(st){
      const s = (st||"").toUpperCase();
      if(s==="VALIDEE") return `<span class="chip ok">VALIDÉE</span>`;
      if(s==="A_VALIDER") return `<span class="chip">À VALIDER</span>`;
      if(s==="ASSIGNEE") return `<span class="chip">ASSIGNÉE</span>`;
      return `<span class="chip">${s || "—"}</span>`;
    }

    const token = qs("token");
    const prestationId = qs("prestationId");
    const FALLBACK_TYPES = ["CHECKIN","MENAGE","CHECKOUT","LINGE","KITS","MAINTENANCE"];

    async function safeGetMission(type){
      try{
        const mSnap = await getDoc(doc(db, "events", prestationId, "missions", type));
        return mSnap.exists() ? { id:type, data:mSnap.data() || {} } : null;
      }catch(err){
        // Important: on NE plante plus l'écran à cause d'un type manquant/denied
        console.warn("Mission read failed:", type, err?.code || err?.message);
        return null;
      }
    }

    async function load(){
      hideAlert();
      missionsGrid.innerHTML = "";
      subLine.textContent = "Chargement…";
      homeLine.textContent = "—";
      metaLine.textContent = "—";

      if(!token || !prestationId){
        showAlert("⛔ Paramètres manquants (token / prestationId).");
        return;
      }

      const tSnap = await getDoc(doc(db, "dayTokens", token));
      if(!tSnap.exists()){
        chipStatus.innerHTML = `<span class="chip bad">KO</span>`;
        showAlert("⛔ Token invalide.");
        return;
      }
      const t = tSnap.data() || {};
      console.log("TOKEN DOC", t);
console.log("missionTypes?", t.missionTypes);

      
      chipToken.textContent = "token: " + token;
      chipExpiry.textContent = "expire: " + prettyExpiry(t);

      if(String(t.prestationId) !== String(prestationId)){
        chipStatus.innerHTML = `<span class="chip bad">KO</span>`;
        showAlert("⛔ Token ≠ prestation.");
        return;
      }

      if(!tokenValid(t)){
        chipStatus.innerHTML = `<span class="chip bad">EXPIRÉ</span>`;
        showAlert("⛔ Token expiré. Demande un nouveau lien.");
        return;
      }

      chipStatus.innerHTML = `<span class="chip ok">OK</span>`;

      // ✅ Types depuis le token (obligatoire pour éviter de tester 6 docs)
const TYPES = Array.isArray(t.missionTypes) && t.missionTypes.length
  ? t.missionTypes.map(x => String(x || "").toUpperCase())
  : [];

if(!TYPES.length){
  subLine.textContent = "Prestation #" + prestationId + " — 0 mission(s)";
  missionsGrid.innerHTML = `
    <div class="mcard">
      <div class="m-left">
        <div class="m-title">Aucune mission (token incomplet)</div>
        <div class="m-sub">
Le token ne contient pas <b>missionTypes</b>.
Regénère le lien depuis Intervention.
        </div>
      </div>
    </div>`;
  return;
}

// Lire uniquement les missions listées
const results = await Promise.all(TYPES.map(safeGetMission));
const ms = results.filter(Boolean);

subLine.textContent = "Prestation #" + prestationId + " — " + ms.length + " mission(s)";

if(!ms.length){
  missionsGrid.innerHTML = `
    <div class="mcard">
      <div class="m-left">
        <div class="m-title">Aucune mission affichable</div>
        <div class="m-sub">
Les missions existent peut-être côté conciergerie, mais l’agent ne peut pas les lire (rules) ou elles n’existent pas sur ce <b>prestationId</b>.
        </div>
      </div>
    </div>`;
  return;
}

const first = ms[0].data || {};

      homeLine.textContent = `${first.homeName || "Logement"}${first.homeCity ? " — " + first.homeCity : ""}`;
      metaLine.textContent =
        `${first.dateKey || "—"}${first.time ? " à " + first.time : ""}` +
        `${first.homeAddress ? " • " + first.homeAddress : ""}` +
        `\nAgent : ${(t.agentName || "—")}${t.agentEmail ? " • " + t.agentEmail : ""}`;

      for(const m of ms){
        const d = m.data || {};
        const div = document.createElement("div");
        div.className = "mcard";
        div.innerHTML = `
          <div class="m-left">
            <div class="m-title">${missionTitle(d.type || m.id)} ${d.locked ? "• verrouillée" : ""}</div>
            <div class="m-sub">
Status : ${(d.status||"").toUpperCase() || "—"}
${d.agentDone ? "✔ Terminée" : "—"}
            </div>
          </div>
          <div class="m-actions">
            ${chipFor(d.status)}
            <button class="btn" type="button" data-open="${m.id}" ${d.locked ? "disabled" : ""}>Ouvrir</button>
          </div>
        `;
        missionsGrid.appendChild(div);

        div.querySelector("button[data-open]")?.addEventListener("click", ()=>{
          location.href = `mission.html?token=${encodeURIComponent(token)}&prestationId=${encodeURIComponent(prestationId)}&type=${encodeURIComponent(m.id)}`;
        });
      }
    }

    refreshBtn.addEventListener("click", ()=> load().catch(err=>{
      console.error(err);
      showAlert("Erreur Firestore : " + (err?.message || "inconnue"));
    }));

    resetBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      location.reload();
    });

    onAuthStateChanged(auth, async (user)=>{
      try{
        if(!user){
          await signInAnonymously(auth);
          return;
        }
        whoAmI.textContent = `${user.isAnonymous ? "anonymous" : "auth"}:${user.uid}`;
        await load();
      }catch(err){
        console.error(err);
        showAlert("Erreur Firestore : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
