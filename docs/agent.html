<!-- docs/agent.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:86px; }
    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; gap:10px;
      position:sticky; top:0; z-index:10;
      padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    h1{ margin:0; font-size:20px; font-weight:900; letter-spacing:-0.2px; text-align:center; }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; text-align:center; }

    .wrap{ width:100%; max-width:980px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }
    .card{
      background:rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
    }

    .alert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:800;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      flex-wrap:wrap;
    }
    .home{
      min-width:240px;
      flex:1;
    }
    .home .t{ font-size:12px; font-weight:900; color:#333; }
    .home .v{ margin-top:5px; font-size:14px; font-weight:900; color:#111; }
    .home .m{ margin-top:4px; font-size:12px; font-weight:800; color:#666; white-space:pre-wrap; }

    .chips{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      padding:4px 10px;
      border-radius:999px;
      background:rgba(122,92,255,0.12);
      color:#5b45c8;
      font-size:11px;
      font-weight:900;
      white-space:nowrap;
    }
    .chip.ok{ background:rgba(27,143,77,0.16); color:var(--ok); }
    .chip.bad{ background:rgba(179,38,30,0.14); color:var(--bad); }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:10px;
    }
    @media(min-width:820px){
      .grid{ grid-template-columns:1fr 1fr; }
    }

    .mcard{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }
    .m-left{ min-width:0; }
    .m-title{ font-size:13px; font-weight:900; color:#222; }
    .m-sub{ margin-top:4px; font-size:12px; font-weight:800; color:#666; white-space:pre-wrap; }
    .m-actions{ display:flex; flex-direction:column; gap:8px; align-items:flex-end; flex-shrink:0; }
    .btn{
      border:none; border-radius:999px;
      padding:9px 12px;
      font-size:12px; font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      color:#fff;
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .btn.ghost{
      background:#fff;
      color:var(--violet);
      border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .note{
      font-size:11px;
      font-weight:900;
      color:#666;
      line-height:1.35;
      margin-top:6px;
    }

    .bottom{
      position:fixed;
      left:0; right:0; bottom:0;
      z-index:50;
      padding:10px 12px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
      display:flex;
      justify-content:center;
    }
    .bottom .inner{
      width:100%;
      max-width:980px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <span class="pill" id="pillInfo">Agent</span>
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>

    <div style="width:100%;max-width:980px;margin-top:6px;">
      <h1>Mes missions</h1>
      <div class="sub" id="subLine">Chargement…</div>
      <div class="alert" id="alertBox"></div>
    </div>

    <div class="wrap">
      <section class="card">
        <div class="head">
          <div class="home">
            <div class="t">Prestation</div>
            <div class="v" id="homeLine">—</div>
            <div class="m" id="metaLine">—</div>
          </div>
          <div class="chips">
            <span class="chip" id="chipToken">token: —</span>
            <span class="chip" id="chipExpiry">expire: —</span>
            <span class="chip" id="chipStatus">—</span>
          </div>
        </div>

        <div class="note">
          Tu vois ici uniquement les missions utiles (déduites de la prestation). Clique sur une mission pour ouvrir la checklist.
        </div>
      </section>

      <section class="card">
        <div style="font-weight:900;">Missions</div>
        <div class="grid" id="missionsGrid"></div>
      </section>
    </div>
  </div>

  <div class="bottom">
    <div class="inner">
      <button class="btn ghost" id="refreshBtn" type="button">Rafraîchir</button>
      <div class="note" id="whoAmI" style="margin:0; text-align:right;">—</div>
    </div>
  </div>

  <script type="module">
    // ✅ agent.html — au début du script
const nextUrl = encodeURIComponent(location.href);

    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc,
      collection, getDocs,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const homeLine = document.getElementById("homeLine");
    const metaLine = document.getElementById("metaLine");
    const missionsGrid = document.getElementById("missionsGrid");

    const chipToken = document.getElementById("chipToken");
    const chipExpiry = document.getElementById("chipExpiry");
    const chipStatus = document.getElementById("chipStatus");

    const logoutBtn = document.getElementById("logoutBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const whoAmI = document.getElementById("whoAmI");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }

    function norm(s){
      return (s||"").toString().trim().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    }

    function hasAny(label, arr){
      const x = norm(label);
      return arr.some(k => x.includes(norm(k)));
    }

    function parseIso(iso){
      const t = Date.parse(iso || "");
      return Number.isFinite(t) ? t : NaN;
    }

    function tokenValid(t){
      if(!t?.active) return false;
      if(!t?.expiresAtIso) return false;
      const exp = parseIso(t.expiresAtIso);
      if(!Number.isFinite(exp)) return false;
      return Date.now() < exp;
    }

    // ---- mapping béton check-in/out
    const KW_CHECKOUT = [
      "check-out","checkout","depart","départ","sortie","fin de sejour","fin de séjour",
      "recuperation","récupération","recup","récup",
      "retour cles","retour clés","recup cles","récup clés","recuperer cles","récupérer clés",
      "rendre cles","rendre clés","badges","badge","changer code","changement code","code change"
    ];

    const KW_CHECKIN = [
      "check-in","checkin","arrivee","arrivée","accueil","entree","entrée",
      "remise cles","remise clés","boite a cles","boîte a clés","boite a clés",
      "code","digicode"
    ];

    function detectTypesFromLines(lines){
      const types = new Set();

      for(const ln of (lines||[])){
        const cat = norm(ln.category);
        const lab = ln.label || "";

        if(cat.includes("menage")) types.add("MENAGE");
        if(cat.includes("linge") || cat.includes("blanch")) types.add("LINGE");
        if(cat.includes("kits") || cat.includes("consomm")) types.add("KITS");
        if(cat.includes("maintenance") || cat.includes("depannage") || cat.includes("dépannage")) types.add("MAINTENANCE");

        if(cat.includes("accueil") || cat.includes("voyageur") || cat.includes("sortie")){
          if(hasAny(lab, KW_CHECKOUT)) types.add("CHECKOUT");
          else if(hasAny(lab, KW_CHECKIN)) types.add("CHECKIN");
          else types.add("CHECKIN"); // fallback
        }
      }
      return Array.from(types);
    }

    function missionTitle(type){
      const t = (type||"").toUpperCase();
      if(t==="CHECKIN") return "Check-in";
      if(t==="CHECKOUT") return "Check-out";
      if(t==="MENAGE") return "Ménage";
      if(t==="LINGE") return "Linge";
      if(t==="KITS") return "Kits";
      if(t==="MAINTENANCE") return "Maintenance";
      return t || "Mission";
    }

    function chipFor(st){
      const s = (st||"").toUpperCase();
      if(s==="VALIDEE") return `<span class="chip ok">VALIDÉE</span>`;
      if(s==="A_VALIDER") return `<span class="chip">À VALIDER</span>`;
      if(s==="ASSIGNEE") return `<span class="chip">ASSIGNÉE</span>`;
      return `<span class="chip">${s || "—"}</span>`;
    }

    async function ensureMission(eventId, base, type){
      const mRef = doc(db, "events", eventId, "missions", type);
      const mSnap = await getDoc(mRef);
      if(!mSnap.exists()){
        await setDoc(mRef, {
          ...base,
          type,
          status: "ASSIGNEE",
          locked: false,
          createdAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          checklist: {} // prêt
        });
      }
    }

    function prettyExpiry(iso){
      const t = parseIso(iso);
      if(!Number.isFinite(t)) return "—";
      const d = new Date(t);
      // affichage local simple
      const pad2 = (n)=> String(n).padStart(2,"0");
      return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    const token = qs("token");
    const prestationId = qs("prestationId");

    let currentUser = null;
    let tokenDoc = null;
    let eventDoc = null;

    async function load(){
      hideAlert();
      missionsGrid.innerHTML = "";
      subLine.textContent = "Chargement…";

      if(!token || !prestationId){
        showAlert("⛔ Paramètres manquants (token / prestationId).");
        return;
      }

      // 1) token
      const tSnap = await getDoc(doc(db, "dayTokens", token));
      if(!tSnap.exists()){
        showAlert("⛔ Token invalide.");
        return;
      }
      tokenDoc = tSnap.data() || {};

      chipToken.textContent = "token: " + token;
      chipExpiry.textContent = "expire: " + prettyExpiry(tokenDoc.expiresAtIso);

      if(String(tokenDoc.prestationId) !== String(prestationId)){
        showAlert("⛔ Token ≠ prestation.");
        return;
      }

      if(!tokenValid(tokenDoc)){
        chipStatus.innerHTML = `<span class="chip bad">EXPIRÉ</span>`;
        showAlert("⛔ Token expiré (24h). Demande un nouveau lien.");
        return;
      }

      // 2) user email check
      const userEmail = (currentUser?.email || "").toLowerCase();
      if(!userEmail){
        showAlert("⛔ Compte agent connecté mais email manquant (Auth).");
        return;
      }

      const expected = (tokenDoc.agentEmail || "").toLowerCase();
      if(expected && userEmail !== expected){
        showAlert("⛔ Mauvais compte : connecte-toi avec " + expected);
        return;
      }

      chipStatus.innerHTML = `<span class="chip ok">OK</span>`;
      whoAmI.textContent = `Connectée : ${userEmail}`;

      // 3) event
      const eSnap = await getDoc(doc(db, "events", prestationId));
      if(!eSnap.exists()){
        showAlert("⛔ Prestation introuvable.");
        return;
      }
      eventDoc = eSnap.data() || {};

      homeLine.textContent = `${eventDoc.homeName || "Logement"}${eventDoc.homeCity ? " — " + eventDoc.homeCity : ""}`;
      metaLine.textContent =
        `${eventDoc.dateKey || eventDoc.date || "—"}${eventDoc.time ? " à " + eventDoc.time : ""}` +
        `${eventDoc.homeAddress ? " • " + eventDoc.homeAddress : ""}` +
        `\nAgent : ${(tokenDoc.agentName || "—")}${tokenDoc.agentEmail ? " • " + tokenDoc.agentEmail : ""}`;

      // 4) detect required missions from lines
      const needed = detectTypesFromLines(eventDoc.lines || []);
      if(!needed.length){
        subLine.textContent = "Aucune mission détectée (lines vides).";
        missionsGrid.innerHTML = `
          <div class="mcard">
            <div class="m-left">
              <div class="m-title">Aucune mission</div>
              <div class="m-sub">Ajoute des prestations (lines) côté conciergerie.</div>
            </div>
          </div>`;
        return;
      }

      // 5) ensure mission docs exist (create if missing)
      const base = {
        conciergerieUid: eventDoc.conciergerieUid || "",
        prestationId: prestationId,
        dayToken: token,
        assignedToEmail: tokenDoc.agentEmail || "",
        assignedToName: tokenDoc.agentName || "",
        dateKey: eventDoc.dateKey || eventDoc.date || "",
        time: eventDoc.time || "",
        homeName: eventDoc.homeName || "",
        homeCity: eventDoc.homeCity || "",
        homeAddress: eventDoc.homeAddress || ""
      };

      for(const type of needed){
        await ensureMission(prestationId, base, type);
      }

      // 6) read missions for display (only needed types)
      const ms = [];
      for(const type of needed){
        const mSnap = await getDoc(doc(db, "events", prestationId, "missions", type));
        if(mSnap.exists()){
          ms.push({ id: type, data: mSnap.data() || {} });
        }
      }

      subLine.textContent = "Prestation #" + prestationId + " — " + ms.length + " mission(s)";

      missionsGrid.innerHTML = "";
      for(const m of ms){
        const d = m.data || {};
        const div = document.createElement("div");
        div.className = "mcard";
        div.innerHTML = `
          <div class="m-left">
            <div class="m-title">${missionTitle(d.type || m.id)} ${d.locked ? "• verrouillée" : ""}</div>
            <div class="m-sub">
Status : ${(d.status||"").toUpperCase() || "—"}
${d.agentDone ? "✔ Terminée" : "—"}
            </div>
          </div>
          <div class="m-actions">
            ${chipFor(d.status)}
            <button class="btn" type="button" data-open="${m.id}" ${d.locked ? "disabled" : ""}>Ouvrir</button>
          </div>
        `;
        missionsGrid.appendChild(div);

        div.querySelector("button[data-open]")?.addEventListener("click", ()=>{
          const url = new URL(location.href);
          const t = url.searchParams.get("token");
          const p = url.searchParams.get("prestationId");
          const type = m.id;
          location.href = `mission.html?token=${encodeURIComponent(t)}&prestationId=${encodeURIComponent(p)}&type=${encodeURIComponent(type)}`;
        });
      }
    }

    refreshBtn.addEventListener("click", ()=> load().catch(err=>{
      console.error(err);
      showAlert("Erreur reload : " + (err?.message || "inconnue"));
    }));

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      // on garde l'URL (token) pour relogin
      const next = encodeURIComponent(location.href);
      location.href = `login-agent.html?role=agent&next=${next}`;
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!token || !prestationId){
        showAlert("⛔ Paramètres manquants (token / prestationId).");
        return;
      }

      if(!user){
        const next = encodeURIComponent(location.href);
        location.href = `login-agent.html?role=agent&next=${next}`;
        return;
      }

      currentUser = user;

      try{
        await load();
      }catch(err){
        console.error(err);
        showAlert("Erreur chargement agent : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
