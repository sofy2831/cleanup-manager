<!-- docs/agent.html (COMPLET corrigé)
     - lit dayTokens/{token} (expiresAt timestamp)
     - charge les 3 missions (CHECKIN/MENAGE/CHECKOUT) en GET
     - liens vers mission.html avec token + prestationId + missionId
     - (optionnel) claim du token (agentUid) si tu veux tracer l’agent anon
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Mes missions</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF; --violet-dark:#6238FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d; --warn:#8a5600;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF; --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 40px; }

    .top{ width:100%; max-width:820px; display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0 4px; }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 10px; border-radius:999px; background:#fff;
      border:2px solid rgba(122,92,255,0.22); color:#5b45c8; font-weight:900; font-size:12px; white-space:nowrap;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .pill.ok{ border-color: rgba(27,143,77,0.30); color:var(--ok); }
    .pill.bad{ border-color: rgba(179,38,30,0.30); color:var(--bad); }

    .alert{ display:none; width:100%; max-width:820px; margin-top:10px; padding:10px 12px; background:#fff;
      border-radius:14px; border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{ width:100%; max-width:820px; background: rgba(255,255,255,0.86); border:1px solid var(--border);
      border-radius:18px; box-shadow:var(--shadow); backdrop-filter: blur(10px);
      padding:12px; display:flex; flex-direction:column; gap:10px; margin-top:10px;
    }
    .h1{ font-size:16px; font-weight:900; }
    .sub{ font-size:12px; font-weight:800; color:#666; white-space:pre-wrap; }
    .divider{ height:1px; width:100%; background:rgba(122,92,255,0.18); margin:4px 0; }

    .list{ display:flex; flex-direction:column; gap:10px; }
    .item{
      background:#fff; border-radius:16px; border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px; display:flex; justify-content:space-between; gap:10px; align-items:center;
      cursor:pointer;
    }
    .left{ min-width:0; }
    .t{ font-size:13px; font-weight:900; color:#222; }
    .m{ font-size:12px; font-weight:800; color:#666; margin-top:2px; }

    .tag{
      font-size:11px; font-weight:900; padding:4px 10px; border-radius:999px;
      background: rgba(122,92,255,0.12); color:#5b45c8; white-space:nowrap;
    }
    .tag.ok{ background: rgba(27,143,77,0.16); color:var(--ok); }
    .tag.bad{ background: rgba(179,38,30,0.14); color:var(--bad); }
    .tag.warn{ background: rgba(255,153,0,0.18); color:var(--warn); }

    .btn{
      border:none; border-radius:999px; padding:10px 14px; font-size:13px; font-weight:900; cursor:pointer;
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark)); color:#fff;
      box-shadow:0 12px 24px rgba(0,0,0,0.10); white-space:nowrap;
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }
  </style>
</head>

<body>
  <div class="page">
    <div class="top">
      <span class="pill" id="agentPill">Agent</span>
      <span class="pill" id="tokenPill">—</span>
    </div>

    <div class="alert" id="alertBox"></div>

    <section class="card">
      <div class="h1">Mes missions</div>
      <div class="sub" id="contextLine">—</div>

      <div class="divider"></div>

      <div class="list" id="list"></div>

      <div class="divider"></div>

      <button class="btn" id="refreshBtn" type="button">Rafraîchir</button>
    </section>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const agentPill = document.getElementById("agentPill");
    const tokenPill = document.getElementById("tokenPill");
    const contextLine = document.getElementById("contextLine");
    const listEl = document.getElementById("list");
    const refreshBtn = document.getElementById("refreshBtn");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function qs(name){ return new URLSearchParams(location.search).get(name); }
    function normalizeToken(raw){ return (raw||"").toString().trim().replace(/\s+/g,""); }

    function statusLabel(s){
      const x = (s||"").toUpperCase().trim();
      if(x === "ASSIGNEE") return ["ASSIGNÉE",""];
      if(x === "EN_COURS") return ["EN COURS","warn"];
      if(x === "A_VALIDER") return ["À VALIDER","warn"];
      if(x === "A_REPRENDRE") return ["À REPRENDRE","bad"];
      if(x === "INCIDENT") return ["INCIDENT","bad"];
      if(x === "VALIDEE") return ["VALIDÉE","ok"];
      if(x === "NON_REQUISE") return ["NON REQUISE","ok"];
      return [x || "—",""];
    }
    function typeLabel(id){
      const x = (id||"").toUpperCase();
      if(x === "CHECKIN") return "Check-in";
      if(x === "MENAGE") return "Ménage";
      if(x === "CHECKOUT") return "Check-out";
      return x || "Mission";
    }

    const token = normalizeToken(qs("token") || "");
    let tokenDoc = null;
    let currentUser = null;

    refreshBtn.addEventListener("click", ()=> loadAll().catch(()=>{}));

    async function claimTokenIfNeeded(){
      // optionnel : on trace l’agent anon dans dayTokens.agentUid
      try{
        if(!tokenDoc) return;
        if(tokenDoc.agentUid && String(tokenDoc.agentUid).trim()) return;
        if(!currentUser) return;

        await updateDoc(doc(db, "dayTokens", token), {
          agentUid: currentUser.uid,
          agentClaimedAt: serverTimestamp()
        });
      }catch{
        // pas bloquant
      }
    }

    async function loadAll(){
      hideAlert();

      if(!token){
        showAlert("⛔ Token manquant.");
        tokenPill.textContent = "Token manquant";
        tokenPill.className = "pill bad";
        return;
      }

      tokenPill.textContent = "Chargement…";
      tokenPill.className = "pill";

      const tSnap = await getDoc(doc(db, "dayTokens", token));
      if(!tSnap.exists()){
        showAlert("⛔ Token invalide.");
        tokenPill.textContent = "Token invalide";
        tokenPill.className = "pill bad";
        return;
      }

      tokenDoc = tSnap.data() || {};

      if(tokenDoc.active === false){
        showAlert("⛔ Token désactivé.");
        tokenPill.textContent = "Token OFF";
        tokenPill.className = "pill bad";
        return;
      }

      // expiresAt timestamp (rules exigent timestamp)
      tokenPill.textContent = "Token OK";
      tokenPill.className = "pill ok";

      agentPill.textContent = `${tokenDoc.agentName || "Agent"}${tokenDoc.agentEmail ? " • " + tokenDoc.agentEmail : ""}`.trim();

      const prestationId = (tokenDoc.prestationId || "").toString().trim();
      if(!prestationId){
        showAlert("⛔ Token sans prestationId.");
        return;
      }

      await claimTokenIfNeeded();

      // charge 3 missions (GET) - pas de list
      const ids = ["CHECKIN","MENAGE","CHECKOUT"];
      const missions = [];

      for(const mid of ids){
        const mSnap = await getDoc(doc(db, "events", prestationId, "missions", mid));
        if(!mSnap.exists()){
          missions.push({ id: mid, missing:true, data:{} });
        }else{
          missions.push({ id: mid, missing:false, data: (mSnap.data()||{}) });
        }
      }

      // contexte (depuis la 1ère mission qui existe)
      const ctx = missions.find(x=>!x.missing)?.data || {};
      const home = `${ctx.homeName || "Logement"}${ctx.homeCity ? " — " + ctx.homeCity : ""}`.trim();
      const dt = `${ctx.dateKey || ""}${ctx.time ? " à " + ctx.time : ""}`.trim();
      contextLine.textContent = `${home}${dt ? " • " + dt : ""}${ctx.homeAddress ? " • " + ctx.homeAddress : ""}`.trim();

      // render
      listEl.innerHTML = "";
      for(const m of missions){
        const item = document.createElement("div");
        item.className = "item";

        if(m.missing){
          item.innerHTML = `
            <div class="left">
              <div class="t">${typeLabel(m.id)}</div>
              <div class="m">Mission non créée.</div>
            </div>
            <span class="tag bad">MANQUANTE</span>
          `;
          item.style.cursor = "default";
          listEl.appendChild(item);
          continue;
        }

        const st = m.data.status || "ASSIGNEE";
        const [lab, cls] = statusLabel(st);

        item.innerHTML = `
          <div class="left">
            <div class="t">${typeLabel(m.id)}</div>
            <div class="m">${(m.data.locked===true) ? "Verrouillée" : "Ouvrir / compléter"}</div>
          </div>
          <span class="tag ${cls}">${lab}</span>
        `;

        item.addEventListener("click", ()=>{
          const params = new URLSearchParams();
          params.set("token", token);
          params.set("prestationId", prestationId);
          params.set("missionId", m.id);
          location.href = "mission.html?" + params.toString();
        });

        listEl.appendChild(item);
      }
    }

    onAuthStateChanged(auth, async (user)=>{
      try{
        if(!user){
          await signInAnonymously(auth);
          return;
        }
        currentUser = user;
        await loadAll();
      }catch(err){
        console.error(err);
        showAlert("Erreur : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
