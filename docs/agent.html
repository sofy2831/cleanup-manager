<!-- docs/agent.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --bad:#b3261e;
      --ok:#1b8f4d;
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }

    body{
      margin:0;
      background: linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 14px 26px;
      padding-bottom:40px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      text-decoration:none;
      font-weight:800;
      font-size:13px;
      white-space:nowrap;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }

    .logo{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:8px;
      margin-bottom:6px;
      text-align:center;
    }

    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff;
      border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main);
      font-size:20px;font-weight:800;
      position:relative;
      flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-5px;
      font-size:12px;
      color:var(--violet-main);
    }

    h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:13px; color:#444; text-align:center; font-weight:800; }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
      font-weight:800;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .card{
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 12px;
      text-align:left;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .card-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:wrap;
    }

    .title{
      font-size:15px;
      font-weight:900;
      color:#111;
      line-height:1.1;
    }
    .meta{
      margin-top:3px;
      font-size:12px;
      font-weight:800;
      color:#666;
      white-space:pre-wrap;
    }

    .tag{
      font-size:11px;
      font-weight:900;
      padding:3px 9px;
      border-radius:999px;
      background: rgba(122,92,255,0.12);
      color:#5b45c8;
      white-space:nowrap;
    }
    .tag.ok{ background: rgba(27,143,77,0.16); color: var(--ok); }
    .tag.bad{ background: rgba(179,38,30,0.14); color: var(--bad); }

    .mission{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .mission-head{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:wrap;
    }
    .m-title{
      font-size:13px;
      font-weight:900;
      color:#222;
    }
    .m-sub{
      font-size:12px;
      font-weight:800;
      color:#666;
      margin-top:2px;
    }

    .checklist{
      display:flex;
      flex-direction:column;
      gap:6px;
      margin-top:2px;
    }
    .ck{
      display:flex;
      gap:8px;
      align-items:flex-start;
      font-size:12px;
      font-weight:800;
      color:#333;
    }
    .ck input{ margin-top:2px; }

    .row-actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      margin-top:4px;
    }

    .btn{
      border:none;
      border-radius:999px;
      padding:9px 12px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      color:#fff;
      background: linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
      white-space:nowrap;
    }
    .btn.ghost{
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{
      opacity:.6;
      cursor:not-allowed;
    }

    .hint{
      font-size:12px;
      font-weight:800;
      color:#666;
      line-height:1.35;
    }

    .toast{
      position:fixed;
      left:50%;
      bottom:18px;
      transform:translateX(-50%);
      z-index:120;
      display:none;
      max-width: 92vw;
      padding:10px 12px;
      background:#111;
      color:#fff;
      border-radius:999px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.22);
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }
    .toast.ok{ background: #0f5c33; }
    .toast.bad{ background: #7a1410; }

    @media (max-width: 520px){
      .page{ padding-left:12px; padding-right:12px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="index.html">← Accueil</a>
      <button class="pill" id="logoutBtn" type="button" style="display:none;">Déconnexion</button>
    </div>

    <div class="logo">
      <div class="logo-icon">✓</div>
      <div>
        <h1>Agent</h1>
        <div class="subtitle" id="subTitle">Missions</div>
      </div>
    </div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>
      <div class="card">
        <div class="hint" id="modeHint">Chargement…</div>
      </div>

      <div id="cards"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import {
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      doc, getDoc, updateDoc,
      serverTimestamp,
      collection, getDocs, query, where
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const cards = document.getElementById("cards");
    const toast = document.getElementById("toast");
    const logoutBtn = document.getElementById("logoutBtn");
    const modeHint = document.getElementById("modeHint");
    const subTitle = document.getElementById("subTitle");

    function esc(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    let toastTimer = null;
    function showToast(msg, kind="ok"){
      toast.textContent = msg;
      toast.classList.remove("ok","bad");
      toast.classList.add(kind === "bad" ? "bad" : "ok");
      toast.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(()=>{ toast.style.display="none"; }, 1700);
    }

    function typeLabel(t){
      const x = (t||"").toUpperCase();
      if(x === "CHECKIN") return "Check-in";
      if(x === "MENAGE") return "Ménage";
      if(x === "CHECKOUT") return "Check-out";
      return x || "Mission";
    }

    function statusTag(status){
      const s = (status||"").toUpperCase();
      if(s === "VALIDEE") return `<span class="tag ok">VALIDÉE</span>`;
      if(s === "A_VALIDER") return `<span class="tag">À valider</span>`;
      if(s === "ASSIGNEE") return `<span class="tag">Assignée</span>`;
      if(s === "EN_COURS") return `<span class="tag">En cours</span>`;
      return `<span class="tag">${esc(s || "—")}</span>`;
    }

    function todayKey(){
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth()+1).padStart(2,"0");
      const da = String(d.getDate()).padStart(2,"0");
      return `${y}-${m}-${da}`;
    }

    // -----------------------------
    // MODE 1 : Token -> 1 prestation
    // URL: agent.html?token=XXXX
    // dayTokens/{token} contient prestationId + agent infos
    // -----------------------------
    async function loadTokenMode(token){
      modeHint.textContent = "Mode lien agent (token).";
      subTitle.textContent = "Missions du jour";
      logoutBtn.style.display = "none";

      if(!token){
        showAlert("Token manquant dans l’URL.", false);
        return;
      }

      // 1) lire dayTokens/{token}
      const tRef = doc(db, "dayTokens", token);
      const tSnap = await getDoc(tRef);
      if(!tSnap.exists()){
        showAlert("Lien invalide ou expiré (token introuvable).", false);
        return;
      }
      const t = tSnap.data() || {};
      const prestationId = t.prestationId || t.eventId || "";

      if(!prestationId){
        showAlert("Token OK mais prestationId manquant dans dayTokens.", false);
        return;
      }

      // 2) lire event
      const eRef = doc(db, "events", prestationId);
      const eSnap = await getDoc(eRef);
      if(!eSnap.exists()){
        showAlert("Prestation introuvable.", false);
        return;
      }
      const ev = eSnap.data() || {};

      // 3) lire missions (direct, pas de collectionGroup)
      const missionsCol = collection(db, "events", prestationId, "missions");
      const msSnap = await getDocs(missionsCol);
      const missions = msSnap.docs
        .map(d => ({ id: d.id, ref: d.ref, ...((d.data()||{})) }))
        .filter(m => (m.dayToken || "") === token) // sécurité + évite mélange si un jour tu changes
        .sort((a,b)=> (a.type||a.id||"").localeCompare(b.type||b.id||""));

      renderPrestationCard({
        prestationId,
        conciergerieName: ev.conciergerieName || "",
        homeName: ev.homeName || "",
        homeCity: ev.homeCity || "",
        homeAddress: ev.homeAddress || "",
        dateKey: ev.dateKey || ev.date || "",
        time: ev.time || "",
        assignedToName: ev.assignedToName || t.agentName || "",
        assignedToEmail: ev.assignedToEmail || t.agentEmail || "",
        missions
      }, { tokenMode: true });
    }

    // -----------------------------
    // MODE 2 : Auth agent -> liste des prestations du jour via email
    // (simple, sans UID salarié)
    // -----------------------------
    async function loadAuthMode(user){
      logoutBtn.style.display = "inline-flex";
      modeHint.textContent = "Mode agent connecté (email).";
      subTitle.textContent = "Mes prestations du jour";

      const email = (user?.email || "").toLowerCase().trim();
      if(!email){
        showAlert("Compte agent connecté mais email manquant.", false);
        return;
      }

      // events du jour assignés à cet email
      // (tu peux enlever le filtre dateKey si tu veux historique)
      const q = query(
        collection(db, "events"),
        where("assignedToEmail", "==", email),
        where("dateKey", "==", todayKey())
      );
      const snap = await getDocs(q);

      if(snap.empty){
        cards.innerHTML = `
          <div class="card">
            <div class="hint">Aucune prestation assignée aujourd’hui.</div>
          </div>`;
        return;
      }

      // Pour chaque event, lire ses missions
      for(const d of snap.docs){
        const ev = d.data() || {};
        const prestationId = d.id;

        const msCol = collection(db, "events", prestationId, "missions");
        const msSnap = await getDocs(msCol);
        const missions = msSnap.docs
          .map(x => ({ id: x.id, ref: x.ref, ...((x.data()||{})) }))
          .sort((a,b)=> (a.type||a.id||"").localeCompare(b.type||b.id||""));

        renderPrestationCard({
          prestationId,
          conciergerieName: ev.conciergerieName || "",
          homeName: ev.homeName || "",
          homeCity: ev.homeCity || "",
          homeAddress: ev.homeAddress || "",
          dateKey: ev.dateKey || ev.date || "",
          time: ev.time || "",
          assignedToName: ev.assignedToName || "",
          assignedToEmail: ev.assignedToEmail || "",
          missions
        }, { tokenMode: false });
      }
    }

    // -----------------------------
    // RENDER
    // -----------------------------
    function renderPrestationCard(p, { tokenMode }){
      const container = document.createElement("div");
      container.className = "card";

      const header = `
        <div class="card-head">
          <div>
            <div class="title">${esc(p.homeName || "Logement")}${p.homeCity ? " — " + esc(p.homeCity) : ""}</div>
            <div class="meta">${
              [
                (p.dateKey ? `${p.dateKey}${p.time ? " • " + p.time : ""}` : null),
                (p.homeAddress ? p.homeAddress : null),
                (p.conciergerieName ? `Conciergerie : ${p.conciergerieName}` : null),
                (p.assignedToName || p.assignedToEmail ? `Agent : ${p.assignedToName || "—"}${p.assignedToEmail ? " • " + p.assignedToEmail : ""}` : null)
              ].filter(Boolean).join("\n")
            }</div>
          </div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
            <span class="tag">Prestation</span>
            ${tokenMode ? `<span class="tag">Lien</span>` : `<span class="tag">Auth</span>`}
          </div>
        </div>
      `;
      container.innerHTML = header;

      // Si certaines missions n'existent pas, on n'affiche pas (ton cas: pas tous les logements ont check-in/out)
      const missions = (p.missions || []).filter(m => !!(m.type || m.id));

      if(!missions.length){
        const empty = document.createElement("div");
        empty.className = "mission";
        empty.innerHTML = `<div class="hint">Aucune mission sur cette prestation.</div>`;
        container.appendChild(empty);
        cards.appendChild(container);
        return;
      }

      for(const m of missions){
        const status = (m.status || "").toUpperCase();
        const locked = m.locked === true;

        const missionDiv = document.createElement("div");
        missionDiv.className = "mission";

        const title = typeLabel(m.type || m.id);
        const sub = [
          (m.time ? `Heure : ${m.time}` : null),
          (m.status ? `Statut : ${status}` : null),
          (locked ? `Verrouillée` : null)
        ].filter(Boolean).join(" • ");

        missionDiv.innerHTML = `
          <div class="mission-head">
            <div>
              <div class="m-title">${esc(title)}</div>
              <div class="m-sub">${esc(sub || "—")}</div>
            </div>
            <div>${statusTag(status)}</div>
          </div>
          <div class="checklist" data-ck></div>
          <div class="row-actions">
            <button class="btn ghost" type="button" data-save>Enregistrer</button>
            <button class="btn" type="button" data-done>Terminer</button>
          </div>
        `;

        // Checklist (map)
        const ckWrap = missionDiv.querySelector("[data-ck]");
        const ck = (m.checklist && typeof m.checklist === "object") ? m.checklist : {};
        const keys = Object.keys(ck);

        if(keys.length === 0){
          ckWrap.innerHTML = `<div class="hint">Checklist vide. (Ça arrive.)</div>`;
        }else{
          ckWrap.innerHTML = keys.map(k=>{
            const v = !!ck[k];
            const id = `ck_${p.prestationId}_${m.id}_${k}`.replaceAll(/[^a-zA-Z0-9_]/g,"_");
            return `
              <label class="ck" for="${esc(id)}">
                <input id="${esc(id)}" type="checkbox" data-key="${esc(k)}" ${v ? "checked" : ""} />
                <span>${esc(k)}</span>
              </label>
            `;
          }).join("");
        }

        // Disable si locked/validée
        const saveBtn = missionDiv.querySelector("[data-save]");
        const doneBtn = missionDiv.querySelector("[data-done]");
        if(locked || status === "VALIDEE"){
          saveBtn.disabled = true;
          doneBtn.disabled = true;
          doneBtn.textContent = "Verrouillé";
        }else if(status === "A_VALIDER"){
          // déjà terminé côté agent
          doneBtn.disabled = true;
          doneBtn.textContent = "Envoyé";
        }

        // Helpers
        function readChecklistFromUI(){
          const obj = {};
          missionDiv.querySelectorAll('input[type="checkbox"][data-key]').forEach(inp=>{
            obj[inp.getAttribute("data-key")] = inp.checked;
          });
          return obj;
        }

        async function saveOnly(){
          hideAlert();
          saveBtn.disabled = true;
          const old = saveBtn.textContent;
          saveBtn.textContent = "…";
          try{
            await updateDoc(m.ref, {
              checklist: readChecklistFromUI(),
              updatedAt: serverTimestamp()
            });
            showToast("✅ Enregistré");
          }catch(err){
            console.error(err);
            showToast("⛔ Erreur", "bad");
            showAlert("Erreur enregistrement : " + (err?.message || "inconnue"));
          }finally{
            saveBtn.disabled = false;
            saveBtn.textContent = old;
          }
        }

        async function finishMission(){
          hideAlert();

          // règle simple : checklist complète -> ok, sinon on laisse quand même finir (tu peux durcir plus tard)
          doneBtn.disabled = true;
          const old = doneBtn.textContent;
          doneBtn.textContent = "…";

          try{
            await updateDoc(m.ref, {
              checklist: readChecklistFromUI(),
              agentDone: true,
              agentDoneAt: serverTimestamp(),
              status: "A_VALIDER",
              updatedAt: serverTimestamp()
            });
            showToast("✅ Envoyé à valider");
            // UI lock
            saveBtn.disabled = true;
            doneBtn.disabled = true;
            doneBtn.textContent = "Envoyé";
          }catch(err){
            console.error(err);
            showToast("⛔ Erreur", "bad");
            showAlert("Erreur validation mission : " + (err?.message || "inconnue"));
            doneBtn.disabled = false;
            doneBtn.textContent = old;
          }
        }

        saveBtn.addEventListener("click", saveOnly);
        doneBtn.addEventListener("click", finishMission);

        container.appendChild(missionDiv);
      }

      cards.appendChild(container);
    }

    // -----------------------------
    // BOOT
    // -----------------------------
    function getParam(name){
      const u = new URL(location.href);
      return (u.searchParams.get(name) || "").trim();
    }

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      location.href = "index.html";
    });

    async function boot(){
      hideAlert();
      cards.innerHTML = "";

      const token = getParam("token") || getParam("dayToken");

      // Si token présent => on charge token mode direct (même si auth existe)
      if(token){
        await loadTokenMode(token);
        return;
      }

      // Sinon, on attend auth
      modeHint.textContent = "Connexion requise (agent).";
      cards.innerHTML = `
        <div class="card">
          <div class="hint">
            Pas de token dans l’URL.<br>
            Connecte-toi en tant qu’agent (lien email) pour voir tes prestations.
          </div>
          <div style="display:flex; justify-content:flex-end;">
            <a class="pill" href="login.html?role=agent">Se connecter</a>
          </div>
        </div>
      `;

      onAuthStateChanged(auth, async (user)=>{
        if(!user) return;
        cards.innerHTML = "";
        await loadAuthMode(user);
      });
    }

    boot().catch(err=>{
      console.error(err);
      showAlert("Erreur agent : " + (err?.message || "inconnue"));
    });
  </script>
</body>
</html>
