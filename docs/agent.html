<!-- docs/agent.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:36px; }
    .topbar{
      width:100%; max-width:980px; display:flex; justify-content:space-between; align-items:center;
      gap:10px; position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .wrap{ width:100%; max-width:980px; margin-top:6px; display:flex; flex-direction:column; gap:10px; }
    h1{ margin:0; font-size:20px; font-weight:900; letter-spacing:-0.2px; }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; white-space:pre-wrap; }
    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:12px;
    }
    .row{ display:flex; gap:10px; flex-wrap:wrap; align-items:flex-start; justify-content:space-between; }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }

    .chips{ display:flex; gap:8px; flex-wrap:wrap; }
    .chip{
      display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:999px;
      background:rgba(122,92,255,0.12); color:#5b45c8; font-size:11px; font-weight:900;
    }
    .chip.ok{ background:rgba(27,143,77,0.16); color:var(--ok); }
    .chip.bad{ background:rgba(179,38,30,0.14); color:var(--bad); }

    /* ✅ En-tête "intervention-like" */
    .prestaHead{
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:16px;
      padding:10px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      display:flex;
      flex-direction:column;
      gap:8px;
      min-width:260px;
      flex:1;
    }
    .prestaTitle{ font-size:14px; font-weight:900; color:#222; line-height:1.2; }
    .kv{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .kv .k{ font-weight:900; font-size:12px; color:#333; }
    .kv .v{ font-weight:800; font-size:12px; color:#444; text-align:right; white-space:pre-wrap; }
    .noteLine{
      margin-top:2px;
      font-size:12px;
      font-weight:900;
      color:#222;
      background:rgba(122,92,255,0.06);
      border:1px solid rgba(122,92,255,0.14);
      border-radius:14px;
      padding:10px;
      display:none;
      white-space:pre-wrap;
      line-height:1.25;
    }
    .agentMini{ margin-top:6px; font-size:11px; font-weight:900; color:var(--muted); }

    .missions{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .mcard{
      background:#fff; border-radius:16px; border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06); padding:12px;
      display:flex; flex-direction:column; gap:10px;
    }
    .mhead{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .mtitle{ font-size:14px; font-weight:900; color:#222; }
    .msub{ font-size:12px; font-weight:800; color:#666; white-space:pre-wrap; }

    .checklist{
      display:flex; flex-direction:column; gap:8px;
      border-top:1px dashed rgba(122,92,255,0.25); padding-top:10px;
    }
    .chk{
      display:flex; gap:10px; align-items:flex-start;
      background:rgba(122,92,255,0.06); border:1px solid rgba(122,92,255,0.12);
      border-radius:14px; padding:10px;
    }
    .chk input{ margin-top:3px; width:18px; height:18px; }
    .chk label{ font-size:12px; font-weight:900; color:#222; cursor:pointer; }
    .chk .hint{ font-size:11px; font-weight:800; color:#666; margin-top:3px; }

    textarea{
      width:100%; padding:10px; border-radius:12px; border:1px solid #D3C7FF; background:#fff;
      font-size:13px; outline:none; resize:vertical;
    }
    textarea:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .btn{
      border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:900; cursor:pointer;
      color:#fff; background:linear-gradient(90deg,var(--violet),var(--violet2));
      box-shadow:0 10px 22px rgba(0,0,0,0.10); white-space:nowrap;
      text-decoration:none;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .btn.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .done{
      border-left:5px solid rgba(27,143,77,0.55);
      background:linear-gradient(180deg,#ffffff 0%, rgba(27,143,77,0.06) 100%);
    }
    .locked{
      border-left:5px solid rgba(122,92,255,0.55);
      background:linear-gradient(180deg,#ffffff 0%, rgba(122,92,255,0.06) 100%);
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <span class="pill" id="whoAmI">Agent (token)</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <a class="pill" id="photosBtn" href="#" role="button">📷 Photos</a>
        <button class="pill" id="refreshBtn" type="button">Rafraîchir</button>
      </div>
    </div>

    <div class="wrap">
      <div>
        <h1>Mes missions</h1>
        <div class="sub" id="subLine">Chargement…</div>
        <div class="alert" id="alertBox"></div>
      </div>

      <!-- ✅ Entête logement façon intervention -->
      <section class="card">
        <div class="row">
          <div class="prestaHead">
            <div class="mini">Prestation</div>
            <div class="prestaTitle" id="homeLine">—</div>

            <div class="kv">
              <div class="k">Arrivée :</div>
              <div class="v" id="arrLine">—</div>
            </div>

            <div class="kv">
              <div class="k">Départ :</div>
              <div class="v" id="depLine">—</div>
            </div>

            <div class="kv">
              <div class="k">Adresse :</div>
              <div class="v" id="addrLine">—</div>
            </div>

            <!-- ✅ pas de propriétaire ici -->
            <div class="noteLine" id="noteLine"></div>
            <div class="agentMini" id="agentLine">—</div>
          </div>

          <div class="chips">
            <span class="chip" id="chipToken">token: —</span>
            <span class="chip" id="chipExpiry">expire: —</span>
            <span class="chip" id="chipStatus">—</span>
          </div>
        </div>
      </section>

      <section class="card">
        <div class="mini">Missions</div>
        <div class="missions" id="missionsWrap"></div>
      </section>

      <div class="mini">
        Token-only (24h). Si le lien fuite, quelqu’un peut agir. Garde-le privé.
      </div>
    </div>
  </div>

  <script type="module">
    import { db } from "./firebase-init.js";
    import { doc, getDoc, updateDoc, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");

    const homeLine = document.getElementById("homeLine");
    const arrLine  = document.getElementById("arrLine");
    const depLine  = document.getElementById("depLine");
    const addrLine = document.getElementById("addrLine");
    const noteLine = document.getElementById("noteLine");
    const agentLine= document.getElementById("agentLine");

    const missionsWrap = document.getElementById("missionsWrap");

    const chipToken = document.getElementById("chipToken");
    const chipExpiry = document.getElementById("chipExpiry");
    const chipStatus = document.getElementById("chipStatus");

    const refreshBtn = document.getElementById("refreshBtn");
    const whoAmI = document.getElementById("whoAmI");
    const photosBtn = document.getElementById("photosBtn");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }

    function esc(str){
      return String(str ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function missionTitle(type){
      const t = (type||"").toUpperCase();
      if(t==="CHECKIN") return "Check-in";
      if(t==="MENAGE") return "Ménage";
      if(t==="CHECKOUT") return "Check-out";
      if(t==="LINGE") return "Linge";
      if(t==="MAINTENANCE") return "Maintenance";
      if(t==="KITS") return "Kits & consommables";
      return t || "Mission";
    }

    function chipFor(st){
      const s = (st||"").toUpperCase();
      if(s==="VALIDEE") return `<span class="chip ok">VALIDÉE</span>`;
      if(s==="A_VALIDER") return `<span class="chip">À VALIDER</span>`;
      if(s==="ASSIGNEE") return `<span class="chip">ASSIGNÉE</span>`;
      if(s==="EN_COURS") return `<span class="chip">EN COURS</span>`;
      if(s==="TERMINEE") return `<span class="chip">TERMINÉE</span>`;
      return `<span class="chip">${esc(s || "—")}</span>`;
    }

    function prettyExpiryFromMs(ms){
      const t = Number(ms);
      if(!Number.isFinite(t)) return "—";
      const d = new Date(t);
      const pad2 = (n)=> String(n).padStart(2,"0");
      return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function tokenValid(tokenDoc){
      if(!tokenDoc?.active) return false;
      const expMs = Number(tokenDoc?.expiresAtMs);
      if(Number.isFinite(expMs)) return Date.now() < expMs;
      const ts = tokenDoc?.expiresAt;
      const ms = ts?.toMillis ? ts.toMillis() : NaN;
      if(Number.isFinite(ms)) return Date.now() < ms;
      return false;
    }

    // ✅ Checklist COMPACTE (5 max) par mission
    function compactChecklistTemplate(type){
      const t = (type||"").toUpperCase();

      if(t==="MENAGE"){
        return [
          { key:"sols",      label:"Sols aspirés + lavés" },
          { key:"sdb",       label:"Salle de bain nettoyée (douche/vasque/WC)" },
          { key:"cuisine",   label:"Cuisine : plans, évier, électroménager" },
          { key:"poubelles", label:"Poubelles vidées + sac neuf" },
          { key:"lit",       label:"Lits faits / mise en place" }
        ];
      }

      if(t==="CHECKIN"){
        return [
          { key:"cles",   label:"Remise des clés / code communiqué" },
          { key:"etat",   label:"État des lieux rapide (RAS / anomalies)" },
          { key:"linge",  label:"Linge OK / lit prêt" },
          { key:"equip",  label:"Équipements ok (eau/élec/chauffage si besoin)" },
          { key:"infos",  label:"Infos pratiques (wifi / règles / poubelles)" }
        ];
      }

      if(t==="CHECKOUT"){
        return [
          { key:"cles",      label:"Récupération clés / fermeture ok" },
          { key:"etat",      label:"État du logement vérifié (anomalies notées)" },
          { key:"linge",     label:"Linge récupéré / sacs déposés" },
          { key:"poubelles", label:"Poubelles sorties (si besoin)" },
          { key:"photos",    label:"Photos si anomalie" }
        ];
      }

      if(t==="KITS"){
        return [
          { key:"check",  label:"Vérifier stock kits (base)" },
          { key:"refill", label:"Réassort si nécessaire" },
          { key:"conso",  label:"Consommables (papier, savon, etc.)" },
          { key:"signal", label:"Signaler rupture / besoin achat" },
          { key:"range",  label:"Ranger / placer kits" }
        ];
      }

      if(t==="LINGE"){
        return [
          { key:"collecte", label:"Collecte linge sale" },
          { key:"propre",   label:"Dépôt linge propre" },
          { key:"complet",  label:"Vérifier set complet (draps/serviettes)" },
          { key:"sacs",     label:"Sacs / stockage ok" },
          { key:"signal",   label:"Signaler manque / tâche / déchirure" }
        ];
      }

      if(t==="MAINTENANCE"){
        return [
          { key:"diag",   label:"Diagnostic rapide (source du problème)" },
          { key:"action", label:"Action effectuée / tentative de résolution" },
          { key:"test",   label:"Test fonctionnement" },
          { key:"secu",   label:"Sécurisation si besoin (couper eau/élec)" },
          { key:"report", label:"Compte-rendu clair (suite / urgence)" }
        ];
      }

      return [
        { key:"ok",     label:"Mission réalisée" },
        { key:"signal", label:"Anomalies signalées si besoin" },
        { key:"photos", label:"Photos si besoin" }
      ];
    }

    // ✅ Checklist robuste : lecture depuis Firestore
    function extractChecklistRaw(d){
      return (
        d?.checklist ??
        d?.checkList ??
        d?.checklistItems ??
        d?.items ??
        d?.tasks ??
        d?.taskList ??
        null
      );
    }

    // Convertit en tableau [{key,label,done}]
    function checklistToArray(any){
      const cl = any;
      if(!cl) return [];

      if(Array.isArray(cl) && cl.every(x=> typeof x === "string")){
        return cl.map((label, i)=>({ key: String(i), label, done:false }));
      }

      if(Array.isArray(cl)){
        return cl.map((x,i)=>{
          if(typeof x === "string") return { key:String(i), label:x, done:false };
          const label = x?.label ?? x?.text ?? x?.name ?? ("Item " + (i+1));
          const done = !!(x?.done ?? x?.checked ?? x?.ok);
          const key = String(x?.key ?? x?.id ?? i);
          return { key, label:String(label), done };
        });
      }

      if(typeof cl === "object"){
        const out = [];
        for(const [k,v] of Object.entries(cl)){
          if(typeof v === "boolean"){
            out.push({ key:k, label:k, done:v });
          }else{
            out.push({ key:k, label:String(v?.label ?? v?.text ?? k), done: !!(v?.done ?? v?.checked ?? v?.ok) });
          }
        }
        return out;
      }

      return [];
    }

    function arrayToChecklistObject(items){
      const obj = {};
      for(const it of items){
        obj[it.key] = { label: it.label, done: !!it.done };
      }
      return obj;
    }

    const token = qs("token");
    const prestationId = qs("prestationId");

    let tokenDoc = null;
    let eventDoc = null;

    function setPrestaHeader(e){
      // Nom logement
      homeLine.textContent = e?.homeName || "Logement";

      // Arrivée
      const aDate = e?.arrivalDateKey || e?.dateKey || e?.date || "";
      const aTime = e?.arrivalTime || e?.time || "";
      arrLine.textContent = (aDate ? aDate : "—") + (aTime ? " • " + aTime : "");

      // Départ
      const dDate = e?.departureDateKey || "";
      const dTime = e?.departureTime || "";
      depLine.textContent = (dDate ? dDate : "—") + (dTime ? " • " + dTime : "");

      // Adresse + CP (pas de propriétaire)
      const addr = (e?.homeAddress || e?.address || "").trim();
      const zip  = (e?.homeZip || e?.zip || "").trim();
      addrLine.textContent = [addr, zip].filter(Boolean).join(" ").trim() || "—";

      // Note / meta (ex: "LIT BEBE")
      const note = (e?.meta || "").trim();
      if(note){
        noteLine.style.display = "block";
        noteLine.textContent = note;
      }else{
        noteLine.style.display = "none";
        noteLine.textContent = "";
      }
    }

    async function load(){
      hideAlert();
      missionsWrap.innerHTML = "";
      subLine.textContent = "Chargement…";

      if(!token || !prestationId){
        showAlert("⛔ Paramètres manquants (token / prestationId).");
        subLine.textContent = "";
        return;
      }

      photosBtn.href = `preuves.html?token=${encodeURIComponent(token)}&prestationId=${encodeURIComponent(prestationId)}`;

      whoAmI.textContent = "Agent (token)";
      chipToken.textContent = "token: " + token;

      const tSnap = await getDoc(doc(db, "dayTokens", token));
      if(!tSnap.exists()){
        showAlert("⛔ Token invalide.");
        chipStatus.innerHTML = `<span class="chip bad">INVALIDE</span>`;
        subLine.textContent = "";
        return;
      }
      tokenDoc = tSnap.data() || {};

      if(String(tokenDoc.prestationId) !== String(prestationId)){
        showAlert("⛔ Token ≠ prestation.");
        chipStatus.innerHTML = `<span class="chip bad">SCOPE</span>`;
        subLine.textContent = "";
        return;
      }

      chipExpiry.textContent = "expire: " + (
        Number.isFinite(Number(tokenDoc.expiresAtMs))
          ? prettyExpiryFromMs(tokenDoc.expiresAtMs)
          : (tokenDoc.expiresAt?.toMillis ? prettyExpiryFromMs(tokenDoc.expiresAt.toMillis()) : "—")
      );

      if(!tokenValid(tokenDoc)){
        chipStatus.innerHTML = `<span class="chip bad">EXPIRÉ</span>`;
        showAlert("⛔ Token expiré. Demande un nouveau lien.");
        subLine.textContent = "";
        return;
      }
      chipStatus.innerHTML = `<span class="chip ok">OK</span>`;

      // event doc (best effort)
      try{
        const eSnap = await getDoc(doc(db, "events", prestationId));
        if(eSnap.exists()) eventDoc = eSnap.data() || {};
      }catch{
        eventDoc = null;
      }

      setPrestaHeader(eventDoc || {});
      agentLine.textContent = `Agent : ${(tokenDoc.agentName || "—")}${tokenDoc.agentEmail ? " • " + tokenDoc.agentEmail : ""}`;

      // ✅ missions du token seulement
      const TYPES = Array.isArray(tokenDoc.missionTypes) && tokenDoc.missionTypes.length
        ? tokenDoc.missionTypes.map(x => String(x||"").toUpperCase()).filter(Boolean)
        : ["MENAGE"];

      const missions = [];
      for(const t of TYPES){
        const mSnap = await getDoc(doc(db, "events", prestationId, "missions", t));
        if(mSnap.exists()) missions.push({ id:t, data: mSnap.data() || {} });
      }

      subLine.textContent = "";

      if(!missions.length){
        missionsWrap.innerHTML = `
          <div class="mcard">
            <div class="mtitle">Aucune mission</div>
            <div class="msub">Les missions ne sont pas disponibles (docs absents ou accès bloqué).</div>
          </div>`;
        return;
      }

      missionsWrap.innerHTML = "";
      for(const m of missions){
        const d = m.data || {};
        const locked = !!d.locked;
        const done = !!d.agentDone;
        const status = (d.status || "").toUpperCase() || "—";

        // ✅ affichage compact (template) + état depuis Firestore
        const tpl = compactChecklistTemplate(m.id);
        const savedItems = checklistToArray(extractChecklistRaw(d));
        const doneByKey = {};
        for(const it of savedItems){
          doneByKey[String(it.key)] = !!it.done;
        }
        const items = tpl.map(x => ({
          key: x.key,
          label: x.label,
          done: !!doneByKey[String(x.key)]
        }));

        const checklistHtml = items.length
          ? items.map((it, idx)=>{
              const id = `chk_${m.id}_${idx}`;
              return `
                <div class="chk">
                  <input type="checkbox" id="${id}" data-k="${esc(it.key)}" ${it.done ? "checked" : ""} ${locked ? "disabled" : ""} />
                  <div>
                    <label for="${id}">${esc(it.label)}</label>
                    <div class="hint">${it.done ? "fait" : "à faire"}</div>
                  </div>
                </div>
              `;
            }).join("")
          : `<div class="mini">Checklist vide.</div>`;

        const wrap = document.createElement("div");
        wrap.className = "mcard" + (done ? " done" : "") + (locked ? " locked" : "");
        wrap.innerHTML = `
          <div class="mhead">
            <div>
              <div class="mtitle">${missionTitle(d.missionId || d.type || m.id)} ${locked ? "• verrouillée" : ""}</div>
              <div class="msub">Status : ${esc(status)} ${done ? "\n✔ Terminée" : ""}</div>
            </div>
            <div>${chipFor(status)}</div>
          </div>

          <div class="checklist" data-m="${esc(m.id)}">
            ${checklistHtml}
          </div>

          <div>
            <div class="mini" style="margin-bottom:6px;">Commentaire (optionnel)</div>
            <textarea rows="2" placeholder="Ex. problème, remarque..." data-comment="${esc(m.id)}" ${locked ? "disabled" : ""}>${esc(d.agentComment || "")}</textarea>
          </div>

          <div class="actions">
            <button class="btn ghost" type="button" data-save="${esc(m.id)}" ${locked ? "disabled" : ""}>Enregistrer</button>
            <button class="btn" type="button" data-done="${esc(m.id)}" ${locked ? "disabled" : ""}>Terminer</button>
          </div>
        `;
        missionsWrap.appendChild(wrap);

        async function saveMission(markDone=false){
          hideAlert();
          const type = m.id;

          const box = wrap.querySelector(`.checklist[data-m="${type}"]`);
          const checks = Array.from(box.querySelectorAll('input[type="checkbox"][data-k]'));
          const newItems = checks.map(ch => {
            const key = ch.getAttribute("data-k");
            const labelEl = box.querySelector(`label[for="${ch.id}"]`);
            const label = labelEl ? labelEl.textContent.trim() : key;
            return { key, label, done: !!ch.checked };
          });

          const commentEl = wrap.querySelector(`textarea[data-comment="${type}"]`);
          const comment = (commentEl?.value || "").trim();

          const payload = {
            checklist: arrayToChecklistObject(newItems),
            agentComment: comment,
            status: markDone ? "A_VALIDER" : (d.status || "EN_COURS"),
            agentDone: markDone ? true : (!!d.agentDone),
            locked: markDone ? true : (!!d.locked),
            updatedAt: Timestamp.now()
          };

          try{
            await updateDoc(doc(db, "events", prestationId, "missions", type), payload);

            // best effort : remonter statut au parent
            try{
              await updateDoc(doc(db, "events", prestationId), {
                opStatus: markDone ? "A_VALIDER" : "EN_COURS",
                updatedAt: Timestamp.now()
              });
            }catch(e){}

            showAlert(markDone ? "✅ Mission terminée (À VALIDER) + verrouillée." : "✅ Enregistré.", true);
            await load();
          }catch(err){
            console.error(err);
            showAlert("Erreur enregistrement : " + (err?.code || err?.message || "inconnue"));
          }
        }

        wrap.querySelector(`button[data-save="${m.id}"]`)?.addEventListener("click", ()=> saveMission(false));
        wrap.querySelector(`button[data-done="${m.id}"]`)?.addEventListener("click", ()=> saveMission(true));
      }
    }

    refreshBtn.addEventListener("click", ()=> load().catch(err=>{
      console.error(err);
      showAlert("Erreur reload : " + (err?.code || err?.message || "inconnue"));
    }));

    load().catch(err=>{
      console.error(err);
      showAlert("Erreur chargement agent : " + (err?.code || err?.message || "inconnue"));
    });
  </script>
</body>
</html>
