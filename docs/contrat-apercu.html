<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contrat — Aperçu</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}:root{--violet:#7A5CFF;--violet2:#6238FF;--bg1:#F8F4FF;--bg2:#EDE6FF;--border:rgba(122,92,255,.18);--shadow:0 14px 36px rgba(0,0,0,.08);--muted:#666;--bad:#b3261e}body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#111}.page{min-height:100vh;padding:14px 12px;display:flex;justify-content:center}.wrap{width:100%;max-width:1000px}.topbar{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border-radius:999px;background:#fff;border:2px solid var(--violet);color:var(--violet);text-decoration:none;font-weight:1000;font-size:12px;box-shadow:0 3px 10px rgba(0,0,0,.06);cursor:pointer}.primary{background:linear-gradient(90deg,var(--violet),var(--violet2));border-color:transparent;color:#fff}.sheet{background:#fff;border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:26px}.header{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid rgba(0,0,0,.08);padding-bottom:16px;margin-bottom:18px}.logo{width:58px;height:58px;border-radius:14px;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--violet);font-weight:1000;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover;display:none}.h1{font-size:24px;font-weight:1000;margin:0}.mut{color:var(--muted);font-weight:850}.pill{display:inline-flex;padding:5px 10px;border-radius:999px;background:#F8F4FF;border:1px solid var(--border);font-weight:1000;color:#4b2cff;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.box{border:1px solid var(--border);border-radius:16px;padding:14px;background:#fff}.box h3{margin:0 0 8px;font-size:13px;font-weight:1000}.line{font-size:12.5px;font-weight:850;line-height:1.45}.section{margin-top:16px}.section h2{font-size:15px;margin:0 0 8px;font-weight:1000}.text{white-space:pre-wrap;font-size:13px;font-weight:800;line-height:1.55;background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:14px;padding:12px}.sign{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:28px}.signBox{border:1px dashed rgba(0,0,0,.25);border-radius:14px;padding:14px;min-height:120px}.alert{display:none;margin-bottom:10px;padding:10px 12px;background:#fff;border-radius:14px;border-left:5px solid var(--bad);box-shadow:0 3px 10px rgba(0,0,0,.06);font-size:12px;font-weight:850}@media(max-width:720px){.header,.grid,.sign{grid-template-columns:1fr;display:grid}.topbar{flex-direction:column}.btn{width:100%}.sheet{padding:16px}}@media print{body{background:#fff}.topbar,.alert{display:none!important}.page{padding:0}.wrap{max-width:none}.sheet{box-shadow:none;border:none;border-radius:0;padding:0}}</style></head><body><div class="page"><div class="wrap"><div class="topbar"><a class="btn" href="contrats-liste.html">← Contrats</a><button class="btn primary" onclick="window.print()">Imprimer / PDF</button></div><div class="alert" id="alertBox"></div><div class="sheet"><div class="header"><div><div class="h1" id="docTitle">Contrat de prestation</div><div class="mut" id="docSub">—</div></div><div style="text-align:right"><div class="logo"><img id="logoImg"><span id="logoFallback">C</span></div><div style="margin-top:8px"><span class="pill" id="statusPill">—</span></div></div></div><div class="grid"><div class="box"><h3>Conciergerie</h3><div class="line" id="businessBox">—</div></div><div class="box"><h3>Client / propriétaire</h3><div class="line" id="clientBox">—</div></div></div><div class="box"><h3>Logement concerné</h3><div class="line" id="homeBox">—</div></div><div class="section"><h2>Objet du contrat</h2><div class="text" id="contractObject">—</div></div><div class="section"><h2>Conditions particulières</h2><div class="text" id="specialTerms">—</div></div><div class="section"><h2>Tarification</h2><div class="text" id="pricingTerms">—</div></div><div class="section"><h2>Résiliation</h2><div class="text" id="terminationTerms">—</div></div><div class="sign"><div class="signBox"><strong>La conciergerie</strong><br><br>Date et signature :</div><div class="signBox"><strong>Le propriétaire</strong><br><br>Date et signature :</div></div></div></div></div><script type="module">import{auth,db}from'./firebase-init.js';import{onAuthStateChanged}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';import{doc,getDoc}from'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';const $=id=>document.getElementById(id),docId=new URLSearchParams(location.search).get('docId')||'';function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function show(m){$('alertBox').style.display='block';$('alertBox').textContent=m}function status(s){s=String(s||'DRAFT').toUpperCase();if(s==='SIGNED')return'SIGNÉ';if(s==='SENT')return'ENVOYÉ';if(s==='ARCHIVED')return'ARCHIVÉ';return'BROUILLON'}function setHtml(id,html){$(id).innerHTML=html||'—'}async function load(){if(!docId)throw new Error('docId manquant.');const s=await getDoc(doc(db,'contracts',docId));if(!s.exists())throw new Error('Contrat introuvable.');const d=s.data()||{},bs=d.businessSnapshot||{};$('docTitle').textContent=d.title||'Contrat de prestation';$('docSub').textContent=`N° ${d.contractNumber||'—'} • ${d.startDate||'—'} → ${d.endDate||'—'}`;$('statusPill').textContent=status(d.contractStatus);setHtml('businessBox',[`<strong>${esc(bs.companyName||'Conciergerie')}</strong>`,esc(bs.address?.street||''),esc([bs.address?.zip,bs.address?.city].filter(Boolean).join(' ')),esc(bs.billingEmail||''),esc(bs.phone||''),esc(bs.registration?.siret?('SIRET '+bs.registration.siret):'')].filter(Boolean).join('<br>'));setHtml('clientBox',[`<strong>${esc(d.clientName||d.ownerName||'—')}</strong>`,esc(d.clientEmail||d.ownerEmail||''),esc(d.clientPhone||d.ownerPhone||'')].filter(Boolean).join('<br>'));setHtml('homeBox',[esc(d.homeName||'Contrat général'),esc(d.homeAddress||'')].filter(Boolean).join('<br>'));$('contractObject').textContent=d.contractObject||'—';$('specialTerms').textContent=d.specialTerms||'—';$('pricingTerms').textContent=d.pricingTerms||'—';$('terminationTerms').textContent=d.terminationTerms||'—';if(bs.logoUrl){$('logoImg').src=bs.logoUrl;$('logoImg').style.display='block';$('logoFallback').style.display='none'}}onAuthStateChanged(auth,async user=>{if(!user){location.href='login.html?role=conciergerie';return}try{await load()}catch(e){console.error(e);show('⛔ '+(e?.message||'Erreur chargement'))}});</script></body></html>
