<!-- docs/owner-planning.html (LECTURE SEULE – propriétaire) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Planning</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.92);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }

    .page{
      min-height:100vh;
      padding:16px;
      padding-bottom:120px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:10px;
    }
    .pill{
      padding:8px 12px;
      border-radius:999px;
      border:2px solid var(--violet-main);
      background:#fff;
      color:var(--violet-main);
      font-weight:900;
      font-size:13px;
      text-decoration:none;
    }

    h1{ font-size:22px; font-weight:900; margin:6px 0 4px; }
    .subtitle{ font-size:13px; font-weight:800; color:#444; margin-bottom:12px; }

    .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; gap:12px; }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
    }

    label{
      font-size:12px;
      font-weight:900;
      color:#333;
      margin-bottom:4px;
      display:block;
    }
    select{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      font-size:14px;
      font-weight:800;
    }

    .list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .item{
      background:#fff;
      border-radius:14px;
      padding:10px 12px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      border-left:5px solid var(--violet-main);
    }
    .meta{
      display:flex; justify-content:space-between;
      font-size:11px; font-weight:900; color:#666;
      margin-bottom:4px;
    }
    .msg{ font-size:13px; font-weight:800; }

    /* bottom nav */
    .bottom-nav{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: calc(100% - 20px);
      max-width: 980px;
      display: flex;
      gap: 6px;
      padding: 8px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(122,92,255,0.18);
      border-bottom: none;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.08);
    }
    .bottom-nav a{
      flex:1;
      text-align:center;
      font-size:11px;
      font-weight:1000;
      padding:10px;
      border-radius:999px;
      text-decoration:none;
      color:#666;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
    }
  </style>
</head>

<body>
<div class="page">
  <div class="topbar">
    <a class="pill" href="owner-dashboard.html">← Dashboard</a>
    <a class="pill" href="owner-homes.html">Mes logements</a>
  </div>

  <h1>Planning</h1>
  <div class="subtitle">Réservations & interventions (lecture seule)</div>

  <div class="wrap">
    <div class="card">
      <label for="homeSelect">Logement</label>
      <select id="homeSelect">
        <option value="">Tous les logements</option>
      </select>
    </div>

    <div class="card">
      <strong>Événements à venir</strong>
      <div class="list" id="planningList"></div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="owner-dashboard.html">Dashboard</a>
  <a class="active" href="owner-planning.html">Planning</a>
  <a href="owner-messages.html">Messages</a>
  <a href="owner-facturation.html">Facturation</a>
</nav>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  collection, query, where, orderBy, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const homeSelect = document.getElementById("homeSelect");
const list = document.getElementById("planningList");

function fmt(ts){
  const d = ts?.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString("fr-FR",{dateStyle:"short",timeStyle:"short"});
}

onAuthStateChanged(auth, (user)=>{
  if(!user){
    location.href = "login.html?role=proprietaire";
    return;
  }

  // homes du owner
  onSnapshot(
    query(collection(db,"homes"), where("ownerUid","==",user.uid)),
    snap=>{
      homeSelect.innerHTML = `<option value="">Tous les logements</option>`;
      snap.docs.forEach(d=>{
        const h = d.data();
        const opt = document.createElement("option");
        opt.value = d.id;
        opt.textContent = h.name || "Logement";
        homeSelect.appendChild(opt);
      });
    }
  );

  // events (ical + interventions)
  onSnapshot(
    query(
      collection(db,"icalEvents"),
      where("ownerUid","==",user.uid),
      orderBy("startIso","asc")
    ),
    snap=>{
      list.innerHTML = "";
      if(snap.empty){
        list.innerHTML = `<div class="item"><div class="msg">Aucun événement</div></div>`;
        return;
      }
      snap.docs.forEach(d=>{
        const e = d.data();
        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = `
          <div class="meta">
            <span>${e.homeName || ""}</span>
            <span>${fmt(e.startIso)}</span>
          </div>
          <div class="msg">${e.summary || "Événement"}</div>
        `;
        list.appendChild(el);
      });
    }
  );
});
</script>
</body>
</html>
