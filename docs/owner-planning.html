<!-- docs/owner-planning.html (FINAL — 1 ligne par event: Réservation + Logement/Ville + Arrivée + Départ + labels(lines) si présent) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Planning</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --ok:#1b8f4d;
      --bad:#b3261e;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;

      /* couleurs planning */
      --c-arr:#1b8f4d;            /* arrivée = vert */
      --c-dep:#FF3B3B;            /* départ  = rouge */
      --c-mis: var(--violet-main);/* missions = violet */
      --c-res:#111;               /* réservation = noir */
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }

    .page{ min-height:100vh; padding:16px; padding-bottom:120px; display:flex; flex-direction:column; align-items:center; }
    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:20;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter: blur(6px);
    }
    .pill{
      padding:8px 12px; border-radius:999px;
      border:2px solid var(--violet-main);
      background:#fff; color:var(--violet-main);
      font-weight:900; font-size:13px; text-decoration:none;
      cursor:pointer;
      white-space:nowrap;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }

    .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; gap:12px; margin-top:10px; }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter: blur(10px);
    }

    h1{ margin:0; font-size:20px; font-weight:900; }
    .subtitle{ margin-top:6px; font-size:12px; font-weight:900; color:#444; white-space:pre-wrap; }

    label{ display:block; font-size:12px; font-weight:900; color:#333; margin:10px 0 4px; }
    select{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      font-size:14px;
      outline:none;
      background:#fff;
      font-weight:800;
      color:#111;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .row > div{ flex:1; min-width:240px; }

    .alert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .calHead{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-top:10px;
    }
    .calTitle{
      font-weight:1000;
      color:#222;
      font-size:13px;
      text-align:center;
      flex:1;
    }
    .calBtn{
      border:none;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      font-weight:1000;
      padding:8px 10px;
      border-radius:999px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .calendar{
      margin-top:10px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-radius:16px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      overflow:hidden;
    }
    .dow{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      background:rgba(122,92,255,0.06);
      border-bottom:1px solid rgba(0,0,0,0.06);
    }
    .dow div{
      padding:8px 6px;
      font-size:11px;
      font-weight:1000;
      color:#555;
      text-align:center;
    }
    .gridCal{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .day{
      min-height:56px;
      padding:8px 6px;
      border-right:1px solid rgba(0,0,0,0.05);
      border-bottom:1px solid rgba(0,0,0,0.05);
      position:relative;
      cursor:pointer;
      user-select:none;
    }
    .day:nth-child(7n){ border-right:none; }
    .dayNum{
      font-size:12px;
      font-weight:1000;
      color:#333;
    }
    .day.muted .dayNum{ color:#bbb; }

    .day.today{
      outline:2px solid rgba(122,92,255,.25);
      outline-offset:-2px;
      background:rgba(122,92,255,0.05);
    }
    .day.selected{
      outline:3px solid rgba(122,92,255,.75);
      outline-offset:-3px;
      background:rgba(122,92,255,0.12);
    }

    .dots{
      position:absolute;
      left:6px;
      bottom:6px;
      display:flex;
      gap:4px;
      align-items:center;
    }
    .dot{ width:7px; height:7px; border-radius:50%; background: var(--violet-main); opacity:.9; }
    .dot.res{ background:var(--c-res); }
    .dot.mis{ background:var(--c-mis); }
    .dot.dep{ background:var(--c-dep); }
    .dot.arr{ background:var(--c-arr); }
    .dot.more{
      width:auto; height:auto;
      padding:2px 6px;
      border-radius:999px;
      background:#111;
      color:#fff;
      font-size:10px;
      font-weight:1000;
      line-height:1;
    }

    .list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
    .item{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px 12px;
      border-left:5px solid rgba(122,92,255,.55);
    }
    .meta{
      display:flex; justify-content:space-between; gap:8px;
      flex-wrap:wrap;
      font-size:11px; font-weight:1000; color:#666;
      margin-bottom:6px;
    }
    .msg{
      margin:0;
      font-size:13px;
      font-weight:800;
      color:#333;
      white-space:pre-wrap;
      line-height:1.35;
    }

    .emptyBox{ display:none; }
    .tiny{ font-size:12px; font-weight:900; color:var(--muted); line-height:1.35; margin-top:8px; }

    .bottom-nav{
      position:fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
  </style>
</head>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  doc, getDoc,
  collection, query, where, orderBy, limit, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* Helpers */
function pad2(n){ return String(n).padStart(2,"0"); }
function toKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function isDateKey(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"")); }
function fmtDateKey(k){
  const s = String(k||"");
  if(!isDateKey(s)) return s;
  return s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4);
}
function dateFromKey(k){
  const s = String(k||"");
  if(!isDateKey(s)) return new Date();
  const y = Number(s.slice(0,4));
  const m = Number(s.slice(5,7)) - 1;
  const d = Number(s.slice(8,10));
  return new Date(y,m,d);
}
function monthLabel(d){
  const months = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  return `${months[d.getMonth()]} ${d.getFullYear()}`;
}
function esc(s){
  return String(s ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function chunk(arr, size){
  const out = [];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i,i+size));
  return out;
}

/* ✅ labels réels depuis events.lines[] */
function extractLineLabels(e){
  const lines = Array.isArray(e?.lines) ? e.lines : [];
  const out = [];
  for(const ln of lines){
    const lab = String(ln?.label || "").trim();
    const cat = String(ln?.category || "").trim();
    if(lab) out.push(lab);
    else if(cat) out.push(cat);
  }
  return Array.from(new Set(out));
}

/* UI */
const homeSelect   = document.getElementById("homeSelect");
const rangeSelect  = document.getElementById("rangeSelect");
const subtitleLine = document.getElementById("subtitleLine");
const planningList = document.getElementById("planningList");
const emptyBox     = document.getElementById("emptyBox");
const emptyMsg     = document.getElementById("emptyMsg");
const alertBox     = document.getElementById("alertBox");

const calTitle     = document.getElementById("calTitle");
const calGrid      = document.getElementById("calGrid");
const prevMonthBtn = document.getElementById("prevMonthBtn");
const nextMonthBtn = document.getElementById("nextMonthBtn");

function showAlert(msg, ok=false){
  alertBox.style.display="block";
  alertBox.classList.toggle("ok",!!ok);
  alertBox.textContent=msg;
}
function hideAlert(){
  alertBox.style.display="none";
  alertBox.textContent="";
  alertBox.classList.remove("ok");
}

/* State */
let currentUser = null;

let ownerDocId = "";
let conciergerieUid = "";

let homes = [];
let homesById = new Map();
let ownedHomeIds = [];

let unsubHomes = null;
let unsubEventChunks = [];

let eventsMap = new Map();      // eventId -> event
let events = [];
let eventsByDate = new Map();   // dateKey -> counts

/* Month view */
let viewMonth = new Date();
viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);

/* Selected day */
const todayKey = toKey(new Date());
const urlParams = new URLSearchParams(location.search);
let selectedKey =
  (urlParams.get("dateKey") || "").trim()
  || (localStorage.getItem("owner_planning_selectedKey") || "").trim()
  || todayKey;

function setSelectedKey(k){
  if(!isDateKey(k)) return;
  selectedKey = k;
  localStorage.setItem("owner_planning_selectedKey", selectedKey);

  const u = new URL(location.href);
  u.searchParams.set("dateKey", selectedKey);
  history.replaceState({}, "", u.toString());

  const d = dateFromKey(selectedKey);
  viewMonth = new Date(d.getFullYear(), d.getMonth(), 1);

  refreshSubtitle();
  renderCalendar();
  renderList();
}

/* Business */
function computeRangeKeys(){
  const days = Number(rangeSelect.value || "30");
  const d0 = new Date();
  const d1 = new Date(d0.getTime() + days*24*60*60*1000);
  return { minKey: toKey(d0), maxKey: toKey(d1) };
}

function classifyEvent(e){
  const source = String(e.source||"").toLowerCase();
  const isReservation = (source === "ical") || (!!e.arrivalDateKey && !!e.departureDateKey);

  // ✅ missions = soit missionTypes, soit lines (ton cas réel)
  const mt = Array.isArray(e.missionTypes) ? e.missionTypes.map(x=>String(x||"").toUpperCase()) : [];
  const hasLines = Array.isArray(e.lines) && e.lines.length > 0;
  const hasMissions = (mt.length > 0) || hasLines;

  return { isReservation, hasMissions, mt };
}

function rebuildMaps(){
  eventsByDate = new Map();

  const addBucket = (dateKey)=>{
    if(!isDateKey(dateKey)) return null;
    if(!eventsByDate.has(dateKey)){
      eventsByDate.set(dateKey, { arr:0, dep:0, mis:0, res:0, itemsCount:0 });
    }
    return eventsByDate.get(dateKey);
  };

  for(const e of events){
    const dk = String(e.dateKey || e.arrivalDateKey || "").trim();
    const { isReservation, hasMissions } = classifyEvent(e);

    if(isDateKey(dk)){
      const b = addBucket(dk);
      if(b) b.itemsCount++;
    }

    if(isReservation){
      if(isDateKey(e.arrivalDateKey)){
        const b = addBucket(String(e.arrivalDateKey));
        if(b) b.arr++;
      }
      if(isDateKey(e.departureDateKey)){
        const b = addBucket(String(e.departureDateKey));
        if(b) b.dep++;
      }
      if(!isDateKey(e.arrivalDateKey) && !isDateKey(e.departureDateKey) && isDateKey(dk)){
        const b = addBucket(dk);
        if(b) b.res++;
      }
    }

    if(hasMissions && isDateKey(dk)){
      const b = addBucket(dk);
      if(b) b.mis++;
    }
  }
}

function fillHomes(){
  homeSelect.innerHTML = "";

  const optAll = document.createElement("option");
  optAll.value = "__all__";
  optAll.textContent = "Tous mes logements";
  homeSelect.appendChild(optAll);

  if(!homes.length){
    homeSelect.disabled = true;
    subtitleLine.textContent = "Aucun logement rattaché pour le moment.";
    return;
  }

  homeSelect.disabled = false;

  for(const h of homes){
    const opt = document.createElement("option");
    opt.value = h.id;
    opt.textContent = `${h.name || "Logement"} (${h.city || "—"})`;
    homeSelect.appendChild(opt);
  }

  const p = new URLSearchParams(location.search);
  const forced = (p.get("homeId") || "").trim();
  if(forced && homesById.has(forced)){
    homeSelect.value = forced;
  }else{
    homeSelect.value = "__all__";
  }
}

/* ---------- LIST RENDER (1 LINE / EVENT) ---------- */
function renderList(){
  planningList.innerHTML = "";
  emptyBox.style.display = "none";

  const chosen = homeSelect.value || "__all__";

  // filtre logement
  let filtered = events.slice();
  if(chosen !== "__all__"){
    filtered = filtered.filter(e => String(e.homeId||"") === String(chosen));
  }

  // filtre date = selectedKey
  filtered = filtered.filter(e => {
  const dk  = String(e.dateKey || "").trim();
  const arr = String(e.arrivalDateKey || "").trim();
  const dep = String(e.departureDateKey || "").trim();

  return (
    dk === selectedKey ||
    arr === selectedKey ||
    dep === selectedKey
  );
});
  if(!filtered.length){
    emptyMsg.textContent = `Rien le ${fmtDateKey(selectedKey)}.`;
    emptyBox.style.display = "block";
    return;
  }

  // tri
  filtered.sort((a,b)=>{
    const at = String(a.time||a.arrivalTime||a.departureTime||"");
    const bt = String(b.time||b.arrivalTime||b.departureTime||"");
    return (selectedKey+" "+at).localeCompare(selectedKey+" "+bt);
  });

  const niceDT = (k, t)=>{
    const kk = String(k||"").trim();
    const tt = String(t||"").trim();
    if(isDateKey(kk) && tt) return `${fmtDateKey(kk)} ${tt}`;
    if(isDateKey(kk)) return `${fmtDateKey(kk)}`;
    if(tt) return tt;
    return "—";
  };

  for(const e of filtered){
    const h = homesById.get(String(e.homeId||""));
    const homeName = String(e.homeName || h?.name || "Logement").trim();
    const city = String(e.homeCity || h?.city || "").trim();

    const { isReservation } = classifyEvent(e);

    const reservationLabel = isReservation ? "Réservation" : "Mission";
    const place = city ? `${homeName} / ${city}` : homeName;

    const arr = niceDT(e.arrivalDateKey, e.arrivalTime);
    const dep = niceDT(e.departureDateKey, e.departureTime);

    // ✅ labels réels depuis lines[]
    const labels = extractLineLabels(e);
    const labelsText = labels.join(" / ");
    const labelsPart = labelsText ? ` • ${labelsText}` : "";

    // ✅ 1 seule ligne
    const line = `${reservationLabel} • ${place} • Arrivée ${arr} • Départ ${dep}${labelsPart}`;

    const div = document.createElement("div");
    div.className = "item";
    div.innerHTML = `
      <div class="meta">
        <span>${esc(fmtDateKey(selectedKey))}</span>
        <span>${esc(String(e.id || ""))}</span>
      </div>
      <p class="msg">${esc(line)}</p>
    `;
    planningList.appendChild(div);
  }
}
/* ---------- /LIST RENDER ---------- */

function clearCalendar(){ calGrid.innerHTML = ""; }
function dateKeyFromYMD(y,m,d){ return `${y}-${pad2(m+1)}-${pad2(d)}`; }

function renderCalendar(){
  calTitle.textContent = monthLabel(viewMonth);
  clearCalendar();

  const first = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
  const last  = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 0);
  const firstDow = (first.getDay() + 6) % 7; // Mon..Sun
  const daysInMonth = last.getDate();
  const prevLast = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 0).getDate();

  const cells = 42;
  for(let i=0;i<cells;i++){
    const cell = document.createElement("div");
    cell.className = "day";

    let dNum, y, m, muted=false;
    if(i < firstDow){
      dNum = prevLast - (firstDow - 1 - i);
      y = viewMonth.getFullYear();
      m = viewMonth.getMonth()-1;
      if(m < 0){ m=11; y--; }
      muted=true;
    }else if(i >= firstDow + daysInMonth){
      dNum = (i - (firstDow + daysInMonth)) + 1;
      y = viewMonth.getFullYear();
      m = viewMonth.getMonth()+1;
      if(m > 11){ m=0; y++; }
      muted=true;
    }else{
      dNum = (i - firstDow) + 1;
      y = viewMonth.getFullYear();
      m = viewMonth.getMonth();
    }

    const dk = dateKeyFromYMD(y,m,dNum);

    if(muted) cell.classList.add("muted");
    if(dk === todayKey) cell.classList.add("today");
    if(dk === selectedKey) cell.classList.add("selected");

    cell.dataset.dateKey = dk;
    cell.innerHTML = `<div class="dayNum">${dNum}</div>`;

    const b = eventsByDate.get(dk);
    if(b){
      const dots = document.createElement("div");
      dots.className = "dots";

      if(b.arr > 0) dots.appendChild(Object.assign(document.createElement("span"), { className:"dot arr" }));
      if(b.dep > 0) dots.appendChild(Object.assign(document.createElement("span"), { className:"dot dep" }));
      if(b.mis > 0) dots.appendChild(Object.assign(document.createElement("span"), { className:"dot mis" }));
      if(b.res > 0 && b.arr===0 && b.dep===0) dots.appendChild(Object.assign(document.createElement("span"), { className:"dot res" }));

      if((b.itemsCount || 0) > 3){
        const more = document.createElement("span");
        more.className = "dot more";
        more.textContent = "+" + String(b.itemsCount);
        dots.appendChild(more);
      }

      cell.appendChild(dots);
    }

    cell.addEventListener("click", ()=> setSelectedKey(dk));
    calGrid.appendChild(cell);
  }
}

function stopHomesListener(){
  if(unsubHomes) unsubHomes();
  unsubHomes = null;
}

function stopEventListeners(){
  for(const u of unsubEventChunks){ try{ u(); }catch(_){ } }
  unsubEventChunks = [];
  eventsMap = new Map();
  events = [];
  eventsByDate = new Map();
}

function refreshSubtitle(){
  const { minKey, maxKey } = computeRangeKeys();
  const chosen = homeSelect.value || "__all__";
  const titleHome = (chosen === "__all__")
    ? "Tous les logements"
    : (homesById.get(chosen)?.name || "Logement");
  subtitleLine.textContent = `${titleHome} • ${fmtDateKey(minKey)} → ${fmtDateKey(maxKey)} • Jour : ${fmtDateKey(selectedKey)}`;
}

function listenEventsByHomeIds(){
  stopEventListeners();
  hideAlert();

  if(!currentUser) return;

  const { minKey, maxKey } = computeRangeKeys();
  refreshSubtitle();

  if(!ownedHomeIds.length){
    renderCalendar();
    renderList();
    return;
  }

  const chosen = homeSelect.value || "__all__";
  const idsToUse = (chosen !== "__all__")
    ? [String(chosen)]
    : ownedHomeIds.slice();

  const chunks = chunk(idsToUse, 10);
  if(!chunks.length){
    renderCalendar();
    renderList();
    return;
  }

  for(const ids of chunks){
    const qEvents = query(
      collection(db,"events"),
      where("homeId","in", ids),
      where("dateKey", ">=", minKey),
      where("dateKey", "<=", maxKey),
      orderBy("dateKey","asc"),
      limit(600)
    );

    const unsub = onSnapshot(qEvents, (snap)=>{
      snap.docChanges().forEach(ch=>{
        if(ch.type === "removed"){
          eventsMap.delete(ch.doc.id);
        }else{
          eventsMap.set(ch.doc.id, { id: ch.doc.id, ...(ch.doc.data()||{}) });
        }
      });

      events = Array.from(eventsMap.values());
      events.sort((a,b)=>{
        const ak = (a.dateKey||"") + " " + String(a.time||a.arrivalTime||"");
        const bk = (b.dateKey||"") + " " + String(b.time||b.arrivalTime||"");
        return ak.localeCompare(bk);
      });

      rebuildMaps();
      renderCalendar();
      renderList();
    }, (err)=>{
      console.error(err);
      const m = String(err?.message||"").toLowerCase();
      if(m.includes("permission")){
        showAlert("Accès au planning refusé (droits).", false);
      }else if(m.includes("index")){
        showAlert("Index Firestore manquant pour le planning (homeId IN + dateKey).", false);
      }else{
        showAlert("Erreur chargement planning.", false);
      }
    });

    unsubEventChunks.push(unsub);
  }
}

function listenHomesForOwner(){
  stopHomesListener();
  if(!currentUser) return;

  const qh = (ownerDocId && conciergerieUid)
    ? query(
        collection(db,"homes"),
        where("conciergerieUid","==", String(conciergerieUid)),
        where("ownerDocId","==", String(ownerDocId))
      )
    : query(
        collection(db,"homes"),
        where("ownerUid","==", String(currentUser.uid))
      );

  unsubHomes = onSnapshot(qh, (snap)=>{
    homes = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));
    homes.sort((a,b)=> (String(a.name||"")).localeCompare(String(b.name||"")) );
    homesById = new Map(homes.map(h=>[h.id,h]));
    ownedHomeIds = homes.map(h=>h.id);

    fillHomes();
    listenEventsByHomeIds();
  }, (err)=>{
    console.error(err);
    showAlert("Impossible de charger tes logements.", false);
  });
}

/* UI handlers */
homeSelect.addEventListener("change", ()=>{
  refreshSubtitle();
  listenEventsByHomeIds();
});
rangeSelect.addEventListener("change", ()=>{
  refreshSubtitle();
  listenEventsByHomeIds();
});

prevMonthBtn.addEventListener("click", ()=>{
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()-1, 1);
  renderCalendar();
});
nextMonthBtn.addEventListener("click", ()=>{
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 1);
  renderCalendar();
});

/* Boot */
onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.href="login.html?role=proprietaire";
    return;
  }
  currentUser = user;

  try{
    const us = await getDoc(doc(db,"users", user.uid));
    const ud = us.exists() ? (us.data()||{}) : {};
    ownerDocId = String(ud.ownerDocId || "").trim();
    conciergerieUid = String(ud.conciergerieUid || "").trim();
  }catch(_){}

  if(!ownerDocId || !conciergerieUid){
    showAlert("⚠️ Compte pas encore rattaché (ownerDocId/conciergerieUid). Va sur Profil puis Enregistrer.", false);
  }

  if(!isDateKey(selectedKey)) selectedKey = todayKey;
  const d = dateFromKey(selectedKey);
  viewMonth = new Date(d.getFullYear(), d.getMonth(), 1);

  refreshSubtitle();
  renderCalendar();
  renderList();        // vide au départ
  listenHomesForOwner();
});
</script>
