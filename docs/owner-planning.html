<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Planning propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --ok:#1b8f4d; --bad:#b3261e;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; padding:16px 16px 28px; max-width:980px; margin:0 auto; padding-bottom:94px; }
    .topbar{
      position:sticky; top:0; z-index:30;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter: blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer; white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .logo{
      display:flex; justify-content:center; align-items:center; gap:8px;
      margin-top:8px; margin-bottom:4px; text-align:center;
    }
    .logo-icon{
      width:38px;height:38px;border-radius:50%;
      background:#fff;border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet);font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:22px; font-weight:1000; }
    .subtitle{ margin:6px 0 0; color:#444; font-weight:800; text-align:center; }
    .badgeLine{
      margin:10px auto 0;
      padding:4px 10px;
      border-radius:999px;
      background:#fff;
      font-size:12px;
      color:#555;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center;
      font-weight:900;
      white-space:pre-wrap;
      max-width:980px;
    }
    .nav{
      display:flex; gap:8px; flex-wrap:wrap;
      background:rgba(255,255,255,0.92);
      border:1px solid var(--border);
      border-radius:999px;
      padding:6px;
      box-shadow:0 4px 12px rgba(0,0,0,.08);
      position:sticky; top:64px; z-index:25;
      backdrop-filter: blur(8px);
      margin-top:12px;
    }
    .nav a{
      flex:1; min-width:140px;
      text-align:center;
      padding:10px 10px;
      border-radius:999px;
      text-decoration:none;
      font-weight:1000; font-size:12px;
      color:#555;
      position:relative;
    }
    .nav a.active{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .dot{
      position:absolute; top:6px; right:10px;
      background:#111; color:#fff;
      font-size:10px; font-weight:1000;
      padding:2px 6px; border-radius:999px;
      display:none;
    }
    .card{
      margin-top:12px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 12px 16px;
      backdrop-filter: blur(10px);
    }
    .cardTitle{ display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:14px; font-weight:1000; }
    .tiny{ font-size:12px; color:var(--muted); font-weight:900; line-height:1.35; }
    .list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .item{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px 12px;
      border-left:5px solid rgba(122,92,255,.55);
    }
    .meta{ display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; font-size:11px; font-weight:1000; color:#666; margin-bottom:6px; }
    .msg{ margin:0; font-size:13px; font-weight:800; color:#333; white-space:pre-wrap; line-height:1.35; }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      border:none; border-radius:999px;
      padding:10px 12px;
      font-size:13px; font-weight:1000;
      cursor:pointer; text-decoration:none;
      background:#fff; color:var(--violet);
      border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .alert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }
   /* ✅ Nav fixe toujours en bas */
.bottom-nav{
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: 0;
  z-index: 50;

  width: calc(100% - 20px);
  max-width: 980px;

  display: flex;
  justify-content: space-around;
  gap: 6px;

  padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
  background: rgba(255,255,255,0.92);
  border: 1px solid rgba(122,92,255,0.18);
  border-bottom: none;
  border-radius: 999px 999px 0 0;

  backdrop-filter: blur(10px);
}

/* ✅ évite que le contenu passe sous la nav */
.page{ padding-bottom: 120px; }

/* 🚫 supprime entièrement ton @media(min-width:860px) qui met .bottom-nav en static */

    .bottom-nav a{
      flex:1; text-align:center; font-size:11px; font-weight:1000; text-decoration:none;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap; position:relative;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
   
      .page{ padding-bottom: 28px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="index.html">← Accueil</a>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <a class="pill" id="profileBtn" href="profil-proprietaire.html?self=1">Mon profil</a>
        <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
      </div>
    </div>

    <div class="logo">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>
    <div class="subtitle">Planning propriétaire</div>
    <div class="badgeLine" id="badgeLine">—</div>

    <div class="nav" aria-label="Navigation owner">
      <a class="active" href="owner-planning.html">Planning</a>
      <a href="owner-import-ical.html">iCal</a>
      <a href="owner-messages.html">Messages <span class="dot" id="dotMsgTop">0</span></a>
      <a href="owner-homes.html">Logements</a>
      <a href="owner-facturation.html">Facturation <span class="dot" id="dotBillTop">0</span></a>
    </div>

    <section class="card">
      <div class="cardTitle">
        <span>Accès planning</span>
        <span class="tiny">V1</span>
      </div>
      <div class="tiny" style="margin-top:8px;">
        Le planning détaillé est consultable par logement.
        <br>Choisis un logement ci-dessous → “Voir planning”.
      </div>

      <div class="alert" id="alertHomes"></div>
      <div id="homesList" class="list"></div>
    </section>

    <nav class="bottom-nav" aria-label="Navigation propriétaire">
      <a class="active" href="owner-planning.html">Planning</a>
      <a href="owner-messages.html">Messages <span class="dot" id="dotMsgBottom">0</span></a>
      <a href="owner-facturation.html">Facturation <span class="dot" id="dotBillBottom">0</span></a>
    </nav>
  </div>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { doc, getDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  // UI
  const badgeLine = document.getElementById("badgeLine");
  const profileBtn = document.getElementById("profileBtn");
  const logoutBtn = document.getElementById("logoutBtn");
  const alertHomes = document.getElementById("alertHomes");
  const homesList = document.getElementById("homesList");

  const dotMsgTop = document.getElementById("dotMsgTop");
  const dotMsgBottom = document.getElementById("dotMsgBottom");
  const dotBillTop = document.getElementById("dotBillTop");
  const dotBillBottom = document.getElementById("dotBillBottom");

  function showAlert(el, msg, ok=false){
    el.style.display = "block";
    el.classList.toggle("ok", !!ok);
    el.textContent = msg;
  }
  function hideAlert(el){
    el.style.display = "none";
    el.classList.remove("ok");
    el.textContent = "";
  }
  function esc(s){
    return String(s ?? "")
      .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
      .replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }
  function getParam(name){
    return (new URLSearchParams(location.search).get(name) || "").trim();
  }
  function buildProfileUrl(){
    const token = getParam("token");
    return token ? `profil-proprietaire.html?self=1&token=${encodeURIComponent(token)}` : `profil-proprietaire.html?self=1`;
  }

  function setDot(el, n){
    if(!el) return;
    if(n > 0){
      el.style.display = "inline-block";
      el.textContent = String(n);
    }else{
      el.style.display = "none";
      el.textContent = "0";
    }
  }

  logoutBtn.addEventListener("click", async ()=>{
    await signOut(auth);
    location.href = "index.html";
  });

  let unsubHomes = null;
  let currentUser = null;

  async function guardOwner(user){
    const usnap = await getDoc(doc(db, "users", user.uid));
    const u = usnap.exists() ? (usnap.data() || {}) : {};
    const role = String(u.role || "").toLowerCase();

    // Soft-guard : si data pas encore là, on laisse passer mais ça cassera homes.
    if(role && role !== "proprietaire"){
      location.href = "login.html?role=proprietaire";
      return { ok:false };
    }
    return { ok:true, conciergerieUid: String(u.conciergerieUid||"").trim() };
  }

  function listenHomes(uid){
    if(unsubHomes) unsubHomes();
    hideAlert(alertHomes);

    // ✅ modèle final : homes.ownerUid == auth.uid
    const qh = query(collection(db, "homes"), where("ownerUid","==", uid));

    unsubHomes = onSnapshot(qh, (snap)=>{
      const homes = snap.docs.map(d => ({ id:d.id, ...(d.data()||{}) }));
      homes.sort((a,b)=> (a.name||"").localeCompare(b.name||""));

      homesList.innerHTML = "";
      if(!homes.length){
        homesList.innerHTML = `
          <div class="item">
            <div class="meta"><span>Aucun logement lié</span><span>—</span></div>
            <p class="msg">Soit la conciergerie n’a pas encore lié ton logement, soit le champ homes.ownerUid n’est pas ton auth.uid.</p>
          </div>`;
        return;
      }

      homes.forEach(h=>{
        const name = `${h.name || "Logement"}${h.city ? " • " + h.city : ""}`;
        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = `
          <div class="meta">
            <span>${esc(name)}</span>
            <span>${esc(h.type || "")}</span>
          </div>
          <p class="msg">${esc((h.homeAddress || h.address || "").trim() || "Adresse manquante")}</p>
          <div style="margin-top:8px; display:flex; gap:8px; flex-wrap:wrap;">
            <a class="btn primary" href="planning-proprietaire.html?homeId=${encodeURIComponent(h.id)}">Voir planning</a>
            <a class="btn" href="owner-messages.html?homeId=${encodeURIComponent(h.id)}">Message conciergerie</a>
          </div>`;
        homesList.appendChild(el);
      });
    }, (err)=>{
      console.error(err);
      showAlert(alertHomes, "⛔ Lecture homes refusée (rules). Vérifie: allow read si homes.ownerUid == auth.uid.", false);
    });
  }

  // Unread (basique, cross-pages)
  // Messages unread : calculé dans owner-messages.html -> stocke localStorage cm_owner_unread_messages
  // Billing unread  : calculé dans owner-facturation.html -> stocke localStorage cm_owner_unread_billing
  function refreshDots(){
    const um = Number(localStorage.getItem("cm_owner_unread_messages") || "0");
    const ub = Number(localStorage.getItem("cm_owner_unread_billing") || "0");
    setDot(dotMsgTop, um); setDot(dotMsgBottom, um);
    setDot(dotBillTop, ub); setDot(dotBillBottom, ub);
  }
  window.addEventListener("focus", refreshDots);

  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      location.href = "login.html?role=proprietaire" + (getParam("token") ? ("&token=" + encodeURIComponent(getParam("token"))) : "");
      return;
    }
    currentUser = user;

    profileBtn.href = buildProfileUrl();

    const g = await guardOwner(user);
    if(!g.ok) return;

    badgeLine.textContent = `Connecté : ${user.email || user.uid}`;
    refreshDots();
    listenHomes(user.uid);
  });
</script>
</body>
</html>
