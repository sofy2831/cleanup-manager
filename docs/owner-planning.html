<!-- docs/owner-planning.html (OWNER — planning: events only + calendrier points + liste) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Planning</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --ok:#1b8f4d;
      --bad:#b3261e;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }

    .page{ min-height:100vh; padding:16px; padding-bottom:120px; display:flex; flex-direction:column; align-items:center; }
    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:20;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter: blur(6px);
    }
    .pill{
      padding:8px 12px; border-radius:999px;
      border:2px solid var(--violet-main);
      background:#fff; color:var(--violet-main);
      font-weight:900; font-size:13px; text-decoration:none;
      cursor:pointer;
      white-space:nowrap;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }

    .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; gap:12px; margin-top:10px; }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter: blur(10px);
    }

    h1{ margin:0; font-size:20px; font-weight:900; }
    .subtitle{ margin-top:6px; font-size:12px; font-weight:900; color:#444; white-space:pre-wrap; }

    label{ display:block; font-size:12px; font-weight:900; color:#333; margin:10px 0 4px; }
    select{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      font-size:14px;
      outline:none;
      background:#fff;
      font-weight:800;
      color:#111;
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .row > div{ flex:1; min-width:240px; }

    .alert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    /* ===== Calendrier ===== */
    .calHead{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      margin-top:10px;
    }
    .calTitle{
      font-weight:1000;
      color:#222;
      font-size:13px;
      text-align:center;
      flex:1;
    }
    .calBtn{
      border:none;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      font-weight:1000;
      padding:8px 10px;
      border-radius:999px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .calendar{
      margin-top:10px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-radius:16px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      overflow:hidden;
    }
    .dow{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      background:rgba(122,92,255,0.06);
      border-bottom:1px solid rgba(0,0,0,0.06);
    }
    .dow div{
      padding:8px 6px;
      font-size:11px;
      font-weight:1000;
      color:#555;
      text-align:center;
    }
    .gridCal{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
    }
    .day{
      min-height:56px;
      padding:8px 6px;
      border-right:1px solid rgba(0,0,0,0.05);
      border-bottom:1px solid rgba(0,0,0,0.05);
      position:relative;
      cursor:pointer;
      user-select:none;
    }
    .day:nth-child(7n){ border-right:none; }
    .dayNum{
      font-size:12px;
      font-weight:1000;
      color:#333;
    }
    .day.muted .dayNum{ color:#bbb; }
    .day.today{
      outline:2px solid rgba(122,92,255,.35);
      outline-offset:-2px;
      background:rgba(122,92,255,0.06);
    }
    .dots{
      position:absolute;
      left:6px;
      bottom:6px;
      display:flex;
      gap:4px;
      align-items:center;
    }
    .dot{
      width:7px; height:7px;
      border-radius:50%;
      background: var(--violet-main);
      opacity:.9;
    }
    .dot.res{ background:#111; }
    .dot.mis{ background: var(--violet-main); }
    .dot.dep{ background:#FF3B3B; }
    .dot.arr{ background:#1b8f4d; }
    .dot.more{
      width:auto; height:auto;
      padding:2px 6px;
      border-radius:999px;
      background:#111;
      color:#fff;
      font-size:10px;
      font-weight:1000;
      line-height:1;
    }

    /* ===== Liste ===== */
    .list{ display:flex; flex-direction:column; gap:10px; margin-top:12px; }
    .item{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px 12px;
      border-left:5px solid rgba(122,92,255,.55);
    }
    .meta{
      display:flex; justify-content:space-between; gap:8px;
      flex-wrap:wrap;
      font-size:11px; font-weight:1000; color:#666;
      margin-bottom:6px;
    }
    .msg{
      margin:0;
      font-size:13px;
      font-weight:800;
      color:#333;
      white-space:pre-wrap;
      line-height:1.35;
    }
    .tagRow{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
    .tag{
      display:inline-flex; align-items:center; gap:6px;
      padding:3px 10px;
      border-radius:999px;
      background:rgba(122,92,255,0.10);
      color:#4b2cff;
      font-size:11px;
      font-weight:1000;
    }
    .tag.ok{ background:rgba(27,143,77,0.12); color:var(--ok); }
    .tag.bad{ background:rgba(179,38,30,0.10); color:var(--bad); }

    .emptyBox{ display:none; }
    .tiny{ font-size:12px; font-weight:900; color:var(--muted); line-height:1.35; margin-top:8px; }

    /* bottom nav (uniforme) */
    .bottom-nav{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: calc(100% - 20px);
      max-width: 980px;
      display: flex;
      gap: 6px;
      padding: 8px;
      padding-bottom: calc(8px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(122,92,255,0.18);
      border-bottom: none;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1;
      text-align:center;
      font-size:11px;
      font-weight:1000;
      padding:10px 12px;
      border-radius:999px;
      text-decoration:none;
      color:#666;
      position:relative;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
  </style>
</head>

<body>
<div class="page">
  <div class="topbar">

  </div>

  <div class="wrap">
    <div class="card">
      <h1>Planning</h1>
      <div class="subtitle" id="subtitleLine">—</div>

      <div class="row">
        <div>
          <label for="homeSelect">Logement</label>
          <select id="homeSelect">
            <option value="">Chargement…</option>
          </select>
        </div>
        <div>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  collection, query, where, orderBy, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* ======================
   Helpers
====================== */
function pad2(n){ return String(n).padStart(2,"0"); }
function toKey(d){ return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
function isDateKey(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"")); }
function fmtDateKey(k){
  const s = String(k||"");
  if(!isDateKey(s)) return s;
  return s.slice(8,10)+"/"+s.slice(5,7)+"/"+s.slice(0,4);
}
function monthLabel(d){
  const months = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
  return `${months[d.getMonth()]} ${d.getFullYear()}`;
}
function esc(s){
  return String(s ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}

/* ======================
   UI
====================== */
const homeSelect   = document.getElementById("homeSelect");
const rangeSelect  = document.getElementById("rangeSelect");
const subtitleLine = document.getElementById("subtitleLine");
const planningList = document.getElementById("planningList");
const emptyBox     = document.getElementById("emptyBox");
const alertBox     = document.getElementById("alertBox");

const calTitle     = document.getElementById("calTitle");
const calGrid      = document.getElementById("calGrid");
const prevMonthBtn = document.getElementById("prevMonthBtn");
const nextMonthBtn = document.getElementById("nextMonthBtn");

function showAlert(msg, ok=false){
  alertBox.style.display="block";
  alertBox.classList.toggle("ok",!!ok);
  alertBox.textContent=msg;
}
function hideAlert(){
  alertBox.style.display="none";
  alertBox.textContent="";
  alertBox.classList.remove("ok");
}

/* ======================
   State
====================== */
let currentUser = null;

let homes = [];
let homesById = new Map();

let unsubHomes = null;
let unsubEvents = null;

let events = [];              // liste filtrée période/home
let eventsByDate = new Map(); // dateKey -> {arr, dep, misCount, resCount, items:[]}

let viewMonth = new Date();   // mois affiché calendrier
viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);

/* ======================
   Home filter
====================== */
function fillHomes(){
  homeSelect.innerHTML = "";

  const optAll = document.createElement("option");
  optAll.value = "__all__";
  optAll.textContent = "Tous mes logements";
  homeSelect.appendChild(optAll);

  if(!homes.length){
    homeSelect.disabled = true;
    subtitleLine.textContent = "Aucun logement rattaché pour le moment.";
    return;
  }

  homeSelect.disabled = false;

  for(const h of homes){
    const opt = document.createElement("option");
    opt.value = h.id;
    opt.textContent = `${h.name || "Logement"} (${h.city || "—"})`;
    homeSelect.appendChild(opt);
  }

  // si ?homeId=... => on le sélectionne, sinon all
  const p = new URLSearchParams(location.search);
  const forced = (p.get("homeId") || "").trim();
  if(forced && homesById.has(forced)){
    homeSelect.value = forced;
  }else{
    homeSelect.value = "__all__";
  }
}

/* ======================
   Planning: listen events (source unique)
====================== */
function computeRangeKeys(){
  const days = Number(rangeSelect.value || "30");
  const d0 = new Date();
  const d1 = new Date(d0.getTime() + days*24*60*60*1000);
  return { minKey: toKey(d0), maxKey: toKey(d1) };
}

function classifyEvent(e){
  // On se base sur tes champs existants : source / missionTypes / arrivalDateKey / departureDateKey / dateKey
  const mt = Array.isArray(e.missionTypes) ? e.missionTypes.map(x=>String(x||"").toUpperCase()) : [];
  const source = String(e.source||"").toLowerCase();

  const isReservation = (source === "ical") || (!!e.arrivalDateKey && !!e.departureDateKey);
  const hasMissions = mt.length > 0;

  return { isReservation, hasMissions, mt };
}

function addToDateBucket(dateKey, kind, ev){
  if(!isDateKey(dateKey)) return;

  if(!eventsByDate.has(dateKey)){
    eventsByDate.set(dateKey, { arr:0, dep:0, mis:0, res:0, items:[] });
  }
  const b = eventsByDate.get(dateKey);

  if(kind === "arr") b.arr++;
  if(kind === "dep") b.dep++;
  if(kind === "mis") b.mis++;
  if(kind === "res") b.res++;

  if(ev) b.items.push(ev);
}

function rebuildMaps(){
  eventsByDate = new Map();

  for(const e of events){
    const dateKey = String(e.dateKey || e.arrivalDateKey || "").trim();

    const { isReservation, hasMissions, mt } = classifyEvent(e);

    // Réservation: point arrivée + départ (pas tous les jours)
    if(isReservation){
      if(isDateKey(e.arrivalDateKey)) addToDateBucket(String(e.arrivalDateKey), "arr", null);
      if(isDateKey(e.departureDateKey)) addToDateBucket(String(e.departureDateKey), "dep", null);

      // si pas d’arrivée/départ bien renseignés, on met au moins un point "res" le dateKey
      if(!isDateKey(e.arrivalDateKey) && !isDateKey(e.departureDateKey) && isDateKey(dateKey)){
        addToDateBucket(dateKey, "res", null);
      }
    }

    // Missions: point sur le jour de mission (dateKey)
    if(hasMissions && isDateKey(dateKey)){
      // 1 point "mis" (même si 3 missions, on le gardera sobre)
      addToDateBucket(dateKey, "mis", null);
    }

    // Liste: on stocke l’événement dans son dateKey (pour affichage)
    if(isDateKey(dateKey)){
      addToDateBucket(dateKey, "list", e); // "list" n'impacte pas les compteurs
    }
  }
}

function renderList(){
  planningList.innerHTML = "";
  emptyBox.style.display = "none";

  if(!events.length){
    emptyBox.style.display = "block";
    return;
  }

  // group par dateKey
  const groups = new Map();
  for(const e of events){
    const dk = String(e.dateKey || e.arrivalDateKey || "").trim();
    if(!isDateKey(dk)) continue;
    if(!groups.has(dk)) groups.set(dk, []);
    groups.get(dk).push(e);
  }

  // dates triées
  const dates = Array.from(groups.keys()).sort((a,b)=> a.localeCompare(b));

  for(const dk of dates){
    const block = document.createElement("div");
    block.className = "item";

    const dayItems = groups.get(dk) || [];
    dayItems.sort((a,b)=>{
      const at = String(a.time||a.arrivalTime||"");
      const bt = String(b.time||b.arrivalTime||"");
      return (dk+" "+at).localeCompare(dk+" "+bt);
    });

    // résumé lisible
    const lines = [];
    for(const e of dayItems){
      const homeName = e.homeName || (homesById.get(e.homeId||"")?.name) || "Logement";
      const city = e.homeCity || (homesById.get(e.homeId||"")?.city) || "";
      const time = String(e.time || e.arrivalTime || e.departureTime || "").trim();

      const { isReservation, hasMissions, mt } = classifyEvent(e);

      let label = "Événement";
      if(isReservation && !hasMissions) label = "Réservation";
      if(hasMissions){
        // on garde propre et court
        const map = {
          "CHECKIN":"Check-in",
          "CHECKOUT":"Check-out",
          "MENAGE":"Ménage"
        };
        const nice = mt.map(x=> map[x] || x).join(" • ");
        label = nice || "Intervention";
      }

      const extra = (e.status && String(e.status).trim()) ? ` • ${String(e.status)}` : "";
      lines.push(`${time ? (time+" — ") : ""}${label}${extra}\n${homeName}${city ? (" • "+city) : ""}`);
    }

    block.innerHTML = `
      <div class="meta">
        <span>${esc(fmtDateKey(dk))}</span>
        <span>${esc(String(dayItems.length))} élément(s)</span>
      </div>
      <p class="msg">${esc(lines.join("\n\n"))}</p>
    `;

    planningList.appendChild(block);
  }
}

/* ======================
   Calendar render
====================== */
function clearCalendar(){
  calGrid.innerHTML = "";
}

function dateKeyFromYMD(y,m,d){
  // m: 0-11
  return `${y}-${pad2(m+1)}-${pad2(d)}`;
}

function renderCalendar(){
  calTitle.textContent = monthLabel(viewMonth);
  clearCalendar();

  const today = new Date();
  const todayKey = toKey(today);

  // lundi = 0
  const first = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 1);
  const last  = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 0);

  const firstDow = (first.getDay() + 6) % 7; // 0..6 (Mon..Sun)
  const daysInMonth = last.getDate();

  // jours du mois précédent à afficher
  const prevLast = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 0).getDate();

  const cells = 42; // 6 semaines
  for(let i=0;i<cells;i++){
    const cell = document.createElement("div");
    cell.className = "day";

    let dNum, y, m, muted = false;

    if(i < firstDow){
      dNum = prevLast - (firstDow - 1 - i);
      y = viewMonth.getFullYear();
      m = viewMonth.getMonth()-1;
      if(m < 0){ m = 11; y--; }
      muted = true;
    }else if(i >= firstDow + daysInMonth){
      dNum = (i - (firstDow + daysInMonth)) + 1;
      y = viewMonth.getFullYear();
      m = viewMonth.getMonth()+1;
      if(m > 11){ m = 0; y++; }
      muted = true;
    }else{
      dNum = (i - firstDow) + 1;
      y = viewMonth.getFullYear();
      m = viewMonth.getMonth();
    }

    const dk = dateKeyFromYMD(y,m,dNum);

    if(muted) cell.classList.add("muted");
    if(dk === todayKey) cell.classList.add("today");

    cell.dataset.dateKey = dk;
    cell.innerHTML = `<div class="dayNum">${dNum}</div>`;

    // dots
    const b = eventsByDate.get(dk);
    if(b){
      const dots = document.createElement("div");
      dots.className = "dots";

      // règle sobre: max 3 marqueurs
      if(b.arr > 0) dots.appendChild(Object.assign(document.createElement("span"), { className:"dot arr" }));
      if(b.dep > 0) dots.appendChild(Object.assign(document.createElement("span"), { className:"dot dep" }));
      if(b.mis > 0) dots.appendChild(Object.assign(document.createElement("span"), { className:"dot mis" }));
      if(b.res > 0 && b.arr===0 && b.dep===0) dots.appendChild(Object.assign(document.createElement("span"), { className:"dot res" }));

      // si trop d’infos ce jour-là, on affiche +N
      const totalMarks = (b.arr>0?1:0) + (b.dep>0?1:0) + (b.mis>0?1:0) + ((b.res>0 && b.arr===0 && b.dep===0)?1:0);
      const extra = (b.items?.length || 0);
      if(extra > 2){
        const more = document.createElement("span");
        more.className = "dot more";
        more.textContent = "+" + String(extra);
        dots.appendChild(more);
      }

      cell.appendChild(dots);
    }

    // clic => scroll vers la date dans la liste
    cell.addEventListener("click", ()=>{
      const target = dk;
      // si pas dans période/list => juste ignore
      const el = Array.from(planningList.querySelectorAll(".item")).find(x => x.textContent.includes(fmtDateKey(target)));
      if(el) el.scrollIntoView({ behavior:"smooth", block:"start" });
    });

    calGrid.appendChild(cell);
  }
}

/* ======================
   Firestore listeners
====================== */
function listenHomes(uid){
  if(unsubHomes) unsubHomes();

  const qh = query(
    collection(db,"homes"),
    where("ownerUid","==", uid)
  );

  unsubHomes = onSnapshot(qh, (snap)=>{
    homes = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));
    homes.sort((a,b)=> (a.name||"").localeCompare(b.name||""));
    homesById = new Map(homes.map(h=>[h.id,h]));

    fillHomes();
    refreshPlanning(); // relance events après homes
  }, (err)=>{
    console.error(err);
    showAlert("Impossible de charger tes logements pour le moment.", false);
  });
}

function listenEvents(uid, minKey, maxKey, homeIdOrAll){
  if(unsubEvents) unsubEvents();
  hideAlert();

  // Query: events ownerUid + dateKey range
  // ⚠️ nécessite souvent un index composite (ownerUid + dateKey)
  let qe = query(
    collection(db,"events"),
    where("ownerUid","==", uid),
    where("dateKey", ">=", minKey),
    where("dateKey", "<=", maxKey),
    orderBy("dateKey","asc")
  );

  // filtre logement côté client (évite index homeId)
  unsubEvents = onSnapshot(qe, (snap)=>{
    let items = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));

    if(homeIdOrAll && homeIdOrAll !== "__all__"){
      items = items.filter(x => String(x.homeId||"") === String(homeIdOrAll));
    }

    // tri stable : dateKey + time
    items.sort((a,b)=>{
      const ak = (a.dateKey||"") + " " + String(a.time||a.arrivalTime||"");
      const bk = (b.dateKey||"") + " " + String(b.time||b.arrivalTime||"");
      return ak.localeCompare(bk);
    });

    events = items;

    // subtitle
    const chosen = homeSelect.value;
    const titleHome = (chosen === "__all__")
      ? "Tous les logements"
      : (homesById.get(chosen)?.name || "Logement");
    subtitleLine.textContent = `${titleHome} • ${fmtDateKey(minKey)} → ${fmtDateKey(maxKey)}`;

    rebuildMaps();
    renderCalendar();
    renderList();
  }, (err)=>{
    console.error(err);
    const m = String(err?.message||"");
    if(m.toLowerCase().includes("permission")){
      showAlert("Accès au planning indisponible pour le moment.", false);
    }else if(m.toLowerCase().includes("index")){
      showAlert("Configuration en cours (index de données). Réessaie dans 1 minute.", false);
    }else{
      showAlert("Erreur de chargement du planning.", false);
    }
  });
}

function refreshPlanning(){
  if(!currentUser) return;
  if(!homes.length){
    events = [];
    eventsByDate = new Map();
    subtitleLine.textContent = "Aucun logement rattaché pour le moment.";
    renderCalendar();
    renderList();
    return;
  }
  const { minKey, maxKey } = computeRangeKeys();
  listenEvents(currentUser.uid, minKey, maxKey, homeSelect.value || "__all__");
}

/* ======================
   Events UI handlers
====================== */
homeSelect.addEventListener("change", ()=>{
  refreshPlanning();
});
rangeSelect.addEventListener("change", ()=>{
  refreshPlanning();
});

prevMonthBtn.addEventListener("click", ()=>{
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()-1, 1);
  renderCalendar();
});
nextMonthBtn.addEventListener("click", ()=>{
  viewMonth = new Date(viewMonth.getFullYear(), viewMonth.getMonth()+1, 1);
  renderCalendar();
});

/* ======================
   Boot
====================== */
onAuthStateChanged(auth, (user)=>{
  if(!user){
    location.href="login.html?role=proprietaire";
    return;
  }
  currentUser = user;

  // homes -> then events
  listenHomes(user.uid);

  // first paint calendar even before data
  renderCalendar();
});
</script>
