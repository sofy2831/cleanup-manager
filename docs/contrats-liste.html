<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Contrats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    :root{--violet:#7A5CFF;--violet2:#6238FF;--bg1:#F8F4FF;--bg2:#EDE6FF;--text:#111;--muted:#666;--border:rgba(122,92,255,.18);--shadow:0 14px 36px rgba(0,0,0,.08);--bad:#b3261e;--ok:#1b8f4d;--warn:#b06b00;--card:rgba(255,255,255,.88)}
    body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text)}.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 12px 88px}.topbar{width:100%;max-width:1100px;position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;gap:10px;padding:8px 0;background:rgba(248,244,255,.85);backdrop-filter:blur(6px)}
    .pill,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 11px;border-radius:999px;background:#fff;border:2px solid var(--violet);color:var(--violet);text-decoration:none;font-weight:1000;font-size:12px;box-shadow:0 3px 10px rgba(0,0,0,.06);white-space:nowrap;cursor:pointer}.primary{background:linear-gradient(90deg,var(--violet),var(--violet2));border-color:transparent;color:#fff}.danger{color:var(--bad);border-color:rgba(179,38,30,.45)}button:disabled,.btn[aria-disabled="true"]{opacity:.55;pointer-events:none}
    .logo-title{display:flex;align-items:center;gap:10px;margin:8px 0 2px}.logo-icon{width:58px;height:58px;border-radius:50%;background:#fff;border:2px solid var(--violet);display:flex;align-items:center;justify-content:center;color:var(--violet);font-weight:1000}.logo-icon img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:none}h1{margin:0;font-size:20px;font-weight:1000}.subtitle{font-size:13px;font-weight:850;color:#444}.badge{margin-top:8px;padding:4px 10px;border-radius:999px;background:#fff;font-size:12px;color:#555;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.06)}
    .wrap{width:100%;max-width:1100px;margin-top:10px;display:flex;flex-direction:column;gap:10px}.searchRow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--border);box-shadow:0 10px 22px rgba(0,0,0,.08);border-radius:18px;padding:10px}.field{flex:1;min-width:220px}label{display:block;font-size:11.8px;font-weight:1000;color:#333;margin:0 0 4px}input,select{width:100%;padding:9px 11px;border-radius:12px;border:1px solid #D3C7FF;font-size:13px;outline:none;background:#fff;font-weight:800;color:#111}.alert{display:none;margin-top:8px;padding:10px 12px;background:#fff;border-radius:14px;border-left:5px solid var(--bad);box-shadow:0 3px 10px rgba(0,0,0,.06);font-size:12px;font-weight:850;white-space:pre-wrap}.alert.ok{border-left-color:var(--ok)}
    .card{width:100%;background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.left{min-width:0;flex:1}.row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.num{font-weight:1000;font-size:13.5px}.statusPill{padding:3px 8px;border-radius:999px;background:#fff;border:1px solid rgba(0,0,0,.06);font-size:11px;font-weight:1000;color:#555}.statusPill.ok{color:var(--ok);border-color:rgba(27,143,77,.3)}.statusPill.warn{color:var(--warn);border-color:rgba(176,107,0,.25)}.statusPill.bad{color:var(--bad);border-color:rgba(179,38,30,.25)}.meta{margin-top:6px;font-size:12px;color:#222;font-weight:850;line-height:1.3;display:flex;flex-direction:column;gap:3px}.mut{color:var(--muted);font-weight:900}.right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.empty{background:#fff;border-radius:18px;padding:14px;font-weight:900;color:#555;text-align:center;box-shadow:0 10px 22px rgba(0,0,0,.08)}
    .modalMask{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px}.modal{width:100%;max-width:920px;background:#fff;border-radius:18px;box-shadow:0 20px 50px rgba(0,0,0,.25);overflow:hidden;max-height:calc(100vh - 32px);display:flex;flex-direction:column}.modalHead{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:linear-gradient(90deg,rgba(122,92,255,.14),rgba(98,56,255,.1));border-bottom:1px solid rgba(0,0,0,.06)}.modalBody{padding:14px;overflow:auto}.textBlock{white-space:pre-wrap;background:rgba(248,244,255,.55);border:1px solid var(--border);border-radius:14px;padding:12px;font-size:12.5px;font-weight:800;line-height:1.45;margin-top:12px}.kv{display:grid;grid-template-columns:130px 1fr;gap:8px 10px;margin-top:10px;font-size:12px;font-weight:900}.kv div:nth-child(odd){color:#666}.ownerBox{margin-top:12px;border:1px solid var(--border);border-radius:16px;padding:12px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.06)}.copyRow{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.modalAlert{display:none;margin-top:10px;padding:10px 12px;border-radius:14px;background:#fff;border-left:5px solid var(--bad);box-shadow:0 3px 10px rgba(0,0,0,.06);font-size:12px;font-weight:900}.modalAlert.ok{border-left-color:var(--ok)}textarea{width:100%;margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid #D3C7FF;font-weight:850;resize:vertical}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:6px;justify-content:space-around;padding:9px 10px;background:rgba(255,255,255,.92);border-top:1px solid var(--border);backdrop-filter:blur(10px)}.bottom-nav a{flex:1;text-align:center;font-size:10.8px;font-weight:1000;text-decoration:none;color:#666;padding:9px 8px;border-radius:999px;white-space:nowrap}
    @media(max-width:760px){.card{flex-direction:column}.right{width:100%;display:grid;grid-template-columns:1fr 1fr}.right .btn,.right a.btn{width:100%}.kv{grid-template-columns:1fr}.modalMask{align-items:flex-start}.copyRow{flex-direction:column}.copyRow .btn{width:100%}}
  </style>
</head>
<body>
<div class="page">
  <div class="topbar"><a class="pill" href="conciergerie.html">← Tableau de bord</a><a class="pill primary" href="contrat.html">+ Nouveau contrat</a></div>
  <div class="logo-title"><div class="logo-icon" id="logoIcon"><img id="logoImg" alt="Logo"><span id="logoFallback">C</span></div><h1 id="pageTitle">Conciergerie</h1></div>
  <div class="subtitle">Contrats</div><div class="badge" id="companyBadge">—</div>
  <div class="wrap">
    <div class="searchRow"><div class="field"><label>Statut</label><select id="filterStatus"><option value="ALL">Tous</option><option value="DRAFT">Brouillons</option><option value="SIGNED">Signés</option><option value="SENT">Envoyés</option><option value="ARCHIVED">Archivés</option></select></div><div class="field"><label>Recherche</label><input id="searchInput" placeholder="Client, email, logement, n° contrat…"></div><button class="btn" id="clearBtn">Effacer</button><button class="btn primary" id="refreshBtn">Rafraîchir</button></div>
    <div class="alert" id="alertBox"></div><div id="list"></div>
  </div>
</div>
<nav class="bottom-nav"><a href="planning.html">Planning</a><a href="prestations.html">Production</a><a href="logements.html">Logements</a><a href="import-ical.html">iCal</a><a href="messagerie.html">Messages</a></nav>
<div class="modalMask" id="sendModal"><div class="modal"><div class="modalHead"><strong id="modalTitle">Envoyer contrat</strong><button class="btn" id="closeModalBtn">Fermer</button></div><div class="modalBody"><div id="modalAlert" class="modalAlert"></div><div class="kv"><div>Client</div><div id="mClient">—</div><div>Email</div><div id="mEmail">—</div><div>Contrat</div><div id="mContract">—</div></div><div class="textBlock" id="sendText">—</div><div class="ownerBox"><strong>Publication propriétaire</strong><p class="meta">Le contrat sera visible côté propriétaire en lecture seule.</p><textarea id="pubText" rows="2" placeholder="Message optionnel"></textarea><div class="copyRow"><button class="btn" id="copyLinkBtn">Copier lien</button><button class="btn primary" id="publishBtn">Publier propriétaire</button></div></div><div class="copyRow"><button class="btn" id="emailBtn">Email</button><button class="btn" id="shareBtn">Partager</button><button class="btn primary" id="markSentBtn">Marquer envoyé</button></div></div></div></div>
<script type="module">
import { auth, db } from './firebase-init.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import { collection, query, where, orderBy, limit, getDocs, doc, getDoc, updateDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';
const $=id=>document.getElementById(id);let currentUser=null,allItems=[],modalItem=null,companyName='Conciergerie';
function esc(s){return String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function norm(s){return String(s||'').trim().toLowerCase()}function showAlert(m,ok=false){$('alertBox').style.display='block';$('alertBox').classList.toggle('ok',ok);$('alertBox').textContent=m}function hideAlert(){$('alertBox').style.display='none';$('alertBox').textContent=''}function statusLabel(s){s=String(s||'DRAFT').toUpperCase();if(s==='SIGNED')return{t:'SIGNÉ',c:'ok'};if(s==='SENT')return{t:'ENVOYÉ',c:''};if(s==='ARCHIVED')return{t:'ARCHIVÉ',c:'warn'};return{t:'BROUILLON',c:''}}function fmtDate(x){
  try{
    if(!x) return '—';
    if(x?.toDate) return x.toDate().toLocaleDateString('fr-FR');

    const s = String(x).slice(0,10);
    const p = s.split('-');
    if(p.length === 3) return `${p[2]}/${p[1]}/${p[0]}`;

    return new Date(x).toLocaleDateString('fr-FR');
  }catch{
    return '—';
  }
}
function getOwnerDocId(d){return String(d.ownerDocId||d.clientOwnerDocId||'').trim()}function getOwnerUid(d){return String(d.ownerUid||d.clientOwnerUid||'').trim()}function contractNo(d){return String(d.contractNumber||d.number||'').trim()||'—'}function canPublish(d){return !!getOwnerDocId(d)&&!!contractNo(d)}
function buildOwnerLink(id){
  const u = new URL("contrat-apercu.html", location.href);
  u.searchParams.set("docId", String(id || "").trim());
  u.searchParams.set("owner", "1");
  return u.toString();
}
function buildEmail(d){return `Objet : Contrat ${contractNo(d)}\n\n${String(d.clientName||d.ownerName||'Bonjour').trim()},\n\nVeuillez trouver votre contrat ${contractNo(d)}.\n\nMerci de bien vouloir en prendre connaissance.\n\nCordialement,\n${companyName}`}
function renderItem(it){
  const d=it.data||{},
    st=statusLabel(d.contractStatus),
    num=contractNo(d),
    client=String(d.clientName||d.ownerName||'—'),
    email=String(d.clientEmail||d.ownerEmail||''),
    home=String(d.homeName||d.homeAddress||'—'),
    created=fmtDate(d.signatureDate||d.createdAt||d.createdAtMs),
    isArchived=String(d.contractStatus||'').toUpperCase()==='ARCHIVED';

  const card=document.createElement('div');
  card.className='card';

  card.innerHTML=`<div class="left">
    <div class="row1">
      <span class="num">CONTRAT N° ${esc(num)}</span>
      <span class="statusPill ${esc(st.c)}">${esc(st.t)}</span>
     ${d.ownerVisible?'<span class="statusPill ok">PROPRIÉTAIRE</span>':''}
${d.signedByOwner?'<span class="statusPill warn">PROPRIÉTAIRE SIGNÉ</span>':''}
    </div>
    <div class="meta">
      <div><span class="mut">Client :</span> ${esc(client)}${email?` <span class="mut">•</span> ${esc(email)}`:''}</div>
      <div><span class="mut">Logement :</span> ${esc(home)}</div>
      <div><span class="mut">Date :</span> ${esc(created)}</div>
      ${!getOwnerDocId(d)?'<div style="color:#b3261e"><span class="mut" style="color:#b3261e">Envoi impossible :</span> ownerDocId manquant</div>':''}
    </div>
  </div>
  <div class="right">
   <a class="btn primary" href="contrat-apercu.html?docId=${encodeURIComponent(it.id)}&from=list">Aperçu</a>
    <a class="btn" href="contrat.html?docId=${encodeURIComponent(it.id)}">Modifier</a>
    <button class="btn" data-send="${esc(it.id)}" ${canPublish(d)?'':'aria-disabled="true"'}>Envoyer</button>
    ${isArchived ? '' : `<button class="btn danger" data-archive="${esc(it.id)}">Archiver</button>`}
  </div>`;

  card.querySelector('[data-send]')?.addEventListener('click',()=>openSendModal(it));
  card.querySelector('[data-archive]')?.addEventListener('click',()=>archiveContract(it));

  return card;
}
 async function archiveContract(it){
  if(!it?.id) return;

  const d = it.data || {};
  const num = contractNo(d);

  if(!confirm(`Archiver le contrat ${num} ?`)) return;

  try{
    await updateDoc(doc(db,'contracts',it.id),{
      contractStatus:'ARCHIVED',
      archivedAt:serverTimestamp(),
      updatedAt:serverTimestamp()
    });

    showAlert('✅ Contrat archivé.', true);
    await loadContracts(currentUser.uid);
  }catch(e){
    console.error(e);
    showAlert('⛔ '+(e?.message||'Erreur archivage'));
  }
} 
function applyFilters(){const q=norm($('searchInput').value),f=$('filterStatus').value;const rows=allItems.filter(it=>{const d=it.data||{};const st=String(d.contractStatus||'DRAFT').toUpperCase();const okF=f==='ALL'||st===f;const hay=[d.contractNumber,d.clientName,d.clientEmail,d.ownerName,d.ownerEmail,d.homeName,d.homeAddress].map(norm).join(' ');return okF&&(!q||hay.includes(q))});$('list').innerHTML='';if(!rows.length){$('list').innerHTML='<div class="empty">Aucun contrat trouvé.</div>';return}rows.forEach(it=>$('list').appendChild(renderItem(it)))}
async function loadProfile(uid){const s=await getDoc(doc(db,'users',uid));const p=s.exists()?s.data():{};const bp=p.businessProfile||{};companyName=String(bp.companyName||'Conciergerie').trim()||'Conciergerie';$('pageTitle').textContent=companyName;$('companyBadge').textContent=companyName;const logo=String(bp.logoUrl||'').trim();if(logo){$('logoImg').src=logo;$('logoImg').style.display='block';$('logoFallback').style.display='none'}}
async function loadContracts(uid){hideAlert();const qy=query(collection(db,'contracts'),where('conciergerieUid','==',uid),orderBy('createdAt','desc'),limit(400));const snap=await getDocs(qy);allItems=snap.docs.map(s=>({id:s.id,data:s.data()||{}}));applyFilters()}
async function resolveOwnerUid(ownerDocId){try{const s=await getDoc(doc(db,'owners',ownerDocId));return s.exists()?String((s.data()||{}).ownerUid||(s.data()||{}).userUid||'').trim():''}catch{return''}}
function openSendModal(it){modalItem=it;const d=it.data||{};$('modalTitle').textContent=`Envoyer — ${contractNo(d)}`;$('mClient').textContent=d.clientName||d.ownerName||'—';$('mEmail').textContent=d.clientEmail||d.ownerEmail||'—';$('mContract').textContent=contractNo(d);$('sendText').textContent=buildEmail(d);$('pubText').value='';$('modalAlert').style.display='none';$('sendModal').style.display='flex'}
async function publishOwner(){
  if(!modalItem) return;

  const d = modalItem.data || {};
  const id = modalItem.id;

  let ownerDocId = getOwnerDocId(d);
  let ownerUid = getOwnerUid(d);

  if(!ownerUid) ownerUid = await resolveOwnerUid(ownerDocId);

  if(!ownerDocId || !ownerUid){
    return modalMsg("ownerUid / ownerDocId manquant.", false);
  }

  const note = String($("pubText").value || "").trim();
  const number = contractNo(d);
  const threadId = `t_${currentUser.uid}_${ownerDocId}`;
  const nowText = note || `Votre contrat ${number} est disponible dans votre espace propriétaire.`;

  try{
    await updateDoc(doc(db, "contracts", id), {
      ownerDocId,
      ownerUid,
      ownerVisible: true,
      contractStatus: "SENT",
      sentAt: serverTimestamp(),
      ownerPublishedAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });

    // IMPORTANT : on tente la request, mais si les rules la bloquent,
    // on ne bloque PAS la messagerie.
    try{
      await setDoc(doc(db, "requests", `contract_${id}`), {
        type: "contract",
        status: "sent",
        conciergerieUid: currentUser.uid,
        ownerUid,
        ownerDocId,
        contractId: id,
        number,
        note,
        updatedAt: serverTimestamp(),
        createdAt: serverTimestamp()
      }, { merge:true });
    }catch(e){
      console.warn("Request contrat ignorée :", e?.message || e);
    }

    const tRef = doc(db, "threads", threadId);
    const tSnap = await getDoc(tRef);

    if(tSnap.exists()){
      await updateDoc(tRef, {
        lastText: nowText,
        lastAt: serverTimestamp(),
        unreadForOwner: 1,
        unreadForConciergerie: 0,
        updatedAt: serverTimestamp()
      });
    }else{
      await setDoc(tRef, {
        type: "owner",
        subject: `Contrat ${number}`,

        conciergerieUid: currentUser.uid,
        ownerUid,
        ownerDocId,

        ownerName: String(d.clientName || d.ownerName || "Propriétaire").trim(),
        ownerEmailLower: String(d.clientEmail || d.ownerEmail || "").trim().toLowerCase(),

        contractId: id,
        contractNumber: number,

        lastText: nowText,
        lastAt: serverTimestamp(),

        unreadForOwner: 1,
        unreadForConciergerie: 0,

        closed: false,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      }, { merge:true });
    }

    await setDoc(doc(db, "threads", threadId, "messages", `msg_${Date.now()}`), {
      text: nowText,
      at: serverTimestamp(),
      createdAt: serverTimestamp(),
      senderRole: "CONCIERGERIE",
      senderUid: currentUser.uid
    });

    modalMsg("✅ Contrat publié côté propriétaire + message interne envoyé.", true);
    await loadContracts(currentUser.uid);

  }catch(e){
    console.error(e);
    modalMsg("⛔ " + (e?.message || "Erreur publication"), false);
  }
}
  function modalMsg(m,ok){$('modalAlert').style.display='block';$('modalAlert').classList.toggle('ok',!!ok);$('modalAlert').textContent=m}
$('closeModalBtn').onclick=()=>$('sendModal').style.display='none';$('sendModal').onclick=e=>{if(e.target===$('sendModal'))$('sendModal').style.display='none'};$('publishBtn').onclick=publishOwner;$('copyLinkBtn').onclick=async()=>{if(!modalItem)return;await navigator.clipboard?.writeText(buildOwnerLink(modalItem.id));modalMsg('✅ Lien copié.',true)};$('emailBtn').onclick=()=>{if(!modalItem)return;const d=modalItem.data||{};location.href=`mailto:${encodeURIComponent(d.clientEmail||d.ownerEmail||'')}?subject=${encodeURIComponent('Contrat '+contractNo(d))}&body=${encodeURIComponent(buildEmail(d))}`};$('shareBtn').onclick=async()=>{if(!modalItem)return;const d=modalItem.data||{};const text=buildEmail(d);if(navigator.share)await navigator.share({title:'Contrat '+contractNo(d),text});else{await navigator.clipboard?.writeText(text);modalMsg('✅ Texte copié.',true)}};$('markSentBtn').onclick=async()=>{if(!modalItem)return;await updateDoc(doc(db,'contracts',modalItem.id),{contractStatus:'SENT',sentAt:serverTimestamp(),updatedAt:serverTimestamp()});modalMsg('✅ Contrat marqué envoyé.',true);await loadContracts(currentUser.uid)};
$('clearBtn').onclick=()=>{$('searchInput').value='';$('filterStatus').value='ALL';applyFilters()};$('refreshBtn').onclick=async()=>{await loadContracts(currentUser.uid);showAlert('✅ Liste rafraîchie.',true);setTimeout(hideAlert,1200)};$('searchInput').oninput=applyFilters;$('filterStatus').onchange=applyFilters;
onAuthStateChanged(auth,async user=>{if(!user){location.href='login.html?role=conciergerie';return}currentUser=user;try{await loadProfile(user.uid);await loadContracts(user.uid)}catch(e){console.error(e);showAlert('⛔ '+(e?.message||'Erreur chargement contrats'))}});
</script>
</body>
</html>
