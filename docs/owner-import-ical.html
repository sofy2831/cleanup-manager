<!-- docs/owner-import-ical.html (OWNER → REQUEST iCal) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – iCal logement</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.92);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --ok:#1b8f4d;
      --bad:#b3261e;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }

    .page{
      min-height:100vh;
      padding:16px;
      padding-bottom:120px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:10px;
    }
    .pill{
      padding:8px 12px;
      border-radius:999px;
      border:2px solid var(--violet-main);
      background:#fff;
      color:var(--violet-main);
      font-weight:900;
      font-size:13px;
      text-decoration:none;
    }

    h1{ font-size:22px; font-weight:900; margin:6px 0 4px; }
    .subtitle{ font-size:13px; font-weight:800; color:#444; margin-bottom:12px; }

    .wrap{ width:100%; max-width:720px; display:flex; flex-direction:column; gap:12px; }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
    }

    label{
      font-size:12px;
      font-weight:900;
      margin-bottom:4px;
      display:block;
    }
    select, input{
      width:100%;
      padding:11px 12px;
      border-radius:14px;
      border:1px solid #D3C7FF;
      font-size:14px;
      font-weight:800;
      margin-bottom:10px;
    }

    .btn{
      border:none;
      border-radius:999px;
      padding:11px 14px;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
    }

    .alert{
      display:none;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border-left:5px solid var(--bad);
      font-size:12px;
      font-weight:900;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .bottom-nav{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: calc(100% - 20px);
      max-width: 980px;
      display: flex;
      gap: 6px;
      padding: 8px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(122,92,255,0.18);
      border-bottom: none;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.08);
    }
    .bottom-nav a{
      flex:1;
      text-align:center;
      font-size:11px;
      font-weight:1000;
      padding:10px;
      border-radius:999px;
      text-decoration:none;
      color:#666;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
    }
  </style>
</head>

<body>
<div class="page">
  <div class="topbar">
    <a class="pill" href="owner-homes.html">← Logements</a>
    <a class="pill" href="owner-dashboard.html">Dashboard</a>
  </div>

  <h1>iCal logement</h1>
  <div class="subtitle">Transmettre un lien iCal à la conciergerie</div>

  <div class="wrap">
    <div class="card">
      <div class="alert" id="alertBox"></div>

      <label for="homeSelect">Logement</label>
      <select id="homeSelect">
        <option value="">Chargement…</option>
      </select>

      <label for="icalUrl">Lien iCal</label>
      <input id="icalUrl" type="url" placeholder="https://www.airbnb.com/calendar/ical/…" />

      <button class="btn primary" id="sendBtn">Envoyer à la conciergerie</button>

      <div class="subtitle" style="margin-top:10px;">
        La conciergerie validera et synchronisera le planning.
      </div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="owner-dashboard.html">Dashboard</a>
  <a href="owner-planning.html">Planning</a>
  <a href="owner-homes.html">Logements</a>
  <a class="active" href="owner-import-ical.html">iCal</a>
</nav>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { collection, query, where, onSnapshot, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const homeSelect = document.getElementById("homeSelect");
const urlInput = document.getElementById("icalUrl");
const sendBtn = document.getElementById("sendBtn");
const alertBox = document.getElementById("alertBox");

function showAlert(msg, ok=false){
  alertBox.style.display = "block";
  alertBox.classList.toggle("ok", !!ok);
  alertBox.textContent = msg;
}

let currentUser = null;
let homes = [];

onAuthStateChanged(auth, (user)=>{
  if(!user){
    location.href = "login.html?role=proprietaire";
    return;
  }
  currentUser = user;

  onSnapshot(
    query(collection(db,"homes"), where("ownerUid","==",user.uid)),
    (snap)=>{
      homes = snap.docs.map(d=>({ id:d.id, ...d.data() }));
      homeSelect.innerHTML = "";
      if(!homes.length){
        homeSelect.innerHTML = `<option value="">Aucun logement</option>`;
        homeSelect.disabled = true;
        return;
      }
      homeSelect.disabled = false;
      homeSelect.innerHTML = `<option value="">Choisir un logement…</option>`;
      homes.forEach(h=>{
        const o = document.createElement("option");
        o.value = h.id;
        o.textContent = `${h.name || "Logement"} (${h.city || ""})`;
        homeSelect.appendChild(o);
      });
    }
  );
});

sendBtn.addEventListener("click", async ()=>{
  const homeId = homeSelect.value;
  const url = urlInput.value.trim();

  if(!homeId) return showAlert("Choisis un logement.");
  if(!url || !url.startsWith("http")) return showAlert("Lien iCal invalide.");

  sendBtn.disabled = true;

  try{
    const h = homes.find(x=>x.id===homeId);
    await addDoc(collection(db,"requests"),{
      type: "ical",
      ownerUid: currentUser.uid,
      ownerEmail: currentUser.email,
      homeId,
      homeName: h?.name || "",
      message: "Lien iCal transmis par le propriétaire.",
      payload: { icalUrl: url },
      status: "pending",
      createdAt: serverTimestamp()
    });
    showAlert("✅ Lien iCal envoyé à la conciergerie.", true);
    urlInput.value = "";
  }catch(err){
    showAlert("Erreur : " + (err?.message || "inconnue"));
  }finally{
    sendBtn.disabled = false;
  }
});
</script>
</body>
</html>
