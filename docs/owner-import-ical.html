<!-- docs/owner-import-ical.html (OWNER → envoi lien iCal à la conciergerie via requests) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – iCal propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.92);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }

    .page{
      min-height:100vh;
      padding:16px;
      padding-bottom:120px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .topbar{
      width:100%;
      max-width:980px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      position:sticky;
      top:0;
      z-index:20;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter: blur(6px);
    }
    .pill{
      padding:8px 12px; border-radius:999px;
      border:2px solid var(--violet-main);
      background:#fff; color:var(--violet-main);
      font-weight:900; font-size:13px; text-decoration:none;
      cursor:pointer;
      white-space:nowrap;
      display:inline-flex; align-items:center; gap:8px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }

    .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; gap:12px; margin-top:10px; }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter: blur(10px);
    }

    h1{ font-size:22px; font-weight:900; margin:0; }
    .subtitle{ font-size:13px; font-weight:800; color:#444; margin-top:6px; line-height:1.35; }

    label{ display:block; font-size:12px; font-weight:900; color:#333; margin:10px 0 4px; }
    select, input, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      font-size:14px;
      outline:none;
      background:#fff;
      font-weight:800;
      color:#111;
    }
    textarea{ min-height:84px; resize:vertical; }
    select:focus, input:focus, textarea:focus{
      border-color:var(--violet-main);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }

    .tiny{ font-size:12px; font-weight:900; color:var(--muted); line-height:1.35; }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
    .btn{
      flex:1; min-width:170px;
      border:none; border-radius:999px;
      padding:10px 12px;
      font-size:13px; font-weight:900;
      cursor:pointer; white-space:nowrap;
      background:#fff; color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .alert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .item{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px 12px;
      border-left:5px solid rgba(122,92,255,.55);
    }
    .meta{
      display:flex; justify-content:space-between; gap:8px;
      flex-wrap:wrap;
      font-size:11px; font-weight:1000; color:#666;
      margin-bottom:6px;
    }
    .msg{ margin:0; font-size:13px; font-weight:800; color:#333; white-space:pre-wrap; line-height:1.35; }

     /* Bottom nav (4 onglets) */
    .bottom-nav{
      position:fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
  </style>
</head>

<body>
<div class="page">
  <div class="topbar">
    <a class="pill" href="owner-dashboard.html">← Dashboard</a>
    <span></span>
  </div>

  <div class="wrap">

    <div class="card">
      <h1>Synchronisation iCal</h1>
      <div class="subtitle">
        Colle ton lien iCal (Airbnb / Booking / autre).<br>
        La conciergerie fera la synchronisation et mettra à jour ton planning.
      </div>

      <div class="alert" id="alertBox"></div>

      <label for="homeSelect">Logement</label>
      <select id="homeSelect">
        <option value="">Chargement…</option>
      </select>

      <label for="icalUrl">Lien iCal</label>
      <input id="icalUrl" type="url" placeholder="https://..." autocomplete="off" />

      <label for="note">Note (optionnel)</label>
      <textarea id="note" placeholder="Ex. iCal Airbnb principal."></textarea>

      <div class="actions">
        <button class="btn primary" id="sendBtn" type="button">Envoyer à la conciergerie</button>
      </div>

      <div class="tiny" style="margin-top:10px;">
        Conseil : garde le même lien iCal dans le temps. Si tu changes, renvoie le nouveau lien ici.
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; gap:10px;">
        <div style="font-size:14px; font-weight:1000;">Historique</div>
        <div class="tiny" id="countLine">—</div>
      </div>
      <div class="alert" id="alertList"></div>
      <div id="list" class="list"></div>
    </div>

  </div>
</div>

<nav class="bottom-nav" aria-label="Navigation propriétaire">
  <a href="owner-dashboard.html">Dashboard</a>
  <a href="owner-planning.html">Planning</a>
  <a href="owner-homes.html">Logements</a>
  <a href="owner-messages.html">Messages <span class="dot" id="dotMsgBottom">0</span></a>
</nav>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  collection, query, where, orderBy, onSnapshot,
  addDoc, serverTimestamp,
  doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const alertBox = document.getElementById("alertBox");
const alertList = document.getElementById("alertList");
const countLine = document.getElementById("countLine");
const listEl = document.getElementById("list");

const homeSelect = document.getElementById("homeSelect");
const icalUrlEl = document.getElementById("icalUrl");
const noteEl = document.getElementById("note");
const sendBtn = document.getElementById("sendBtn");

const dotMsgBottom = document.getElementById("dotMsgBottom");

function showAlert(el, msg, ok=false){
  el.style.display = "block";
  el.classList.toggle("ok", !!ok);
  el.textContent = msg;
}
function hideAlert(el){
  el.style.display = "none";
  el.classList.remove("ok");
  el.textContent = "";
}
function lockUI(locked){
  sendBtn.disabled = !!locked;
  sendBtn.style.opacity = locked ? "0.7" : "1";
  sendBtn.style.cursor = locked ? "not-allowed" : "pointer";
}
function esc(s){
  return String(s ?? "")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function fmt(ts){
  try{
    const d = ts?.toDate ? ts.toDate() : new Date(ts || Date.now());
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const hh = String(d.getHours()).padStart(2,"0");
    const mi = String(d.getMinutes()).padStart(2,"0");
    return `${dd}/${mm} ${hh}:${mi}`;
  }catch{ return "—"; }
}
function setDot(el, n){
  if(!el) return;
  if(n > 0){
    el.style.display = "inline-block";
    el.textContent = String(n);
  }else{
    el.style.display = "none";
    el.textContent = "0";
  }
}
function refreshBottomBadgesFromLocal(){
  const um = Number(localStorage.getItem("cm_owner_unread_messages") || "0");
  setDot(dotMsgBottom, um);
}
window.addEventListener("focus", refreshBottomBadgesFromLocal);

let currentUser = null;
let homes = [];
let homesById = new Map();

let conciergerieUid = "";
let ownerDocId = "";

function fillHomesSelect(){
  homeSelect.innerHTML = "";

  if(!homes.length){
    const opt = document.createElement("option");
    opt.value = "";
    opt.textContent = "Aucun logement";
    homeSelect.appendChild(opt);
    homeSelect.disabled = true;
    return;
  }

  homeSelect.disabled = false;

  const opt0 = document.createElement("option");
  opt0.value = "";
  opt0.textContent = "Choisir un logement…";
  homeSelect.appendChild(opt0);

  for(const h of homes){
    const opt = document.createElement("option");
    opt.value = h.id;
    opt.textContent = `${h.name || "Logement"}${h.city ? " • " + h.city : ""}`;
    homeSelect.appendChild(opt);
  }
}

function getSelectedHome(){
  const id = homeSelect.value;
  return homesById.get(id) || null;
}

async function loadOwnerContext(user){
  try{
    const us = await getDoc(doc(db, "users", user.uid));
    const ud = us.exists() ? (us.data() || {}) : {};
    ownerDocId = String(ud.ownerDocId || "").trim();
    conciergerieUid = String(ud.conciergerieUid || "").trim();
  }catch(_){}
}

function listenHomes(user){
  onSnapshot(
    query(collection(db,"homes"), where("ownerUid","==",user.uid)),
    (snap)=>{
      homes = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));
      homes.sort((a,b)=> (a.name||"").localeCompare(b.name||""));
      homesById = new Map(homes.map(h=>[h.id,h]));
      fillHomesSelect();
    },
    (err)=> showAlert(alertBox, "Erreur lecture logements : " + (err?.message || "inconnue"))
  );
}

/**
 * Historique : on évite les indexes composites.
 * → where(ownerUid==uid) + orderBy(createdAt) suffit souvent
 * puis filtrage client-side sur type === "ical_link".
 */
function listenHistory(uid){
  hideAlert(alertList);
  listEl.innerHTML = "";

  const qh = query(
    collection(db,"requests"),
    where("ownerUid","==", uid),
    orderBy("createdAt","desc")
  );

  onSnapshot(qh, (snap)=>{
    const all = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));
    const items = all.filter(x => String(x.type||"") === "ical_link");

    countLine.textContent = String(items.length);
    listEl.innerHTML = "";

    if(!items.length){
      listEl.innerHTML = `
        <div class="item">
          <div class="meta"><span>Aucun lien envoyé</span><span>—</span></div>
          <p class="msg">Quand tu envoies un lien iCal, il apparaîtra ici.</p>
        </div>
      `;
      return;
    }

    for(const r of items){
      const homeName = String(r?.payload?.homeName || "");
      const when = fmt(r.createdAt);
      const status = String(r.status || "pending");
      const note = String(r.message || "");
      const url = String(r?.payload?.icalUrl || "");

      const el = document.createElement("div");
      el.className = "item";
      el.innerHTML = `
        <div class="meta">
          <span>${esc(homeName || r.title || "Lien iCal")}</span>
          <span>${esc(when)} • ${esc(status)}</span>
        </div>
        <p class="msg">${note ? esc(note) + "\n\n" : ""}${url ? "Lien : " + esc(url) : ""}</p>
      `;
      listEl.appendChild(el);
    }
  }, (err)=>{
    console.error(err);
    const m = String(err?.message || "");
    showAlert(alertList, "Erreur chargement historique : " + m, false);
  });
}

sendBtn.addEventListener("click", async ()=>{
  hideAlert(alertBox);

  const home = getSelectedHome();
  const url = (icalUrlEl.value || "").trim();
  const note = (noteEl.value || "").trim();

  if(!currentUser) return showAlert(alertBox, "Pas connecté.");
  if(!home) return showAlert(alertBox, "Choisis un logement.");
  if(!url) return showAlert(alertBox, "Colle un lien iCal.");
  if(!/^https?:\/\//i.test(url)) return showAlert(alertBox, "Lien iCal invalide (il doit commencer par http/https).");

  lockUI(true);
  try{
    await addDoc(collection(db,"requests"), {
      ownerUid: currentUser.uid,                 // conforme à tes rules
      ownerDocId: ownerDocId || "",
      ownerEmail: currentUser.email || "",
      conciergerieUid: conciergerieUid || (home.conciergerieUid || ""),
      type: "ical_link",
      title: `Lien iCal – ${home.name || "Logement"}`,
      message: note ? note : "Voici mon lien iCal pour synchroniser mes réservations.",
      payload: {
        homeId: home.id,
        homeName: home.name || "",
        icalUrl: url
      },
      status: "pending",
      createdAt: serverTimestamp()
    });

    showAlert(alertBox, "✅ Lien envoyé à la conciergerie.", true);
  }catch(err){
    console.error(err);
    showAlert(alertBox, "Erreur envoi : " + (err?.message || "inconnue"));
  }finally{
    lockUI(false);
  }
});

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.href = "login.html?role=proprietaire";
    return;
  }
  currentUser = user;

  await loadOwnerContext(user);
  listenHomes(user);
  listenHistory(user.uid);

  refreshBottomBadgesFromLocal();
});
</script>
</body>
</html>
