<!-- docs/owner-homes.html (OWNER — logements + demande ajout) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Mes logements</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --ok:#1b8f4d;
      --bad:#b3261e;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }

    .page{ min-height:100vh; padding:16px; padding-bottom:120px; display:flex; flex-direction:column; align-items:center; }
    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:20;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter: blur(6px);
    }
    .pill{
      padding:8px 12px; border-radius:999px;
      border:2px solid var(--violet-main);
      background:#fff; color:var(--violet-main);
      font-weight:900; font-size:13px; text-decoration:none;
      cursor:pointer;
    }

    .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; gap:12px; margin-top:10px; }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter: blur(10px);
    }

    h1{ margin:0; font-size:20px; font-weight:900; }
    .subtitle{ margin-top:6px; font-size:12px; font-weight:900; color:#444; white-space:pre-wrap; }

    .list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .item{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px 12px;
      border-left:5px solid rgba(122,92,255,.55);
    }
    .meta{
      display:flex; justify-content:space-between; gap:8px;
      flex-wrap:wrap;
      font-size:11px; font-weight:1000; color:#666;
      margin-bottom:6px;
    }
    .msg{ margin:0; font-size:13px; font-weight:800; color:#333; white-space:pre-wrap; line-height:1.35; }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
    .btn{
      border:none; border-radius:999px;
      padding:10px 12px;
      font-size:13px; font-weight:900;
      cursor:pointer; white-space:nowrap;
      background:#fff; color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-decoration:none;
      display:inline-flex; align-items:center; justify-content:center;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
    }

    label{ display:block; font-size:12px; font-weight:900; color:#333; margin:10px 0 4px; }
    input, select, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      font-size:14px;
      outline:none;
      background:#fff;
      font-weight:800;
      color:#111;
    }
    textarea{ min-height:90px; resize:vertical; }

    .alert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    /* bottom nav */
    .bottom-nav{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: calc(100% - 20px);
      max-width: 980px;
      display: flex;
      gap: 6px;
      padding: 8px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(122,92,255,0.18);
      border-bottom: none;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter: blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1;
      text-align:center;
      font-size:11px;
      font-weight:1000;
      padding:10px;
      border-radius:999px;
      text-decoration:none;
      color:#666;
      position:relative;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
  </style>
</head>

<body>
<div class="page">
  <div class="topbar">
    <a class="pill" href="owner-dashboard.html#logements">← Dashboard</a>
    <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
  </div>

  <div class="wrap">
    <div class="card">
      <h1>Mes logements</h1>
      <div class="subtitle">Logements rattachés à ton compte propriétaire.</div>

      <div id="homesList" class="list"></div>
      <div id="emptyHomes" class="item" style="display:none;">
        <div class="meta"><span>Aucun logement</span><span>—</span></div>
        <p class="msg">Aucun logement n’est encore rattaché à ton compte.</p>
      </div>
    </div>

    <div class="card">
      <h1>Demander l’ajout d’un logement</h1>
      <div class="subtitle">La conciergerie recevra ta demande.</div>

      <div class="alert" id="alertBox"></div>

      <label for="homeName">Nom du logement</label>
      <input id="homeName" placeholder="Ex. T2 Centre" />

      <label for="homeCity">Ville</label>
      <input id="homeCity" placeholder="Ex. Toulouse" />

      <label for="homeType">Type</label>
      <select id="homeType">
        <option>Studio</option><option>T1</option><option>T2</option>
        <option>T3</option><option>T4 et +</option><option>Maison</option>
      </select>

      <label for="homeMsg">Message (optionnel)</label>
      <textarea id="homeMsg" placeholder="Infos utiles (accès, contraintes, etc.)"></textarea>

      <div class="actions">
        <button class="btn primary" id="sendBtn">Envoyer la demande</button>
      </div>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="owner-dashboard.html">Dashboard</a>
  <a class="active" href="owner-homes.html">Logements</a>
  <a href="owner-messages.html">Messages</a>
</nav>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  collection, query, where, onSnapshot,
  addDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const logoutBtn = document.getElementById("logoutBtn");
const homesList = document.getElementById("homesList");
const emptyHomes = document.getElementById("emptyHomes");
const alertBox = document.getElementById("alertBox");

const sendBtn = document.getElementById("sendBtn");
const homeName = document.getElementById("homeName");
const homeCity = document.getElementById("homeCity");
const homeType = document.getElementById("homeType");
const homeMsg  = document.getElementById("homeMsg");

function showAlert(msg, ok=false){
  alertBox.style.display="block";
  alertBox.classList.toggle("ok",!!ok);
  alertBox.textContent=msg;
}
function hideAlert(){
  alertBox.style.display="none";
  alertBox.textContent="";
}
function lock(btn, l){
  btn.disabled=l; btn.style.opacity=l?"0.7":"1";
}

logoutBtn.onclick = async ()=>{
  await signOut(auth);
  location.href="index.html";
};

onAuthStateChanged(auth, (user)=>{
  if(!user){
    location.href="login.html?role=proprietaire";
    return;
  }

  // 🔹 LISTE DES LOGEMENTS
  onSnapshot(
    query(collection(db,"homes"), where("ownerUid","==",user.uid)),
    (snap)=>{
      homesList.innerHTML="";
      if(snap.empty){
        emptyHomes.style.display="block";
        return;
      }
      emptyHomes.style.display="none";

      snap.forEach(d=>{
        const h = d.data();
        const el = document.createElement("div");
        el.className="item";
        el.innerHTML=`
          <div class="meta">
            <span>${h.name||"Logement"} • ${h.city||""}</span>
            <span>${h.type||""}</span>
          </div>
          <p class="msg">${h.homeAddress||h.address||"Adresse non renseignée"}</p>
          <div class="actions">
            <a class="btn primary" href="owner-planning.html?homeId=${d.id}">Voir planning</a>
          </div>
        `;
        homesList.appendChild(el);
      });
    }
  );

  // 🔹 DEMANDE AJOUT LOGEMENT
  sendBtn.onclick = async ()=>{
    hideAlert();
    if(!homeName.value || !homeCity.value){
      return showAlert("Nom et ville requis.");
    }
    lock(sendBtn,true);
    try{
      await addDoc(collection(db,"requests"),{
        ownerUid:user.uid,
        ownerEmail:user.email,
        type:"add_home",
        title:`Ajout logement – ${homeName.value}`,
        message:homeMsg.value||"",
        payload:{
          name:homeName.value,
          city:homeCity.value,
          type:homeType.value
        },
        status:"pending",
        createdAt:serverTimestamp()
      });
      showAlert("✅ Demande envoyée.",true);
      homeName.value=""; homeCity.value=""; homeMsg.value="";
      homeType.value="Studio";
    }catch(e){
      showAlert("Erreur : "+e.message);
    }finally{
      lock(sendBtn,false);
    }
  };
});
</script>
</body>
</html>
