<!-- docs/owner-homes.html (LECTURE + DEMANDE) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Mes logements</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.92);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }

    .page{
      min-height:100vh;
      padding:16px;
      padding-bottom:120px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center;
      margin-bottom:10px;
    }
    .pill{
      padding:8px 12px;
      border-radius:999px;
      border:2px solid var(--violet-main);
      background:#fff;
      color:var(--violet-main);
      font-weight:900;
      font-size:13px;
      text-decoration:none;
    }

    h1{ font-size:22px; font-weight:900; margin:6px 0 4px; }
    .subtitle{ font-size:13px; font-weight:800; color:#444; margin-bottom:12px; }

    .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; gap:12px; }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
    }

    .list{ display:flex; flex-direction:column; gap:10px; }

    .item{
      background:#fff;
      border-radius:14px;
      padding:12px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      border-left:5px solid var(--violet-main);
    }
    .meta{
      display:flex; justify-content:space-between;
      font-size:12px; font-weight:900; color:#666;
      margin-bottom:6px;
    }
    .title{
      font-size:14px;
      font-weight:900;
      margin-bottom:4px;
    }
    .addr{
      font-size:13px;
      font-weight:800;
      color:#333;
    }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:8px;
    }
    .btn{
      flex:1;
      min-width:140px;
      padding:9px 12px;
      border-radius:999px;
      border:2px solid var(--violet-main);
      background:#fff;
      color:var(--violet-main);
      font-size:12px;
      font-weight:900;
      text-align:center;
      text-decoration:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      border-color:transparent;
    }

    /* bottom nav */
    .bottom-nav{
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      bottom: 0;
      width: calc(100% - 20px);
      max-width: 980px;
      display: flex;
      gap: 6px;
      padding: 8px;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(122,92,255,0.18);
      border-bottom: none;
      border-radius: 22px 22px 0 0;
      box-shadow: 0 -6px 20px rgba(0,0,0,0.08);
    }
    .bottom-nav a{
      flex:1;
      text-align:center;
      font-size:11px;
      font-weight:1000;
      padding:10px;
      border-radius:999px;
      text-decoration:none;
      color:#666;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
    }
  </style>
</head>

<body>
<div class="page">
  <div class="topbar">
    <a class="pill" href="owner-dashboard.html">← Dashboard</a>
    <a class="pill" href="owner-planning.html">Planning</a>
  </div>

  <h1>Mes logements</h1>
  <div class="subtitle">Logements gérés par la conciergerie</div>

  <div class="wrap">
    <div class="card">
      <div class="list" id="homesList"></div>
    </div>

    <div class="card">
      <strong>Ajouter un logement ?</strong>
      <p class="subtitle">
        La conciergerie doit valider. Tu peux lui envoyer une demande.
      </p>
      <a class="btn primary" href="owner-messages.html">
        Contacter la conciergerie
      </a>
    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="owner-dashboard.html">Dashboard</a>
  <a href="owner-planning.html">Planning</a>
  <a class="active" href="owner-homes.html">Logements</a>
  <a href="owner-facturation.html">Facturation</a>
</nav>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const list = document.getElementById("homesList");

onAuthStateChanged(auth, (user)=>{
  if(!user){
    location.href = "login.html?role=proprietaire";
    return;
  }

  onSnapshot(
    query(collection(db,"homes"), where("ownerUid","==",user.uid)),
    (snap)=>{
      list.innerHTML = "";
      if(snap.empty){
        list.innerHTML = `
          <div class="item">
            <div class="title">Aucun logement</div>
            <div class="addr">Contacte la conciergerie pour en ajouter.</div>
          </div>`;
        return;
      }

      snap.docs.forEach(d=>{
        const h = d.data();
        const el = document.createElement("div");
        el.className = "item";
        el.innerHTML = `
          <div class="meta">
            <span>${h.type || "Logement"}</span>
            <span>${h.city || ""}</span>
          </div>
          <div class="title">${h.name || "Logement"}</div>
          <div class="addr">${h.homeAddress || h.address || ""}</div>
          <div class="actions">
            <a class="btn primary" href="owner-planning.html?homeId=${d.id}">
              Voir planning
            </a>
            <a class="btn" href="owner-import-ical.html?homeId=${d.id}">
              Ajouter iCal
            </a>
          </div>
        `;
        list.appendChild(el);
      });
    }
  );
});
</script>
</body>
</html>
