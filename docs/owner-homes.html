<!-- docs/owner-homes.html (FINAL — owner guard + add_home request + homes list tenant-safe) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Logements</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --ok:#1b8f4d;
      --bad:#b3261e;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }

    .page{
      min-height:100vh;
      padding:16px;
      padding-bottom:120px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .topbar{
      width:100%;
      max-width:980px;
      display:flex;
      justify-content:flex-start;
      align-items:center;
      position:sticky;
      top:0;
      z-index:20;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter: blur(6px);
    }
    .pill{
      padding:8px 12px;
      border-radius:999px;
      border:2px solid var(--violet-main);
      background:#fff;
      color:var(--violet-main);
      font-weight:900;
      font-size:13px;
      text-decoration:none;
      cursor:pointer;
    }

    .wrap{
      width:100%;
      max-width:980px;
      display:flex;
      flex-direction:column;
      gap:12px;
      margin-top:10px;
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter: blur(10px);
    }

    h1{ margin:0; font-size:20px; font-weight:900; }
    .subtitle{ margin-top:6px; font-size:12px; font-weight:900; color:#444; }

    label{
      display:block;
      font-size:12px;
      font-weight:900;
      color:#333;
      margin:10px 0 4px;
    }
    input, select, textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      font-size:14px;
      background:#fff;
      font-weight:800;
    }
    textarea{ min-height:90px; resize:vertical; }

    .actions{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }

    .btn{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .alert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:10px;
    }
    .item{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px;
      border-left:5px solid rgba(122,92,255,.55);
    }
    .meta{
      display:flex;
      justify-content:space-between;
      gap:8px;
      flex-wrap:wrap;
      font-size:11px;
      font-weight:1000;
      color:#666;
      margin-bottom:6px;
    }
    .msg{
      margin:0;
      font-size:13px;
      font-weight:800;
      color:#333;
    }

    .bottom-nav{
      position:fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
  </style>
</head>

<body>
<div class="page">

  <div class="topbar">
    <a class="pill" href="owner-dashboard.html">← Dashboard</a>
  </div>

  <div class="wrap">

    <div class="card">
      <h1>Ajouter un logement</h1>
      <div class="subtitle">Demande d’ajout à transmettre à la conciergerie</div>

      <div class="alert" id="alertBox"></div>

      <label>Nom du logement</label>
      <input id="homeName" placeholder="Ex. T2 Centre" />

      <label>Ville</label>
      <input id="homeCity" placeholder="Ex. Toulouse" />

      <label>Type</label>
      <select id="homeType">
        <option>Studio</option>
        <option>T1</option>
        <option>T2</option>
        <option>T3</option>
        <option>T4 et +</option>
        <option>Maison</option>
      </select>

      <label>Message (optionnel)</label>
      <textarea id="homeMsg" placeholder="Informations utiles"></textarea>

      <div class="actions">
        <button class="btn primary" id="sendBtn">Envoyer</button>
      </div>
    </div>

    <div class="card">
      <h1>Mes logements</h1>

      <div id="homesList" class="list"></div>

      <div id="emptyHomes" class="item" style="display:none;">
        <div class="meta"><span>Aucun logement</span><span>—</span></div>
        <p class="msg">Aucun logement n’est encore visible.</p>
      </div>
    </div>

  </div>
</div>

<nav class="bottom-nav">
  <a href="owner-dashboard.html">Dashboard</a>
  <a href="owner-planning.html">Planning</a>
  <a class="active" href="owner-homes.html">Logements</a>
  <a href="owner-messages.html">Messages</a>
</nav>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  collection, query, where, onSnapshot,
  addDoc, serverTimestamp, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const homesList = document.getElementById("homesList");
const emptyHomes = document.getElementById("emptyHomes");
const alertBox = document.getElementById("alertBox");

const sendBtn = document.getElementById("sendBtn");
const homeName = document.getElementById("homeName");
const homeCity = document.getElementById("homeCity");
const homeType = document.getElementById("homeType");
const homeMsg  = document.getElementById("homeMsg");

function showAlert(msg, ok=false){
  alertBox.style.display="block";
  alertBox.classList.toggle("ok",!!ok);
  alertBox.textContent=msg;
}
function hideAlert(){ alertBox.style.display="none"; alertBox.classList.remove("ok"); alertBox.textContent=""; }
function lock(btn,l){ btn.disabled=l; btn.style.opacity=l?"0.7":"1"; }

function esc(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

let unsubHomes = null;

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.href="login.html?role=proprietaire";
    return;
  }

  hideAlert();

  // Source de vérité users/{uid}
  let ownerDocId = "";
  let conciergerieUid = "";
  try{
    const us = await getDoc(doc(db,"users", user.uid));
    const ud = us.exists() ? (us.data()||{}) : {};
    ownerDocId = String(ud.ownerDocId || "").trim();
    conciergerieUid = String(ud.conciergerieUid || "").trim();
  }catch(_){}

  if(unsubHomes) unsubHomes();
  unsubHomes = null;

  // Si non rattaché : on peut encore afficher via fallback ownerUid, mais on prévient
  if(!ownerDocId || !conciergerieUid){
    showAlert("⚠️ Ton compte n’est pas encore rattaché (ownerDocId/conciergerieUid). Va sur Profil puis Enregistrer.", false);
  }

  // Query principale : homes liés via ownerDocId + conciergerieUid
  // Fallback : homes.ownerUid == auth.uid (anciens docs)
  const qHomes = (ownerDocId && conciergerieUid)
    ? query(
        collection(db,"homes"),
        where("conciergerieUid","==", conciergerieUid),
        where("ownerDocId","==", ownerDocId)
      )
    : query(
        collection(db,"homes"),
        where("ownerUid","==", user.uid)
      );

  unsubHomes = onSnapshot(qHomes, (snap)=>{
    homesList.innerHTML="";
    if(snap.empty){
      emptyHomes.style.display="block";
      return;
    }
    emptyHomes.style.display="none";

    const rows = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));
    rows.sort((a,b)=> (b.createdAt?.seconds ?? 0) - (a.createdAt?.seconds ?? 0));

    for(const h of rows){
      const name = h.name || h.label || h.homeName || "Logement";
      const city = h.homeCity || h.city || "";
      const type = h.homeType || h.type || "";
      const addr = h.homeAddress || h.address || "Adresse non renseignée";
      const cp = h.homeZip || h.zip || "";

      const el = document.createElement("div");
      el.className="item";
      el.innerHTML=`
        <div class="meta">
          <span>${esc(name)}${city ? " • " + esc(city) : ""}${cp ? " (" + esc(cp) + ")" : ""}</span>
          <span>${esc(type || "—")}</span>
        </div>
        <p class="msg">${esc(addr)}</p>
      `;
      homesList.appendChild(el);
    }
  }, (err)=>{
    console.error(err);
    showAlert("Impossible de charger tes logements.", false);
  });

  // Demande ajout logement (routage conciergerie)
  sendBtn.onclick = async ()=>{
    hideAlert();

    if(!ownerDocId || !conciergerieUid){
      return showAlert(
        "Ton compte n’est pas encore rattaché correctement (ownerDocId/conciergerieUid manquant).\n" +
        "Va sur Profil puis Enregistrer.",
        false
      );
    }

    if(!homeName.value.trim() || !homeCity.value.trim()){
      return showAlert("Nom et ville requis.", false);
    }

    lock(sendBtn,true);
    try{
      await addDoc(collection(db,"requests"),{
        conciergerieUid,
        ownerDocId,
        ownerUid: user.uid,
        ownerEmail: user.email || "",
        type:"home_add",
        title:`Ajout logement – ${homeName.value.trim()}`,
        message:(homeMsg.value||"").trim(),
        payload:{
          name:homeName.value.trim(),
          city:homeCity.value.trim(),
          type:homeType.value
        },
        status:"pending",
        createdAt:serverTimestamp(),
        createdAtMs: Date.now()
      });

      showAlert("✅ Demande envoyée.",true);
      homeName.value=""; homeCity.value=""; homeMsg.value=""; homeType.value="Studio";
    }catch(e){
      console.error(e);
      showAlert("Erreur : "+(e?.message||"inconnue"));
    }finally{
      lock(sendBtn,false);
    }
  };
});
</script>
</body>
</html>
