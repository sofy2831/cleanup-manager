<!-- docs/missionfini.html (SIMPLE — recap via URL params, no Firebase) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mission terminée</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF; --violet-dark:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.92);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card{
      width:100%; max-width:560px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:18px;
      text-align:center;
    }
    .icon{
      width:56px; height:56px; border-radius:50%;
      display:inline-flex; align-items:center; justify-content:center;
      background:#fff; border:2px solid var(--violet-main);
      color:var(--violet-main); font-weight:900; font-size:24px;
      margin-bottom:10px;
    }
    h1{ margin:0; font-size:20px; font-weight:900; letter-spacing:-0.2px; }
    p{ margin:8px 0 0; font-size:13px; font-weight:800; color:#444; line-height:1.4; }

    .recap{
      margin-top:12px;
      text-align:left;
      background:#fff;
      border:1px dashed rgba(122,92,255,0.22);
      border-radius:14px;
      padding:12px;
      box-shadow:0 3px 10px rgba(0,0,0,0.06);
      display:none;
    }
    .row{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-bottom:1px solid rgba(0,0,0,0.05); }
    .row:last-child{ border-bottom:none; }
    .k{ font-size:12px; font-weight:900; color:#333; }
    .v{ font-size:12px; font-weight:900; color:#111; text-align:right; white-space:pre-wrap; }
    .tiny{ margin-top:10px; font-size:12px; font-weight:800; color:var(--muted); }

    .actions{
      margin-top:14px;
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }
    .btn{
      border:none;
      border-radius:999px;
      padding:10px 12px;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
    }
    .btn.ghost{
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="icon">✓</div>
      <h1>Mission terminée ✅</h1>
      <p>Merci, votre intervention a bien été enregistrée.</p>
      <p>En attente de validation par la conciergerie.</p>

      <div class="recap" id="recapBox" aria-label="Récapitulatif">
        <div class="row"><div class="k">Logement</div><div class="v" id="rHome">—</div></div>
        <div class="row"><div class="k">Date</div><div class="v" id="rDate">—</div></div>
        <div class="row"><div class="k">Heure</div><div class="v" id="rTime">—</div></div>
        <div class="row"><div class="k">Agent</div><div class="v" id="rAgent">—</div></div>
        <div class="row"><div class="k">ID prestation</div><div class="v" id="rPresta">—</div></div>
      </div>

      <div class="actions">
        <button class="btn ghost" id="copyBtn" type="button" disabled>Copier le récap</button>
        <button class="btn primary" id="closeBtn" type="button">Fermer</button>
      </div>

      <div class="tiny" id="tinyLine">Vous pouvez fermer cette page.</div>
    </div>
  </div>

  <script>
    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
    function clean(s){ return String(s||"").trim(); }

    const home = clean(qs("home"));
    const date = clean(qs("date"));
    const time = clean(qs("time"));
    const agent = clean(qs("agent"));
    const prestationId = clean(qs("prestationId"));

    const recapBox = document.getElementById("recapBox");
    const rHome = document.getElementById("rHome");
    const rDate = document.getElementById("rDate");
    const rTime = document.getElementById("rTime");
    const rAgent = document.getElementById("rAgent");
    const rPresta = document.getElementById("rPresta");

    const copyBtn = document.getElementById("copyBtn");
    const closeBtn = document.getElementById("closeBtn");
    const tinyLine = document.getElementById("tinyLine");

    const hasAny = !!(home || date || time || agent || prestationId);

    if(hasAny){
      recapBox.style.display = "block";
      rHome.textContent = home || "—";
      rDate.textContent = date || "—";
      rTime.textContent = time || "—";
      rAgent.textContent = agent || "—";
      rPresta.textContent = prestationId || "—";
      copyBtn.disabled = false;
    }else{
      recapBox.style.display = "none";
      copyBtn.disabled = true;
    }

    function buildRecapText(){
      const lines = [
        "Mission terminée",
        home ? ("Logement: " + home) : null,
        date ? ("Date: " + date) : null,
        time ? ("Heure: " + time) : null,
        agent ? ("Agent: " + agent) : null,
        prestationId ? ("ID prestation: " + prestationId) : null
      ].filter(Boolean);
      return lines.join("\n");
    }

    copyBtn.addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText(buildRecapText());
        tinyLine.textContent = "Récap copié.";
        setTimeout(()=> tinyLine.textContent = "Vous pouvez fermer cette page.", 1200);
      }catch(e){
        tinyLine.textContent = "Copie impossible : copie manuelle.";
        setTimeout(()=> tinyLine.textContent = "Vous pouvez fermer cette page.", 1600);
      }
    });

    closeBtn.addEventListener("click", ()=>{
      // Certaines WebViews/PWA autorisent, sinon ça ne fait rien : on garde le fallback texte.
      window.close();
      tinyLine.textContent = "Si la fenêtre ne se ferme pas, fermez l’onglet.";
    });
  </script>
</body>
</html>
