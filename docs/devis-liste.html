<!-- docs/devis-liste.html (LISTE UNIQUE — devis logement (events) + devis prospect (salesDocuments) — actions: Ouvrir / Accepter / Passer en facture) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Devis (liste)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-light:#F3ECFF;
      --violet-mid:#DCCBFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; padding:16px 12px 26px; max-width:1100px; margin:0 auto; }

    .topbar{
      position:sticky; top:0; z-index:10;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
      padding:10px 0; display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .pill-link{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main);
      color:var(--violet-main); text-decoration:none;
      font-weight:900; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .header{
      margin-top:8px;
      display:flex; align-items:flex-start; justify-content:space-between; gap:10px; flex-wrap:wrap;
    }
    h1{ margin:0; font-size:22px; font-weight:1000; }
    .sub{ margin-top:4px; color:#444; font-weight:800; font-size:13px; }

    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      border:none; border-radius:999px; padding:10px 12px;
      font-size:13px; font-weight:1000; cursor:pointer;
      background:#fff; color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }
    .btn.small{ padding:8px 10px; font-size:12.5px; }

    .toolbar{
      margin-top:12px;
      display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:space-between;
    }
    .tabs{
      display:flex; gap:8px; flex-wrap:wrap;
      background:#fff; border:1px solid var(--border); border-radius:999px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:6px;
    }
    .tab{
      border:none; cursor:pointer;
      padding:8px 10px; border-radius:999px;
      font-weight:1000; font-size:12.5px;
      background:transparent; color:#444;
      white-space:nowrap;
    }
    .tab.active{ background:var(--violet-light); color:#4c3ac3; }

    .search{
      flex:1; min-width:220px;
      display:flex; gap:8px; align-items:center;
      background:#fff; border:1px solid var(--border);
      border-radius:999px; padding:8px 12px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .search input{
      border:none; outline:none; width:100%;
      font-weight:800; font-size:13px; background:transparent;
    }
    .hint{ color:var(--muted); font-size:12px; font-weight:800; }

    .alert{
      margin-top:12px; padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
      font-weight:850;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .list{ margin-top:12px; display:flex; flex-direction:column; gap:10px; }

    .card{
      background:rgba(255,255,255,0.90);
      border:1px solid var(--border);
      border-radius:18px; box-shadow:var(--shadow);
      padding:12px 12px 10px;
    }
    .rowTop{
      display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
    }
    .left{ min-width:0; }
    .title{
      font-weight:1000; font-size:14px; color:#111;
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    }
    .meta{
      margin-top:4px; color:#444; font-weight:850; font-size:12.5px; line-height:1.35;
    }
    .meta .mut{ color:var(--muted); font-weight:900; }
    .badge{
      display:inline-flex; align-items:center; justify-content:center;
      padding:4px 9px; border-radius:999px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.08);
      font-weight:1000; font-size:11.5px; color:#444;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .badge.ok{ background:rgba(27,143,77,.08); border-color:rgba(27,143,77,.2); color:#0f6f38; }
    .badge.warn{ background:rgba(179,38,30,.06); border-color:rgba(179,38,30,.18); color:#8b1f18; }
    .badge.violet{ background:rgba(122,92,255,.10); border-color:rgba(122,92,255,.22); color:#4c3ac3; }

    .actions{
      margin-top:10px;
      display:flex; gap:8px; flex-wrap:wrap;
    }
    .actions .btn{ flex:1; min-width:160px; }
    @media(min-width:860px){
      .actions .btn{ flex:0; min-width:auto; }
    }

    /* Modal actions Ouvrir -> (Ouvrir / Aperçu / Supprimer) */
    .modalOverlay{
      position:fixed; inset:0; display:none; align-items:center; justify-content:center;
      background:rgba(0,0,0,.35); z-index:100;
      padding:14px;
    }
    .modal{
      width:100%; max-width:520px;
      background:#fff; border-radius:18px;
      border:1px solid rgba(0,0,0,0.08);
      box-shadow:0 18px 50px rgba(0,0,0,.18);
      padding:12px;
    }
    .modalTitle{ font-weight:1000; font-size:14px; }
    .modalSub{ margin-top:4px; font-size:12.5px; font-weight:850; color:#555; line-height:1.35; }
    .modalBtns{ margin-top:12px; display:flex; gap:8px; flex-wrap:wrap; }
    .modalBtns .btn{ flex:1; }
    .btn.red{ border-color: rgba(179,38,30,.35); color:var(--bad); background:#fff; }
    .btn.red:hover{ background:rgba(179,38,30,.06); }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:11px; font-weight:1000; text-decoration:none;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 980px){
      .bottom-nav{
        position: static; margin-top:12px;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 26px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" href="compta.html">← Comptabilité</a>
      <a class="pill-link" href="devis-free.html">+ Devis prospect</a>
    </div>

    <div class="header">
      <div>
        <h1>Devis</h1>
        <div class="sub">Devis logement (planning) + devis prospect (libre)</div>
      </div>
    </div>

    <div class="toolbar">
      <div class="tabs" role="tablist" aria-label="Filtre devis">
        <button class="tab active" id="tabAll" type="button" data-mode="ALL">Tous</button>
        <button class="tab" id="tabEvent" type="button" data-mode="EVENT">Logement</button>
        <button class="tab" id="tabFree" type="button" data-mode="FREE">Prospect</button>
      </div>

      <div class="search">
        <input id="q" type="text" placeholder="Rechercher (client, n°, logement…)" />
        <span class="hint" id="countLabel">0</span>
      </div>
    </div>

    <div class="alert" id="alertBox"></div>
    <div class="list" id="list"></div>

    <nav class="bottom-nav" aria-label="Navigation">
      <a href="planning.html">Planning</a>
      <a href="import-ical.html">iCal</a>
      <a href="messagerie.html">Messages</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="logements.html">Logements</a>
    </nav>
  </div>

  <!-- Modal Ouvrir -->
  <div class="modalOverlay" id="modalOverlay">
    <div class="modal" role="dialog" aria-modal="true" aria-label="Actions devis">
      <div class="modalTitle" id="mTitle">—</div>
      <div class="modalSub" id="mSub">—</div>
      <div class="modalBtns">
        <button class="btn primary" id="mOpenBtn" type="button">Ouvrir</button>
        <button class="btn" id="mPreviewBtn" type="button">Aperçu</button>
        <button class="btn red" id="mDeleteBtn" type="button">Supprimer</button>
        <button class="btn" id="mCloseBtn" type="button">Fermer</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, getDocs, orderBy, limit,
      doc, getDoc, updateDoc, deleteDoc, serverTimestamp, runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ===== UI =====
    const listEl = document.getElementById("list");
    const alertBox = document.getElementById("alertBox");
    const qEl = document.getElementById("q");
    const countLabel = document.getElementById("countLabel");

    const tabs = Array.from(document.querySelectorAll(".tab"));

    const modalOverlay = document.getElementById("modalOverlay");
    const mTitle = document.getElementById("mTitle");
    const mSub = document.getElementById("mSub");
    const mOpenBtn = document.getElementById("mOpenBtn");
    const mPreviewBtn = document.getElementById("mPreviewBtn");
    const mDeleteBtn = document.getElementById("mDeleteBtn");
    const mCloseBtn = document.getElementById("mCloseBtn");

    // ===== State =====
    let currentUser = null;
    let mode = "ALL";  // ALL | EVENT | FREE
    let items = [];    // unified rows

    // selected item for modal
    let modalItem = null;

    // ===== Helpers =====
    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function money(n){
      const x = Number(n||0);
      if(!Number.isFinite(x)) return "—";
      return x.toLocaleString("fr-FR", { minimumFractionDigits:2, maximumFractionDigits:2 }) + " €";
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

    function quoteStatusLabel(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return "—";
      if(x === "DRAFT") return "BROUILLON";
      if(x === "SENT") return "DEVIS ENVOYÉ";
      if(x === "ACCEPTED") return "ACCEPTÉ";
      if(x === "REFUSED") return "REFUSÉ";
      return x;
    }
    function isAccepted(d){ return String(d?.quoteStatus||"").toUpperCase().trim() === "ACCEPTED"; }

    function canAccept(d){
      // ta règle : "Accepter" peut partir de DRAFT (et ça déclenche auto envoyé)
      const s = String(d?.quoteStatus||"").toUpperCase().trim();
      return (s === "DRAFT" || s === "SENT");
    }

    async function ensureQuoteNumber(uid, year){
      const counterId = `${uid}_${year}`;
      const counterRef = doc(db, "counters", counterId);

      const next = await runTransaction(db, async (tx)=>{
        const snap = await tx.get(counterRef);
        if(!snap.exists()){
          tx.set(counterRef, { quoteSeq: 0, invoiceSeq: 0, creditSeq: 0 });
        }
        const c = snap.exists() ? (snap.data() || {}) : { quoteSeq: 0 };
        const n = (Number(c.quoteSeq)||0) + 1;
        tx.set(counterRef, { ...c, quoteSeq: n }, { merge:true });
        return n;
      });

      const padded = String(next).padStart(4,"0");
      return `D${year}-${padded}`;
    }

    function setMode(newMode){
      mode = newMode;
      tabs.forEach(t => t.classList.toggle("active", t.dataset.mode === mode));
      render();
    }

    function openModal(item){
      modalItem = item;
      mTitle.textContent = item.title;
      mSub.textContent = item.sub;
      modalOverlay.style.display = "flex";
    }
    function closeModal(){
      modalOverlay.style.display = "none";
      modalItem = null;
    }
    mCloseBtn.addEventListener("click", closeModal);
    modalOverlay.addEventListener("click", (e)=>{ if(e.target === modalOverlay) closeModal(); });

    function matchesSearch(it, q){
      const s = (q||"").trim().toLowerCase();
      if(!s) return true;
      const hay = [
        it.quoteNumber, it.clientName, it.clientEmail, it.homeLabel, it.kindLabel, it.statusLabel
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(s);
    }

    function filteredItems(){
      const q = qEl.value || "";
      return items.filter(it=>{
        if(mode === "EVENT" && it.kind !== "EVENT") return false;
        if(mode === "FREE" && it.kind !== "FREE") return false;
        return matchesSearch(it, q);
      });
    }

    function render(){
      hideAlert();
      const rows = filteredItems();
      countLabel.textContent = String(rows.length);

      listEl.innerHTML = "";
      if(!rows.length){
        const empty = document.createElement("div");
        empty.className = "card";
        empty.innerHTML = `<div class="title">Aucun devis</div><div class="meta"><span class="mut">Crée un devis prospect ou ouvre un devis logement depuis le planning.</span></div>`;
        listEl.appendChild(empty);
        return;
      }

      for(const it of rows){
        const card = document.createElement("div");
        card.className = "card";

        const badgeClass =
          it.status === "ACCEPTED" ? "ok" :
          it.status === "REFUSED" ? "warn" :
          it.status === "SENT" ? "violet" : "";

        const canGoInvoice = (it.status === "ACCEPTED" && !!String(it.quoteNumber||"").trim());

        card.innerHTML = `
          <div class="rowTop">
            <div class="left">
              <div class="title">
                <span>${esc(it.title)}</span>
                <span class="badge ${badgeClass}">${esc(it.statusLabel)}</span>
              </div>
              <div class="meta">
                <span class="mut">${esc(it.kindLabel)}</span>
                ${it.quoteNumber ? ` • <b>${esc(it.quoteNumber)}</b>` : ``}
                ${it.clientName ? ` • ${esc(it.clientName)}` : ``}
                ${it.homeLabel ? ` • ${esc(it.homeLabel)}` : ``}
                ${it.amountLabel ? ` • <b>${esc(it.amountLabel)}</b>` : ``}
              </div>
            </div>
          </div>

          <div class="actions">
            <button class="btn small" data-open="${esc(it.id)}" type="button">Ouvrir</button>
            <button class="btn small" data-accept="${esc(it.id)}" type="button" ${canAccept(it) ? "" : "disabled"}>
              Accepter
            </button>
            <button class="btn small primary" data-invoice="${esc(it.id)}" type="button" ${canGoInvoice ? "" : "disabled"}>
              Passer en facture
            </button>
          </div>
        `;
        listEl.appendChild(card);
      }

      // bind
      listEl.querySelectorAll("button[data-open]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const id = btn.getAttribute("data-open");
          const it = items.find(x => x.id === id);
          if(!it) return;
          openModal(it);
        });
      });

      listEl.querySelectorAll("button[data-accept]").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const id = btn.getAttribute("data-accept");
          const it = items.find(x => x.id === id);
          if(!it) return;
          await acceptQuote(it);
        });
      });

      listEl.querySelectorAll("button[data-invoice]").forEach(btn=>{
        btn.addEventListener("click", ()=>{
          const id = btn.getAttribute("data-invoice");
          const it = items.find(x => x.id === id);
          if(!it) return;
          goInvoice(it);
        });
      });
    }

    function canAccept(it){
      return canAccept(it.raw || it);
    }

    // ===== Actions =====
    mOpenBtn.addEventListener("click", ()=>{
      if(!modalItem) return;
      closeModal();
      if(modalItem.kind === "EVENT"){
        location.href = `devis-event.html?eventId=${encodeURIComponent(modalItem.id)}`;
      }else{
        location.href = `devis-free.html?docId=${encodeURIComponent(modalItem.id)}`;
      }
    });

    mPreviewBtn.addEventListener("click", ()=>{
      if(!modalItem) return;
      closeModal();
      if(modalItem.kind === "EVENT"){
        location.href = `devis-apercu.html?eventId=${encodeURIComponent(modalItem.id)}`;
      }else{
        location.href = `devisfree-apercu.html?docId=${encodeURIComponent(modalItem.id)}`;
      }
    });

    mDeleteBtn.addEventListener("click", async ()=>{
      if(!modalItem) return;
      const it = modalItem;
      closeModal();

      if(!confirm("Supprimer ce devis ?")) return;

      try{
        if(it.kind === "FREE"){
          // suppression réelle (si tes rules l’autorisent)
          await deleteDoc(doc(db, "salesDocuments", it.id));
        }else{
          // sur event : soft delete (évite de casser l’historique planning)
          await updateDoc(doc(db, "events", it.id), {
            quoteStatus: "REFUSED",
            commercialStatus: "DEVIS_REFUSE",
            quoteDeletedAt: serverTimestamp(),
            commercialUpdatedAt: serverTimestamp()
          });
        }
        showAlert("✅ Devis supprimé.", true);
        await loadAll();
      }catch(e){
        console.error(e);
        showAlert("⛔ Suppression impossible : " + (e?.message || "erreur"));
      }
    });

    async function acceptQuote(it){
      hideAlert();
      const kind = it.kind;

      try{
        if(kind === "EVENT"){
          const ref = doc(db, "events", it.id);
          const snap = await getDoc(ref);
          if(!snap.exists()) throw new Error("Event introuvable.");
          const d = snap.data() || {};

          // quoteNumber obligatoire
          let qn = String(d.quoteNumber || "").trim();
          if(!qn){
            qn = await ensureQuoteNumber(currentUser.uid, new Date().getFullYear());
          }

          const prev = String(d.quoteStatus||"").toUpperCase().trim() || "DRAFT";
          const patch = {
            quoteNumber: qn,
            quoteStatus: "ACCEPTED",
            commercialStatus: "DEVIS_ACCEPTE",
            quoteAcceptedAt: serverTimestamp(),
            commercialUpdatedAt: serverTimestamp()
          };

          // si c'était DRAFT, on simule "envoyé" automatiquement (ta règle)
          if(prev === "DRAFT"){
            patch.quoteSentAt = serverTimestamp();
          }

          await updateDoc(ref, patch);
        }else{
          const ref = doc(db, "salesDocuments", it.id);
          const snap = await getDoc(ref);
          if(!snap.exists()) throw new Error("Devis introuvable.");
          const d = snap.data() || {};

          let qn = String(d.quoteNumber || "").trim();
          if(!qn){
            qn = await ensureQuoteNumber(currentUser.uid, new Date().getFullYear());
          }

          const prev = String(d.quoteStatus||"").toUpperCase().trim() || "DRAFT";
          const patch = {
            quoteNumber: qn,
            quoteStatus: "ACCEPTED",
            commercialStatus: "DEVIS_ACCEPTE",
            quoteAcceptedAt: serverTimestamp(),
            commercialUpdatedAt: serverTimestamp()
          };
          if(prev === "DRAFT") patch.quoteSentAt = serverTimestamp();

          await updateDoc(ref, patch);
        }

        showAlert("✅ Devis accepté.", true);
        await loadAll();
      }catch(e){
        console.error(e);
        showAlert("⛔ Acceptation impossible : " + (e?.message || "erreur"));
      }
    }

    function goInvoice(it){
      if(!String(it.quoteNumber||"").trim()) return showAlert("⛔ Enregistre d’abord le devis (numéro).");
      if(String(it.status||"") !== "ACCEPTED") return showAlert("⛔ Le devis doit être ACCEPTÉ.");

      // Event => facture.html, Free => facture-free.html (à créer si pas déjà fait)
      if(it.kind === "EVENT"){
        location.href = `facture.html?eventId=${encodeURIComponent(it.id)}`;
      }else{
        location.href = `facture-free.html?docId=${encodeURIComponent(it.id)}`;
      }
    }

    // ===== Load data =====
    function computeAmountFromLines(lines, tvaEnabled=false, tvaRate=0){
      let ht = 0;
      for(const l of (Array.isArray(lines) ? lines : [])){
        const qty = Number(l?.qty)||0;
        const up = Number(l?.unitPrice)||0;
        ht += qty * up;
      }
      const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
      return ht + tva;
    }

    async function loadEventQuotes(){
      // On récupère les events qui sont dans un flux "devis"
      // NB: si tu as un autre champ filtre (ex: commercialStatus), adapte ici.
      const qEv = query(
        collection(db, "events"),
        where("conciergerieUid", "==", currentUser.uid),
        where("commercialStatus", "in", ["DEVIS","DEVIS_ENVOYE","DEVIS_ACCEPTE","DEVIS_REFUSE"]),
        limit(200)
      );
      const snap = await getDocs(qEv);

      const out = [];
      snap.forEach(ds=>{
        const d = ds.data() || {};
        const status = String(d.quoteStatus||"").toUpperCase().trim() || "DRAFT";

        const client = (d.ownerName || d.clientName || "").toString().trim();
        const email  = normalizeEmail(d.ownerEmail || d.clientEmail || "");
        const homeLabel = (d.homeName || d.homeLabel || d.homeTitle || "").toString().trim();

        // montant: recalcul côté liste (simple) — TVA dépend du profil, mais ici on met un indicateur, pas du juridique
        const amount = computeAmountFromLines(d.lines || [], false, 0);

        const quoteNumber = String(d.quoteNumber||"").trim();
        out.push({
          kind: "EVENT",
          kindLabel: "Devis logement",
          id: ds.id,
          quoteNumber,
          status,
          statusLabel: quoteStatusLabel(status),
          clientName: client,
          clientEmail: email,
          homeLabel,
          amountLabel: (Array.isArray(d.lines) && d.lines.length) ? money(amount) : "",
          title: homeLabel ? `Logement : ${homeLabel}` : "Devis logement",
          sub: `${quoteNumber ? quoteNumber + " • " : ""}${client || "Client —"}`,
          raw: d
        });
      });

      // tri par n° puis fallback
      out.sort((a,b)=> (b.quoteNumber||"").localeCompare(a.quoteNumber||""));
      return out;
    }

    async function loadFreeQuotes(){
      const qQ = query(
        collection(db, "salesDocuments"),
        where("conciergerieUid", "==", currentUser.uid),
        where("type", "==", "QUOTE"),
        limit(200)
      );
      const snap = await getDocs(qQ);

      const out = [];
      snap.forEach(ds=>{
        const d = ds.data() || {};
        const status = String(d.quoteStatus||"").toUpperCase().trim() || "DRAFT";
        const quoteNumber = String(d.quoteNumber||"").trim();

        const client = String(d.clientName||"").trim();
        const email  = normalizeEmail(d.clientEmail||"");

        // montant : recalcul simple (TVA exacte sur l’aperçu)
        const amount = computeAmountFromLines(d.lines || [], false, 0);

        out.push({
          kind: "FREE",
          kindLabel: "Devis prospect",
          id: ds.id,
          quoteNumber,
          status,
          statusLabel: quoteStatusLabel(status),
          clientName: client,
          clientEmail: email,
          homeLabel: "",
          amountLabel: (Array.isArray(d.lines) && d.lines.length) ? money(amount) : "",
          title: client ? `Prospect : ${client}` : "Devis prospect",
          sub: `${quoteNumber ? quoteNumber + " • " : ""}${client || "Client —"}${email ? " • " + email : ""}`,
          raw: d
        });
      });

      out.sort((a,b)=> (b.quoteNumber||"").localeCompare(a.quoteNumber||""));
      return out;
    }

    async function loadAll(){
      hideAlert();
      listEl.innerHTML = "";

      const loading = document.createElement("div");
      loading.className = "card";
      loading.innerHTML = `<div class="title">Chargement…</div><div class="meta"><span class="mut">Devis logement + devis prospect</span></div>`;
      listEl.appendChild(loading);

      try{
        const [ev, fr] = await Promise.all([loadEventQuotes(), loadFreeQuotes()]);
        items = [...ev, ...fr];
        render();
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur chargement : " + (e?.message || "inconnue"));
      }
    }

    // ===== Events =====
    tabs.forEach(t => t.addEventListener("click", ()=> setMode(t.dataset.mode)));
    qEl.addEventListener("input", render);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }
      currentUser = user;
      await loadAll();
    });
  </script>
</body>
