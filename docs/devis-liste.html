<!-- docs/devis-liste.html (FINAL — UI alignée factures-liste: logo+titre+sous-titre+companyName, recherche, nav: Planning/Opération/Logements/iCal/Messages) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e;
      --ok:#1b8f4d;
      --card: rgba(255,255,255,.86);
    }

    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:12px 12px 24px;
      padding-bottom:88px;
    }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:8px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }

    .pill-link{
      display:inline-flex; align-items:center; gap:8px;
      padding:7px 11px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:12.5px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; cursor:pointer;
    }

    .pill-link.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .logo-title{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:6px; margin-bottom:2px; text-align:center;
    }
    .logo-icon{
      width:64px; height:64px; border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex; align-items:center; justify-content:center;
      color:var(--violet); font-size:18px; font-weight:900;
      position:relative; flex-shrink:0; overflow:hidden;
    }
    .logo-icon img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet); }

    h1{ margin:0; font-size:20px; font-weight:900; color:#111; line-height:1.1; }
    .subtitle{
      font-size:13px; color:#444; margin-top:2px;
      text-align:center; font-weight:800;
    }

    .badge{
      margin-top:8px; padding:3px 9px; border-radius:999px; background:#fff;
      font-size:11.5px; color:#555; box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center; font-weight:900; white-space:pre-wrap;
    }

    .wrap{ width:100%; max-width:1100px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }

    .card{
      width:100%;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:12px;
      backdrop-filter: blur(10px);
      display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
    }
    .left{ min-width:0; flex:1; }
    .row1{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .num{ font-weight:1000; font-size:13.5px; color:#111; }
    .statusPill{
      padding:3px 8px; border-radius:999px; background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      font-size:11px; font-weight:1000; color:#555;
    }
    .meta{
      margin-top:6px;
      font-size:12px; color:#222; font-weight:850; line-height:1.25;
      display:flex; flex-direction:column; gap:3px;
      word-break:break-word;
    }
    .mut{ color:var(--muted); font-weight:900; }

    .right{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; flex-shrink:0; }
    .btn{
      border:none; border-radius:999px;
      padding:8px 10px;
      font-size:12px; font-weight:1000;
      cursor:pointer;
      background:#fff; color:var(--violet);
      border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .alert{
      margin-top:8px; padding:9px 11px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
      font-weight:800;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .searchRow{
      width:100%;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      border-radius:18px;
      padding:10px;
    }
    .searchRow .field{ flex:1; min-width:220px; }
    label{ display:block; font-size:11.8px; font-weight:1000; color:#333; margin:0 0 4px; }
    input{
      width:100%; padding:9px 11px; border-radius:12px; border:1px solid #D3C7FF;
      font-size:13px; outline:none; background:#fff; font-weight:800; color:#111;
    }
    input:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .empty{
      background:#fff; border:1px solid rgba(0,0,0,0.06);
      border-radius:18px; box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:14px; font-weight:900; color:#555; text-align:center;
    }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:10.8px; font-weight:1000; text-decoration:none;
      color:#666; padding:9px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 980px){
      .bottom-nav{
        position: static; max-width: 1100px; margin: 10px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 24px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" href="compta.html">← Compta</a>
      <a class="pill-link primary" href="devis.html">+ Nouveau devis</a>
    </div>

    <div class="logo-title">
      <div class="logo-icon" id="logoIcon">
        <img id="logoImg" alt="Logo">
        <span id="logoFallback">✓</span>
      </div>
      <h1 id="pageTitle">Conciergerie</h1>
    </div>

    <div class="subtitle">Devis</div>
    <div class="badge" id="companyBadge">—</div>

    <div class="wrap">
      <div class="searchRow">
        <div class="field">
          <label for="searchInput">Recherche</label>
          <input id="searchInput" type="text" placeholder="N° devis, client, email…" />
        </div>
        <button class="btn" id="clearBtn" type="button">Effacer</button>
        <button class="btn primary" id="refreshBtn" type="button">Rafraîchir</button>
      </div>

      <div class="alert" id="alertBox"></div>
      <div id="list"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="operations.html">Opération</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc, collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const listEl = document.getElementById("list");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");
    const pageTitleEl = document.getElementById("pageTitle");
    const companyBadge = document.getElementById("companyBadge");

    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    let currentUser = null;
    let allItems = []; // cache pour filtre recherche

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function ddmmyyyyFromTs(ts){
      try{
        const d = ts?.toDate ? ts.toDate() : (ts?.seconds ? new Date(ts.seconds*1000) : null);
        if(!d) return "—";
        const dd = String(d.getDate()).padStart(2,"0");
        const mm = String(d.getMonth()+1).padStart(2,"0");
        const yy = d.getFullYear();
        return `${dd}/${mm}/${yy}`;
      }catch(_){ return "—"; }
    }

    function normalize(s){ return String(s||"").trim().toLowerCase(); }

    function pickTotal(d){
      // si tu ajoutes un champ totalTTC lors des save, il sera pris automatiquement
      if(Number.isFinite(Number(d?.totalTTC))) return Number(d.totalTTC);

      const arr = Array.isArray(d?.lines) ? d.lines : [];
      let ht = 0;
      for(const l of arr){
        ht += (Number(l?.qty)||0) * (Number(l?.unitPrice)||0);
      }
      const vatEnabled = !!d?.businessSnapshot?.vat?.enabled;
      const vatRate = Number.isFinite(Number(d?.businessSnapshot?.vat?.rate)) ? Number(d.businessSnapshot.vat.rate) : 0;
      const tva = vatEnabled ? (ht * vatRate) : 0;
      return ht + tva;
    }

    function statusLabel(d){
      const st = String(d?.quoteStatus || "").toUpperCase();
      if(!st || st === "DRAFT") return "ENREGISTRÉ";
      return st;
    }

    function renderItem(id, d){
      const num = String(d?.quoteNumber || d?.number || "—").trim();
      const client = String(d?.clientName || "—").trim();
      const email = String(d?.clientEmail || "").trim();
      const created = ddmmyyyyFromTs(d?.createdAt || d?.quoteUpdatedAt || d?.commercialUpdatedAt);
      const total = pickTotal(d);
      const badge = statusLabel(d);

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="left">
          <div class="row1">
            <span class="num">DEVIS N° ${esc(num)}</span>
            <span class="statusPill">${esc(badge)}</span>
          </div>
          <div class="meta">
            <div><span class="mut">Client :</span> ${esc(client)}${email ? ` <span class="mut">•</span> ${esc(email)}` : ""}</div>
            <div><span class="mut">Date :</span> ${esc(created)} <span class="mut">•</span> <span class="mut">Total :</span> ${esc(money(total))}</div>
          </div>
        </div>
        <div class="right">
          <button class="btn" data-preview="${esc(id)}" type="button">Aperçu</button>
          <button class="btn primary" data-open="${esc(id)}" type="button">Ouvrir</button>
        </div>
      `;

      card.querySelector('button[data-open]')?.addEventListener("click", ()=>{
        const u = new URL("devis.html", location.href);
        u.searchParams.set("docId", id);
        location.href = u.toString();
      });

      card.querySelector('button[data-preview]')?.addEventListener("click", ()=>{
        // même aperçu que devis prospect (il lit salesDocuments/docId)
        const u = new URL("devis-apercu.html", location.href);
        u.searchParams.set("docId", id);
        location.href = u.toString();
      });

      return card;
    }

    function renderList(filtered){
      listEl.innerHTML = "";
      if(!filtered.length){
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Aucun devis trouvé.";
        listEl.appendChild(empty);
        return;
      }
      for(const it of filtered){
        listEl.appendChild(renderItem(it.id, it.data));
      }
    }

    function applySearch(){
      const q = normalize(searchInput.value);
      if(!q){
        renderList(allItems);
        return;
      }
      const filtered = allItems.filter(it=>{
        const d = it.data || {};
        const hay = [
          d.quoteNumber, d.number,
          d.clientName, d.clientEmail,
          d.clientCity, d.clientZip
        ].map(x=>normalize(x)).join(" | ");
        return hay.includes(q);
      });
      renderList(filtered);
    }

    async function loadProfile(uid){
      const uSnap = await getDoc(doc(db, "users", uid));
      const profile = uSnap.exists() ? (uSnap.data() || {}) : {};
      const bp = profile.businessProfile || {};
      const cName = String(bp.companyName || "Conciergerie").trim();
      const logoUrl = String(bp.logoUrl || "").trim();

      pageTitleEl.textContent = cName || "Conciergerie";
      document.title = `${cName || "Conciergerie"} — Devis`;
      companyBadge.textContent = cName || "Conciergerie";

      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }
    }

    async function loadQuotes(uid){
      hideAlert();
      listEl.innerHTML = "";

      // Index Firestore requis:
      // salesDocuments: conciergerieUid asc, type asc, listable asc, createdAt desc
      const q = query(
        collection(db, "salesDocuments"),
        where("conciergerieUid", "==", uid),
        where("type", "==", "QUOTE"),
        where("listable", "==", true),
        orderBy("createdAt", "desc"),
        limit(200)
      );

      const snap = await getDocs(q);

      allItems = [];
      snap.forEach(d=>{
        allItems.push({ id: d.id, data: (d.data() || {}) });
      });

      if(!allItems.length){
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Aucun devis enregistré pour le moment.";
        listEl.appendChild(empty);
        return;
      }

      renderList(allItems);
    }

    clearBtn.addEventListener("click", ()=>{
      searchInput.value = "";
      applySearch();
    });
    refreshBtn.addEventListener("click", async ()=>{
      if(!currentUser) return;
      try{
        await loadQuotes(currentUser.uid);
        showAlert("✅ Liste rafraîchie.", true);
        setTimeout(()=>hideAlert(), 1200);
      }catch(e){
        console.error(e);
        showAlert("⛔ " + (e?.message || "Erreur rafraîchissement"), false);
      }
    });
    searchInput.addEventListener("input", applySearch);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }
      currentUser = user;

      try{
        await loadProfile(user.uid);
        await loadQuotes(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ " + (e?.message || "Erreur chargement devis"), false);
        // Si Firestore te donne "requires an index" : crée l'index via le lien, puis recharge.
      }
    });
  </script>
</body>
</html>
