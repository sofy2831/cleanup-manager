<!-- docs/devis-liste.html (FINAL — liste des salesDocuments type:"QUOTE") -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:1000; font-size:13px;
      cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .wrap{ width:100%; max-width:980px; margin-top:14px; display:flex; flex-direction:column; gap:12px; }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .toolbar{
      display:grid;
      grid-template-columns: 220px 1fr auto;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:720px){
      .toolbar{ grid-template-columns: 1fr; }
    }

    .select, .input{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.35);
      background:#fff;
      font-weight:1000;
      color:#222;
      outline:none;
    }

    .btn{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      text-decoration:none;
      font-weight:1000;
      font-size:12px;
      background:#fff;
      color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
      user-select:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
    }

    .line6{
      display:grid;
      grid-template-columns: 110px 160px 1.2fr 1.2fr 1.1fr 130px;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:900px){
      .line6{ grid-template-columns: 110px 160px 1fr 1fr; grid-auto-rows:auto; }
    }
    @media(max-width:560px){
      .line6{ grid-template-columns: 1fr 1fr; }
    }
    .cell{ min-width:0; }
    .cell .t{ font-size:11px; color:#666; font-weight:1000; }
    .cell .v{ font-size:13px; color:#111; font-weight:1000; }
    .v.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .tag{
      display:inline-flex; align-items:center; justify-content:center;
      padding:4px 8px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:var(--violet);
      white-space:nowrap;
    }

    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff; color:#333; white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0;
      z-index: 50; display: flex; gap: 6px;
      justify-content: space-around; align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none;
      font-size: 11px; font-weight: 1000; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static; width: 100%; max-width: 980px;
        margin: 14px 0 0; border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px; gap: 10px;
      }
      .bottom-nav a{ font-size: 13px; padding: 12px 12px; }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="compta.html">← Comptabilité</a>
      <a class="pill" href="devis-free.html">+ Devis libre</a>
    </div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="card">
        <div class="toolbar">
          <select class="select" id="filterStatus">
            <option value="ALL">Tous</option>
            <option value="DRAFT">Brouillons</option>
            <option value="SENT">Envoyés</option>
            <option value="ACCEPTED">Acceptés</option>
            <option value="REFUSED">Refusés</option>
            <option value="INVOICED">Facturés</option>
          </select>
          <input class="input" id="searchInput" placeholder="N° devis, client, logement…" />
          <button class="btn primary" id="exportBtn" type="button">Exporter CSV</button>
        </div>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="compta.html">Compta</a>
    <a href="messagerie.html">Messages</a>
  </nav>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    doc, getDoc,
    collection, query, where, orderBy, limit, getDocs
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const alertBox = document.getElementById("alertBox");
  const listBox = document.getElementById("listBox");
  const filterStatus = document.getElementById("filterStatus");
  const searchInput = document.getElementById("searchInput");
  const exportBtn = document.getElementById("exportBtn");

  let all = [];

  function showAlert(msg, ok=false){
    alertBox.style.display = "block";
    alertBox.classList.toggle("ok", !!ok);
    alertBox.textContent = msg;
  }
  function hideAlert(){
    alertBox.style.display = "none";
    alertBox.classList.remove("ok");
    alertBox.textContent = "";
  }
  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function fmtMoney(v){
    const n = Number(v);
    if(!Number.isFinite(n)) return "—";
    return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
  }
  function fmtDateFR(x){
    if(!x) return "—";
    try{
      if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
      const s = String(x).trim();
      if(!s) return "—";
      if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m) return `${m[3]}/${m[2]}/${m[1]}`;
      const d = new Date(s);
      if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
      return "—";
    }catch{ return "—"; }
  }

  function quoteStatusLabel(s){
    const x = String(s||"").toUpperCase().trim();
    if(!x) return "—";
    if(x === "DRAFT") return `<span class="badge">Brouillon</span>`;
    if(x === "SENT") return `<span class="badge">Envoyé</span>`;
    if(x === "ACCEPTED") return `<span class="badge ok">Accepté</span>`;
    if(x === "REFUSED") return `<span class="badge bad">Refusé</span>`;
    if(x === "INVOICED") return `<span class="badge ok">Facturé</span>`;
    return `<span class="badge">${esc(x)}</span>`;
  }

  function matchesFilter(d){
    const f = filterStatus.value;
    if(f === "ALL") return true;
    return String(d.quoteStatus||"DRAFT").toUpperCase().trim() === f;
  }
  function matchesSearch(d){
    const q = (searchInput.value||"").trim().toLowerCase();
    if(!q) return true;
    const hay = [
      d.quoteNumber, d.clientName, d.clientEmail, d.homeName, d.homeCity
    ].filter(Boolean).join(" ").toLowerCase();
    return hay.includes(q);
  }
  function filtered(){
    return all.filter(d => matchesFilter(d) && matchesSearch(d));
  }

  function exportCsv(){
    const rows = filtered();
    const header = ["docId","quoteNumber","status","date","client","email","home","city","totalTTC","eventId"];
    const out = [header.join(";")];

    for(const r of rows){
      const ttc = Number(r?.totals?.ttc);
      const line = [
        r.id,
        (r.quoteNumber||""),
        (r.quoteStatus||""),
        (r.quoteDate||""),
        (r.clientName||""),
        (r.clientEmail||""),
        (r.homeName||""),
        (r.homeCity||""),
        (Number.isFinite(ttc)? ttc.toFixed(2) : ""),
        (r.eventId||"")
      ].map(v => `"${String(v ?? "").replaceAll('"','""')}"`).join(";");
      out.push(line);
    }

    const blob = new Blob([out.join("\n")], { type:"text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `devis_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  exportBtn.addEventListener("click", exportCsv);

  async function render(){
    const rows = filtered();
    listBox.innerHTML = "";

    if(!rows.length){
      listBox.innerHTML = `
        <div class="card">
          <b>Aucun devis</b>
          <div style="margin-top:6px; font-size:12px; color:#666; font-weight:900;">Ajuste le filtre ou la recherche.</div>
        </div>
      `;
      return;
    }

    for(const d of rows){
      const created = fmtDateFR(d.createdAt);
      const qNo = String(d.quoteNumber || "DV—").trim();
      const client = String(d.clientName || "—").trim();
      const home = String(d.homeName || "—").trim();
      const per = (d.homeSnapshot?.arrivalDateKey || d.homeSnapshot?.departureDateKey)
        ? `${fmtDateFR(d.homeSnapshot?.arrivalDateKey)} → ${fmtDateFR(d.homeSnapshot?.departureDateKey)}`
        : (String(d.quoteDate||"").trim() || "—");

      const ttc = Number(d?.totals?.ttc);
      const total = Number.isFinite(ttc) ? fmtMoney(ttc) : "—";

      const openHref = d.eventId
        ? `devis-event.html?eventId=${encodeURIComponent(d.eventId)}&docId=${encodeURIComponent(d.id)}`
        : `devis-free.html?docId=${encodeURIComponent(d.id)}`;

      const div = document.createElement("div");
      div.className = "card";
      div.innerHTML = `
        <div class="line6">
          <div class="cell"><div class="t">Créé</div><div class="v">${esc(created)}</div></div>
          <div class="cell">
            <div class="t">N°</div>
            <div class="v"><span class="tag">DV</span> <span style="margin-left:6px;">${esc(qNo)}</span></div>
          </div>
          <div class="cell"><div class="t">Client</div><div class="v ellipsis" title="${esc(client)}">${esc(client)}</div></div>
          <div class="cell"><div class="t">Logement</div><div class="v ellipsis" title="${esc(home)}">${esc(home)}</div></div>
          <div class="cell"><div class="t">Période</div><div class="v ellipsis" title="${esc(per)}">${esc(per)}</div></div>
          <div class="cell" style="text-align:right;">
            <div class="t">Total</div>
            <div class="v">${esc(total)}</div>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px;">
          <div>${quoteStatusLabel(d.quoteStatus)}</div>
          <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
            <a class="btn" href="devis-apercu.html?docId=${encodeURIComponent(d.id)}">Aperçu</a>
            <a class="btn primary" href="${openHref}">Ouvrir</a>
          </div>
        </div>
      `;
      listBox.appendChild(div);
    }
  }

  async function loadQuotes(uid){
    const qQ = query(
      collection(db,"salesDocuments"),
      where("conciergerieUid","==",uid),
      where("type","==","QUOTE"),
      orderBy("createdAt","desc"),
      limit(500)
    );
    const snap = await getDocs(qQ);
    all = snap.docs.map(docu => ({ id: docu.id, ...(docu.data()||{}) }));
    await render();
  }

  filterStatus.addEventListener("change", render);
  searchInput.addEventListener("input", render);

  onAuthStateChanged(auth, async (user)=>{
    if(!user){ location.href = "login.html?role=conciergerie"; return; }
    hideAlert();
    try{
      await loadQuotes(user.uid);
    }catch(e){
      console.error(e);
      showAlert("⛔ Erreur chargement devis : " + (e?.message || "inconnue"));
    }
  });
</script>
</body>
</html>
