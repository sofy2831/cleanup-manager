<!-- docs/devis-liste.html (COMPLET + PROPRE: retour, pas de déconnexion, logo CleanUp, "Gestion de vos devis",
     bonjour + raison sociale via users/{uid}.businessProfile.companyName,
     toolbar pleine largeur + recherche jolie, export CSV, nav identique conciergerie.html) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }

    /* Topbar */
    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet);
      color:var(--violet);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    /* Header (style conciergerie/prestations) */
    .logo-title{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:10px;
      margin-bottom:6px;
      text-align:center;
    }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff;
      border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet);
      font-size:22px;font-weight:900;
      position:relative;
      flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-5px;
      font-size:12px;
      color:var(--violet);
    }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }
    .helloLine{ margin-top:10px; font-size:13px; color:#333; font-weight:900; text-align:center; }
    .emailLine{ margin-top:4px; font-size:13px; color:var(--muted); font-weight:800; text-align:center; }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      min-width:0;
    }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    /* Toolbar pleine largeur + recherche plus jolie */
    .toolbar{
      display:grid;
      grid-template-columns: 220px 1fr auto;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:720px){
      .toolbar{ grid-template-columns: 1fr; }
    }

    .select{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.35);
      background:#fff;
      font-weight:900;
      color:#222;
      outline:none;
    }

    .searchbar{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      min-width:0;
    }
    .s-ico{ font-size:14px; opacity:.75; }
    .input{
      flex:1;
      border:none;
      outline:none;
      font-size:13px;
      font-weight:900;
      color:#111;
      background:transparent;
      min-width:0;
    }

    .btn{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      text-decoration:none;
      font-weight:900;
      font-size:12px;
      background:#fff;
      color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }

    /* Liste */
    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:flex-start;
      min-width:0;
    }
    .k{
      min-width:220px;
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:0;
    }
    .k .t{ font-size:12px; color:#666; font-weight:900; }
    .k .v{ font-size:13px; color:#111; font-weight:900; }
    .v.ellipsis{
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:#333;
      white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    /* Bottom nav (identique conciergerie.html) */
    .bottom-nav{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      gap: 6px;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 900;
      color: #666;
      padding: 10px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        width: 100%;
        max-width: 980px;
        margin: 14px 0 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow: 0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px;
        gap: 10px;
      }
      .bottom-nav a{
        font-size: 13px;
        padding: 12px 12px;
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <!-- ✅ "Comptabilité" remplacé par "Retour" -->
      <a class="pill" href="compta.html">← Retour</a>
      <!-- ✅ pas de déconnexion -->
      <span></span>
    </div>

    <!-- ✅ logo CleanUp -->
    <div class="logo-title">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>

    <!-- ✅ titre -->
    <div class="subtitle">Gestion de vos devis</div>
    <div class="helloLine" id="helloLine">Bonjour,</div>
    <div class="emailLine" id="companyLine">—</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <!-- ✅ toolbar pleine largeur -->
      <div class="card">
        <div class="toolbar">
          <select class="select" id="filterStatus">
            <option value="ALL">Tous</option>
            <option value="DRAFT">Brouillons</option>
            <option value="SENT">Envoyés</option>
            <option value="ACCEPTED">Acceptés</option>
            <option value="REFUSED">Refusés</option>
            <option value="MISSING">Sans statut</option>
          </select>

          <div class="searchbar" title="Recherche">
            <span class="s-ico">🔎</span>
            <input class="input" id="searchInput" type="search" placeholder="Rechercher (logement, ville, client…)" autocomplete="off" />
          </div>

          <button class="btn primary" id="exportBtn" type="button">Exporter CSV</button>
        </div>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <!-- ✅ nav hors de .page (comme on a dit) -->
  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc,
      collection, query, where, orderBy, limit, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const helloLine = document.getElementById("helloLine");
    const companyLine = document.getElementById("companyLine");

    const filterStatus = document.getElementById("filterStatus");
    const searchInput = document.getElementById("searchInput");
    const listBox = document.getElementById("listBox");
    const exportBtn = document.getElementById("exportBtn");

    let all = [];

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }

    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }

    function getQuoteTotal(ev){
      // priorité : quoteAmount (si saisi) sinon total (event.total) sinon calcul lignes
      if(ev?.quoteAmount != null && ev.quoteAmount !== "") return Number(ev.quoteAmount);
      if(ev?.total != null && ev.total !== "") return Number(ev.total);
      return computeTotalFromLines(ev?.lines);
    }

    function badgeForQuoteStatus(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return `<span class="badge bad">Sans statut</span>`;
      if(x === "ACCEPTED") return `<span class="badge ok">Accepté</span>`;
      if(x === "SENT") return `<span class="badge">Envoyé</span>`;
      if(x === "DRAFT") return `<span class="badge">Brouillon</span>`;
      if(x === "REFUSED") return `<span class="badge bad">Refusé</span>`;
      return `<span class="badge">${esc(x)}</span>`;
    }

    function matchesFilter(item){
      const f = filterStatus.value;
      const st = String(item.quoteStatus||"").toUpperCase().trim();
      if(f === "ALL") return true;
      if(f === "MISSING") return !st;
      return st === f;
    }

    function matchesSearch(item){
      const q = (searchInput.value||"").trim().toLowerCase();
      if(!q) return true;
      const hay = [
        item.homeName, item.homeCity, item.homeZip, item.homeAddress,
        item.ownerName, item.ownerEmail, item.ownerPhone,
        item.summary
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    }

    function getFiltered(){
      return all.filter(e => matchesFilter(e) && matchesSearch(e));
    }

    function render(){
      const filtered = getFiltered();
      listBox.innerHTML = "";

      if(!filtered.length){
        listBox.innerHTML = `
          <div class="card">
            <b>Aucun devis</b>
            <div style="margin-top:6px; font-size:12px; color:#666; font-weight:800;">
              Ajuste le filtre ou la recherche.
            </div>
          </div>`;
        return;
      }

      for(const ev of filtered){
        const home = (ev.homeName||"—") + (ev.homeCity ? (" — " + ev.homeCity) : "");
        const owner = (ev.ownerName||"—") + (ev.ownerEmail ? (" • " + ev.ownerEmail) : "");
        const date = ev.dateKey || ev.date || "—";
        const time = ev.time || "—";
        const amount = getQuoteTotal(ev);

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="row">
            <div class="k">
              <div class="t">Logement</div>
              <div class="v ellipsis" title="${esc(home)}">${esc(home)}</div>
            </div>
            <div class="k">
              <div class="t">Client</div>
              <div class="v ellipsis" title="${esc(owner)}">${esc(owner)}</div>
            </div>
            <div class="k">
              <div class="t">Date</div>
              <div class="v">${esc(date)} • ${esc(time)}</div>
            </div>
          </div>

          <div class="row" style="margin-top:10px;">
            <div class="k">
              <div class="t">Statut</div>
              <div class="v">${badgeForQuoteStatus(ev.quoteStatus)}</div>
            </div>
            <div class="k">
              <div class="t">Montant</div>
              <div class="v">${fmtMoney(amount)}</div>
            </div>

            <div class="k" style="align-items:flex-end; min-width:240px;">
              <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
                <a class="btn primary" href="devis.html?eventId=${encodeURIComponent(ev.id)}">Ouvrir devis</a>
              </div>
            </div>
          </div>
        `;
        listBox.appendChild(div);
      }
    }

    function toCsvValue(v){
      const s = String(v ?? "");
      return `"${s.replaceAll('"','""')}"`;
    }

    function exportCsv(){
      const rows = getFiltered();
      const header = [
        "eventId","date","heure","logement","ville","client","email",
        "quoteStatus","montant"
      ];
      const lines = [header.join(";")];

      for(const r of rows){
        const amount = getQuoteTotal(r);
        const line = [
          r.id,
          (r.dateKey || r.date || ""),
          (r.time || ""),
          (r.homeName || ""),
          (r.homeCity || ""),
          (r.ownerName || ""),
          (r.ownerEmail || ""),
          (r.quoteStatus || ""),
          (Number.isFinite(Number(amount)) ? Number(amount).toFixed(2) : "")
        ].map(toCsvValue).join(";");

        lines.push(line);
      }

      const blob = new Blob([lines.join("\n")], { type:"text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `devis_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function loadQuotes(uid){
      const qEvents = query(
        collection(db, "events"),
        where("conciergerieUid", "==", uid),
        orderBy("createdAt", "desc"),
        limit(400)
      );
      const snap = await getDocs(qEvents);
      const rows = snap.docs.map(d => ({ id: d.id, ...(d.data()||{}) }));

      // On garde les events qui ressemblent à des devis (statut devis) OU marquage commercial
      all = rows.filter(r => {
        const qs = String(r.quoteStatus||"").toUpperCase().trim();
        const cs = String(r.commercialStatus||"").toUpperCase().trim();
        return qs === "DRAFT" || qs === "SENT" || qs === "ACCEPTED" || qs === "REFUSED" || cs === "DEVIS" || cs.startsWith("DEVIS");
      });

      render();
    }

    // ✅ Nom conciergerie = users/{uid}.businessProfile.companyName
    async function loadCompanyName(user){
      try{
        const uSnap = await getDoc(doc(db, "users", user.uid));
        const company = uSnap.exists() ? (uSnap.data()?.businessProfile?.companyName || "") : "";
        companyLine.textContent = (company || "").trim() || "Conciergerie";
      }catch(e){
        companyLine.textContent = "Conciergerie";
      }
    }

    filterStatus.addEventListener("change", render);
    searchInput.addEventListener("input", render);
    exportBtn.addEventListener("click", exportCsv);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }

      if(helloLine) helloLine.textContent = "Bonjour,";
      await loadCompanyName(user);

      hideAlert();
      try{
        await loadQuotes(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur chargement devis : " + (e?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
