<!-- docs/devis-liste.html (FINAL — salesDocuments QUOTE, recherche + totaux, UI alignée factures-liste, actions Ouvrir/Aperçu) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
      --card: rgba(255,255,255,.86);
    }

    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px;
      cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .logo-title{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; margin-bottom:6px; text-align:center; }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:18px;font-weight:900;
      position:relative; flex-shrink:0; overflow:hidden;
    }
    .logo-icon img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }
    .helloLine{ margin-top:10px; font-size:13px; color:#333; font-weight:900; text-align:center; }
    .companyLine{ margin-top:4px; font-size:13px; color:var(--muted); font-weight:900; text-align:center; }

    .wrap{ width:100%; max-width:980px; margin-top:14px; display:flex; flex-direction:column; gap:12px; min-width:0; }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
      font-weight:850;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .toolbar{
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
      align-items:center;
      min-width:0;
    }

    .searchbar{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      min-width:0;
    }
    .s-ico{ font-size:14px; opacity:.75; }
    .input{
      flex:1;
      border:none;
      outline:none;
      font-size:13px;
      font-weight:900;
      color:#111;
      background:transparent;
      min-width:0;
    }

    .btn{
      display:inline-flex; justify-content:center; align-items:center; gap:8px;
      padding:10px 12px; border-radius:999px;
      border:none; cursor:pointer; text-decoration:none;
      font-weight:900; font-size:12px;
      background:#fff; color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
      user-select:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff; border-color:transparent;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }

    .globalTotals{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:10px;
    }
    @media(max-width:720px){ .globalTotals{ grid-template-columns: 1fr; } }
    .gtBox{
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:10px 12px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .gtBox .t{ font-size:11px; color:#666; font-weight:900; }
    .gtBox .v{ margin-top:2px; font-size:14px; color:#111; font-weight:1000; }
    .gtNote{ margin-top:8px; font-size:12px; color:#666; font-weight:850; }

    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:#333;
      white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    .line6{
      display:grid;
      grid-template-columns: 110px 160px 1.3fr 1.1fr 130px 1fr;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:900px){
      .line6{ grid-template-columns: 110px 160px 1fr 1fr; grid-auto-rows:auto; }
    }
    @media(max-width:560px){
      .line6{ grid-template-columns: 1fr 1fr; }
    }
    .cell{ min-width:0; }
    .cell .t{ font-size:11px; color:#666; font-weight:900; }
    .cell .v{ font-size:13px; color:#111; font-weight:900; }
    .cell .v.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .tag{
      display:inline-flex; align-items:center; justify-content:center;
      padding:4px 8px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:var(--violet);
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:flex-start;
      min-width:0;
      margin-top:10px;
    }
    .k{ min-width:220px; display:flex; flex-direction:column; gap:3px; min-width:0; }
    .k .t{ font-size:12px; color:#666; font-weight:900; }
    .k .v{ font-size:13px; color:#111; font-weight:900; }

    .actionsBar{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      width:100%;
    }
    @media(max-width:560px){
      .actionsBar{ justify-content:stretch; }
      .actionsBar .btn{ flex:1 1 48%; }
      .actionsBar .btn.primary{ flex:1 1 100%; }
    }

    .empty{
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-radius:18px;
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:14px;
      font-weight:900;
      color:#555;
      text-align:center;
    }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; gap: 6px; justify-content: space-around; align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none;
      font-size: 11px; font-weight: 900; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        width: 100%;
        max-width: 980px;
        margin: 14px 0 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px;
        gap: 10px;
      }
      .bottom-nav a{ font-size: 13px; padding: 12px 12px; }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="compta.html">← Retour</a>
      <a class="pill primary" href="devis.html">+ Nouveau devis</a>
    </div>

    <div class="logo-title">
      <div class="logo-icon" id="logoIcon">
        <img id="logoImg" alt="Logo">
        <span id="logoFallback">✓</span>
      </div>
      <h1>Devis</h1>
    </div>

    <div class="subtitle">Suivi des devis</div>
    <div class="helloLine">Bonjour,</div>
    <div class="companyLine" id="companyLine">—</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="card">
        <div class="toolbar">
          <div class="searchbar" title="Recherche">
            <span class="s-ico">🔎</span>
            <input class="input" id="searchInput" type="search" placeholder="Rechercher (n° devis, client, email…)" autocomplete="off" />
            <button class="btn" id="clearBtn" type="button">Effacer</button>
            <button class="btn" id="refreshBtn" type="button">Rafraîchir</button>
          </div>
        </div>

        <div style="margin-top:10px; font-size:12px; color:#666; font-weight:850;">
          Brouillons : visibles dans <b>devis.html</b> (docId), mais ici on affiche seulement les devis <b>enregistrés (listable=true)</b>.
        </div>
      </div>

      <div class="card" id="globalTotalsCard" style="display:none;">
        <div style="font-weight:1000; margin-bottom:10px;">Totaux (devis affichés)</div>
        <div class="globalTotals" id="globalTotalsBox"></div>
        <div class="gtNote" id="globalTotalsNote"></div>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="operations.html">Opération</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, orderBy, limit, getDocs, doc, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const companyLine = document.getElementById("companyLine");
    const listBox = document.getElementById("listBox");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");

    const searchInput = document.getElementById("searchInput");
    const clearBtn = document.getElementById("clearBtn");
    const refreshBtn = document.getElementById("refreshBtn");

    const globalTotalsCard = document.getElementById("globalTotalsCard");
    const globalTotalsBox = document.getElementById("globalTotalsBox");
    const globalTotalsNote = document.getElementById("globalTotalsNote");

    let currentUser = null;
    let all = [];
    let vatEnabled = false;
    let vatRate = 0;

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }
    function fmtDateFR(x){
      if(!x) return "—";
      try{
        if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
        const d = new Date(String(x));
        if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
        return "—";
      }catch{ return "—"; }
    }
    function normalize(s){ return String(s||"").trim().toLowerCase(); }

    function computeHT(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((sum,l)=> sum + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }
    function computeTotalsFromDoc(d){
      // priorité champs stockés si tu les ajoutes plus tard
      const htS = Number(d?.totalHT);
      const tvaS = Number(d?.totalTVA);
      const ttcS = Number(d?.totalTTC);
      if(Number.isFinite(htS) && Number.isFinite(tvaS) && Number.isFinite(ttcS)){
        return { ht: htS, tva: tvaS, ttc: ttcS };
      }

      const ht = computeHT(d?.lines);
      // TVA depuis businessSnapshot du doc si présent, sinon depuis profil
      const bsVatEnabled = !!d?.businessSnapshot?.vat?.enabled;
      const bsVatRate = Number.isFinite(Number(d?.businessSnapshot?.vat?.rate)) ? Number(d.businessSnapshot.vat.rate) : null;

      const tvaEnabledLocal = (bsVatRate !== null) ? bsVatEnabled : vatEnabled;
      const tvaRateLocal = (bsVatRate !== null) ? (Number(bsVatRate)||0) : (Number(vatRate)||0);

      const tva = tvaEnabledLocal ? (ht * tvaRateLocal) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    function quoteStatusDisplay(d){
      const st = String(d?.quoteStatus||"").toUpperCase().trim();
      if(!st) return "SAVED";
      return st;
    }
    function quoteStatusBadge(st){
      const s = String(st||"").toUpperCase().trim();
      if(s === "ACCEPTED") return `<span class="badge ok">Accepté</span>`;
      if(s === "REFUSED") return `<span class="badge bad">Refusé</span>`;
      if(s === "SAVED") return `<span class="badge">Enregistré</span>`;
      return `<span class="badge">${esc(s)}</span>`;
    }

    function matchesSearch(item){
      const q = normalize(searchInput.value);
      if(!q) return true;
      const d = item || {};
      const hay = [
        d.quoteNumber, d.clientName, d.clientEmail,
        d.clientCity, d.clientZip,
        d.docType, d.commercialStatus, d.quoteStatus
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    }

    function getFiltered(){
      return all.filter(x => matchesSearch(x));
    }

    function renderGlobalTotals(filtered){
      if(!filtered.length){
        globalTotalsCard.style.display = "none";
        globalTotalsBox.innerHTML = "";
        globalTotalsNote.textContent = "";
        return;
      }
      let sumHT = 0, sumTVA = 0, sumTTC = 0;
      for(const d of filtered){
        const t = computeTotalsFromDoc(d);
        sumHT += Number(t.ht)||0;
        sumTVA += Number(t.tva)||0;
        sumTTC += Number(t.ttc)||0;
      }
      globalTotalsCard.style.display = "block";
      globalTotalsBox.innerHTML = `
        <div class="gtBox"><div class="t">Total HT</div><div class="v">${fmtMoney(sumHT)}</div></div>
        <div class="gtBox"><div class="t">TVA</div><div class="v">${fmtMoney(sumTVA)}</div></div>
        <div class="gtBox"><div class="t">Total TTC</div><div class="v">${fmtMoney(sumTTC)}</div></div>
      `;
      globalTotalsNote.textContent = vatEnabled
        ? `TVA activée (${Math.round((Number(vatRate)||0)*100)}%). Totaux calculés sur les devis affichés.`
        : `TVA non applicable. Totaux calculés sur les devis affichés.`;
    }

    function render(){
      const filtered = getFiltered();
      renderGlobalTotals(filtered);

      listBox.innerHTML = "";

      if(!filtered.length){
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Aucun devis (selon la recherche).";
        listBox.appendChild(empty);
        return;
      }

      for(const d of filtered){
        const created = fmtDateFR(d?.createdAt || d?.quoteUpdatedAt || d?.commercialUpdatedAt);
        const num = String(d?.quoteNumber || "—").trim() || "—";
        const client = String(d?.clientName || "—").trim();
        const email = String(d?.clientEmail || "").trim();
        const st = quoteStatusDisplay(d);
        const totals = computeTotalsFromDoc(d);

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="line6">
            <div class="cell">
              <div class="t">Créé</div>
              <div class="v">${esc(created)}</div>
            </div>

            <div class="cell">
              <div class="t">N°</div>
              <div class="v">
                <span class="tag">D</span>
                <span style="margin-left:6px;">${esc(num)}</span>
              </div>
            </div>

            <div class="cell">
              <div class="t">Client</div>
              <div class="v ellipsis" title="${esc(client)}">${esc(client)}</div>
            </div>

            <div class="cell">
              <div class="t">Email</div>
              <div class="v ellipsis" title="${esc(email)}">${esc(email || "—")}</div>
            </div>

            <div class="cell" style="text-align:right;">
              <div class="t">Total TTC</div>
              <div class="v">${fmtMoney(totals.ttc)}</div>
            </div>

            <div class="cell" style="text-align:right;">
              <div class="t">Statut</div>
              <div class="v">${quoteStatusBadge(st)}</div>
            </div>
          </div>

          <div class="row">
            <div class="k">
              <div class="t">Type</div>
              <div class="v">${esc(String(d?.docType || d?.commercialStatus || "QUOTE").trim())}</div>
              <div class="t" style="margin-top:4px;">Total HT : ${fmtMoney(totals.ht)} • TVA : ${fmtMoney(totals.tva)}</div>
            </div>

            <div class="k" style="align-items:flex-end; min-width:280px;">
              <div class="actionsBar">
                <button class="btn" type="button" data-preview="${esc(d.id)}">Aperçu</button>
                <button class="btn primary" type="button" data-open="${esc(d.id)}">Ouvrir</button>
              </div>
            </div>
          </div>
        `;

        div.querySelector('button[data-open]')?.addEventListener("click", ()=>{
          const u = new URL("devis.html", location.href);
          u.searchParams.set("docId", d.id);
          location.href = u.toString();
        });

        div.querySelector('button[data-preview]')?.addEventListener("click", ()=>{
          // aperçu lit salesDocuments/docId (pas draft)
          const u = new URL("devis-apercu.html", location.href);
          u.searchParams.set("docId", d.id);
          location.href = u.toString();
        });

        listBox.appendChild(div);
      }
    }

    async function loadCompanyNameAndVat(uid){
      const snap = await getDoc(doc(db, "users", uid));
      const data = snap.exists() ? (snap.data()||{}) : {};
      const name = String(data?.businessProfile?.companyName || "").trim();

      const vat = data?.businessProfile?.vat || {};
      vatEnabled = !!vat?.enabled;
      vatRate = Number.isFinite(Number(vat?.rate)) ? Number(vat.rate) : 0;

      const logoUrl = String(data?.businessProfile?.logoUrl || "").trim();
      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }

      return name || "Conciergerie";
    }

    function createdAtMsForSort(x){
      try{
        if(x?.createdAt?.toDate?.()) return x.createdAt.toDate().getTime();
        const d = new Date(String(x?.createdAt||""));
        if(!isNaN(d.getTime())) return d.getTime();
      }catch{}
      return 0;
    }

    async function loadQuotes(uid){
      // Index Firestore requis:
      // salesDocuments: conciergerieUid asc, type asc, listable asc, createdAt desc
      const qQ = query(
        collection(db, "salesDocuments"),
        where("conciergerieUid", "==", uid),
        where("type", "==", "QUOTE"),
        where("listable", "==", true),
        orderBy("createdAt", "desc"),
        limit(400)
      );

      const snap = await getDocs(qQ);
      all = snap.docs.map(s => ({ id:s.id, ...(s.data()||{}) }));

      // fallback sécurité: si createdAt absent sur certains docs, on trie quand même
      all.sort((a,b)=> createdAtMsForSort(b) - createdAtMsForSort(a));
      render();
    }

    function throttle(fn, ms=120){
      let t = null;
      return (...args)=>{
        if(t) clearTimeout(t);
        t = setTimeout(()=>fn(...args), ms);
      };
    }

    clearBtn.addEventListener("click", ()=>{
      searchInput.value = "";
      render();
    });
    refreshBtn.addEventListener("click", async ()=>{
      if(!currentUser) return;
      try{
        await loadQuotes(currentUser.uid);
        showAlert("✅ Liste rafraîchie.", true);
        setTimeout(()=>hideAlert(), 1200);
      }catch(e){
        console.error(e);
        showAlert("⛔ " + (e?.message || "Erreur rafraîchissement"), false);
      }
    });
    searchInput.addEventListener("input", throttle(render, 80));

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }
      currentUser = user;

      try{
        hideAlert();
        companyLine.textContent = await loadCompanyNameAndVat(user.uid);
        await loadQuotes(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur chargement devis : " + (e?.message || "inconnue"), false);
      }
    });
