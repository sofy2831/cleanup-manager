<!-- docs/devis-liste.html (FINAL — liste devis depuis salesDocuments, type QUOTE, listable==true, boutons Ouvrir/Aperçu selon besoin) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --card: rgba(255,255,255,.86);
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:12px 12px 26px; padding-bottom:88px; }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:8px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:12.5px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer; white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    h1{ margin:8px 0 0; font-size:18px; font-weight:900; }
    .sub{ margin-top:4px; font-size:12.5px; color:#444; font-weight:800; text-align:center; }

    .wrap{ width:100%; max-width:1100px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }

    .alert{
      background:#fff; border:1px solid rgba(0,0,0,0.06);
      border-left:5px solid var(--bad);
      border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px; font-size:12px; font-weight:700; color:#333;
      display:none; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:12px;
      backdrop-filter: blur(10px);
      display:flex; gap:10px; align-items:flex-start; justify-content:space-between;
    }
    .left{ min-width:0; flex:1; }
    .row1{
      display:flex; gap:8px; align-items:center; flex-wrap:wrap;
      font-weight:1000;
    }
    .num{ font-size:13.5px; }
    .badge{
      padding:3px 8px; border-radius:999px; background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      font-size:11px; font-weight:1000; color:#555;
    }
    .meta{
      margin-top:6px;
      font-size:12px; color:#222; font-weight:800; line-height:1.25;
      display:flex; flex-direction:column; gap:3px;
      word-break:break-word;
    }
    .mut{ color:var(--muted); font-weight:800; }

    .right{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .btn{
      border:none; border-radius:999px;
      padding:8px 10px;
      font-size:12px; font-weight:1000;
      cursor:pointer;
      background:#fff; color:var(--violet);
      border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .empty{
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-radius:18px;
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:14px;
      font-weight:900;
      color:#555;
      text-align:center;
    }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:10.8px; font-weight:1000; text-decoration:none;
      color:#666; padding:9px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 980px){
      .bottom-nav{
        position: static; max-width: 1100px; margin: 10px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 26px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="compta.html">← Compta</a>
      <a class="pill primary" href="devis.html">+ Nouveau devis</a>
    </div>

    <h1>Devis</h1>
    <div class="sub">Liste des devis enregistrés (prospect + logement)</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>
      <div id="list"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
     <a href="prestations.html">Opération </a>
     <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
   
   
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, orderBy, limit, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const listEl = document.getElementById("list");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function ddmmyyyyFromTs(ts){
      try{
        const d = ts?.toDate ? ts.toDate() : (ts?.seconds ? new Date(ts.seconds*1000) : null);
        if(!d) return "—";
        const dd = String(d.getDate()).padStart(2,"0");
        const mm = String(d.getMonth()+1).padStart(2,"0");
        const yy = d.getFullYear();
        return `${dd}/${mm}/${yy}`;
      }catch(_){ return "—"; }
    }

    function pickTotal(d){
      if(Number.isFinite(Number(d?.totalTTC))) return Number(d.totalTTC);
      // fallback si anciens docs sans totaux persistés
      const arr = Array.isArray(d?.lines) ? d.lines : [];
      let ht = 0;
      for(const l of arr){
        ht += (Number(l?.qty)||0) * (Number(l?.unitPrice)||0);
      }
      const vatEnabled = !!d?.businessSnapshot?.vat?.enabled;
      const vatRate = Number.isFinite(Number(d?.businessSnapshot?.vat?.rate)) ? Number(d.businessSnapshot.vat.rate) : 0;
      const tva = vatEnabled ? (ht * vatRate) : 0;
      return ht + tva;
    }

    function renderItem(id, d){
      const num = String(d?.quoteNumber || d?.number || "—");
      const client = String(d?.clientName || "—");
      const email = String(d?.clientEmail || "");
      const total = pickTotal(d);

      const created = ddmmyyyyFromTs(d?.createdAt || d?.quoteCreatedAt || d?.quoteUpdatedAt);

      const status = String(d?.quoteStatus || "").toUpperCase();
      const badge = status && status !== "DRAFT" ? status : "ENREGISTRÉ";

      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <div class="left">
          <div class="row1">
            <span class="num">DEVIS N° ${esc(num)}</span>
            <span class="badge">${esc(badge)}</span>
          </div>
          <div class="meta">
            <div><span class="mut">Client :</span> ${esc(client)}${email ? ` <span class="mut">•</span> ${esc(email)}` : ""}</div>
            <div><span class="mut">Date :</span> ${esc(created)} <span class="mut">•</span> <span class="mut">Total :</span> ${esc(money(total))}</div>
          </div>
        </div>

        <div class="right">
          <button class="btn" data-preview="${esc(id)}" type="button">Aperçu</button>
          <button class="btn primary" data-open="${esc(id)}" type="button">Ouvrir</button>
        </div>
      `;

      card.querySelector('button[data-open]')?.addEventListener("click", ()=>{
        const u = new URL("devis.html", location.href);
        u.searchParams.set("docId", id);
        location.href = u.toString();
      });

      card.querySelector('button[data-preview]')?.addEventListener("click", ()=>{
        const u = new URL("devisfree-apercu.html", location.href);
        u.searchParams.set("docId", id);
        location.href = u.toString();
      });

      return card;
    }

    async function loadList(uid){
      hideAlert();
      listEl.innerHTML = "";

      // ⚠️ Index requis si orderBy + where multiples : tu as déjà l'habitude :)
      const q = query(
        collection(db, "salesDocuments"),
        where("conciergerieUid", "==", uid),
        where("type", "==", "QUOTE"),
        where("listable", "==", true),
        orderBy("createdAt", "desc"),
        limit(100)
      );

      const snap = await getDocs(q);
      if(snap.empty){
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Aucun devis enregistré pour le moment.";
        listEl.appendChild(empty);
        return;
      }

      snap.forEach(docu=>{
        const d = docu.data() || {};
        listEl.appendChild(renderItem(docu.id, d));
      });
    }

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }
      try{
        await loadList(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ " + (e?.message || "Erreur chargement devis"), false);

        // Si Firestore te renvoie l'URL "requires an index", copie-colle le lien dans le navigateur,
        // crée l'index, puis recharge la page.
      }
    });
  </script>
</body>
</html>
