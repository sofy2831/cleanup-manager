<!-- docs/devis-liste.html (PATCH: unifie events + salesDocuments QUOTE_FREE, supprime logout + export, ajoute devis prospect, actions OUVRIR/ACCEPTER/FACTURE) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:980px; position:sticky; top:0; z-index:10;
      display:flex; justify-content:flex-start; align-items:center; gap:10px; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .title{ width:100%; max-width:980px; margin-top:10px; text-align:center; }
    h1{ margin:0; font-size:24px; font-weight:900; }
    .subtitle{ margin-top:4px; font-size:14px; color:#444; }
    .emailLine{ margin-top:4px; font-size:13px; color:var(--muted); font-weight:700; }

    .wrap{ width:100%; max-width:980px; margin-top:14px; display:flex; flex-direction:column; gap:12px; }

    .toolbar{ display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; align-items:center; }
    .leftTools{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
    .rightTools{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:flex-end; }

    .select, .input{
      padding:10px 12px; border-radius:999px; border:1px solid rgba(122,92,255,0.35);
      background:#fff; font-weight:800; color:#222; outline:none; min-width:210px;
    }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
    }

    .row{ display:flex; gap:10px; flex-wrap:wrap; justify-content:space-between; align-items:flex-start; }

    .k{ min-width:170px; display:flex; flex-direction:column; gap:3px; }
    .k .t{ font-size:12px; color:#666; font-weight:900; }
    .k .v{ font-size:13px; color:#111; font-weight:900; }

    .k.wide{ min-width:260px; }

    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px; border-radius:999px; font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25); background:#fff; color:#333;
      white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    .btn{
      display:inline-flex; justify-content:center; align-items:center; gap:8px;
      padding:10px 12px; border-radius:999px; border:none; cursor:pointer;
      text-decoration:none; font-weight:900; font-size:12px;
      background:#fff; color:var(--violet); border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
      user-select:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff; border-color:transparent; box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }
    .btn:disabled{
      opacity:.45;
      cursor:not-allowed;
      filter:grayscale(0.15);
    }

    .alert{
      display:none; padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .bottom-nav{
      position: fixed; left:0; right:0; bottom:0; z-index:50;
      display:flex; gap:6px; justify-content:space-around; align-items:center;
      padding:10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; text-decoration:none; font-size:11px; font-weight:900;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap;
    }
    .bottom-nav a.active{ background: linear-gradient(90deg,var(--violet),var(--violet2)); color:#fff; box-shadow:0 10px 22px rgba(0,0,0,0.10); }

    @media(min-width:860px){
      .bottom-nav{
        position:static; max-width:980px; margin:12px auto 0;
        border-top:none; border:1px solid rgba(122,92,255,0.18); border-radius:999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom:32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="compta.html">← Comptabilité</a>
    </div>

    <div class="title">
      <h1>Devis</h1>
      <div class="subtitle">Devis logement + devis prospect</div>
      <div class="emailLine" id="emailLine">—</div>
    </div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="toolbar">
        <div class="leftTools">
          <select class="select" id="filterStatus">
            <option value="ALL">Tous</option>
            <option value="DRAFT">Brouillons</option>
            <option value="SENT">Envoyés</option>
            <option value="ACCEPTED">Acceptés</option>
            <option value="REFUSED">Refusés</option>
            <option value="MISSING">Sans statut</option>
          </select>

          <input class="input" id="searchInput" placeholder="Rechercher client / logement / n° devis..." />
        </div>

        <div class="rightTools">
          <a class="btn primary" href="devis-free.html">Devis prospect</a>
        </div>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="logements.html">Logements</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, orderBy, limit, getDocs,
      doc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const emailLine = document.getElementById("emailLine");
    const alertBox = document.getElementById("alertBox");

    const filterStatus = document.getElementById("filterStatus");
    const searchInput = document.getElementById("searchInput");
    const listBox = document.getElementById("listBox");

    let all = [];

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }

    function fmtDateFR(d){
      if(!d) return "—";
      try{
        const dt = (d?.toDate?.() ? d.toDate() : (d instanceof Date ? d : new Date(d)));
        if(isNaN(dt.getTime())) return "—";
        return dt.toLocaleDateString("fr-FR");
      }catch{
        return "—";
      }
    }

    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }

    // ====== TOTAL TTC (EVENT) ======
    function getQuoteTotalFromEvent(ev){
      if(ev?.quoteAmount != null && ev.quoteAmount !== "") return Number(ev.quoteAmount);
      if(ev?.total != null && ev.total !== "") return Number(ev.total);
      return computeTotalFromLines(ev?.lines);
    }

    // ====== TOTAL TTC (FREE QUOTE) ======
    function getQuoteTotalFromFree(docu){
      if(docu?.quoteAmount != null && docu.quoteAmount !== "") return Number(docu.quoteAmount);
      if(docu?.totalTTC != null && docu.totalTTC !== "") return Number(docu.totalTTC);
      return computeTotalFromLines(docu?.lines);
    }

    function badgeForQuoteStatus(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return `<span class="badge bad">Sans statut</span>`;
      if(x === "ACCEPTED") return `<span class="badge ok">Accepté</span>`;
      if(x === "SENT") return `<span class="badge">Envoyé</span>`;
      if(x === "DRAFT") return `<span class="badge">Brouillon</span>`;
      if(x === "REFUSED") return `<span class="badge bad">Refusé</span>`;
      return `<span class="badge">${esc(x)}</span>`;
    }

    function periodFromEvent(ev){
      // on tente plusieurs champs, sans casser si ça n’existe pas
      const a =
        ev?.periodFrom || ev?.startDate || ev?.checkIn || ev?.dateFrom || ev?.start ||
        ev?.fromDate || ev?.beginDate || ev?.arrivalDate;
      const b =
        ev?.periodTo || ev?.endDate || ev?.checkOut || ev?.dateTo || ev?.end ||
        ev?.toDate || ev?.finishDate || ev?.departureDate;

      const fa = fmtDateFR(a);
      const fb = fmtDateFR(b);
      if(fa !== "—" && fb !== "—") return `${fa} → ${fb}`;

      // fallback minimal si tu as seulement une dateKey
      if(ev?.dateKey) return String(ev.dateKey);
      if(ev?.date) return fmtDateFR(ev.date);
      return "—";
    }

    function quoteNumberForRow(r){
      // r.kind: EVENT | FREE
      const n = (r.quoteNumber || "").trim();
      if(n) return n;

      // fallback lisible si pas encore de numérotation
      if(r.kind === "FREE") return "DF—";
      return "DE—";
    }

    function matchesFilter(item){
      const f = filterStatus.value;
      const st = String(item.quoteStatus||"").toUpperCase().trim();
      if(f === "ALL") return true;
      if(f === "MISSING") return !st;
      return st === f;
    }

    function matchesSearch(item){
      const q = (searchInput.value||"").trim().toLowerCase();
      if(!q) return true;
      const hay = [
        item.quoteNumber,
        item.clientName, item.clientEmail,
        item.homeName, item.homeCity,
        item.ownerName, item.ownerEmail
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    }

    function getFiltered(){
      return all.filter(e => matchesFilter(e) && matchesSearch(e));
    }

    async function acceptEventQuote(eventId){
      try{
        await updateDoc(doc(db,"events",eventId),{
          quoteStatus:"ACCEPTED",
          quoteAcceptedAt: serverTimestamp(),
          quoteUpdatedAt: serverTimestamp(),
          commercialUpdatedAt: serverTimestamp(),
          commercialStatus: "DEVIS_ACCEPTE"
        });
        showAlert("✅ Devis accepté.", true);
      }catch(e){
        console.error(e);
        showAlert("⛔ Impossible d’accepter : " + (e?.message || "inconnu"));
      }
    }

    function render(){
      const filtered = getFiltered();
      listBox.innerHTML = "";

      if(!filtered.length){
        listBox.innerHTML = `<div class="card"><b>Aucun devis</b><div style="margin-top:6px; font-size:12px; color:#666; font-weight:800;">Change le filtre ou la recherche.</div></div>`;
        return;
      }

      for(const r of filtered){
        const created = fmtDateFR(r.createdAt);
        const num = quoteNumberForRow(r);

        // client
        const client = (r.clientName || r.ownerName || "—");

        // logement + période + total
        const logement = (r.kind === "EVENT")
          ? ((r.homeName||"—") + (r.homeCity ? (" — " + r.homeCity) : ""))
          : "—";

        const periode = (r.kind === "EVENT") ? periodFromEvent(r) : "—";

        const total = (r.kind === "EVENT")
          ? getQuoteTotalFromEvent(r)
          : getQuoteTotalFromFree(r);

        const st = String(r.quoteStatus||"").toUpperCase().trim();
        const canInvoice = (r.kind === "EVENT") && (st === "ACCEPTED");
        const canAccept  = (r.kind === "EVENT") && (st !== "ACCEPTED");

        const openHref = (r.kind === "EVENT")
          ? `devis-event.html?eventId=${encodeURIComponent(r.id)}`
          : `devis-free.html?docId=${encodeURIComponent(r.id)}`;

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="row">
            <div class="k"><div class="t">Créé</div><div class="v">${esc(created)}</div></div>
            <div class="k"><div class="t">N° devis</div><div class="v">${esc(num)}</div></div>
            <div class="k wide"><div class="t">Client</div><div class="v">${esc(client)}</div></div>
            <div class="k wide"><div class="t">Logement</div><div class="v">${esc(logement)}</div></div>
          </div>

          <div class="row" style="margin-top:10px;">
            <div class="k wide"><div class="t">Période</div><div class="v">${esc(periode)}</div></div>
            <div class="k"><div class="t">Total TTC</div><div class="v">${fmtMoney(total)}</div></div>
            <div class="k"><div class="t">Statut</div><div class="v">${badgeForQuoteStatus(r.quoteStatus)}</div></div>

            <div class="k" style="align-items:flex-end;">
              <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
                <a class="btn primary" href="${openHref}">Ouvrir</a>

                <button class="btn" type="button"
                  ${canAccept ? "" : "disabled"}
                  data-action="accept"
                  data-id="${esc(r.id)}"
                  title="${r.kind === "EVENT" ? "Marquer le devis comme accepté" : "Réservé aux devis logement"}"
                >Accepter</button>

                <a class="btn" href="facture.html?eventId=${encodeURIComponent(r.id)}"
                  ${canInvoice ? "" : "aria-disabled='true' onclick='return false;' style='pointer-events:none; opacity:.45;'"}
                  title="${r.kind === "EVENT" ? (canInvoice ? "Créer/ouvrir la facture" : "Grisé tant que le devis n’est pas accepté") : "Réservé aux devis logement"}"
                >Passer en facture</a>
              </div>
            </div>
          </div>
        `;
        listBox.appendChild(div);
      }

      // bind actions
      for(const btn of listBox.querySelectorAll('button[data-action="accept"]')){
        btn.addEventListener("click", async ()=>{
          const id = btn.getAttribute("data-id");
          if(!id) return;
          btn.disabled = true;
          await acceptEventQuote(id);
          // refresh local list quickly (sans recharger toute la page)
          const idx = all.findIndex(x => x.id === id && x.kind === "EVENT");
          if(idx >= 0){
            all[idx].quoteStatus = "ACCEPTED";
          }
          render();
        });
      }
    }

    async function loadAllQuotes(uid){
      // 1) events (devis logement)
      const qEvents = query(
        collection(db, "events"),
        where("conciergerieUid", "==", uid),
        orderBy("createdAt", "desc"),
        limit(400)
      );
      const snapE = await getDocs(qEvents);
      const events = snapE.docs.map(d => ({ kind:"EVENT", id:d.id, ...(d.data()||{}) }));

      const filteredEvents = events.filter(r => {
        const qs = String(r.quoteStatus||"").toUpperCase().trim();
        const cs = String(r.commercialStatus||"").toUpperCase().trim();
        return qs === "DRAFT" || qs === "SENT" || qs === "ACCEPTED" || qs === "REFUSED" || cs === "DEVIS" || cs.startsWith("DEVIS");
      });

      // 2) salesDocuments (devis libre prospect)
      const qSales = query(
        collection(db, "salesDocuments"),
        where("conciergerieUid", "==", uid),
        where("type","==","QUOTE"),
        orderBy("createdAt","desc"),
        limit(400)
      );
      const snapS = await getDocs(qSales);
      const sales = snapS.docs.map(d => ({ kind:"FREE", id:d.id, ...(d.data()||{}) }));

      const filteredSales = sales.filter(s => String(s.docType||"").toUpperCase().trim() === "QUOTE_FREE");

      // normalisation clientName pour search/render
      for(const s of filteredSales){
        s.clientName = s.clientName || s.clientCompany || s.clientFullName || "—";
      }

      all = [...filteredEvents, ...filteredSales]
        .sort((a,b)=>{
          const ta = a?.createdAt?.toMillis?.() ? a.createdAt.toMillis() : (a?.createdAt ? new Date(a.createdAt).getTime() : 0);
          const tb = b?.createdAt?.toMillis?.() ? b.createdAt.toMillis() : (b?.createdAt ? new Date(b.createdAt).getTime() : 0);
          return tb - ta;
        });

      render();
    }

    filterStatus.addEventListener("change", render);
    searchInput.addEventListener("input", render);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      emailLine.textContent = user.email || user.uid;

      hideAlert();
      try{
        await loadAllQuotes(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur chargement devis : " + (e?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
