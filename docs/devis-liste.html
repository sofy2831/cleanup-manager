<!-- docs/devis-liste.html (FINAL — design aligné factures-liste + responsive mobile corrigé) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e;
      --ok:#1b8f4d;
      --warn:#b06b00;
      --card: rgba(255,255,255,.86);
    }

    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:12px 12px 24px;
      padding-bottom:88px;
      position:relative;
    }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:8px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }

    .pill-link{
      display:inline-flex; align-items:center; gap:8px;
      padding:7px 11px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:12.5px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; cursor:pointer;
    }

    .pill-link.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .logo-title{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:6px; margin-bottom:2px; text-align:center;
    }

    .logo-icon{
      width:64px; height:64px; border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex; align-items:center; justify-content:center;
      color:var(--violet); font-size:18px; font-weight:900;
      position:relative; flex-shrink:0; overflow:hidden;
    }

    .logo-icon img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet); }

    h1{ margin:0; font-size:20px; font-weight:900; color:#111; line-height:1.1; }

    .subtitle{
      font-size:13px; color:#444; margin-top:2px;
      text-align:center; font-weight:800;
    }

    .badge{
      margin-top:8px; padding:3px 9px; border-radius:999px; background:#fff;
      font-size:11.5px; color:#555; box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center; font-weight:900; white-space:pre-wrap;
    }

    .wrap{ width:100%; max-width:1100px; margin-top:10px; display:flex; flex-direction:column; gap:10px; }

    .card{
      width:100%;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:12px;
      backdrop-filter: blur(10px);
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      min-width:0;
    }

    .left{ min-width:0; flex:1; }

    .row1{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }

    .num{
      font-weight:1000;
      font-size:13.5px;
      color:#111;
      line-height:1.2;
      word-break:break-word;
    }

    .statusPill{
      padding:3px 8px; border-radius:999px; background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      font-size:11px; font-weight:1000; color:#555;
      white-space:nowrap;
    }

    .statusPill.ok{ border-color: rgba(27,143,77,0.30); color: var(--ok); }
    .statusPill.bad{ border-color: rgba(179,38,30,0.25); color: var(--bad); }
    .statusPill.warn{ border-color: rgba(176,107,0,0.25); color: var(--warn); }

    .meta{
      margin-top:6px;
      font-size:12px; color:#222; font-weight:850; line-height:1.25;
      display:flex; flex-direction:column; gap:3px;
      word-break:break-word;
      min-width:0;
    }

    .mut{ color:var(--muted); font-weight:900; }

    .right{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      flex-shrink:0;
      min-width:0;
    }

    .btn{
      border:none; border-radius:999px;
      padding:8px 10px;
      font-size:12px; font-weight:1000;
      cursor:pointer;
      background:#fff; color:var(--violet);
      border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
      user-select:none;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .btn.danger{
      background:#fff; color:var(--bad);
      border-color: rgba(179,38,30,0.45);
    }

    .btn[aria-disabled="true"]{ opacity:.55; pointer-events:none; }
    .btn:disabled{ opacity:.65; cursor:not-allowed; pointer-events:none; }

    .alert{
      margin-top:8px; padding:9px 11px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
      font-weight:800;
    }

    .alert.ok{ border-left-color: var(--ok); }

    .searchRow{
      width:100%;
      display:flex;
      gap:10px;
      align-items:center;
      flex-wrap:wrap;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      border-radius:18px;
      padding:10px;
    }

    .searchRow .field{ flex:1; min-width:220px; }

    label{ display:block; font-size:11.8px; font-weight:1000; color:#333; margin:0 0 4px; }

    input, select{
      width:100%; padding:9px 11px; border-radius:12px; border:1px solid #D3C7FF;
      font-size:13px; outline:none; background:#fff; font-weight:800; color:#111;
    }

    input:focus, select:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .totalsCard{
      width:100%;
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:12px;
    }

    .totalsGrid{
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:10px;
    }

    .tBox{
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:10px 12px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      background:#fff;
    }

    .tBox .t{ font-size:11px; color:#666; font-weight:900; }
    .tBox .v{ margin-top:2px; font-size:14px; color:#111; font-weight:1000; }

    .empty{
      background:#fff; border:1px solid rgba(0,0,0,0.06);
      border-radius:18px; box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:14px; font-weight:900; color:#555; text-align:center;
    }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 9px 10px calc(9px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }

    .bottom-nav a{
      flex:1; text-align:center; font-size:10.8px; font-weight:1000; text-decoration:none;
      color:#666; padding:9px 8px; border-radius:999px; white-space:nowrap;
    }

    .modalMask{
      position:fixed;
      inset:0;
      z-index:200;
      background:rgba(0,0,0,.35);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }

    .modal{
      width:100%;
      max-width:920px;
      background:#fff;
      border-radius:18px;
      border:1px solid rgba(0,0,0,0.08);
      box-shadow:0 20px 50px rgba(0,0,0,0.25);
      overflow:hidden;
      display:flex;
      flex-direction:column;
      max-height:calc(100vh - 32px);
    }

    .modalHead{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:12px 14px;
      background:linear-gradient(90deg, rgba(122,92,255,0.14), rgba(98,56,255,0.10));
      border-bottom:1px solid rgba(0,0,0,0.06);
      flex-shrink:0;
    }

    .modalHead .title{
      font-weight:1000;
      font-size:14px;
      color:#111;
    }

    .modalBody{
      padding:14px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      min-height:0;
    }

    .mini{
      font-size:12px;
      color:#444;
      font-weight:850;
      line-height:1.35;
    }

    .kv{
      display:grid;
      grid-template-columns: 120px 1fr;
      gap:8px 10px;
      margin-top:10px;
      font-size:12px;
      font-weight:900;
      color:#333;
    }

    .kv div:nth-child(odd){ color:#666; font-weight:900; }

    .textBlock{
      white-space:pre-wrap;
      background:rgba(248,244,255,.55);
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:12px;
      font-size:12.5px;
      font-weight:800;
      line-height:1.45;
      color:#111;
      margin-top:12px;
      word-break:break-word;
    }

    .copyRow{
      margin-top:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .successBar{
      display:none;
      margin-bottom:10px;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(27,143,77,0.25);
      background: rgba(27,143,77,0.06);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:1000;
      color:#0f5f31;
      align-items:center;
      justify-content:space-between;
      gap:10px;
    }

    .successBar .left{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:0;
      flex-wrap:wrap;
    }

    .successBar .right{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .pillMini{
      display:inline-flex; align-items:center; gap:6px;
      padding:4px 10px; border-radius:999px;
      border:1px solid rgba(122,92,255,0.25);
      background:rgba(122,92,255,0.06);
      font-size:11px; font-weight:1000; color:#4b2cff;
      white-space:nowrap;
    }

    .ownerBox{
      margin-top:12px;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:16px;
      padding:12px;
      background:#fff;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      display:none;
    }

    .ownerHead{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .ownerHead .t{
      font-weight:1000;
      font-size:12.5px;
      color:#111;
    }

    .ownerMeta{
      margin-top:8px;
      display:grid;
      grid-template-columns: 120px 1fr;
      gap:8px 10px;
      font-size:12px;
      font-weight:900;
      color:#333;
    }

    .ownerMeta div:nth-child(odd){ color:#666; font-weight:900; }

    .ownerHint{
      margin-top:10px;
      font-size:12px;
      font-weight:850;
      color:#444;
      line-height:1.35;
    }

    .modalAlert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      color:#444;
      white-space:pre-wrap;
    }

    .modalAlert.ok{ border-left-color: var(--ok); }

    .textBlock2{
      white-space:pre-wrap;
      background:rgba(248,244,255,.55);
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:12px;
      font-size:12.5px;
      font-weight:800;
      line-height:1.45;
      color:#111;
      margin-top:12px;
      word-break:break-word;
    }

    @media(max-width:720px){
      .totalsGrid{ grid-template-columns:1fr; }
    }

    @media(min-width:980px){
      .bottom-nav{
        position: static; max-width: 1100px; margin: 10px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom:24px; }
    }

    @media(max-width:760px){
      .card{
        flex-direction:column;
        align-items:stretch;
        gap:12px;
      }

      .left,
      .right{
        width:100%;
        min-width:0;
      }

      .right{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:8px;
        justify-content:stretch;
      }

      .right .btn,
      .right a.btn{
        width:100%;
        min-width:0;
        padding:10px 8px;
        font-size:12px;
      }

      .meta{
        gap:6px;
        line-height:1.3;
      }
    }

    @media(max-width:520px){
      .topbar{
        align-items:center;
      }

      .right{
        grid-template-columns:1fr;
      }

      .num{
        font-size:13px;
      }

      .statusPill{
        font-size:10.5px;
      }

      .meta{
        font-size:11.8px;
      }
    }

    @media(max-width:640px){
      .modalMask{
        align-items:flex-start;
        padding:10px;
      }

      .modal{
        max-height:calc(100vh - 20px);
        margin:0;
      }

      .copyRow{
        flex-direction:column;
        align-items:stretch;
      }

      .copyRow .btn{
        width:100%;
      }

      .kv,
      .ownerMeta{
        grid-template-columns:1fr;
      }

      .successBar{
        flex-direction:column;
        align-items:stretch;
      }

      .successBar .right{
        justify-content:stretch;
      }

      .successBar .right .btn{
        width:100%;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" href="compta.html">← Retour</a>
      <a class="pill-link primary" href="devis.html">+ Nouveau devis</a>
    </div>

    <div class="logo-title">
      <div class="logo-icon" id="logoIcon">
        <img id="logoImg" alt="Logo">
        <span id="logoFallback">D</span>
      </div>
      <h1 id="pageTitle">Conciergerie</h1>
    </div>

    <div class="subtitle">Devis</div>
    <div class="badge" id="companyBadge">—</div>

    <div class="wrap">
      <div class="searchRow">
        <div class="field">
          <label for="searchInput">Recherche</label>
          <input id="searchInput" type="text" placeholder="N° devis, client, email, logement…" />
        </div>
        <button class="btn" id="clearBtn" type="button">Effacer</button>
        <button class="btn primary" id="refreshBtn" type="button">Rafraîchir</button>
      </div>

      <div class="totalsCard" id="totalsCard" style="display:none;">
        <div style="font-weight:1000; margin-bottom:10px;">Totaux (devis affichés)</div>
        <div class="totalsGrid" id="totalsGrid"></div>
        <div style="margin-top:8px; font-size:12px; color:#666; font-weight:850;" id="totalsNote"></div>
      </div>

      <div class="alert" id="alertBox"></div>
      <div id="list"></div>
    </div>
  </div>
