<!-- docs/devis-liste.html (FINAL — events + salesDocuments, DE/DF, 1 ligne + actions, FACTURE = création salesDocuments INVOICE depuis EVENT) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet);
      color:var(--violet);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .logo-title{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:10px;
      margin-bottom:6px;
      text-align:center;
    }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff;
      border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet);
      font-size:22px;font-weight:900;
      position:relative;
      flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-5px;
      font-size:12px;
      color:var(--violet);
    }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }
    .helloLine{ margin-top:10px; font-size:13px; color:#333; font-weight:900; text-align:center; }
    .emailLine{ margin-top:4px; font-size:13px; color:var(--muted); font-weight:800; text-align:center; }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      min-width:0;
    }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .toolbar{
      display:grid;
      grid-template-columns: 220px 1fr auto;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:720px){
      .toolbar{ grid-template-columns: 1fr; }
    }

    .select{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.35);
      background:#fff;
      font-weight:900;
      color:#222;
      outline:none;
    }

    .searchbar{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      min-width:0;
    }
    .s-ico{ font-size:14px; opacity:.75; }
    .input{
      flex:1;
      border:none;
      outline:none;
      font-size:13px;
      font-weight:900;
      color:#111;
      background:transparent;
      min-width:0;
    }

    .btn{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      text-decoration:none;
      font-weight:900;
      font-size:12px;
      background:#fff;
      color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
      user-select:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }

    .freeRow{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:10px;
      flex-wrap:wrap;
    }
    .freeText{
      min-width:240px;
      flex:1;
    }
    .freeText .t{
      font-size:14px;
      font-weight:1000;
      margin:0;
    }
    .freeText .p{
      margin-top:6px;
      font-size:12px;
      color:#666;
      font-weight:800;
      line-height:1.35;
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:flex-start;
      min-width:0;
    }
    .k{
      min-width:220px;
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:0;
    }
    .k .t{ font-size:12px; color:#666; font-weight:900; }
    .k .v{ font-size:13px; color:#111; font-weight:900; }
    .v.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:#333;
      white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    /* 1 ligne 6 colonnes */
    .line6{
      display:grid;
      grid-template-columns: 110px 160px 1.2fr 1.2fr 1.1fr 130px;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:900px){
      .line6{
        grid-template-columns: 110px 160px 1fr 1fr;
        grid-auto-rows:auto;
      }
    }
    @media(max-width:560px){
      .line6{ grid-template-columns: 1fr 1fr; }
    }
    .cell{ min-width:0; }
    .cell .t{ font-size:11px; color:#666; font-weight:900; }
    .cell .v{ font-size:13px; color:#111; font-weight:900; }
    .cell .v.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .tag{
      display:inline-flex; align-items:center; justify-content:center;
      padding:4px 8px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
    }
    .tag.de{ color:var(--violet); }
    .tag.df{ color:#444; }

    .bottom-nav{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      gap: 6px;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 900;
      color: #666;
      padding: 10px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        width: 100%;
        max-width: 980px;
        margin: 14px 0 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px;
        gap: 10px;
      }
      .bottom-nav a{
        font-size: 13px;
        padding: 12px 12px;
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="compta.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon">✓</div>
      <h1>Devis</h1>
    </div>

    <div class="subtitle">Gestion de vos devis</div>
    <div class="helloLine" id="helloLine">Bonjour,</div>
    <div class="emailLine" id="companyLine">—</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="card">
        <div class="freeRow">
          <div class="freeText">
            <p class="t">Devis (sans logement)</p>
            <p class="p">Prospect : devis libre, sans séjour.</p>
          </div>
          <a class="btn primary" href="devis-free.html">Créer un devis</a>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <select class="select" id="filterStatus">
            <option value="ALL">Tous</option>
            <option value="DRAFT">Brouillons</option>
            <option value="SENT">Envoyés</option>
            <option value="ACCEPTED">Acceptés</option>
            <option value="REFUSED">Refusés</option>
            <option value="MISSING">Sans statut</option>
          </select>

          <div class="searchbar" title="Recherche">
            <span class="s-ico">🔎</span>
            <input class="input" id="searchInput" type="search" placeholder="Rechercher (n° devis, client, logement…)" autocomplete="off" />
          </div>

          <span></span>
        </div>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, updateDoc, setDoc, runTransaction, serverTimestamp,
      collection, query, where, orderBy, limit, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const helloLine = document.getElementById("helloLine");
    const companyLine = document.getElementById("companyLine");

    const filterStatus = document.getElementById("filterStatus");
    const searchInput = document.getElementById("searchInput");
    const listBox = document.getElementById("listBox");

    let all = [];
    let currentUid = null;

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }

    // ✅ date FR robuste : Timestamp / Date / YYYY-MM-DD / DD/MM/YYYY
    function fmtDateFR(x){
      if(!x) return "—";
      try{
        if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
        if(x instanceof Date) return isNaN(x.getTime()) ? "—" : x.toLocaleDateString("fr-FR");

        const s = String(x).trim();
        if(!s) return "—";
        if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;

        const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if(m) return `${m[3]}/${m[2]}/${m[1]}`;

        const d = new Date(s);
        if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
        return "—";
      }catch{
        return "—";
      }
    }

    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }

    function getQuoteTotalEvent(ev){
      if(ev?.quoteAmount != null && ev.quoteAmount !== "") return Number(ev.quoteAmount);
      if(ev?.total != null && ev.total !== "") return Number(ev.total);
      return computeTotalFromLines(ev?.lines);
    }

    function getQuoteTotalFree(d){
      if(d?.quoteAmount != null && d.quoteAmount !== "") return Number(d.quoteAmount);
      if(d?.totalTTC != null && d.totalTTC !== "") return Number(d.totalTTC);
      return computeTotalFromLines(d?.lines);
    }

    function badgeForQuoteStatus(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return `<span class="badge bad">Sans statut</span>`;
      if(x === "ACCEPTED") return `<span class="badge ok">Accepté</span>`;
      if(x === "SENT") return `<span class="badge">Envoyé</span>`;
      if(x === "DRAFT") return `<span class="badge">Brouillon</span>`;
      if(x === "REFUSED") return `<span class="badge bad">Refusé</span>`;
      return `<span class="badge">${esc(x)}</span>`;
    }

    function matchesFilter(item){
      const f = filterStatus.value;
      const st = String(item.quoteStatus||"").toUpperCase().trim();
      if(f === "ALL") return true;
      if(f === "MISSING") return !st;
      return st === f;
    }

    function matchesSearch(item){
      const q = (searchInput.value||"").trim().toLowerCase();
      if(!q) return true;

      const hay = [
        item.quoteNumber,
        item.kind,
        item.homeName, item.homeCity,
        item.ownerName, item.ownerEmail,
        item.clientName, item.clientEmail
      ].filter(Boolean).join(" ").toLowerCase();

      return hay.includes(q);
    }

    function getFiltered(){
      return all.filter(e => matchesFilter(e) && matchesSearch(e));
    }

    function isAccepted(x){
      return String(x?.quoteStatus||"").toUpperCase().trim() === "ACCEPTED";
    }

    function getCreatedAt(x){
      return fmtDateFR(x?.createdAt);
    }

    function getQuoteNumber(x){
      const n = String(x?.quoteNumber || "").trim();
      if(n) return n;
      return (x?.kind === "FREE") ? "DF—" : "DE—";
    }

    function getClientName(x){
      if(x?.kind === "FREE"){
        return (x?.clientName || x?.clientCompany || x?.clientFullName || "—");
      }
      return (x?.ownerName || "—");
    }

    // ✅ Logement = NOM SEUL
    function getHomeName(x){
      if(x?.kind === "FREE") return "—";
      return (x.homeName||"—");
    }

    // ✅ Période basée sur arrivalDateKey / departureDateKey
    function getPeriodFromEvent(ev){
      const a0 = ev?.arrivalDateKey;
      const b0 = ev?.departureDateKey;

      if(a0 || b0){
        const fa0 = fmtDateFR(a0);
        const fb0 = fmtDateFR(b0);
        if(fa0 !== "—" && fb0 !== "—") return `${fa0} → ${fb0}`;
        if(fa0 !== "—") return `${fa0} → —`;
        if(fb0 !== "—") return `— → ${fb0}`;
      }

      if(ev?.dateKey) return String(ev.dateKey);
      if(ev?.date) return fmtDateFR(ev.date);
      return "—";
    }

    async function acceptEventQuote(eventId){
      await updateDoc(doc(db,"events",eventId),{
        quoteStatus:"ACCEPTED",
        quoteAcceptedAt: serverTimestamp(),
        quoteUpdatedAt: serverTimestamp(),
        commercialUpdatedAt: serverTimestamp(),
        commercialStatus: "DEVIS_ACCEPTE"
      });
    }

    async function acceptFreeQuote(docId){
      await updateDoc(doc(db,"salesDocuments",docId),{
        quoteStatus:"ACCEPTED",
        quoteAcceptedAt: serverTimestamp(),
        quoteUpdatedAt: serverTimestamp(),
        commercialUpdatedAt: serverTimestamp()
      });
    }

    // ===== FACTURE : création d'une INVOICE dans salesDocuments depuis EVENT =====
    async function ensureInvoiceNumber(uid){
      const year = new Date().getFullYear();
      const counterId = `${uid}_${year}`;
      const counterRef = doc(db, "counters", counterId);

      const next = await runTransaction(db, async (tx)=>{
        const snap = await tx.get(counterRef);
        if(!snap.exists()){
          tx.set(counterRef, { quoteSeq: 0, invoiceSeq: 0, creditSeq: 0 });
        }
        const c = snap.exists() ? (snap.data() || {}) : { invoiceSeq: 0 };
        const n = (Number(c.invoiceSeq)||0) + 1;
        tx.set(counterRef, { ...c, invoiceSeq: n }, { merge:true });
        return n;
      });

      return `FA${year}-${String(next).padStart(4,"0")}`;
    }

    async function createInvoiceFromEvent(eventId, uid){
      const evRef = doc(db, "events", eventId);
      const evSnap = await getDoc(evRef);
      if(!evSnap.exists()) throw new Error("Event introuvable.");
      const ev = evSnap.data() || {};

      if(String(ev.conciergerieUid||"") !== String(uid)) throw new Error("Accès refusé.");

      const invoiceNumber = await ensureInvoiceNumber(uid);
      const invRef = doc(collection(db,"salesDocuments"));

      const inv = {
        conciergerieUid: uid,

        type: "INVOICE",
        docType: "INVOICE_EVENT",
        commercialStatus: "FACTURE",
        invoiceStatus: "DRAFT",
        invoiceNumber,

        listable: true,
        createdAt: serverTimestamp(),
        commercialUpdatedAt: serverTimestamp(),

        // lien source
        sourceKind: "EVENT",
        sourceEventId: eventId,

        // recap logement
        homeId: ev.homeId || "",
        homeName: ev.homeName || "",
        homeAddress: ev.homeAddress || "",
        homeZip: ev.homeZip || "",
        homeCity: ev.homeCity || "",

        // client (sur event, parfois ownerName/email, parfois assignedTo)
        clientName: (ev.ownerName || ev.assignedToName || "").trim(),
        clientEmail: (ev.ownerEmail || ev.assignedToEmail || "").trim(),

        arrivalDateKey: ev.arrivalDateKey || ev.dateKey || ev.date || "",
        departureDateKey: ev.departureDateKey || "",

        lines: Array.isArray(ev.lines) ? ev.lines : [],
        total: Number(ev.total) || computeTotalFromLines(ev.lines),

        // optionnel : garder le devis N° si tu l'as sur l'event
        quoteNumber: ev.quoteNumber || "",
      };

      await setDoc(invRef, inv);
      return { invoiceId: invRef.id, invoiceNumber };
    }

    function render(){
      const filtered = getFiltered();
      listBox.innerHTML = "";

      if(!filtered.length){
        listBox.innerHTML = `
          <div class="card">
            <b>Aucun devis</b>
            <div style="margin-top:6px; font-size:12px; color:#666; font-weight:800;">
              Ajuste le filtre ou la recherche.
            </div>
          </div>`;
        return;
      }

      for(const x of filtered){
        const created = getCreatedAt(x);
        const quoteNo = getQuoteNumber(x);
        const client = getClientName(x);
        const home = getHomeName(x);

        const period = (x.kind === "EVENT") ? getPeriodFromEvent(x) : "—";
        const total = (x.kind === "EVENT") ? getQuoteTotalEvent(x) : getQuoteTotalFree(x);

        const accepted = isAccepted(x);

        const openHref = (x.kind === "EVENT")
          ? `devis-event.html?eventId=${encodeURIComponent(x.id)}`
          : `devis-free.html?docId=${encodeURIComponent(x.id)}`;

        const actionsHtml = (x.kind === "EVENT")
          ? `
            <a class="btn primary" href="${openHref}">Ouvrir</a>
            <button class="btn" type="button"
              data-accept-kind="EVENT" data-accept-id="${esc(x.id)}"
              ${accepted ? "disabled" : ""}>
              Accepter
            </button>
            <button class="btn" type="button"
              data-invoice-kind="EVENT" data-invoice-id="${esc(x.id)}"
              ${accepted ? "" : "disabled"}
              title="${accepted ? "Créer la facture (salesDocuments)" : "Grisé tant que le devis n’est pas accepté"}">
              Passer en facture
            </button>
          `
          : `
            <a class="btn primary" href="${openHref}">Ouvrir</a>
            <button class="btn" type="button"
              data-accept-kind="FREE" data-accept-id="${esc(x.id)}"
              ${accepted ? "disabled" : ""}>
              Accepter
            </button>
          `;

        const prefix = (x.kind === "FREE") ? "DF" : "DE";
        const tagClass = (x.kind === "FREE") ? "df" : "de";

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="line6">
            <div class="cell">
              <div class="t">Créé</div>
              <div class="v">${esc(created)}</div>
            </div>

            <div class="cell">
              <div class="t">N°</div>
              <div class="v">
                <span class="tag ${tagClass}">${prefix}</span>
                <span style="margin-left:6px;">${esc(quoteNo)}</span>
              </div>
            </div>

            <div class="cell">
              <div class="t">Client</div>
              <div class="v ellipsis" title="${esc(client)}">${esc(client)}</div>
            </div>

            <div class="cell">
              <div class="t">Logement</div>
              <div class="v ellipsis" title="${esc(home)}">${esc(home)}</div>
            </div>

            <div class="cell">
              <div class="t">Période</div>
              <div class="v ellipsis" title="${esc(period)}">${esc(period)}</div>
            </div>

            <div class="cell" style="text-align:right;">
              <div class="t">Total TTC</div>
              <div class="v">${fmtMoney(total)}</div>
            </div>
          </div>

          <div class="row" style="margin-top:10px;">
            <div class="k">
              <div class="t">Statut</div>
              <div class="v">${badgeForQuoteStatus(x.quoteStatus)}</div>
            </div>

            <div class="k" style="align-items:flex-end; min-width:280px;">
              <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
                ${actionsHtml}
              </div>
            </div>
          </div>
        `;
        listBox.appendChild(div);
      }
    }

    // ✅ 1 seul handler (pas 400 listeners à chaque render)
    document.addEventListener("click", async (e)=>{
      const acceptBtn = e.target.closest("button[data-accept-id]");
      const invoiceBtn = e.target.closest("button[data-invoice-id]");

      if(acceptBtn){
        const id = acceptBtn.getAttribute("data-accept-id");
        const kind = acceptBtn.getAttribute("data-accept-kind");
        if(!id || !kind) return;

        acceptBtn.disabled = true;
        hideAlert();

        try{
          if(kind === "EVENT"){
            await acceptEventQuote(id);
            const idx = all.findIndex(z => z.id === id && z.kind === "EVENT");
            if(idx >= 0) all[idx].quoteStatus = "ACCEPTED";
            showAlert("✅ Devis logement accepté.", true);
          }else{
            await acceptFreeQuote(id);
            const idx = all.findIndex(z => z.id === id && z.kind === "FREE");
            if(idx >= 0) all[idx].quoteStatus = "ACCEPTED";
            showAlert("✅ Devis prospect accepté.", true);
          }
          render();
        }catch(err){
          console.error(err);
          showAlert("⛔ Impossible d’accepter : " + (err?.message || "inconnu"));
          acceptBtn.disabled = false;
        }
        return;
      }

      if(invoiceBtn){
        const id = invoiceBtn.getAttribute("data-invoice-id");
        const kind = invoiceBtn.getAttribute("data-invoice-kind");
        if(!id || !kind) return;

        if(kind !== "EVENT"){
          // tu as dit: on ne facture jamais un prospect
          return;
        }

        invoiceBtn.disabled = true;
        const oldText = invoiceBtn.textContent;
        invoiceBtn.textContent = "Création…";
        hideAlert();

        try{
          if(!currentUid) throw new Error("Utilisateur non connecté.");
          const { invoiceId } = await createInvoiceFromEvent(id, currentUid);

          showAlert("✅ Facture créée.", true);
          // redirection vers page facture basée sur salesDocuments
          location.href = `facture.html?docId=${encodeURIComponent(invoiceId)}`;
        }catch(err){
          console.error(err);
          showAlert("⛔ Erreur création facture : " + (err?.message || "inconnue"));
          invoiceBtn.disabled = false;
          invoiceBtn.textContent = oldText;
        }
      }
    });

    async function loadQuotes(uid){
      // 1) events (devis logement)
      const qEvents = query(
        collection(db, "events"),
        where("conciergerieUid", "==", uid),
        orderBy("createdAt", "desc"),
        limit(400)
      );
      const snapE = await getDocs(qEvents);
      const events = snapE.docs.map(d => ({ kind:"EVENT", id: d.id, ...(d.data()||{}) }))
        .filter(r => {
          const qs = String(r.quoteStatus||"").toUpperCase().trim();
          const cs = String(r.commercialStatus||"").toUpperCase().trim();
          return qs === "DRAFT" || qs === "SENT" || qs === "ACCEPTED" || qs === "REFUSED" || cs === "DEVIS" || cs.startsWith("DEVIS");
        });

      // 2) salesDocuments (devis prospect) — on garde (même si tu ne factures pas)
      let sales = [];
      try{
        const qSales = query(
          collection(db, "salesDocuments"),
          where("conciergerieUid", "==", uid),
          where("type", "==", "QUOTE"),
          where("docType", "==", "QUOTE_FREE"),
          where("listable", "==", true),
          orderBy("createdAt", "desc"),
          limit(400)
        );
        const snapS = await getDocs(qSales);
        sales = snapS.docs.map(d => ({ kind:"FREE", id: d.id, ...(d.data()||{}) }));
      }catch(e){
        console.warn("SalesDocuments query failed (index). Fallback.", e);
        const qSalesFallback = query(
          collection(db, "salesDocuments"),
          where("conciergerieUid", "==", uid),
          where("type", "==", "QUOTE"),
          where("docType", "==", "QUOTE_FREE"),
          orderBy("createdAt", "desc"),
          limit(400)
        );
        const snapS2 = await getDocs(qSalesFallback);
        sales = snapS2.docs
          .map(d => ({ kind:"FREE", id: d.id, ...(d.data()||{}) }))
          .filter(s => s.listable === true);
      }

      all = [...events, ...sales].sort((a,b)=>{
        const ta = a?.createdAt?.toMillis?.() ? a.createdAt.toMillis() : (a?.createdAt ? new Date(a.createdAt).getTime() : 0);
        const tb = b?.createdAt?.toMillis?.() ? b.createdAt.toMillis() : (b?.createdAt ? new Date(b.createdAt).getTime() : 0);
        return tb - ta;
      });

      render();
    }

    async function loadCompanyName(user){
      try{
        const uSnap = await getDoc(doc(db, "users", user.uid));
        const company = uSnap.exists() ? (uSnap.data()?.businessProfile?.companyName || "") : "";
        companyLine.textContent = (company || "").trim() || "Conciergerie";
      }catch{
        companyLine.textContent = "Conciergerie";
      }
    }

    filterStatus.addEventListener("change", render);
    searchInput.addEventListener("input", render);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUid = user.uid;

      if(helloLine) helloLine.textContent = "Bonjour,";
      await loadCompanyName(user);

      hideAlert();
      try{
        await loadQuotes(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur chargement devis : " + (e?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
