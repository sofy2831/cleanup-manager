<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Mes contrats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}:root{--violet:#7A5CFF;--violet2:#6238FF;--bg1:#F8F4FF;--bg2:#EDE6FF;--text:#111;--muted:#666;--border:rgba(122,92,255,.18);--shadow:0 14px 36px rgba(0,0,0,.08);--bad:#b3261e;--ok:#1b8f4d;--warn:#b06b00;--card:rgba(255,255,255,.88)}body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text)}.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 12px 96px}.topbar{width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:10;padding:8px 0;background:rgba(248,244,255,.85);backdrop-filter:blur(6px);flex-wrap:wrap}.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border-radius:999px;background:#fff;border:2px solid var(--violet);color:var(--violet);font-size:12.5px;font-weight:1000;text-decoration:none;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.06);white-space:nowrap}.hero{width:100%;max-width:980px;text-align:center;margin-top:8px;display:flex;flex-direction:column;align-items:center;gap:6px}.logo{width:48px;height:48px;border-radius:50%;border:2px solid var(--violet);background:#fff;display:flex;align-items:center;justify-content:center;color:var(--violet);font-weight:1000;box-shadow:0 3px 10px rgba(0,0,0,.06)}h1{margin:0;font-size:24px;font-weight:1000;line-height:1.1}.subtitle{margin:0;color:#444;font-size:14px;font-weight:850}.badge{margin-top:8px;padding:5px 10px;border-radius:999px;background:#fff;color:#555;font-size:12px;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.06)}.wrap{width:100%;max-width:980px;margin-top:14px;display:flex;flex-direction:column;gap:10px}.searchRow{width:100%;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--border);box-shadow:0 10px 22px rgba(0,0,0,.08);border-radius:18px;padding:10px}.field{flex:1;min-width:220px}label{display:block;margin:0 0 4px;font-size:11.8px;font-weight:1000;color:#333}input,select{width:100%;padding:9px 11px;border-radius:12px;border:1px solid #D3C7FF;font-size:13px;outline:none;background:#fff;font-weight:800;color:#111}input:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 2px rgba(122,92,255,.15)}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:14px;backdrop-filter:blur(10px);display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.left{min-width:0;flex:1}.row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.num{font-size:14px;font-weight:1000;color:#111;word-break:break-word}.status{display:inline-flex;padding:3px 8px;border-radius:999px;background:#fff;border:1px solid rgba(0,0,0,.08);font-size:11px;font-weight:1000;color:#555;white-space:nowrap}.status.ok{color:var(--ok);border-color:rgba(27,143,77,.25)}.status.warn{color:var(--warn);border-color:rgba(176,107,0,.25)}.status.bad{color:var(--bad);border-color:rgba(179,38,30,.25)}.meta{margin-top:7px;display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:850;line-height:1.3;color:#222;word-break:break-word}.mut{color:var(--muted);font-weight:900}.right{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 10px;border-radius:999px;background:#fff;border:2px solid var(--violet);color:var(--violet);font-size:12px;font-weight:1000;text-decoration:none;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.06);white-space:nowrap}.btn.primary{background:linear-gradient(90deg,var(--violet),var(--violet2));border-color:transparent;color:#fff}.alert{display:none;padding:10px 12px;background:#fff;border-radius:14px;border-left:5px solid var(--bad);box-shadow:0 3px 10px rgba(0,0,0,.06);font-size:12px;color:#444;font-weight:900;white-space:pre-wrap}.empty{background:#fff;border:1px solid rgba(0,0,0,.06);border-radius:18px;box-shadow:0 10px 22px rgba(0,0,0,.08);padding:18px;font-weight:900;color:#555;text-align:center}.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:calc(100% - 20px);max-width:980px;display:flex;gap:6px;padding:8px;background:rgba(255,255,255,.96);border:1px solid var(--border);border-bottom:none;border-radius:22px 22px 0 0;box-shadow:0 -6px 20px rgba(0,0,0,.08);backdrop-filter:blur(10px);z-index:50}.bottom-nav a{flex:1;text-align:center;font-size:11px;font-weight:1000;text-decoration:none;color:#666;padding:10px;border-radius:999px;white-space:nowrap}.bottom-nav a.active{background:linear-gradient(90deg,var(--violet),var(--violet2));color:#fff;box-shadow:0 10px 22px rgba(0,0,0,.10)}@media(max-width:720px){.card{flex-direction:column;align-items:stretch}.right{display:grid;grid-template-columns:1fr;width:100%}.right .btn{width:100%}.topbar{align-items:stretch}.pill{flex:1}}
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="owner-dashboard.html">← Dashboard</a>
      <a class="pill" id="messagesBtn" href="owner-messages.html">Messages</a>
    </div>
    <div class="hero">
      <div class="logo">C</div>
      <h1>Mes contrats</h1>
      <p class="subtitle">Contrats transmis par votre conciergerie</p>
      <div class="badge" id="ownerBadge">—</div>
    </div>
    <div class="wrap">
      <div class="searchRow">
        <div class="field"><label for="filterStatus">Statut</label><select id="filterStatus"><option value="ALL">Tous</option><option value="SENT">Envoyés</option><option value="SIGNED">Signés</option><option value="DRAFT">Brouillons visibles</option><option value="ARCHIVED">Archivés</option></select></div>
        <div class="field"><label for="searchInput">Recherche</label><input id="searchInput" type="text" placeholder="N° contrat, logement, conciergerie…" /></div>
        <button class="btn primary" id="refreshBtn" type="button">Rafraîchir</button>
      </div>
      <div class="alert" id="alertBox"></div>
      <div id="list"></div>
    </div>
  </div>
  <nav class="bottom-nav" aria-label="Navigation propriétaire">
    <a href="owner-dashboard.html" id="navDashboard">Dashboard</a>
    <a href="owner-planning.html" id="navPlanning">Planning</a>
    <a href="owner-homes.html" id="navHomes">Logements</a>
    <a href="owner-messages.html" id="navMessages">Messages</a>
  </nav>
  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc, collection, query, where, getDocs, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    const ownerBadge=document.getElementById("ownerBadge"),alertBox=document.getElementById("alertBox"),listEl=document.getElementById("list"),filterStatus=document.getElementById("filterStatus"),searchInput=document.getElementById("searchInput"),refreshBtn=document.getElementById("refreshBtn");
    const backBtn=document.getElementById("backBtn"),messagesBtn=document.getElementById("messagesBtn"),navDashboard=document.getElementById("navDashboard"),navPlanning=document.getElementById("navPlanning"),navHomes=document.getElementById("navHomes"),navMessages=document.getElementById("navMessages");
    const params=new URLSearchParams(location.search),token=String(params.get("token")||"").trim();
    const consultMode=params.get("consult")==="1";
    const consultOwnerDocId=String(params.get("ownerDocId")||"").trim();
    let currentUser=null,currentOwnerDocId="",currentConciergerieUid="",targetOwnerUid="",allContracts=[],conciergerieName="";
    function withToken(url){if(!token)return url;const u=new URL(url,location.href);u.searchParams.set("token",token);return u.pathname+"?"+u.searchParams.toString()}
    function consultUrl(page){if(!consultMode)return withToken(page);const p=new URLSearchParams();p.set("consult","1");p.set("ownerDocId",consultOwnerDocId);p.set("returnTo","clients");return `${page}?${p.toString()}`}
    backBtn.href=consultUrl("owner-dashboard.html");messagesBtn.href=consultUrl("owner-messages.html");navDashboard.href=consultUrl("owner-dashboard.html");navPlanning.href=consultUrl("owner-planning.html");navHomes.href=consultUrl("owner-homes.html");navMessages.href=consultUrl("owner-messages.html");if(consultMode){backBtn.textContent="← Espace propriétaire";}
    function esc(s){return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function showAlert(msg){alertBox.style.display="block";alertBox.textContent=msg}function hideAlert(){alertBox.style.display="none";alertBox.textContent=""}function normalize(s){return String(s||"").trim().toLowerCase()}
    function fmtDate(x){if(!x)return"—";try{if(x?.toDate?.())return x.toDate().toLocaleDateString("fr-FR");const s=String(x).trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s)){const[y,m,d]=s.split("-");return `${d}/${m}/${y}`}const d=new Date(s);if(!isNaN(d.getTime()))return d.toLocaleDateString("fr-FR");return"—"}catch{return"—"}}
    function statusMeta(s){const st=String(s||"DRAFT").toUpperCase().trim();if(st==="SIGNED")return{txt:"SIGNÉ",cls:"ok"};if(st==="SENT")return{txt:"ENVOYÉ",cls:""};if(st==="ARCHIVED")return{txt:"ARCHIVÉ",cls:"warn"};return{txt:"BROUILLON",cls:"warn"}}
    function periodLabel(d){const type=String(d.durationType||"INDEFINITE").toUpperCase(),start=fmtDate(d.startDate),end=fmtDate(d.endDate);return type==="FIXED"?`${start} → ${end}`:`${start} → durée indéterminée`}
    function matchesFilter(item){const f=String(filterStatus.value||"ALL").toUpperCase();if(f==="ALL")return true;return String(item.contractStatus||"DRAFT").toUpperCase()===f}
    function matchesSearch(item){const q=normalize(searchInput.value);if(!q)return true;const hay=[item.contractNumber,item.title,item.homeName,item.homeAddress,item.clientName,item.businessSnapshot?.companyName,conciergerieName].filter(Boolean).join(" ").toLowerCase();return hay.includes(q)}
    function getFiltered(){return allContracts.filter(x=>matchesFilter(x)&&matchesSearch(x))}
    function renderList(){const rows=getFiltered();listEl.innerHTML="";if(!rows.length){const empty=document.createElement("div");empty.className="empty";empty.textContent="Aucun contrat visible pour le moment.";listEl.appendChild(empty);return}rows.forEach(c=>{const st=statusMeta(c.contractStatus),title=String(c.title||"Contrat de prestation de conciergerie").trim(),number=String(c.contractNumber||"—").trim(),home=String(c.homeName||"Contrat général").trim(),business=String(c.businessSnapshot?.companyName||conciergerieName||"Conciergerie").trim();const u=new URL("contrat-apercu.html",location.href);u.searchParams.set("docId",c.id);u.searchParams.set("owner","1");if(token)u.searchParams.set("token",token);const card=document.createElement("div");card.className="card";card.innerHTML=`<div class="left"><div class="row1"><span class="num">${esc(title)}</span><span class="status ${esc(st.cls)}">${esc(st.txt)}</span></div><div class="meta"><div><span class="mut">N° :</span> ${esc(number)}</div><div><span class="mut">Conciergerie :</span> ${esc(business)}</div><div><span class="mut">Logement :</span> ${esc(home)}</div><div><span class="mut">Période :</span> ${esc(periodLabel(c))}</div></div></div><div class="right">${consultMode ? `<span class="status">Consultation</span>` : `<a class="btn primary" href="${u.pathname+"?"+u.searchParams.toString()}">Aperçu</a>`}</div>`;listEl.appendChild(card)})}
    async function loadConciergerieName(uid){try{if(!uid)return"";const snap=await getDoc(doc(db,"users",uid));const d=snap.exists()?(snap.data()||{}):{};return String(d?.businessProfile?.companyName||d?.companyName||"").trim()}catch{return""}}
    async function loadContracts(){hideAlert();listEl.innerHTML='<div class="empty">Chargement des contrats…</div>';const qContracts=query(collection(db,"contracts"),where("ownerUid","==",String(targetOwnerUid||currentUser.uid)),where("conciergerieUid","==",String(currentConciergerieUid)),where("ownerVisible","==",true),orderBy("updatedAt","desc"),limit(100));const snap=await getDocs(qContracts);allContracts=snap.docs.map(s=>({id:s.id,...(s.data()||{})}));renderList()}
    async function initUser(user){
      currentUser=user;
      const us=await getDoc(doc(db,"users",user.uid));
      const ud=us.exists()?(us.data()||{}):{};
      const role=String(ud.role||"").toLowerCase().trim();

      let name="Propriétaire";

      if(consultMode){
        if(role!=="conciergerie" && role!=="admin") throw new Error("Accès consultation réservé à la conciergerie.");
        if(!consultOwnerDocId) throw new Error("ownerDocId manquant.");

        const os=await getDoc(doc(db,"owners",consultOwnerDocId));
        if(!os.exists()) throw new Error("Propriétaire introuvable.");
        const od=os.data()||{};

        currentOwnerDocId=consultOwnerDocId;
        currentConciergerieUid=String(od.conciergerieUid||"").trim();
        targetOwnerUid=String(od.uid||"").trim();
        name=String(od.fullname||od.displayName||od.name||"Propriétaire").trim();

        if(!currentConciergerieUid||!targetOwnerUid) throw new Error("Lien propriétaire incomplet.");
        if(role!=="admin" && currentConciergerieUid!==user.uid) throw new Error("Accès refusé à ce propriétaire.");
      }else{
        if(role!=="proprietaire"){location.replace(withToken("login.html?role=proprietaire"));return}
        currentOwnerDocId=String(ud.ownerDocId||"").trim();
        currentConciergerieUid=String(ud.conciergerieUid||"").trim();
        targetOwnerUid=user.uid;
        if(!currentOwnerDocId||!currentConciergerieUid){location.replace(withToken("profil-proprietaire.html?self=1"));return}
        name=String(ud.fullname||ud.displayName||user.email||"Propriétaire").trim();
      }

      conciergerieName=await loadConciergerieName(currentConciergerieUid);
      ownerBadge.textContent=`${name}${conciergerieName?" • "+conciergerieName:""}`;
      await loadContracts();
    }
    filterStatus.addEventListener("change",renderList);searchInput.addEventListener("input",renderList);refreshBtn.addEventListener("click",async()=>{try{await loadContracts()}catch(e){console.error(e);showAlert("⛔ "+(e?.message||"Erreur chargement contrats"))}});
    onAuthStateChanged(auth,async user=>{if(!user){location.replace(consultMode?"login.html?role=conciergerie":withToken("login.html?role=proprietaire"));return}try{await initUser(user)}catch(e){console.error(e);showAlert("⛔ "+(e?.message||"Erreur chargement contrats"));listEl.innerHTML=""}});
  </script>
</body>
</html>
