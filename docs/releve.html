<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Relevé de factures</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --ok:#1b8f4d;
      --bad:#b3261e;
      --warn:#b06b00;
      --card: rgba(255,255,255,.92);
    }

    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      padding:14px 12px 28px;
      display:flex;
      justify-content:center;
    }

    .wrap{
      width:100%;
      max-width:1100px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      border:none; border-radius:999px;
      padding:9px 12px;
      font-size:12px; font-weight:1000;
      cursor:pointer;
      background:#fff; color:var(--violet);
      border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .sheet{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:18px;
      backdrop-filter: blur(10px);
    }

    .header{
      display:flex;
      justify-content:space-between;
      gap:14px;
      flex-wrap:wrap;
      align-items:flex-start;
      border-bottom:1px solid rgba(0,0,0,0.06);
      padding-bottom:14px;
      margin-bottom:14px;
    }

    .titleBox h1{
      margin:0;
      font-size:22px;
      font-weight:1000;
      line-height:1.1;
    }

    .subtitle{
      margin-top:6px;
      color:#444;
      font-size:13px;
      font-weight:900;
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:5px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      background:#fff;
      border:1px solid rgba(122,92,255,0.20);
      color:#4b2cff;
    }

    .grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }
    @media(max-width:780px){
      .grid{ grid-template-columns:1fr; }
    }

    .box{
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:0 3px 10px rgba(0,0,0,.05);
      padding:14px;
    }

    .box h3{
      margin:0 0 10px;
      font-size:13px;
      font-weight:1000;
    }

    .kv{
      display:grid;
      grid-template-columns:150px 1fr;
      gap:8px 10px;
      font-size:12px;
      font-weight:900;
      color:#333;
    }
    .kv div:nth-child(odd){
      color:#666;
      font-weight:900;
    }
    @media(max-width:640px){
      .kv{ grid-template-columns:1fr; }
    }

    .totals{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:10px;
      margin-top:12px;
    }
    @media(max-width:780px){
      .totals{ grid-template-columns:1fr; }
    }

    .tBox{
      border:1px solid rgba(122,92,255,0.18);
      border-radius:16px;
      padding:12px;
      background:#fff;
      box-shadow:0 3px 10px rgba(0,0,0,.05);
    }
    .tBox .t{
      font-size:11px;
      color:#666;
      font-weight:900;
    }
    .tBox .v{
      margin-top:4px;
      font-size:18px;
      font-weight:1000;
      color:#111;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      background:#fff;
      border-radius:16px;
      overflow:hidden;
    }
    th, td{
      padding:10px 9px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      font-size:12px;
      text-align:left;
      vertical-align:top;
    }
    th{
      background:rgba(122,92,255,0.08);
      color:#222;
      font-weight:1000;
    }
    td.num, th.num{
      text-align:right;
      white-space:nowrap;
    }

    .tag{
      display:inline-flex;
      align-items:center;
      padding:4px 9px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      background:#fff;
      border:1px solid rgba(0,0,0,0.08);
      white-space:nowrap;
    }
    .tag.invoice{ color:#4b2cff; border-color:rgba(122,92,255,0.25); }
    .tag.credit{ color:#9a4f00; border-color:rgba(176,107,0,0.25); }
    .tag.ok{ color:#0f5f31; border-color:rgba(27,143,77,0.25); }

    .alert{
      display:none;
      padding:11px 12px;
      border-radius:14px;
      background:#fff;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .note{
      margin-top:10px;
      font-size:12px;
      color:#555;
      font-weight:850;
      line-height:1.45;
    }

    .empty{
      margin-top:12px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-radius:18px;
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:14px;
      font-weight:900;
      color:#555;
      text-align:center;
    }

    @media print{
      body{ background:#fff; }
      .topbar, .screenOnly { display:none !important; }
      .page{ padding:0; }
      .wrap{ max-width:none; }
      .sheet{
        border:none;
        box-shadow:none;
        border-radius:0;
        padding:0;
        background:#fff;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="wrap">
      <div class="topbar screenOnly">
        <a class="btn" id="backBtn" href="factures-liste.html">← Retour</a>
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
          <button class="btn" id="emailBtn" type="button">Préparer email</button>
          <button class="btn" id="publishBtn" type="button">Publier propriétaire</button>
          <button class="btn primary" id="printBtn" type="button">Imprimer</button>
        </div>
      </div>

      <div class="alert" id="alertBox"></div>

      <div class="sheet">
        <div class="header">
          <div class="titleBox">
            <h1 id="pageTitle">Relevé de factures</h1>
            <div class="subtitle" id="pageSubtitle">—</div>
          </div>
          <div style="display:flex; flex-direction:column; gap:8px; align-items:flex-end;">
            <span class="pill" id="companyPill">Conciergerie</span>
            <span class="pill" id="publishStatePill">non publié</span>
          </div>
        </div>

        <div class="grid">
          <div class="box">
            <h3>Conciergerie</h3>
            <div class="kv">
              <div>Nom</div><div id="cName">—</div>
              <div>Édition</div><div id="editionDate">—</div>
            </div>
          </div>

          <div class="box">
            <h3>Propriétaire</h3>
            <div class="kv">
              <div>Nom</div><div id="oName">—</div>
              <div>Email</div><div id="oEmail">—</div>
              <div>Période</div><div id="oPeriod">—</div>
            </div>
          </div>
        </div>

        <div class="totals">
          <div class="tBox">
            <div class="t">Factures TTC</div>
            <div class="v" id="invTTC">—</div>
          </div>
          <div class="tBox">
            <div class="t">Avoirs TTC</div>
            <div class="v" id="credTTC">—</div>
          </div>
          <div class="tBox">
            <div class="t">Net TTC</div>
            <div class="v" id="netTTC">—</div>
          </div>
        </div>

        <div id="tableWrap"></div>

        <div class="note" id="noteBox">
          Relevé mensuel regroupant les factures et avoirs émis sur la période sélectionnée.
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, orderBy, limit, getDocs, doc, getDoc, setDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const qs = new URLSearchParams(location.search);

    const ownerDocId = String(qs.get("ownerDocId") || "").trim();
    const ownerUid = String(qs.get("ownerUid") || "").trim();
    const month = String(qs.get("month") || "").trim();

    const alertBox = document.getElementById("alertBox");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const pageTitle = document.getElementById("pageTitle");
    const companyPill = document.getElementById("companyPill");
    const publishStatePill = document.getElementById("publishStatePill");

    const cName = document.getElementById("cName");
    const editionDate = document.getElementById("editionDate");
    const oName = document.getElementById("oName");
    const oEmail = document.getElementById("oEmail");
    const oPeriod = document.getElementById("oPeriod");

    const invTTC = document.getElementById("invTTC");
    const credTTC = document.getElementById("credTTC");
    const netTTC = document.getElementById("netTTC");
    const tableWrap = document.getElementById("tableWrap");
    const noteBox = document.getElementById("noteBox");

    const printBtn = document.getElementById("printBtn");
    const publishBtn = document.getElementById("publishBtn");
    const emailBtn = document.getElementById("emailBtn");

    let currentUser = null;
    let companyName = "Conciergerie";
    let owner = null;
    let draft = null;
    let alreadyPublished = false;

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function esc(s){
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2}) + " €";
    }

    function pad2(n){ return String(n).padStart(2,"0"); }

    function monthRange(periodKey){
      const [y,m] = String(periodKey || "").split("-").map(Number);
      const end = new Date(y, m, 0);
      const startKey = `${y}-${pad2(m)}-01`;
      const endKey = `${y}-${pad2(m)}-${pad2(end.getDate())}`;
      return { startKey, endKey };
    }

    function absMoney(n){
      const x = Number(n);
      return Number.isFinite(x) ? Math.abs(x) : 0;
    }

    function statementId(conciergerieUid, ownerUid, periodKey){
      return `st_${conciergerieUid}_${ownerUid}_${periodKey}`;
    }

    function requestIdForStatement(stId){
      return `stmt_${stId}`;
    }

    function buildMailto(toEmail, subject, body){
      return `mailto:${encodeURIComponent(toEmail || "")}?subject=${encodeURIComponent(subject || "")}&body=${encodeURIComponent(body || "")}`;
    }

    async function loadProfile(uid){
      const snap = await getDoc(doc(db,"users", uid));
      const d = snap.exists() ? (snap.data() || {}) : {};
      const bp = d.businessProfile || {};
      companyName = String(bp.companyName || "Conciergerie").trim() || "Conciergerie";
      companyPill.textContent = companyName;
      cName.textContent = companyName;
      pageTitle.textContent = "Relevé de factures";
      document.title = `${companyName} — Relevé de factures`;
    }

    async function loadOwner(){
      const snap = await getDoc(doc(db,"owners", ownerDocId));
      if(!snap.exists()) throw new Error("Propriétaire introuvable.");
      const d = snap.data() || {};
      owner = {
        id: ownerDocId,
        ownerUid: String(d.ownerUid || d.userUid || "").trim(),
        name: String(d.fullname || d.displayName || d.name || "Propriétaire").trim(),
        email: String(d.email || "").trim()
      };
      oName.textContent = owner.name || "—";
      oEmail.textContent = owner.email || "—";
    }

    async function queryDocsByType(uid, type){
  const qx = query(
    collection(db,"salesDocuments"),
    where("conciergerieUid","==", uid),
    where("type","==", type),
    limit(2000)
  );
  const snap = await getDocs(qx);
  return snap.docs.map(s => ({ id:s.id, ...(s.data()||{}) }));
}

function tsToDate(x){
  try{
    if(!x) return null;
    if(x?.toDate?.()) return x.toDate();
    const d = new Date(x);
    return isNaN(d.getTime()) ? null : d;
  }catch{
    return null;
  }
}

function toDateKeyFromDate(d){
  if(!(d instanceof Date) || isNaN(d.getTime())) return "";
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function getDocDateKeySafe(d){
  const direct = String(
    d.docDateKey ||
    d.invoiceDateKey ||
    d.creditDateKey ||
    ""
  ).trim();

  if (/^\d{4}-\d{2}-\d{2}$/.test(direct)) return direct;

  const c1 = tsToDate(d.createdAt);
  if(c1) return toDateKeyFromDate(c1);

  const c2 = Number(d.createdAtMs);
  if(Number.isFinite(c2) && c2 > 0){
    return toDateKeyFromDate(new Date(c2));
  }

  const c3 = Number(d.snapAtMs);
  if(Number.isFinite(c3) && c3 > 0){
    return toDateKeyFromDate(new Date(c3));
  }

  return "";
}

function isOwnerMatch(docData, ownerUid, ownerDocId){
  return (
    String(docData.ownerUid || "").trim() === String(ownerUid || "").trim()
    || String(docData.clientOwnerDocId || docData.ownerDocId || "").trim() === String(ownerDocId || "").trim()
  );
}

function isDateInPeriod(dateKey, startKey, endKey){
  if(!dateKey) return false;
  return dateKey >= startKey && dateKey <= endKey;
}

    function normalizeItemFromDoc(d){
      const type = String(d.type || "").toUpperCase().trim();
      const isInv = type === "INVOICE";
      const kind = isInv ? "INVOICE" : "CREDIT";
      const number = String(isInv ? d.invoiceNumber : d.creditNumber).trim();
      const status = String(isInv ? d.invoiceStatus : d.creditStatus).toUpperCase().trim() || "MISSING";
      const totalTTC = Number.isFinite(Number(d.totalTTC)) ? Number(d.totalTTC) : 0;

      return {
        kind,
        salesDocId: String(d.id || "").trim(),
        number,
        dateKey: String(d.docDateKey || "").trim(),
        homeName: String(d.homeName || "").trim(),
        clientName: String(d.clientName || d.ownerName || "").trim(),
        totalTTC: absMoney(totalTTC),
        status
      };
    }

    async function buildDraft(){
      if(!month) throw new Error("Mois manquant.");
      if(!ownerUid) throw new Error("ownerUid manquant.");
      if(!ownerDocId) throw new Error("ownerDocId manquant.");

      const { startKey, endKey } = monthRange(month);
      oPeriod.textContent = `${startKey} → ${endKey}`;
      pageSubtitle.textContent = `${owner?.name || "Propriétaire"} • ${startKey} → ${endKey}`;
      editionDate.textContent = new Date().toLocaleDateString("fr-FR");

      let inv = [], cred = [];
      try{
        [inv, cred] = await Promise.all([
          queryDocsForMonth(currentUser.uid, "INVOICE", startKey, endKey),
          queryDocsForMonth(currentUser.uid, "CREDIT", startKey, endKey)
        ]);
      }catch(e){
        throw new Error("Erreur requête salesDocuments. Vérifie l’index sur docDateKey.");
      }

      inv = inv.filter(x =>
        String(x.ownerUid || "").trim() === ownerUid ||
        String(x.clientOwnerDocId || x.ownerDocId || "").trim() === ownerDocId
      );
      cred = cred.filter(x =>
        String(x.ownerUid || "").trim() === ownerUid ||
        String(x.clientOwnerDocId || x.ownerDocId || "").trim() === ownerDocId
      );

      inv = inv.filter(x => !!String(x.invoiceNumber || "").trim());
      cred = cred.filter(x => !!String(x.creditNumber || "").trim());

      const items = [
        ...inv.map(normalizeItemFromDoc),
        ...cred.map(normalizeItemFromDoc)
      ].sort((a,b)=> String(a.dateKey).localeCompare(String(b.dateKey)));

      const invoicesTTC = items.filter(i=>i.kind==="INVOICE").reduce((s,i)=> s + absMoney(i.totalTTC), 0);
      const creditsTTC  = items.filter(i=>i.kind==="CREDIT").reduce((s,i)=> s + absMoney(i.totalTTC), 0);
      const netTTC = invoicesTTC - creditsTTC;

      draft = {
        conciergerieUid: currentUser.uid,
        ownerUid,
        ownerDocId,
        ownerName: owner?.name || "",
        ownerEmail: owner?.email || "",
        periodKey: month,
        startKey,
        endKey,
        items,
        totals: { invoicesTTC, creditsTTC, netTTC }
      };

      const stId = statementId(draft.conciergerieUid, draft.ownerUid, draft.periodKey);
      const stSnap = await getDoc(doc(db,"ownerStatements", stId));
      alreadyPublished = stSnap.exists() && (stSnap.data()?.ownerVisible === true || !!stSnap.data()?.publishedAt);

      refreshPublishState();
      renderDraft();
    }

    function refreshPublishState(){
      if(alreadyPublished){
        publishStatePill.textContent = "publié";
        publishStatePill.style.color = "#0f5f31";
        publishStatePill.style.borderColor = "rgba(27,143,77,0.25)";
      }else{
        publishStatePill.textContent = "non publié";
        publishStatePill.style.color = "#9a4f00";
        publishStatePill.style.borderColor = "rgba(176,107,0,0.25)";
      }
    }

    function renderDraft(){
      if(!draft || !draft.items.length){
        invTTC.textContent = fmtMoney(0);
        credTTC.textContent = fmtMoney(0);
        netTTC.textContent = fmtMoney(0);
        tableWrap.innerHTML = `<div class="empty">Aucune facture ni aucun avoir sur cette période pour ce propriétaire.</div>`;
        return;
      }

      invTTC.textContent = fmtMoney(draft.totals.invoicesTTC);
      credTTC.textContent = fmtMoney(draft.totals.creditsTTC);
      netTTC.textContent = fmtMoney(draft.totals.netTTC);

      tableWrap.innerHTML = `
        <table>
          <thead>
            <tr>
              <th>Type</th>
              <th>N°</th>
              <th>Date</th>
              <th>Client</th>
              <th>Logement</th>
              <th>Statut</th>
              <th class="num">TTC</th>
            </tr>
          </thead>
          <tbody>
            ${draft.items.map(i => `
              <tr>
                <td><span class="tag ${i.kind === "INVOICE" ? "invoice" : "credit"}">${i.kind === "INVOICE" ? "Facture" : "Avoir"}</span></td>
                <td>${esc(i.number || "—")}</td>
                <td>${esc(i.dateKey || "—")}</td>
                <td>${esc(i.clientName || "—")}</td>
                <td>${esc(i.homeName || "—")}</td>
                <td>${esc(i.status || "—")}</td>
                <td class="num">${i.kind === "CREDIT" ? "−" : ""}${esc(fmtMoney(i.totalTTC))}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }

    async function publishStatement(){
      hideAlert();

      if(!draft) return showAlert("Aucun relevé à publier.");
      if(!draft.items.length) return showAlert("Aucune ligne à publier.");

      if(alreadyPublished){
        return showAlert("Déjà publié.", true);
      }

      publishBtn.disabled = true;

      try{
        const stId = statementId(draft.conciergerieUid, draft.ownerUid, draft.periodKey);

        await setDoc(doc(db,"ownerStatements", stId), {
          type: "OWNER_STATEMENT",
          conciergerieUid: draft.conciergerieUid,
          ownerUid: draft.ownerUid,
          ownerDocId: draft.ownerDocId,
          ownerName: draft.ownerName,
          ownerEmail: draft.ownerEmail,
          periodKey: draft.periodKey,
          periodStartKey: draft.startKey,
          periodEndKey: draft.endKey,
          currency: "EUR",
          items: draft.items,
          totals: draft.totals,
          note: `Relevé de factures ${draft.periodKey}`,
          ownerVisible: true,
          publishedAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          createdAt: serverTimestamp()
        }, { merge:true });

        const rid = requestIdForStatement(stId);
        await setDoc(doc(db,"requests", rid), {
          type: "billing_statement",
          status: "sent",
          conciergerieUid: draft.conciergerieUid,
          ownerUid: draft.ownerUid,
          ownerDocId: draft.ownerDocId,
          statementId: stId,
          periodKey: draft.periodKey,
          totals: draft.totals,
          note: `Relevé de factures ${draft.periodKey}`,
          updatedAt: serverTimestamp(),
          createdAt: serverTimestamp()
        }, { merge:true });

        alreadyPublished = true;
        refreshPublishState();
        showAlert("✅ Relevé publié côté propriétaire.", true);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur publication : " + (e?.message || "inconnue"), false);
      }finally{
        publishBtn.disabled = false;
      }
    }

    function openEmailDraft(){
      if(!draft) return showAlert("Aucun relevé.");
      if(!owner?.email) return showAlert("Email propriétaire manquant.");

      const subject = `Relevé de factures ${draft.periodKey}`;
      const body = [
        `Bonjour ${owner.name || ""},`,
        "",
        `Veuillez trouver votre relevé de factures pour la période ${draft.startKey} → ${draft.endKey}.`,
        "",
        `Factures TTC : ${fmtMoney(draft.totals.invoicesTTC)}`,
        `Avoirs TTC : ${fmtMoney(draft.totals.creditsTTC)}`,
        `Net TTC : ${fmtMoney(draft.totals.netTTC)}`,
        "",
        "Cordialement,",
        companyName
      ].join("\n");

      window.location.href = buildMailto(owner.email, subject, body);
    }

    printBtn.addEventListener("click", ()=> window.print());
    publishBtn.addEventListener("click", publishStatement);
    emailBtn.addEventListener("click", openEmailDraft);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }

      currentUser = user;

      try{
        if(!ownerDocId || !ownerUid || !month){
          throw new Error("Paramètres manquants : ownerDocId, ownerUid, month.");
        }

        await loadProfile(user.uid);
        await loadOwner();
        await buildDraft();
      }catch(e){
        console.error(e);
        showAlert("⛔ " + (e?.message || "Erreur chargement relevé"), false);
      }
    });
  </script>
</body>
</html>
