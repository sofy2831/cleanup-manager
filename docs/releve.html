<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Relevé de factures</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{--violet:#7A5CFF;--violet2:#6238FF;--bg1:#F8F4FF;--bg2:#EDE6FF;--text:#111;--muted:#666;--border:rgba(122,92,255,0.18);--shadow:0 14px 36px rgba(0,0,0,0.08);--ok:#1b8f4d;--bad:#b3261e;--warn:#b06b00;--card:rgba(255,255,255,.92)}
    html,body{max-width:100%;overflow-x:hidden}
    body{margin:0;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);color:var(--text)}
    .page{min-height:100vh;padding:14px 12px 28px;display:flex;justify-content:center}.wrap{width:100%;max-width:1100px;min-width:0;display:flex;flex-direction:column;gap:12px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}.topbarActions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;min-width:0}.btn{border:none;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:1000;cursor:pointer;background:#fff;color:var(--violet);border:2px solid var(--violet);box-shadow:0 3px 10px rgba(0,0,0,.06);white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;max-width:100%}.btn.primary{background:linear-gradient(90deg,var(--violet),var(--violet2));border-color:transparent;color:#fff;box-shadow:0 10px 22px rgba(0,0,0,.12)}.btn:disabled{opacity:.6;cursor:not-allowed}.sheet{background:var(--card);border:1px solid var(--border);border-radius:22px;box-shadow:var(--shadow);padding:18px;backdrop-filter:blur(10px);min-width:0;overflow:hidden}.header{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:flex-start;border-bottom:1px solid rgba(0,0,0,0.06);padding-bottom:14px;margin-bottom:14px;min-width:0}.titleBox{min-width:0;flex:1}.titleBox h1{margin:0;font-size:22px;font-weight:1000;line-height:1.1;word-break:break-word}.subtitle{margin-top:6px;color:#444;font-size:13px;font-weight:900;word-break:break-word}.pillCol{display:flex;flex-direction:column;gap:8px;align-items:flex-end;min-width:0}.pill{display:inline-flex;align-items:center;gap:8px;padding:5px 10px;border-radius:999px;font-size:11px;font-weight:1000;background:#fff;border:1px solid rgba(122,92,255,0.20);color:#4b2cff;max-width:100%}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:780px){.grid{grid-template-columns:1fr}}.box{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:0 3px 10px rgba(0,0,0,.05);padding:14px;min-width:0}.box h3{margin:0 0 10px;font-size:13px;font-weight:1000}.kv{display:grid;grid-template-columns:150px 1fr;gap:8px 10px;font-size:12px;font-weight:900;color:#333;min-width:0}.kv div{min-width:0;word-break:break-word}.kv div:nth-child(odd){color:#666;font-weight:900}@media(max-width:640px){.kv{grid-template-columns:1fr}}.totals{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px}@media(max-width:780px){.totals{grid-template-columns:1fr}}.tBox{border:1px solid rgba(122,92,255,0.18);border-radius:16px;padding:12px;background:#fff;box-shadow:0 3px 10px rgba(0,0,0,.05);min-width:0}.tBox .t{font-size:11px;color:#666;font-weight:900}.tBox .v{margin-top:4px;font-size:14px;font-weight:1000;color:#111;word-break:break-word}.tableScroll{width:100%;max-width:100%;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;margin-top:12px;border-radius:16px}table{width:100%;min-width:1060px;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden}th,td{padding:10px 9px;border-bottom:1px solid rgba(0,0,0,0.06);font-size:12px;text-align:left;vertical-align:top}th{background:rgba(122,92,255,0.08);color:#222;font-weight:1000}td.num,th.num{text-align:right;white-space:nowrap}.tag{display:inline-flex;align-items:center;padding:4px 9px;border-radius:999px;font-size:11px;font-weight:1000;background:#fff;border:1px solid rgba(0,0,0,0.08);white-space:nowrap}.tag.invoice{color:#4b2cff;border-color:rgba(122,92,255,0.25)}.tag.credit{color:#9a4f00;border-color:rgba(176,107,0,0.25)}.alert{display:none;padding:11px 12px;border-radius:14px;background:#fff;border-left:5px solid var(--bad);box-shadow:0 3px 10px rgba(0,0,0,.06);font-size:12px;font-weight:900;color:#444;white-space:pre-wrap}.alert.ok{border-left-color:var(--ok)}.note{margin-top:10px;font-size:12px;color:#555;font-weight:850;line-height:1.45;word-break:break-word}.empty{margin-top:12px;background:#fff;border:1px solid rgba(0,0,0,0.06);border-radius:18px;box-shadow:0 10px 22px rgba(0,0,0,.08);padding:14px;font-weight:900;color:#555;text-align:center}@media(max-width:760px){.page{padding:10px 8px 20px}.sheet{padding:12px;border-radius:18px}.topbar{flex-direction:column;align-items:stretch}.topbarActions{width:100%;justify-content:stretch}.topbarActions .btn,.topbar>.btn{flex:1 1 auto}.header{flex-direction:column;align-items:stretch}.pillCol{align-items:flex-start}th,td{font-size:11.5px;padding:9px 8px}table{min-width:1060px}}@media print{body{background:#fff}.topbar,.screenOnly{display:none!important}.page{padding:0}.wrap{max-width:none}.sheet{border:none;box-shadow:none;border-radius:0;padding:0;background:#fff}.tableScroll{overflow:visible}table{min-width:0}}
  </style>
</head>
<body>
  <div class="page">
    <div class="wrap">
      <div class="topbar screenOnly">
        <a class="btn" id="backBtn" href="factures-liste.html">← Retour</a>
        <div class="topbarActions">
          <button class="btn" id="emailBtn" type="button">Préparer email</button>
          <button class="btn" id="shareBtn" type="button">Partager</button>
          <button class="btn" id="publishBtn" type="button">Publier propriétaire</button>
          <button class="btn primary" id="printBtn" type="button">Imprimer</button>
        </div>
      </div>

      <div class="alert" id="alertBox"></div>

      <div class="sheet">
        <div class="header">
          <div class="titleBox"><h1 id="pageTitle">Relevé de factures</h1><div class="subtitle" id="pageSubtitle">—</div></div>
          <div class="pillCol"><span class="pill" id="companyPill">Conciergerie</span><span class="pill" id="publishStatePill">non publié</span></div>
        </div>

        <div class="grid">
          <div class="box"><h3>Conciergerie</h3><div class="kv"><div>Nom</div><div id="cName">—</div><div>Édition</div><div id="editionDate">—</div></div></div>
          <div class="box"><h3>Propriétaire</h3><div class="kv"><div>Nom</div><div id="oName">—</div><div>Email</div><div id="oEmail">—</div><div>Période</div><div id="oPeriod">—</div></div></div>
        </div>

        <div class="totals">
          <div class="tBox"><div class="t">Factures TTC</div><div class="v" id="invTTC">—</div></div>
          <div class="tBox"><div class="t">Avoirs TTC</div><div class="v" id="credTTC">—</div></div>
          <div class="tBox"><div class="t">Net TTC</div><div class="v" id="netTTC">—</div></div>
          <div class="tBox"><div class="t">Montant réglé</div><div class="v" id="paidTTC">—</div></div>
          <div class="tBox"><div class="t">Reste dû</div><div class="v" id="dueTTC">—</div></div>
          <div class="tBox"><div class="t">Dernier règlement</div><div class="v" id="lastPaymentDate">—</div></div>
        </div>

        <div id="tableWrap"></div>
        <div class="note" id="noteBox">Relevé mensuel regroupant les factures et avoirs émis sur la période sélectionnée.</div>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { collection, query, where, limit, getDocs, doc, getDoc, setDoc, serverTimestamp, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const qs = new URLSearchParams(location.search);
    const ownerDocId = String(qs.get("ownerDocId") || "").trim();
    const ownerUid = String(qs.get("ownerUid") || "").trim();
    const month = String(qs.get("month") || "").trim();

    const alertBox = document.getElementById("alertBox");
    const pageSubtitle = document.getElementById("pageSubtitle");
    const pageTitle = document.getElementById("pageTitle");
    const companyPill = document.getElementById("companyPill");
    const publishStatePill = document.getElementById("publishStatePill");
    const cName = document.getElementById("cName");
    const editionDate = document.getElementById("editionDate");
    const oName = document.getElementById("oName");
    const oEmail = document.getElementById("oEmail");
    const oPeriod = document.getElementById("oPeriod");
    const invTTC = document.getElementById("invTTC");
    const credTTC = document.getElementById("credTTC");
    const netTTC = document.getElementById("netTTC");
    const paidTTC = document.getElementById("paidTTC");
    const dueTTC = document.getElementById("dueTTC");
    const lastPaymentDate = document.getElementById("lastPaymentDate");
    const tableWrap = document.getElementById("tableWrap");
    const printBtn = document.getElementById("printBtn");
    const publishBtn = document.getElementById("publishBtn");
    const emailBtn = document.getElementById("emailBtn");
    const shareBtn = document.getElementById("shareBtn");

    let currentUser = null;
    let companyName = "Conciergerie";
    let owner = null;
    let draft = null;
    let alreadyPublished = false;

    function showAlert(msg, ok=false){ alertBox.style.display="block"; alertBox.classList.toggle("ok",!!ok); alertBox.textContent=msg; }
    function hideAlert(){ alertBox.style.display="none"; alertBox.classList.remove("ok"); alertBox.textContent=""; }
    function esc(s){ return String(s||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;"); }
    function fmtMoney(v){ const n=Number(v); if(!Number.isFinite(n)) return "—"; return n.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €"; }
    function fmtDateFR(x){ if(!x) return "—"; try{ if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR"); if(x instanceof Date && !isNaN(x.getTime())) return x.toLocaleDateString("fr-FR"); const d=new Date(x); if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR"); return "—"; }catch{return "—";} }
    function pad2(n){ return String(n).padStart(2,"0"); }
    function monthRange(periodKey){ const [y,m]=String(periodKey||"").split("-").map(Number); const end=new Date(y,m,0); return { startKey:`${y}-${pad2(m)}-01`, endKey:`${y}-${pad2(m)}-${pad2(end.getDate())}` }; }
    function absMoney(n){ const x=Number(n); return Number.isFinite(x)?Math.abs(x):0; }
    function statementId(conciergerieUid, ownerUid, periodKey){ return `st_${conciergerieUid}_${ownerUid}_${periodKey}`; }
    function requestIdForStatement(stId){ return `stmt_${stId}`; }
   function threadIdForOwner(conciergerieUid, ownerDocId){
  return `t_${conciergerieUid}_${ownerDocId}`;
}
    function messageIdForStatement(stId){ return `statement_${stId}`; }
    function buildMailto(toEmail, subject, body){ return `mailto:${encodeURIComponent(toEmail||"")}?subject=${encodeURIComponent(subject||"")}&body=${encodeURIComponent(body||"")}`; }
    async function copyToClipboard(text){ try{ await navigator.clipboard.writeText(String(text||"")); return true; }catch{ try{ const ta=document.createElement("textarea"); ta.value=String(text||""); document.body.appendChild(ta); ta.select(); document.execCommand("copy"); document.body.removeChild(ta); return true; }catch{return false;} } }

    async function loadProfile(uid){
      const snap = await getDoc(doc(db,"users",uid));
      const d = snap.exists() ? (snap.data() || {}) : {};
      const bp = d.businessProfile || {};
      companyName = String(bp.companyName || "Conciergerie").trim() || "Conciergerie";
      companyPill.textContent = companyName;
      cName.textContent = companyName;
      pageTitle.textContent = "Relevé de factures";
      document.title = `${companyName} — Relevé de factures`;
    }

    async function loadOwner(){
      const snap = await getDoc(doc(db,"owners", ownerDocId));
      if(!snap.exists()) throw new Error("Propriétaire introuvable.");
      const d = snap.data() || {};
      owner = { id:ownerDocId, ownerUid:String(d.ownerUid || d.userUid || ownerUid || "").trim(), name:String(d.fullname || d.displayName || d.name || "Propriétaire").trim(), email:String(d.email || "").trim() };
      oName.textContent = owner.name || "—";
      oEmail.textContent = owner.email || "—";
    }

    async function queryDocsByType(uid,type){
      const qx = query(collection(db,"salesDocuments"), where("conciergerieUid","==",uid), where("type","==",type), limit(2000));
      const snap = await getDocs(qx);
      return snap.docs.map(s=>({ id:s.id, ...(s.data()||{}) }));
    }
    function tsToDate(x){ try{ if(!x) return null; if(x?.toDate?.()) return x.toDate(); const d=new Date(x); return isNaN(d.getTime())?null:d; }catch{return null;} }
    function toDateKeyFromDate(d){ if(!(d instanceof Date)||isNaN(d.getTime())) return ""; return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; }
    function getDocDateKeySafe(d){ const direct=String(d.docDateKey||d.invoiceDateKey||d.creditDateKey||"").trim(); if(/^\d{4}-\d{2}-\d{2}$/.test(direct)) return direct; const c1=tsToDate(d.createdAt); if(c1) return toDateKeyFromDate(c1); const c2=Number(d.createdAtMs); if(Number.isFinite(c2)&&c2>0) return toDateKeyFromDate(new Date(c2)); const c3=Number(d.snapAtMs); if(Number.isFinite(c3)&&c3>0) return toDateKeyFromDate(new Date(c3)); return ""; }
    function isOwnerMatch(docData, ownerUidValue, ownerDocIdValue){ return String(docData.ownerUid||"").trim()===String(ownerUidValue||"").trim() || String(docData.clientOwnerDocId||docData.ownerDocId||"").trim()===String(ownerDocIdValue||"").trim(); }
    function isDateInPeriod(dateKey,startKey,endKey){ return !!dateKey && dateKey>=startKey && dateKey<=endKey; }
    function getDocTotals(d){ const htS=Number(d.totalHT), tvaS=Number(d.totalTVA), ttcS=Number(d.totalTTC); if(Number.isFinite(htS)&&Number.isFinite(ttcS)) return {ht:htS,tva:Number.isFinite(tvaS)?tvaS:Math.max(0,ttcS-htS),ttc:ttcS}; if(Number.isFinite(ttcS)&&Number.isFinite(tvaS)) return {ht:Math.max(0,ttcS-tvaS),tva:tvaS,ttc:ttcS}; if(Number.isFinite(ttcS)) return {ht:ttcS,tva:0,ttc:ttcS}; return {ht:0,tva:0,ttc:0}; }

    function normalizeItemFromDoc(d){
      const type=String(d.type||"").toUpperCase().trim();
      const isInv=type==="INVOICE";
      const kind=isInv?"INVOICE":"CREDIT";
      const number=String(isInv?d.invoiceNumber:(d.creditNumber||d.avoirNumber||d.creditNoteNumber)).trim();
      const dateKey=getDocDateKeySafe(d);
      const totals=getDocTotals(d);
      const totalHT=absMoney(totals.ht), totalTVA=absMoney(totals.tva), totalTTC=absMoney(totals.ttc);
      const paidAmount=isInv?Math.max(0,Number(d.paidAmount||0)):0;
      const dueAmount=isInv?Math.max(0,totalTTC-paidAmount):0;
      return { kind, salesDocId:String(d.id||"").trim(), number, dateKey, homeName:String(d.homeName||"").trim(), clientName:String(d.clientName||d.ownerName||"").trim(), totalHT, totalTVA, totalTTC, invoiceStatus:String(d.invoiceStatus||"").trim(), avoirStatus:String(d.avoirStatus||d.creditStatus||"").trim(), paidAmount, dueAmount };
    }

    async function loadPaymentsSummaryForInvoices(invoiceDocs){
      let paid=0, latestDate=null;
      for(const invoiceDoc of invoiceDocs){
        const docId=String(invoiceDoc.id||"").trim();
        if(!docId) continue;
        try{
          const snap=await getDocs(collection(db,"salesDocuments",docId,"payments"));
          if(!snap.empty){
            for(const p of snap.docs){
              const d=p.data()||{};
              const amount=Number(d.montantRegle||0);
              if(Number.isFinite(amount)) paid+=amount;
              const rawDate=d.dateReglement||d.createdAt||null;
              const realDate=rawDate?.toDate?.()?rawDate.toDate():(rawDate?new Date(rawDate):null);
              if(realDate instanceof Date&&!isNaN(realDate.getTime())){ if(!latestDate||realDate>latestDate) latestDate=realDate; }
            }
          }else{
            const fallbackPaid=Number(invoiceDoc.paidAmount||0);
            if(Number.isFinite(fallbackPaid)&&fallbackPaid>0) paid+=fallbackPaid;
          }
        }catch(e){
          console.warn("Lecture payments impossible pour",docId,e?.message||e);
          const fallbackPaid=Number(invoiceDoc.paidAmount||0);
          if(Number.isFinite(fallbackPaid)&&fallbackPaid>0) paid+=fallbackPaid;
        }
      }
      return { paidTTC:paid, lastPaymentDate:latestDate };
    }

    async function buildDraft(){
      if(!month) throw new Error("Mois manquant.");
      if(!ownerUid) throw new Error("ownerUid manquant.");
      if(!ownerDocId) throw new Error("ownerDocId manquant.");
      const {startKey,endKey}=monthRange(month);
      oPeriod.textContent=`${startKey} → ${endKey}`;
      pageSubtitle.textContent=`${owner?.name||"Propriétaire"} • ${startKey} → ${endKey}`;
      editionDate.textContent=new Date().toLocaleDateString("fr-FR");
      let inv=[],cred=[];
      try{ [inv,cred]=await Promise.all([queryDocsByType(currentUser.uid,"INVOICE"), queryDocsByType(currentUser.uid,"CREDIT")]); }catch{ throw new Error("Erreur chargement salesDocuments."); }
      inv=inv.filter(x=>isOwnerMatch(x,ownerUid,ownerDocId)).filter(x=>!!String(x.invoiceNumber||"").trim()).filter(x=>isDateInPeriod(getDocDateKeySafe(x),startKey,endKey));
      cred=cred.filter(x=>isOwnerMatch(x,ownerUid,ownerDocId)).filter(x=>!!String(x.creditNumber||x.avoirNumber||x.creditNoteNumber||"").trim()).filter(x=>isDateInPeriod(getDocDateKeySafe(x),startKey,endKey));
      const items=[...inv.map(normalizeItemFromDoc),...cred.map(normalizeItemFromDoc)].sort((a,b)=>String(a.dateKey).localeCompare(String(b.dateKey)));
      const invoicesTTC=items.filter(i=>i.kind==="INVOICE").reduce((s,i)=>s+absMoney(i.totalTTC),0);
      const creditsTTC=items.filter(i=>i.kind==="CREDIT").reduce((s,i)=>s+absMoney(i.totalTTC),0);
      const netTTC=invoicesTTC-creditsTTC;
      const paymentsSummary=await loadPaymentsSummaryForInvoices(inv);
      const paidTTCValue=Number(paymentsSummary.paidTTC||0);
      const dueTTCValue=Math.max(0,netTTC-paidTTCValue);
      draft={ conciergerieUid:currentUser.uid, ownerUid, ownerDocId, ownerName:owner?.name||"", ownerEmail:owner?.email||"", periodKey:month, startKey, endKey, items, totals:{invoicesTTC,creditsTTC,netTTC}, paymentSummary:{paidTTC:paidTTCValue,dueTTC:dueTTCValue,lastPaymentDate:paymentsSummary.lastPaymentDate} };
      const stId=statementId(draft.conciergerieUid,draft.ownerUid,draft.periodKey);
      const stSnap=await getDoc(doc(db,"ownerStatements",stId));
      alreadyPublished=stSnap.exists() && (stSnap.data()?.ownerVisible===true || !!stSnap.data()?.publishedAt);
      refreshPublishState();
      renderDraft();
    }

    function refreshPublishState(){
      if(alreadyPublished){ publishStatePill.textContent="publié"; publishStatePill.style.color="#0f5f31"; publishStatePill.style.borderColor="rgba(27,143,77,0.25)"; }
      else{ publishStatePill.textContent="non publié"; publishStatePill.style.color="#9a4f00"; publishStatePill.style.borderColor="rgba(176,107,0,0.25)"; }
    }

    function badgeStatus(item){
      const kind=String(item?.kind||"").toUpperCase().trim();
      if(kind==="CREDIT"){ const st=String(item?.avoirStatus||"").toUpperCase().trim(); if(st==="CANCELLED") return `<span class="tag credit">Avoir annulé</span>`; return `<span class="tag credit">Avoir</span>`; }
      const st=String(item?.invoiceStatus||"").toUpperCase().trim();
      if(st==="PAID") return `<span class="tag invoice">Payée</span>`;
      if(st==="CANCELLED") return `<span class="tag credit">Annulée</span>`;
      if(st==="CREDITED") return `<span class="tag credit">Avoir émis</span>`;
      if(st==="SENT") return `<span class="tag invoice">Envoyée</span>`;
      if(st==="ISSUED") return `<span class="tag invoice">Émise</span>`;
      if(st==="DRAFT") return `<span class="tag">Brouillon</span>`;
      return `<span class="tag">—</span>`;
    }

    function renderDraft(){
      if(!draft || !draft.items.length){
        invTTC.textContent=fmtMoney(0); credTTC.textContent=fmtMoney(0); netTTC.textContent=fmtMoney(0); paidTTC.textContent=fmtMoney(0); dueTTC.textContent=fmtMoney(0); lastPaymentDate.textContent="—";
        tableWrap.innerHTML=`<div class="empty">Aucune facture ni aucun avoir sur cette période pour ce propriétaire.</div>`;
        return;
      }
      invTTC.textContent=fmtMoney(draft.totals.invoicesTTC); credTTC.textContent=fmtMoney(draft.totals.creditsTTC); netTTC.textContent=fmtMoney(draft.totals.netTTC); paidTTC.textContent=fmtMoney(draft.paymentSummary?.paidTTC||0); dueTTC.textContent=fmtMoney(draft.paymentSummary?.dueTTC||0); lastPaymentDate.textContent=fmtDateFR(draft.paymentSummary?.lastPaymentDate);
      tableWrap.innerHTML = `<div class="tableScroll"><table><thead><tr><th>Type</th><th>N°</th><th>Date</th><th>Client</th><th>Logement</th><th class="num">HT</th><th class="num">TVA</th><th class="num">TTC</th><th>Statut</th><th class="num">Payé</th><th class="num">À payer</th></tr></thead><tbody>${draft.items.map(i=>`<tr><td><span class="tag ${i.kind==="INVOICE"?"invoice":"credit"}">${i.kind==="INVOICE"?"Facture":"Avoir"}</span></td><td>${esc(i.number||"—")}</td><td>${esc(i.dateKey||"—")}</td><td>${esc(i.clientName||"—")}</td><td>${esc(i.homeName||"—")}</td><td class="num">${i.kind==="CREDIT"?"−":""}${esc(fmtMoney(i.totalHT))}</td><td class="num">${i.kind==="CREDIT"?"−":""}${esc(fmtMoney(i.totalTVA))}</td><td class="num">${i.kind==="CREDIT"?"−":""}${esc(fmtMoney(i.totalTTC))}</td><td>${badgeStatus(i)}</td><td class="num">${esc(fmtMoney(i.kind==="CREDIT"?0:(i.paidAmount||0)))}</td><td class="num">${esc(fmtMoney(i.kind==="CREDIT"?-Math.abs(i.totalTTC||0):(i.dueAmount||0)))}</td></tr>`).join("")}</tbody></table></div>`;
    }

    function buildOwnerStatementLink(stId){
      const u = new URL("owner-facturation.html", location.href);
      u.searchParams.set("statementId", stId);
      return u.toString();
    }

async function upsertInternalMessageForStatement(stId){
  const tid = threadIdForOwner(draft.conciergerieUid, draft.ownerDocId);
  const mid = messageIdForStatement(stId);

  const messageText = [
    `Nouveau relevé de factures disponible : ${draft.periodKey}.`,
    `Factures TTC : ${fmtMoney(draft.totals.invoicesTTC)}`,
    `Avoirs TTC : ${fmtMoney(draft.totals.creditsTTC)}`,
    `Net TTC : ${fmtMoney(draft.totals.netTTC)}`,
    `Reste dû : ${fmtMoney(draft.paymentSummary?.dueTTC || 0)}`
  ].join("\n");

  const tRef = doc(db, "threads", tid);
  const tSnap = await getDoc(tRef);

  if(tSnap.exists()){
    await updateDoc(tRef, {
      lastText: messageText,
      lastAt: serverTimestamp(),
      unreadForOwner: 1,
      unreadForConciergerie: 0,
      updatedAt: serverTimestamp()
    });
  }else{
    await setDoc(tRef, {
      type: "billing_statement",
      subject: `Relevé de factures ${draft.periodKey}`,

      conciergerieUid: draft.conciergerieUid,
      ownerUid: draft.ownerUid,
      ownerDocId: draft.ownerDocId,

      ownerName: draft.ownerName || "Propriétaire",
      ownerEmailLower: String(draft.ownerEmail || "").trim().toLowerCase(),

      statementId: stId,
      periodKey: draft.periodKey,

      lastText: messageText,
      lastAt: serverTimestamp(),

      unreadForOwner: 1,
      unreadForConciergerie: 0,

      closed: false,
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
  }

  await setDoc(doc(db, "threads", tid, "messages", mid), {
    text: messageText,
    at: serverTimestamp(),
    createdAt: serverTimestamp(),
    senderRole: "CONCIERGERIE",
    senderUid: draft.conciergerieUid
  });
}
    async function publishStatement(){
      hideAlert();
      if(!draft) return showAlert("Aucun relevé à publier.");
      if(!draft.items.length) return showAlert("Aucune ligne à publier.");
      if(alreadyPublished) return showAlert("Déjà publié.", true);
      publishBtn.disabled = true;
      try{
        const stId = statementId(draft.conciergerieUid, draft.ownerUid, draft.periodKey);
        await setDoc(doc(db,"ownerStatements", stId), {
          type:"OWNER_STATEMENT", conciergerieUid:draft.conciergerieUid, ownerUid:draft.ownerUid, ownerDocId:draft.ownerDocId, ownerName:draft.ownerName, ownerEmail:draft.ownerEmail, periodKey:draft.periodKey, periodStartKey:draft.startKey, periodEndKey:draft.endKey, currency:"EUR", items:draft.items, totals:draft.totals,
          paymentSummary:draft.paymentSummary || { paidTTC:0, dueTTC:draft.totals?.netTTC||0, lastPaymentDate:null }, note:`Relevé de factures ${draft.periodKey}`, ownerVisible:true, publishedAt:serverTimestamp(), updatedAt:serverTimestamp(), createdAt:serverTimestamp()
        }, { merge:true });

       try {
  await setDoc(doc(db,"requests", requestIdForStatement(stId)), {
    type:"billing_statement",
    status:"sent",
    conciergerieUid:draft.conciergerieUid,
    ownerUid:draft.ownerUid,
    ownerDocId:draft.ownerDocId,
    statementId:stId,
    periodKey:draft.periodKey,
    totals:draft.totals,
    paymentSummary:draft.paymentSummary || { paidTTC:0, dueTTC:draft.totals?.netTTC||0, lastPaymentDate:null },
    note:`Relevé de factures ${draft.periodKey}`,
    updatedAt:serverTimestamp(),
    createdAt:serverTimestamp()
  }, { merge:true });
} catch(e) {
  console.warn("Request relevé ignorée :", e?.message || e);
}

        await upsertInternalMessageForStatement(stId);
        alreadyPublished = true;
        refreshPublishState();
        showAlert("✅ Relevé publié côté propriétaire + message interne créé.", true);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur publication : " + (e?.message || "inconnue"), false);
      }finally{ publishBtn.disabled = false; }
    }

    function buildShareText(){
      if(!draft) return "";
      return [`Relevé de factures ${draft.periodKey}`, `${owner?.name || "Propriétaire"}`, `${draft.startKey} → ${draft.endKey}`, "", `Factures TTC : ${fmtMoney(draft.totals.invoicesTTC)}`, `Avoirs TTC : ${fmtMoney(draft.totals.creditsTTC)}`, `Net TTC : ${fmtMoney(draft.totals.netTTC)}`, `Montant réglé : ${fmtMoney(draft.paymentSummary?.paidTTC || 0)}`, `Reste dû : ${fmtMoney(draft.paymentSummary?.dueTTC || 0)}`, `Dernier règlement : ${fmtDateFR(draft.paymentSummary?.lastPaymentDate)}`, "", `${companyName}`].join("\n");
    }
    function openEmailDraft(){
      if(!draft) return showAlert("Aucun relevé.");
      if(!owner?.email) return showAlert("Email propriétaire manquant.");
      const subject=`Relevé de factures ${draft.periodKey}`;
      const body=[`Bonjour ${owner.name || ""},`,"",`Veuillez trouver votre relevé de factures pour la période ${draft.startKey} → ${draft.endKey}.`,"",`Factures TTC : ${fmtMoney(draft.totals.invoicesTTC)}`,`Avoirs TTC : ${fmtMoney(draft.totals.creditsTTC)}`,`Net TTC : ${fmtMoney(draft.totals.netTTC)}`,`Montant réglé : ${fmtMoney(draft.paymentSummary?.paidTTC || 0)}`,`Reste dû : ${fmtMoney(draft.paymentSummary?.dueTTC || 0)}`,`Dernier règlement : ${fmtDateFR(draft.paymentSummary?.lastPaymentDate)}`,"","Cordialement,",companyName].join("\n");
      window.location.href=buildMailto(owner.email, subject, body);
    }
    async function shareDraft(){
      if(!draft) return showAlert("Aucun relevé.");
      const title=`Relevé de factures ${draft.periodKey}`;
      const text=buildShareText();
      if(navigator.share){ try{ await navigator.share({title,text}); }catch(e){ if(String(e?.name||"")!=="AbortError") showAlert("⛔ Partage impossible.",false); } return; }
      const ok=await copyToClipboard(text);
      showAlert(ok?"✅ Texte copié. Partage non disponible sur ce navigateur.":"⛔ Partage indisponible.",!!ok);
    }

    printBtn.addEventListener("click",()=>window.print());
    publishBtn.addEventListener("click",publishStatement);
    emailBtn.addEventListener("click",openEmailDraft);
    shareBtn.addEventListener("click",shareDraft);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href="login.html?role=conciergerie"; return; }
      currentUser=user;
      try{
        if(!ownerDocId || !ownerUid || !month) throw new Error("Paramètres manquants : ownerDocId, ownerUid, month.");
        await loadProfile(user.uid);
        await loadOwner();
        await buildDraft();
      }catch(e){ console.error(e); showAlert("⛔ " + (e?.message || "Erreur chargement relevé"), false); }
    });
  </script>
</body>
</html>
