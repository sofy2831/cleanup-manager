<!-- docs/preuves.html (PHOTOS ONLY — auto mission depuis token ; ?type optionnel) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Preuves (Agent)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:36px; }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }
    .wrap{ width:100%; max-width:980px; margin-top:6px; display:flex; flex-direction:column; gap:10px; }
    h1{ margin:0; font-size:18px; font-weight:900; letter-spacing:-0.2px; }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; white-space:pre-wrap; }

    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:12px;
      display:flex; flex-direction:column; gap:10px;
    }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); line-height:1.45; }

    input[type="file"]{
      width:100%;
      padding:10px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      background:#fff;
      font-size:13px;
      font-weight:800;
    }
    .btn{
      border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:900; cursor:pointer;
      color:#fff; background:linear-gradient(90deg,var(--violet),var(--violet2));
      box-shadow:0 10px 22px rgba(0,0,0,0.10); white-space:nowrap;
    }
    .btn.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .progressWrap{
      display:none;
      margin-top:10px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:10px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .bar{
      width:100%;
      height:10px;
      background:rgba(122,92,255,0.12);
      border-radius:999px;
      overflow:hidden;
      margin-top:8px;
    }
    .bar > div{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-radius:999px;
      transition:width .15s linear;
    }

    .sizeHint{
      margin-top:6px;
      font-size:12px;
      font-weight:900;
      color:#333;
    }
    .sizeHint.bad{ color: var(--bad); }
    .sizeHint.ok{ color: var(--ok); }

    .thumbs{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap:8px;
      margin-top:10px;
    }
    .thumb{
      border-radius:12px;
      border:1px solid rgba(0,0,0,0.08);
      background:#fff;
      overflow:hidden;
      aspect-ratio: 1 / 1;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
    .thumb .ph{ font-size:11px; font-weight:900; color:#666; padding:8px; text-align:center; }

    .metaRow{
      display:flex; gap:8px; flex-wrap:wrap; align-items:center;
      font-size:11px; font-weight:900; color:#444;
    }
    .chip{
      background:#fff;
      border:1px solid rgba(0,0,0,0.08);
      border-radius:999px;
      padding:6px 10px;
      box-shadow:0 3px 10px rgba(0,0,0,.05);
      max-width:100%;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    /* Choix mission si multi */
    .typePick{
      display:none;
      margin-top:8px;
      gap:8px;
      flex-wrap:wrap;
      align-items:center;
    }
    .typeBtn{
      border:none;
      border-radius:999px;
      padding:8px 10px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      background:rgba(122,92,255,0.12);
      color:#5b45c8;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }
    .typeBtn.active{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="#">← Retour missions</a>
      <span class="mini" id="chipLine">Chargement…</span>
    </div>

    <div class="wrap">
      <div>
        <h1 id="title">Preuves photos</h1>
        <div class="sub" id="subLine">Chargement…</div>
        <div class="alert" id="alertBox"></div>
      </div>

      <section class="card">
        <div class="mini" id="helpLine">
          Sélectionne 5/10/20 photos et envoie-les d’un coup. Limite : <b>20 photos</b> • <b>30 Mo/photo</b>.
        </div>

        <div class="metaRow">
          <span class="chip" id="chipToken">token: —</span>
          <span class="chip" id="chipType">type: —</span>
          <span class="chip" id="chipMissionToken">missionToken: —</span>
        </div>

        <!-- ✅ Affiché uniquement si token autorise plusieurs missions -->
        <div class="typePick" id="typePick"></div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:8px;">
          <input id="photosInput" type="file" accept="image/*" multiple />
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn ghost" id="clearPhotosBtn" type="button">Vider</button>
            <button class="btn" id="uploadPhotosBtn" type="button">Envoyer photos</button>
          </div>
        </div>

        <div class="sizeHint" id="photosHint" style="display:none;"></div>

        <div class="progressWrap" id="progressWrapPhotos">
          <div class="mini" id="progressTextPhotos">Upload…</div>
          <div class="bar"><div id="progressBarPhotos"></div></div>
        </div>

        <div id="photosPreview" class="thumbs" style="display:none;"></div>
      </section>
    </div>
  </div>

  <script type="module">
    import { storage, db } from "./firebase-init.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { ref as sRef, uploadBytesResumable, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const backBtn = document.getElementById("backBtn");
    const chipLine = document.getElementById("chipLine");

    const title = document.getElementById("title");
    const helpLine = document.getElementById("helpLine");
    const chipToken = document.getElementById("chipToken");
    const chipType = document.getElementById("chipType");
    const chipMissionToken = document.getElementById("chipMissionToken");

    const typePick = document.getElementById("typePick");

    const photosInput = document.getElementById("photosInput");
    const clearPhotosBtn = document.getElementById("clearPhotosBtn");
    const uploadPhotosBtn = document.getElementById("uploadPhotosBtn");
    const photosHint = document.getElementById("photosHint");
    const photosPreview = document.getElementById("photosPreview");
    const progressWrapPhotos = document.getElementById("progressWrapPhotos");
    const progressTextPhotos = document.getElementById("progressTextPhotos");
    const progressBarPhotos = document.getElementById("progressBarPhotos");

    const MAX_BYTES = 30 * 1024 * 1024;
    const MAX_PHOTOS = 20;

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
    const token = qs("token");
    const prestationId = qs("prestationId");

    const missionTypeParam = (qs("type") || "").toUpperCase().trim(); // optionnel
    let missionType = missionTypeParam; // sera auto-fixé via token

    const ALLOWED_MISSIONS = new Set(["MENAGE","LINGE","CHECKIN","CHECKOUT","KIT","MAINTENANCE","KITS"]);

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function fmtSize(bytes){
      const b = Number(bytes || 0);
      if(!Number.isFinite(b) || b <= 0) return "0 Mo";
      return (b / (1024*1024)).toFixed(1) + " Mo";
    }

    function lockUI(locked){
      uploadPhotosBtn.disabled = !!locked;
      clearPhotosBtn.disabled = !!locked;
      photosInput.disabled = !!locked;
      // boutons type
      Array.from(typePick.querySelectorAll("button")).forEach(b=> b.disabled = !!locked);
    }

    function setProgressPhotos(pct, text){
      progressWrapPhotos.style.display = "block";
      progressBarPhotos.style.width = `${Math.max(0, Math.min(100, pct))}%`;
      progressTextPhotos.textContent = text || "Upload…";
    }
    function hideProgressPhotos(){
      progressWrapPhotos.style.display = "none";
      progressBarPhotos.style.width = "0%";
      progressTextPhotos.textContent = "";
    }

    function showPhotosHint(msg, ok=true){
      photosHint.style.display = "block";
      photosHint.classList.toggle("ok", !!ok);
      photosHint.classList.toggle("bad", !ok);
      photosHint.textContent = msg;
    }
    function hidePhotosHint(){
      photosHint.style.display = "none";
      photosHint.textContent = "";
      photosHint.classList.remove("ok","bad");
    }

    function renderLocalThumbs(files){
      const arr = Array.from(files || []).filter(f => (f?.type || "").startsWith("image/"));
      if(!arr.length){
        photosPreview.style.display = "none";
        photosPreview.innerHTML = "";
        return;
      }
      photosPreview.style.display = "grid";
      photosPreview.innerHTML = arr.slice(0, 9).map((f)=>{
        const url = URL.createObjectURL(f);
        return `<div class="thumb"><img src="${url}" alt="photo"></div>`;
      }).join("") + (arr.length > 9 ? `<div class="thumb"><div class="ph">+${arr.length-9}</div></div>` : "");
    }

    function tokenValid(d){
      if(!d?.active) return false;
      const expMs = Number(d?.expiresAtMs);
      if(Number.isFinite(expMs)) return Date.now() < expMs;
      const ts = d?.expiresAt;
      const ms = ts?.toMillis ? ts.toMillis() : NaN;
      if(Number.isFinite(ms)) return Date.now() < ms;
      return false;
    }

    function normalizeTypes(list){
      const raw = (Array.isArray(list) && list.length)
        ? list.map(x => String(x||"").toUpperCase().trim()).filter(Boolean)
        : [];
      // on filtre sur ALLOWED_MISSIONS (et on map KITS->KIT si besoin)
      const normed = raw.map(t => (t==="KITS" ? "KIT" : t)).filter(t => ALLOWED_MISSIONS.has(t));
      return Array.from(new Set(normed));
    }

    function setType(newType){
      const t = String(newType||"").toUpperCase().trim();
      if(!t) return;
      missionType = (t==="KITS") ? "KIT" : t;
      chipType.textContent = `type: ${missionType}`;
      title.textContent = `Preuves photos — ${missionType}`;
      helpLine.innerHTML = `Sélectionne 5/10/20 photos et envoie-les d’un coup. Mission <b>${missionType}</b> • Limite <b>${MAX_PHOTOS} photos</b> • <b>${fmtSize(MAX_BYTES)}/photo</b>.`;

      Array.from(typePick.querySelectorAll("button[data-type]")).forEach(btn=>{
        btn.classList.toggle("active", btn.getAttribute("data-type") === missionType);
      });

      // 🔁 met à jour l'URL sans recharger (pratique si tu veux garder un lien clair)
      try{
        const u = new URL(location.href);
        u.searchParams.set("type", missionType);
        history.replaceState(null, "", u.toString());
      }catch(e){}
    }

    function renderTypePicker(allowedTypes){
      typePick.innerHTML = "";
      if(!Array.isArray(allowedTypes) || allowedTypes.length <= 1){
        typePick.style.display = "none";
        return;
      }
      typePick.style.display = "flex";
      const frag = document.createDocumentFragment();
      allowedTypes.forEach(t=>{
        const b = document.createElement("button");
        b.type = "button";
        b.className = "typeBtn";
        b.textContent = t;
        b.setAttribute("data-type", t);
        b.addEventListener("click", ()=>{
          hideAlert();
          setType(t);
        });
        frag.appendChild(b);
      });
      typePick.appendChild(frag);
    }

    async function preflight(){
      if(!token || !prestationId) throw new Error("Paramètres manquants (token / prestationId).");

      const tSnap = await getDoc(doc(db,"dayTokens",token));
      if(!tSnap.exists()) throw new Error("Token invalide.");
      const tokenDoc = tSnap.data() || {};

      if(String(tokenDoc.prestationId) !== String(prestationId)) throw new Error("Token ≠ prestation.");
      if(!tokenValid(tokenDoc)) throw new Error("Token expiré. Demande un nouveau lien.");

      const allowedTypes = normalizeTypes(tokenDoc.missionTypes);

      if(!allowedTypes.length){
        throw new Error("Token sans missionTypes valides. Regénère le lien.");
      }

      // ✅ missionType déterminée : param > sinon première mission du token
      const paramOk = missionTypeParam && ALLOWED_MISSIONS.has(missionTypeParam);
      missionType = paramOk ? missionTypeParam : allowedTypes[0];

      // si URL contient un type non autorisé par le token => refuse
      if(missionTypeParam && !allowedTypes.includes(missionTypeParam)){
        throw new Error(`Ce token n’autorise pas ${missionTypeParam}.`);
      }

      // UI type picker si multi
      renderTypePicker(allowedTypes);
      setType(missionType);

      const mRef = doc(db,"events",prestationId,"missions",missionType);
      const mSnap = await getDoc(mRef);
      if(!mSnap.exists()) throw new Error(`Mission ${missionType} non initialisée.`);

      const m = mSnap.data() || {};
      if(String(m.dayToken || "") !== String(token)){
        throw new Error(`Token non associé à la mission (${missionType}).`);
      }

      if(m.locked === true){
        throw new Error("Mission verrouillée. Impossible d’envoyer des photos.");
      }

      return { tokenDoc, missionRef: mRef, missionDoc: m };
    }

    async function uploadOnePhoto(file, idx, total){
      const ext = (file.name || "").split(".").pop() || "jpg";
      const safeExt = ext.replace(/[^\w]+/g,"").slice(0,6) || "jpg";
      const fname = `${Date.now()}_${idx}_${Math.random().toString(16).slice(2)}.${safeExt}`;
      const path = `proofPhotos/${prestationId}/${missionType}/${token}/${fname}`;
      const r = sRef(storage, path);

      const task = uploadBytesResumable(r, file, { contentType: file.type || "image/jpeg" });

      await new Promise((resolve, reject)=>{
        task.on("state_changed",(snap)=>{
          const frac = snap.totalBytes ? (snap.bytesTransferred / snap.totalBytes) : 0;
          const global = ((idx - 1 + frac) / total) * 100;
          setProgressPhotos(Math.max(1, Math.round(global)), `Upload photo ${idx}/${total}…`);
        }, reject, resolve);
      });

      const url = await getDownloadURL(task.snapshot.ref);
      return {
        url,
        path,
        name: fname,
        sizeBytes: Number(file.size || 0),
        createdAtMs: Date.now()
      };
    }

    async function uploadInBatches(files, batchSize=3){
      const out = [];
      const total = files.length;

      for(let start=0; start<files.length; start += batchSize){
        const batch = files.slice(start, start + batchSize);
        const tasks = batch.map((file, j)=> uploadOnePhoto(file, start + j + 1, total));
        const res = await Promise.all(tasks);
        out.push(...res);
      }
      return out;
    }

    clearPhotosBtn.addEventListener("click", ()=>{
      photosInput.value = "";
      hidePhotosHint();
      photosPreview.style.display = "none";
      photosPreview.innerHTML = "";
    });

    photosInput.addEventListener("change", ()=>{
      hideAlert();
      const files = Array.from(photosInput.files || []).filter(f => (f?.type || "").startsWith("image/"));
      renderLocalThumbs(files);

      if(!files.length){ hidePhotosHint(); return; }

      if(files.length > MAX_PHOTOS){
        showPhotosHint(`⚠️ Trop de photos : ${files.length}. Limite ${MAX_PHOTOS}.`, false);
        photosInput.value = "";
        photosPreview.style.display = "none";
        photosPreview.innerHTML = "";
        return;
      }

      const tooBig = files.find(f => Number(f.size || 0) > MAX_BYTES);
      if(tooBig){
        showPhotosHint(`⚠️ Une photo est trop lourde (${fmtSize(tooBig.size)}). Limite ${fmtSize(MAX_BYTES)}.`, false);
        return;
      }

      showPhotosHint(`✅ ${files.length} photo(s) sélectionnée(s).`, true);
    });

    uploadPhotosBtn.addEventListener("click", async ()=>{
      hideAlert();
      hideProgressPhotos();

      const files = Array.from(photosInput.files || []).filter(f => (f?.type || "").startsWith("image/"));
      if(!files.length) return showAlert("Choisis des photos (max 20).");
      if(files.length > MAX_PHOTOS) return showAlert(`Trop de photos : ${files.length}. Limite ${MAX_PHOTOS}.`);

      const tooBig = files.find(f => Number(f.size || 0) > MAX_BYTES);
      if(tooBig) return showAlert(`Une photo est trop lourde (${fmtSize(tooBig.size)}). Limite : ${fmtSize(MAX_BYTES)}.`);

      lockUI(true);
      try{
        const { tokenDoc, missionRef, missionDoc } = await preflight();

        setProgressPhotos(1, "Démarrage…");

        const uploaded = await uploadInBatches(files, 3);
        const newPhotos = uploaded.filter(x => x?.url && x?.path);

        // ✅ fusion sans écraser
        const existing = Array.isArray(missionDoc.proofPhotos) ? missionDoc.proofPhotos : [];
        const merged = existing.concat(newPhotos).slice(0, MAX_PHOTOS);

        setProgressPhotos(100, "Finalisation…");

        await updateDoc(missionRef, {
          proofPhotos: merged,
          proofPhotosPreview: merged.slice(0,3).map(x=>x.url),
          proofPhotosCount: merged.length,
          proofPhotosAtMs: Date.now(),
          proofPhotosToken: String(token),
          proofPhotosAgentEmail: String(tokenDoc?.agentEmail || ""),
          proofPhotosAgentName: String(tokenDoc?.agentName || "")
        });

        photosInput.value = "";
        hideProgressPhotos();
        showAlert(`✅ ${newPhotos.length} photo(s) envoyée(s). Total mission: ${merged.length}.`, true);

      }catch(err){
        console.error(err);
        hideProgressPhotos();
        showAlert("Erreur envoi photos : " + (err?.code || err?.message || String(err)));
      }finally{
        lockUI(false);
      }
    });

    async function load(){
      hideAlert();
      subLine.textContent = "Chargement…";
      hideProgressPhotos(); hidePhotosHint();

      chipLine.textContent = "…";
      chipToken.textContent = "token: —";
      chipType.textContent = "type: —";
      chipMissionToken.textContent = "missionToken: —";

      if(!token || !prestationId){
        subLine.textContent = "";
        showAlert("⛔ Paramètres manquants (token / prestationId).");
        return;
      }

      // back
      backBtn.href = `agent.html?token=${encodeURIComponent(token)}&prestationId=${encodeURIComponent(prestationId)}`;

      chipToken.textContent = `token: ${token}`;
      chipLine.textContent = `event: ${prestationId}`;

      try{
        const { missionDoc } = await preflight();
        chipMissionToken.textContent = `missionToken: ${missionDoc.dayToken || "—"}`;
        subLine.textContent = "";
      }catch(e){
        subLine.textContent = "";
        showAlert("⛔ " + (e?.message || String(e)));
        chipLine.textContent = "Erreur";
      }
    }

    load().catch(err=>{
      console.error(err);
      showAlert("Erreur chargement preuves : " + (err?.code || err?.message || "inconnue"));
    });
  </script>
</body>
</html>
