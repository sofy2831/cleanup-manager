<!-- docs/messagerie.conv.html (FINAL — conciergerie : conversation thread + logements propriétaire, SANS PDF/attachments) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Conversation</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
      --card: rgba(255,255,255,0.88);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 110px; }
    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none; font-weight:900; font-size:13px;
      cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; gap:10px; margin-top:8px; }

    .alert{
      display:none; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:900; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
    }

    .head{
      display:flex; justify-content:space-between; align-items:flex-start; gap:10px;
    }
    .hLeft{ min-width:0; display:flex; flex-direction:column; gap:4px; }
    .title{ font-size:16px; font-weight:1000; }
    .sub{ font-size:12px; font-weight:900; color:var(--muted); display:flex; gap:8px; flex-wrap:wrap; }
    .tag{
      display:inline-flex; align-items:center; justify-content:center;
      padding:4px 8px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:var(--violet);
    }

    .homesBox{
      margin-top:10px;
      display:none;
      padding:10px;
      border-radius:14px;
      background:#fff;
      border:1px dashed rgba(122,92,255,0.25);
    }
    .homesBox b{ font-size:12px; font-weight:1000; }
    .homesList{ margin-top:6px; display:flex; flex-wrap:wrap; gap:6px; }
    .homePill{
      display:inline-flex;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(122,92,255,0.18);
      background:rgba(122,92,255,0.08);
      font-size:11px;
      font-weight:950;
      color:#333;
    }

    .chat{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
      max-height: 60vh;
      overflow:auto;
      padding-right:4px;
    }
    .msg{
      max-width:92%;
      padding:10px 12px;
      border-radius:16px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.05);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .msg.me{ margin-left:auto; border-color: rgba(122,92,255,0.22); }
    .meta{ font-size:11px; color:#666; font-weight:900; margin-bottom:6px; }
    .text{ font-size:13px; font-weight:850; white-space:pre-wrap; }

    .btnMini{
      border:none; border-radius:999px;
      padding:9px 10px; font-size:12px; font-weight:900;
      cursor:pointer; white-space:nowrap;
      background:linear-gradient(90deg,var(--violet),var(--violet2)); color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
      text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    }

    .composer{
      margin-top:10px;
      display:flex; gap:8px; align-items:flex-end;
    }
    textarea{
      flex:1;
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid #D3C7FF;
      font-size:14px;
      outline:none;
      background:#fff;
      font-weight:800;
      resize:vertical;
      min-height:44px;
      max-height:160px;
    }
    textarea:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .bottom-nav{
      position: fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px; white-space:nowrap;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        transform:none;
        width:100%;
        max-width:980px;
        border-bottom:1px solid var(--border);
        border-radius:999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
      .chat{ max-height: 520px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="messagerie.html">← Messagerie</a>
      <button class="pill" id="toggleHomesBtn" type="button">Logements</button>
    </div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <section class="card">
        <div class="head">
          <div class="hLeft">
            <div class="title" id="titleLine">Conversation</div>
            <div class="sub" id="subLine">—</div>
          </div>
        </div>

        <div class="homesBox" id="homesBox">
          <b>Logements du propriétaire</b>
          <div class="homesList" id="homesList"></div>
        </div>

        <div class="chat" id="chatBox"></div>

        <div class="composer">
          <textarea id="msgInput" placeholder="Écrire un message…"></textarea>
          <button class="btnMini" id="sendBtn" type="button">Envoyer</button>
        </div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a class="active" href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc, updateDoc,
      addDoc, collection, query, where,
      orderBy, limit, onSnapshot, serverTimestamp, increment, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const titleLine = document.getElementById("titleLine");
    const subLine = document.getElementById("subLine");

    const homesBox = document.getElementById("homesBox");
    const homesList = document.getElementById("homesList");
    const toggleHomesBtn = document.getElementById("toggleHomesBtn");

    const chatBox = document.getElementById("chatBox");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtTs(ts){
      try{
        const d = ts?.toDate ? ts.toDate() : null;
        if(!d) return "";
        return d.toLocaleString("fr-FR");
      }catch{ return ""; }
    }

    function getParam(name){
      const u = new URL(location.href);
      return u.searchParams.get(name) || "";
    }

    let currentUser = null;
    let threadId = "";
    let thread = null;
    let unsubMsgs = null;

    toggleHomesBtn.onclick = ()=>{
      homesBox.style.display = (!homesBox.style.display || homesBox.style.display === "none") ? "block" : "none";
    };

    function isMe(m){
      const role = String(m?.senderRole || "").toUpperCase();
      if(role === "CONCIERGERIE") return true;
      return String(m?.senderUid || "") === String(currentUser?.uid || "");
    }

    function renderMessage(m){
      const me = isMe(m);
      const div = document.createElement("div");
      div.className = "msg" + (me ? " me" : "");
      const meta = `${me ? "Conciergerie" : "Propriétaire"} • ${fmtTs(m.at)}`;

      const text = String(m.text || "").trim();

      div.innerHTML = `
        <div class="meta">${esc(meta)}</div>
        <div class="text">${esc(text || "—")}</div>
      `;
      return div;
    }

    async function loadHomesForOwner(conciergerieUid, ownerDocId){
      homesList.innerHTML = "";
      if(!conciergerieUid || !ownerDocId) return;

      try{
        const qHomes = query(
          collection(db,"homes"),
          where("conciergerieUid","==", conciergerieUid),
          where("ownerDocId","==", ownerDocId),
          limit(50)
        );

        const hs = await getDocs(qHomes);

        const list = hs.docs.map(d=>{
          const h = d.data() || {};
          return String(h.name || h.label || h.homeName || d.id).trim();
        }).filter(Boolean);

        if(!list.length){
          homesList.innerHTML = `<span class="homePill">Aucun logement trouvé</span>`;
          return;
        }

        for(const n of list){
          const pill = document.createElement("span");
          pill.className = "homePill";
          pill.textContent = n;
          homesList.appendChild(pill);
        }
      }catch(e){
        homesList.innerHTML = `<span class="homePill">Impossible de charger les logements</span>`;
      }
    }

    function subscribeMessages(){
      if(unsubMsgs) unsubMsgs();
      chatBox.innerHTML = "";

      const qMsgs = query(
        collection(db,"threads", threadId, "messages"),
        orderBy("at","asc"),
        limit(400)
      );

      unsubMsgs = onSnapshot(qMsgs, (snap)=>{
        chatBox.innerHTML = "";
        snap.forEach(d=>{
          chatBox.appendChild(renderMessage(d.data() || {}));
        });
        chatBox.scrollTop = chatBox.scrollHeight + 9999;
      }, (err)=>{
        showAlert("Erreur messages : " + (err?.message || "inconnue"));
      });
    }

    async function loadThreadHeader(){
      const tRef = doc(db,"threads", threadId);
      const snap = await getDoc(tRef);

      if(!snap.exists()){
        titleLine.textContent = "Conversation";
        subLine.innerHTML = `<span class="tag">Thread introuvable</span>`;
        showAlert("Thread introuvable. Reviens à la messagerie et recrée la conversation si besoin.");
        return false;
      }

      thread = { id: snap.id, ...(snap.data()||{}) };

      const ownerName = String(thread.ownerName || "Propriétaire").trim();
      const mail = String(thread.ownerEmailLower || "").trim();
      const hc = Number(thread.homeCount || 0);

      titleLine.textContent = ownerName;
      subLine.innerHTML = `
        ${mail ? `<span class="tag">${esc(mail)}</span>` : ``}
        <span class="tag">${Number.isFinite(hc) ? hc : 0} logement(s)</span>
      `;

      // reset unread conciergerie
      try{ await updateDoc(doc(db,"threads",threadId), { unreadForConciergerie: 0 }); }catch(_){}

      await loadHomesForOwner(thread.conciergerieUid, thread.ownerDocId);
      return true;
    }

    sendBtn.onclick = async ()=>{
      hideAlert();
      const text = String(msgInput.value || "").trim();
      if(!text) return;

      sendBtn.disabled = true;
      try{
        // on refuse d’envoyer si thread inexistant
        const ok = await getDoc(doc(db,"threads", threadId));
        if(!ok.exists()) throw new Error("Thread introuvable.");

        await addDoc(collection(db,"threads", threadId, "messages"), {
          text,
          at: serverTimestamp(),
          senderRole: "CONCIERGERIE",
          senderUid: currentUser.uid
        });

        await setDoc(doc(db,"threads", threadId), {
          lastAt: serverTimestamp(),
          lastText: text,
          unreadForOwner: increment(1)
        }, { merge:true });

        msgInput.value = "";
      }catch(e){
        showAlert("Envoi impossible : " + (e?.message || "erreur"));
      }finally{
        sendBtn.disabled = false;
      }
    };

    msgInput.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendBtn.click();
      }
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }
      currentUser = user;

      threadId = getParam("threadId");
      if(!threadId){
        showAlert("threadId manquant dans l’URL.");
        return;
      }

      const ok = await loadThreadHeader();
      if(ok) subscribeMessages();
    });
  </script>
</body>
</html>
