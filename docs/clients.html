<!-- docs/clients.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Clients</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
    }

    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:1080px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:20; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }

    .wrap{ width:100%; max-width:1080px; display:flex; flex-direction:column; gap:10px; margin-top:6px; }

    .logo{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:8px; margin-bottom:4px; text-align:center;
    }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦"; position:absolute; top:-6px; right:-5px;
      font-size:12px; color:var(--violet);
    }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:13px; color:#444; text-align:center; font-weight:800; }
    .emailLine{ margin-top:4px; font-size:12px; color:var(--muted); font-weight:900; text-align:center; }

    .alert{
      display:none; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:900; color:#444; white-space:pre-wrap;
      max-width:1080px; width:100%;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
    }
    .cardTitle{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      font-size:14px; font-weight:900; color:#111;
    }
    .tiny{ font-size:12px; color:var(--muted); font-weight:900; }

    .toolbar{
      display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px;
    }
    .search{ flex:1; min-width:220px; }
    input[type="search"]{
      width:100%;
      box-sizing:border-box;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      font-size:14px;
      outline:none;
      background:#fff;
    }
    input[type="search"]:focus{
      border-color:var(--violet);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }

    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:3px 9px; border-radius:999px;
      font-size:11px; font-weight:900; white-space:nowrap;
      background:rgba(122,92,255,0.12); color:#5b45c8;
    }
    .badge.ok{ background:rgba(27,143,77,0.14); color:var(--ok); }
    .badge.bad{ background:rgba(179,38,30,0.14); color:var(--bad); }
    .badge.blue{ background:rgba(0,163,255,0.14); color:#0067a6; }

    .list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .item{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }
    .iMain{ min-width:0; }
    .iTop{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .iTitle{
      margin-top:4px;
      font-size:13px; font-weight:900; color:#222;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:780px;
    }
    .iSub{
      margin-top:3px;
      font-size:12px; font-weight:800; color:#666;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:780px;
    }
    .iActions{ display:flex; flex-direction:column; gap:6px; align-items:flex-end; flex-shrink:0; }

    .mini{
      border:none; border-radius:999px;
      padding:9px 10px; font-size:12px; font-weight:900;
      cursor:pointer; white-space:nowrap;
      background:linear-gradient(90deg,var(--violet),var(--violet2)); color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
      text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    }
    .mini.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .mini:disabled{ opacity:.55; cursor:not-allowed; }

    details.acc{
      margin-top:8px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.14);
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      overflow:hidden;
    }
    details.acc > summary{
      list-style:none;
      cursor:pointer;
      padding:10px 10px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      font-weight:900; font-size:12px;
      user-select:none;
    }
    details.acc > summary::-webkit-details-marker{ display:none; }
    .accBody{ padding:0 10px 10px; }

    .homeRow{
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      padding:8px 8px;
      border-radius:12px;
      background:rgba(0,0,0,0.02);
      margin-top:8px;
    }
    .homeRow b{ font-weight:900; }
    .homeRow .meta{ font-size:12px; font-weight:800; color:#666; }
    .homeRow .actions{ display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; gap: 6px; justify-content: space-around; align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none;
      font-size: 11px; font-weight:900; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff; box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        max-width: 1080px;
        margin: 12px auto 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
    @media(max-width: 520px){
      .iTitle,.iSub{ max-width: 220px; }
      html, body{ overflow-x:hidden; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="planning.html">← Planning</a>
      <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <a class="pill" href="invite-proprietaire.html">Inviter</a>
        <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
      </div>
    </div>

    <div class="wrap">
      <div class="logo">
        <div class="logo-icon">✓</div>
        <h1>CleanUp Manager</h1>
      </div>
      <div class="subtitle">Clients (propriétaires)</div>
      <div class="emailLine" id="emailLine">—</div>

      <div class="alert" id="alertBox"></div>

      <section class="card">
        <div class="cardTitle">
          <span>Liste propriétaires</span>
          <span class="tiny" id="countLine">—</span>
        </div>

        <div class="toolbar">
          <div class="search">
            <input id="searchInput" type="search" placeholder="Recherche : nom, email, ville, logement…" />
          </div>
          <button class="pill primary" id="refreshBtn" type="button">Rafraîchir</button>
        </div>

        <div class="tiny" style="margin-top:8px;">
          Source : <b>homes</b> (conciergerieUid = toi). Un “client” = un ownerEmail associé à au moins un logement.
        </div>

        <div class="list" id="clientsList"></div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
    <a href="catalogue.html">Catalogue</a>
    <a class="active" href="clients.html">Clients</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc,
      collection, query, where, getDocs, limit
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // UI
    const emailLine = document.getElementById("emailLine");
    const logoutBtn = document.getElementById("logoutBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const alertBox = document.getElementById("alertBox");
    const countLine = document.getElementById("countLine");
    const clientsList = document.getElementById("clientsList");
    const searchInput = document.getElementById("searchInput");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function norm(s){ return (s||"").toString().toLowerCase().trim(); }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

    // Logout
    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      location.href = "index.html";
    });

    // Guard conciergerie (copie simple)
    const FREE_EMAILS = new Set(["mathilde.debout31@gmail.com","s.dumas974@gmail.com"]);
    async function guardConciergerie(user){
      const email = (user.email || "").toLowerCase();
      if(FREE_EMAILS.has(email)) return true;
      try{
        const snap = await getDoc(doc(db,"users",user.uid));
        if(!snap.exists()) return false;
        const d = snap.data() || {};
        return (d.role === "conciergerie" || d.role === "admin") && d.subscriptionStatus === "active";
      }catch(e){ return false; }
    }

    // State
    let currentUser = null;
    let allHomes = [];
    let owners = []; // [{ ownerEmail, ownerName, homes:[...], cities:Set }]

    function buildOwnersFromHomes(homes){
      const map = new Map();

      for(const h of homes){
        const ownerEmail = normalizeEmail(h.ownerEmail || "");
        const ownerName  = (h.ownerName || "").trim();
        if(!ownerEmail && !ownerName) continue;

        const key = ownerEmail || ("__NONAME__|" + ownerName.toLowerCase());
        if(!map.has(key)){
          map.set(key, {
            ownerEmail,
            ownerName,
            homes: [],
            cities: new Set()
          });
        }
        const o = map.get(key);
        if(!o.ownerName && ownerName) o.ownerName = ownerName;
        o.homes.push(h);
        if(h.city) o.cities.add(h.city);
      }

      const arr = Array.from(map.values());
      // tri : nb logements desc puis email/nom
      arr.sort((a,b)=>{
        const da = b.homes.length - a.homes.length;
        if(da !== 0) return da;
        return (a.ownerEmail || a.ownerName || "").localeCompare(b.ownerEmail || b.ownerName || "");
      });
      return arr;
    }

    function render(){
      const q = norm(searchInput.value || "");

      const visible = owners.filter(o=>{
        if(!q) return true;
        const hay = [
          o.ownerName, o.ownerEmail,
          ...o.homes.map(h=>h.name),
          ...o.homes.map(h=>h.city),
          ...o.homes.map(h=>(h.homeAddress || h.address || "")),
        ].map(norm).join(" ");
        return hay.includes(q);
      });

      countLine.textContent = `${visible.length} client(s) • ${allHomes.length} logement(s)`;

      clientsList.innerHTML = "";

      if(!visible.length){
        clientsList.innerHTML = `
          <div class="item">
            <div class="iMain">
              <div class="iTitle">${owners.length ? "Aucun résultat" : "Aucun client"}</div>
              <div class="iSub">${owners.length ? "Change la recherche." : "Ajoute des logements avec ownerEmail/ownerName."}</div>
            </div>
          </div>
        `;
        return;
      }

      for(const o of visible){
        const cities = Array.from(o.cities).filter(Boolean);
        const citiesLabel = cities.length ? cities.slice(0,3).join(", ") + (cities.length>3 ? "…" : "") : "—";
        const ownerLabel = o.ownerName ? o.ownerName : "Propriétaire";
        const emailLabel = o.ownerEmail ? o.ownerEmail : "Email manquant";

        const inviteUrl = `invite-proprietaire.html?email=${encodeURIComponent(o.ownerEmail || "")}&name=${encodeURIComponent(o.ownerName || "")}`;

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="iMain">
            <div class="iTop">
              <span class="badge ok">👤 CLIENT</span>
              <span class="badge">${o.homes.length} logement(s)</span>
              <span class="badge">🏙️ ${esc(citiesLabel)}</span>
              ${o.ownerEmail ? "" : `<span class="badge bad">EMAIL MANQUANT</span>`}
            </div>
            <div class="iTitle">${esc(ownerLabel)}</div>
            <div class="iSub">${esc(emailLabel)}</div>

            <details class="acc">
              <summary>
                <span>🏠 Voir logements</span>
                <span class="badge">${o.homes.length}</span>
              </summary>
              <div class="accBody" id="homes_${esc(o.ownerEmail || ownerLabel)}"></div>
            </details>
          </div>

          <div class="iActions">
            <a class="mini" href="${inviteUrl}">✉️ Inviter</a>
            <a class="mini ghost" href="logements.html">🏘️ Logements</a>
          </div>
        `;
        clientsList.appendChild(div);

        const body = div.querySelector(".accBody");
        const homesSorted = o.homes.slice().sort((a,b)=> String(a.name||"").localeCompare(String(b.name||"")));
        body.innerHTML = homesSorted.map(h=>{
          const label = `${h.name || "Logement"}${h.city ? " — " + h.city : ""}`;
          const addr = (h.homeAddress || h.address || "").trim();
          const type = (h.type || "").trim();
          const planUrl = `planning.html?homeId=${encodeURIComponent(h.id)}`;
          return `
            <div class="homeRow">
              <div>
                <div><b>${esc(label)}</b> ${type ? `<span class="badge">🏷️ ${esc(type)}</span>` : ""}</div>
                <div class="meta">${addr ? "📍 " + esc(addr) : "📍 Adresse manquante"}</div>
              </div>
              <div class="actions">
                <a class="mini ghost" href="${planUrl}">🗓️ Planning</a>
              </div>
            </div>
          `;
        }).join("");
      }
    }

    async function loadHomes(){
      hideAlert();
      allHomes = [];
      owners = [];

      try{
        const qH = query(
          collection(db,"homes"),
          where("conciergerieUid","==", currentUser.uid),
          limit(1200)
        );
        const snap = await getDocs(qH);
        allHomes = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));

        owners = buildOwnersFromHomes(allHomes);
        render();

      }catch(err){
        console.error(err);
        showAlert("Erreur chargement clients : " + (err?.message || "inconnue"));
        render();
      }
    }

    // Events
    searchInput.addEventListener("input", render);
    refreshBtn.addEventListener("click", ()=> loadHomes());

    // Boot
    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      const ok = await guardConciergerie(user);
      if(!ok){
        location.href = "abonnement.html?plan=starter";
        return;
      }
      currentUser = user;
      emailLine.textContent = user.email || user.uid;

      await loadHomes();
    });
  </script>
</body>
</html>
