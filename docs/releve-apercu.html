<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CleanUp Manager – Relevé</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{font-family:Inter;margin:0;background:#F8F4FF}
.wrap{max-width:900px;margin:auto;padding:12px}
.paper{background:#fff;border-radius:16px;padding:16px}
.topbar{display:flex;justify-content:space-between;margin-bottom:10px}
.pill{padding:8px 12px;border-radius:999px;border:2px solid #7A5CFF;background:#fff;font-weight:700}
.header{display:flex;justify-content:space-between;align-items:center}
.logo{width:50px;height:50px;border-radius:12px;border:1px solid #ccc;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.title{text-align:center;font-weight:800;margin-top:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.box{border:1px solid #eee;border-radius:12px;padding:10px}
table{width:100%;margin-top:10px;border-collapse:collapse}
td,th{padding:8px;border-bottom:1px solid #eee;font-size:13px}
.right{text-align:right}
.total{margin-top:10px}
.footer{text-align:center;font-size:11px;margin-top:12px;color:#666}
</style>
</head>

<body>
<div class="wrap">

<div class="topbar">
<button class="pill" id="backBtn">← Retour</button>
<button class="pill" onclick="window.print()">Imprimer</button>
</div>

<div class="paper">

<div class="header">
<div style="display:flex;gap:10px;align-items:center">
<div class="logo">
<img id="logoImg">
</div>
<div id="bizName">Conciergerie</div>
</div>

<div id="periodLabel"></div>
</div>

<div class="title">RELEVÉ</div>

<div class="grid">
<div class="box">
<b>Propriétaire</b>
<div id="ownerBlock"></div>
</div>

<div class="box">
<b>Période</b>
<div id="periodBlock"></div>
</div>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Type</th>
<th>Document</th>
<th>Bien</th>
<th class="right">Montant</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="total">
<div>Total factures : <b id="inv"></b></div>
<div>Total avoirs : <b id="cred"></b></div>
<div>Net : <b id="net"></b></div>
<hr>
<div>Réglé : <b id="paid"></b></div>
<div>Reste dû : <b id="due"></b></div>
<div>Dernier règlement : <b id="last"></b></div>
</div>

<div class="footer" id="footer"></div>

</div>
</div>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const qs = new URLSearchParams(location.search);
const id = qs.get("statementId");
const isOwner = qs.get("owner")==="1";

const bizName = document.getElementById("bizName");
const logoImg = document.getElementById("logoImg");
const ownerBlock = document.getElementById("ownerBlock");
const periodBlock = document.getElementById("periodBlock");
const tbody = document.getElementById("tbody");

const inv = document.getElementById("inv");
const cred = document.getElementById("cred");
const net = document.getElementById("net");
const paid = document.getElementById("paid");
const due = document.getElementById("due");
const last = document.getElementById("last");

function €(n){return (n||0).toLocaleString("fr-FR")+" €"}

async function loadConciergerie(uid){
  const s = await getDoc(doc(db,"users",uid));
  if(!s.exists()) return;
  const d = s.data();
  bizName.textContent = d?.businessProfile?.companyName || "Conciergerie";
  if(d?.businessProfile?.logoUrl){
    logoImg.src = d.businessProfile.logoUrl;
  }
}

onAuthStateChanged(auth, async (user)=>{
  if(!user) return location.href="login.html";

  const snap = await getDoc(doc(db,"ownerStatements",id));
  if(!snap.exists()) return alert("Introuvable");

  const d = snap.data();

  if(isOwner){
    if(d.ownerUid !== user.uid) return alert("Accès refusé");
    if(d.ownerVisible !== true) return alert("Non visible");
  }

  await loadConciergerie(d.conciergerieUid);

  ownerBlock.textContent = d.ownerName || "";
  periodBlock.textContent = d.periodKey;

  inv.textContent = €(d.totals?.invoicesTTC);
  cred.textContent = €(d.totals?.creditsTTC);
  net.textContent = €(d.totals?.netTTC);

  paid.textContent = €(d.paymentSummary?.paidTTC);
  due.textContent = €(d.paymentSummary?.dueTTC);

  if(d.paymentSummary?.lastPaymentDate?.toDate){
    last.textContent = d.paymentSummary.lastPaymentDate.toDate().toLocaleDateString("fr-FR");
  }else{
    last.textContent = "—";
  }

  tbody.innerHTML = (d.items||[]).map(i=>`
    <tr>
      <td>${i.dateKey}</td>
      <td>${i.kind}</td>
      <td>${i.number}</td>
      <td>${i.homeName||""}</td>
      <td class="right">${€(i.totalTTC)}</td>
    </tr>
  `).join("");

  document.getElementById("footer").textContent = bizName.textContent;
});

document.getElementById("backBtn").onclick = ()=>{
  location.href="owner-facturation.html";
};
</script>

</body>
</html>
