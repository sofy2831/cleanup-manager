<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CleanUp Manager – Relevé</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
:root{
  --violet:#7A5CFF;
  --bg:#F8F4FF;
}
*{box-sizing:border-box;font-family:Inter}
body{margin:0;background:var(--bg)}

.wrap{max-width:980px;margin:auto;padding:12px}

.topbar{
  position:sticky;top:0;background:#fff;padding:10px;
  display:flex;justify-content:space-between;z-index:10
}
.pill{
  padding:10px 14px;border-radius:999px;
  border:2px solid var(--violet);
  background:#fff;font-weight:700;cursor:pointer
}

.paper{
  background:#fff;border-radius:16px;padding:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.08)
}

.header{
  display:flex;justify-content:space-between;align-items:center
}

.logo{
  width:50px;height:50px;border-radius:12px;
  border:1px solid #ddd;overflow:hidden
}
.logo img{width:100%;height:100%;object-fit:cover}

.title{
  text-align:center;font-weight:800;margin-top:10px
}

.grid{
  display:grid;gap:10px;margin-top:10px
}
@media(min-width:700px){
  .grid{grid-template-columns:1fr 1fr}
}

.box{
  border:1px solid #eee;border-radius:12px;padding:10px
}

table{
  width:100%;border-collapse:collapse;margin-top:12px
}
th,td{
  padding:8px;border-bottom:1px solid #eee;font-size:13px
}
.right{text-align:right}

.total{
  margin-top:12px;font-size:14px
}

.footer{
  text-align:center;margin-top:14px;font-size:11px;color:#666
}

.alert{
  display:none;margin-top:10px;padding:10px;
  border-left:4px solid red;background:#fff
}
</style>
</head>

<body>
<div class="wrap">

<div class="topbar">
<button class="pill" id="backBtn">← Retour</button>
<button class="pill" id="printBtn">Imprimer</button>
</div>

<div id="alertBox" class="alert"></div>

<div class="paper" id="paper">

<div class="header">
<div style="display:flex;gap:10px;align-items:center">
<div class="logo">
<img id="logoImg">
</div>
<div id="bizName">Conciergerie</div>
</div>

<div id="periodLabel"></div>
</div>

<div class="title">RELEVÉ DE FACTURATION</div>

<div class="grid">
<div class="box">
<b>Propriétaire</b>
<div id="ownerBlock"></div>
</div>

<div class="box">
<b>Période</b>
<div id="periodBlock"></div>
</div>
</div>

<table>
<thead>
<tr>
<th>Date</th>
<th>Type</th>
<th>Document</th>
<th>Bien</th>
<th class="right">Montant TTC</th>
</tr>
</thead>
<tbody id="tbody"></tbody>
</table>

<div class="total">
<div>Total factures : <b id="inv"></b></div>
<div>Total avoirs : <b id="cred"></b></div>
<div>Net : <b id="net"></b></div>

<hr>

<div>Réglé : <b id="paid"></b></div>
<div>Reste dû : <b id="due"></b></div>
<div>Dernier règlement : <b id="last"></b></div>
</div>

<div class="footer" id="footer"></div>

</div>
</div>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const qs = new URLSearchParams(location.search);
const id = qs.get("statementId");
const isOwner = qs.get("owner")==="1";

const alertBox = document.getElementById("alertBox");
const paper = document.getElementById("paper");

function showAlert(msg){
  alertBox.style.display="block";
  alertBox.textContent=msg;
  paper.style.display="none";
}

function €(n){
  return (Number(n||0)).toLocaleString("fr-FR",{minimumFractionDigits:2})+" €";
}

async function loadConciergerie(uid){
  if(!uid) return;
  const s = await getDoc(doc(db,"users",uid));
  if(!s.exists()) return;

  const d = s.data();

  document.getElementById("bizName").textContent =
    d?.businessProfile?.companyName || "Conciergerie";

  if(d?.businessProfile?.logoUrl){
    document.getElementById("logoImg").src =
      d.businessProfile.logoUrl;
  }
}

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    location.href="login.html?role=proprietaire";
    return;
  }

  if(!id){
    showAlert("Relevé manquant");
    return;
  }

  const snap = await getDoc(doc(db,"ownerStatements",id));
  if(!snap.exists()){
    showAlert("Relevé introuvable");
    return;
  }

  const d = snap.data();

  if(isOwner){
    if(d.ownerUid !== user.uid){
      showAlert("Accès refusé");
      return;
    }
    if(d.ownerVisible !== true){
      showAlert("Non accessible");
      return;
    }
  }

  await loadConciergerie(d.conciergerieUid);

  document.getElementById("ownerBlock").textContent = d.ownerName || "";
  document.getElementById("periodBlock").textContent = d.periodKey || "";

  document.getElementById("inv").textContent = €(d.totals?.invoicesTTC);
  document.getElementById("cred").textContent = €(d.totals?.creditsTTC);
  document.getElementById("net").textContent = €(d.totals?.netTTC);

  document.getElementById("paid").textContent = €(d.paymentSummary?.paidTTC);
  document.getElementById("due").textContent = €(d.paymentSummary?.dueTTC);

  const last = d.paymentSummary?.lastPaymentDate;
  document.getElementById("last").textContent =
    last?.toDate ? last.toDate().toLocaleDateString("fr-FR") : "—";

  document.getElementById("tbody").innerHTML =
    (d.items||[]).map(i=>`
      <tr>
        <td>${i.dateKey||""}</td>
        <td>${i.kind||""}</td>
        <td>${i.number||""}</td>
        <td>${i.homeName||""}</td>
        <td class="right">${€(i.totalTTC)}</td>
      </tr>
    `).join("");

  document.getElementById("footer").textContent =
    document.getElementById("bizName").textContent;
});

document.getElementById("backBtn").onclick = ()=>{
  location.href="owner-facturation.html";
};

document.getElementById("printBtn").onclick = ()=>{
  window.print();
};
</script>

</body>
</html>
