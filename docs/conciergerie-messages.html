<!-- docs/conciergerie-messages.html (FINAL — conciergerie : liste threads + badge unread + ouverture conversation) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Messages (Conciergerie)</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 90px; }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:20; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; gap:10px; margin-top:6px; }

    .logo{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:8px; margin-bottom:4px; text-align:center;
    }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:13px; color:#444; text-align:center; font-weight:800; }

    .alert{
      display:none; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:900; color:#444; white-space:pre-wrap;
      width:100%;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
    }
    .cardTitle{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      font-size:14px; font-weight:900; color:#111;
    }
    .tiny{ font-size:12px; color:var(--muted); font-weight:900; }

    .list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .item{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.05);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
    }
    .left{ display:flex; flex-direction:column; gap:4px; min-width:0; }
    .name{ font-weight:1000; font-size:13px; color:#111; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .last{ font-weight:800; font-size:12px; color:#444; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:640px; }
    .meta{ font-weight:900; font-size:11px; color:#666; white-space:nowrap; }
    .badge{
      min-width:26px; height:22px; padding:0 8px;
      border-radius:999px; background:#111; color:#fff;
      font-size:12px; font-weight:1000;
      display:none; align-items:center; justify-content:center;
      flex-shrink:0;
      align-self:center;
    }
    .empty{
      background:#fff;
      border-radius:16px;
      border:1px dashed rgba(0,0,0,0.12);
      padding:12px;
      font-weight:900;
      color:#666;
      text-align:center;
      display:none;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="conciergerie.html">← Conciergerie</a>
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>

    <div class="wrap">
      <div class="logo">
        <div class="logo-icon">✓</div>
        <div>
          <h1>CleanUp Manager</h1>
          <div class="subtitle">Messages conciergerie</div>
        </div>
      </div>

      <div class="alert" id="alertBox"></div>

      <section class="card">
        <div class="cardTitle">
          <span>Conversations</span>
          <span class="tiny" id="hintLine">—</span>
        </div>

        <div class="list" id="threadsList"></div>
        <div class="empty" id="emptyBox">Aucune conversation.</div>
      </section>
    </div>
  </div>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { collection, query, where, orderBy, limit, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const alertBox = document.getElementById("alertBox");
const threadsList = document.getElementById("threadsList");
const emptyBox = document.getElementById("emptyBox");
const hintLine = document.getElementById("hintLine");
const logoutBtn = document.getElementById("logoutBtn");

function showAlert(msg, ok=false){
  alertBox.style.display="block";
  alertBox.classList.toggle("ok",!!ok);
  alertBox.textContent=msg;
}
function hideAlert(){
  alertBox.style.display="none";
  alertBox.classList.remove("ok");
  alertBox.textContent="";
}
function esc(s){
  return String(s ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}
function fmtTs(ts){
  try{
    const d = ts?.toDate ? ts.toDate() : null;
    if(!d) return "";
    return d.toLocaleString("fr-FR");
  }catch(_){ return ""; }
}
function setBadge(el, n){
  const v = Number(n||0);
  if(v>0){ el.style.display="inline-flex"; el.textContent=String(v); }
  else { el.style.display="none"; el.textContent=""; }
}

logoutBtn.onclick = async ()=>{
  await signOut(auth);
  localStorage.removeItem("cm_auth");
  location.href="login.html";
};

let unsub = null;

onAuthStateChanged(auth, (user)=>{
  if(!user){
    location.href="login.html";
    return;
  }

  hideAlert();
  hintLine.textContent = user.email ? `Connecté : ${user.email}` : "Connecté";

  if(unsub) unsub();
  unsub = null;

  const q = query(
    collection(db,"threads"),
    where("conciergerieUid","==", String(user.uid)),
    orderBy("lastAt","desc"),
    limit(200)
  );

  unsub = onSnapshot(q, (snap)=>{
    threadsList.innerHTML = "";
    emptyBox.style.display = "none";

    if(snap.empty){
      emptyBox.style.display = "block";
      return;
    }

    snap.forEach(d=>{
      const t = d.data() || {};
      const ownerName = String(t.ownerName || "Propriétaire").trim();
      const ownerDocId = String(t.ownerDocId || "").trim();
      const lastText = String(t.lastText || "").trim();
      const lastAt = fmtTs(t.lastAt);
      const unread = Number(t.unreadForConciergerie || 0);

      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = `
        <div class="left">
          <div class="name">${esc(ownerName)} ${ownerDocId ? "• "+esc(ownerDocId) : ""}</div>
          <div class="last">${esc(lastText || "—")}</div>
          <div class="meta">${esc(lastAt || "")}</div>
        </div>
        <div class="badge">0</div>
      `;
      const badge = row.querySelector(".badge");
      setBadge(badge, unread);

      row.addEventListener("click", ()=>{
        // ouvre la conversation
        location.href = `conciergerie-message.html?threadId=${encodeURIComponent(d.id)}`;
      });

      threadsList.appendChild(row);
    });
  }, (err)=>{
    console.error(err);
    showAlert("Erreur chargement threads : " + (err?.message || "inconnue"));
  });
});
</script>
</body>
</html>
