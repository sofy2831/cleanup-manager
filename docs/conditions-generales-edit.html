<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanUp Manager — Modifier les CG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
:root{--violet:#7A5CFF;--violet2:#6238FF;--bg1:#F8F4FF;--bg2:#EDE6FF;--text:#111;--muted:#666;--border:rgba(122,92,255,.18);--shadow:0 14px 36px rgba(0,0,0,.08);--bad:#b3261e;--ok:#1b8f4d;--card:rgba(255,255,255,.92)}
body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text)}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 12px 80px}.topbar{width:100%;max-width:1100px;display:flex;justify-content:space-between;gap:10px;position:sticky;top:0;background:rgba(248,244,255,.86);z-index:10;padding:8px 0;backdrop-filter:blur(6px)}
.btn,.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border-radius:999px;background:#fff;border:2px solid var(--violet);color:var(--violet);font-size:12.5px;font-weight:1000;text-decoration:none;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.06)}.primary{background:linear-gradient(90deg,var(--violet),var(--violet2));border-color:transparent;color:#fff}.danger{border-color:var(--bad);color:var(--bad)}button:disabled{opacity:.6;cursor:not-allowed}
.logo-title{display:flex;align-items:center;gap:10px;margin-top:8px}.logo-icon{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid var(--violet);display:flex;align-items:center;justify-content:center;color:var(--violet);font-weight:1000}h1{margin:0;font-size:22px;font-weight:1000}.subtitle{font-size:14px;color:#444;font-weight:850}.wrap{width:100%;max-width:1100px;margin-top:12px;display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:980px){.wrap{grid-template-columns:520px 1fr}}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:14px}.card h2{margin:0 0 10px;font-size:16px;font-weight:1000}.sectionTitle{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:13px;font-weight:1000;color:#111}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:720px){.grid2{grid-template-columns:1fr}}
label{display:block;margin:9px 0 4px;font-size:12px;font-weight:1000;color:#333}input,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #D3C7FF;font-size:13px;outline:none;background:#fff;font-weight:800;color:#111}textarea{resize:vertical;min-height:92px}input:focus,textarea:focus{border-color:var(--violet);box-shadow:0 0 0 2px rgba(122,92,255,.13)}
.article{border:1px solid var(--border);border-radius:14px;padding:10px;background:#fff;margin-top:10px}.articleHead{display:flex;gap:8px;justify-content:space-between;align-items:center}.articleHead strong{font-size:12.5px}.smallBtn{padding:6px 9px;font-size:11px;border-width:1px}.hint{font-size:11.5px;color:#666;font-weight:850;line-height:1.35;margin-top:6px}.alert{display:none;margin-top:10px;padding:10px 12px;background:#fff;border-radius:14px;border-left:5px solid var(--bad);box-shadow:0 3px 10px rgba(0,0,0,.06);font-size:12px;font-weight:850;white-space:pre-wrap}.alert.ok{border-left-color:var(--ok)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.preview{background:#fff;border:1px solid var(--border);border-radius:16px;padding:16px;font-size:13px;line-height:1.55;font-weight:800}.preview h1{font-size:22px}.preview h2{font-size:15px;border-top:1px solid var(--border);padding-top:12px;margin-top:18px}.note{border-left:5px solid var(--violet);padding:10px 12px;background:#fff;border-radius:12px;margin:12px 0}.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:6px;justify-content:space-around;padding:9px 10px;background:rgba(255,255,255,.92);border-top:1px solid var(--border);backdrop-filter:blur(10px)}.bottom-nav a{flex:1;text-align:center;font-size:10.8px;font-weight:1000;text-decoration:none;color:#666;padding:9px 8px;border-radius:999px;white-space:nowrap}
</style>
</head>
<body>
<div class="page">
  <div class="topbar"><a class="pill" href="contrat.html">← Retour contrat</a><button class="btn primary" id="saveBtn" type="button">Enregistrer les CG</button></div>
  <div class="logo-title"><div class="logo-icon">C</div><h1>Modifier les conditions générales</h1></div>
  <div class="subtitle" id="companyLine">Conciergerie</div>
  <div class="alert" id="alertBox"></div>
  <div class="wrap">
    <section class="card">
      <h2>Paramètres</h2>
      <div class="grid2"><div><label for="version">Version</label><input id="version" value="1.0"></div><div><label for="versionDate">Date applicable</label><input id="versionDate" type="date" value="2026-07-01"></div></div>
      <label for="title">Titre</label><input id="title" value="Conditions générales de prestations de conciergerie">
      <label for="subtitle">Introduction</label><textarea id="subtitle">Les présentes conditions générales constituent le socle général applicable aux prestations de conciergerie conclues entre la conciergerie et le propriétaire. Elles complètent le contrat principal sans remplacer les conditions particulières.</textarea>
      <label for="priorityNote">Priorité contractuelle</label><textarea id="priorityNote">En cas de contradiction, les conditions particulières du contrat, les devis, les factures, les grilles tarifaires, les annexes et les accords écrits acceptés entre les parties prévalent sur les présentes conditions générales.</textarea>
      <div class="sectionTitle">Articles</div>
      <div id="articlesBox"></div>
      <div class="actions"><button class="btn" id="addArticleBtn" type="button">+ Ajouter un article</button><button class="btn danger" id="resetBtn" type="button">Réinitialiser modèle</button></div>
      <div class="hint">Ces conditions générales sont celles de la conciergerie. CleanUp Manager fournit seulement l’outil de génération et n’est pas partie au contrat.</div>
    </section>
    <section class="card"><h2>Aperçu</h2><div class="preview" id="previewBox">—</div></section>
  </div>
</div>
<nav class="bottom-nav"><a href="planning.html">Planning</a><a href="prestations.html">Production</a><a href="logements.html">Logements</a><a href="import-ical.html">iCal</a><a href="messagerie.html">Messages</a></nav>
<script type="module">
import { auth, db } from './firebase-init.js';
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
import { doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

const $ = id => document.getElementById(id);
let currentUser = null, profile = {}, articles = [];
const DEFAULT_ARTICLES = [
  {title:'Objet des conditions générales',body:'Les présentes conditions générales définissent le cadre général applicable aux prestations de conciergerie réalisées pour le compte d’un propriétaire dans le cadre de la gestion opérationnelle d’un logement proposé à la location courte durée, saisonnière ou touristique.\n\nLe détail concret de la mission confiée à la conciergerie est déterminé par le contrat principal, les prestations sélectionnées, les conditions particulières, les devis, les factures, les annexes et les accords écrits entre les parties.'},
  {title:'Documents contractuels',body:'L’accord entre les parties est composé, par ordre de priorité :\n• du contrat de prestation signé ou accepté entre les parties ;\n• des conditions particulières propres au logement ou à la mission ;\n• des devis, factures, grilles tarifaires ou accords écrits acceptés ;\n• des annexes éventuelles : inventaire, photographies, état descriptif, grille tarifaire ou tout autre document annexé ;\n• des présentes conditions générales.'},
  {title:'Rôle de la conciergerie',body:'La conciergerie intervient comme prestataire de services. Elle ne se substitue pas au propriétaire dans ses obligations légales, fiscales, administratives, déclaratives, assurantielles ou réglementaires.\n\nLe propriétaire reste seul responsable de la conformité du logement, de son usage locatif, de ses déclarations administratives, de sa fiscalité, de ses autorisations, de ses assurances et du respect des règles applicables à la location du bien.'},
  {title:'Obligations du propriétaire',body:'Le propriétaire s’engage à fournir à la conciergerie toutes les informations nécessaires à la bonne exécution des prestations, notamment les accès au logement, les consignes, les informations voyageurs utiles, les règles particulières, les équipements disponibles, les coordonnées utiles et les contraintes propres au bien.\n\nIl garantit que le logement est conforme à sa destination, correctement assuré, sécurisé, entretenu, équipé et disponible pour les prestations confiées.'},
  {title:'Prestations incluses et complémentaires',body:'Seules les prestations sélectionnées dans le contrat, prévues dans les conditions particulières, validées par devis, facture ou accord écrit sont incluses dans la mission confiée à la conciergerie.\n\nToute prestation non prévue initialement, notamment entretien piscine, entretien jardin, gestion spa, arrosage, dépannage, achat exceptionnel, déplacement supplémentaire ou intervention urgente, pourra faire l’objet d’une facturation complémentaire.'},
  {title:'Annonces, plateformes et co-hôte',body:'Lorsque la gestion des annonces ou une mission de co-hôte est prévue, l’étendue exacte de la mission doit être précisée entre les parties. Elle peut concerner Airbnb, Booking ou toute autre plateforme de location, canal de réservation ou support de commercialisation utilisé pour le logement.\n\nLa mission peut comprendre la mise à jour de l’annonce, les échanges voyageurs, le suivi du calendrier, la transmission d’informations, l’assistance opérationnelle ou d’autres tâches validées par écrit.\n\nSauf accord exprès, la conciergerie ne garantit ni le taux d’occupation, ni le chiffre d’affaires, ni le classement de l’annonce, ni le comportement des plateformes ou supports utilisés.'},
  {title:'Conditions financières et paiement',body:'Les modalités financières et de paiement sont librement convenues entre les parties. Elles peuvent prendre la forme d’une facturation à la prestation, d’un forfait mensuel, d’une commission, d’un forfait mixte ou de modalités libres précisées au contrat, au devis, à la facture ou par accord écrit.\n\nLes modalités de paiement applicables sont précisées sur chaque devis, facture ou accord écrit, notamment l’échéance, le mode de règlement accepté et les éventuelles conditions particulières. À défaut de précision contraire, les factures sont payables à réception. En cas de retard, la conciergerie pourra suspendre tout ou partie des prestations après relance restée sans effet, sans préjudice des sommes dues.'},
  {title:'Consommables',body:'Les consommables nécessaires à l’accueil des voyageurs ou au bon déroulement des séjours peuvent être avancés par la conciergerie et refacturés au propriétaire selon les justificatifs, forfaits ou modalités convenus entre les parties.\n\nIls peuvent notamment comprendre les produits d’accueil, produits d’entretien, papier toilette, savon, café, thé, capsules, sacs-poubelle, éponges ou tout autre élément utile à l’exploitation du logement.'},
  {title:'Clés, badges, accès, inventaire et caution',body:'Le propriétaire remet à la conciergerie les moyens d’accès nécessaires à l’exécution des prestations. La conciergerie s’engage à les conserver avec diligence et à les restituer à la fin du contrat.\n\nLe propriétaire reste responsable de l’état général du logement, de son mobilier, de ses équipements et de leur conformité. Un inventaire, des photographies ou un état descriptif peuvent être établis séparément et annexés au contrat.\n\nLa caution peut être gérée par la plateforme, par le propriétaire, par la conciergerie ou ne pas être prévue, selon le choix indiqué dans le contrat.'},
  {title:'Dégradations, pertes et incidents',body:'La conciergerie informe le propriétaire de toute dégradation, anomalie, perte ou incident constaté lors de ses prestations. La prise en charge financière des réparations, remplacements ou indemnisations relève du propriétaire, sauf faute prouvée directement imputable à la conciergerie.\n\nLes dégradations causées par les voyageurs, voisins, tiers, animaux, intempéries, défauts d’entretien, vétusté, malfaçons ou sinistres ne peuvent être imputées à la conciergerie sans preuve d’une faute directe de sa part.'},
  {title:'Artisans et prestataires extérieurs',body:'La conciergerie peut coordonner les interventions d’artisans ou de prestataires extérieurs mandatés ou validés par le propriétaire. Elle n’est pas responsable de la qualité, des délais, des prix ou des conséquences des travaux réalisés par ces tiers, sauf faute prouvée dans sa mission de coordination.\n\nLes devis, factures et règlements des tiers restent à la charge du propriétaire, sauf accord écrit contraire.'},
  {title:'Assurance et responsabilité',body:'Le propriétaire déclare disposer d’une assurance adaptée au logement et à son activité de location. La conciergerie déclare disposer d’une assurance responsabilité civile professionnelle adaptée à son activité.\n\nLa responsabilité de la conciergerie est limitée aux dommages directs résultant d’une faute prouvée dans l’exécution de ses prestations. Elle ne pourra être tenue responsable des pertes d’exploitation, annulations, mauvais avis voyageurs, décisions des plateformes, comportements de tiers ou manquements relevant du propriétaire.'},
  {title:'Force majeure et impossibilité temporaire',body:'La responsabilité de la conciergerie ne pourra être engagée en cas d’événement extérieur, imprévisible ou irrésistible empêchant l’exécution normale des prestations, notamment catastrophe naturelle, intempérie importante, grève, coupure d’électricité, coupure internet, panne de plateforme, restriction administrative, accident, maladie, blocage d’accès ou tout événement indépendant de sa volonté.\n\nLes parties rechercheront, lorsque cela est possible, une solution adaptée à la situation.'},
  {title:'Données personnelles et confidentialité',body:'Les données personnelles communiquées par le propriétaire sont utilisées uniquement pour la gestion du contrat, l’exécution des prestations, la facturation et les échanges nécessaires entre les parties.\n\nChaque partie s’engage à ne pas utiliser les données communiquées pour une finalité étrangère à la relation contractuelle et à conserver confidentielles les informations non publiques obtenues dans le cadre du contrat.'},
  {title:'Durée, résiliation et modification',body:'Le contrat peut être conclu pour une durée déterminée ou indéterminée. Sauf stipulation contraire, chaque partie peut y mettre fin avec un préavis de 30 jours.\n\nEn cas de faute grave, d’impayé persistant, de comportement abusif, de mise en danger, d’impossibilité d’exécution ou de manquement important, la partie lésée pourra mettre fin au contrat dans les conditions prévues au contrat ou par le droit commun. Les prestations réalisées avant la date effective de fin de contrat restent dues.\n\nToute modification du contrat, des prestations, des tarifs ou des conditions particulières devra être acceptée par écrit par les deux parties.'},
  {title:'Litiges et acceptation',body:'Les parties rechercheront en priorité une solution amiable à tout différend relatif à l’interprétation ou à l’exécution du contrat. À défaut d’accord amiable, les juridictions territorialement compétentes seront saisies conformément aux règles de droit commun.\n\nL’acceptation du contrat principal emporte acceptation des présentes conditions générales lorsqu’elles sont mentionnées comme document associé, annexées au contrat, transmises au propriétaire ou mises à disposition par la conciergerie.'}
];
function esc(s){return String(s||'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');}
function nl2br(s){return esc(s).replaceAll('\n','<br>');}
function show(m,ok=false){$('alertBox').style.display='block';$('alertBox').classList.toggle('ok',ok);$('alertBox').textContent=m;}
function hide(){$('alertBox').style.display='none';$('alertBox').classList.remove('ok');$('alertBox').textContent='';}
function cloneDefaults(){return DEFAULT_ARTICLES.map(a=>({...a}));}
function renderArticles(){
  $('articlesBox').innerHTML = articles.map((a,i)=>`<div class="article" data-index="${i}"><div class="articleHead"><strong>Article ${i+1}</strong><button class="btn smallBtn danger" type="button" data-remove="${i}">Supprimer</button></div><label>Titre</label><input data-title="${i}" value="${esc(a.title)}"><label>Texte</label><textarea data-body="${i}">${esc(a.body)}</textarea></div>`).join('');
  document.querySelectorAll('[data-title]').forEach(el=>el.addEventListener('input',()=>{articles[Number(el.dataset.title)].title=el.value;renderPreview();}));
  document.querySelectorAll('[data-body]').forEach(el=>el.addEventListener('input',()=>{articles[Number(el.dataset.body)].body=el.value;renderPreview();}));
  document.querySelectorAll('[data-remove]').forEach(el=>el.addEventListener('click',()=>{articles.splice(Number(el.dataset.remove),1);renderArticles();renderPreview();}));
}
function payload(){
  const bp=profile.businessProfile||{};
  return {companyName:String(bp.companyName||'Conciergerie'),version:$('version').value.trim()||'1.0',versionDate:$('versionDate').value||'2026-07-01',title:$('title').value.trim(),subtitle:$('subtitle').value.trim(),priorityNote:$('priorityNote').value.trim(),articles:articles.map(a=>({title:String(a.title||'').trim(),body:String(a.body||'').trim()})).filter(a=>a.title||a.body),updatedAt:serverTimestamp(),updatedBy:currentUser.uid,active:true};
}
function renderPreview(){
  const d=payload();
  $('previewBox').innerHTML=`<div><strong>${esc(d.companyName)}</strong><br><span style="color:#666">Version ${esc(d.version)} — Applicable au ${esc(d.versionDate)}</span></div><h1>${esc(d.title)}</h1><p>${nl2br(d.subtitle)}</p><div class="note">${nl2br(d.priorityNote)}</div>${d.articles.map((a,i)=>`<h2>${i+1}. ${esc(a.title)}</h2><p>${nl2br(a.body)}</p>`).join('')}<div class="note">Ces conditions générales sont éditées et validées par la conciergerie sous sa seule responsabilité. CleanUp Manager intervient uniquement comme outil de génération et de mise en forme.</div>`;
}
async function loadProfile(uid){const s=await getDoc(doc(db,'users',uid));profile=s.exists()?s.data():{};const bp=profile.businessProfile||{};$('companyLine').textContent=bp.companyName||'Conciergerie';}
async function loadCG(uid){const s=await getDoc(doc(db,'generalTerms',uid));if(s.exists()){const d=s.data()||{};$('version').value=d.version||'1.0';$('versionDate').value=d.versionDate||'2026-07-01';$('title').value=d.title||$('title').value;$('subtitle').value=d.subtitle||$('subtitle').value;$('priorityNote').value=d.priorityNote||$('priorityNote').value;articles=Array.isArray(d.articles)&&d.articles.length?d.articles.map(a=>({title:a.title||'',body:a.body||''})):cloneDefaults();}else articles=cloneDefaults();renderArticles();renderPreview();}
async function save(){hide();try{await setDoc(doc(db,'generalTerms',currentUser.uid),payload(),{merge:true});show('✅ Conditions générales enregistrées.',true);}catch(e){console.error(e);show('⛔ '+(e?.message||'Erreur enregistrement'));}}
['version','versionDate','title','subtitle','priorityNote'].forEach(id=>$(id).addEventListener('input',renderPreview));
$('addArticleBtn').onclick=()=>{articles.push({title:'Nouvel article',body:''});renderArticles();renderPreview();};
$('resetBtn').onclick=()=>{if(confirm('Réinitialiser avec le modèle standard ?')){articles=cloneDefaults();renderArticles();renderPreview();}};
$('saveBtn').onclick=save;
onAuthStateChanged(auth,async user=>{if(!user){location.href='login.html?role=conciergerie';return;}currentUser=user;try{await loadProfile(user.uid);await loadCG(user.uid);}catch(e){console.error(e);show('⛔ '+(e?.message||'Erreur chargement'));}});
</script>
</body>
</html>
