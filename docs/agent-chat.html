<!-- docs/agent-chat.html (FINAL — Agent chat + photos via Firebase Auth email-link ; login redirect -> agent-login.html ; photos: [] array ; rules-friendly) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Chat Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; padding-bottom:36px; }

    .topbar{
      width:100%; max-width:980px; display:flex; justify-content:space-between; align-items:center;
      gap:10px; position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
    }

    .wrap{ width:100%; max-width:980px; margin-top:6px; display:flex; flex-direction:column; gap:10px; }
    h1{ margin:0; font-size:20px; font-weight:900; letter-spacing:-0.2px; }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; white-space:pre-wrap; }

    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:12px;
    }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }

    .headerBox{
      background:#fff; border:1px solid rgba(122,92,255,0.18); border-radius:16px;
      padding:10px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      display:flex; flex-direction:column; gap:6px;
    }
    .titleLine{ font-size:14px; font-weight:900; color:#222; }
    .kv{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .kv .k{ font-weight:900; font-size:12px; color:#333; }
    .kv .v{ font-weight:800; font-size:12px; color:#444; text-align:right; white-space:pre-wrap; }

    .msgs{
      display:flex; flex-direction:column; gap:10px;
      max-height:56vh; overflow:auto; padding-right:6px;
    }
    .msg{
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-radius:16px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px;
      display:flex; flex-direction:column; gap:8px;
    }
    .msg.me{
      border-color: rgba(122,92,255,0.25);
      background: linear-gradient(180deg,#ffffff 0%, rgba(122,92,255,0.06) 100%);
    }
    .msgTop{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .msgWho{ font-size:12px; font-weight:900; color:#222; }
    .msgWhen{ font-size:11px; font-weight:900; color:var(--muted); }
    .msgText{ font-size:13px; font-weight:800; color:#222; white-space:pre-wrap; line-height:1.3; }

    .photosGrid{
      display:grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap:8px;
    }
    .ph{
      width:100%;
      border-radius:12px;
      border:1px solid rgba(0,0,0,0.08);
      background:#fafafa;
      overflow:hidden;
      aspect-ratio: 1 / 1;
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .ph img{ width:100%; height:100%; object-fit:cover; display:block; }

    textarea{
      width:100%; padding:10px; border-radius:12px; border:1px solid #D3C7FF; background:#fff;
      font-size:13px; outline:none; resize:vertical;
    }
    textarea:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .composer{ display:flex; flex-direction:column; gap:10px; }
    .row{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .btn{
      border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:900; cursor:pointer;
      color:#fff; background:linear-gradient(90deg,var(--violet),var(--violet2));
      box-shadow:0 10px 22px rgba(0,0,0,0.10); white-space:nowrap;
      text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    }
    .btn.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    input[type="file"]{ display:block; width:100%; }
    .prog{
      display:none;
      padding:10px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      color:#444;
      white-space:pre-wrap;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <span class="pill" id="who">Agent (chat)</span>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="pill" id="refreshBtn" type="button">Rafraîchir</button>
      </div>
    </div>

    <div class="wrap">
      <div>
        <h1>Chat agent</h1>
        <div class="sub" id="subLine">Chargement…</div>
        <div class="alert" id="alertBox"></div>
      </div>

      <section class="card">
        <div class="mini">Contexte</div>
        <div class="headerBox">
          <div class="titleLine" id="ctxTitle">—</div>
          <div class="kv"><div class="k">Prestation</div><div class="v" id="ctxPresta">—</div></div>
          <div class="kv"><div class="k">Agent</div><div class="v" id="ctxAgent">—</div></div>
        </div>
      </section>

      <section class="card">
        <div class="mini">Messages</div>
        <div class="msgs" id="msgs"></div>
      </section>

      <section class="card">
        <div class="mini">Envoyer</div>
        <div class="composer">
          <textarea id="text" rows="2" placeholder="Votre message…"></textarea>

          <div class="mini">Photos (optionnel)</div>
          <input id="files" type="file" accept="image/*" multiple />

          <div class="row">
            <button class="btn ghost" id="clearBtn" type="button">Vider</button>
            <button class="btn" id="sendBtn" type="button">Envoyer</button>
          </div>

          <div class="prog" id="prog"></div>
          <div class="mini">Astuce : si tu ajoutes des photos, elles seront envoyées avec le message.</div>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { auth, db, storage } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, updateDoc,
      collection, query, orderBy, limit, getDocs,
      addDoc, serverTimestamp, increment
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

    const alertBox = document.getElementById("alertBox");
    const subLine  = document.getElementById("subLine");
    const msgsEl   = document.getElementById("msgs");
    const refreshBtn = document.getElementById("refreshBtn");

    const ctxTitle = document.getElementById("ctxTitle");
    const ctxPresta = document.getElementById("ctxPresta");
    const ctxAgent = document.getElementById("ctxAgent");

    const textEl = document.getElementById("text");
    const filesEl = document.getElementById("files");
    const clearBtn = document.getElementById("clearBtn");
    const sendBtn = document.getElementById("sendBtn");
    const prog = document.getElementById("prog");

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function showProg(msg){
      prog.style.display = "block";
      prog.textContent = msg;
    }
    function hideProg(){
      prog.style.display = "none";
      prog.textContent = "";
    }
    function fmtTs(ts){
      try{
        const ms = ts?.toMillis ? ts.toMillis() : null;
        if(!ms) return "—";
        const d = new Date(ms);
        const p2 = (n)=> String(n).padStart(2,"0");
        return `${p2(d.getDate())}/${p2(d.getMonth()+1)} ${p2(d.getHours())}:${p2(d.getMinutes())}`;
      }catch{ return "—"; }
    }

    const threadId = qs("threadId");
    let currentUser = null;
    let threadDoc = null;

    // baseDir GitHub pages (/cleanup-manager/)
    const baseDir = location.origin + location.pathname.replace(/\/[^\/]*$/, "/");

    async function loadThread(){
      hideAlert();
      subLine.textContent = "Chargement…";

      if(!threadId){
        subLine.textContent = "";
        showAlert("threadId manquant (URL).");
        return false;
      }
      if(!currentUser){
        subLine.textContent = "";
        showAlert("Utilisateur non authentifié.");
        return false;
      }

      const tRef = doc(db, "agentThreads", threadId);
      const tSnap = await getDoc(tRef);
      if(!tSnap.exists()){
        subLine.textContent = "";
        showAlert("Thread introuvable.");
        return false;
      }
      threadDoc = { id: tSnap.id, ...(tSnap.data()||{}) };

      // UI check : email doit matcher agentEmailLower (ou agentUid)
      const myEmail = String(currentUser.email || "").trim().toLowerCase();
      const expected = String(threadDoc.agentEmailLower || "").trim().toLowerCase();
      const ok = (threadDoc.agentUid && String(threadDoc.agentUid) === String(currentUser.uid))
        || (!!expected && myEmail === expected);

      if(!ok){
        subLine.textContent = "";
        showAlert("Accès refusé : cet email n’est pas l’agent de ce thread.");
        return false;
      }

      // backfill agentUid si vide
      if(!threadDoc.agentUid){
        await updateDoc(tRef, { agentUid: currentUser.uid, updatedAt: serverTimestamp() });
        threadDoc.agentUid = currentUser.uid;
      }

      ctxTitle.textContent = threadDoc.homeName ? `Logement : ${threadDoc.homeName}` : "Chat mission";
      ctxPresta.textContent = threadDoc.prestationId || "—";
      ctxAgent.textContent = (threadDoc.agentEmailLower || currentUser.email || "—");

      subLine.textContent = "";
      return true;
    }

    async function loadMessages(){
      msgsEl.innerHTML = "";
      if(!threadDoc) return;

      const q = query(
        collection(db, "agentThreads", threadId, "messages"),
        orderBy("createdAt", "desc"),
        limit(60)
      );
      const snap = await getDocs(q);
      const items = snap.docs.map(d => ({ id:d.id, ...(d.data()||{}) })).reverse();

      if(!items.length){
        msgsEl.innerHTML = `<div class="mini" style="padding:8px 0;">Aucun message.</div>`;
        return;
      }

      for(const m of items){
        const mine = String(m.senderUid||"") === String(currentUser.uid||"");
        const div = document.createElement("div");
        div.className = "msg" + (mine ? " me" : "");

        const who = (m.senderRole === "AGENT") ? "Agent" : "Conciergerie";
        const when = fmtTs(m.createdAt);

        const hasText = typeof m.text === "string" && m.text.trim().length;
        const photos = Array.isArray(m.photos) ? m.photos.filter(x => x && x.url) : [];

        div.innerHTML = `
          <div class="msgTop">
            <div class="msgWho">${esc(who)}</div>
            <div class="msgWhen">${esc(when)}</div>
          </div>
          ${hasText ? `<div class="msgText">${esc(m.text)}</div>` : ``}
          ${photos.length ? `
            <div class="photosGrid">
              ${photos.map(p => `
                <a class="ph" href="${esc(p.url)}" target="_blank" rel="noopener">
                  <img src="${esc(p.url)}" alt="">
                </a>
              `).join("")}
            </div>
          ` : ``}
        `;
        msgsEl.appendChild(div);
      }

      msgsEl.scrollTop = msgsEl.scrollHeight;
    }

    async function uploadOnePhoto(file, messageId){
      const safeName = String(file.name || "photo.jpg").replace(/[^\w.\-]+/g,"_").slice(0,80);
      const now = Date.now();
      const path = `agentThreads/${threadId}/${messageId}/${now}_${safeName}`;
      const r = sRef(storage, path);
      const meta = { contentType: file.type || "image/jpeg" };
      await uploadBytes(r, file, meta);
      const url = await getDownloadURL(r);

      return { url, path, name: safeName, sizeBytes: Number(file.size || 0), createdAtMs: now };
    }

    async function send(){
      hideAlert();
      hideProg();

      if(!threadDoc) return showAlert("Thread non chargé.");
      if(threadDoc.status && String(threadDoc.status).toUpperCase() === "CLOSED"){
        return showAlert("Thread fermé.");
      }

      const text = String(textEl.value || "").trim();
      const files = Array.from(filesEl.files || []).filter(f => f && f.size > 0);

      if(!text && !files.length) return showAlert("Message vide.");

      sendBtn.disabled = true;
      clearBtn.disabled = true;
      refreshBtn.disabled = true;

      try{
        showProg("Création du message…");

        // IMPORTANT rules: createdAt = timestamp, text string (non vide) pour kind=text
        // Ici: si pas de texte mais photos -> on met text="" pour rester compatible si tu imposes text string.
        // (Sinon, ajuste rules pour autoriser text null)
        const msgRef = await addDoc(collection(db,"agentThreads",threadId,"messages"),{
          senderUid: currentUser.uid,
          senderRole: "AGENT",
          kind: files.length ? "photos" : "text",
          text: (files.length ? (text || "") : text),  // string
          photos: [],                                 // ✅ array
          createdAt: serverTimestamp()
        });

        let uploaded = [];
        if(files.length){
          const max = 15;
          const batch = files.slice(0, max);

          showProg(`Upload ${batch.length} photo(s)…`);
          for(let i=0;i<batch.length;i++){
            showProg(`Upload ${i+1}/${batch.length}…`);
            const meta = await uploadOnePhoto(batch[i], msgRef.id);
            uploaded.push(meta);
          }

          await updateDoc(doc(db,"agentThreads",threadId,"messages",msgRef.id),{
            photos: uploaded,
            kind: "photos"
          });
        }

        const previewText =
          text ? text.slice(0, 180)
               : (uploaded.length ? `📷 ${uploaded.length} photo(s)` : "");

        await updateDoc(doc(db,"agentThreads",threadId),{
          lastMessageText: previewText || "",
          lastMessageAt: serverTimestamp(),
          updatedAt: serverTimestamp(),
          unreadForConciergerie: increment(1)
        });

        textEl.value = "";
        filesEl.value = "";
        hideProg();
        showAlert("✅ Envoyé.", true);

        await loadMessages();
      }catch(err){
        console.error(err);
        hideProg();
        showAlert("Erreur envoi : " + (err?.code || err?.message || "inconnue"));
      }finally{
        sendBtn.disabled = false;
        clearBtn.disabled = false;
        refreshBtn.disabled = false;
      }
    }

    clearBtn.addEventListener("click", ()=>{
      textEl.value = "";
      filesEl.value = "";
      hideAlert();
      hideProg();
    });

    sendBtn.addEventListener("click", ()=> send());

    refreshBtn.addEventListener("click", async ()=>{
      try{
        await loadMessages();
      }catch(err){
        console.error(err);
        showAlert("Erreur refresh : " + (err?.code || err?.message || "inconnue"));
      }
    });

    onAuthStateChanged(auth, async (u)=>{
      if(!u){
        // IMPORTANT: redirige vers agent-login avec threadId
        location.href = baseDir + "agent-login.html?threadId=" + encodeURIComponent(threadId || "");
        return;
      }
      currentUser = u;

      try{
        const ok = await loadThread();
        if(!ok) return;
        await loadMessages();
      }catch(err){
        console.error(err);
        showAlert("Erreur chargement : " + (err?.code || err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
