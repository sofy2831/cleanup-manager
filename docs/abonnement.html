<!-- docs/abonnement.html (CORRIGÉ — allowlist DEV bypass + Stripe normal, SANS entitlements) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Abonnement</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after{ box-sizing: border-box; }

    :root{
      --violet-light:#F3ECFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text-dark:#111;
      --grey:#666;
      --bad:#b3261e;

      --gold:#FFCC66;
      --gold2:#FFB648;
    }

    body{
      margin:0;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:linear-gradient(180deg,#F8F4FF 0%,#EDE6FF 80%);
      color:var(--text-dark);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }

    .pill-link{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
      cursor:pointer;
    }

    .logo-title{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      margin-top:10px;
      margin-bottom:6px;
      text-align:center;
    }
    .logo-icon{
      width:38px;height:38px;border-radius:50%;
      background:#fff;
      border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main);
      font-size:20px;font-weight:900;
      position:relative;
      flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-4px;
      font-size:12px;
      color:var(--violet-main);
    }
    h1{margin:0;font-size:24px;font-weight:900;color:#111;}
    .subtitle{
      font-size:15px;
      color:#444;
      margin-top:4px;
      text-align:center;
      max-width:900px;
      line-height:1.35;
    }

    .plan-grid{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }

    .plan-card{
      background:linear-gradient(180deg,#fff 0%,#EEE4FF 100%);
      border-radius:18px;
      box-shadow:0 6px 18px rgba(0,0,0,.10);
      padding:14px;
      border:2px solid transparent;
      position:relative;
      overflow:hidden;
    }
    .plan-card.active{
      border-color: rgba(122,92,255,.55);
    }

    .plan-card.recommended{
      border-color: rgba(122,92,255,.95);
      box-shadow:0 10px 28px rgba(98,56,255,.20);
      transform: translateY(-1px);
    }
    .ribbon{
      position:absolute;
      top:10px; right:10px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:6px 10px;
      border-radius:999px;
      background:linear-gradient(90deg,var(--gold),var(--gold2));
      color:#1b1200;
      font-weight:1000;
      font-size:12px;
      box-shadow:0 6px 16px rgba(0,0,0,.12);
      border:1px solid rgba(0,0,0,.06);
      user-select:none;
    }
    .ribbon .dot{
      width:8px;height:8px;border-radius:50%;
      background:#1b1200;
      opacity:.85;
    }

    .plan-card .row{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:10px;
    }

    .plan-card .name{
      font-weight:900;
      font-size:16px;
      margin:0;
    }

    .plan-card .range{
      margin:4px 0 0;
      font-size:12px;
      color:#555;
      font-weight:800;
    }

    .plan-card .p{
      font-weight:900;
      font-size:22px;
      margin:0;
      line-height:1.1;
      white-space:nowrap;
      text-align:right;
    }

    .plan-card .p small{
      font-size:12px;
      color:#555;
      font-weight:900;
    }

    .plan-card .mini{
      margin:10px 0 10px;
      font-size:12px;
      color:#444;
      line-height:1.35;
    }

    .plan-card .choose{
      display:block;
      width:100%;
      text-align:center;
      text-decoration:none;
      font-weight:900;
      padding:10px 14px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
    }
    .plan-card .choose:hover{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
    }

    .card{
      width:100%;
      max-width:720px;
      margin-top:14px;
      background:linear-gradient(180deg,#fff 0%,#EEE4FF 100%);
      border-radius:18px;
      box-shadow:0 6px 18px rgba(0,0,0,.10);
      padding:16px 14px 18px;
    }

    .plan-badge{
      display:inline-flex;
      gap:8px;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(122,92,255,.25);
      font-weight:900;
      color:#5b45c8;
      font-size:12px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .plan-badge.recommended{
      border-color: rgba(255,182,72,.9);
      color:#4d2f00;
      background:linear-gradient(90deg,#fff7e3,#ffe0a9);
    }

    .plan-title{
      margin:10px 0 2px;
      font-size:18px;
      font-weight:900;
      color:#111;
    }
    .price{
      font-size:34px;
      font-weight:900;
      color:#111;
      margin:6px 0;
      line-height:1;
    }
    .price small{ font-size:14px; color:#555; font-weight:900; }

    .small{
      font-size:11px;
      color:var(--grey);
      line-height:1.35;
      margin-top:10px;
    }

    .features{
      margin:10px 0 0;
      padding-left:16px;
      color:#444;
      font-size:13px;
      line-height:1.35;
    }
    .features li{ margin:6px 0; }

    .cta-btn{
      border:none;
      border-radius:999px;
      padding:10px 14px;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      box-shadow:0 4px 12px rgba(0,0,0,.18);
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      width:100%;
      text-decoration:none;
      text-align:center;
      display:inline-block;
    }

    .cta-btn.secondary{
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.08);
    }
    .cta-btn.secondary:hover{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
    }

    .cta.stack{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .msg{
      margin-top:10px;
      font-size:12px;
      font-weight:900;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border-left:5px solid var(--bad);
      color:#7a1d16;
      display:none;
      white-space:pre-wrap;
    }

    @media (min-width:700px){
      .plan-grid{ grid-template-columns: repeat(2, 1fr); }
    }

    .plan-card .row{ position:relative; }

    @media (max-width:699px){
      .plan-card.recommended .ribbon{ display:none; }

      .plan-card.recommended .name::after{
        content:"RECOMMANDÉ";
        display:inline-flex;
        align-items:center;
        margin-left:8px;
        padding:3px 8px;
        border-radius:999px;
        font-size:11px;
        font-weight:1000;
        background:linear-gradient(90deg,var(--gold),var(--gold2));
        color:#1b1200;
        border:1px solid rgba(0,0,0,.06);
        box-shadow:0 3px 10px rgba(0,0,0,.08);
        vertical-align:middle;
        white-space:nowrap;
      }

      .plan-card .p{ font-size:20px; }
    }

    @media (min-width:700px){
      .plan-card.recommended{ padding-top:54px; }
      .plan-card.recommended .ribbon{ top:14px; right:14px; }
    }
  </style>
</head>

<body>
  <div class="page" id="top">

    <div class="topbar">
      <a class="pill-link" href="index.html">← Accueil</a>
    </div>

    <div class="logo-title">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>

    <div class="subtitle">
      Choisis ton abonnement conciergerie. Paiement sécurisé via Stripe (sauf plan Enterprise).
    </div>

    <div class="plan-grid" id="planGrid"></div>

    <div class="card">
      <div class="plan-badge" id="planBadge">Abonnement</div>

      <div class="plan-title" id="planName">—</div>
      <div class="price" id="planPrice">— <small>/ mois</small></div>
      <div class="small" id="planDesc">—</div>

      <ul class="features" id="planFeatures"></ul>

      <div class="cta stack" id="ctaStack">
        <a class="cta-btn" id="payNowLink" href="#">Payer en ligne</a>
      </div>

      <div class="msg" id="msgBox"></div>

      <div class="small">
        Propriétaires : accès gratuit. Zéro commission. Paiement uniquement des prestations/kits.
      </div>
    </div>

  </div>

  <script type="module">
    // ===========
    // Stripe / Functions
    // ===========
    const FUNCTIONS_BASE = "https://europe-west1-cleanup-manager-d9301.cloudfunctions.net/api";

    const PRICE_STARTER  = "price_1T4ffoAMMazMXNc1WTPLqxoX";
    const PRICE_PRO      = "price_1T4fitAMMazMXNc1wEVBRHWC";
    const PRICE_BUSINESS = "price_1T4fjXAMMazMXNc18OuwIaxh";

    const ENTERPRISE_CONTACT_HREF =
      "mailto:contact@cleanup-manager.fr?subject=CleanUp%20Manager%20-%20Demande%20Enterprise&body=Bonjour,%0D%0A%0D%0AJe souhaite une offre Enterprise (41+ logements).%0D%0A%0D%0ANom%20:%0D%0AConciergerie%20:%0D%0AVille%20:%0D%0ANombre%20de%20logements%20:%0D%0A%0D%0AMerci.";

    // ===========
    // Allowlist DEV (accès libre)
    // ===========
    const DEV_ALLOWLIST = [
      "s.dumas974@gmail.com",
      "mathildeconciergerie45@gmail.com"
    ];

    // ===========
    // Plans
    // ===========
    const PLANS = {
      free: {
        key: "free",
        name: "Gratuit",
        range: "0–2 logements",
        price: 0,
        desc: "Pour tester CleanUp (jusqu’à 2 logements).",
        features: [
          "Planning • Logements • Prestations",
          "Accès conciergerie (MVP)",
          "Idéal pour démarrer sans risque"
        ],
        isFree: true,
        recommended: false,
        maxHomes: 2
      },

      starter: {
        key: "starter",
        name: "Starter",
        range: "3–5 logements",
        price: 49.90,
        desc: "Pour démarrer et structurer votre conciergerie.",
        features: [
          "Planning • Logements • Prestations",
          "Paiements + relances (V1)",
          "Messagerie (V1) • Boutique • Import iCal",
          "Historique + export comptable (CSV/PDF)"
        ],
        priceId: PRICE_STARTER,
        recommended: false,
        maxHomes: 5
      },

      pro: {
        key: "pro",
        name: "Pro",
        range: "6–15 logements",
        price: 119.90,
        desc: "Le meilleur équilibre : croissance + organisation + rentabilité.",
        features: [
          "Tout Starter",
          "Priorité évolutions produit (selon roadmap)",
          "Conçu pour une conciergerie active"
        ],
        priceId: PRICE_PRO,
        recommended: true,
        maxHomes: 15
      },

      business: {
        key: "business",
        name: "Business",
        range: "16–40 logements",
        price: 299.90,
        desc: "Pour une conciergerie structurée avec un vrai volume.",
        features: [
          "Tout Pro",
          "Optimisé multi-logements",
          "Support renforcé (à venir)"
        ],
        priceId: PRICE_BUSINESS,
        recommended: false,
        maxHomes: 40
      },

      enterprise: {
        key: "enterprise",
        name: "Enterprise",
        range: "41+ logements",
        price: null,
        desc: "Tarif sur devis (selon volume, équipes et besoins).",
        features: [
          "Contrat adapté au volume",
          "Accompagnement déploiement (si besoin)",
          "Conditions & support dédiés"
        ],
        isEnterprise: true,
        recommended: false,
        maxHomes: 9999
      }
    };

    function $(id){ return document.getElementById(id); }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function formatPrice(n){
      const v = Number(n || 0);
      return v.toFixed(2).replace(".", ",") + " €";
    }
    function formatPlanPrice(plan){
      if(plan.isEnterprise) return "Sur devis";
      if(plan.isFree) return "0,00 €";
      return formatPrice(plan.price);
    }

    function showMsg(text){
      const box = $("msgBox");
      box.style.display = "block";
      box.textContent = text;
    }
    function clearMsg(){
      const box = $("msgBox");
      box.style.display = "none";
      box.textContent = "";
    }
    function disableCta(disabled){
      const stack = $("ctaStack");
      stack.style.opacity = disabled ? "0.75" : "1";
      stack.style.pointerEvents = disabled ? "none" : "auto";
    }

    // ===========
    // Firebase
    // ===========
    import { auth, db, authReady } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    function normEmail(s){ return (s || "").trim().toLowerCase(); }
    function isDevAllowlisted(emailLower){
      return !!emailLower && DEV_ALLOWLIST.includes(emailLower);
    }

    async function waitForUser(){
      await authReady;
      const current = auth.currentUser;
      if(current) return current;
      return new Promise((resolve)=>{
        const unsub = onAuthStateChanged(auth, (u)=>{
          unsub();
          resolve(u || null);
        });
      });
    }

    async function requireLoginOrRedirect(planKey){
      const user = await waitForUser();
      if(user) return user;

      const qs = new URLSearchParams();
      qs.set("next", "abonnement");
      qs.set("plan", planKey);
      location.href = "login.html?" + qs.toString();
      return null;
    }

    // ===========
    // DEV activation (bypass Stripe) -> écrit uniquement dans users/{uid}
    // ===========
    async function activatePlanDev(planKey){
      disableCta(true);
      clearMsg();

      const plan = PLANS[planKey];
      if(!plan){
        showMsg("Plan introuvable.");
        disableCta(false);
        return;
      }

      const user = await requireLoginOrRedirect(planKey);
      if(!user) return;

      const emailLower = normEmail(user.email || "");
      if(!isDevAllowlisted(emailLower)){
        showMsg("⛔ Accès DEV refusé (email non allowlist).");
        disableCta(false);
        return;
      }

      try{
        // users/{uid} : source de vérité simple (sans entitlements)
        await setDoc(doc(db, "users", user.uid), {
          uid: user.uid,
          email: user.email || "",
          emailLower,
          role: "conciergerie",

          // abonnement
          plan: plan.key,
          subscriptionStatus: "active",
          subscriptionSource: "DEV_BYPASS",
          maxHomes: Number(plan.maxHomes || 2),

          updatedAt: serverTimestamp(),
          subscribedAt: serverTimestamp()
        }, { merge: true });

        showMsg("✅ Plan activé (DEV). Redirection…");
        setTimeout(()=> location.href = "conciergerie.html", 350);

      }catch(err){
        console.error(err);
        showMsg("Erreur activation DEV : " + (err?.message || "inconnue"));
        disableCta(false);
      }
    }

    // ===========
    // Stripe checkout normal
    // ===========
    async function startCheckout(planKey){
      disableCta(true);
      clearMsg();

      const plan = PLANS[planKey];
      if(!plan || !plan.priceId || !String(plan.priceId).startsWith("price_")){
        showMsg("Stripe : priceId manquant/incorrect pour ce plan.");
        disableCta(false);
        return;
      }

      const user = await requireLoginOrRedirect(planKey);
      if(!user) return;

      const uid = user.uid;
      const email = user.email || "";
      const emailLower = normEmail(email);

      // DEV allowlist -> pas de paiement
      if(isDevAllowlisted(emailLower)){
        await activatePlanDev(planKey);
        return;
      }

      try{
        const res = await fetch(FUNCTIONS_BASE + "/create-checkout-session", {
          method: "POST",
          headers: { "Content-Type":"application/json" },
          body: JSON.stringify({
            uid,
            email,
            role: "conciergerie",
            plan: plan.key,
            priceId: plan.priceId
          })
        });

        const data = await res.json();
        if(!res.ok || !data.url){
          console.error(data);
          showMsg("Erreur création paiement : " + (data.error || "inconnue"));
          disableCta(false);
          return;
        }

        location.href = data.url;

      }catch(err){
        console.error(err);
        showMsg("Erreur réseau : " + (err?.message || err));
        disableCta(false);
      }
    }

    // ===========
    // UI render
    // ===========
    async function renderCtas(plan){
      const stack = $("ctaStack");
      stack.innerHTML = "";
      clearMsg();

      const selectedKey = plan.key;

      // Gratuit -> profil d’abord
      if(plan.isFree){
        const a = document.createElement("a");
        a.className = "cta-btn secondary";
        a.href = "#";
        a.textContent = "Activer Gratuit";
        a.addEventListener("click", async (e)=>{
          e.preventDefault();

          const user = await requireLoginOrRedirect(selectedKey);
          if(!user) return;

          const qs = new URLSearchParams();
          qs.set("next", "abonnement");
          qs.set("plan", "free");
          location.href = "profil-conciergerie.html?" + qs.toString();
        });
        stack.appendChild(a);

        const note = document.createElement("div");
        note.className = "small";
        note.textContent = "Aucun paiement. Tu peux passer à un plan payant quand tu dépasses 2 logements.";
        stack.appendChild(note);
        return;
      }

      // Enterprise
      if(plan.isEnterprise){
        const a = document.createElement("a");
        a.className = "cta-btn";
        a.href = ENTERPRISE_CONTACT_HREF;
        a.textContent = "Nous contacter (devis)";
        stack.appendChild(a);
        return;
      }

      // Si connecté + allowlist -> CTA DEV
      const user = await waitForUser();
      const emailLower = normEmail(user?.email || "");
      const dev = isDevAllowlisted(emailLower);

      if(dev){
        const a = document.createElement("a");
        a.className = "cta-btn";
        a.href = "#";
        a.textContent = "Activer (DEV)";
        a.addEventListener("click", async (e)=>{
          e.preventDefault();
          await activatePlanDev(plan.key);
        });
        stack.appendChild(a);

        const note = document.createElement("div");
        note.className = "small";
        note.textContent = "Mode DEV : accès libre (sans Stripe).";
        stack.appendChild(note);
        return;
      }

      // Payant Stripe
      const pay = document.createElement("a");
      pay.className = "cta-btn";
      pay.href = "#";
      pay.textContent = "Payer en ligne";
      pay.addEventListener("click", async (e)=>{
        e.preventDefault();
        await startCheckout(plan.key);
      });
      stack.appendChild(pay);
    }

    function renderAll(){
      const selectedKey = (getParam("plan") || "pro").toLowerCase();
      const plan = PLANS[selectedKey] || PLANS.pro;

      // grid
      const order = ["free","starter","pro","business","enterprise"];
      const grid = $("planGrid");

      grid.innerHTML = order.map(k => {
        const p = PLANS[k];
        const active = p.key === plan.key ? "active" : "";
        const rec = p.recommended ? "recommended" : "";
        const ribbon = p.recommended ? `<div class="ribbon"><span class="dot"></span>RECOMMANDÉ</div>` : "";
        const priceLabel = p.isEnterprise ? "Sur devis" : formatPlanPrice(p);

        return `
          <div class="plan-card ${active} ${rec}">
            ${ribbon}
            <div class="row">
              <div>
                <p class="name">${p.name}</p>
                <p class="range">${p.range}</p>
              </div>
              <div class="p">${priceLabel} ${p.isEnterprise ? "" : "<small>/ mois</small>"}</div>
            </div>
            <p class="mini">${p.desc}</p>
            <a class="choose" href="abonnement.html?plan=${p.key}">Choisir</a>
          </div>
        `;
      }).join("");

      // details
      const badge = $("planBadge");
      badge.textContent = plan.recommended ? "Abonnement • RECOMMANDÉ" : ("Abonnement • " + plan.name);
      badge.classList.toggle("recommended", !!plan.recommended);

      $("planName").textContent = plan.name;

      const priceEl = $("planPrice");
      if(plan.isEnterprise){
        priceEl.innerHTML = `Sur devis <small></small>`;
      }else{
        priceEl.innerHTML = `${formatPlanPrice(plan)} <small>/ mois</small>`;
      }

      $("planDesc").textContent = plan.desc;
      $("planFeatures").innerHTML = plan.features.map(x => `<li>${x}</li>`).join("");

      renderCtas(plan).catch(()=>{});
    }

    renderAll();
  </script>
</body>
</html>
