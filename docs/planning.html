<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Planning</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    *,*::before,*::after{ box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body{ margin:0; background: linear-gradient(180deg,#F8F4FF 0%,#EDE6FF 80%); color:var(--text); }
    .page{
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:14px 14px 26px; padding-bottom:96px;
    }

    /* TOPBAR (identique prestations) */
    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main);
      color:var(--violet-main); text-decoration:none;
      font-weight:800; font-size:13px; white-space:nowrap;
      cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
    }

    /* LOGO/TITRE (identique prestations) */
    .logo{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:8px; margin-bottom:4px; text-align:center;
    }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff; border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main); font-size:20px;font-weight:800;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦"; position:absolute; top:-6px; right:-5px;
      font-size:12px; color:var(--violet-main);
    }
    h1{ margin:0; font-size:24px; font-weight:800; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:13px; color:#444; text-align:center; }
    .emailLine{ margin-top:4px; font-size:12px; color:var(--muted); font-weight:800; text-align:center; }

    .alert{
      width:100%; max-width:1100px;
      display:none; margin-top:10px; padding:10px 12px;
      background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    /* LAYOUT (comme prestations mais 1100) */
    .layout{
      width:100%; max-width:1100px;
      margin-top:10px;
      display:grid; grid-template-columns:1fr; gap:10px; align-items:start;
    }
    @media(min-width:980px){
      .layout{ grid-template-columns: 1fr 1fr; }
    }

    .card{
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 12px;
      text-align:left;
      display:flex; flex-direction:column; gap:10px;
    }
    .card-title{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      font-size:15px; font-weight:900; color:#111;
    }
    .tiny{ font-size:12px; color:var(--muted); font-weight:800; line-height:1.35; }

    /* LIST style (on garde le design prestations) */
    .list{ display:flex; flex-direction:column; gap:10px; }
    .item{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px;
      display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
    }
    .iMain{ min-width:0; flex:1; }
    .iTop{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .badge{
      font-size:11px; font-weight:900;
      padding:3px 9px; border-radius:999px;
      background: rgba(122,92,255,0.12);
      color:#5b45c8; white-space:nowrap;
    }
    .badge.blue{ background: rgba(0,163,255,0.14); color:#0067a6; }
    .badge.ok{ background: rgba(27,143,77,0.14); color:#1b8f4d; }
    .badge.bad{ background: rgba(179,38,30,0.14); color:#b3261e; }

    .iTitle{
      font-size:13px; font-weight:900; color:#222; margin-top:4px;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 520px;
    }
    .iSub{
      margin-top:3px; font-size:12px; font-weight:800; color:#666;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width: 520px;
    }
    .iActions{
      display:flex; flex-direction:column; gap:6px; align-items:flex-end;
      flex-shrink:0;
    }
    .mini{
      border:none; border-radius:999px; padding:8px 10px;
      font-size:12px; font-weight:900; cursor:pointer;
      color:#fff; background: linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
      white-space:nowrap;
    }
    .mini.ghost{
      background:#fff; color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .mini:disabled{ opacity:.6; cursor:not-allowed; }

    .empty{
      padding:12px; border-radius:14px; background:#fff;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      color:#666; font-weight:900; font-size:12px;
    }

    /* CALENDRIER (compact + même vibe) */
    .calTop{
      display:flex; gap:8px; flex-wrap:wrap;
      justify-content:space-between; align-items:center;
    }
    .calNav{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .monthLabel{ font-weight:900; font-size:13px; color:#222; }

    .grid{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap:8px;
    }
    .day{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,.06);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:8px 8px 10px;
      cursor:pointer;
      min-height:72px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      transition: transform .06s ease;
    }
    .day:hover{ transform: translateY(-1px); }
    .day.muted{ opacity:.55; }
    .day.selected{ outline:3px solid rgba(122,92,255,.22); border-color:rgba(122,92,255,.45); }

    .dayNum{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      font-weight:900;
      font-size:13px;
    }
    .dots{ display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; min-height:10px; }
    .dot{
      width:8px;height:8px;border-radius:50%;
      background:#cfcfcf;
      opacity:.95;
    }
    .dot.blue{ background:#0067a6; }
    .dot.ok{ background:var(--ok); }
    .dot.bad{ background:var(--bad); }

    .initialsRow{
      display:flex; gap:6px; align-items:center; flex-wrap:wrap;
      margin-top:6px;
      min-height:16px;
    }
    .ini{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:18px;height:18px;
      border-radius:6px;
      font-weight:900;
      font-size:11px;
      background:#f2f2f2;
      color:#666;
      border:1px solid rgba(0,0,0,.06);
    }
    .ini.blue{ background: rgba(0,163,255,0.14); color:#0067a6; border-color: rgba(0,163,255,0.18); }
    .ini.ok{ background: rgba(27,143,77,0.14); color:var(--ok); border-color: rgba(27,143,77,0.18); }
    .ini.bad{ background: rgba(179,38,30,0.14); color:var(--bad); border-color: rgba(179,38,30,0.18); }

    /* ✅ Bloc gros boutons sous calendrier */
    .underCalendarActions{
      margin-top:10px;
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:8px;
    }
    @media(max-width:520px){
      .underCalendarActions{ grid-template-columns:1fr; }
    }
    .bigAction{
      border:none;
      border-radius:16px;
      padding:12px 12px;
      font-size:13px;
      font-weight:900;
      cursor:pointer;
      background:#fff;
      color:var(--violet-main);
      border:2px solid rgba(122,92,255,0.22);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      white-space:nowrap;
    }
    .bigAction:disabled{
      opacity:.55;
      cursor:not-allowed;
    }

   /* Bottom nav */
    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; gap: 6px; justify-content: space-around; align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none;
      font-size: 11px; font-weight:800; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff; box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static; max-width: 980px; margin: 12px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
    
    @media (max-width: 520px){
      .page{ padding-left:12px; padding-right:12px; }
      .iTitle, .iSub{ max-width: 220px; }
      html, body{ overflow-x:hidden; }
    }

    /* modal (inchangé sauf vibe blanche) */
    .modal-backdrop{
      position:fixed; inset:0;
      background:rgba(0,0,0,.25);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:200;
    }
    .modal{
      width:100%;
      max-width:620px;
      background:#fff;
      border-radius:18px;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 20px 60px rgba(0,0,0,.18);
      padding:16px 14px 18px;
    }
    .modal h2{ margin:0 0 6px; font-size:16px; font-weight:900; color:#111; }
    .modal p{ margin:0 0 10px; font-size:12px; color:#666; line-height:1.25; }
    label{ display:block; font-size:12px; font-weight:900; color:#333; margin:8px 0 4px; }
    input, select, textarea{
      width:100%; box-sizing:border-box; padding:9px 10px;
      border-radius:12px; border:1px solid #D3C7FF;
      font-size:13px; outline:none; background:#fff;
      font-weight:800; color:#222;
    }
    input:focus, select:focus, textarea:focus{
      border-color:var(--violet-main);
      box-shadow:0 0 0 3px rgba(122,92,255,.12);
    }
    textarea{ min-height:78px; resize:vertical; }
    .modalActions{
      display:flex; gap:8px; flex-wrap:wrap;
      justify-content:flex-end;
      margin-top:12px;
    }
    .fieldRow{ display:flex; gap:8px; flex-wrap:wrap; }
    .field{ flex:1; min-width:180px; }
  </style>
</head>

<body>
  <div class="page">

    <!-- ✅ Topbar comme prestations -->
    <div class="topbar">

  <!-- ✅ JS : STRICTEMENT ton code, inchangé (à part rien) -->
  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, orderBy, limit, getDocs,
      addDoc, doc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // UI
    const emailLine = document.getElementById("emailLine");
    const alertBox = document.getElementById("alertBox");

    const logoutBtn = document.getElementById("logoutBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const todayBtn = document.getElementById("todayBtn");

    const toValidateList = document.getElementById("toValidateList");
    const toValidateCount = document.getElementById("toValidateCount");

    const monthLabel = document.getElementById("monthLabel");
    const calendarGrid = document.getElementById("calendarGrid");
    const prevMonthBtn = document.getElementById("prevMonthBtn");
    const nextMonthBtn = document.getElementById("nextMonthBtn");

    const dayTitle = document.getElementById("dayTitle");
    const dayCount = document.getElementById("dayCount");
    const dayList = document.getElementById("dayList");

    const goLogementsBtn = document.getElementById("goLogementsBtn");

    // Modal booking
    const modalBackdrop = document.getElementById("modalBackdrop");
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    const bookingForm = document.getElementById("bookingForm");
    const homeSelect = document.getElementById("homeSelect");
    const homeSelectLabel = document.getElementById("homeSelectLabel");
    const homeInfoBox = document.getElementById("homeInfoBox");

    const bookingModalTitle = document.getElementById("bookingModalTitle");

    const arrivalDateInput = document.getElementById("arrivalDateInput");
    const arrivalTimeInput = document.getElementById("arrivalTimeInput");
    const departureDateInput = document.getElementById("departureDateInput");
    const departureTimeInput = document.getElementById("departureTimeInput");

    const agentEmailInput = document.getElementById("agentEmailInput");
    const agentNameInput = document.getElementById("agentNameInput");
    const metaInput = document.getElementById("metaInput");
    const saveBookingBtn = document.getElementById("saveBookingBtn");

    const openBookingBtn = document.getElementById("openBookingBtn");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function asRaw(s){ return String(s || "").toUpperCase().trim(); }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }
    function isEmailValid(s){ return /^\\S+@\\S+\\.\\S+$/.test(String(s||"").trim()); }

    function pad2(n){ return String(n).padStart(2,"0"); }
    function toDateKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
    function parseDateKey(s){
      const m = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(String(s||""));
      if(!m) return null;
      const y = Number(m[1]), mo = Number(m[2])-1, da = Number(m[3]);
      const d = new Date(y, mo, da);
      return Number.isFinite(d.getTime()) ? d : null;
    }
    function addDays(dateKey, days){
      const d = parseDateKey(dateKey);
      if(!d) return dateKey;
      d.setDate(d.getDate() + (Number(days)||0));
      return toDateKey(d);
    }
    function monthName(m){
      const names = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
      return names[m] || "—";
    }
    function agentInitial(nameOrEmail){
      const s = (nameOrEmail || "").trim();
      if(!s) return "";
      if(s.includes("@")){
        const before = s.split("@")[0] || "";
        return (before.trim()[0] || "").toUpperCase();
      }
      return (s.trim()[0] || "").toUpperCase();
    }

    function normalizeOpStatus(s){
      const x = asRaw(s);
      if(x === "TERMINEE" || x === "TERMINÉE") return "A_VALIDER";
      if(x === "DRAFT" || x === "BROUILLON" || x === "EN COURS") return "EN_COURS";
      if(x === "A_VALIDER" || x === "À VALIDER") return "A_VALIDER";
      if(x === "DONE" || x === "REALISEE" || x === "RÉALISÉE") return "REALISEE";
      if(x === "ANNULEE" || x === "ANNULÉE" || x === "CANCELLED") return "ANNULEE";
      return "EN_COURS";
    }
    function opLabel(st){
      const s = normalizeOpStatus(st);
      if(s === "EN_COURS") return "EN COURS";
      if(s === "A_VALIDER") return "À VALIDER";
      if(s === "REALISEE") return "RÉALISÉE";
      if(s === "ANNULEE") return "ANNULÉE";
      return s;
    }
    function opBadgeClass(st){
      const s = normalizeOpStatus(st);
      if(s === "A_VALIDER") return "blue";
      if(s === "REALISEE") return "ok";
      if(s === "ANNULEE") return "bad";
      return "";
    }
    function iniClassByStatus(st){
      const s = normalizeOpStatus(st);
      if(s === "A_VALIDER") return "blue";
      if(s === "REALISEE") return "ok";
      if(s === "ANNULEE") return "bad";
      return "";
    }

    // Auth
    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);

      selectedHomeId = id || "";
      localStorage.setItem("cm_selected_home_id", selectedHomeId);
    }

    function tsToMs(t){
      if(!t) return 0;
      if(typeof t === "number") return t;
      if(typeof t === "string") return Date.parse(t) || 0;
      if(t.toMillis) return t.toMillis();
      if(Number.isFinite(t.seconds)) return t.seconds * 1000;
      return 0;
    }

    async function loadHomes(){
      allHomes = [];
      homesById = new Map();
      try{
        const qH = query(
          collection(db,"homes"),
          where("conciergerieUid","==", currentUser.uid),
          limit(1000)
        );
        const snap = await getDocs(qH);
        allHomes = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));

        allHomes.sort((a,b)=>{
          const aA = tsToMs(a.createdAt) || tsToMs(a.updatedAt);
          const bA = tsToMs(b.createdAt) || tsToMs(b.updatedAt);
          return bA - aA;
        });

        homesById = new Map(allHomes.map(h => [h.id, h]));
      }catch(err){
        console.warn("loadHomes failed:", err?.message || err);
      }
    }

    function monthRangeKeys(y, m){
      const start = new Date(y, m, 1);
      const end = new Date(y, m+1, 0);
      return { startKey: toDateKey(start), endKey: toDateKey(end) };
    }

    function isBooking(ev){
      return !!(ev.arrivalDate || ev.departureDate || ev.stayNote);
    }

    async function loadEventsForMonth(){
      hideAlert();

      allEvents = [];
      eventsByDate = new Map();
      toValidate = [];

      const { startKey, endKey } = monthRangeKeys(viewYear, viewMonth);
      let docs = [];

      try{
        const qMonth = query(
          collection(db,"events"),
          where("conciergerieUid","==", currentUser.uid),
          where("dateKey", ">=", startKey),
          where("dateKey", "<=", endKey),
          orderBy("dateKey","asc"),
          limit(800)
        );
        const snap = await getDocs(qMonth);
        docs = snap.docs.map(d=> ({ id:d.id, ...(d.data()||{}) }));
      }catch(err){
        console.warn("qMonth failed (index?). fallback:", err?.message || err);
        const qFallback = query(
          collection(db,"events"),
          where("conciergerieUid","==", currentUser.uid),
          limit(800)
        );
        const snap2 = await getDocs(qFallback);
        docs = snap2.docs.map(d=> ({ id:d.id, ...(d.data()||{}) }));
      }

      const seen = new Set();

      for(const ev of docs){
        const dk = (ev.dateKey || ev.date || "").toString();
        const d = parseDateKey(dk);
        if(!d) continue;
        if(d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) continue;
        if(seen.has(ev.id)) continue;
        seen.add(ev.id);

        const h = (ev.homeId ? homesById.get(ev.homeId) : null);

        const obj = {
          id: ev.id,
          dateKey: dk,
          time: (ev.time || ev.arrivalTime || "").toString(),
          homeId: ev.homeId || "",
          homeName: ev.homeName || h?.name || "Logement",
          homeCity: ev.homeCity || ev.city || h?.city || "",
          ownerEmail: (ev.ownerEmail || h?.ownerEmail || "").toString(),
          ownerName: ev.ownerName || h?.ownerName || "",
          assignedToName: ev.assignedToName || ev.agentName || "",
          assignedToEmail: (ev.assignedToEmail || ev.agentEmail || "").toString().toLowerCase(),
          meta: ev.meta || ev.summary || ev.stayNote || "",
          opStatus: normalizeOpStatus(ev.opStatus || ev.status || "EN_COURS"),
          type: ev.type || "Prestation",

          arrivalDate: ev.arrivalDate || "",
          arrivalTime: ev.arrivalTime || "",
          departureDate: ev.departureDate || "",
          departureTime: ev.departureTime || "",
          stayNote: ev.stayNote || ""
        };

        allEvents.push(obj);

        const arr = eventsByDate.get(obj.dateKey) || [];
        arr.push(obj);
        eventsByDate.set(obj.dateKey, arr);

        if(obj.opStatus === "A_VALIDER") toValidate.push(obj);
      }

      for(const [k, arr] of eventsByDate.entries()){
        arr.sort((a,b)=> (a.time||"").localeCompare(b.time||""));
        eventsByDate.set(k, arr);
      }

      toValidate.sort((a,b)=> (a.dateKey+a.time).localeCompare(b.dateKey+b.time));

      renderAll();
    }

    function buildMonthCells(y, m){
      const first = new Date(y, m, 1);
      const last = new Date(y, m+1, 0);
      const firstDow = (first.getDay() + 6) % 7; // 0=Mon
      const daysInMonth = last.getDate();
      const prevLast = new Date(y, m, 0).getDate();
      const cells = [];

      for(let i=0; i<firstDow; i++){
        const dayNum = (prevLast - firstDow + 1) + i;
        cells.push({ date:new Date(y, m-1, dayNum), inMonth:false });
      }
      for(let d=1; d<=daysInMonth; d++){
        cells.push({ date:new Date(y,m,d), inMonth:true });
      }
      while(cells.length % 7 !== 0){
        const d = new Date(y, m, daysInMonth + (cells.length - (firstDow + daysInMonth)) + 1);
        cells.push({ date:d, inMonth:false });
      }
      return cells;
    }

    // ✅ DOTS = 1 par LOGEMENT (masque les doublons reservation+prestation)
    function dayHomesUnique(list){
      const map = new Map();
      for(const ev of list){
        const key = ev.homeId || ("NOHOME|" + ev.id);
        if(!map.has(key)) map.set(key, []);
        map.get(key).push(ev);
      }
      return Array.from(map.values()); // array de groupes (par logement)
    }

    function computeGroupStatus(items){
      const statuses = items.map(x=>normalizeOpStatus(x.opStatus));
      if(statuses.includes("A_VALIDER")) return "A_VALIDER";
      if(statuses.includes("EN_COURS")) return "EN_COURS";
      if(statuses.includes("REALISEE")) return "REALISEE";
      if(statuses.includes("ANNULEE")) return "ANNULEE";
      return "EN_COURS";
    }

    function renderCalendar(){
      calendarGrid.innerHTML = "";
      const cells = buildMonthCells(viewYear, viewMonth);

      for(const c of cells){
        const dk = toDateKey(c.date);
        const list = eventsByDate.get(dk) || [];
        const groups = dayHomesUnique(list); // ✅ groupes logement
        const isSelected = (dk === selectedDateKey);

        // dots = max 6 logements
        const dots = [];
        for(const g of groups.slice(0,6)){
          const st = computeGroupStatus(g);
          if(st === "A_VALIDER") dots.push("blue");
          else if(st === "REALISEE") dots.push("ok");
          else if(st === "ANNULEE") dots.push("bad");
          else dots.push("");
        }

        // initials = agents uniques (max 4)
        const initials = [];
        const seenIni = new Set();
        for(const ev of list){
          const ini = agentInitial(ev.assignedToName || ev.assignedToEmail);
          if(!ini) continue;
          const key = ini + "|" + (ev.assignedToEmail || ev.assignedToName || "");
          if(seenIni.has(key)) continue;
          seenIni.add(key);
          initials.push({ ini, cls: iniClassByStatus(ev.opStatus) });
          if(initials.length >= 4) break;
        }

        const div = document.createElement("div");
        div.className = "day" + (c.inMonth ? "" : " muted") + (isSelected ? " selected" : "");
        div.innerHTML = `
          <div class="dayNum">
            <span>${esc(c.date.getDate())}</span>
            <span class="badge" style="${groups.length ? "" : "opacity:.45;"}">${groups.length}</span>
          </div>

          <div class="dots">
            ${dots.map(cls=> `<span class="dot ${cls}"></span>`).join("")}
          </div>

          <div class="initialsRow" aria-label="Agents">
            ${
              initials.length
                ? initials.map(x=> `<span class="ini ${esc(x.cls)}" title="Agent">${esc(x.ini)}</span>`).join("")
                : `<span style="opacity:.25; font-size:11px; font-weight:900; color:#666;">&nbsp;</span>`
            }
          </div>
        `;
        calendarGrid.appendChild(div);

        div.addEventListener("click", ()=>{
          selectedDateKey = dk;
          renderCalendar();
          renderDayList();
        });
      }

      // ✅ compteur droite = nb logements (pas nb events)
      const list = eventsByDate.get(selectedDateKey) || [];
      const mergedCount = dayHomesUnique(list).length;
      dayCount.textContent = `${mergedCount}`;
      dayTitle.textContent = `Jour — ${selectedDateKey}`;
    }

    // ✅ Liste du jour fusionnée par logement
    function renderDayList(){
      dayList.innerHTML = "";

      const list = (eventsByDate.get(selectedDateKey) || []).slice();
      list.sort((a,b)=> (a.time||"").localeCompare(b.time||""));

      const groups = new Map();

      for(const ev of list){
        const key = ev.homeId || ("NOHOME|" + ev.id);
        const g = groups.get(key) || {
          homeId: ev.homeId || "",
          homeName: ev.homeName || "Logement",
          homeCity: ev.homeCity || "",
          ownerEmail: ev.ownerEmail || "",
          ownerName: ev.ownerName || "",
          agentName: ev.assignedToName || "",
          agentEmail: ev.assignedToEmail || "",
          items: []
        };
        g.items.push(ev);
        if(!g.ownerEmail && ev.ownerEmail) g.ownerEmail = ev.ownerEmail;
        if(!g.ownerName && ev.ownerName) g.ownerName = ev.ownerName;
        if(!g.agentName && ev.assignedToName) g.agentName = ev.assignedToName;
        if(!g.agentEmail && ev.assignedToEmail) g.agentEmail = ev.assignedToEmail;
        groups.set(key, g);
      }

      const merged = Array.from(groups.values()).sort((a,b)=>{
        const at = (a.items[0]?.time || "");
        const bt = (b.items[0]?.time || "");
        return at.localeCompare(bt);
      });

      dayCount.textContent = `${merged.length}`;
      dayTitle.textContent = `Jour — ${selectedDateKey}`;

      if(!merged.length){
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="iMain">
            <div class="iTitle">Aucune prestation ce jour</div>
            <div class="iSub">Sélectionne une autre date dans le calendrier.</div>
          </div>
          <div class="iActions">
            <button class="mini ghost" type="button" disabled>—</button>
          </div>
        `;
        dayList.appendChild(div);
        return;
      }

      for(const g of merged){
        const title = `${g.homeName}${g.homeCity ? " — " + g.homeCity : ""}`;
        const itemsSorted = g.items.slice().sort((a,b)=>(a.time||"").localeCompare(b.time||""));

        const booking = itemsSorted.find(isBooking);
        const prestation = itemsSorted.find(x => !isBooking(x));

        const globalSt = computeGroupStatus(itemsSorted);
        const bCls = opBadgeClass(globalSt);
        const bTxt = opLabel(globalSt);

        const tags = [];
        if(booking) tags.push(`<span class="badge">Réservation</span>`);
        if(prestation) tags.push(`<span class="badge">Prestation</span>`);

        const firstTime = itemsSorted.find(x=>x.time)?.time || "";
        const sub = [
          firstTime ? `Heure: ${firstTime}` : null,
          g.ownerEmail ? `Propriétaire: ${g.ownerEmail}` : null,
          g.agentName ? `Agent: ${g.agentName}` : null,
        ].filter(Boolean).join(" • ");

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="iMain">
            <div class="iTop">
              <span class="badge ${esc(bCls)}">${esc(bTxt)}</span>
              ${tags.join("")}
            </div>
            <div class="iTitle">${esc(title)}</div>
            <div class="iSub">${esc(sub || booking?.meta || prestation?.meta || "—")}</div>
          </div>

          <div class="iActions">
            ${
              globalSt === "A_VALIDER"
                ? `<button class="mini" type="button" data-validate="${esc(itemsSorted.find(x=>normalizeOpStatus(x.opStatus)==="A_VALIDER")?.id || "")}">Valider</button>`
                : (booking?.id
                    ? `<button class="mini ghost" type="button" data-edit-booking="${esc(booking.id)}">Modifier</button>`
                    : `<button class="mini ghost" type="button" disabled>Modifier</button>`
                  )
            }

            ${
              globalSt !== "A_VALIDER"
                ? (prestation?.id
                    ? `<button class="mini ghost" type="button" data-production-open="${esc(prestation.id)}">Production</button>`
                    : `<button class="mini" type="button" data-create-presta="${esc(g.homeId)}">Créer prestation</button>`
                  )
                : ``
            }
          </div>
        `;
        dayList.appendChild(div);

        div.querySelector(`[data-validate]`)?.addEventListener("click", (e)=>{
          e.stopPropagation();
          const id = e.currentTarget.getAttribute("data-validate");
          const ev = itemsSorted.find(x=>x.id===id) || itemsSorted.find(x=>normalizeOpStatus(x.opStatus)==="A_VALIDER");
          if(ev) validateEvent(ev);
        });

        div.querySelector(`[data-production-open="${prestation?.id || ""}"]`)?.addEventListener("click", (e)=>{
          e.stopPropagation();
          if(!prestation?.id) return;
          location.href = `prestations.html?open=${encodeURIComponent(prestation.id)}`;
        });

        div.querySelector(`[data-create-presta="${g.homeId}"]`)?.addEventListener("click", (e)=>{
          e.stopPropagation();
          const effectiveHomeId = g.homeId || booking?.homeId || "";
          if(!effectiveHomeId){
            showAlert("⛔ homeId manquant : impossible de créer une prestation.");
            return;
          }

          const params = new URLSearchParams();
          params.set("homeId", effectiveHomeId);
          params.set("from", "planning");
          params.set("dateKey", selectedDateKey || "");
          params.set("time", booking?.time || firstTime || "");
          params.set("ownerName", g.ownerName || "");
          params.set("ownerEmail", g.ownerEmail || "");
          params.set("note", booking?.meta || booking?.stayNote || "");

          location.href = `nouvelle-prestation.html?${params.toString()}`;
        });

        div.querySelector(`[data-edit-booking="${booking?.id || ""}"]`)?.addEventListener("click", (e)=>{
          e.stopPropagation();
          if(!booking?.id) return;

          openBookingModal(g.homeId || "");
          arrivalDateInput.value = booking.arrivalDate || booking.dateKey || selectedDateKey || "";
          arrivalTimeInput.value = booking.arrivalTime || booking.time || "";
          departureDateInput.value = booking.departureDate || addDays(arrivalDateInput.value || selectedDateKey, 1);
          departureTimeInput.value = booking.departureTime || "";
          metaInput.value = booking.stayNote || booking.meta || "";
          agentEmailInput.value = booking.assignedToEmail || "";
          agentNameInput.value = booking.assignedToName || "";

          bookingForm.dataset.editEventId = booking.id;
          bookingModalTitle.textContent = "Modifier la réservation";
          saveBookingBtn.textContent = "Enregistrer";
        });
      }
    }

    function openBookingModal(prefHomeId=""){
      hideAlert();

      const urlHomeId = new URLSearchParams(location.search).get("homeId") || "";

      if(!finalHomeId){
        showAlert("Va dans Logements pour choisir un logement puis crée la réservation.");
        return;
      }

      const h = homesById.get(finalHomeId) || allHomes.find(x=>x.id===finalHomeId);
      if(!h){
        showAlert("Logement introuvable (recharge la page).");
        return;
      }
      if(h?.status === "archived"){
        showAlert("Ce logement est archivé. Restaure-le pour créer une réservation.");
        return;
      }

      rebuildHomeSelectOptions();

      modalBackdrop.style.display = "flex";
      modalBackdrop.setAttribute("aria-hidden","false");

      if(!bookingForm.dataset.editEventId){
        const base = selectedDateKey || toDateKey(new Date());
        arrivalDateInput.value = base;
        arrivalTimeInput.value = "";
        departureDateInput.value = addDays(base, 1);
        departureTimeInput.value = "";
        agentEmailInput.value = "";
        agentNameInput.value = "";
        metaInput.value = "";
        bookingModalTitle.textContent = "Créer une réservation";
        saveBookingBtn.textContent = "Créer";
      }

      homeSelect.value = finalHomeId;
      homeSelectLabel.value = `${h.name || "Logement"}${h.city ? " — " + h.city : ""}`;

      setSelectedHomeId(finalHomeId);
      renderHomeInfo(finalHomeId);

      setTimeout(()=> arrivalDateInput.focus(), 0);

        showAlert("Choisis un logement dans Logements, puis reviens ici.");
        return;

      openBookingModal(selectedHomeId);
    });

    bookingForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      hideAlert();

      const homeId = (homeSelect.value || "").trim();
      const arrivalDate = (arrivalDateInput.value || "").trim();
      const arrivalTime = (arrivalTimeInput.value || "").trim();
      const departureDate = (departureDateInput.value || "").trim();
      const departureTime = (departureTimeInput.value || "").trim();

      const aEmail = normalizeEmail(agentEmailInput.value);
      const aName = (agentNameInput.value || "").trim();
      const meta = (metaInput.value || "").trim();

      if(!homeId) return showAlert("Choisis un logement.");
      if(!parseDateKey(arrivalDate)) return showAlert("Arrivée invalide.");
      if(!parseDateKey(departureDate)) return showAlert("Départ invalide.");

      const arrD = parseDateKey(arrivalDate);
      const depD = parseDateKey(departureDate);
      if(depD.getTime() < arrD.getTime()){
        return showAlert("Départ doit être le même jour ou après l’arrivée.");
      }
      if(aEmail && !isEmailValid(aEmail)){
        return showAlert("Email agent invalide.");
      }

      const home = homesById.get(homeId) || allHomes.find(h=>h.id===homeId);
      if(!home) return showAlert("Logement introuvable.");
      if(home?.status === "archived") return showAlert("Ce logement est archivé.");

      saveBookingBtn.disabled = true;
      saveBookingBtn.textContent = "…";

      try{
        const payload = {
          conciergerieUid: currentUser.uid,
          dateKey: arrivalDate,
          time: arrivalTime,
          arrivalDate,
          arrivalTime,
          departureDate,
          departureTime,
          stayNote: meta,
          meta,
          homeId,
          homeName: home.name || "",
          homeCity: home.city || "",
          homeAddress: (home.homeAddress || home.address || ""),
          ownerEmail: home.ownerEmail || "",
          ownerName: home.ownerName || "",
          assignedToEmail: aEmail || "",
          assignedToName: aName || "",
          status: "EN_COURS",
          opStatus: "EN_COURS",
          updatedAt: serverTimestamp()
        };

        const editId = bookingForm.dataset.editEventId || "";

        if(editId){
          await updateDoc(doc(db,"events", editId), payload);
          delete bookingForm.dataset.editEventId;
          closeBookingModal();
          showAlert("✅ Réservation modifiée.", true);
          selectedDateKey = arrivalDate;
          setSelectedHomeId(homeId);
          await loadEventsForMonth();
          return;
        }

        // ✅ anti-doublon réservation home/date
        const qDup = query(
          collection(db,"events"),
          where("conciergerieUid","==", currentUser.uid),
          where("homeId","==", homeId),
          where("dateKey","==", arrivalDate),
          limit(30)
        );
        const dupSnap = await getDocs(qDup);
        const existingBooking = dupSnap.docs
          .map(d=>({ id:d.id, ...(d.data()||{}) }))
          .find(x => !!(x.arrivalDate || x.departureDate || x.stayNote));

        if(existingBooking){
          showAlert("⛔ Déjà une réservation ce jour pour ce logement.\\nUtilise “Modifier” sur la ligne du jour.");
          saveBookingBtn.disabled = false;
          saveBookingBtn.textContent = "Créer";
          return;
        }

        await addDoc(collection(db,"events"), {
          ...payload,
          createdAt: serverTimestamp()
        });

        closeBookingModal();
        showAlert("✅ Réservation créée.", true);

        selectedDateKey = arrivalDate;
        setSelectedHomeId(homeId);

        await loadEventsForMonth();
      }catch(err){
        console.error(err);
        showAlert("Erreur réservation : " + (err?.message || "inconnue"));
      }finally{
        saveBookingBtn.disabled = false;
        saveBookingBtn.textContent = "Créer";
      }
    });

    document.addEventListener("keydown", (e)=>{
      if(e.key !== "Escape") return;
      if(modalBackdrop.style.display === "flex") closeBookingModal();
    });

    // ===== Boot =====
    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = user;
      emailLine.textContent = user.email || user.uid;

      const now = new Date();
      viewYear = now.getFullYear();
      viewMonth = now.getMonth();
      selectedDateKey = toDateKey(now);

      try{
        const urlHomeId = new URLSearchParams(location.search).get("homeId") || "";
        if(urlHomeId) setSelectedHomeId(urlHomeId);

        await loadHomes();
        await loadEventsForMonth();

        if(urlHomeId){
          openBookingModal(urlHomeId);
        }
      }catch(err){
        console.error(err);
        showAlert("Erreur initialisation planning : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
