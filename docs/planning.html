<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Planning</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
    }
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
    }
    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:90px;
    }
    .topbar{
      width:100%;
      max-width:1100px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
      border-bottom:1px solid rgba(0,0,0,0.03);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet);
      color:var(--violet);
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-decoration:none;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent;
      color:#fff;
      box-shadow:0 4px 12px rgba(0,0,0,.15);
    }
    .brand{
      display:flex; align-items:center; gap:8px;
    }
    .logo{
      width:36px;height:36px;border-radius:50%;
      background:#fff;border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      font-weight:900;color:var(--violet);
      position:relative;
      flex-shrink:0;
    }
    .logo:after{
      content:"✦";
      position:absolute; top:-6px; right:-4px;
      font-size:12px; color:var(--violet);
    }
    h1{ margin:0; font-size:18px; font-weight:900; }
    .sub{ font-size:12px; color:#444; margin-top:2px; }

    .wrap{
      width:100%;
      max-width:1100px;
      display:grid;
      grid-template-columns: 1fr 1fr;
      gap:14px;
      margin-top:12px;
    }
    @media(max-width: 980px){
      .wrap{ grid-template-columns:1fr; }
    }

    .card{
      background:linear-gradient(180deg,#fff 0%,#EEE4FF 100%);
      border-radius:18px;
      box-shadow:0 6px 18px rgba(0,0,0,.10);
      padding:14px 14px 16px;
    }
    .cardTitle{
      display:flex; align-items:center; justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
    }
    .cardTitle .t{ font-weight:900; font-size:15px; }
    .cardTitle .s{ font-size:12px; color:#666; font-weight:800; }

    .alert{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    /* list items */
    .list{ display:flex; flex-direction:column; gap:10px; }
    .item{
      background:#fff;
      border-radius:14px;
      padding:10px 10px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      border-left:5px solid var(--violet);
      display:flex;
      gap:10px;
      justify-content:space-between;
      align-items:flex-start;
    }
    .iMain{ flex:1; min-width:0; }
    .iTop{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:6px; }
    .iTitle{ font-weight:900; font-size:14px; color:#222; }
    .iSub{ font-size:12px; color:#666; margin-top:4px; line-height:1.25; }
    .iActions{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:4px 10px;
      border-radius:999px;
      background:#fff;
      font-size:12px;
      color:#555;
      border:1px solid rgba(0,0,0,.06);
      font-weight:900;
      box-shadow:0 2px 8px rgba(0,0,0,.05);
      white-space:nowrap;
    }
    .badge.blue{ background:#E9F0FF; color:#1c4fd7; border-color:#cddcff; }
    .badge.ok{ background:#E9F8EE; color:var(--ok); border-color:#c7efd4; }
    .badge.bad{ background:#FFECEF; color:var(--bad); border-color:#ffd0d8; }

    .mini{
      border:none;
      border-radius:999px;
      padding:7px 10px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
      background:#F3ECFF;
      color:#5b45c8;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .mini.ghost{ background:#fff; border:1px solid rgba(0,0,0,.08); color:#444; }
    .mini.red{ background:#ffe3ec; color:var(--bad); }
    .mini.gray{ background:#f1f1f1; color:#888; cursor:not-allowed; }
    .mini:disabled{ opacity:.45; cursor:not-allowed; }

    /* calendar */
    .calTop{
      display:flex; gap:8px; flex-wrap:wrap;
      justify-content:space-between; align-items:center;
      margin-bottom:10px;
    }
    .calNav{ display:flex; gap:8px; flex-wrap:wrap; }
    .calNav .mini{ padding:8px 12px; }
    .monthLabel{ font-weight:900; }
    .grid{
      display:grid;
      grid-template-columns: repeat(7, 1fr);
      gap:8px;
    }
    .day{
      background:#fff;
      border-radius:14px;
      border:1px solid rgba(0,0,0,.06);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:8px 8px 10px;
      cursor:pointer;
      min-height:74px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      transition: transform .06s ease;
    }
    .day:hover{ transform: translateY(-1px); }
    .day.muted{ opacity:.55; }
    .day.selected{ outline:3px solid rgba(122,92,255,.25); border-color:rgba(122,92,255,.45); }

    .dayNum{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:8px;
      font-weight:900;
      font-size:13px;
    }
    .dots{ display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; min-height:10px; }
    .dot{
      width:8px;height:8px;border-radius:50%;
      background:#cfcfcf;
      opacity:.95;
    }
    .dot.blue{ background:#1c4fd7; }
    .dot.ok{ background:var(--ok); }
    .dot.bad{ background:var(--bad); }

    .initialsRow{
      display:flex; gap:6px; align-items:center; flex-wrap:wrap;
      margin-top:6px;
      min-height:16px;
    }
    .ini{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:18px;height:18px;
      border-radius:6px;
      font-weight:900;
      font-size:11px;
      background:#f2f2f2;
      color:#666;
      border:1px solid rgba(0,0,0,.06);
    }
    .ini.blue{ background:#E9F0FF; color:#1c4fd7; border-color:#cddcff; }
    .ini.ok{ background:#E9F8EE; color:var(--ok); border-color:#c7efd4; }
    .ini.bad{ background:#FFECEF; color:var(--bad); border-color:#ffd0d8; }

    .actionsRow{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      margin-top:12px;
    }

    /* modal */
    .modal-backdrop{
      position:fixed; inset:0;
      background:rgba(0,0,0,.25);
      display:none;
      align-items:center;
      justify-content:center;
      padding:16px;
      z-index:50;
    }
    .modal{
      width:100%;
      max-width:620px;
      background:linear-gradient(180deg,#fff 0%,#EEE4FF 100%);
      border-radius:18px;
      box-shadow:0 10px 30px rgba(0,0,0,.20);
      padding:16px 14px 18px;
    }
    .modal h2{ margin:0 0 6px; font-size:16px; font-weight:900; color:#111; }
    .modal p{ margin:0 0 10px; font-size:12px; color:#666; line-height:1.25; }
    label{ display:block; font-size:12px; font-weight:900; color:#333; margin:8px 0 4px; }
    input, select, textarea{
      width:100%; box-sizing:border-box; padding:9px 10px;
      border-radius:10px; border:1px solid #D3C7FF;
      font-size:13px; outline:none; background:#fff;
    }
    textarea{ min-height:78px; resize:vertical; }
    .modalActions{
      display:flex; gap:8px; flex-wrap:wrap;
      justify-content:flex-end;
      margin-top:12px;
    }
    .fieldRow{ display:flex; gap:8px; flex-wrap:wrap; }
    .field{ flex:1; min-width:180px; }

    /* bottom nav (optionnel) */
    .bottom-nav{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 60;
      display: flex;
      gap: 6px;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 900;
      color: #666;
      padding: 10px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }
  </style>
</head>

<body>
  <div class="page">

    <div class="topbar">
      <div class="brand">
        <div class="logo">✓</div>
        <div>
          <h1>CleanUp Manager</h1>
          <div class="sub" id="emailLine">—</div>
        </div>
      </div>

      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap; justify-content:flex-end;">
        <button class="pill" id="logementsBtn" type="button">🏠 Logements</button>
        <button class="pill" id="refreshBtn" type="button">Rafraîchir</button>
        <button class="pill" id="todayBtn" type="button">Aujourd’hui</button>
        <button class="pill primary" id="logoutBtn" type="button">Déconnexion</button>
      </div>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="wrap">

      <!-- A VALIDER -->
      <section class="card">
        <div class="cardTitle">
          <div class="t">À valider</div>
          <div class="s"><span class="badge blue"><span id="toValidateCount">0</span></span></div>
        </div>
        <div class="list" id="toValidateList"></div>
      </section>

      <!-- CALENDRIER -->
      <section class="card">
        <div class="cardTitle">
          <div class="t">Planning</div>
          <div class="s"><span class="monthLabel" id="monthLabel">—</span></div>
        </div>

        <div class="calTop">
          <div class="calNav">
            <button class="mini ghost" id="prevMonthBtn" type="button">←</button>
            <button class="mini ghost" id="nextMonthBtn" type="button">→</button>
          </div>

          <!-- boutons gestion (tu voulais “sous le calendrier” -> on met ici + sous grille) -->
          <div class="calNav">
            <button class="mini" id="openBookingBtn" type="button">+ Réservation</button>
            <button class="mini ghost" id="goLogementsBtn" type="button">Logements</button>
          </div>
        </div>

        <div class="grid" id="calendarGrid"></div>

        <div class="actionsRow">
          <button class="mini ghost" id="goLogementsBtn2" type="button">🏠 Logements</button>
          <!-- Proprio + équipe plus tard -->
          <button class="mini ghost" type="button" disabled>👤 Propriétaires (bientôt)</button>
          <button class="mini ghost" type="button" disabled>👥 Équipe (bientôt)</button>
        </div>
      </section>

      <!-- LISTE DU JOUR -->
      <section class="card" style="grid-column: 1 / -1;">
        <div class="cardTitle">
          <div class="t" id="dayTitle">Jour —</div>
          <div class="s"><span class="badge"><span id="dayCount">0</span></span></div>
        </div>
        <div class="list" id="dayList"></div>
      </section>

    </div>

    <nav class="bottom-nav" aria-label="Navigation">
      <a href="planning.html" class="active">Planning</a>
      <a href="import-ical.html">iCal</a>
      <a href="messagerie.html">Messages</a>
      <a href="catalogue.html">Catalogue</a>
      <a href="logements.html">Logements</a>
    </nav>
  </div>

  <!-- MODALE RESERVATION -->
  <div class="modal-backdrop" id="modalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="bookingModalTitle">Créer une réservation</h2>
      <p id="homeInfoBox">Sélectionne un logement pour voir l’adresse et le propriétaire.</p>

      <form id="bookingForm">
        <!-- home select (caché, mais on garde pour cohérence du script) -->
        <input id="homeSelectLabel" type="text" disabled />
        <select id="homeSelect" style="display:none;"></select>

        <div class="fieldRow">
          <div class="field">
            <label for="arrivalDateInput">Arrivée (date)</label>
            <input id="arrivalDateInput" type="date" required />
          </div>

            <input id="arrivalTimeInput" type="time" />

        </div>

        <div class="fieldRow">
          <div class="field">

          </div>
          <div class="field">
            <label for="departureTimeInput">Départ (heure)</label>

        </div>

        <div class="fieldRow">
          <div class="field">
            <label for="agentNameInput">Agent (nom)</label>
            <input id="agentNameInput" type="text" placeholder="Ex. Sarah" />

          <div class="field">

          <button class="mini" id="saveBookingBtn" type="submit">Créer</button>
        </div>

    </div>
  </div>

  <!-- MODALE LOGEMENT (optionnelle, je l’ai gardée pour ne pas te bloquer) -->
  <div class="modal-backdrop" id="homeModalBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <h2 id="homeModalTitle">Ajouter un logement</h2>
      <p>Adresse obligatoire si tu veux que l’agent sache où aller.</p>

      <form id="homeForm">
        <div class="fieldRow">
          <div class="field">
            <label for="homeName">Nom du logement</label>
            <input id="homeName" type="text" placeholder="Ex. T2 Centre" required />
          </div>
          <div class="field">
            <label for="homeCity">Ville</label>
            <input id="homeCity" type="text" placeholder="Ex. Muret" required />
          </div>
        </div>

        <label for="homeAddress">Adresse</label>
        <input id="homeAddress" type="text" placeholder="Ex. 12 rue Victor Hugo, 31600 Muret" required />

        <div class="fieldRow">
          <div class="field">
            <label for="ownerEmail">Email propriétaire</label>
            <input id="ownerEmail" type="email" placeholder="proprio@email.com" required />
          </div>
          <div class="field">
            <label for="homeOwner">Nom propriétaire</label>
            <input id="homeOwner" type="text" placeholder="Mme Dupont" required />

        <div class="fieldRow">
          <div class="field">
            <label for="homeType">Type</label>

              <option>Studio</option><option>T1</option><option>T2</option><option>T3</option>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, orderBy, limit, getDocs,
      addDoc, doc, updateDoc, serverTimestamp, deleteDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // UI
    const emailLine = document.getElementById("emailLine");
    const alertBox = document.getElementById("alertBox");

    const logoutBtn = document.getElementById("logoutBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const todayBtn = document.getElementById("todayBtn");

    const toValidateList = document.getElementById("toValidateList");
    const toValidateCount = document.getElementById("toValidateCount");

    const monthLabel = document.getElementById("monthLabel");
    const calendarGrid = document.getElementById("calendarGrid");
    const prevMonthBtn = document.getElementById("prevMonthBtn");
    const nextMonthBtn = document.getElementById("nextMonthBtn");

    const dayTitle = document.getElementById("dayTitle");
    const dayCount = document.getElementById("dayCount");
    const dayList = document.getElementById("dayList");

    // boutons logements
    const logementsBtn = document.getElementById("logementsBtn");
    const goLogementsBtn = document.getElementById("goLogementsBtn");
    const goLogementsBtn2 = document.getElementById("goLogementsBtn2");

    // Modal booking
    const modalBackdrop = document.getElementById("modalBackdrop");
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    const bookingForm = document.getElementById("bookingForm");
    const homeSelect = document.getElementById("homeSelect");
    const homeSelectLabel = document.getElementById("homeSelectLabel");
    const homeInfoBox = document.getElementById("homeInfoBox");

    const bookingModalTitle = document.getElementById("bookingModalTitle");

    const arrivalDateInput = document.getElementById("arrivalDateInput");
    const arrivalTimeInput = document.getElementById("arrivalTimeInput");
    const departureDateInput = document.getElementById("departureDateInput");
    const departureTimeInput = document.getElementById("departureTimeInput");

    const agentEmailInput = document.getElementById("agentEmailInput");
    const agentNameInput = document.getElementById("agentNameInput");
    const metaInput = document.getElementById("metaInput");
    const saveBookingBtn = document.getElementById("saveBookingBtn");

    const openBookingBtn = document.getElementById("openBookingBtn");

    // Modal home (optionnelle)
    const homeModalBackdrop = document.getElementById("homeModalBackdrop");
    const homeModalTitle = document.getElementById("homeModalTitle");
    const cancelHomeModalBtn = document.getElementById("cancelHomeModalBtn");
    const homeForm = document.getElementById("homeForm");
    const homeName = document.getElementById("homeName");
    const homeCity = document.getElementById("homeCity");
    const homeAddress = document.getElementById("homeAddress");
    const ownerEmailEl = document.getElementById("ownerEmail");
    const homeOwner = document.getElementById("homeOwner");
    const homeType = document.getElementById("homeType");
    const homeTeam = document.getElementById("homeTeam");
    const saveHomeBtn = document.getElementById("saveHomeBtn");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function asRaw(s){ return String(s || "").toUpperCase().trim(); }
    function norm(s){ return (s||"").toString().toLowerCase().trim(); }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }
    function isEmailValid(s){ return /^\S+@\S+\.\S+$/.test(String(s||"").trim()); }

    function pad2(n){ return String(n).padStart(2,"0"); }
    function toDateKey(d){ return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
    function parseDateKey(s){
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s||""));
      if(!m) return null;
      const y = Number(m[1]), mo = Number(m[2])-1, da = Number(m[3]);
      const d = new Date(y, mo, da);
      return Number.isFinite(d.getTime()) ? d : null;
    }
    function addDays(dateKey, days){
      const d = parseDateKey(dateKey);
      if(!d) return dateKey;
      d.setDate(d.getDate() + (Number(days)||0));
      return toDateKey(d);
    }
    function monthName(m){
      const names = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
      return names[m] || "—";
    }
    function agentInitial(nameOrEmail){
      const s = (nameOrEmail || "").trim();
      if(!s) return "";
      if(s.includes("@")){
        const before = s.split("@")[0] || "";
        return (before.trim()[0] || "").toUpperCase();
      }
      return (s.trim()[0] || "").toUpperCase();
    }

    // ✅ EN_COURS / A_VALIDER / REALISEE / ANNULEE
    function normalizeOpStatus(s){
      const x = asRaw(s);
      if(x === "TERMINEE" || x === "TERMINÉE") return "A_VALIDER";
      if(x === "DRAFT" || x === "BROUILLON" || x === "EN COURS") return "EN_COURS";
      if(x === "A_VALIDER" || x === "À VALIDER") return "A_VALIDER";
      if(x === "DONE" || x === "REALISEE" || x === "RÉALISÉE") return "REALISEE";
      if(x === "ANNULEE" || x === "ANNULÉE" || x === "CANCELLED") return "ANNULEE";
      return "EN_COURS";
    }
    function opLabel(st){
      const s = normalizeOpStatus(st);

    function tsToMs(t){
      if(!t) return 0;
      if(typeof t === "number") return t;
      if(typeof t === "string") return Date.parse(t) || 0;
      if(t.toMillis) return t.toMillis();
      if(Number.isFinite(t.seconds)) return t.seconds * 1000;
      return 0;
    }

    async function loadHomes(){
      allHomes = [];
      homesById = new Map();

      try{
        const qH = query(
          collection(db,"homes"),
          where("conciergerieUid","==", currentUser.uid),
          limit(1000)
        );
        const snap = await getDocs(qH);
        allHomes = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) }));

        allHomes.sort((a,b)=>{
          const aA = tsToMs(a.createdAt) || tsToMs(a.updatedAt);
          const bA = tsToMs(b.createdAt) || tsToMs(b.updatedAt);
          if(bA !== aA) return bA - aA;
          return String(a.name||"").localeCompare(String(b.name||""));
        });

        homesById = new Map(allHomes.map(h => [h.id, h]));
      }catch(err){
        console.warn("loadHomes failed:", err?.message || err);
      }
    }

    // ===== EVENTS (planning) =====
    async function loadEventsForMonth(){
      hideAlert();

      allEvents = [];
      eventsByDate = new Map();
      toValidate = [];

      const { startKey, endKey } = monthRangeKeys(viewYear, viewMonth);
      let docs = [];

      try{
        const qMonth = query(
          collection(db,"events"),
          where("conciergerieUid","==", currentUser.uid),
          where("dateKey", ">=", startKey),
          where("dateKey", "<=", endKey),
          orderBy("dateKey","asc"),
          limit(800)
        );
        const snap = await getDocs(qMonth);
        docs = snap.docs.map(d=> ({ id:d.id, ...(d.data()||{}) }));
      }catch(err){
        console.warn("qMonth failed (likely index). fallback:", err?.message || err);
        try{
          const qFallback = query(
            collection(db,"events"),
            where("conciergerieUid","==", currentUser.uid),
            limit(800)
          );
          const snap2 = await getDocs(qFallback);
          docs = snap2.docs.map(d=> ({ id:d.id, ...(d.data()||{}) }));
        }catch(err2){
          console.error(err2);
          showAlert("Erreur Firestore : " + (err2?.message || "inconnue"));
          return;
        }
      }

      const seen = new Set();

      for(const ev of docs){
        const dk = (ev.dateKey || ev.date || "").toString();
        const d = parseDateKey(dk);
        if(!d) continue;
        if(d.getFullYear() !== viewYear || d.getMonth() !== viewMonth) continue;

        if(seen.has(ev.id)) continue;
        seen.add(ev.id);

        const h = (ev.homeId ? homesById.get(ev.homeId) : null);

        const obj = {
          id: ev.id,
          dateKey: dk,
          time: (ev.time || ev.arrivalTime || "").toString(),
          homeId: ev.homeId || "",
          homeName: ev.homeName || h?.name || "Logement",
          homeCity: ev.homeCity || ev.city || h?.city || "",
          homeAddress: ev.homeAddress || h?.homeAddress || h?.address || "",
          homeType: ev.homeType || h?.type || "",

          ownerName: ev.ownerName || h?.ownerName || "",
          ownerEmail: (ev.ownerEmail || h?.ownerEmail || "").toString(),
          assignedToName: ev.assignedToName || ev.agentName || "",
          assignedToEmail: (ev.assignedToEmail || ev.agentEmail || "").toString().toLowerCase(),
          meta: ev.meta || ev.summary || ev.stayNote || "",
          opStatus: normalizeOpStatus(ev.opStatus || ev.status || "EN_COURS"),
          type: ev.type || "Prestation",

          arrivalDate: ev.arrivalDate || "",
          arrivalTime: ev.arrivalTime || "",
          departureDate: ev.departureDate || "",
          departureTime: ev.departureTime || "",
          stayNote: ev.stayNote || ""
        };

        allEvents.push(obj);

        const arr = eventsByDate.get(obj.dateKey) || [];
        arr.push(obj);
        eventsByDate.set(obj.dateKey, arr);

        if(obj.opStatus === "A_VALIDER") toValidate.push(obj);
      }

      for(const [k, arr] of eventsByDate.entries()){
        arr.sort((a,b)=> (a.time||"").localeCompare(b.time||""));
        eventsByDate.set(k, arr);
      }

      toValidate.sort((a,b)=> (a.dateKey+a.time).localeCompare(b.dateKey+b.time));

      renderAll();
    }

    function buildMonthCells(y, m){
      const first = new Date(y, m, 1);
      const last = new Date(y, m+1, 0);

      const firstDow = (first.getDay() + 6) % 7; // 0=Mon
      const daysInMonth = last.getDate();

      const prevLast = new Date(y, m, 0).getDate();
      const cells = [];

      for(let i=0; i<firstDow; i++){
        const dayNum = (prevLast - firstDow + 1) + i;
        const d = new Date(y, m-1, dayNum);
        cells.push({ date:d, inMonth:false });
      }
      for(let d=1; d<=daysInMonth; d++){
        cells.push({ date:new Date(y,m,d), inMonth:true });
      }
      while(cells.length % 7 !== 0){
        const d = new Date(y, m, daysInMonth + (cells.length - (firstDow + daysInMonth)) + 1);
        cells.push({ date:d, inMonth:false });
      }
      return cells;
    }

    function renderCalendar(){
      calendarGrid.innerHTML = "";
      const cells = buildMonthCells(viewYear, viewMonth);

      for(const c of cells){
        const dk = toDateKey(c.date);
        const list = eventsByDate.get(dk) || [];
        const isSelected = (dk === selectedDateKey);

        const dots = [];
        for(const ev of list.slice(0,6)){
          const st = normalizeOpStatus(ev.opStatus);
          if(st === "A_VALIDER") dots.push("blue");
          else if(st === "REALISEE") dots.push("ok");
          else if(st === "ANNULEE") dots.push("bad");
          else dots.push("");
        }

        const initials = [];
        const seen = new Set();
        for(const ev of list){
          const ini = agentInitial(ev.assignedToName || ev.assignedToEmail);
          if(!ini) continue;
          const key = ini + "|" + (ev.assignedToEmail || ev.assignedToName || "");
          if(seen.has(key)) continue;
          seen.add(key);
          initials.push({ ini, cls: iniClassByStatus(ev.opStatus) });
          if(initials.length >= 4) break;
        }

        const div = document.createElement("div");
        div.className = "day" + (c.inMonth ? "" : " muted") + (isSelected ? " selected" : "");
        div.innerHTML = `
          <div class="dayNum">
            <span>${esc(c.date.getDate())}</span>
            <span class="badge" style="${list.length ? "" : "opacity:.45;"}">${list.length}</span>
          </div>

          <div class="dots">
            ${dots.map(cls=> `<span class="dot ${cls}"></span>`).join("")}
          </div>

          <div class="initialsRow" aria-label="Agents">
            ${
              initials.length
                ? initials.map(x=> `<span class="ini ${esc(x.cls)}" title="Agent">${esc(x.ini)}</span>`).join("")
                : `<span style="opacity:.25; font-size:11px; font-weight:900; color:#666;">&nbsp;</span>`
            }
          </div>
        `;
        calendarGrid.appendChild(div);

        div.addEventListener("click", ()=>{
          selectedDateKey = dk;
          renderCalendar();
          renderDayList();
        });
      }

      const list = eventsByDate.get(selectedDateKey) || [];
      dayCount.textContent = `${list.length}`;
      dayTitle.textContent = `Jour — ${selectedDateKey}`;
    }

    // ✅ FUSION 1 ligne / logement / jour
    function renderDayList(){
      dayList.innerHTML = "";

      const list = (eventsByDate.get(selectedDateKey) || []).slice();
      list.sort((a,b)=> (a.time||"").localeCompare(b.time||""));

      const groups = new Map();

      for(const ev of list){
        const key = ev.homeId || ("NOHOME|" + ev.id);
        const g = groups.get(key) || {
          homeId: ev.homeId || "",
          homeName: ev.homeName || "Logement",
          homeCity: ev.homeCity || "",
          ownerEmail: ev.ownerEmail || "",
          ownerName: ev.ownerName || "",
          agentName: ev.assignedToName || "",
          agentEmail: ev.assignedToEmail || "",
          items: []
        };
        g.items.push(ev);
        if(!g.ownerEmail && ev.ownerEmail) g.ownerEmail = ev.ownerEmail;
        if(!g.ownerName && ev.ownerName) g.ownerName = ev.ownerName;
        if(!g.agentName && ev.assignedToName) g.agentName = ev.assignedToName;
        if(!g.agentEmail && ev.assignedToEmail) g.agentEmail = ev.assignedToEmail;
        groups.set(key, g);
      }

      const merged = Array.from(groups.values()).sort((a,b)=>{
        const at = (a.items[0]?.time || "");
        const bt = (b.items[0]?.time || "");
        return at.localeCompare(bt);
      });

      dayCount.textContent = `${merged.length}`;

      if(!merged.length){
        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="iMain">
            <div class="iTitle">Aucune prestation ce jour</div>
            <div class="iSub">Sélectionne une autre date dans le calendrier.</div>
          </div>
          <div class="iActions">
            <button class="mini ghost" type="button" disabled>—</button>
          </div>
        `;
        dayList.appendChild(div);
        return;
      }

      for(const g of merged){
        const title = `${g.homeName}${g.homeCity ? " — " + g.homeCity : ""}`;

        const itemsSorted = g.items.slice().sort((a,b)=>(a.time||"").localeCompare(b.time||""));

        const isBooking = (x) => !!(x.arrivalDate || x.departureDate || x.stayNote);
        const isPrestation = (x) => !isBooking(x) && /presta|prestation/.test(String(x.type || "").toLowerCase());

        const booking = itemsSorted.find(isBooking);
        const prestation = itemsSorted.find(isPrestation);

        // statut global
        const statuses = itemsSorted.map(x=>normalizeOpStatus(x.opStatus));
        let globalSt = "EN_COURS";
        if(statuses.includes("A_VALIDER")) globalSt = "A_VALIDER";
        else if(statuses.includes("EN_COURS")) globalSt = "EN_COURS";
        else if(statuses.includes("REALISEE")) globalSt = "REALISEE";
        else if(statuses.includes("ANNULEE")) globalSt = "ANNULEE";

        const bCls = opBadgeClass(globalSt);
        const bTxt = opLabel(globalSt);

        const tags = [];
        if(booking) tags.push(`<span class="badge">Réservation</span>`);
        if(prestation) tags.push(`<span class="badge">Prestation</span>`);

        const firstTime = itemsSorted.find(x=>x.time)?.time || "";
        const sub = [
          firstTime ? `Heure: ${firstTime}` : null,
          g.ownerEmail ? `Propriétaire: ${g.ownerEmail}` : null,
          g.agentName ? `Agent: ${g.agentName}` : null,
        ].filter(Boolean).join(" • ");

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="iMain">
            <div class="iTop">
              <span class="badge ${esc(bCls)}">${esc(bTxt)}</span>
              ${tags.join("")}
            </div>
            <div class="iTitle">${esc(title)}</div>
            <div class="iSub">${esc(sub || booking?.meta || prestation?.meta || "—")}</div>
          </div>

          <div class="iActions">
            ${
              globalSt === "A_VALIDER"
                ? `<button class="mini" type="button" data-validate="${esc(itemsSorted.find(x=>normalizeOpStatus(x.opStatus)==="A_VALIDER")?.id || "")}">Valider</button>`
                : (
                    booking?.id
                      ? `<button class="mini ghost" type="button" data-edit-booking="${esc(booking.id)}">Modifier</button>`
                      : `<button class="mini ghost" type="button" disabled>Modifier</button>`
                  )
            }

            ${
              globalSt !== "A_VALIDER"
                ? (
                    prestation?.id
                      ? `<button class="mini ghost" type="button" data-production-open="${esc(prestation.id)}">Production</button>`
                      : `<button class="mini" type="button" data-create-presta="${esc(g.homeId)}">Créer prestation</button>`
                  )
                : ``
            }
          </div>
        `;
        dayList.appendChild(div);

        div.querySelector(`[data-validate]`)?.addEventListener("click", (e)=>{
          e.stopPropagation();
          const id = e.currentTarget.getAttribute("data-validate");
          const ev = itemsSorted.find(x=>x.id===id) || itemsSorted.find(x=>normalizeOpStatus(x.opStatus)==="A_VALIDER");
          if(ev) validateEvent(ev);
        });

        div.querySelector(`[data-edit-booking="${booking?.id || ""}"]`)?.addEventListener("click", (e)=>{
          e.stopPropagation();
          if(!booking?.id) return;

          if(!g.homeId){
            showAlert("⛔ homeId manquant pour modifier la réservation.");
            return;
          }

          openBookingModal(g.homeId);

          arrivalDateInput.value = booking.arrivalDate || booking.dateKey || selectedDateKey || "";
          arrivalTimeInput.value = booking.arrivalTime || booking.time || "";
          departureDateInput.value = booking.departureDate || addDays(arrivalDateInput.value || selectedDateKey, 1);
          departureTimeInput.value = booking.departureTime || "";
          metaInput.value = booking.stayNote || booking.meta || "";

          agentEmailInput.value = booking.assignedToEmail || "";
          agentNameInput.value = booking.assignedToName || "";

          bookingForm.dataset.editEventId = booking.id;
          bookingModalTitle.textContent = "Modifier la réservation";
          saveBookingBtn.textContent = "Enregistrer";
        });

        if(prestation?.id){
          div.querySelector(`[data-production-open="${prestation.id}"]`)?.addEventListener("click", (e)=>{
            e.stopPropagation();
            location.href = `prestations.html?open=${encodeURIComponent(prestation.id)}`;
          });
        }

        div.querySelector(`[data-create-presta="${g.homeId}"]`)?.addEventListener("click", (e)=>{
          e.stopPropagation();

          const effectiveHomeId = g.homeId || booking?.homeId || "";
          if(!effectiveHomeId){
            showAlert("⛔ homeId manquant : impossible de créer une prestation.");
            return;
          }

          const firstTime = itemsSorted.find(x=>x.time)?.time || "";
          const params = new URLSearchParams();
          params.set("homeId", effectiveHomeId);
          params.set("from", "planning");
          params.set("dateKey", selectedDateKey || "");
          params.set("time", booking?.time || firstTime || "");
          params.set("ownerName", g.ownerName || "");
          params.set("ownerEmail", g.ownerEmail || "");
          params.set("note", booking?.meta || booking?.stayNote || "");

          location.href = `nouvelle-prestation.html?${params.toString()}`;
        });
      }
    }

    function rebuildHomeSelectOptions(){
      homeSelect.innerHTML = "";
      for(const h of allHomes){
        if(isArchivedHome(h)) continue;
        const opt = document.createElement("option");
        opt.value = h.id;
        opt.textContent = `${h.name || "Logement"}${h.city ? " — " + h.city : ""}`;
        homeSelect.appendChild(opt);
      }
    }

    function openBookingModal(prefHomeId=""){
      hideAlert();

      const urlHomeId = new URLSearchParams(location.search).get("homeId") || "";
      const finalHomeId = prefHomeId || urlHomeId || selectedHomeId || "";

      if(!finalHomeId){
        showAlert("Va dans Logements pour choisir un logement (ou clique “Créer réservation” depuis logements).");
        return;
      }

      const h = homesById.get(finalHomeId) || allHomes.find(x=>x.id===finalHomeId);
      if(!h){
        showAlert("Logement introuvable (recharge la page).");
        return;
      }
      if(isArchivedHome(h)){
        showAlert("Ce logement est archivé. Restaure-le pour créer une réservation.");
        return;
      }

      rebuildHomeSelectOptions();

      modalBackdrop.style.display = "flex";
      modalBackdrop.setAttribute("aria-hidden","false");

      // base par défaut uniquement si pas en mode edit
      if(!bookingForm.dataset.editEventId){
        const base = selectedDateKey || toDateKey(new Date());
        arrivalDateInput.value = base;
        arrivalTimeInput.value = "";
        departureDateInput.value = addDays(base, 1);
        departureTimeInput.value = "";
        agentEmailInput.value = "";
        agentNameInput.value = "";
        metaInput.value = "";
        bookingModalTitle.textContent = "Créer une réservation";
        saveBookingBtn.textContent = "Créer";
      }

      homeSelect.value = finalHomeId;
      homeSelectLabel.value = `${h.name || "Logement"}${h.city ? " — " + h.city : ""}`;

      setSelectedHomeId(finalHomeId);
      renderHomeInfo(finalHomeId);

      setTimeout(()=> arrivalDateInput.focus(), 0);
    }

    function closeBookingModal(){
      modalBackdrop.style.display = "none";
      modalBackdrop.setAttribute("aria-hidden","true");
      bookingForm.reset();
      delete bookingForm.dataset.editEventId;
      bookingModalTitle.textContent = "Créer une réservation";
      saveBookingBtn.textContent = "Créer";
    }

    cancelModalBtn.addEventListener("click", closeBookingModal);
    modalBackdrop.addEventListener("click", (e)=>{ if(e.target === modalBackdrop) closeBookingModal(); });

    openBookingBtn?.addEventListener("click", ()=>{
      // si pas de selectedHomeId : on force user -> logements
      if(!selectedHomeId){
        showAlert("Choisis un logement dans Logements, puis crée la réservation.");
        return;
      }
      openBookingModal(selectedHomeId);
    });

    bookingForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      hideAlert();

      const homeId = (homeSelect.value || "").trim();
      const arrivalDate = (arrivalDateInput.value || "").trim();
      const arrivalTime = (arrivalTimeInput.value || "").trim();
      const departureDate = (departureDateInput.value || "").trim();
      const departureTime = (departureTimeInput.value || "").trim();

      const aEmail = normalizeEmail(agentEmailInput.value);
      const aName = (agentNameInput.value || "").trim();
      const meta = (metaInput.value || "").trim();

      if(!homeId) return showAlert("Choisis un logement.");
      if(!parseDateKey(arrivalDate)) return showAlert("Arrivée invalide.");
      if(!parseDateKey(departureDate)) return showAlert("Départ invalide.");

      const arrD = parseDateKey(arrivalDate);
      const depD = parseDateKey(departureDate);
      if(depD.getTime() < arrD.getTime()){
        return showAlert("Départ doit être le même jour ou après l’arrivée.");
      }
      if(aEmail && !isEmailValid(aEmail)){
        return showAlert("Email agent invalide.");
      }

      const home = homesById.get(homeId) || allHomes.find(h=>h.id===homeId);
      if(!home) return showAlert("Logement introuvable.");
      if(isArchivedHome(home)) return showAlert("Ce logement est archivé.");

      saveBookingBtn.disabled = true;
      saveBookingBtn.textContent = "…";

      try{
        const payload = {
          conciergerieUid: currentUser.uid,

          dateKey: arrivalDate,
          time: arrivalTime,

          arrivalDate,
          arrivalTime,
          departureDate,
          departureTime,

          stayNote: meta,
          meta,

          homeId,
          homeName: home.name || "",
          homeCity: home.city || "",
          homeAddress: (home.homeAddress || home.address || ""),

          ownerEmail: home.ownerEmail || "",
          ownerName: home.ownerName || "",

          assignedToEmail: aEmail || "",
          assignedToName: aName || "",

          status: "EN_COURS",
          opStatus: "EN_COURS",

          updatedAt: serverTimestamp()
        };

        const editId = bookingForm.dataset.editEventId || "";

        // ✅ MODE EDIT
        if(editId){
          await updateDoc(doc(db,"events", editId), payload);

          delete bookingForm.dataset.editEventId;
          closeBookingModal();
          showAlert("✅ Réservation modifiée.", true);

          selectedDateKey = arrivalDate;
          setSelectedHomeId(homeId);

          await loadEventsForMonth();
          return;
        }

        // ✅ MODE CREATE : 1 réservation max / homeId / dateKey
        const qDup = query(
          collection(db,"events"),
          where("conciergerieUid","==", currentUser.uid),
          where("homeId","==", homeId),
          where("dateKey","==", arrivalDate),
          limit(20)
        );
        const dupSnap = await getDocs(qDup);

        const existingBooking = dupSnap.docs
          .map(d=>({ id:d.id, ...(d.data()||{}) }))
          .find(x => !!(x.arrivalDate || x.departureDate || x.stayNote));

        if(existingBooking){
          showAlert("⛔ Déjà une réservation ce jour pour ce logement.\nUtilise “Modifier” sur la ligne du jour.");
          saveBookingBtn.disabled = false;
          saveBookingBtn.textContent = "Créer";
          return;
        }

        await addDoc(collection(db,"events"), {
          ...payload,
          createdAt: serverTimestamp()
        });

        closeBookingModal();
        showAlert("✅ Réservation créée.", true);

        selectedDateKey = arrivalDate;
        setSelectedHomeId(homeId);

        await loadEventsForMonth();
      }catch(err){
        console.error(err);
        showAlert("Erreur réservation : " + (err?.message || "inconnue"));
      }finally{
        saveBookingBtn.disabled = false;
        saveBookingBtn.textContent = "Créer";
      }
    });

    // ===== MODALE HOME (optionnelle) =====
    function openHomeModalCreate(){
      hideAlert();
      editingHomeId = null;
      homeModalTitle.textContent = "Ajouter un logement";
      homeModalBackdrop.style.display = "flex";
      homeModalBackdrop.setAttribute("aria-hidden","false");
      homeForm.reset();
      homeType.value = "Studio";
      setTimeout(()=> homeName.focus(), 0);
    }

    function openHomeModalEdit(home){
      hideAlert();
      editingHomeId = home.id;
      homeModalTitle.textContent = "Modifier le logement";
      homeModalBackdrop.style.display = "flex";
      homeModalBackdrop.setAttribute("aria-hidden","false");

      homeName.value = home.name || "";
      homeCity.value = home.city || "";
      homeAddress.value = home.homeAddress || home.address || "";
      ownerEmailEl.value = home.ownerEmail || "";
      homeOwner.value = home.ownerName || "";
      homeType.value = home.type || "Studio";
      homeTeam.value = home.team || "";

      setTimeout(()=> homeName.focus(), 0);
    }

    function closeHomeModal(){
      homeModalBackdrop.style.display = "none";
      homeModalBackdrop.setAttribute("aria-hidden","true");
      homeForm.reset();
      homeType.value = "Studio";
      homeTeam.value = "";
      editingHomeId = null;
    }

    cancelHomeModalBtn.addEventListener("click", closeHomeModal);
    homeModalBackdrop.addEventListener("click", (e)=>{ if(e.target === homeModalBackdrop) closeHomeModal(); });

    homeForm.addEventListener("submit", async (e)=>{
      e.preventDefault();
      hideAlert();

      const name = homeName.value.trim();
      const city = homeCity.value.trim();
      const addr = homeAddress.value.trim();
      const ownerName = homeOwner.value.trim();
      const ownerEmail = normalizeEmail(ownerEmailEl.value);
      const type = homeType.value;
      const team = (homeTeam.value || "").trim();

      if(!name || !city || !addr || !ownerName || !ownerEmail){
        showAlert("Champs manquants : nom + ville + adresse + email propriétaire + nom propriétaire.");
        return;
      }
      if(!isEmailValid(ownerEmail)){
        showAlert("Email propriétaire invalide.");
        return;
      }

      saveHomeBtn.disabled = true;
      saveHomeBtn.textContent = "…";

      try{
        if(editingHomeId){
          await updateDoc(doc(db,"homes", editingHomeId), {
            name,
            city,
            homeAddress: addr,
            ownerName,
            ownerEmail,
            type,
            team,
            updatedAt: serverTimestamp()
          });
          setSelectedHomeId(editingHomeId);
          closeHomeModal();
          await loadHomes();
          showAlert("✅ Logement modifié.", true);
        }else{
          const payload = {
            conciergerieUid: currentUser.uid,
            name,
            city,
            homeAddress: addr,
            ownerName,
            ownerEmail,
            type,
            team,
            status: "active",
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
          };
          const ref = await addDoc(collection(db,"homes"), payload);
          setSelectedHomeId(ref.id);
          closeHomeModal();
          await loadHomes();
          showAlert("✅ Logement créé.", true);
        }
      }catch(err){
        console.error(err);
        showAlert("Erreur enregistrement logement : " + (err?.message || "inconnue"));
      }finally{
        saveHomeBtn.disabled = false;
        saveHomeBtn.textContent = "Enregistrer";
      }
    });

    document.addEventListener("keydown", (e)=>{
      if(e.key !== "Escape") return;
      if(modalBackdrop.style.display === "flex") closeBookingModal();
      if(homeModalBackdrop.style.display === "flex") closeHomeModal();
    });

    // ===== Boot =====
    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = user;
      emailLine.textContent = user.email || user.uid;

      const now = new Date();
      viewYear = now.getFullYear();
      viewMonth = now.getMonth();
      selectedDateKey = toDateKey(now);

      try{
        const urlHomeId = new URLSearchParams(location.search).get("homeId") || "";
        if(urlHomeId) setSelectedHomeId(urlHomeId);

        await loadHomes();
        await loadEventsForMonth();

        if(urlHomeId){
          openBookingModal(urlHomeId);
        }else{
          if(selectedHomeId) renderHomeInfo(selectedHomeId);
        }
      }catch(err){
        console.error(err);
        showAlert("Erreur initialisation planning : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
