<!--
  CleanUp Manager — Planning
  VERSION STABLE
-->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CleanUp Manager — Planning</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
:root{
  --violet:#7A5CFF;--violet2:#6238FF;
  --bg1:#F8F4FF;--bg2:#EDE6FF;
  --text:#111;--muted:#666;
  --bad:#b3261e;--ok:#1b8f4d;
  --border:rgba(122,92,255,.18);
  --shadow:0 14px 36px rgba(0,0,0,.08);
  --card:rgba(255,255,255,.9);
}
body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text)}
.page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px;padding-bottom:96px}

.topbar{
  width:100%;max-width:1120px;
  display:flex;justify-content:space-between;align-items:center;
  position:sticky;top:0;z-index:20;
  background:rgba(248,244,255,.9);backdrop-filter:blur(6px);
  padding:10px 0
}
.pill{
  padding:8px 12px;border-radius:999px;
  background:#fff;border:2px solid var(--violet);
  color:var(--violet);font-weight:900;font-size:13px;
  text-decoration:none;cursor:pointer
}

.wrap{width:100%;max-width:1120px;display:flex;flex-direction:column;gap:12px}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:12px
}
.cardTitle{display:flex;justify-content:space-between;font-weight:900}

.grid{display:grid;gap:12px}
@media(min-width:980px){
  .grid{grid-template-columns:1fr 1.1fr}
}

.calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:8px}
.dow{text-align:center;font-size:11px;font-weight:900;color:#666}

.day{
  background:#fff;border-radius:14px;padding:8px;
  box-shadow:0 3px 10px rgba(0,0,0,.05);
  cursor:pointer;display:flex;flex-direction:column;gap:6px
}
.day.muted{opacity:.45}
.day.selected{outline:3px solid rgba(122,92,255,.35)}

.list{display:flex;flex-direction:column;gap:10px}
.item{
  background:#fff;border-radius:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.06);
  padding:10px;display:flex;justify-content:space-between;gap:10px
}

.iActions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

.mini{
  border-radius:999px;padding:9px 12px;
  border:none;font-weight:900;font-size:12px;
  background:linear-gradient(90deg,var(--violet),var(--violet2));
  color:#fff;cursor:pointer
}
.mini.ghost{
  background:#fff;color:var(--violet);
  border:2px solid var(--violet)
}
.mini.red{background:#ffe3ec;color:var(--bad)}
.mini.ok{background:#e7fff1;color:var(--ok)}

.mini .ico{display:none}
@media(max-width:820px){
  .mini .txt{display:none}
  .mini .ico{display:inline}
  .mini{min-width:44px;height:44px}
}

.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;
  display:flex;gap:6px;justify-content:space-around;
  background:#fff;border-top:1px solid var(--border);
  padding:10px
}
.bottom-nav a{
  flex:1;text-align:center;text-decoration:none;
  font-size:11px;font-weight:900;color:#666;
  padding:8px;border-radius:999px
}
.bottom-nav a.active{
  background:linear-gradient(90deg,var(--violet),var(--violet2));
  color:#fff
}
</style>
</head>

<body>
<div class="page">

  <div class="topbar">
    <a class="pill" href="conciergerie.html">← Tableau de bord</a>
    <button class="pill" id="logoutBtn">Déconnexion</button>
  </div>

  <div class="wrap">
    <section class="card">
      <div class="cardTitle">
        <span>Calendrier</span>
        <span id="monthLabel">—</span>
      </div>
      <div class="calGrid">
        <div class="dow">L</div><div class="dow">M</div><div class="dow">M</div>
        <div class="dow">J</div><div class="dow">V</div><div class="dow">S</div><div class="dow">D</div>
      </div>
      <div class="calGrid" id="calendarGrid"></div>
    </section>

    <section class="card">
      <div class="cardTitle">
        <span id="dayTitle">Jour</span>
        <span id="dayCount">0</span>
      </div>
      <div class="list" id="dayList"></div>
    </section>
  </div>
</div>

<nav class="bottom-nav">
  <a class="active" href="planning.html">Planning</a>
  <a href="import-ical.html">iCal</a>
  <a href="logements.html">Logements</a>
</nav>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const monthLabel = document.getElementById("monthLabel");
const calendarGrid = document.getElementById("calendarGrid");
const dayTitle = document.getElementById("dayTitle");
const dayCount = document.getElementById("dayCount");
const dayList = document.getElementById("dayList");
const logoutBtn = document.getElementById("logoutBtn");

logoutBtn.onclick = async ()=>{ await signOut(auth); location.href="index.html"; };

let currentUser=null;
let viewDate=new Date();
let selectedKey="";

const pad=n=>String(n).padStart(2,"0");
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;

function buildMonth(){
  calendarGrid.innerHTML="";
  const y=viewDate.getFullYear(), m=viewDate.getMonth();
  monthLabel.textContent=viewDate.toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  const first=new Date(y,m,1);
  const start=(first.getDay()+6)%7;
  for(let i=0;i<start;i++) calendarGrid.appendChild(document.createElement("div"));
  const days=new Date(y,m+1,0).getDate();
  for(let d=1;d<=days;d++){
    const div=document.createElement("div");
    div.className="day";
    const dk=key(new Date(y,m,d));
    div.textContent=d;
    div.onclick=()=>selectDay(dk);
    calendarGrid.appendChild(div);
  }
}

function selectDay(dk){
  selectedKey=dk;
  dayTitle.textContent="Jour — "+dk;
  dayList.innerHTML="";
  dayCount.textContent="0";
}

onAuthStateChanged(auth, async user=>{
  if(!user){location.href="login.html";return}
  currentUser=user;
  selectedKey=key(new Date());
  buildMonth();
  selectDay(selectedKey);
});
</script>

</body>
</html>
