<!-- docs/recouvrement.html (FINAL — recouvrement par facture + relances auto 1/2/3 + mise en demeure manuelle) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Recouvrement</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
      --warn:#b26a00;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:1100px; position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .logo-title{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; margin-bottom:6px; text-align:center; }
    .logo-icon{
      width:44px;height:44px;border-radius:50%; background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center; color:var(--violet);
      font-size:22px;font-weight:900; position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }

    .wrap{ width:100%; max-width:1100px; margin-top:14px; display:flex; flex-direction:column; gap:12px; min-width:0; }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .alert{
      display:none; padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .toolbar{
      display:grid;
      grid-template-columns: 220px 1fr 180px;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:860px){ .toolbar{ grid-template-columns: 1fr; } }

    .select{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.35);
      background:#fff;
      font-weight:900;
      color:#222;
      outline:none;
    }
    .searchbar{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      min-width:0;
    }
    .s-ico{ font-size:14px; opacity:.75; }
    .input{
      flex:1;
      border:none;
      outline:none;
      font-size:13px;
      font-weight:900;
      color:#111;
      background:transparent;
      min-width:0;
    }

    .btn{
      display:inline-flex; justify-content:center; align-items:center; gap:8px;
      padding:10px 12px; border-radius:999px;
      border:none; cursor:pointer; text-decoration:none;
      font-weight:1000; font-size:12px;
      background:#fff; color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap; user-select:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff; border-color:transparent;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }
    .btn.warn{
      border-color: rgba(178,106,0,0.35);
      color: var(--warn);
    }
    .btn.bad{
      border-color: rgba(179,38,30,0.30);
      color: var(--bad);
    }
    .btn[aria-disabled="true"], .btn:disabled{ opacity:.45; pointer-events:none; }

    .badge{
      display:inline-flex; align-items:center; justify-content:center;
      padding:6px 10px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff; color:#333; white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }
    .badge.warn{ border-color: rgba(178,106,0,0.35); color: var(--warn); }

    .line{
      display:grid;
      grid-template-columns: 110px 160px 1.2fr 1fr 140px 140px;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:980px){
      .line{ grid-template-columns: 110px 160px 1fr 1fr; grid-auto-rows:auto; }
    }
    @media(max-width:560px){
      .line{ grid-template-columns: 1fr 1fr; }
    }
    .cell{ min-width:0; }
    .cell .t{ font-size:11px; color:#666; font-weight:900; }
    .cell .v{ font-size:13px; color:#111; font-weight:900; }
    .cell .v.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .sep{ height:1px; background: rgba(122,92,255,0.18); margin:10px 0; }

    .actionsBar{
      display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; width:100%;
    }
    @media(max-width:560px){
      .actionsBar{ justify-content:stretch; }
      .actionsBar .btn{ flex:1 1 48%; }
      .actionsBar .btn.primary{ flex:1 1 100%; }
    }

    .mutedLine{ margin-top:6px; font-size:12px; color:#666; font-weight:850; }
    .rowDisabled{ opacity:.55; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; gap: 6px; justify-content: space-around; align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none;
      font-size: 11px; font-weight: 900; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static; width: 100%; max-width: 1100px; margin: 14px 0 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px; gap: 10px;
      }
      .bottom-nav a{ font-size: 13px; padding: 12px 12px; }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="compta.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon">⏱</div>
      <h1>Recouvrement</h1>
    </div>

    <div class="subtitle">Suivi des impayés + relances</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="card">
        <div class="toolbar">
          <select class="select" id="filter">
            <option value="ALL">Toutes les factures</option>
            <option value="OPEN">À recouvrer (reste dû &gt; 0)</option>
            <option value="OVERDUE">En retard (échéance dépassée)</option>
            <option value="PAID">Soldées</option>
          </select>

          <div class="searchbar" title="Recherche">
            <span class="s-ico">🔎</span>
            <input class="input" id="searchInput" type="search" placeholder="Rechercher (n° facture, client, logement…)" autocomplete="off" />
          </div>

          <button class="btn primary" id="refreshBtn" type="button">Actualiser</button>
        </div>

        <div class="mutedLine">
          Relances auto : J+1 / J+7 / J+14 après échéance. Mise en demeure : bouton manuel.
          Une facture soldée/créditée/annulée = recouvrement verrouillé.
        </div>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="compta.html">Compta</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, orderBy, limit, getDocs, doc, getDoc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const filterEl = document.getElementById("filter");
    const searchInput = document.getElementById("searchInput");
    const listBox = document.getElementById("listBox");
    const refreshBtn = document.getElementById("refreshBtn");

    let currentUser = null;
    let all = [];
    let vatEnabled = false;
    let vatRate = 0;

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }
    function fmtDateFR(x){
      if(!x) return "—";
      try{
        if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
        const s = String(x).trim();
        if(!s) return "—";
        if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
        const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if(m) return `${m[3]}/${m[2]}/${m[1]}`;
        const d = new Date(s);
        if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
        return "—";
      }catch{ return "—"; }
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

    function parseDDMMYYYY(s){
      const x = String(s||"").trim();
      if(!/^\d{2}\/\d{2}\/\d{4}$/.test(x)) return null;
      const [dd,mm,yy] = x.split("/").map(n=>parseInt(n,10));
      const d = new Date(yy, (mm||1)-1, dd||1);
      return isNaN(d.getTime()) ? null : d;
    }
    function addDays(dateObj, days){
      const d = new Date(dateObj.getTime());
      d.setDate(d.getDate() + (Number(days)||0));
      return d;
    }
    function termToDays(term){
      const t = String(term||"").toUpperCase();
      if(t === "RECEPTION") return 0;
      if(t === "8J") return 8;
      if(t === "15J") return 15;
      if(t === "30J") return 30;
      if(t === "45J") return 45;
      return 0;
    }

    function computeHT(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }
    function computeTotalsFallback(lines){
      const ht = computeHT(lines);
      const tva = vatEnabled ? (ht * (Number(vatRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }
    function getTotals(inv){
      const ht = Number(inv?.totalHT);
      const tva = Number(inv?.totalTVA);
      const ttc = Number(inv?.totalTTC);
      if(Number.isFinite(ht) && Number.isFinite(tva) && Number.isFinite(ttc) && ttc >= 0) return { ht, tva, ttc };
      return computeTotalsFallback(inv?.lines);
    }

    function getInvoiceStatusRaw(x){
      return String(x?.invoiceStatus||"").toUpperCase().trim();
    }
    function getInvoiceStatusDisplay(x){
      const raw = getInvoiceStatusRaw(x);
      const hasNum = !!String(x?.invoiceNumber||"").trim();
      if(hasNum && (raw === "" || raw === "DRAFT")) return "ISSUED";
      return raw || "MISSING";
    }
    function badgeForStatus(display){
      const s = String(display||"").toUpperCase().trim();
      if(s === "PAID") return `<span class="badge ok">Payée</span>`;
      if(s === "CANCELLED") return `<span class="badge bad">Annulée</span>`;
      if(s === "CREDITED") return `<span class="badge bad">Créditée</span>`;
      if(s === "SENT") return `<span class="badge">Envoyée</span>`;
      if(s === "ISSUED") return `<span class="badge">Émise</span>`;
      if(s === "DRAFT") return `<span class="badge">Brouillon</span>`;
      return `<span class="badge bad">Sans statut</span>`;
    }

    function levelLabel(n){
      const k = Number(n)||0;
      if(k <= 0) return `<span class="badge">Aucune</span>`;
      if(k === 1) return `<span class="badge warn">Relance 1</span>`;
      if(k === 2) return `<span class="badge warn">Relance 2</span>`;
      if(k === 3) return `<span class="badge warn">Relance 3</span>`;
      return `<span class="badge bad">Mise en demeure</span>`;
    }

    function computeDue(inv){
      const issuedStr = String(inv?.invoiceIssuedDate || "").trim();
      const issued = parseDDMMYYYY(issuedStr) || new Date();
      const term = String(inv?.invoicePaymentTerm || "RECEPTION").toUpperCase();
      const due = addDays(issued, termToDays(term));
      return { issuedLabel: issuedStr || fmtDateFR(issued), due, dueLabel: fmtDateFR(due) };
    }

    function nowDayStart(){
      const n = new Date();
      return new Date(n.getFullYear(), n.getMonth(), n.getDate());
    }

    // Auto relances (1/2/3) si facture ouverte + en retard
    async function maybeAutoRelance(inv){
      const st = getInvoiceStatusRaw(inv);
      if(["PAID","CANCELLED","CREDITED"].includes(st)) return;

      const totals = getTotals(inv);
      const paid = Number(inv?.paidAmount) || 0;
      const dueAmt = Math.max(0, (Number(totals.ttc)||0) - paid);
      if(dueAmt <= 0) return;

      const { due } = computeDue(inv);
      const today = nowDayStart();
      const overdueDays = Math.floor((today.getTime() - due.getTime()) / 86400000);
      if(overdueDays <= 0) return;

      const r = (inv?.recouvrement && typeof inv.recouvrement === "object") ? inv.recouvrement : {};
      const curLevel = Number(r?.relanceLevel) || 0;

      // seuils
      let targetLevel = 0;
      if(overdueDays >= 14) targetLevel = 3;
      else if(overdueDays >= 7) targetLevel = 2;
      else if(overdueDays >= 1) targetLevel = 1;

      if(targetLevel <= curLevel) return;

      const patch = { "recouvrement.relanceLevel": targetLevel, "invoiceUpdatedAt": serverTimestamp() };
      if(targetLevel >= 1 && !r?.relance1At) patch["recouvrement.relance1At"] = serverTimestamp();
      if(targetLevel >= 2 && !r?.relance2At) patch["recouvrement.relance2At"] = serverTimestamp();
      if(targetLevel >= 3 && !r?.relance3At) patch["recouvrement.relance3At"] = serverTimestamp();

      try{
        await updateDoc(doc(db,"salesDocuments",inv.id), patch);
        // maj local minimaliste
        inv.recouvrement = { ...(r||{}), relanceLevel: targetLevel };
      }catch(e){
        console.warn("auto relance update failed:", e?.message || e);
      }
    }

    function matchesSearch(inv){
      const q = (searchInput.value||"").trim().toLowerCase();
      if(!q) return true;
      const hay = [
        inv.invoiceNumber, inv.quoteNumber,
        inv.clientName, inv.clientEmail,
        inv.homeName, inv.homeCity, inv.homeAddress, inv.homeZip
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    }

    function matchesFilter(inv){
      const f = filterEl.value;
      const st = getInvoiceStatusRaw(inv);
      const totals = getTotals(inv);
      const paid = Number(inv?.paidAmount)||0;
      const dueAmt = Math.max(0, (Number(totals.ttc)||0) - paid);
      const { due } = computeDue(inv);
      const today = nowDayStart();
      const overdue = (today.getTime() - due.getTime()) > 0;

      if(f === "ALL") return true;
      if(f === "PAID") return ["PAID"].includes(st) || dueAmt <= 0;
      if(f === "OPEN") return dueAmt > 0 && !["CANCELLED","CREDITED"].includes(st);
      if(f === "OVERDUE") return dueAmt > 0 && overdue && !["CANCELLED","CREDITED","PAID"].includes(st);
      return true;
    }

    function render(list){
      listBox.innerHTML = "";
      const filtered = list.filter(inv => matchesFilter(inv) && matchesSearch(inv));

      if(!filtered.length){
        listBox.innerHTML = `
          <div class="card">
            <b>Aucune facture</b>
            <div class="mutedLine">Ajuste le filtre ou la recherche.</div>
          </div>`;
        return;
      }

      for(const inv of filtered){
        const created = inv?.createdAt ? fmtDateFR(inv.createdAt) : "—";
        const invNum = String(inv.invoiceNumber||"").trim() || "—";
        const client = String(inv.clientName || inv.ownerName || "—").trim();
        const home = String(inv.homeName || "—").trim();

        const totals = getTotals(inv);
        const paid = Number(inv?.paidAmount)||0;
        const dueAmt = Math.max(0, (Number(totals.ttc)||0) - paid);

        const stDisp = getInvoiceStatusDisplay(inv);
        const stRaw = getInvoiceStatusRaw(inv);

        const { dueLabel } = computeDue(inv);
        const rec = (inv?.recouvrement && typeof inv.recouvrement === "object") ? inv.recouvrement : {};
        const level = Number(rec?.relanceLevel)||0;

        const locked = ["PAID","CANCELLED","CREDITED"].includes(stRaw) || dueAmt <= 0;

        const openHref = `facture.html?docId=${encodeURIComponent(inv.id)}`;
        const payHref = `reglement.html?docId=${encodeURIComponent(inv.id)}`;
        const payListHref = `reglement-liste.html?docId=${encodeURIComponent(inv.id)}`;

        const div = document.createElement("div");
        div.className = "card" + (locked ? " rowDisabled" : "");
        div.innerHTML = `
          <div class="line">
            <div class="cell">
              <div class="t">Créée</div>
              <div class="v">${esc(created)}</div>
            </div>

            <div class="cell">
              <div class="t">N° facture</div>
              <div class="v">${esc(invNum)}</div>
            </div>

            <div class="cell">
              <div class="t">Client</div>
              <div class="v ellipsis" title="${esc(client)}">${esc(client)}</div>
            </div>

            <div class="cell">
              <div class="t">Logement</div>
              <div class="v ellipsis" title="${esc(home)}">${esc(home)}</div>
            </div>

            <div class="cell">
              <div class="t">Échéance</div>
              <div class="v">${esc(dueLabel)}</div>
            </div>

            <div class="cell" style="text-align:right;">
              <div class="t">Reste dû</div>
              <div class="v">${fmtMoney(dueAmt)}</div>
            </div>
          </div>

          <div class="sep"></div>

          <div style="display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:flex-start;">
            <div>
              <div class="cell">
                <div class="t">Statut</div>
                <div class="v">${badgeForStatus(stDisp)}</div>
              </div>
              <div class="cell" style="margin-top:8px;">
                <div class="t">Relances</div>
                <div class="v">${levelLabel(level)}</div>
              </div>
              ${rec?.miseEnDemeureAt ? `<div class="mutedLine">Mise en demeure : ${esc(fmtDateFR(rec.miseEnDemeureAt))}</div>` : ``}
            </div>

            <div class="actionsBar">
              <a class="btn primary" href="${openHref}">Ouvrir</a>
              <a class="btn" href="${payHref}" ${locked ? `aria-disabled="true"` : ``}>Ajouter règlement</a>
              <a class="btn" href="${payListHref}">Historique</a>
              <button class="btn warn" type="button" data-act="note" data-id="${esc(inv.id)}">Note</button>
              <button class="btn bad" type="button" data-act="md" data-id="${esc(inv.id)}" ${locked ? `disabled` : ``}>Mise en demeure</button>
            </div>
          </div>
        `;
        listBox.appendChild(div);
      }

      // events boutons
      listBox.querySelectorAll("button[data-act='md']").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const id = btn.getAttribute("data-id");
          if(!id) return;
          const inv = all.find(x=>x.id === id);
          if(!inv) return;

          const st = getInvoiceStatusRaw(inv);
          const totals = getTotals(inv);
          const paid = Number(inv?.paidAmount)||0;
          const dueAmt = Math.max(0, (Number(totals.ttc)||0) - paid);

          if(["PAID","CANCELLED","CREDITED"].includes(st) || dueAmt <= 0){
            return showAlert("Facture soldée/créditée/annulée : mise en demeure impossible.", false);
          }

          const ok = confirm("Marquer 'mise en demeure' (manuel) sur cette facture ?");
          if(!ok) return;

          try{
            await updateDoc(doc(db,"salesDocuments",id),{
              "recouvrement.miseEnDemeureAt": serverTimestamp(),
              "recouvrement.relanceLevel": 4,
              invoiceUpdatedAt: serverTimestamp()
            });
            showAlert("✅ Mise en demeure enregistrée.", true);
            await loadInvoices(currentUser.uid); // refresh
          }catch(e){
            console.error(e);
            showAlert("⛔ Erreur mise en demeure : " + (e?.message || "inconnue"));
          }
        });
      });

      listBox.querySelectorAll("button[data-act='note']").forEach(btn=>{
        btn.addEventListener("click", async ()=>{
          const id = btn.getAttribute("data-id");
          if(!id) return;
          const inv = all.find(x=>x.id === id);
          if(!inv) return;
          const current = String(inv?.recouvrement?.recouvrementNote || "").trim();
          const note = prompt("Note recouvrement (interne) :", current);
          if(note === null) return;

          try{
            await updateDoc(doc(db,"salesDocuments",id),{
              "recouvrement.recouvrementNote": String(note||"").trim(),
              invoiceUpdatedAt: serverTimestamp()
            });
            showAlert("✅ Note enregistrée.", true);
            await loadInvoices(currentUser.uid);
          }catch(e){
            console.error(e);
            showAlert("⛔ Erreur note : " + (e?.message || "inconnue"));
          }
        });
      });
    }

    async function loadCompanyVat(uid){
      try{
        const snap = await getDoc(doc(db, "users", uid));
        const data = snap.exists() ? (snap.data()||{}) : {};
        const vat = data?.businessProfile?.vat || {};
        vatEnabled = !!vat?.enabled;
        vatRate = Number.isFinite(Number(vat?.rate)) ? Number(vat.rate) : 0;
      }catch{
        vatEnabled = false; vatRate = 0;
      }
    }

    async function loadInvoices(uid){
      // IMPORTANT :
      // - idéal : where("type","==","INVOICE") + where("listable","==",true)
      // - fallback : si tes anciennes factures n'ont pas type/listable, elles ne remonteront pas.
      const qInv = query(
        collection(db,"salesDocuments"),
        where("conciergerieUid","==",uid),
        where("type","==","INVOICE"),
        where("listable","==",true),
        orderBy("createdAt","desc"),
        limit(400)
      );

      const snap = await getDocs(qInv);
      all = snap.docs.map(d => ({ id:d.id, ...(d.data()||{}) }));
      // auto-relances (séquentiel volontaire : simple + évite d'exploser Firestore)
      for(const inv of all){
        await maybeAutoRelance(inv);
      }
      render(all);
    }

    filterEl.addEventListener("change", ()=> render(all));
    searchInput.addEventListener("input", ()=> render(all));
    refreshBtn.addEventListener("click", ()=> loadInvoices(currentUser.uid));

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href="login.html?role=conciergerie"; return; }
      currentUser = user;

      hideAlert();
      try{
        await loadCompanyVat(user.uid);
        await loadInvoices(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur recouvrement : " + (e?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
