<!-- docs/intervention.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Intervention</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --violet-light:#F3ECFF;

      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.86);
    }
    *,*::before,*::after{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; }
    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main);
      color:var(--violet-main); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff;
    }
    .wrap{
      width:100%; max-width:980px; margin-top:10px;
      display:grid; grid-template-columns:1fr; gap:10px;
    }
    @media(min-width:900px){ .wrap{ grid-template-columns: 1.2fr .8fr; } }
    .card{
      background:var(--card); border:1px solid var(--border);
      border-radius:18px; box-shadow:var(--shadow);
      backdrop-filter:blur(10px); padding:12px;
      display:flex; flex-direction:column; gap:10px;
    }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; }
    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:14px;
      background:#fff; border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }
    .chip{
      display:inline-flex; align-items:center; gap:6px;
      padding:4px 9px; border-radius:999px;
      background:rgba(122,92,255,0.12); color:#5b45c8;
      font-size:11px; font-weight:900;
    }
    .chip.ok{ background:rgba(27,143,77,0.16); color:var(--ok); }
    .chip.bad{ background:rgba(179,38,30,0.14); color:var(--bad); }

    label.mini{ display:block; margin-top:10px; }
    input, textarea{
      width:100%; padding:10px; border-radius:12px;
      border:1px solid #D3C7FF; background:#fff;
      font-size:13px; outline:none;
    }
    textarea{ resize:vertical; }
    .btnrow{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

    .line{
      background:#fff; border-radius:14px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px;
      display:flex; flex-direction:column; gap:6px;
    }
    .line .t{ font-weight:900; font-size:13px; color:#222; }
    .line .s{ font-size:12px; font-weight:800; color:#666; }
    .line .n{ font-size:12px; font-weight:800; color:#444; white-space:pre-wrap; }
    .total-box{
      padding:10px 12px; background:#fff; border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      border:1px solid rgba(122,92,255,0.18);
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      font-weight:900;
    }
    .total-box .mut{ font-weight:800; color:#666; }

    /* ===== Modal (copié/harmonisé depuis prestations.html) ===== */
    .modal-backdrop{
      position:fixed; inset:0; background:rgba(0,0,0,.28);
      display:none; align-items:center; justify-content:center;
      z-index:200; padding:16px;
    }
    .modal{
      width:100%; max-width:640px;
      background:#fff; border-radius:18px;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 20px 60px rgba(0,0,0,.18);
      max-height:86vh; overflow:hidden;
      display:flex; flex-direction:column;
    }
    .modal-head{
      padding:12px 12px 8px;
      border-bottom:1px solid rgba(122,92,255,0.12);
      background:rgba(255,255,255,0.92);
    }
    .modal-head-top{
      display:flex; align-items:center; justify-content:space-between; gap:10px;
    }
    .modal-head h3{ margin:0; font-size:15px; font-weight:900; }
    .modal-sub{
      margin:6px 0 0; color:#666;
      font-size:12px; font-weight:800; line-height:1.3; white-space:pre-wrap;
    }
    .modal-body{ padding:10px 12px; overflow:auto; }
    .context-box{
      background:#fff; border:1px solid rgba(122,92,255,0.18);
      border-radius:16px; padding:10px;
      display:grid; gap:6px;
    }
    .ctx-row{
      display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap;
    }
    .ctx-row .k{ font-weight:900; }
    .ctx-row .v{ font-weight:800; color:#333; text-align:right; }
    .modal-foot{
      padding:10px 12px;
      border-top:1px solid rgba(122,92,255,0.12);
      background:rgba(255,255,255,0.92);
      display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap;
    }
    .miniBtn{
      border-radius:999px; padding:7px 10px;
      font-size:12px; font-weight:900;
      border:2px solid var(--violet-main);
      background:#fff; color:var(--violet-main);
      cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .miniBtn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="prestations.html">← Retour</a>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="pill" id="openDetailBtn" type="button" disabled>Détails</button>
        <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
      </div>
    </div>

    <div style="width:100%;max-width:980px;margin-top:8px;">
      <div class="sub" id="subLine">Chargement…</div>
      <div class="alert" id="alertBox"></div>
    </div>

    <div class="wrap">
      <!-- Gauche : aperçu + lignes + statut missions -->
      <section class="card">
        <div class="mini">Prestation</div>

        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;">
          <div style="min-width:240px;">
            <div style="margin-top:6px;font-weight:900;font-size:14px;" id="homeLine">—</div>
            <div class="mini" id="metaLine" style="margin-top:4px;">—</div>
            <div class="mini" id="addrLine" style="margin-top:6px;">—</div>
          </div>

          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
            <span class="chip" id="chipStatus">—</span>
            <span class="chip" id="chipTotal">Total: —</span>
          </div>
        </div>

        <div style="height:6px"></div>

        <div class="mini">Lignes</div>
        <div id="linesBox" style="display:flex;flex-direction:column;gap:8px;"></div>

        <div class="total-box" style="margin-top:8px;">
          <div class="mut">Total</div>
          <div id="totalValue">0,00 €</div>
        </div>

        <div style="height:6px"></div>
        <div class="mini">Missions (diagnostic)</div>
        <div id="missionsList" style="margin-top:6px;display:flex;flex-direction:column;gap:6px;"></div>
      </section>

      <!-- Droite : lien agent -->
      <aside class="card">
        <div style="font-weight:900;">Lien agent</div>

        <label class="mini">Nom agent</label>
        <input id="agentName" type="text" placeholder="Ex. Carla" />

        <label class="mini">Email agent</label>
        <input id="agentEmail" type="email" placeholder="ex. agent@email.com" />

        <div class="btnrow" style="margin-top:10px;">
          <button class="pill primary" id="genLinkBtn" type="button">Générer lien</button>
          <button class="pill" id="copyBtn" type="button" disabled>Copier</button>
          <button class="pill" id="mailtoBtn" type="button" disabled>Envoyer email</button>
        </div>

        <textarea id="linkBox" rows="4" style="margin-top:8px;" readonly placeholder="Le lien apparaîtra ici…"></textarea>

        <div class="mini" style="margin-top:10px;">
          Token 24h. L’agent ne doit modifier que checklist / commentaires / terminer (selon tes rules).
        </div>
      </aside>
    </div>
  </div>

  <!-- MODALE DÉTAIL (reprend le look de prestations.html) -->
  <div class="modal-backdrop" id="detailBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-head-top">
          <h3>Détail prestation</h3>
          <button class="miniBtn" id="detailCloseBtn" type="button">Fermer</button>
        </div>
        <p class="modal-sub" id="detailModalSub">—</p>
      </div>

      <div class="modal-body">
        <div class="context-box" id="detailModalContext"></div>

        <div style="height:10px"></div>

        <div id="detailModalLines" style="display:flex;flex-direction:column;gap:8px;"></div>

        <div class="total-box" style="margin-top:10px;">
          <div class="mut">Total</div>
          <div id="detailModalTotalValue">0,00 €</div>
        </div>
      </div>

      <div class="modal-foot">
        <button class="miniBtn primary" id="detailGoPrestationsBtn" type="button">Ouvrir dans Prestations</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc, serverTimestamp, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ===== UI
    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const homeLine = document.getElementById("homeLine");
    const metaLine = document.getElementById("metaLine");
    const addrLine = document.getElementById("addrLine");
    const linesBox = document.getElementById("linesBox");
    const missionsList = document.getElementById("missionsList");
    const totalValue = document.getElementById("totalValue");
    const chipStatus = document.getElementById("chipStatus");
    const chipTotal = document.getElementById("chipTotal");

    const agentName = document.getElementById("agentName");
    const agentEmail = document.getElementById("agentEmail");
    const genLinkBtn = document.getElementById("genLinkBtn");
    const copyBtn = document.getElementById("copyBtn");
    const mailtoBtn = document.getElementById("mailtoBtn");
    const linkBox = document.getElementById("linkBox");

    const logoutBtn = document.getElementById("logoutBtn");
    const openDetailBtn = document.getElementById("openDetailBtn");

    // modal
    const detailBackdrop = document.getElementById("detailBackdrop");
    const detailCloseBtn = document.getElementById("detailCloseBtn");
    const detailModalSub = document.getElementById("detailModalSub");
    const detailModalContext = document.getElementById("detailModalContext");
    const detailModalLines = document.getElementById("detailModalLines");
    const detailModalTotalValue = document.getElementById("detailModalTotalValue");
    const detailGoPrestationsBtn = document.getElementById("detailGoPrestationsBtn");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
    }
    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0)*(Number(l?.unitPrice)||0), 0);
    }
    function normalizeEmail(s){ return (s||"").trim().toLowerCase(); }
    function randomToken(len=20){
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      let out = "";
      for(const n of arr) out += chars[n % chars.length];
      return out;
    }

    function openDetailModal(){ detailBackdrop.style.display = "flex"; }
    function closeDetailModal(){ detailBackdrop.style.display = "none"; }

    detailBackdrop.addEventListener("click", (e)=>{ if(e.target === detailBackdrop) closeDetailModal(); });
    detailCloseBtn.addEventListener("click", closeDetailModal);

    // ===== State
    const prestationId = qs("prestationId");
    let currentUser = null;
    let currentEvent = null;

    function renderLines(lines){
      linesBox.innerHTML = "";
      if(!Array.isArray(lines) || !lines.length){
        linesBox.innerHTML = `<div class="mini">Aucune ligne.</div>`;
        return;
      }
      for(const l of lines){
        const lineTotal = (Number(l.qty)||0) * (Number(l.unitPrice)||0);
        const div = document.createElement("div");
        div.className = "line";
        div.innerHTML = `
          <div class="t">${esc(l.label || "Ligne")}</div>
          <div class="s">${esc(`${Number(l.qty||0)} ${l.unit || "unité"} • ${money(l.unitPrice)} / ${l.unit || "unité"} • total ${money(lineTotal)}`)}</div>
          ${l.note ? `<div class="n">${esc(l.note)}</div>` : ``}
        `;
        linesBox.appendChild(div);
      }
    }

    function renderDetailModal(e){
      const title = `${e.homeName || "Logement"}${e.homeCity ? " — " + e.homeCity : ""}${e.homeType ? " ("+e.homeType+")" : ""}`;
      const arrival = (e.arrivalDateKey || e.dateKey || e.date || "")
        ? `${e.arrivalDateKey || e.dateKey || e.date || ""}${e.arrivalTime || e.time ? " • " + (e.arrivalTime || e.time) : ""}`
        : "—";
      const departure = e.departureDateKey
        ? `${e.departureDateKey}${e.departureTime ? " • " + e.departureTime : ""}`
        : "—";
      const addr = [e.homeAddress || e.address || "", e.homeZip || e.zip || ""].filter(Boolean).join(" ").trim() || "—";
      const owner = [e.ownerName || "", e.ownerPhone || e.phone || ""].filter(Boolean).join(" • ") || "—";

      const lines = Array.isArray(e.lines) ? e.lines : [];
      const total = (e.total != null) ? Number(e.total) : computeTotalFromLines(lines);

      detailModalSub.textContent = `#${String(prestationId).slice(0,6)} • ${String(e.opStatus || e.status || "—")}`;
      detailModalContext.innerHTML = `
        <div class="ctx-row"><div class="k">Logement :</div><div class="v">${esc(title)}</div></div>
        <div class="ctx-row"><div class="k">Arrivée :</div><div class="v">${esc(arrival || "—")}</div></div>
        <div class="ctx-row"><div class="k">Départ :</div><div class="v">${esc(departure || "—")}</div></div>
        <div class="ctx-row"><div class="k">Adresse :</div><div class="v">${esc(addr)}</div></div>
        <div class="ctx-row"><div class="k">Propriétaire :</div><div class="v">${esc(owner)}</div></div>
      `;

      detailModalLines.innerHTML = "";
      if(!lines.length){
        detailModalLines.innerHTML = `<div class="mini">Aucune ligne enregistrée.</div>`;
      }else{
        for(const l of lines){
          const lineTotal = (Number(l.qty)||0) * (Number(l.unitPrice)||0);
          const box = document.createElement("div");
          box.className = "line";
          box.innerHTML = `
            <div class="t">${esc(l.label || "Ligne")}</div>
            <div class="s">${esc(`${Number(l.qty||0)} ${l.unit || "unité"} • ${money(l.unitPrice)} / ${l.unit || "unité"} • total ${money(lineTotal)}`)}</div>
            ${l.note ? `<div class="n">${esc(l.note)}</div>` : ``}
          `;
          detailModalLines.appendChild(box);
        }
      }

      detailModalTotalValue.textContent = money(total);
    }

    async function load(){
      hideAlert();
      subLine.textContent = "Chargement…";
      openDetailBtn.disabled = true;

      if(!prestationId){
        subLine.textContent = "";
        return showAlert("prestationId manquant (URL).");
      }

      const eSnap = await getDoc(doc(db, "events", prestationId));
      if(!eSnap.exists()){
        subLine.textContent = "";
        return showAlert("Prestation introuvable.");
      }

      const e = eSnap.data() || {};
      currentEvent = { id: eSnap.id, ...e };

      const lines = Array.isArray(e.lines) ? e.lines : [];
      const total = (e.total != null) ? Number(e.total) : computeTotalFromLines(lines);

      homeLine.textContent = e.homeName || "Logement";
      metaLine.textContent = `${e.arrivalDateKey || e.dateKey || e.date || "—"} ${e.arrivalTime || e.time || ""}`.trim();
      addrLine.textContent = e.homeAddress || e.address || "";
      totalValue.textContent = money(total);
      chipTotal.textContent = "Total: " + money(total);

      chipStatus.textContent = String(e.opStatus || e.status || "—").toUpperCase();

      renderLines(lines);

      // missions (simple diagnostic)
      missionsList.innerHTML = "";
      const TYPES = ["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"];
      for(const t of TYPES){
        try{
          const mSnap = await getDoc(doc(db,"events",prestationId,"missions",t));
          if(mSnap.exists()){
            const d = mSnap.data() || {};
            const div = document.createElement("div");
            div.className = "mini";
            div.textContent = `• ${t} — locked: ${String(!!d.locked)} — status: ${String(d.status || "—")}`;
            missionsList.appendChild(div);
          }
        }catch(_){}
      }
      if(!missionsList.children.length){
        missionsList.innerHTML = `<div class="mini">Aucune mission (ou rules bloquent la lecture).</div>`;
      }

      // agent fields
      agentName.value = e.assignedToName || "";
      agentEmail.value = e.assignedToEmail || "";

      // boutons lien
      copyBtn.disabled = !linkBox.value;
      mailtoBtn.disabled = !linkBox.value;

      subLine.textContent = "";
      openDetailBtn.disabled = false;
    }

    async function generateLink(){
      hideAlert();

      if(!currentEvent) return showAlert("Prestation non chargée.");
      if(!currentUser) return showAlert("Utilisateur non authentifié.");

      const email = normalizeEmail(agentEmail.value);
      const name = (agentName.value || "").trim();
      if(!email || !name) return showAlert("Nom + email agent requis.");
      if(!/^\S+@\S+\.\S+$/.test(email)) return showAlert("Email agent invalide.");

      const tokenId = randomToken(20);
      const expiresAtMs = Date.now() + 24*60*60*1000;
      const expiresAt = Timestamp.fromMillis(expiresAtMs);

      // dayToken
      await setDoc(doc(db,"dayTokens",tokenId),{
        conciergerieUid: currentUser.uid,
        prestationId: String(prestationId),
        agentEmail: email,
        agentName: name,
        missionTypes: ["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"],
        active:true,
        expiresAt,
        expiresAtMs,
        createdAt: serverTimestamp()
      });

      // backfill missions (création si absent)
      for (const t of ["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"]) {
        await setDoc(doc(db, "events", prestationId, "missions", t), {
          type: t,
          conciergerieUid: currentUser.uid,
          prestationId: String(prestationId),

          locked: false,
          agentDone: false,
          photos: [],
          status: "ASSIGNEE",

          dayToken: tokenId,
          assignedToEmail: email,
          assignedToName: name,
          updatedAt: serverTimestamp()
        }, { merge: true });
      }

      // event (merge)
      await setDoc(doc(db,"events",prestationId),{
        assignedToEmail: email,
        assignedToName: name,
        dayToken: tokenId,
        updatedAt: serverTimestamp()
      }, { merge:true });

      const base = location.href.split("?")[0];
      const link =
        base.replace("intervention.html","agent.html")
        + `?token=${encodeURIComponent(tokenId)}&prestationId=${encodeURIComponent(prestationId)}`;

      linkBox.value = link;
      copyBtn.disabled = false;
      mailtoBtn.disabled = false;

      showAlert("Lien agent généré.", true);
      await load();
    }

    // ===== Events
    openDetailBtn.addEventListener("click", ()=>{
      if(!currentEvent) return;
      renderDetailModal(currentEvent);
      openDetailModal();
    });

    detailGoPrestationsBtn.addEventListener("click", ()=>{
      // ouvre prestations + auto-open sur l’item si tu gères ?open=
      location.href = `prestations.html?open=${encodeURIComponent(prestationId)}`;
    });

    genLinkBtn.addEventListener("click", async ()=>{
      genLinkBtn.disabled = true;
      genLinkBtn.textContent = "…";
      try{
        await generateLink();
      }catch(err){
        console.error(err);
        showAlert("Erreur génération lien : " + (err?.code || err?.message || "inconnue"));
      }finally{
        genLinkBtn.disabled = false;
        genLinkBtn.textContent = "Générer lien";
      }
    });

    copyBtn.addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText(linkBox.value || "");
        showAlert("Lien copié.", true);
      }catch{
        showAlert("Copie impossible (clipboard). Copie manuelle.");
      }
    });

    mailtoBtn.addEventListener("click", ()=>{
      const to = normalizeEmail(agentEmail.value);
      const name = (agentName.value || "").trim();
      if(!to) return showAlert("Email agent manquant.");
      if(!linkBox.value) return showAlert("Génère d’abord le lien.");

      const subject = encodeURIComponent("Mission CleanUp — lien agent");
      const body = encodeURIComponent(
        `Bonjour ${name || ""},\n\n` +
        `Voici ton lien pour exécuter la mission :\n\n` +
        `${linkBox.value}\n\n` +
        `⚠️ Le lien/token expire sous 24h.\n\n` +
        `— CleanUp Manager`
      );
      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      location.href="index.html";
    });

    // ===== Boot
    onAuthStateChanged(auth, async (u)=>{
      if(!u) return location.href="login.html";
      currentUser = u;
      try{ await load(); }
      catch(err){
        console.error(err);
        showAlert("Erreur chargement intervention : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
