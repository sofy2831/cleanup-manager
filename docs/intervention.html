<!-- docs/intervention.html (COMPLET corrigé)
     - crée dayTokens avec expiresAt TIMESTAMP (plus de string ISO)
     - crée 3 missions sous events/{prestationId}/missions/{CHECKIN|MENAGE|CHECKOUT}
     - conciergerieUid partout
-->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Intervention</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF; --violet-dark:#6238FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF; --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 36px; }
    .topbar{
      width:100%; max-width:980px; position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter: blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main); color:var(--violet-main);
      text-decoration:none; font-weight:900; font-size:13px; white-space:nowrap; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .pill.primary{ background:linear-gradient(90deg,var(--violet-main),var(--violet-dark)); border-color:transparent; color:#fff; }

    .logo{
      display:flex; justify-content:center; align-items:center; gap:10px; margin-top:8px; margin-bottom:4px; text-align:center;
    }
    .logo-icon{
      width:42px;height:42px;border-radius:50%; background:#fff; border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center; color:var(--violet-main); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:13px; color:#444; text-align:center; font-weight:800; }

    .alert{
      width:100%; max-width:980px; display:none; margin-top:10px; padding:10px 12px; background:#fff;
      border-radius:14px; border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .layout{
      width:100%; max-width:980px; margin-top:12px;
      display:grid; grid-template-columns:1fr; gap:12px;
    }
    @media(min-width:920px){ .layout{ grid-template-columns:1.1fr .9fr; } }

    .card{
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 12px;
      display:flex; flex-direction:column; gap:10px;
    }
    .card-title{ font-size:15px; font-weight:900; color:#111; display:flex; justify-content:space-between; gap:10px; align-items:flex-end; flex-wrap:wrap; }
    .small{ font-size:12px; color:var(--muted); font-weight:900; }
    .kv{ display:grid; grid-template-columns:1fr; gap:8px; font-size:13px; font-weight:800; color:#333; }
    .kv b{ font-weight:900; }

    label{ display:block; font-size:12px; font-weight:900; color:#333; margin:8px 0 4px; }
    input, textarea{
      width:100%; padding:10px 12px; border-radius:12px; border:1px solid #D3C7FF;
      font-size:14px; outline:none; background:#fff; font-weight:800; color:#222;
    }
    input:focus, textarea:focus{ border-color:var(--violet-main); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .row > div{ flex:1; min-width:220px; }

    .btnRow{ display:flex; gap:8px; flex-wrap:wrap; }
    .btn{
      flex:1;
      border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:900; cursor:pointer;
      background:#fff; color:var(--violet-main); border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }
    .btn.primary{ background:linear-gradient(90deg,var(--violet-main),var(--violet-dark)); border-color:transparent; color:#fff; box-shadow:0 12px 24px rgba(0,0,0,0.10); }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-weight:900;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="planning.html">← Retour planning</a>
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>

    <div class="logo">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>
    <div class="subtitle">Intervention</div>

    <div class="alert" id="alertBox"></div>

    <div class="layout">
      <section class="card">
        <div class="card-title">
          <span>Récap prestation</span>
          <span class="small" id="prestaIdLine">—</span>
        </div>

        <div class="kv" id="recapKv"></div>

        <div class="btnRow">
          <button class="btn" id="openPrestaBtn" type="button">Ouvrir la prestation</button>
          <button class="btn primary" id="createBtn" type="button">Générer lien agent + missions</button>
        </div>
        <div class="small">
          Ça crée : 1 token (24h) + 3 missions (CHECKIN/MENAGE/CHECKOUT).
        </div>
      </section>

      <section class="card">
        <div class="card-title">
          <span>Envoi agent</span>
          <span class="small">email + lien</span>
        </div>

        <div class="row">
          <div>
            <label for="agentName">Nom agent</label>
            <input id="agentName" placeholder="Ex. DAVID" />
          </div>
          <div>
            <label for="agentEmail">Email agent</label>
            <input id="agentEmail" type="email" placeholder="agent@email.com" />
          </div>
        </div>

        <label for="conciergerieName">Nom conciergerie (pour le mail)</label>
        <input id="conciergerieName" placeholder="Ex. Conciergerie Machin" />

        <label for="agentLink">Lien agent</label>
        <input id="agentLink" class="mono" readonly placeholder="(généré après création)" />

        <div class="btnRow">
          <button class="btn" id="copyBtn" type="button" disabled>Copier le lien</button>
          <button class="btn primary" id="mailBtn" type="button" disabled>Ouvrir mail</button>
        </div>

        <div class="small" id="tokenMeta">—</div>
      </section>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc, updateDoc, serverTimestamp, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // UI
    const alertBox = document.getElementById("alertBox");
    const logoutBtn = document.getElementById("logoutBtn");

    const prestaIdLine = document.getElementById("prestaIdLine");
    const recapKv = document.getElementById("recapKv");
    const openPrestaBtn = document.getElementById("openPrestaBtn");
    const createBtn = document.getElementById("createBtn");

    const agentNameEl = document.getElementById("agentName");
    const agentEmailEl = document.getElementById("agentEmail");
    const conciergerieNameEl = document.getElementById("conciergerieName");

    const agentLinkEl = document.getElementById("agentLink");
    const copyBtn = document.getElementById("copyBtn");
    const mailBtn = document.getElementById("mailBtn");
    const tokenMeta = document.getElementById("tokenMeta");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
        .replaceAll('"',"&quot;").replaceAll("'","&#039;");
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    // URL params : intervention.html?prestationId=EVENT_ID
    const prestationId = getParam("prestationId");
    prestaIdLine.textContent = prestationId ? ("prestationId: " + prestationId) : "prestationId manquant";

    let currentUser = null;
    let eventData = null;

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      location.href = "index.html";
    });

    openPrestaBtn.addEventListener("click", ()=>{
      if(!prestationId) return;
      location.href = `prestations.html?eventId=${encodeURIComponent(prestationId)}`;
    });

    function renderRecap(){
      const d = eventData || {};
      const rows = [];
      rows.push(`<div><b>Logement</b> : ${esc((d.homeName||"") + (d.homeCity ? (" — " + d.homeCity) : "")) || "—"}</div>`);
      rows.push(`<div><b>Date</b> : ${esc(d.dateKey || d.date || "—")}</div>`);
      rows.push(`<div><b>Heure</b> : ${esc(d.time || "—")}</div>`);
      rows.push(`<div><b>Prestation</b> : ${esc(d.serviceName || d.type || "—")}</div>`);
      if(d.meta) rows.push(`<div><b>Détail</b> : ${esc(d.meta)}</div>`);
      if(d.ownerName) rows.push(`<div><b>Propriétaire</b> : ${esc(d.ownerName)}${d.ownerEmail ? " • " + esc(d.ownerEmail) : ""}</div>`);
      recapKv.innerHTML = rows.join("");

      if(d.assignedToName && !agentNameEl.value) agentNameEl.value = d.assignedToName;
      if(d.assignedToEmail && !agentEmailEl.value) agentEmailEl.value = d.assignedToEmail;

      createBtn.disabled = false;
    }

    function randomToken(len=18){
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let out = "";
      crypto.getRandomValues(new Uint8Array(len)).forEach(b=>{
        out += chars[b % chars.length];
      });
      return out;
    }

    function expiresIn24hTimestamp(){
      return Timestamp.fromDate(new Date(Date.now() + 24*60*60*1000));
    }

    function lockUI(locked){
      createBtn.disabled = !!locked;
      createBtn.textContent = locked ? "Création…" : "Générer lien agent + missions";
      copyBtn.disabled = locked || !agentLinkEl.value;
      mailBtn.disabled = locked || !agentLinkEl.value;
      openPrestaBtn.disabled = !!locked;
    }

    async function createTokenAndMissions(){
      hideAlert();

      if(!currentUser) return showAlert("Non connecté.");
      if(!prestationId) return showAlert("prestationId manquant.");

      const agentName = (agentNameEl.value || "").trim();
      const agentEmail = normalizeEmail(agentEmailEl.value);
      const concName = (conciergerieNameEl.value || "").trim();

      if(!agentName) return showAlert("Nom agent obligatoire.");
      if(!agentEmail || !/^\S+@\S+\.\S+$/.test(agentEmail)) return showAlert("Email agent invalide.");

      lockUI(true);

      try{
        // 1) token
        const tokenId = randomToken(20);
        const expiresAt = expiresIn24hTimestamp();

        await setDoc(doc(db, "dayTokens", tokenId), {
          conciergerieUid: currentUser.uid,
          prestationId,
          agentEmail,
          agentName,
          active: true,
          expiresAt,
          createdAt: serverTimestamp()
        });

        // 2) missions (base)
        const e = eventData || {};
        const base = {
          conciergerieUid: currentUser.uid,
          prestationId,
          dayToken: tokenId,

          assignedToEmail: agentEmail,
          assignedToName: agentName,

          homeName: e.homeName || "",
          homeCity: e.homeCity || "",
          homeAddress: e.homeAddress || "",
          dateKey: e.dateKey || e.date || "",
          time: e.time || "",

          locked: false,
          status: "ASSIGNEE",
          checklist: {},
          updatedAt: serverTimestamp(),
          createdAt: serverTimestamp()
        };

        await setDoc(doc(db, "events", prestationId, "missions", "CHECKIN"),  { ...base, type:"CHECKIN"  });
        await setDoc(doc(db, "events", prestationId, "missions", "MENAGE"),   { ...base, type:"MENAGE"   });
        await setDoc(doc(db, "events", prestationId, "missions", "CHECKOUT"), { ...base, type:"CHECKOUT" });

        // 3) update event
        await updateDoc(doc(db, "events", prestationId), {
          assignedToEmail: agentEmail,
          assignedToName: agentName,
          conciergerieName: concName || (e.conciergerieName || ""),
          status: e.status || "EN_COURS",
          updatedAt: serverTimestamp()
        });

        // 4) lien agent
        const url = new URL(location.href);
        url.pathname = url.pathname.replace(/intervention\.html$/i, "agent.html");
        url.search = "";
        url.searchParams.set("token", tokenId);

        agentLinkEl.value = url.toString();
        copyBtn.disabled = false;
        mailBtn.disabled = false;

        tokenMeta.textContent = `Token: ${tokenId} • expire dans 24h`;

        showAlert("✅ Token + 3 missions créés.", true);

      }catch(err){
        console.error(err);
        showAlert("Erreur création : " + (err?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    }

    createBtn.addEventListener("click", createTokenAndMissions);

    copyBtn.addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText(agentLinkEl.value || "");
        showAlert("✅ Lien copié.", true);
      }catch{
        showAlert("Copie impossible. Sélectionne le lien et Ctrl+C.");
      }
    });

    mailBtn.addEventListener("click", ()=>{
      const link = agentLinkEl.value || "";
      if(!link) return;

      const agentName = (agentNameEl.value || "").trim();
      const agentEmail = normalizeEmail(agentEmailEl.value);
      const concName = (conciergerieNameEl.value || "").trim() || "votre conciergerie";
      const d = eventData || {};

      const subject = `Mission CleanUp — ${d.homeName || "Logement"} ${d.dateKey || d.date || ""}`;
      const lines = [
        `Bonjour ${agentName},`,
        ``,
        `Voici votre lien d’accès aux missions pour ${concName} :`,
        link,
        ``,
        `Prestation : ${d.homeName || "Logement"}${d.homeCity ? " — " + d.homeCity : ""}`,
        `Date : ${d.dateKey || d.date || "—"}${d.time ? " à " + d.time : ""}`,
        ``,
        `Merci.`
      ];

      const mailto = `mailto:${encodeURIComponent(agentEmail)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(lines.join("\n"))}`;
      location.href = mailto;
    });

    async function loadEvent(){
      if(!prestationId) throw new Error("prestationId manquant. Exemple : intervention.html?prestationId=XXXX");
      const snap = await getDoc(doc(db, "events", prestationId));
      if(!snap.exists()) throw new Error("Prestation introuvable.");
      eventData = { id: snap.id, ...snap.data() };
      renderRecap();
    }

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = user;

      try{
        // pré-remplir conciergerieName depuis users/{uid}
        try{
          const uSnap = await getDoc(doc(db, "users", currentUser.uid));
          if(uSnap.exists()){
            const u = uSnap.data() || {};
            const nm = (u.conciergerieName || u.displayName || u.name || "").toString().trim();
            if(nm && !conciergerieNameEl.value) conciergerieNameEl.value = nm;
          }
        }catch{}

        await loadEvent();
      }catch(e){
        showAlert("⛔ " + (e?.message || "Erreur chargement"), false);
      }
    });
  </script>
</body>
</html>
