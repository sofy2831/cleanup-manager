<!-- docs/intervention.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Intervention</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.86);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; }
    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    /* Logo like other pages */
    .logo-title{
      width:100%;
      max-width:980px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      margin-top:6px;
      margin-bottom:6px;
      text-align:center;
    }
    .logo-icon{
      width:38px;height:38px;border-radius:50%;
      background:#fff;
      border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet);
      font-size:20px;font-weight:900;
      position:relative;
      flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-4px;
      font-size:12px;
      color:var(--violet);
    }
    .logo-title h1{
      margin:0;
      font-size:22px;
      font-weight:900;
      letter-spacing:-0.2px;
    }
    .subtitle{
      width:100%;
      max-width:980px;
      text-align:center;
      margin-top:-2px;
      font-size:14px;
      font-weight:900;
      color:#444;
    }

    .wrap{ width:100%; max-width:980px; margin-top:10px; display:grid; grid-template-columns:1fr; gap:10px; }
    @media(min-width:900px){ .wrap{ grid-template-columns: 1.2fr .8fr; } }
    .card{ background:var(--card); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow); backdrop-filter:blur(10px); padding:12px; }
    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; }
    .alert{ display:none; margin-top:10px; padding:10px 12px; border-radius:14px; background:#fff; border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06); font-size:12px; font-weight:800; color:#444; white-space:pre-wrap; }
    .alert.ok{ border-left-color:var(--ok); }
    .row{ display:flex; gap:10px; flex-wrap:wrap; }
    .row > div{ flex:1; min-width:220px; }
    label{ display:block; margin:8px 0 4px; font-size:12px; font-weight:900; color:#333; }
    input, textarea{
      width:100%; padding:10px; border-radius:12px; border:1px solid #D3C7FF; background:#fff;
      font-size:13px; outline:none;
    }
    textarea{ resize:vertical; }
    input:focus, textarea:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }
    .btn{ border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:900; cursor:pointer; }
    .btn.primary{ color:#fff; background:linear-gradient(90deg,var(--violet),var(--violet2)); box-shadow:0 10px 22px rgba(0,0,0,0.10); }
    .btn.ghost{ background:#fff; color:var(--violet); border:2px solid var(--violet); box-shadow:0 3px 10px rgba(0,0,0,.06); }
    .btn.danger{ background:#ffe3ec; color:var(--bad); border:2px solid #ffc2d6; box-shadow:0 3px 10px rgba(0,0,0,.06); }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:12px; }
    .chip{ display:inline-flex; align-items:center; gap:6px; padding:4px 9px; border-radius:999px; background:rgba(122,92,255,0.12); color:#5b45c8; font-size:11px; font-weight:900; }
    .chip.ok{ background:rgba(27,143,77,0.16); color:var(--ok); }
    .chip.bad{ background:rgba(179,38,30,0.14); color:var(--bad); }
    .list{ display:flex; flex-direction:column; gap:8px; margin-top:8px; }
    .item{ background:#fff; border-radius:14px; border:1px solid rgba(0,0,0,0.03); box-shadow:0 3px 10px rgba(0,0,0,.06); padding:10px; }
    .item-top{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .item-title{ font-size:13px; font-weight:900; color:#222; }
    .item-sub{ margin-top:4px; font-size:12px; font-weight:800; color:#666; white-space:pre-wrap; }

    .addrBox{
      margin-top:8px;
      padding:10px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .addrBox .t{ font-size:12px; font-weight:900; color:#222; }
    .addrBox .v{ margin-top:4px; font-size:12px; font-weight:800; color:#444; white-space:pre-wrap; }
 
 

  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="planning.html">← Planning</a>
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>

    <div class="logo-title">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>
    <div class="subtitle">Intervention</div>

    <div style="width:100%;max-width:980px;margin-top:8px;">
      <div class="sub" id="subLine">Chargement…</div>
      <div class="alert" id="alertBox"></div>
    </div>

    <div class="wrap">
      <!-- LEFT -->
      <section class="card">
        <div class="row" style="align-items:flex-end;">
          <div style="flex:1;min-width:280px;">
            <div class="mini">Prestation</div>
            <div style="margin-top:6px;font-weight:900;font-size:14px;" id="homeLine">—</div>
            <div class="mini" id="metaLine" style="margin-top:4px;">—</div>

            <div class="addrBox">
              <div class="t">Adresse</div>
              <div class="v" id="addrLine">—</div>
            </div>
          </div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;">
            <button class="btn ghost" id="refreshBtn" type="button">Rafraîchir</button>
            <button class="btn danger" id="backBtn" type="button">Retour</button>
          </div>
        </div>

        <div class="list" id="missionsList"></div>

        <div style="margin-top:10px;" class="mini">
          Missions stockées ici :
          <span class="mono">events/{eventId}/missions/{MISSION_TYPE}</span>
          <br>
          Mission types possibles : <span class="mono">CHECKIN, MENAGE, CHECKOUT, LINGE, MAINTENANCE, KITS</span>
        </div>
      </section>

      <!-- RIGHT -->
      <aside class="card">
        <div style="font-weight:900;">Agent (lien email)</div>
        <div class="mini" style="margin-top:4px;">Token 24h </div>

        <div class="row">
          <div>
            <label>Nom agent</label>
            <input id="agentName" type="text" placeholder="Ex. Carla" />
          </div>
          <div>
            <label>Email agent</label>
            <input id="agentEmail" type="email" placeholder="ex. agent@email.com" />
          </div>
        </div>

        <label>Nom conciergerie (optionnel dans le mail)</label>
        <input id="conciergerieName" type="text" placeholder="Ex. Conciergerie ROSE" />

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
          <button class="btn primary" id="genLinkBtn" type="button">Générer lien agent</button>
          <button class="btn ghost" id="copyBtn" type="button" disabled>Copier</button>
        </div>

        <label style="margin-top:10px;">Lien</label>
        <textarea id="linkBox" rows="4" placeholder="Le lien apparaîtra ici…" readonly></textarea>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
          <button class="btn ghost" id="mailtoBtn" type="button" disabled>Ouvrir email</button>
        </div>

       
      </aside>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc, updateDoc,
      serverTimestamp, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");
    const homeLine = document.getElementById("homeLine");
    const metaLine = document.getElementById("metaLine");
    const addrLine = document.getElementById("addrLine");
    const missionsList = document.getElementById("missionsList");

    const logoutBtn = document.getElementById("logoutBtn");
    const refreshBtn = document.getElementById("refreshBtn");
    const backBtn = document.getElementById("backBtn");

    const agentName = document.getElementById("agentName");
    const agentEmail = document.getElementById("agentEmail");
    const conciergerieName = document.getElementById("conciergerieName");

    const genLinkBtn = document.getElementById("genLinkBtn");
    const copyBtn = document.getElementById("copyBtn");
    const mailtoBtn = document.getElementById("mailtoBtn");
    const linkBox = document.getElementById("linkBox");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

    function randomToken(len=20){
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      let out = "";
      for(const n of arr) out += chars[n % chars.length];
      return out;
    }

    function qs(name){
      return new URLSearchParams(location.search).get(name) || "";
    }

    const prestationId = qs("prestationId") || qs("eventId") || "";
    let currentUser = null;
    let currentEvent = null;

    async function guardConciergerie(uid){
      const uSnap = await getDoc(doc(db, "users", uid));
      if(!uSnap.exists()) throw new Error("Profil user introuvable (users/{uid}).");
      const u = uSnap.data() || {};
      if(u.role !== "conciergerie" && u.role !== "admin") throw new Error("Accès refusé : rôle requis = conciergerie.");
      return u;
    }

    function chipForStatus(st){
      const s = (st||"").toUpperCase();
      if(s==="VALIDEE") return `<span class="chip ok">VALIDÉE</span>`;
      if(s==="A_VALIDER") return `<span class="chip">À VALIDER</span>`;
      if(s==="ASSIGNEE") return `<span class="chip">ASSIGNÉE</span>`;
      if(s==="EN_COURS") return `<span class="chip">EN COURS</span>`;
      return `<span class="chip">${s || "—"}</span>`;
    }

    function missionLabel(type){
      const t = (type||"").toUpperCase();
      if(t==="CHECKIN") return "Check-in";
      if(t==="MENAGE") return "Ménage";
      if(t==="CHECKOUT") return "Check-out";
      if(t==="LINGE") return "Linge";
      if(t==="MAINTENANCE") return "Maintenance";
      if(t==="KITS") return "Kits & consommables";
      return t || "Mission";
    }

    // ========= Produits (source de vérité) =========
    const PRODUCT_TEMPLATES = [
      { key:"MENAGE_STANDARD", label:"Ménage standard (inter-séjour)", category:"Ménage", unit:"unité" },
      { key:"MENAGE_INTERMEDIAIRE", label:"Ménage intermédiaire (long séjour)", category:"Ménage", unit:"supplément" },
      { key:"BACK_TO_BACK", label:"Back-to-back (ménage en urgence)", category:"Ménage", unit:"supplément" },
      { key:"REMISE_EN_ETAT", label:"Remise en état (logement non conforme)", category:"Ménage", unit:"supplément" },

      { key:"RECHANGE_LINGE", label:"Rechange linge (rotation complète)", category:"Linge", unit:"passage" },
      { key:"LAVAGE_SECHAGE", label:"Collecte + lavage + séchage", category:"Linge", unit:"unité" },
      { key:"BLANCHISSERIE", label:"Dépose / reprise blanchisserie", category:"Linge", unit:"unité" },

      { key:"CHECKIN_AUTONOME", label:"Check-in autonome (boîte à clés)", category:"Check-in/out", unit:"passage" },
      { key:"CHECKIN_PHYSIQUE", label:"Check-in physique", category:"Check-in/out", unit:"passage" },
      { key:"CHECKOUT", label:"Check-out", category:"Check-in/out", unit:"passage" },
      { key:"GESTION_CLES", label:"Gestion clés / badges", category:"Check-in/out", unit:"unité" },
      { key:"RECUP_CLES", label:"Récupération clés après sortie", category:"Check-in/out", unit:"passage" },

      { key:"PETITE_MAINTENANCE", label:"Petite maintenance (ampoule, joint…)", category:"Maintenance", unit:"unité" },
      { key:"URGENCE", label:"Intervention d’urgence (fuite, serrure)", category:"Maintenance", unit:"unité" },
      { key:"COORD_ARTISANS", label:"Coordination artisans", category:"Maintenance", unit:"unité" },

      { key:"MESSAGES", label:"Réponses messages voyageurs", category:"Messages voyageurs", unit:"mois" },

      { key:"KIT_ESSENTIEL", label:"Kit essentiel", category:"Kits & consommables", unit:"kit" },
      { key:"KIT_CUISINE", label:"Kit cuisine", category:"Kits & consommables", unit:"kit" },
      { key:"KIT_BAIN", label:"Kit bain", category:"Kits & consommables", unit:"kit" },
      { key:"KIT_SEJOUR_2", label:"Kit séjour (Pack 2 pers)", category:"Kits & consommables", unit:"kit" },
      { key:"KIT_SEJOUR_4", label:"Kit séjour (Pack 4 pers)", category:"Kits & consommables", unit:"kit" },
      { key:"KIT_SEJOUR_6", label:"Kit séjour (Pack 6 pers)", category:"Kits & consommables", unit:"kit" },
      { key:"KIT_SEJOUR_8", label:"Kit séjour (Pack 8 pers)", category:"Kits & consommables", unit:"kit" },
      { key:"REASSORT", label:"Réassort produit unitaire (papier, café…)", category:"Kits & consommables", unit:"unité" },

      { key:"__OTHER__", label:"Autre (texte libre)", category:"Autre", unit:"unité" }
    ];

    // label -> missionType
    const LABEL_TO_MISSION = new Map();
    for(const p of PRODUCT_TEMPLATES){
      const lab = (p.label || "").trim();
      if(!lab) continue;

      const cat = (p.category || "").trim();

      if(cat === "Check-in/out"){
        if(p.key === "CHECKOUT" || p.key === "RECUP_CLES"){
          LABEL_TO_MISSION.set(lab, "CHECKOUT");
        }else{
          LABEL_TO_MISSION.set(lab, "CHECKIN");
        }
        continue;
      }

      if(cat === "Ménage") LABEL_TO_MISSION.set(lab, "MENAGE");
      else if(cat === "Linge") LABEL_TO_MISSION.set(lab, "LINGE");
      else if(cat === "Maintenance") LABEL_TO_MISSION.set(lab, "MAINTENANCE");
      else if(cat === "Kits & consommables") LABEL_TO_MISSION.set(lab, "KITS");
    }

    // ========= Checklist par défaut =========
    const DEFAULT_CHECKLIST = {
      CHECKIN: ["Récupérer / vérifier clés","Vérifier propreté générale"],
      MENAGE: ["Poubelles / tri","Cuisine (plan, évier, frigo, micro-ondes)","Salle de bain (WC, douche, lavabo)","Sols aspirés + lavés"],
      CHECKOUT: ["Vérifier départ voyageurs","Reprendre clés / badge / fermer","Relever dégâts / oubli"],
      LINGE: ["Vérifier quantité linge à traiter","Collecter / déposer linge selon consigne","Retour linge propre / rangement (si prévu)"],
      MAINTENANCE: ["Identifier le problème / tester","Petite réparation si possible","Si urgence : sécuriser / couper eau-élec si besoin"],
      KITS: ["Préparer kits selon commande","Vérifier consommables / quantités","Déposer / ranger au logement (si prévu)"]
    };

    function checklistArrayToObj(arr){
      const obj = {};
      (arr || []).forEach((label, idx)=>{
        obj["i"+idx] = { label: String(label), done:false };
      });
      return obj;
    }

    function computeMissionTypesFromEventLines(event){
      const set = new Set();
      const lines = Array.isArray(event?.lines) ? event.lines : [];

      for(const l of lines){
        const label = (l?.label || "").trim();
        if(!label) continue;
        const mt = LABEL_TO_MISSION.get(label);
        if(mt) set.add(mt);
      }

      if(set.size === 0) set.add("MENAGE"); // fallback
      return Array.from(set);
    }

    async function readMission(mid){
      const mRef = doc(db, "events", prestationId, "missions", mid);
      const mSnap = await getDoc(mRef);
      return { id: mid, ref: mRef, exists: mSnap.exists(), data: mSnap.exists() ? (mSnap.data()||{}) : null };
    }

    async function ensureMissionsExist(event){
      const missionTypes = computeMissionTypesFromEventLines(event);

      const base = {
        conciergerieUid: event.conciergerieUid,
        prestationId: prestationId,
        dateKey: event.dateKey || event.date || "",
        time: event.time || "",
        homeId: event.homeId || "",
        homeName: event.homeName || "",
        homeCity: event.homeCity || "",
        homeAddress: event.homeAddress || "",
        assignedToEmail: event.assignedToEmail || "",
        assignedToName: event.assignedToName || "",
        locked: false,
        status: "ASSIGNEE",
        agentDone: false,
        agentDoneAt: null,
        agentComment: "",
        photos: [],
        checklist: {},
        updatedAt: serverTimestamp(),
        createdAt: serverTimestamp()
      };

      for(const mid of missionTypes){
        const m = await readMission(mid);
        const defaultChecklist = checklistArrayToObj(DEFAULT_CHECKLIST[mid] || []);

        if(!m.exists){
          await setDoc(m.ref, { ...base, type: mid, checklist: defaultChecklist });
          continue;
        }

        const d = m.data || {};
        const cl = d.checklist;
        const isEmptyObject =
          cl && typeof cl === "object" && !Array.isArray(cl) && Object.keys(cl).length === 0;

        if(!cl || isEmptyObject){
          await updateDoc(m.ref, { checklist: defaultChecklist, updatedAt: serverTimestamp() });
        }
      }

      return missionTypes;
    }

    // ===== Address fallback: event.homeAddress -> homes/{homeId}.homeAddress -> backfill event =====
    async function resolveHomeFromHomes(event){
      const homeId = (event?.homeId || "").trim();
      if(!homeId) return null;

      const hSnap = await getDoc(doc(db, "homes", homeId));
      if(!hSnap.exists()) return null;

      const h = hSnap.data() || {};
      return {
        id: homeId,
        name: h.name || "",
        city: h.city || "",
        homeAddress: (h.homeAddress || h.address || "").trim(),
        ownerEmail: (h.ownerEmail || "").trim(),
        ownerName: (h.ownerName || "").trim(),
        team: (h.team || "").trim(),
        type: (h.type || "").trim()
      };
    }

    async function load(){
      hideAlert();
      if(!prestationId){
        showAlert("prestationId manquant dans l’URL. Exemple : intervention.html?prestationId=XXXX");
        return;
      }

      const eRef = doc(db, "events", prestationId);
      const eSnap = await getDoc(eRef);
      if(!eSnap.exists()){
        showAlert("Prestation introuvable (events/"+prestationId+").");
        return;
      }

      const e = eSnap.data() || {};
      currentEvent = { id: eSnap.id, ...e };

      if(e.conciergerieUid !== currentUser.uid){
        showAlert("Accès refusé : tu n’es pas la conciergerie de cette prestation.");
        return;
      }

      // Resolve missing address / name / city from homes
      const needAddr = !String(e.homeAddress || "").trim();
      const needName = !String(e.homeName || "").trim();
      const needCity = !String(e.homeCity || "").trim();

      let homeFromHomes = null;
      if(needAddr || needName || needCity){
        try{
          homeFromHomes = await resolveHomeFromHomes(e);
        }catch(err){
          console.warn("resolveHomeFromHomes failed:", err?.message || err);
        }
      }

      const finalHomeName = String(e.homeName || "").trim() || (homeFromHomes?.name || "Logement");
      const finalHomeCity = String(e.homeCity || "").trim() || (homeFromHomes?.city || "");
      const finalHomeAddr = String(e.homeAddress || "").trim() || (homeFromHomes?.homeAddress || "");

      // Backfill event for stability (so agent/planning won't be blind)
      const backfill = {};
      if(needName && homeFromHomes?.name) backfill.homeName = homeFromHomes.name;
      if(needCity && homeFromHomes?.city) backfill.homeCity = homeFromHomes.city;
      if(needAddr && homeFromHomes?.homeAddress) backfill.homeAddress = homeFromHomes.homeAddress;
      if(Object.keys(backfill).length){
        try{
          await updateDoc(eRef, { ...backfill, updatedAt: serverTimestamp() });
          // keep in memory too
          currentEvent = { ...currentEvent, ...backfill };
        }catch(err){
          console.warn("Backfill event failed:", err?.message || err);
        }
      }

      subLine.textContent = prestationId;

      homeLine.textContent = `${finalHomeName}${finalHomeCity ? " — "+finalHomeCity : ""}`;
      metaLine.textContent =
        `${(e.dateKey || e.date || "—")}${e.time ? " à "+e.time : ""}` +
        ` • status: ${(e.status||"").toUpperCase() || "—"}`;

      addrLine.textContent = finalHomeAddr || "Adresse manquante (à compléter dans Logements).";

      // Agent prefill from event
      agentName.value = e.assignedToName || agentName.value || "";
      agentEmail.value = e.assignedToEmail || agentEmail.value || "";
      conciergerieName.value = e.conciergerieName || conciergerieName.value || "";

      // Ensure missions exist + read
      const missionTypes = await ensureMissionsExist({ ...e, homeName: finalHomeName, homeCity: finalHomeCity, homeAddress: finalHomeAddr });
      const ms = await Promise.all(missionTypes.map(readMission));

      missionsList.innerHTML = "";
      for(const m of ms){
        const d = m.data || {};
        const cl = d.checklist;
        const isChecklistEmpty =
          !cl || (typeof cl === "object" && !Array.isArray(cl) && Object.keys(cl).length === 0);

        const html = `
          <div class="item">
            <div class="item-top">
              <div>
                <div class="item-title">${missionLabel(d.type || m.id)}</div>
                <div class="item-sub">Agent : ${(d.assignedToName||"—")}${d.assignedToEmail ? " • "+d.assignedToEmail : ""}</div>
              </div>
              <div>${chipForStatus(d.status)}</div>
            </div>
            <div class="item-sub" style="margin-top:8px;">
              Token : ${d.dayToken ? "<span class='mono'>"+d.dayToken+"</span>" : "—"}
              \nLocked : ${String(!!d.locked)}
              \nChecklist : ${isChecklistEmpty ? "VIDE" : "OK"}
            </div>
          </div>
        `;
        const div = document.createElement("div");
        div.innerHTML = html;
        missionsList.appendChild(div.firstElementChild);
      }
    }

    async function generateAgentLink(){
      hideAlert();
      linkBox.value = "";
      copyBtn.disabled = true;
      mailtoBtn.disabled = true;

      const aEmail = normalizeEmail(agentEmail.value);
      const aName  = (agentName.value || "").trim();
      const cName  = (conciergerieName.value || "").trim();

      if(!aEmail) return showAlert("Email agent obligatoire.");
      if(!/^\S+@\S+\.\S+$/.test(aEmail)) return showAlert("Email agent invalide.");
      if(!aName) return showAlert("Nom agent obligatoire.");
      if(!currentEvent) return showAlert("Prestation non chargée.");

      const missionTypes = computeMissionTypesFromEventLines(currentEvent);

      const tokenId = randomToken(20);
      const expiresAtMs = Date.now() + 24*60*60*1000;
      const expiresAt = Timestamp.fromMillis(expiresAtMs);
      const expiresAtIso = new Date(expiresAtMs).toISOString();

      await setDoc(doc(db, "dayTokens", tokenId), {
        conciergerieUid: currentUser.uid,
        prestationId: String(prestationId),
        agentEmail: aEmail,
        agentName: aName,
        missionTypes: missionTypes,
        active: true,
        expiresAt: expiresAt,
        expiresAtMs: expiresAtMs,
        expiresAtIso: expiresAtIso,
        createdAt: serverTimestamp()
      });

      // IMPORTANT: keep event consistent (agent + conciergerieName)
      await updateDoc(doc(db, "events", prestationId), {
        assignedToEmail: aEmail,
        assignedToName: aName,
        conciergerieName: cName || (currentEvent?.conciergerieName || ""),
        updatedAt: serverTimestamp()
      });

      // Update missions with token and agent
      for(const mid of missionTypes){
        await updateDoc(doc(db, "events", prestationId, "missions", mid), {
          dayToken: tokenId,
          assignedToEmail: aEmail,
          assignedToName: aName,
          updatedAt: serverTimestamp()
        });
      }

      const params = new URLSearchParams();
      params.set("token", tokenId);
      params.set("prestationId", prestationId);

      const base = location.href.split("?")[0];
      const link = base.replace("intervention.html", "agent.html") + "?" + params.toString();

      linkBox.value = link;
      copyBtn.disabled = false;
      mailtoBtn.disabled = false;

      showAlert("✅ Lien agent généré + token enregistré (24h).", true);
    }

    copyBtn.addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText(linkBox.value || "");
        showAlert("✅ Lien copié.", true);
      }catch{
        showAlert("Copie impossible (clipboard). Copie manuelle.");
      }
    });

    mailtoBtn.addEventListener("click", ()=>{
      const to = normalizeEmail(agentEmail.value);
      const cName = (conciergerieName.value || "").trim() || "CleanUp Manager";
      const subject = encodeURIComponent("Mission CleanUp — " + cName);

      const body = encodeURIComponent(
        `Bonjour ${agentName.value || ""},\n\n` +
        `Voici ton lien pour exécuter la mission :\n\n` +
        `${linkBox.value}\n\n` +
        `⚠️ Le lien/token expire sous 24h.\n\n` +
        `— ${cName}`
      );

      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });

    refreshBtn.addEventListener("click", ()=> load().catch(err=>{
      console.error(err);
      showAlert("Erreur reload : " + (err?.message || "inconnue"));
    }));

    backBtn.addEventListener("click", ()=> history.back());

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      location.href = "index.html";
    });

    genLinkBtn.addEventListener("click", async ()=>{
      genLinkBtn.disabled = true;
      genLinkBtn.textContent = "…";
      try{
        await generateAgentLink();
        await load();
      }catch(err){
        console.error(err);
        showAlert("Erreur création lien agent : " + (err?.message || "inconnue"));
      }finally{
        genLinkBtn.disabled = false;
        genLinkBtn.textContent = "Générer lien agent";
      }
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = user;

      try{
        await guardConciergerie(user.uid);
        await load();
      }catch(err){
        console.error(err);
        showAlert(err?.message || "Accès refusé.");
      }
    });
  </script>
</body>
</html>
