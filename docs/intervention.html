<!-- docs/intervention.html (FINAL — + agentThreads (chat) + email 2 liens + resync dayToken missions non verrouillées) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Intervention</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --violet-light:#F3ECFF;

      --text:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);

      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --card: rgba(255,255,255,0.86);
    }
    *,*::before,*::after{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; }

    .topbar{
      width:100%; max-width:980px; position:sticky; top:0; z-index:30;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main); color:var(--violet-main);
      text-decoration:none; font-weight:800; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff;
    }

    .logo{
      width:100%; max-width:980px; display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:6px; margin-bottom:2px; text-align:center;
    }
    .logo-icon{
      width:42px; height:42px; border-radius:50%; background:#fff; border:2px solid var(--violet-main);
      display:flex; align-items:center; justify-content:center; color:var(--violet-main);
      font-size:20px; font-weight:900; position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:24px; font-weight:900; }
    .subtitle{ width:100%; max-width:980px; font-size:13px; font-weight:800; color:#444; text-align:center; }
    .helloLine{ width:100%; max-width:980px; margin-top:10px; font-size:13px; color:#333; font-weight:900; text-align:center; }
    .emailLine{ width:100%; max-width:980px; font-size:12px; font-weight:800; color:var(--muted); text-align:center; margin-top:4px; }

    .sub{ width:100%; max-width:980px; margin-top:8px; color:#444; font-size:12px; font-weight:800; text-align:left; }
    .alert{
      width:100%; max-width:980px; display:none; margin-top:10px; padding:10px 12px; background:#fff;
      border-radius:14px; border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; white-space:pre-wrap; color:#444;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .wrap{
      width:100%; max-width:980px; margin-top:12px;
      display:grid; grid-template-columns:1fr; gap:10px;
    }
    @media(min-width:900px){ .wrap{ grid-template-columns:1.2fr .8fr; } }

    .card{
      background:var(--card); border:1px solid var(--border); border-radius:18px;
      box-shadow:var(--shadow); backdrop-filter:blur(10px);
      padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0;
    }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }

    .prestaHead{
      display:flex; flex-direction:column; gap:6px; background:#fff;
      border:1px solid rgba(122,92,255,0.18); border-radius:16px; padding:10px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .prestaTitle{ font-size:14px; font-weight:900; color:#222; line-height:1.2; }
    .prestaMeta{ font-size:12px; font-weight:800; color:#444; white-space:pre-wrap; line-height:1.3; }
    .kv{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .kv .k{ font-weight:900; }
    .kv .v{ font-weight:800; color:#333; text-align:right; }

    .linesBox{
      background:#fff; border-radius:16px; border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06); padding:10px;
      display:flex; flex-direction:column; gap:8px;
    }
    .lineItem{
      display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
      border:1px solid rgba(122,92,255,0.12); background:rgba(122,92,255,0.04);
      border-radius:14px; padding:10px;
    }
    .lineItem .t{ font-weight:900; font-size:13px; color:#222; }
    .lineItem .s{ margin-top:4px; font-size:12px; font-weight:800; color:#666; }

    .totalBox{
      margin-top:2px; padding:10px 12px; background:#fff; border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06); border:1px solid rgba(122,92,255,0.18);
      display:flex; justify-content:space-between; gap:10px; align-items:center; font-weight:900;
    }
    .totalBox .mut{ font-weight:800; color:#666; }

    label.mini{ display:block; margin-top:10px; }
    input, textarea{
      width:100%; padding:10px; border-radius:12px; border:1px solid #D3C7FF;
      background:#fff; font-size:13px; outline:none;
    }
    textarea{ resize:vertical; }
    .btnrow{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }

    .hintBox{
      margin-top:8px; background:#fff; border:1px solid rgba(122,92,255,0.18);
      border-radius:14px; padding:10px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; color:#444; line-height:1.35;
    }
    .hintBox b{ font-weight:900; }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="prestations.html">← Retour</a>
      <div style="display:flex;gap:8px;"></div>
    </div>

    <div class="logo">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>

    <div class="subtitle">Gestion de vos prestations</div>
    <div class="helloLine" id="helloLine">Bonjour,</div>
    <div class="emailLine" id="companyLine">—</div>

    <div class="sub" id="subLine">Chargement…</div>
    <div class="alert" id="alertBox"></div>

    <div class="wrap">
      <!-- GAUCHE -->
      <section class="card">
        <div class="mini">Prestation</div>

        <div class="prestaHead">
          <div class="prestaTitle" id="homeLine">—</div>

          <div class="kv">
            <div class="k">Arrivée :</div>
            <div class="v" id="arrLine">—</div>
          </div>

          <div class="kv">
            <div class="k">Départ :</div>
            <div class="v" id="depLine">—</div>
          </div>

          <div class="kv">
            <div class="k">Adresse :</div>
            <div class="v" id="addrLine">—</div>
          </div>

          <div class="kv">
            <div class="k">Propriétaire :</div>
            <div class="v" id="ownerLine">—</div>
          </div>

          <div class="prestaMeta" id="noteLine" style="display:none;"></div>
        </div>

        <div class="mini">Lignes</div>
        <div class="linesBox" id="linesBox"></div>

        <div class="totalBox">
          <div class="mut">Total</div>
          <div id="totalValue">0,00 €</div>
        </div>

        <div class="hintBox" id="missionsHint">
          <b>Missions envoyées à l’agent :</b> —
        </div>
      </section>

      <!-- DROITE -->
      <aside class="card">
        <div style="font-weight:900;">Lien agent</div>

        <label class="mini">Nom agent</label>
        <input id="agentName" type="text" placeholder="Ex. Carla" />

        <label class="mini">Email agent</label>
        <input id="agentEmail" type="email" placeholder="ex. agent@email.com" />

        <label class="mini">Nom conciergerie (optionnel)</label>
        <input id="conciergerieName" type="text" placeholder="Ex. CleanUp Manager" />

        <div class="btnrow">
          <button class="pill primary" id="genLinkBtn" type="button">Générer lien</button>
          <button class="pill" id="copyBtn" type="button" disabled>Copier</button>
          <button class="pill" id="mailtoBtn" type="button" disabled>Envoyer email</button>
        </div>

        <textarea id="linkBox" rows="5" style="margin-top:8px;" readonly placeholder="Les liens apparaîtront ici…"></textarea>

        <div class="mini" style="margin-top:10px;">
          Checklist via token 24h + Chat (photos) via connexion email-link.
        </div>
      </aside>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc, serverTimestamp, Timestamp,
      collection, query, where, limit, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const helloLine = document.getElementById("helloLine");
    const companyLine = document.getElementById("companyLine");

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");

    const homeLine = document.getElementById("homeLine");
    const arrLine  = document.getElementById("arrLine");
    const depLine  = document.getElementById("depLine");
    const addrLine = document.getElementById("addrLine");
    const ownerLine= document.getElementById("ownerLine");
    const noteLine = document.getElementById("noteLine");

    const linesBox = document.getElementById("linesBox");
    const totalValue = document.getElementById("totalValue");
    const missionsHint = document.getElementById("missionsHint");

    const agentName = document.getElementById("agentName");
    const agentEmail = document.getElementById("agentEmail");
    const conciergerieName = document.getElementById("conciergerieName");

    const genLinkBtn = document.getElementById("genLinkBtn");
    const copyBtn = document.getElementById("copyBtn");
    const mailtoBtn = document.getElementById("mailtoBtn");
    const linkBox = document.getElementById("linkBox");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
    function normalizeEmail(s){ return (s||"").trim().toLowerCase(); }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
    }
    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0)*(Number(l?.unitPrice)||0), 0);
    }

    function randomToken(len=20){
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      let out = "";
      for(const n of arr) out += chars[n % chars.length];
      return out;
    }

    function normTxt(s){
      return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    }
    function missionTypesFromLines(lines, fallbackType){
      const out = new Set();
      const ft = String(fallbackType||"").toUpperCase().trim();
      if(["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"].includes(ft)) out.add(ft);

      if(Array.isArray(lines)){
        for(const l of lines){
          const label = normTxt(l?.label || l?.name || l?.title || "");
          if(!label) continue;

          if(label.includes("check-in") || label.includes("check in") || label.includes("arrivee")) out.add("CHECKIN");
          if(label.includes("check-out") || label.includes("check out") || label.includes("depart")) out.add("CHECKOUT");
          if(label.includes("menage") || label.includes("nettoyage")) out.add("MENAGE");

          if(label.includes("linge") || label.includes("drap") || label.includes("serviette") || label.includes("collecte")
             || label.includes("lavage") || label.includes("sechage") || label.includes("lessive") || label.includes("blanch")) out.add("LINGE");

          if(label.includes("maintenance") || label.includes("reparation") || label.includes("bricol")) out.add("MAINTENANCE");
          if(label.includes("kit") || label.includes("consommable") || label.includes("capsule") || label.includes("shampo") || label.includes("savon")) out.add("KITS");
        }
      }
      if(out.size === 0) out.add("MENAGE");
      const order = ["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"];
      return order.filter(x => out.has(x));
    }
    function missionLabel(t){
      const x = String(t||"").toUpperCase();
      if(x==="CHECKIN") return "Check-in";
      if(x==="CHECKOUT") return "Check-out";
      if(x==="MENAGE") return "Ménage";
      if(x==="LINGE") return "Linge";
      if(x==="MAINTENANCE") return "Maintenance";
      if(x==="KITS") return "Kits & conso";
      return x || "—";
    }

    const prestationId = qs("prestationId");
    let currentUser = null;
    let currentEvent = null;
    let inferredMissionTypes = ["MENAGE"];
    let lastThreadId = null;

    function renderLines(lines){
      linesBox.innerHTML = "";
      if(!Array.isArray(lines) || !lines.length){
        linesBox.innerHTML = `<div class="mini">Aucune ligne.</div>`;
        return;
      }
      for(const l of lines){
        const qty = Number(l?.qty || 0);
        const unit = String(l?.unit || "unité");
        const up = Number(l?.unitPrice || 0);
        const lt = qty * up;

        const div = document.createElement("div");
        div.className = "lineItem";
        div.innerHTML = `
          <div style="min-width:0;flex:1;">
            <div class="t">${esc(l?.label || "Ligne")}</div>
            <div class="s">${esc(`${qty} ${unit} • ${money(up)} / ${unit}`)}</div>
            ${l?.note ? `<div class="s">${esc(l.note)}</div>` : ``}
          </div>
          <div style="font-weight:900;white-space:nowrap;">${esc(money(lt))}</div>
        `;
        linesBox.appendChild(div);
      }
    }

    async function loadCompanyName(user){
      try{
        const uSnap = await getDoc(doc(db, "users", user.uid));
        const company = uSnap.exists() ? (uSnap.data()?.businessProfile?.companyName || "") : "";
        const name = (company || "").trim() || "Conciergerie";

        companyLine.textContent = name;
        if(helloLine) helloLine.textContent = "Bonjour,";
        if(!String(conciergerieName.value || "").trim()){
          conciergerieName.value = name;
        }
      }catch(e){
        companyLine.textContent = "Conciergerie";
        if(helloLine) helloLine.textContent = "Bonjour,";
        if(!String(conciergerieName.value || "").trim()){
          conciergerieName.value = "Conciergerie";
        }
      }
    }

    // ✅ FIX CRITIQUE : resync dayToken des missions (si non verrouillées)
    async function upsertMissionForToken({ tokenId, email, name, missionType }) {
      const mRef = doc(db, "events", prestationId, "missions", missionType);

      let locked = false;
      try{
        const mSnap = await getDoc(mRef);
        if(mSnap.exists()){
          const m = mSnap.data() || {};
          locked = !!m.locked;
        }
      }catch(e){
        locked = false;
      }

      if(locked) return;

      await setDoc(mRef, {
        type: missionType,
        missionId: missionType,
        conciergerieUid: currentUser.uid,
        prestationId: String(prestationId),

        locked: false,
        agentDone: false,
        status: "ASSIGNEE",

        dayToken: tokenId,

        assignedToEmail: email,
        assignedToName: name,

        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    // ✅ Thread agent (photos/messages) : un thread par prestation + agentEmailLower
    async function ensureAgentThread({ conciergerieUid, prestationId, agentEmailLower, homeId=null, homeName=null }){
      // recherche simple
      const q1 = query(
        collection(db, "agentThreads"),
        where("conciergerieUid","==",conciergerieUid),
        where("prestationId","==",String(prestationId)),
        where("agentEmailLower","==",agentEmailLower),
        limit(1)
      );
      const s1 = await getDocs(q1);
      if(!s1.empty){
        const doc0 = s1.docs[0];
        lastThreadId = doc0.id;
        // refresh updatedAt (optionnel)
        await setDoc(doc(db,"agentThreads",doc0.id),{ updatedAt: serverTimestamp() },{ merge:true });
        return doc0.id;
      }

      // création threadId deterministe (évite doublons)
      const threadId = `AG_${String(prestationId)}_${agentEmailLower.replaceAll(".","_").replaceAll("@","_")}`;
      await setDoc(doc(db,"agentThreads",threadId),{
        conciergerieUid: String(conciergerieUid),
        prestationId: String(prestationId),
        agentEmailLower,
        agentUid: null,
        homeId: homeId || null,
        homeName: homeName || null,
        status: "OPEN",
        unreadForConciergerie: 0,
        unreadForAgent: 0,
        lastMessageText: null,
        lastMessageAt: null,
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp()
      }, { merge:true });

      lastThreadId = threadId;
      return threadId;
    }

    async function load(){
      hideAlert();
      subLine.textContent = "Chargement…";

      if(!prestationId){
        subLine.textContent = "";
        return showAlert("prestationId manquant (URL).");
      }

      const eSnap = await getDoc(doc(db, "events", prestationId));
      if(!eSnap.exists()){
        subLine.textContent = "";
        return showAlert("Prestation introuvable.");
      }

      const e = eSnap.data() || {};
      currentEvent = { id: eSnap.id, ...e };

      homeLine.textContent = e.homeName || "Logement";

      const aDate = e.arrivalDateKey || e.dateKey || e.date || "";
      const aTime = e.arrivalTime || e.time || "";
      arrLine.textContent = (aDate ? aDate : "—") + (aTime ? " • " + aTime : "");

      const dDate = e.departureDateKey || "";
      const dTime = e.departureTime || "";
      depLine.textContent = (dDate ? dDate : "—") + (dTime ? " • " + dTime : "");

      const addr = (e.homeAddress || e.address || "").trim();
      const zip  = (e.homeZip || e.zip || "").trim();
      addrLine.textContent = [addr, zip].filter(Boolean).join(" ").trim() || "—";

      const owner = (e.ownerName || "").trim();
      const phone = (e.ownerPhone || e.phone || "").trim();
      ownerLine.textContent = [owner, phone].filter(Boolean).join(" • ") || "—";

      const note = (e.meta || "").trim();
      if(note){
        noteLine.style.display = "block";
        noteLine.textContent = note;
      }else{
        noteLine.style.display = "none";
        noteLine.textContent = "";
      }

      const lines = Array.isArray(e.lines) ? e.lines : [];
      const total = (e.total != null) ? Number(e.total) : computeTotalFromLines(lines);
      renderLines(lines);
      totalValue.textContent = money(total);

      inferredMissionTypes = missionTypesFromLines(lines, e.type);
      missionsHint.innerHTML = `<b>Missions envoyées à l’agent :</b> ${esc(inferredMissionTypes.map(missionLabel).join(", "))}`;

      agentName.value = e.assignedToName || "";
      agentEmail.value = e.assignedToEmail || "";

      subLine.textContent = "";
    }

    async function generateLink(){
      hideAlert();

      if(!currentEvent) return showAlert("Prestation non chargée.");
      if(!currentUser) return showAlert("Utilisateur non authentifié.");

      const email = normalizeEmail(agentEmail.value);
      const name = (agentName.value || "").trim();
      if(!email || !name) return showAlert("Nom + email agent requis.");
      if(!/^\S+@\S+\.\S+$/.test(email)) return showAlert("Email agent invalide.");

      const missionTypes = Array.isArray(inferredMissionTypes) && inferredMissionTypes.length
        ? inferredMissionTypes.slice()
        : ["MENAGE"];

      const tokenId = randomToken(20);
      const expiresAtMs = Date.now() + 24*60*60*1000;
      const expiresAt = Timestamp.fromMillis(expiresAtMs);

      const e = currentEvent || {};
      const aDate = e.arrivalDateKey || e.dateKey || e.date || "";
      const aTime = e.arrivalTime || e.time || "";
      const dDate = e.departureDateKey || "";
      const dTime = e.departureTime || "";
      const addr = (e.homeAddress || e.address || "").trim();
      const zip  = (e.homeZip || e.zip || "").trim();
      const city = (e.homeCity || "").trim();
      const meta = (e.meta || "").trim();

      const prestaSnapshot = {
        homeName: e.homeName || "Logement",
        homeCity: city,
        arrivalDateKey: aDate,
        arrivalTime: aTime,
        departureDateKey: dDate,
        departureTime: dTime,
        homeAddress: addr,
        homeZip: zip,
        meta
      };

      // dayToken
      await setDoc(doc(db,"dayTokens",tokenId),{
        conciergerieUid: currentUser.uid,
        prestationId: String(prestationId),

        agentEmail: email,
        agentName: name,
        conciergerieName: (conciergerieName?.value || "").trim() || null,

        missionTypes,
        presta: prestaSnapshot,

        active:true,
        expiresAt,
        expiresAtMs,
        createdAt: serverTimestamp()
      });

      // missions : resync dayToken partout (si pas verrouillé)
      for (const t of missionTypes) {
        await upsertMissionForToken({ tokenId, email, name, missionType: t });
      }

      // parent event
      await setDoc(doc(db,"events",prestationId),{
        assignedToEmail: email,
        assignedToName: name,
        dayToken: tokenId,
        updatedAt: serverTimestamp()
      }, { merge:true });

      // thread chat
      const threadId = await ensureAgentThread({
        conciergerieUid: currentUser.uid,
        prestationId,
        agentEmailLower: email,
        homeId: e.homeId || null,
        homeName: e.homeName || null
      });

      const base = location.href.split("?")[0];

      const tokenLink =
        base.replace("intervention.html","agent.html")
        + `?token=${encodeURIComponent(tokenId)}&prestationId=${encodeURIComponent(prestationId)}`;

      const chatLink =
        base.replace("intervention.html","agent-chat.html")
        + `?threadId=${encodeURIComponent(threadId)}`;

      linkBox.value =
        `Checklist (token 24h):\n${tokenLink}\n\n` +
        `Chat & Photos (connexion email):\n${chatLink}`;

      copyBtn.disabled = false;
      mailtoBtn.disabled = false;

      showAlert("Liens générés (checklist + chat).", true);
      await load();
    }

    copyBtn.addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText(linkBox.value || "");
        showAlert("Copié.", true);
      }catch{
        showAlert("Copie impossible. Copie manuelle.");
      }
    });

    mailtoBtn.addEventListener("click", ()=>{
      const to = normalizeEmail(agentEmail.value);
      const name = (agentName.value || "").trim();
      if(!to) return showAlert("Email agent manquant.");
      if(!linkBox.value) return showAlert("Génère d’abord les liens.");

      const subject = encodeURIComponent("Mission CleanUp — liens (checklist + chat)");
      const body = encodeURIComponent(
        `Bonjour ${name || ""},\n\n` +
        `Voici tes liens :\n\n` +
        `${linkBox.value}\n\n` +
        `⚠️ Le lien checklist (token) expire sous 24h.\n` +
        `Le lien chat te permet d’envoyer photos & messages après connexion.\n\n` +
        `— CleanUp Manager`
      );

      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });

    genLinkBtn.addEventListener("click", async ()=>{
      genLinkBtn.disabled = true;
      genLinkBtn.textContent = "…";
      try{
        await generateLink();
      }catch(err){
        console.error(err);
        showAlert("Erreur génération : " + (err?.code || err?.message || "inconnue"));
      }finally{
        genLinkBtn.disabled = false;
        genLinkBtn.textContent = "Générer lien";
      }
    });

    onAuthStateChanged(auth, async (u)=>{
      if(!u) return location.href="login.html";
      currentUser = u;

      await loadCompanyName(u);

      try{
        await load();
      }catch(err){
        console.error(err);
        showAlert("Erreur chargement : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
