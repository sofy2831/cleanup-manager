<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>CleanUp Manager — Intervention</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import {
      doc, getDoc, setDoc, updateDoc, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const qs = n => new URLSearchParams(location.search).get(n);
    const prestationId = qs("prestationId");

    const agentEmail = document.getElementById("agentEmail");
    const agentName = document.getElementById("agentName");
    const out = document.getElementById("out");

    function rand(len=20){
      const c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      return Array.from(crypto.getRandomValues(new Uint8Array(len)))
        .map(x=>c[x%c.length]).join("");
    }

    onAuthStateChanged(auth, async u=>{
      if(!u) location.href="login.html";
    });

    document.getElementById("gen").onclick = async ()=>{
      const email = agentEmail.value.trim().toLowerCase();
      const name = agentName.value.trim();
      if(!email||!name) return alert("Nom + email requis");

      const token = rand();
      const expiresAt = Timestamp.fromMillis(Date.now()+24*3600*1000);

      await setDoc(doc(db,"dayTokens",token),{
        conciergerieUid: auth.currentUser.uid,
        prestationId,
        agentEmail: email,
        agentName: name,
        missionTypes: ["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"],
        active:true,
        expiresAt
      });

      const link = `agent.html?token=${token}&prestationId=${prestationId}`;
      out.value = location.origin + location.pathname.replace("intervention.html", link);
ig;
    };
  </script>
</head>
<body>
  <h1>Intervention</h1>

  <input id="agentName" placeholder="Nom agent"/><br/>
  <input id="agentEmail" placeholder="Email agent"/><br/>
  <button id="gen">Générer lien agent</button><br/><br/>

  <textarea id="out" rows="4" style="width:100%"></textarea>
</body>
</html>
