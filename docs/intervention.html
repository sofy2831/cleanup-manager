<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Intervention</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.86);
    }

    *,*::before,*::after{
      box-sizing:border-box;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 14px 26px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:30;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      text-decoration:none;
      font-weight:800;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .pill.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
    }

    .logo{
      width:100%;
      max-width:980px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:6px;
      margin-bottom:2px;
      text-align:center;
    }

    .logo-icon{
      width:42px;
      height:42px;
      border-radius:50%;
      background:#fff;
      border:2px solid var(--violet-main);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--violet-main);
      font-size:20px;
      font-weight:900;
      position:relative;
      flex-shrink:0;
    }

    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px;
      right:-5px;
      font-size:12px;
      color:var(--violet-main);
    }

    h1{
      margin:0;
      font-size:24px;
      font-weight:900;
    }

    .subtitle{
      width:100%;
      max-width:980px;
      font-size:13px;
      font-weight:800;
      color:#444;
      text-align:center;
    }

    .helloLine{
      width:100%;
      max-width:980px;
      margin-top:10px;
      font-size:13px;
      color:#333;
      font-weight:900;
      text-align:center;
    }

    .emailLine{
      width:100%;
      max-width:980px;
      font-size:12px;
      font-weight:800;
      color:var(--muted);
      text-align:center;
      margin-top:4px;
    }

    .sub{
      width:100%;
      max-width:980px;
      margin-top:8px;
      color:#444;
      font-size:12px;
      font-weight:800;
      text-align:left;
    }

    .alert{
      width:100%;
      max-width:980px;
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:800;
      white-space:pre-wrap;
      color:#444;
    }

    .alert.ok{
      border-left-color:var(--ok);
    }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:12px;
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    @media(min-width:900px){
      .wrap{
        grid-template-columns:1.2fr .8fr;
      }
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }

    .mini{
      font-size:11px;
      font-weight:900;
      color:var(--muted);
    }

    .prestaHead{
      display:flex;
      flex-direction:column;
      gap:6px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:16px;
      padding:10px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }

    .prestaTitle{
      font-size:14px;
      font-weight:900;
      color:#222;
      line-height:1.2;
    }

    .prestaMeta{
      font-size:12px;
      font-weight:800;
      color:#444;
      white-space:pre-wrap;
      line-height:1.3;
    }

    .kv{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .kv .k{
      font-weight:900;
    }

    .kv .v{
      font-weight:800;
      color:#333;
      text-align:right;
    }

    .linesBox{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,0.06);
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .totalBox{
      margin-top:2px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,0.06);
      border:1px solid rgba(122,92,255,0.18);
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      font-weight:900;
    }

    .hintBox{
      margin-top:8px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:10px;
      box-shadow:0 3px 10px rgba(0,0,0,0.06);
      font-size:12px;
      font-weight:800;
      color:#444;
      line-height:1.35;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="prestations.html">← Retour</a>
    </div>

    <div class="logo">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>

    <div class="subtitle">Gestion de vos prestations</div>
    <div class="helloLine" id="helloLine">Bonjour,</div>
    <div class="emailLine" id="companyLine">—</div>

    <div class="sub" id="subLine">Chargement…</div>
    <div class="alert" id="alertBox"></div>

    <div class="wrap">
      <section class="card">
        <div class="mini">Prestation</div>
        <div class="prestaHead">
          <div class="prestaTitle" id="homeLine">—</div>
          <div class="kv"><div class="k">Arrivée :</div><div class="v" id="arrLine">—</div></div>
          <div class="kv"><div class="k">Inter-séjour :</div><div class="v" id="midLine">—</div></div>
          <div class="kv"><div class="k">Départ :</div><div class="v" id="depLine">—</div></div>
          <div class="kv"><div class="k">Adresse :</div><div class="v" id="addrLine">—</div></div>
          <div class="kv"><div class="k">Propriétaire :</div><div class="v" id="ownerLine">—</div></div>
          <div class="prestaMeta" id="noteLine" style="display:none;"></div>
        </div>

        <div class="mini">Interventions / lignes</div>
        <div class="linesBox" id="linesBox"></div>

        <div class="totalBox">
          <div>Total</div>
          <div id="totalValue">0,00 €</div>
        </div>

        <div class="hintBox" id="missionsHint">
          <b>Résumé agent :</b> —
        </div>
      </section>

      <aside class="card">
        <div style="font-weight:900;">Liens agent</div>

        <label class="mini">Nom agent</label>
        <input id="agentName" type="text" />

        <label class="mini">Email agent</label>
        <input id="agentEmail" type="email" />

        <label class="mini">Nom conciergerie</label>
        <input id="conciergerieName" type="text" />

        <div class="mini">Interventions à envoyer</div>
        <div id="sendSelectorBox"></div>

        <div class="btnrow">
          <button class="pill primary" id="genLinkBtn" type="button">Générer liens</button>
          <button class="pill" id="copyBtn" type="button" disabled>Copier</button>
          <button class="pill" id="mailtoBtn" type="button" disabled>Envoyer email</button>
        </div>

        <textarea id="linkBox" rows="8" readonly></textarea>
      </aside>
    </div>
  </div>

  <script type="module">
           import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc, updateDoc, deleteDoc, deleteField,
      serverTimestamp, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const helloLine = document.getElementById("helloLine");
    const companyLine = document.getElementById("companyLine");
    const backBtn = document.getElementById("backBtn");

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");

    const homeLine = document.getElementById("homeLine");
    const arrLine  = document.getElementById("arrLine");
    const midLine  = document.getElementById("midLine");
    const depLine  = document.getElementById("depLine");
    const addrLine = document.getElementById("addrLine");
    const ownerLine= document.getElementById("ownerLine");
    const noteLine = document.getElementById("noteLine");

    const linesBox = document.getElementById("linesBox");
    const totalValue = document.getElementById("totalValue");
    const missionsHint = document.getElementById("missionsHint");

    const agentName = document.getElementById("agentName");
    const agentEmail = document.getElementById("agentEmail");
    const conciergerieName = document.getElementById("conciergerieName");

    const sendSelectorBox = document.getElementById("sendSelectorBox");

    const genLinkBtn = document.getElementById("genLinkBtn");
    const copyBtn = document.getElementById("copyBtn");
    const mailtoBtn = document.getElementById("mailtoBtn");
    const linkBox = document.getElementById("linkBox");

    const ALL_TECH_MISSIONS = ["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"];

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }

    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
    function normalizeEmail(s){ return (s||"").trim().toLowerCase(); }

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function isDateKey(s){ return /^\d{4}-\d{2}-\d{2}$/.test(String(s||"").trim()); }

    function formatTs(ts){
      try{
        const d = ts?.toDate ? ts.toDate() : (ts instanceof Date ? ts : null);
        if(!d || Number.isNaN(d.getTime())) return "";
        const pad = n => String(n).padStart(2,"0");
        return `${pad(d.getDate())}/${pad(d.getMonth()+1)} à ${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }catch{
        return "";
      }
    }

    async function guardConciergerie(user){
      try{
        const snap = await getDoc(doc(db,"users",user.uid));
        if(!snap.exists()) return false;

        const d = snap.data() || {};
        const sub = String(d.subscriptionStatus || "").toLowerCase();

        return (d.role === "conciergerie" || d.role === "admin")
          && (sub === "active" || sub === "cancel_at_period_end");
      }catch(e){
        return false;
      }
    }

    function applyBackLink(){
      const returnTo = (qs("returnTo") || "").toLowerCase().trim();
      const returnDate = (qs("returnDate") || "").trim();

      if(returnTo === "planning"){
        const p = new URLSearchParams();
        if(isDateKey(returnDate)) p.set("date", returnDate);
        backBtn.href = `planning.html${p.toString() ? "?" + p.toString() : ""}`;
        backBtn.textContent = "← Planning";
        return;
      }

      const prestaId = qs("prestationId");
      if(prestaId){
        backBtn.href = `prestations.html?open=${encodeURIComponent(prestaId)}`;
        backBtn.textContent = "← Production";
        return;
      }

      backBtn.href = "prestations.html";
      backBtn.textContent = "← Production";
    }

    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
    }

    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0)*(Number(l?.unitPrice)||0), 0);
    }

    function randomToken(len=20){
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      let out = "";
      for(const n of arr) out += chars[n % chars.length];
      return out;
    }

    function normTxt(s){
      return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    }

    function missionLabel(t){
      const x = String(t||"").toUpperCase();
      if(x==="CHECKIN") return "Check-in";
      if(x==="CHECKOUT") return "Check-out";
      if(x==="MENAGE") return "Ménage";
      if(x==="LINGE") return "Linge";
      if(x==="MAINTENANCE") return "Maintenance";
      if(x==="KITS") return "Kits & conso";
      if(x==="PHOTOS") return "Photos";
      return x || "—";
    }

    function getInterventionTitle(key, iv){
      if(iv?.label) return String(iv.label);
      if(key === "arrival") return "Arrivée";
      if(key === "midstay") return "Inter-séjour";
      if(key === "departure") return "Départ";
      if(key === "other") return "Libre";
      return "Intervention";
    }

    function normalizeInterventions(eventDoc){
      const e = eventDoc || {};
      const src = (e.interventions && typeof e.interventions === "object")
        ? e.interventions
        : null;

      if(src){
        const keys = ["arrival","midstay","departure","other"];
        return keys.map((key)=> {
          const raw = src[key] || {};
          return {
            key,
            title: getInterventionTitle(key, raw),
            type: String(raw.type || "").trim(),
            dateKey: String(raw.dateKey || "").trim(),
            note: String(raw.note || "").trim(),
            lines: Array.isArray(raw.lines) ? raw.lines : [],
            completed: !!raw.completedAt || !!raw.validatedAt
          };
        });
      }

      const legacyLines = Array.isArray(e.lines) ? e.lines : [];
      return [{
        key: "legacy",
        title: "Prestation",
        type: String(e.type || "").trim(),
        dateKey: String(e.dateKey || e.date || "").trim(),
        note: String(e.meta || "").trim(),
        lines: legacyLines,
        completed: false
      }];
    }

    function flattenAllLines(interventions){
      return (interventions || []).flatMap(iv => Array.isArray(iv.lines) ? iv.lines : []);
    }

    function findIntervention(interventions, key){
      return (interventions || []).find(iv => iv.key === key) || null;
    }

    function interventionHasContent(iv){
      if(!iv) return false;
      return (Array.isArray(iv.lines) && iv.lines.length > 0) || !!String(iv.note || "").trim();
    }

    function missionsFromOneIntervention(iv){
      const out = new Set();
      if(!iv) return [];

      const lines = Array.isArray(iv.lines) ? iv.lines : [];

      for(const l of lines){
        const label = normTxt(l?.label || l?.name || l?.title || "");
        const category = normTxt(l?.category || "");
        if(!label && !category) continue;

        const text = `${label} ${category}`.trim();

        if(
          label.includes("check-in") ||
          label.includes("check in") ||
          label.includes("arrivee")
        ){
          out.add("CHECKIN");
        }

        if(
          label.includes("check-out") ||
          label.includes("check out")
        ){
          out.add("CHECKOUT");
        }

        if(
          label.includes("menage") ||
          label.includes("nettoyage")
        ){
          out.add("MENAGE");
        }

        if(
          text.includes("linge") ||
          text.includes("drap") ||
          text.includes("serviette") ||
          text.includes("collecte") ||
          text.includes("lavage") ||
          text.includes("sechage") ||
          text.includes("lessive") ||
          text.includes("blanch")
        ){
          out.add("LINGE");
        }

        if(
          text.includes("maintenance") ||
          text.includes("reparation") ||
          text.includes("bricol") ||
          text.includes("artisan") ||
          text.includes("fuite") ||
          text.includes("serrure") ||
          text.includes("urgence") ||
          text.includes("ampoule") ||
          text.includes("joint")
        ){
          out.add("MAINTENANCE");
        }

        if(
          text.includes("kit") ||
          text.includes("consommable") ||
          text.includes("capsule") ||
          text.includes("shampo") ||
          text.includes("savon") ||
          text.includes("reassort")
        ){
          out.add("KITS");
        }
      }

      const order = ["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"];
      return order.filter(x => out.has(x));
    }

    function getSelectedInterventionKeys(){
      return Array.from(sendSelectorBox.querySelectorAll('input[type="checkbox"][data-iv-key]:checked'))
        .map(el => String(el.getAttribute("data-iv-key") || "").trim())
        .filter(Boolean);
    }

    function buildMissionTypesFromSelection(interventions, selectedKeys){
      const out = new Set();
      for(const key of selectedKeys){
        const iv = findIntervention(interventions, key);
        const missionTypes = missionsFromOneIntervention(iv);
        missionTypes.forEach(t => out.add(t));
      }
      const order = ["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"];
      return order.filter(x => out.has(x));
    }

    function renderSendSelector(interventions, agentLinks = {}){
      sendSelectorBox.innerHTML = "";
      const visible = (Array.isArray(interventions) ? interventions : []).filter(interventionHasContent);

      if(!visible.length){
        sendSelectorBox.innerHTML = `<div class="mini">Aucune intervention exploitable.</div>`;
        return;
      }

      for(const iv of visible){
        const lines = Array.isArray(iv.lines) ? iv.lines : [];
        const subtotal = computeTotalFromLines(lines);
        const missionTypes = missionsFromOneIntervention(iv);
        const linkMeta = agentLinks?.[iv.key] || null;
        const sentTxt = formatTs(linkMeta?.sentAt);
        const isSent = !!linkMeta?.tokenId;

        const row = document.createElement("label");
        row.className = "selectorRow";
        row.innerHTML = `
          <input type="checkbox" data-iv-key="${esc(iv.key)}" ${isSent ? "checked" : ""}>
          <div class="selectorMain">
            <div class="selectorHead">
              <div class="selectorTitle">${esc(iv.title)} • ${esc(iv.dateKey || "—")}</div>
              ${sentTxt ? `<span class="sentBadge">Envoyé le ${esc(sentTxt)}</span>` : ``}
            </div>
            <div class="selectorSub">${esc(`${lines.length} ligne(s) • ${money(subtotal)}${missionTypes.length ? " • " + missionTypes.map(missionLabel).join(", ") : ""}`)}</div>
          </div>
        `;
        sendSelectorBox.appendChild(row);
      }

      sendSelectorBox.querySelectorAll('input[type="checkbox"][data-iv-key]').forEach(el=>{
        el.addEventListener("change", refreshMissionHintFromSelection);
      });
    }

    function refreshMissionHintFromSelection(){
      const selectedKeys = getSelectedInterventionKeys();
      const missionTypes = buildMissionTypesFromSelection(currentInterventions, selectedKeys);

      const parts = selectedKeys.map(key=>{
        const iv = findIntervention(currentInterventions, key);
        if(!iv) return null;
        const m = missionsFromOneIntervention(iv).map(missionLabel).join(", ");
        return `${iv.title} (${iv.dateKey || "—"}${m ? " • " + m : ""})`;
      }).filter(Boolean);

      if(!parts.length){
        missionsHint.innerHTML = `<b>Résumé agent :</b> aucune intervention sélectionnée.`;
        return;
      }

      missionsHint.innerHTML =
        `<b>Résumé agent :</b> ${esc(parts.join(" | "))}` +
        `${missionTypes.length ? `<br><b>Missions techniques :</b> ${esc(missionTypes.map(missionLabel).join(", "))}` : ""}`;
    }

    function isTime(s){ return /^\d{2}:\d{2}$/.test(String(s||"").trim()); }

    function toLocalMs(dateKey, timeHHmm){
      const d = String(dateKey||"").trim();
      if(!isDateKey(d)) return 0;
      const t = isTime(timeHHmm) ? String(timeHHmm).trim() : "00:00";
      const dt = new Date(`${d}T${t}:00`);
      const ms = dt.getTime();
      return Number.isFinite(ms) ? ms : 0;
    }

    function pickFirst(...vals){
      for(const v of vals){
        const s = String(v || "").trim();
        if(s) return s;
      }
      return "";
    }

    function computeScheduleForMission(eventDoc, missionType){
      const e = eventDoc || {};
      const interventions = normalizeInterventions(e);

      const arrivalIv   = findIntervention(interventions, "arrival");
      const midstayIv   = findIntervention(interventions, "midstay");
      const departureIv = findIntervention(interventions, "departure");
      const otherIv     = findIntervention(interventions, "other");

      const aDate = pickFirst(arrivalIv?.dateKey, e.arrivalDateKey, e.dateKey, e.date);
      const aTime = pickFirst(e.arrivalTime, e.time);

      const mDate = pickFirst(midstayIv?.dateKey, e.interstayDateKey);
      const mTime = pickFirst(e.interstayTime);

      const dDate = pickFirst(departureIv?.dateKey, e.departureDateKey);
      const dTime = pickFirst(e.departureTime);

      const oDate = pickFirst(otherIv?.dateKey, e.maintenanceDateKey, e.maintenanceScheduledDateKey, e.maintenanceDate);
      const oTime = pickFirst(e.maintenanceTime, e.maintenanceScheduledTime, e.maintenanceHour);

      const lDate = pickFirst(mDate, e.lingeDateKey, e.lingeScheduledDateKey, aDate);
      const lTime = pickFirst(mTime, e.lingeTime, e.lingeScheduledTime, aTime);

      const kDate = pickFirst(aDate, e.kitsDateKey, e.kitsScheduledDateKey);
      const kTime = pickFirst(aTime, e.kitsTime, e.kitsScheduledTime);

      const type = String(missionType||"").toUpperCase().trim();

      let scheduledDateKey = aDate;
      let scheduledTime = aTime;
      let scheduleSource = "ARRIVAL";

      if(type === "CHECKOUT"){
        scheduledDateKey = dDate || aDate;
        scheduledTime = dTime || aTime;
        scheduleSource = dDate ? "DEPARTURE" : "ARRIVAL";
      } else if(type === "CHECKIN"){
        scheduledDateKey = aDate;
        scheduledTime = aTime;
        scheduleSource = "ARRIVAL";
      } else if(type === "MENAGE"){
        scheduledDateKey = mDate || aDate;
        scheduledTime = mTime || aTime;
        scheduleSource = mDate ? "INTERSTAY" : "ARRIVAL";
      } else if(type === "MAINTENANCE"){
        scheduledDateKey = oDate || aDate;
        scheduledTime = oTime || aTime;
        scheduleSource = oDate ? "OTHER" : "ARRIVAL";
      } else if(type === "LINGE"){
        scheduledDateKey = lDate || aDate;
        scheduledTime = lTime || aTime;
        scheduleSource = lDate === mDate && mDate ? "INTERSTAY" : "ARRIVAL";
      } else if(type === "KITS"){
        scheduledDateKey = kDate || aDate;
        scheduledTime = kTime || aTime;
        scheduleSource = "ARRIVAL";
      }

      const scheduledAtMs = toLocalMs(scheduledDateKey, scheduledTime);

      return {
        scheduledDateKey: scheduledDateKey || "",
        scheduledTime: scheduledTime || "",
        scheduledAtMs: scheduledAtMs || 0,
        scheduleSource
      };
    }

    const prestationId = qs("prestationId");
    let currentUser = null;
    let currentEvent = null;
    let currentInterventions = [];

    function renderInterventions(interventions){
      linesBox.innerHTML = "";

      const list = Array.isArray(interventions) ? interventions : [];
      if(!list.length){
        linesBox.innerHTML = `<div class="mini">Aucune ligne.</div>`;
        return;
      }

      const nonEmpty = list.filter(iv => Array.isArray(iv.lines) && iv.lines.length);
      const finalList = nonEmpty.length ? nonEmpty : list;

      for(const iv of finalList){
        const div = document.createElement("div");
        div.className = "ivBlock";

        const lines = Array.isArray(iv.lines) ? iv.lines : [];
        const subtotal = computeTotalFromLines(lines);
        const badge = `${iv.dateKey || "—"} • ${money(subtotal)}`;

        let html = `
          <div class="ivHead">
            <div class="ivTitle">${esc(iv.title || "Intervention")}</div>
            <div class="ivBadge">${esc(badge)}</div>
          </div>
        `;

        if(iv.note){
          html += `<div class="ivNote">${esc(iv.note)}</div>`;
        }

        if(!lines.length){
          html += `<div class="mini">Aucune ligne dans cette intervention.</div>`;
        }else{
          html += lines.map(l=>{
            const qty = Number(l?.qty || 0);
            const unit = String(l?.unit || "unité");
            const up = Number(l?.unitPrice || 0);
            const lt = qty * up;

            return `
              <div class="lineItem">
                <div style="min-width:0;flex:1;">
                  <div class="t">${esc(l?.label || "Ligne")}</div>
                  <div class="s">${esc(`${qty} ${unit} • ${money(up)} / ${unit}`)}</div>
                  ${l?.category ? `<div class="s">${esc(`Catégorie : ${l.category}`)}</div>` : ``}
                  ${l?.note ? `<div class="s">${esc(l.note)}</div>` : ``}
                </div>
                <div style="font-weight:900;white-space:nowrap;">${esc(money(lt))}</div>
              </div>
            `;
          }).join("");
        }

        div.innerHTML = html;
        linesBox.appendChild(div);
      }
    }

    async function loadCompanyName(user){
      try{
        const uSnap = await getDoc(doc(db, "users", user.uid));
        const company = uSnap.exists() ? (uSnap.data()?.businessProfile?.companyName || "") : "";
        const name = (company || "").trim() || "Conciergerie";
        companyLine.textContent = name;
        helloLine.textContent = "Bonjour,";
        if(!String(conciergerieName.value || "").trim()) conciergerieName.value = name;
      }catch{
        companyLine.textContent = "Conciergerie";
        helloLine.textContent = "Bonjour,";
        if(!String(conciergerieName.value || "").trim()) conciergerieName.value = "Conciergerie";
      }
    }

    async function load(){
      hideAlert();
      subLine.textContent = "Chargement…";

      if(!prestationId){
        subLine.textContent = "";
        return showAlert("prestationId manquant (URL).");
      }

      const eSnap = await getDoc(doc(db, "events", prestationId));
      if(!eSnap.exists()){
        subLine.textContent = "";
        return showAlert("Prestation introuvable.");
      }

      const e = eSnap.data() || {};

      if(String(e.conciergerieUid || "") !== String(currentUser?.uid || "")){
        subLine.textContent = "";
        return showAlert("⛔ Accès refusé : cette prestation ne vous appartient pas.");
      }

      currentEvent = { id: eSnap.id, ...e };
      currentInterventions = normalizeInterventions(currentEvent);

      homeLine.textContent = e.homeName || "Logement";

      const aDate = e.arrivalDateKey || e.dateKey || e.date || "";
      const aTime = e.arrivalTime || e.time || "";
      arrLine.textContent = (aDate ? aDate : "—") + (aTime ? " • " + aTime : "");

      const mDate = e.interstayDateKey || findIntervention(currentInterventions, "midstay")?.dateKey || "";
      midLine.textContent = mDate || "—";

      const dDate = e.departureDateKey || "";
      const dTime = e.departureTime || "";
      depLine.textContent = (dDate ? dDate : "—") + (dTime ? " • " + dTime : "");

      const addr = (e.homeAddress || e.address || "").trim();
      const zip  = (e.homeZip || e.zip || "").trim();
      const city = (e.homeCity || e.city || "").trim();
      addrLine.textContent = [addr, zip, city].filter(Boolean).join(" ").trim() || "—";

      const owner = (e.ownerName || "").trim();
      const phone = (e.ownerPhone || e.phone || "").trim();
      ownerLine.textContent = [owner, phone].filter(Boolean).join(" • ") || "—";

      const note = (e.meta || "").trim();
      if(note){
        noteLine.style.display = "block";
        noteLine.textContent = note;
      }else{
        noteLine.style.display = "none";
        noteLine.textContent = "";
      }

      renderInterventions(currentInterventions);

      const flatLines = flattenAllLines(currentInterventions);
      const total = (e.total != null) ? Number(e.total) : computeTotalFromLines(flatLines);
      totalValue.textContent = money(total);

      renderSendSelector(currentInterventions, e.agentLinks || {});
      refreshMissionHintFromSelection();

      agentName.value = e.assignedToName || "";
      agentEmail.value = e.assignedToEmail || "";

      subLine.textContent = "";
    }

    async function upsertMissionForToken({ tokenId, email, name, missionType }) {
      const mRef = doc(db, "events", prestationId, "missions", missionType);

      let locked = false;
      try{
        const mSnap = await getDoc(mRef);
        if(mSnap.exists()){
          locked = !!(mSnap.data()?.locked);
        }
      }catch{
        locked = false;
      }

      if(locked) return;

      const sched = computeScheduleForMission(currentEvent, missionType);

      await setDoc(mRef, {
        type: missionType,
        missionId: missionType,
        conciergerieUid: currentUser.uid,
        eventId: String(prestationId),
        prestationId: String(prestationId),

        scheduledDateKey: sched.scheduledDateKey || "",
        scheduledTime: sched.scheduledTime || "",
        scheduledAtMs: Number(sched.scheduledAtMs || 0) || 0,
        scheduleSource: sched.scheduleSource || "ARRIVAL",

        locked: false,
        agentDone: false,
        status: "ASSIGNEE",

        dayToken: tokenId,

        assignedToEmail: email,
        assignedToName: name,

        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    async function removeMissionIfUnlocked(missionType){
      if(!missionType || missionType === "PHOTOS") return;

      const mRef = doc(db, "events", prestationId, "missions", missionType);

      try{
        const mSnap = await getDoc(mRef);
        if(!mSnap.exists()) return;

        const d = mSnap.data() || {};
        const locked = !!d.locked;
        const status = String(d.status || "").toUpperCase().trim();

        if(locked) return;
        if(status === "VALIDEE") return;

        await deleteDoc(mRef);
      }catch(err){
        console.warn("removeMissionIfUnlocked", missionType, err);
      }
    }

    async function upsertPhotosMissionForToken({ tokenId }) {
      const mRef = doc(db, "events", prestationId, "missions", "PHOTOS");

      let locked = false;
      try{
        const mSnap = await getDoc(mRef);
        if(mSnap.exists()){
          locked = !!(mSnap.data()?.locked);
        }
      }catch{
        locked = false;
      }

      if(locked) return;

      await setDoc(mRef, {
        missionId: "PHOTOS",
        type: "PHOTOS",
        conciergerieUid: currentUser.uid,
        eventId: String(prestationId),
        prestationId: String(prestationId),

        dayToken: tokenId,

        proofPhotos: [],
        proofPhotosCount: 0,
        proofPhotosAtMs: 0,
        proofToken: tokenId,

        locked: false,
        agentDone: false,
        status: "ASSIGNEE",

        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    async function generateLinks(){
      hideAlert();

      if(!currentEvent) return showAlert("Prestation non chargée.");
      if(!currentUser) return showAlert("Utilisateur non authentifié.");

      const email = normalizeEmail(agentEmail.value);
      const name = (agentName.value || "").trim();
      if(!email || !name) return showAlert("Nom + email agent requis.");
      if(!/^\S+@\S+\.\S+$/.test(email)) return showAlert("Email agent invalide.");

      const selectedKeys = getSelectedInterventionKeys();
      if(!selectedKeys.length){
        return showAlert("Choisis au moins une intervention à envoyer.");
      }

      const missionTypes = buildMissionTypesFromSelection(currentInterventions, selectedKeys);
      if(!missionTypes.length){
        return showAlert("Aucune mission exploitable pour les interventions cochées.");
      }

      const tokenId = randomToken(20);
      const expiresAtMs = Date.now() + 24*60*60*1000;
      const expiresAt = Timestamp.fromMillis(expiresAtMs);

      const e = currentEvent || {};
      const selectedInterventions = selectedKeys.map(key => {
        const iv = findIntervention(currentInterventions, key);
        return iv ? {
          key: iv.key,
          label: iv.title,
          dateKey: iv.dateKey || "",
          note: iv.note || ""
        } : null;
      }).filter(Boolean);

      const prestaSnapshot = {
        homeName: e.homeName || "Logement",
        homeCity: (e.homeCity || "").trim(),
        arrivalDateKey: e.arrivalDateKey || e.dateKey || e.date || "",
        arrivalTime: e.arrivalTime || e.time || "",
        interstayDateKey: e.interstayDateKey || findIntervention(currentInterventions, "midstay")?.dateKey || "",
        departureDateKey: e.departureDateKey || "",
        departureTime: e.departureTime || "",
        homeAddress: (e.homeAddress || e.address || "").trim(),
        homeZip: (e.homeZip || e.zip || "").trim(),
        meta: (e.meta || "").trim(),
        selectedInterventions
      };

      const missionSchedules = {};
      for(const t of missionTypes){
        const s = computeScheduleForMission(currentEvent, t);
        missionSchedules[t] = {
          scheduledDateKey: s.scheduledDateKey || "",
          scheduledTime: s.scheduledTime || "",
          scheduledAtMs: Number(s.scheduledAtMs || 0) || 0,
          scheduleSource: s.scheduleSource || "ARRIVAL"
        };
      }

      await setDoc(doc(db,"dayTokens",tokenId),{
        conciergerieUid: currentUser.uid,
        prestationId: String(prestationId),

        agentEmail: email,
        agentName: name,
        conciergerieName: (conciergerieName?.value || "").trim() || null,

        selectedInterventionKeys: selectedKeys,
        selectedInterventions,
        missionTypes,
        missionSchedules,
        presta: prestaSnapshot,

        active:true,
        expiresAt,
        expiresAtMs,
        createdAt: serverTimestamp()
      });

      for (const t of missionTypes) {
        await upsertMissionForToken({ tokenId, email, name, missionType: t });
      }

      await updateDoc(doc(db, "users", currentUser.uid), {
        "onboarding.firstMissionCreated": true,
        "onboarding.updatedAt": serverTimestamp()
      });

      for (const t of ALL_TECH_MISSIONS) {
        if(!missionTypes.includes(t)){
          await removeMissionIfUnlocked(t);
        }
      }

      await upsertPhotosMissionForToken({ tokenId });

      const eventPatch = {
        assignedToEmail: email,
        assignedToName: name,
        dayToken: tokenId,
        missionTypes,
        missionsInitialized: true,
        updatedAt: serverTimestamp()
      };

      const visibleInterventions = (Array.isArray(currentInterventions) ? currentInterventions : []).filter(interventionHasContent);
      for(const iv of visibleInterventions){
        eventPatch[`agentLinks.${iv.key}`] = deleteField();
      }

      for(const ivKey of selectedKeys){
        eventPatch[`agentLinks.${ivKey}.sentAt`] = serverTimestamp();
        eventPatch[`agentLinks.${ivKey}.sentToEmail`] = email;
        eventPatch[`agentLinks.${ivKey}.sentToName`] = name;
        eventPatch[`agentLinks.${ivKey}.tokenId`] = tokenId;
      }

      await updateDoc(doc(db,"events",prestationId), eventPatch);

      const base = location.href.split("?")[0];

      const tokenLink =
        base.replace("intervention.html","agent.html")
        + `?token=${encodeURIComponent(tokenId)}&prestationId=${encodeURIComponent(prestationId)}`;

      const photosLink =
        base.replace("intervention.html","agent-photos.html")
        + `?token=${encodeURIComponent(tokenId)}&prestationId=${encodeURIComponent(prestationId)}`;

      linkBox.value =
        `Checklist (token 24h):\n${tokenLink}\n\n` +
        `Photos (token 24h):\n${photosLink}\n\n` +
        `Interventions envoyées:\n${selectedInterventions.map(iv => `- ${iv.label} (${iv.dateKey || "—"})`).join("\n")}\n\n` +
        `Missions autorisées:\n${missionTypes.join(", ")}`;

      copyBtn.disabled = false;
      mailtoBtn.disabled = false;

      showAlert("Liens générés pour les interventions cochées.", true);
      await load();
    }

    copyBtn.addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText(linkBox.value || "");
        showAlert("Copié.", true);
      }catch{
        showAlert("Copie impossible. Copie manuelle.");
      }
    });

    mailtoBtn.addEventListener("click", ()=>{
      const to = normalizeEmail(agentEmail.value);
      const name = (agentName.value || "").trim();
      if(!to) return showAlert("Email agent manquant.");
      if(!linkBox.value) return showAlert("Génère d’abord les liens.");

      const subject = encodeURIComponent("Mission CleanUp — liens (checklist + photos)");
      const body = encodeURIComponent(
        `Bonjour ${name || ""},\n\n` +
        `Voici tes liens :\n\n` +
        `${linkBox.value}\n\n` +
        `⚠️ Les liens (token) expirent sous 24h.\n\n` +
        `— CleanUp Manager`
      );

      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });

    genLinkBtn.addEventListener("click", async ()=>{
      genLinkBtn.disabled = true;
      genLinkBtn.textContent = "…";
      try{
        await generateLinks();
      }catch(err){
        console.error("GEN_LINKS_ERROR", err);
        showAlert(
          "Erreur génération : "
          + (err?.code || "inconnue")
          + "\nmessage : " + (err?.message || "—")
        );
      }finally{
        genLinkBtn.disabled = false;
        genLinkBtn.textContent = "Générer liens";
      }
    });

    onAuthStateChanged(auth, async (u)=>{
      if(!u){
        location.href = "login.html?role=conciergerie";
        return;
      }

      const ok = await guardConciergerie(u);
      if(!ok){
        location.href = "abonnement.html?plan=starter";
        return;
      }

      currentUser = u;

      applyBackLink();
      await loadCompanyName(u);

      try{
        await load();
      }catch(err){
        console.error(err);
        showAlert("Erreur chargement : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
