<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Intervention</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.86);
    }

    *,*::before,*::after{
      box-sizing:border-box;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }

    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 14px 26px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:30;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      text-decoration:none;
      font-weight:800;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .pill.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
    }

    .logo{
      width:100%;
      max-width:980px;
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:6px;
      margin-bottom:2px;
      text-align:center;
    }

    .logo-icon{
      width:42px;
      height:42px;
      border-radius:50%;
      background:#fff;
      border:2px solid var(--violet-main);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--violet-main);
      font-size:20px;
      font-weight:900;
      position:relative;
      flex-shrink:0;
    }

    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px;
      right:-5px;
      font-size:12px;
      color:var(--violet-main);
    }

    h1{
      margin:0;
      font-size:24px;
      font-weight:900;
    }

    .subtitle{
      width:100%;
      max-width:980px;
      font-size:13px;
      font-weight:800;
      color:#444;
      text-align:center;
    }

    .helloLine{
      width:100%;
      max-width:980px;
      margin-top:10px;
      font-size:13px;
      color:#333;
      font-weight:900;
      text-align:center;
    }

    .emailLine{
      width:100%;
      max-width:980px;
      font-size:12px;
      font-weight:800;
      color:var(--muted);
      text-align:center;
      margin-top:4px;
    }

    .sub{
      width:100%;
      max-width:980px;
      margin-top:8px;
      color:#444;
      font-size:12px;
      font-weight:800;
      text-align:left;
    }

    .alert{
      width:100%;
      max-width:980px;
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:800;
      white-space:pre-wrap;
      color:#444;
    }

    .alert.ok{
      border-left-color:var(--ok);
    }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:12px;
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    @media(min-width:900px){
      .wrap{
        grid-template-columns:1.2fr .8fr;
      }
    }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }

    .mini{
      font-size:11px;
      font-weight:900;
      color:var(--muted);
    }

    .prestaHead{
      display:flex;
      flex-direction:column;
      gap:6px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:16px;
      padding:10px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }

    .prestaTitle{
      font-size:14px;
      font-weight:900;
      color:#222;
      line-height:1.2;
    }

    .prestaMeta{
      font-size:12px;
      font-weight:800;
      color:#444;
      white-space:pre-wrap;
      line-height:1.3;
    }

    .kv{
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
    }

    .kv .k{
      font-weight:900;
    }

    .kv .v{
      font-weight:800;
      color:#333;
      text-align:right;
    }

    .linesBox{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,0.06);
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .totalBox{
      margin-top:2px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,0.06);
      border:1px solid rgba(122,92,255,0.18);
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      font-weight:900;
    }

    .hintBox{
      margin-top:8px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:10px;
      box-shadow:0 3px 10px rgba(0,0,0,0.06);
      font-size:12px;
      font-weight:800;
      color:#444;
      line-height:1.35;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="prestations.html">← Retour</a>
    </div>

    <div class="logo">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>

    <div class="subtitle">Gestion de vos prestations</div>
    <div class="helloLine" id="helloLine">Bonjour,</div>
    <div class="emailLine" id="companyLine">—</div>

    <div class="sub" id="subLine">Chargement…</div>
    <div class="alert" id="alertBox"></div>

    <div class="wrap">
      <section class="card">
        <div class="mini">Prestation</div>
        <div class="prestaHead">
          <div class="prestaTitle" id="homeLine">—</div>
          <div class="kv"><div class="k">Arrivée :</div><div class="v" id="arrLine">—</div></div>
          <div class="kv"><div class="k">Inter-séjour :</div><div class="v" id="midLine">—</div></div>
          <div class="kv"><div class="k">Départ :</div><div class="v" id="depLine">—</div></div>
          <div class="kv"><div class="k">Adresse :</div><div class="v" id="addrLine">—</div></div>
          <div class="kv"><div class="k">Propriétaire :</div><div class="v" id="ownerLine">—</div></div>
          <div class="prestaMeta" id="noteLine" style="display:none;"></div>
        </div>

        <div class="mini">Interventions / lignes</div>
        <div class="linesBox" id="linesBox"></div>

        <div class="totalBox">
          <div>Total</div>
          <div id="totalValue">0,00 €</div>
        </div>

        <div class="hintBox" id="missionsHint">
          <b>Résumé agent :</b> —
        </div>
      </section>

      <aside class="card">
        <div style="font-weight:900;">Liens agent</div>

        <label class="mini">Nom agent</label>
        <input id="agentName" type="text" />

        <label class="mini">Email agent</label>
        <input id="agentEmail" type="email" />

        <label class="mini">Nom conciergerie</label>
        <input id="conciergerieName" type="text" />

        <div class="mini">Interventions à envoyer</div>
        <div id="sendSelectorBox"></div>

        <div class="btnrow">
          <button class="pill primary" id="genLinkBtn" type="button">Générer liens</button>
          <button class="pill" id="copyBtn" type="button" disabled>Copier</button>
          <button class="pill" id="mailtoBtn" type="button" disabled>Envoyer email</button>
        </div>

        <textarea id="linkBox" rows="8" readonly></textarea>
      </aside>
    </div>
  </div>

  <script type="module">
        import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc, updateDoc, deleteDoc, deleteField,
      serverTimestamp, Timestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const helloLine = document.getElementById("helloLine");
    const companyLine = document.getElementById("companyLine");
    const backBtn = document.getElementById("backBtn");
    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");

    const homeLine = document.getElementById("homeLine");
    const arrLine  = document.getElementById("arrLine");
    const midLine  = document.getElementById("midLine");
    const depLine  = document.getElementById("depLine");
    const addrLine = document.getElementById("addrLine");
    const ownerLine= document.getElementById("ownerLine");
    const noteLine = document.getElementById("noteLine");

    const linesBox = document.getElementById("linesBox");
    const totalValue = document.getElementById("totalValue");
    const missionsHint = document.getElementById("missionsHint");

    const agentName = document.getElementById("agentName");
    const agentEmail = document.getElementById("agentEmail");
    const conciergerieName = document.getElementById("conciergerieName");

    const sendSelectorBox = document.getElementById("sendSelectorBox");

    const genLinkBtn = document.getElementById("genLinkBtn");
    const copyBtn = document.getElementById("copyBtn");
    const mailtoBtn = document.getElementById("mailtoBtn");
    const linkBox = document.getElementById("linkBox");

    const ALL_TECH_MISSIONS = ["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"];

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }

    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function qs(name){
      return new URLSearchParams(location.search).get(name) || "";
    }

    function normalizeEmail(s){
      return (s || "").trim().toLowerCase();
    }

    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR",{
        minimumFractionDigits:2,
        maximumFractionDigits:2
      }) + " €";
    }

    function randomToken(len=20){
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);

      let out = "";
      for(const n of arr){
        out += chars[n % chars.length];
      }
      return out;
    }

    async function guardConciergerie(user){
      try{
        const snap = await getDoc(doc(db,"users",user.uid));
        if(!snap.exists()) return false;

        const d = snap.data() || {};
        const sub = String(d.subscriptionStatus || "").toLowerCase();

        return (d.role === "conciergerie" || d.role === "admin")
          && (sub === "active" || sub === "cancel_at_period_end");
      }catch(e){
        return false;
      }
    }

    const prestationId = qs("prestationId");
    let currentUser = null;
    let currentEvent = null;

    async function loadCompanyName(user){
      try{
        const snap = await getDoc(doc(db,"users",user.uid));
        const company = snap.exists()
          ? (snap.data()?.businessProfile?.companyName || "")
          : "";

        const name = company.trim() || "Conciergerie";

        companyLine.textContent = name;
        conciergerieName.value = name;
      }catch{
        companyLine.textContent = "Conciergerie";
        conciergerieName.value = "Conciergerie";
      }
    }

    async function load(){
      if(!prestationId){
        showAlert("prestationId manquant.");
        return;
      }

      const snap = await getDoc(doc(db,"events",prestationId));
      if(!snap.exists()){
        showAlert("Prestation introuvable.");
        return;
      }

      const e = snap.data() || {};
      currentEvent = { id:snap.id, ...e };

      homeLine.textContent = e.homeName || "Logement";
      arrLine.textContent = e.arrivalDateKey || "—";
      midLine.textContent = e.interstayDateKey || "—";
      depLine.textContent = e.departureDateKey || "—";
      addrLine.textContent = e.homeAddress || "—";
      ownerLine.textContent = e.ownerName || "—";

      const total = Number(e.total || 0);
      totalValue.textContent = money(total);

      missionsHint.innerHTML = `<b>Résumé agent :</b> prêt à envoyer`;
    }

    async function upsertMissionForToken({ tokenId, email, name, missionType }){
      const ref = doc(db,"events",prestationId,"missions",missionType);

      await setDoc(ref,{
        missionId: missionType,
        type: missionType,
        conciergerieUid: currentUser.uid,
        eventId: prestationId,
        prestationId: prestationId,
        assignedToEmail: email,
        assignedToName: name,
        dayToken: tokenId,
        locked: false,
        agentDone: false,
        status: "ASSIGNEE",
        updatedAt: serverTimestamp()
      },{ merge:true });
    }

    async function generateLinks(){
      hideAlert();

      const email = normalizeEmail(agentEmail.value);
      const name = (agentName.value || "").trim();

      if(!email || !name){
        showAlert("Nom + email requis.");
        return;
      }

      const tokenId = randomToken(20);

      const missionTypes = ["MENAGE","CHECKIN"];

      await setDoc(doc(db,"dayTokens",tokenId),{
        conciergerieUid: currentUser.uid,
        prestationId,
        agentEmail: email,
        agentName: name,
        createdAt: serverTimestamp(),
        expiresAt: Timestamp.fromMillis(Date.now() + 86400000)
      });

      for(const t of missionTypes){
        await upsertMissionForToken({
          tokenId,
          email,
          name,
          missionType:t
        });
      }

      await updateDoc(doc(db, "users", currentUser.uid), {
        "onboarding.firstMissionCreated": true,
        "onboarding.updatedAt": serverTimestamp()
      });

      await updateDoc(doc(db,"events",prestationId),{
        assignedToEmail: email,
        assignedToName: name,
        dayToken: tokenId,
        missionTypes,
        missionsInitialized: true,
        updatedAt: serverTimestamp()
      });

      const base = location.href.split("?")[0];

      const tokenLink =
        base.replace("intervention.html","agent.html")
        + `?token=${encodeURIComponent(tokenId)}&prestationId=${encodeURIComponent(prestationId)}`;

      linkBox.value = tokenLink;

      copyBtn.disabled = false;
      mailtoBtn.disabled = false;

      showAlert("Liens générés.", true);
    }

    genLinkBtn.addEventListener("click", async ()=>{
      genLinkBtn.disabled = true;
      try{
        await generateLinks();
      }catch(err){
        console.error(err);
        showAlert("Erreur génération.");
      }finally{
        genLinkBtn.disabled = false;
      }
    });

    copyBtn.addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText(linkBox.value || "");
        showAlert("Copié.", true);
      }catch{
        showAlert("Copie impossible.");
      }
    });

    mailtoBtn.addEventListener("click", ()=>{
      const to = normalizeEmail(agentEmail.value);
      if(!to) return;

      const subject = encodeURIComponent("Mission CleanUp");
      const body = encodeURIComponent(linkBox.value);

      location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });

    onAuthStateChanged(auth, async (u)=>{
      if(!u){
        location.href = "login.html?role=conciergerie";
        return;
      }

      const ok = await guardConciergerie(u);
      if(!ok){
        location.href = "abonnement.html?plan=starter";
        return;
      }

      currentUser = u;
      await loadCompanyName(u);
      await load();
    });
  </script>
</body>
</html>
