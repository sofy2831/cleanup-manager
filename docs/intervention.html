<!-- docs/intervention.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Intervention</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.86);
    }
    *,*::before,*::after{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 26px; }
    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main);
      color:var(--violet-main); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff;
    }

    .wrap{ width:100%; max-width:980px; margin-top:10px; display:grid; grid-template-columns:1fr; gap:10px; }
    @media(min-width:900px){ .wrap{ grid-template-columns: 1.2fr .8fr; } }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .sub{ margin-top:4px; color:#444; font-size:12px; font-weight:800; }
    .alert{
      display:none; margin-top:10px; padding:10px 12px; border-radius:14px;
      background:#fff; border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }
    .mini{ font-size:11px; font-weight:900; color:var(--muted); }

    /* bloc "prestation" compact */
    .prestaHead{
      display:flex; flex-direction:column; gap:6px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:16px;
      padding:10px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .prestaTitle{
      font-size:14px;
      font-weight:900;
      color:#222;
      line-height:1.2;
    }
    .prestaMeta{
      font-size:12px;
      font-weight:800;
      color:#444;
      white-space:pre-wrap;
      line-height:1.3;
    }
    .kv{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .kv .k{ font-weight:900; }
    .kv .v{ font-weight:800; color:#333; text-align:right; }

    /* lignes / total */
    .linesBox{
      background:#fff;
      border-radius:16px;
      border:1px solid rgba(0,0,0,0.03);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }
    .lineItem{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      border:1px solid rgba(122,92,255,0.12);
      background:rgba(122,92,255,0.04);
      border-radius:14px;
      padding:10px;
    }
    .lineItem .t{ font-weight:900; font-size:13px; color:#222; }
    .lineItem .s{ margin-top:4px; font-size:12px; font-weight:800; color:#666; }
    .totalBox{
      margin-top:2px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      border:1px solid rgba(122,92,255,0.18);
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
      font-weight:900;
    }
    .totalBox .mut{ font-weight:800; color:#666; }

    label.mini{ display:block; margin-top:10px; }
    input, textarea{
      width:100%; padding:10px; border-radius:12px;
      border:1px solid #D3C7FF; background:#fff;
      font-size:13px; outline:none;
    }
    textarea{ resize:vertical; }
    .btnrow{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; align-items:center; }

    .hintBox{
      margin-top:8px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:10px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:800;
      color:#444;
      line-height:1.35;
    }
    .hintBox b{ font-weight:900; }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="prestations.html">← Retour</a>
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>

    <div style="width:100%;max-width:980px;margin-top:8px;">
      <div class="sub" id="subLine">Chargement…</div>
      <div class="alert" id="alertBox"></div>
    </div>

    <div class="wrap">
      <!-- GAUCHE -->
      <section class="card">
        <div class="mini">Prestation</div>

        <!-- En-tête -->
        <div class="prestaHead">
          <div class="prestaTitle" id="homeLine">—</div>

          <div class="kv">
            <div class="k">Arrivée :</div>
            <div class="v" id="arrLine">—</div>
          </div>

          <div class="kv">
            <div class="k">Départ :</div>
            <div class="v" id="depLine">—</div>
          </div>

          <div class="kv">
            <div class="k">Adresse :</div>
            <div class="v" id="addrLine">—</div>
          </div>

          <div class="kv">
            <div class="k">Propriétaire :</div>
            <div class="v" id="ownerLine">—</div>
          </div>

          <div class="prestaMeta" id="noteLine" style="display:none;"></div>
        </div>

        <!-- LIGNES + TOTAL -->
        <div class="mini">Lignes</div>
        <div class="linesBox" id="linesBox"></div>

        <div class="totalBox">
          <div class="mut">Total</div>
          <div id="totalValue">0,00 €</div>
        </div>

        <div class="hintBox" id="missionsHint">
          <b>Missions envoyées à l’agent :</b> —
          
        </div>
      </section>

      <!-- DROITE -->
      <aside class="card">
        <div style="font-weight:900;">Lien agent</div>

        <label class="mini">Nom agent</label>
        <input id="agentName" type="text" placeholder="Ex. Carla" />

        <label class="mini">Email agent</label>
        <input id="agentEmail" type="email" placeholder="ex. agent@email.com" />

        <div class="btnrow">
          <button class="pill primary" id="genLinkBtn" type="button">Générer lien</button>
          <button class="pill" id="copyBtn" type="button" disabled>Copier</button>
          <button class="pill" id="mailtoBtn" type="button" disabled>Envoyer email</button>
        </div>

        <textarea id="linkBox" rows="4" style="margin-top:8px;" readonly placeholder="Le lien apparaîtra ici…"></textarea>

        <div class="mini" style="margin-top:10px;">
          Token 24h.
        </div>
      </aside>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc, setDoc, serverTimestamp, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const subLine = document.getElementById("subLine");

    const homeLine = document.getElementById("homeLine");
    const arrLine  = document.getElementById("arrLine");
    const depLine  = document.getElementById("depLine");
    const addrLine = document.getElementById("addrLine");
    const ownerLine= document.getElementById("ownerLine");
    const noteLine = document.getElementById("noteLine");

    const linesBox = document.getElementById("linesBox");
    const totalValue = document.getElementById("totalValue");
    const missionsHint = document.getElementById("missionsHint");

    const agentName = document.getElementById("agentName");
    const agentEmail = document.getElementById("agentEmail");
    const genLinkBtn = document.getElementById("genLinkBtn");
    const copyBtn = document.getElementById("copyBtn");
    const mailtoBtn = document.getElementById("mailtoBtn");
    const linkBox = document.getElementById("linkBox");
    const logoutBtn = document.getElementById("logoutBtn");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
    function normalizeEmail(s){ return (s||"").trim().toLowerCase(); }

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
    }
    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0)*(Number(l?.unitPrice)||0), 0);
    }

    function randomToken(len=20){
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      const arr = new Uint32Array(len);
      crypto.getRandomValues(arr);
      let out = "";
      for(const n of arr) out += chars[n % chars.length];
      return out;
    }

    // =========================
    // Déduction automatique des missions depuis les lignes
    // =========================
    function normTxt(s){
      return String(s||"")
        .toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g,""); // vire accents
    }

    function missionTypesFromLines(lines, fallbackType){
      const out = new Set();

      // 1) Si event.type est déjà un missionType connu
      const ft = String(fallbackType||"").toUpperCase().trim();
      if(["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"].includes(ft)) out.add(ft);

      // 2) Analyse des labels de lignes
      if(Array.isArray(lines)){
        for(const l of lines){
          const label = normTxt(l?.label || l?.name || l?.title || "");
          if(!label) continue;

          if(label.includes("check-in") || label.includes("check in") || label.includes("arrivee") || label.includes("arrivée")) out.add("CHECKIN");
          if(label.includes("check-out") || label.includes("check out") || label.includes("depart") || label.includes("départ")) out.add("CHECKOUT");
          if(label.includes("menage") || label.includes("ménage") || label.includes("nettoyage")) out.add("MENAGE");
          if(label.includes("linge") || label.includes("drap") || label.includes("serviette")) out.add("LINGE");
          if(label.includes("maintenance") || label.includes("reparation") || label.includes("réparation") || label.includes("bricol")) out.add("MAINTENANCE");
          if(label.includes("kit") || label.includes("consommable") || label.includes("capsule") || label.includes("shampo") || label.includes("savon")) out.add("KITS");
        }
      }

      // 3) Sécurité : au moins MENAGE sinon l’agent verra vide
      if(out.size === 0) out.add("MENAGE");

      // Ordre stable
      const order = ["MENAGE","CHECKIN","CHECKOUT","LINGE","MAINTENANCE","KITS"];
      return order.filter(x => out.has(x));
    }

    function missionLabel(t){
      const x = String(t||"").toUpperCase();
      if(x==="CHECKIN") return "Check-in";
      if(x==="CHECKOUT") return "Check-out";
      if(x==="MENAGE") return "Ménage";
      if(x==="LINGE") return "Linge";
      if(x==="MAINTENANCE") return "Maintenance";
      if(x==="KITS") return "Kits & conso";
      return x || "—";
    }

    const prestationId = qs("prestationId");
    let currentUser = null;
    let currentEvent = null;
    let inferredMissionTypes = ["MENAGE"];

    function renderLines(lines){
      linesBox.innerHTML = "";
      if(!Array.isArray(lines) || !lines.length){
        linesBox.innerHTML = `<div class="mini">Aucune ligne.</div>`;
        return;
      }
      for(const l of lines){
        const qty = Number(l?.qty || 0);
        const unit = String(l?.unit || "unité");
        const up = Number(l?.unitPrice || 0);
        const lt = qty * up;

        const div = document.createElement("div");
        div.className = "lineItem";
        div.innerHTML = `
          <div style="min-width:0;flex:1;">
            <div class="t">${esc(l?.label || "Ligne")}</div>
            <div class="s">${esc(`${qty} ${unit} • ${money(up)} / ${unit}`)}</div>
            ${l?.note ? `<div class="s">${esc(l.note)}</div>` : ``}
          </div>
          <div style="font-weight:900;white-space:nowrap;">${esc(money(lt))}</div>
        `;
        linesBox.appendChild(div);
      }
    }

    async function load(){
      hideAlert();
      subLine.textContent = "Chargement…";

      if(!prestationId){
        subLine.textContent = "";
        return showAlert("prestationId manquant (URL).");
      }

      const eSnap = await getDoc(doc(db, "events", prestationId));
      if(!eSnap.exists()){
        subLine.textContent = "";
        return showAlert("Prestation introuvable.");
      }

      const e = eSnap.data() || {};
      currentEvent = { id: eSnap.id, ...e };

      // logement
      homeLine.textContent = e.homeName || "Logement";

      // arrivée
      const aDate = e.arrivalDateKey || e.dateKey || e.date || "";
      const aTime = e.arrivalTime || e.time || "";
      arrLine.textContent = (aDate ? aDate : "—") + (aTime ? " • " + aTime : "");

      // départ
      const dDate = e.departureDateKey || "";
      const dTime = e.departureTime || "";
      depLine.textContent = (dDate ? dDate : "—") + (dTime ? " • " + dTime : "");

      // adresse + CP
      const addr = (e.homeAddress || e.address || "").trim();
      const zip  = (e.homeZip || e.zip || "").trim();
      addrLine.textContent = [addr, zip].filter(Boolean).join(" ").trim() || "—";

      // propriétaire + tel
      const owner = (e.ownerName || "").trim();
      const phone = (e.ownerPhone || e.phone || "").trim();
      ownerLine.textContent = [owner, phone].filter(Boolean).join(" • ") || "—";

      // note
      const note = (e.meta || "").trim();
      if(note){
        noteLine.style.display = "block";
        noteLine.textContent = note;
      }else{
        noteLine.style.display = "none";
        noteLine.textContent = "";
      }

      // lignes + total
      const lines = Array.isArray(e.lines) ? e.lines : [];
      const total = (e.total != null) ? Number(e.total) : computeTotalFromLines(lines);
      renderLines(lines);
      totalValue.textContent = money(total);

      // ✅ missions déduites des lignes (et/ou e.type)
      inferredMissionTypes = missionTypesFromLines(lines, e.type);
      missionsHint.innerHTML = `
        <b>Missions envoyées à l’agent :</b> ${esc(inferredMissionTypes.map(missionLabel).join(", "))}
        <div class="mini" style="margin-top:6px;">
          (Déduit automatiquement des lignes. L’agent ne verra que ces missions.)
        </div>
      `;

      // agent fields
      agentName.value = e.assignedToName || "";
      agentEmail.value = e.assignedToEmail || "";

      // boutons lien
      copyBtn.disabled = !linkBox.value;
      mailtoBtn.disabled = !linkBox.value;

      subLine.textContent = "";
    }

    async function generateLink(){
      hideAlert();

      if(!currentEvent) return showAlert("Prestation non chargée.");
      if(!currentUser) return showAlert("Utilisateur non authentifié.");

      const email = normalizeEmail(agentEmail.value);
      const name = (agentName.value || "").trim();
      if(!email || !name) return showAlert("Nom + email agent requis.");
      if(!/^\S+@\S+\.\S+$/.test(email)) return showAlert("Email agent invalide.");

      // ✅ missionTypes = UNIQUEMENT celles utiles pour CE logement (déduites des lignes)
      const missionTypes = Array.isArray(inferredMissionTypes) && inferredMissionTypes.length
        ? inferredMissionTypes.slice()
        : ["MENAGE"];

      const tokenId = randomToken(20);
      const expiresAtMs = Date.now() + 24*60*60*1000;
      const expiresAt = Timestamp.fromMillis(expiresAtMs);

      // dayTokens/{token}
      await setDoc(doc(db,"dayTokens",tokenId),{
        conciergerieUid: currentUser.uid,
        prestationId: String(prestationId),
        agentEmail: email,
        agentName: name,
        missionTypes,          // ✅ clé : l’agent n’affiche QUE ça
        active:true,
        expiresAt,
        expiresAtMs,
        createdAt: serverTimestamp()
      });

      // backfill missions : UNIQUEMENT celles du token
      for (const t of missionTypes) {
        await setDoc(doc(db, "events", prestationId, "missions", t), {
          type: t,
          missionId: t,
          conciergerieUid: currentUser.uid,
          prestationId: String(prestationId),

          locked: false,
          agentDone: false,
          // photos gérées dans preuves.html (dans ce doc mission)
          photos: [],
          status: "ASSIGNEE",

          dayToken: tokenId,
          assignedToEmail: email,
          assignedToName: name,
          updatedAt: serverTimestamp()
        }, { merge: true });
      }

      // parent event
      await setDoc(doc(db,"events",prestationId),{
        assignedToEmail: email,
        assignedToName: name,
        dayToken: tokenId,
        updatedAt: serverTimestamp()
      }, { merge:true });

      const base = location.href.split("?")[0];
      const link =
        base.replace("intervention.html","agent.html")
        + `?token=${encodeURIComponent(tokenId)}&prestationId=${encodeURIComponent(prestationId)}`;

      linkBox.value = link;
      copyBtn.disabled = false;
      mailtoBtn.disabled = false;

      showAlert("Lien agent généré.", true);
      await load();
    }

    copyBtn.addEventListener("click", async ()=>{
      try{
        await navigator.clipboard.writeText(linkBox.value || "");
        showAlert("Lien copié.", true);
      }catch{
        showAlert("Copie impossible (clipboard). Copie manuelle.");
      }
    });

    mailtoBtn.addEventListener("click", ()=>{
      const to = normalizeEmail(agentEmail.value);
      const name = (agentName.value || "").trim();
      if(!to) return showAlert("Email agent manquant.");
      if(!linkBox.value) return showAlert("Génère d’abord le lien.");

      const subject = encodeURIComponent("Mission CleanUp — lien agent");
      const body = encodeURIComponent(
        `Bonjour ${name || ""},\n\n` +
        `Voici ton lien pour exécuter la mission :\n\n` +
        `${linkBox.value}\n\n` +
        `⚠️ Le lien/token expire sous 24h.\n\n` +
        `— CleanUp Manager`
      );

      window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
    });

    genLinkBtn.addEventListener("click", async ()=>{
      genLinkBtn.disabled = true;
      genLinkBtn.textContent = "…";
      try{
        await generateLink();
      }catch(err){
        console.error(err);
        showAlert("Erreur génération lien : " + (err?.code || err?.message || "inconnue"));
      }finally{
        genLinkBtn.disabled = false;
        genLinkBtn.textContent = "Générer lien";
      }
    });

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      location.href="index.html";
    });

    onAuthStateChanged(auth, async (u)=>{
      if(!u) return location.href="login.html";
      currentUser = u;
      try{ await load(); }
      catch(err){
        console.error(err);
        showAlert("Erreur chargement intervention : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
