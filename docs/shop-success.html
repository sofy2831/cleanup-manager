<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Paiement confirmé</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border:rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);
      --ok:#1b8f4d;
    }

    body{
      margin:0;
      min-height:100vh;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      width:100%;
      max-width:720px;
      background:rgba(255,255,255,0.92);
      border:1px solid var(--border);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:32px 24px;
      text-align:center;
      backdrop-filter:blur(10px);
    }

    .icon{
      width:72px;
      height:72px;
      margin:0 auto 16px;
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(27,143,77,0.10);
      color:var(--ok);
      font-size:34px;
      font-weight:900;
      border:2px solid rgba(27,143,77,0.18);
    }

    h1{
      margin:0 0 8px;
      font-size:30px;
      font-weight:900;
      letter-spacing:-0.3px;
    }

    .sub{
      margin:0;
      color:var(--muted);
      font-size:15px;
      line-height:1.5;
    }

    .box{
      margin:22px auto 0;
      max-width:520px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      padding:16px 16px;
      text-align:left;
    }

    .row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      font-size:14px;
      padding:6px 0;
    }

    .row span:first-child{
      color:var(--muted);
      font-weight:700;
    }

    .row span:last-child{
      color:var(--text);
      font-weight:800;
      text-align:right;
      word-break:break-all;
    }

    .actions{
      margin-top:24px;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      padding:12px 16px;
      border-radius:999px;
      text-decoration:none;
      font-weight:900;
      font-size:14px;
      border:1px solid rgba(122,92,255,0.30);
      background:#fff;
      color:var(--violet);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
    }

    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
    }

    .note{
      margin-top:18px;
      font-size:12px;
      color:var(--muted);
      font-weight:700;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✓</div>
    <h1>Paiement confirmé</h1>
    <p class="sub">
      La commande a bien été réglée sur Stripe.
    </p>

    <div class="box">
      <div class="row">
        <span>Statut</span>
        <span id="statusText">Confirmé</span>
      </div>
      <div class="row">
        <span>Session Stripe</span>
        <span id="sessionId">—</span>
      </div>
    </div>

    <div class="actions">
      <a class="btn primary" href="produits.html">Retour à la boutique</a>
      <a class="btn" href="conciergerie.html">Tableau de bord</a>
    </div>

    <div class="note">
      Le panier a été vidé automatiquement.
    </div>
  </div>

  <script>
    const CART_KEY = "cm_shop_cart_v5";
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get("session_id") || "";

    try {
      localStorage.removeItem(CART_KEY);
    } catch (_) {}

    const sessionEl = document.getElementById("sessionId");
    if (sessionId) {
      sessionEl.textContent = sessionId;
    }
  </script>
</body>
</html>
