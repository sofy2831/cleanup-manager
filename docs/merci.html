<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Paiement confirmé</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --bad:#b3261e;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:22px;
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #F8F4FF 0%, #EDE6FF 80%);
      color:var(--text);
      text-align:center;
    }
    .card{
      width:100%;
      max-width:520px;
      background: rgba(255,255,255,0.90);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.08);
      padding: 26px 22px;
    }
    .ok{
      width:52px;height:52px;border-radius:14px;
      display:inline-flex;align-items:center;justify-content:center;
      background: #e8fff1; border:1px solid rgba(27,143,77,0.25);
      margin-bottom:12px; font-size:26px;
    }
    h1{ margin:6px 0 6px; font-size:26px; font-weight:800; }
    .sub{ color:var(--muted); font-size:13px; line-height:1.4; margin:0 0 16px; }
    .pill{
      display:inline-block;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.25);
      color:#5b45c8;
      font-weight:800;
      font-size:12px;
      margin:8px 0 10px;
    }
    .pill.bad{
      border-color: rgba(179,38,30,0.25);
      color:#7a1d16;
    }
    .btn{
      width:100%;
      border:none;
      border-radius:999px;
      padding:12px 14px;
      font-size:14px;
      font-weight:900;
      cursor:pointer;
      color:#fff;
      background: linear-gradient(90deg, var(--violet-main), var(--violet-dark));
      box-shadow: 0 12px 24px rgba(0,0,0,0.10);
      text-decoration:none;
      display:inline-block;
    }
    .link{
      display:inline-block;
      margin-top:10px;
      color: var(--violet-main);
      font-weight:900;
      text-decoration:none;
      font-size:13px;
    }
    .tiny{
      margin-top:10px;
      font-size:11px;
      color:#666;
      font-weight:800;
      word-break:break-all;
      opacity:.85;
    }
  </style>
</head>

<body>
  <main class="card">
    <div class="ok">✅</div>
    <h1 id="title">Paiement confirmé</h1>
    <p class="sub" id="subtitle">Merci. Ton abonnement est en cours d’activation.</p>

    <div class="pill" id="planPill">Plan : —</div>

    <a class="btn" id="goBtn" href="conciergerie.html">Accéder à mon tableau de bord</a>
    <a class="link" href="index.html">Retour à l’accueil</a>

    <div class="tiny" id="debugLine" style="display:none"></div>
  </main>

  <script>
    // ⚠️ Ce fichier suppose que ta function expose:
    // GET https://.../api/checkout-session?session_id=cs_...
    const FUNCTIONS_BASE = "https://europe-west1-cleanup-manager-d9301.cloudfunctions.net/api";

    function getParam(name){
      return (new URLSearchParams(location.search).get(name) || "").trim();
    }

    const sessionId = getParam("session_id");
    const planPill = document.getElementById("planPill");
    const title = document.getElementById("title");
    const subtitle = document.getElementById("subtitle");
    const debugLine = document.getElementById("debugLine");

    async function fetchSession(id){
      const url = FUNCTIONS_BASE + "/checkout-session?session_id=" + encodeURIComponent(id);
      const res = await fetch(url, { method:"GET" });
      const data = await res.json().catch(()=> ({}));
      return { ok: res.ok, status: res.status, data };
    }

    (async ()=>{
      if(!sessionId){
        title.textContent = "Paiement confirmé";
        subtitle.textContent = "Session Stripe introuvable (session_id manquant).";
        planPill.textContent = "Plan : —";
        planPill.classList.add("bad");
        return;
      }

      // Debug (support)
      debugLine.style.display = "block";
      debugLine.textContent = "session_id: " + sessionId;

      const r = await fetchSession(sessionId);

      if(!r.ok){
        title.textContent = "Paiement confirmé";
        subtitle.textContent = "Paiement reçu. Activation en cours (lecture Stripe indisponible).";
        planPill.textContent = "Plan : OK";
        planPill.classList.add("bad");
        console.warn("checkout-session read failed:", r.status, r.data);
        return;
      }

      const s = r.data || {};
      const plan = (s.plan || "").toUpperCase() || "OK";
      const email = s.customer_email || "";
      const paymentStatus = (s.payment_status || "").toLowerCase();

      planPill.textContent = "Plan : " + plan;

      if(paymentStatus && paymentStatus !== "paid"){
        subtitle.textContent = "Paiement en cours de validation…";
        planPill.classList.add("bad");
      } else {
        subtitle.textContent = "Merci. Ton abonnement est en cours d’activation.";
      }

      if(email){
        debugLine.textContent = "session_id: " + sessionId + " • " + email;
      }
    })();
  </script>
</body>
</html>
