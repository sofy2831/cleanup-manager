<!-- docs/factures-liste.html (GLOBAL TOTALS — totaux HT/TVA/TTC en haut de liste, pas par facture) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Factures</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px;
      cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .logo-title{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; margin-bottom:6px; text-align:center; }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:22px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }
    .helloLine{ margin-top:10px; font-size:13px; color:#333; font-weight:900; text-align:center; }
    .companyLine{ margin-top:4px; font-size:13px; color:var(--muted); font-weight:900; text-align:center; }

    .wrap{ width:100%; max-width:980px; margin-top:14px; display:flex; flex-direction:column; gap:12px; min-width:0; }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .toolbar{
      display:grid;
      grid-template-columns: 220px 1fr;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:720px){ .toolbar{ grid-template-columns: 1fr; } }

    .select{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.35);
      background:#fff;
      font-weight:900;
      color:#222;
      outline:none;
    }
    .searchbar{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      min-width:0;
    }
    .s-ico{ font-size:14px; opacity:.75; }
    .input{
      flex:1;
      border:none;
      outline:none;
      font-size:13px;
      font-weight:900;
      color:#111;
      background:transparent;
      min-width:0;
    }

    .btn{
      display:inline-flex; justify-content:center; align-items:center; gap:8px;
      padding:10px 12px; border-radius:999px;
      border:none; cursor:pointer; text-decoration:none;
      font-weight:900; font-size:12px;
      background:#fff; color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
      user-select:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff; border-color:transparent;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }
    .btn:disabled{ opacity:.45; cursor:not-allowed; pointer-events:none; }

    .badge{
      display:inline-flex; align-items:center; gap:6px;
      padding:6px 10px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:#333;
      white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    .line6{
      display:grid;
      grid-template-columns: 110px 160px 1.2fr 1.2fr 1.1fr 130px;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:900px){
      .line6{ grid-template-columns: 110px 160px 1fr 1fr; grid-auto-rows:auto; }
    }
    @media(max-width:560px){
      .line6{ grid-template-columns: 1fr 1fr; }
    }
    .cell{ min-width:0; }
    .cell .t{ font-size:11px; color:#666; font-weight:900; }
    .cell .v{ font-size:13px; color:#111; font-weight:900; }
    .cell .v.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .tag{
      display:inline-flex; align-items:center; justify-content:center;
      padding:4px 8px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:var(--violet);
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:flex-start;
      min-width:0;
    }
    .k{ min-width:220px; display:flex; flex-direction:column; gap:3px; min-width:0; }
    .k .t{ font-size:12px; color:#666; font-weight:900; }
    .k .v{ font-size:13px; color:#111; font-weight:900; }

    /* ✅ Totaux globaux (une seule fois) */
    .tot3{
      margin-top:10px;
      display:grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap:8px;
      align-items:stretch;
    }
    @media(max-width:720px){
      .tot3{ grid-template-columns: 1fr; }
    }
    .totBox{
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:10px 12px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .totBox .t{ font-size:11px; color:#666; font-weight:900; }
    .totBox .v{ margin-top:2px; font-size:13px; color:#111; font-weight:1000; }
    .totMeta{ margin-top:6px; font-size:12px; color:#666; font-weight:850; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; gap: 6px; justify-content: space-around; align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none;
      font-size: 11px; font-weight: 900; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        width: 100%;
        max-width: 980px;
        margin: 14px 0 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px;
        gap: 10px;
      }
      .bottom-nav a{ font-size: 13px; padding: 12px 12px; }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="compta.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon">F</div>
      <h1>Factures</h1>
    </div>

    <div class="subtitle">Suivi des factures</div>
    <div class="helloLine" id="helloLine">Bonjour,</div>
    <div class="companyLine" id="companyLine">—</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="card">
        <div class="toolbar">
          <select class="select" id="filterStatus">
            <option value="ALL">Toutes</option>
            <option value="DRAFT">Brouillons</option>
            <option value="ISSUED">Émises</option>
            <option value="SENT">Envoyées</option>
            <option value="PAID">Payées</option>
            <option value="CANCELLED">Annulées</option>
            <option value="MISSING">Sans statut</option>
          </select>

          <div class="searchbar" title="Recherche">
            <span class="s-ico">🔎</span>
            <input class="input" id="searchInput" type="search" placeholder="Rechercher (n° facture, client, logement…)" autocomplete="off" />
          </div>
        </div>

        <div style="margin-top:10px; font-size:12px; color:#666; font-weight:850;">
          Créer une facture se fait via un devis (Passer en facture). “Refaire” sert après un avoir.
        </div>
      </div>

      <!-- ✅ Totaux globaux (une seule fois) -->
      <div class="card" id="globalTotalsCard" style="display:none;">
        <div style="font-weight:1000; font-size:13px;">Totaux (liste filtrée)</div>
        <div class="tot3">
          <div class="totBox">
            <div class="t">Total HT</div>
            <div class="v" id="gtHT">—</div>
          </div>
          <div class="totBox">
            <div class="t">TVA</div>
            <div class="v" id="gtTVA">—</div>
          </div>
          <div class="totBox">
            <div class="t">Total TTC</div>
            <div class="v" id="gtTTC">—</div>
          </div>
        </div>
        <div class="totMeta" id="gtMeta">—</div>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { collection, query, where, orderBy, limit, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const helloLine = document.getElementById("helloLine");
    const companyLine = document.getElementById("companyLine");
    const alertBox = document.getElementById("alertBox");

    const filterStatus = document.getElementById("filterStatus");
    const searchInput = document.getElementById("searchInput");
    const listBox = document.getElementById("listBox");

    const globalTotalsCard = document.getElementById("globalTotalsCard");
    const gtHT = document.getElementById("gtHT");
    const gtTVA = document.getElementById("gtTVA");
    const gtTTC = document.getElementById("gtTTC");
    const gtMeta = document.getElementById("gtMeta");

    let all = [];
    let vatEnabled = false;
    let vatRate = 0;

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }
    function fmtDateFR(x){
      if(!x) return "—";
      try{
        if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
        const s = String(x).trim();
        if(!s) return "—";
        if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
        const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if(m) return `${m[3]}/${m[2]}/${m[1]}`;
        const d = new Date(s);
        if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
        return "—";
      }catch{ return "—"; }
    }

    function computeHT(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }
    function computeTotalsFromLines(lines){
      const ht = computeHT(lines);
      const tva = vatEnabled ? (ht * (Number(vatRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    function getInvoiceStatusRaw(x){
      return String(x?.invoiceStatus||"").toUpperCase().trim();
    }
    function getInvoiceNumber(x){
      const n = String(x?.invoiceNumber || "").trim();
      return n || "—";
    }

    // Si N° existe mais status = DRAFT => on affiche ÉMISE (display only)
    function getInvoiceStatusDisplay(x){
      const raw = getInvoiceStatusRaw(x);
      const hasNum = !!String(x?.invoiceNumber||"").trim();
      if(hasNum && (raw === "" || raw === "DRAFT")) return "ISSUED";
      return raw || "MISSING";
    }

    function badgeForStatus(display){
      const s = String(display||"").toUpperCase().trim();
      if(s === "PAID") return `<span class="badge ok">Payée</span>`;
      if(s === "CANCELLED") return `<span class="badge bad">Annulée</span>`;
      if(s === "SENT") return `<span class="badge">Envoyée</span>`;
      if(s === "ISSUED") return `<span class="badge">Émise</span>`;
      if(s === "DRAFT") return `<span class="badge">Brouillon</span>`;
      return `<span class="badge bad">Sans statut</span>`;
    }

    function matchesFilter(item){
      const f = filterStatus.value;
      const disp = getInvoiceStatusDisplay(item);
      const raw = getInvoiceStatusRaw(item);

      if(f === "ALL") return true;
      if(f === "MISSING") return !raw;
      return disp === f;
    }

    function matchesSearch(item){
      const q = (searchInput.value||"").trim().toLowerCase();
      if(!q) return true;

      const hay = [
        item.invoiceNumber, item.quoteNumber,
        item.clientName, item.clientEmail,
        item.homeName, item.homeCity, item.homeAddress, item.homeZip,
        item.invoiceStatus, item.commercialStatus
      ].filter(Boolean).join(" ").toLowerCase();

      return hay.includes(q);
    }

    function getFiltered(){
      return all.filter(e => matchesFilter(e) && matchesSearch(e));
    }

    function getCreatedAt(x){
      if(x?.createdAt?.toDate?.()) return x.createdAt.toDate().toLocaleDateString("fr-FR");
      if(x?.createdAt) return fmtDateFR(x.createdAt);
      if(x?.createdAtMs) return fmtDateFR(new Date(Number(x.createdAtMs)));
      if(x?.snapAtMs) return fmtDateFR(new Date(Number(x.snapAtMs)));
      return "—";
    }

    function getLinkedAvoirId(x){
      const keys = ["avoirId","creditId","creditNoteId","lastCreditId","fromAvoirId","linkedCreditId"];
      for(const k of keys){
        const v = String(x?.[k] || "").trim();
        if(v) return v;
      }
      return "";
    }

    function sumTotals(items){
      let ht = 0, tva = 0, ttc = 0;
      for(const it of items){
        const t = computeTotalsFromLines(it.lines);
        ht += (Number(t.ht)||0);
        tva += (Number(t.tva)||0);
        ttc += (Number(t.ttc)||0);
      }
      return { ht, tva, ttc };
    }

    function renderGlobalTotals(filtered){
      if(!filtered.length){
        globalTotalsCard.style.display = "none";
        return;
      }
      const totals = sumTotals(filtered);

      globalTotalsCard.style.display = "block";
      gtHT.textContent = fmtMoney(totals.ht);
      gtTVA.textContent = fmtMoney(totals.tva);
      gtTTC.textContent = fmtMoney(totals.ttc);

      const labelTVA = vatEnabled ? `TVA activée (${Math.round(vatRate*100)}%)` : `TVA non applicable`;
      gtMeta.textContent = `${filtered.length} facture(s) affichée(s) • ${labelTVA}`;
    }

    function render(){
      const filtered = getFiltered();

      // ✅ 1 seul total global (liste filtrée)
      renderGlobalTotals(filtered);

      listBox.innerHTML = "";

      if(!filtered.length){
        listBox.innerHTML = `
          <div class="card">
            <b>Aucune facture</b>
            <div style="margin-top:6px; font-size:12px; color:#666; font-weight:800;">
              Ajuste le filtre ou la recherche.
            </div>
          </div>`;
        return;
      }

      for(const x of filtered){
        const created = getCreatedAt(x);
        const invNum = getInvoiceNumber(x);

        const client = String(x.clientName || x.ownerName || "—").trim();
        const clientEmail = String(x.clientEmail || x.ownerEmail || "").trim();

        const home = String(x.homeName || "—").trim();
        const period = (x.arrivalDateKey || x.departureDateKey)
          ? `${fmtDateFR(x.arrivalDateKey)} → ${fmtDateFR(x.departureDateKey)}`
          : "—";

        const totals = computeTotalsFromLines(x.lines);
        const stDisp = getInvoiceStatusDisplay(x);
        const linkedAvoirId = getLinkedAvoirId(x);

        const openHref = `facture.html?docId=${encodeURIComponent(x.id)}`;
        const previewHref = `facture-apercu.html?docId=${encodeURIComponent(x.id)}`;

        const allowAvoir = !!String(x.invoiceNumber||"").trim() && String(getInvoiceStatusRaw(x)) !== "CANCELLED";
        const allowRedo = !!linkedAvoirId;

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="line6">
            <div class="cell">
              <div class="t">Créée</div>
              <div class="v">${esc(created)}</div>
            </div>

            <div class="cell">
              <div class="t">N°</div>
              <div class="v">
                <span class="tag">FA</span>
                <span style="margin-left:6px;">${esc(invNum)}</span>
              </div>
            </div>

            <div class="cell">
              <div class="t">Client</div>
              <div class="v ellipsis" title="${esc(client)}">${esc(client)}</div>
              ${clientEmail ? `<div class="t" style="margin-top:2px;">${esc(clientEmail)}</div>` : ``}
            </div>

            <div class="cell">
              <div class="t">Logement</div>
              <div class="v ellipsis" title="${esc(home)}">${esc(home)}</div>
            </div>

            <div class="cell">
              <div class="t">Période</div>
              <div class="v ellipsis" title="${esc(period)}">${esc(period)}</div>
            </div>

            <div class="cell" style="text-align:right;">
              <div class="t">Total TTC</div>
              <div class="v">${fmtMoney(totals.ttc)}</div>
            </div>
          </div>

          <div class="row" style="margin-top:10px;">
            <div class="k">
              <div class="t">Statut</div>
              <div class="v">${badgeForStatus(stDisp)}</div>
              ${linkedAvoirId ? `<div class="t" style="margin-top:4px;">Avoir lié : ${esc(linkedAvoirId)}</div>` : ``}
            </div>

            <div class="k" style="align-items:flex-end; min-width:360px;">
              <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
                <a class="btn primary" href="${openHref}">Ouvrir</a>
                <a class="btn" href="${previewHref}">PDF</a>

                ${allowAvoir ? `<a class="btn" href="avoir.html?fromDocId=${encodeURIComponent(x.id)}">Avoir</a>` : ``}

                <a class="btn" ${allowRedo ? `href="facture.html?mode=redo&fromDocId=${encodeURIComponent(x.id)}&fromAvoirId=${encodeURIComponent(linkedAvoirId)}"` : `href="#"`} ${allowRedo ? "" : "disabled"}>Refaire</a>
              </div>
            </div>
          </div>
        `;
        listBox.appendChild(div);
      }
    }

    async function loadCompanyName(uid){
      try{
        const snap = await getDoc(doc(db, "users", uid));
        const data = snap.exists() ? (snap.data()||{}) : {};
        const name = String(data?.businessProfile?.companyName || "").trim();

        const vat = data?.businessProfile?.vat || {};
        vatEnabled = !!vat?.enabled;
        vatRate = Number.isFinite(Number(vat?.rate)) ? Number(vat.rate) : 0;

        return name || "Conciergerie";
      }catch{
        vatEnabled = false; vatRate = 0;
        return "Conciergerie";
      }
    }

    async function loadInvoices(uid){
      const qInv = query(
        collection(db, "salesDocuments"),
        where("conciergerieUid", "==", uid),
        where("type", "==", "INVOICE"),
        where("listable", "==", true),
        orderBy("createdAt", "desc"),
        limit(400)
      );

      const snap = await getDocs(qInv);
      all = snap.docs.map(d => ({ id: d.id, ...(d.data()||{}) }));
      render();
    }

    filterStatus.addEventListener("change", render);
    searchInput.addEventListener("input", render);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }

      helloLine.textContent = "Bonjour,";
      companyLine.textContent = await loadCompanyName(user.uid);

      hideAlert();
      try{
        await loadInvoices(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur chargement factures : " + (e?.message || "inconnue"));
      }
    });
  </script>
