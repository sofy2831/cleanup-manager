<!-- docs/factures-liste.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Factures</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }
    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer; white-space:nowrap;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }

    .logo-title{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:10px; margin-bottom:6px; text-align:center;
    }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:22px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-5px;
      font-size:12px;
      color:var(--violet);
    }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }
    .emailLine{ margin-top:4px; font-size:13px; color:var(--muted); font-weight:700; text-align:center; }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .toolbar{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      justify-content:space-between;
    }

    .select, .input{
      padding:10px 12px;
      border-radius:999px;
      border:1px solid rgba(122,92,255,0.35);
      background:#fff;
      font-weight:800;
      color:#222;
      outline:none;
      min-width:210px;
    }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px 14px;
      backdrop-filter: blur(10px);
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:flex-start;
      justify-content:space-between;
    }

    .k{
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:240px;
    }
    .k .t{ font-size:12px; color:#666; font-weight:900; }
    .k .v{ font-size:13px; color:#111; font-weight:900; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:#333;
      white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    .btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      text-decoration:none;
      font-weight:900;
      font-size:12px;
      background:#fff;
      color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .bottom-nav{
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 50;
      display:flex;
      gap:6px;
      justify-content:space-around;
      align-items:center;
      padding:10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1;
      text-align:center;
      text-decoration:none;
      font-size:11px;
      font-weight:900;
      color:#666;
      padding:10px 8px;
      border-radius:999px;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }
    @media(min-width:860px){
      .bottom-nav{
        position: static;
        max-width:980px;
        margin:12px auto 0;
        border-top:none;
        border:1px solid rgba(122,92,255,0.18);
        border-radius:999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom:32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="compta.html">← Comptabilité</a>
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>

    <div class="logo-title">
      <div class="logo-icon">F</div>
      <h1>Factures</h1>
    </div>

    <div class="subtitle">Suivi des factures • export CSV</div>
    <div class="emailLine" id="emailLine">—</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="toolbar">
        <select class="select" id="filterStatus">
          <option value="ALL">Tous</option>
          <option value="DRAFT">Brouillons</option>
          <option value="SENT">Envoyées</option>
          <option value="PAID">Payées</option>
          <option value="MISSING">Sans statut</option>
        </select>

        <input class="input" id="searchInput" placeholder="Rechercher propriétaire / logement..." />

        <button class="btn primary" id="exportBtn" type="button">Exporter CSV</button>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
    <a href="catalogue.html">Catalogue</a>
    <a href="logements.html">Logements</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const emailLine = document.getElementById("emailLine");
    const logoutBtn = document.getElementById("logoutBtn");
    const alertBox = document.getElementById("alertBox");

    const filterStatus = document.getElementById("filterStatus");
    const searchInput = document.getElementById("searchInput");
    const listBox = document.getElementById("listBox");
    const exportBtn = document.getElementById("exportBtn");

    let all = [];

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }

    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }

    function badgeForInvoiceStatus(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return `<span class="badge bad">Sans statut</span>`;
      if(x === "PAID") return `<span class="badge ok">Payée</span>`;
      if(x === "SENT") return `<span class="badge">Envoyée</span>`;
      if(x === "DRAFT") return `<span class="badge">Brouillon</span>`;
      return `<span class="badge">${esc(x)}</span>`;
    }

    function matchesFilter(item){
      const f = filterStatus.value;
      const st = String(item.invoiceStatus||"").toUpperCase().trim();
      if(f === "ALL") return true;
      if(f === "MISSING") return !st;
      return st === f;
    }

    function matchesSearch(item){
      const q = (searchInput.value||"").trim().toLowerCase();
      if(!q) return true;
      const hay = [
        item.homeName, item.homeCity,
        item.ownerName, item.ownerEmail,
        item.summary, item.invoiceNumber
      ].filter(Boolean).join(" ").toLowerCase();
      return hay.includes(q);
    }

    function getFiltered(){
      return all.filter(e => matchesFilter(e) && matchesSearch(e));
    }

    function render(){
      const filtered = getFiltered();
      listBox.innerHTML = "";

      if(!filtered.length){
        listBox.innerHTML = `<div class="card"><b>Aucun résultat</b><div style="margin-top:6px; font-size:12px; color:#666; font-weight:800;">Change le filtre ou la recherche.</div></div>`;
        return;
      }

      for(const ev of filtered){
        const totalComputed = computeTotalFromLines(ev.lines);
        const total = (ev.total != null) ? Number(ev.total) : totalComputed;

        const home = (ev.homeName||"—") + (ev.homeCity ? (" — " + ev.homeCity) : "");
        const owner = (ev.ownerName||"—") + (ev.ownerEmail ? (" • " + ev.ownerEmail) : "");
        const date = ev.dateKey || ev.date || "—";
        const time = ev.time || "—";
        const invNum = ev.invoiceNumber || "—";

        const html = `
          <div class="card">
            <div class="row">
              <div class="k">
                <div class="t">Logement</div>
                <div class="v">${esc(home)}</div>
              </div>
              <div class="k">
                <div class="t">Client</div>
                <div class="v">${esc(owner)}</div>
              </div>
              <div class="k">
                <div class="t">Date</div>
                <div class="v">${esc(date)} • ${esc(time)}</div>
              </div>
            </div>

            <div class="row" style="margin-top:10px;">
              <div class="k">
                <div class="t">Facture</div>
                <div class="v">${esc(invNum)} ${badgeForInvoiceStatus(ev.invoiceStatus)}</div>
              </div>
              <div class="k">
                <div class="t">Montant</div>
                <div class="v">${fmtMoney(total)}</div>
              </div>
              <div class="k" style="align-items:flex-end;">
                <a class="btn primary" href="facture.html?eventId=${encodeURIComponent(ev.id)}">Ouvrir</a>
              </div>
            </div>
          </div>
        `;

        const div = document.createElement("div");
        div.innerHTML = html;
        listBox.appendChild(div.firstElementChild);
      }
    }

    function toCsvValue(v){
      const s = String(v ?? "");
      return `"${s.replaceAll('"','""')}"`;
    }

    function exportCsv(){
      const rows = getFiltered();
      const header = [
        "eventId","date","heure","logement","ville","client","email",
        "numero_facture","statut","montant"
      ];
      const lines = [header.join(";")];

      for(const r of rows){
        const totalComputed = computeTotalFromLines(r.lines);
        const total = (r.total != null) ? Number(r.total) : totalComputed;

        const line = [
          r.id,
          (r.dateKey || r.date || ""),
          (r.time || ""),
          (r.homeName || ""),
          (r.homeCity || ""),
          (r.ownerName || ""),
          (r.ownerEmail || ""),
          (r.invoiceNumber || ""),
          (r.invoiceStatus || ""),
          (Number.isFinite(total) ? total.toFixed(2) : "")
        ].map(toCsvValue).join(";");

        lines.push(line);
      }

      const blob = new Blob([lines.join("\n")], { type:"text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `factures_${new Date().toISOString().slice(0,10)}.csv`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
    }

    async function loadInvoices(uid){
      const qEvents = query(
        collection(db, "events"),
        where("conciergerieUid", "==", uid),
        orderBy("createdAt", "desc"),
        limit(300)
      );

      const snap = await getDocs(qEvents);
      const rows = snap.docs.map(d => ({ id: d.id, ...(d.data()||{}) }));

      // filtrage V1
      all = rows.filter(r => {
        const inv = String(r.invoiceStatus||"").toUpperCase().trim();
        const cs  = String(r.commercialStatus||"").toUpperCase().trim();
        return inv === "DRAFT" || inv === "SENT" || inv === "PAID" || cs === "FACTURE" || cs === "PAYE";
      });

      render();
    }

    logoutBtn.addEventListener("click", async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      location.href = "index.html";
    });

    filterStatus.addEventListener("change", render);
    searchInput.addEventListener("input", render);
    exportBtn.addEventListener("click", exportCsv);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      emailLine.textContent = user.email || user.uid;

      hideAlert();
      try{
        await loadInvoices(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur chargement factures : " + (e?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
