<!-- docs/factures-liste.html (PATCH — sans déconnexion / sans CSV + actions Ouvrir/Créer/Avoir/Refaire) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Factures</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:16px 16px 32px;
      padding-bottom:96px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet);
      color:var(--violet);
      text-decoration:none;
      font-weight:900;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }

    .logo-title{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:10px;
      margin-bottom:6px;
      text-align:center;
    }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff;
      border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet);
      font-size:22px;font-weight:900;
      position:relative;
      flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-5px;
      font-size:12px;
      color:var(--violet);
    }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }
    .helloLine{ margin-top:10px; font-size:13px; color:#333; font-weight:900; text-align:center; }
    .emailLine{ margin-top:4px; font-size:13px; color:var(--muted); font-weight:800; text-align:center; }

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:12px;
      min-width:0;
    }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .alert{
      display:none;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#444;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .toolbar{
      display:grid;
      grid-template-columns: 220px 1fr;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:720px){
      .toolbar{ grid-template-columns: 1fr; }
    }

    .select{
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.35);
      background:#fff;
      font-weight:900;
      color:#222;
      outline:none;
    }

    .searchbar{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      min-width:0;
    }
    .s-ico{ font-size:14px; opacity:.75; }
    .input{
      flex:1;
      border:none;
      outline:none;
      font-size:13px;
      font-weight:900;
      color:#111;
      background:transparent;
      min-width:0;
    }

    .btn{
      display:inline-flex;
      justify-content:center;
      align-items:center;
      gap:8px;
      padding:10px 12px;
      border-radius:999px;
      border:none;
      cursor:pointer;
      text-decoration:none;
      font-weight:900;
      font-size:12px;
      background:#fff;
      color:var(--violet);
      border:1px solid rgba(122,92,255,0.35);
      box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap;
      user-select:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
      box-shadow:0 12px 24px rgba(0,0,0,0.10);
    }
    .btn.danger{
      color: var(--bad);
      border-color: rgba(179,38,30,0.30);
    }
    .btn:disabled{ opacity:.45; cursor:not-allowed; }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:6px 10px;
      border-radius:999px;
      font-size:11px;
      font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:#333;
      white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    .line6{
      display:grid;
      grid-template-columns: 110px 160px 1.2fr 1.2fr 1.1fr 130px;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:900px){
      .line6{
        grid-template-columns: 110px 160px 1fr 1fr;
        grid-auto-rows:auto;
      }
    }
    @media(max-width:560px){
      .line6{ grid-template-columns: 1fr 1fr; }
    }
    .cell{ min-width:0; }
    .cell .t{ font-size:11px; color:#666; font-weight:900; }
    .cell .v{ font-size:13px; color:#111; font-weight:900; }
    .cell .v.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .tag{
      display:inline-flex; align-items:center; justify-content:center;
      padding:4px 8px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff;
      color:var(--violet);
    }

    .row{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:space-between;
      align-items:flex-start;
      min-width:0;
    }
    .k{
      min-width:220px;
      display:flex;
      flex-direction:column;
      gap:3px;
      min-width:0;
    }
    .k .t{ font-size:12px; color:#666; font-weight:900; }
    .k .v{ font-size:13px; color:#111; font-weight:900; }
    .v.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .bottom-nav{
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 50;
      display: flex;
      gap: 6px;
      justify-content: space-around;
      align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1;
      text-align: center;
      text-decoration: none;
      font-size: 11px;
      font-weight: 900;
      color: #666;
      padding: 10px 8px;
      border-radius: 999px;
      white-space: nowrap;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow: 0 10px 22px rgba(0,0,0,0.10);
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static;
        width: 100%;
        max-width: 980px;
        margin: 14px 0 0;
        border-top: none;
        border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px;
        gap: 10px;
      }
      .bottom-nav a{
        font-size: 13px;
        padding: 12px 12px;
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="compta.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon">F</div>
      <h1>Factures</h1>
    </div>

    <div class="subtitle">Suivi des factures</div>
    <div class="helloLine" id="helloLine">Bonjour,</div>
    <div class="emailLine" id="emailLine">—</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="card">
        <div class="toolbar">
          <select class="select" id="filterStatus">
            <option value="ALL">Toutes</option>
            <option value="DRAFT">Brouillons</option>
            <option value="SENT">Envoyées</option>
            <option value="PAID">Payées</option>
            <option value="MISSING">Sans statut</option>
          </select>

          <div class="searchbar" title="Recherche">
            <span class="s-ico">🔎</span>
            <input class="input" id="searchInput" type="search" placeholder="Rechercher (n° facture, client, logement…)" autocomplete="off" />
          </div>
        </div>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { collection, query, where, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const helloLine = document.getElementById("helloLine");
    const emailLine = document.getElementById("emailLine");
    const alertBox = document.getElementById("alertBox");

    const filterStatus = document.getElementById("filterStatus");
    const searchInput = document.getElementById("searchInput");
    const listBox = document.getElementById("listBox");

    let all = [];

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }

    function fmtDateFR(x){
      if(!x) return "—";
      try{
        if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
        if(x instanceof Date) return isNaN(x.getTime()) ? "—" : x.toLocaleDateString("fr-FR");

        const s = String(x).trim();
        if(!s) return "—";
        if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;

        const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if(m) return `${m[3]}/${m[2]}/${m[1]}`;

        const d = new Date(s);
        if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
        return "—";
      }catch{
        return "—";
      }
    }

    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }

    function getInvoiceTotal(ev){
      const candidates = [
        ev?.invoiceTotal, ev?.totalInvoice, ev?.invoiceAmount, ev?.invoiceTTC, ev?.totalTTC, ev?.total
      ];
      for(const c of candidates){
        if(c != null && c !== ""){
          const n = Number(c);
          if(Number.isFinite(n)) return n;
        }
      }
      return computeTotalFromLines(ev?.lines);
    }

    function badgeForInvoiceStatus(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return `<span class="badge bad">Sans statut</span>`;
      if(x === "PAID") return `<span class="badge ok">Payée</span>`;
      if(x === "SENT") return `<span class="badge">Envoyée</span>`;
      if(x === "DRAFT") return `<span class="badge">Brouillon</span>`;
      return `<span class="badge">${esc(x)}</span>`;
    }

    function normalizeStatusFromCommercial(ev){
      const cs = String(ev?.commercialStatus||"").toUpperCase().trim();
      if(cs === "PAYE") return "PAID";
      if(cs === "FACTURE_ENVOYEE") return "SENT";
      if(cs === "FACTURE") return "DRAFT";
      return "";
    }

    function getInvoiceStatus(ev){
      const st = String(ev?.invoiceStatus||"").toUpperCase().trim();
      if(st) return st;
      return normalizeStatusFromCommercial(ev) || "";
    }

    function matchesFilter(item){
      const f = filterStatus.value;
      const st = getInvoiceStatus(item);
      if(f === "ALL") return true;
      if(f === "MISSING") return !st;
      return st === f;
    }

    function matchesSearch(item){
      const q = (searchInput.value||"").trim().toLowerCase();
      if(!q) return true;

      const hay = [
        item.invoiceNumber, item.quoteNumber,
        item.homeName, item.homeCity,
        item.ownerName, item.ownerEmail
      ].filter(Boolean).join(" ").toLowerCase();

      return hay.includes(q);
    }

    function getFiltered(){
      return all.filter(e => matchesFilter(e) && matchesSearch(e));
    }

    function getCreatedAt(x){
      if(x?.createdAt?.toDate?.()) return x.createdAt.toDate().toLocaleDateString("fr-FR");
      if(x?.createdAt) return fmtDateFR(x.createdAt);
      if(x?.dateKey) return String(x.dateKey);
      if(x?.date) return fmtDateFR(x.date);
      return "—";
    }

    function getInvoiceNumber(x){
      const n = String(x?.invoiceNumber || "").trim();
      if(n) return n;
      return "FA—";
    }

    // --- AVOIR / REFAIRE : on supporte plusieurs champs possibles, sans casser ton modèle ---
    function getAvoirRef(ev){
      // id direct d'un avoir lié, ou flag
      const id =
        ev?.avoirId ||
        ev?.creditNoteId ||
        ev?.refundId ||
        ev?.lastAvoirId ||
        "";
      if(String(id||"").trim()) return String(id).trim();

      // fallback: bool
      if(ev?.hasAvoir === true) return "__HAS__";
      if(ev?.isCredited === true) return "__HAS__";
      return "";
    }

    function canCreateNewInvoice(ev){
      // "Créer" = refaire/dupliquer une facture pour ce logement/ce dossier.
      // Si tu veux la désactiver dans certains cas, tu pourras resserrer ici.
      return true;
    }

    function render(){
      const filtered = getFiltered();
      listBox.innerHTML = "";

      if(!filtered.length){
        listBox.innerHTML = `
          <div class="card">
            <b>Aucune facture</b>
            <div style="margin-top:6px; font-size:12px; color:#666; font-weight:800;">
              Ajuste le filtre ou la recherche.
            </div>
          </div>`;
        return;
      }

      for(const ev of filtered){
        const created = getCreatedAt(ev);
        const invNum = getInvoiceNumber(ev);

        const client = (ev.ownerName || "—");
        const home = (ev.homeName || "—");
        const period = (ev.arrivalDateKey || ev.departureDateKey)
          ? `${fmtDateFR(ev.arrivalDateKey)} → ${fmtDateFR(ev.departureDateKey)}`
          : "—";

        const total = getInvoiceTotal(ev);
        const st = getInvoiceStatus(ev);

        const homeId = String(ev.homeId || "").trim();
        const avoirRef = getAvoirRef(ev);
        const hasAvoir = !!avoirRef;

        // liens : on reste volontairement simple et "rules-friendly"
        const openHref = `facture.html?eventId=${encodeURIComponent(ev.id)}`;

        // "Créer" : nouvelle facture (dupliquer ou partir du logement)
        // - si homeId dispo, on le passe
        // - on passe aussi sourceEventId pour pré-remplir si tu veux
        const createHref =
          `facture.html?mode=create`
          + (homeId ? `&homeId=${encodeURIComponent(homeId)}` : "")
          + `&sourceEventId=${encodeURIComponent(ev.id)}`;

        // "Mettre en avoir" : vers avoir.html (à toi de faire la page)
        // on passe l'eventId facture comme source
        const avoirHref =
          `avoir.html?fromInvoiceEventId=${encodeURIComponent(ev.id)}`
          + (homeId ? `&homeId=${encodeURIComponent(homeId)}` : "");

        // "Refaire facture" : si avoir existe, on peut recréer une facture
        // si tu as un id d'avoir, on le passe pour reconstituer
        const redoHref =
          `facture.html?mode=redo`
          + (homeId ? `&homeId=${encodeURIComponent(homeId)}` : "")
          + (avoirRef && avoirRef !== "__HAS__" ? `&fromAvoirId=${encodeURIComponent(avoirRef)}` : "")
          + `&sourceEventId=${encodeURIComponent(ev.id)}`;

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="line6">
            <div class="cell">
              <div class="t">Créée</div>
              <div class="v">${esc(created)}</div>
            </div>

            <div class="cell">
              <div class="t">N°</div>
              <div class="v">
                <span class="tag">FA</span>
                <span style="margin-left:6px;">${esc(invNum)}</span>
              </div>
            </div>

            <div class="cell">
              <div class="t">Client</div>
              <div class="v ellipsis" title="${esc(client)}">${esc(client)}</div>
            </div>

            <div class="cell">
              <div class="t">Logement</div>
              <div class="v ellipsis" title="${esc(home)}">${esc(home)}</div>
            </div>

            <div class="cell">
              <div class="t">Période</div>
              <div class="v ellipsis" title="${esc(period)}">${esc(period)}</div>
            </div>

            <div class="cell" style="text-align:right;">
              <div class="t">Total TTC</div>
              <div class="v">${fmtMoney(total)}</div>
            </div>
          </div>

          <div class="row" style="margin-top:10px;">
            <div class="k">
              <div class="t">Statut</div>
              <div class="v">${badgeForInvoiceStatus(st)}</div>
            </div>

            <div class="k" style="align-items:flex-end; min-width:280px;">
              <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
                <a class="btn primary" href="${openHref}">Ouvrir</a>

                <a class="btn" href="${createHref}" ${canCreateNewInvoice(ev) ? "" : "aria-disabled='true'"}>Créer</a>

                <a class="btn danger" href="${avoirHref}" ${hasAvoir ? "style='opacity:.45; pointer-events:none;'" : ""}>
                  Mettre en avoir
                </a>

                <a class="btn" href="${redoHref}" ${hasAvoir ? "" : "style='opacity:.45; pointer-events:none;'"}>
                  Refaire facture
                </a>
              </div>
            </div>
          </div>
        `;
        listBox.appendChild(div);
      }
    }

    async function loadInvoices(uid){
      const qEvents = query(
        collection(db, "events"),
        where("conciergerieUid", "==", uid),
        orderBy("createdAt", "desc"),
        limit(400)
      );

      const snap = await getDocs(qEvents);
      const rows = snap.docs.map(d => ({ id: d.id, ...(d.data()||{}) }));

      all = rows.filter(r => {
        const inv = String(r.invoiceStatus||"").toUpperCase().trim();
        const cs  = String(r.commercialStatus||"").toUpperCase().trim();

        if(inv === "DRAFT" || inv === "SENT" || inv === "PAID") return true;
        if(cs === "FACTURE" || cs === "FACTURE_ENVOYEE" || cs === "PAYE") return true;

        if(String(r.invoiceNumber||"").trim()) return true;
        return false;
      }).map(r => ({
        ...r,
        invoiceStatus: getInvoiceStatus(r)
      }));

      render();
    }

    filterStatus.addEventListener("change", render);
    searchInput.addEventListener("input", render);

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      if(helloLine) helloLine.textContent = "Bonjour,";
      emailLine.textContent = user.email || user.uid;

      hideAlert();
      try{
        await loadInvoices(user.uid);
      }catch(e){
        console.error(e);
        showAlert("⛔ Erreur chargement factures : " + (e?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
