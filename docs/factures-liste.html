<!-- docs/factures-liste.html (COMPLETE CLEANUP PRODUCTION) -->
<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Factures</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>

*{
box-sizing:border-box;
font-family:Inter;
}

body{
margin:0;
background:linear-gradient(180deg,#F8F4FF,#EDE6FF);
}

.page{
max-width:1000px;
margin:auto;
padding:20px;
}

.card{
background:#fff;
border-radius:16px;
padding:16px;
margin-bottom:12px;
box-shadow:0 10px 24px rgba(0,0,0,.08);
}

.line{
display:flex;
flex-wrap:wrap;
gap:16px;
}

.cell{
min-width:120px;
}

.t{
font-size:11px;
color:#666;
font-weight:800;
}

.v{
font-size:14px;
font-weight:800;
}

.actions{
margin-top:12px;
display:flex;
gap:8px;
flex-wrap:wrap;
}

.btn{
padding:8px 14px;
border-radius:999px;
border:1px solid #7A5CFF;
background:#fff;
color:#7A5CFF;
font-weight:800;
cursor:pointer;
text-decoration:none;
}

.btn.primary{
background:#7A5CFF;
color:#fff;
}

.btn[disabled]{
opacity:.4;
pointer-events:none;
}

</style>

</head>
<body>

<div class="page">

<h2>Factures</h2>

<div id="list"></div>

</div>

<script type="module">

import { auth, db } from "./firebase-init.js";

import {
collection,
query,
where,
orderBy,
getDocs,
doc,
updateDoc,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

import {
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";


let user;


function esc(s){

return String(s||"")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;");

}


function money(v){

const n=Number(v);

if(!Number.isFinite(n))
return "—";

return n.toLocaleString("fr-FR",{minimumFractionDigits:2})+" €";

}


function computeTTC(doc){

if(Number.isFinite(Number(doc.totalTTC)))
return doc.totalTTC;

let t=0;

for(const l of (doc.lines||[])){

t+=
(Number(l.qty)||0)
*
(Number(l.unitPrice)||0);

}

return t;

}


function status(doc){

if(doc.creditedAt)
return "CREDITED";

if(doc.invoiceStatus)
return doc.invoiceStatus;

if(doc.invoiceNumber)
return "ISSUED";

return "DRAFT";

}


async function send(docu){

await updateDoc(
doc(db,"salesDocuments",docu.id),
{
invoiceStatus:"SENT",
ownerVisible:true,
sentAt:serverTimestamp(),
updatedAt:serverTimestamp()
}
);

load();

}


function render(list){

const root=document.getElementById("list");

root.innerHTML="";


for(const d of list){

const st=status(d);

const credited=!!d.creditedAt;

const canSend=
d.invoiceNumber
&& !credited;

const canCredit=
d.invoiceNumber
&& !credited;

const canRedo=
credited;

const canReg=
d.invoiceNumber
&& !credited;


const div=document.createElement("div");

div.className="card";

div.innerHTML=`

<div class="line">

<div class="cell">

<div class="t">Numéro</div>

<div class="v">${esc(d.invoiceNumber||"—")}</div>

</div>

<div class="cell">

<div class="t">Client</div>

<div class="v">${esc(d.clientName)}</div>

</div>

<div class="cell">

<div class="t">Logement</div>

<div class="v">${esc(d.homeName)}</div>

</div>

<div class="cell">

<div class="t">Statut</div>

<div class="v">${st}</div>

</div>

<div class="cell">

<div class="t">Total</div>

<div class="v">${money(computeTTC(d))}</div>

</div>

</div>

<div class="actions">

<a class="btn primary"
href="facture.html?docId=${d.id}">
Ouvrir
</a>

<button class="btn send"
${canSend?"":"disabled"}>
Envoyer
</button>

<a class="btn"
href="reglement.html?docId=${d.id}"
${canReg?"":"disabled"}>
Règlement
</a>

${
canCredit
?
`<a class="btn"
href="avoir.html?fromDocId=${d.id}">
Avoir
</a>`
:
""
}

${
canRedo
?
`<a class="btn primary"
href="facture.html?mode=redo&fromDocId=${d.id}">
Recréer facture
</a>`
:
""
}

</div>

`;

const sendBtn=div.querySelector(".send");

if(sendBtn){

sendBtn.onclick=()=>send(d);

}

root.appendChild(div);

}

}


async function load(){

const q=query(
collection(db,"salesDocuments"),
where("conciergerieUid","==",user.uid),
where("type","==","INVOICE"),
orderBy("createdAt","desc")
);

const snap=await getDocs(q);

const list=
snap.docs.map(d=>({
id:d.id,
...d.data()
}));

render(list);

}


onAuthStateChanged(auth,(u)=>{

if(!u)
location.href="login.html";

user=u;

load();

});

</script>

</body>
</html>
