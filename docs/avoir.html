<!-- docs/avoir.html (FINAL — Avoir depuis facture: fromDocId -> création CREDIT_NOTE, émission numéro, patch facture source = CREDITED + avoirId) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Avoir</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-light:#F3ECFF;
      --violet-mid:#DCCBFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text-dark:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text-dark); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill-link{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main); color:var(--violet-main);
      text-decoration:none; font-weight:900; font-size:13px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; cursor:pointer;
    }

    .logo-title{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; margin-bottom:6px; text-align:center; }
    .logo-icon{
      width:40px;height:40px;border-radius:50%;
      background:#fff; border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0; overflow:hidden;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:24px; font-weight:900; color:#111; }
    .subtitle{ font-size:15px; color:#444; margin-top:4px; text-align:center; }

    .badge{
      margin-top:10px; padding:4px 10px; border-radius:999px; background:#fff;
      font-size:12px; color:#555; box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center; font-weight:900; white-space:pre-wrap;
    }

    .docBanner{ width:100%; max-width:1100px; margin-top:10px; display:flex; justify-content:center; }
    .docBannerInner{
      background:#fff; border:1px solid var(--border);
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      border-radius:999px;
      padding:8px 14px;
      font-weight:1000;
      font-size:13px;
      color:#222;
      display:flex; gap:10px; align-items:center;
      white-space:nowrap;
    }

    .headCard{ max-width:1100px; width:100%; display:grid; grid-template-columns:1fr; gap:14px; align-items:stretch; margin-top:14px; }
    @media(min-width:980px){ .headCard{ grid-template-columns: 520px 1fr; } }

    .layout{ width:100%; max-width:1100px; margin-top:14px; display:flex; flex-direction:column; gap:14px; }
    @media(min-width:980px){ .layout{ display:grid; grid-template-columns: 520px 1fr; align-items:start; } }

    .card{
      width:100%; background: rgba(255,255,255,0.86);
      border: 1px solid var(--border); border-radius:18px;
      box-shadow: var(--shadow); padding:14px 14px 16px; backdrop-filter: blur(10px);
    }
    .card-title{
      font-size:16px; font-weight:1000; margin-bottom:8px;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
    }
    .small{ font-size:12px; color:var(--muted); line-height:1.35; font-weight:800; }
    .alert{
      margin-top:10px; padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .kv{ margin-top:6px; display:grid; grid-template-columns: 1fr; gap:6px; font-size:13px; color:#333; font-weight:850; }
    .kv b{ font-weight:1000; }
    .kv .line{ line-height:1.35; }
    .divider{ height:1px; width:100%; background: rgba(122,92,255,0.18); margin:12px 0; }

    .tableWrap{
      overflow:auto; border-radius:14px; border:1px solid rgba(0,0,0,0.04);
      background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    table{ width:100%; border-collapse:collapse; min-width:0; }
    th, td{
      padding:10px 10px; border-bottom:1px solid rgba(0,0,0,0.05);
      text-align:left; font-size:12.5px;
      vertical-align:top;
    }
    th{
      font-size:12px; color:#444; font-weight:1000;
      background:rgba(248,244,255,.7); position:sticky; top:0;
    }
    td.num, th.num{ text-align:right; white-space:nowrap; }
    td.designation{ white-space:normal; word-break:break-word; }

    .totals{
      margin-top:10px; background:#fff; border-radius:14px;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px; display:flex; flex-direction:column; gap:6px; font-weight:1000;
    }
    .totals .r{ display:flex; justify-content:space-between; gap:10px; }
    .mutedLine{ font-size:12px; color:#666; font-weight:900; }

    label{
      display:block; font-size:12px; font-weight:1000; color:#333;
      margin:10px 0 4px; text-align:left;
    }
    textarea{
      width:100%; padding:10px 12px; border-radius:12px;
      border:1px solid #D3C7FF; font-size:14px; outline:none;
      background:#fff; font-weight:800; color:#111;
    }
    textarea{ resize:vertical; }
    textarea:focus{ border-color:var(--violet-main); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
    .btn{
      flex:1; border:none; border-radius:999px; padding:10px 12px;
      font-size:13px; font-weight:1000; cursor:pointer;
      background:#fff; color:var(--violet-main);
      border:2px solid var(--violet-main); box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff; box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .headBox{
      background:#fff; border:1px solid rgba(122,92,255,0.18);
      border-radius:18px; box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:12px 12px 10px;
      display:flex; flex-direction:column; height:100%;
    }
    .headRow{ display:flex; gap:10px; align-items:flex-start; }
    .bizLogo{
      width:44px;height:44px;border-radius:12px; overflow:hidden;
      border:2px solid rgba(122,92,255,0.35); background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:1000; color:var(--violet-main);
      flex-shrink:0;
    }
    .bizLogo img{ width:100%; height:100%; object-fit:cover; display:none; }
    .headTitle{ font-weight:1000; font-size:12px; color:#555; letter-spacing:.2px; }
    .headMain{ font-weight:1000; font-size:14px; color:#111; margin-top:2px; }
    .headLines{ margin-top:6px; font-size:12.5px; color:#222; font-weight:850; line-height:1.35; }
    .headLines .mut{ color:#666; font-weight:900; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:11px; font-weight:1000; text-decoration:none;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 980px){
      .bottom-nav{
        position: static; max-width: 1100px; margin: 12px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" id="backLink" href="factures-liste.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon">A</div>
      <h1 id="appTitle">—</h1>
    </div>

    <div class="subtitle">Avoir</div>
    <div class="badge" id="statusBadge">—</div>

    <div class="docBanner">
      <div class="docBannerInner" id="docBannerInner">AVOIR N° —</div>
    </div>

    <div class="headCard">
      <div class="headBox">
        <div class="headRow">
          <div class="bizLogo">
            <img id="bizLogoImg" alt="Logo société">
            <span id="bizLogoFallback">✓</span>
          </div>
          <div style="flex:1;">
            <div class="headTitle">Société</div>
            <div class="headMain" id="bizName">—</div>
            <div class="headLines" id="bizLines">—</div>
          </div>
        </div>
      </div>

      <div class="headBox">
        <div class="headTitle">Client</div>
        <div class="headMain" id="clientName">—</div>
        <div class="headLines" id="clientLines">—</div>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <div class="card-title">
          <span>Récapitulatif</span>
          <span class="small">facture source + période</span>
        </div>

        <div class="alert" id="alertBox"></div>
        <div class="kv" id="recapKv"></div>

        <div class="divider"></div>

        <div class="card-title" style="font-size:14px; margin-bottom:6px;">
          <span>Lignes (copie facture)</span>
          <span class="small">totaux négatifs</span>
        </div>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Désignation</th>
                <th class="num">Qté</th>
                <th>Unité</th>
                <th class="num">PU HT</th>
                <th class="num" id="thTVA" style="display:none;">TVA</th>
                <th class="num">Total TTC</th>
              </tr>
            </thead>
            <tbody id="linesTbody"></tbody>
          </table>
        </div>

        <div class="totals" id="totalsBox"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Gestion avoir</span>
          <span class="small">émission + aperçu</span>
        </div>

        <label for="reasonText">Motif (affiché sur l’avoir)</label>
        <textarea id="reasonText" rows="2" placeholder="Ex: Annulation / erreur de facturation / geste commercial…"></textarea>

        <label for="notesText">Notes internes</label>
        <textarea id="notesText" rows="3" placeholder="Interne (non affichée au client)"></textarea>

        <div class="divider"></div>

        <div class="actions">
          <button class="btn primary" type="button" id="saveBtn">Émettre l’avoir (créer numéro)</button>
          <button class="btn" type="button" id="previewBtn">Aperçu / Imprimer</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opération</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, updateDoc, serverTimestamp, runTransaction,
      collection, addDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ===== UI =====
    const alertBox = document.getElementById("alertBox");
    const recapKv = document.getElementById("recapKv");
    const statusBadge = document.getElementById("statusBadge");
    const docBannerInner = document.getElementById("docBannerInner");

    const appTitle = document.getElementById("appTitle");
    const bizLogoImg = document.getElementById("bizLogoImg");
    const bizLogoFallback = document.getElementById("bizLogoFallback");

    const bizNameEl = document.getElementById("bizName");
    const bizLinesEl = document.getElementById("bizLines");
    const clientNameEl = document.getElementById("clientName");
    const clientLinesEl = document.getElementById("clientLines");

    const thTVA = document.getElementById("thTVA");
    const linesTbody = document.getElementById("linesTbody");
    const totalsBox = document.getElementById("totalsBox");

    const reasonText = document.getElementById("reasonText");
    const notesText = document.getElementById("notesText");

    const saveBtn = document.getElementById("saveBtn");
    const previewBtn = document.getElementById("previewBtn");
    const backLink = document.getElementById("backLink");

    // ===== State =====
    let currentUser = null;
    let profileData = null;

    let creditRef = null;
    let creditData = null;

    let sourceInvoiceRef = null;
    let sourceInvoiceData = null;

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function todayIso(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return `${dd}/${mm}/${yyyy}`;
    }

    // ===== Routing =====
    function buildBackLink(){
      const p = new URLSearchParams(location.search);
      const fromDocId = (p.get("fromDocId") || "").trim();
      const docId = (p.get("docId") || "").trim();

      if(fromDocId){
        backLink.href = `facture.html?docId=${encodeURIComponent(fromDocId)}`;
        backLink.textContent = "← Facture";
        return;
      }
      if(docId){
        backLink.href = "avoirs-liste.html";
        backLink.textContent = "← Avoirs";
        return;
      }
      backLink.href = "factures-liste.html";
      backLink.textContent = "← Retour";
    }
    buildBackLink();

    function applyLogoFromProfile(profile){
      const bp = (profile?.businessProfile || {});
      const url = String(bp.logoUrl || "").trim();
      if(url){
        bizLogoImg.src = url;
        bizLogoImg.style.display = "block";
        bizLogoFallback.style.display = "none";
      }else{
        bizLogoImg.style.display = "none";
        bizLogoFallback.style.display = "block";
      }
    }

    function renderBusinessHeader(){
      const bp = (profileData?.businessProfile || {});
      const cName = String(bp.companyName || "Conciergerie").trim();

      const street = String(bp.address?.street || "").trim();
      const zip = String(bp.address?.zip || "").trim();
      const city = String(bp.address?.city || "").trim();

      const siret = String(bp.registration?.siret || "").trim();
      const ape = String(bp.registration?.ape || "").trim();

      const mail = String(bp.billingEmail || profileData?.email || "").trim();
      const phone = String(bp.phone || "").trim();

      appTitle.textContent = cName || "Conciergerie";
      bizNameEl.textContent = cName || "—";

      const lines = [];
      if(street) lines.push(esc(street));
      if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));

      const legal = [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • ");
      if(legal) lines.push(`<span class="mut">${esc(legal)}</span>`);

      const contact = [mail ? mail : "", phone ? phone : ""].filter(Boolean).join(" • ");
      if(contact) lines.push(`<span class="mut">${esc(contact)}</span>`);

      bizLinesEl.innerHTML = lines.length ? lines.join("<br>") : "—";
      applyLogoFromProfile(profileData);
    }

    function renderClientHeader(d){
      const name = String(d?.clientName || "—").trim();
      const a1 = String(d?.clientAddress1 || "").trim();
      const a2 = String(d?.clientAddress2 || "").trim();
      const zip = String(d?.clientZip || "").trim();
      const city = String(d?.clientCity || "").trim();

      clientNameEl.textContent = name || "—";

      const lines = [];
      if(a1) lines.push(esc(a1));
      if(a2) lines.push(esc(a2));
      if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));

      const mail = String(d?.clientEmail || "").trim();
      const tel  = String(d?.clientPhone || "").trim();
      const contact = [mail, tel].filter(Boolean).join(" • ");
      if(contact) lines.push(`<span class="mut">${esc(contact)}</span>`);

      clientLinesEl.innerHTML = lines.length ? lines.join("<br>") : `<span class="mut">Adresse manquante</span>`;
    }

    function computeTotals(lines, tvaEnabled, tvaRate){
      let ht = 0;
      for(const l of (Array.isArray(lines) ? lines : [])){
        const qty = Number(l?.qty)||0;
        const up  = Number(l?.unitPrice)||0;
        ht += qty * up;
      }
      const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    function getStayPeriod(d){
      const a = String(d?.arrivalDateKey || d?.arrivalDate || "").trim();
      const b = String(d?.departureDateKey || d?.departureDate || "").trim();
      if(a && b) return `Du ${a} au ${b}`;
      if(a) return `À partir du ${a}`;
      if(b) return `Jusqu’au ${b}`;
      return "—";
    }

    function creditStatusLabel(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return "—";
      if(x === "DRAFT") return "BROUILLON";
      if(x === "ISSUED") return "ÉMIS";
      return x;
    }

    async function loadProfile(uid){
      const ref = doc(db, "users", uid);
      const snap = await getDoc(ref);
      profileData = snap.exists() ? (snap.data() || {}) : {};
    }

    function renderLinesAndTotals(){
      const d = creditData || {};
      const bp = (profileData?.businessProfile || {});
      const tvaEnabled = !!bp.vat?.enabled;
      const tvaRate = Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0;

      thTVA.style.display = tvaEnabled ? "" : "none";
      linesTbody.innerHTML = "";

      const lines = Array.isArray(d.lines) ? d.lines : [];

      // on affiche les lignes (positives) mais le document est un avoir => on montre totaux en négatif
      for(const l of lines){
        const label = l?.label || "Ligne";
        const qty = Number(l?.qty)||0;
        const unit = l?.unit || "unité";
        const up = Number(l?.unitPrice)||0;

        const lineHT = qty * up;
        const lineTVA = tvaEnabled ? (lineHT * tvaRate) : 0;
        const lineTTC = lineHT + lineTVA;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="designation">${esc(label)}</td>
          <td class="num">${esc(qty)}</td>
          <td>${esc(unit)}</td>
          <td class="num">${esc(fmtMoney(up))}</td>
          <td class="num" style="${tvaEnabled ? "" : "display:none;"}">${tvaEnabled ? esc(fmtMoney(lineTVA)) : ""}</td>
          <td class="num">-${esc(fmtMoney(lineTTC))}</td>
        `;
        linesTbody.appendChild(tr);
      }

      const totals = computeTotals(lines, tvaEnabled, tvaRate);

      const html = [];
      if(tvaEnabled){
        html.push(`<div class="r"><span>Total HT</span><span>-${esc(fmtMoney(totals.ht))}</span></div>`);
        html.push(`<div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>-${esc(fmtMoney(totals.tva))}</span></div>`);
        html.push(`<div class="r"><span>Total TTC</span><span>-${esc(fmtMoney(totals.ttc))}</span></div>`);
      }else{
        html.push(`<div class="r"><span>Total TTC</span><span>-${esc(fmtMoney(totals.ttc))}</span></div>`);
        const ex = String(bp?.tvaExemptionText || "TVA non applicable (art. 293B CGI)").trim();
        if(ex) html.push(`<div class="mutedLine">${esc(ex)}</div>`);
      }
      totalsBox.innerHTML = html.join("");
    }

    function renderRecap(){
      const d = creditData || {};
      const inv = sourceInvoiceData || {};

      const creditNum = String(d.creditNumber || "").trim();
      const statusRaw = String(d.creditStatus || "").toUpperCase().trim();
      const statusForUi = (creditNum && (!statusRaw || statusRaw === "DRAFT")) ? "ISSUED" : (statusRaw || "");
      statusBadge.textContent = creditNum ? creditStatusLabel(statusForUi) : "BROUILLON";
      docBannerInner.textContent = `AVOIR N° ${creditNum || "—"}`;

      const invNum = String(d.fromInvoiceNumber || inv.invoiceNumber || "—").trim();
      const period = getStayPeriod(inv);

      const homeAddr = (inv.homeAddress || "").trim();
      const homeZip  = (inv.homeZip || "").toString().trim();
      const homeCity = (inv.homeCity || "").trim();
      const homeAddrFull = [homeAddr, [homeZip, homeCity].filter(Boolean).join(" ")].filter(Boolean).join(" • ");

      const recap = [];
      recap.push(`<div class="line"><b>Facture source</b> : ${esc(invNum)}</div>`);
      if(homeAddrFull) recap.push(`<div class="line"><b>Adresse logement</b> : ${esc(homeAddrFull)}</div>`);
      recap.push(`<div class="line"><b>Période</b> : ${esc(period)}</div>`);
      recapKv.innerHTML = recap.join("");

      if(reasonText.value === "" && d.creditReason) reasonText.value = String(d.creditReason||"");
      if(notesText.value === "" && d.creditNotes) notesText.value = String(d.creditNotes||"");

      renderBusinessHeader();
      renderClientHeader(d);
      renderLinesAndTotals();
    }

    async function ensureCreditNumber(uid, year){
      const counterId = `${uid}_${year}`;
      const counterRef = doc(db, "counters", counterId);

      const next = await runTransaction(db, async (tx)=>{
        const snap = await tx.get(counterRef);
        if(!snap.exists()){
          tx.set(counterRef, { quoteSeq: 0, invoiceSeq: 0, creditSeq: 0 });
        }
        const c = snap.exists() ? (snap.data() || {}) : { creditSeq: 0 };
        const n = (Number(c.creditSeq)||0) + 1;
        tx.set(counterRef, { ...c, creditSeq: n }, { merge:true });
        return n;
      });

      const padded = String(next).padStart(4,"0");
      return `AV${year}-${padded}`;
    }

    function lockUI(locked){
      saveBtn.disabled = !!locked;
      previewBtn.disabled = !!locked;
      saveBtn.style.opacity = locked ? "0.75" : "1";
    }

    // ===== Create credit from invoice =====
    async function createCreditFromInvoice(invoiceDocId){
      sourceInvoiceRef = doc(db, "salesDocuments", invoiceDocId);
      const snapInv = await getDoc(sourceInvoiceRef);
      if(!snapInv.exists()) throw new Error("Facture source introuvable.");

      const inv = { id:snapInv.id, ...(snapInv.data()||{}) };
      if(String(inv.conciergerieUid||"") !== String(currentUser.uid)){
        throw new Error("Accès refusé (facture d’une autre conciergerie).");
      }
      if(String(inv.type||"").toUpperCase().trim() !== "INVOICE"){
        throw new Error("Document source n’est pas une facture.");
      }
      if(!String(inv.invoiceNumber||"").trim()){
        throw new Error("Facture non émise (pas de numéro). Émets la facture avant l’avoir.");
      }

      sourceInvoiceData = inv;

      // Si déjà un avoir lié, on bloque (simple, propre)
      const existing = String(inv.avoirId || inv.creditId || inv.creditNoteId || "").trim();
      if(existing){
        throw new Error("Un avoir est déjà lié à cette facture (avoirId existant).");
      }

      const payload = {
        conciergerieUid: String(currentUser.uid),
        createdAt: serverTimestamp(),
        updatedAt: serverTimestamp(),
        createdBy: String(currentUser.uid),
        listable: true,

        type: "CREDIT_NOTE",
        docType: "CREDIT_NOTE",

        // lien facture source
        fromInvoiceDocId: inv.id,
        fromInvoiceNumber: String(inv.invoiceNumber||"").trim(),

        // copie logement/période
        homeId: String(inv.homeId || "").trim() || null,
        homeName: String(inv.homeName || "").trim() || "",
        homeAddress: String(inv.homeAddress || "").trim() || "",
        homeZip: String(inv.homeZip || "").trim() || "",
        homeCity: String(inv.homeCity || "").trim() || "",
        arrivalDateKey: String(inv.arrivalDateKey || "").trim() || "",
        departureDateKey: String(inv.departureDateKey || "").trim() || "",

        // copie client snapshot
        clientOwnerDocId: inv.clientOwnerDocId || null,
        clientName: String(inv.clientName || "").trim() || "",
        clientEmail: String(inv.clientEmail || "").trim() || "",
        clientPhone: String(inv.clientPhone || "").trim() || "",
        clientAddress1: String(inv.clientAddress1 || "").trim() || "",
        clientAddress2: String(inv.clientAddress2 || "").trim() || "",
        clientZip: String(inv.clientZip || "").trim() || "",
        clientCity: String(inv.clientCity || "").trim() || "",
        clientCountry: String(inv.clientCountry || "FR").trim() || "FR",
        clientType: String(inv.clientType || "").trim() || "",

        // lignes identiques
        lines: Array.isArray(inv.lines) ? inv.lines : [],

        // totaux stockés (positifs) — affichage négatif dans UI/print
        totalHT: Number(inv.totalHT)||0,
        totalTVA: Number(inv.totalTVA)||0,
        totalTTC: Number(inv.totalTTC)||0,

        // statut
        creditNumber: "",
        creditStatus: "DRAFT",
        creditIssuedDate: "",
        creditReason: "",
        creditNotes: ""
      };

      const created = await addDoc(collection(db,"salesDocuments"), payload);
      creditRef = doc(db, "salesDocuments", created.id);

      const snap2 = await getDoc(creditRef);
      creditData = { id:snap2.id, ...(snap2.data()||{}) };

      renderRecap();
    }

    async function loadCreditById(creditDocId){
      creditRef = doc(db, "salesDocuments", creditDocId);
      const snap = await getDoc(creditRef);
      if(!snap.exists()) throw new Error("Avoir introuvable.");

      const d = { id:snap.id, ...(snap.data()||{}) };
      if(String(d.conciergerieUid||"") !== String(currentUser.uid)) throw new Error("Accès refusé.");
      if(String(d.type||"").toUpperCase().trim() !== "CREDIT_NOTE") throw new Error("Document n’est pas un avoir.");

      creditData = d;

      // charger facture source (pour recap)
      const fromId = String(d.fromInvoiceDocId || "").trim();
      if(fromId){
        sourceInvoiceRef = doc(db,"salesDocuments", fromId);
        const invSnap = await getDoc(sourceInvoiceRef);
        sourceInvoiceData = invSnap.exists() ? { id:invSnap.id, ...(invSnap.data()||{}) } : null;
      }else{
        sourceInvoiceData = null;
      }

      renderRecap();
    }

    previewBtn.addEventListener("click", ()=>{
      if(!creditData?.id) return;

      const draft = {
        ...creditData,
        creditReason: String(reasonText.value || "").trim(),
        creditNotes: String(notesText.value || "").trim()
      };
      sessionStorage.setItem("creditDraftPreview", JSON.stringify(draft));
      location.href = `avoir-apercu.html?docId=${encodeURIComponent(creditData.id)}&draft=1`;
    });

    saveBtn.addEventListener("click", async ()=>{
      hideAlert();
      if(!creditRef || !creditData) return showAlert("Document non chargé.");

      const already = String(creditData.creditNumber || "").trim();
      if(already){
        return showAlert("Avoir déjà émis (numéro existant).", true);
      }

      lockUI(true);
      try{
        const year = new Date().getFullYear();
        const creditNumber = await ensureCreditNumber(currentUser.uid, year);

        const patch = {
          creditNumber,
          creditStatus: "ISSUED",
          creditIssuedAt: serverTimestamp(),
          creditIssuedDate: todayIso(),
          creditReason: String(reasonText.value || "").trim(),
          creditNotes: String(notesText.value || "").trim(),
          updatedAt: serverTimestamp()
        };

        await updateDoc(creditRef, patch);

        // patch facture source (simple)
        const fromId = String(creditData.fromInvoiceDocId || "").trim();
        if(fromId){
          const invRef = doc(db,"salesDocuments", fromId);
          await updateDoc(invRef, {
            invoiceStatus: "CREDITED",
            creditedAt: serverTimestamp(),
            avoirId: creditData.id,
            lastCreditId: creditData.id,
            updatedAt: serverTimestamp()
          });
        }

        const snap2 = await getDoc(creditRef);
        creditData = { id:snap2.id, ...(snap2.data()||{}) };

        showAlert("✅ Avoir émis et rattaché à la facture.", true);
        renderRecap();
      }catch(e){
        console.error(e);
        showAlert("Erreur : " + (e?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    });

    // ===== Init =====
    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }
      currentUser = user;

      try{
        await loadProfile(user.uid);

        const docId = getParam("docId");         // ouvrir un avoir existant
        const fromDocId = getParam("fromDocId"); // créer un avoir depuis facture

        if(docId){
          await loadCreditById(docId);
        }else if(fromDocId){
          await createCreditFromInvoice(fromDocId);
        }else{
          throw new Error("docId ou fromDocId manquant. Ex: avoir.html?fromDocId=XXXX");
        }

        lockUI(false);
      }catch(e){
        showAlert("⛔ " + (e?.message || "Erreur"), false);
      }
    });
  </script>
</body>
