<!-- docs/avoir.html (FINAL — Avoir: création depuis facture (fromDocId) + ouverture (docId), numéro AV, lie à facture -> invoiceStatus=CREDITED + avoirId) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Avoir</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-light:#F3ECFF;
      --violet-mid:#DCCBFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text-dark:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text-dark); }

    .page{
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:16px 16px 32px; padding-bottom:96px;
    }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill-link{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main); color:var(--violet-main);
      text-decoration:none; font-weight:900; font-size:13px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; cursor:pointer;
    }

    .logo-title{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:10px; margin-bottom:6px; text-align:center;
    }
    .logo-icon{
      width:40px;height:40px;border-radius:50%;
      background:#fff; border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0; overflow:hidden;
    }
    .logo-icon img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:24px; font-weight:900; color:#111; }
    .subtitle{ font-size:15px; color:#444; margin-top:4px; text-align:center; }

    .badge{
      margin-top:10px; padding:4px 10px; border-radius:999px; background:#fff;
      font-size:12px; color:#555; box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center; font-weight:900; white-space:pre-wrap;
    }

    .docBanner{
      width:100%; max-width:1100px;
      margin-top:10px;
      display:flex; justify-content:center;
    }
    .docBannerInner{
      background:#fff;
      border:1px solid var(--border);
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      border-radius:999px;
      padding:8px 14px;
      font-weight:1000;
      font-size:13px;
      color:#222;
      display:flex; gap:10px; align-items:center;
      white-space:nowrap;
    }

    .layout{
      width:100%;
      max-width:1100px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    @media(min-width:980px){
      .layout{
        display:grid;
        grid-template-columns: 520px 1fr;
        align-items:start;
      }
    }

    .card{
      width:100%; background: rgba(255,255,255,0.86);
      border: 1px solid var(--border); border-radius:18px;
      box-shadow: var(--shadow); padding:14px 14px 16px; backdrop-filter: blur(10px);
    }

    .card-title{
      font-size:16px; font-weight:1000; margin-bottom:8px;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
    }
    .small{ font-size:12px; color:var(--muted); line-height:1.35; font-weight:800; }

    .alert{
      margin-top:10px; padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .kv{
      margin-top:6px; display:grid; grid-template-columns: 1fr; gap:6px;
      font-size:13px; color:#333; font-weight:850;
    }
    .kv b{ font-weight:1000; }
    .kv .line{ line-height:1.35; }

    .divider{ height:1px; width:100%; background: rgba(122,92,255,0.18); margin:12px 0; }

    .tableWrap{
      overflow:auto; border-radius:14px; border:1px solid rgba(0,0,0,0.04);
      background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    table{ width:100%; border-collapse:collapse; min-width:0; }
    th, td{
      padding:10px 10px; border-bottom:1px solid rgba(0,0,0,0.05);
      text-align:left; font-size:12.5px;
      vertical-align:top;
    }
    th{
      font-size:12px; color:#444; font-weight:1000;
      background:rgba(248,244,255,.7); position:sticky; top:0;
    }
    td.num, th.num{ text-align:right; white-space:nowrap; }
    td.designation{ white-space:normal; word-break:break-word; }

    .linesCards{ display:none; }
    @media(max-width:720px){
      .tableWrap{ display:none; }
      .linesCards{ display:flex; flex-direction:column; gap:10px; }
      .lineCard{
        background:#fff; border:1px solid rgba(122,92,255,0.18);
        border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.06);
        padding:10px 12px;
      }
      .lineCard .t{ font-weight:1000; }
      .lineCard .g{ display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:8px; font-size:12.5px; color:#222; font-weight:850; }
      .lineCard .g div{ background:rgba(248,244,255,.6); border-radius:10px; padding:8px 10px; }
      .lineCard .g b{ font-weight:1000; }
    }

    .totals{
      margin-top:10px; background:#fff; border-radius:14px;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px; display:flex; flex-direction:column; gap:6px; font-weight:1000;
    }
    .totals .r{ display:flex; justify-content:space-between; gap:10px; }
    .mutedLine{ font-size:12px; color:#666; font-weight:900; }

    label{
      display:block; font-size:12px; font-weight:1000; color:#333;
      margin:10px 0 4px; text-align:left;
    }
    textarea, select{
      width:100%; padding:10px 12px; border-radius:12px;
      border:1px solid #D3C7FF; font-size:14px; outline:none;
      background:#fff; font-weight:800; color:#111;
    }
    textarea{ resize:vertical; }
    textarea:focus, select:focus{
      border-color:var(--violet-main);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }

    .actions{
      display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;
    }
    .btn{
      flex:1; border:none; border-radius:999px; padding:10px 12px;
      font-size:13px; font-weight:1000; cursor:pointer;
      background:#fff; color:var(--violet-main);
      border:2px solid var(--violet-main); box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff; box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .headCard{
      max-width:1100px; width:100%;
      display:grid; grid-template-columns:1fr; gap:12px;
      align-items:stretch;
      margin-top:14px;
    }
    @media(min-width:860px){
      .headCard{ grid-template-columns: 1fr 1fr; }
    }
    .headBox{
      background:#fff; border:1px solid rgba(122,92,255,0.18);
      border-radius:18px; box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:12px 12px 10px;
      display:flex; flex-direction:column; height:100%;
    }
    .headRow{ display:flex; gap:10px; align-items:flex-start; }
    .bizLogo{
      width:44px;height:44px;border-radius:12px; overflow:hidden;
      border:2px solid rgba(122,92,255,0.35); background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:1000; color:var(--violet-main);
      flex-shrink:0;
    }
    .bizLogo img{ width:100%; height:100%; object-fit:cover; display:none; }
    .headTitle{ font-weight:1000; font-size:12px; color:#555; letter-spacing:.2px; }
    .headMain{ font-weight:1000; font-size:14px; color:#111; margin-top:2px; }
    .headLines{ margin-top:6px; font-size:12.5px; color:#222; font-weight:850; line-height:1.35; }
    .headLines .mut{ color:#666; font-weight:900; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:11px; font-weight:1000; text-decoration:none;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 980px){
      .bottom-nav{
        position: static; max-width: 1100px; margin: 12px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" id="backLink" href="factures-liste.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon" id="logoIcon">
        <img id="logoImg" alt="Logo">
        <span id="logoFallback">✓</span>
      </div>
      <h1 id="appTitle">—</h1>
    </div>

    <div class="subtitle">Avoir (annulation / crédit)</div>
    <div class="badge" id="statusBadge">—</div>

    <div class="docBanner">
      <div class="docBannerInner" id="docBannerInner">AVOIR N° —</div>
    </div>

    <div class="headCard">
      <div class="headBox">
        <div class="headRow">
          <div class="bizLogo">
            <img id="bizLogoImg" alt="Logo société">
            <span id="bizLogoFallback">✓</span>
          </div>
          <div style="flex:1;">
            <div class="headTitle">Société</div>
            <div class="headMain" id="bizName">—</div>
            <div class="headLines" id="bizLines">—</div>
          </div>
        </div>
      </div>

      <div class="headBox">
        <div class="headTitle">Client</div>
        <div class="headMain" id="clientName">—</div>
        <div class="headLines" id="clientLines">—</div>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <div class="card-title">
          <span>Référence</span>
          <span class="small">facture source + logement</span>
        </div>

        <div class="alert" id="alertBox"></div>
        <div class="kv" id="recapKv"></div>

        <div class="divider"></div>

        <div class="card-title" style="font-size:14px; margin-bottom:6px;">
          <span>Lignes</span>
          <span class="small">copiées de la facture</span>
        </div>

        <div class="linesCards" id="linesCards"></div>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Désignation</th>
                <th class="num">Qté</th>
                <th>Unité</th>
                <th class="num">PU HT</th>
                <th class="num" id="thTVA" style="display:none;">TVA</th>
                <th class="num">Total TTC</th>
              </tr>
            </thead>
            <tbody id="linesTbody"></tbody>
          </table>
        </div>

        <div class="totals" id="totalsBox"></div>
      </div>

      <div class="card">
        <div class="card-title">
          <span>Gestion avoir</span>
          <span class="small">raison + émission</span>
        </div>

        <label for="creditReason">Motif (interne)</label>
        <textarea id="creditReason" rows="3" placeholder="Ex : annulation séjour / erreur facture / remise commerciale…"></textarea>

        <label for="creditMode">Type d’avoir</label>
        <select id="creditMode">
          <option value="FULL">Total (annule la facture)</option>
          <option value="PARTIAL">Partiel (crédit partiel)</option>
        </select>

        <div class="divider"></div>

        <div class="card-title" style="font-size:14px; margin-bottom:6px;">
          <span>Infos</span>
          <span class="small">TVA / totaux</span>
        </div>
        <div class="kv" id="infoKv"></div>

        <div class="actions">
          <button class="btn primary" type="button" id="saveBtn">Émettre l’avoir (créer numéro)</button>
          <button class="btn" type="button" id="previewBtn">Aperçu / Imprimer</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Production</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc, updateDoc, serverTimestamp, runTransaction
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ===== UI =====
    const backLink = document.getElementById("backLink");
    const alertBox = document.getElementById("alertBox");
    const recapKv = document.getElementById("recapKv");
    const statusBadge = document.getElementById("statusBadge");
    const docBannerInner = document.getElementById("docBannerInner");
    const infoKv = document.getElementById("infoKv");

    const appTitle = document.getElementById("appTitle");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");
    const bizLogoImg = document.getElementById("bizLogoImg");
    const bizLogoFallback = document.getElementById("bizLogoFallback");

    const bizNameEl = document.getElementById("bizName");
    const bizLinesEl = document.getElementById("bizLines");
    const clientNameEl = document.getElementById("clientName");
    const clientLinesEl = document.getElementById("clientLines");

    const thTVA = document.getElementById("thTVA");
    const linesTbody = document.getElementById("linesTbody");
    const linesCards = document.getElementById("linesCards");
    const totalsBox = document.getElementById("totalsBox");

    const creditReasonEl = document.getElementById("creditReason");
    const creditModeEl = document.getElementById("creditMode");

    const saveBtn = document.getElementById("saveBtn");
    const previewBtn = document.getElementById("previewBtn");

    // ===== State =====
    let currentUser = null;
    let profileData = null;

    // avoir doc (salesDocuments) OR create from invoice
    let creditRef = null;
    let creditData = null;

    let sourceInvoiceRef = null;
    let sourceInvoiceData = null;

    // ===== Helpers =====
    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function todayIso(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return `${dd}/${mm}/${yyyy}`;
    }
    function computeHT(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }
    function computeTotalsFromLines(lines, tvaEnabled, tvaRate){
      const ht = computeHT(lines);
      const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    function applyLogoFromProfile(profile){
      const bp = (profile?.businessProfile || {});
      const url = String(bp.logoUrl || "").trim();

      if(url){
        logoImg.src = url;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }

      if(url){
        bizLogoImg.src = url;
        bizLogoImg.style.display = "block";
        bizLogoFallback.style.display = "none";
      }else{
        bizLogoImg.style.display = "none";
        bizLogoFallback.style.display = "block";
      }
    }

    function renderBusinessHeader(){
      const bp = (profileData?.businessProfile || {});
      const cName = String(bp.companyName || "Conciergerie").trim();

      const street = String(bp.address?.street || "").trim();
      const zip = String(bp.address?.zip || "").trim();
      const city = String(bp.address?.city || "").trim();

      const siret = String(bp.registration?.siret || "").trim();
      const ape = String(bp.registration?.ape || "").trim();

      const mail = String(bp.billingEmail || profileData?.email || "").trim();
      const phone = String(bp.phone || "").trim();

      appTitle.textContent = cName || "Conciergerie";
      bizNameEl.textContent = cName || "—";

      const lines = [];
      if(street) lines.push(esc(street));
      if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));

      const legal = [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • ");
      if(legal) lines.push(`<span class="mut">${esc(legal)}</span>`);

      const contact = [mail ? mail : "", phone ? phone : ""].filter(Boolean).join(" • ");
      if(contact) lines.push(`<span class="mut">${esc(contact)}</span>`);

      bizLinesEl.innerHTML = lines.length ? lines.join("<br>") : "—";
      applyLogoFromProfile(profileData);
    }

    function renderClientHeader(d){
      const name = String(d?.clientName || d?.ownerName || "—").trim();

      const a1 = String(d?.clientAddress1 || d?.ownerAddress1 || "").trim();
      const a2 = String(d?.clientAddress2 || d?.ownerAddress2 || "").trim();
      const zip = String(d?.clientZip || d?.ownerZip || "").trim();
      const city = String(d?.clientCity || d?.ownerCity || "").trim();

      clientNameEl.textContent = name || "—";

      const lines = [];
      if(a1) lines.push(esc(a1));
      if(a2) lines.push(esc(a2));
      if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));

      const mail = String(d?.clientEmail || d?.ownerEmail || "").trim();
      const tel  = String(d?.clientPhone || d?.ownerPhone || "").trim();
      const contact = [mail, tel].filter(Boolean).join(" • ");
      if(contact) lines.push(`<span class="mut">${esc(contact)}</span>`);

      clientLinesEl.innerHTML = lines.length ? lines.join("<br>") : `<span class="mut">Adresse manquante</span>`;
    }

    function renderLinesAndTotals(lines, storedTotals){
      const bp = (profileData?.businessProfile || {});
      const tvaEnabled = !!bp.vat?.enabled;
      const tvaRate = Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0;

      thTVA.style.display = tvaEnabled ? "" : "none";
      linesTbody.innerHTML = "";
      linesCards.innerHTML = "";

      for(const l of (Array.isArray(lines) ? lines : [])){
        const label = l?.label || "Ligne";
        const qty = Number(l?.qty)||0;
        const unit = l?.unit || "unité";
        const up = Number(l?.unitPrice)||0;

        const lineHT = qty * up;
        const lineTVA = tvaEnabled ? (lineHT * tvaRate) : 0;
        const lineTotal = lineHT + lineTVA;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td class="designation">${esc(label)}</td>
          <td class="num">${esc(qty)}</td>
          <td>${esc(unit)}</td>
          <td class="num">${esc(fmtMoney(up))}</td>
          <td class="num" style="${tvaEnabled ? "" : "display:none;"}">${tvaEnabled ? esc(fmtMoney(lineTVA)) : ""}</td>
          <td class="num">${esc(fmtMoney(lineTotal))}</td>
        `;
        linesTbody.appendChild(tr);

        const card = document.createElement("div");
        card.className = "lineCard";
        card.innerHTML = `
          <div class="t">${esc(label)}</div>
          <div class="g">
            <div><b>Qté</b> : ${esc(qty)}</div>
            <div><b>Unité</b> : ${esc(unit)}</div>
            <div><b>PU HT</b> : ${esc(fmtMoney(up))}</div>
            <div><b>Total TTC</b> : ${esc(fmtMoney(lineTotal))}</div>
          </div>
        `;
        linesCards.appendChild(card);
      }

      // Totaux : priorité à ce qui est stocké sur la facture source (plus cohérent)
      const hasStored =
        Number.isFinite(Number(storedTotals?.ht)) ||
        Number.isFinite(Number(storedTotals?.tva)) ||
        Number.isFinite(Number(storedTotals?.ttc));

      const calc = computeTotalsFromLines(lines, tvaEnabled, tvaRate);
      const tot = {
        ht:  Number.isFinite(Number(storedTotals?.ht))  ? Number(storedTotals.ht)  : calc.ht,
        tva: Number.isFinite(Number(storedTotals?.tva)) ? Number(storedTotals.tva) : calc.tva,
        ttc: Number.isFinite(Number(storedTotals?.ttc)) ? Number(storedTotals.ttc) : calc.ttc,
      };

      const html = [];
      if(tvaEnabled){
        html.push(`<div class="r"><span>Total HT</span><span>${esc(fmtMoney(tot.ht))}</span></div>`);
        html.push(`<div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>${esc(fmtMoney(tot.tva))}</span></div>`);
        html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(tot.ttc))}</span></div>`);
      }else{
        html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(tot.ttc))}</span></div>`);
        const ex = String(bp?.tvaExemptionText || "TVA non applicable (art. 293B CGI)").trim();
        if(ex) html.push(`<div class="mutedLine">${esc(ex)}</div>`);
      }
      totalsBox.innerHTML = html.join("");

      return { tvaEnabled, tvaRate, totals: tot };
    }

    function lockUI(locked){
      saveBtn.disabled = !!locked;
      previewBtn.disabled = !!locked || !creditRef || !String(creditData?.creditNumber||"").trim();
      saveBtn.style.opacity = locked ? "0.75" : "1";
    }

    async function loadProfile(uid){
      const ref = doc(db, "users", uid);
      const snap = await getDoc(ref);
      profileData = snap.exists() ? (snap.data() || {}) : {};
    }

    async function ensureCreditNumber(uid, year){
      const counterId = `${uid}_${year}`;
      const counterRef = doc(db, "counters", counterId);

      const next = await runTransaction(db, async (tx)=>{
        const snap = await tx.get(counterRef);
        if(!snap.exists()){
          tx.set(counterRef, { quoteSeq: 0, invoiceSeq: 0, creditSeq: 0 });
        }
        const c = snap.exists() ? (snap.data() || {}) : { creditSeq: 0 };
        const n = (Number(c.creditSeq)||0) + 1;
        tx.set(counterRef, { ...c, creditSeq: n }, { merge:true });
        return n;
      });

      const padded = String(next).padStart(4,"0");
      return `AV${year}-${padded}`;
    }

    function creditStatusLabel(s){
      const x = String(s||"").toUpperCase().trim();
      if(!x) return "—";
      if(x === "DRAFT") return "BROUILLON";
      if(x === "ISSUED") return "ÉMIS";
      if(x === "CANCELLED") return "ANNULÉ";
      return x;
    }

    function getBackHref(){
      const docId = getParam("docId");
      const fromDocId = getParam("fromDocId");
      // si on vient de factures-liste -> retour factures
      if(fromDocId && !docId) return "factures-liste.html";
      // sinon logique : liste avoirs
      return "avoir-liste.html";
    }

    function render(){
      if(!profileData) return;

      backLink.href = getBackHref();

      renderBusinessHeader();

      // base pour l’affichage client/lignes : si avoir existant -> creditData, sinon facture source
      const dClient = creditData || sourceInvoiceData || {};
      renderClientHeader(dClient);

      const mode = String(creditModeEl.value||"FULL").toUpperCase();
      const reason = (creditReasonEl.value||"").trim();

      // référence facture source
      const invNum = String(sourceInvoiceData?.invoiceNumber || creditData?.fromInvoiceNumber || "").trim();
      const home = String(sourceInvoiceData?.homeName || creditData?.homeName || "—").trim();
      const created = sourceInvoiceData?.invoiceIssuedDate || sourceInvoiceData?.createdAt || sourceInvoiceData?.createdAtMs || null;

      recapKv.innerHTML = `
        <div class="line"><b>Facture source</b> : ${esc(invNum || "—")}</div>
        <div class="line"><b>Logement</b> : ${esc(home || "—")}</div>
      `;

      const creditNum = String(creditData?.creditNumber || "").trim();
      docBannerInner.textContent = `AVOIR N° ${creditNum || "—"}`;

      const stRaw = String(creditData?.avoirStatus || creditData?.creditStatus || "").toUpperCase().trim();
      const stUi = creditNum && (!stRaw || stRaw === "DRAFT") ? "ISSUED" : (stRaw || (creditNum ? "ISSUED" : "DRAFT"));
      statusBadge.textContent = creditStatusLabel(stUi);

      // lignes/totaux
      const lines = Array.isArray(sourceInvoiceData?.lines) ? sourceInvoiceData.lines : (Array.isArray(creditData?.lines) ? creditData.lines : []);
      const storedTotals = {
        ht:  sourceInvoiceData?.totalHT ?? creditData?.totalHT,
        tva: sourceInvoiceData?.totalTVA ?? creditData?.totalTVA,
        ttc: sourceInvoiceData?.totalTTC ?? creditData?.totalTTC
      };
      const { totals } = renderLinesAndTotals(lines, storedTotals);

      infoKv.innerHTML = `
        <div class="line"><b>Type</b> : ${esc(mode === "FULL" ? "Total" : "Partiel")}</div>
        <div class="line"><b>Montant crédité</b> : ${esc(fmtMoney(totals.ttc))}</div>
        <div class="line"><b>Motif</b> : ${esc(reason || "—")}</div>
      `;

      // boutons
      saveBtn.disabled = !sourceInvoiceRef && !creditRef;
      previewBtn.disabled = !(creditRef && String(creditData?.creditNumber||"").trim());
    }

    async function loadExistingCredit(docId){
      creditRef = doc(db, "salesDocuments", docId);
      const snap = await getDoc(creditRef);
      if(!snap.exists()) throw new Error("Avoir introuvable.");
      creditData = { id:snap.id, ...(snap.data()||{}) };

      if(String(creditData.conciergerieUid||"") !== String(currentUser.uid)){
        throw new Error("Accès refusé (avoir d’une autre conciergerie).");
      }

      // essayer de charger facture source (facultatif)
      const fromId = String(creditData.fromInvoiceId || creditData.fromDocId || "").trim();
      if(fromId){
        try{
          sourceInvoiceRef = doc(db, "salesDocuments", fromId);
          const s2 = await getDoc(sourceInvoiceRef);
          if(s2.exists()) sourceInvoiceData = { id:s2.id, ...(s2.data()||{}) };
        }catch{}
      }
    }

    async function loadSourceInvoice(fromDocId){
      sourceInvoiceRef = doc(db, "salesDocuments", fromDocId);
      const snap = await getDoc(sourceInvoiceRef);
      if(!snap.exists()) throw new Error("Facture source introuvable.");
      sourceInvoiceData = { id:snap.id, ...(snap.data()||{}) };

      if(String(sourceInvoiceData.conciergerieUid||"") !== String(currentUser.uid)){
        throw new Error("Accès refusé (facture d’une autre conciergerie).");
      }

      const type = String(sourceInvoiceData.type || sourceInvoiceData.docType || "").toUpperCase().trim();
      if(type !== "INVOICE" && !String(sourceInvoiceData.invoiceNumber||"").trim()){
        // on tolère mais on prévient
        console.warn("Source not invoice-like:", type);
      }

      // préremplir UI
      creditReasonEl.value = String(sourceInvoiceData?.creditReason || "").trim();
      creditModeEl.value = "FULL";
    }

    // navigation preview
    previewBtn.addEventListener("click", ()=>{
      if(!creditRef || !creditData) return;
      location.href = `avoir-apercu.html?docId=${encodeURIComponent(creditData.id)}`;
    });

    // save (emit credit note)
    saveBtn.addEventListener("click", async ()=>{
      hideAlert();
      if(!currentUser?.uid) return;

      lockUI(true);
      try{
        // si on ouvre un avoir existant déjà numéroté -> on ne renumérote pas
        const alreadyNumbered = !!String(creditData?.creditNumber||"").trim();
        if(alreadyNumbered){
          // on autorise juste update reason/mode (sans toucher facture)
          await updateDoc(creditRef, {
            creditReason: (creditReasonEl.value||"").trim(),
            creditMode: String(creditModeEl.value||"FULL").toUpperCase(),
            creditUpdatedAt: serverTimestamp()
          });
          const s = await getDoc(creditRef);
          creditData = { id:s.id, ...(s.data()||{}) };
          showAlert("✅ Avoir mis à jour.", true);
          render();
          return;
        }

        if(!sourceInvoiceRef || !sourceInvoiceData){
          throw new Error("Facture source non chargée (fromDocId manquant).");
        }

        const invNum = String(sourceInvoiceData.invoiceNumber || "").trim();
        if(!invNum) throw new Error("La facture source doit être ÉMISE (invoiceNumber manquant).");

        const invStatus = String(sourceInvoiceData.invoiceStatus||"").toUpperCase().trim();
        if(["CANCELLED"].includes(invStatus)) throw new Error("Impossible : facture annulée.");
        // on tolère PAID (avoir post-paiement) mais c’est un cas à part; ici on laisse.
        // on bloque si déjà CREDITED + avoirId existant
        const existingAvoirId = String(sourceInvoiceData.avoirId || sourceInvoiceData.creditId || sourceInvoiceData.creditNoteId || "").trim();
        if(existingAvoirId){
          throw new Error("Cette facture a déjà un avoir lié (avoirId existant).");
        }

        const bp = (profileData?.businessProfile || {});
        const tvaEnabled = !!bp.vat?.enabled;
        const tvaRate = Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0;

        const year = new Date().getFullYear();
        const creditNumber = await ensureCreditNumber(currentUser.uid, year);

        // totaux : priorité stockés facture
        const lines = Array.isArray(sourceInvoiceData.lines) ? sourceInvoiceData.lines : [];
        const calc = computeTotalsFromLines(lines, tvaEnabled, tvaRate);
        const totalHT  = Number.isFinite(Number(sourceInvoiceData.totalHT))  ? Number(sourceInvoiceData.totalHT)  : calc.ht;
        const totalTVA = Number.isFinite(Number(sourceInvoiceData.totalTVA)) ? Number(sourceInvoiceData.totalTVA) : calc.tva;
        const totalTTC = Number.isFinite(Number(sourceInvoiceData.totalTTC)) ? Number(sourceInvoiceData.totalTTC) : calc.ttc;

        // créer doc avoir
        const creditId = `credit_${Date.now()}_${Math.random().toString(16).slice(2)}`;
        creditRef = doc(db, "salesDocuments", creditId);

        const creditPayload = {
          conciergerieUid: currentUser.uid,
          type: "CREDIT_NOTE",
          docType: "CREDIT_NOTE",
          listable: true,

          creditNumber,
          avoirNumber: creditNumber,

          avoirStatus: "ISSUED",
          creditStatus: "ISSUED",

          creditIssuedAt: serverTimestamp(),
          creditIssuedDate: todayIso(),

          creditReason: (creditReasonEl.value||"").trim(),
          creditMode: String(creditModeEl.value||"FULL").toUpperCase(),

          // lien facture source
          fromInvoiceId: sourceInvoiceData.id,
          fromInvoiceNumber: invNum,

          // snapshot client/logement pour affichage + exports
          clientName: sourceInvoiceData.clientName || sourceInvoiceData.ownerName || "",
          clientEmail: sourceInvoiceData.clientEmail || sourceInvoiceData.ownerEmail || "",
          clientPhone: sourceInvoiceData.clientPhone || sourceInvoiceData.ownerPhone || "",
          clientAddress1: sourceInvoiceData.clientAddress1 || sourceInvoiceData.ownerAddress1 || "",
          clientAddress2: sourceInvoiceData.clientAddress2 || sourceInvoiceData.ownerAddress2 || "",
          clientZip: sourceInvoiceData.clientZip || sourceInvoiceData.ownerZip || "",
          clientCity: sourceInvoiceData.clientCity || sourceInvoiceData.ownerCity || "",
          clientCountry: sourceInvoiceData.clientCountry || sourceInvoiceData.ownerCountry || "FR",
          clientType: sourceInvoiceData.clientType || (sourceInvoiceData.isPro ? "PRO" : "PARTICULIER") || "PARTICULIER",

          homeId: sourceInvoiceData.homeId || "",
          homeName: sourceInvoiceData.homeName || "",
          homeAddress: sourceInvoiceData.homeAddress || "",
          homeZip: sourceInvoiceData.homeZip || "",
          homeCity: sourceInvoiceData.homeCity || "",

          arrivalDateKey: sourceInvoiceData.arrivalDateKey || "",
          departureDateKey: sourceInvoiceData.departureDateKey || "",

          quoteNumber: sourceInvoiceData.quoteNumber || "",

          lines,

          totalHT,
          totalTVA,
          totalTTC,

          createdAt: serverTimestamp(),
          createdAtMs: Date.now(),
          updatedAt: serverTimestamp(),
        };

        await setDoc(creditRef, creditPayload);

        // patch facture source : marquer créditée + lier avoir
        await updateDoc(sourceInvoiceRef, {
          invoiceStatus: "CREDITED",
          creditedAt: serverTimestamp(),
          avoirId: creditId,
          creditId: creditId,
          creditNumber: creditNumber,
          commercialStatus: "FACTURE_CREDITEE",
          commercialUpdatedAt: serverTimestamp(),
        });

        // reload avoir
        const s = await getDoc(creditRef);
        creditData = { id:s.id, ...(s.data()||{}) };

        showAlert("✅ Avoir émis + facture marquée CRÉDITÉE.", true);
        render();
      }catch(e){
        console.error(e);
        showAlert("Erreur : " + (e?.message || "inconnue"));
      }finally{
        lockUI(false);
      }
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }
      currentUser = user;

      try{
        await loadProfile(user.uid);

        // back
        backLink.href = getBackHref();

        const docId = getParam("docId");
        const fromDocId = getParam("fromDocId");

        if(docId){
          await loadExistingCredit(docId);
        }else if(fromDocId){
          await loadSourceInvoice(fromDocId);
        }else{
          throw new Error("docId ou fromDocId manquant. Ex: avoir.html?fromDocId=FACTURE_ID");
        }

        render();
      }catch(e){
        showAlert("⛔ " + (e?.message || "Erreur chargement avoir"));
      }
    });
  </script>
</body>
</html>
