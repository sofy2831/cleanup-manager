<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Avoir</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-light:#F3ECFF;
      --violet-mid:#DCCBFF;
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text-dark:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text-dark); }

    .page{
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:16px 16px 32px; padding-bottom:96px;
    }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill-link{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main); color:var(--violet-main);
      text-decoration:none; font-weight:900; font-size:13px; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap; cursor:pointer;
    }

    .logo-title{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:10px; margin-bottom:6px; text-align:center;
    }
    .logo-icon{
      width:40px;height:40px;border-radius:50%;
      background:#fff; border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0; overflow:hidden;
    }
    .logo-icon img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:24px; font-weight:900; color:#111; }
    .subtitle{ font-size:15px; color:#444; margin-top:4px; text-align:center; }

    .badge{
      margin-top:10px; padding:4px 10px; border-radius:999px; background:#fff;
      font-size:12px; color:#555; box-shadow:0 3px 10px rgba(0,0,0,.06);
      text-align:center; font-weight:900; white-space:pre-wrap;
    }

    .docBanner{
      width:100%; max-width:1100px;
      margin-top:10px;
      display:flex; justify-content:center;
    }
    .docBannerInner{
      background:#fff;
      border:1px solid var(--border);
      box-shadow:0 10px 22px rgba(0,0,0,.08);
      border-radius:999px;
      padding:8px 14px;
      font-weight:1000;
      font-size:13px;
      color:#222;
      display:flex; gap:10px; align-items:center;
      white-space:nowrap;
    }

    .alert{
      width:100%; max-width:1100px;
      margin-top:12px;
      padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .headCard{
      max-width:1100px; width:100%;
      display:grid; grid-template-columns:1fr; gap:12px;
      align-items:stretch;
      margin-top:14px;
    }
    @media(min-width:860px){
      .headCard{ grid-template-columns: 1fr 1fr; }
    }
    .headBox{
      background:#fff; border:1px solid rgba(122,92,255,0.18);
      border-radius:18px; box-shadow:0 10px 22px rgba(0,0,0,.08);
      padding:12px 12px 10px;
      display:flex; flex-direction:column; height:100%;
    }
    .headRow{ display:flex; gap:10px; align-items:flex-start; }
    .bizLogo{
      width:44px;height:44px;border-radius:12px; overflow:hidden;
      border:2px solid rgba(122,92,255,0.35); background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:1000; color:var(--violet-main);
      flex-shrink:0;
    }
    .bizLogo img{ width:100%; height:100%; object-fit:cover; display:none; }
    .headTitle{ font-weight:1000; font-size:12px; color:#555; letter-spacing:.2px; }
    .headMain{ font-weight:1000; font-size:14px; color:#111; margin-top:2px; }
    .headLines{ margin-top:6px; font-size:12.5px; color:#222; font-weight:850; line-height:1.35; }
    .headLines .mut{ color:#666; font-weight:900; }

    .layout{
      width:100%;
      max-width:1100px;
      margin-top:14px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }
    .card{
      width:100%; background: rgba(255,255,255,0.86);
      border: 1px solid var(--border); border-radius:18px;
      box-shadow: var(--shadow); padding:14px 14px 16px; backdrop-filter: blur(10px);
    }
    .card-title{
      font-size:16px; font-weight:1000; margin-bottom:8px;
      display:flex; align-items:center; justify-content:space-between; gap:8px;
    }
    .small{ font-size:12px; color:var(--muted); line-height:1.35; font-weight:800; }

    .tableWrap{
      overflow:auto; border-radius:14px; border:1px solid rgba(0,0,0,0.04);
      background:#fff; box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    table{ width:100%; border-collapse:collapse; min-width:0; }
    th, td{
      padding:10px 10px; border-bottom:1px solid rgba(0,0,0,0.05);
      text-align:left; font-size:12.5px;
      vertical-align:top;
    }
    th{
      font-size:12px; color:#444; font-weight:1000;
      background:rgba(248,244,255,.7); position:sticky; top:0;
    }
    td.num, th.num{ text-align:right; white-space:nowrap; }
    td.designation{ white-space:normal; word-break:break-word; }

    .totals{
      margin-top:10px; background:#fff; border-radius:14px;
      border:1px solid rgba(122,92,255,0.18);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px; display:flex; flex-direction:column; gap:6px; font-weight:1000;
    }
    .totals .r{ display:flex; justify-content:space-between; gap:10px; }
    .mutedLine{ font-size:12px; color:#666; font-weight:900; }

    .actions{
      display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;
    }
    .btn{
      flex:1;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      border:none;
      border-radius:999px;
      padding:10px 12px;
      font-size:13px;
      font-weight:1000;
      cursor:pointer;
      background:#fff;
      color:var(--violet-main);
      border:2px solid var(--violet-main);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
      line-height:1;
      text-decoration:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent; color:#fff; box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:11px; font-weight:1000; text-decoration:none;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 980px){
      .bottom-nav{
        position: static; max-width: 1100px; margin: 12px auto 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
      }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill-link" href="avoir-liste.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon" id="logoIcon">
        <img id="logoImg" alt="Logo">
        <span id="logoFallback">✓</span>
      </div>
      <h1 id="appTitle">—</h1>
    </div>

    <div class="subtitle">Avoir</div>
    <div class="badge" id="statusBadge">—</div>

    <div class="docBanner">
      <div class="docBannerInner" id="docBannerInner">AVOIR N° —</div>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="headCard">
      <div class="headBox">
        <div class="headRow">
          <div class="bizLogo">
            <img id="bizLogoImg" alt="Logo société">
            <span id="bizLogoFallback">✓</span>
          </div>
          <div style="flex:1;">
            <div class="headTitle">Société</div>
            <div class="headMain" id="bizName">—</div>
            <div class="headLines" id="bizLines">—</div>
          </div>
        </div>
      </div>

      <div class="headBox">
        <div class="headTitle">Client</div>
        <div class="headMain" id="clientName">—</div>
        <div class="headLines" id="clientLines">—</div>
      </div>
    </div>

    <div class="layout">
      <div class="card">
        <div class="card-title">
          <span>Détails</span>
          <span class="small">Montants négatifs (crédit)</span>
        </div>

        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>Désignation</th>
                <th class="num">Qté</th>
                <th>Unité</th>
                <th class="num">PU HT</th>
                <th class="num" id="thTVA" style="display:none;">TVA</th>
                <th class="num">Total TTC</th>
              </tr>
            </thead>
            <tbody id="linesTbody"></tbody>
          </table>

        <div class="totals" id="totalsBox"></div>

        <div class="actions">
          <a class="btn" id="openInvoiceBtn" href="#" style="display:none;">Voir la facture</a>
          <button class="btn primary" type="button" id="printBtn">Imprimer / PDF</button>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    doc, getDoc, collection, query, where, getDocs, limit
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const alertBox = document.getElementById("alertBox");
  const statusBadge = document.getElementById("statusBadge");
  const docBannerInner = document.getElementById("docBannerInner");

  const appTitle = document.getElementById("appTitle");
  const logoImg = document.getElementById("logoImg");
  const logoFallback = document.getElementById("logoFallback");
  const bizLogoImg = document.getElementById("bizLogoImg");
  const bizLogoFallback = document.getElementById("bizLogoFallback");

  const bizNameEl = document.getElementById("bizName");
  const bizLinesEl = document.getElementById("bizLines");
  const clientNameEl = document.getElementById("clientName");
  const clientLinesEl = document.getElementById("clientLines");

  const thTVA = document.getElementById("thTVA");
  const linesTbody = document.getElementById("linesTbody");
  const totalsBox = document.getElementById("totalsBox");

  const openInvoiceBtn = document.getElementById("openInvoiceBtn");
  const printBtn = document.getElementById("printBtn");

  let currentUser = null;
  let eventId = (new URLSearchParams(location.search).get("eventId") || "").trim();
  let eventData = null;
  let profileData = null;
  let ownerUser = null;

  function showAlert(msg, ok=false){
    alertBox.style.display = "block";
    alertBox.classList.toggle("ok", !!ok);
    alertBox.textContent = msg;
  }
  function hideAlert(){
    alertBox.style.display = "none";
    alertBox.classList.remove("ok");
    alertBox.textContent = "";
  }
  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function fmtMoneySigned(v){
    const n = Number(v);
    if(!Number.isFinite(n)) return "—";
    const s = n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    return (n > 0 ? "+" : "") + s; // si tu veux strictement négatif, tu ne verras jamais '+'
  }

  function fmtMoneyNeg(v){
    const n = Number(v);
    if(!Number.isFinite(n)) return "—";
    const abs = Math.abs(n);
    const s = abs.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    return "-" + s;
  }

  function fmtDateFR(x){
    if(!x) return "—";
    try{
      if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
      if(x instanceof Date) return isNaN(x.getTime()) ? "—" : x.toLocaleDateString("fr-FR");
      const s = String(x).trim();
      if(!s) return "—";
      if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m) return `${m[3]}/${m[2]}/${m[1]}`;
      const d = new Date(s);
      if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
      return "—";
    }catch{
      return "—";
    }
  }

  function creditStatusLabel(s){
    const x = String(s||"").toUpperCase().trim();
    if(!x) return "—";
    if(x === "DRAFT") return "BROUILLON";
    if(x === "SENT") return "ENVOYÉ";
    if(x === "APPLIED") return "APPLIQUÉ";
    return x;
  }

  async function loadProfile(uid){
    const snap = await getDoc(doc(db, "users", uid));
    profileData = snap.exists() ? (snap.data() || {}) : {};
  }

  function applyLogoFromProfile(profile){
    const bp = (profile?.businessProfile || {});
    const url = String(bp.logoUrl || "").trim();

    if(url){
      logoImg.src = url; logoImg.style.display = "block"; logoFallback.style.display = "none";
      bizLogoImg.src = url; bizLogoImg.style.display = "block"; bizLogoFallback.style.display = "none";
    }else{
      logoImg.style.display = "none"; logoFallback.style.display = "block";
      bizLogoImg.style.display = "none"; bizLogoFallback.style.display = "block";
    }
  }

  function renderBusinessHeader(){
    const bp = (profileData?.businessProfile || {});
    const cName = String(bp.companyName || "Conciergerie").trim();

    const street = String(bp.address?.street || "").trim();
    const zip = String(bp.address?.zip || "").trim();
    const city = String(bp.address?.city || "").trim();

    const siret = String(bp.registration?.siret || "").trim();
    const ape = String(bp.registration?.ape || "").trim();

    const mail = String(bp.billingEmail || profileData?.email || "").trim();
    const phone = String(bp.phone || "").trim();

    appTitle.textContent = cName || "Conciergerie";
    bizNameEl.textContent = cName || "—";

    const lines = [];
    if(street) lines.push(esc(street));
    if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));

    const legal = [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • ");
    if(legal) lines.push(`<span class="mut">${esc(legal)}</span>`);

    const contact = [mail ? mail : "", phone ? phone : ""].filter(Boolean).join(" • ");
    if(contact) lines.push(`<span class="mut">${esc(contact)}</span>`);

    bizLinesEl.innerHTML = lines.length ? lines.join("<br>") : "—";
    applyLogoFromProfile(profileData);
  }

  function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

  async function lookupOwnerByEmailInOwners(emailLower){
    if(!emailLower) return null;
    const qO = query(
      collection(db,"owners"),
      where("conciergerieUid", "==", String(currentUser.uid)),
      where("email", "==", emailLower),
      limit(5)
    );
    const snap = await getDocs(qO);
    if(snap.empty) return null;
    const doc0 = snap.docs[0];
    const o = doc0.data() || {};
    return {
      docId: doc0.id,
      email: normalizeEmail(o.email || emailLower),
      fullname: (o.fullname || o.displayName || "").trim(),
      address1: (o.address1 || o.address || "").toString().trim(),
      address2: (o.address2 || "").toString().trim(),
      zip: (o.zip || "").toString().trim(),
      city: (o.city || "").toString().trim(),
      phone: (o.phone || "").toString().trim(),
    };
  }

  async function loadOwner(){
    ownerUser = null;
    const d = eventData || {};
    const ownerEmail = normalizeEmail(d.ownerEmail || "");
    const ownerDocId = String(d.ownerUid || "").trim() || String(d.ownerDocId || "").trim();

    if(ownerDocId){
      try{
        const snap = await getDoc(doc(db,"owners", ownerDocId));
        if(snap.exists()){
          const o = snap.data() || {};
          if(String(o.conciergerieUid||"") === String(currentUser.uid)){
            ownerUser = {
              docId: snap.id,
              email: normalizeEmail(o.email || ownerEmail),
              fullname: (o.fullname || o.displayName || "").trim(),
              address1: (o.address1 || o.address || "").toString().trim(),
              address2: (o.address2 || "").toString().trim(),
              zip: (o.zip || "").toString().trim(),
              city: (o.city || "").toString().trim(),
              phone: (o.phone || "").toString().trim(),
            };
            return;
          }
        }
      }catch(e){
        console.warn("load owner by docId failed:", e?.message || e);
      }
    }

    if(ownerEmail){
      try{
        ownerUser = await lookupOwnerByEmailInOwners(ownerEmail);
      }catch(e){
        console.warn("lookup owner by email failed:", e?.message || e);
        ownerUser = null;
      }
    }
  }

  function getOwnerSnapshot(){
    const d = eventData || {};

    const snapName  = (d.ownerName || "").trim();
    const snapA1 = (d.ownerAddress1 || "").trim();
    const snapA2 = (d.ownerAddress2 || "").trim();
    const snapZip = (d.ownerZip || "").trim();
    const snapCity = (d.ownerCity || "").trim();

    const o = ownerUser || {};
    const oName  = (o.fullname || "").trim();
    const oA1 = (o.address1 || "").trim();
    const oA2 = (o.address2 || "").trim();
    const oZip = (o.zip || "").trim();
    const oCity = (o.city || "").trim();

    const name = oName || snapName || "—";
    const address1 = oA1 || snapA1 || "";
    const address2 = oA2 || snapA2 || "";
    const zip = oZip || snapZip || "";
    const city = oCity || snapCity || "";

    return { name, address1, address2, zip, city };
  }

  function renderClientHeader(){
    const c = getOwnerSnapshot();
    clientNameEl.textContent = (c.name || "—").trim();

    const lines = [];
    if(c.address1) lines.push(esc(c.address1));
    if(c.address2) lines.push(esc(c.address2));
    if(c.zip || c.city) lines.push(esc([c.zip, c.city].filter(Boolean).join(" ")));

    clientLinesEl.innerHTML = lines.length ? lines.join("<br>") : `<span class="mut">Adresse manquante</span>`;
  }

  function computeTotals(lines, tvaEnabled, tvaRate){
    let ht = 0;
    for(const l of (Array.isArray(lines) ? lines : [])){
      const qty = Number(l?.qty)||0;
      const up  = Number(l?.unitPrice)||0;
      ht += qty * up;
    }
    const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
    const ttc = ht + tva;
    return { ht, tva, ttc };
  }

  function renderLinesAndTotalsNegative(){
    const d = eventData || {};
    const bp = (profileData?.businessProfile || {});

    const tvaEnabled = !!bp.vat?.enabled;
    const tvaRate = Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0;

    thTVA.style.display = tvaEnabled ? "" : "none";
    linesTbody.innerHTML = "";

    const lines = Array.isArray(d.lines) ? d.lines : [];
    for(const l of lines){
      const label = l?.label || "Ligne";
      const qty = Number(l?.qty)||0;
      const unit = l?.unit || "unité";
      const up = Number(l?.unitPrice)||0;

      const lineHT = qty * up;
      const lineTVA = tvaEnabled ? (lineHT * tvaRate) : 0;
      const lineTotal = lineHT + lineTVA;

      // on affiche en NEGATIF
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="designation">${esc(label)}</td>
        <td class="num">${esc(qty)}</td>
        <td>${esc(unit)}</td>
        <td class="num">${esc(fmtMoneyNeg(up))}</td>
        <td class="num" style="${tvaEnabled ? "" : "display:none;"}">${tvaEnabled ? esc(fmtMoneyNeg(lineTVA)) : ""}</td>
        <td class="num">${esc(fmtMoneyNeg(lineTotal))}</td>
      `;
      linesTbody.appendChild(tr);
    }

    const totals = computeTotals(lines, tvaEnabled, tvaRate);

    const html = [];
    if(tvaEnabled){
      html.push(`<div class="r"><span>Total HT</span><span>${esc(fmtMoneyNeg(totals.ht))}</span></div>`);
      html.push(`<div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>${esc(fmtMoneyNeg(totals.tva))}</span></div>`);
      html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoneyNeg(totals.ttc))}</span></div>`);
    }else{
      html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoneyNeg(totals.ttc))}</span></div>`);
      const ex = String(bp?.tvaExemptionText || "").trim();
      if(ex) html.push(`<div class="mutedLine">${esc(ex)}</div>`);
    }
    totalsBox.innerHTML = html.join("");
  }

  function pickCreditNumber(d){
    return String(d?.creditNumber || d?.avoirNumber || d?.creditNoteNumber || "").trim();
  }
  function pickCreditStatus(d){
    return String(d?.creditStatus || d?.avoirStatus || d?.creditNoteStatus || "").trim();
  }
  function pickCreditDate(d){
    return (
      fmtDateFR(d?.creditCreatedAt) ||
      fmtDateFR(d?.avoirCreatedAt) ||
      fmtDateFR(d?.invoiceCreatedAt) ||
      fmtDateFR(d?.createdAt) ||
      "—"
    );
  }

  async function loadEvent(){
    if(!eventId) throw new Error("eventId manquant dans l’URL. Exemple : avoir.html?eventId=XXXX");

    const ref = doc(db, "events", eventId);
    const snap = await getDoc(ref);
    if(!snap.exists()) throw new Error("Event introuvable.");
    eventData = { id: snap.id, ...(snap.data()||{}) };

    if(eventData.conciergerieUid && currentUser?.uid && eventData.conciergerieUid !== currentUser.uid){
      throw new Error("Accès refusé (event d’une autre conciergerie).");
    }

    await loadProfile(currentUser.uid);
    await loadOwner();

    const creditNo = pickCreditNumber(eventData) || "—";
    const creditStatus = pickCreditStatus(eventData);
    const creditDate = pickCreditDate(eventData);

    statusBadge.textContent = creditStatusLabel(creditStatus);
    docBannerInner.textContent = `AVOIR N° ${creditNo} • ${creditDate}`;

    renderBusinessHeader();
    renderClientHeader();
    renderLinesAndTotalsNegative();

    // bouton facture si invoiceNumber existe
    const invNo = String(eventData.invoiceNumber || "").trim();
    if(invNo){
      openInvoiceBtn.style.display = "inline-flex";
      openInvoiceBtn.href = `facture.html?eventId=${encodeURIComponent(eventData.id)}`;
      openInvoiceBtn.textContent = `Voir la facture (${invNo})`;
    }else{
      openInvoiceBtn.style.display = "none";
    }
  }

  printBtn.addEventListener("click", ()=>{
    window.print();
  });

  onAuthStateChanged(auth, async (user)=>{
    if(!user){ location.href = "login.html?role=conciergerie"; return; }
    currentUser = user;
    hideAlert();
    try{
      await loadEvent();
    }catch(e){
      console.error(e);
      showAlert("⛔ " + (e?.message || "Erreur chargement avoir"));
    }
  });
</script>

</body>
</html>
