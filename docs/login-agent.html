<!-- docs/login-agent.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Connexion Agent</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:18px; }
    .card{
      width:100%; max-width:520px;
      background:rgba(255,255,255,0.90);
      border:1px solid var(--border);
      border-radius:20px;
      box-shadow:var(--shadow);
      backdrop-filter: blur(10px);
      padding:16px;
    }
    .logo{ display:flex; align-items:center; gap:10px; justify-content:center; margin-bottom:10px; }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff;
      border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:20px; font-weight:900;
      position:relative;
      flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px; right:-5px;
      font-size:12px;
      color:var(--violet);
    }
    h1{ margin:0; font-size:18px; font-weight:900; text-align:center; letter-spacing:-0.2px; }
    .sub{ margin-top:6px; font-size:12px; font-weight:800; color:#444; text-align:center; line-height:1.35; }

    .alert{
      display:none; margin-top:12px; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    label{ display:block; margin:10px 0 6px; font-size:12px; font-weight:900; color:#333; }
    input{
      width:100%; padding:10px 10px; border-radius:12px; border:1px solid #D3C7FF; background:#fff;
      font-size:13px; outline:none;
    }
    input:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; justify-content:flex-end; }
    .btn{
      border:none; border-radius:999px; padding:10px 12px; font-size:13px; font-weight:900; cursor:pointer;
      color:#fff; background:linear-gradient(90deg,var(--violet),var(--violet2));
      box-shadow:0 10px 22px rgba(0,0,0,0.10); white-space:nowrap;
    }
    .btn.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .mini{ margin-top:10px; font-size:11px; font-weight:900; color:var(--muted); line-height:1.35; }
    .mono{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size:12px; }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">✓</div>
        <div>
          <h1>Connexion Agent</h1>
          <div class="sub">Connexion par <b>lien email</b> (sans mot de passe).<br>Utilise <b>le même email</b> que celui indiqué dans le mail de mission.</div>
        </div>
      </div>

      <div class="alert" id="alertBox"></div>

      <label for="email">Email agent</label>
      <input id="email" type="email" placeholder="ex. agent@email.com" autocomplete="email" />

      <div class="row">
        <button class="btn ghost" id="backBtn" type="button">Retour</button>
        <button class="btn" id="sendBtn" type="button">Envoyer le lien</button>
      </div>

      <div class="mini" id="hintLine"></div>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase-init.js";
    import {
      onAuthStateChanged,
      sendSignInLinkToEmail,
      isSignInWithEmailLink,
      signInWithEmailLink
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const alertBox = document.getElementById("alertBox");
    const emailInput = document.getElementById("email");
    const sendBtn = document.getElementById("sendBtn");
    const backBtn = document.getElementById("backBtn");
    const hintLine = document.getElementById("hintLine");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }

    // where to go after login
    const next = qs("next") || "agent.html";

    // actionCodeSettings: MUST match your Firebase Auth settings
    // IMPORTANT: URL must be in Authorized domains AND this exact page must be reachable
    const actionCodeSettings = {
      url: location.origin + location.pathname + "?next=" + encodeURIComponent(next),
      handleCodeInApp: true
    };

    function setHint(text){
      hintLine.innerHTML = text || "";
    }

    // 1) If we arrive from the email link, complete sign-in
    async function completeEmailLinkSignIn(){
      if(!isSignInWithEmailLink(auth, window.location.href)) return false;

      let email = normalizeEmail(window.localStorage.getItem("cm_agent_email") || "");
      if(!email){
        // fallback: ask user (minimal friction)
        email = normalizeEmail(prompt("Confirme ton email agent (celui du mail de mission) :") || "");
      }
      if(!email || !/^\S+@\S+\.\S+$/.test(email)){
        showAlert("Email invalide. Recommence la connexion.", false);
        return true;
      }

      try{
        await signInWithEmailLink(auth, email, window.location.href);
        window.localStorage.removeItem("cm_agent_email");
        showAlert("✅ Connecté. Redirection…", true);

        // remove Firebase email link params by navigating to clean next
        setTimeout(()=>{
          location.href = next;
        }, 300);

      }catch(err){
        console.error(err);
        // The classic annoying one on desktop is "auth/invalid-action-code" or "auth/invalid-credential"
        showAlert("Erreur connexion (email-link) : " + (err?.code || err?.message || "inconnue"), false);
      }
      return true;
    }

    // 2) Send email link
    async function sendLink(){
      hideAlert();
      const email = normalizeEmail(emailInput.value);
      if(!email) return showAlert("Email obligatoire.");
      if(!/^\S+@\S+\.\S+$/.test(email)) return showAlert("Email invalide.");

      sendBtn.disabled = true;
      sendBtn.textContent = "…";
      try{
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        window.localStorage.setItem("cm_agent_email", email);

        showAlert("✅ Lien envoyé. Ouvre ton email et clique le lien.", true);
        setHint(
          `Astuce : ouvre le lien sur <b>le même appareil/navigateur</b> si possible.<br>` +
          `Si ça râle sur PC, fais le login sur tel puis reviens sur PC (session persistée).`
        );
      }catch(err){
        console.error(err);
        showAlert("Erreur envoi lien : " + (err?.code || err?.message || "inconnue"), false);
      }finally{
        sendBtn.disabled = false;
        sendBtn.textContent = "Envoyer le lien";
      }
    }

    backBtn.addEventListener("click", ()=>{
      // if next contains agent.html?token=... keep it
      if(next) location.href = next;
      else history.back();
    });

    sendBtn.addEventListener("click", ()=> sendLink().catch(()=>{}));

    // Auto-complete sign-in when opened from the email link
    completeEmailLinkSignIn().catch(()=>{});

    // If already signed in, go next
    onAuthStateChanged(auth, (user)=>{
      if(user){
        setTimeout(()=> location.href = next, 100);
      }else{
        setHint(`Après connexion, tu reviens sur : <span class="mono">${next}</span>`);
      }
    });
  </script>
</body>
</html>
