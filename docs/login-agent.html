<!-- docs/login-agent.html (optionnel / legacy) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Connexion Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,#F8F4FF 0%, #EDE6FF 80%); color:#111; }
    .page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card{ width:100%; max-width:520px; background:#fff; border-radius:18px; padding:16px; box-shadow:0 14px 36px rgba(0,0,0,0.08); border:1px solid rgba(122,92,255,0.18); }
    h1{ margin:0; font-size:18px; font-weight:900; }
    .sub{ margin-top:6px; font-size:12px; font-weight:800; color:#444; }
    label{ display:block; margin:10px 0 4px; font-size:12px; font-weight:900; }
    input{ width:100%; padding:10px; border-radius:12px; border:1px solid #D3C7FF; outline:none; }
    button{ margin-top:12px; width:100%; padding:12px; border-radius:999px; border:none; cursor:pointer; font-weight:900; color:#fff; background:linear-gradient(90deg,#7A5CFF,#6238FF); }
    .msg{ margin-top:10px; font-size:12px; font-weight:800; color:#444; white-space:pre-wrap; }
  </style>
</head>
<body>
  <div class="page">
    <div class="card">
      <h1>Connexion Agent</h1>
      <div class="sub">Legacy (si tu veux forcer un login email-link). Sinon inutile.</div>

      <label>Email</label>
      <input id="email" type="email" placeholder="agent@email.com" />

      <button id="sendBtn">Envoyer lien de connexion</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>

  <script type="module">
    import { auth } from "./firebase-init.js";
    import { sendSignInLinkToEmail } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    const emailEl = document.getElementById("email");
    const msg = document.getElementById("msg");
    const sendBtn = document.getElementById("sendBtn");

    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
    const next = qs("next") || "agent.html";

    sendBtn.addEventListener("click", async ()=>{
      msg.textContent = "";
      const email = (emailEl.value||"").trim();
      if(!email) return msg.textContent = "Email requis.";

      const actionCodeSettings = {
        url: location.origin + location.pathname.replace("login-agent.html", next),
        handleCodeInApp: true
      };

      try{
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);
        window.localStorage.setItem("cm_agent_emailForSignIn", email);
        msg.textContent = "Lien envoyé. Ouvre tes emails.";
      }catch(e){
        console.error(e);
        msg.textContent = "Erreur : " + (e?.message || "inconnue");
      }
    });
  </script>
</body>
</html>
