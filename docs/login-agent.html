<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Agent (Info)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{margin:0;background:linear-gradient(180deg,#F8F4FF 0%,#EDE6FF 80%);color:#111}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
    .card{max-width:520px;width:100%;background:#fff;border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.10);padding:16px}
    h1{margin:0;font-size:18px;font-weight:800}
    p{margin:10px 0 0;color:#444;font-weight:600;line-height:1.35;font-size:13px}
    .btn{margin-top:12px;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
      border-radius:999px;padding:10px 12px;font-weight:800;font-size:13px;border:2px solid #7A5CFF;color:#7A5CFF;background:#fff}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Accès Agent</h1>
      <p>
        Cette version n’utilise plus de connexion : l’agent ouvre directement le lien reçu (token 24h).
      </p>
      <p>
        Si tu es ici par erreur, retourne au lien que la conciergerie t’a envoyé.
      </p>
      <a class="btn" href="index.html">Retour</a>
    </div>
  </div>
</body>
</html>
