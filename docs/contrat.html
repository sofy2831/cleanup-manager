<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Contrat</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    :root{--violet:#7A5CFF;--violet2:#6238FF;--bg1:#F8F4FF;--bg2:#EDE6FF;--text:#111;--muted:#666;--border:rgba(122,92,255,.18);--shadow:0 14px 36px rgba(0,0,0,.08);--bad:#b3261e;--ok:#1b8f4d;--card:rgba(255,255,255,.9)}
    body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text)}
    .page{min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:14px 12px 88px}
    .topbar{width:100%;max-width:1100px;display:flex;justify-content:space-between;gap:10px;position:sticky;top:0;background:rgba(248,244,255,.85);z-index:10;padding:8px 0;backdrop-filter:blur(6px)}
    .btn,.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 12px;border-radius:999px;background:#fff;border:2px solid var(--violet);color:var(--violet);font-size:12.5px;font-weight:1000;text-decoration:none;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.06)}
    .primary{background:linear-gradient(90deg,var(--violet),var(--violet2));border-color:transparent;color:#fff}
    .danger{color:var(--bad);border-color:rgba(179,38,30,.45)}
    button:disabled{opacity:.6;cursor:not-allowed}
    .logo-title{display:flex;align-items:center;gap:10px;margin-top:8px}
    .logo-icon{width:46px;height:46px;border-radius:50%;background:#fff;border:2px solid var(--violet);display:flex;align-items:center;justify-content:center;color:var(--violet);font-weight:1000}
    h1{margin:0;font-size:22px;font-weight:1000}
    .subtitle{font-size:14px;color:#444;font-weight:850}
    .badge{margin-top:8px;background:#fff;border-radius:999px;padding:4px 10px;font-size:12px;color:#555;font-weight:900;box-shadow:0 3px 10px rgba(0,0,0,.06)}
    .wrap{width:100%;max-width:1100px;margin-top:12px;display:grid;grid-template-columns:1fr;gap:12px}
    @media(min-width:900px){.wrap{grid-template-columns:420px 1fr}}
    .card{background:var(--card);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:14px}
    .card h2{margin:0 0 10px;font-size:16px;font-weight:1000}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    @media(max-width:720px){.grid2{grid-template-columns:1fr}}
    label{display:block;margin:9px 0 4px;font-size:12px;font-weight:1000;color:#333}
    input,select,textarea{width:100%;padding:10px 12px;border-radius:12px;border:1px solid #D3C7FF;font-size:13px;outline:none;background:#fff;font-weight:800;color:#111}
    textarea{resize:vertical;min-height:95px}
    textarea.tall{min-height:125px}
    .alert{display:none;width:100%;max-width:1100px;margin-top:10px;padding:10px 12px;background:#fff;border-radius:14px;border-left:5px solid var(--bad);box-shadow:0 3px 10px rgba(0,0,0,.06);font-size:12px;font-weight:850;white-space:pre-wrap}.alert.ok{border-left-color:var(--ok)}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .mut{color:var(--muted);font-weight:900}
    .previewBox{background:#fff;border:1px solid var(--border);border-radius:16px;padding:14px;font-size:13px;line-height:1.45;font-weight:800;white-space:pre-wrap;min-height:420px}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;gap:6px;justify-content:space-around;padding:9px 10px;background:rgba(255,255,255,.92);border-top:1px solid var(--border);backdrop-filter:blur(10px)}
    .bottom-nav a{flex:1;text-align:center;font-size:10.8px;font-weight:1000;text-decoration:none;color:#666;padding:9px 8px;border-radius:999px;white-space:nowrap}
    @media(min-width:980px){.bottom-nav{position:static;width:100%;max-width:1100px;margin-top:14px;border:1px solid var(--border);border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.08)}.page{padding-bottom:28px}}
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="contrats-liste.html">← Contrats</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon">C</div>
      <h1 id="pageTitle">Contrat</h1>
    </div>
    <div class="subtitle">Création / modification</div>
    <div class="badge" id="companyBadge">—</div>
    <div class="alert" id="alertBox"></div>

    <div class="wrap">
      <section class="card">
        <h2>Informations</h2>

        <label for="ownerSelect">Client / propriétaire</label>
        <select id="ownerSelect"></select>

        <div class="grid2">
          <div>
            <label for="homeSelect">Logement</label>
            <select id="homeSelect"></select>
          </div>
          <div>
            <label for="contractStatus">Statut</label>
            <select id="contractStatus">
              <option value="DRAFT">Brouillon</option>
              <option value="SENT">Envoyé</option>
              <option value="SIGNED">Signé</option>
              <option value="ARCHIVED">Archivé</option>
            </select>
          </div>
        </div>

        <div class="grid2">
          <div>
            <label for="startDate">Date début</label>
            <input id="startDate" type="date">
          </div>
          <div>
            <label for="durationType">Durée</label>
            <select id="durationType">
              <option value="INDEFINITE">Contrat à durée indéterminée</option>
              <option value="FIXED">Contrat à durée déterminée</option>
            </select>
          </div>
        </div>

        <label for="endDate">Date fin</label>
        <input id="endDate" type="date">

        <label for="contractTitle">Titre</label>
        <input id="contractTitle" value="Contrat de prestation de conciergerie">

        <label for="contractObject">Objet</label>
        <textarea id="contractObject">Gestion des prestations de conciergerie, ménage, accueil voyageurs, suivi opérationnel et facturation selon les prestations convenues.</textarea>

        <label for="servicesTerms">Prestations incluses</label>
        <textarea id="servicesTerms" class="tall">Les prestations peuvent inclure, selon les besoins validés par le propriétaire : accueil voyageurs, départ voyageurs, ménage, blanchisserie, gestion des consommables, suivi des interventions, coordination opérationnelle, assistance voyageurs et suivi administratif lié aux prestations réalisées.</textarea>

        <label for="specialTerms">Conditions particulières</label>
        <textarea id="specialTerms">Les prestations sont exécutées selon les demandes validées par le propriétaire. Toute prestation supplémentaire fera l’objet d’une facturation complémentaire.</textarea>

        <label for="pricingTerms">Modalités financières</label>
        <textarea id="pricingTerms" class="tall">Les modalités financières sont librement convenues entre la conciergerie et le propriétaire. Elles peuvent prendre la forme d’un forfait, d’une facturation à la prestation, d’une commission ou de toute autre modalité acceptée entre les parties. Les montants applicables sont ceux validés par écrit, devis, facture ou accord contractuel entre les parties.</textarea>

        <label for="insuranceTerms">Assurance / responsabilité</label>
        <textarea id="insuranceTerms" class="tall">Le propriétaire déclare disposer d’une assurance adaptée au logement et à son activité de location. La conciergerie intervient uniquement comme prestataire de services et ne se substitue pas au propriétaire dans ses obligations d’assurance, de conformité, de sécurité ou de déclaration.</textarea>

        <label for="keysTerms">Clés / accès au logement</label>
        <textarea id="keysTerms">Le propriétaire remet à la conciergerie les moyens d’accès nécessaires à l’exécution des prestations. La conciergerie s’engage à conserver ces moyens d’accès avec diligence et à les restituer à la fin du contrat.</textarea>

        <label for="inventoryTerms">Inventaire / état du logement</label>
        <textarea id="inventoryTerms" class="tall">Le propriétaire reste responsable de l’état général du logement, de son mobilier, de ses équipements et de leur conformité. Un inventaire ou état descriptif peut être établi séparément et annexé au présent contrat.</textarea>

        <label for="terminationTerms">Résiliation</label>
        <textarea id="terminationTerms">Chaque partie peut mettre fin au contrat avec un préavis de 30 jours, sauf faute grave ou accord différent entre les parties.</textarea>

        <div class="actions">
          <button class="btn primary" id="saveBtn" type="button">Enregistrer</button>
          <button class="btn" id="previewBtn" type="button" disabled>Aperçu</button>
        </div>
      </section>

      <section class="card">
        <h2>Aperçu rapide</h2>
        <div class="previewBox" id="previewBox">—</div>
      </section>
    </div>

    <nav class="bottom-nav">
      <a href="planning.html">Planning</a>
      <a href="prestations.html">Production</a>
      <a href="logements.html">Logements</a>
      <a href="import-ical.html">iCal</a>
      <a href="messagerie.html">Messages</a>
    </nav>
  </div>

  <script type="module">
    import { auth, db } from './firebase-init.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js';
    import {
      collection, query, where, limit, getDocs, doc, getDoc,
      addDoc, setDoc, serverTimestamp, runTransaction
    } from 'https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js';

    const $ = id => document.getElementById(id);

    let currentUser = null;
    let profile = {};
    let currentDocId = '';
    let owners = [];
    let homes = [];

    const params = new URLSearchParams(location.search);
    currentDocId = params.get('docId') || '';

    function show(msg, ok=false){
      $('alertBox').style.display = 'block';
      $('alertBox').classList.toggle('ok', !!ok);
      $('alertBox').textContent = msg;
    }

    function hide(){
      $('alertBox').style.display = 'none';
      $('alertBox').classList.remove('ok');
      $('alertBox').textContent = '';
    }

    function val(id){
      return String($(id)?.value || '').trim();
    }

    function today(){
      return new Date().toISOString().slice(0,10);
    }

    function escOption(s){
      return String(s || '')
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'",'&#039;');
    }

    function extractAddress(obj){
      const o = obj || {};
      const a = (o.address && typeof o.address === 'object') ? o.address : {};
      const street = String(o.address1 || o.street || o.line1 || a.street || a.line1 || '').trim();
      const zip = String(o.zip || o.postalCode || o.cp || a.zip || a.postalCode || '').trim();
      const city = String(o.city || o.town || a.city || a.town || '').trim();
      const full = String(o.address || o.homeAddress || '').trim();
      return { street: street || full, zip, city };
    }

    function addressLine(addr){
      const a = addr || {};
      return [a.street, [a.zip, a.city].filter(Boolean).join(' ')].filter(Boolean).join(' • ');
    }

    async function nextContractNumber(uid){
      const year = new Date().getFullYear();
      const ref = doc(db, 'counters', `${uid}_${year}`);

      const next = await runTransaction(db, async tx => {
        const snap = await tx.get(ref);
        const data = snap.exists() ? (snap.data() || {}) : {};
        const n = (Number(data.contractSeq) || 0) + 1;
        tx.set(ref, { ...data, contractSeq:n }, { merge:true });
        return n;
      });

      return `CT${year}-${String(next).padStart(4,'0')}`;
    }

    async function loadProfile(uid){
      const snap = await getDoc(doc(db, 'users', uid));
      profile = snap.exists() ? (snap.data() || {}) : {};
      const bp = profile.businessProfile || {};
      const companyName = String(bp.companyName || 'Conciergerie').trim() || 'Conciergerie';
      $('companyBadge').textContent = companyName;
      document.title = `${companyName} — Contrat`;
    }

    async function loadOwners(uid){
      const snap = await getDocs(query(
        collection(db, 'owners'),
        where('conciergerieUid', '==', uid),
        limit(500)
      ));

      owners = snap.docs.map(s => ({ id:s.id, ...(s.data() || {}) }));

      $('ownerSelect').innerHTML = '<option value="">Choisir</option>' + owners.map(o => {
        const label = o.fullname || o.displayName || o.name || o.email || 'Propriétaire';
        return `<option value="${escOption(o.id)}">${escOption(label)}</option>`;
      }).join('');
    }

    async function loadHomes(uid){
      const snap = await getDocs(query(
        collection(db, 'homes'),
        where('conciergerieUid', '==', uid),
        limit(500)
      ));

      homes = snap.docs.map(s => ({ id:s.id, ...(s.data() || {}) }));
      refreshHomeSelect();
    }

    function refreshHomeSelect(){
      const ownerDocId = $('ownerSelect').value;

      const rows = homes.filter(h => {
        if(!ownerDocId) return true;
        return String(h.ownerDocId || h.clientOwnerDocId || '').trim() === ownerDocId;
      });

      $('homeSelect').innerHTML = '<option value="">Aucun / général</option>' + rows.map(h => {
        const label = h.name || h.homeName || h.address || h.homeAddress || 'Logement';
        return `<option value="${escOption(h.id)}">${escOption(label)}</option>`;
      }).join('');
    }

    function selectedOwner(){
      return owners.find(o => o.id === $('ownerSelect').value) || {};
    }

    function selectedHome(){
      return homes.find(h => h.id === $('homeSelect').value) || {};
    }

    function buildBusinessSnapshot(){
      const bp = profile.businessProfile || {};
      return {
        companyName: String(bp.companyName || 'Conciergerie').trim(),
        billingEmail: String(bp.billingEmail || profile.email || '').trim(),
        phone: String(bp.phone || bp.contact?.phone || '').trim(),
        address: bp.address || {},
        registration: bp.registration || {},
        logoUrl: String(bp.logoUrl || '').trim()
      };
    }

    function buildClientSnapshot(owner){
      const o = owner || {};
      const addr = extractAddress(o);
      return {
        ownerDocId: String(o.id || '').trim(),
        ownerUid: String(o.ownerUid || o.userUid || '').trim(),
        name: String(o.fullname || o.displayName || o.name || '').trim(),
        email: String(o.email || '').trim(),
        phone: String(o.phone || o.tel || o.mobile || '').trim(),
        address1: addr.street,
        zip: addr.zip,
        city: addr.city,
        country: String(o.country || 'FR').trim() || 'FR'
      };
    }

    function buildPayload(number=''){
      const owner = selectedOwner();
      const home = selectedHome();
      const homeAddr = extractAddress(home);
      const clientSnapshot = buildClientSnapshot(owner);

      return {
        conciergerieUid: currentUser.uid,
        type: 'CONTRACT',
        listable: true,

        contractNumber: number,
        contractStatus: val('contractStatus') || 'DRAFT',
        title: val('contractTitle'),
        durationType: val('durationType') || 'INDEFINITE',
        startDate: val('startDate'),
        endDate: val('durationType') === 'FIXED' ? val('endDate') : '',

        contractObject: val('contractObject'),
        servicesTerms: val('servicesTerms'),
        specialTerms: val('specialTerms'),
        pricingTerms: val('pricingTerms'),
        insuranceTerms: val('insuranceTerms'),
        keysTerms: val('keysTerms'),
        inventoryTerms: val('inventoryTerms'),
        terminationTerms: val('terminationTerms'),

        ownerDocId: clientSnapshot.ownerDocId,
        ownerUid: clientSnapshot.ownerUid,
        clientName: clientSnapshot.name,
        clientEmail: clientSnapshot.email,
        clientPhone: clientSnapshot.phone,
        clientAddress1: clientSnapshot.address1,
        clientZip: clientSnapshot.zip,
        clientCity: clientSnapshot.city,
        clientCountry: clientSnapshot.country,
        clientSnapshot,

        homeId: String(home.id || '').trim(),
        homeName: String(home.name || home.homeName || '').trim(),
        homeAddress: homeAddr.street,
        homeZip: homeAddr.zip,
        homeCity: homeAddr.city,

        businessSnapshot: buildBusinessSnapshot(),
        updatedAt: serverTimestamp()
      };
    }

    function renderPreview(){
      const owner = selectedOwner();
      const home = selectedHome();
      const bp = profile.businessProfile || {};
      const businessAddress = addressLine(bp.address || {});
      const ownerAddress = addressLine(extractAddress(owner));
      const homeAddress = addressLine(extractAddress(home));

      const companyName = String(bp.companyName || '—').trim() || '—';
      const ownerName = owner.fullname || owner.displayName || owner.name || owner.email || '—';
      const homeLabel = home.name || home.homeName || home.address || home.homeAddress || 'Contrat général';

      const durationLabel = val('durationType') === 'FIXED'
        ? `${val('startDate') || '—'} → ${val('endDate') || '—'}`
        : `${val('startDate') || '—'} → durée indéterminée`;

      $('previewBox').textContent =
`${val('contractTitle') || 'Contrat'}

ENTRE LES SOUSSIGNÉS

Conciergerie :
${companyName}${businessAddress ? '\n' + businessAddress : ''}
${bp.registration?.siret ? 'SIRET : ' + bp.registration.siret : ''}

Propriétaire :
${ownerName}${ownerAddress ? '\n' + ownerAddress : ''}
${owner.email ? 'Email : ' + owner.email : ''}

Logement concerné :
${homeLabel}${homeAddress ? '\n' + homeAddress : ''}

Durée :
${durationLabel}

Objet :
${val('contractObject')}

Prestations incluses :
${val('servicesTerms')}

Conditions particulières :
${val('specialTerms')}

Modalités financières :
${val('pricingTerms')}

Assurance / responsabilité :
${val('insuranceTerms')}

Clés / accès :
${val('keysTerms')}

Inventaire / état du logement :
${val('inventoryTerms')}

Résiliation :
${val('terminationTerms')}

Signatures :

Fait en deux exemplaires.

Signature de la conciergerie :


Signature du propriétaire :`;
    }

    async function loadContract(id){
      const snap = await getDoc(doc(db, 'contracts', id));
      if(!snap.exists()) throw new Error('Contrat introuvable.');

      const d = snap.data() || {};

      if(String(d.conciergerieUid || '') !== String(currentUser.uid)){
        throw new Error('Accès refusé à ce contrat.');
      }

      $('ownerSelect').value = d.ownerDocId || d.clientSnapshot?.ownerDocId || '';
      refreshHomeSelect();
      $('homeSelect').value = d.homeId || '';

      $('contractStatus').value = d.contractStatus || 'DRAFT';
      $('durationType').value = d.durationType || 'INDEFINITE';
      $('startDate').value = d.startDate || '';
      $('endDate').value = d.endDate || '';
      $('contractTitle').value = d.title || 'Contrat de prestation de conciergerie';
      $('contractObject').value = d.contractObject || '';
      $('servicesTerms').value = d.servicesTerms || '';
      $('specialTerms').value = d.specialTerms || '';
      $('pricingTerms').value = d.pricingTerms || '';
      $('insuranceTerms').value = d.insuranceTerms || '';
      $('keysTerms').value = d.keysTerms || '';
      $('inventoryTerms').value = d.inventoryTerms || '';
      $('terminationTerms').value = d.terminationTerms || '';

      $('previewBtn').disabled = false;
      renderPreview();
    }

    async function save(){
      hide();

      if(!currentUser?.uid) return show('⛔ Session invalide.');
      if(!val('ownerSelect')) return show('⛔ Choisis un propriétaire.');
      if(!val('contractTitle')) return show('⛔ Titre du contrat manquant.');
      if(!val('startDate')) return show('⛔ Date de début manquante.');
      if(val('durationType') === 'FIXED' && !val('endDate')) return show('⛔ Date de fin obligatoire pour un contrat à durée déterminée.');

      $('saveBtn').disabled = true;

      try{
        let number = '';

        if(currentDocId){
          const oldSnap = await getDoc(doc(db, 'contracts', currentDocId));
          number = oldSnap.exists() ? String(oldSnap.data().contractNumber || '') : '';
        }

        if(!number) number = await nextContractNumber(currentUser.uid);

        const payload = buildPayload(number);

        if(currentDocId){
          await setDoc(doc(db, 'contracts', currentDocId), payload, { merge:true });
        }else{
          const created = await addDoc(collection(db, 'contracts'), {
            ...payload,
            createdAt: serverTimestamp(),
            createdBy: currentUser.uid
          });
          currentDocId = created.id;
          $('previewBtn').disabled = false;
        }

        show('✅ Contrat enregistré.', true);
        renderPreview();
      }catch(e){
        console.error(e);
        show('⛔ ' + (e?.message || 'Erreur enregistrement'));
      }finally{
        $('saveBtn').disabled = false;
      }
    }

    $('ownerSelect').addEventListener('change', () => {
      refreshHomeSelect();
      renderPreview();
    });

    [
      'homeSelect','contractStatus','startDate','endDate','durationType',
      'contractTitle','contractObject','servicesTerms','specialTerms',
      'pricingTerms','insuranceTerms','keysTerms','inventoryTerms','terminationTerms'
    ].forEach(id => $(id).addEventListener('input', renderPreview));

    $('saveBtn').addEventListener('click', save);

    $('previewBtn').addEventListener('click', () => {
      if(currentDocId){
        location.href = `contrat-apercu.html?docId=${encodeURIComponent(currentDocId)}`;
      }
    });

    onAuthStateChanged(auth, async user => {
      if(!user){
        location.href = 'login.html?role=conciergerie';
        return;
      }

      currentUser = user;

      try{
        await loadProfile(user.uid);
        await loadOwners(user.uid);
        await loadHomes(user.uid);

        if(!val('startDate')) $('startDate').value = today();

        if(currentDocId){
          await loadContract(currentDocId);
        }else{
          renderPreview();
        }
      }catch(e){
        console.error(e);
        show('⛔ ' + (e?.message || 'Erreur chargement'));
      }
    });
  </script>
</body>
</html>
