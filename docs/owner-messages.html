<!-- docs/owner-messages.html (FINAL — lecture messages propriétaire + téléchargement pièces jointes PDF depuis Storage) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Messages propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 110px; }
    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:20; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; gap:10px; margin-top:6px; }

    .logo{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:8px; margin-bottom:4px; text-align:center;
    }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:13px; color:#444; text-align:center; font-weight:800; }

    .alert{
      display:none; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:900; color:#444; white-space:pre-wrap;
      width:100%;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
    }
    .cardTitle{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      font-size:14px; font-weight:900; color:#111;
    }
    .tiny{ font-size:12px; color:var(--muted); font-weight:900; }

    .chat{
      display:flex; flex-direction:column; gap:10px;
      margin-top:10px;
    }
    .msg{
      max-width:92%;
      padding:10px 12px;
      border-radius:16px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.05);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .msg.me{ margin-left:auto; border-color: rgba(122,92,255,0.22); }
    .msg .meta{ font-size:11px; color:#666; font-weight:900; margin-bottom:6px; }
    .msg .text{ font-size:13px; font-weight:850; white-space:pre-wrap; }

    .attBox{
      margin-top:8px;
      display:flex; flex-direction:column; gap:8px;
    }
    .att{
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      padding:10px; border-radius:14px; background:rgba(122,92,255,0.10);
      border:1px solid rgba(122,92,255,0.18);
    }
    .att .l{
      min-width:0;
      display:flex; flex-direction:column;
      gap:2px;
    }
    .att .l b{ font-size:12px; font-weight:1000; color:#111; }
    .att .l span{ font-size:11px; font-weight:900; color:#555; }

    .btnMini{
      border:none; border-radius:999px;
      padding:9px 10px; font-size:12px; font-weight:900;
      cursor:pointer; white-space:nowrap;
      background:linear-gradient(90deg,var(--violet),var(--violet2)); color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
      text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    }

    .composer{
      margin-top:10px;
      display:flex; gap:8px; align-items:flex-end;
    }
    textarea{
      flex:1;
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid #D3C7FF;
      font-size:14px;
      outline:none;
      background:#fff;
      font-weight:800;
      resize:vertical;
      min-height:44px;
      max-height:160px;
    }
    textarea:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .bottom-nav{
      position: fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="owner-dashboard.html">← Dashboard</a>
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>

    <div class="wrap">
      <div class="logo">
        <div class="logo-icon">✓</div>
        <div>
          <h1>CleanUp Manager</h1>
          <div class="subtitle">Messages</div>
        </div>
      </div>

      <div class="alert" id="alertBox"></div>

      <section class="card">
        <div class="cardTitle">
          <span>Conversation avec la conciergerie</span>
          <span class="tiny" id="threadHint">—</span>
        </div>

        <div class="chat" id="chatBox"></div>

        <div class="composer">
          <textarea id="msgInput" placeholder="Écrire un message…"></textarea>
          <button class="btnMini" id="sendBtn" type="button">Envoyer</button>
        </div>

        <div class="tiny" style="margin-top:10px;">
          Les factures arrivent ici en PDF. Tu peux les télécharger depuis le message.
        </div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation propriétaire">
    <a href="owner-dashboard.html">Dashboard</a>
    <a href="owner-planning.html">Planning</a>
    <a href="owner-homes.html">Logements</a>
    <a class="active" href="owner-messages.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db, storage } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc, addDoc, collection,
      query, orderBy, limit, onSnapshot, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
    import { ref as sRef, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

    const alertBox = document.getElementById("alertBox");
    const chatBox = document.getElementById("chatBox");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const threadHint = document.getElementById("threadHint");
    const logoutBtn = document.getElementById("logoutBtn");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtTs(ts){
      try{
        const d = ts?.toDate ? ts.toDate() : null;
        if(!d) return "";
        return d.toLocaleString("fr-FR");
      }catch(_){ return ""; }
    }

    logoutBtn.onclick = async ()=>{
      await signOut(auth);
      localStorage.removeItem("cm_auth");
      location.href = "login.html?role=proprietaire";
    };

    let currentUser = null;
    let ownerDocId = "";
    let conciergerieUid = "";
    let threadId = "";
    let unsubMessages = null;

    function makeThreadId(conciergerieUid, ownerDocId){
      // stable et lisible
      return `t_${conciergerieUid}_${ownerDocId}`;
    }

    async function ensureThread(){
      const tRef = doc(db, "threads", threadId);
      const snap = await getDoc(tRef);
      if(snap.exists()) return;

      // création thread minimal (si pas déjà créé par conciergerie)
      await setDoc(tRef, {
        conciergerieUid,
        ownerDocId,
        ownerUid: currentUser.uid,
        createdAt: serverTimestamp(),
        lastAt: serverTimestamp(),
        lastText: "",
        unreadForConciergerie: 0,
        unreadForOwner: 0
      }, { merge:true });
    }

    function renderMessage(m){
      const role = String(m.senderRole || "").toUpperCase();
      const isMe = role === "PROPRIETAIRE";

      const div = document.createElement("div");
      div.className = "msg" + (isMe ? " me" : "");
      const meta = `${isMe ? "Moi" : "Conciergerie"} • ${fmtTs(m.createdAt)}`;

      const text = String(m.text || "").trim();
      const atts = Array.isArray(m.attachments) ? m.attachments : [];

      div.innerHTML = `
        <div class="meta">${esc(meta)}</div>
        <div class="text">${esc(text || (atts.length ? "" : "—"))}</div>
        <div class="attBox"></div>
      `;

      const attBox = div.querySelector(".attBox");
      if(atts.length){
        for(const a of atts){
          const kind = String(a?.kind || "").toUpperCase();
          const label = String(a?.label || "Pièce jointe").trim();
          const path  = String(a?.storagePath || "").trim();
          const ct    = String(a?.contentType || "").trim();

          const row = document.createElement("div");
          row.className = "att";
          row.innerHTML = `
            <div class="l">
              <b>${esc(label)}</b>
              <span>${esc(kind || "FILE")}${ct ? " • " + esc(ct) : ""}</span>
            </div>
            <button class="btnMini" type="button">Télécharger</button>
          `;
          row.querySelector("button").onclick = async ()=>{
            if(!path) return showAlert("storagePath manquant sur cette pièce jointe.");
            try{
              const url = await getDownloadURL(sRef(storage, path));
              window.open(url, "_blank");
            }catch(e){
              showAlert("Téléchargement impossible : " + (e?.message || "erreur"));
            }
          };
          attBox.appendChild(row);
        }
      }

      return div;
    }

    function subscribeMessages(){
      if(unsubMessages) unsubMessages();
      chatBox.innerHTML = "";

      const q = query(
        collection(db, "threads", threadId, "messages"),
        orderBy("createdAt","asc"),
        limit(300)
      );

      unsubMessages = onSnapshot(q, (snap)=>{
        chatBox.innerHTML = "";
        snap.forEach(d=>{
          const m = d.data() || {};
          chatBox.appendChild(renderMessage(m));
        });
        // scroll bottom
        chatBox.scrollTop = chatBox.scrollHeight + 9999;
      }, (err)=>{
        showAlert("Erreur messages : " + (err?.message || "inconnue"));
      });
    }

    sendBtn.onclick = async ()=>{
      hideAlert();
      const text = String(msgInput.value || "").trim();
      if(!text) return;

      sendBtn.disabled = true;
      try{
        await ensureThread();

        // IMPORTANT : senderUid = owner uid, senderRole = PROPRIETAIRE
        await addDoc(collection(db,"threads", threadId, "messages"), {
          text,
          createdAt: serverTimestamp(),
          senderRole: "PROPRIETAIRE",
          senderUid: currentUser.uid,
          attachments: []
        });

        // mise à jour thread (lastAt/lastText + unread)
        await setDoc(doc(db,"threads", threadId), {
          lastAt: serverTimestamp(),
          lastText: text,
          unreadForConciergerie: 1
        }, { merge:true });

        msgInput.value = "";
      }catch(e){
        showAlert("Envoi impossible : " + (e?.message || "erreur"));
      }finally{
        sendBtn.disabled = false;
      }
    };

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=proprietaire"; return; }
      currentUser = user;

      try{
        const us = await getDoc(doc(db,"users", user.uid));
        const ud = us.exists() ? (us.data()||{}) : {};
        ownerDocId = String(ud.ownerDocId || "").trim();
        conciergerieUid = String(ud.conciergerieUid || "").trim();

        if(!ownerDocId || !conciergerieUid){
          showAlert("Profil incomplet : ownerDocId ou conciergerieUid manquant dans users/{uid}.");
          return;
        }

        threadId = makeThreadId(conciergerieUid, ownerDocId);
        threadHint.textContent = `thread: ${threadId}`;

        await ensureThread();
        subscribeMessages();

      }catch(e){
        showAlert("Erreur chargement : " + (e?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
