<!-- docs/owner-messages.html (FINAL — clean UX, no tech noise, firestore safe) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Messages</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border:rgba(122,92,255,.18);
      --shadow:0 14px 36px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text)}

    .page{
      min-height:100vh;
      padding:16px 16px 120px;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    .topbar{
      width:100%;
      max-width:980px;
      display:flex;
      justify-content:flex-start;
      padding:8px 0;
      position:sticky;
      top:0;
      background:rgba(248,244,255,.9);
      backdrop-filter:blur(6px);
      z-index:20;
    }

    .pill{
      padding:8px 14px;
      border-radius:999px;
      border:2px solid var(--violet);
      background:#fff;
      color:var(--violet);
      font-weight:900;
      font-size:13px;
      text-decoration:none;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }

    .title{
      margin-top:10px;
      text-align:center;
    }
    h1{margin:0;font-size:22px;font-weight:900}
    .subtitle{font-size:13px;color:#444;font-weight:800;margin-top:4px}

    .wrap{
      width:100%;
      max-width:980px;
      margin-top:16px;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .card{
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
    }

    .cardTitle{
      font-size:14px;
      font-weight:1000;
      margin-bottom:8px;
    }

    textarea{
      width:100%;
      min-height:90px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #d3c7ff;
      font-size:14px;
      font-weight:800;
      resize:vertical;
    }

    .btn{
      margin-top:10px;
      padding:10px 14px;
      border-radius:999px;
      border:2px solid var(--violet);
      background:#fff;
      color:var(--violet);
      font-weight:1000;
      cursor:pointer;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border:none;
      box-shadow:0 10px 22px rgba(0,0,0,.1);
    }
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .alert{
      display:none;
      margin-top:8px;
      padding:10px 12px;
      border-radius:12px;
      font-size:12px;
      font-weight:900;
      background:#fff;
      border-left:5px solid #b3261e;
    }
    .alert.ok{border-left-color:#1b8f4d}

    .list{display:flex;flex-direction:column;gap:10px;margin-top:10px}

    .item{
      background:#fff;
      border-radius:14px;
      padding:10px 12px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .meta{
      font-size:11px;
      font-weight:1000;
      color:#666;
      margin-bottom:6px;
    }
    .msg{
      font-size:13px;
      font-weight:800;
      white-space:pre-wrap;
      line-height:1.35;
    }

      /* Bottom nav (4 onglets) */
    .bottom-nav{
      position:fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
  </style>
</head>

<body>
<div class="page">

  <div class="topbar">
    <a class="pill" href="owner-dashboard.html">← Dashboard</a>
  </div>

  <div class="title">
    <h1>Messages</h1>
    <div class="subtitle">Échanges avec la conciergerie</div>
  </div>

  <div class="wrap">

    <section class="card">
      <div class="cardTitle">Nouveau message</div>
      <div class="alert" id="alertMsg"></div>
      <form id="msgForm">
        <textarea id="msgText" placeholder="Écris ton message…" required></textarea>
        <button class="btn primary" id="sendBtn" type="submit">Envoyer</button>
      </form>
    </section>

    <section class="card">
      <div class="cardTitle">Historique</div>
      <div class="alert" id="alertList"></div>
      <div id="list" class="list"></div>
    </section>

  </div>
</div>

<nav class="bottom-nav">
  <a  href="owner-dashboard.html">Dashboard</a>
  <a href="owner-planning.html">Planning</a>
  <a href="owner-homes.html">Logements</a>
  <a class="active"href="owner-messages.html">Messages</a>
</nav>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  collection, addDoc, serverTimestamp,
  query, where, orderBy, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const msgForm = document.getElementById("msgForm");
const msgText = document.getElementById("msgText");
const sendBtn = document.getElementById("sendBtn");
const listEl = document.getElementById("list");
const alertMsg = document.getElementById("alertMsg");
const alertList = document.getElementById("alertList");
const dotMsg = document.getElementById("dotMsg");

function showAlert(el,msg,ok=false){
  el.style.display="block";
  el.classList.toggle("ok",ok);
  el.textContent=msg;
}
function hideAlert(el){
  el.style.display="none";
  el.textContent="";
}
function fmt(ts){
  const d = ts?.toDate ? ts.toDate() : new Date();
  return d.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
}
function resetUnread(){
  localStorage.setItem("cm_owner_unread_messages","0");
  dotMsg.style.display="none";
}

let currentUser=null;

msgForm.addEventListener("submit",async e=>{
  e.preventDefault();
  hideAlert(alertMsg);
  const text = msgText.value.trim();
  if(!text) return;
  sendBtn.disabled=true;
  try{
    await addDoc(collection(db,"requests"),{
      ownerUid:currentUser.uid,
      ownerEmail:currentUser.email||"",
      type:"message",
      message:text,
      createdAt:serverTimestamp()
    });
    msgText.value="";
    showAlert(alertMsg,"Message envoyé.",true);
    resetUnread();
  }catch(err){
    showAlert(alertMsg,"Erreur envoi.",false);
  }finally{
    sendBtn.disabled=false;
  }
});

onAuthStateChanged(auth,user=>{
  if(!user){
    location.href="login.html?role=proprietaire";
    return;
  }
  currentUser=user;
  resetUnread();

  const q = query(
    collection(db,"requests"),
    where("ownerUid","==",user.uid),
    where("type","==","message"),
    orderBy("createdAt","desc")
  );

  onSnapshot(q,snap=>{
    listEl.innerHTML="";
    if(!snap.docs.length){
      listEl.innerHTML="<div class='item'><p class='msg'>Aucun message pour le moment.</p></div>";
      return;
    }
    snap.docs.forEach(d=>{
      const r=d.data();
      const el=document.createElement("div");
      el.className="item";
      el.innerHTML=`
        <div class="meta">${fmt(r.createdAt)}</div>
        <p class="msg">${r.message||""}</p>
      `;
      listEl.appendChild(el);
    });
  },err=>{
    showAlert(alertList,"Erreur chargement messages.");
  });
});

window.addEventListener("focus",resetUnread);
</script>
</body>
</html>
