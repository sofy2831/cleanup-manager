<!-- docs/owner-messages.html — RESET unreadOwnerCount PROPRE -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanUp Manager — Messages propriétaire</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{margin:0;background:#F8F4FF;color:#111}

.page{max-width:980px;margin:auto;padding:16px 16px 110px}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:12px
}
.pill{
  padding:8px 12px;border-radius:999px;font-weight:900;font-size:13px;
  border:2px solid #7A5CFF;background:#fff;color:#7A5CFF;
  text-decoration:none;cursor:pointer
}

.thread{
  background:#fff;border-radius:16px;
  padding:12px;margin-bottom:10px;
  box-shadow:0 4px 12px rgba(0,0,0,.08);
  cursor:pointer
}
.thread.unread{border-left:6px solid #7A5CFF}
.threadTitle{font-weight:900;font-size:14px}
.threadMeta{font-size:12px;color:#666;margin-top:4px}

.messages{
  margin-top:12px;
  display:flex;flex-direction:column;gap:8px
}
.msg{
  max-width:80%;
  padding:8px 10px;border-radius:12px;
  font-size:13px
}
.msg.owner{align-self:flex-end;background:#7A5CFF;color:#fff}
.msg.conciergerie{align-self:flex-start;background:#eee}

form{
  display:flex;gap:8px;margin-top:12px
}
textarea{
  flex:1;border-radius:12px;padding:8px;font-size:13px
}
button{
  border:none;border-radius:999px;padding:8px 14px;
  background:#7A5CFF;color:#fff;font-weight:900;cursor:pointer
}
</style>
</head>

<body>
<div class="page">

  <div class="topbar">
    <a class="pill" href="owner-dashboard.html">← Dashboard</a>
    <button class="pill" id="logoutBtn">Déconnexion</button>
  </div>

  <h2>Messages avec la conciergerie</h2>

  <div id="threadList"></div>

  <div id="threadView" style="display:none">
    <h3 id="threadTitle"></h3>
    <div class="messages" id="messagesBox"></div>

    <form id="sendForm">
      <textarea id="msgInput" placeholder="Ton message…" required></textarea>
      <button type="submit">Envoyer</button>
    </form>
  </div>

</div>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged, signOut } from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  collection, query, where, onSnapshot,
  doc, getDoc, updateDoc, addDoc, serverTimestamp
} from
  "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const threadList = document.getElementById("threadList");
const threadView = document.getElementById("threadView");
const messagesBox = document.getElementById("messagesBox");
const threadTitle = document.getElementById("threadTitle");
const sendForm = document.getElementById("sendForm");
const msgInput = document.getElementById("msgInput");

let currentUser = null;
let currentThreadId = null;

/* LOGOUT */
document.getElementById("logoutBtn").onclick = async ()=>{
  await signOut(auth);
  location.href="index.html";
};

/* LOAD THREADS */
function listenThreads(uid){
  const q = query(
    collection(db,"threads"),
    where("ownerUid","==",uid)
  );

  onSnapshot(q, snap=>{
    threadList.innerHTML = "";
    snap.forEach(d=>{
      const t = d.data();
      const div = document.createElement("div");
      div.className = "thread" + (t.unreadOwnerCount>0 ? " unread" : "");
      div.innerHTML = `
        <div class="threadTitle">Conciergerie</div>
        <div class="threadMeta">
          ${t.lastMessageText || ""} · ${t.unreadOwnerCount||0} non lu
        </div>
      `;
      div.onclick = ()=> openThread(d.id, t.conciergerieUid);
      threadList.appendChild(div);
    });
  });
}

/* OPEN THREAD + RESET UNREAD */
async function openThread(threadId, conciergerieUid){
  currentThreadId = threadId;
  threadView.style.display = "block";
  messagesBox.innerHTML = "";
  threadTitle.textContent = "Conversation";

  const threadRef = doc(db,"threads",threadId);

  // 🔥 RESET unreadOwnerCount
  await updateDoc(threadRef,{
    unreadOwnerCount: 0
  });

  const mq = query(collection(db,"threads",threadId,"messages"));
  onSnapshot(mq, snap=>{
    messagesBox.innerHTML="";
    snap.forEach(d=>{
      const m = d.data();
      const div = document.createElement("div");
      div.className = "msg " + (m.from==="owner"?"owner":"conciergerie");
      div.textContent = m.text;
      messagesBox.appendChild(div);
    });
    messagesBox.scrollTop = messagesBox.scrollHeight;
  });
}

/* SEND MESSAGE */
sendForm.onsubmit = async (e)=>{
  e.preventDefault();
  if(!currentThreadId) return;

  const text = msgInput.value.trim();
  if(!text) return;

  const threadRef = doc(db,"threads",currentThreadId);

  await addDoc(collection(db,"threads",currentThreadId,"messages"),{
    text,
    from:"owner",
    createdAt: serverTimestamp()
  });

  await updateDoc(threadRef,{
    lastMessageText: text,
    lastMessageAt: serverTimestamp(),
    unreadConciergerieCount: (await getDoc(threadRef)).data().unreadConciergerieCount + 1
  });

  msgInput.value="";
};

/* BOOT */
onAuthStateChanged(auth,user=>{
  if(!user){
    location.href="login.html?role=proprietaire";
    return;
  }
  currentUser = user;
  listenThreads(user.uid);
});
</script>
</body>
</html>
