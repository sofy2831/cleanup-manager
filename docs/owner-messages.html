<!-- docs/owner-messages.html (FINAL — owner messages + download attachments) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Messages propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.90);
    }

    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 110px; }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:10; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; justify-content:center;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }

    .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; gap:10px; margin-top:8px; }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
    }
    h1{ margin:0; font-size:20px; font-weight:900; }
    .tiny{ font-size:12px; color:var(--muted); font-weight:900; }

    .msg{
      display:none; margin-top:10px; padding:10px 12px;
      border-radius:14px; background:#fff;
      border-left:5px solid var(--bad);
      font-size:12px; font-weight:900; white-space:pre-wrap;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .msg.ok{ border-left-color: var(--ok); }

    .list{ display:flex; flex-direction:column; gap:10px; margin-top:10px; }
    .bubble{
      background:#fff;
      border:1px solid rgba(0,0,0,0.04);
      border-radius:16px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 10px;
      max-width:100%;
    }
    .bubble.me{ border-left:5px solid rgba(122,92,255,0.45); }
    .bubble.them{ border-left:5px solid rgba(0,0,0,0.12); }

    .bTop{
      display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
      font-size:12px; font-weight:900; color:#333;
    }
    .bText{ margin-top:6px; font-size:13px; font-weight:800; color:#111; white-space:pre-wrap; }

    .att{
      margin-top:8px;
      display:flex; flex-direction:column; gap:8px;
    }
    .attRow{
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      padding:10px 10px;
      border-radius:14px;
      background:rgba(248,244,255,.75);
      border:1px solid rgba(122,92,255,0.18);
    }
    .attRow b{ font-weight:1000; font-size:12px; }
    .attRow .meta{ font-size:12px; font-weight:900; color:#555; }

    .mini{
      border:none; border-radius:999px;
      padding:9px 10px; font-size:12px; font-weight:900;
      cursor:pointer; white-space:nowrap;
      background:linear-gradient(90deg,var(--violet),var(--violet2)); color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .mini.ghost{
      background:#fff; color:var(--violet); border:2px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .mini:disabled{ opacity:.6; cursor:not-allowed; }

    .composer{
      display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap;
      margin-top:10px;
    }
    textarea{
      flex:1; min-width:220px;
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid rgba(122,92,255,0.25);
      outline:none;
      font-weight:800;
      background:#fff;
      resize:vertical;
    }
    textarea:focus{
      border-color:var(--violet);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }

    /* Bottom nav owner (4 onglets) */
    .bottom-nav{
      position:fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
  </style>
</head>

<body>
<div class="page">
  <div class="topbar">
    <a class="pill" href="owner-dashboard.html">← Dashboard</a>
    <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
  </div>

  <div class="wrap">
    <section class="card">
      <h1>Messages</h1>
      <div class="tiny" id="subLine">—</div>
      <div class="msg" id="msgBox"></div>

      <div class="list" id="list"></div>

      <div class="composer">
        <textarea id="text" rows="2" placeholder="Écrire un message…"></textarea>
        <button class="mini" id="sendBtn" type="button">Envoyer</button>
      </div>
    </section>
  </div>
</div>

<nav class="bottom-nav" aria-label="Navigation propriétaire">
  <a href="owner-dashboard.html">Dashboard</a>
  <a href="owner-planning.html">Planning</a>
  <a href="owner-homes.html">Logements</a>
  <a class="active" href="owner-messages.html">Messages</a>
</nav>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import {
    doc, getDoc, setDoc, addDoc, serverTimestamp,
    collection, query, orderBy, onSnapshot
  } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
  import { getStorage, ref, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-storage.js";

  const storage = getStorage();

  const msgBox = document.getElementById("msgBox");
  const subLine = document.getElementById("subLine");
  const list = document.getElementById("list");
  const textEl = document.getElementById("text");
  const sendBtn = document.getElementById("sendBtn");

  function showMsg(t, ok=false){
    msgBox.style.display="block";
    msgBox.classList.toggle("ok", !!ok);
    msgBox.textContent=t;
  }
  function hideMsg(){
    msgBox.style.display="none";
    msgBox.classList.remove("ok");
    msgBox.textContent="";
  }
  function esc(s){
    return String(s ?? "")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  document.getElementById("logoutBtn").onclick = async ()=>{
    await signOut(auth);
    localStorage.removeItem("cm_auth");
    location.href="login.html?role=proprietaire";
  };

  async function downloadAttachment(att){
    try{
      const p = String(att?.storagePath || "").trim();
      if(!p) throw new Error("storagePath manquant.");
      const url = await getDownloadURL(ref(storage, p));
      window.open(url, "_blank");
    }catch(e){
      showMsg("Téléchargement impossible : " + (e?.message || "erreur"), false);
    }
  }

  function formatDate(ts){
    try{
      const d = ts?.toDate ? ts.toDate() : null;
      if(!d) return "";
      return d.toLocaleString("fr-FR", { dateStyle:"short", timeStyle:"short" });
    }catch(_){ return ""; }
  }

  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      location.href="login.html?role=proprietaire";
      return;
    }

    hideMsg();

    // 1) Load user profile (ownerDocId + conciergerieUid)
    const us = await getDoc(doc(db,"users", user.uid));
    const ud = us.exists() ? (us.data()||{}) : {};

    const ownerDocId = String(ud.ownerDocId || "").trim();
    const conciergerieUid = String(ud.conciergerieUid || "").trim();

    if(!ownerDocId || !conciergerieUid){
      subLine.textContent = "Profil incomplet : ownerDocId/conciergerieUid manquant.";
      showMsg("Impossible d’ouvrir la messagerie : profil propriétaire non relié à une conciergerie.", false);
      sendBtn.disabled = true;
      return;
    }

    // 2) threadId stable
    const threadId = `${conciergerieUid}__${ownerDocId}`;
    subLine.textContent = `Thread : ${threadId}`;

    // 3) Ensure thread doc exists (idempotent)
    await setDoc(doc(db,"threads", threadId), {
      conciergerieUid,
      ownerDocId,
      updatedAt: serverTimestamp(),
      createdAt: serverTimestamp()
    }, { merge:true });

    // 4) Listen messages
    const q = query(
      collection(db,"threads", threadId, "messages"),
      orderBy("createdAt","asc")
    );

    onSnapshot(q, (snap)=>{
      list.innerHTML = "";
      if(snap.empty){
        list.innerHTML = `
          <div class="bubble them">
            <div class="bTop"><span>Info</span><span></span></div>
            <div class="bText">Aucun message pour le moment.</div>
          </div>
        `;
        return;
      }

      for(const d of snap.docs){
        const m = d.data() || {};
        const senderRole = String(m.senderRole || "").toLowerCase();
        const mine = (senderRole === "proprietaire"); // owner side
        const atts = Array.isArray(m.attachments) ? m.attachments : [];

        const div = document.createElement("div");
        div.className = "bubble " + (mine ? "me" : "them");

        div.innerHTML = `
          <div class="bTop">
            <span>${mine ? "Vous" : "Conciergerie"}</span>
            <span class="tiny">${esc(formatDate(m.createdAt))}</span>
          </div>
          <div class="bText">${esc(String(m.text || "").trim() || "—")}</div>
          <div class="att"></div>
        `;

        const attBox = div.querySelector(".att");

        for(const att of atts){
          if(String(att?.kind || "") !== "INVOICE_PDF") continue;

          const label = String(att?.label || "Facture").trim();
          const contentType = String(att?.contentType || "application/pdf").trim();

          const row = document.createElement("div");
          row.className = "attRow";
          row.innerHTML = `
            <div>
              <b>📎 ${esc(label)}</b>
              <div class="meta">${esc(contentType)}</div>
            </div>
            <button class="mini ghost" type="button">Télécharger</button>
          `;
          row.querySelector("button").addEventListener("click", ()=> downloadAttachment(att));
          attBox.appendChild(row);
        }

        list.appendChild(div);
      }

      // auto scroll bottom
      setTimeout(()=> window.scrollTo({ top: document.body.scrollHeight, behavior:"smooth" }), 50);
    }, (err)=>{
      showMsg("Erreur lecture messages : " + (err?.message || "inconnue"), false);
    });

    // 5) Send owner message (text only)
    sendBtn.onclick = async ()=>{
      hideMsg();
      const text = String(textEl.value || "").trim();
      if(!text) return;

      sendBtn.disabled = true;
      try{
        await addDoc(collection(db,"threads", threadId, "messages"), {
          senderRole: "proprietaire",
          senderUid: user.uid,
          text,
          createdAt: serverTimestamp()
        });
        textEl.value = "";
      }catch(e){
        showMsg("Erreur envoi : " + (e?.message || "inconnue"), false);
      }finally{
        sendBtn.disabled = false;
      }
    };
  });
</script>
</body>
</html>
