<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Messages</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --border:rgba(122,92,255,.18);
      --shadow:0 14px 36px rgba(0,0,0,.08);
    }
    *{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
    body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text)}
    .page{min-height:100vh;padding:16px 16px 120px;display:flex;flex-direction:column;align-items:center}
    .topbar{width:100%;max-width:980px;display:flex;justify-content:flex-start;padding:8px 0;position:sticky;top:0;background:rgba(248,244,255,.9);backdrop-filter:blur(6px);z-index:20}
    .pill{padding:8px 14px;border-radius:999px;border:2px solid var(--violet);background:#fff;color:var(--violet);font-weight:900;font-size:13px;text-decoration:none;box-shadow:0 3px 10px rgba(0,0,0,.06)}
    .title{margin-top:10px;text-align:center}
    h1{margin:0;font-size:22px;font-weight:900}
    .subtitle{font-size:13px;color:#444;font-weight:800;margin-top:4px}

    .wrap{width:100%;max-width:980px;margin-top:16px;display:flex;flex-direction:column;gap:14px}
    .card{background:#fff;border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:14px}
    .cardTitle{font-size:14px;font-weight:1000;margin-bottom:8px}
    .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    select, textarea{
      width:100%;
      padding:10px 12px;border-radius:12px;border:1px solid #d3c7ff;font-size:14px;font-weight:700;
      background:#fff;outline:none
    }
    textarea{min-height:90px;resize:vertical}

    .btn{padding:10px 14px;border-radius:999px;border:2px solid var(--violet);background:#fff;color:var(--violet);font-weight:1000;cursor:pointer}
    .btn.primary{background:linear-gradient(90deg,var(--violet),var(--violet2));color:#fff;border:none;box-shadow:0 10px 22px rgba(0,0,0,.1)}
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .alert{display:none;margin-top:8px;padding:10px 12px;border-radius:12px;font-size:12px;font-weight:900;background:#fff;border-left:5px solid #b3261e}
    .alert.ok{border-left-color:#1b8f4d}

    .list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
    .item{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
    .meta{font-size:11px;font-weight:1000;color:#666;margin-bottom:6px}
    .msg{font-size:13px;font-weight:700;white-space:pre-wrap;line-height:1.35}

    .threadItem{cursor:pointer;border:2px solid transparent}
    .threadItem.active{border-color:var(--violet)}
    .threadTop{display:flex;justify-content:space-between;gap:10px}
    .threadTitle{font-weight:900}
    .pillUnread{min-width:18px;height:18px;padding:0 6px;border-radius:999px;background:var(--violet);color:#fff;font-weight:900;font-size:11px;display:inline-flex;align-items:center;justify-content:center}

    .bottom-nav{
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: 10px; z-index: 50;
      width: calc(100% - 20px); max-width: 980px;
      display: flex; gap: 6px; padding: 8px;
      background: #fff; border-radius: 999px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .bottom-nav a{
      flex: 1; text-align: center;
      padding: 10px 0; border-radius: 999px;
      font-size: 12px; font-weight: 900; text-decoration: none;
      color: #666;
    }
    .bottom-nav a.active{
      background: linear-gradient(90deg, var(--violet), var(--violet2));
      color: #fff; box-shadow: 0 10px 22px rgba(0,0,0,0.15);
    }
  </style>
</head>

<body>
<div class="page">
  <div class="topbar">
    <a class="pill" href="owner-dashboard.html">← Dashboard</a>
  </div>

  <div class="title">
    <h1>Messages</h1>
    <div class="subtitle">Échanges avec la conciergerie</div>
  </div>

  <div class="wrap">
    <section class="card">
      <div class="cardTitle">Conversations</div>
      <div class="alert" id="alertThreads"></div>
      <div class="row" style="margin-bottom:10px;">
        <button class="btn" id="newThreadBtn" type="button">Nouvelle conversation</button>
      </div>
      <div id="threadList" class="list"></div>
    </section>

    <section class="card">
      <div class="cardTitle" id="chatTitle">Sélectionne une conversation</div>
      <div class="alert" id="alertChat"></div>

      <div id="messages" class="list"></div>

      <form id="msgForm" style="margin-top:10px;">
        <textarea id="msgText" placeholder="Écris ton message…" required></textarea>
        <div class="row" style="margin-top:10px; justify-content:flex-end;">
          <button class="btn primary" id="sendBtn" type="submit">Envoyer</button>
        </div>
      </form>
    </section>
  </div>
</div>

<nav class="bottom-nav">
  <a href="owner-dashboard.html">Dashboard</a>
  <a href="owner-planning.html">Planning</a>
  <a href="owner-homes.html">Logements</a>
  <a class="active" href="owner-messages.html">Messages</a>
</nav>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  collection, doc, addDoc, updateDoc, getDocs,
  query, where, onSnapshot,
  serverTimestamp, increment
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const threadListEl = document.getElementById("threadList");
const messagesEl = document.getElementById("messages");
const chatTitleEl = document.getElementById("chatTitle");
const msgForm = document.getElementById("msgForm");
const msgText = document.getElementById("msgText");
const sendBtn = document.getElementById("sendBtn");
const newThreadBtn = document.getElementById("newThreadBtn");

const alertThreads = document.getElementById("alertThreads");
const alertChat = document.getElementById("alertChat");

function showAlert(el,msg,ok=false){
  el.style.display="block";
  el.classList.toggle("ok",ok);
  el.textContent=msg;
}
function hideAlert(el){
  el.style.display="none";
  el.textContent="";
}
function esc(s){
  return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
}
function fmt(ts){
  try{
    const d = ts?.toDate ? ts.toDate() : new Date();
    return d.toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});
  }catch(e){ return "—"; }
}

let currentUser=null;
let allThreads=[];
let activeThreadId=null;
let unsubThreads=null;
let unsubMsgs=null;

function stopMsgs(){
  if(unsubMsgs) unsubMsgs();
  unsubMsgs=null;
}

function renderThreads(){
  threadListEl.innerHTML="";
  if(!allThreads.length){
    threadListEl.innerHTML = `<div class="item"><div class="msg">Aucune conversation.</div></div>`;
    return;
  }

  const sorted = allThreads.slice().sort((a,b)=>(b.lastAt?.seconds??0)-(a.lastAt?.seconds??0));
  sorted.forEach(t=>{
    const div=document.createElement("div");
    div.className="item threadItem" + (t.id===activeThreadId ? " active":"");
    div.onclick=()=>openThread(t.id);

    const unread = Number(t.unreadForOwner||0);
    div.innerHTML=`
      <div class="threadTop">
        <div>
          <div class="threadTitle">${esc(t.homeLabel || "Conversation")}</div>
          <div class="meta">${esc(t.lastText || "")}</div>
        </div>
        <div style="text-align:right;">
          <div class="meta">${fmt(t.lastAt)}</div>
          ${unread ? `<div class="pillUnread">${unread}</div>` : ``}
        </div>
      </div>
    `;
    threadListEl.appendChild(div);
  });
}

function listenMessages(threadId){
  stopMsgs();
  messagesEl.innerHTML = `<div class="item"><div class="msg">Chargement…</div></div>`;

  const col = collection(db,"threads",threadId,"messages");
  unsubMsgs = onSnapshot(col,(snap)=>{
    const msgs = snap.docs.map(d=>({id:d.id, ...d.data()}));
    msgs.sort((a,b)=>(a.at?.seconds??0)-(b.at?.seconds??0));

    messagesEl.innerHTML="";
    if(!msgs.length){
      messagesEl.innerHTML = `<div class="item"><div class="msg">Aucun message.</div></div>`;
      return;
    }

    msgs.forEach(m=>{
      const me = String(m.senderUid||"") === String(currentUser.uid);
      const el=document.createElement("div");
      el.className="item";
      el.style.borderLeft = me ? "5px solid #7A5CFF" : "5px solid #ddd";
      el.innerHTML=`
        <div class="meta">${me ? "Moi" : "Conciergerie"} • ${fmt(m.at)}</div>
        <div class="msg">${esc(m.text||"")}</div>
      `;
      messagesEl.appendChild(el);
    });

    setTimeout(()=>{ window.scrollTo(0, document.body.scrollHeight); }, 0);
  },(err)=>{
    console.error(err);
    showAlert(alertChat,"Erreur chargement messages : " + (err?.message||"inconnue"));
  });
}

async function openThread(id){
  activeThreadId=id;
  const t = allThreads.find(x=>x.id===id);
  if(!t) return;

  chatTitleEl.textContent = t.homeLabel || "Conversation";
  renderThreads();
  listenMessages(id);

  try{ await updateDoc(doc(db,"threads",id), { unreadForOwner: 0 }); }catch(e){}
}

msgForm.addEventListener("submit", async (e)=>{
  e.preventDefault();
  hideAlert(alertChat);
  const text = msgText.value.trim();
  if(!activeThreadId){ showAlert(alertChat,"Choisis une conversation.",false); return; }
  if(!text) return;

  sendBtn.disabled=true;
  try{
    await addDoc(collection(db,"threads",activeThreadId,"messages"),{
      text,
      at: serverTimestamp(),
      senderUid: currentUser.uid,
      senderRole: "PROPRIETAIRE",
      attachments: []
    });

    await updateDoc(doc(db,"threads",activeThreadId),{
      lastText: text,
      lastAt: serverTimestamp(),
      unreadForConciergerie: increment(1)
    });

    msgText.value="";
  }catch(err){
    console.error(err);
    showAlert(alertChat,"Erreur envoi : " + (err?.message||"inconnue"));
  }finally{
    sendBtn.disabled=false;
  }
});

async function newThread(){
  hideAlert(alertThreads);

  // homes appartenant au propriétaire
  const hs = await getDocs(query(collection(db,"homes"), where("ownerUid","==", currentUser.uid)));
  const homes = hs.docs.map(d=>({id:d.id, ...d.data()}));

  if(!homes.length){
    showAlert(alertThreads,"Aucun logement lié à ton compte.",false);
    return;
  }

  const list = homes.map((h,i)=>`${i+1}. ${h.name || h.label || h.id} (${h.city||""})`).join("\n");
  const pickStr = prompt("Choisis un logement (numéro) :\n\n" + list);
  if(!pickStr) return;
  const idx = Number(pickStr)-1;
  const chosen = homes[idx];
  if(!chosen){ alert("Numéro invalide."); return; }

  if(!chosen.conciergerieUid){
    alert("Logement sans conciergerieUid. Impossible.");
    return;
  }

  // éviter les doublons : si un thread existe déjà pour ce homeId, on l’ouvre
  const existing = allThreads.find(t=>t.homeId===chosen.id);
  if(existing){ openThread(existing.id); return; }

  try{
    const ownerEmailLower = String(currentUser.email||"").toLowerCase();
    const ownerName = prompt("Ton nom (affiché à la conciergerie) :", "Propriétaire") || "Propriétaire";

    const threadRef = await addDoc(collection(db,"threads"),{
      conciergerieUid: String(chosen.conciergerieUid),
      ownerUid: currentUser.uid,
      homeId: chosen.id,
      homeLabel: `${chosen.name || chosen.label || "Logement"} • ${chosen.city || ""}`.trim(),
      ownerName: String(ownerName).trim(),
      ownerEmailLower,
      lastText: "Conversation créée.",
      lastAt: serverTimestamp(),
      createdAt: serverTimestamp(),
      unreadForConciergerie: 0,
      unreadForOwner: 0,
      flags: { paymentDue:false },
      closed: false
    });

    await addDoc(collection(db,"threads",threadRef.id,"messages"),{
      text:"Conversation créée.",
      at: serverTimestamp(),
      senderUid: currentUser.uid,
      senderRole: "PROPRIETAIRE",
      attachments: []
    });

    showAlert(alertThreads,"Conversation créée.",true);
  }catch(err){
    console.error(err);
    showAlert(alertThreads,"Erreur création : " + (err?.message||"inconnue"),false);
  }
}

newThreadBtn.addEventListener("click", newThread);

function startThreadsListener(){
  const q = query(collection(db,"threads"), where("ownerUid","==", currentUser.uid));
  unsubThreads = onSnapshot(q,(snap)=>{
    allThreads = snap.docs.map(d=>({id:d.id, ...d.data()}));
    hideAlert(alertThreads);
    renderThreads();

    if(!activeThreadId && allThreads.length){
      const sorted = allThreads.slice().sort((a,b)=>(b.lastAt?.seconds??0)-(a.lastAt?.seconds??0));
      openThread(sorted[0].id);
    }
  },(err)=>{
    console.error(err);
    showAlert(alertThreads,"Erreur threads : " + (err?.message||"inconnue"),false);
  });
}

onAuthStateChanged(auth,(user)=>{
  if(!user){
    location.href="login.html?role=proprietaire";
    return;
  }
  currentUser=user;
  if(unsubThreads) unsubThreads();
  stopMsgs();
  activeThreadId=null;
  allThreads=[];
  renderThreads();
  startThreadsListener();
});
</script>
</body>
</html>
