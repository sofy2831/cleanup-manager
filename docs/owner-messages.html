<!-- docs/owner-messages.html (CLEAN — hide thread id, show conciergerie companyName, token passthrough, messages OK) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Messages propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 110px; }
    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      position:sticky; top:0; z-index:20; padding:10px 0;
      background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .wrap{ width:100%; max-width:980px; display:flex; flex-direction:column; gap:10px; margin-top:6px; }

    .logo{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-top:8px; margin-bottom:4px; text-align:center;
    }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:13px; color:#444; text-align:center; font-weight:800; }

    .alert{
      display:none; padding:10px 12px; border-radius:14px; background:#fff;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:900; color:#444; white-space:pre-wrap;
      width:100%;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
    }
    .cardTitle{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      font-size:14px; font-weight:900; color:#111;
    }
    .tiny{ font-size:12px; color:var(--muted); font-weight:900; }

    .chat{
      display:flex; flex-direction:column; gap:10px;
      margin-top:10px;
      max-height:60vh;
      overflow:auto;
      padding-right:2px;
    }
    .msg{
      max-width:92%;
      padding:10px 12px;
      border-radius:16px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.05);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .msg.me{ margin-left:auto; border-color: rgba(122,92,255,0.22); }
    .msg .meta{ font-size:11px; color:#666; font-weight:900; margin-bottom:6px; }
    .msg .text{ font-size:13px; font-weight:850; white-space:pre-wrap; }

    .composer{
      margin-top:10px;
      display:flex; gap:8px; align-items:flex-end;
    }
    textarea{
      flex:1;
      width:100%;
      padding:10px 12px;
      border-radius:14px;
      border:1px solid #D3C7FF;
      font-size:14px;
      outline:none;
      background:#fff;
      font-weight:800;
      resize:vertical;
      min-height:44px;
      max-height:160px;
    }
    textarea:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }

    .btnMini{
      border:none; border-radius:999px;
      padding:9px 10px; font-size:12px; font-weight:900;
      cursor:pointer; white-space:nowrap;
      background:linear-gradient(90deg,var(--violet),var(--violet2)); color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
      text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
    }

    .bottom-nav{
      position: fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .emptyState{
  margin-top:6px;
  padding:14px;
  border-radius:16px;
  background:#fff;
  border:1px dashed rgba(122,92,255,0.35);
  box-shadow:0 3px 10px rgba(0,0,0,.04);
}
.emptyStateTitle{
  font-size:14px;
  font-weight:1000;
  margin-bottom:6px;
  color:#111;
}
.emptyStateText{
  font-size:13px;
  line-height:1.55;
  color:#444;
  font-weight:800;
}
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="owner-dashboard.html">← Dashboard</a>
    </div>

    <div class="wrap">
      <div class="logo">
        <div class="logo-icon">✓</div>
        <div>
          <h1>CleanUp Manager</h1>
          <div class="subtitle">Messages</div>
        </div>
      </div>

      <div class="alert" id="alertBox"></div>

      <section class="card">
        <div class="cardTitle">
          <span>Conversation avec la conciergerie</span>
          <span class="tiny" id="conciergerieName">—</span>
        </div>

        <div class="chat" id="chatBox"></div>

        <div class="composer">
          <textarea id="msgInput" placeholder="Écrire un message…"></textarea>
          <button class="btnMini" id="sendBtn" type="button">Envoyer</button>
        </div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation propriétaire">
    <a id="navDash" href="owner-dashboard.html">Dashboard</a>
    <a id="navPlanning" href="owner-planning.html">Planning</a>
    <a id="navHomes" href="owner-homes.html">Logements</a>
    <a class="active" id="navMessages" href="owner-messages.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, setDoc, addDoc, updateDoc, collection,
      query, orderBy, limit, onSnapshot, serverTimestamp, increment
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const chatBox = document.getElementById("chatBox");
    const msgInput = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const conciergerieNameEl = document.getElementById("conciergerieName");

    const backBtn = document.getElementById("backBtn");
    const navDash = document.getElementById("navDash");
    const navPlanning = document.getElementById("navPlanning");
    const navHomes = document.getElementById("navHomes");
    const navMessages = document.getElementById("navMessages");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtTs(ts){
      try{
        const d = ts?.toDate ? ts.toDate() : null;
        if(!d) return "";
        return d.toLocaleString("fr-FR");
      }catch(_){ return ""; }
    }

    // token passthrough (si tu l’utilises)
    const params = new URLSearchParams(location.search);
    const token = (params.get("token") || "").trim();
    function withToken(url){
      if(!token) return url;
      const u = new URL(url, location.href);
      u.searchParams.set("token", token);
      return u.pathname + "?" + u.searchParams.toString();
    }
    backBtn.href = withToken("owner-dashboard.html");
    navDash.href = withToken("owner-dashboard.html");
    navPlanning.href = withToken("owner-planning.html");
    navHomes.href = withToken("owner-homes.html");
    navMessages.href = withToken("owner-messages.html");

    let currentUser = null;
    let ownerDocId = "";
    let conciergerieUid = "";
    let threadId = "";
    let unsubMessages = null;

    function stableThreadId(conciergerieUid, ownerDocId){
      return `t_${conciergerieUid}_${ownerDocId}`;
    }

    async function loadConciergerieName(conciergerieUid){
      // on essaie plusieurs champs "probables", fallback safe
      try{
        const snap = await getDoc(doc(db,"conciergeries", conciergerieUid));
        if(snap.exists()){
          const c = snap.data() || {};
          const n = String(
            c.companyName || c.displayName || c.name || c.legalName || c.title || ""
          ).trim();
          return n || "Votre conciergerie";
        }
      }catch(_){}

      // fallback sur users/{conciergerieUid} si jamais tu stockes companyName là
      try{
        const us = await getDoc(doc(db,"users", conciergerieUid));
        if(us.exists()){
          const u = us.data() || {};
          const n = String(
            u.businessProfile?.companyName || u.companyName || u.displayName || u.fullname || u.name || ""
          ).trim();
          return n || "Votre conciergerie";
        }
      }catch(_){}

      return "Votre conciergerie";
    }

    async function loadOwnerMeta(ownerDocId){
      try{
        const snap = await getDoc(doc(db,"owners", ownerDocId));
        if(!snap.exists()) return { ownerName:"Propriétaire", ownerEmailLower:"" };
        const o = snap.data() || {};
        return {
          ownerName: String(o.fullname || o.name || o.displayName || "Propriétaire").trim(),
          ownerEmailLower: String(o.emailLower || o.email || "").trim().toLowerCase()
        };
      }catch(_){
        return { ownerName:"Propriétaire", ownerEmailLower:"" };
      }
    }

    async function ensureThread(){
      if(!conciergerieUid || !ownerDocId){
        throw new Error("Profil incomplet (conciergerieUid/ownerDocId manquant).");
      }
      if(threadId) return threadId;

      const tid = stableThreadId(conciergerieUid, ownerDocId);
      const tRef = doc(db,"threads", tid);
      const snap = await getDoc(tRef);

      if(!snap.exists()){
        const meta = await loadOwnerMeta(ownerDocId);

        await setDoc(tRef, {
          conciergerieUid,
          ownerDocId,
          ownerUid: currentUser.uid,

          ownerName: meta.ownerName,
          ownerEmailLower: meta.ownerEmailLower,

          homeCount: 0,
          homeNames: [],

        lastText: "",
lastAt: serverTimestamp(),
createdAt: serverTimestamp(),
updatedAt: serverTimestamp(),
unreadForConciergerie: 0,
unreadForOwner: 0,
closed: false
        }, { merge:true });
      }

      threadId = tid;
      return tid;
    }

    function renderMessage(m){
      const role = String(m.senderRole || "").toUpperCase().trim();
      const isMe = role === "PROPRIETAIRE";

      const div = document.createElement("div");
      div.className = "msg" + (isMe ? " me" : "");
      const meta = `${isMe ? "Moi" : "Conciergerie"} • ${fmtTs(m.at)}`;

      const text = String(m.text || "").trim();

      div.innerHTML = `
        <div class="meta">${esc(meta)}</div>
        <div class="text">${esc(text || "—")}</div>
      `;
      return div;
    }

    async function subscribeMessages(){
      if(unsubMessages) unsubMessages();

      const tid = await ensureThread();

      const q = query(
        collection(db, "threads", tid, "messages"),
        orderBy("at","asc"),
        limit(300)
      );

      unsubMessages = onSnapshot(q, async (snap)=>{
        chatBox.innerHTML = "";
      if(snap.empty){
  chatBox.innerHTML = `
    <div class="emptyState">
      <div class="emptyStateTitle">Aucun message pour le moment</div>
      <div class="emptyStateText">
        Envoyez votre premier message pour démarrer l’échange avec votre conciergerie.<br>
        Vous pouvez aussi transmettre vos liens iCal si vos logements sont déjà diffusés sur une plateforme.
      </div>
    </div>
  `;
}else{
          snap.forEach(d=>{
            chatBox.appendChild(renderMessage(d.data() || {}));
          });
        }

        try{ await updateDoc(doc(db,"threads", tid), { unreadForOwner: 0 }); }catch(_){}

        chatBox.scrollTop = chatBox.scrollHeight + 9999;
      }, (err)=>{
        showAlert("Erreur messages : " + (err?.message || "inconnue"));
      });
    }

    sendBtn.onclick = async ()=>{
      hideAlert();
      const text = String(msgInput.value || "").trim();
      if(!text) return;

      sendBtn.disabled = true;
      try{
        const tid = await ensureThread();

       await addDoc(collection(db,"threads", tid, "messages"), {
  text,
  at: serverTimestamp(),
  createdAt: serverTimestamp(),
  senderRole: "PROPRIETAIRE",
  senderUid: currentUser.uid
}); 

 await updateDoc(doc(db,"threads", tid), {
  lastAt: serverTimestamp(),
  lastText: text,
  unreadForConciergerie: increment(1),
  updatedAt: serverTimestamp()
});

        msgInput.value = "";
      }catch(e){
        showAlert("Envoi impossible : " + (e?.message || "erreur"));
      }finally{
        sendBtn.disabled = false;
      }
    };

    msgInput.addEventListener("keydown", (e)=>{
      if(e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendBtn.click();
      }
    });

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = withToken("login.html?role=proprietaire"); return; }
      currentUser = user;

      try{
        const us = await getDoc(doc(db,"users", user.uid));
        const ud = us.exists() ? (us.data()||{}) : {};

        ownerDocId = String(ud.ownerDocId || "").trim();
        conciergerieUid = String(ud.conciergerieUid || "").trim();

        if(!ownerDocId || !conciergerieUid){
          showAlert("Profil incomplet : ownerDocId ou conciergerieUid manquant dans users/{uid}.");
          conciergerieNameEl.textContent = "—";
          return;
        }

        conciergerieNameEl.textContent = await loadConciergerieName(conciergerieUid);

        threadId = "";
        await subscribeMessages();
      }catch(e){
        showAlert("Erreur chargement : " + (e?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
