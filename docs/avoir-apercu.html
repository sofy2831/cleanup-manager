<!-- docs/avoir-apercu.html (FINAL — print/PDF, récupère docId, option draft=1 via sessionStorage creditDraftPreview) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Avoir — Aperçu</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:#f4f4f7; color:#111; }

    .topbar{
      position:sticky; top:0; z-index:10;
      background:#fff; border-bottom:1px solid #eee;
      padding:10px 12px; display:flex; gap:10px; justify-content:space-between; align-items:center;
    }
    .btn{
      display:inline-flex; align-items:center; justify-content:center;
      padding:10px 12px; border-radius:999px;
      border:1px solid #ddd; background:#fff;
      font-weight:900; cursor:pointer; text-decoration:none; color:#111;
    }
    .btn.primary{ border-color:transparent; background:#111; color:#fff; }

    .paper{
      width:min(920px, calc(100% - 24px));
      margin:14px auto 40px;
      background:#fff; border:1px solid #e8e8ef; border-radius:14px;
      box-shadow:0 12px 24px rgba(0,0,0,.08);
      padding:18px;
    }

    .head{
      display:flex; justify-content:space-between; gap:18px; flex-wrap:wrap;
      padding-bottom:14px; border-bottom:1px solid #eee;
    }
    .box{
      min-width:260px;
    }
    .title{
      font-size:18px; font-weight:1000; margin:0;
    }
    .muted{ color:#666; font-weight:800; font-size:12px; margin-top:4px; line-height:1.35; }
    .bigNo{
      font-size:16px; font-weight:1000; margin-top:6px;
    }

    table{ width:100%; border-collapse:collapse; margin-top:14px; }
    th, td{ border-bottom:1px solid #eee; padding:10px 8px; font-size:12.5px; vertical-align:top; }
    th{ text-align:left; font-weight:1000; color:#333; background:#fafafa; }
    td.num, th.num{ text-align:right; white-space:nowrap; }

    .totals{
      margin-top:14px;
      display:flex; justify-content:flex-end;
    }
    .totBox{
      width:min(360px, 100%);
      border:1px solid #eee; border-radius:12px; padding:10px 12px;
      background:#fafafa;
      font-weight:1000;
    }
    .row{ display:flex; justify-content:space-between; gap:10px; padding:6px 0; }
    .note{
      margin-top:14px; font-size:12px; color:#444; font-weight:850; white-space:pre-wrap;
      border-top:1px solid #eee; padding-top:12px;
    }

    @media print{
      body{ background:#fff; }
      .topbar{ display:none !important; }
      .paper{ margin:0; border:none; border-radius:0; box-shadow:none; width:100%; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <a class="btn" id="backBtn" href="avoirs-liste.html">← Retour</a>
    <div style="display:flex; gap:8px;">
      <button class="btn primary" id="printBtn" type="button">Imprimer / PDF</button>
    </div>
  </div>

  <div class="paper">
    <div class="head">
      <div class="box">
        <div class="muted">Société</div>
        <div class="title" id="bizName">—</div>
        <div class="muted" id="bizLines">—</div>
      </div>

      <div class="box">
        <div class="muted">Client</div>
        <div class="title" id="clientName">—</div>
        <div class="muted" id="clientLines">—</div>
      </div>

      <div class="box" style="text-align:right;">
        <div class="title">AVOIR</div>
        <div class="bigNo" id="creditNumber">AVOIR N° —</div>
        <div class="muted" id="metaRight">—</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Désignation</th>
          <th class="num">Qté</th>
          <th>Unité</th>
          <th class="num">PU HT</th>
          <th class="num" id="thTVA" style="display:none;">TVA</th>
          <th class="num">Total TTC</th>
        </tr>
      </thead>
      <tbody id="linesTbody"></tbody>
    </table>

    <div class="totals">
      <div class="totBox" id="totBox"></div>
    </div>

    <div class="note" id="reasonBox" style="display:none;"></div>
    <div class="note" id="internalBox" style="display:none;"></div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const backBtn = document.getElementById("backBtn");
    const printBtn = document.getElementById("printBtn");

    const bizName = document.getElementById("bizName");
    const bizLines = document.getElementById("bizLines");
    const clientName = document.getElementById("clientName");
    const clientLines = document.getElementById("clientLines");
    const creditNumber = document.getElementById("creditNumber");
    const metaRight = document.getElementById("metaRight");

    const thTVA = document.getElementById("thTVA");
    const linesTbody = document.getElementById("linesTbody");
    const totBox = document.getElementById("totBox");
    const reasonBox = document.getElementById("reasonBox");
    const internalBox = document.getElementById("internalBox");

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    function computeTotals(lines, tvaEnabled, tvaRate){
      let ht = 0;
      for(const l of (Array.isArray(lines) ? lines : [])){
        const qty = Number(l?.qty)||0;
        const up  = Number(l?.unitPrice)||0;
        ht += qty * up;
      }
      const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    function renderProfile(profile){
      const bp = (profile?.businessProfile || {});
      const cName = String(bp.companyName || "Conciergerie").trim();

      const street = String(bp.address?.street || "").trim();
      const zip = String(bp.address?.zip || "").trim();
      const city = String(bp.address?.city || "").trim();

      const siret = String(bp.registration?.siret || "").trim();
      const ape = String(bp.registration?.ape || "").trim();

      const mail = String(bp.billingEmail || profile?.email || "").trim();
      const phone = String(bp.phone || "").trim();

      bizName.textContent = cName || "—";

      const lines = [];
      if(street) lines.push(esc(street));
      if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));

      const legal = [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • ");
      if(legal) lines.push(esc(legal));

      const contact = [mail, phone].filter(Boolean).join(" • ");
      if(contact) lines.push(esc(contact));

      bizLines.innerHTML = lines.length ? lines.join("<br>") : "—";

      return {
        vatEnabled: !!bp.vat?.enabled,
        vatRate: Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0,
        tvaExemptionText: String(bp?.tvaExemptionText || "TVA non applicable (art. 293B CGI)").trim()
      };
    }

    function renderDoc(d, vatCfg){
      const num = String(d.creditNumber || "").trim();
      creditNumber.textContent = `AVOIR N° ${num || "—"}`;

      const inv = String(d.fromInvoiceNumber || "—").trim();
      const date = String(d.creditIssuedDate || "").trim() || "—";
      metaRight.textContent = `Facture source : ${inv} • Date : ${date}`;

      const cn = String(d.clientName || "—").trim();
      clientName.textContent = cn || "—";

      const a1 = String(d.clientAddress1 || "").trim();
      const a2 = String(d.clientAddress2 || "").trim();
      const zip = String(d.clientZip || "").trim();
      const city = String(d.clientCity || "").trim();
      const mail = String(d.clientEmail || "").trim();
      const tel  = String(d.clientPhone || "").trim();

      const cl = [];
      if(a1) cl.push(esc(a1));
      if(a2) cl.push(esc(a2));
      if(zip || city) cl.push(esc([zip, city].filter(Boolean).join(" ")));
      const contact = [mail, tel].filter(Boolean).join(" • ");
      if(contact) cl.push(esc(contact));
      clientLines.innerHTML = cl.length ? cl.join("<br>") : "—";

      thTVA.style.display = vatCfg.vatEnabled ? "" : "none";
      linesTbody.innerHTML = "";

      const lines = Array.isArray(d.lines) ? d.lines : [];
      for(const l of lines){
        const label = l?.label || "Ligne";
        const qty = Number(l?.qty)||0;
        const unit = l?.unit || "unité";
        const up = Number(l?.unitPrice)||0;

        const lineHT = qty * up;
        const lineTVA = vatCfg.vatEnabled ? (lineHT * vatCfg.vatRate) : 0;
        const lineTTC = lineHT + lineTVA;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${esc(label)}</td>
          <td class="num">${esc(qty)}</td>
          <td>${esc(unit)}</td>
          <td class="num">${esc(fmtMoney(up))}</td>
          <td class="num" style="${vatCfg.vatEnabled ? "" : "display:none;"}">${vatCfg.vatEnabled ? esc(fmtMoney(lineTVA)) : ""}</td>
          <td class="num">-${esc(fmtMoney(lineTTC))}</td>
        `;
        linesTbody.appendChild(tr);
      }

      const totals = computeTotals(lines, vatCfg.vatEnabled, vatCfg.vatRate);

      if(vatCfg.vatEnabled){
        totBox.innerHTML = `
          <div class="row"><span>Total HT</span><span>-${esc(fmtMoney(totals.ht))}</span></div>
          <div class="row"><span>TVA (${Math.round(vatCfg.vatRate*100)}%)</span><span>-${esc(fmtMoney(totals.tva))}</span></div>
          <div class="row"><span>Total TTC</span><span>-${esc(fmtMoney(totals.ttc))}</span></div>
        `;
      }else{
        totBox.innerHTML = `
          <div class="row"><span>Total TTC</span><span>-${esc(fmtMoney(totals.ttc))}</span></div>
          <div class="muted" style="margin-top:6px;">${esc(vatCfg.tvaExemptionText)}</div>
        `;
      }

      const reason = String(d.creditReason || "").trim();
      if(reason){
        reasonBox.style.display = "block";
        reasonBox.innerHTML = `<b>Motif :</b>\n${esc(reason)}`;
      }else{
        reasonBox.style.display = "none";
      }

      const internal = String(d.creditNotes || "").trim();
      if(internal){
        internalBox.style.display = "block";
        internalBox.innerHTML = `<b>Notes internes :</b>\n${esc(internal)}`;
      }else{
        internalBox.style.display = "none";
      }
    }

    printBtn.addEventListener("click", ()=> window.print());

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=conciergerie"; return; }

      const docId = getParam("docId");
      const draft = getParam("draft");

      // back
      backBtn.href = docId ? `avoir.html?docId=${encodeURIComponent(docId)}` : "avoirs-liste.html";

      // profile
      const pSnap = await getDoc(doc(db,"users", user.uid));
      const profile = pSnap.exists() ? (pSnap.data()||{}) : {};
      const vatCfg = renderProfile(profile);

      // doc
      let d = null;
      if(draft === "1"){
        try{
          const raw = sessionStorage.getItem("creditDraftPreview");
          if(raw) d = JSON.parse(raw);
        }catch(_){}
      }

      if(!d){
        if(!docId) { alert("docId manquant"); return; }
        const snap = await getDoc(doc(db,"salesDocuments", docId));
        if(!snap.exists()) { alert("Avoir introuvable"); return; }
        d = { id:snap.id, ...(snap.data()||{}) };
      }

      renderDoc(d, vatCfg);
    });
  </script>
</body>
</html>
