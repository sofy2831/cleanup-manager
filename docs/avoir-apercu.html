<!-- docs/avoir-apercu.html (FINAL FIXED PRINT + owner mode + draft support) -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanUp Manager – Aperçu avoir</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
/* ===== STYLE IDENTIQUE A TA VERSION (raccourci ici pour lisibilité) ===== */
body{margin:0;font-family:Inter,system-ui;background:#F8F4FF;color:#111;}
.wrap{max-width:980px;margin:auto;padding:14px;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.pill{padding:8px 14px;border-radius:999px;border:2px solid #7A5CFF;background:#fff;color:#7A5CFF;font-weight:700;text-decoration:none;cursor:pointer}
.pill.primary{background:#7A5CFF;color:#fff;border:none}
.paper{background:#fff;padding:20px;border-radius:16px;box-shadow:0 14px 36px rgba(0,0,0,.08)}
.docTitle{text-align:center;font-weight:800;margin-top:10px}
.footer{margin-top:20px;text-align:center;font-size:11px;color:#555}
@media print{
.topbar{display:none}
body{background:#fff}
}
</style>
</head>

<body>
<div class="wrap">

<div class="topbar">
<a class="pill" id="backLink" href="#">← Retour</a>
<button class="pill primary" id="printBtn" type="button">Imprimer / PDF</button>
</div>

<div class="paper">
<h2 class="docTitle" id="docTitle">AVOIR N° —</h2>

<div id="content">Chargement…</div>

<div class="footer" id="footer">—</div>
</div>

</div>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const printBtn = document.getElementById("printBtn");
const backLink = document.getElementById("backLink");
const docTitleEl = document.getElementById("docTitle");
const contentEl = document.getElementById("content");
const footerEl = document.getElementById("footer");

let creditDoc = null;
let invDoc = null;

let currentCreditNumber = "";
let currentDocId = "";

function getParam(n){
  return (new URLSearchParams(location.search).get(n) || "").trim();
}

function isOwnerMode(){
  return getParam("owner") === "1";
}

function money(n){
  return Number(n||0).toLocaleString("fr-FR",{minimumFractionDigits:2})+" €";
}

/* ===== PRINT SAFE ===== */
printBtn.addEventListener("click", ()=>{
  const originalTitle = document.title;

  const numberRaw =
    String(currentCreditNumber || "").trim()
    || String(currentDocId || "").trim()
    || "Avoir";

  const safeNumber = numberRaw.replace(/[^\w\-]/g,"_");

  document.title = "CleanUp_Avoir_" + safeNumber;

  window.print();

  setTimeout(()=>{ document.title = originalTitle; },1000);
});

/* ===== AUTH + LOAD ===== */

onAuthStateChanged(auth, async(user)=>{

  if(!user){
    location.href = "login.html";
    return;
  }

  const docId = getParam("docId");
  currentDocId = docId;

  if(!docId){
    contentEl.textContent = "docId manquant.";
    return;
  }

  try{

    const snap = await getDoc(doc(db,"salesDocuments",docId));
    if(!snap.exists()){
      contentEl.textContent = "Avoir introuvable.";
      return;
    }

    const data = snap.data();
    creditDoc = { id:snap.id, ...data };

    if(String(data.type||"").toUpperCase() !== "CREDIT"){
      contentEl.textContent = "Document non valide.";
      return;
    }

    /* ===== OWNER SECURITY ===== */
    if(isOwnerMode()){
      if(String(data.ownerUid||"") !== user.uid){
        contentEl.textContent = "Accès refusé.";
        return;
      }
      backLink.href = "owner-facturation.html";
    }else{
      backLink.href = "factures-liste.html";
    }

    currentCreditNumber = String(data.creditNumber || "").trim();

    /* ===== LOAD INVOICE ===== */
    const invId = String(data.fromInvoiceDocId || "").trim();
    if(!invId){
      contentEl.textContent = "Facture liée manquante.";
      return;
    }

    const invSnap = await getDoc(doc(db,"salesDocuments",invId));
    if(!invSnap.exists()){
      contentEl.textContent = "Facture liée introuvable.";
      return;
    }

    invDoc = invSnap.data();

    /* ===== RENDER SIMPLE ===== */
    docTitleEl.textContent =
      currentCreditNumber
      ? "AVOIR N° " + currentCreditNumber
      : "AVOIR N° — (BROUILLON)";

    contentEl.innerHTML = `
      <p><strong>Facture :</strong> ${invDoc.invoiceNumber || "—"}</p>
      <p><strong>Client :</strong> ${invDoc.clientName || "—"}</p>
      <p><strong>Total remboursé :</strong> ${money(data.totalTTC)}</p>
      <p><strong>Motif :</strong> ${data.creditReason || "—"}</p>
    `;

    footerEl.textContent = "CleanUp Manager";

  }catch(e){
    console.error(e);
    contentEl.textContent = "Erreur chargement document.";
  }

});
</script>
</body>
</html>
