<!-- docs/avoir-apercu.html (FINAL — owner=1 support + security ownerUid + backLink owner + login owner/conciergerie + draft=1 conciergerie-only + PRINT FIX) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu avoir</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
      font-weight:400;
    }

    .wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px; padding-bottom:28px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:800; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer;
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .paper{
      width:100%; max-width:980px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      border-radius:16px;
      padding:16px;
      margin-top:10px;
      position:relative;
    }

    .header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .brandLeft{
      display:flex; gap:12px; align-items:center; min-width:0;
    }
    .logo{
      width:50px; height:50px; border-radius:14px;
      border:2px solid rgba(122,92,255,0.35);
      overflow:hidden; background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; color:var(--violet);
      flex-shrink:0;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:none; }

    .brand{ min-width:0; }
    .brand .name{ font-size:18px; font-weight:800; line-height:1.15; }
    .brand .sub{ display:none; }

    .metaRight{
      text-align:right;
      font-size:12px;
      color:#333;
      line-height:1.35;
      white-space:nowrap;
    }
    .metaRight b{ font-weight:700; }

    .docTitle{
      margin-top:10px;
      text-align:center;
      font-weight:800;
      font-size:14px;
      letter-spacing:.2px;
    }
    .docMeta{ display:none; }

    .grid2{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    @media(min-width:820px){
      .grid2{ grid-template-columns: 1fr 1fr; }
    }

    .box{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }
    .box h3{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }
    .line{
      font-size:12.5px;
      font-weight:500;
      color:#111;
      line-height:1.35;
      word-break:break-word;
    }
    .mut{ color:var(--muted); font-weight:500; }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      overflow:hidden;
      border-radius:12px;
    }
    thead th{
      text-align:left;
      font-size:11.5px;
      color:#444;
      font-weight:700;
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.07);
      background:rgba(248,244,255,.6);
    }
    tbody td{
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      font-size:12.5px;
      font-weight:500;
      vertical-align:top;
    }
    tbody tr:last-child td{ border-bottom:none; }
    .right{ text-align:right; white-space:nowrap; }

    .summary{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .totalBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }
    .totalRow{
      display:flex; justify-content:space-between; gap:10px; align-items:center;
      font-weight:700;
    }
    .totalRow .big{ font-size:17px; font-weight:800; }
    .totalSub{ margin-top:6px; font-size:11.5px; color:var(--muted); font-weight:500; }

    .payBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }
    .payBox h3{ margin:0 0 6px; font-size:12px; font-weight:800; color:#333; }

    .sectionTitle{
      margin-top:12px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    .footer{
      margin-top:12px;
      padding-top:10px;
      border-top:1px dashed rgba(122,92,255,0.35);
      text-align:center;
      font-size:11px;
      color:#444;
      font-weight:500;
      line-height:1.35;
    }

    .alert{
      width:100%; max-width:980px;
      margin-top:12px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-left:5px solid #b3261e;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px;
      font-size:12px;
      font-weight:600;
      color:#333;
      display:none;
      white-space:pre-wrap;
    }

    @media print{
      .topbar, button{ display:none !important; }
      body{ background:#fff !important; }
      @page{ margin: 8mm; }

      .paper{
        box-shadow:none !important;
        border:none !important;
        border-radius:0 !important;
        max-width:none !important;
        padding: 0 !important;
        position: relative;
      }

      .docTitle{ margin-top:6px !important; }
      .grid2{ grid-template-columns: 1fr 1fr !important; gap:6px !important; }
      .summary{ gap:6px !important; }
      .box, .totalBox, .payBox{ padding:6px 8px !important; }
      table{ margin-top:8px !important; }
      table thead th, table tbody td{ padding:6px 7px !important; }
      .sectionTitle{ margin-top:8px !important; }

      .footer{
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        border-top: 1px dashed rgba(0,0,0,0.25);
        padding-top: 4px;
        margin-top: 0 !important;
        font-size: 10px !important;
        line-height: 1.2 !important;
        text-align: center;
        background:#fff;
      }
      .paper{ padding-bottom: 12mm !important; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <a class="pill" id="backLink" href="#">← Retour</a>
      <button class="pill primary" id="printBtn" type="button">Imprimer / PDF</button>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="paper" id="paper">
      <div class="header">
        <div class="brandLeft">
          <div class="logo">
            <img id="logoImg" alt="Logo société">
            <span id="logoFallback">✓</span>
          </div>
          <div class="brand">
            <div class="name" id="companyName">Conciergerie</div>
            <div class="sub" id="companySub">—</div>
          </div>
        </div>

        <div class="metaRight" id="metaRight">
          <div><b>Émis le</b> —</div>
          <div><b>Facture</b> —</div>
        </div>
      </div>

      <div class="docTitle" id="docTitle">AVOIR N° —</div>
      <div class="docMeta" id="docMeta">—</div>

      <div class="grid2">
        <div class="box">
          <h3>Société</h3>
          <div class="line" id="socLine1">—</div>
          <div class="line" id="socLine2"></div>
          <div class="line" id="socLine3"></div>
          <div class="line mut" id="socLine4"></div>
        </div>

        <div class="box">
          <h3>Client</h3>
          <div class="line" id="cliLine1">—</div>
          <div class="line" id="cliLine2"></div>
          <div class="line" id="cliLine3"></div>
          <div class="line mut" id="cliLine4"></div>
        </div>
      </div>

      <div class="sectionTitle">Logement & période</div>
      <div class="box">
        <div class="line" id="homeLine1">—</div>
        <div class="line" id="homeLine2">—</div>
      </div>

      <div class="sectionTitle">Motif</div>
      <div class="box">
        <div class="line" id="reasonLine">—</div>
      </div>

      <table aria-label="Lignes avoir">
        <thead>
          <tr>
            <th>Prestation</th>
            <th class="right">Qté</th>
            <th class="right">PU</th>
            <th class="right">Total</th>
          </tr>
        </thead>
        <tbody id="linesBody"></tbody>
      </table>

      <div class="summary">
        <div class="totalBox">
          <div class="totalRow">
            <div>Total</div>
            <div class="big" id="totalTtc">0,00 €</div>
          </div>
          <div class="totalSub" id="tvaLine">TVA non applicable (art. 293B CGI)</div>
        </div>

        <div class="payBox">
          <h3>Références</h3>
          <div class="line" id="refInv">Facture : —</div>
          <div class="line" id="refNote">Avoir : montants en négatif</div>
        </div>
      </div>

      <div class="footer" id="footer">—</div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const printBtn = document.getElementById("printBtn");
    const backLink = document.getElementById("backLink");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");

    const companyNameEl = document.getElementById("companyName");
    const docTitleEl = document.getElementById("docTitle");
    const docMetaEl  = document.getElementById("docMeta");
    const metaRightEl = document.getElementById("metaRight");

    const soc1 = document.getElementById("socLine1");
    const soc2 = document.getElementById("socLine2");
    const soc3 = document.getElementById("socLine3");
    const soc4 = document.getElementById("socLine4");

    const cli1 = document.getElementById("cliLine1");
    const cli2 = document.getElementById("cliLine2");
    const cli3 = document.getElementById("cliLine3");
    const cli4 = document.getElementById("cliLine4");

    const homeLine1 = document.getElementById("homeLine1");
    const homeLine2 = document.getElementById("homeLine2");

    const reasonLine = document.getElementById("reasonLine");
    const refInv = document.getElementById("refInv");

    const linesBody = document.getElementById("linesBody");
    const totalTtcEl = document.getElementById("totalTtc");
    const tvaLineEl  = document.getElementById("tvaLine");

    const footerEl = document.getElementById("footer");

    let creditDoc = null;
    let invDoc = null;
    let isDraftPreview = false;

    // ✅ PRINT STATE (évite variables hors scope)
    let currentDocId = "";
    let currentCreditNumber = "";

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function showError(msg){
      alertBox.style.display = "block";
      alertBox.textContent = "⛔ " + msg;
    }
    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function isOwnerMode(){
      return getParam("owner") === "1";
    }
    function ddmmyyyy(d){
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yy = d.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }

    function computeTotals(linesArr, vatEnabled, vatRate){
      let ht = 0;
      for(const l of (Array.isArray(linesArr) ? linesArr : [])){
        ht += (Number(l?.qty)||0) * (Number(l?.unitPrice)||0);
      }
      const tva = vatEnabled ? (ht * (Number(vatRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    function applyBusinessProfile(profile){
      const bp = (profile?.businessProfile || {});
      const companyName = String(bp.companyName || "Conciergerie").trim();
      const logoUrl = String(bp.logoUrl || "").trim();

      const street = String(bp.address?.street || "").trim();
      const zip = String(bp.address?.zip || "").trim();
      const city = String(bp.address?.city || "").trim();

      const siret = String(bp.registration?.siret || "").trim();
      const ape   = String(bp.registration?.ape || "").trim();

      const email = String(bp.billingEmail || profile?.email || "").trim();
      const phone = String(bp.phone || "").trim();

      companyNameEl.textContent = companyName || "Conciergerie";

      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }

      soc1.textContent = companyName || "Conciergerie";
      soc2.textContent = street || "";
      soc3.textContent = [zip, city].filter(Boolean).join(" ") || "";
      soc4.textContent = [
        [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "),
        [email, phone].filter(Boolean).join(" • ")
      ].filter(Boolean).join(" • ");

      const footerParts = [];
      footerParts.push(companyName || "Conciergerie");
      if(street) footerParts.push(street);
      if(zip || city) footerParts.push([zip, city].filter(Boolean).join(" "));
      if(siret || ape) footerParts.push([siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "));
      if(email || phone) footerParts.push([email, phone].filter(Boolean).join(" • "));
      footerEl.innerHTML = footerParts.map(x=>esc(x)).join(" • ");

      return bp;
    }

    function getStayPeriod(d){
      const pick = (v)=> (String(v||"").trim() || "");
      const a = pick(d?.arrivalDateKey || d?.arrivalDate || d?.checkinDate || d?.arrival);
      const b = pick(d?.departureDateKey || d?.departureDate || d?.checkoutDate || d?.departure);
      if(a && b) return `Du ${a} au ${b}`;
      if(a && !b) return `À partir du ${a}`;
      if(!a && b) return `Jusqu’au ${b}`;
      return "—";
    }

    function renderClientHeader(d){
      const name = String(d?.clientName || "—").trim();
      const a1 = String(d?.clientAddress1 || "").trim();
      const a2 = String(d?.clientAddress2 || "").trim();
      const zip = String(d?.clientZip || "").trim();
      const city = String(d?.clientCity || "").trim();
      const email = String(d?.clientEmail || "").trim();
      const phone = String(d?.clientPhone || "").trim();

      cli1.textContent = name || "—";
      cli2.textContent = a1 || "";
      cli2.style.display = a1 ? "" : "none";

      const line3 = [a2, [zip, city].filter(Boolean).join(" ")].filter(Boolean).join(" • ");
      cli3.textContent = line3 || "";
      cli3.style.display = line3 ? "" : "none";

      const contact = [email, phone].filter(Boolean).join(" • ");
      cli4.textContent = contact || "";
      cli4.style.display = contact ? "" : "none";
    }

    function renderHeader(credit, invoice){
      const credNum = String(credit?.creditNumber || "").trim();
      const invNum  = String(credit?.fromInvoiceNumber || invoice?.invoiceNumber || "").trim();
      const issued = String(credit?.creditIssuedDate || "").trim() || ddmmyyyy(new Date());

      docTitleEl.textContent = credNum ? `AVOIR N° ${credNum}` : `AVOIR N° — (BROUILLON)`;
      metaRightEl.innerHTML = `
        <div><b>Émis le</b> ${esc(issued)}</div>
        <div><b>Facture</b> ${esc(invNum || "—")}</div>
      `;
      docMetaEl.textContent = `Émis le ${issued} • Facture ${invNum || "—"}`;

      refInv.textContent = `Facture : ${invNum || "—"}`;

      // ✅ alimente print state
      currentCreditNumber = credNum || "";
    }

    function renderHomeAndPeriod(invoice){
      const homeAddr = String(invoice?.homeAddress || "").trim();
      const homeZip  = String(invoice?.homeZip || "").trim();
      const homeCity = String(invoice?.homeCity || "").trim();
      const full = [homeAddr, [homeZip, homeCity].filter(Boolean).join(" ")].filter(Boolean).join(" • ");

      homeLine1.textContent = full ? `Adresse : ${full}` : "Adresse : —";
      homeLine2.textContent = `Période : ${getStayPeriod(invoice)}`;
    }

    function renderReason(credit){
      const r = String(credit?.creditReason || "").trim();
      reasonLine.textContent = r || "—";
    }

    function renderLines(invoice, businessProfile){
      const arr = Array.isArray(invoice?.lines) ? invoice.lines : [];
      linesBody.innerHTML = "";

      const vatEnabled = !!businessProfile?.vat?.enabled;
      const vatRate = Number.isFinite(Number(businessProfile?.vat?.rate)) ? Number(businessProfile.vat.rate) : 0;

      if(!arr.length){
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="4" class="mut">Aucune ligne</td>`;
        linesBody.appendChild(tr);
      }else{
        for(const l of arr){
          const qty = Number(l?.qty)||0;
          const up = Number(l?.unitPrice)||0;
          const ht = qty * up;
          const tva = vatEnabled ? (ht * vatRate) : 0;
          const total = ht + tva;
          const label = String(l?.label || "Prestation").trim();

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${esc(label)}</td>
            <td class="right">${esc(qty)}</td>
            <td class="right">${esc(money(up))}</td>
            <td class="right">${esc(money(-total))}</td>
          `;
          linesBody.appendChild(tr);
        }
      }

      const totals = computeTotals(arr, vatEnabled, vatRate);
      totalTtcEl.textContent = money(-totals.ttc);

      if(vatEnabled){
        tvaLineEl.textContent = `HT ${money(-totals.ht)} • TVA ${Math.round(vatRate*100)}% ${money(-totals.tva)}`;
      }else{
        const ex = String(businessProfile?.tvaExemptionText || "").trim();
        tvaLineEl.textContent = ex || "TVA non applicable (art. 293B CGI)";
      }
    }

    // ✅ PRINT FIX: plus de d/docId hors scope
    printBtn.addEventListener("click", ()=>{
      const originalTitle = document.title;

      const numberRaw =
        String(currentCreditNumber || "").trim()
        || String(currentDocId || "").trim()
        || "Avoir";

      const safeNumber = numberRaw.replace(/[^\w\-]/g, "_");
      document.title = "CleanUp_Avoir_" + safeNumber;

      window.print();

      setTimeout(()=>{ document.title = originalTitle; }, 1000);
    });

    function loadDraftFromSession(){
      try{
        const raw = sessionStorage.getItem("creditDraftPreview");
        if(!raw) return null;
        const draft = JSON.parse(raw);
        if(!draft || typeof draft !== "object") return null;
        return draft;
      }catch{
        return null;
      }
    }

    function loginRedirectUrl(){
      const token = getParam("token");
      const base = isOwnerMode() ? "login.html?role=proprietaire" : "login.html?role=conciergerie";
      return token ? (base + "&token=" + encodeURIComponent(token)) : base;
    }

    onAuthStateChanged(auth, async (user)=>{
      // backLink par défaut
      backLink.href = isOwnerMode() ? "owner-facturation.html" : "factures-liste.html";

      if(!user){
        location.href = loginRedirectUrl();
        return;
      }

      const docId = getParam("docId");
      currentDocId = docId; // ✅ pour print fallback
      isDraftPreview = (getParam("draft") === "1");

      try{
        // draft=1 => conciergerie only
        if(isDraftPreview){
          if(isOwnerMode()){
            showError("Mode propriétaire : aperçu brouillon non supporté.");
            backLink.href = "owner-facturation.html";
            return;
          }

          const draft = loadDraftFromSession();
          if(!draft || typeof draft !== "object"){
            showError("Prévisualisation brouillon impossible : sessionStorage vide.");
            backLink.href = "factures-liste.html";
            return;
          }

          creditDoc = { ...(draft||{}), id: String(docId||draft?.id||"").trim(), type:"CREDIT" };
          invDoc = draft._invoice || null;

          if(!invDoc){
            showError("Prévisualisation brouillon : facture (_invoice) manquante.");
            backLink.href = "factures-liste.html";
            return;
          }

          const cUid = String(invDoc.conciergerieUid||"").trim();
          if(cUid && cUid !== String(user.uid)){
            showError("Accès refusé (document d’une autre conciergerie).");
            backLink.href = "factures-liste.html";
            return;
          }

          backLink.href = `avoir.html?fromDocId=${encodeURIComponent(String(invDoc.id||"").trim())}`;

          const userSnap = await getDoc(doc(db,"users", user.uid));
          const profile = userSnap.exists() ? (userSnap.data()||{}) : {};
          const bp = applyBusinessProfile(profile);

          renderClientHeader(invDoc);
          renderHeader(creditDoc, invDoc);
          renderHomeAndPeriod(invDoc);
          renderReason(creditDoc);
          renderLines(invDoc, bp || {});
          return;
        }

        // mode normal => docId CREDIT obligatoire
        if(!docId){
          showError("docId manquant.");
          return;
        }

        // lecture avoir
        const creditSnap = await getDoc(doc(db, "salesDocuments", docId));
        if(!creditSnap.exists()){
          showError("Avoir introuvable.");
          return;
        }

        const data = creditSnap.data() || {};
        if(String(data.type||"").toUpperCase().trim() !== "CREDIT"){
          showError("docId n’est pas un avoir (type CREDIT).");
          return;
        }

        creditDoc = { id: creditSnap.id, ...data };

        // ✅ alimente print state dès maintenant
        currentCreditNumber = String(creditDoc.creditNumber || "").trim();

        // sécurité owner / conciergerie
        if(isOwnerMode()){
          const ouid = String(creditDoc.ownerUid || "").trim();
          if(!ouid){
            showError("Accès refusé : ownerUid manquant sur ce document.");
            backLink.href = "owner-facturation.html";
            return;
          }
          if(ouid !== String(user.uid)){
            showError("Accès refusé (document d’un autre propriétaire).");
            backLink.href = "owner-facturation.html";
            return;
          }
          backLink.href = "owner-facturation.html";
        }else{
          backLink.href = `avoir.html?docId=${encodeURIComponent(docId)}`;
        }

        const invId = String(creditDoc.fromInvoiceDocId || "").trim();
        if(!invId){
          showError("Avoir sans facture liée (fromInvoiceDocId manquant).");
          return;
        }

        const invSnap = await getDoc(doc(db, "salesDocuments", invId));
        if(!invSnap.exists()){
          showError("Facture liée introuvable.");
          return;
        }
        invDoc = { id: invSnap.id, ...(invSnap.data()||{}) };

        // sécurité conciergerie (si non-owner mode)
        if(!isOwnerMode()){
          const cUid = String(invDoc.conciergerieUid||"").trim();
          if(cUid && cUid !== String(user.uid)){
            showError("Accès refusé (document d’une autre conciergerie).");
            backLink.href = "factures-liste.html";
            return;
          }
          backLink.href = `avoir.html?docId=${encodeURIComponent(docId)}&fromDocId=${encodeURIComponent(invId)}`;
        }

        // profile société = conciergerieUid du doc
        const conciergerieUid = String(invDoc.conciergerieUid || creditDoc.conciergerieUid || "").trim();
        if(!conciergerieUid){
          showError("conciergerieUid manquant (facture liée).");
          return;
        }

        const userSnap = await getDoc(doc(db,"users", conciergerieUid));
        const profile = userSnap.exists() ? (userSnap.data()||{}) : {};
        const bp = applyBusinessProfile(profile);

        // rendu
        renderClientHeader(invDoc);
        renderHeader(creditDoc, invDoc);
        renderHomeAndPeriod(invDoc);
        renderReason(creditDoc);
        renderLines(invDoc, bp || {});
      }catch(e){
        console.error(e);
        showError(e?.message || "Erreur chargement aperçu avoir.");
      }
    });
  </script>
</body>
</html>
