<!-- docs/avoir-apercu.html (FINAL PREMIUM — style aligné devis/facture + owner sécurisé + draft conciergerie + print A4 propre) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu avoir</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --violet-soft:#EEE8FF;
      --violet-soft-2:#F7F3FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#171717;
      --muted:#66615a;
      --line:rgba(122,92,255,0.16);
      --line-soft:rgba(23,23,23,0.06);
      --shadow:0 16px 40px rgba(0,0,0,0.08);
      --max:1120px;
    }

    *{ box-sizing:border-box; }
    html,body{ margin:0; padding:0; }

    body{
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%);
      color:var(--text);
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .topbar{
      position:sticky;
      top:0;
      z-index:20;
      background:rgba(248,244,255,0.92);
      backdrop-filter:blur(16px);
      border-bottom:1px solid var(--line);
    }

    .topbar-inner{
      width:min(var(--max),calc(100% - 32px));
      margin:0 auto;
      min-height:72px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
      padding:12px 0;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:14px;
      min-width:0;
    }

    .brand-mark{
      width:54px;
      height:54px;
      border-radius:16px;
      border:2px solid rgba(122,92,255,0.28);
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--violet);
      font-weight:900;
      font-size:28px;
      overflow:hidden;
      flex-shrink:0;
      box-shadow:0 4px 14px rgba(0,0,0,0.06);
    }

    .brand-mark img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }

    .brand-name{
      font-size:1.05rem;
      font-weight:900;
      letter-spacing:-0.03em;
      color:var(--text);
      line-height:1.1;
      word-break:break-word;
    }

    .actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .btn{
      min-height:44px;
      padding:0 16px;
      border-radius:999px;
      border:1px solid var(--line);
      background:#fff;
      color:var(--violet);
      text-decoration:none;
      font:inherit;
      font-weight:800;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,0.06);
      white-space:nowrap;
    }

    .btn-primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      border-color:transparent;
      box-shadow:0 10px 22px rgba(0,0,0,0.12);
    }

    .wrap{
      width:min(var(--max),calc(100% - 32px));
      margin:28px auto 56px;
    }

    .alert{
      display:none;
      margin-bottom:14px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-left:5px solid #b3261e;
      border-radius:16px;
      box-shadow:0 3px 10px rgba(0,0,0,0.06);
      padding:12px 14px;
      font-size:12.5px;
      font-weight:700;
      color:#333;
      white-space:pre-wrap;
    }

    .sheet{
      background:#fff;
      border:1px solid var(--line);
      border-radius:24px;
      box-shadow:var(--shadow);
      padding:26px;
      min-height:calc(100vh - 175px);
      display:flex;
      flex-direction:column;
    }

    .top-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      align-items:stretch;
    }

    .panel{
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      padding:18px;
      min-height:170px;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
    }

    .panel h2{
      margin:0 0 10px;
      font-size:1rem;
      letter-spacing:-.02em;
      font-weight:900;
    }

    .logo-wrap{
      flex:1;
      display:flex;
      align-items:flex-start;
      justify-content:flex-start;
      padding-top:4px;
    }

    .logo-box{
      width:124px;
      height:124px;
      border:1px solid var(--line);
      border-radius:14px;
      background:var(--violet-soft-2);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:var(--violet);
      font-size:54px;
      font-weight:900;
    }

    .logo-box img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:none;
    }

    .doc-head{
      display:grid;
      gap:8px;
      align-content:start;
    }

    .doc-title{
      font-size:1.55rem;
      font-weight:900;
      letter-spacing:-.05em;
      margin:0;
    }

    .doc-number{
      font-size:1.1rem;
      font-weight:800;
      letter-spacing:-.02em;
    }

    .meta{
      display:grid;
      gap:6px;
      font-size:.95rem;
      line-height:1.5;
    }

    .section{
      margin-top:18px;
    }

    .section-title{
      margin:0 0 10px;
      font-size:1rem;
      font-weight:900;
      letter-spacing:-.02em;
    }

    .simple-box{
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      padding:18px;
    }

    .table-wrap{
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      background:#fff;
    }

    table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
    }

    th, td{
      padding:14px 16px;
      border-bottom:1px solid var(--line-soft);
      text-align:left;
      vertical-align:top;
      font-size:.95rem;
      word-break:break-word;
    }

    thead th{
      background:var(--violet-soft-2);
      font-size:.88rem;
      font-weight:800;
    }

    tbody tr:last-child td{
      border-bottom:none;
    }

    .num{
      text-align:right;
      white-space:nowrap;
    }

    .mobile-cards{
      display:none;
      margin-top:12px;
      flex-direction:column;
      gap:10px;
    }

    .line-card{
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      box-shadow:0 3px 10px rgba(0,0,0,0.06);
      padding:14px;
    }

    .line-card-title{
      font-size:13.5px;
      font-weight:900;
      color:#111;
      line-height:1.35;
    }

    .line-card-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:8px;
      margin-top:10px;
    }

    .line-card-cell{
      background:var(--violet-soft-2);
      border-radius:12px;
      padding:8px 10px;
      font-size:12px;
      line-height:1.35;
      font-weight:700;
      color:#222;
    }

    .line-card-cell b{
      font-weight:900;
    }

    .summary-grid{
      display:grid;
      grid-template-columns:1fr 360px;
      gap:18px;
      margin-top:18px;
      align-items:start;
    }

    .totals{
      border:1px solid var(--line);
      border-radius:18px;
      overflow:hidden;
      background:#fff;
    }

    .totals-row{
      display:grid;
      grid-template-columns:1fr auto;
      gap:12px;
      padding:14px 16px;
      border-bottom:1px solid var(--line-soft);
    }

    .totals-row:last-child{ border-bottom:none; }

    .grand-total{
      background:var(--violet-soft);
      font-weight:900;
    }

    .ref-box{
      border:1px solid var(--line);
      border-radius:18px;
      background:#fff;
      padding:18px;
    }

    .ref-box h2{
      margin:0 0 10px;
      font-size:1rem;
      letter-spacing:-.02em;
      font-weight:900;
    }

    .footer{
      margin-top:auto;
      padding-top:16px;
      border-top:1px solid var(--line);
      text-align:center;
      color:#4f4942;
      font-size:.92rem;
      line-height:1.6;
    }

    @media (max-width: 920px){
      .top-grid,
      .summary-grid{
        grid-template-columns:1fr;
      }

      .sheet{
        padding:22px;
        min-height:auto;
      }

      .panel{
        min-height:auto;
      }
    }

    @media (max-width: 760px){
      .table-wrap{ display:none; }
      .mobile-cards{ display:flex; }
    }

    @media (max-width: 720px){
      .topbar-inner{
        min-height:auto;
        padding:14px 0;
        flex-direction:column;
        align-items:stretch;
      }

      .brand,
      .actions{
        justify-content:center;
      }

      .actions{
        width:100%;
      }

      .btn{
        flex:1 1 auto;
      }
    }

    @media (max-width: 640px){
      .line-card-grid{
        grid-template-columns:1fr;
      }
    }

    @media print{
      @page{
        size:A4;
        margin:8mm;
      }

      html, body{
        height:auto;
      }

      body{
        background:#fff !important;
        font-size:11px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .topbar,
      .alert{
        display:none !important;
      }

      .wrap{
        width:100%;
        margin:0;
      }

      .sheet{
        box-shadow:none !important;
        border:none !important;
        border-radius:0 !important;
        padding:6px 6px 12mm !important;
        min-height:277mm;
        display:flex;
        flex-direction:column;
      }

      .top-grid{
        grid-template-columns:1fr 1fr !important;
        gap:8px !important;
      }

      .summary-grid{
        grid-template-columns:1fr 300px !important;
        gap:8px !important;
        margin-top:10px !important;
      }

      .section{
        margin-top:12px !important;
      }

      .panel,
      .simple-box,
      .ref-box{
        padding:8px 10px !important;
        border-radius:12px !important;
        background:#fff !important;
        page-break-inside:avoid;
        break-inside:avoid;
      }

      .panel{
        min-height:128px !important;
      }

      .logo-box{
        width:88px !important;
        height:88px !important;
        font-size:40px !important;
      }

      .doc-title{
        font-size:17px !important;
        margin:0 0 4px !important;
      }

      .doc-number{
        font-size:12px !important;
      }

      .meta{
        font-size:11px !important;
        line-height:1.35 !important;
        gap:4px !important;
      }

      .table-wrap,
      .totals{
        background:#fff !important;
        page-break-inside:avoid;
        break-inside:avoid;
      }

      .mobile-cards{
        display:none !important;
      }

      table{
        margin-top:0 !important;
      }

      thead th{
        font-size:10px !important;
        padding:6px 8px !important;
        background:var(--violet-soft-2) !important;
      }

      tbody td{
        font-size:10px !important;
        padding:6px 8px !important;
        line-height:1.25 !important;
      }

      .totals-row{
        padding:9px 10px !important;
        font-size:11px !important;
      }

      .grand-total{
        background:var(--violet-soft) !important;
      }

      .footer{
        margin-top:8px !important;
        padding-top:6px !important;
        font-size:9px !important;
        line-height:1.2 !important;
      }
    }
  </style>
</head>

<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <div class="brand-mark">
          <img id="topLogoImg" alt="Logo">
          <span id="topLogoFallback">✓</span>
        </div>
        <div class="brand-name" id="topBrandName">CleanUp Manager</div>
      </div>

      <div class="actions">
        <a class="btn" id="backLink" href="#">Retour</a>
        <button class="btn btn-primary" id="printBtn" type="button">Imprimer / PDF</button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div class="alert" id="alertBox"></div>

    <article class="sheet" id="paper">
      <section class="top-grid">
        <div class="panel">
          <div class="logo-wrap">
            <div id="logoBox" class="logo-box">
              <img id="logoImg" alt="Logo société">
              <span id="logoFallback">✓</span>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="doc-head">
            <h1 class="doc-title">Avoir</h1>
            <div class="doc-number" id="docTitle">AVOIR N° —</div>
            <div id="metaIssued">Émis le : —</div>
            <div id="metaOrigin">Facture d'origine : —</div>
          </div>
        </div>

        <div class="panel">
          <h2>Société</h2>
          <div class="meta" id="businessBlock"></div>
        </div>

        <div class="panel">
          <h2>Client</h2>
          <div class="meta" id="clientBlock"></div>
        </div>
      </section>

      <section class="section">
        <div class="simple-box">
          <h2 class="section-title" style="margin-top:0;">Logement & période</h2>
          <div class="meta" id="homeBlock"></div>
        </div>
      </section>

      <section class="section">
        <div class="simple-box">
          <h2 class="section-title" style="margin-top:0;">Motif</h2>
          <div class="meta" id="reasonBlock"></div>
        </div>
      </section>

      <section class="section">
        <div class="table-wrap">
          <table aria-label="Lignes avoir">
            <thead>
              <tr>
                <th style="width:34%;">Prestation</th>
                <th class="num" style="width:10%;">Qté</th>
                <th class="num" style="width:14%;">PU HT</th>
                <th class="num" style="width:14%;">Total HT</th>
                <th class="num" style="width:13%;">TVA</th>
                <th class="num" style="width:15%;">Total TTC</th>
              </tr>
            </thead>
            <tbody id="linesBody"></tbody>
          </table>
        </div>

        <div class="mobile-cards" id="linesCards"></div>

        <div class="summary-grid">
          <div>
            <div class="ref-box">
              <h2>Références</h2>
              <div id="refsBlock" class="meta"></div>
            </div>
          </div>

          <div>
            <div class="totals">
              <div class="totals-row">
                <span>Total HT</span>
                <strong id="totalHt">0,00 €</strong>
              </div>

              <div class="totals-row">
                <span>TVA</span>
                <strong id="totalTva">0,00 €</strong>
              </div>

              <div class="totals-row grand-total">
                <span>Total TTC</span>
                <strong id="totalTtc">0,00 €</strong>
              </div>
            </div>

            <div class="ref-box" style="margin-top:12px;">
              <h2>TVA</h2>
              <div id="tvaLine" class="meta">TVA non applicable (art. 293 B du CGI)</div>
            </div>
          </div>
        </div>
      </section>

      <footer class="footer" id="footer">—</footer>
    </article>
  </main>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const printBtn = document.getElementById("printBtn");
    const backLink = document.getElementById("backLink");

    const topLogoImg = document.getElementById("topLogoImg");
    const topLogoFallback = document.getElementById("topLogoFallback");
    const topBrandName = document.getElementById("topBrandName");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");
    const docTitleEl = document.getElementById("docTitle");
    const metaIssued = document.getElementById("metaIssued");
    const metaOrigin = document.getElementById("metaOrigin");

    const businessBlock = document.getElementById("businessBlock");
    const clientBlock = document.getElementById("clientBlock");
    const homeBlock = document.getElementById("homeBlock");
    const reasonBlock = document.getElementById("reasonBlock");
    const refsBlock = document.getElementById("refsBlock");

    const linesBody = document.getElementById("linesBody");
    const linesCards = document.getElementById("linesCards");
    const totalHtEl = document.getElementById("totalHt");
    const totalTvaEl = document.getElementById("totalTva");
    const totalTtcEl = document.getElementById("totalTtc");
    const tvaLineEl  = document.getElementById("tvaLine");

    const footerEl = document.getElementById("footer");
    const paper = document.getElementById("paper");

    let creditDoc = null;
    let invDoc = null;
    let currentDocId = "";
    let currentCreditNumber = "";
    let isOwnerView = false;
    let isDraftView = false;

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function showError(msg){
      alertBox.style.display = "block";
      alertBox.textContent = "⛔ " + msg;
    }

    function showWarn(msg){
      alertBox.style.display = "block";
      alertBox.textContent = "⚠️ " + msg;
    }

    function line(text){
      return `<div>${esc(text)}</div>`;
    }

    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " €";
    }

    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    function ddmmyyyy(d){
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yy = d.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }

    function normalizeEmail(s){
      return String(s||"").trim().toLowerCase();
    }

    function getStayPeriod(d){
      const pick = (v)=> String(v||"").trim();
      const a = pick(d?.arrivalDateKey || d?.arrivalDate || d?.checkinDate || d?.arrival);
      const b = pick(d?.departureDateKey || d?.departureDate || d?.checkoutDate || d?.departure);
      if(a && b) return `Du ${a} au ${b}`;
      if(a && !b) return `À partir du ${a}`;
      if(!a && b) return `Jusqu’au ${b}`;
      return "—";
    }

    function getNormalizedClientSource(d){
      const cs = (d?.clientSnapshot && typeof d.clientSnapshot === "object") ? d.clientSnapshot : null;
      return {
        ownerDocId: String(cs?.ownerDocId || d?.clientOwnerDocId || d?.ownerDocId || "").trim(),
        ownerUid: String(cs?.ownerUid || d?.ownerUid || "").trim(),
        name: String(cs?.name || d?.clientName || d?.ownerName || "").trim(),
        email: normalizeEmail(cs?.email || d?.clientEmail || d?.ownerEmail || ""),
        phone: String(cs?.phone || d?.clientPhone || d?.ownerPhone || "").trim(),
        address1: String(cs?.address1 || d?.clientAddress1 || d?.ownerAddress1 || d?.clientAddress || "").trim(),
        address2: String(cs?.address2 || d?.clientAddress2 || d?.ownerAddress2 || "").trim(),
        zip: String(cs?.zip || d?.clientZip || d?.ownerZip || "").trim(),
        city: String(cs?.city || d?.clientCity || d?.ownerCity || "").trim(),
        country: String(cs?.country || d?.clientCountry || d?.ownerCountry || "FR").trim()
      };
    }

    function getLineStoredHT(l){
      const qty = Number(l?.qty) || 0;
      const pu = Number(l?.unitPrice) || 0;
      if(Number.isFinite(Number(l?.totalHT))) return Number(l.totalHT);
      return qty * pu;
    }

    function getLineStoredTVA(l){
      if(Number.isFinite(Number(l?.totalTVA))) return Number(l.totalTVA);
      return 0;
    }

    function getLineStoredTTC(l){
      if(Number.isFinite(Number(l?.totalTTC))) return Number(l.totalTTC);
      return getLineStoredHT(l) + getLineStoredTVA(l);
    }

    function getDocumentTotalsStored(docLike){
      const totals = (docLike?.totals && typeof docLike.totals === "object") ? docLike.totals : null;
      if(totals){
        return {
          ht: Number(totals.ht || docLike?.totalHT || 0),
          tva: Number(totals.tva || docLike?.totalTVA || 0),
          ttc: Number(totals.ttc || docLike?.totalTTC || 0)
        };
      }

      if(
        Number.isFinite(Number(docLike?.totalHT)) ||
        Number.isFinite(Number(docLike?.totalTVA)) ||
        Number.isFinite(Number(docLike?.totalTTC))
      ){
        return {
          ht: Number(docLike?.totalHT || 0),
          tva: Number(docLike?.totalTVA || 0),
          ttc: Number(docLike?.totalTTC || 0)
        };
      }

      const lines = Array.isArray(docLike?.lines) ? docLike.lines : [];
      let ht = 0, tva = 0, ttc = 0;
      for(const l of lines){
        ht += getLineStoredHT(l);
        tva += getLineStoredTVA(l);
        ttc += getLineStoredTTC(l);
      }
      return { ht, tva, ttc };
    }

    function getVatContext(docLike){
      const bs = (docLike?.businessSnapshot && typeof docLike.businessSnapshot === "object") ? docLike.businessSnapshot : {};
      const vat = docLike?.vatSnapshot || bs?.vat || {};
      const totals = getDocumentTotalsStored(docLike);

      return {
        enabled: !!vat?.enabled || Number(totals.tva || 0) > 0,
        serviceRate: Number.isFinite(Number(vat?.serviceRate)) ? Number(vat.serviceRate) : 0.20,
        productRate: Number.isFinite(Number(vat?.productRate)) ? Number(vat.productRate) : 0.10
      };
    }

    function buildBusinessMerged(credit, invoice, profile){
      const bp = profile?.businessProfile || {};
      const creditBS = (credit?.businessSnapshot && typeof credit.businessSnapshot === "object") ? credit.businessSnapshot : {};
      const invBS = (invoice?.businessSnapshot && typeof invoice.businessSnapshot === "object") ? invoice.businessSnapshot : {};

      return {
        companyName:
          creditBS.companyName ||
          invBS.companyName ||
          bp.companyName ||
          credit?.businessName ||
          invoice?.businessName ||
          "Conciergerie",

        logoUrl:
          creditBS.logoUrl ||
          invBS.logoUrl ||
          bp.logoUrl ||
          credit?.businessLogoUrl ||
          invoice?.businessLogoUrl ||
          "",

        address: {
          street:
            creditBS.address?.street ||
            invBS.address?.street ||
            credit?.businessAddressStreet ||
            invoice?.businessAddressStreet ||
            bp.address?.street ||
            "",
          zip:
            creditBS.address?.zip ||
            invBS.address?.zip ||
            credit?.businessAddressZip ||
            invoice?.businessAddressZip ||
            bp.address?.zip ||
            "",
          city:
            creditBS.address?.city ||
            invBS.address?.city ||
            credit?.businessAddressCity ||
            invoice?.businessAddressCity ||
            bp.address?.city ||
            ""
        },

        registration: {
          siret:
            creditBS.registration?.siret ||
            invBS.registration?.siret ||
            credit?.businessSiret ||
            invoice?.businessSiret ||
            bp.registration?.siret ||
            "",
          ape:
            creditBS.registration?.ape ||
            invBS.registration?.ape ||
            credit?.businessApe ||
            invoice?.businessApe ||
            bp.registration?.ape ||
            ""
        },

        billingEmail:
          creditBS.billingEmail ||
          creditBS.contact?.email ||
          invBS.billingEmail ||
          invBS.contact?.email ||
          credit?.businessEmail ||
          invoice?.businessEmail ||
          bp.billingEmail ||
          profile?.email ||
          "",

        phone:
          creditBS.phone ||
          creditBS.contact?.phone ||
          invBS.phone ||
          invBS.contact?.phone ||
          credit?.businessPhone ||
          invoice?.businessPhone ||
          bp.phone ||
          "",

        tvaExemptionText:
          creditBS.tvaExemptionText ||
          invBS.tvaExemptionText ||
          credit?.tvaExemptionText ||
          invoice?.tvaExemptionText ||
          bp.tvaExemptionText ||
          "TVA non applicable (art. 293 B du CGI)"
      };
    }

    function applyBusinessSnapshot(credit, invoice, profile){
      const src = buildBusinessMerged(credit, invoice, profile);

      const companyName = String(src.companyName || "Conciergerie").trim();
      const logoUrl = String(src.logoUrl || "").trim();
      const street = String(src.address?.street || "").trim();
      const zip = String(src.address?.zip || "").trim();
      const city = String(src.address?.city || "").trim();
      const siret = String(src.registration?.siret || "").trim();
      const ape = String(src.registration?.ape || "").trim();
      const email = String(src.billingEmail || "").trim();
      const phone = String(src.phone || "").trim();

      topBrandName.textContent = companyName || "CleanUp Manager";

      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";

        topLogoImg.src = logoUrl;
        topLogoImg.style.display = "block";
        topLogoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";

        topLogoImg.style.display = "none";
        topLogoFallback.style.display = "block";
      }

      const rows = [];
      if(companyName) rows.push(line(companyName));
      if(street) rows.push(line(street));
      if(zip || city) rows.push(line([zip, city].filter(Boolean).join(" ")));

      const legalBits = [];
      if(siret) legalBits.push(`SIRET ${siret}`);
      if(ape) legalBits.push(`APE ${ape}`);
      if(email) legalBits.push(email);
      if(phone) legalBits.push(phone);

      if(legalBits.length){
        rows.push(`<div style="color:#66615a;">${esc(legalBits.join(" • "))}</div>`);
      }

      businessBlock.innerHTML = rows.join("") || "<div>Conciergerie</div>";

      const footerParts = [];
      if(companyName) footerParts.push(companyName);
      if(street) footerParts.push(street);
      if(zip || city) footerParts.push([zip, city].filter(Boolean).join(" "));
      if(siret || ape) footerParts.push([siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • "));
      if(email || phone) footerParts.push([email, phone].filter(Boolean).join(" • "));

      footerEl.textContent = footerParts.join(" • ") || "Document édité par CleanUp Manager";

      return src;
    }

    function mergeClientSnapshots(primary, secondary){
      const a = primary || {};
      const b = secondary || {};
      return {
        ownerDocId: String(a.ownerDocId || b.ownerDocId || "").trim(),
        ownerUid: String(a.ownerUid || b.ownerUid || "").trim(),
        name: String(a.name || b.name || "").trim(),
        email: String(a.email || b.email || "").trim(),
        phone: String(a.phone || b.phone || "").trim(),
        address1: String(a.address1 || b.address1 || "").trim(),
        address2: String(a.address2 || b.address2 || "").trim(),
        zip: String(a.zip || b.zip || "").trim(),
        city: String(a.city || b.city || "").trim(),
        country: String(a.country || b.country || "FR").trim()
      };
    }

    function renderClientHeader(snapshot){
      const s = snapshot || {};
      const rows = [];

      if(s.name) rows.push(line(s.name));
      if(s.address1) rows.push(line(s.address1));
      if(s.address2) rows.push(line(s.address2));
      if(s.zip || s.city) rows.push(line([s.zip, s.city].filter(Boolean).join(" ")));

      const contact = [s.email, s.phone].filter(Boolean);
      if(contact.length){
        rows.push(`<div style="color:#66615a;">${esc(contact.join(" • "))}</div>`);
      }

      clientBlock.innerHTML = rows.join("") || "<div>—</div>";
    }

    function renderHeader(credit, invoice){
      const credNum = String(credit?.creditNumber || "").trim();
      const invNum  = String(credit?.fromInvoiceNumber || invoice?.invoiceNumber || "").trim();
      const issued = String(credit?.creditIssuedDate || "").trim() || ddmmyyyy(new Date());

      docTitleEl.textContent = credNum ? `AVOIR N° ${credNum}` : `AVOIR N° —`;
      metaIssued.textContent = `Émis le : ${issued}`;
      metaOrigin.textContent = `Facture d'origine : ${invNum || "—"}`;

      const refs = [];
      refs.push(line(`Facture : ${invNum || "—"}`));
      refs.push(line(`Avoir : ${credNum || "—"}`));
      refs.push(line(`Émis le : ${issued}`));
      refsBlock.innerHTML = refs.join("");

      currentCreditNumber = credNum || "";
    }

    function renderHomeAndPeriod(invoice){
      const homeAddr = String(invoice?.homeAddress || "").trim();
      const homeZip  = String(invoice?.homeZip || "").trim();
      const homeCity = String(invoice?.homeCity || "").trim();
      const full = [homeAddr, [homeZip, homeCity].filter(Boolean).join(" ")].filter(Boolean).join(" • ");

      const rows = [];
      rows.push(line(`Adresse : ${full || "—"}`));
      rows.push(line(`Période : ${getStayPeriod(invoice)}`));
      homeBlock.innerHTML = rows.join("");
    }

    function renderReason(credit){
      const r = String(credit?.creditReason || "").trim();
      reasonBlock.innerHTML = line(r || "—");
    }

    function renderLines(credit, invoice, businessLike){
      const arr = Array.isArray(credit?.lines) && credit.lines.length
        ? credit.lines
        : (Array.isArray(invoice?.lines) ? invoice.lines : []);

      linesBody.innerHTML = "";
      linesCards.innerHTML = "";

      const totals = getDocumentTotalsStored(credit);
      const vat = getVatContext(credit);

      if(!arr.length){
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="6" style="color:#66615a;">Aucune ligne</td>`;
        linesBody.appendChild(tr);
      }else{
        for(const l of arr){
          const qty = Number(l?.qty)||0;
          const up = Number(l?.unitPrice)||0;
          const ht = getLineStoredHT(l);
          const tva = getLineStoredTVA(l);
          const total = getLineStoredTTC(l);
          const label = String(l?.label || "Prestation").trim();
          const unit = String(l?.unit || "unité").trim();
          const ratePct = Math.round((Number(l?.vatRate || 0)) * 100);
          const tvaLabel = vat.enabled ? `${ratePct}% • ${money(-tva)}` : "0% • 0,00 €";

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${esc(label)}</td>
            <td class="num">${esc(String(qty))}</td>
            <td class="num">${esc(money(-up))}</td>
            <td class="num">${esc(money(-ht))}</td>
            <td class="num">${esc(tvaLabel)}</td>
            <td class="num">${esc(money(-total))}</td>
          `;
          linesBody.appendChild(tr);

          const card = document.createElement("div");
          card.className = "line-card";
          card.innerHTML = `
            <div class="line-card-title">${esc(label)}</div>
            <div class="line-card-grid">
              <div class="line-card-cell"><b>Qté</b> : ${esc(String(qty))}</div>
              <div class="line-card-cell"><b>Unité</b> : ${esc(unit)}</div>
              <div class="line-card-cell"><b>PU HT</b> : ${esc(money(-up))}</div>
              <div class="line-card-cell"><b>Total HT</b> : ${esc(money(-ht))}</div>
              <div class="line-card-cell"><b>TVA</b> : ${esc(tvaLabel)}</div>
              <div class="line-card-cell"><b>Total TTC</b> : ${esc(money(-total))}</div>
            </div>
          `;
          linesCards.appendChild(card);
        }
      }

      totalHtEl.textContent = money(-totals.ht);
      totalTvaEl.textContent = money(-totals.tva);
      totalTtcEl.textContent = money(-totals.ttc);

      if(Number(totals.tva) > 0){
        tvaLineEl.textContent = `HT ${money(-totals.ht)} • TVA ${money(-totals.tva)}`;
      }else{
        tvaLineEl.textContent = String(
          credit?.businessSnapshot?.tvaExemptionText ||
          invoice?.businessSnapshot?.tvaExemptionText ||
          businessLike?.tvaExemptionText ||
          "TVA non applicable (art. 293 B du CGI)"
        ).trim();
      }
    }

    printBtn.addEventListener("click", ()=>{
      const originalTitle = document.title;
      const numberRaw =
        String(currentCreditNumber || "").trim()
        || String(currentDocId || "").trim()
        || "Avoir";

      const safeNumber = numberRaw.replace(/[^\w\-]/g, "_");
      document.title = "CleanUp_Avoir_" + safeNumber;

      window.print();

      setTimeout(()=>{ document.title = originalTitle; }, 1000);
    });

    function loginRedirectUrl(){
      const token = getParam("token");
      const base = isOwnerView ? "login.html?role=proprietaire" : "login.html?role=conciergerie";
      return token ? (base + "&token=" + encodeURIComponent(token)) : base;
    }

    function loadDraftFromSession(){
      try{
        const raw = sessionStorage.getItem("creditDraftPreview");
        if(!raw) return null;
        const draft = JSON.parse(raw);
        if(!draft || typeof draft !== "object") return null;
        return draft;
      }catch(e){
        return null;
      }
    }

    onAuthStateChanged(auth, async (user)=>{
      isOwnerView = getParam("owner") === "1";
      isDraftView = getParam("draft") === "1";
      backLink.href = isOwnerView ? "owner-facturation.html" : "factures-liste.html";

      if(!user){
        location.href = loginRedirectUrl();
        return;
      }

      const docId = getParam("docId");
      currentDocId = docId || "";

      try{
        if(isOwnerView && isDraftView){
          showError("Accès refusé sur un brouillon.");
          paper.style.display = "none";
          return;
        }

        if(isDraftView && !isOwnerView){
          const draft = loadDraftFromSession();
          if(draft && draft._invoice){
            const profileSnap = await getDoc(doc(db, "users", user.uid));
            const profile = profileSnap.exists() ? (profileSnap.data() || {}) : {};

            creditDoc = { id: docId || "DRAFT", ...draft };
            invDoc = { ...(draft._invoice || {}) };

            const businessLike = applyBusinessSnapshot(creditDoc, invDoc, profile);
            const creditClient = getNormalizedClientSource(creditDoc);
            const invClient = getNormalizedClientSource(invDoc);
            const mergedClient = mergeClientSnapshots(creditClient, invClient);

            renderClientHeader(mergedClient);
            renderHeader(creditDoc, invDoc);
            renderHomeAndPeriod(invDoc);
            renderReason(creditDoc);
            renderLines(creditDoc, invDoc, businessLike);

            const invId = String(invDoc.id || "").trim();
            backLink.href = invId ? `avoir.html?fromDocId=${encodeURIComponent(invId)}` : "factures-liste.html";
            return;
          }
        }

        if(!docId){
          showError("docId manquant.");
          paper.style.display = "none";
          return;
        }

        const creditSnap = await getDoc(doc(db, "salesDocuments", docId));
        if(!creditSnap.exists()){
          showError("Avoir introuvable.");
          paper.style.display = "none";
          return;
        }

        const data = creditSnap.data() || {};
        if(String(data.type||"").toUpperCase().trim() !== "CREDIT"){
          showError("docId n’est pas un avoir (type CREDIT).");
          paper.style.display = "none";
          return;
        }

        creditDoc = { id: creditSnap.id, ...data };
        currentCreditNumber = String(creditDoc.creditNumber || "").trim();

        if(isOwnerView){
          const ownerUid = String(
            creditDoc?.clientSnapshot?.ownerUid ||
            creditDoc?.ownerUid ||
            ""
          ).trim();

          if(!ownerUid){
            showError("Accès refusé : ownerUid manquant sur ce document.");
            paper.style.display = "none";
            backLink.href = "owner-facturation.html";
            return;
          }
          if(ownerUid !== String(user.uid)){
            showError("Accès refusé.");
            paper.style.display = "none";
            backLink.href = "owner-facturation.html";
            return;
          }
          if(creditDoc?.ownerVisible !== true){
            showError("Cet avoir n’est pas accessible au propriétaire.");
            paper.style.display = "none";
            backLink.href = "owner-facturation.html";
            return;
          }
        }

        const invId = String(creditDoc.fromInvoiceDocId || "").trim();
        if(!invId){
          showError("Avoir sans facture liée (fromInvoiceDocId manquant).");
          paper.style.display = "none";
          return;
        }

        const invSnap = await getDoc(doc(db, "salesDocuments", invId));
        if(!invSnap.exists()){
          showError("Facture liée introuvable.");
          paper.style.display = "none";
          return;
        }
        invDoc = { id: invSnap.id, ...(invSnap.data()||{}) };

        let profile = {};
        if(!isOwnerView){
          const conciergerieUid = String(invDoc.conciergerieUid || creditDoc.conciergerieUid || "").trim();
          if(!conciergerieUid){
            showError("conciergerieUid manquant.");
            paper.style.display = "none";
            return;
          }

          if(conciergerieUid !== String(user.uid)){
            showError("Accès refusé.");
            paper.style.display = "none";
            backLink.href = "factures-liste.html";
            return;
          }

          const userSnap = await getDoc(doc(db, "users", conciergerieUid));
          profile = userSnap.exists() ? (userSnap.data() || {}) : {};
          backLink.href = `avoir.html?docId=${encodeURIComponent(docId)}&fromDocId=${encodeURIComponent(invId)}`;
        }else{
          backLink.href = "owner-facturation.html";
        }

        const businessLike = applyBusinessSnapshot(creditDoc, invDoc, profile);
        const creditClient = getNormalizedClientSource(creditDoc);
        const invClient = getNormalizedClientSource(invDoc);
        const mergedClient = mergeClientSnapshots(creditClient, invClient);

        renderClientHeader(mergedClient);
        renderHeader(creditDoc, invDoc);
        renderHomeAndPeriod(invDoc);
        renderReason(creditDoc);
        renderLines(creditDoc, invDoc, businessLike);

        if(
          !String(businessLike.companyName || "").trim() &&
          !String(businessLike.address?.street || "").trim() &&
          !String(businessLike.billingEmail || "").trim()
        ){
          showWarn("Informations société incomplètes.");
        }

      }catch(e){
        console.error(e);
        showError(e?.message || "Erreur chargement aperçu avoir.");
        paper.style.display = "none";
      }
    });
  </script>
</body>
</html>
