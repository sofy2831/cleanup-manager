<!-- docs/avoir-apercu.html (CORRIGÉ COMPLET — priorité businessSnapshot/clientSnapshot + draft=1 conciergerie only + owner sécurisé + compat anciens docs + mobile cards) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu avoir</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
      font-weight:400;
    }

    .wrap{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px;
      padding-bottom:28px;
    }

    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }

    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet);
      color:var(--violet);
      text-decoration:none;
      font-weight:800;
      font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer;
      white-space:nowrap;
    }

    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent;
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .paper{
      width:100%;
      max-width:980px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      border-radius:16px;
      padding:16px;
      margin-top:10px;
      position:relative;
    }

    .header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }

    .brandLeft{
      display:flex;
      gap:12px;
      align-items:center;
      min-width:0;
    }

    .logo{
      width:50px;
      height:50px;
      border-radius:14px;
      border:2px solid rgba(122,92,255,0.35);
      overflow:hidden;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      color:var(--violet);
      flex-shrink:0;
    }

    .logo img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:none;
    }

    .brand{ min-width:0; }
    .brand .name{
      font-size:18px;
      font-weight:800;
      line-height:1.15;
    }

    .metaRight{
      text-align:right;
      font-size:12px;
      color:#333;
      line-height:1.35;
      white-space:nowrap;
    }

    .docTitle{
      margin-top:10px;
      text-align:center;
      font-weight:800;
      font-size:14px;
      letter-spacing:.2px;
    }

    .grid2{
      margin-top:12px;
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    @media(min-width:820px){
      .grid2{ grid-template-columns:1fr 1fr; }
    }

    .box{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }

    .box h3{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    .line{
      font-size:12.5px;
      font-weight:500;
      color:#111;
      line-height:1.35;
      word-break:break-word;
    }

    .mut{
      color:var(--muted);
      font-weight:500;
    }

    .sectionTitle{
      margin-top:12px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    .tableWrap{
      margin-top:12px;
      overflow:auto;
      border-radius:12px;
      border:1px solid rgba(0,0,0,0.04);
      background:#fff;
    }

    table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
    }

    thead th{
      text-align:left;
      font-size:11.5px;
      color:#444;
      font-weight:700;
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.07);
      background:rgba(248,244,255,.6);
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    tbody td{
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      font-size:12.5px;
      font-weight:500;
      vertical-align:top;
      overflow-wrap:anywhere;
      word-break:break-word;
    }

    tbody tr:last-child td{ border-bottom:none; }

    .right{
      text-align:right;
      white-space:nowrap;
    }

    .col-presta{ width:34%; }
    .col-qty{ width:10%; }
    .col-pu{ width:14%; }
    .col-tht{ width:14%; }
    .col-tva{ width:13%; }
    .col-ttc{ width:15%; }

    .summary{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .totalBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }

    .totalRow{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }

    .totalRow .lbl{
      font-size:14px;
      font-weight:700;
      color:#111;
      line-height:1.2;
    }

    .totalRow .amt{
      font-size:14px;
      font-weight:700;
      color:#111;
      line-height:1.2;
    }

    .totalRow.ttc .lbl{
      font-size:14px;
      font-weight:700;
    }

    .totalRow.ttc .amt{
      font-size:14px;
      font-weight:800;
    }

    .totalSub{
      margin-top:6px;
      font-size:11.5px;
      color:var(--muted);
      font-weight:500;
      line-height:1.4;
    }

    .payBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }

    .payBox h3{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    .footer{
      margin-top:12px;
      padding-top:10px;
      border-top:1px dashed rgba(122,92,255,0.35);
      text-align:center;
      font-size:11px;
      color:#444;
      font-weight:500;
      line-height:1.35;
    }

    .alert{
      width:100%;
      max-width:980px;
      margin-top:12px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-left:5px solid #b3261e;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px;
      font-size:12px;
      font-weight:600;
      color:#333;
      display:none;
      white-space:pre-wrap;
    }

    .linesCards{
      display:none;
      margin-top:12px;
      flex-direction:column;
      gap:10px;
    }

    .lineCard{
      background:#fff;
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px;
    }

    .lineCard .t{
      font-weight:1000;
      color:#111;
      line-height:1.3;
    }

    .lineCard .g{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:6px;
      margin-top:8px;
      font-size:12.5px;
      color:#222;
      font-weight:850;
    }

    .lineCard .g div{
      background:rgba(248,244,255,.6);
      border-radius:10px;
      padding:8px 10px;
      min-width:0;
    }

    .lineCard .g b{ font-weight:1000; }

    @media(max-width:760px){
      .tableWrap{ display:none; }
      .linesCards{ display:flex; }
    }

    @media(max-width:640px){
      thead th{
        font-size:10.5px;
        padding:7px 6px;
      }
      tbody td{
        font-size:11.5px;
        padding:7px 6px;
      }

      .totalRow .lbl,
      .totalRow .amt,
      .totalRow.ttc .lbl,
      .totalRow.ttc .amt{
        font-size:14px;
      }

      .lineCard .g{
        grid-template-columns:1fr;
      }
    }

    @media print{
      .topbar, button{ display:none !important; }
      body{ background:#fff !important; }
      @page{ margin:8mm; }

      .paper{
        box-shadow:none !important;
        border:none !important;
        border-radius:0 !important;
        max-width:none !important;
        padding:0 !important;
        position:relative;
      }

      .docTitle{ margin-top:6px !important; }
      .grid2{ grid-template-columns:1fr 1fr !important; gap:6px !important; }
      .summary{ gap:6px !important; }
      .box, .totalBox, .payBox{ padding:6px 8px !important; }
      .sectionTitle{ margin-top:8px !important; }

      .tableWrap{ display:block !important; margin-top:8px !important; border:none !important; }
      .linesCards{ display:none !important; }
      table thead th, table tbody td{ padding:6px 7px !important; }

      .footer{
        position:fixed;
        left:0;
        right:0;
        bottom:6mm;
        border-top:1px dashed rgba(0,0,0,0.25);
        padding-top:4px;
        font-size:10px !important;
        line-height:1.2 !important;
        text-align:center;
        background:#fff;
        z-index:9999;
      }

      .paper{
        padding-bottom:22mm !important;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <a class="pill" id="backLink" href="#">← Retour</a>
      <button class="pill primary" id="printBtn" type="button">Imprimer / PDF</button>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="paper" id="paper">
      <div class="header">
        <div class="brandLeft">
          <div class="logo">
            <img id="logoImg" alt="Logo société">
            <span id="logoFallback">✓</span>
          </div>
          <div class="brand">
            <div class="name" id="companyName">Conciergerie</div>
          </div>
        </div>

        <div class="metaRight" id="metaRight">
          <div><b>Émis le</b> —</div>
          <div><b>Facture d'origine</b> —</div>
        </div>
      </div>

      <div class="docTitle" id="docTitle">AVOIR N° —</div>

      <div class="grid2">
        <div class="box">
          <h3>Société</h3>
          <div class="line" id="socLine1">—</div>
          <div class="line" id="socLine2"></div>
          <div class="line" id="socLine3"></div>
          <div class="line mut" id="socLine4"></div>
        </div>

        <div class="box">
          <h3>Client</h3>
          <div class="line" id="cliLine1">—</div>
          <div class="line" id="cliLine2"></div>
          <div class="line" id="cliLine3"></div>
          <div class="line mut" id="cliLine4"></div>
        </div>
      </div>

      <div class="sectionTitle">Logement & période</div>
      <div class="box">
        <div class="line" id="homeLine1">—</div>
        <div class="line" id="homeLine2">—</div>
      </div>

      <div class="sectionTitle">Motif</div>
      <div class="box">
        <div class="line" id="reasonLine">—</div>
      </div>

      <div class="tableWrap">
        <table aria-label="Lignes avoir">
          <thead>
            <tr>
              <th class="col-presta">Prestation</th>
              <th class="col-qty right">Qté</th>
              <th class="col-pu right">PU HT</th>
              <th class="col-tht right">Total HT</th>
              <th class="col-tva right">TVA</th>
              <th class="col-ttc right">Total TTC</th>
            </tr>
          </thead>
          <tbody id="linesBody"></tbody>
        </table>
      </div>

      <div class="linesCards" id="linesCards"></div>

      <div class="summary">
        <div class="totalBox">
          <div class="totalRow">
            <span class="lbl">Total HT</span>
            <span class="amt" id="totalHt">0,00 €</span>
          </div>
          <div class="totalRow">
            <span class="lbl">Total TVA</span>
            <span class="amt" id="totalTva">0,00 €</span>
          </div>
          <div class="totalRow ttc">
            <span class="lbl">Total TTC</span>
            <span class="amt" id="totalTtc">0,00 €</span>
          </div>
          <div class="totalSub" id="tvaLine">TVA non applicable (art. 293 B du CGI)</div>
        </div>

        <div class="payBox">
          <h3>Références</h3>
          <div class="line" id="refInv">Facture : —</div>
        </div>
      </div>

      <div class="footer" id="footer">—</div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const printBtn = document.getElementById("printBtn");
    const backLink = document.getElementById("backLink");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");

    const companyNameEl = document.getElementById("companyName");
    const docTitleEl = document.getElementById("docTitle");
    const metaRightEl = document.getElementById("metaRight");

    const soc1 = document.getElementById("socLine1");
    const soc2 = document.getElementById("socLine2");
    const soc3 = document.getElementById("socLine3");
    const soc4 = document.getElementById("socLine4");

    const cli1 = document.getElementById("cliLine1");
    const cli2 = document.getElementById("cliLine2");
    const cli3 = document.getElementById("cliLine3");
    const cli4 = document.getElementById("cliLine4");

    const homeLine1 = document.getElementById("homeLine1");
    const homeLine2 = document.getElementById("homeLine2");

    const reasonLine = document.getElementById("reasonLine");
    const refInv = document.getElementById("refInv");

    const linesBody = document.getElementById("linesBody");
    const linesCards = document.getElementById("linesCards");
    const totalHtEl = document.getElementById("totalHt");
    const totalTvaEl = document.getElementById("totalTva");
    const totalTtcEl = document.getElementById("totalTtc");
    const tvaLineEl  = document.getElementById("tvaLine");

    const footerEl = document.getElementById("footer");
    const paper = document.getElementById("paper");

    let creditDoc = null;
    let invDoc = null;
    let currentDocId = "";
    let currentCreditNumber = "";
    let isOwnerView = false;
    let isDraftView = false;

    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function showError(msg){
      alertBox.style.display = "block";
      alertBox.textContent = "⛔ " + msg;
    }

    function showWarn(msg){
      alertBox.style.display = "block";
      alertBox.textContent = "⚠️ " + msg;
    }

    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " €";
    }

    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    function ddmmyyyy(d){
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yy = d.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }

    function normalizeEmail(s){
      return String(s||"").trim().toLowerCase();
    }

    function getStayPeriod(d){
      const pick = (v)=> String(v||"").trim();
      const a = pick(d?.arrivalDateKey || d?.arrivalDate || d?.checkinDate || d?.arrival);
      const b = pick(d?.departureDateKey || d?.departureDate || d?.checkoutDate || d?.departure);
      if(a && b) return `Du ${a} au ${b}`;
      if(a && !b) return `À partir du ${a}`;
      if(!a && b) return `Jusqu’au ${b}`;
      return "—";
    }

    function getNormalizedClientSource(d){
      const cs = (d?.clientSnapshot && typeof d.clientSnapshot === "object") ? d.clientSnapshot : null;
      return {
        ownerDocId: String(cs?.ownerDocId || d?.clientOwnerDocId || d?.ownerDocId || "").trim(),
        ownerUid: String(cs?.ownerUid || d?.ownerUid || "").trim(),
        name: String(cs?.name || d?.clientName || d?.ownerName || "").trim(),
        email: normalizeEmail(cs?.email || d?.clientEmail || d?.ownerEmail || ""),
        phone: String(cs?.phone || d?.clientPhone || d?.ownerPhone || "").trim(),
        address1: String(cs?.address1 || d?.clientAddress1 || d?.ownerAddress1 || d?.clientAddress || "").trim(),
        address2: String(cs?.address2 || d?.clientAddress2 || d?.ownerAddress2 || "").trim(),
        zip: String(cs?.zip || d?.clientZip || d?.ownerZip || "").trim(),
        city: String(cs?.city || d?.clientCity || d?.ownerCity || "").trim(),
        country: String(cs?.country || d?.clientCountry || d?.ownerCountry || "FR").trim()
      };
    }

    function getLineStoredHT(l){
      const qty = Number(l?.qty) || 0;
      const pu = Number(l?.unitPrice) || 0;
      if(Number.isFinite(Number(l?.totalHT))) return Number(l.totalHT);
      return qty * pu;
    }

    function getLineStoredTVA(l){
      if(Number.isFinite(Number(l?.totalTVA))) return Number(l.totalTVA);
      return 0;
    }

    function getLineStoredTTC(l){
      if(Number.isFinite(Number(l?.totalTTC))) return Number(l.totalTTC);
      return getLineStoredHT(l) + getLineStoredTVA(l);
    }

    function getDocumentTotalsStored(docLike){
      const totals = (docLike?.totals && typeof docLike.totals === "object") ? docLike.totals : null;
      if(totals){
        return {
          ht: Number(totals.ht || docLike?.totalHT || 0),
          tva: Number(totals.tva || docLike?.totalTVA || 0),
          ttc: Number(totals.ttc || docLike?.totalTTC || 0)
        };
      }

      if(
        Number.isFinite(Number(docLike?.totalHT)) ||
        Number.isFinite(Number(docLike?.totalTVA)) ||
        Number.isFinite(Number(docLike?.totalTTC))
      ){
        return {
          ht: Number(docLike?.totalHT || 0),
          tva: Number(docLike?.totalTVA || 0),
          ttc: Number(docLike?.totalTTC || 0)
        };
      }

      const lines = Array.isArray(docLike?.lines) ? docLike.lines : [];
      let ht = 0, tva = 0, ttc = 0;
      for(const l of lines){
        ht += getLineStoredHT(l);
        tva += getLineStoredTVA(l);
        ttc += getLineStoredTTC(l);
      }
      return { ht, tva, ttc };
    }

    function getVatContext(docLike){
      const bs = (docLike?.businessSnapshot && typeof docLike.businessSnapshot === "object") ? docLike.businessSnapshot : {};
      const vat = docLike?.vatSnapshot || bs?.vat || {};
      const totals = getDocumentTotalsStored(docLike);

      return {
        enabled: !!vat?.enabled || Number(totals.tva || 0) > 0,
        serviceRate: Number.isFinite(Number(vat?.serviceRate)) ? Number(vat.serviceRate) : 0.20,
        productRate: Number.isFinite(Number(vat?.productRate)) ? Number(vat.productRate) : 0.10
      };
    }

    function buildBusinessMerged(credit, invoice, profile){
      const bp = profile?.businessProfile || {};
      const creditBS = (credit?.businessSnapshot && typeof credit.businessSnapshot === "object") ? credit.businessSnapshot : {};
      const invBS = (invoice?.businessSnapshot && typeof invoice.businessSnapshot === "object") ? invoice.businessSnapshot : {};

      return {
        companyName:
          creditBS.companyName ||
          invBS.companyName ||
          bp.companyName ||
          credit?.businessName ||
          invoice?.businessName ||
          "Conciergerie",

        logoUrl:
          creditBS.logoUrl ||
          invBS.logoUrl ||
          bp.logoUrl ||
          credit?.businessLogoUrl ||
          invoice?.businessLogoUrl ||
          "",

        address: {
          street:
            creditBS.address?.street ||
            invBS.address?.street ||
            credit?.businessAddressStreet ||
            invoice?.businessAddressStreet ||
            bp.address?.street ||
            "",
          zip:
            creditBS.address?.zip ||
            invBS.address?.zip ||
            credit?.businessAddressZip ||
            invoice?.businessAddressZip ||
            bp.address?.zip ||
            "",
          city:
            creditBS.address?.city ||
            invBS.address?.city ||
            credit?.businessAddressCity ||
            invoice?.businessAddressCity ||
            bp.address?.city ||
            ""
        },

        registration: {
          siret:
            creditBS.registration?.siret ||
            invBS.registration?.siret ||
            credit?.businessSiret ||
            invoice?.businessSiret ||
            bp.registration?.siret ||
            "",
          ape:
            creditBS.registration?.ape ||
            invBS.registration?.ape ||
            credit?.businessApe ||
            invoice?.businessApe ||
            bp.registration?.ape ||
            ""
        },

        billingEmail:
          creditBS.billingEmail ||
          creditBS.contact?.email ||
          invBS.billingEmail ||
          invBS.contact?.email ||
          credit?.businessEmail ||
          invoice?.businessEmail ||
          bp.billingEmail ||
          profile?.email ||
          "",

        phone:
          creditBS.phone ||
          creditBS.contact?.phone ||
          invBS.phone ||
          invBS.contact?.phone ||
          credit?.businessPhone ||
          invoice?.businessPhone ||
          bp.phone ||
          "",

        tvaExemptionText:
          creditBS.tvaExemptionText ||
          invBS.tvaExemptionText ||
          credit?.tvaExemptionText ||
          invoice?.tvaExemptionText ||
          bp.tvaExemptionText ||
          "TVA non applicable (art. 293 B du CGI)"
      };
    }

    function applyBusinessSnapshot(credit, invoice, profile){
      const src = buildBusinessMerged(credit, invoice, profile);

      const companyName = String(src.companyName || "Conciergerie").trim();
      const logoUrl = String(src.logoUrl || "").trim();
      const street = String(src.address?.street || "").trim();
      const zip = String(src.address?.zip || "").trim();
      const city = String(src.address?.city || "").trim();
      const siret = String(src.registration?.siret || "").trim();
      const ape = String(src.registration?.ape || "").trim();
      const email = String(src.billingEmail || "").trim();
      const phone = String(src.phone || "").trim();

      companyNameEl.textContent = companyName || "Conciergerie";

      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }

      soc1.textContent = companyName || "Conciergerie";

      soc2.textContent = street || "";
      soc2.style.display = street ? "" : "none";

      const cityLine = [zip, city].filter(Boolean).join(" ");
      soc3.textContent = cityLine || "";
      soc3.style.display = cityLine ? "" : "none";

      const legal = [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • ");
      const contact = [email, phone].filter(Boolean).join(" • ");
      const last = [legal, contact].filter(Boolean).join(" • ");

      soc4.textContent = last || "";
      soc4.style.display = last ? "" : "none";

      const footerParts = [];
      if(companyName) footerParts.push(companyName);
      if(street) footerParts.push(street);
      if(cityLine) footerParts.push(cityLine);
      if(legal) footerParts.push(legal);
      if(contact) footerParts.push(contact);

      footerEl.textContent = footerParts.join(" • ") || "Document édité par CleanUp Manager";

      return src;
    }

    function mergeClientSnapshots(primary, secondary){
      const a = primary || {};
      const b = secondary || {};
      return {
        ownerDocId: String(a.ownerDocId || b.ownerDocId || "").trim(),
        ownerUid: String(a.ownerUid || b.ownerUid || "").trim(),
        name: String(a.name || b.name || "").trim(),
        email: String(a.email || b.email || "").trim(),
        phone: String(a.phone || b.phone || "").trim(),
        address1: String(a.address1 || b.address1 || "").trim(),
        address2: String(a.address2 || b.address2 || "").trim(),
        zip: String(a.zip || b.zip || "").trim(),
        city: String(a.city || b.city || "").trim(),
        country: String(a.country || b.country || "FR").trim()
      };
    }

    function renderClientHeader(snapshot){
      const s = snapshot || {};
      const name = String(s.name || "—").trim();
      const a1 = String(s.address1 || "").trim();
      const a2 = String(s.address2 || "").trim();
      const zip = String(s.zip || "").trim();
      const city = String(s.city || "").trim();
      const email = String(s.email || "").trim();
      const phone = String(s.phone || "").trim();

      cli1.textContent = name || "—";

      cli2.textContent = a1 || "";
      cli2.style.display = a1 ? "" : "none";

      const line3 = [a2, [zip, city].filter(Boolean).join(" ")].filter(Boolean).join(" • ");
      cli3.textContent = line3 || "";
      cli3.style.display = line3 ? "" : "none";

      const contact = [email, phone].filter(Boolean).join(" • ");
      cli4.textContent = contact || "";
      cli4.style.display = contact ? "" : "none";
    }

    function renderHeader(credit, invoice){
      const credNum = String(credit?.creditNumber || "").trim();
      const invNum  = String(credit?.fromInvoiceNumber || invoice?.invoiceNumber || "").trim();
      const issued = String(credit?.creditIssuedDate || "").trim() || ddmmyyyy(new Date());

      docTitleEl.textContent = credNum ? `AVOIR N° ${credNum}` : `AVOIR N° —`;
      metaRightEl.innerHTML = `
        <div><b>Émis le</b> ${esc(issued)}</div>
        <div><b>Facture d'origine</b> ${esc(invNum || "—")}</div>
      `;

      refInv.textContent = `Facture : ${invNum || "—"}`;
      currentCreditNumber = credNum || "";
    }

    function renderHomeAndPeriod(invoice){
      const homeAddr = String(invoice?.homeAddress || "").trim();
      const homeZip  = String(invoice?.homeZip || "").trim();
      const homeCity = String(invoice?.homeCity || "").trim();
      const full = [homeAddr, [homeZip, homeCity].filter(Boolean).join(" ")].filter(Boolean).join(" • ");

      homeLine1.textContent = full ? `Adresse : ${full}` : "Adresse : —";
      homeLine2.textContent = `Période : ${getStayPeriod(invoice)}`;
    }

    function renderReason(credit){
      const r = String(credit?.creditReason || "").trim();
      reasonLine.textContent = r || "—";
    }

    function renderLines(credit, invoice, businessLike){
      const arr = Array.isArray(credit?.lines) && credit.lines.length
        ? credit.lines
        : (Array.isArray(invoice?.lines) ? invoice.lines : []);

      linesBody.innerHTML = "";
      linesCards.innerHTML = "";

      const totals = getDocumentTotalsStored(credit);
      const vat = getVatContext(credit);

      if(!arr.length){
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="6" class="mut">Aucune ligne</td>`;
        linesBody.appendChild(tr);
      }else{
        for(const l of arr){
          const qty = Number(l?.qty)||0;
          const up = Number(l?.unitPrice)||0;
          const ht = getLineStoredHT(l);
          const tva = getLineStoredTVA(l);
          const total = getLineStoredTTC(l);
          const label = String(l?.label || "Prestation").trim();
          const ratePct = Math.round((Number(l?.vatRate || 0)) * 100);
          const tvaLabel = vat.enabled ? `${ratePct}% • ${money(-tva)}` : "0% • 0,00 €";

          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td class="col-presta">${esc(label)}</td>
            <td class="col-qty right">${esc(qty)}</td>
            <td class="col-pu right">${esc(money(-up))}</td>
            <td class="col-tht right">${esc(money(-ht))}</td>
            <td class="col-tva right">${esc(tvaLabel)}</td>
            <td class="col-ttc right">${esc(money(-total))}</td>
          `;
          linesBody.appendChild(tr);

          const card = document.createElement("div");
          card.className = "lineCard";
          card.innerHTML = `
            <div class="t">${esc(label)}</div>
            <div class="g">
              <div><b>Qté</b> : ${esc(qty)}</div>
              <div><b>PU HT</b> : ${esc(money(-up))}</div>
              <div><b>Total HT</b> : ${esc(money(-ht))}</div>
              <div><b>TVA</b> : ${esc(tvaLabel)}</div>
              <div><b>Total TTC</b> : ${esc(money(-total))}</div>
              <div><b>Unité</b> : ${esc(String(l?.unit || "unité"))}</div>
            </div>
          `;
          linesCards.appendChild(card);
        }
      }

      totalHtEl.textContent = money(-totals.ht);
      totalTvaEl.textContent = money(-totals.tva);
      totalTtcEl.textContent = money(-totals.ttc);

      if(Number(totals.tva) > 0){
        tvaLineEl.textContent = `HT ${money(-totals.ht)} • TVA ${money(-totals.tva)}`;
      }else{
        tvaLineEl.textContent = String(
          credit?.businessSnapshot?.tvaExemptionText ||
          invoice?.businessSnapshot?.tvaExemptionText ||
          businessLike?.tvaExemptionText ||
          "TVA non applicable (art. 293 B du CGI)"
        ).trim();
      }
    }

    printBtn.addEventListener("click", ()=>{
      const originalTitle = document.title;
      const numberRaw =
        String(currentCreditNumber || "").trim()
        || String(currentDocId || "").trim()
        || "Avoir";

      const safeNumber = numberRaw.replace(/[^\w\-]/g, "_");
      document.title = "CleanUp_Avoir_" + safeNumber;

      window.print();

      setTimeout(()=>{ document.title = originalTitle; }, 1000);
    });

    function loginRedirectUrl(){
      const token = getParam("token");
      const base = isOwnerView ? "login.html?role=proprietaire" : "login.html?role=conciergerie";
      return token ? (base + "&token=" + encodeURIComponent(token)) : base;
    }

    function loadDraftFromSession(){
      try{
        const raw = sessionStorage.getItem("creditDraftPreview");
        if(!raw) return null;
        const draft = JSON.parse(raw);
        if(!draft || typeof draft !== "object") return null;
        return draft;
      }catch(e){
        return null;
      }
    }

    onAuthStateChanged(auth, async (user)=>{
      isOwnerView = getParam("owner") === "1";
      isDraftView = getParam("draft") === "1";
      backLink.href = isOwnerView ? "owner-facturation.html" : "factures-liste.html";

      if(!user){
        location.href = loginRedirectUrl();
        return;
      }

      const docId = getParam("docId");
      currentDocId = docId || "";

      try{
        if(isOwnerView && isDraftView){
          showError("Accès refusé sur un brouillon.");
          paper.style.display = "none";
          return;
        }

        if(isDraftView && !isOwnerView){
          const draft = loadDraftFromSession();
          if(draft && draft._invoice){
            const profileSnap = await getDoc(doc(db, "users", user.uid));
            const profile = profileSnap.exists() ? (profileSnap.data() || {}) : {};

            creditDoc = { id: docId || "DRAFT", ...draft };
            invDoc = { ...(draft._invoice || {}) };

            const businessLike = applyBusinessSnapshot(creditDoc, invDoc, profile);
            const creditClient = getNormalizedClientSource(creditDoc);
            const invClient = getNormalizedClientSource(invDoc);
            const mergedClient = mergeClientSnapshots(creditClient, invClient);

            renderClientHeader(mergedClient);
            renderHeader(creditDoc, invDoc);
            renderHomeAndPeriod(invDoc);
            renderReason(creditDoc);
            renderLines(creditDoc, invDoc, businessLike);

            const invId = String(invDoc.id || "").trim();
            backLink.href = invId ? `avoir.html?fromDocId=${encodeURIComponent(invId)}` : "factures-liste.html";
            return;
          }
        }

        if(!docId){
          showError("docId manquant.");
          paper.style.display = "none";
          return;
        }

        const creditSnap = await getDoc(doc(db, "salesDocuments", docId));
        if(!creditSnap.exists()){
          showError("Avoir introuvable.");
          paper.style.display = "none";
          return;
        }

        const data = creditSnap.data() || {};
        if(String(data.type||"").toUpperCase().trim() !== "CREDIT"){
          showError("docId n’est pas un avoir (type CREDIT).");
          paper.style.display = "none";
          return;
        }

        creditDoc = { id: creditSnap.id, ...data };
        currentCreditNumber = String(creditDoc.creditNumber || "").trim();

        if(isOwnerView){
          const ownerUid = String(
            creditDoc?.clientSnapshot?.ownerUid ||
            creditDoc?.ownerUid ||
            ""
          ).trim();

          if(!ownerUid){
            showError("Accès refusé : ownerUid manquant sur ce document.");
            paper.style.display = "none";
            backLink.href = "owner-facturation.html";
            return;
          }
          if(ownerUid !== String(user.uid)){
            showError("Accès refusé.");
            paper.style.display = "none";
            backLink.href = "owner-facturation.html";
            return;
          }
          if(creditDoc?.ownerVisible !== true){
            showError("Cet avoir n’est pas accessible au propriétaire.");
            paper.style.display = "none";
            backLink.href = "owner-facturation.html";
            return;
          }
        }

        const invId = String(creditDoc.fromInvoiceDocId || "").trim();
        if(!invId){
          showError("Avoir sans facture liée (fromInvoiceDocId manquant).");
          paper.style.display = "none";
          return;
        }

        const invSnap = await getDoc(doc(db, "salesDocuments", invId));
        if(!invSnap.exists()){
          showError("Facture liée introuvable.");
          paper.style.display = "none";
          return;
        }
        invDoc = { id: invSnap.id, ...(invSnap.data()||{}) };

        let profile = {};
        if(!isOwnerView){
          const conciergerieUid = String(invDoc.conciergerieUid || creditDoc.conciergerieUid || "").trim();
          if(!conciergerieUid){
            showError("conciergerieUid manquant.");
            paper.style.display = "none";
            return;
          }

          if(conciergerieUid !== String(user.uid)){
            showError("Accès refusé.");
            paper.style.display = "none";
            backLink.href = "factures-liste.html";
            return;
          }

          const userSnap = await getDoc(doc(db, "users", conciergerieUid));
          profile = userSnap.exists() ? (userSnap.data() || {}) : {};
          backLink.href = `avoir.html?docId=${encodeURIComponent(docId)}&fromDocId=${encodeURIComponent(invId)}`;
        }else{
          backLink.href = "owner-facturation.html";
        }

        const businessLike = applyBusinessSnapshot(creditDoc, invDoc, profile);
        const creditClient = getNormalizedClientSource(creditDoc);
        const invClient = getNormalizedClientSource(invDoc);
        const mergedClient = mergeClientSnapshots(creditClient, invClient);

        renderClientHeader(mergedClient);
        renderHeader(creditDoc, invDoc);
        renderHomeAndPeriod(invDoc);
        renderReason(creditDoc);
        renderLines(creditDoc, invDoc, businessLike);

        if(
          !String(businessLike.companyName || "").trim() &&
          !String(businessLike.address?.street || "").trim() &&
          !String(businessLike.billingEmail || "").trim()
        ){
          showWarn("Informations société incomplètes.");
        }

      }catch(e){
        console.error(e);
        showError(e?.message || "Erreur chargement aperçu avoir.");
        paper.style.display = "none";
      }
    });
  </script>
</body>
</html>
