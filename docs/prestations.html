<!-- docs/prestations.html (COMPLET + FIX HARD: raison sociale via users/{uid} + conciergeries/{uid} + queries fallback) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Prestations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --violet-light:#F3ECFF;

      --text:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);
    }
    *,*::before,*::after{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,#F8F4FF 0%,#EDE6FF 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 14px 96px; }

    .topbar{
      width:100%; max-width:980px; position:sticky; top:0; z-index:30;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet-main); color:var(--violet-main);
      text-decoration:none; font-weight:800; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }
    .pill.primary{ background:linear-gradient(90deg,var(--violet-main),var(--violet-dark)); border-color:transparent; color:#fff; }

    .logo{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:6px; margin-bottom:2px; text-align:center; }
    .logo-icon{
      width:42px; height:42px; border-radius:50%; background:#fff; border:2px solid var(--violet-main);
      display:flex; align-items:center; justify-content:center; color:var(--violet-main);
      font-size:20px; font-weight:900; position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet-main); }
    h1{ margin:0; font-size:24px; font-weight:900; }

    .subtitle{ font-size:13px; font-weight:800; color:#444; text-align:center; }
    .helloLine{ margin-top:10px; font-size:13px; color:#333; font-weight:900; text-align:center; }
    .emailLine{ font-size:12px; font-weight:900; color:var(--muted); text-align:center; margin-top:4px; }

    .alert{
      width:100%; max-width:980px; display:none; margin-top:10px; padding:10px 12px; background:#fff;
      border-radius:14px; border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:800; white-space:pre-wrap; color:#444;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .layout{ width:100%; max-width:980px; margin-top:12px; display:flex; flex-direction:column; gap:12px; }
    .card{
      background:rgba(255,255,255,0.86); border:1px solid var(--border); border-radius:18px; box-shadow:var(--shadow);
      backdrop-filter:blur(10px); padding:12px; display:flex; flex-direction:column; gap:10px; min-width:0;
    }
    .card-title{ display:flex; justify-content:space-between; align-items:center; font-size:15px; font-weight:900; gap:10px; }
    .tiny{ font-size:12px; font-weight:800; color:var(--muted); line-height:1.35; }

    .searchWrap{ position: sticky; top: 64px; z-index: 25; }
    @media(min-width: 860px){ .searchWrap{ top: 66px; } }
    .searchbar{
      display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:14px;
      background:#fff; border:1px solid rgba(122,92,255,0.18); box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    .s-ico{ font-size:14px; opacity:.75; }
    .s-in{ flex:1; border:none; outline:none; font-size:13px; font-weight:800; color:#111; background:transparent; min-width:0; }
    .s-x{
      border:none; cursor:pointer; width:34px; height:34px; border-radius:999px; background:rgba(122,92,255,0.10);
      color:#5b45c8; font-weight:900; display:none;
    }
    .s-x.show{ display:inline-flex; align-items:center; justify-content:center; }

    .list{ display:flex; flex-direction:column; gap:10px; }
    .item{
      background:#fff; border-radius:16px; box-shadow:0 3px 10px rgba(0,0,0,.06); padding:10px;
      display:flex; justify-content:space-between; gap:10px; align-items:flex-start;
    }
    .i-main{ min-width:0; flex:1; }
    .i-title{ font-size:13px; font-weight:900; color:#222; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .actions{ margin-top:8px; display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

    .mini{
      border-radius:999px; padding:7px 10px; font-size:12px; font-weight:900; border:2px solid var(--violet-main);
      background:#fff; color:var(--violet-main); cursor:pointer; box-shadow:0 2px 8px rgba(0,0,0,.06); white-space:nowrap;
    }
    .mini.primary{ background:linear-gradient(90deg,var(--violet-main),var(--violet-dark)); border-color:transparent; color:#fff; }
    .mini.danger{ border-color:#ffc2d6; color:var(--bad); background:#fff; }
    .badge{ margin-left:auto; background:var(--violet-light); color:#5b45c8; font-weight:900; border-radius:999px; padding:6px 10px; font-size:12px; white-space:nowrap; }

    .empty{ background:#fff; border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.06); padding:12px; color:#666; font-weight:900; font-size:12px; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: flex; gap: 6px;
      justify-content: space-around; align-items: center; padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92); border-top: 1px solid rgba(122,92,255,0.18); backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none; font-size: 11px; font-weight: 900; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    .bottom-nav a.active{ background: linear-gradient(90deg,var(--violet-main),var(--violet-dark)); color:#fff; box-shadow: 0 10px 22px rgba(0,0,0,0.10); }
    @media(min-width: 860px){
      .bottom-nav{
        position: static; width: 100%; max-width: 980px; margin: 14px 0 0; border-top: none;
        border: 1px solid rgba(122,92,255,0.18); border-radius: 999px; box-shadow: 0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px; gap: 10px;
      }
      .bottom-nav a{ font-size: 13px; padding: 12px 12px; }
      .page{ padding-bottom: 32px; }
    }

    /* modals identiques à ton fichier précédent (inchangé visuellement) */
    .modal-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.28); display:none; align-items:center; justify-content:center; z-index:200; padding:16px; }
    .modal{ width:100%; max-width:640px; background:#fff; border-radius:18px; border:1px solid rgba(122,92,255,0.18); box-shadow:0 20px 60px rgba(0,0,0,.18); max-height:86vh; overflow:hidden; display:flex; flex-direction:column; }
    .modal-head{ padding:12px 12px 8px; border-bottom:1px solid rgba(122,92,255,0.12); background:rgba(255,255,255,0.92); }
    .modal-head-top{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .modal-head h3{ margin:0; font-size:15px; font-weight:900; }
    .modal-sub{ margin:6px 0 0; color:#666; font-size:12px; font-weight:800; line-height:1.3; white-space:pre-wrap; }
    .modal-body{ padding:10px 12px; overflow:auto; }
    .context-box{ background:#fff; border:1px solid rgba(122,92,255,0.18); border-radius:16px; padding:10px; display:grid; gap:6px; }
    .ctx-row{ display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
    .ctx-row .k{ font-weight:900; }
    .ctx-row .v{ font-weight:800; color:#333; text-align:right; }
    .line-box{ background:#fff; border-radius:14px; border:1px solid rgba(0,0,0,0.03); box-shadow:0 3px 10px rgba(0,0,0,.06); padding:10px; }
    .line-box .t{ font-weight:900; font-size:13px; color:#222; }
    .line-box .s{ margin-top:4px; font-size:12px; font-weight:800; color:#666; }
    .line-box .n{ margin-top:6px; font-size:12px; font-weight:800; color:#444; white-space:pre-wrap; }
    .total-box{ margin-top:10px; padding:10px 12px; background:#fff; border-radius:14px; box-shadow:0 3px 10px rgba(0,0,0,.06); border:1px solid rgba(122,92,255,0.18); display:flex; justify-content:space-between; gap:10px; align-items:center; font-weight:900; }
    .total-box .mut{ font-weight:800; color:#666; }
    .modal-foot{ padding:10px 12px; border-top:1px solid rgba(122,92,255,0.12); background:rgba(255,255,255,0.92); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; }
    .fgrid{ display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end; margin:0 0 8px; }
    .fgrid > div{ flex:1; min-width:170px; }
    .flabel{ display:block; font-size:11px; font-weight:900; color:#444; margin:0 0 4px; }
    .finput, .fselect{ width:100%; padding:10px; border-radius:12px; border:1px solid #D3C7FF; font-size:13px; font-weight:800; outline:none; background:#fff; }
    .finput:focus, .fselect:focus{ border-color:var(--violet-main); box-shadow:0 0 0 3px rgba(122,92,255,.12); }
    .divider{ height:1px; background:rgba(122,92,255,0.18); margin:8px 0; }
    .edit-line{ background:#fff; border-radius:14px; border:1px solid rgba(0,0,0,0.03); box-shadow:0 3px 10px rgba(0,0,0,.06); padding:10px; display:flex; flex-direction:column; gap:8px; }
    .edit-line-top{ display:flex; justify-content:space-between; gap:10px; align-items:center; }
    .edit-line-top .name{ font-weight:900; font-size:13px; }
    .edit-line-grid{ display:flex; gap:8px; flex-wrap:wrap; }
    .edit-line-grid > div{ flex:1; min-width:150px; }
    .modal-alert{ display:none; margin:8px 12px 0; padding:10px 12px; background:#fff; border-radius:14px; border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06); font-size:12px; font-weight:800; color:#444; white-space:pre-wrap; }
    @media (max-width:520px){ .page{ padding-left:12px; padding-right:12px; } html, body{ overflow-x:hidden; } }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" href="conciergerie.html">← Tableau de bord</a>
      <div style="display:flex;gap:8px;">
        <a class="pill primary" href="planning.html">Planning</a>
      </div>
    </div>

    <div class="logo">
      <div class="logo-icon">✓</div>
      <h1>CleanUp Manager</h1>
    </div>

    <div class="subtitle">Gestion de vos prestations</div>
    <div class="helloLine" id="helloLine">Bonjour,</div>
    <div class="emailLine" id="companyLine">—</div>

    <div class="alert" id="alertBox"></div>

    <div class="layout">
      <section class="card">
        <div class="card-title">
          <span>Prestations</span>
          <span class="tiny" id="countLabel">—</span>
        </div>

        <div class="searchWrap">
          <div class="searchbar">
            <span class="s-ico">🔎</span>
            <input id="searchInput" class="s-in" type="search" placeholder="Rechercher (logement, ville, propriétaire…)" autocomplete="off">

          </div>
        </div>

        <div class="list" id="list"></div>
      </section>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a class="active" href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="import-ical.html">iCal</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <!-- MODALE DÉTAIL -->
  <div class="modal-backdrop" id="detailBackdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-head-top">
          <h3>Détail prestation</h3>
          <button class="mini" id="detailCloseBtn" type="button">Fermer</button>
        </div>
        <p class="modal-sub" id="detailModalSub">—</p>
      </div>

      <div class="modal-body">
        <div class="context-box" id="detailModalContext"></div>
        <div style="height:10px"></div>
        <div id="detailModalLines" style="display:flex;flex-direction:column;gap:8px;"></div>
        <div class="total-box" id="detailModalTotal">
          <div class="mut">Total</div>
          <div id="detailModalTotalValue">0,00 €</div>
        </div>
      </div>

      <div class="modal-foot">
        <button class="mini" id="detailEditBtn" type="button" disabled>Modifier</button>
        <button class="mini danger" id="detailDeleteBtn" type="button" disabled>Supprimer</button>
        <button class="mini primary" id="detailInterventionBtn" type="button" disabled>Intervention</button>
      </div>
    </div>
  </div>

  <!-- MODALE EDIT -->
  <div class="modal-backdrop" id="editBackdrop" aria-hidden="true" style="z-index:220;">
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">
        <div class="modal-head-top">
          <h3>Modifier la prestation</h3>
          <button class="mini" id="editCancelBtn" type="button">Fermer</button>
        </div>
      </div>

      <div class="modal-alert" id="editModalAlert"></div>

      <div class="modal-body">
        <div class="fgrid">
          <div>
            <label class="flabel">Arrivée (date)</label>
            <input id="editArrivalDate" class="finput" type="date">
          </div>
          <div>
            <label class="flabel">Arrivée (heure)</label>
            <input id="editArrivalTime" class="finput" type="time">
          </div>
        </div>

        <div class="fgrid">
          <div>
            <label class="flabel">Départ (date)</label>
            <input id="editDepartureDate" class="finput" type="date">
          </div>
          <div>
            <label class="flabel">Départ (heure)</label>
            <input id="editDepartureTime" class="finput" type="time">
          </div>
        </div>

        <div style="margin:0 0 8px;">
          <label class="flabel">Note globale</label>
          <input id="editNote" class="finput" placeholder="Ex. urgence, voyageurs exigeants…">
        </div>

        <div class="divider"></div>

        <h3 style="margin:4px 0 6px;font-size:14px;font-weight:900;">Lignes</h3>
        <div id="editLines" style="display:flex;flex-direction:column;gap:8px;"></div>

        <div class="divider"></div>

        <h3 style="margin:4px 0 6px;font-size:14px;font-weight:900;">Ajouter une ligne</h3>

        <div style="margin:0 0 8px;">
          <label class="flabel">Prestation</label>
          <input id="newLabel" class="finput" list="prestaList" placeholder="Ex. Ménage standard, Check-in…">
          <datalist id="prestaList"></datalist>
        </div>

        <div class="fgrid">
          <div>
            <label class="flabel">Quantité</label>
            <input id="newQty" class="finput" type="number" min="0" step="0.5" value="1">
          </div>
          <div>
            <label class="flabel">Unité</label>
            <select id="newUnit" class="fselect">
              <option value="unité">unité</option>
              <option value="heure">heure</option>
              <option value="passage">passage</option>
              <option value="rotation">rotation</option>
              <option value="kit">kit</option>
              <option value="supplément">supplément</option>
              <option value="mois">mois</option>
            </select>
          </div>
        </div>

        <div class="fgrid">
          <div>
            <label class="flabel">Prix unitaire</label>
            <input id="newUnitPrice" class="finput" type="number" min="0" step="0.01" value="0">
          </div>
          <div style="display:flex;align-items:flex-end;">
            <button class="mini" id="addLineBtn" type="button">Ajouter</button>
          </div>
        </div>

        <div class="total-box" style="margin-top:8px;">
          <div class="mut">Total (prévision)</div>
          <div id="editTotalValue">0,00 €</div>
        </div>
      </div>

      <div class="modal-foot">
        <button class="mini primary" id="editSaveBtn" type="button">Enregistrer</button>
      </div>
    </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, orderBy, limit, getDocs,
      doc, updateDoc, deleteDoc, serverTimestamp, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ========= UI =========
    const helloLine = document.getElementById("helloLine");
    const companyLine = document.getElementById("companyLine");

    const alertBox = document.getElementById("alertBox");
    const listEl = document.getElementById("list");
    const countLabel = document.getElementById("countLabel");

    // search
    const searchInput = document.getElementById("searchInput");
    const clearSearchBtn = document.getElementById("clearSearchBtn");
    let searchQuery = "";

    // detail modal
    const detailBackdrop = document.getElementById("detailBackdrop");
    const detailCloseBtn = document.getElementById("detailCloseBtn");
    const detailModalSub = document.getElementById("detailModalSub");
    const detailModalContext = document.getElementById("detailModalContext");
    const detailModalLines = document.getElementById("detailModalLines");
    const detailModalTotalValue = document.getElementById("detailModalTotalValue");
    const detailEditBtn = document.getElementById("detailEditBtn");
    const detailDeleteBtn = document.getElementById("detailDeleteBtn");
    const detailInterventionBtn = document.getElementById("detailInterventionBtn");

    // edit modal
    const editBackdrop = document.getElementById("editBackdrop");
    const editModalAlert = document.getElementById("editModalAlert");
    const editArrivalDate = document.getElementById("editArrivalDate");
    const editArrivalTime = document.getElementById("editArrivalTime");
    const editDepartureDate = document.getElementById("editDepartureDate");
    const editDepartureTime = document.getElementById("editDepartureTime");
    const editNote = document.getElementById("editNote");
    const editCancelBtn = document.getElementById("editCancelBtn");
    const editSaveBtn = document.getElementById("editSaveBtn");
    const editLinesEl = document.getElementById("editLines");
    const editTotalValue = document.getElementById("editTotalValue");
    const newLabel = document.getElementById("newLabel");
    const newQty = document.getElementById("newQty");
    const newUnit = document.getElementById("newUnit");
    const newUnitPrice = document.getElementById("newUnitPrice");
    const addLineBtn = document.getElementById("addLineBtn");

    function showAlert(msg, ok=false){
      if(!alertBox) return;
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      if(!alertBox) return;
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function showEditModalAlert(msg, ok=false){
      if(!editModalAlert) return;
      editModalAlert.style.display = "block";
      editModalAlert.style.borderLeftColor = ok ? "var(--ok)" : "var(--bad)";
      editModalAlert.textContent = msg;
    }
    function hideEditModalAlert(){
      if(!editModalAlert) return;
      editModalAlert.style.display = "none";
      editModalAlert.textContent = "";
    }

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
    }
    function asRaw(s){ return String(s||"").toUpperCase().trim(); }
    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }
    function safeStr(v){ return (v ?? "").toString().trim(); }

    function normalizeOpStatus(s){
      const x = asRaw(s);
      if(x === "DRAFT" || x === "BROUILLON" || x === "EN COURS") return "EN_COURS";
      if(x === "REALISEE" || x === "RÉALISÉE" || x === "DONE") return "REALISEE";
      if(x === "ANNULEE" || x === "ANNULÉE" || x === "CANCELLED") return "ANNULEE";
      return "EN_COURS";
    }
    function opLabel(st){
      const s = normalizeOpStatus(st);
      if(s==="EN_COURS") return "EN COURS";
      if(s==="REALISEE") return "RÉALISÉE";
      if(s==="ANNULEE") return "ANNULÉE";
      return s;
    }

    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0)*(Number(l?.unitPrice)||0), 0);
    }

    function normalizeForSearch(d){
      const parts = [
        d.homeName, d.homeCity, d.homeType, d.homeAddress, d.homeZip,
        d.ownerName, d.ownerPhone,
        d.meta, d.summary,
        d.arrivalDateKey, d.arrivalTime, d.departureDateKey, d.departureTime,
        Array.isArray(d.lines) ? d.lines.map(l=>l?.label).join(" ") : ""
      ];
      return parts.filter(Boolean).join(" ").toLowerCase();
    }

    // ========= Datalist produits =========
    const PRODUCT_TEMPLATES = [
      { label:"Ménage standard (inter-séjour)", unit:"unité" },
      { label:"Ménage intermédiaire (long séjour)", unit:"supplément" },
      { label:"Back-to-back (ménage en urgence)", unit:"supplément" },
      { label:"Remise en état (logement non conforme)", unit:"supplément" },
      { label:"Rechange linge (rotation complète)", unit:"passage" },
      { label:"Collecte + lavage + séchage", unit:"unité" },
      { label:"Dépose / reprise blanchisserie", unit:"unité" },
      { label:"Check-in autonome (boîte à clés)", unit:"passage" },
      { label:"Check-in physique", unit:"passage" },
      { label:"Check-out", unit:"passage" },
      { label:"Gestion clés / badges", unit:"unité" },
      { label:"Récupération clés après sortie", unit:"passage" },
      { label:"Petite maintenance (ampoule, joint…)", unit:"unité" },
      { label:"Intervention d’urgence (fuite, serrure)", unit:"unité" },
      { label:"Coordination artisans", unit:"unité" },
      { label:"Réponses messages voyageurs", unit:"mois" },
      { label:"Kit essentiel", unit:"kit" },
      { label:"Kit cuisine", unit:"kit" },
      { label:"Kit bain", unit:"kit" },
      { label:"Kit séjour (Pack 2 pers)", unit:"kit" },
      { label:"Kit séjour (Pack 4 pers)", unit:"kit" },
      { label:"Kit séjour (Pack 6 pers)", unit:"kit" },
      { label:"Kit séjour (Pack 8 pers)", unit:"kit" },
      { label:"Réassort produit unitaire (papier, café…)", unit:"unité" },
      { label:"Autre (texte libre)", unit:"unité" }
    ];
    const LABEL_TO_TEMPLATE = new Map(PRODUCT_TEMPLATES.map(p => [p.label.toLowerCase(), p]));
    function fillPrestaDatalist(){
      const dl = document.getElementById("prestaList");
      if(!dl) return;
      dl.innerHTML = PRODUCT_TEMPLATES.map(p => `<option value="${esc(p.label)}"></option>`).join("");
    }
    newLabel?.addEventListener("input", ()=>{
      const t = LABEL_TO_TEMPLATE.get((newLabel.value || "").trim().toLowerCase());
      if(t && t.unit) newUnit.value = t.unit;
    });

    // ===== Guard placeholder =====
    async function guardConciergerie(user){ return true; }

    // ===== Raison sociale (HARD FIX) =====
    function pickCompanyName(d){
      if(!d) return "";
      return safeStr(
        d.raisonSociale ||
        d.raison_sociale ||
        d.societe ||
        d.companyName ||
        d.company ||
        d.nomSociete ||
        d.nomEntreprise ||
        d.businessName ||
        d.displayName ||
        d.name
      );
    }

    // ✅ Nom conciergerie = users/{uid}.businessProfile.companyName (comme conciergerie.html)
async function loadCompanyName(user){
  try{
    const uSnap = await getDoc(doc(db, "users", user.uid));
    const company = uSnap.exists() ? (uSnap.data()?.businessProfile?.companyName || "") : "";
    companyLine.textContent = (company || "").trim() || "Conciergerie";
  }catch(e){
    companyLine.textContent = "Conciergerie";
  }
}


      // debug
      console.log("[prestations] loadConciergerieCompanyName uid:", uid);

      // 1) users/{uid}
      try{
        const uSnap = await getDoc(doc(db, "users", uid));
        if(uSnap.exists()){
          const d = uSnap.data() || {};
          const name = pickCompanyName(d);
          console.log("[prestations] users/{uid} found:", d, "=>", name);
          if(name) return name;
        } else {
          console.log("[prestations] users/{uid} does not exist");
        }
      }catch(e){
        console.warn("[prestations] users/{uid} error:", e);
      }

      // 2) conciergeries/{uid}
      try{
        const cSnap = await getDoc(doc(db, "conciergeries", uid));
        if(cSnap.exists()){
          const d = cSnap.data() || {};
          const name = pickCompanyName(d);
          console.log("[prestations] conciergeries/{uid} found:", d, "=>", name);
          if(name) return name;
        } else {
          console.log("[prestations] conciergeries/{uid} does not exist");
        }
      }catch(e){
        console.warn("[prestations] conciergeries/{uid} error:", e);
      }

      // 3) conciergeries where uid == ...
      try{
        const q1 = query(collection(db, "conciergeries"), where("uid","==", uid), limit(1));
        const s1 = await getDocs(q1);
        if(!s1.empty){
          const d = s1.docs[0].data() || {};
          const name = pickCompanyName(d);
          console.log("[prestations] conciergeries where uid== found:", d, "=>", name);
          if(name) return name;
        } else {
          console.log("[prestations] conciergeries where uid== empty");
        }
      }catch(e){
        console.warn("[prestations] conciergeries where uid== error:", e);
      }

      // 4) conciergeries where conciergerieUid == ...
      try{
        const q2 = query(collection(db, "conciergeries"), where("conciergerieUid","==", uid), limit(1));
        const s2 = await getDocs(q2);
        if(!s2.empty){
          const d = s2.docs[0].data() || {};
          const name = pickCompanyName(d);
          console.log("[prestations] conciergeries where conciergerieUid== found:", d, "=>", name);
          if(name) return name;
        } else {
          console.log("[prestations] conciergeries where conciergerieUid== empty");
        }
      }catch(e){
        console.warn("[prestations] conciergeries where conciergerieUid== error:", e);
      }

      return "";
    }

    // ===== Search =====
    function applySearchUI(){
      const q = (searchQuery || "").trim();
      clearSearchBtn?.classList.toggle("show", !!q);
    }
    searchInput?.addEventListener("input", ()=>{
      searchQuery = searchInput.value || "";
      applySearchUI();
      renderList();
    });
    clearSearchBtn?.addEventListener("click", ()=>{
      searchQuery = "";
      if(searchInput) searchInput.value = "";
      applySearchUI();
      renderList();
      searchInput?.focus();
    });

    // ===== State =====
    let currentUser = null;
    const PAGE_SIZE = 60;
    let items = [];
    let selected = null;
    let editLinesDraft = [];

    // ===== Modales =====
    function openDetailModal(){ if(!selected) return; detailBackdrop.style.display="flex"; }
    function closeDetailModal(){ detailBackdrop.style.display="none"; }
    detailBackdrop?.addEventListener("click",(e)=>{ if(e.target===detailBackdrop) closeDetailModal(); });
    detailCloseBtn?.addEventListener("click", closeDetailModal);

    function openEditModal(){
      if(!selected) return;
      hideEditModalAlert();
      const op = normalizeOpStatus(selected.opStatus);
      if(op !== "EN_COURS"){ showAlert("⛔ Modification refusée : seulement EN COURS."); return; }

      editArrivalDate.value = selected.arrivalDateKey || selected.dateKey || "";
      editArrivalTime.value = selected.arrivalTime || selected.time || "";
      editDepartureDate.value = selected.departureDateKey || "";
      editDepartureTime.value = selected.departureTime || "";
      editNote.value = selected.meta || "";

      editLinesDraft = (Array.isArray(selected.lines) ? selected.lines : []).map(x => ({
        label: x.label || "",
        qty: Number(x.qty || 0),
        unit: x.unit || "unité",
        unitPrice: Number(x.unitPrice || 0),
        note: x.note || ""
      }));

      resetNewLineInputs();
      renderEditLines();
      editBackdrop.style.display = "flex";
      editArrivalDate.focus();
    }
    function closeEditModal(){ editBackdrop.style.display="none"; hideEditModalAlert(); }
    editBackdrop?.addEventListener("click",(e)=>{ if(e.target===editBackdrop) closeEditModal(); });
    editCancelBtn?.addEventListener("click", closeEditModal);

    function goPhotos(prestationId){
      location.href = `preuves-admin.html?prestationId=${encodeURIComponent(prestationId)}`;
    }

    // ===== List render =====
    function renderList(){
      listEl.innerHTML = "";
      const q = (searchQuery || "").trim().toLowerCase();
      const shown = q ? items.filter(x => (x._search || "").includes(q)) : items;

      if(countLabel) countLabel.textContent = `${shown.length} prestation(s)`;

      if(!shown.length){
        const div = document.createElement("div");
        div.className = "empty";
        div.textContent = q ? "Aucun résultat pour cette recherche." : "Aucune prestation.";
        listEl.appendChild(div);
        return;
      }

      for(const it of shown){
        const op = normalizeOpStatus(it.opStatus);
        const title = `${it.homeName || "Logement"}${it.homeCity ? " — " + it.homeCity : ""}${it.homeType ? " (" + it.homeType + ")" : ""}`;

        const div = document.createElement("div");
        div.className = "item";
        div.innerHTML = `
          <div class="i-main">
            <div class="i-title">${esc(title)}</div>
            <div class="actions">
              <button class="mini" type="button" data-open="${esc(it.id)}">Détails</button>
              <button class="mini" type="button" data-edit="${esc(it.id)}">Modifier</button>
              <button class="mini" type="button" data-photos="${esc(it.id)}" title="Photos">📷</button>
              ${ (op==="EN_COURS") ? `<button class="mini danger" type="button" data-del="${esc(it.id)}">Supprimer</button>` : `` }
              <button class="mini" type="button" data-program="${esc(it.id)}">Intervention</button>
              <span class="badge">${esc(money(Number(it.total || 0)))}</span>
            </div>
          </div>
        `;
        listEl.appendChild(div);

        div.querySelector("button[data-open]")?.addEventListener("click",(e)=>{ e.stopPropagation(); selectItem(it.id); openDetailModal(); });
        div.querySelector("button[data-edit]")?.addEventListener("click",(e)=>{ e.stopPropagation(); selectItem(it.id); openEditModal(); });
        div.querySelector("button[data-photos]")?.addEventListener("click",(e)=>{ e.stopPropagation(); goPhotos(it.id); });
        div.querySelector("button[data-program]")?.addEventListener("click",(e)=>{ e.stopPropagation(); location.href = `intervention.html?prestationId=${encodeURIComponent(it.id)}`; });
        div.querySelector("button[data-del]")?.addEventListener("click",(e)=>{ e.stopPropagation(); selectItem(it.id); deleteSelected(); });

        div.addEventListener("click", ()=>{ selectItem(it.id); openDetailModal(); });
      }
    }

    // ===== Detail render =====
    function renderDetail(){
      if(!selected){
        detailModalSub.textContent = "—";
        detailModalContext.innerHTML = "";
        detailModalLines.innerHTML = "";
        detailModalTotalValue.textContent = money(0);
        [detailEditBtn, detailDeleteBtn, detailInterventionBtn].forEach(b=> b.disabled = true);
        return;
      }

      const op = normalizeOpStatus(selected.opStatus);
      const title = `${selected.homeName || "Logement"}${selected.homeCity ? " — " + selected.homeCity : ""}${selected.homeType ? " ("+selected.homeType+")" : ""}`;

      const arrival = (selected.arrivalDateKey || selected.dateKey)
        ? `${selected.arrivalDateKey || selected.dateKey}${selected.arrivalTime ? " • " + selected.arrivalTime : ""}`
        : "—";
      const departure = selected.departureDateKey
        ? `${selected.departureDateKey}${selected.departureTime ? " • " + selected.departureTime : ""}`
        : "—";

      const addr = [selected.homeAddress, selected.homeZip].filter(Boolean).join(" ").trim() || "—";
      const owner = [selected.ownerName, selected.ownerPhone].filter(Boolean).join(" • ") || "—";

      detailModalSub.textContent = `#${selected.id.slice(0,6)} • ${opLabel(op)}`;

      detailModalContext.innerHTML = `
        <div class="ctx-row"><div class="k">Logement :</div><div class="v">${esc(title)}</div></div>
        <div class="ctx-row"><div class="k">Arrivée :</div><div class="v">${esc(arrival)}</div></div>
        <div class="ctx-row"><div class="k">Départ :</div><div class="v">${esc(departure)}</div></div>
        <div class="ctx-row"><div class="k">Adresse :</div><div class="v">${esc(addr)}</div></div>
        <div class="ctx-row"><div class="k">Propriétaire :</div><div class="v">${esc(owner)}</div></div>
      `;

      const lines = Array.isArray(selected.lines) ? selected.lines : [];
      const total = Number(selected.total || computeTotalFromLines(lines));

      detailModalLines.innerHTML = "";
      if(!lines.length){
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "Aucune ligne enregistrée.";
        detailModalLines.appendChild(e);
      }else{
        for(const l of lines){
          const lineTotal = (Number(l.qty)||0) * (Number(l.unitPrice)||0);
          const box = document.createElement("div");
          box.className = "line-box";
          box.innerHTML = `
            <div class="t">${esc(l.label || "Ligne")}</div>
            <div class="s">${esc(`${Number(l.qty||0)} ${l.unit || "unité"} • ${money(l.unitPrice)} / ${l.unit || "unité"} • total ${money(lineTotal)}`)}</div>
            ${l.note ? `<div class="n">${esc(l.note)}</div>` : ``}
          `;
          detailModalLines.appendChild(box);
        }
      }

      detailModalTotalValue.textContent = money(total);
      detailEditBtn.disabled = (op !== "EN_COURS");
      detailDeleteBtn.disabled = (op !== "EN_COURS");
      detailInterventionBtn.disabled = false;
    }

    function selectItem(id){
      selected = items.find(x=>x.id === id) || null;
      renderDetail();
    }

    async function patchSelected(data){
      if(!selected) return;
      hideAlert();

      const ref = doc(db,"events", selected.id);
      try{
        await updateDoc(ref, { ...data, updatedAt: serverTimestamp() });

        const i = items.findIndex(x=>x.id === selected.id);
        if(i >= 0){
          items[i] = { ...items[i], ...data };
          items[i]._search = normalizeForSearch(items[i]);
          selected = items[i];
        }

        renderList();
        renderDetail();
        showAlert("✅ Mise à jour enregistrée.", true);
      }catch(err){
        console.error(err);
        showAlert("Erreur mise à jour : " + (err?.message || "inconnue"));
      }
    }

    async function deleteSelected(){
      if(!selected) return;
      const op = normalizeOpStatus(selected.opStatus);
      if(op !== "EN_COURS"){ showAlert("⛔ Suppression refusée : uniquement EN COURS."); return; }
      const ok = confirm("Supprimer cette prestation ? (irréversible)");
      if(!ok) return;

      try{
        await deleteDoc(doc(db,"events", selected.id));
        items = items.filter(x=>x.id !== selected.id);
        selected = null;
        closeDetailModal();
        renderList();
        renderDetail();
        showAlert("✅ Prestation supprimée.", true);
      }catch(err){
        console.error(err);
        showAlert("Erreur suppression : " + (err?.message || "inconnue"));
      }
    }

    function resetNewLineInputs(){
      newLabel.value = "";
      newUnit.value = "unité";
      newQty.value = "1";
      newUnitPrice.value = "0";
    }
    function updateEditTotal(){
      const total = computeTotalFromLines(editLinesDraft);
      editTotalValue.textContent = money(total);
    }
    function renderEditLines(){
      editLinesEl.innerHTML = "";
      if(!editLinesDraft.length){
        const e = document.createElement("div");
        e.className = "empty";
        e.textContent = "Aucune ligne. Ajoute-en une ci-dessous.";
        editLinesEl.appendChild(e);
        updateEditTotal();
        return;
      }

      editLinesDraft.forEach((l, idx)=>{
        const box = document.createElement("div");
        box.className = "edit-line";
        box.innerHTML = `
          <div class="edit-line-top">
            <div class="name">${esc(l.label || "Ligne")}</div>
            <button class="mini danger" type="button" data-del-line="${idx}">Supprimer</button>
          </div>
          <div class="edit-line-grid">
            <div>
              <label class="flabel">Quantité</label>
              <input class="finput" type="number" min="0" step="0.5" value="${esc(l.qty ?? 0)}" data-qty="${idx}">
            </div>
            <div>
              <label class="flabel">Unité</label>
              <input class="finput" value="${esc(l.unit || "unité")}" data-unit="${idx}">
            </div>
            <div>
              <label class="flabel">Prix unitaire</label>
              <input class="finput" type="number" min="0" step="0.01" value="${esc(l.unitPrice ?? 0)}" data-price="${idx}">
            </div>
          </div>
        `;
        editLinesEl.appendChild(box);

        box.querySelector(`[data-del-line="${idx}"]`)?.addEventListener("click", ()=>{
          editLinesDraft.splice(idx, 1);
          renderEditLines();
        });
        box.querySelector(`[data-qty="${idx}"]`)?.addEventListener("input",(e)=>{
          editLinesDraft[idx].qty = Number(e.target.value || 0);
          updateEditTotal();
        });
        box.querySelector(`[data-unit="${idx}"]`)?.addEventListener("input",(e)=>{
          editLinesDraft[idx].unit = (e.target.value || "").trim() || "unité";
        });
        box.querySelector(`[data-price="${idx}"]`)?.addEventListener("input",(e)=>{
          editLinesDraft[idx].unitPrice = Number(e.target.value || 0);
          updateEditTotal();
        });
      });

      updateEditTotal();
    }

    addLineBtn?.addEventListener("click", ()=>{
      hideEditModalAlert();

      const rawLabel = (newLabel.value || "").trim();
      const tpl = LABEL_TO_TEMPLATE.get(rawLabel.toLowerCase());
      const label = tpl ? tpl.label : rawLabel;

      const qty = Number(newQty.value || 0);
      const unit = (tpl?.unit || newUnit.value || "unité").trim() || "unité";
      const unitPrice = Number(newUnitPrice.value || 0);

      if(!label){ showEditModalAlert("Choisis une prestation (ou tape un nom)."); return; }
      if(!(qty > 0)){ showEditModalAlert("Quantité invalide."); return; }
      if(!(unitPrice >= 0)){ showEditModalAlert("Prix unitaire invalide."); return; }

      editLinesDraft.push({ label, qty, unit, unitPrice });
      renderEditLines();
      resetNewLineInputs();
      newLabel.focus();
    });

    editSaveBtn?.addEventListener("click", async ()=>{
      if(!selected) return;
      hideEditModalAlert();

      const op = normalizeOpStatus(selected.opStatus);
      if(op !== "EN_COURS"){ showEditModalAlert("⛔ Modification refusée : seulement EN COURS."); return; }

      const aD = (editArrivalDate.value || "").trim();
      const aT = (editArrivalTime.value || "").trim();
      const dD = (editDepartureDate.value || "").trim();
      const dT = (editDepartureTime.value || "").trim();

      if(!aD){ showEditModalAlert("Arrivée (date) obligatoire."); return; }
      if(!editLinesDraft.length){ showEditModalAlert("Ajoute au moins une ligne avant d'enregistrer."); return; }

      const note = (editNote.value || "").trim();
      const total = computeTotalFromLines(editLinesDraft);

      await patchSelected({
        arrivalDateKey: aD, arrivalTime: aT,
        departureDateKey: dD, departureTime: dT,
        dateKey: aD, date: aD, time: aT,
        meta: note, lines: editLinesDraft, total
      });

      closeEditModal();
    });

    detailEditBtn?.addEventListener("click", ()=>{ closeDetailModal(); openEditModal(); });
    detailDeleteBtn?.addEventListener("click", deleteSelected);
    detailInterventionBtn?.addEventListener("click", ()=>{ if(!selected) return; location.href = `intervention.html?prestationId=${encodeURIComponent(selected.id)}`; });

    async function autoOpenFromQuery(){
      const openId = qs("open");
      if(!openId) return;
      const found = items.find(x=>x.id === openId);
      if(found){ selectItem(openId); openDetailModal(); return; }

      try{
        const snap = await getDoc(doc(db,"events", openId));
        if(!snap.exists()) return;
        const x = snap.data() || {};
        if(x.conciergerieUid !== currentUser.uid) return;

        const lines = Array.isArray(x.lines) ? x.lines : [];
        const total = (x.total != null) ? Number(x.total) : computeTotalFromLines(lines);
        const rawStatus = x.status || "EN_COURS";

        const obj = mapEventToItem(openId, x, lines, total, rawStatus);
        items.unshift(obj);

        renderList();
        selectItem(openId);
        openDetailModal();
      }catch(err){
        console.error(err);
      }
    }

    function mapEventToItem(id, x, lines, total, rawStatus){
      const obj = {
        id,
        _rawStatus: rawStatus,
        opStatus: x.opStatus || rawStatus,
        dateKey: x.dateKey || x.date || "",
        time: x.time || "",
        arrivalDateKey: x.arrivalDateKey || "",
        arrivalTime: x.arrivalTime || "",
        departureDateKey: x.departureDateKey || "",
        departureTime: x.departureTime || "",
        homeId: x.homeId || "",
        homeName: x.homeName || "",
        homeCity: x.homeCity || x.city || "",
        homeType: x.homeType || "",
        homeAddress: x.homeAddress || x.address || "",
        homeZip: x.homeZip || x.zip || "",
        ownerName: x.ownerName || "",
        ownerPhone: x.ownerPhone || x.phone || "",
        meta: x.meta || "",
        summary: x.summary || "",
        lines,
        total,
        createdAt: x.createdAt || null,
        _search: ""
      };
      obj._search = normalizeForSearch(obj);
      return obj;
    }

    async function loadInitial(){
      const q = query(
        collection(db,"events"),
        where("conciergerieUid","==", currentUser.uid),
        orderBy("createdAt","desc"),
        limit(PAGE_SIZE)
      );

      const snap = await getDocs(q);

      items = snap.docs.map(d=>{
        const x = d.data() || {};
        const lines = Array.isArray(x.lines) ? x.lines : [];
        const total = (x.total != null) ? Number(x.total) : computeTotalFromLines(lines);
        const rawStatus = x.status || "EN_COURS";
        return mapEventToItem(d.id, x, lines, total, rawStatus);
      });

      renderList();
      renderDetail();
      await autoOpenFromQuery();
    }

    // ===== Boot =====
    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }

      const ok = await guardConciergerie(user);
      if(!ok){
        location.href = "abonnement.html?plan=starter";
        return;
      }

      currentUser = user;

     if(helloLine) helloLine.textContent = "Bonjour,";
await loadCompanyName(user);


      // ✅ Raison sociale (HARD)
      let company = "";
      try{
        company = await loadConciergerieCompanyName(user);
      }catch(e){
        console.warn("loadConciergerieCompanyName:", e);
      }

      if(companyLine){
        companyLine.textContent = company || "Conciergerie";
      }

      // si encore fallback -> on te l'affiche clairement
      if(!company){
        showAlert("⚠️ Raison sociale introuvable. Ouvre la console (F12) et regarde les logs [prestations].");
      }

      fillPrestaDatalist();
      applySearchUI();

      try{
        hideAlert(); // on retire si tout ok ensuite
        selected = null;
        await loadInitial();
      }catch(err){
        console.error(err);
        showAlert("Erreur initialisation prestations : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
