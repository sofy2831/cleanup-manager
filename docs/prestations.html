<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Prestations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --violet-light:#F3ECFF;

      --text:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);
    }
    *,*::before,*::after{
      box-sizing:border-box;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    body{
      margin:0;
      background:linear-gradient(180deg,#F8F4FF 0%,#EDE6FF 80%);
      color:var(--text);
    }
    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 14px 96px;
    }

    /* Top bar */
    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:30;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      text-decoration:none;
      font-weight:800;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
    }

    /* Header */
    .logo{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:6px;
      margin-bottom:2px;
      text-align:center;
    }
    .logo-icon{
      width:42px;
      height:42px;
      border-radius:50%;
      background:#fff;
      border:2px solid var(--violet-main);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--violet-main);
      font-size:20px;
      font-weight:900;
      position:relative;
      flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px;
      right:-5px;
      font-size:12px;
      color:var(--violet-main);
    }
    h1{
      margin:0;
      font-size:24px;
      font-weight:900;
    }
    .subtitle{
      font-size:13px;
      font-weight:800;
      color:#444;
      text-align:center;
    }
    .emailLine{
      font-size:12px;
      font-weight:800;
      color:var(--muted);
      text-align:center;
      margin-top:4px;
    }
    .helloLine{
      margin-top:10px;
      font-size:13px;
      color:#333;
      font-weight:900;
      text-align:center;
    }

    .alert{
      width:100%;
      max-width:980px;
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:800;
      white-space:pre-wrap;
      color:#444;
    }
    .alert.ok{ border-left-color:var(--ok); }

    .layout{
      width:100%;
      max-width:980px;
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }
    .card{
      background:rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      min-width:0;
    }
