<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Prestations</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --bad:#b3261e;
      --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow:0 14px 36px rgba(0,0,0,0.08);
    }
    *,*::before,*::after{
      box-sizing:border-box;
      font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
    }
    body{
      margin:0;
      background:linear-gradient(180deg,#F8F4FF 0%,#EDE6FF 80%);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:14px 14px 96px;
    }

    /* Top bar */
    .topbar{
      width:100%;
      max-width:980px;
      position:sticky;
      top:0;
      z-index:10;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      text-decoration:none;
      font-weight:800;
      font-size:13px;
      cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      border-color:transparent;
      color:#fff;
    }

    /* Header */
    .logo{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:10px;
      margin-top:6px;
      margin-bottom:2px;
      text-align:center;
    }
    .logo-icon{
      width:42px;
      height:42px;
      border-radius:50%;
      background:#fff;
      border:2px solid var(--violet-main);
      display:flex;
      align-items:center;
      justify-content:center;
      color:var(--violet-main);
      font-size:20px;
      font-weight:900;
      position:relative;
    }
    .logo-icon::after{
      content:"✦";
      position:absolute;
      top:-6px;
      right:-5px;
      font-size:12px;
      color:var(--violet-main);
    }
    h1{
      margin:0;
      font-size:24px;
      font-weight:900;
    }
    .subtitle{
      font-size:13px;
      font-weight:800;
      color:#444;
      text-align:center;
    }
    .emailLine{
      font-size:12px;
      font-weight:800;
      color:var(--muted);
      text-align:center;
      margin-top:4px;
    }

    .alert{
      width:100%;
      max-width:980px;
      display:none;
      margin-top:10px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:800;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color:var(--ok); }

    /* Layout : UNE SEULE COLONNE */
    .layout{
      width:100%;
      max-width:980px;
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    .card{
      background:rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(10px);
      padding:12px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .card-title{
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:15px;
      font-weight:900;
    }
    .tiny{
      font-size:12px;
      font-weight:800;
      color:var(--muted);
    }

    /* List */
    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .item{
      background:#fff;
      border-radius:16px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px;
      display:flex;
      justify-content:space-between;
      gap:10px;
    }
    .i-title{
      font-size:13px;
      font-weight:900;
    }
    .i-sub{
      font-size:12px;
      font-weight:800;
      color:#666;
    }

    .actions{
      margin-top:8px;
      display:flex;
      gap:6px;
      flex-wrap:wrap;
      align-items:center;
    }

    .mini{
      border-radius:999px;
      padding:7px 10px;
      font-size:12px;
      font-weight:900;
      border:2px solid var(--violet-main);
      background:#fff;
      color:var(--violet-main);
      cursor:pointer;
    }
    .mini.danger{
      border-color:#ffc2d6;
      color:var(--bad);
    }

    .bottom-nav{
      position:fixed;
      left:0;
      right:0;
      bottom:0;
      display:flex;
      gap:6px;
      justify-content:space-around;
      padding:10px;
      background:rgba(255,255,255,.92);
      border-top:1px solid var(--border);
    }
    .bottom-nav a{
      text-decoration:none;
      font-size:11px;
      font-weight:800;
      padding:8px 10px;
      border-radius:999px;
      color:#666;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
    }
  </style>
</head>

    <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      collection, query, where, orderBy, limit, getDocs, startAfter,
      doc, updateDoc, deleteDoc, serverTimestamp, getDoc
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // ========= UI =========
    const emailLine = document.getElementById("emailLine");
    const logoutBtn = document.getElementById("logoutBtn");
    const alertBox = document.getElementById("alertBox");

    const chips = document.getElementById("chips");
    const searchInput = document.getElementById("searchInput");
    const sortSelect = document.getElementById("sortSelect");
    const refreshBtn = document.getElementById("refreshBtn");
    const listEl = document.getElementById("list");
    const countLabel = document.getElementById("countLabel");

    // (panneau détail: on le garde si présent mais on ne l'utilise plus)
    const detailHint = document.getElementById("detailHint");
    const detailKv = document.getElementById("detailKv");
    const detailLines = document.getElementById("detailLines");
    const detailTotalBox = document.getElementById("detailTotalBox");
    const detailTotalValue = document.getElementById("detailTotalValue");
    const editQuickBtn = document.getElementById("editQuickBtn");
    const toRealiseeBtn = document.getElementById("toRealiseeBtn");
    const deleteBtn = document.getElementById("deleteBtn");

    // detail modal
    const detailBackdrop = document.getElementById("detailBackdrop");
    const detailCloseBtn = document.getElementById("detailCloseBtn");
    const detailModalSub = document.getElementById("detailModalSub");
    const detailModalContext = document.getElementById("detailModalContext");
    const detailModalLines = document.getElementById("detailModalLines");
    const detailModalTotal = document.getElementById("detailModalTotal");
    const detailModalTotalValue = document.getElementById("detailModalTotalValue");

    const detailEditBtn = document.getElementById("detailEditBtn");
    const detailDeleteBtn = document.getElementById("detailDeleteBtn");
    const detailInterventionBtn = document.getElementById("detailInterventionBtn");

    // edit modal
    const editBackdrop = document.getElementById("editBackdrop");
    const editModalAlert = document.getElementById("editModalAlert");
    const editDate = document.getElementById("editDate");
    const editTime = document.getElementById("editTime");
    const editAgent = document.getElementById("editAgent");
    const editAgentEmail = document.getElementById("editAgentEmail");
    const editNote = document.getElementById("editNote");
    const editCancelBtn = document.getElementById("editCancelBtn");
    const editSaveBtn = document.getElementById("editSaveBtn");
    const editLinesEl = document.getElementById("editLines");
    const editTotalValue = document.getElementById("editTotalValue");
    const newLabel = document.getElementById("newLabel");
    const newQty = document.getElementById("newQty");
    const newUnit = document.getElementById("newUnit");
    const newUnitPrice = document.getElementById("newUnitPrice");
    const addLineBtn = document.getElementById("addLineBtn");

    function showAlert(msg, ok=false){
      if(!alertBox) return;
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      if(!alertBox) return;
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function showEditModalAlert(msg, ok=false){
      if(!editModalAlert) return;
      editModalAlert.style.display = "block";
      editModalAlert.style.borderLeftColor = ok ? "var(--ok)" : "var(--bad)";
      editModalAlert.textContent = msg;
    }
    function hideEditModalAlert(){
      if(!editModalAlert) return;
      editModalAlert.style.display = "none";
      editModalAlert.textContent = "";
    }

    function esc(s){
      return String(s ?? "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2})+" €";
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }
    function asRaw(s){ return String(s||"").toUpperCase().trim(); }
    function qs(name){ return new URLSearchParams(location.search).get(name) || ""; }

    // Op status
    function normalizeOpStatus(s){
      const x = asRaw(s);
      if(x === "DRAFT" || x === "BROUILLON" || x === "EN COURS") return "EN_COURS";
      if(x === "REALISEE" || x === "RÉALISÉE" || x === "DONE") return "REALISEE";
      if(x === "ANNULEE" || x === "ANNULÉE" || x === "CANCELLED") return "ANNULEE";
      return "EN_COURS";
    }
    function opLabel(st){
      const s = normalizeOpStatus(st);
      if(s==="EN_COURS") return "EN COURS";
      if(s==="REALISEE") return "RÉALISÉE";
      if(s==="ANNULEE") return "ANNULÉE";
      return s;
    }

    // Commercial (simple pour chips)
    function normQuoteStatus(s){
      const x = asRaw(s);
      if(x==="DRAFT") return "DRAFT";
      if(x==="SENT") return "SENT";
      if(x==="ACCEPTED") return "ACCEPTED";
      if(x==="REFUSED" || x==="REFUSEE" || x==="REFUSÉE") return "REFUSED";
      return "";
    }
    function normInvoiceStatus(s){
      const x = asRaw(s);
      if(x==="DRAFT") return "DRAFT";
      if(x==="SENT") return "SENT";
      if(x==="PAID" || x==="PAYEE" || x==="PAYÉE") return "PAID";
      return "";
    }

    function computeTotalFromLines(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0)*(Number(l?.unitPrice)||0), 0);
    }

    function normalizeForSearch(d){
      const parts = [
        d.homeName, d.homeCity, d.homeAddress,
        d.ownerName, d.ownerEmail,
        d.meta, d.summary,
        d.assignedToName, d.assignedToEmail,
        d.arrivalDateKey, d.arrivalTime, d.departureDateKey, d.departureTime,
        Array.isArray(d.lines) ? d.lines.map(l=>l?.label).join(" ") : ""
      ];
      return parts.filter(Boolean).join(" ").toLowerCase();
    }

    // ========= Produits (suggestions) =========
    const PRODUCT_TEMPLATES = [
      { label:"Ménage standard (inter-séjour)", unit:"unité" },
      { label:"Ménage intermédiaire (long séjour)", unit:"supplément" },
      { label:"Back-to-back (ménage en urgence)", unit:"supplément" },

    // ===== Filtering =====
    function filterByChip(it, chip){
      if(!chip) return true;
      const op = normalizeOpStatus(it.opStatus);

      if(["EN_COURS","REALISEE","ANNULEE"].includes(chip)) return op === chip;
      if(chip === "DEVIS") return normQuoteStatus(it.quoteStatus) !== "";
      if(chip === "FACTURE") return normInvoiceStatus(it.invoiceStatus) !== "";
      if(chip === "PAYEE") return normInvoiceStatus(it.invoiceStatus) === "PAID";
      return true;
    }

    function getFilteredSorted(){
      const q = (searchInput?.value || "").trim().toLowerCase();
      let arr = items.slice();

      if(statusFilter) arr = arr.filter(x => filterByChip(x, statusFilter));
      if(q) arr = arr.filter(x => (x._search || "").includes(q));

      const sort = sortSelect?.value || "created_desc";
      const safeDateKey = (x)=> (x.dateKey || "").toString();
      const safeCreated = (x)=> (x.createdAt?.seconds ? x.createdAt.seconds : 0);
      const safeTotal = (x)=> Number(x.total || 0);

      if(sort === "created_desc"){
        arr.sort((a,b)=> safeCreated(b)-safeCreated(a));
      }else if(sort === "date_desc"){
        arr.sort((a,b)=> safeDateKey(b).localeCompare(safeDateKey(a)) || (safeCreated(b)-safeCreated(a)));
      }else if(sort === "date_asc"){
        arr.sort((a,b)=> safeDateKey(a).localeCompare(safeDateKey(b)) || (safeCreated(b)-safeCreated(a)));
      }else if(sort === "total_desc"){
        arr.sort((a,b)=> safeTotal(b)-safeTotal(a) || (safeCreated(b)-safeCreated(a)));
      }else{
        arr.sort((a,b)=> safeCreated(b)-safeCreated(a));
      }
      return arr;
    }

        const i = items.findIndex(x=>x.id === selected.id);

    async function autoOpenFromQuery(){

      const found = items.find(x=>x.id === openId);
      if(found){
        selectItem(openId);
        openDetailModal();
        return;

      try{
        const snap = await getDoc(doc(db,"events", openId));
        if(!snap.exists()) return;
        const x = snap.data() || {};
        if(x.conciergerieUid !== currentUser.uid) return;

        const lines = Array.isArray(x.lines) ? x.lines : [];
        const total = (x.total != null) ? Number(x.total) : computeTotalFromLines(lines);
        const rawStatus = x.status || "EN_COURS";

        const obj = {
          id: openId,
          _rawStatus: rawStatus,
          opStatus: x.opStatus || rawStatus,

          // dates (presta)
          dateKey: x.dateKey || x.date || "",
          time: x.time || "",

          // dates (résa si dispo)
          arrivalDateKey: x.arrivalDateKey || "",
          arrivalTime: x.arrivalTime || "",
          departureDateKey: x.departureDateKey || "",
          departureTime: x.departureTime || "",

          homeId: x.homeId || "",
          homeName: x.homeName || "",
          homeCity: x.homeCity || x.city || "",
          homeAddress: x.homeAddress || x.address || "",

          ownerName: x.ownerName || "",
          ownerEmail: x.ownerEmail || "",

          meta: x.meta || "",
          summary: x.summary || "",
          lines,
          total,
          createdAt: x.createdAt || null,

          assignedToName: x.assignedToName || "",
          assignedToEmail: x.assignedToEmail || "",

          quoteStatus: x.quoteStatus || "",
          invoiceStatus: x.invoiceStatus || ""
        };
        obj._search = normalizeForSearch(obj);

        items.unshift(obj);
        renderList();
        selectItem(openId);
        openDetailModal();
      }catch(err){
        console.error(err);
      }
    }

    // ===== Load pages =====
    function buildQueryPage(isNextPage){
      const qArgs = [
        collection(db,"events"),
        where("conciergerieUid","==", currentUser.uid),
        orderBy("createdAt","desc"),
      ];
      if(isNextPage && lastDoc) qArgs.push(startAfter(lastDoc));
      qArgs.push(limit(PAGE_SIZE));
      return query(...qArgs);
    }

    async function loadPage(isNextPage=false){
      if(!currentUser) return;

      const q = buildQueryPage(isNextPage);
      const snap = await getDocs(q);

      const got = snap.docs.map(d=>{
        const x = d.data() || {};
        const lines = Array.isArray(x.lines) ? x.lines : [];
        const total = (x.total != null) ? Number(x.total) : computeTotalFromLines(lines);
        const rawStatus = x.status || "EN_COURS";

        const obj = {
          id: d.id,
          _rawStatus: rawStatus,
          opStatus: x.opStatus || rawStatus,

          // dates (presta)
          dateKey: x.dateKey || x.date || "",
          time: x.time || "",

          // dates (résa si dispo)
          arrivalDateKey: x.arrivalDateKey || "",
          arrivalTime: x.arrivalTime || "",
          departureDateKey: x.departureDateKey || "",
          departureTime: x.departureTime || "",

          homeId: x.homeId || "",
          homeName: x.homeName || "",
          homeCity: x.homeCity || x.city || "",
          homeAddress: x.homeAddress || x.address || "",

          ownerName: x.ownerName || "",
          ownerEmail: x.ownerEmail || "",

          meta: x.meta || "",
          summary: x.summary || "",
          lines,
          total,
          createdAt: x.createdAt || null,

          assignedToName: x.assignedToName || "",
          assignedToEmail: x.assignedToEmail || "",

          quoteStatus: x.quoteStatus || "",
          invoiceStatus: x.invoiceStatus || ""
        };

        obj._search = normalizeForSearch(obj);
        return obj;
      });

      if(!isNextPage){
        items = got;
        lastDoc = snap.docs.length ? snap.docs[snap.docs.length-1] : null;
      }else{
        items = items.concat(got);
        lastDoc = snap.docs.length ? snap.docs[snap.docs.length-1] : lastDoc;
      }

      renderList();
      renderDetail();
      await autoOpenFromQuery();
    }

    function setStatusFilter(next){
      statusFilter = next || "";
      resetDetail();
      renderList();
      renderDetail();
    }

    // ===== UI events =====
    chips?.querySelectorAll("button[data-status]")?.forEach(btn=>{
      btn.addEventListener("click", ()=>{
        chips.querySelectorAll(".chip").forEach(c=>c.classList.remove("active"));
        btn.classList.add("active");
        setStatusFilter(btn.getAttribute("data-status") || "");
      });
    });

    refreshBtn?.addEventListener("click", ()=>{
      hideAlert();
      lastDoc = null;
      resetDetail();
      loadPage(false).catch(err=>{
        console.error(err);
        showAlert("Erreur rafraîchir : " + (err?.message || "inconnue"));
      });
    });

    sortSelect?.addEventListener("change", ()=>{ renderList(); renderDetail(); });
    searchInput?.addEventListener("input", ()=>{ renderList(); renderDetail(); });

    // ===== Boot =====
    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }

      const ok = await guardConciergerie(user);
      if(!ok){
        location.href = "abonnement.html?plan=starter";
        return;
      }

      currentUser = user;
      if(emailLine) emailLine.textContent = user.email || user.uid;

      fillPrestaDatalist();

      try{
        hideAlert();
        resetDetail();
        lastDoc = null;
        await loadPage(false);
      }catch(err){
        console.error(err);
        showAlert("Erreur initialisation prestations : " + (err?.message || "inconnue"));
      }
    });
  </script>
</body>
</html>
