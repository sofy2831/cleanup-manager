<!-- docs/reglement-liste.html (FINAL v3 — schéma payments: montantRegle/modeReglement/dateReglement/reference/note) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Règlements</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:980px; position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .logo-title{ display:flex; justify-content:center; align-items:center; gap:10px; margin-top:10px; margin-bottom:6px; text-align:center; }
    .logo-icon{
      width:44px;height:44px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:22px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{ content:"✦"; position:absolute; top:-6px; right:-5px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:24px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:2px; font-size:14px; color:#444; text-align:center; }

    .wrap{ width:100%; max-width:980px; margin-top:14px; display:flex; flex-direction:column; gap:12px; min-width:0; }

    .card{
      background: rgba(255,255,255,0.86);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px 14px;
      backdrop-filter: blur(10px);
      min-width:0;
    }

    .alert{
      display:none; padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#444; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .kvs{ display:grid; grid-template-columns: 1fr 1fr 1fr; gap:10px; align-items:stretch; }
    @media(max-width:820px){ .kvs{ grid-template-columns: 1fr; } }

    .kv{
      background:#fff; border:1px solid rgba(122,92,255,0.18); border-radius:14px;
      padding:10px 12px; box-shadow:0 3px 10px rgba(0,0,0,.06); min-width:0;
    }
    .kv .t{ font-size:11px; color:#666; font-weight:900; }
    .kv .v{ margin-top:3px; font-size:13px; color:#111; font-weight:1000; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .badge{
      display:inline-flex; align-items:center; justify-content:center;
      padding:6px 10px; border-radius:999px;
      font-size:11px; font-weight:1000;
      border:1px solid rgba(122,92,255,0.25);
      background:#fff; color:#333; white-space:nowrap;
    }
    .badge.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .badge.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }

    .toolbar{ display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; }
    .btn{
      display:inline-flex; justify-content:center; align-items:center; gap:8px;
      padding:10px 12px; border-radius:999px; border:none; cursor:pointer; text-decoration:none;
      font-weight:1000; font-size:12px; background:#fff; color:var(--violet);
      border:1px solid rgba(122,92,255,0.35); box-shadow:0 8px 18px rgba(0,0,0,0.06);
      white-space:nowrap; user-select:none;
    }
    .btn.primary{ background:linear-gradient(90deg,var(--violet),var(--violet2)); color:#fff; border-color:transparent; box-shadow:0 12px 24px rgba(0,0,0,0.10); }
    .btn:disabled{ opacity:.45; cursor:not-allowed; pointer-events:none; }

    .line6{
      display:grid;
      grid-template-columns: 130px 120px 120px 1fr 160px;
      gap:10px;
      align-items:center;
      min-width:0;
    }
    @media(max-width:900px){
      .line6{ grid-template-columns: 1fr 1fr; grid-auto-rows:auto; }
    }
    .cell{ min-width:0; }
    .cell .t{ font-size:11px; color:#666; font-weight:900; }
    .cell .v{ font-size:13px; color:#111; font-weight:900; }
    .cell .v.ellipsis{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .sep{ height:1px; background: rgba(122,92,255,0.18); margin:10px 0; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; gap: 6px; justify-content: space-around; align-items: center;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex: 1; text-align: center; text-decoration: none;
      font-size: 11px; font-weight: 900; color: #666;
      padding: 10px 8px; border-radius: 999px; white-space: nowrap;
    }
    @media(min-width: 860px){
      .bottom-nav{
        position: static; width: 100%; max-width: 980px; margin: 14px 0 0;
        border-top: none; border: 1px solid rgba(122,92,255,0.18);
        border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08);
        padding: 12px 12px; gap: 10px;
      }
      .bottom-nav a{ font-size: 13px; padding: 12px 12px; }
      .page{ padding-bottom: 32px; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="factures-liste.html">← Retour</a>
      <span></span>
    </div>

    <div class="logo-title">
      <div class="logo-icon">€</div>
      <h1>Règlements</h1>
    </div>

    <div class="subtitle" id="subtitle">Historique des paiements</div>

    <div class="wrap">
      <div class="alert" id="alertBox"></div>

      <div class="card">
        <div class="kvs">
          <div class="kv"><div class="t">Facture</div><div class="v" id="invLine">—</div></div>
          <div class="kv"><div class="t">Client</div><div class="v" id="clientLine">—</div></div>
          <div class="kv"><div class="t">Statut</div><div class="v" id="statusLine">—</div></div>
          <div class="kv"><div class="t">Total TTC</div><div class="v" id="totalLine">—</div></div>
          <div class="kv"><div class="t">Total réglé</div><div class="v" id="paidLine">—</div></div>
          <div class="kv"><div class="t">Reste à régler</div><div class="v" id="dueLine">—</div></div>
        </div>

        <div class="sep"></div>

        <div class="toolbar">
          <a class="btn primary" id="newPayBtn" href="#">Ajouter un règlement</a>
          <span style="font-size:12px; color:#666; font-weight:900;" id="countLine">—</span>
        </div>
      </div>

      <div id="listBox" style="display:flex; flex-direction:column; gap:12px;"></div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="compta.html">Compta</a>
    <a href="messagerie.html">Messages</a>
  </nav>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, collection, query, orderBy, getDocs
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const invLine = document.getElementById("invLine");
    const clientLine = document.getElementById("clientLine");
    const statusLine = document.getElementById("statusLine");
    const totalLine = document.getElementById("totalLine");
    const paidLine = document.getElementById("paidLine");
    const dueLine = document.getElementById("dueLine");
    const listBox = document.getElementById("listBox");
    const newPayBtn = document.getElementById("newPayBtn");
    const countLine = document.getElementById("countLine");

    let currentUser = null;
    let invoiceId = "";

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function fmtDateFR(x){
      if(!x) return "—";
      try{
        if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
        const d = new Date(String(x));
        if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
        return "—";
      }catch{ return "—"; }
    }

    function computeHT(lines){
      if(!Array.isArray(lines)) return 0;
      return lines.reduce((s,l)=> s + (Number(l?.qty)||0) * (Number(l?.unitPrice)||0), 0);
    }
    async function loadVatConfig(uid){
      try{
        const uSnap = await getDoc(doc(db,"users",uid));
        const u = uSnap.exists() ? (uSnap.data()||{}) : {};
        const vat = u?.businessProfile?.vat || {};
        return {
          enabled: !!vat.enabled,
          rate: Number.isFinite(Number(vat.rate)) ? Number(vat.rate) : 0
        };
      }catch{
        return { enabled:false, rate:0 };
      }
    }
    function computeInvoiceTotalTTC(inv, vatCfg){
      const candidates = [inv?.totalTTC, inv?.invoiceTTC, inv?.invoiceTotal, inv?.total];
      for(const c of candidates){
        const n = Number(c);
        if(Number.isFinite(n) && n >= 0) return n;
      }
      const ht = computeHT(inv?.lines);
      const tva = vatCfg.enabled ? (ht * vatCfg.rate) : 0;
      return ht + tva;
    }

    function statusFrom(paid, total){
      const p = Number(paid)||0;
      const t = Number(total)||0;
      if(t <= 0) return "UNPAID";
      if(p <= 0) return "UNPAID";
      if(p + 1e-9 < t) return "PARTIAL";
      return "PAID";
    }
    function badgeHtml(st){
      const s = String(st||"").toUpperCase();
      if(s === "PAID") return `<span class="badge ok">Payée</span>`;
      if(s === "PARTIAL") return `<span class="badge">Partielle</span>`;
      return `<span class="badge bad">Non payée</span>`;
    }
    function modeLabel(mode){
      const m = String(mode||"").toUpperCase();
      if(m === "TRANSFER") return "Virement";
      if(m === "CARD") return "Carte";
      if(m === "CASH") return "Espèces";
      if(m === "CHEQUE") return "Chèque";
      return mode || "—";
    }

    async function loadInvoice(){
      const invRef = doc(db,"salesDocuments",invoiceId);
      const invSnap = await getDoc(invRef);
      if(!invSnap.exists()) throw new Error("Facture introuvable.");
      const inv = invSnap.data() || {};

      if(String(inv.conciergerieUid||"") !== String(currentUser.uid)){
        throw new Error("Accès refusé (facture d’une autre conciergerie).");
      }

      return { id: invSnap.id, ...inv };
    }

    async function loadPayments(){
      const pRef = collection(db,"salesDocuments",invoiceId,"payments");

      // ✅ TRI Firestore si possible (dateReglement partout)
      try{
        const qP = query(pRef, orderBy("dateReglement","desc"));
        const snap = await getDocs(qP);
        return snap.docs.map(d => ({ id:d.id, ...(d.data()||{}) }));
      }catch(e){
        // ✅ fallback (docs legacy / pas d'index / champ manquant)
        const snap = await getDocs(pRef);
        const arr = snap.docs.map(d => ({ id:d.id, ...(d.data()||{}) }));
        arr.sort((a,b)=>{
          const ta = a?.dateReglement?.toMillis?.() ? a.dateReglement.toMillis() : 0;
          const tb = b?.dateReglement?.toMillis?.() ? b.dateReglement.toMillis() : 0;
          return tb - ta;
        });
        return arr;
      }
    }

    function renderPayments(list){
      listBox.innerHTML = "";

      if(!list.length){
        listBox.innerHTML = `
          <div class="card">
            <b>Aucun règlement</b>
            <div style="margin-top:6px; font-size:12px; color:#666; font-weight:800;">
              Ajoute un règlement pour commencer.
            </div>
          </div>`;
        return;
      }

      for(const p of list){
        const amount = Number(p.montantRegle);
        const dateLabel = fmtDateFR(p.dateReglement);
        const mode = modeLabel(p.modeReglement);

        const ref = String(p.reference||"").trim();
        const note = String(p.note||"").trim();

        const div = document.createElement("div");
        div.className = "card";
        div.innerHTML = `
          <div class="line6">
            <div class="cell">
              <div class="t">Date de règlement</div>
              <div class="v">${esc(dateLabel)}</div>
            </div>

            <div class="cell">
              <div class="t">Mode</div>
              <div class="v">${esc(mode)}</div>
            </div>

            <div class="cell">
              <div class="t">Référence</div>
              <div class="v ellipsis" title="${esc(ref || "—")}">${esc(ref || "—")}</div>
            </div>

            <div class="cell">
              <div class="t">Note</div>
              <div class="v ellipsis" title="${esc(note || "—")}">${esc(note || "—")}</div>
            </div>

            <div class="cell" style="text-align:right;">
              <div class="t">Montant réglé</div>
              <div class="v">${fmtMoney(amount)}</div>
            </div>
          </div>
        `;
        listBox.appendChild(div);
      }
    }

    onAuthStateChanged(auth, async (user)=>{
      if(!user){
        location.href = "login.html?role=conciergerie";
        return;
      }
      currentUser = user;

      invoiceId = getParam("docId");
      if(!invoiceId){
        showAlert("⛔ docId manquant. Ex : reglement-liste.html?docId=XXXX");
        return;
      }

      newPayBtn.href = `reglement.html?docId=${encodeURIComponent(invoiceId)}`;

      hideAlert();
      try{
        const inv = await loadInvoice();
        const vatCfg = await loadVatConfig(user.uid);

        const totalTTC = computeInvoiceTotalTTC(inv, vatCfg);
        const payments = await loadPayments();

        // ✅ somme = montantRegle uniquement (schéma propre)
        let paidSum = 0;
        for(const p of payments){
          const a = Number(p.montantRegle);
          if(Number.isFinite(a)) paidSum += a;
        }

        const due = Math.max(0, totalTTC - paidSum);
        const st = statusFrom(paidSum, totalTTC);

        invLine.textContent = `N° ${String(inv.invoiceNumber||"").trim() || "—"}`;
        clientLine.textContent = String(inv.clientName || inv.ownerName || "—").trim();
        statusLine.innerHTML = badgeHtml(st);

        totalLine.textContent = fmtMoney(totalTTC);
        paidLine.textContent = fmtMoney(paidSum);
        dueLine.textContent = fmtMoney(due);

        countLine.textContent = `${payments.length} règlement${payments.length>1 ? "s" : ""}`;

        if(st === "PAID"){
          newPayBtn.classList.remove("primary");
          newPayBtn.setAttribute("aria-disabled","true");
          newPayBtn.style.pointerEvents = "none";
          newPayBtn.style.opacity = "0.55";
          newPayBtn.textContent = "Facture soldée";
        }

        renderPayments(payments);
      }catch(e){
        console.error(e);
        showAlert("⛔ " + (e?.message || "Erreur chargement règlements"));
      }
    });
  </script>
</body>
</html>
