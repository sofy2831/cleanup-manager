<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Dashboard propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 120px; }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center;
      gap:10px;
      padding:10px 0;
      position:sticky; top:0; z-index:10;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }

    .topbar-left,
    .topbar-right{
      display:flex;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .pill{
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      font-weight:900;
      font-size:13px;
      text-decoration:none;
      cursor:pointer;
      white-space:nowrap;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }

    .hero{
      width:100%;
      max-width:980px;
      margin-top:10px;
      text-align:center;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:6px;
    }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main); font-weight:1000;
      background:#fff;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
    }
    h1{ margin:0; font-size:24px; font-weight:900; }
    .subtitle{ font-size:15px; font-weight:800; color:#444; margin:0; }
    .ownerName{
      margin-top:4px;
      font-size:15px;
      font-weight:1000;
      text-align:center;
    }

    .badge{
      margin-top:12px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      font-size:12px;
      font-weight:900;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      width:100%;
      max-width:980px;
      white-space:pre-wrap;
      color:#333;
    }

    .wrap{ width:100%; max-width:980px; margin-top:14px; display:flex; flex-direction:column; gap:12px; }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
      backdrop-filter: blur(10px);
    }
    .cardTitle{
      display:flex; justify-content:space-between; align-items:center;
      font-weight:1000;
    }
    .tiny{ font-size:12px; font-weight:900; color:var(--muted); }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:10px;
    }
    @media(min-width:820px){
      .grid{ grid-template-columns:1fr 1fr; }
    }

    .btn{
      display:flex; justify-content:space-between; align-items:center;
      padding:12px;
      border-radius:16px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      font-weight:1000;
      text-decoration:none;
      gap:10px;
    }

    .count{
      min-width:26px;
      height:22px;
      padding:0 8px;
      border-radius:999px;
      background:#111;
      color:#fff;
      font-size:12px;
      font-weight:1000;
      display:none;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
    }

    .bottom-nav{
      position:fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
      box-shadow:0 -6px 20px rgba(0,0,0,0.08);
      backdrop-filter:blur(10px);
      z-index:50;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px;
      white-space:nowrap;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }

    @media(max-width:700px){
      .topbar{
        align-items:flex-start;
      }
      .topbar-left,
      .topbar-right{
        gap:8px;
      }
    }
  </style>
</head>

<body>
<div class="page">

  <div class="topbar">
    <div class="topbar-left">
      <a class="pill" id="profileBtn" href="profil-proprietaire.html?self=1">Mon profil</a>
      <a class="pill" id="supportBtn" href="#">Support</a>
    </div>

    <div class="topbar-right">
      <button class="pill" id="logoutBtn" type="button">Déconnexion</button>
    </div>
  </div>

  <div class="hero">
    <div class="logo-icon">✓</div>
    <h1>CleanUp Manager</h1>
    <p class="subtitle">Dashboard propriétaire</p>
    <div class="ownerName" id="ownerNameLine">—</div>
  </div>

  <div class="badge" id="alertsLine">Chargement…</div>

  <div class="wrap">
    <section class="card">
      <div class="cardTitle">
        <span>Accès</span>
        <span class="tiny">principal</span>
      </div>

      <div class="grid">
        <a class="btn" id="homesLink" href="owner-homes.html">🏠 Logements</a>
        <a class="btn" id="planningLink" href="owner-planning.html">📅 Planning</a>

        <a class="btn" id="messagesLink" href="owner-messages.html">
          <span>💬 Messages</span>
          <span class="count" id="countMsg">0</span>
        </a>

        <a class="btn" id="billingLink" href="owner-facturation.html">
          <span>🧾 Facturation</span>
          <span class="count" id="countBill">0</span>
        </a>

        <a class="btn" id="contractsLink" href="owner-contrats.html">
  <span>📄 Contrats</span>
  <span class="count" id="countContracts">0</span>
</a>
        
        <a class="btn" href="https://conciergerie45.cleanup-manager.fr/les-indispensables-du-proprietaire.html" target="_blank" rel="noopener">
          <span>🧰 Les indispensables du propriétaire</span>
          <span>↗</span>
        </a>

      </div>
    </section>
  </div>
</div>

<nav class="bottom-nav" aria-label="Navigation propriétaire">
  <a class="active" href="owner-dashboard.html" id="dashLink">Dashboard</a>
  <a href="owner-planning.html" id="navPlanning">Planning</a>
  <a href="owner-homes.html" id="navHomes">Logements</a>
  <a href="owner-messages.html" id="navMessages">Messages</a>
</nav>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { doc, getDoc, collection, query, where, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const ownerNameLine = document.getElementById("ownerNameLine");
  const alertsLine = document.getElementById("alertsLine");
  const countMsg = document.getElementById("countMsg");
  const countBill = document.getElementById("countBill");
  const countContracts = document.getElementById("countContracts");
const contractsLink = document.getElementById("contractsLink");

  const profileBtn = document.getElementById("profileBtn");
  const supportBtn = document.getElementById("supportBtn");
  const homesLink = document.getElementById("homesLink");
  const planningLink = document.getElementById("planningLink");
  const messagesLink = document.getElementById("messagesLink");
  const billingLink = document.getElementById("billingLink");

  const dashLink = document.getElementById("dashLink");
  const navPlanning = document.getElementById("navPlanning");
  const navHomes = document.getElementById("navHomes");
  const navMessages = document.getElementById("navMessages");

  const params = new URLSearchParams(location.search);
  const token = (params.get("token") || "").trim();

  function withToken(url){
    if(!token) return url;
    const u = new URL(url, location.href);
    u.searchParams.set("token", token);
    return u.pathname + "?" + u.searchParams.toString();
  }

  profileBtn.href = withToken("profil-proprietaire.html?self=1");
  homesLink.href = withToken("owner-homes.html");
  planningLink.href = withToken("owner-planning.html");
  messagesLink.href = withToken("owner-messages.html");
  billingLink.href = withToken("owner-facturation.html");
  contractsLink.href = withToken("owner-contrats.html");

  dashLink.href = withToken("owner-dashboard.html");
  navPlanning.href = withToken("owner-planning.html");
  navHomes.href = withToken("owner-homes.html");
  navMessages.href = withToken("owner-messages.html");

  let unsubThreads = null;
  let unsubSalesDocs = null;
  let unsubOwnerStatements = null;
  let unsubContracts = null;

  let gotThreadsOnce = false;
  let gotSalesDocsOnce = false;
  let gotOwnerStatementsOnce = false;
  let gotContractsOnce = false;

  let lastUnreadMsg = 0;
  let lastSalesDocsCount = 0;
  let lastOwnerStatementsCount = 0;
  let lastContractsCount = 0;

  let currentOwnerName = "";
  let currentUserEmail = "";
  let currentConciergerieName = "";
  let currentConciergerieUid = "";
  let currentOwnerDocId = "";

  function setCount(el, n){
    const v = Number(n || 0);
    if(v > 0){
      el.style.display = "inline-flex";
      el.textContent = String(v);
    }else{
      el.style.display = "none";
      el.textContent = "0";
    }
  }

  function totalBillingCount(){
    return Number(lastSalesDocsCount || 0) + Number(lastOwnerStatementsCount || 0);
  }

  function refreshBadges(){
    const billingTotal = totalBillingCount();

    setCount(countMsg, lastUnreadMsg);
    setCount(countBill, billingTotal);
    setCount(countContracts, lastContractsCount);

    if(!(gotThreadsOnce && gotSalesDocsOnce && gotOwnerStatementsOnce && gotContractsOnce)){
      alertsLine.textContent = "Chargement…";
      return;
    }

    alertsLine.textContent =
      `💬 Messages non lus : ${Number(lastUnreadMsg || 0)}\n` +
      `🧾 Documents : ${billingTotal}\n` +
`📄 Contrats : ${Number(lastContractsCount || 0)}`;
  }

function stopContracts(){
  try{ if(unsubContracts) unsubContracts(); }catch(_){}
  unsubContracts = null;
}

function startContractsBadge(ownerUid, conciergerieUid){
  stopContracts();

  gotContractsOnce = false;
  lastContractsCount = 0;

  const qContracts = query(
    collection(db, "contracts"),
    where("ownerUid", "==", String(ownerUid)),
    where("conciergerieUid", "==", String(conciergerieUid)),
    where("ownerVisible", "==", true)
  );

  unsubContracts = onSnapshot(qContracts, (snap)=>{
    lastContractsCount = snap.size || 0;
    gotContractsOnce = true;
    refreshBadges();
  }, (err)=>{
    console.warn("contracts badge listener:", err?.code, err?.message || err);
    lastContractsCount = 0;
    gotContractsOnce = true;
    refreshBadges();
  });
}
  
  function stopThreads(){
    try{ if(unsubThreads) unsubThreads(); }catch(_){}
    unsubThreads = null;
  }

  function stopSalesDocs(){
    try{ if(unsubSalesDocs) unsubSalesDocs(); }catch(_){}
    unsubSalesDocs = null;
  }

  function stopOwnerStatements(){
    try{ if(unsubOwnerStatements) unsubOwnerStatements(); }catch(_){}
    unsubOwnerStatements = null;
  }

  function stopBilling(){
    stopSalesDocs();
    stopOwnerStatements();
  }

  function hardRequireOwnerLinked(userDoc){
    const ownerDocId = String(userDoc?.ownerDocId || "").trim();
    const conciergerieUid = String(userDoc?.conciergerieUid || "").trim();
    return { ok: !!(ownerDocId && conciergerieUid), ownerDocId, conciergerieUid };
  }

  function buildSupportMailto(){
    const subject = "CleanUp Manager - Support propriétaire";

    const body = `Bonjour,

Propriétaire : ${currentOwnerName || ""}
Email du compte : ${currentUserEmail || ""}
Conciergerie : ${currentConciergerieName || ""}
Type de demande :
[ ] Bug
[ ] Question
[ ] Facturation
[ ] Autre

Problème rencontré :
-

Action effectuée :
-

Vous pouvez joindre des captures d’écran ou des photos à votre email.
`;

    return `mailto:contact@cleanup-manager.fr?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
  }

  function refreshSupportLink(){
    supportBtn.href = buildSupportMailto();
  }

  async function loadConciergerieName(conciergerieUid){
    try{
      if(!conciergerieUid){
        currentConciergerieName = "";
        refreshSupportLink();
        return;
      }

      const snap = await getDoc(doc(db, "users", conciergerieUid));
      const data = snap.exists() ? (snap.data() || {}) : {};
      currentConciergerieName = String(
        data?.businessProfile?.companyName || data?.companyName || ""
      ).trim();
      refreshSupportLink();
    }catch(_){
      currentConciergerieName = "";
      refreshSupportLink();
    }
  }

  function startUnreadThreadsListener(ownerUid, conciergerieUid){
    stopThreads();
    gotThreadsOnce = false;

    const qThreads = query(
      collection(db, "threads"),
      where("ownerUid", "==", String(ownerUid)),
      where("conciergerieUid", "==", String(conciergerieUid))
    );

    unsubThreads = onSnapshot(qThreads, (snap)=>{
      let totalUnread = 0;
      snap.forEach(d=>{
        const t = d.data() || {};
        totalUnread += Number(t.unreadForOwner || 0);
      });
      lastUnreadMsg = totalUnread;
      gotThreadsOnce = true;
      refreshBadges();
    }, (err)=>{
      console.warn("threads unread listener:", err?.code, err?.message || err);
      lastUnreadMsg = 0;
      gotThreadsOnce = true;
      refreshBadges();
    });
  }

  function startBillingBadge(ownerUid, conciergerieUid){
    stopBilling();
    stopContracts();

    gotSalesDocsOnce = false;
    gotOwnerStatementsOnce = false;

    lastSalesDocsCount = 0;
    lastOwnerStatementsCount = 0;

    const qSalesDocs = query(
      collection(db, "salesDocuments"),
      where("ownerUid", "==", String(ownerUid)),
      where("conciergerieUid", "==", String(conciergerieUid)),
      where("ownerVisible", "==", true)
    );

    unsubSalesDocs = onSnapshot(qSalesDocs, (snap)=>{
      lastSalesDocsCount = snap.size || 0;
      gotSalesDocsOnce = true;
      refreshBadges();
    }, (err)=>{
      console.warn("salesDocuments badge listener:", err?.code, err?.message || err);
      lastSalesDocsCount = 0;
      gotSalesDocsOnce = true;
      refreshBadges();
    });

    const qOwnerStatements = query(
      collection(db, "ownerStatements"),
      where("ownerUid", "==", String(ownerUid)),
      where("conciergerieUid", "==", String(conciergerieUid)),
      where("ownerVisible", "==", true)
    );

    unsubOwnerStatements = onSnapshot(qOwnerStatements, (snap)=>{
      lastOwnerStatementsCount = snap.size || 0;
      gotOwnerStatementsOnce = true;
      refreshBadges();
    }, (err)=>{
      console.warn("ownerStatements badge listener:", err?.code, err?.message || err);
      lastOwnerStatementsCount = 0;
      gotOwnerStatementsOnce = true;
      refreshBadges();
    });
  }

  document.getElementById("logoutBtn").addEventListener("click", async ()=>{
    stopThreads();
    stopBilling();
    stopContracts();
    
    try{ await signOut(auth); }catch(e){ console.warn("signOut:", e?.message || e); }
    try{ localStorage.removeItem("cm_auth"); }catch(_){}
    location.replace(withToken("login.html?role=proprietaire"));
  });

  refreshBadges();
  refreshSupportLink();

  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      location.replace(withToken("login.html?role=proprietaire"));
      return;
    }

    try{
      const us = await getDoc(doc(db, "users", user.uid));
      const ud = us.exists() ? (us.data() || {}) : {};

      const role = String(ud.role || "").toLowerCase().trim();
      if(role !== "proprietaire"){
        stopThreads();
        stopBilling();
        stopContracts();
        location.replace(withToken("login.html?role=proprietaire"));
        return;
      }

      const link = hardRequireOwnerLinked(ud);
      if(!link.ok){
        stopThreads();
        stopBilling();
        stopContracts();
        location.replace(withToken("profil-proprietaire.html?self=1"));
        return;
      }

      let name = String(ud.fullname || ud.displayName || "").trim();
      if(!name){
        name = user.email || "Propriétaire";
      }

      currentOwnerName = name;
      currentUserEmail = String(user.email || "").trim();
      currentConciergerieUid = String(link.conciergerieUid || "").trim();
      currentOwnerDocId = String(link.ownerDocId || "").trim();

      ownerNameLine.textContent = "Bonjour et bienvenue " + name;
      refreshSupportLink();
      loadConciergerieName(currentConciergerieUid);

      startUnreadThreadsListener(user.uid, link.conciergerieUid);
      startBillingBadge(user.uid, link.conciergerieUid);
      startContractsBadge(user.uid, link.conciergerieUid);

      refreshBadges();
    }catch(e){
      console.error(e);
      gotThreadsOnce = true;
      gotSalesDocsOnce = true;
      gotOwnerStatementsOnce = true;
      alertsLine.textContent = "⛔ Erreur dashboard (users/rules). Va sur Mon profil puis Enregistrer.";
    }
  });

  window.addEventListener("beforeunload", ()=>{
    stopThreads();
    stopBilling();
    stopContracts();
  });
</script>
</body>
</html>
