<!-- docs/owner-dashboard.html — FINAL PROPRE -->
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanUp Manager — Dashboard propriétaire</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --violet-main:#7A5CFF;
  --violet-dark:#6238FF;
  --bg1:#F8F4FF;
  --bg2:#EDE6FF;
  --text:#111;
  --muted:#666;
  --border:rgba(122,92,255,.18);
  --shadow:0 14px 36px rgba(0,0,0,.08);
}
*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:var(--text)}

.page{min-height:100vh;padding:16px 16px 110px;display:flex;flex-direction:column;align-items:center}

.topbar{
  width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center;
  padding:10px 0;position:sticky;top:0;z-index:20;
  background:rgba(248,244,255,.85);backdrop-filter:blur(6px)
}
.pill{
  padding:8px 12px;border-radius:999px;font-weight:900;font-size:13px;
  border:2px solid var(--violet-main);background:#fff;color:var(--violet-main);
  text-decoration:none;cursor:pointer
}
.pill.primary{
  background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
  border:none;color:#fff
}

.logo{display:flex;align-items:center;gap:8px;margin-top:12px}
.logoIcon{
  width:38px;height:38px;border-radius:50%;border:2px solid var(--violet-main);
  display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--violet-main)
}
h1{margin:0;font-size:24px;font-weight:900}
.subtitle{font-size:14px;font-weight:800;color:#444;text-align:center}

.badgeLine{
  margin-top:8px;padding:6px 10px;border-radius:999px;background:#fff;
  font-size:12px;font-weight:900;color:#555;box-shadow:0 3px 10px rgba(0,0,0,.06)
}

.wrap{width:100%;max-width:980px;margin-top:16px;display:flex;flex-direction:column;gap:12px}

.card{
  background:rgba(255,255,255,.9);border:1px solid var(--border);
  border-radius:18px;box-shadow:var(--shadow);padding:14px
}
.cardTitle{font-size:14px;font-weight:1000}
.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{
  flex:1;min-width:200px;padding:10px;border-radius:999px;
  border:2px solid var(--violet-main);background:#fff;
  font-weight:900;font-size:13px;text-decoration:none;color:var(--violet-main);
  display:flex;align-items:center;justify-content:center;gap:6px
}
.btn.primary{
  background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
  border:none;color:#fff
}

/* DOT */
.dot{
  display:none;min-width:18px;height:18px;border-radius:999px;
  background:#ff3b3b;color:#fff;font-size:11px;
  font-weight:900;align-items:center;justify-content:center
}

/* BOTTOM NAV — DEFINITIVE */
.bottom-nav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:50;
  width:calc(100% - 16px);max-width:980px;
  display:flex;justify-content:space-around;gap:6px;
  padding:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.96);
  border:1px solid var(--border);border-bottom:none;
  border-radius:18px 18px 0 0;
  backdrop-filter:blur(10px);
  box-shadow:0 -6px 18px rgba(0,0,0,.08)
}
.bottom-nav a{
  flex:1;text-align:center;font-size:11px;font-weight:1000;
  text-decoration:none;color:#666;padding:8px;border-radius:999px;
  position:relative
}
.bottom-nav a.active{
  background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
  color:#fff
}
.bottom-nav .dot{
  position:absolute;top:3px;right:14px;width:8px;height:8px;
  background:#ff3b3b;border-radius:50%
}
</style>
</head>

<body>
<div class="page">

  <div class="topbar">
    <a class="pill" href="index.html">← Accueil</a>
    <div style="display:flex;gap:8px">
      <a class="pill" id="profileBtn" href="profil-proprietaire.html?self=1">Mon profil</a>
      <button class="pill" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <div class="logo">
    <div class="logoIcon">✓</div>
    <h1>CleanUp Manager</h1>
  </div>
  <div class="subtitle">Espace propriétaire</div>
  <div class="badgeLine" id="badgeLine">—</div>

  <div class="wrap">

    <div class="card">
      <div class="cardTitle">Planning & interventions</div>
      <div class="quick">
        <a class="btn primary" href="owner-planning.html">
          Planning <span class="dot" id="dotPlanning"></span>
        </a>
        <a class="btn" href="owner-homes.html">Mes logements</a>
      </div>
    </div>

    <div class="card">
      <div class="cardTitle">Messages</div>
      <div class="quick">
        <a class="btn primary" href="owner-messages.html">
          Messages <span class="dot" id="dotMsg"></span>
        </a>
        <a class="btn" href="owner-import-ical.html">iCal</a>
      </div>
    </div>

    <div class="card">
      <div class="cardTitle">Facturation</div>
      <div class="quick">
        <a class="btn primary" href="owner-facturation.html">
          Devis / Factures <span class="dot" id="dotBill"></span>
        </a>
        <a class="btn" href="owner-messages.html">Contacter la conciergerie</a>
      </div>
    </div>

  </div>
</div>

<nav class="bottom-nav">
  <a class="active" href="owner-dashboard.html">Dashboard</a>
  <a href="owner-messages.html">Messages <span class="dot" id="dotMsgBottom"></span></a>
  <a href="owner-facturation.html">Facturation <span class="dot" id="dotBillBottom"></span></a>
</nav>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  doc, getDoc,
  collection, query, where, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

function setDot(el,n){
  if(!el) return;
  if(n>0){ el.style.display="flex"; el.textContent=n; }
  else{ el.style.display="none"; }
}

document.getElementById("logoutBtn").onclick = async ()=>{
  await signOut(auth);
  location.href="index.html";
};

onAuthStateChanged(auth, async user=>{
  if(!user){
    location.href="login.html?role=proprietaire";
    return;
  }

  const us = await getDoc(doc(db,"users",user.uid));
  const ownerDocId = us.exists() ? us.data().ownerDocId : "";
  if(!ownerDocId){
    location.href="profil-proprietaire.html?self=1";
    return;
  }

  document.getElementById("badgeLine").textContent =
    `Connecté : ${user.email}`;

  /* ===== BADGES ===== */

  onSnapshot(
    query(collection(db,"threads"),
      where("ownerUid","==",user.uid),
      where("unreadOwnerCount",">",0)
    ),
    snap=>{
      let n=0;
      snap.forEach(d=> n+=Number(d.data().unreadOwnerCount||0));
      setDot(dotMsg,n);
      setDot(dotMsgBottom,n);
    }
  );

  onSnapshot(
    query(collection(db,"documents"),
      where("ownerUid","==",user.uid),
      where("unreadByOwner","==",true)
    ),
    snap=>{
      setDot(dotBill,snap.size);
      setDot(dotBillBottom,snap.size);
    }
  );

  onSnapshot(
    query(collection(db,"events"),
      where("ownerUid","==",user.uid),
      where("status","==","PLANNED"),
      where("notifyOwner","==",true)
    ),
    snap=>{
      setDot(dotPlanning,snap.size);
    }
  );
});
</script>
</body>
</html>
