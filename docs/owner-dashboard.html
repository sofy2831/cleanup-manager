<!-- docs/owner-dashboard.html (FINAL CLEAN – no QR, human greeting, no tech data) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Dashboard propriétaire</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet-main:#7A5CFF;
      --violet-dark:#6238FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --card: rgba(255,255,255,0.88);
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1),var(--bg2)); color:var(--text); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 120px; }

    .topbar{
      width:100%; max-width:980px;
      display:flex; justify-content:space-between; align-items:center;
      padding:10px 0;
      position:sticky; top:0; z-index:10;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      padding:8px 12px;
      border-radius:999px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      font-weight:900;
      font-size:13px;
      text-decoration:none;
      cursor:pointer;
    }

    .logo-title{
      display:flex; justify-content:center; align-items:center; gap:8px;
      margin-top:10px;
    }
    .logo-icon{
      width:38px;height:38px;border-radius:50%;
      border:2px solid var(--violet-main);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet-main); font-weight:900;
    }

    h1{ margin:0; font-size:24px; font-weight:900; }
    .subtitle{ font-size:15px; font-weight:800; color:#444; text-align:center; }

    .hello{
      margin-top:6px;
      font-size:15px;
      font-weight:900;
      text-align:center;
    }

    .badge{
      margin-top:10px;
      padding:8px 12px;
      border-radius:14px;
      background:#fff;
      font-size:12px;
      font-weight:900;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      width:100%;
      max-width:980px;
    }

    .wrap{ width:100%; max-width:980px; margin-top:14px; display:flex; flex-direction:column; gap:12px; }

    .card{
      background:var(--card);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:14px;
    }
    .cardTitle{
      display:flex; justify-content:space-between; align-items:center;
      font-weight:1000;
    }
    .tiny{ font-size:12px; font-weight:900; color:var(--muted); }

    .grid{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
      margin-top:10px;
    }
    @media(min-width:820px){
      .grid{ grid-template-columns:1fr 1fr; }
    }

    .btn{
      display:flex; justify-content:space-between; align-items:center;
      padding:12px;
      border-radius:16px;
      background:#fff;
      border:2px solid var(--violet-main);
      color:var(--violet-main);
      font-weight:1000;
      text-decoration:none;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
      border:none;
    }

    .count{
      min-width:26px;
      height:22px;
      padding:0 8px;
      border-radius:999px;
      background:#111;
      color:#fff;
      font-size:12px;
      font-weight:1000;
      display:none;
      align-items:center;
      justify-content:center;
    }

    .bottom-nav{
      position:fixed; left:50%; transform:translateX(-50%); bottom:0;
      width:calc(100% - 20px); max-width:980px;
      display:flex; gap:6px; padding:8px;
      background:rgba(255,255,255,0.96);
      border:1px solid var(--border); border-bottom:none;
      border-radius:22px 22px 0 0;
    }
    .bottom-nav a{
      flex:1; text-align:center;
      font-size:11px; font-weight:1000;
      text-decoration:none; color:#666;
      padding:10px; border-radius:999px;
    }
    .bottom-nav a.active{
      background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
      color:#fff;
    }
  </style>
</head>

<body>
<div class="page">

  <div class="topbar">
    <a class="pill" id="profileBtn" href="profil-proprietaire.html?self=1">Mon profil</a>
    <button class="pill" id="logoutBtn">Déconnexion</button>
  </div>

  <div class="logo-title">
    <div class="logo-icon">✓</div>
    <h1>CleanUp Manager</h1>
  </div>
  <div class="subtitle">Dashboard propriétaire</div>
  <div class="hello" id="helloLine">Bonjour</div>

  <div class="badge" id="alertsLine">—</div>

  <div class="wrap">

    <section class="card">
      <div class="cardTitle">
        <span>Accès</span>
        <span class="tiny">principal</span>
      </div>

      <div class="grid">
        <a class="btn primary" href="owner-homes.html">🏠 Logements</a>
        <a class="btn" href="owner-planning.html">📅 Planning</a>
        <a class="btn" href="owner-messages.html">
          💬 Messages <span class="count" id="countMsg">0</span>
        </a>
        <a class="btn" href="owner-facturation.html">
          🧾 Facturation <span class="count" id="countBill">0</span>
        </a>
      </div>
    </section>

  </div>
</div>

<nav class="bottom-nav">
  <a class="active" href="owner-dashboard.html">Dashboard</a>
  <a href="owner-messages.html">Messages</a>
  <a href="owner-facturation.html">Facturation</a>
</nav>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const helloLine = document.getElementById("helloLine");
  const alertsLine = document.getElementById("alertsLine");
  const countMsg = document.getElementById("countMsg");
  const countBill = document.getElementById("countBill");

  function setCount(el, n){
    if(n>0){ el.style.display="inline-flex"; el.textContent=n; }
    else{ el.style.display="none"; }
  }

  function refreshBadges(){
    const um = Number(localStorage.getItem("cm_owner_unread_messages")||0);
    const ub = Number(localStorage.getItem("cm_owner_unread_billing")||0);
    setCount(countMsg, um);
    setCount(countBill, ub);
    alertsLine.textContent =
      `💬 Messages non lus : ${um}\n🧾 Nouveaux devis/factures : ${ub}`;
  }

  document.getElementById("logoutBtn").onclick = async ()=>{
    await signOut(auth);
    location.href="index.html";
  };

  onAuthStateChanged(auth, async (user)=>{
    if(!user){
      location.href="login.html?role=proprietaire";
      return;
    }
    const us = await getDoc(doc(db,"users",user.uid));
    const ud = us.exists()?us.data():{};
    const od = ud.ownerDocId;
    if(!od){ location.href="profil-proprietaire.html?self=1"; return; }
    const os = await getDoc(doc(db,"owners",od));
    if(!os.exists()){ location.href="profil-proprietaire.html?self=1"; return; }
    const o = os.data();
    helloLine.textContent = "Bonjour " + (o.company || o.legalName || o.fullname || user.email);
    refreshBadges();
  });
</script>
</body>
</html>
