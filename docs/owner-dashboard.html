<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CleanUp Manager – Dashboard propriétaire</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
:root{
  --violet-main:#7A5CFF;
  --violet-dark:#6238FF;
  --bg1:#F8F4FF;
  --bg2:#EDE6FF;
  --border:rgba(122,92,255,0.18);
  --shadow:0 14px 36px rgba(0,0,0,0.08);
  --card:rgba(255,255,255,0.9);
}
*{box-sizing:border-box;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;}
body{margin:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));color:#111;}

.page{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:16px;
  padding-bottom:120px;
}

.topbar{
  width:100%;
  max-width:980px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
}

.pill{
  padding:8px 12px;
  border-radius:999px;
  background:#fff;
  border:2px solid var(--violet-main);
  color:var(--violet-main);
  font-weight:900;
  font-size:13px;
  text-decoration:none;
  cursor:pointer;
}

.logo{
  margin:16px 0 4px;
  display:flex;
  align-items:center;
  gap:8px;
}
.logo-icon{
  width:36px;height:36px;border-radius:50%;
  border:2px solid var(--violet-main);
  display:flex;align-items:center;justify-content:center;
  font-weight:900;color:var(--violet-main);
}
h1{margin:0;font-size:22px;font-weight:900;}
.subtitle{font-size:14px;font-weight:800;color:#444;}

.wrap{
  width:100%;
  max-width:980px;
  display:flex;
  flex-direction:column;
  gap:12px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  padding:14px;
}

.cardTitle{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:900;
  font-size:14px;
}

.quick{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}
.btn{
  flex:1;
  min-width:200px;
  padding:10px 12px;
  border-radius:999px;
  border:2px solid var(--violet-main);
  background:#fff;
  color:var(--violet-main);
  font-weight:900;
  text-decoration:none;
  text-align:center;
}
.btn.primary{
  background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
  border-color:transparent;
  color:#fff;
}

.dot{
  position:absolute;
  top:-4px; right:-6px;
  background:#ff3b3b;
  color:#fff;
  font-size:10px;
  font-weight:900;
  padding:2px 6px;
  border-radius:999px;
  display:none;
}

/* ===== Bottom nav ===== */
.bottom-nav{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom:0;
  width:calc(100% - 20px);
  max-width:980px;
  display:flex;
  gap:6px;
  padding:8px;
  background:#fff;
  border:1px solid var(--border);
  border-bottom:none;
  border-radius:22px 22px 0 0;
  box-shadow:0 -6px 20px rgba(0,0,0,0.08);
}
.bottom-nav a{
  flex:1;
  text-align:center;
  padding:10px;
  border-radius:999px;
  font-weight:900;
  font-size:11px;
  text-decoration:none;
  color:#666;
  position:relative;
}
.bottom-nav a.active{
  background:linear-gradient(90deg,var(--violet-main),var(--violet-dark));
  color:#fff;
}

/* ===== Mobile access ===== */
#mobileBody{display:none;margin-top:10px;}
.hiddenHint{display:none;font-size:12px;color:#666;}
</style>
</head>

<body>
<div class="page">

  <div class="topbar">
    <a class="pill" href="index.html">← Accueil</a>
    <div style="display:flex;gap:8px;">
      <a class="pill" href="profil-proprietaire.html?self=1">Mon profil</a>
      <button class="pill" id="logoutBtn">Déconnexion</button>
    </div>
  </div>

  <div class="logo">
    <div class="logo-icon">✓</div>
    <h1>CleanUp Manager</h1>
  </div>
  <div class="subtitle">Dashboard propriétaire</div>

  <div class="wrap">

    <!-- ALERTES -->
    <div class="card">
      <div class="cardTitle">Alertes & activité</div>
      <div class="quick">
        <a class="btn" href="owner-messages.html">
          Messages
          <span class="dot" id="dotMsg">0</span>
        </a>
        <a class="btn" href="owner-facturation.html">
          Facturation
          <span class="dot" id="dotBill">0</span>
        </a>
        <a class="btn" href="owner-planning.html">
          Interventions
          <span class="dot" id="dotPlan">0</span>
        </a>
      </div>
    </div>

    <!-- LOGEMENTS -->
    <div class="card">
      <div class="cardTitle">Mes logements</div>
      <div class="quick">
        <a class="btn primary" href="owner-homes.html">Voir mes logements</a>
        <a class="btn" href="owner-homes.html#ical">Importer un iCal</a>
      </div>
    </div>

    <!-- PLANNING -->
    <div class="card">
      <div class="cardTitle">Planning</div>
      <div class="quick">
        <a class="btn primary" href="owner-planning.html">Ouvrir le planning</a>
      </div>
    </div>

    <!-- ACCÈS MOBILE -->
    <div class="card" id="mobileCard">
      <div class="cardTitle">
        Accès sur mobile
        <button class="pill" id="toggleMobile">Afficher</button>
      </div>

      <div id="mobileBody">
        <div style="display:flex;gap:12px;flex-wrap:wrap;">
          <img id="qrImg" style="width:150px;height:150px;border-radius:12px;background:#fff;">
          <div style="flex:1;min-width:220px;">
            <input id="loginLink" readonly style="width:100%;padding:10px;border-radius:12px;">
            <div class="quick">
              <button class="pill" id="copyBtn">Copier</button>
              <a class="pill" id="openBtn" target="_blank">Ouvrir</a>
              <button class="pill" id="hideBtn">Je l’ai enregistré</button>
            </div>
          </div>
        </div>
      </div>

      <div class="hiddenHint" id="mobileHiddenHint">
        Accès mobile masqué.
        <a href="#" id="showAgain">Réafficher</a>
      </div>
    </div>

  </div>
</div>

<nav class="bottom-nav">
  <a class="active" href="owner-dashboard.html">Dashboard</a>
  <a href="owner-messages.html">Messages <span class="dot" id="dotMsgBottom">0</span></a>
  <a href="owner-facturation.html">Facturation <span class="dot" id="dotBillBottom">0</span></a>
</nav>

<script type="module">
import { auth } from "./firebase-init.js";
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

const LS_HIDE = "cm_owner_hide_mobile";

// mobile access
const link = new URL("login.html?role=proprietaire", location.href).toString();
loginLink.value = link;
openBtn.href = link;
qrImg.src = "https://api.qrserver.com/v1/create-qr-code/?size=200x200&data="+encodeURIComponent(link);

toggleMobile.onclick = ()=> mobileBody.style.display = mobileBody.style.display==="none"?"block":"none";
copyBtn.onclick = ()=> navigator.clipboard.writeText(link);
hideBtn.onclick = ()=>{
  localStorage.setItem(LS_HIDE,"1");
  mobileBody.style.display="none";
  toggleMobile.style.display="none";
  mobileHiddenHint.style.display="block";
};
showAgain.onclick = (e)=>{
  e.preventDefault();
  localStorage.removeItem(LS_HIDE);
  toggleMobile.style.display="inline-flex";
  mobileHiddenHint.style.display="none";
};

if(localStorage.getItem(LS_HIDE)==="1"){
  toggleMobile.style.display="none";
  mobileHiddenHint.style.display="block";
}

logoutBtn.onclick = async ()=>{
  await signOut(auth);
  location.href="index.html";
};

onAuthStateChanged(auth,(u)=>{
  if(!u) location.href="login.html?role=proprietaire";
});
</script>
</body>
</html>
