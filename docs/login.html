<!-- docs/login.html (FINAL — flux propre owner / conciergerie) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Connexion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    body{ margin:0; min-height:100vh; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); }
    .page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card{
      width:100%; max-width:520px;
      background:rgba(255,255,255,0.92);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:16px 14px 18px;
    }
    .logo{ display:flex; gap:10px; justify-content:center; align-items:center; }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      border:2px solid var(--violet); color:var(--violet);
      display:flex;align-items:center;justify-content:center;
      font-weight:900;
    }
    h1{ margin:0; font-size:22px; font-weight:900; }
    .subtitle{ font-size:13px; font-weight:800; color:#444; text-align:center; margin-top:6px; }

    .msg{
      display:none; margin-top:10px; padding:10px 12px;
      border-radius:14px; background:#fff;
      border-left:5px solid var(--bad);
      font-size:12px; font-weight:900;
    }

    form{ margin-top:12px; display:flex; flex-direction:column; gap:10px; }
    label{ font-size:12px; font-weight:900; }
    input{
      padding:11px 12px; border-radius:14px;
      border:1px solid rgba(0,0,0,0.12);
      font-weight:800;
    }
    .btn{
      margin-top:6px;
      padding:11px 12px;
      border-radius:999px;
      border:none;
      font-weight:900;
      color:#fff;
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      cursor:pointer;
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .rowLinks{
      margin-top:8px;
      display:flex; justify-content:space-between;
      font-size:12px; font-weight:900;
    }
    .link{ color:var(--violet); text-decoration:none; }
  </style>
</head>

<body>
<div class="page">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">✓</div>
      <div>
        <h1 id="titleH1">Connexion</h1>
        <div class="subtitle" id="subtitleP"></div>
      </div>
    </div>

    <div class="msg" id="msgBox"></div>

    <form id="loginForm">
      <label>Email</label>
      <input id="email" type="email" required>

      <label>Mot de passe</label>
      <input id="password" type="password" required>

      <button class="btn" id="submitBtn">Se connecter</button>

      <div class="rowLinks">
        <a class="link" href="#" id="resetLink">Mot de passe oublié</a>
        <a class="link" href="index.html">Accueil</a>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { auth, db } from "./firebase-init.js";
import { signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const form = document.getElementById("loginForm");
const msgBox = document.getElementById("msgBox");
const submitBtn = document.getElementById("submitBtn");
const titleH1 = document.getElementById("titleH1");
const subtitleP = document.getElementById("subtitleP");

const params = new URLSearchParams(location.search);
const role = (params.get("role") || "conciergerie").toLowerCase();
const token = params.get("token");

subtitleP.textContent =
  role === "proprietaire"
    ? (token ? "Connexion pour finaliser l’invitation." : "Accès à ton espace propriétaire.")
    : "Accès à ton espace conciergerie.";

function showMsg(t){
  msgBox.style.display="block";
  msgBox.textContent=t;
}

form.addEventListener("submit", async e=>{
  e.preventDefault();
  submitBtn.disabled=true;
  msgBox.style.display="none";

  try{
    const email = document.getElementById("email").value.trim().toLowerCase();
    const pass  = document.getElementById("password").value;

    const cred = await signInWithEmailAndPassword(auth,email,pass);
    const user = cred.user;

    // 🔑 PROPRIÉTAIRE
    if(role === "proprietaire"){
      if(token){
        location.replace("invite-proprietaire.html?token="+encodeURIComponent(token));
        return;
      }

      const us = await getDoc(doc(db,"users",user.uid));
      const u  = us.exists() ? us.data() : {};

      if(!u.ownerDocId){
        location.replace("profil-proprietaire.html?self=1");
      }else{
        location.replace("owner-dashboard.html");
      }
      return;
    }

    // 🔑 CONCIERGERIE
    location.replace("conciergerie.html");

  }catch(err){
    showMsg("Erreur connexion.");
    submitBtn.disabled=false;
  }
});
</script>
</body>
</html>
