<!-- docs/login.html (COMPLET + FIX) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Connexion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    body{ margin:0; min-height:100vh; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); color:var(--text); }
    .page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card{
      width:100%; max-width:520px;
      background:rgba(255,255,255,0.9);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:16px 14px 18px;
      backdrop-filter: blur(10px);
    }
    .logo{
      display:flex; justify-content:center; align-items:center; gap:10px;
      margin-bottom:6px;
      text-align:center;
    }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex;align-items:center;justify-content:center;
      color:var(--violet); font-size:20px;font-weight:900;
      position:relative; flex-shrink:0;
    }
    .logo-icon::after{
      content:"✦"; position:absolute; top:-6px; right:-5px;
      font-size:12px; color:var(--violet);
    }
    h1{ margin:0; font-size:22px; font-weight:900; letter-spacing:-0.2px; }
    .subtitle{ margin-top:6px; font-size:13px; color:#444; font-weight:800; text-align:center; }
    .tokenInfo{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border-left:5px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:900; color:#444;
      white-space:pre-wrap;
    }
    .msg{
      display:none;
      margin-top:10px;
      padding:10px 12px;
      border-radius:14px;
      background:#fff;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; font-weight:900; color:#444;
      white-space:pre-wrap;
    }
    form{ margin-top:12px; display:flex; flex-direction:column; gap:10px; }
    label{ font-size:12px; font-weight:900; color:#333; }
    input{
      width:100%;
      border:1px solid rgba(0,0,0,0.10);
      border-radius:14px;
      padding:11px 12px;
      font-size:13px;
      font-weight:800;
      outline:none;
      background:#fff;
    }
    input:focus{ border-color: var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }
    .btn{
      border:none; border-radius:999px;
      padding:11px 12px;
      font-size:13px; font-weight:900;
      cursor:pointer; white-space:nowrap;
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,0.10);
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }
    .rowLinks{
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      margin-top:8px; flex-wrap:wrap;
      font-size:12px; font-weight:900;
    }
    .link{ color:var(--violet); text-decoration:none; }
    .link:hover{ text-decoration:underline; }
    .signupLine{ margin-top:12px; font-size:12px; font-weight:900; color:#555; text-align:center; }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">✓</div>
        <div>
          <h1 id="titleH1">Connexion</h1>
          <div class="subtitle" id="subtitleP">Connecte-toi.</div>
        </div>
      </div>

      <div class="tokenInfo" id="tokenInfo">Invitation détectée : on finalise le rattachement.</div>
      <div class="msg" id="msgBox"></div>

      <form id="loginForm" autocomplete="on">
        <div>
          <label for="email">Email</label>
          <input id="email" type="email" required placeholder="ex: client@gmail.com" />
        </div>
        <div>
          <label for="password">Mot de passe</label>
          <input id="password" type="password" required placeholder="••••••••" />
        </div>
        <button class="btn" id="submitBtn" type="submit">Se connecter</button>

        <div class="rowLinks">
          <a class="link" href="#" id="resetLink">Mot de passe oublié</a>
          <a class="link" href="index.html">Accueil</a>
        </div>

        <div class="signupLine" id="signupLine">—</div>
      </form>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";

    import {
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      doc, getDoc, setDoc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const FREE_EMAILS = new Set([
      "mathilde.debout31@gmail.com",
      "s.dumas974@gmail.com"
    ]);

    const form = document.getElementById("loginForm");
    const msgBox = document.getElementById("msgBox");
    const submitBtn = document.getElementById("submitBtn");
    const resetLink = document.getElementById("resetLink");
    const titleH1 = document.getElementById("titleH1");
    const subtitleP = document.getElementById("subtitleP");
    const signupLine = document.getElementById("signupLine");
    const tokenInfo = document.getElementById("tokenInfo");

    function normalizeEmail(e){ return String(e||"").trim().toLowerCase(); }

    function showMsg(text, kind="bad"){
      msgBox.style.display = "block";
      msgBox.style.borderLeftColor = (kind==="ok") ? "#1b8f4d" : "#b3261e";
      msgBox.style.color = (kind==="ok") ? "#1b8f4d" : "#7a1d16";
      msgBox.textContent = text;
    }
    function clearMsg(){
      msgBox.style.display = "none";
      msgBox.textContent = "";
    }
    function lockUI(locked){
      submitBtn.disabled = !!locked;
      submitBtn.style.opacity = locked ? "0.7" : "1";
      submitBtn.style.cursor = locked ? "not-allowed" : "pointer";
    }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }
    function getRoleFromUrl(){
      const r = (getParam("role") || "").toLowerCase();
      return (r === "proprietaire" || r === "proprio" || r === "owner") ? "proprietaire" : "conciergerie";
    }

    const roleMode = getRoleFromUrl();
    const token = getParam("token"); // optionnel

    if(roleMode === "proprietaire"){
      titleH1.textContent = "Connexion propriétaire";
      subtitleP.textContent = token
        ? "Connecte-toi : on finalise ton rattachement à la conciergerie."
        : "Connecte-toi pour accéder à ton espace propriétaire.";
      signupLine.innerHTML = 'Pas d’accès ? <a class="link" href="index.html">Demande une invitation</a>';
      if(token) tokenInfo.style.display = "block";
    }else{
      titleH1.textContent = "Connexion conciergerie";
      subtitleP.textContent = "Connecte-toi pour accéder à ton espace conciergerie.";
      signupLine.innerHTML = 'Pas de compte ? <a class="link" href="signup.html">Créer un compte</a>';
    }

    resetLink.addEventListener("click", async (e)=>{
      e.preventDefault();
      clearMsg();

      const email = normalizeEmail(document.getElementById("email").value);
      if(!email) return showMsg("Tape ton email d’abord, puis clique ici.");

      try{
        await sendPasswordResetEmail(auth, email);
        showMsg("✅ Email de réinitialisation envoyé. Regarde ta boîte mail (et les spams).", "ok");
      }catch(err){
        const code = err?.code || "";
        if(code.includes("auth/user-not-found")) showMsg("Aucun compte trouvé avec cet email.");
        else showMsg("Erreur reset : " + (err?.message || "inconnue"));
      }
    });

    async function ensureFreeAdminProfile(uid, email){
      await setDoc(doc(db, "users", uid), {
        uid,
        email,
        role: "conciergerie",
        subscriptionStatus: "active",
        plan: "free-admin",
        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    function ownerProfileIsComplete(u){
      return !!String(u?.fullname || "").trim();
    }

    async function attachOwnerFromToken(user){
      if(!token) return { ok:true };

      const tokenRef = doc(db, "invites", token);
      const snap = await getDoc(tokenRef);
      if(!snap.exists()){
        return { ok:false, msg:"Invitation introuvable. Demande un nouveau lien." };
      }

      const inv = snap.data() || {};
      const invEmail = normalizeEmail(inv.email);
      const userEmail = normalizeEmail(user.email);

      if(invEmail && userEmail !== invEmail){
        return { ok:false, msg:"Cet email ne correspond pas à l’invitation. Connecte-toi avec le bon email." };
      }

      if(inv.usedOwnerUid && inv.usedOwnerUid !== user.uid){
        return { ok:false, msg:"Cette invitation a déjà été utilisée. Demande un nouveau lien." };
      }

      const conciergerieUid = String(inv.conciergerieUid || "").trim();
      const ownerDocId = String(inv.ownerDocId || "").trim();

      if(!conciergerieUid) return { ok:false, msg:"Invitation invalide (conciergerie manquante)." };
      if(!ownerDocId) return { ok:false, msg:"Invitation invalide (ownerDocId manquant). Régénère le lien." };

      await setDoc(doc(db, "users", user.uid), {
        uid: user.uid,
        role: "proprietaire",
        email: userEmail,
        conciergerieUid,
        ownerDocId,
        inviteToken: token,
        updatedAt: serverTimestamp()
      }, { merge:true });

      try{
        await setDoc(doc(db, "owners", ownerDocId), {
          ownerDocId,
          uid: user.uid,
          email: userEmail,
          conciergerieUid,
          updatedAt: serverTimestamp()
        }, { merge:true });
      }catch(_){}

      await updateDoc(tokenRef, {
        status: "accepted",
        usedAt: serverTimestamp(),
        usedOwnerUid: user.uid
      });

      return { ok:true };
    }

    function buildRedirectUrl(roleMode, opts={}){
      const plan = getParam("plan") || "starter";
      const next = getParam("next");

      if(next === "abonnement"){
        return "abonnement.html?plan=" + encodeURIComponent(plan);
      }

      if(roleMode === "proprietaire"){
        if(opts.forceProfile){
          const p = new URLSearchParams();
          p.set("self","1");
          if(token) p.set("token", token);
          return "profil-proprietaire.html?" + p.toString();
        }
        return "owner-dashboard.html" + (token ? ("?token=" + encodeURIComponent(token)) : "");
      }

      return "conciergerie.html";
    }

    let isSubmitting = false;

    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      if(isSubmitting) return;
      isSubmitting = true;

      clearMsg();
      lockUI(true);

      const email = normalizeEmail(document.getElementById("email").value);
      const password = document.getElementById("password").value || "";

      if(!email){ lockUI(false); isSubmitting=false; return showMsg("Email requis."); }
      if(!password){ lockUI(false); isSubmitting=false; return showMsg("Mot de passe requis."); }

      try{
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const user = cred.user;

        if(roleMode === "proprietaire"){
          if(token){
            const res = await attachOwnerFromToken(user);
            if(!res.ok){
              showMsg(res.msg || "Invitation invalide.");
              lockUI(false);
              isSubmitting = false;
              return;
            }
          }

          let u = null;
          try{
            const usnap = await getDoc(doc(db,"users", user.uid));
            u = usnap.exists() ? (usnap.data() || {}) : null;
          }catch(_){}

          const complete = ownerProfileIsComplete(u);
          location.replace(buildRedirectUrl("proprietaire", { forceProfile: !complete }));
          return;
        }

        const isFree = FREE_EMAILS.has(email);
        let role = "conciergerie";
        let planActive = false;

        if(isFree){
          try{ await ensureFreeAdminProfile(user.uid, email); }catch(_){}
          planActive = true;
        }else{
          try{
            const snap = await getDoc(doc(db, "users", user.uid));
            if(snap.exists()){
              const data = snap.data() || {};
              role = data.role || role;
              planActive = (data.subscriptionStatus === "active");
            }else{
              await setDoc(doc(db, "users", user.uid), {
                uid: user.uid,
                email,
                role: "conciergerie",
                subscriptionStatus: "inactive",
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
              }, { merge: true });
              planActive = false;
            }
          }catch(err){
            console.warn("Firestore read failed:", err);
            planActive = false;
          }
        }

        // ✅ FIX: si next=abonnement => abonnement, pas conciergerie.html
        if(getParam("next") === "abonnement"){
          location.replace(buildRedirectUrl("conciergerie"));
          return;
        }

        if(role === "conciergerie" && planActive){
          location.replace("conciergerie.html");
        }else{
          location.replace("abonnement.html?plan=starter");
        }

      }catch(err){
        const code = err?.code || "";
        if(code.includes("auth/invalid-credential") || code.includes("wrong-password")){
          showMsg("Email ou mot de passe incorrect.");
        } else if(code.includes("auth/user-not-found")){
          showMsg("Compte introuvable.");
        } else if(code.includes("auth/too-many-requests")){
          showMsg("Trop d’essais. Réessaie dans quelques minutes.");
        } else {
          showMsg("Erreur connexion : " + (err?.message || "inconnue"));
        }
        lockUI(false);
        isSubmitting = false;
      }
    });
  </script>
</body>
</html>
