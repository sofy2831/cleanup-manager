<!-- docs/login.html (COMPLET + CORRIGÉ) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Connexion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg:#F6F1FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --card:#fff;
      --border: rgba(122,92,255,0.20);
      --shadow: 0 14px 34px rgba(0,0,0,0.10);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; min-height:100vh; background:var(--bg); color:var(--text); display:flex; align-items:center; justify-content:center; padding:18px; }
    .card{
      width:100%; max-width:520px;
      background:linear-gradient(180deg,#fff 0%, #EFE7FF 100%);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:18px 16px;
      border:1px solid rgba(0,0,0,0.04);
    }
    .toprow{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none; font-weight:900; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer;
    }
    .brand{ display:flex; align-items:center; justify-content:center; gap:10px; margin:10px 0 6px; }
    .logo{
      width:40px; height:40px; border-radius:50%;
      background:#fff; border:2px solid var(--violet);
      display:flex; align-items:center; justify-content:center;
      font-weight:900; color:var(--violet);
      position:relative;
    }
    .logo::after{ content:"✦"; position:absolute; top:-6px; right:-4px; font-size:12px; color:var(--violet); }
    h1{ margin:0; font-size:22px; font-weight:900; text-align:center; }
    .sub{ margin:6px 0 0; text-align:center; color:#444; font-weight:800; font-size:13px; line-height:1.25; }
    .tokeninfo{
      display:none;
      margin:12px 0 0;
      padding:8px 10px;
      border-radius:14px;
      background:#fff;
      border-left:5px solid var(--violet);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#333;
      font-weight:900;
      white-space:pre-wrap;
    }

    form{ margin-top:14px; }
    label{ display:block; font-size:12px; font-weight:900; color:#333; margin:10px 0 4px; }
    input{
      width:100%;
      padding:11px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      background:#fff;
      outline:none;
      font-size:14px;
      font-weight:800;
      color:#111;
    }
    input:focus{ border-color:var(--violet); box-shadow:0 0 0 2px rgba(122,92,255,.15); }
    .btn{
      width:100%;
      margin-top:12px;
      border:none;
      border-radius:999px;
      padding:11px 14px;
      font-size:13px;
      font-weight:900;
      color:#fff;
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      cursor:pointer;
      box-shadow:0 4px 12px rgba(0,0,0,.18);
    }
    .links{
      margin-top:10px;
      display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
      font-size:12px; font-weight:900;
    }
    .link{ color:var(--violet); text-decoration:none; cursor:pointer; }
    .link:hover{ text-decoration:underline; }

    .msg{
      display:none;
      margin-top:12px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      font-weight:900;
      color:#7a1d16;
      white-space:pre-wrap;
    }
    .fine{ margin-top:12px; text-align:center; color:#666; font-size:11px; font-weight:800; line-height:1.25; }
  </style>
</head>

<body>
  <div class="card">
    <div class="toprow">
      <a class="pill" href="index.html">← Accueil</a>
      <a class="pill" href="signup.html" id="signupPill" style="display:none;">Créer un compte</a>
    </div>

    <div class="brand">
      <div class="logo">✓</div>
      <div style="min-width:0;">
        <div style="font-weight:1000; text-align:center; font-size:13px; color:#222;">CleanUp Manager</div>
        <h1 id="titleH1">Connexion</h1>
      </div>
    </div>

    <p class="sub" id="subtitleP">Connecte-toi.</p>

    <div class="tokeninfo" id="tokenInfo">Invitation détectée : on va rattacher ton accès à la conciergerie.</div>

    <div class="msg" id="msgBox"></div>

    <form id="loginForm" autocomplete="on">
      <label for="email">Email</label>
      <input id="email" type="email" autocomplete="email" required />

      <label for="password">Mot de passe</label>
      <input id="password" type="password" autocomplete="current-password" required />

      <button class="btn" id="submitBtn" type="submit">Se connecter</button>

      <div class="links">
        <a class="link" href="#" id="resetLink">Mot de passe oublié ?</a>
        <div id="signupLine"></div>
      </div>

      <div class="fine">
        Astuce : si tu es propriétaire, tu dois utiliser l’email exact de l’invitation.
      </div>
    </form>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";

    import {
      signInWithEmailAndPassword,
      sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";

    import {
      doc,
      getDoc,
      setDoc,
      updateDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // Comptes gratuits (DEV/admin)
    const FREE_EMAILS = new Set([
      "mathilde.debout31@gmail.com",
      "s.dumas974@gmail.com"
    ]);

    // UI
    const form = document.getElementById("loginForm");
    const msgBox = document.getElementById("msgBox");
    const submitBtn = document.getElementById("submitBtn");
    const resetLink = document.getElementById("resetLink");
    const titleH1 = document.getElementById("titleH1");
    const subtitleP = document.getElementById("subtitleP");
    const signupLine = document.getElementById("signupLine");
    const tokenInfo = document.getElementById("tokenInfo");
    const signupPill = document.getElementById("signupPill");

    function normalizeEmail(e){ return String(e||"").trim().toLowerCase(); }

    function showMsg(text, kind="bad"){
      msgBox.style.display = "block";
      msgBox.style.borderLeftColor = (kind==="ok") ? "#1b8f4d" : "#b3261e";
      msgBox.style.color = (kind==="ok") ? "#1b8f4d" : "#7a1d16";
      msgBox.textContent = text;
    }

    function clearMsg(){
      msgBox.style.display = "none";
      msgBox.textContent = "";
    }

    function lockUI(locked){
      submitBtn.disabled = !!locked;
      submitBtn.style.opacity = locked ? "0.7" : "1";
      submitBtn.style.cursor = locked ? "not-allowed" : "pointer";
    }

    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    function getRoleFromUrl(){
      const r = (getParam("role") || "").toLowerCase();
      return (r === "proprietaire" || r === "proprio" || r === "owner") ? "proprietaire" : "conciergerie";
    }

    // ✅ redirect propriétaire: profil d'abord si incomplet
    async function desiredPostLoginRedirect(roleMode, uid){
      const next = getParam("next");
      const plan = getParam("plan") || "starter";
      if(next === "abonnement"){
        return "abonnement.html?plan=" + encodeURIComponent(plan);
      }

      const token = getParam("token"); // garder token si présent

      if(roleMode !== "proprietaire"){
        return "conciergerie.html";
      }

      // 1) users/{uid} => ownerDocId
      let ownerDocId = "";
      try{
        const us = await getDoc(doc(db,"users",uid));
        if(us.exists()){
          ownerDocId = String(us.data()?.ownerDocId || "").trim();
        }
      }catch(_){}

      // 2) fallback legacy owners/{uid}
      if(!ownerDocId){
        try{
          const osLegacy = await getDoc(doc(db,"owners",uid));
          if(osLegacy.exists()){
            ownerDocId = uid;
            await setDoc(doc(db,"users",uid), { ownerDocId }, { merge:true });
          }
        }catch(_){}
      }

      if(!ownerDocId){
        return "owner-dashboard.html" + (token ? ("?token=" + encodeURIComponent(token)) : "");
      }

      // 3) check profil complet (minimum)
      let incomplete = true;
      try{
        const os = await getDoc(doc(db,"owners",ownerDocId));
        if(os.exists()){
          const o = os.data() || {};
          const fullname = String(o.fullname || "").trim();
          const address1 = String(o.address1 || "").trim();
          const zip = String(o.zip || "").trim();
          const city = String(o.city || "").trim();
          incomplete = !(fullname && address1 && zip && city);
        }
      }catch(_){}

      if(incomplete){
        return "profil-proprietaire.html";
      }

      return "owner-dashboard.html" + (token ? ("?token=" + encodeURIComponent(token)) : "");
    }

    const roleMode = getRoleFromUrl();
    const token = getParam("token"); // token optionnel invitation

    // UI mode
    if(roleMode === "proprietaire"){
      titleH1.textContent = "Connexion propriétaire";
      subtitleP.textContent = token
        ? "Connecte-toi : on va finaliser ton rattachement à la conciergerie."
        : "Connecte-toi pour accéder à ton espace propriétaire.";
      signupLine.innerHTML = 'Pas d’accès ? <a class="link" href="index.html">Demande une invitation</a>';
      if(token) tokenInfo.style.display = "block";
      signupPill.style.display = "none";
    }else{
      titleH1.textContent = "Connexion conciergerie";
      subtitleP.textContent = "Connecte-toi pour accéder à ton espace conciergerie.";
      signupLine.innerHTML = 'Pas de compte ? <a class="link" href="signup.html">Créer un compte</a>';
      signupPill.style.display = "inline-flex";
    }

    // Reset password
    resetLink.addEventListener("click", async (e)=>{
      e.preventDefault();
      clearMsg();

      const email = normalizeEmail(document.getElementById("email").value);
      if(!email) return showMsg("Tape ton email d’abord, puis clique ici.");

      try{
        await sendPasswordResetEmail(auth, email);
        showMsg("✅ Email de réinitialisation envoyé. Regarde ta boîte mail (et les spams).", "ok");
      }catch(err){
        const code = err?.code || "";
        if(code.includes("auth/user-not-found")) showMsg("Aucun compte trouvé avec cet email.");
        else showMsg("Erreur reset : " + (err?.message || "inconnue"));
      }
    });

    let isSubmitting = false;

    async function ensureFreeAdminProfile(uid, email){
      await setDoc(doc(db, "users", uid), {
        uid,
        email,
        role: "conciergerie",
        subscriptionStatus: "active",
        plan: "free-admin",
        updatedAt: serverTimestamp()
      }, { merge: true });
    }

    // ✅ Important : on NE crée PAS owners/{uid} ici.
    // On valide l'invite, on met à jour users/{uid}, et on marque l'invite accepted.
    async function attachOwnerFromTokenOrFail(user){
      if(!token){
        return { ok:true, conciergerieUid:null };
      }

      const tokenRef = doc(db, "invites", token);
      const snap = await getDoc(tokenRef);
      if(!snap.exists()){
        return { ok:false, msg:"Invitation introuvable. Demande un nouveau lien à la conciergerie." };
      }

      const inv = snap.data() || {};
      const invEmail = normalizeEmail(inv.email);
      const userEmail = normalizeEmail(user.email);

      if(invEmail && userEmail !== invEmail){
        return { ok:false, msg:"Cet email ne correspond pas à l’invitation. Connecte-toi avec le bon email." };
      }

      if(inv.usedOwnerUid && inv.usedOwnerUid !== user.uid){
        return { ok:false, msg:"Cette invitation a déjà été utilisée. Demande un nouveau lien." };
      }

      const conciergerieUid = String(inv.conciergerieUid || "").trim();
      if(!conciergerieUid){
        return { ok:false, msg:"Invitation invalide (conciergerie manquante). Demande un nouveau lien." };
      }

      const ownerDocId = String(inv.ownerDocId || "").trim();

      await setDoc(doc(db, "users", user.uid), {
        uid: user.uid,
        email: userEmail,
        role: "proprietaire",
        conciergerieUid,
        inviteToken: token,
        invitedBy: inv.by || "",
        ...(ownerDocId ? { ownerDocId } : {}),
        subscriptionStatus: "active",
        plan: "owner-free",
        updatedAt: serverTimestamp()
      }, { merge: true });

      await updateDoc(tokenRef, {
        status: "accepted",
        usedAt: serverTimestamp(),
        usedOwnerUid: user.uid
      });

      return { ok:true, conciergerieUid };
    }

    form.addEventListener("submit", async (e)=>{
      e.preventDefault();
      if(isSubmitting) return;
      isSubmitting = true;

      clearMsg();
      lockUI(true);

      const email = normalizeEmail(document.getElementById("email").value);
      const password = document.getElementById("password").value || "";

      if(!email){ lockUI(false); isSubmitting=false; return showMsg("Email requis."); }
      if(!password){ lockUI(false); isSubmitting=false; return showMsg("Mot de passe requis."); }

      try{
        const cred = await signInWithEmailAndPassword(auth, email, password);
        const user = cred.user;
        const uid = user.uid;

        // ===== PROPRIÉTAIRE =====
        if(roleMode === "proprietaire"){
          if(token){
            const res = await attachOwnerFromTokenOrFail(user);
            if(!res.ok){
              showMsg(res.msg || "Invitation invalide.", "bad");
              lockUI(false);
              isSubmitting = false;
              return;
            }
          }
          const target = await desiredPostLoginRedirect(roleMode, uid);
          location.replace(target);
          return;
        }

        // ===== CONCIERGERIE =====
        const isFree = FREE_EMAILS.has(email);

        let role = "conciergerie";
        let planActive = false;

        if(isFree){
          try{ await ensureFreeAdminProfile(uid, email); }catch(_){}
          planActive = true;
        }else{
          try{
            const snap = await getDoc(doc(db, "users", uid));
            if(snap.exists()){
              const data = snap.data() || {};
              role = data.role || role;
              planActive = (data.subscriptionStatus === "active");
            }else{
              await setDoc(doc(db, "users", uid), {
                uid,
                email,
                role: "conciergerie",
                subscriptionStatus: "inactive",
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
              }, { merge: true });
              planActive = false;
            }
          }catch(err){
            console.warn("Firestore read failed:", err);
            planActive = false;
          }
        }

        const next = getParam("next");
        if(next === "abonnement"){
          location.replace(await desiredPostLoginRedirect(roleMode, uid));
          return;
        }

        if(role === "conciergerie" && planActive){
          location.replace("conciergerie.html");
        }else{
          location.replace("abonnement.html?plan=starter");
        }

      }catch(err){
        const code = err?.code || "";
        if(code.includes("auth/invalid-credential") || code.includes("wrong-password")){
          showMsg("Email ou mot de passe incorrect.");
        } else if(code.includes("auth/user-not-found")){
          showMsg("Compte introuvable.");
        } else if(code.includes("auth/too-many-requests")){
          showMsg("Trop d’essais. Réessaie dans quelques minutes.");
        } else {
          showMsg("Erreur connexion : " + (err?.message || "inconnue"));
        }
        lockUI(false);
        isSubmitting = false;
      }
    });
  </script>
</body>
</html>
