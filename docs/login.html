<!-- docs/login.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Connexion</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666;
      --bad:#b3261e; --ok:#1b8f4d;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    body{ margin:0; min-height:100vh; background:linear-gradient(180deg,var(--bg1) 0%, var(--bg2) 80%); }
    .page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; }
    .card{
      width:100%; max-width:520px;
      background:rgba(255,255,255,0.92);
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:16px 14px 18px;
    }
    .logo{ display:flex; gap:10px; justify-content:center; align-items:center; }
    .logo-icon{
      width:42px;height:42px;border-radius:50%;
      border:2px solid var(--violet); color:var(--violet);
      display:flex;align-items:center;justify-content:center;
      font-weight:900;
    }
    h1{ margin:0; font-size:22px; font-weight:900; }
    .subtitle{ font-size:13px; font-weight:800; color:#444; text-align:center; margin-top:6px; }

    .msg{
      display:none; margin-top:10px; padding:10px 12px;
      border-radius:14px; background:#fff;
      border-left:5px solid var(--bad);
      font-size:12px; font-weight:900;
      white-space:pre-wrap;
      color:#7a1d16;
    }
    .msg.ok{ border-left-color: var(--ok); color: var(--ok); }

    form{ margin-top:12px; display:flex; flex-direction:column; gap:10px; }
    label{ font-size:12px; font-weight:900; }
    input{
      padding:11px 12px; border-radius:14px;
      border:1px solid rgba(0,0,0,0.12);
      font-weight:800;
      outline:none;
    }
    input:focus{
      border-color: var(--violet);
      box-shadow:0 0 0 2px rgba(122,92,255,.15);
    }

    .password-wrap{
      position:relative;
      width:100%;
    }
    .password-wrap input{
      width:100%;
      padding-right:48px;
    }
    .password-toggle{
      position:absolute;
      top:50%;
      right:8px;
      transform:translateY(-50%);
      width:36px;
      height:36px;
      border:none;
      border-radius:999px;
      background:transparent;
      color:#666;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:18px;
      line-height:1;
      padding:0;
    }
    .password-toggle:hover{
      background:rgba(122,92,255,.08);
      color:var(--violet);
    }
    .btn{
      margin-top:6px;
      padding:11px 12px;
      border-radius:999px;
      border:none;
      font-weight:900;
      color:#fff;
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      cursor:pointer;
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .rowLinks{
      margin-top:8px;
      display:flex; justify-content:space-between;
      font-size:12px; font-weight:900;
    }
    .link{ color:var(--violet); text-decoration:none; }
  </style>
</head>

<body>
<div class="page">
  <div class="card">
    <div class="logo">
      <div class="logo-icon">✓</div>
      <div>
        <h1 id="titleH1">Connexion</h1>
        <div class="subtitle" id="subtitleP"></div>
      </div>
    </div>

    <div class="msg" id="msgBox"></div>

    <form id="loginForm" autocomplete="on">
      <label>Email</label>
      <input id="email" type="email" required autocomplete="email">

      <label for="password">Mot de passe</label>
      <div class="password-wrap">
        <input id="password" type="password" required autocomplete="current-password">
        <button class="password-toggle" id="passwordToggle" type="button" aria-label="Afficher le mot de passe" title="Afficher le mot de passe">👁</button>
      </div>

      <button class="btn" id="submitBtn" type="submit">Se connecter</button>

      <div class="rowLinks">
        <a class="link" href="#" id="resetLink">Mot de passe oublié</a>
        <a class="link" href="index.html">Accueil</a>
      </div>
    </form>
  </div>
</div>

<script type="module">
import { auth, db, authReady } from "./firebase-init.js";
import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import {
  doc, getDoc, setDoc, updateDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const form = document.getElementById("loginForm");
const msgBox = document.getElementById("msgBox");
const submitBtn = document.getElementById("submitBtn");
const subtitleP = document.getElementById("subtitleP");
const resetLink = document.getElementById("resetLink");

const emailEl = document.getElementById("email");
const passEl  = document.getElementById("password");
const passwordToggle = document.getElementById("passwordToggle");

const params = new URLSearchParams(location.search);
const requestedRole = (params.get("role") || "conciergerie").toLowerCase().trim();
const token = (params.get("token") || "").trim();
const next = (params.get("next") || "").trim();

passwordToggle?.addEventListener("click", ()=>{
  const visible = passEl.type === "text";
  passEl.type = visible ? "password" : "text";
  passwordToggle.textContent = visible ? "👁" : "🙈";
  passwordToggle.setAttribute("aria-label", visible ? "Afficher le mot de passe" : "Masquer le mot de passe");
  passwordToggle.title = visible ? "Afficher le mot de passe" : "Masquer le mot de passe";
});

// Pré-remplit l'email
try{
  const last = (localStorage.getItem("lastLoginEmail") || "").trim();
  if(last && !emailEl.value) emailEl.value = last;
}catch{}

subtitleP.textContent =
  requestedRole === "proprietaire"
    ? (token ? "Connexion pour finaliser l’invitation." : "Accès à ton espace propriétaire.")
    : "Accès à ton espace conciergerie.";

function showMsg(t, ok=false){
  msgBox.style.display="block";
  msgBox.classList.toggle("ok", !!ok);
  msgBox.textContent=t;
}

function humanAuthError(err){
  const code = (err && err.code) ? String(err.code) : "";
  switch(code){
    case "auth/invalid-email": return "Email invalide (format).";
    case "auth/user-disabled": return "Compte désactivé.";
    case "auth/user-not-found": return "Compte introuvable (cet email n’existe pas).";
    case "auth/wrong-password": return "Mot de passe incorrect.";
    case "auth/invalid-credential": return "Identifiants invalides (email ou mot de passe).";
    case "auth/too-many-requests": return "Trop d’essais. Attends un peu et réessaie.";
    default: return "Erreur connexion : " + (err?.message || "inconnue");
  }
}

function normEmail(s){ return (s||"").trim().toLowerCase(); }

async function loadUserProfile(uid){
  try{
    const us = await getDoc(doc(db,"users", uid));
    if(!us.exists()) return null;
    return us.data() || null;
  }catch(e){
    console.warn("loadUserProfile:", e?.message || e);
    return null;
  }
}

function looksLikeOwnerProfile(profile){
  if(!profile) return false;
  const ownerDocId = String(profile.ownerDocId||"").trim();
  const concUid    = String(profile.conciergerieUid||"").trim();
  return !!(ownerDocId && concUid);
}

function looksLikeConciergerieProfile(profile){
  if(!profile) return false;
  const bp = profile.businessProfile || {};
  const hasBp = !!(
    String(bp.companyName||"").trim() ||
    String(bp.billingEmail||"").trim() ||
    String(bp.address?.city||"").trim()
  );
  const hasBillingFlag = typeof profile.billingReady === "boolean";
  const hasSubscription = !!String(profile.subscriptionStatus||"").trim() || !!String(profile.plan||"").trim();
  const hasOwnerLink = !!String(profile.ownerDocId||"").trim() || !!String(profile.conciergerieUid||"").trim();
  return (hasBp || hasBillingFlag || hasSubscription) && !hasOwnerLink;
}

async function ensureRoleIfMissing(uid, profile){
  const current = String(profile?.role || "").toLowerCase().trim();
  if(current) return current;

  if(looksLikeOwnerProfile(profile)){
    try{
      await setDoc(doc(db,"users", uid), { role:"proprietaire", updatedAt: serverTimestamp() }, { merge:true });
      return "proprietaire";
    }catch(e){
      console.warn("ensureRoleIfMissing owner:", e?.message || e);
      return "proprietaire";
    }
  }

  if(looksLikeConciergerieProfile(profile)){
    try{
      await setDoc(doc(db,"users", uid), { role:"conciergerie", updatedAt: serverTimestamp() }, { merge:true });
      return "conciergerie";
    }catch(e){
      console.warn("ensureRoleIfMissing conciergerie:", e?.message || e);
      return "conciergerie";
    }
  }

  return "";
}

async function ensureClientDocForOwner(user, userProfile){
  try{
    const u = userProfile || {};
    const ownerDocId = String(u.ownerDocId || "").trim();
    const conciergerieUid = String(u.conciergerieUid || "").trim();
    if(!ownerDocId || !conciergerieUid) return { ok:false, reason:"missing_ownerDocId_or_conciergerieUid" };

    const email = normEmail(user.email || u.email || "");
    const clientDocId = "c_owner_" + ownerDocId;

    await setDoc(doc(db,"clients", clientDocId), {
      conciergerieUid,
      clientId: clientDocId,
      clientKey: ownerDocId,
      ownerDocId,
      ownerUid: user.uid,
      uid: user.uid,
      email,
      emailLower: email,
      updatedAt: serverTimestamp()
    }, { merge:true });

    return { ok:true, ownerDocId, conciergerieUid, emailLower: email };
  }catch(e){
    console.warn("ensureClientDocForOwner:", e?.message || e);
    return { ok:false, reason:"error" };
  }
}

async function ensureOwnerUidOnOwners(ownerDocId, ownerUid, expectedConciergerieUid="", emailLower=""){
  if(!ownerDocId || !ownerUid) return { ok:false, reason:"missing_params" };

  const ref = doc(db, "owners", ownerDocId);
  const snap = await getDoc(ref);
  if(!snap.exists()) return { ok:false, reason:"owner_doc_missing" };

  const o = snap.data() || {};
  const ownerConc = String(o.conciergerieUid || "").trim();

  if(expectedConciergerieUid && ownerConc && ownerConc !== String(expectedConciergerieUid)){
    return { ok:false, reason:"owner_tenant_mismatch" };
  }

  const cur = String(o.ownerUid || o.uid || o.userUid || "").trim();
  if(cur === ownerUid) return { ok:true, already:true };

  if(cur && cur !== ownerUid){
    return { ok:false, reason:"ownerUid_already_set_other" };
  }

  const patch = {
    ownerUid,
    uid: ownerUid,
    updatedAt: serverTimestamp(),
    ownerUidLinkedAt: serverTimestamp()
  };
  if(emailLower && !String(o.emailLower || "").trim()){
    patch.emailLower = emailLower;
  }

  await updateDoc(ref, patch);
  return { ok:true, linked:true };
}

function canAccessConciergerie(profile){
  if(!profile) return false;

  const status = String(profile.subscriptionStatus || "").toLowerCase().trim();
  const source = String(profile.subscriptionSource || "").toUpperCase().trim();

  if(status === "active") return true;
  if(source === "TEST_ACCOUNT") return true;
  if(source === "BETA_GRANTED") return true;
  if(source === "MANUAL_ADMIN") return true;

  return false;
}

resetLink.addEventListener("click", async (e)=>{
  e.preventDefault();
  msgBox.style.display="none";

  const email = normEmail(emailEl.value || "");
  if(!email){
    showMsg("Entre ton email, puis clique à nouveau sur “Mot de passe oublié”.");
    emailEl.focus();
    return;
  }

  resetLink.style.pointerEvents = "none";
  resetLink.style.opacity = "0.6";

  try{
    await authReady;
    await sendPasswordResetEmail(auth, email);
    showMsg("✅ Email de réinitialisation envoyé.\nRegarde ta boîte + spams.", true);
  }catch(err){
    showMsg(humanAuthError(err));
  }finally{
    resetLink.style.pointerEvents = "auto";
    resetLink.style.opacity = "1";
  }
});

form.addEventListener("submit", async (e)=>{
  e.preventDefault();
  submitBtn.disabled = true;
  msgBox.style.display = "none";

  try{
    await authReady;

    const email = normEmail(emailEl.value || "");
    const pass  = (passEl.value || "");

    try{ localStorage.setItem("lastLoginEmail", email); }catch{}

    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const user = cred.user;

    // priorité absolue : token propriétaire
    if(token){
      location.replace("invite-proprietaire.html?token="+encodeURIComponent(token));
      return;
    }

    const profile = await loadUserProfile(user.uid);

    const roleFromUsers = await ensureRoleIfMissing(user.uid, profile);
    const effectiveRole = (
      roleFromUsers ||
      String(profile?.role||"").toLowerCase().trim() ||
      requestedRole
    );

if(effectiveRole === "admin" || effectiveRole === "staff"){
  location.replace("admin-support.html");
  return;
}
    
    if(effectiveRole === "proprietaire" || effectiveRole === "owner"){
      if(!looksLikeOwnerProfile(profile)){
        showMsg("⛔ Compte propriétaire non rattaché. Reconnecte-toi via le lien d’invitation.", false);
        submitBtn.disabled = false;
        return;
      }

      const res = await ensureClientDocForOwner(user, profile);

      if(res?.ok && res.ownerDocId){
        const link = await ensureOwnerUidOnOwners(
          res.ownerDocId,
          user.uid,
          res.conciergerieUid,
          res.emailLower || email
        );

        if(link?.ok === false && link.reason === "ownerUid_already_set_other"){
          showMsg(
            "⛔ Ce propriétaire est déjà rattaché à un autre compte.\n" +
            "Vérifie que tu utilises le bon email / la bonne invitation.",
            false
          );
          submitBtn.disabled = false;
          return;
        }

        if(link?.ok === false && link.reason === "owner_tenant_mismatch"){
          showMsg(
            "⛔ Incohérence de données (propriétaire rattaché à une autre conciergerie).\n" +
            "Régénère une invitation propre depuis la conciergerie.",
            false
          );
          submitBtn.disabled = false;
          return;
        }
      }

      location.replace("owner-dashboard.html");
      return;
    }

    if(effectiveRole === "conciergerie"){
      if(next === "abonnement"){
        location.replace("abonnement.html");
        return;
      }

      if(canAccessConciergerie(profile)){
        location.replace("conciergerie.html");
        return;
      }

      location.replace("abonnement.html");
      return;
    }

    showMsg("⛔ Compte non reconnu (role manquant). Utilise le bon lien ou contacte la conciergerie.", false);
    submitBtn.disabled = false;

  }catch(err){
    showMsg(humanAuthError(err));
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
