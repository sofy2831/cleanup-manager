<!-- docs/devis-apercu.html (DOCUMENT CLIENT – FINAL, A4 PRINT SAFE) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }

    body{
      margin:0;
      background:#f6f4ff;
      color:#111;
    }

    .page{
      max-width:900px;
      margin:0 auto;
      padding:18px;
    }

    .paper{
      background:#fff;
      border:1px solid rgba(0,0,0,.12);
      border-radius:12px;
      padding:16px;
      display:flex;
      flex-direction:column;
      min-height:297mm;
    }

    /* HEADER */
    .header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:12px;
    }

    .brand{
      display:flex;
      gap:10px;
      align-items:center;
    }

    .logo{
      width:56px;height:56px;
      border-radius:12px;
      border:2px solid #7A5CFF;
      overflow:hidden;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      color:#7A5CFF;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:none; }

    .brandName{
      font-size:18px;
      font-weight:800;
      line-height:1.2;
    }

    .meta{
      text-align:right;
      font-size:12px;
      line-height:1.4;
    }

    .title{
      text-align:center;
      margin:14px 0 10px;
      font-size:15px;
      font-weight:800;
      letter-spacing:.2px;
    }

    /* SOCIETE / CLIENT */
    .grid2{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .box{
      border:1px solid rgba(0,0,0,.12);
      border-radius:10px;
      padding:10px 12px;
      font-size:12.5px;
      line-height:1.35;
    }

    .box h3{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    /* TABLE */
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      font-size:12.5px;
    }

    th, td{
      border-bottom:1px solid rgba(0,0,0,.12);
      padding:8px;
      vertical-align:top;
    }

    th{
      text-align:left;
      font-weight:800;
      background:#f3ecff;
    }

    td.num, th.num{ text-align:right; white-space:nowrap; }

    /* TOTAL + PAYMENT (EN COLONNE) */
    .summary{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .totalBox, .payBox{
      border:1px solid rgba(0,0,0,.12);
      border-radius:10px;
      padding:10px 12px;
      font-size:12.5px;
    }

    .totalRow{
      display:flex;
      justify-content:space-between;
      font-weight:800;
      font-size:15px;
    }

    .muted{
      font-size:11.5px;
      color:#555;
      margin-top:4px;
    }

    /* CONDITIONS */
    .sectionTitle{
      margin-top:12px;
      font-size:12px;
      font-weight:800;
    }

    /* SIGNATURES */
    .signGrid{
      margin-top:14px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:12px;
    }

    .signBox{
      border:1px solid rgba(0,0,0,.12);
      border-radius:10px;
      padding:10px 12px;
    }

    .signBox h4{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
    }

    .signPad{
      height:60px;
      border-bottom:1px dashed rgba(0,0,0,.35);
      margin-top:6px;
    }

    /* FOOTER COLLÉ EN BAS */
    .footer{
      margin-top:auto;
      padding-top:8px;
      border-top:1px dashed rgba(0,0,0,.35);
      font-size:11px;
      text-align:center;
      line-height:1.35;
    }

    /* PRINT */
    @media print{
      body{ background:#fff; }
      .page{ padding:0; }
      .paper{
        border:none;
        border-radius:0;
        min-height:297mm;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="paper">

      <!-- HEADER -->
      <div class="header">
        <div class="brand">
          <div class="logo">
            <img id="logoImg" alt="Logo">
            <span id="logoFallback">✓</span>
          </div>
          <div class="brandName" id="companyName">—</div>
        </div>

        <div class="meta" id="metaDates">
          —
        </div>
      </div>

      <div class="title" id="docTitle">DEVIS N° —</div>

      <!-- SOCIETE / CLIENT -->
      <div class="grid2">
        <div class="box">
          <h3>Société</h3>
          <div id="socLines">—</div>
        </div>

        <div class="box">
          <h3>Client</h3>
          <div id="cliLines">—</div>
        </div>
      </div>

      <!-- LIGNES -->
      <table>
        <thead>
          <tr>
            <th>Désignation</th>
            <th class="num">Qté</th>
            <th class="num">PU</th>
            <th class="num">Total</th>
          </tr>
        </thead>
        <tbody id="linesBody"></tbody>
      </table>

      <!-- TOTAL / PAYMENT -->
      <div class="summary">
        <div class="totalBox">
          <div class="totalRow">
            <span>Total TTC</span>
            <span id="totalTtc">0,00 €</span>
          </div>
          <div class="muted" id="tvaLine">—</div>
        </div>

        <div class="payBox">
          <b>Paiement</b><br>
          <span id="payInfo">—</span>
        </div>
      </div>

      <!-- CONDITIONS -->
      <div class="sectionTitle">Conditions</div>
      <div class="box" id="conditionsBox">—</div>

      <div class="sectionTitle">Pénalités</div>
      <div class="box" id="penaltyBox">—</div>

      <!-- SIGNATURES -->
      <div class="signGrid">
        <div class="signBox">
          <h4>Signature société</h4>
          <div class="signPad"></div>
        </div>
        <div class="signBox">
          <h4>Signature client</h4>
          <div class="signPad"></div>
        </div>
      </div>

      <!-- FOOTER -->
      <div class="footer" id="footerLine">—</div>

    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const $ = id => document.getElementById(id);
    const money = n => Number(n||0).toLocaleString("fr-FR",{minimumFractionDigits:2})+" €";

    onAuthStateChanged(auth, async user=>{
      if(!user){ location.href="login.html"; return; }

      const p = new URLSearchParams(location.search);
      const eventId = p.get("eventId");
      if(!eventId) return;

      const snap = await getDoc(doc(db,"events",eventId));
      if(!snap.exists()) return;
      const d = snap.data();

      const bp = d.businessSnapshot || {};

      $("companyName").textContent = bp.companyName || "Conciergerie";

      if(bp.logoUrl){
        $("logoImg").src = bp.logoUrl;
        $("logoImg").style.display="block";
        $("logoFallback").style.display="none";
      }

      $("metaDates").innerHTML = `
        <b>Émis le</b> ${new Date(d.createdAt?.toDate?.()||Date.now()).toLocaleDateString("fr-FR")}<br>
        <b>Valable jusqu’au</b> ${d.quoteOfferValidityDays||30} j
      `;

      $("docTitle").textContent = `DEVIS N° ${d.quoteNumber||"—"}`;

      $("socLines").innerHTML = [
        bp.address?.street,
        [bp.address?.zip, bp.address?.city].filter(Boolean).join(" "),
        bp.registration?.siret ? "SIRET "+bp.registration.siret : ""
      ].filter(Boolean).join("<br>");

      $("cliLines").innerHTML = [
        d.ownerName,
        d.ownerAddress1,
        [d.ownerZip, d.ownerCity].filter(Boolean).join(" ")
      ].filter(Boolean).join("<br>");

      let total = 0;
      $("linesBody").innerHTML = (d.lines||[]).map(l=>{
        const t = (l.qty||0)*(l.unitPrice||0);
        total += t;
        return `<tr>
          <td>${l.label}</td>
          <td class="num">${l.qty}</td>
          <td class="num">${money(l.unitPrice)}</td>
          <td class="num">${money(t)}</td>
        </tr>`;
      }).join("");

      $("totalTtc").textContent = money(total);
      $("tvaLine").textContent = bp.vat?.enabled ? "TVA incluse" : "TVA non applicable (art. 293B CGI)";

      $("payInfo").textContent = `${d.quotePaymentMode||""} – ${d.quotePaymentTerm||""}`;

      $("conditionsBox").innerHTML = `
        Validité de l’offre : ${d.quoteOfferValidityDays||30} jours<br>
        Paiement selon conditions convenues
      `;

      $("penaltyBox").textContent = d.quotePenaltyText || "—";

      $("footerLine").textContent = [
        bp.companyName,
        bp.registration?.siret ? "SIRET "+bp.registration.siret : "",
        bp.billingEmail
      ].filter(Boolean).join(" • ");
    });
  </script>
</body>
</html>
