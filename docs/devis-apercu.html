<!-- docs/devis-apercu.html (FINAL — aperçu/print d’un devis salesDocuments QUOTE, DE/DF auto) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Aperçu devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:16px 16px 32px; padding-bottom:96px; }

    .topbar{
      width:100%; max-width:1100px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:1000; font-size:13px;
      cursor:pointer; box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .pill.primary{ background:linear-gradient(90deg,var(--violet),var(--violet2)); color:#fff; border-color:transparent; }

    .alert{
      width:100%; max-width:1100px; margin-top:12px;
      padding:10px 12px; background:#fff; border-radius:14px;
      border-left:5px solid var(--bad); box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px; color:#333; display:none; white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .sheet{
      width:100%; max-width:1100px;
      background:#fff;
      border:1px solid var(--border);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:18px 18px 16px;
      margin-top:14px;
    }

    .sheetTop{
      display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;
      align-items:flex-start;
    }

    .brand{
      display:flex; gap:12px; align-items:flex-start;
      min-width:280px;
    }
    .logo{
      width:60px;height:60px;border-radius:14px; overflow:hidden;
      border:2px solid rgba(122,92,255,0.28); background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:1000; color:var(--violet);
      flex-shrink:0;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:none; }
    .brand h1{ margin:0; font-size:18px; font-weight:1000; }
    .brand .lines{ margin-top:6px; font-size:12.5px; color:#222; font-weight:900; line-height:1.35; }
    .brand .mut{ color:#666; font-weight:1000; }

    .docMeta{
      min-width:260px;
      text-align:right;
    }
    .docMeta .title{ font-size:20px; font-weight:1000; margin:0; }
    .docMeta .meta{ margin-top:6px; font-size:12.5px; color:#333; font-weight:1000; line-height:1.45; }
    .chip{
      display:inline-flex; align-items:center; justify-content:center;
      padding:4px 10px; border-radius:999px;
      border:1px solid rgba(122,92,255,0.25);
      font-size:11px; font-weight:1000; color:#333; background:#fff;
    }

    .blocks{
      margin-top:14px;
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }
    @media(min-width:860px){
      .blocks{ grid-template-columns: 1fr 1fr; }
    }
    .box{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:12px 12px;
      background:rgba(248,244,255,0.30);
    }
    .box .t{ font-size:12px; color:#555; font-weight:1000; }
    .box .v{ margin-top:6px; font-size:13px; color:#111; font-weight:1000; line-height:1.45; white-space:pre-wrap; }
    .muted{ color:#666; font-weight:1000; }

    table{ width:100%; border-collapse:collapse; margin-top:14px; }
    th, td{ border-bottom:1px solid rgba(0,0,0,0.06); padding:10px 10px; font-size:12.5px; vertical-align:top; }
    th{ background:rgba(248,244,255,.6); text-align:left; font-weight:1000; color:#333; }
    td.num, th.num{ text-align:right; white-space:nowrap; }
    td.designation{ width:52%; }
    .note{ margin-top:6px; font-size:12px; color:#666; font-weight:900; white-space:pre-wrap; }

    .totals{
      margin-top:14px;
      margin-left:auto;
      width:min(420px,100%);
      border:1px solid rgba(122,92,255,0.18);
      border-radius:14px;
      padding:12px 12px;
      background:#fff;
    }
    .totals .r{ display:flex; justify-content:space-between; gap:10px; font-weight:1000; }
    .totals .r + .r{ margin-top:6px; }
    .totals .mut{ margin-top:10px; font-size:12px; color:#666; font-weight:1000; }

    .foot{
      margin-top:14px;
      font-size:12px;
      color:#444;
      font-weight:900;
      line-height:1.45;
      white-space:pre-wrap;
    }

    .signs{
      margin-top:14px;
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
    }
    @media(min-width:860px){
      .signs{ grid-template-columns: 1fr 1fr; }
    }
    .signBox{
      border:1px dashed rgba(0,0,0,0.16);
      border-radius:14px;
      padding:12px 12px;
      min-height:110px;
    }
    .signBox .t{ font-size:12px; font-weight:1000; color:#333; }
    .signBox .s{ margin-top:8px; font-size:12px; color:#666; font-weight:900; }

    .bottom-nav{
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
      display: flex; justify-content: space-around; gap: 6px;
      padding: 10px 10px calc(10px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,0.92);
      border-top: 1px solid rgba(122,92,255,0.18);
      backdrop-filter: blur(10px);
    }
    .bottom-nav a{
      flex:1; text-align:center; font-size:11px; font-weight:1000; text-decoration:none;
      color:#666; padding:10px 8px; border-radius:999px; white-space:nowrap;
    }
    @media(min-width: 980px){
      .bottom-nav{ position: static; max-width: 1100px; margin: 12px auto 0; border-top: none; border: 1px solid rgba(122,92,255,0.18); border-radius: 999px; box-shadow:0 4px 12px rgba(0,0,0,.08); }
      .page{ padding-bottom: 32px; }
    }

    /* PRINT */
    @media print{
      body{ background:#fff; }
      .topbar, .bottom-nav{ display:none !important; }
      .page{ padding:0; }
      .sheet{ box-shadow:none; border:none; border-radius:0; margin:0; }
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backBtn" href="devis-liste.html">← Retour</a>
      <button class="pill primary" type="button" id="printBtn">Imprimer / PDF</button>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="sheet" id="sheet">
      <div class="sheetTop">
        <div class="brand">
          <div class="logo" id="logoBox">
            <img id="logoImg" alt="Logo">
            <span id="logoFallback">✓</span>
          </div>
          <div>
            <h1 id="bizName">—</h1>
            <div class="lines" id="bizLines">—</div>
          </div>
        </div>

        <div class="docMeta">
          <div class="title">DEVIS</div>
          <div class="meta" id="docMeta">—</div>
          <div style="margin-top:8px;">
            <span class="chip" id="kindChip">—</span>
          </div>
        </div>
      </div>

      <div class="blocks">
        <div class="box">
          <div class="t">Client</div>
          <div class="v" id="clientBlock">—</div>
        </div>

        <div class="box" id="contextBox" style="display:none;">
          <div class="t">Logement / Période</div>
          <div class="v" id="contextBlock">—</div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Désignation</th>
            <th class="num">Qté</th>
            <th>Unité</th>
            <th class="num">PU HT</th>
            <th class="num" id="thTVA" style="display:none;">TVA</th>
            <th class="num">Total TTC</th>
          </tr>
        </thead>
        <tbody id="linesTbody"></tbody>
      </table>

      <div class="totals" id="totalsBox"></div>

      <div class="foot" id="conditionsBox" style="display:none;"></div>

      <div class="signs">
        <div class="signBox">
          <div class="t">Signature société</div>
          <div class="s" id="signCompany">—</div>
        </div>
        <div class="signBox">
          <div class="t">Signature client</div>
          <div class="s">Bon pour accord / refus • Date • Signature</div>
        </div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav" aria-label="Navigation">
    <a href="planning.html">Planning</a>
    <a href="prestations.html">Opérations</a>
    <a href="logements.html">Logements</a>
    <a href="compta.html">Compta</a>
    <a href="messagerie.html">Messages</a>
  </nav>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const alertBox = document.getElementById("alertBox");
  const printBtn = document.getElementById("printBtn");
  const backBtn = document.getElementById("backBtn");

  const logoImg = document.getElementById("logoImg");
  const logoFallback = document.getElementById("logoFallback");

  const bizNameEl = document.getElementById("bizName");
  const bizLinesEl = document.getElementById("bizLines");

  const docMetaEl = document.getElementById("docMeta");
  const kindChip = document.getElementById("kindChip");

  const clientBlock = document.getElementById("clientBlock");
  const contextBox = document.getElementById("contextBox");
  const contextBlock = document.getElementById("contextBlock");

  const thTVA = document.getElementById("thTVA");
  const linesTbody = document.getElementById("linesTbody");
  const totalsBox = document.getElementById("totalsBox");

  const conditionsBox = document.getElementById("conditionsBox");
  const signCompany = document.getElementById("signCompany");

  const params = new URLSearchParams(location.search);
  const docId = (params.get("docId") || "").trim();

  function showAlert(msg, ok=false){
    alertBox.style.display = "block";
    alertBox.classList.toggle("ok", !!ok);
    alertBox.textContent = msg;
  }
  function hideAlert(){
    alertBox.style.display = "none";
    alertBox.classList.remove("ok");
    alertBox.textContent = "";
  }
  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function fmtMoney(v){
    const n = Number(v);
    if(!Number.isFinite(n)) return "—";
    return n.toLocaleString("fr-FR",{ minimumFractionDigits:2, maximumFractionDigits:2 }) + " €";
  }
  function fmtDateFR(x){
    if(!x) return "—";
    try{
      if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
      const s = String(x).trim();
      if(!s) return "—";
      if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m) return `${m[3]}/${m[2]}/${m[1]}`;
      const d = new Date(s);
      if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
      return "—";
    }catch{ return "—"; }
  }

  function detectKind(quote){
    return String(quote?.eventId || "").trim() ? "DE" : "DF";
  }

  function computeTotals(lines, tvaEnabled, tvaRate){
    let ht = 0;
    for(const l of (Array.isArray(lines) ? lines : [])){
      const qty = Number(l?.qty)||0;
      const up  = Number(l?.unitPrice)||0;
      ht += qty * up;
    }
    const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
    const ttc = ht + tva;
    return { ht, tva, ttc };
  }

  function renderBusiness(profile){
    const bp = (profile?.businessProfile || {});
    const cName = String(bp.companyName || "Conciergerie").trim() || "Conciergerie";
    bizNameEl.textContent = cName;

    const street = String(bp.address?.street || "").trim();
    const zip = String(bp.address?.zip || "").trim();
    const city = String(bp.address?.city || "").trim();
    const siret = String(bp.registration?.siret || "").trim();
    const ape = String(bp.registration?.ape || "").trim();
    const mail = String(bp.billingEmail || profile?.email || "").trim();
    const phone = String(bp.phone || "").trim();

    const lines = [];
    if(street) lines.push(esc(street));
    if(zip || city) lines.push(esc([zip, city].filter(Boolean).join(" ")));
    const legal = [siret ? `SIRET ${siret}` : "", ape ? `APE ${ape}` : ""].filter(Boolean).join(" • ");
    if(legal) lines.push(`<span class="mut">${esc(legal)}</span>`);
    const contact = [mail ? mail : "", phone ? phone : ""].filter(Boolean).join(" • ");
    if(contact) lines.push(`<span class="mut">${esc(contact)}</span>`);
    bizLinesEl.innerHTML = lines.length ? lines.join("<br>") : "—";

    const url = String(bp.logoUrl || "").trim();
    if(url){
      logoImg.src = url;
      logoImg.style.display = "block";
      logoFallback.style.display = "none";
    }else{
      logoImg.style.display = "none";
      logoFallback.style.display = "block";
    }

    const sign = String(bp.registration?.signatureName || bp.signatureName || "").trim();
    signCompany.textContent = sign || cName;
  }

  function renderQuote(quote, profile){
    const kind = detectKind(quote);
    kindChip.textContent = kind === "DE" ? "DE (logement)" : "DF (libre)";

    // retour : DE -> devis-event, DF -> devis-free
    backBtn.href = (kind === "DE")
      ? `devis-event.html?eventId=${encodeURIComponent(quote.eventId || "")}&docId=${encodeURIComponent(quote.id)}`
      : `devis-free.html?docId=${encodeURIComponent(quote.id)}`;

    const qNo = String(quote.quoteNumber || "—").trim() || "—";
    const created = fmtDateFR(quote.createdAt);
    docMetaEl.innerHTML = `
      <div><b>N°</b> ${esc(qNo)}</div>
      <div><b>Date</b> ${esc(created)}</div>
    `;

    // client (snapshot dans salesDocuments)
    const cname = String(quote.clientName || "—").trim() || "—";
    const cemail = String(quote.clientEmail || "").trim();
    clientBlock.innerHTML = `${esc(cname)}${cemail ? `\n${esc(cemail)}` : ""}`;

    // contexte DE
    if(kind === "DE"){
      const hs = quote.homeSnapshot || {};
      const hn = String(hs.homeName || quote.homeName || "—").trim() || "—";
      const city = String(hs.homeCity || quote.homeCity || "").trim();
      const a = hs.arrivalDateKey || "";
      const b = hs.departureDateKey || "";
      const period = (a || b) ? `${fmtDateFR(a)} → ${fmtDateFR(b)}` : "—";
      contextBox.style.display = "";
      contextBlock.innerHTML = `${esc(city ? (hn + " — " + city) : hn)}\n${esc(period)}`;
    }else{
      contextBox.style.display = "none";
    }

    // TVA
    const bp = (profile?.businessProfile || {});
    const tvaEnabled = !!bp.vat?.enabled;
    const tvaRate = Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0;
    thTVA.style.display = tvaEnabled ? "" : "none";

    // lignes
    const lines = Array.isArray(quote.lines) ? quote.lines : [];
    linesTbody.innerHTML = "";
    for(const l of lines){
      const label = String(l.label || "Ligne").trim() || "Ligne";
      const qty = Number(l.qty||0);
      const unit = String(l.unit || "unité").trim() || "unité";
      const up = Number(l.unitPrice||0);

      const lineHT = qty * up;
      const lineTVA = tvaEnabled ? (lineHT * tvaRate) : 0;
      const lineTTC = lineHT + lineTVA;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td class="designation">
          ${esc(label)}
          ${l.note ? `<div class="note">${esc(l.note)}</div>` : ""}
        </td>
        <td class="num">${esc(qty)}</td>
        <td>${esc(unit)}</td>
        <td class="num">${esc(fmtMoney(up))}</td>
        <td class="num" style="${tvaEnabled ? "" : "display:none;"}">${tvaEnabled ? esc(fmtMoney(lineTVA)) : ""}</td>
        <td class="num">${esc(fmtMoney(lineTTC))}</td>
      `;
      linesTbody.appendChild(tr);
    }

    const totals = computeTotals(lines, tvaEnabled, tvaRate);
    const tHtml = [];
    if(tvaEnabled){
      tHtml.push(`<div class="r"><span>Total HT</span><span>${esc(fmtMoney(totals.ht))}</span></div>`);
      tHtml.push(`<div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>${esc(fmtMoney(totals.tva))}</span></div>`);
      tHtml.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
    }else{
      tHtml.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
      const ex = String(bp?.tvaExemptionText || "").trim();
      if(ex) tHtml.push(`<div class="mut">${esc(ex)}</div>`);
    }
    totalsBox.innerHTML = tHtml.join("");

    // conditions / note
    const note = String(quote.clientNote || "").trim();
    const cancel = bp?.conditions?.cancellationPercent != null ? Number(bp.conditions.cancellationPercent) : null;
    const conditions = [];

    if(Number.isFinite(cancel)){
      conditions.push(`Conditions d’annulation : ${cancel}% du montant TTC.`);
    }
    if(note){
      conditions.push(`Note : ${note}`);
    }
    if(conditions.length){
      conditionsBox.style.display = "";
      conditionsBox.textContent = conditions.join("\n\n");
    }else{
      conditionsBox.style.display = "none";
    }
  }

  async function loadAll(user){
    if(!docId) throw new Error("docId manquant. Exemple : devis-apercu.html?docId=XXXX");

    const profSnap = await getDoc(doc(db,"users",user.uid));
    const profile = profSnap.exists() ? (profSnap.data() || {}) : {};

    const qSnap = await getDoc(doc(db,"salesDocuments",docId));
    if(!qSnap.exists()) throw new Error("Devis introuvable (salesDocuments).");

    const quote = { id:qSnap.id, ...(qSnap.data()||{}) };
    if(quote.conciergerieUid && quote.conciergerieUid !== user.uid){
      throw new Error("Accès refusé (devis d’une autre conciergerie).");
    }
    if(String(quote.type||"").toUpperCase().trim() !== "QUOTE"){
      throw new Error("Ce document n’est pas un devis (type != QUOTE).");
    }

    renderBusiness(profile);
    renderQuote(quote, profile);
  }

  printBtn.addEventListener("click", ()=> window.print());

  onAuthStateChanged(auth, async (user)=>{
    if(!user){ location.href = "login.html?role=conciergerie"; return; }
    hideAlert();
    try{
      await loadAll(user);
    }catch(e){
      console.error(e);
      showAlert("⛔ " + (e?.message || "Erreur aperçu devis"));
    }
  });
</script>
</body>
</html>
