<!-- docs/devis-apercu.html (FINAL — HT / TVA / TTC par ligne + totaux HT/TVA/TTC + owner=1 support + security ownerUid+ownerVisible + forbid owner on draft=1) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
      font-weight:400;
    }

    .wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px; padding-bottom:28px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:800; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer;
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .paper{
      width:100%; max-width:980px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      border-radius:16px;
      padding:16px;
      margin-top:10px;
      position:relative;
    }

    .header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .brandLeft{
      display:flex; gap:12px; align-items:center; min-width:0;
    }
    .logo{
      width:50px; height:50px; border-radius:14px;
      border:2px solid rgba(122,92,255,0.35);
      overflow:hidden; background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; color:var(--violet);
      flex-shrink:0;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:none; }

    .brand{ min-width:0; }
    .brand .name{ font-size:18px; font-weight:800; line-height:1.15; }
    .brand .sub{ display:none; }

    .metaRight{
      text-align:right;
      font-size:12px;
      color:#333;
      line-height:1.35;
      white-space:nowrap;
    }
    .metaRight b{ font-weight:700; }

    .docTitle{
      margin-top:10px;
      text-align:center;
      font-weight:800;
      font-size:14px;
      letter-spacing:.2px;
    }
    .docMeta{ display:none; }

    .grid2{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    @media(min-width:820px){
      .grid2{ grid-template-columns: 1fr 1fr; }
    }

    .box{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }
    .box h3{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }
    .line{
      font-size:12.5px;
      font-weight:500;
      color:#111;
      line-height:1.35;
      word-break:break-word;
    }
    .mut{ color:var(--muted); font-weight:500; }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      overflow:hidden;
      border-radius:12px;
      table-layout:fixed;
    }
    thead th{
      text-align:left;
      font-size:11.5px;
      color:#444;
      font-weight:700;
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.07);
      background:rgba(248,244,255,.6);
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    tbody td{
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      font-size:12.5px;
      font-weight:500;
      vertical-align:top;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    tbody tr:last-child td{ border-bottom:none; }
    .right{
      text-align:right;
      white-space:normal;
    }

    .col-presta{ width:34%; }
    .col-qty{ width:12%; }
    .col-pu{ width:13%; }
    .col-tht{ width:13%; }
    .col-tva{ width:13%; }
    .col-ttc{ width:15%; }

    .summary{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .totalBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }
    .totalRow{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }
   .totalRow .lbl{
  font-size:14px;
  font-weight:700;
  color:#111;
  line-height:1.2;
}
.totalRow .amt{
  font-size:14px;
  font-weight:700;
  color:#111;
  line-height:1.2;
}
.totalRow.ttc .lbl{
  font-size:14px;
  font-weight:700;
}
.totalRow.ttc .amt{
  font-size:14px;
  font-weight:800;
}
    .totalSub{
      margin-top:6px;
      font-size:11.5px;
      color:var(--muted);
      font-weight:500;
      line-height:1.4;
    }

    .payBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }
    .payBox h3{ margin:0 0 6px; font-size:12px; font-weight:800; color:#333; }

    .sectionTitle{
      margin-top:12px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }

    .sigGrid{
      margin-top:10px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    @media(min-width:820px){
      .sigGrid{ grid-template-columns: 1fr 1fr; }
    }

    .sigBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
    }
    .sigTitle{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }
    .sigPad{
      height:70px;
      border:1px dashed rgba(0,0,0,0.25);
      border-radius:10px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:8px;
      text-align:center;
    }
    .sigText{
      font-style:italic;
      font-size:14px;
      color:#555;
      font-weight:500;
      user-select:none;
      word-break:break-word;
    }
    .sigText.dim{ color:#9aa0a6; }
    .sigText.ok{ color:#2f6f3e; font-weight:600; }
    .sigText.no{ color:#b3261e; font-weight:600; }

    .sigChoice{
      margin-top:8px;
      display:flex;
      gap:14px;
      align-items:center;
      flex-wrap:wrap;
      font-size:12.5px;
    }
    .sigChoice label{ display:inline-flex; gap:6px; align-items:center; cursor:pointer; }

    .footer{
      margin-top:12px;
      padding-top:10px;
      border-top:1px dashed rgba(122,92,255,0.35);
      text-align:center;
      font-size:11px;
      color:#444;
      font-weight:500;
      line-height:1.35;
    }

    .alert{
      width:100%; max-width:980px;
      margin-top:12px;
      background:#fff;
      border:1px solid rgba(0,0,0,0.06);
      border-left:5px solid #b3261e;
      border-radius:14px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      padding:10px 12px;
      font-size:12px;
      font-weight:600;
      color:#333;
      display:none;
      white-space:pre-wrap;
    }

    @media(max-width:640px){
      thead th{
        font-size:10.5px;
        padding:7px 6px;
      }
      tbody td{
        font-size:11.5px;
        padding:7px 6px;
      }
      td.col-ttc,
      td.col-tva,
      td.col-tht,
      td.col-pu,
      td.col-qty{
        font-size:11px;
      }

      .totalRow .lbl{
        font-size:14px;
      }
      .totalRow .amt{
        font-size:14px;
      }
      .totalRow.ttc .lbl{
        font-size:14px;
      }
      .totalRow.ttc .amt{
        font-size:14px;
      }
    }

    @media print{
      .topbar, button{ display:none !important; }
      body{ background:#fff !important; }
      @page{ margin: 8mm; }

      .paper{
        box-shadow:none !important;
        border:none !important;
        border-radius:0 !important;
        max-width:none !important;
        padding: 0 !important;
        position: relative;
      }

      .docTitle{ margin-top:6px !important; }
      .grid2, .sigGrid{ gap:6px !important; }
      .summary{ gap:6px !important; }
      .box, .totalBox, .payBox, .sigBox{ padding:6px 8px !important; }
      table{ margin-top:8px !important; }
      table thead th, table tbody td{ padding:6px 7px !important; }
      .sectionTitle{ margin-top:8px !important; }

      .sigPad{ height:48px !important; }
      .sigChoice{ margin-top:4px !important; font-size:12px !important; }

      .grid2{ grid-template-columns: 1fr 1fr !important; }
      .sigGrid{ grid-template-columns: 1fr 1fr !important; }

      .footer{
        position: fixed;
        left: 0;
        right: 0;
        bottom: 6mm;
        border-top: 1px dashed rgba(0,0,0,0.25);
        padding-top: 4px;
        font-size: 10px !important;
        line-height: 1.2 !important;
        text-align: center;
        background:#fff;
        z-index: 9999;
      }
      .paper{
        padding-bottom: 22mm !important;
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <a class="pill" id="backBtn" href="devis-liste.html">← Retour</a>
      <div style="display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end;">
        <button class="pill" type="button" id="printBtn">Imprimer / PDF</button>
      </div>
    </div>

    <div class="alert" id="alertBox"></div>

    <div class="paper" id="paper">
      <div class="header">
        <div class="brandLeft">
          <div class="logo" id="logoWrap">
            <img id="logoImg" alt="Logo">
            <span id="logoFallback">✓</span>
          </div>
          <div class="brand">
            <div class="name" id="bizName">Conciergerie</div>
            <div class="sub"></div>
          </div>
        </div>

        <div class="metaRight">
          <div>Émis le <span id="issuedAtLabel">—</span></div>
          <div><b>Valable jusqu’au <span id="validUntilLabel">—</span></b></div>
        </div>
      </div>

      <div class="docTitle" id="docTitle">DEVIS N° —</div>

      <div class="grid2">
        <div class="box">
          <h3>Société</h3>
          <div class="line" id="bizBlock">—</div>
        </div>

        <div class="box">
          <h3>Client</h3>
          <div class="line" id="clientBlock">—</div>
        </div>
      </div>

      <table>
        <thead>
          <tr>
            <th class="col-presta">Prestation</th>
            <th class="col-qty right">Qté</th>
            <th class="col-pu right">PU HT</th>
            <th class="col-tht right">Total HT</th>
            <th class="col-tva right">TVA</th>
            <th class="col-ttc right">Total TTC</th>
          </tr>
        </thead>
        <tbody id="linesTbody"></tbody>
      </table>

      <div class="summary">
        <div class="totalBox">
          <div class="totalRow">
            <span class="lbl">Total HT</span>
            <span class="amt" id="totalHtLabel">0,00 €</span>
          </div>
          <div class="totalRow">
            <span class="lbl">Total TVA</span>
            <span class="amt" id="totalTvaLabel">0,00 €</span>
          </div>
          <div class="totalRow ttc">
            <span class="lbl">Total TTC</span>
            <span class="amt" id="totalTtcLabel">0,00 €</span>
          </div>
          <div class="totalSub" id="totalSubLabel"></div>
        </div>

        <div class="payBox">
          <h3>Paiement</h3>
          <div class="line" id="paymentBlock">—</div>
        </div>
      </div>

      <div class="sectionTitle">Conditions</div>
      <div class="box">
        <div class="line" id="conditionsBlock">—</div>
      </div>

      <div class="sectionTitle">Pénalités</div>
      <div class="box">
        <div class="line" id="penaltiesBlock">—</div>
      </div>

      <div class="sigGrid" id="sigGrid">
        <div class="sigBox">
          <div class="sigTitle">Signature conciergerie</div>
          <div class="sigPad">
            <div class="sigText" id="bizSignatureText">—</div>
          </div>
        </div>

        <div class="sigBox">
          <div class="sigTitle">Signature client</div>
          <div class="sigPad">
            <div class="sigText dim" id="clientSignatureText">En attente</div>
          </div>

          <div class="sigChoice" id="sigChoiceWrap">
            <label><input type="radio" name="ownerDecision" value="accept"> Accepter</label>
            <label><input type="radio" name="ownerDecision" value="decline"> Refuser</label>
          </div>
        </div>
      </div>

      <div class="footer" id="footerBlock">—</div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import {
      doc, getDoc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const backBtn = document.getElementById("backBtn");
    const printBtn = document.getElementById("printBtn");

    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");

    const bizName = document.getElementById("bizName");
    const issuedAtLabel = document.getElementById("issuedAtLabel");
    const validUntilLabel = document.getElementById("validUntilLabel");
    const docTitle = document.getElementById("docTitle");

    const bizBlock = document.getElementById("bizBlock");
    const clientBlock = document.getElementById("clientBlock");
    const linesTbody = document.getElementById("linesTbody");

    const totalHtLabel = document.getElementById("totalHtLabel");
    const totalTvaLabel = document.getElementById("totalTvaLabel");
    const totalTtcLabel = document.getElementById("totalTtcLabel");
    const totalSubLabel = document.getElementById("totalSubLabel");

    const paymentBlock = document.getElementById("paymentBlock");
    const conditionsBlock = document.getElementById("conditionsBlock");
    const penaltiesBlock = document.getElementById("penaltiesBlock");
    const footerBlock = document.getElementById("footerBlock");

    const bizSignatureText = document.getElementById("bizSignatureText");
    const clientSignatureText = document.getElementById("clientSignatureText");
    const sigChoiceWrap = document.getElementById("sigChoiceWrap");

    let currentUser = null;
    let currentDocId = "";
    let currentDoc = null;
    let isOwnerView = false;
    let isDraftView = false;

    function showAlert(msg){
      alertBox.style.display = "block";
      alertBox.textContent = msg || "Erreur";
    }

    function esc(s){
      return String(s || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }

    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    function money(n){
      const x = Number(n || 0);
      return x.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }

    function fmtDateInputLike(value){
      if(!value) return "—";

      if (typeof value === "string" && /^\d{2}\/\d{2}\/\d{4}$/.test(value)) return value;

      const d = new Date(value);
      if (Number.isNaN(d.getTime())) return "—";

      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yy = d.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }

    function addDaysLabelFromDate(dateValue, days){
      const d = dateValue ? new Date(dateValue) : new Date();
      if (Number.isNaN(d.getTime())) return "—";
      d.setDate(d.getDate() + (Number(days) || 0));
      const dd = String(d.getDate()).padStart(2,"0");
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const yy = d.getFullYear();
      return `${dd}/${mm}/${yy}`;
    }

    function dueLabel(term){
      if(term === "RECEPTION") return "À réception";
      if(term === "8J") return "8 jours";
      if(term === "15J") return "15 jours";
      if(term === "30J") return "30 jours";
      if(term === "45J") return "45 jours";
      return term || "—";
    }

    function getIssuedDateLabel(d){
      const raw =
        d?.createdAt?.toDate?.() ||
        d?.createdAt ||
        d?.quoteUpdatedAt?.toDate?.() ||
        d?.quoteUpdatedAt ||
        null;
      return fmtDateInputLike(raw);
    }

    function getValidityDateLabel(d){
      const offerDays = Math.max(0, parseInt(d?.quoteOfferValidityDays || "30", 10) || 30);
      const base =
        d?.createdAt?.toDate?.() ||
        d?.createdAt ||
        d?.quoteUpdatedAt?.toDate?.() ||
        d?.quoteUpdatedAt ||
        new Date();
      return addDaysLabelFromDate(base, offerDays);
    }

    function getBusinessSnapshot(d){
      return d?.businessSnapshot || {};
    }

    function getVatSnapshot(d){
      return d?.vatSnapshot || { enabled:false, serviceRate:0, productRate:0 };
    }

    function renderHeader(d){
      const bs = getBusinessSnapshot(d);
      const companyName = String(bs.companyName || "Conciergerie").trim();

      bizName.textContent = companyName || "Conciergerie";
      issuedAtLabel.textContent = getIssuedDateLabel(d);
      validUntilLabel.textContent = getValidityDateLabel(d);

      const qn = String(d?.quoteNumber || "").trim();
      docTitle.textContent = qn ? `DEVIS N° ${qn}` : "DEVIS N° —";

      const logoUrl = String(bs.logoUrl || "").trim();
      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "inline";
      }
    }

    function renderBusinessBlock(d){
      const bs = getBusinessSnapshot(d);
      const rows = [];

      const companyName = String(bs.companyName || "").trim();
      const street = String(bs.address?.street || "").trim();
      const zip = String(bs.address?.zip || "").trim();
      const city = String(bs.address?.city || "").trim();
      const siret = String(bs.registration?.siret || "").trim();
      const ape = String(bs.registration?.ape || "").trim();
      const phone = String(bs.contact?.phone || "").trim();

      if(companyName) rows.push(`<div>${esc(companyName)}</div>`);
      if(street) rows.push(`<div>${esc(street)}</div>`);
      if(zip || city) rows.push(`<div>${esc([zip, city].filter(Boolean).join(" "))}</div>`);

      const legalBits = [];
      if(siret) legalBits.push(`SIRET ${esc(siret)}`);
      if(ape) legalBits.push(`APE ${esc(ape)}`);
      if(phone) legalBits.push(esc(phone));

      if(legalBits.length){
        rows.push(`<div class="mut">${legalBits.join(" • ")}</div>`);
      }

      bizBlock.innerHTML = rows.join("") || "—";
    }

    function renderClientBlock(d){
      const rows = [];

      const name = String(d?.clientDisplayName || d?.clientName || "").trim();
      const address1 = String(d?.clientAddress1 || "").trim();
      const address2 = String(d?.clientAddress2 || "").trim();
      const zip = String(d?.clientZip || "").trim();
      const city = String(d?.clientCity || "").trim();
      const email = String(d?.clientEmail || "").trim();

      if(name) rows.push(`<div>${esc(name)}</div>`);
      if(address1) rows.push(`<div>${esc(address1)}</div>`);
      if(address2) rows.push(`<div>${esc(address2)}</div>`);

      const lastLine = [zip, city].filter(Boolean).join(" ");
      if(lastLine || email){
        rows.push(`<div>${esc(lastLine)}${lastLine && email ? " • " : ""}${esc(email)}</div>`);
      }else if(email){
        rows.push(`<div>${esc(email)}</div>`);
      }

      clientBlock.innerHTML = rows.join("") || "—";
    }

    function renderLines(d){
      const lines = Array.isArray(d?.lines) ? d.lines : [];
      const vat = getVatSnapshot(d);

      if(!lines.length){
        linesTbody.innerHTML = `
          <tr>
            <td colspan="6" class="mut">Aucune ligne</td>
          </tr>
        `;
        return;
      }

      linesTbody.innerHTML = lines.map(l => {
        const label = String(l?.label || "").trim();
        const qty = Number(l?.qty || 0);
        const unit = String(l?.unit || "unité").trim();
        const unitPrice = Number(l?.unitPrice || 0);
        const totalHT = Number(l?.totalHT || 0);
        const totalTVA = Number(l?.totalTVA || 0);
        const totalTTC = Number(l?.totalTTC || 0);
        const vatRate = Math.round((Number(l?.vatRate || 0)) * 100);

        let tvaLabel = vat.enabled ? `${vatRate}% • ${money(totalTVA)}` : "—";
        if(!vat.enabled) tvaLabel = "0% • 0,00 €";

        return `
          <tr>
            <td class="col-presta">${esc(label)}</td>
            <td class="col-qty right">${esc(String(qty))} ${esc(unit)}</td>
            <td class="col-pu right">${money(unitPrice)}</td>
            <td class="col-tht right">${money(totalHT)}</td>
            <td class="col-tva right">${esc(tvaLabel)}</td>
            <td class="col-ttc right">${money(totalTTC)}</td>
          </tr>
        `;
      }).join("");
    }

    function renderTotals(d){
      const totalHT = Number(d?.totalHT || 0);
      const totalTVA = Number(d?.totalTVA || 0);
      const totalTTC = Number(d?.totalTTC || 0);
      const vat = getVatSnapshot(d);

      totalHtLabel.textContent = money(totalHT);
      totalTvaLabel.textContent = money(totalTVA);
      totalTtcLabel.textContent = money(totalTTC);

      if(vat.enabled){
        const lines = Array.isArray(d?.lines) ? d.lines : [];
        const serviceTVA = lines
          .filter(l => String(l?.lineType || "").toUpperCase() === "SERVICE")
          .reduce((s,l) => s + (Number(l?.totalTVA || 0)), 0);

        const productTVA = lines
          .filter(l => String(l?.lineType || "").toUpperCase() === "PRODUCT")
          .reduce((s,l) => s + (Number(l?.totalTVA || 0)), 0);

        totalSubLabel.textContent = `TVA totale ${money(totalTVA)} • services ${money(serviceTVA)} • produits ${money(productTVA)}`;
      }else{
        totalSubLabel.textContent = String(bsOrProfileExemption(d) || "TVA non applicable – art. 293 B du CGI");
      }
    }

    function bsOrProfileExemption(d){
      return String(d?.businessSnapshot?.tvaExemptionText || "").trim();
    }

    function renderPayment(d){
      const bs = getBusinessSnapshot(d);
      const bank = bs?.bank || {};

      const rows = [];
      rows.push(`<div><b>Mode</b> : ${esc(String(d?.quotePaymentMode || "VIREMENT"))}</div>`);
      rows.push(`<div><b>Délai</b> : ${esc(dueLabel(String(d?.quotePaymentTerm || "")))}</div>`);

      if(String(d?.quotePaymentMode || "").toUpperCase() === "VIREMENT"){
        const bankBits = [];
        if(bank.bankName) bankBits.push(esc(bank.bankName));
        if(bank.iban) bankBits.push(`IBAN ${esc(bank.iban)}`);
        if(bank.bic) bankBits.push(`BIC ${esc(bank.bic)}`);

        if(bankBits.length){
          rows.push(`<div>Virement : ${bankBits.join(" • ")}</div>`);
        }
      }

      paymentBlock.innerHTML = rows.join("") || "—";
    }

    function renderConditions(d){
      const vat = getVatSnapshot(d);
      const cancelPct = Number.isFinite(Number(d?.businessSnapshot?.conditions?.cancellationPercent))
        ? Number(d.businessSnapshot.conditions.cancellationPercent)
        : 30;

      const rows = [];
      rows.push(`<div><b>Validité de l’offre</b> : ${esc(String(d?.quoteOfferValidityDays || 30))} jours</div>`);
      rows.push(`<div><b>Annulation</b> : ${esc(String(cancelPct))}% du montant peuvent être retenus selon conditions.</div>`);

      if(vat.enabled){
        rows.push(`<div><b>TVA</b> : services ${Math.round((Number(vat.serviceRate || 0))*100)}% • produits ${Math.round((Number(vat.productRate || 0))*100)}%</div>`);
      }else{
        rows.push(`<div>${esc(bsOrProfileExemption(d) || "TVA non applicable – art. 293 B du CGI")}</div>`);
      }

      conditionsBlock.innerHTML = rows.join("") || "—";
    }

    function renderPenalties(d){
      penaltiesBlock.innerHTML = esc(String(d?.quotePenaltyText || "—"));
    }

    function renderSignatures(d){
      const signatureName = String(d?.businessSnapshot?.signatureName || d?.businessSnapshot?.companyName || "Conciergerie").trim();
      bizSignatureText.textContent = signatureName || "Conciergerie";

      const clientName = String(d?.clientDisplayName || d?.clientName || "Client").trim();
      const st = String(d?.quoteStatus || "").toUpperCase();

      if(isOwnerView){
        if(st === "ACCEPTED"){
          clientSignatureText.textContent = `${clientName} — Accepté`;
          clientSignatureText.className = "sigText ok";
        }else if(st === "DECLINED"){
          clientSignatureText.textContent = `${clientName} — Refusé`;
          clientSignatureText.className = "sigText no";
        }else{
          clientSignatureText.textContent = clientName;
          clientSignatureText.className = "sigText";
        }
      }else{
        clientSignatureText.textContent = clientName;
        clientSignatureText.className = "sigText";
      }

      if(!isOwnerView || isDraftView){
        sigChoiceWrap.style.display = "none";
      }else{
        sigChoiceWrap.style.display = "flex";
        const accepted = st === "ACCEPTED";
        const declined = st === "DECLINED";
        const acceptRadio = document.querySelector('input[name="ownerDecision"][value="accept"]');
        const declineRadio = document.querySelector('input[name="ownerDecision"][value="decline"]');
        if(acceptRadio) acceptRadio.checked = accepted;
        if(declineRadio) declineRadio.checked = declined;
      }
    }

    function renderFooter(d){
      const bs = getBusinessSnapshot(d);
      const parts = [];

      const companyName = String(bs.companyName || "").trim();
      const mail = String(bs.contact?.email || "").trim();
      const phone = String(bs.contact?.phone || "").trim();
      const siret = String(bs.registration?.siret || "").trim();

      if(companyName) parts.push(companyName);
      if(siret) parts.push(`SIRET ${siret}`);
      if(mail) parts.push(mail);
      if(phone) parts.push(phone);

      footerBlock.textContent = parts.join(" • ") || "Devis édité par CleanUp Manager";
    }

    function renderAll(d){
      renderHeader(d);
      renderBusinessBlock(d);
      renderClientBlock(d);
      renderLines(d);
      renderTotals(d);
      renderPayment(d);
      renderConditions(d);
      renderPenalties(d);
      renderSignatures(d);
      renderFooter(d);
    }

    async function loadDoc(docId){
      const ref = doc(db, "salesDocuments", docId);
      const snap = await getDoc(ref);
      if(!snap.exists()) throw new Error("Devis introuvable.");
      return { id:snap.id, ...(snap.data() || {}) };
    }

    async function handleOwnerDecision(value){
      if(!isOwnerView || isDraftView || !currentDocId) return;

      try{
        const nextStatus = value === "accept" ? "ACCEPTED" : "DECLINED";
        const ref = doc(db, "salesDocuments", currentDocId);

        await updateDoc(ref, {
          quoteStatus: nextStatus,
          commercialUpdatedAt: serverTimestamp(),
          ownerDecisionAt: serverTimestamp()
        });

        currentDoc = await loadDoc(currentDocId);
        renderAll(currentDoc);
      }catch(e){
        console.error(e);
        showAlert("Impossible d’enregistrer la décision du client.");
      }
    }

    document.addEventListener("change", (e)=>{
      if(e.target && e.target.name === "ownerDecision"){
        handleOwnerDecision(e.target.value);
      }
    });

    printBtn.addEventListener("click", ()=> window.print());

    onAuthStateChanged(auth, async (user)=>{
      currentUser = user || null;
      currentDocId = getParam("docId");
      isOwnerView = getParam("owner") === "1";
      isDraftView = getParam("draft") === "1";

      if(!currentDocId){
        showAlert("Document manquant.");
        return;
      }

      try{
        currentDoc = await loadDoc(currentDocId);

        if(isOwnerView && isDraftView){
          showAlert("Accès refusé sur un brouillon.");
          document.getElementById("paper").style.display = "none";
          return;
        }

        if(isOwnerView){
          backBtn.style.display = "none";
          if(String(currentDoc?.ownerVisible || "").toLowerCase() !== "true" && currentDoc?.ownerVisible !== true){
            showAlert("Ce devis n’est pas accessible au propriétaire.");
            document.getElementById("paper").style.display = "none";
            return;
          }
        }else{
          if(!currentUser){
            location.href = "login.html?role=conciergerie";
            return;
          }
          if(currentDoc?.conciergerieUid && currentDoc.conciergerieUid !== currentUser.uid){
            showAlert("Accès refusé.");
            document.getElementById("paper").style.display = "none";
            return;
          }
        }

        renderAll(currentDoc);
      }catch(e){
        console.error(e);
        showAlert(e?.message || "Erreur chargement du devis.");
      }
    });
  </script>
</body>
</html>
