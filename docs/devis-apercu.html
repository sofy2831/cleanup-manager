<!-- docs/devis-apercu.html (EVENT + SALES DOC — LECTURE + ACCEPTATION PROPRIETAIRE) -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF; --violet2:#6238FF;
      --bg1:#F8F4FF; --bg2:#EDE6FF;
      --text:#111; --muted:#666; --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
      --bad:#b3261e; --ok:#1b8f4d;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%); color:var(--text); }

    .page{
      min-height:100vh; display:flex; flex-direction:column; align-items:center;
      padding:16px 16px 32px; padding-bottom:32px;
    }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0; background:rgba(248,244,255,.85); backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px; padding:8px 12px; border-radius:999px;
      background:#fff; border:2px solid var(--violet); color:var(--violet);
      text-decoration:none; font-weight:900; font-size:13px; cursor:pointer;
      box-shadow:0 3px 10px rgba(0,0,0,.06); white-space:nowrap;
    }

    .card{
      width:100%; max-width:980px;
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      padding: 14px 14px 14px;
      margin-top:12px;
    }

    .header{
      display:flex; justify-content:space-between; gap:12px; align-items:flex-start; flex-wrap:wrap;
    }
    .docLeft{ display:flex; gap:12px; align-items:flex-start; }
    .logoBox{
      width:54px;height:54px;border-radius:14px;border:1px solid rgba(0,0,0,.10);
      background:#fff; display:flex; align-items:center; justify-content:center; overflow:hidden;
    }
    .logoBox img{ width:100%; height:100%; object-fit:cover; display:none; }
    .logoFallback{ font-weight:1000; color:var(--violet); font-size:22px; }
    .docTitle{ font-weight:1000; font-size:12px; color:#444; letter-spacing:.2px; }
    .docNum{ font-weight:1000; font-size:22px; color:#111; margin-top:2px; }
    .meta{ min-width:280px; }
    .metaLine{ font-size:13px; color:#222; font-weight:800; margin-top:4px; line-height:1.35; }
    .muted{ color:var(--muted); font-weight:800; }

    .grid2{
      margin-top:12px;
      display:grid; grid-template-columns:1fr; gap:10px;
    }
    @media(min-width:860px){ .grid2{ grid-template-columns:1fr 1fr; } }

    .box{
      background:#fff;
      border:1px solid rgba(0,0,0,.10);
      border-radius:14px;
      padding:10px 12px;
    }
    .boxTitle{ font-weight:1000; font-size:12px; color:#333; margin-bottom:6px; }
    .line{ font-size:13px; color:#222; font-weight:800; margin-top:4px; line-height:1.35; }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      background:#fff;
      border-radius:14px;
      overflow:hidden;
      border:1px solid rgba(0,0,0,.10);
    }
    th,td{ padding:10px 10px; border-bottom:1px solid rgba(0,0,0,.08); text-align:left; vertical-align:top; font-size:13px; }
    th{ background: rgba(248,244,255,.7); font-weight:1000; }
    td.num, th.num{ text-align:right; white-space:nowrap; }

    .totals{
      margin-top:12px;
      background:#fff;
      border:1px solid rgba(0,0,0,.10);
      border-radius:14px;
      padding:10px 12px;
    }
    .r{ display:flex; justify-content:space-between; gap:10px; margin-top:6px; font-weight:900; }
    .big{ font-size:15px; }
    .smallNote{ margin-top:6px; font-size:12px; color:#555; font-weight:800; line-height:1.35; }

    .alert{
      display:none;
      margin-top:12px;
      padding:10px 12px;
      background:#fff;
      border-radius:14px;
      border-left:5px solid var(--bad);
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      font-size:12px;
      color:#333;
      white-space:pre-wrap;
    }
    .alert.ok{ border-left-color: var(--ok); }

    .actions{
      margin-top:12px;
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      justify-content:flex-end;
      align-items:center;
    }
    .btn{
      border:none; border-radius:999px; padding:10px 12px;
      font-size:13px; font-weight:1000; cursor:pointer;
      background:#fff; color:var(--violet);
      border:2px solid var(--violet); box-shadow:0 3px 10px rgba(0,0,0,.06);
      white-space:nowrap;
    }
    .btn.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff; box-shadow:0 10px 22px rgba(0,0,0,.12);
    }
    .btn.danger{
      border-color: rgba(179,38,30,0.30);
      color: var(--bad);
    }
    .btn:disabled{ opacity:.65; cursor:not-allowed; }

    textarea{
      width:100%;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid #D3C7FF;
      font-size:14px;
      outline:none;
      background:#fff;
      font-weight:800;
      color:#111;
      margin-top:10px;
    }

    .statusPill{
      display:inline-flex; align-items:center; gap:8px;
      padding:6px 10px; border-radius:999px;
      border:1px solid rgba(0,0,0,.10);
      background:#fff;
      font-size:12px; font-weight:1000;
      color:#333;
      margin-top:10px;
    }
    .statusPill.ok{ border-color: rgba(27,143,77,0.35); color: var(--ok); }
    .statusPill.bad{ border-color: rgba(179,38,30,0.30); color: var(--bad); }
  </style>
</head>

<body>
  <div class="page">
    <div class="topbar">
      <a class="pill" id="backLink" href="owner-dashboard.html">← Retour</a>
      <a class="pill" id="msgLink" href="owner-messages.html">Messages</a>
    </div>

    <div class="card">
      <div class="header">
        <div class="docLeft">
          <div class="logoBox">
            <img id="logoImg" alt="Logo">
            <div class="logoFallback" id="logoFallback">✓</div>
          </div>
          <div>
            <div class="docTitle" id="docTypeLabel">DEVIS</div>
            <div class="docNum" id="docNum">—</div>
            <div class="statusPill" id="statusPill" style="display:none;"></div>
          </div>
        </div>

        <div class="meta">
          <div class="metaLine"><b>Date</b> : <span id="quoteDate">—</span></div>
          <div class="metaLine"><b>Validité</b> : <span id="quoteValidity">—</span></div>
          <div class="metaLine"><b>Paiement</b> : <span id="quotePayment">—</span></div>
        </div>
      </div>

      <div class="alert" id="alertBox"></div>

      <div class="grid2">
        <div class="box">
          <div class="boxTitle">Société</div>
          <div class="line" id="bizName">—</div>
          <div class="line muted" id="bizLines">—</div>
        </div>
        <div class="box">
          <div class="boxTitle">Client</div>
          <div class="line" id="clientName">—</div>
          <div class="line muted" id="clientLines">—</div>
        </div>
      </div>

      <div class="box" style="margin-top:10px;">
        <div class="boxTitle">Objet / Logement</div>
        <div class="line" id="objLine">—</div>
        <div class="line" id="homeLine">—</div>
        <div class="line" id="periodLine">—</div>
      </div>

      <table>
        <thead>
          <tr>
            <th>Désignation</th>
            <th class="num">Qté</th>
            <th>Unité</th>
            <th class="num">PU HT</th>
            <th class="num" id="thTVA" style="display:none;">TVA</th>
            <th class="num">Total TTC</th>
          </tr>
        </thead>
        <tbody id="linesTbody"></tbody>
      </table>

      <div class="totals" id="totalsBox"></div>

      <div class="grid2" style="margin-top:10px;">
        <div class="box">
          <div class="boxTitle">Conditions</div>
          <div class="line" id="cond1">—</div>
          <div class="line" id="cond2">—</div>
          <div class="line" id="cond3">—</div>
          <div class="line" id="cond4">—</div>
        </div>
        <div class="box">
          <div class="boxTitle">Pénalités</div>
          <div class="line" id="penaltyText">—</div>
        </div>
      </div>

      <textarea id="refuseNote" rows="3" placeholder="Motif de refus (optionnel)"></textarea>

      <div class="actions" id="actionsBox">
        <button class="btn danger" id="refuseBtn" type="button">Refuser</button>
        <button class="btn primary" id="acceptBtn" type="button">Accepter le devis</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { auth, db } from "./firebase-init.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const alertBox = document.getElementById("alertBox");
    const logoImg = document.getElementById("logoImg");
    const logoFallback = document.getElementById("logoFallback");

    const docTypeLabel = document.getElementById("docTypeLabel");
    const docNum = document.getElementById("docNum");
    const quoteDate = document.getElementById("quoteDate");
    const quoteValidity = document.getElementById("quoteValidity");
    const quotePayment = document.getElementById("quotePayment");

    const bizName = document.getElementById("bizName");
    const bizLines = document.getElementById("bizLines");
    const clientName = document.getElementById("clientName");
    const clientLines = document.getElementById("clientLines");

    const objLine = document.getElementById("objLine");
    const homeLine = document.getElementById("homeLine");
    const periodLine = document.getElementById("periodLine");

    const thTVA = document.getElementById("thTVA");
    const linesTbody = document.getElementById("linesTbody");
    const totalsBox = document.getElementById("totalsBox");

    const cond1 = document.getElementById("cond1");
    const cond2 = document.getElementById("cond2");
    const cond3 = document.getElementById("cond3");
    const cond4 = document.getElementById("cond4");

    const penaltyText = document.getElementById("penaltyText");

    const acceptBtn = document.getElementById("acceptBtn");
    const refuseBtn = document.getElementById("refuseBtn");
    const refuseNote = document.getElementById("refuseNote");

    const statusPill = document.getElementById("statusPill");
    const actionsBox = document.getElementById("actionsBox");

    const backLink = document.getElementById("backLink");
    const msgLink = document.getElementById("msgLink");

    function showAlert(msg, ok=false){
      alertBox.style.display = "block";
      alertBox.classList.toggle("ok", !!ok);
      alertBox.textContent = msg;
    }
    function hideAlert(){
      alertBox.style.display = "none";
      alertBox.classList.remove("ok");
      alertBox.textContent = "";
    }
    function esc(s){
      return String(s||"")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
    }
    function fmtMoney(v){
      const n = Number(v);
      if(!Number.isFinite(n)) return "—";
      return n.toLocaleString("fr-FR", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + " €";
    }
    function normalizeEmail(s){ return (s||"").toString().trim().toLowerCase(); }
    function getParam(name){
      const p = new URLSearchParams(location.search);
      return (p.get(name) || "").trim();
    }

    function todayIso(){
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth()+1).padStart(2,"0");
      const dd = String(d.getDate()).padStart(2,"0");
      return `${dd}/${mm}/${yyyy}`;
    }
    function addDaysLabel(ddmmyyyy, days){
      const [dd,mm,yy] = String(ddmmyyyy).split("/").map(x=>parseInt(x,10));
      const d = new Date(yy, (mm||1)-1, dd||1);
      d.setDate(d.getDate() + (Number(days)||0));
      return String(d.getDate()).padStart(2,"0") + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + d.getFullYear();
    }
    function termLabel(term){
      if(term === "RECEPTION") return "À réception";
      if(term === "8J") return "8 jours";
      if(term === "15J") return "15 jours";
      if(term === "30J") return "30 jours";
      if(term === "45J") return "45 jours";
      return term || "—";
    }
    function termToDays(term){
      if(term === "RECEPTION") return 0;
      if(term === "8J") return 8;
      if(term === "15J") return 15;
      if(term === "30J") return 30;
      if(term === "45J") return 45;
      return 0;
    }
    function payModeLabel(m){
      const x = String(m||"").toUpperCase();
      if(x === "VIREMENT") return "Virement";
      if(x === "ESPECES") return "Espèces";
      if(x === "CHEQUE") return "Chèque";
      return "—";
    }
    function getStayPeriod(d){
      const a = String(d?.arrivalDateKey || d?.arrivalDate || d?.checkinDate || d?.arrival || d?.dateArrivee || "").trim();
      const b = String(d?.departureDateKey || d?.departureDate || d?.checkoutDate || d?.departure || d?.dateDepart || "").trim();
      if(a && b) return `Du ${a} au ${b}`;
      if(a && !b) return `À partir du ${a}`;
      if(!a && b) return `Jusqu’au ${b}`;
      return "—";
    }

    function lockActions(locked){
      acceptBtn.disabled = !!locked;
      refuseBtn.disabled = !!locked;
    }

    function statusLabel(s){
      const x = String(s||"").toUpperCase().trim();
      if(x === "ACCEPTED") return "Devis accepté";
      if(x === "REFUSED") return "Devis refusé";
      if(x === "SENT") return "Devis envoyé";
      if(x === "DRAFT") return "Brouillon";
      return x || "";
    }

    async function loadConciergerieProfile(conciergerieUid){
      const snap = await getDoc(doc(db, "users", conciergerieUid));
      return snap.exists() ? (snap.data()||{}) : {};
    }

    function renderStatusPill(qs){
      const x = String(qs||"").toUpperCase();
      const label = statusLabel(x);
      if(!label) { statusPill.style.display = "none"; return; }
      statusPill.style.display = "inline-flex";
      statusPill.textContent = label;
      statusPill.classList.remove("ok","bad");
      if(x === "ACCEPTED") statusPill.classList.add("ok");
      if(x === "REFUSED") statusPill.classList.add("bad");
    }

    function computeTotals(lines, tvaEnabled, tvaRate){
      let ht = 0;
      for(const l of (Array.isArray(lines) ? lines : [])){
        const qty = Number(l?.qty)||0;
        const up  = Number(l?.unitPrice)||0;
        ht += qty * up;
      }
      const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
      const ttc = ht + tva;
      return { ht, tva, ttc };
    }

    // ===== Params =====
    const eventId = getParam("eventId");
    const docId = getParam("docId");

    let docMode = ""; // "event" | "sales"
    let dataRef = null;
    let data = null;
    let profile = null;

    function isOwnerAcceptanceAllowed(){
      // seulement sur event, pas sur salesDocuments (prospect sans compte)
      return docMode === "event";
    }

    function hideOwnerActions(){
      actionsBox.style.display = "none";
      refuseNote.style.display = "none";
    }

    function ensureOwnerAllowed(user, eventData){
      // Priorité : ownerUid (auth uid) puis fallback email
      const uEmail = normalizeEmail(user.email || "");
      const oEmail = normalizeEmail(eventData.ownerEmail || "");
      const ownerUid = String(eventData.ownerUid || eventData.ownerAuthUid || "").trim();

      const allowed =
        (!!ownerUid && ownerUid === user.uid) ||
        (!!uEmail && !!oEmail && uEmail === oEmail);

      return allowed;
    }

    function renderCompany(bp){
      const logoUrl = String(bp.logoUrl || "").trim();
      if(logoUrl){
        logoImg.src = logoUrl;
        logoImg.style.display = "block";
        logoFallback.style.display = "none";
      }else{
        logoImg.style.display = "none";
        logoFallback.style.display = "block";
      }

      bizName.textContent = String(bp.companyName || "Conciergerie").trim() || "Conciergerie";

      const bLines = [];
      const street = String(bp.address?.street || "").trim();
      const zip = String(bp.address?.zip || "").trim();
      const city = String(bp.address?.city || "").trim();
      if(street) bLines.push(street);
      if(zip || city) bLines.push([zip, city].filter(Boolean).join(" "));
      const siret = String(bp.registration?.siret || "").trim();
      if(siret) bLines.push(`SIRET ${siret}`);
      const vatEnabled = !!bp.vat?.enabled;
      const vatNumber = String(bp.vat?.number || "").trim();
      if(vatEnabled && vatNumber) bLines.push(`TVA : ${vatNumber}`);

      bizLines.textContent = bLines.filter(Boolean).join(" • ") || "—";
    }

    function renderClientFromEvent(ev){
      // snapshot event
      clientName.textContent = (ev.ownerName || "—");
      const cLines = [];
      const a1 = String(ev.ownerAddress1 || "").trim();
      const a2 = String(ev.ownerAddress2 || "").trim();
      const z = String(ev.ownerZip || "").trim();
      const c = String(ev.ownerCity || "").trim();
      if(a1) cLines.push(a1);
      if(a2) cLines.push(a2);
      if(z || c) cLines.push([z,c].filter(Boolean).join(" "));
      if(ev.ownerEmail) cLines.push(ev.ownerEmail);
      clientLines.textContent = cLines.filter(Boolean).join(" • ") || "—";
    }

    function renderClientFromSales(sd){
      // client snapshot in salesDocuments
      const cs = sd.clientSnapshot || {};
      const name = String(cs.fullname || cs.name || sd.clientName || "—").trim() || "—";
      const email = String(cs.email || sd.clientEmail || "").trim();
      const phone = String(cs.phone || "").trim();
      const a1 = String(cs.address1 || "").trim();
      const a2 = String(cs.address2 || "").trim();
      const z = String(cs.zip || "").trim();
      const c = String(cs.city || "").trim();

      clientName.textContent = name;
      const lines = [];
      if(a1) lines.push(a1);
      if(a2) lines.push(a2);
      if(z || c) lines.push([z,c].filter(Boolean).join(" "));
      if(email) lines.push(email);
      if(phone) lines.push(phone);
      clientLines.textContent = lines.length ? lines.join(" • ") : "—";
    }

    function renderLinesAndTotals(lines, bp){
      const vatEnabled = !!bp.vat?.enabled;
      const vatRate = Number.isFinite(Number(bp.vat?.rate)) ? Number(bp.vat.rate) : 0;
      thTVA.style.display = vatEnabled ? "" : "none";

      linesTbody.innerHTML = "";
      for(const l of (Array.isArray(lines) ? lines : [])){
        const label = l?.label || "Ligne";
        const qty = Number(l?.qty)||0;
        const unit = l?.unit || "unité";
        const up = Number(l?.unitPrice)||0;

        const lineHT = qty * up;
        const lineTVA = vatEnabled ? (lineHT * vatRate) : 0;
        const lineTTC = lineHT + lineTVA;

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${esc(label)}</td>
          <td class="num">${esc(qty)}</td>
          <td>${esc(unit)}</td>
          <td class="num">${esc(fmtMoney(up))}</td>
          ${vatEnabled ? `<td class="num">${esc(fmtMoney(lineTVA))}</td>` : ``}
          <td class="num">${esc(fmtMoney(lineTTC))}</td>
        `;
        linesTbody.appendChild(tr);
      }

      const totals = computeTotals(lines, vatEnabled, vatRate);

      if(vatEnabled){
        totalsBox.innerHTML = `
          <div class="r"><span>Total HT</span><span>${esc(fmtMoney(totals.ht))}</span></div>
          <div class="r"><span>TVA (${Math.round(vatRate*100)}%)</span><span>${esc(fmtMoney(totals.tva))}</span></div>
          <div class="r big"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>
        `;
      }else{
        const ex = String(bp?.tvaExemptionText || "").trim() || "TVA non applicable, art. 293B du CGI.";
        totalsBox.innerHTML = `
          <div class="r big"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>
          <div class="smallNote">${esc(ex)}</div>
        `;
      }
    }

    function renderCommonMeta(fromData, bp){
      const date = todayIso();
      quoteDate.textContent = date;

      const offerDays = Math.max(0, parseInt(fromData.quoteOfferValidityDays || fromData.offerValidityDays || "30", 10) || 30);
      quoteValidity.textContent = `jusqu’au ${addDaysLabel(date, offerDays)}`;

      const payTerm = String(fromData.quotePaymentTerm || fromData.paymentTerm || "RECEPTION");
      const payMode = String(fromData.quotePaymentMode || fromData.paymentMode || "VIREMENT");
      const dueDays = termToDays(payTerm);
      quotePayment.textContent = `${termLabel(payTerm)} (échéance ${addDaysLabel(date, dueDays)}) • ${payModeLabel(payMode)}`;

      const cancelPct = Number.isFinite(Number(bp?.conditions?.cancellationPercent))
        ? Number(bp.conditions.cancellationPercent)
        : 30;

      cond1.textContent = `Validité : ${quoteValidity.textContent}`;
      cond2.textContent = `Paiement : ${quotePayment.textContent}`;
      cond3.textContent = `Annulation : ${cancelPct}% selon conditions`;
      cond4.textContent = `Accès logement : clés/codes/consignes obligatoires`;

      penaltyText.textContent = String(fromData.quotePenaltyText || fromData.penaltyText || "—");
    }

    function renderEvent(ev){
      docTypeLabel.textContent = "DEVIS";
      docMode = "event";

      // backlink owner
      backLink.href = "owner-dashboard.html";
      msgLink.href = "owner-messages.html";

      docNum.textContent = ev.quoteNumber ? ev.quoteNumber : "—";
      renderStatusPill(ev.quoteStatus);

      objLine.textContent = `Objet : ${String(ev.quoteObject || ev.object || "Prestation de conciergerie").trim()}`;
      homeLine.textContent = `Logement : ${String(ev.homeName || "—")}${ev.homeCity ? " — " + ev.homeCity : ""}`;
      periodLine.textContent = `Période : ${getStayPeriod(ev)}`;

      renderClientFromEvent(ev);

      const lines = Array.isArray(ev.lines) ? ev.lines : [];
      renderLinesAndTotals(lines, profile?.businessProfile || {});

      renderCommonMeta(ev, profile?.businessProfile || {});

      // actions owner
      if(!isOwnerAcceptanceAllowed()){
        hideOwnerActions();
        return;
      }

      const qs = String(ev.quoteStatus || "").toUpperCase();
      if(qs === "ACCEPTED" || qs === "REFUSED"){
        lockActions(true);
        refuseNote.disabled = true;
      }else{
        lockActions(false);
        refuseNote.disabled = false;
      }
    }

    function renderSales(sd){
      docTypeLabel.textContent = "DEVIS";
      docMode = "sales";

      // mode prospect : retour côté conciergerie (pas owner dashboard)
      backLink.href = "devis-liste.html";
      msgLink.href = "messagerie.html"; // conciergerie (tu peux changer si tu veux)
      hideOwnerActions();

      const number = String(sd.number || sd.quoteNumber || "").trim();
      docNum.textContent = number || "—";
      renderStatusPill(sd.status || sd.quoteStatus || "");

      objLine.textContent = `Objet : ${String(sd.object || sd.quoteObject || "Prestation de conciergerie").trim()}`;
      homeLine.textContent = sd.homeName ? `Logement : ${String(sd.homeName)}${sd.homeCity ? " — " + sd.homeCity : ""}` : `Logement : —`;
      periodLine.textContent = `Période : ${String(sd.periodLabel || "—")}`;

      renderClientFromSales(sd);

      const lines = Array.isArray(sd.lines) ? sd.lines : [];
      renderLinesAndTotals(lines, profile?.businessProfile || {});

      renderCommonMeta(sd, profile?.businessProfile || {});
    }

    onAuthStateChanged(auth, async (user)=>{
      if(!user){ location.href = "login.html?role=owner"; return; }
      hideAlert();

      try{
        if(!eventId && !docId) throw new Error("Paramètre manquant : eventId ou docId.");

        // 1) load data (event ou sales)
        if(eventId){
          dataRef = doc(db, "events", eventId);
          const snap = await getDoc(dataRef);
          if(!snap.exists()) throw new Error("Devis introuvable.");
          data = { id:snap.id, ...(snap.data()||{}) };

          // 2) access control owner
          if(!ensureOwnerAllowed(user, data)){
            throw new Error("Accès refusé : ce devis ne vous appartient pas.");
          }

          // 3) load conciergerie profile
          profile = await loadConciergerieProfile(data.conciergerieUid);
          const bp = profile?.businessProfile || {};
          renderCompany(bp);

          // 4) render
          renderEvent(data);
          return;
        }

        // docId mode (salesDocuments) : conciergerie only (même login)
        dataRef = doc(db, "salesDocuments", docId);
        const snap = await getDoc(dataRef);
        if(!snap.exists()) throw new Error("Devis introuvable.");
        data = { id:snap.id, ...(snap.data()||{}) };

        // contrôle basique : conciergerieUid == auth uid
        if(String(data.conciergerieUid || "").trim() !== String(user.uid)){
          throw new Error("Accès refusé : ce document n'est pas dans votre compta.");
        }

        profile = await loadConciergerieProfile(user.uid);
        const bp = profile?.businessProfile || {};
        renderCompany(bp);

        renderSales(data);

      }catch(e){
        showAlert("⛔ " + (e?.message || "Erreur"), false);
      }
    });

    // ===== Accept/Refuse (event only) =====
    acceptBtn.addEventListener("click", async ()=>{
      if(!dataRef || docMode !== "event") return;
      if(!confirm("Confirmer l’acceptation du devis ?")) return;
      lockActions(true);
      try{
        await updateDoc(dataRef, {
          quoteStatus: "ACCEPTED",
          commercialStatus: "DEVIS_ACCEPTE",
          quoteAnsweredAt: serverTimestamp(),
          quoteAnswerNote: "",
        });
        showAlert("✅ Devis accepté.", true);
        renderStatusPill("ACCEPTED");
      }catch(e){
        console.error(e);
        showAlert("Erreur : " + (e?.message || "inconnue"));
        lockActions(false);
      }
    });

    refuseBtn.addEventListener("click", async ()=>{
      if(!dataRef || docMode !== "event") return;
      if(!confirm("Confirmer le refus du devis ?")) return;
      lockActions(true);
      try{
        await updateDoc(dataRef, {
          quoteStatus: "REFUSED",
          commercialStatus: "DEVIS_REFUSE",
          quoteAnsweredAt: serverTimestamp(),
          quoteAnswerNote: (refuseNote.value || "").trim()
        });
        showAlert("✅ Devis refusé.", true);
        renderStatusPill("REFUSED");
      }catch(e){
        console.error(e);
        showAlert("Erreur : " + (e?.message || "inconnue"));
        lockActions(false);
      }
    });
  </script>
</body>
</html>
