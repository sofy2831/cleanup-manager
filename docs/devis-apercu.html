<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager – Aperçu devis</title>

  <style>
    :root{
      --violet:#7A5CFF;
      --violet2:#6238FF;
      --bg1:#F8F4FF;
      --bg2:#EDE6FF;
      --text:#111;
      --muted:#666;
      --border: rgba(122,92,255,0.18);
      --shadow: 0 14px 36px rgba(0,0,0,0.08);
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{
      margin:0;
      background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 80%);
      color:var(--text);
      font-weight:400;
    }

    .wrap{ min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px; padding-bottom:28px; }

    .topbar{
      width:100%; max-width:980px;
      position:sticky; top:0; z-index:10;
      display:flex; justify-content:space-between; align-items:center; gap:10px;
      padding:10px 0;
      background:rgba(248,244,255,.85);
      backdrop-filter:blur(6px);
    }
    .pill{
      display:inline-flex; align-items:center; gap:8px;
      padding:10px 14px; border-radius:999px;
      background:#fff; border:2px solid var(--violet);
      color:var(--violet); text-decoration:none;
      font-weight:800; font-size:13px;
      box-shadow:0 3px 10px rgba(0,0,0,.06);
      cursor:pointer;
      white-space:nowrap;
    }
    .pill.primary{
      background:linear-gradient(90deg,var(--violet),var(--violet2));
      border-color:transparent; color:#fff;
      box-shadow:0 10px 22px rgba(0,0,0,.12);
    }

    .paper{
      width:100%; max-width:980px;
      background:#fff;
      border:1px solid var(--border);
      box-shadow:var(--shadow);
      border-radius:16px;
      padding:16px;
      margin-top:10px;
      position:relative;
    }

    .header{
      display:flex;
      gap:12px;
      align-items:flex-start;
      justify-content:space-between;
    }
    .brandLeft{
      display:flex; gap:12px; align-items:center; min-width:0;
    }
    .logo{
      width:50px; height:50px; border-radius:14px;
      border:2px solid rgba(122,92,255,0.35);
      overflow:hidden; background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-weight:900; color:var(--violet);
      flex-shrink:0;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:none; }

    .brand{ min-width:0; }
    .brand .name{ font-size:18px; font-weight:800; line-height:1.15; }
    .brand .sub{ display:none; }

    .metaRight{
      text-align:right;
      font-size:12px;
      color:#333;
      line-height:1.35;
      white-space:nowrap;
    }
    .metaRight b{ font-weight:700; }

    .docTitle{
      margin-top:10px;
      text-align:center;
      font-weight:800;
      font-size:14px;
      letter-spacing:.2px;
    }
    .docMeta{ display:none; }

    .grid2{
      margin-top:12px;
      display:grid;
      grid-template-columns: 1fr;
      gap:10px;
    }
    @media(min-width:820px){
      .grid2{ grid-template-columns: 1fr 1fr; }
    }

    .box{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:rgba(248,244,255,.45);
    }
    .box h3{
      margin:0 0 6px;
      font-size:12px;
      font-weight:800;
      color:#333;
    }
    .line{
      font-size:12.5px;
      font-weight:500;
      color:#111;
      line-height:1.35;
      word-break:break-word;
    }
    .mut{ color:var(--muted); font-weight:500; }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:12px;
      overflow:hidden;
      border-radius:12px;
      table-layout:fixed;
    }
    thead th{
      text-align:left;
      font-size:11.5px;
      color:#444;
      font-weight:700;
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.07);
      background:rgba(248,244,255,.6);
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    tbody td{
      padding:9px 10px;
      border-bottom:1px solid rgba(0,0,0,0.06);
      font-size:12.5px;
      font-weight:500;
      vertical-align:top;
      overflow-wrap:anywhere;
      word-break:break-word;
    }
    tbody tr:last-child td{ border-bottom:none; }
    .right{ text-align:right; white-space:normal; }

    .summary{
      margin-top:12px;
      display:flex;
      flex-direction:column;
      gap:8px;
    }

    .totalBox{
      border:1px solid rgba(0,0,0,0.06);
      border-radius:14px;
      padding:10px 12px;
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.06);
    }
    .totalRow{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:center;
    }
    .totalRow .lbl{
      font-size:15px;
      font-weight:700;
      color:#111;
    }
    .totalRow .amt{
      font-size:16px;
      font-weight:700;
      color:#111;
    }
    .totalRow.ttc .lbl{
      font-size:16px;
      font-weight:800;
    }
    .totalRow.ttc .amt{
      font-size:20px;
      font-weight:800;
    }
    .totalSub{
      margin-top:6px;
      font-size:11.5px;
      color:var(--muted);
      font-weight:500;
      line-height:1.4;
    }
