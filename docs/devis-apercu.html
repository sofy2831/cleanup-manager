<!-- docs/devis-apercu.html (FINAL — impression/PDF d’un salesDocuments type:"QUOTE") -->
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CleanUp Manager — Aperçu devis</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --violet:#7A5CFF;
      --text:#111;
      --muted:#666;
      --border:#e7e1ff;
    }
    *{ box-sizing:border-box; font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif; }
    body{ margin:0; color:var(--text); background:#f7f4ff; }
    .toolbar{
      position:sticky; top:0; z-index:10;
      background:rgba(247,244,255,.92); backdrop-filter: blur(8px);
      border-bottom:1px solid rgba(122,92,255,0.18);
      padding:10px 12px;
      display:flex; gap:10px; justify-content:space-between; align-items:center;
    }
    .btn{
      border:none; cursor:pointer; text-decoration:none;
      padding:10px 12px; border-radius:999px;
      font-weight:900; font-size:13px;
      background:#fff; color:var(--violet);
      border:2px solid var(--violet);
    }
    .btn.primary{
      background:linear-gradient(90deg,#7A5CFF,#6238FF);
      color:#fff; border-color:transparent;
    }
    .btn:disabled{ opacity:.6; cursor:not-allowed; }

    .page{
      width: 210mm;
      min-height: 297mm;
      margin: 16px auto;
      background:#fff;
      border:1px solid var(--border);
      border-radius:14px;
      padding: 14mm 14mm 16mm;
    }
    .header{
      display:flex; justify-content:space-between; gap:16px; align-items:flex-start;
      margin-bottom:10mm;
    }
    .brand{
      display:flex; gap:12px; align-items:flex-start;
    }
    .logo{
      width:54px; height:54px; border-radius:14px;
      border:2px solid rgba(122,92,255,0.28);
      overflow:hidden; display:flex; align-items:center; justify-content:center;
      color:var(--violet); font-weight:1000;
      flex-shrink:0;
    }
    .logo img{ width:100%; height:100%; object-fit:cover; display:none; }
    .h-title{ font-size:18px; font-weight:1000; margin:0; }
    .h-lines{ margin-top:6px; font-size:12.5px; font-weight:800; color:#222; line-height:1.35; }
    .mut{ color:var(--muted); font-weight:900; }

    .docbox{
      text-align:right;
      min-width:240px;
    }
    .docbox .big{ font-size:18px; font-weight:1000; margin:0; }
    .docbox .meta{ margin-top:6px; font-size:12.5px; font-weight:900; color:#222; line-height:1.35; }

    .twoCols{
      display:grid; grid-template-columns:1fr 1fr; gap:14px;
      margin-top:10mm;
    }
    .box{
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px 12px;
      background:#fff;
    }
    .box .t{ font-size:12px; font-weight:1000; color:#555; }
    .box .v{ margin-top:4px; font-size:13.5px; font-weight:1000; color:#111; }
    .box .lines{ margin-top:8px; font-size:12.5px; font-weight:850; color:#222; line-height:1.35; }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:10mm;
      font-size:12.5px;
    }
    th, td{
      border-bottom:1px solid #eee;
      padding:10px 8px;
      vertical-align:top;
      text-align:left;
    }
    th{ background:#faf7ff; font-weight:1000; color:#444; font-size:12px; }
    td.num, th.num{ text-align:right; white-space:nowrap; }

    .totals{
      margin-top:8mm;
      display:flex; justify-content:flex-end;
    }
    .totalsBox{
      width: 320px;
      border:1px solid var(--border);
      border-radius:14px;
      padding:10px 12px;
    }
    .r{ display:flex; justify-content:space-between; gap:10px; font-weight:1000; font-size:13px; padding:4px 0; }
    .fine{ margin-top:8px; font-size:11.5px; color:var(--muted); font-weight:900; line-height:1.35; }

    .terms{
      margin-top:10mm;
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px 12px;
      font-size:12.5px;
      font-weight:850;
      color:#222;
      line-height:1.45;
    }
    .terms .t{ font-weight:1000; color:#555; font-size:12px; }

    .signRow{
      display:grid; grid-template-columns:1fr 1fr; gap:14px;
      margin-top:10mm;
    }
    .sign{
      border:1px solid var(--border);
      border-radius:14px;
      padding:12px 12px 28mm;
      min-height:52mm;
    }
    .sign .t{ font-size:12px; font-weight:1000; color:#555; }
    .sign .v{ margin-top:6px; font-size:12.5px; font-weight:900; color:#222; }

    .alert{
      width:210mm; margin:12px auto 0;
      background:#fff; border:1px solid var(--border);
      border-left:5px solid #b3261e;
      border-radius:14px; padding:10px 12px;
      font-size:12px; font-weight:900; color:#333;
      display:none; white-space:pre-wrap;
    }

    @media print{
      body{ background:#fff; }
      .toolbar, .alert{ display:none !important; }
      .page{
        margin:0; border:none; border-radius:0;
        width:auto; min-height:auto;
        padding: 12mm 12mm 14mm;
      }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a class="btn" id="backBtn" href="devis-liste.html">← Retour</a>
    <button class="btn primary" id="printBtn" type="button" disabled>Imprimer / PDF</button>
  </div>

  <div class="alert" id="alertBox"></div>

  <div class="page" id="page">
    <div class="header">
      <div class="brand">
        <div class="logo" id="logoBox">
          <img id="logoImg" alt="Logo">
          <span id="logoFallback">✓</span>
        </div>
        <div>
          <p class="h-title" id="companyName">—</p>
          <div class="h-lines" id="companyLines">—</div>
        </div>
      </div>

      <div class="docbox">
        <p class="big">DEVIS</p>
        <div class="meta" id="docMeta">—</div>
      </div>
    </div>

    <div class="twoCols">
      <div class="box">
        <div class="t">Client</div>
        <div class="v" id="clientName">—</div>
        <div class="lines" id="clientLines">—</div>
      </div>

      <div class="box">
        <div class="t">Prestation</div>
        <div class="v" id="homeName">—</div>
        <div class="lines" id="homeLines">—</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>Désignation</th>
          <th class="num">Qté</th>
          <th>Unité</th>
          <th class="num">PU HT</th>
          <th class="num" id="thTVA" style="display:none;">TVA</th>
          <th class="num">Total TTC</th>
        </tr>
      </thead>
      <tbody id="linesTbody"></tbody>
    </table>

    <div class="totals">
      <div class="totalsBox" id="totalsBox"></div>
    </div>

    <div class="terms" id="termsBox" style="display:none;">
      <div class="t">Modalités de paiement</div>
      <div id="termsText" style="margin-top:6px;"></div>
    </div>

    <div class="signRow">
      <div class="sign">
        <div class="t">Signature société</div>
        <div class="v" id="signCompany">—</div>
      </div>
      <div class="sign">
        <div class="t">Signature client</div>
        <div class="v">Bon pour accord</div>
      </div>
    </div>
  </div>

<script type="module">
  import { auth, db } from "./firebase-init.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
  import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

  const alertBox = document.getElementById("alertBox");
  const printBtn = document.getElementById("printBtn");

  const logoImg = document.getElementById("logoImg");
  const logoFallback = document.getElementById("logoFallback");

  const companyNameEl = document.getElementById("companyName");
  const companyLinesEl = document.getElementById("companyLines");
  const docMetaEl = document.getElementById("docMeta");

  const clientNameEl = document.getElementById("clientName");
  const clientLinesEl = document.getElementById("clientLines");

  const homeNameEl = document.getElementById("homeName");
  const homeLinesEl = document.getElementById("homeLines");

  const thTVA = document.getElementById("thTVA");
  const linesTbody = document.getElementById("linesTbody");
  const totalsBox = document.getElementById("totalsBox");

  const termsBox = document.getElementById("termsBox");
  const termsText = document.getElementById("termsText");
  const signCompany = document.getElementById("signCompany");

  const params = new URLSearchParams(location.search);
  const docId = (params.get("docId") || "").trim();

  function showAlert(msg){
    alertBox.style.display = "block";
    alertBox.textContent = msg;
  }
  function esc(s){
    return String(s||"")
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }
  function fmtMoney(v){
    const n = Number(v);
    if(!Number.isFinite(n)) return "—";
    return n.toLocaleString("fr-FR",{minimumFractionDigits:2, maximumFractionDigits:2})+" €";
  }
  function fmtDateFR(x){
    if(!x) return "";
    try{
      if(x?.toDate?.()) return x.toDate().toLocaleDateString("fr-FR");
      const s = String(x).trim();
      if(!s) return "";
      if(/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
      const m = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
      if(m) return `${m[3]}/${m[2]}/${m[1]}`;
      const d = new Date(s);
      if(!isNaN(d.getTime())) return d.toLocaleDateString("fr-FR");
      return "";
    }catch{ return ""; }
  }

  function computeTotals(lines, tvaEnabled, tvaRate){
    let ht = 0;
    for(const l of (Array.isArray(lines)?lines:[])){
      const qty = Number(l?.qty)||0;
      const up = Number(l?.unitPrice)||0;
      ht += qty * up;
    }
    const tva = tvaEnabled ? (ht * (Number(tvaRate)||0)) : 0;
    const ttc = ht + tva;
    return { ht, tva, ttc };
  }

  function render(d){
    if(!d) return;

    if(String(d.type||"").toUpperCase().trim() !== "QUOTE"){
      showAlert("⛔ Ce document n’est pas un devis.");
      return;
    }

    const company = d.companySnapshot || {};
    const client = d.clientSnapshot || {};
    const home = d.homeSnapshot || {};

    const cName = String(company.companyName || "Conciergerie").trim();
    companyNameEl.textContent = cName || "Conciergerie";

    const companyLines = [];
    if(company.street) companyLines.push(esc(company.street));
    if(company.zip || company.city) companyLines.push(esc([company.zip, company.city].filter(Boolean).join(" ")));
    const legal = [company.siret ? `SIRET ${company.siret}` : "", company.ape ? `APE ${company.ape}` : ""].filter(Boolean).join(" • ");
    if(legal) companyLines.push(`<span class="mut">${esc(legal)}</span>`);
    const contact = [company.email || "", company.phone || ""].filter(Boolean).join(" • ");
    if(contact) companyLines.push(`<span class="mut">${esc(contact)}</span>`);
    companyLinesEl.innerHTML = companyLines.length ? companyLines.join("<br>") : "—";

    const logoUrl = String(company.logoUrl || "").trim();
    if(logoUrl){
      logoImg.src = logoUrl; logoImg.style.display = "block"; logoFallback.style.display = "none";
    }else{
      logoImg.style.display = "none"; logoFallback.style.display = "block";
    }

    const qNo = String(d.quoteNumber || "—").trim();
    const qDate = fmtDateFR(d.quoteDate) || "";
    const valid = fmtDateFR(d.validUntil) || "";
    docMetaEl.innerHTML = `
      <div><b>N°</b> ${esc(qNo)}</div>
      <div><b>Date</b> ${esc(qDate || "—")}</div>
      <div><b>Validité</b> ${esc(valid || "—")}</div>
    `;

    const clName = String(client.name || d.clientName || "—").trim();
    clientNameEl.textContent = clName || "—";
    const clLines = [];
    if(client.address1) clLines.push(esc(client.address1));
    if(client.address2) clLines.push(esc(client.address2));
    if(client.zip || client.city) clLines.push(esc([client.zip, client.city].filter(Boolean).join(" ")));
    if(client.email) clLines.push(`<span class="mut">${esc(client.email)}</span>`);
    clientLinesEl.innerHTML = clLines.length ? clLines.join("<br>") : `<span class="mut">Adresse manquante</span>`;

    const hName = String(home.homeName || d.homeName || "—").trim();
    homeNameEl.textContent = hName || "—";
    const hLines = [];
    if(home.homeAddress) hLines.push(esc(home.homeAddress));
    if(home.homeZip || home.homeCity) hLines.push(esc([home.homeZip, home.homeCity].filter(Boolean).join(" ")));
    const per = (home.arrivalDateKey || home.departureDateKey)
      ? `${fmtDateFR(home.arrivalDateKey)} → ${fmtDateFR(home.departureDateKey)}`
      : "";
    if(per) hLines.push(`<span class="mut">${esc(per)}</span>`);
    homeLinesEl.innerHTML = hLines.length ? hLines.join("<br>") : "—";

    const tvaEnabled = !!company.vatEnabled;
    const tvaRate = Number.isFinite(Number(company.vatRate)) ? Number(company.vatRate) : 0;
    thTVA.style.display = tvaEnabled ? "" : "none";

    const lines = Array.isArray(d.lines) ? d.lines : [];
    linesTbody.innerHTML = "";
    for(const l of lines){
      const label = l?.label || "Ligne";
      const qty = Number(l?.qty)||0;
      const unit = l?.unit || "unité";
      const up = Number(l?.unitPrice)||0;

      const lineHT = qty * up;
      const lineTVA = tvaEnabled ? (lineHT * tvaRate) : 0;
      const lineTotal = lineHT + lineTVA;

      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${esc(label)}</td>
        <td class="num">${esc(qty)}</td>
        <td>${esc(unit)}</td>
        <td class="num">${esc(fmtMoney(up))}</td>
        <td class="num" style="${tvaEnabled ? "" : "display:none;"}">${tvaEnabled ? esc(fmtMoney(lineTVA)) : ""}</td>
        <td class="num">${esc(fmtMoney(lineTotal))}</td>
      `;
      linesTbody.appendChild(tr);
    }

    const totals = computeTotals(lines, tvaEnabled, tvaRate);
    const html = [];
    if(tvaEnabled){
      html.push(`<div class="r"><span>Total HT</span><span>${esc(fmtMoney(totals.ht))}</span></div>`);
      html.push(`<div class="r"><span>TVA (${Math.round(tvaRate*100)}%)</span><span>${esc(fmtMoney(totals.tva))}</span></div>`);
      html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
    }else{
      html.push(`<div class="r"><span>Total TTC</span><span>${esc(fmtMoney(totals.ttc))}</span></div>`);
      const ex = String(company.tvaExemptionText || "").trim();
      if(ex) html.push(`<div class="fine">${esc(ex)}</div>`);
    }
    totalsBox.innerHTML = html.join("");

    const terms = String(d.paymentTerms || "").trim();
    if(terms){
      termsBox.style.display = "";
      termsText.textContent = terms;
    }else{
      termsBox.style.display = "none";
      termsText.textContent = "";
    }

    signCompany.textContent = cName || "Conciergerie";

    printBtn.disabled = false;
  }

  printBtn.addEventListener("click", ()=>window.print());

  onAuthStateChanged(auth, async (user)=>{
    if(!user){ location.href = "login.html?role=conciergerie"; return; }
    if(!docId){ showAlert("⛔ docId manquant. Exemple : devis-apercu.html?docId=XXXX"); return; }

    try{
      const ref = doc(db,"salesDocuments", docId);
      const snap = await getDoc(ref);
      if(!snap.exists()) throw new Error("Devis introuvable.");

      const d = snap.data() || {};
      if(String(d.conciergerieUid||"") !== String(user.uid)) throw new Error("Accès refusé (autre conciergerie).");

      render(d);
    }catch(e){
      console.error(e);
      showAlert("⛔ " + (e?.message || "Erreur chargement devis"));
    }
  });
</script>
</body>
</html>
