name: Deploy Firebase DEV

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Firebase CLI
        run: npm i -g firebase-tools

      - name: Sanity check hosting folder
        run: |
          test -d docs || (echo "Missing docs/ folder at repo root" && exit 1)
          echo "docs/ found"

      - name: Auth (Service Account)
        env:
          FIREBASE_SA_DEV: ${{ secrets.FIREBASE_SA_DEV }}
        run: |
          echo "$FIREBASE_SA_DEV" > service-account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$GITHUB_WORKSPACE/service-account.json" >> $GITHUB_ENV

      - name: Deploy Hosting to Firebase DEV
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/service-account.json
        run: |
          firebase --version
          firebase deploy --only hosting --project cleanup-manager-dev --non-interactive

      - name: Cleanup
        if: always()
        run: rm -f service-account.json
